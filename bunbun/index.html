    // =====================================================================
    // 12. まちづくり
    // =====================================================================
    function TownScreen({ progress, onBuild, onLevel, onMove }) {
      const talk = useTalk();
      const [sel, setSel] = useState(null); // えらんだ マス
      const [moving, setMoving] = useState(null);
      const open = openCells(progress);
      useEffect(() => { talk.say('まちを つくろう！「＋」の マスを おすと、たてものを たてられるよ。たてた ものを おすと、レベルアップ できるよ。'); }, []);
      const cell = sel != null ? progress.town[sel] : null;
      const tap = (i) => {
        Sound.tap();
        if (!open.has(i)) { talk.say('エリアの ボスに かつと、とちが ひろがるよ。'); return; }
        if (moving != null) {
          if (!progress.town[i]) { onMove(moving, i); setMoving(null); setSel(i); talk.say('たてものを うごかしたよ。', { mood: 'happy' }); return; }
          setMoving(null);
        }
        setSel(i);
      };
      const build = (b) => {
        const cost = costOf(b, 1);
        if (!canPay(progress, cost)) { talk.say('ざいりょうが たりないよ。ぼうけんで あつめよう。'); return; }
        Sound.build(); onBuild(sel, b);
        talk.say(`${b.n}が できた！`, { mood: 'happy' });
      };
      const levelUp = () => {
        const b = BLD[cell.b]; if (cell.lv >= 3) return;
        const cost = costOf(b, cell.lv + 1);
        if (!canPay(progress, cost)) { talk.say('ざいりょうが たりないよ。ぼうけんで あつめよう。'); return; }
        Sound.levelup(); onLevel(sel);
        talk.say(`${b.n}が レベル${cell.lv + 1}に なった！`, { mood: 'happy' });
      };
      const people = progress.people.map(id => PERSON[id]).filter(Boolean);
      return (
        <div className="w-full max-w-[1400px] p-3 flex flex-col items-center gap-3">
          <MsgWin size={80} compact />
          <div className="flex gap-3 w-full items-start justify-center">
            <Bg file="town_board.webp" className="rounded-3xl border-4 border-amber-900 grass shrink-0" style={{ aspectRatio: `${GRID_W} / ${GRID_H}`, height: 'min(calc(100vh - 180px), calc((100vw - 400px) * 5 / 7))', minHeight: 300 }} fallback={<div className="absolute inset-0 grass" />}>
              <div className="absolute inset-0 grid gap-1.5" style={{ padding: "7% 8% 8%", gridTemplateColumns: `repeat(${GRID_W}, 1fr)`, gridTemplateRows: `repeat(${GRID_H}, 1fr)` }}>
                {Array.from({ length: GRID_W * GRID_H }, (_, i) => {
                  const c = progress.town[i], b = c && BLD[c.b], op = open.has(i);
                  return (
                    <button key={i} onClick={() => tap(i)}
                      className={`relative rounded-2xl flex items-center justify-center border-4 ${sel === i ? 'border-yellow-400' : op ? 'border-white/70' : 'border-transparent'} ${op ? (b ? 'bg-white/60' : 'bg-white/35') : 'bg-stone-700/25'} ${moving != null && op && !c ? 'glow' : ''}`}>
                      {b ? <>
                        <Pic file={`bld_${b.id}.webp`} size="80%" fallback={<span style={{ fontSize: `${2.6 + (c.lv - 1) * 0.5}rem`, lineHeight: 1 }}>{b.e}</span>} />
                        <span className="absolute top-0.5 left-1 text-xs font-bold bg-emerald-600 text-white rounded-full px-1.5">Lv{c.lv}</span>
                        {c.lv >= 3 && <span className="absolute bottom-0 right-1 text-lg">🌟</span>}
                      </> : op ? <span className="text-4xl text-white font-bold drop-shadow">＋</span> : <span className="text-2xl opacity-70">🔒</span>}
                    </button>
                  );
                })}
              </div>
              {people.map((p, j) => (
                <div key={p.id} className="absolute walk pointer-events-none text-4xl" style={{ left: `${10 + (j * 23) % 75}%`, top: `${15 + (j * 31) % 65}%`, '--wx': `${(j % 2 ? -1 : 1) * 60}px`, '--wy': `${(j % 3 ? 1 : -1) * 40}px`, '--d': `${7 + j}s` }}>{p.e}</div>
              ))}
            </Bg>
            <div className="flex-1 min-w-[300px] win-light p-3 flex flex-col gap-2 overflow-auto" style={{ maxHeight: 'max(calc(100vh - 180px), 300px)' }}>
              <div className="flex flex-wrap gap-x-3 gap-y-1 justify-center bg-amber-50 rounded-2xl border-2 border-amber-300 px-3 py-1 text-xl font-bold">
                {D.MATS.filter(m => !m.sp || (progress.mats[m.id] || 0) > 0).map(m => <span key={m.id}>{m.e}{progress.mats[m.id] || 0}</span>)}
                <span className="flex items-center gap-1"><Coin s={24} />{progress.coin}</span>
              </div>
              {sel == null && <div className="text-xl font-bold leading-relaxed">マスを えらんでね。<br />「＋」の マスに たてものを たてられるよ。</div>}
              {sel != null && !cell && (
                <>
                  <div className="text-xl font-bold">🔨 たてる ものを えらぶ</div>
                  {D.BUILDINGS.map(b => {
                    const op = bldOpen(progress, b), cost = costOf(b, 1), can = op && canPay(progress, cost);
                    return (
                      <button key={b.id} onClick={() => (op ? build(b) : talk.say(`${AREA[b.a].name}の ボスに かつと、たてられるように なるよ。`))}
                        className={`btn3d rounded-2xl border-2 p-2 flex items-center gap-2 text-left ${can ? 'bg-emerald-50 border-emerald-500' : 'bg-white border-stone-300'} ${op ? '' : 'opacity-50'}`}>
                        <span className="text-4xl w-12 text-center">{op ? b.e : '🔒'}</span>
                        <span className="flex-1"><span className="text-xl font-bold block">{b.n}</span>{op ? <Cost cost={cost} p={progress} /> : <span className="text-sm">{AREA[b.a].name}の ボスに かつと たてられる</span>}</span>
                      </button>
                    );
                  })}
                </>
              )}
              {cell && (() => {
                const b = BLD[cell.b];
                return (
                  <div className="flex flex-col gap-3 items-center">
                    <div className="text-7xl">{b.e}</div>
                    <div className="text-3xl font-bold">{b.n}　Lv{cell.lv}</div>
                    {cell.lv < 3 ? <>
                      <div className="text-lg font-bold">レベル{cell.lv + 1}に するには：</div>
                      <Cost cost={costOf(b, cell.lv + 1)} p={progress} size="text-2xl" />
                      <Btn onClick={levelUp} color="#15803d" light="#dcfce7" disabled={!canPay(progress, costOf(b, cell.lv + 1))}>⬆️ レベルアップ</Btn>
                    </> : <div className="text-2xl font-bold text-amber-600">🌟 さいこうの レベル！</div>}
                    <Btn onClick={() => { setMoving(sel); talk.say('うごかしたい ばしょの「＋」を おしてね。'); }} color="#0369a1" light="#e0f2fe">↔️ うごかす</Btn>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 13. そうび・おみせ・ずかん
    // =====================================================================
    function EquipScreen({ progress, first, onSave }) {
      const talk = useTalk();
      const [lk, setLk] = useState({ ...defaultLook(), ...(progress.look || {}) });
      useEffect(() => { talk.say(first ? 'まずは、きみの すがたを きめよう。かたちと いろを えらんでね。' : 'そうびを かえよう。おみせで かった ものを みに つけられるよ。'); }, []);
      const set = (k, v) => { Sound.tap(); const n = { ...lk, [k]: v }; setLk(n); if (!first) onSave(n); };
      const owned = (cat) => ALL_ITEMS.filter(it => it.cat === cat && progress.items.includes(it.id));
      const box = (on) => `rounded-2xl border-4 px-2 py-1 flex flex-col items-center ${on ? 'border-amber-600 bg-amber-50' : 'border-stone-200 bg-white'}`;
      const slot = (cat, label) => {
        const list = owned(cat);
        return (
          <div className="win-light p-3">
            <div className="text-xl font-bold mb-2">{label}</div>
            {!list.length ? <div className="text-lg text-stone-500">おみせで かうと そうび できるよ</div> : (
              <div className="flex flex-wrap gap-2">
                <button onClick={() => set(cat, null)} className={`${box(!lk[cat])} text-lg font-bold`}>なし</button>
                {list.map(it => <button key={it.id} onClick={() => set(cat, it.id)} className={box(lk[cat] === it.id)}><span className="text-4xl leading-none">{it.e}</span><span className="text-sm font-bold">{it.n}</span></button>)}
              </div>
            )}
          </div>
        );
      };
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">
          <MsgWin size={80} compact />
          <div className="flex flex-wrap gap-4 w-full items-start justify-center">
            <div className="win-light p-4 flex flex-col items-center sticky top-20"><Hero look={lk} size={210} /><div className="text-base font-bold mt-1">🎖️ {titleOf(progress)}</div></div>
            <div className="flex flex-col gap-3 flex-1 min-w-[320px]">
              <div className="win-light p-3">
                <div className="text-xl font-bold mb-2">かたち</div>
                <div className="flex gap-3">{[1, 2].map(f => <button key={f} onClick={() => set('form', f)} className={box(lk.form === f)}><Hero look={{ ...lk, form: f }} size={80} bare /><span className="text-lg font-bold">かたち{f === 1 ? '１' : '２'}</span></button>)}</div>
              </div>
              <div className="win-light p-3">
                <div className="text-xl font-bold mb-2">ふくの いろ</div>
                <div className="flex flex-wrap gap-2">{ownedColors(progress).map(c => <button key={c.id} onClick={() => set('color', c.id)} className={box(lk.color === c.id)}><span className="inline-block w-12 h-12 rounded-full border-2 border-stone-700" style={{ background: c.css }} /><span className="text-base font-bold">{c.name}</span></button>)}</div>
              </div>
              {!first && slot('hat', '🎩 ぼうし')}
              {!first && slot('wand', '🪄 つえ（まほうの ひかりかたが かわるよ）')}
            </div>
          </div>
          {first && <Btn onClick={() => { Sound.fanfare(); onSave(lk); }} color="#15803d" light="#dcfce7" className="text-3xl px-10 glow">✔ これで しゅっぱつ！</Btn>}
        </div>
      );
    }

    const TIER = { 10: ['ふつう', '#e7e5e4', '#57534e'], 25: ['ごうか', '#dbeafe', '#2563eb'], 50: ['ちょうごうか', '#fae8ff', '#a21caf'], 100: ['でんせつ', '#fef3c7', '#d97706'] };
    function ShopScreen({ progress, onBuy }) {
      const talk = useTalk();
      const [cat, setCat] = useState(D.ITEM_CATS[0].id);
      useEffect(() => { talk.say('いらっしゃい！ コインで ぼうしや つえ、ふくが かえるよ。'); }, []);
      const c = D.ITEM_CATS.find(x => x.id === cat);
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">
          <MsgWin size={80} compact />
          <div className="flex gap-2 flex-wrap justify-center">
            {D.ITEM_CATS.map(x => <button key={x.id} onClick={() => { Sound.tap(); setCat(x.id); }} className={`btn3d rounded-2xl border-2 px-4 py-2 text-xl font-bold ${cat === x.id ? 'bg-amber-100 border-amber-500' : 'bg-white border-stone-300'}`}>{x.icon} {x.name}</button>)}
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full">
            {c.items.map(it => {
              const have = progress.items.includes(it.id), can = progress.coin >= it.p;
              const [tn, bg, col] = TIER[it.p];
              return (
                <div key={it.id} className="bg-white rounded-3xl border-4 p-2 flex flex-col items-center gap-1" style={{ borderColor: col }}>
                  <div className="text-xs font-bold rounded-full px-2" style={{ background: bg, color: col }}>{tn}</div>
                  <div className="h-16 flex items-center justify-center my-1">{it.color ? <span className={`inline-block w-14 h-14 rounded-full border-2 border-stone-700 ${it.color.niji ? 'niji' : ''}`} style={{ background: it.color.css }} /> : <span className="text-5xl">{it.e}</span>}</div>
                  <div className="text-lg font-bold text-center leading-tight">{it.n}</div>
                  {have ? <div className="text-lg font-bold text-emerald-700">✔ かった</div>
                    : <button onClick={() => { if (!can) { talk.say(`あと ${it.p - progress.coin}コイン あつめよう。`); return; } Sound.coin(); onBuy(it); talk.say(`${it.n}を かったよ。「そうび」で みに つけられるよ。`, { mood: 'happy' }); }}
                      className={`btn3d rounded-2xl border-2 px-3 py-1 text-xl font-bold flex items-center gap-1 ${can ? 'bg-amber-50 border-amber-400' : 'bg-stone-100 border-stone-300 opacity-60'}`}><Coin s={22} /> {it.p}</button>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function ZukanScreen({ progress }) {
      const talk = useTalk();
      const [tab, setTab] = useState('people');
      useEffect(() => { talk.say(`まちの ひとは ${progress.people.length}にん、やっつけた バラバランは ${progress.beaten.length}ひき だよ。`); }, []);
      const built = new Set(Object.values(progress.town).map(c => c.b));
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">
          <MsgWin size={80} compact />
          <div className="flex gap-2 flex-wrap justify-center">
            {[['people', '🏘️ まちの ひと'], ['mon', '👾 バラバラン'], ['bld', '🏠 たてもの'], ['title', '🎖️ しょうごう']].map(([id, t]) => <button key={id} onClick={() => { Sound.tap(); setTab(id); }} className={`btn3d rounded-2xl border-2 px-4 py-2 text-xl font-bold ${tab === id ? 'bg-amber-900 text-white border-amber-900' : 'bg-white border-stone-300'}`}>{t}</button>)}
          </div>
          {tab === 'people' && <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 w-full">{D.PEOPLE.map(p => {
            const got = progress.people.includes(p.id);
            return <button key={p.id} onClick={() => got && talk.say(`${p.name}。「${p.thanks}」`)} className={`rounded-3xl border-4 p-3 flex items-center gap-3 text-left ${got ? 'bg-white border-amber-300' : 'bg-stone-100 border-stone-300'}`}>
              <span className="text-5xl">{got ? p.e : '❔'}</span><span className="text-lg font-bold">{got ? p.name : '？？？'}<br /><span className="text-sm text-stone-500">{AREA[p.a].icon} {AREA[p.a].name}</span></span></button>;
          })}</div>}
          {tab === 'mon' && <div className="grid grid-cols-3 sm:grid-cols-6 gap-3 w-full">{D.MONSTERS.filter(m => !AREA[m.a].hatten || progress.hatten || progress.unlockAll).map(m => {
            const got = progress.beaten.includes(m.id);
            return <div key={m.id} className={`rounded-3xl border-4 p-2 flex flex-col items-center ${got ? 'bg-white border-emerald-400' : 'bg-stone-100 border-stone-300'}`}>
              <button onClick={() => got && talk.say(`${m.name}だよ。「${m.hello}」`)}><Monster m={m} size={80} got={got} /></button>
              <div className="text-sm font-bold text-center">{got ? m.name : '？？？'}{m.boss ? ' 👑' : ''}</div></div>;
          })}</div>}
          {tab === 'bld' && <div className="grid grid-cols-3 sm:grid-cols-5 gap-3 w-full">{D.BUILDINGS.map(b => {
            const got = built.has(b.id);
            return <div key={b.id} className={`rounded-3xl border-4 p-2 flex flex-col items-center ${got ? 'bg-white border-amber-300' : 'bg-stone-100 border-stone-300'}`}><span className="text-5xl">{got ? b.e : '❔'}</span><span className="text-base font-bold">{got ? b.n : '？？？'}</span></div>;
          })}</div>}
          {tab === 'title' && <div className="flex flex-col gap-2 items-center">
            <div className="win px-4 py-2 text-2xl font-bold">レベル {levelOf(progress)}（つくった ぶん {progress.exp}）</div>
            {D.TITLES.map(t => { const on = titlesOf(progress).includes(t.n); return <span key={t.n} className={`rounded-full px-4 py-2 border-2 text-xl font-bold ${on ? 'bg-amber-100 border-amber-400' : 'bg-white border-stone-200 text-stone-400'}`}>{on ? '🎖️' : '🔒'} {t.n}（レベル {t.lv}）</span>; })}
          </div>}
        </div>
      );
    }

    // =====================================================================
    // 14. 先生用画面
    // =====================================================================
    function PinPad({ onSubmit, onClose, error }) {
      const [v, setV] = useState('');
      const press = (d) => { const n = (v + d).slice(0, 4); setV(n); if (n.length === 4) { onSubmit(n); setTimeout(() => setV(''), 300); } };
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
          <div className="bg-white rounded-3xl p-6 w-80 flex flex-col items-center gap-3">
            <div className="text-2xl font-bold">🔒 せんせい用</div>
            <div className="text-base">暗証番号（4けた）を入れてください</div>
            <div className="flex gap-2">{[0, 1, 2, 3].map(i => <div key={i} className="w-10 h-12 border-2 rounded-lg flex items-center justify-center text-2xl">{v[i] ? '●' : ''}</div>)}</div>
            {error > 0 && <div className="text-rose-600 font-bold">番号がちがいます</div>}
            <div className="grid grid-cols-3 gap-2">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((d, i) => d === '' ? <div key={i} /> :
                <button key={i} onClick={() => d === '⌫' ? setV(v.slice(0, -1)) : press(d)} className="btn3d w-16 h-14 rounded-xl bg-stone-100 border-2 border-stone-300 text-2xl font-bold">{d}</button>)}
            </div>
            <button onClick={onClose} className="text-lg underline mt-1">とじる</button>
          </div>
        </div>
      );
    }

    const pct = (a, b) => b ? `${Math.round((a / b) * 100)}%` : '－';
    const topOf = (m, n = 5) => Object.entries(m || {}).sort((a, b) => b[1] - a[1]).slice(0, n);
    const rateColor = (a, b) => !b ? '#fff' : a / b < 0.6 ? '#fecaca' : a / b < 0.8 ? '#fef08a' : '#bbf7d0';
    const TYPE_NOTE = {
      'じょしの いち': '「は・が・を・に」などの ちいさい ことばを、ちがう ところに おいた',
      'おわりの ことば': '「どうした・なんだ」の ことばを、ぶんの おわり いがいに おいた（または、おわりに ほかの ことばを おいた）',
      'くわしく する ことば': '「きいろい」「たくさん」などを、かかる ことばから はなして おいた',
      'ことばの じゅんばん': '「だれが」「なにを」などの ことばの じゅんばんが ちがった（にんじん が うま を たべる など）',
      'ならびかた（いみは あう）': 'いみは あって いるが、ふだん あまり つかわない ならびかた（せっていが「ふつう」の とき）',
    };
    const PARTICLES = ['が', 'は', 'を', 'に', 'で', 'へ', 'と', 'の', 'から'];
    // じょしごとの ひょう：その じょしが でた ぶんの かず と、まちがえた かず
    function JoshiTable({ bun, joshi, pairs }) {
      const seen = {};
      Object.entries(bun || {}).forEach(([id, g]) => { const b = BUNS[id]; if (!b) return; uniq(prep(id).cards.filter(c => c.g === 'j' || c.g === 'l').map(c => c.t)).forEach(t => { seen[t] = (seen[t] || 0) + g[0]; }); });
      return (
        <table className="text-center text-sm border-collapse w-full">
          <thead><tr><th className="p-1">じょし</th><th>でた ぶん</th><th>まちがえた</th><th className="text-left">おいて しまった じょし</th></tr></thead>
          <tbody>{PARTICLES.map(t => {
            const n = seen[t] || 0, m = (joshi || {})[t] || 0;
            const ps = topOf(Object.fromEntries(Object.entries(pairs || {}).filter(([k]) => k.split('→')[0] === t)), 3).map(([k, v]) => `${k.split('→')[1] || '？'}（${v}）`).join(' ');
            return <tr key={t} className="border-t"><td className="p-1 font-bold text-lg">{t}</td><td>{n}</td><td style={{ background: n ? rateColor(n - Math.min(n, m), n) : '#fff' }}>{m}</td><td className="text-left">{ps || '－'}</td></tr>;
          })}</tbody>
        </table>
      );
    }
    function BunTable({ bun, aid }) {
      return (
        <table className="text-sm border-collapse w-full">
          <thead><tr><th className="p-1 text-left">ぶん</th><th>まちがえずに／問題</th><th>✖</th><th>💡</th></tr></thead>
          <tbody>{areaBuns(aid).map(b => {
            const g = (bun || {})[b.id];
            return <tr key={b.id} className="border-t"><td className="p-1">{b.e} {prep(b.id).text}</td>
              <td className="text-center font-bold" style={{ background: g ? rateColor(g[1], g[0]) : '#fff' }}>{g ? `${g[1]}/${g[0]}` : '・'}</td>
              <td className="text-center">{g && g[2] ? g[2] : ''}</td><td className="text-center">{g && g[3] ? g[3] : ''}</td></tr>;
          })}</tbody>
        </table>
      );
    }
    function AreaTabs({ aid, setAid }) {
      return <div className="flex gap-1 flex-wrap mb-2">{D.AREAS.map(a => <button key={a.id} onClick={() => setAid(a.id)} className={`rounded-lg border px-2 py-0.5 text-sm font-bold ${aid === a.id ? 'bg-amber-200 border-amber-600' : 'bg-white'}`}>{a.icon} {a.name}</button>)}</div>;
    }

    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [aid, setAid] = useState(1);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(api.pending());
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };
      const act = async (fn, okText) => {
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); onChanged(); } }
        catch (e) { flash('うまく いきませんでした：' + e.message); }
      };
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '﻿' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`ことばのぼうけん_ぶん_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`ことばのぼうけん_ぶん_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'bunbun') { flash('このアプリのバックアップではありません'); return; }
          if (!confirm('バックアップから、子どもの進み具合・コイン・ざいりょう・まちを元にもどします。よろしいですか？')) return;
          await act(() => api.restore(pin, d), 'バックアップから元にもどしました');
        };
        rd.readAsText(f);
      };
      const opt = (key, list) => list.map(([v, t]) =>
        <button key={String(v)} onClick={() => setS({ ...s, [key]: v })} className={`ml-2 mt-1 rounded-lg px-3 py-1 border-2 ${s[key] === v ? 'bg-amber-200 border-amber-600' : 'bg-white'}`}>{t}</button>);
      const flagBtn = (key, on, off, onMsg, offMsg) => <button key={key} onClick={() => act(() => api.setFlag(pin, student.name, key, !prog[key]), prog[key] ? offMsg : onMsg)} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog[key] ? on : off}</button>;
      const curText = (p) => stageName(currentStage(p));

      return (
        <div className="fixed inset-0 bg-stone-50 z-50 overflow-auto">
          <div className="max-w-6xl mx-auto p-4 text-base">
            <div className="flex items-center gap-3 mb-3">
              <div className="text-2xl font-bold flex-1">🔒 先生用画面 <span className="text-sm text-stone-500">ver {APP_VERSION}{data.demo ? '（おためしモード）' : ''}</span></div>
              <button onClick={onClose} className="btn3d bg-white border-2 border-stone-400 rounded-xl px-4 py-2 font-bold">とじる</button>
            </div>
            {data.isDefaultPin && <div className="bg-rose-100 border-2 border-rose-400 rounded-xl p-2 mb-2">暗証番号が はじめの「1234」のままです。「せってい」で変えてください。</div>}
            {msg && <div className="fixed top-3 left-1/2 -translate-x-1/2 bg-amber-900 text-white rounded-xl px-4 py-2 z-50">{msg}</div>}
            <div className="flex gap-2 mb-3">
              {[['class', 'クラス全体'], ['child', '子どもごと'], ['settings', 'せってい'], ['data', 'データ']].map(([id, t]) => (
                <button key={id} onClick={() => setTab(id)} className={`rounded-xl px-4 py-2 font-bold border-2 ${tab === id ? 'bg-amber-200 border-amber-600' : 'bg-white border-stone-300'}`}>{t}</button>
              ))}
            </div>

            {tab === 'class' && (
              <div className="flex flex-col gap-4">
                <table className="w-full bg-white rounded-xl overflow-hidden text-left">
                  <thead className="bg-amber-100"><tr><th className="p-2">なまえ</th><th>いま</th><th>エリア</th><th>コイン</th><th>問題</th><th>まちがえずに</th><th>多い まちがい</th><th>まちがえた じょし</th><th>さいご</th></tr></thead>
                  <tbody>
                    {data.students.map(st => {
                      const p = parseProgress(st.progress);
                      return (
                        <tr key={st.name} className="border-t cursor-pointer hover:bg-amber-50" onClick={() => { setSel(st.name); setTab('child'); }}>
                          <td className="p-2 font-bold">{st.name}<div className="text-xs text-stone-500">レベル {levelOf(p)}</div></td>
                          <td className="text-sm">{curText(p)}</td>
                          <td>{areasCleared(p)} / {D.AREAS.length}</td>
                          <td>{p.coin}</td>
                          <td>{st.count}</td>
                          <td>{pct(st.ok, st.count)}</td>
                          <td className="text-sm">{topOf(st.types, 2).map(([k, n]) => `${k}（${n}）`).join('、') || '－'}</td>
                          <td className="font-bold text-rose-700">{topOf(st.joshiPair, 3).map(([k, n]) => `${k}（${n}）`).join(' ') || '－'}</td>
                          <td>{st.last || '－'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div className="text-sm text-stone-500">まちがえずに：まちがえず、ヒントも使わずに できた問題の割合。まちがえた じょし：「に→を」＝「に」の ところに「を」を おいた（多い順）。</div>
                <div className="grid md:grid-cols-2 gap-3">
                  <div className="bg-white rounded-xl p-3">
                    <div className="font-bold mb-2">クラス全体の じょしの表</div>
                    <JoshiTable bun={data.classBun} joshi={data.classJoshi} pairs={data.classJoshiPair} />
                    <div className="text-xs text-stone-500 mt-1">でた ぶん：その じょしが 入った ぶんを といた 数。まちがえた：その じょしの ますに ちがう カードを おいた 回数。</div>
                    <div className="font-bold mt-3 mb-2">クラス全体の まちがいの しゅるい</div>
                    {topOf(data.classTypes, 10).map(([k, n]) => <div key={k} className="rounded-lg px-2 py-1 border bg-rose-50 mb-1"><b className="text-lg">{k}</b>　{n}回<div className="text-xs text-stone-600">{TYPE_NOTE[k] || ''}</div></div>)}
                    {!Object.keys(data.classTypes || {}).length && <span className="text-stone-500">まだ ありません</span>}
                  </div>
                  <div className="bg-white rounded-xl p-3 overflow-auto">
                    <div className="font-bold mb-2">クラス全体の ぶんの表</div>
                    <AreaTabs aid={aid} setAid={setAid} />
                    <BunTable bun={data.classBun} aid={aid} />
                    <div className="text-xs text-stone-500 mt-1">赤：60%未満　黄：60〜79%　緑：80%以上。✖：まちがえた回数　💡：ヒントを使った問題の数</div>
                  </div>
                </div>
              </div>
            )}

            {tab === 'child' && (
              <div className="flex flex-col gap-3">
                <div className="flex gap-2 flex-wrap">
                  {data.students.map(st => <button key={st.name} onClick={() => setSel(st.name)} className={`rounded-xl px-4 py-2 font-bold border-2 ${sel === st.name ? 'bg-amber-200 border-amber-600' : 'bg-white border-stone-300'}`}>{st.name}</button>)}
                </div>
                {student && prog && (
                  <div className="grid md:grid-cols-2 gap-3">
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold text-xl mb-1">{student.name}　<span className="text-base">レベル {levelOf(prog)}　🎖️ {titleOf(prog)}</span></div>
                      <div>クリアした エリア：{areasCleared(prog)} / {D.AREAS.length}　まちの ひと：{prog.people.length}　たてもの：{Object.keys(prog.town).length}</div>
                      <div>コイン：{prog.coin}（これまでに {prog.earned}）　つくった ぶん：{prog.exp}</div>
                      <div>問題：{student.count}　まちがえずに：{pct(student.ok, student.count)}　さいご：{student.last || '－'}</div>
                      <div className="text-sm text-stone-600">いま：{curText(prog)}</div>
                      <div className="mt-2 font-bold">ステージごとの結果</div>
                      <div className="max-h-72 overflow-auto">
                        <table className="w-full text-left text-sm">
                          <thead className="bg-stone-100 sticky top-0"><tr><th className="p-1">ステージ</th><th>クリア</th><th>問題</th><th>まちがえずに</th></tr></thead>
                          <tbody>
                            {STAGES.map(st => {
                              const g = student.stages[st.id] || [0, 0];
                              if (!g[0] && !prog.cleared[st.id]) return null;
                              return <tr key={st.id} className="border-t"><td className="p-1">{st.id}　{stageName(st)}</td><td>{prog.cleared[st.id] ? '⭐' : ''}</td><td>{g[0]}</td><td style={{ background: rateColor(g[1], g[0]) }}>{pct(g[1], g[0])}</td></tr>;
                            })}
                          </tbody>
                        </table>
                      </div>
                      <div className="mt-3 flex flex-wrap gap-2">
                        {flagBtn('unlockAll', '🔓 全部開く：オン', '🔒 全部開く：オフ', 'すべてのステージを開きました', 'ステージの開放をやめました')}
                        {flagBtn('hatten', '✨ はってん：開いている', '✨ はってん：閉じている', 'はってん（にじの はし・ほしの おか）を開きました', 'はってんを閉じました')}
                      </div>
                      <div className="mt-2 flex flex-wrap gap-2 items-center">
                        <span className="font-bold">コイン：</span>
                        {[-10, -5, 5, 10, 50].map(dv => <button key={dv} onClick={() => act(() => api.addCoin(pin, student.name, dv), `コインを ${dv > 0 ? '+' : ''}${dv} しました`)} className="rounded-lg px-3 py-1 border-2 bg-white font-bold">{dv > 0 ? '+' : ''}{dv}</button>)}
                      </div>
                      <div className="mt-3">
                        <button onClick={() => { if (confirm(`${student.name} さんの記録・進み具合・コイン・ざいりょう・まちを、すべて消します。元にはもどせません。よろしいですか？`)) act(() => api.clear(pin, student.name), `${student.name} さんの記録を消しました`); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 この子の記録を消す</button>
                      </div>
                    </div>
                    <div className="bg-white rounded-xl p-3 flex flex-col gap-3">
                      <div><div className="font-bold mb-1">じょしの表</div><JoshiTable bun={student.bun} joshi={student.joshi} pairs={student.joshiPair} /></div>
                      <div>
                        <div className="font-bold mb-1">まちがいの しゅるい</div>
                        {topOf(student.types, 10).map(([k, n]) => <div key={k} className="rounded-lg px-2 py-1 border bg-rose-50 mb-1"><b>{k}</b>　{n}回<div className="text-xs text-stone-600">{TYPE_NOTE[k] || ''}</div></div>)}
                        {!Object.keys(student.types || {}).length && <span className="text-stone-500">まだ ありません</span>}
                      </div>
                      <div>
                        <div className="font-bold mb-1">まちがえた ぶん（多い順）</div>
                        {topOf(student.missProb, 10).map(([k, n]) => <div key={k} className="text-sm border-b py-0.5">{k}　<b>{n}回</b></div>)}
                        {!Object.keys(student.missProb || {}).length && <span className="text-stone-500">まだ ありません</span>}
                      </div>
                      <div className="overflow-auto">
                        <div className="font-bold mb-1">ぶんの表</div>
                        <AreaTabs aid={aid} setAid={setAid} />
                        <BunTable bun={student.bun} aid={aid} />
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-3xl">
                <label className="flex items-center gap-3">よみあげの はやさ：<input type="range" min="0.5" max="1.2" step="0.05" value={s.rate} onChange={e => setS({ ...s, rate: Number(e.target.value) })} /> {s.rate}倍
                  <button className="border rounded px-2" onClick={() => { Speech.rate = s.rate; Speech.say('ぼくは こうえんで おにごっこを した。'); }}>ためす</button></label>
                <div>もじの おおきさ：{opt('font', [[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']])}</div>
                <div>1回の 問題の数：{opt('count', [[3, '3問'], [5, '5問'], [10, '10問']])}<div className="text-sm text-stone-500 ml-2">モンスターの たいりょくも、この数になります。</div></div>
                <div>かきかた：{opt('tate', [[true, 'たてがき'], [false, 'よこがき']])}</div>
                <div>カードの いろわけ：{opt('color', [[true, 'あり'], [false, 'なし']])}<div className="text-sm text-stone-500 ml-2">なし でも、ヒント②を使うと 色が つきます。</div></div>
                <div>ならびかた：{opt('free', [[false, 'ふつう'], [true, 'ひろく']])}<div className="text-sm text-stone-500 ml-2">ふつう：見本と、「どこで・どこへ・だれと・いつ」「たくさん」などの まとまりを うごかした ならびかたを 正解にします。<br />ひろく：「にんじんを うまが たべる」のように、ことばの まとまり（ことば＋じょし）が あって いれば、どの じゅんばんでも 正解にします。</div></div>
                <div>こえに だして よむ：{opt('ondoku', [[true, 'つかう'], [false, 'つかわない']])}<div className="text-sm text-stone-500 ml-2">正解の あとに「こえに だして よもう」と声をかけ、「よんだよ」を押してから次へ進みます。</div></div>
                <div>こうかおん：{opt('sound', [[true, 'ならす'], [false, 'ならさない']])}</div>
                <div>おんがく（BGM）：{opt('bgm', [[true, 'つかう'], [false, 'つかわない']])}<div className="text-sm text-stone-500 ml-2">つかう にすると、子どもの画面の上に 🎵 ボタンが出て、オン・オフできます（はじめは オン）。</div></div>
                <label>暗証番号を変える（4けた）：<input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} className="border-2 rounded px-2 py-1 w-24 ml-2" inputMode="numeric" placeholder="----" /></label>
                <div><button onClick={saveSettings} className="btn3d rounded-xl px-6 py-2 border-2 border-emerald-500 bg-emerald-100 font-bold text-xl">保存する</button>
                  <span className="text-sm text-stone-500 ml-2">（全員の画面に反映されます。子どもの画面は開き直すと変わります）</span></div>
              </div>
            )}

            {tab === 'data' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-2xl">
                <div>この端末に たまっている、まだ送れていない記録：<b>{pending}</b> 件
                  <button onClick={async () => { await api.flush(); setPending(api.pending()); flash(api.pending() ? 'まだ送れていません。ネットのつながりを確かめてください' : '送りました'); onChanged(); }} className="ml-2 rounded-xl px-3 py-1 border-2 bg-white font-bold">📤 スプレッドシートへ送る</button></div>
                <div><button onClick={csv} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">📄 記録をCSVで書き出す</button>
                  <div className="text-sm text-stone-500">ダウンロードできないときは、スプレッドシートの「きろく」シートを開き、ファイル → ダウンロード → CSV を選んでください。</div></div>
                <div className="flex gap-2 flex-wrap items-center">
                  <button onClick={backup} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">💾 バックアップを保存</button>
                  <label className="rounded-xl px-3 py-2 border-2 bg-white font-bold cursor-pointer">📂 バックアップから元にもどす<input type="file" accept=".json" className="hidden" onChange={restore} /></label>
                </div>
                <div><button onClick={() => { if (confirm('全員の記録・進み具合・コイン・ざいりょう・まちを、すべて消します。元にはもどせません。よろしいですか？') && confirm('ほんとうに全員の記録を消しますか？')) act(() => api.clear(pin, ''), '全員の記録を消しました'); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 全員の記録を消す</button></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 15. アプリ ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [stageSel, setStageSel] = useState(null);
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [talk, setTalk] = useState({ text: '', mood: 'normal', talking: false, k: 0 });
      const [getFx, setGetFx] = useState(null);
      const [soundOn, setSoundOn] = useState(true);
      const [bgmOn, setBgmOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const progRef = useRef(progress);
      progRef.current = progress;

      const talkApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setTalk({ text, mood: opts.mood || 'normal', talking: true, k: id });
          Speech.say(fmtSpeech(opts.speech || text), () => { if (sayId.current === id) setTalk(p => ({ ...p, talking: false })); resolve(); });
        });
        return { say: run, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const talkCtx = { ...talkApi, ...talk };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        ['sound', 'tate', 'color', 'ondoku'].forEach(k => { v[k] = v[k] !== false && v[k] !== 'false'; });
        ['bgm', 'free'].forEach(k => { v[k] = v[k] === true || v[k] === 'true'; });
        v.count = [3, 5, 10].includes(Number(v.count)) ? Number(v.count) : 5;
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8;
        Sound.on = v.sound; setSoundOn(Sound.on);
        if (!v.bgm) Bgm.stop();
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);
      useEffect(() => { if (name && settings.bgm && bgmOn) Bgm.start(); else Bgm.stop(); }, [name, settings.bgm, bgmOn]);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        const recs = records.current; records.current = [];
        api.save({ name, progress: json, records: recs, stamp: nowStr(), time: Date.now() });
        return p;
      };
      const updateProg = (fn) => { progRef.current = fn(progRef.current); setProgress(progRef.current); return progRef.current; };
      const mergeWeak = (weak, delta) => {
        const w = { ...(weak || {}) };
        Object.entries(delta || {}).forEach(([k, d]) => { const v = Math.max(0, Math.min(9, (w[k] || 0) + d)); if (v) w[k] = v; else delete w[k]; });
        return w;
      };
      const before = useRef(null);

      const login = async (n) => {
        Sound.get(); Speech.say('');
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグは スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) { p = { ...p, flagT: a.flagT }; FLAGS.forEach(k => { p[k] = !!a[k]; }); }
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false);
        setView({ v: p.look ? 'home' : 'first' });
      };
      const logout = () => { talkApi.stop(); Bgm.stop(); setName(null); setView({ v: 'login' }); };

      const startStage = (st, part) => {
        setStageSel(null);
        records.current = [];
        const p = progRef.current;
        before.current = { titles: titlesOf(p), level: levelOf(p), cells: openCells(p).size, blds: D.BUILDINGS.filter(b => bldOpen(p, b)).map(b => b.id) };
        const n = part ? part.left : Number(settings.count) || 5;
        setView({ v: 'practice', st, n, intro: part ? 'つづきから はじめよう。' : null, key: uid() });
      };
      const onRecord = (r) => { records.current.push({ ...r, id: uid() }); };
      // 1もん せいかい：コイン 2・ざいりょう 1・けいけん 1（ヒントを つかっても おなじ）
      const onCorrect = (aid) => {
        const mat = pick(AREA[aid].drop);
        updateProg(p => ({ ...p, coin: p.coin + 2, earned: p.earned + 2, exp: p.exp + 1, mats: { ...p.mats, [mat]: (p.mats[mat] || 0) + 1 } }));
        setGetFx({ k: uid(), coin: 2, mat }); Sound.coin();
        return { coin: 2, mat };
      };
      const pendingWeak = useRef({});
      const onSave = (part, weak) => { pendingWeak.current = weak; persist({ ...progRef.current, part }); };

      const finish = (st, result) => {
        let p = { ...progRef.current, part: null, weak: mergeWeak(progRef.current.weak, result.weak), mats: { ...progRef.current.mats } };
        pendingWeak.current = {};
        const add = (k, v) => { p.mats[k] = (p.mats[k] || 0) + v; result.mats[k] = (result.mats[k] || 0) + v; };
        let bonus = 0, newPerson = null;
        // かった ごほうび
        if (st.boss) { add('tetsu', 2); add(D.MATS.find(m => m.sp === st.a).id, 3); }
        else { add(pick(AREA[st.a].drop), 2); add('tetsu', 1); }
        if (!p.cleared[st.id]) { p.cleared = { ...p.cleared, [st.id]: 1 }; bonus += 5; }
        if (!p.beaten.includes(result.monster)) p.beaten = [...p.beaten, result.monster];
        if (st.boss) { const per = personOf(st.a); if (!p.people.includes(per.id)) { newPerson = per.id; p.people = [...p.people, per.id]; } }
        p.coin += bonus; p.earned += bonus;
        p = persist(p);
        const b = before.current || { titles: [], level: 1, cells: 9, blds: [] };
        const newTitle = titlesOf(p).filter(t => !b.titles.includes(t)).pop() || null;
        const level = levelOf(p), levelUp = level > b.level;
        const newBlds = D.BUILDINGS.filter(x => bldOpen(p, x) && !b.blds.includes(x.id)).map(x => x.id);
        const townUp = openCells(p).size > b.cells;
        let next = null;
        const cur = currentStage(p);
        if (stageOpen(p, cur) && !isCleared(p, cur.id)) next = () => startStage(cur);
        setView({ v: 'result', st, result: { ...result, bonus, newPerson, level, levelUp, newTitle, newBlds, townUp }, next });
      };
      const quit = () => { talkApi.stop(); persist({ ...progRef.current, weak: mergeWeak(progRef.current.weak, pendingWeak.current) }); pendingWeak.current = {}; setView({ v: 'home' }); };
      const buy = (it) => {
        const p = progRef.current;
        if (p.coin < it.p || p.items.includes(it.id)) return;
        persist({ ...p, coin: p.coin - it.p, items: [...p.items, it.id] });
      };
      const build = (cell, b) => {
        const p = progRef.current, cost = costOf(b, 1);
        if (!canPay(p, cost) || p.town[cell]) return;
        const q = pay(p, cost);
        persist({ ...q, town: { ...p.town, [cell]: { b: b.id, lv: 1 } } });
      };
      const levelBld = (cell) => {
        const p = progRef.current, c = p.town[cell]; if (!c || c.lv >= 3) return;
        const cost = costOf(BLD[c.b], c.lv + 1);
        if (!canPay(p, cost)) return;
        const q = pay(p, cost);
        persist({ ...q, town: { ...p.town, [cell]: { ...c, lv: c.lv + 1 } } });
      };
      const moveBld = (from, to) => {
        const p = progRef.current; if (!p.town[from] || p.town[to]) return;
        const t = { ...p.town }; t[to] = t[from]; delete t[from];
        persist({ ...p, town: t });
      };
      const cont = () => {
        const p = progRef.current;
        const part = p.part && STAGE[p.part.st];
        if (part && stageOpen(p, part)) { startStage(part, p.part); return; }
        startStage(currentStage(p));
      };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const p = { ...progRef.current, flagT: sp.flagT, coin: sp.coin || 0, t: sp.t || Date.now() };
              FLAGS.forEach(k => { p[k] = !!sp[k]; });
              const fresh = !me.progress ? { ...newProgress(), welcome: 1, look: progRef.current.look } : p;
              progRef.current = fresh; setProgress(fresh); safeStore.set(COPY_KEY(name), JSON.stringify(fresh));
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-amber-900">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-stone-500 mt-2">{boot.error}</div></div>;

      const bar = (home = true) => (
        <TopBar name={name} progress={progress} bump={getFx ? getFx.k : 0} onHome={home ? () => { talkApi.stop(); if (view.v === 'practice') quit(); else setView({ v: 'home' }); } : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }}
          bgmAllowed={settings.bgm} bgmOn={bgmOn} onBgm={() => setBgmOn(x => !x)} />
      );
      const page = (inner, cls = 'grass') => <div className={`min-h-screen flex flex-col items-center ${cls}`}>{bar()}{inner}</div>;
      const modal = stageSel && <StageModal key={stageSel.id} st={stageSel} progress={progress} onClose={() => setStageSel(null)} onStart={() => startStage(stageSel)} onResume={() => startStage(stageSel, progress.part)} />;

      let body = null;
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (view.v === 'first') {
        body = <div className="min-h-screen flex flex-col items-center grass">{bar(false)}<EquipScreen progress={progress} first onSave={(lk) => { persist({ ...progRef.current, look: lk }); setView({ v: 'home' }); }} /></div>;
      } else if (view.v === 'home') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <HomeScreen name={name} progress={progress} onContinue={cont} go={(v) => setView({ v })} onWelcome={() => persist({ ...progRef.current, welcome: 1 })} /></div>;
      } else if (view.v === 'map') {
        body = page(<MapScreen progress={progress} onArea={(a) => { Sound.tap(); setView({ v: 'area', a }); }} />);
      } else if (view.v === 'area') {
        body = page(<><AreaScreen key={view.a.id} a={view.a} progress={progress} onStage={(st) => { Sound.tap(); setStageSel(st); }} />{modal}</>);
      } else if (view.v === 'practice') {
        body = <div className="min-h-screen flex flex-col items-center relative bg-amber-50">{bar()}<GetFx fx={getFx} />
          <div className="w-full flex justify-center py-2"><Practice key={view.key} st={view.st} n={view.n} intro={view.intro} progress={progress}
            onRecord={onRecord} onCorrect={onCorrect} onSave={onSave} onFinish={(r) => finish(view.st, r)} onQuit={quit} /></div></div>;
      } else if (view.v === 'result') {
        body = page(<ResultScreen view={view} progress={progress} onAgain={() => startStage(view.st)} onNext={view.next} onHome={() => setView({ v: 'home' })} onTown={() => setView({ v: 'town' })} />);
      } else if (view.v === 'town') {
        body = page(<TownScreen progress={progress} onBuild={build} onLevel={levelBld} onMove={moveBld} />);
      } else if (view.v === 'shop') {
        body = page(<ShopScreen progress={progress} onBuy={buy} />);
      } else if (view.v === 'equip') {
        body = page(<EquipScreen progress={progress} onSave={(lk) => persist({ ...progRef.current, look: lk })} />);
      } else if (view.v === 'zukan') {
        body = page(<ZukanScreen progress={progress} />);
      }

      return (
        <SetCtx.Provider value={settings}>
          <TalkCtx.Provider value={talkCtx}>
            {body}
            {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
            {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
            {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
          </TalkCtx.Provider>
        </SetCtx.Provider>
      );
    }
    const GetFx = GetFly;

    window.BUNBUN_READY.then(() => {
      D = window.BUNBUN_DATA; K = window.BUNBUN_KUMI;
      STAGES = buildStages();
      STAGES.forEach(s => { STAGE[s.id] = s; });
      D.AREAS.forEach(a => { AREA[a.id] = a; });
      D.BUN.forEach(b => { BUNS[b.id] = b; });
      D.MONSTERS.forEach(m => { MON[m.id] = m; });
      D.MATS.forEach(m => { MAT[m.id] = m; });
      D.BUILDINGS.forEach(b => { BLD[b.id] = b; });
      D.PEOPLE.forEach(p => { PERSON[p.id] = p; });
      D.ITEM_CATS.forEach(c => c.items.forEach(it => { it.cat = c.id; }));
      ALL_ITEMS = D.ITEM_CATS.flatMap(c => c.items);
      ALL_ITEMS.forEach(it => { ITEM[it.id] = it; });
      [...D.COLORS, ...ALL_ITEMS.filter(it => it.color).map(it => it.color)].forEach(c => { COLOR[c.id] = c; });
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:24px;line-height:1.8">ぶんの データを よみこめませんでした。<br>ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<div style="font-size:14px;color:#888">' + e.message + '</div></div>';
    });
  </script>
</body>
</html>
