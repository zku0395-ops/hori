<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">

  <title>ブンブンちょうろうの ことばの ぼうけん</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'BIZ UDPGothic', sans-serif; background: #fef9c3; margin: 0; color: #422006;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .btn3d { border-bottom-width: 6px; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; }
    /* メッセージの まど */
    .win { background: #3b2a1a; color: #fff; border: 4px solid #fde68a; border-radius: 16px; box-shadow: 0 0 0 4px #3b2a1a, 0 8px 0 4px rgba(66,32,6,.25); }
    .win-light { background: #fffdf5; border: 4px solid #78350f; border-radius: 16px; box-shadow: 0 6px 0 rgba(120,53,15,.25); }
    .grass { background-color: #a3e635; background-image: radial-gradient(circle at 25% 30%, rgba(77,124,15,.25) 0 3px, transparent 4px), radial-gradient(circle at 75% 70%, rgba(77,124,15,.25) 0 3px, transparent 4px); background-size: 46px 46px; }
    .paper { background-color: #fffbeb; background-image: linear-gradient(rgba(180,83,9,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(180,83,9,.06) 1px, transparent 1px); background-size: 28px 28px; }
    .pop { animation: pop .45s cubic-bezier(.17,.89,.32,1.28) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floaty { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .bob { animation: bob 1.2s steps(2) infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .shake { animation: shake .45s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-9px); } 40%,80% { transform: translateX(9px); } }
    .glow { animation: glow 1.1s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 14px rgba(250,204,21,0); } }
    .coinfly { animation: coinfly 1.2s ease-out forwards; }
    @keyframes coinfly { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }
    .bump { animation: bump .5s; }
    @keyframes bump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.35); } }
    .hop { animation: hop 2.4s ease-in-out infinite; }
    @keyframes hop { 0%,70%,100% { transform: translateY(0); } 80% { transform: translateY(-12px); } 90% { transform: translateY(0); } }
    .hurt { animation: hurt .5s .15s; }
    @keyframes hurt { 0%,100% { transform: translateX(0); filter: none; } 25% { transform: translateX(12px); filter: brightness(2); } 50% { transform: translateX(-8px); } 75% { transform: translateX(4px); filter: brightness(1.5); } }
    .dodge { animation: dodge .6s; }
    @keyframes dodge { 0%,100% { transform: translateX(0); } 40% { transform: translateX(30px) rotate(8deg); } }
    @keyframes warpin { 0% { transform: translateY(-70px) scale(.15, 2.4); opacity: 0; filter: brightness(4); } 35% { transform: translateY(0) scale(1.3, .75); opacity: 1; filter: brightness(2.2); } 60% { transform: scale(.9, 1.12); filter: brightness(1.2); } 100% { transform: scale(1); filter: none; } }
    .warpin { animation: warpin .5s cubic-bezier(.2,.9,.3,1.2) both; transform-origin: 50% 100%; }
    .defeat { transition: opacity 1s .3s, transform 1s .3s, filter 1s .3s; opacity: 0; transform: scale(.4) translateY(30px); filter: brightness(3); }
    .dmg { animation: dmg 1s ease-out forwards; }
    @keyframes dmg { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-46px); opacity: 0; } }
    .magic { animation: magic .7s ease-in forwards; }
    @keyframes magic { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--mx), var(--my)) scale(1.6); opacity: 0; } }
    .confetti span { position: absolute; animation: fall 1.6s ease-in forwards; }
    @keyframes fall { from { transform: translateY(-40px) rotate(0); opacity: 1; } to { transform: translateY(260px) rotate(320deg); opacity: 0; } }
    .niji { animation: niji 3s linear infinite; }
    @keyframes niji { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
    .shine { animation: shine 2.4s ease-in-out infinite; }
    @keyframes shine { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25) drop-shadow(0 0 6px #fff7); } }
    .chara-img { filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
    .caret:after { content: '▼'; display: inline-block; margin-left: 6px; font-size: .7em; animation: floaty 1s infinite; }
    .path-dash { stroke-dasharray: 10 10; }
    .walk { animation: walk var(--d, 9s) ease-in-out infinite alternate; }
    @keyframes walk { 0% { transform: translate(0, 0); } 25% { transform: translate(var(--wx), 0); } 50% { transform: translate(var(--wx), var(--wy)); } 75% { transform: translate(0, var(--wy)); } 100% { transform: translate(0, 0); } }

    /* ことばの カード（たてがき・よこがき の りょうほうで つかえる ように、論理プロパティで かく） */
    .tate { writing-mode: vertical-rl; text-orientation: upright; }
    .yoko { writing-mode: horizontal-tb; }
    .flow { display: flex; flex-wrap: wrap; align-content: flex-start; align-items: center; gap: .55rem; }
    .card { position: relative; display: flex; align-items: center; justify-content: center; border: 3px solid; border-radius: .8rem;
      block-size: 3.6rem; min-inline-size: 3.2rem; padding-inline: .55rem; font-size: 2rem; font-weight: 700; line-height: 1; white-space: nowrap;
      box-shadow: 0 4px 0 rgba(0,0,0,.22); cursor: grab; touch-action: none; transition: transform .1s; flex-shrink: 0; padding-block: 0; box-sizing: border-box; }
    .tate .card { padding-inline: .45rem; }
    .card:active { transform: scale(.96); }
    .card.small { block-size: 3rem; min-inline-size: 2.6rem; font-size: 1.65rem; }
    .slot { position: relative; display: flex; align-items: center; justify-content: center; border: 3px dashed #d6a24a; border-radius: .9rem;
      background: #fffbeb; block-size: 4.1rem; min-inline-size: 4.4rem; padding: .2rem; flex-shrink: 0; }
    .slot.filled { border-color: transparent; background: transparent; min-inline-size: 0; }
    .slot.over { border-color: #f59e0b; background: #fef3c7; }
    .slot .num { position: absolute; inset-inline-start: .2rem; inset-block-start: .1rem; font-size: .8rem; color: #b45309; font-weight: 700; writing-mode: horizontal-tb; }
    .mini { gap: .3rem; }
    .mini .card { font-size: 1.15rem; block-size: 2.3rem; min-inline-size: 1.9rem; padding-inline: .3rem; border-width: 2px; }
    .mini .card.small { font-size: 1rem; block-size: 2rem; min-inline-size: 1.6rem; }
    .lock-ok { box-shadow: 0 0 0 3px #22c55e, 0 4px 0 rgba(0,0,0,.22); }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#78350f;font-weight:bold;">じゅんび ちゅう…</div>
  </div>

  <!-- ぶんの データと 絵は GitHub Pages から読みこみます（このファイルを短くするため） -->
  <script>
    (function () {
      var h = location.hostname;
      var local = location.protocol === 'file:' || /github\.io$/.test(h) || h === 'localhost' || h === '127.0.0.1';
      window.BUNBUN_BASE = local ? '' : 'https://zku0395-ops.github.io/hori/bunbun/';
      var V = '1';
      var load = function (f) {
        return new Promise(function (ok, ng) {
          var s = document.createElement('script');
          s.src = window.BUNBUN_BASE + f + '?v=' + V;
          s.onload = ok; s.onerror = function () { ng(new Error(f)); };
          document.head.appendChild(s);
        });
      };
      window.BUNBUN_READY = Promise.all([load('data/bunbun.js'), load('data/kumitate.js')]);
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;
    const APP_VERSION = '1.0.19';
    const BASE = window.BUNBUN_BASE;
    const IMG = BASE + 'img/';

    // =====================================================================
    //  1. 小さな道具
    // =====================================================================
    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const uniq = (a) => [...new Set(a)];
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const nowStr = () => {
      const d = new Date(), p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const safeStore = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
    };
    const downloadText = (name, text, type) => {
      const blob = new Blob([text], { type: type || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    };

    // =====================================================================
    //  2. こえ と おと
    // =====================================================================
    const Speech = {
      rate: 0.8, pitch: 1.0, voice: null,
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(String(text));
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = this.pitch;
          let done = false;
          const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
          u.onend = end; u.onerror = end;
          // 声が出ない端末でも先へ進めるように、長さに合わせて待つ
          setTimeout(end, 1500 + String(text).length * 230 / this.rate);
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() { try { this.ok && window.speechSynthesis.cancel(); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }

    // このアプリのための オリジナルの おと
    const Sound = {
      on: true, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      toneAt(freq, t, dur, type = 'square', vol = 0.06) {
        const c = this.ctx; if (!c) return;
        const o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      tone(freq, at, dur, type = 'square', vol = 0.06) { const c = this.get(); if (!c || !this.on) return; this.toneAt(freq, c.currentTime + at, dur, type, vol); },
      seikai() { [[784, 0], [988, .09], [1319, .18]].forEach(([f, t]) => this.tone(f, t, .14, 'square', .05)); this.tone(1568, .3, .35, 'triangle', .1); },
      magic() { [1319, 1568, 1760, 2093, 2637].forEach((f, i) => this.tone(f, i * .05, .12, 'triangle', .07)); },
      hit() { this.tone(196, 0, .12, 'square', .07); this.tone(147, .08, .16, 'square', .06); },
      defeat() { [523, 440, 349, 262, 196].forEach((f, i) => this.tone(f, i * .08, .12, 'square', .05)); },
      fanfare() {
        [[523, 0], [659, .14], [784, .28], [1047, .42], [988, .7], [1047, .84], [1319, 1.0]].forEach(([f, t]) => this.tone(f, t, .16, 'square', .055));
        [262, 330, 392, 523].forEach(f => this.tone(f, 1.0, 1.0, 'triangle', .07));
      },
      levelup() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, i * .09, .12, 'square', .05)); },
      pyu() { const c = this.get(); if (!c || !this.on) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(1800, t + .16); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.05, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .2); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .25); },
      friend() { [[659, 0], [784, .12], [988, .24], [1319, .4]].forEach(([f, t]) => this.tone(f, t, .2, 'triangle', .1)); },
      retry() { this.tone(330, 0, .12, 'sine', .06); this.tone(294, .11, .18, 'sine', .06); }, // まちがえた とき（小さな おと）
      tap() { this.tone(880, 0, .05, 'square', .035); },
      put() { this.tone(660, 0, .05, 'triangle', .07); this.tone(990, .05, .06, 'triangle', .05); },
      coin() { this.tone(988, 0, .07, 'square', .045); this.tone(1319, .07, .2, 'square', .045); },
      build() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .08, .14, 'square', .05)); this.tone(196, 0, .1, 'square', .06); this.tone(196, .2, .1, 'square', .06); },
    };

    // おんがく（BGM）。このアプリのための オリジナルの きょく
    const N = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const MEL = [67, 0, 72, 74, 76, 0, 74, 72, 74, 0, 67, 0, 69, 71, 72, 0, 67, 0, 72, 74, 76, 79, 77, 76, 74, 72, 74, 76, 72, 0, 0, 0];
    const BASS = [48, 0, 0, 0, 52, 0, 0, 0, 55, 0, 0, 0, 43, 0, 0, 0, 48, 0, 0, 0, 53, 0, 0, 0, 55, 0, 0, 0, 48, 0, 0, 0];
    const Bgm = {
      timer: null, step: 0, next: 0,
      start() {
        if (this.timer) return;
        const c = Sound.get(); if (!c) return;
        this.next = c.currentTime + 0.15; this.step = 0;
        this.timer = setInterval(() => {
          const cc = Sound.ctx; if (!cc) return;
          while (this.next < cc.currentTime + 0.35) {
            const m = MEL[this.step], b = BASS[this.step];
            if (m) Sound.toneAt(N(m), this.next, 0.2, 'triangle', 0.035);
            if (b) Sound.toneAt(N(b), this.next, 0.5, 'triangle', 0.045);
            this.next += 0.24; this.step = (this.step + 1) % MEL.length;
          }
        }, 90);
      },
      stop() { if (this.timer) clearInterval(this.timer); this.timer = null; },
    };

    // ---- 読み上げの ことば ----
    const fmtSpeech = (t) => String(t || '')
      .replace(/〜/g, '').replace(/[「」『』]/g, '、').replace(/[①②③④⑤👑]/g, '')
      .replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '');
    // カード 1まいの よみ（じょしの「は」「へ」「を」は「わ」「え」「お」と よむ）
    const cardSay = (t) => ({ 'は': 'わ', 'へ': 'え', 'を': 'お' })[t] || String(t).replace(/[、。]/g, '');
    const sentSay = (texts) => texts.join('');

    // =====================================================================
    //  3. データ（data/bunbun.js と data/kumitate.js から）
    // =====================================================================
    let D = null, K = null, STAGES = [], STAGE = {}, AREA = {}, BUNS = {}, MON = {}, ITEM = {}, ALL_ITEMS = [], COLOR = {}, MAT = {}, BLD = {}, PERSON = {};
    const PREP = {};
    const prep = (id) => PREP[id] || (PREP[id] = K.prepare(BUNS[id]));
    const SPOT = ['', '①', '②', '👑'];
    const GRID_W = 7, GRID_H = 5;
    // カードの いろ（品詞）
    const TAG = {
      n: { bg: '#dbeafe', bd: '#2563eb', name: 'だれ・なに' },
      j: { bg: '#dcfce7', bd: '#16a34a', name: 'ちいさい ことば' },
      l: { bg: '#dcfce7', bd: '#16a34a', name: 'ちいさい ことば' },
      v: { bg: '#fee2e2', bd: '#dc2626', name: 'どうする・なんだ' },
      a: { bg: '#ffedd5', bd: '#ea580c', name: 'ようす' },
      d: { bg: '#f3e8ff', bd: '#9333ea', name: 'どのくらい・どんなふうに' },
      t: { bg: '#ccfbf1', bd: '#0d9488', name: 'いつ' },
      c: { bg: '#fce7f3', bd: '#db2777', name: 'つなぐ ことば' },
    };
    const PLAIN = { bg: '#ffffff', bd: '#57534e' };
    const isSmall = (g) => g === 'j' || g === 'l';

    function buildStages() {
      const out = [];
      D.AREAS.forEach(a => [1, 2, 3].forEach(s => out.push({ id: `${a.id}-${s}`, a: a.id, s, boss: s === 3, hatten: !!a.hatten })));
      return out;
    }
    // エリアの ぶん（カードの すくない じゅん）。① は まえの 10、② は うしろの 10、ボスは ぜんぶ から
    const areaBuns = (aid) => D.BUN.filter(b => b.a === aid).map((b, i) => ({ b, i, n: b.c.split('|').length })).sort((x, y) => x.n - y.n || x.i - y.i).map(x => x.b);
    const stageBuns = (st) => { const l = areaBuns(st.a); return st.s === 1 ? l.slice(0, 10) : st.s === 2 ? l.slice(10) : l; };
    const monsterOf = (st) => D.MONSTERS.filter(m => m.a === st.a)[st.s - 1];
    const personOf = (aid) => D.PEOPLE.find(p => p.a === aid);
    const stageLabel = (st) => `${SPOT[st.s]} ${st.boss ? 'ボス' : st.s === 1 ? 'たたかい 1' : 'たたかい 2'}`;
    const stageName = (st) => `${AREA[st.a].name} ${stageLabel(st)}`;
    const mainChain = () => STAGES.filter(s => !s.hatten);

    function buildProblems(st, n, prog) {
      const pool = stageBuns(st);
      const out = [];
      while (out.length < n) {
        // まちがえた ぶんを すこし おおめに だす
        const items = shuffle(pool).map(b => ({ b, wt: 1 + Math.min(3, (prog.weak || {})[b.id] || 0) * 2 }));
        while (out.length < n && items.length) {
          let r = Math.random() * items.reduce((s, x) => s + x.wt, 0), j = 0;
          while (r > items[j].wt && j < items.length - 1) { r -= items[j].wt; j++; }
          out.push(items.splice(j, 1)[0].b);
        }
      }
      return out;
    }

    // =====================================================================
    //  4. しんちょく（進み具合）
    // =====================================================================
    const FLAGS = ['unlockAll', 'hatten'];
    const newProgress = () => ({ v: 1, t: 0, coin: 0, earned: 0, exp: 0, mats: {}, items: [], cleared: {}, beaten: [], people: [], town: {}, look: null,
      part: null, weak: {}, welcome: 0, unlockAll: false, hatten: false });
    function parseProgress(s) {
      let p = null;
      try { p = typeof s === 'string' ? (s ? JSON.parse(s) : null) : s; } catch (e) { p = null; }
      const q = { ...newProgress(), ...(p || {}) };
      ['items', 'beaten', 'people'].forEach(k => { if (!Array.isArray(q[k])) q[k] = []; });
      ['cleared', 'weak', 'mats', 'town'].forEach(k => { if (!q[k] || typeof q[k] !== 'object') q[k] = {}; });
      q.coin = Number(q.coin) || 0; q.exp = Number(q.exp) || 0;
      return q;
    }
    const isCleared = (p, id) => !!p.cleared[id];
    const areaCleared = (p, aid) => isCleared(p, `${aid}-3`);
    const stageOpen = (p, st) => {
      if (st.hatten && !(p.hatten || p.unlockAll)) return false;
      if (p.unlockAll) return true;
      if (st.hatten) return st.s === 1 || isCleared(p, `${st.a}-${st.s - 1}`);
      const ch = mainChain(), i = ch.findIndex(s => s.id === st.id);
      return i <= 0 || isCleared(p, ch[i - 1].id);
    };
    const areaOpen = (p, aid) => stageOpen(p, STAGE[`${aid}-1`]);
    const currentStage = (p) => {
      const ch = mainChain();
      return ch.find(st => stageOpen(p, st) && !isCleared(p, st.id))
        || STAGES.filter(s => s.hatten).find(st => stageOpen(p, st) && !isCleared(p, st.id))
        || ch[ch.length - 1];
    };
    const areasCleared = (p) => D.AREAS.filter(a => areaCleared(p, a.id)).length;
    const levelOf = (p) => 1 + Math.floor((p.exp || 0) / 10);
    const titleOf = (p) => { const lv = levelOf(p); return D.TITLES.filter(t => lv >= t.lv).pop().n; };
    const titlesOf = (p) => D.TITLES.filter(t => levelOf(p) >= t.lv).map(t => t.n);
    const defaultLook = () => ({ form: 1, color: 'ao', hat: null, wand: null });
    const ownedColors = (p) => [...D.COLORS, ...ALL_ITEMS.filter(it => it.color && p.items.includes(it.id)).map(it => it.color)];
    // まちの マス（まんなかから じゅんに ひろがる）
    const CELL_ORDER = Array.from({ length: GRID_W * GRID_H }, (_, i) => i)
      .sort((a, b) => { const d = (i) => Math.hypot((i % GRID_W) - (GRID_W - 1) / 2, (Math.floor(i / GRID_W) - (GRID_H - 1) / 2) * 1.2); return d(a) - d(b) || a - b; });
    const openCells = (p) => new Set(CELL_ORDER.slice(0, Math.min(GRID_W * GRID_H, 9 + 3 * areasCleared(p))));
    const bldOpen = (p, b) => b.a === 0 || areaCleared(p, b.a) || p.unlockAll;
    const costOf = (b, lv) => { const m = lv >= 2 ? 2 : 1; const c = {}; Object.entries(b.cost).forEach(([k, v]) => { c[k] = v * m; }); return c; }; // lv：これから なる レベル（1・2 は そのまま、3 は 2ばい）
    const haveOf = (p, k) => k === 'coin' ? p.coin : (p.mats[k] || 0);
    const canPay = (p, cost) => Object.entries(cost).every(([k, v]) => haveOf(p, k) >= v);
    const pay = (p, cost) => { const q = { ...p, mats: { ...p.mats } }; Object.entries(cost).forEach(([k, v]) => { if (k === 'coin') q.coin -= v; else q.mats[k] = (q.mats[k] || 0) - v; }); return q; };

    // =====================================================================
    //  5. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    const LOG_HEADER = ['日時', 'なまえ', 'ステージ', 'エリア', 'ぶん', 'こたえ', 'けっか', 'まちがい', 'ヒント', 'まちがいの しゅるい', 'ならべた こたえ', 'じょし', 'カードの かず', 'びょう', 'ID'];
    const DEFAULT_SETTINGS = { rate: 0.8, font: 1, count: 5, tate: true, color: true, free: false, ondoku: true, sound: true, bgm: false };

    // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
    const emptyStu = () => ({ count: 0, ok: 0, secs: 0, last: '', stages: {}, types: {}, joshi: {}, joshiPair: {}, bun: {}, missProb: {} });
    const addB = (m, k, ok, miss, hint) => { const a = m[k] || (m[k] = [0, 0, 0, 0]); a[0]++; a[1] += ok; a[2] += miss; a[3] += hint ? 1 : 0; };
    function aggregate(rows) {
      const students = {}, classTypes = {}, classJoshi = {}, classJoshiPair = {}, classBun = {};
      const inc = (m, k) => { m[k] = (m[k] || 0) + 1; };
      rows.forEach(r => {
        const name = String(r[1] || '').trim(); if (!name) return;
        const s = students[name] || (students[name] = emptyStu());
        const day = String(r[0] instanceof Date ? r[0].toISOString() : r[0]).slice(0, 10).replace(/-/g, '/');
        if (day > s.last) s.last = day;
        const st = String(r[2]), ok = r[6] === '○' ? 1 : 0, b = String(r[4] || '');
        s.count++; s.ok += ok; s.secs += Number(r[13]) || 0;
        const g = s.stages[st] || (s.stages[st] = [0, 0]);
        g[0]++; g[1] += ok;
        String(r[9] || '').split('・').forEach(k => { if (k) { inc(s.types, k); inc(classTypes, k); } });
        String(r[11] || '').split('・').forEach(k => { if (!k) return; const need = k.split('→')[0]; inc(s.joshi, need); inc(classJoshi, need); inc(s.joshiPair, k); inc(classJoshiPair, k); });
        if (b) { addB(s.bun, b, ok, Number(r[7]) || 0, Number(r[8]) || 0); addB(classBun, b, ok, Number(r[7]) || 0, Number(r[8]) || 0); }
        if (!ok && Number(r[7]) > 0) { const k = `${b}：${r[5]}`; s.missProb[k] = (s.missProb[k] || 0) + 1; }
      });
      return { students, classTypes, classJoshi, classJoshiPair, classBun };
    }

    const Local = {
      key: 'bunbun_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}

    const PENDING_KEY = 'bunbun_pending_v1';

    const recRow = (stamp, name, r) => [stamp, name, r.stage, r.area, r.bun, r.answer, r.result, r.miss, r.hint, r.types, r.picks, r.joshi, r.cards, r.secs, r.id];
    const api = {

      async sendOne(p) {

      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす

      async addCoin(pin, name, delta) {

      },
      async saveSettings(pin, s) {

      },
      async logRows(pin) {

        return { ok: true, rows: [LOG_HEADER, ...Local.data().log] };
      },
      async backup(pin) {
        if (HAS_GAS) return gas('getBackup', pin);
        const d = Local.data(); return { ok: true, data: { app: 'bunbun', roster: d.roster.map(n => [n, d.progress[n] || '']), settings: d.settings } };
      },
      async restore(pin, data) {
        if (HAS_GAS) return gas('restoreBackup', pin, data);
        const d = Local.data(); (data.roster || []).forEach(([n, p]) => { if (!d.roster.includes(n)) d.roster.push(n); d.progress[n] = p; }); Local.save(); return { ok: true };

    // たびびと：ChatGPT の 絵（hero_かたち.webp）の あおい ふくを、えらんだ いろに ぬりかえる
    const HERO_CACHE = new Map();
    function rgb2hsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
      if (mx === mn) return [0, 0, l];
      const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      return [h * 60, s, l];
    }
    function hsl2rgb(h, s, l) {
      h = ((h % 360) + 360) % 360 / 360;
      if (!s) return [l * 255, l * 255, l * 255];
      const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
      const f = (t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
      return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
    }
    function recolor(src, color) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            if (color.id === 'ao') { resolve(src); return; }
            const cv = document.createElement('canvas');
            cv.width = img.naturalWidth; cv.height = img.naturalHeight;
            const cx = cv.getContext('2d');
            cx.drawImage(img, 0, 0);
            const id = cx.getImageData(0, 0, cv.width, cv.height), a = id.data, W = cv.width, H = cv.height;
            for (let i = 0; i < a.length; i += 4) {
              if (a[i + 3] < 10) continue;
              const [h, s, l] = rgb2hsl(a[i], a[i + 1], a[i + 2]);
              if (h < 192 || h > 258 || s < 0.25 || l < 0.08 || l > 0.93) continue;
              const px = (i / 4) % W, py = Math.floor(i / 4 / W);
              const nh = color.niji ? (py / H) * 300 + (px / W) * 60 : color.h + (h - 222) * 0.4;
              const ns = Math.min(1, s * color.s), nl = Math.max(0.04, Math.min(0.96, l + color.l));
              const [r, g, b] = hsl2rgb(nh, ns, nl);
              a[i] = r; a[i + 1] = g; a[i + 2] = b;
            }
            cx.putImageData(id, 0, 0);
            resolve(cv.toDataURL('image/png'));
          } catch (e) { resolve(src); } // ぬりかえられない ときは そのまま
        };
        img.onerror = () => reject(new Error('no image'));
        img.src = src;
      });
    }

    function Hero({ look, size = 140, bare = false, className = '' }) {

    // バラバラン（自作の 絵。ことばの かけらが まわりに ちらばって いる）
    function BarabaranSvg({ m, size }) {

          <path d="M44 150 q-10 -96 56 -100 q66 4 56 100 q-10 20 -20 6 q-10 18 -22 2 q-14 18 -26 0 q-12 16 -22 -2 q-12 14 -22 -6z" fill={c} stroke="#1c1917" strokeWidth="4" />
          <ellipse cx="80" cy="96" rx="15" ry="18" fill="#fff" stroke="#1c1917" strokeWidth="3" /><ellipse cx="120" cy="96" rx="15" ry="18" fill="#fff" stroke="#1c1917" strokeWidth="3" />
          <circle cx="84" cy="100" r="7" fill="#1c1917" /><circle cx="116" cy="100" r="7" fill="#1c1917" />
          <path d="M70 74 l20 8 M130 74 l-20 8" stroke="#1c1917" strokeWidth="4" strokeLinecap="round" />
          <path d="M82 128 q18 14 36 0" stroke="#1c1917" strokeWidth="4" fill="#7f1d1d" />
          <path d="M92 130 l4 8 l4 -7z" fill="#fff" />
          {m.boss && <path d="M66 54 l10 -26 l14 18 l10 -24 l10 24 l14 -18 l10 26z" fill="#facc15" stroke="#a16207" strokeWidth="3" />}
        </svg>
      );
    }
    function Monster({ m, size = 120, got = true, className = '' }) {
      if (!got) return <div className={`flex items-center justify-center rounded-2xl bg-stone-200 text-stone-400 font-bold ${className}`} style={{ width: size, height: size, fontSize: size * 0.5 }}>？</div>;

    }

    // 背景（ChatGPT の 絵。なければ 自作の 絵）
    function Bg({ file, className = '', style, children, fallback }) {
      const [ok, setOk] = useState(!MISSING.has(file));
      return (
        <div className={`relative overflow-hidden ${className}`} style={style}>
          {ok && <img src={IMG + file} alt="" onError={() => { MISSING.add(file); setOk(false); }} className="absolute inset-0 w-full h-full object-cover" draggable={false} />}
          {!ok && fallback}
          <div className="relative w-full h-full">{children}</div>

    }
    function LandSvg() {
      return (
        <svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" className="absolute inset-0 w-full h-full">
          <rect width="800" height="450" fill="#a3e635" />
          <rect width="800" height="120" fill="#7dd3fc" />
          {[[120, 40], [420, 26], [650, 60]].map(([x, y], i) => <g key={i} fill="#fff"><ellipse cx={x} cy={y} rx="40" ry="14" /><ellipse cx={x + 24} cy={y - 8} rx="24" ry="12" /></g>)}
          <path d="M0 120 L90 70 L170 120 L260 60 L350 120 L470 80 L570 120 L670 66 L800 120Z" fill="#65a30d" />
          <path d="M60 450 C160 350 260 330 400 300 S640 240 760 180" stroke="#fde68a" strokeWidth="38" fill="none" strokeLinecap="round" />
          <path d="M0 330 C200 270 300 390 480 310 S760 270 800 310 L800 350 C700 320 600 370 480 360 S200 310 0 370Z" fill="#60a5fa" opacity=".85" />
          {[[90, 200], [190, 240], [600, 200], [700, 380], [340, 410], [520, 160]].map(([x, y], i) => <g key={i}><rect x={x - 4} y={y + 18} width="8" height="14" fill="#78350f" /><circle cx={x} cy={y + 8} r="20" fill="#15803d" /></g>)}

    const AreaBg = ({ a }) => <div className="absolute inset-0" style={{ background: `linear-gradient(${a.bg} 0 58%, ${a.color}55 58% 100%)` }}><div className="absolute right-6 top-2 text-7xl opacity-40">{a.icon}</div></div>;

    // =====================================================================
    //  7. がめんの ぶひん
    // =====================================================================
    function Btn({ children, onClick, color = '#b45309', light = '#fef3c7', className = '', disabled, style }) {
      return (
        <button onClick={onClick} disabled={disabled}
          className={`btn3d rounded-2xl font-bold px-5 py-3 text-2xl border-2 ${disabled ? 'opacity-40' : ''} ${className}`}
          style={{ background: light, borderColor: color, color: '#422006', ...style }}>
          {children}
        </button>
      );

    const Coin = ({ s = 26 }) => <svg viewBox="0 0 40 40" width={s} height={s} className="inline-block align-middle"><circle cx="20" cy="20" r="16" fill="#facc15" stroke="#a16207" strokeWidth="3" /><circle cx="20" cy="20" r="10" fill="none" stroke="#ca8a04" strokeWidth="2" /><text x="20" y="26" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#a16207">ぶ</text></svg>;
    // ざいりょうの かず（コインは coin）
    function Cost({ cost, p, size = 'text-lg' }) {
      return <span className={`inline-flex flex-wrap gap-x-2 gap-y-0.5 items-center font-bold ${size}`}>{Object.entries(cost).map(([k, v]) => {
        const short = p && haveOf(p, k) < v;
        return <span key={k} className={`inline-flex items-center ${short ? 'text-rose-600' : ''}`}>{k === 'coin' ? <Coin s={20} /> : MAT[k].e}{v}</span>;
      })}</span>;
    }
    function GetFly({ fx }) {
      if (!fx) return null;
      return <div key={fx.k} className="coinfly fixed right-48 top-14 z-40 text-3xl pointer-events-none font-bold text-amber-600 flex items-center gap-2 bg-white/80 rounded-full px-3"><Coin s={30} />＋{fx.coin} {fx.mat ? <span>{MAT[fx.mat].e}＋1</span> : null}</div>;

    function Seikai({ show }) {
      if (!show) return null;
      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center pointer-events-none">
          <div className="confetti absolute inset-x-0 top-24 h-80">
            {['⭐', '✨', '🎉', '⭐', '✨', '🌟', '⭐', '✨'].map((e, i) => <span key={i} className="text-4xl" style={{ left: `${8 + i * 11}%`, animationDelay: `${(i % 4) * 0.12}s` }}>{e}</span>)}
          </div>
          <div className="pop win px-12 py-4 text-6xl font-bold" style={{ textShadow: '3px 3px 0 #b45309' }}>せいかい！</div>
        </div>
      );
    }

    // メッセージの まど（ちょうろうの セリフが 1もじずつ でる）
    function MsgWin({ size = 96, compact = false }) {
      const talk = useTalk();
      const [n, setN] = useState(0);
      const text = talk.text || '';
      useEffect(() => {
        setN(0);
        if (!text) return;
        let i = 0;
        const t = setInterval(() => { i += 1; setN(i); if (i >= text.length) clearInterval(t); }, 38);
        return () => clearInterval(t);
      }, [talk.k]);
      return (
        <div className="flex items-end gap-2 w-full">
          <button onClick={() => talk.repeat()} className="shrink-0 active:scale-95 transition" aria-label="もういちど きく">
            <Chorou mood={talk.mood} size={size} className={talk.talking ? 'bob' : ''} />
          </button>
          <div onClick={() => setN(text.length)} className={`win flex-1 px-5 ${compact ? 'py-1.5 text-xl min-h-[54px]' : 'py-3 text-2xl min-h-[84px]'} font-bold leading-relaxed`}>
            <span className={n >= text.length && text ? 'caret' : ''}>{text.slice(0, n) || '　'}</span>
          </div>
          <button onClick={() => talk.repeat()} className={`btn3d shrink-0 bg-white border-2 border-amber-900 text-amber-950 rounded-2xl px-3 ${compact ? 'py-1 text-base' : 'py-2 text-lg'} font-bold`}>🔊<br />もういちど</button>
        </div>
      );
    }

    // ことばの カード
    function Card({ c, color, small, className = '', style, ...rest }) {
      const t = color ? TAG[c.g] || PLAIN : PLAIN;
      return <div className={`card ${small ? 'small' : ''} ${className}`} style={{ background: t.bg, borderColor: t.bd, color: '#1c1917', ...style }} {...rest}>{c.t}</div>;
    }
    // れいの ぶん（ちいさい カードで ならべて みせる）
    function Example({ id, tate, color = true }) {
      const cards = prep(id).cards;
      return (
        <div className={`${tate ? 'tate' : 'yoko'} flow mini h-full`}>
          {cards.map((c, i) => <Card key={i} c={c} color={color} small={isSmall(c.g)} style={{ cursor: 'default', boxShadow: 'none' }} />)}
        </div>
      );
    }

    // =====================================================================
    //  8. もんだい：カードを ならべて ぶんを つくる
    // =====================================================================
    // ヒント①の ことば（つぎに いれる ますの カードに あわせて きく）
    const JOSHI_Q = { 'は': '「だれは？」「なには？」', 'が': '「だれが？」「なにが？」', 'を': '「なにを？」', 'に': '「どこに？」「だれに？」', 'で': '「どこで？」「なにで？」', 'へ': '「どこへ？」', 'と': '「だれと？」', 'から': '「どこから？」', 'まで': '「どこまで？」' };
    function askFor(P, target, k) {
      const tag = (t) => P.tagOf[t];
      const t = target[k], g = tag(t), prev = target[k - 1], next = target[k + 1];
      if (g === 'j' || g === 'l') return prev ? `「${prev}」の あとに つく、ちいさい ことばは どれかな？` : 'ちいさい ことばは どれかな？';
      if (g === 'c') return 'まえの ぶんと、あとの ぶんを つなぐ ことばを さがそう。';
      if (g === 'v') {
        if (/(です|らしい)。$/.test(t)) return 'おわりは「なんだ」に あたる ことばだよ。';
        if (/、$/.test(t)) return '「どう した」の ことばで、ぶんを いったん くぎろう。';
        return 'おわりは「どう した」「どんなだ」の ことばだよ。';
      }
      if (g === 'a') return next ? `「どんな ${next}？」の ことばを さがそう。` : '「どんな？」の ことばを さがそう。';
      if (g === 'd') return '「どのくらい？」「どんなふうに？」の ことばを さがそう。';
      if (g === 't') return '「いつ？」の ことばを さがそう。';
      if (next === 'の') return '「だれの？」「なんの？」の ことばを さがそう。';
      if (next === 'と' && tag(next) === 'l') return '「なにと なにが？」の ことばを さがそう。';
      let j = k + 1;
      while (j < target.length && tag(target[j]) !== 'j' && tag(target[j]) !== 'v') j++;
      const pt = target[j];
      if (tag(pt) !== 'j') return '「なんだ？」に あたる ことばを さがそう。';
      return `${JOSHI_Q[pt] || '「なに？」'}に あたる ことばを さがそう。`;
    }
    // まちがえた ときの こえかけ（いちばん はじめに ちがって いる ますに あわせる）
    function missWord(P, placed, target, imiOk) {
      if (imiOk) return 'いみは つうじるね！ でも、よく つかう ならびかたに して みよう。「だれが」から はじめると いいよ。';
      const k = placed.findIndex((t, i) => t !== target[i]);
      if (k < 0) return 'もう いちど よく みて みよう。';
      const need = target[k], got = placed[k], gN = P.tagOf[need], gG = P.tagOf[got];
      if (gN === 'j' || gN === 'l') return `ちいさい カードの ばしょが ちがうよ。「${target[k - 1] || ''}」の あとに くるのは どれかな？`;
      if (gG === 'j' || gG === 'l') return `「${got}」は ちいさい カードだね。ことばの すぐ あとに つけよう。`;
      if (gN === 'v' || gG === 'v') return 'ぶんの おわりには「どう した」「なんだ」の ことばが くるよ。';
      if (gN === 'a') return `「${need}」は「${target[k + 1]}」の ようすを あらわす ことばだよ。「${target[k + 1]}」の すぐ まえに つけよう。`;
      if (gG === 'a') return `「${got}」は、ようすを あらわす ことばだよ。なにの ようすかな？`;
      if (gN === 'd' || gG === 'd') return '「どのくらい」「どんなふうに」の ことばは、うごきの ことばの まえに つけよう。';
      if (k === 0) return 'えを よく みよう。はじめには「だれが」「なにが」に あたる ことばが くるよ。';
      return 'えを よく みて、「だれが」「なにを」「どこで」を かんがえよう。';
    }

    function SentenceQ({ b, first, ctx }) {
      const talk = useTalk();
      const S = useContext(SetCtx);
      const P = useMemo(() => prep(b.id), [b.id]);
      const okList = S.free ? P.okFree : P.okNormal;
      const n = P.cards.length;
      const [tray, setTray] = useState(() => {
        let o;
        do { o = shuffle(P.cards.map((_, i) => i)); } while (n > 1 && K.isOk(o.map(i => P.cards[i].t), P.okFree));
        return o;
      });
      const [slots, setSlots] = useState(() => Array(n).fill(null));
      const [locked, setLocked] = useState(() => Array(n).fill(false));
      const [shakeK, setShakeK] = useState(0);
      const [busy, setBusy] = useState(false);
      const [done, setDone] = useState(false);
      const [reading, setReading] = useState(false); // こえに だして よもう
      const [ghost, setGhost] = useState(null);
      const [over, setOver] = useState(-1);
      const [miss, setMiss] = useState(0);
      const [hint, setHint] = useState(0);
      const [maxHint, setMaxHint] = useState(0);
      const [glow2, setGlow2] = useState(null); // ヒント②で ひからせる カード
      const types = useRef([]), picks = useRef([]), joshi = useRef([]);
      const drag = useRef(null);
      const placed = slots.map(i => (i == null ? null : P.cards[i].t));
      const full = slots.every(i => i != null);
      const showColor = S.color || maxHint >= 2 || done;
      const tate = S.tate;
      // のこした（ロックした）カードと あう 正解の なかから、いちばん にて いる ものを めあてに する
      const cands = (pl, lk) => { const c = okList.filter(o => lk.every((l, i) => !l || o[i] === pl[i])); return c.length ? c : okList; };
      const target = useMemo(() => K.closest(placed, cands(placed, locked)), [slots.join(','), locked.join(',')]);
      const nextK = placed.findIndex((t, i) => t !== target[i]);
      // ヒント③：つぎに いれる カード
      const want = hint >= 3 && !done && nextK >= 0 ? target[nextK] : null;
      const wantCard = want == null ? null : (tray.find(i => P.cards[i].t === want) ?? slots.find((ci, si) => ci != null && P.cards[ci].t === want && !locked[si] && placed[si] !== target[si]));

      useEffect(() => {
        const intro = first ? (ctx.newbie ? `カードを おすと、${tate ? 'うえ' : 'ひだり'}から じゅんに ますに はいるよ。えを みて、ぶんを つくろう。` : `${ctx.person.name}の ぶんを もとに もどそう！ えを みて ならべてね。`) : pick(['つぎの ぶんだよ。えを みて ならべよう。', 'つぎの ぶんだよ。', 'よし、つぎも がんばろう！']);
        talk.say(intro);
      }, []);

      const sayCard = (ci) => { if (ci != null) Speech.say(cardSay(P.cards[ci].t)); };
      const place = (ci, si) => {
        if (busy || done) return;
        const sl = [...slots], tr = tray.filter(x => x !== ci);
        const from = sl.indexOf(ci);
        if (si == null) si = sl.findIndex(x => x == null);
        if (si < 0 || locked[si]) return;
        const old = sl[si];
        if (from >= 0) { sl[from] = old; } else if (old != null) tr.push(old);
        sl[si] = ci;
        setSlots(sl); setTray(tr); Sound.put(); sayCard(ci);
      };
      const unplace = (si) => {
        if (busy || done || locked[si] || slots[si] == null) return;
        const ci = slots[si]; const sl = [...slots]; sl[si] = null;
        setSlots(sl); setTray([...tray, ci]); Sound.tap();
      };
      const clearAll = () => {
        if (busy || done) return;
        const back = slots.filter((ci, si) => ci != null && !locked[si]);
        setSlots(slots.map((ci, si) => (locked[si] ? ci : null))); setTray([...tray, ...back]); Sound.tap();
      };

      // ドラッグ（ゆびで うごかす）。うごかさずに はなすと「タップ」
      const onDown = (e, from) => {
        if (busy || done) return;
        e.preventDefault();
        drag.current = { from, x0: e.clientX, y0: e.clientY, moved: false };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      };
      const findDrop = (x, y) => {
        const el = document.elementFromPoint(x, y);
        const s = el && el.closest('[data-slot]');
        if (s) return { slot: Number(s.dataset.slot) };
        if (el && el.closest('[data-tray]')) return { tray: true };
        return null;
      };
      const onMove = (e) => {
        const d = drag.current; if (!d) return;
        if (!d.moved && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) > 10) d.moved = true;
        if (d.moved) { setGhost({ x: e.clientX, y: e.clientY, ci: d.from.ci }); const t = findDrop(e.clientX, e.clientY); setOver(t && t.slot != null ? t.slot : -1); }
      };
      const onUp = (e) => {
        const d = drag.current; drag.current = null; setGhost(null); setOver(-1);
        if (!d) return;
        if (!d.moved) { if (d.from.slot != null) unplace(d.from.slot); else place(d.from.ci, null); return; }
        const t = findDrop(e.clientX, e.clientY);
        if (t && t.slot != null) place(d.from.ci, t.slot);
        else if (t && t.tray && d.from.slot != null) unplace(d.from.slot);
      };
      const handlers = (from) => ({ onPointerDown: (e) => onDown(e, from), onPointerMove: onMove, onPointerUp: onUp, onPointerCancel: () => { drag.current = null; setGhost(null); setOver(-1); } });

      const doHint = (lv) => {
        const tg = K.closest(placed, cands(placed, locked));
        const k = Math.max(0, placed.findIndex((t, i) => t !== tg[i]));
        if (lv === 1) talk.say(askFor(P, tg, k), { mood: 'think' });
        if (lv === 2) {
          const ci = tray.find(i => P.cards[i].t === tg[k]);
          setGlow2(ci ?? null);
          talk.say('カードに いろを つけたよ。ひかって いる カードから ならべて みよう。', { mood: 'think' });
        }
        if (lv === 3) talk.say('ひかって いる カードを、ひかって いる ますに いれよう。', { mood: 'happy' });
      };
      const upHint = () => { const lv = Math.min(3, hint + 1); setHint(lv); setMaxHint(x => Math.max(x, lv)); doHint(lv); };

      const check = async () => {
        if (!full || busy || done) return;
        if (K.isOk(placed, okList)) {
          setBusy(true); setDone(true); setGlow2(null);
          let say = `「${sentSay(placed)}」`;
          if (S.free && !K.isOk(placed, P.okNormal)) say += ` よく つかう ならびかたは「${P.say}」だよ。`;
          await ctx.celebrate(say);
          if (S.ondoku) {
            setReading(true);
            await talk.say('こえに だして よもう！ よめたら「よんだよ」を おしてね。', { mood: 'happy' });
            return;
          }
          finish();
          return;
        }
        // まちがい：ちがう ますの カードだけ もどす
        const imiOk = !S.free && K.isOk(placed, P.okFree);
        const tg = K.closest(placed, cands(placed, locked));
        const cl = K.classify(placed, tg, P.tagOf);
        types.current.push(...(imiOk ? [K.MT.imi] : cl.types));
        joshi.current.push(...cl.joshi);
        picks.current.push(placed.join(' '));
        const keep = placed.map((t, i) => t === tg[i]);
        const back = slots.filter((ci, si) => !keep[si]);
        setLocked(keep);
        setSlots(slots.map((ci, si) => (keep[si] ? ci : null)));
        setTray([...tray, ...back]);
        setShakeK(x => x + 1);
        Sound.retry(); ctx.onMiss();
        const m = miss + 1; setMiss(m);
        if (m >= 3) { setHint(3); setMaxHint(3); talk.say(missWord(P, placed, tg, imiOk) + ' ひかって いる カードを いれて みよう。', { mood: 'think' }); }
        else talk.say(missWord(P, placed, tg, imiOk), { mood: 'think' });
      };
      const finish = () => {
        setReading(false);
        ctx.done({ miss, hint: maxHint, types: uniq(types.current), picks: picks.current, joshi: uniq(joshi.current), answer: placed });
      };
      const readCards = async () => {
        for (const ci of tray) { await new Promise(r => Speech.say(cardSay(P.cards[ci].t), r)); await wait(150); }
      };

      const tagsHere = uniq(P.cards.map(c => (c.g === 'l' ? 'j' : c.g)));
      const boardH = tate ? 'h-[19rem]' : 'min-h-[9rem]';
      return (
        <div className="flex-1 flex flex-col gap-2 min-w-0">
          <div className={`flex gap-2 min-w-0 ${tate ? 'flex-row' : 'flex-col'}`}>
            {/* こたえの ます */}
            <div key={shakeK} className={`relative win-light paper p-3 flex-1 min-w-0 ${shakeK && !done ? 'shake' : ''} ${done ? 'ring-8 ring-yellow-300' : ''}`}>
              <div className={`${tate ? 'tate ml-auto' : 'yoko'} flow ${boardH}`} style={tate ? { maxInlineSize: '19rem', maxWidth: '100%' } : null}>
                {slots.map((ci, si) => {
                  const c = ci != null ? P.cards[ci] : null;
                  const wantSlot = hint >= 3 && !done && si === nextK;
                  return (
                    <div key={si} data-slot={si} className={`slot ${c ? 'filled' : ''} ${over === si ? 'over' : ''} ${wantSlot && !c ? 'glow' : ''}`}>
                      {!c && <span className="num">{si + 1}</span>}
                      {c && <Card c={c} color={showColor} small={isSmall(c.g)} {...handlers({ ci, slot: si })}
                        className={`${locked[si] ? 'lock-ok' : ''} ${done ? 'pop' : ''} ${wantCard === ci && !locked[si] ? 'glow' : ''}`} style={done ? { boxShadow: '0 0 0 3px #facc15, 0 4px 0 rgba(0,0,0,.2)' } : null} />}
                    </div>
                  );
                })}
              </div>
            </div>
            {/* カードの おきば */}
            <div data-tray="1" className={`rounded-2xl border-4 border-dashed border-amber-300 bg-amber-50/80 p-3 ${tate ? 'flex-1 min-w-0 flex justify-end' : ''}`}>
              <div className={`${tate ? 'tate' : 'yoko'} flow ${tate ? 'h-[19rem]' : 'min-h-[4.5rem] justify-center'}`} style={tate ? { maxWidth: '100%' } : null}>

    function BattleField({ area, look, mon, shown, hp, max, hit, missFx, end, bubble }) {
      const wand = look && look.wand && ITEM[look.wand];
      const fx = wand ? wand.fx : '✨';
      return (
        <Bg file={`area_${area.id}.webp`} fallback={<AreaBg a={area} />} className="w-full rounded-2xl border-4 border-amber-900 shrink-0" style={{ height: 200 }}>
          <div className="absolute inset-x-0 bottom-0 h-1/3" style={{ background: 'linear-gradient(transparent, rgba(0,0,0,.18))' }} />
          <div className="absolute bottom-1 left-1"><Hero look={look} size={112} /></div>
          {mon && shown && (
            <div className={`absolute right-3 top-2 flex flex-col items-center ${end === 'win' ? 'defeat' : 'warpin'}`}>
              <div className="bg-stone-900/80 rounded-full px-2 py-0.5 mb-1 flex flex-col items-center">
                <span className="font-bold text-white text-sm whitespace-nowrap">{mon.boss ? '👑 ' : ''}{mon.name}</span>
                <span className="flex gap-0.5">{Array.from({ length: max }, (_, k) => <span key={k} className={`inline-block rounded-sm ${k < hp ? 'bg-rose-400' : 'bg-stone-500'}`} style={{ width: max > 6 ? 9 : 14, height: 10 }} />)}</span>
              </div>
              <div key={'h' + hit + 'm' + missFx} className={hit ? 'hurt' : missFx ? 'dodge' : ''}><Monster m={mon} size={mon.boss ? 112 : 96} className={end ? '' : 'bob'} /></div>
            </div>
          )}
          {hit > 0 && <div key={'s' + hit} className="absolute magic text-6xl" style={{ left: 70, bottom: 60, '--mx': '170px', '--my': '-90px' }}>{fx}</div>}
          {hit > 0 && <div key={'d' + hit} className="absolute dmg text-3xl font-bold" style={{ right: 30, top: 70, color: '#7c3aed', textShadow: '2px 2px 0 #fff, -2px -2px 0 #fff' }}>ことばの まほう！</div>}
          {missFx > 0 && !end && <div key={'m' + missFx} className="absolute dmg text-2xl font-bold text-white bg-stone-900/75 rounded-xl px-3" style={{ right: 20, top: 90 }}>ばらばら〜！</div>}
          {bubble && <div key={bubble.k} className="absolute pop bg-white rounded-xl border-[3px] border-stone-800 px-2 py-0.5 text-sm font-bold leading-snug" style={{ left: 6, top: 6, maxWidth: '46%' }}>{bubble.t}</div>}
        </Bg>
      );
    }

    function Practice({ st, n, intro, progress, onRecord, onCorrect, onSave, onFinish, onQuit }) {
      const talk = useTalk();
      const S = useContext(SetCtx);
      const problems = useMemo(() => buildProblems(st, n, progress), []);
      const [i, setI] = useState(-1);
      const [seikai, setSeikai] = useState(0);
      const stats = useRef({ ok: 0, all: 0, coins: 0, mats: {}, weak: {} });
      const t0 = useRef(Date.now());
      const alive = useRef(true);
      const area = AREA[st.a];
      const person = personOf(st.a);
      const mon = useMemo(() => monsterOf(st), []);
      const [hp, setHp] = useState(problems.length);
      const [hit, setHit] = useState(0);
      const [shown, setShown] = useState(false);
      const [missFx, setMissFx] = useState(0);
      const [end, setEnd] = useState(null);
      const [bubble, setBubble] = useState(null);
      const monSay = (t) => new Promise(res => {
        const k = uid();
        setBubble({ t, k });
        setTimeout(() => { if (alive.current) setBubble(b => (b && b.k === k ? null : b)); }, 3500);
        const pitch = Speech.pitch; Speech.pitch = 0.6; Speech.say(fmtSpeech(t), res); Speech.pitch = pitch;
      });
      useEffect(() => () => { alive.current = false; }, []);
      useEffect(() => {
        (async () => {
          await talk.say(intro || `${area.name}で ${mon.name}が まって いるよ。${area.topic}の ぶんを つくって、ことばの まほうで やっつけよう！`, { mood: 'happy' });
          if (alive.current) {
            setShown(true); Sound.pyu(); await wait(450);
            await monSay(`「${mon.hello}」`); await wait(200);
          }
          if (alive.current) { t0.current = Date.now(); setI(0); }
        })();
      }, []);
      const ctx = {
        person, newbie: (progress.exp || 0) < 3,
        onMiss: () => setMissFx(x => x + 1),
        celebrate: async (text) => {
          setSeikai(x => x + 1); Sound.seikai();
          const got = onCorrect(st.a); stats.current.coins += got.coin; stats.current.mats[got.mat] = (stats.current.mats[got.mat] || 0) + 1;
          await talk.say(text, { mood: 'happy', speech: text.replace(/ /g, '') });
          if (alive.current) setSeikai(0);
        },
        done: (res) => {
          if (!alive.current) return;
          const b = problems[i];
          const result = res.miss || res.hint ? '△' : '○';
          stats.current.all++; if (result === '○') stats.current.ok++;
          stats.current.weak[b.id] = (stats.current.weak[b.id] || 0) + (result === '○' ? -1 : 1);
          onRecord({
            stage: st.id, area: area.name, bun: b.id, answer: prep(b.id).text, result,
            miss: res.miss || 0, hint: res.hint || 0, types: (res.types || []).join('・'), picks: (res.picks || []).join(' ／ '),
            joshi: (res.joshi || []).join('・'), cards: prep(b.id).cards.length, secs: Math.round((Date.now() - t0.current) / 100) / 10,
          });
          t0.current = Date.now();
          setHit(x => x + 1); Sound.magic(); setTimeout(() => Sound.hit(), 350);
          setHp(h => Math.max(0, h - 1));
          if (i + 1 >= problems.length) {
            setI(problems.length);
            (async () => {
              await wait(900);
              if (!alive.current) return;
              setEnd('win'); Sound.defeat();
              await monSay('「ぶんが もとに もどっちゃった〜！ おぼえてろ〜！」');
              await wait(500);
              if (alive.current) onFinish({ ...stats.current, n: problems.length, monster: mon.id });
            })();
            return;
          }
          // ボスは とちゅうから に しない
          if (!st.boss) onSave({ st: st.id, left: problems.length - i - 1 }, stats.current.weak);
          setTimeout(() => { if (alive.current) setI(i + 1); }, 700);
        },
      };
      const b = problems[i];
      return (
        <div className="w-full max-w-[1400px] flex flex-col gap-2 px-2">
          <MsgWin size={56} compact />
          <div className="flex items-center gap-3 w-full">
            <div className="text-lg font-bold bg-white rounded-2xl px-3 py-0.5 border-2 border-amber-900 shrink-0">{area.icon} {area.name}　{stageLabel(st)}</div>
            <div className="text-lg font-bold text-amber-800 truncate">{area.topic}</div>
            <div className="flex-1 text-xl font-bold text-stone-600 text-right">{Math.min(problems.length, Math.max(0, i) + 1)} / {problems.length}もん</div>
            <button onClick={onQuit} className="btn3d bg-white border-2 border-stone-300 rounded-2xl px-3 py-1 text-lg font-bold shrink-0">✋ やめる</button>
          </div>
          <div className="flex gap-3 items-start">
            <div className="w-[300px] shrink-0 flex flex-col gap-2">
              <BattleField area={area} look={progress.look} mon={mon} shown={shown} hp={hp} max={problems.length} hit={hit} missFx={missFx} end={end} bubble={bubble} />
              {b && <div key={b.id} className="pop win-light p-2 flex flex-col items-center">
                <div className="text-sm font-bold text-amber-800">{person.e} {person.name}の ぶん</div>
                <Pic file={b.img ? `bun_${b.id}.webp` : null} size={130} fallback={<div className="py-1 text-center" style={{ fontSize: 60, lineHeight: 1.15 }}>{b.e}</div>} />
              </div>}
            </div>
            {b && <SentenceQ key={i} b={b} first={i === 0} ctx={ctx} />}
            {!b && <div className="flex-1 flex items-center justify-center text-4xl font-bold text-amber-800 h-[19rem]">{i < 0 ? '⚔️' : '✨'}</div>}
          </div>
          <Seikai show={seikai} />
        </div>
      );
    }

              <span className="flex items-center gap-1"><Coin s={36} />＋{r.coins + (r.bonus || 0)}</span>
              {mats.map(([k, v]) => <span key={k}>{MAT[k].e}＋{v}</span>)}
            </div>
            {r.newPerson && <div className="flex items-center gap-3 bg-white text-amber-950 rounded-2xl px-4 py-1 pop"><span className="text-5xl hop">{PERSON[r.newPerson].e}</span><div className="text-2xl font-bold">{PERSON[r.newPerson].name}が まちに ひっこして くる！</div></div>}
            {r.levelUp && <div className="text-3xl font-bold text-yellow-300 pop">🆙 レベル {r.level} に なった！</div>}
            {r.newTitle && <div className="text-2xl font-bold bg-amber-100 text-amber-800 rounded-2xl px-4 py-2 flex items-center gap-2"><Hero look={progress.look} size={56} /> 🎖️ しょうごう「{r.newTitle}」</div>}
            {r.newBlds.length > 0 && <div className="text-2xl font-bold text-emerald-300 pop">🏗️ あたらしい たてもの：{r.newBlds.map(id => `${BLD[id].e} ${BLD[id].n}`).join('　')}</div>}
            {r.townUp && <div className="text-2xl font-bold text-sky-300 pop">🗺️ まちの とちが ひろがった！</div>}

          <div className="flex flex-wrap gap-4 justify-center">

            fallback={<><LandSvg /><svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 w-full h-full pointer-events-none">

                  <button onClick={() => op && onArea(a)} disabled={!op}

    // エリア（3つの たたかい）

      const person = personOf(a.id);
      const saved = progress.people.includes(person.id);
      useEffect(() => { talk.say(`${a.intro} ${saved ? '' : person.name + 'が こまって いるよ。'}`); }, []);
      const mons = D.MONSTERS.filter(m => m.a === a.id);
      const cur = currentStage(progress);
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">

            <div className="flex items-end justify-between h-full p-3 gap-3">
              <div className="win px-4 py-2"><div className="text-3xl font-bold">{a.icon} {a.name}</div><div className="text-lg text-amber-200">{a.topic}</div></div>
              <div className="flex items-end gap-2 bg-white/85 rounded-2xl border-2 border-amber-900 px-3 py-1">
                <span className="text-6xl">{person.e}</span>
                <div className="text-base font-bold max-w-[16rem] leading-snug">{person.name}<br /><span className="text-amber-800">{saved ? 'まちに すんで いるよ' : `「${person.help}」`}</span></div>
              </div>
            </div>
          </Bg>
          <div className="win-light px-3 py-2 w-full flex items-center gap-4">
            <div className="text-xl font-bold shrink-0">れい</div>

          </div>
          <div className="grid grid-cols-3 gap-3 w-full">

                <button key={s} onClick={() => open && onStage(st)} disabled={!open}
                  className={`btn3d relative rounded-3xl border-4 flex items-center justify-center gap-2 py-1 ${clear ? 'bg-yellow-50 border-amber-400' : open ? 'bg-white border-amber-800' : 'bg-stone-200 border-stone-300 opacity-70'} ${now ? 'glow' : ''}`}>
                  <Monster m={m} size={s === 3 ? 84 : 72} className={open ? 'bob' : ''} />
                  <div className="flex flex-col items-start"><div className="text-2xl font-bold">{stageLabel(st)}</div><div className="text-base font-bold text-stone-600">{m.name}</div></div>
                  {!open && <div className="absolute -top-3 -left-2 text-2xl">🔒</div>}
                  {clear && <div className="absolute -top-3 -right-2 text-2xl">⭐</div>}

              );
            })}
          </div>
        </div>

    function StageModal({ st, progress, onStart, onResume, onClose }) {
      const talk = useTalk();
      const S = useContext(SetCtx);
      const a = AREA[st.a], mon = monsterOf(st);
      useEffect(() => { talk.say(`${mon.name}が あいてだよ。${a.topic}の ぶんを つくろう。`); }, []);
      const part = progress.part && progress.part.st === st.id ? progress.part : null;
      return (
        <div className="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4" onClick={onClose}>
          <div className="win p-5 flex flex-col items-center gap-4 pop max-w-3xl w-full" onClick={e => e.stopPropagation()}>
            <div className="text-lg font-bold text-amber-200">{a.icon} {a.name}</div>
            <div className="text-4xl font-bold">{stageLabel(st)}：{mon.name}</div>
            <div className="flex items-center gap-4 bg-white text-amber-950 rounded-2xl px-4 py-2"><Monster m={mon} size={90} /><div className="text-2xl font-bold leading-relaxed">{a.topic}<br /><span className="text-lg">{Number(part ? part.left : S.count)}もん ならべると かち！</span></div></div>

            <div className="flex gap-3 flex-wrap justify-center">

              <Btn onClick={onStart} color="#15803d" light="#dcfce7" className="text-3xl px-8">{part ? 'はじめから' : '▶ はじめる'}</Btn>
              <Btn onClick={onClose} color="#57534e" light="#f5f5f4">とじる</Btn>
            </div>
          </div>
        </div>
      );
