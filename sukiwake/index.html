<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ペラリさんの すきの わけ テレビきょく</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'BIZ UDPGothic', sans-serif; background: #ecfdf5; margin: 0; color: #1e293b;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .btn3d { border-bottom-width: 6px; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; }
    .win { background: #fff; border: 4px solid #0f766e; border-radius: 18px; box-shadow: 0 6px 0 rgba(15,118,110,.25); }
    .town { background-color: #bbf7d0; background-image: radial-gradient(circle at 25% 30%, rgba(22,101,52,.12) 0 3px, transparent 4px), radial-gradient(circle at 75% 70%, rgba(22,101,52,.12) 0 3px, transparent 4px); background-size: 46px 46px; }
    .pop { animation: pop .45s cubic-bezier(.17,.89,.32,1.28) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floaty { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .bob { animation: bob 1.2s steps(2) infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .shake { animation: shake .45s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-9px); } 40%,80% { transform: translateX(9px); } }
    .glow { animation: glow 1.1s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 14px rgba(250,204,21,0); } }
    .fly { animation: fly 1.4s ease-out forwards; }
    @keyframes fly { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { transform: translateY(-90px) scale(1); opacity: 0; } }
    .bump { animation: bump .5s; }
    @keyframes bump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.35); } }
    .confetti span { position: absolute; animation: fall 1.6s ease-in forwards; }
    @keyframes fall { from { transform: translateY(-40px) rotate(0); opacity: 1; } to { transform: translateY(260px) rotate(320deg); opacity: 0; } }
    .onair { animation: onair 1s steps(2) infinite; }
    @keyframes onair { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .caret { display: inline-block; width: 3px; height: 1.1em; background: #0f766e; vertical-align: -0.15em; margin-left: 2px; animation: onair 1s steps(2) infinite; }
    .tri:after { content: '▼'; display: inline-block; margin-left: 6px; font-size: .7em; animation: floaty 1s infinite; }
    .chara-img { filter: drop-shadow(0 4px 4px rgba(0,0,0,.2)); }
    /* りゆうの カード */
    .rcard { position: relative; display: inline-flex; align-items: center; justify-content: center; border: 3px solid; border-radius: 14px;
      min-height: 3.6rem; min-width: 10.5rem; padding: .45rem .9rem .3rem; font-size: 1.75rem; font-weight: 700; line-height: 1.2; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
    .rcard .kind { position: absolute; top: -.75rem; left: .5rem; white-space: nowrap; font-size: .8rem; background: #fff; border: 2px solid; border-radius: 99px; padding: 0 .45rem; line-height: 1.35; }
    .slot { display: inline-flex; align-items: center; justify-content: center; min-width: 5.5rem; min-height: 3.6rem; border: 3px dashed #14b8a6; border-radius: 14px; background: #f0fdfa; padding: 0 .5rem; }
    .sent { font-size: 2rem; font-weight: 700; line-height: 1.9; }
    .wsent .sent { font-size: 1.6rem; line-height: 1.6; }
    .kkey { width: 2.75rem; height: 2.75rem; font-size: 1.45rem; font-weight: 700; border-radius: 12px; border: 2px solid #94a3b8; background: #fff; border-bottom-width: 5px; }
    .kkey:active { transform: translateY(3px); border-bottom-width: 2px; }
    .kkey.fn { background: #f1f5f9; font-size: 1.1rem; }
    #printarea { display: none; }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: #fff !important; }
      #root { display: none !important; }
      #printarea { display: block !important; }
      .pcard { break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .ppage { break-after: page; }
      .ppage:last-child { break-after: auto; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#0f766e;font-weight:bold;">じゅんび ちゅう…</div>
  </div>
  <div id="printarea"></div>

  <!-- データと 絵は GitHub Pages から読みこみます（このファイルを短くするため） -->
  <script>
    (function () {
      var h = location.hostname;
      var local = location.protocol === 'file:' || /github\.io$/.test(h) || h === 'localhost' || h === '127.0.0.1';
      window.SUKI_BASE = local ? '' : 'https://zku0395-ops.github.io/hori/sukiwake/';
      var V = '1';
      var load = function (f) {
        return new Promise(function (ok, ng) {
          var s = document.createElement('script');
          s.src = window.SUKI_BASE + f + '?v=' + V;
          s.onload = ok; s.onerror = function () { ng(new Error(f)); };
          document.head.appendChild(s);
        });
      };
      window.SUKI_READY = Promise.all([load('data/sukiwake.js'), load('data/img.js')]);
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;
    const APP_VERSION = '1.0.6';
    const BASE = window.SUKI_BASE;
    const IMG = BASE + 'img/';

    // =====================================================================
    //  1. 小さな道具
    // =====================================================================
    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const nowStr = () => {
      const d = new Date(), p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const safeStore = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
    };
    const downloadText = (name, text, type) => {
      const blob = new Blob([text], { type: type || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    };

    // =====================================================================
    //  2. こえ と おと
    // =====================================================================
    const Speech = {
      rate: 0.8, pitch: 1.15, voice: null,
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(String(text));
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = this.pitch;
          let done = false;
          const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
          u.onend = end; u.onerror = end;
          // 声が出ない端末でも先へ進めるように、長さに合わせて待つ
          setTimeout(end, 1500 + String(text).length * 230 / this.rate);
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() { try { this.ok && window.speechSynthesis.cancel(); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }

    // このアプリのための オリジナルの おと
    const Sound = {
      on: true, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      tone(freq, at, dur, type = 'square', vol = 0.06) {
        const c = this.get(); if (!c || !this.on) return;
        const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      seikai() { [[784, 0], [988, .09], [1319, .18]].forEach(([f, t]) => this.tone(f, t, .14, 'square', .05)); this.tone(1568, .3, .35, 'triangle', .1); },
      fanfare() {
        [[523, 0], [659, .14], [784, .28], [1047, .42], [988, .7], [1047, .84], [1319, 1.0]].forEach(([f, t]) => this.tone(f, t, .16, 'square', .055));
        [262, 330, 392, 523].forEach(f => this.tone(f, 1.0, 1.0, 'triangle', .07));
      },
      clap() { for (let i = 0; i < 10; i++) this.tone(1800 + Math.random() * 900, i * .07, .04, 'square', .02); },
      retry() { this.tone(330, 0, .12, 'sine', .06); this.tone(294, .11, .18, 'sine', .06); }, // まちがえた とき（小さな おと）
      tap() { this.tone(880, 0, .05, 'square', .035); },
      put() { this.tone(660, 0, .05, 'triangle', .07); this.tone(990, .05, .06, 'triangle', .05); },
      heart() { this.tone(988, 0, .07, 'triangle', .07); this.tone(1319, .07, .2, 'triangle', .07); },
      key() { this.tone(1200, 0, .03, 'triangle', .04); },
    };

    // =====================================================================
    //  3. データ（data/sukiwake.js から）
    // =====================================================================
    let D = null, PLACE = {}, ITEM = {}, CARD = {}, KIND = {}, SHOP_ITEM = {}, IMG_OK = new Set(), CARD_BY_LEN = [];

    // ステージ（id は 記録に つかうので かえない）
    const STAGES = [
      { id: '0', no: '⓪', name: '「すきです」の ぶん', type: 'order', n: 5, desc: 'ことばを ならべて「〇〇が すきです。」を つくる' },
      { id: '1', no: '①', name: 'りゆうの カード', type: 'card1', n: 5, desc: 'すきな りゆうを カードから 1まい えらぶ' },
      { id: '2', no: '②', name: 'ぶんの おわり', type: 'ending', n: 5, desc: '「からです」と「だからです」を えらぶ' },
      { id: '3', no: '③', name: 'カード 2まい', type: 'card2', n: 3, desc: 'りゆうの カードを 2まい つなぐ' },
      { id: '4', no: '④', name: 'じぶんで かく', type: 'write', n: 3, blanks: ['そのりゆうは、'], desc: 'りゆうを じぶんで かく' },
      { id: '5', no: '⑤', name: 'まとめ', type: 'all', n: 3, desc: '2つの ぶんを ぜんぶ じぶんで かく' },
      { id: 'h1', no: 'はってん①', name: 'なぜ すきかと いうと', type: 'write', n: 3, blanks: ['なぜ すきかと いうと、'], hatten: true, desc: '「なぜ すきかと いうと、〜からです。」で かく' },
      { id: 'h2', no: 'はってん②', name: 'りゆうを 2つ', type: 'write', n: 3, blanks: ['そのりゆうは、', 'それに、'], hatten: true, desc: '「それに、」で りゆうを もう 1つ かく' },
    ];
    const STAGE = {}; STAGES.forEach(s => { STAGE[s.id] = s; });
    const MAIN = STAGES.filter(s => !s.hatten);

    // ---- ぶんを つくる ----
    const sent1 = (me, it) => `${me}は、${it.n}が すきです。`;
    const endOf = (c) => c.f === 'na' ? 'dakara' : 'kara';
    const ENDW = { kara: 'からです。', dakara: 'だからです。' };
    // ひらがな・カタカナ
    const toHira = (s) => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    const toKata = (s) => String(s).replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
    const norm = (s) => String(s || '').replace(/[\s　]+/g, '');
    // 「から」「だから」の どちらに なるか（わからない ときは null：どちらでも よい）
    const NA_WORDS = ['すき', 'きらい', 'きれい', 'げんき', 'しずか', 'べんり', 'じょうず', 'ゆうめい', 'にぎやか', 'おしゃれ', 'ふしぎ', 'たいせつ', 'だいじ', 'らく', 'かんたん', 'すてき', 'とくい', 'へいき',
      'さわやか', 'なめらか', 'やわらか', 'まっしろ', 'まっか', 'いっぱい', 'たくさん', 'いろいろ', 'おなじ', 'あんぜん', 'じょうぶ', 'とくべつ', 'しあわせ', 'ハッピー', 'りっぱ', 'まんまる'];
    const VERB_END = /(する|くる|なる|ある|いる|できる|とぶ|はしる|まわる|ひかる|のる|すすむ|およぐ|あそぶ|はねる|もぐる|うごく|でる|とれる|つくる|とる|わかる|いく|ける|げる|せる|ぜる|てる|ねる|へる|べる|める|れる|きる|ぎる|しる|じる|ちる|にる|ひる|びる|みる|りる|む|ぶ|ぐ)$/;
    function expectEnding(raw) {
      const w = norm(raw).replace(/[。、！？!?]+$/, '');
      if (!w) return null;
      const h = toHira(w);
      for (const c of CARD_BY_LEN) if (h.endsWith(c.key)) return endOf(c);
      const last = w.slice(-1);
      if (/[ァ-ヺー]/.test(last)) return 'dakara';
      if (NA_WORDS.some(x => h.endsWith(toHira(x)))) return 'dakara';
      if (h.length >= 4 && /(..)\1$/.test(h)) return 'dakara'; // ふわふわ・きらきら
      if (/た$/.test(h)) return 'kara';
      if (/い$/.test(h)) return /[えけせてねへめれげぜでべぺ]い$/.test(h) ? 'dakara' : 'kara';
      if (VERB_END.test(h)) return 'kara';
      return null;
    }
    // かいた ことばの さいごに「からです」などが あれば とりだす
    function splitEnding(raw) {
      let w = norm(raw).replace(/[。]+$/, '');
      let m = w.match(/^(.*?)(だから|から)(です)?$/);
      if (m && m[1]) return { text: m[1], end: m[2] === 'だから' ? 'dakara' : 'kara' };
      return { text: w, end: null };
    }
    const endRule = (w, need) => need === 'dakara'
      ? `「${w}」の あとは「だからです」に なるよ。「${w}だからです」。`
      : `「${w}」の あとは「からです」だよ。「だ」は いらないね。「${w}からです」。`;
    const missType = (need) => need === 'dakara' ? 'だから→から' : 'から→だから';

    // =====================================================================
    //  4. しんちょく（進み具合）
    // =====================================================================
    const FLAGS = ['unlockAll', 'hatten', 'pc'];
    const newProgress = () => ({ v: 1, t: 0, me: null, heart: 0, earned: 0, cards: {}, items: [], deco: {}, cleared: {}, part: null, welcome: 0,
      unlockAll: false, hatten: false, pc: false });
    function parseProgress(s) {
      let p = null;
      try { p = typeof s === 'string' ? (s ? JSON.parse(s) : null) : s; } catch (e) { p = null; }
      const q = { ...newProgress(), ...(p || {}) };
      if (!Array.isArray(q.items)) q.items = [];
      ['cards', 'deco', 'cleared'].forEach(k => { if (!q[k] || typeof q[k] !== 'object') q[k] = {}; });
      q.heart = Number(q.heart) || 0; q.earned = Number(q.earned) || 0;
      return q;
    }
    const isCleared = (p, id) => !!p.cleared[id];
    const stageOpen = (p, st) => {
      if (st.hatten) return !!(p.hatten || p.unlockAll) && (st.id === 'h1' || p.unlockAll || isCleared(p, 'h1'));
      if (p.unlockAll) return true;
      const i = MAIN.findIndex(s => s.id === st.id);
      return i <= 0 || isCleared(p, MAIN[i - 1].id);
    };
    const currentStage = (p) => MAIN.find(st => stageOpen(p, st) && !isCleared(p, st.id))
      || STAGES.filter(s => s.hatten).find(st => stageOpen(p, st) && !isCleared(p, st.id))
      || MAIN[MAIN.length - 1];
    const cardCount = (p) => Object.keys(p.cards || {}).length;
    const titleOf = (p) => D.TITLES.filter(t => cardCount(p) >= t.c).pop().n;
    const meOf = (p) => p.me || 'わたし';

    // =====================================================================
    //  5. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    const LOG_HEADER = ['日時', 'なまえ', 'ステージ', 'ばしょ', 'もの', 'つくった ぶん', 'けっか', 'まちがい', 'ヒント', 'まちがいの しゅるい', 'えらんだ カード', 'かいた ことば', 'びょう', 'ID'];
    const WRITE_STAGES = ['4', '5', 'h1', 'h2'];
    const DEFAULT_SETTINGS = { rate: 0.8, font: 1, happyo: true, color: true, sound: true };

    // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
    const emptyStu = () => ({ count: 0, ok: 0, secs: 0, last: '', stages: {}, types: {}, wrong: {}, texts: [] });
    function aggregate(rows) {
      const students = {}, classTypes = {}, classWrong = {};
      const inc = (m, k) => { m[k] = (m[k] || 0) + 1; };
      rows.forEach(r => {
        const name = String(r[1] || '').trim(); if (!name) return;
        const s = students[name] || (students[name] = emptyStu());
        const when = String(r[0]), day = when.slice(0, 10);
        if (day > s.last) s.last = day;
        const st = String(r[2]), ok = r[6] === '○' ? 1 : 0, item = String(r[4] || '');
        s.count++; s.ok += ok; s.secs += Number(r[12]) || 0;
        const g = s.stages[st] || (s.stages[st] = [0, 0]);
        g[0]++; g[1] += ok;
        String(r[9] || '').split('・').forEach(k => { if (k) { inc(s.types, k); inc(classTypes, k); } });
        String(r[10] || '').split('・').forEach(k => { if (k.slice(-1) !== '✖') return; const key = `${item}：${k.slice(0, -1)}`; inc(s.wrong, key); inc(classWrong, key); });
        if (WRITE_STAGES.includes(st)) s.texts.push([when, st, item, String(r[5] || ''), String(r[6] || ''), String(r[9] || '')]);
      });
      Object.values(students).forEach(s => { s.texts = s.texts.slice(-80).reverse(); });
      return { students, classTypes, classWrong };
    }

    const Local = {
      key: 'sukiwake_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}
        this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: { ...DEFAULT_SETTINGS } };
        return this.mem;
      },
      save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
    };

    const PENDING_KEY = 'sukiwake_pending_v1';
    const COPY_KEY = (name) => 'sukiwake_copy_' + name;
    const recRow = (stamp, name, r) => [stamp, name, r.stage, r.place, r.item, r.answer, r.result, r.miss, r.hint, r.types, r.picks, r.written, r.secs, r.id];
    const api = {
      async init() {
        if (HAS_GAS) return gas('getInitData');
        const d = Local.data();
        return { students: d.roster, settings: { ...DEFAULT_SETTINGS, ...d.settings }, demo: true };
      },
      async student(name) {
        if (HAS_GAS) return gas('getStudent', name);
        return Local.data().progress[name] || '';
      },
      async sendOne(p) {
        if (HAS_GAS) return gas('saveResult', p);
        const d = Local.data();
        const old = parseProgress(d.progress[p.name]);
        const neu = parseProgress(p.progress);
        if (neu.t >= old.t) d.progress[p.name] = p.progress;
        const ids = new Set(d.log.map(r => r[13]));
        p.records.forEach(r => { if (!ids.has(r.id)) d.log.push(recRow(p.stamp, p.name, r)); });
        Local.save();
        return { ok: true };
      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす
      readQueue() { try { return JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) { return []; } },
      async save(payload) {
        const queue = api.readQueue().filter(q => !(q.name === payload.name && !q.records.length));
        queue.push({ ...payload, qid: uid() });
        safeStore.set(PENDING_KEY, JSON.stringify(queue));
        return api.flush();
      },
      pending() { return api.readQueue().length; },
      flushing: false,
      async flush() {
        if (api.flushing) return;
        api.flushing = true;
        try {
          for (let q = api.readQueue()[0]; q; q = api.readQueue()[0]) {
            await api.sendOne(q);
            safeStore.set(PENDING_KEY, JSON.stringify(api.readQueue().filter(x => x.qid !== q.qid)));
          }
        } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
        finally { api.flushing = false; }
      },
      async teacher(pin) {
        if (HAS_GAS) return gas('getTeacherData', pin);
        const d = Local.data();
        if (String(pin) !== String(d.pin)) return { ok: false };
        const agg = aggregate(d.log);
        return {
          ok: true, isDefaultPin: d.pin === '1234', demo: true, settings: { ...DEFAULT_SETTINGS, ...d.settings },
          students: d.roster.map(n => ({ name: n, progress: d.progress[n] || '', ...(agg.students[n] || emptyStu()) })),
          classTypes: agg.classTypes, classWrong: agg.classWrong,
        };
      },
      async setFlag(pin, name, key, val) {
        if (HAS_GAS) return gas('setFlag', pin, name, key, val);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p[key] = !!val; p.t = Date.now(); p.flagT = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async addHeart(pin, name, delta) {
        if (HAS_GAS) return gas('addHeart', pin, name, delta);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p.heart = Math.max(0, p.heart + delta); p.t = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async saveSettings(pin, s) {
        if (HAS_GAS) return gas('saveSettings', pin, s);
        const d = Local.data(); const { newPin, ...rest } = s;
        d.settings = { ...d.settings, ...rest }; if (newPin) d.pin = newPin; Local.save(); return { ok: true };
      },
      async logRows(pin) {
        if (HAS_GAS) return gas('getLogRows', pin);
        return { ok: true, rows: [LOG_HEADER, ...Local.data().log] };
      },
      async backup(pin) {

        const d = Local.data(); return { ok: true, data: { app: 'sukiwake', roster: d.roster.map(n => [n, d.progress[n] || '']), settings: d.settings } };
      },
      async restore(pin, data) {
        if (HAS_GAS) return gas('restoreBackup', pin, data);
        const d = Local.data(); (data.roster || []).forEach(([n, p]) => { if (!d.roster.includes(n)) d.roster.push(n); d.progress[n] = p; }); Local.save(); return { ok: true };
      },

        Local.save(); return { ok: true };

    function ItemArt({ it, size = 80, className = '' }) {
      const file = `items/${it.id}.webp`;
      let fb;
      if (it.e) fb = <span className="leading-none select-none" style={{ fontSize: size * 0.82 }}>{it.e}</span>;
      else if (it.svg.startsWith('glass:') || /^(mug|yunomi|bottle|soda):/.test(it.svg)) { const [k, c] = it.svg.split(':'); fb = <div style={{ width: size, height: size }}>{glassArt(c, k)}</div>; }
      else if (it.svg.startsWith('mon:')) fb = <div style={{ width: size, height: size }}>{S(MON_ART[it.svg.slice(4)])}</div>;
      else fb = <div style={{ width: size, height: size }}>{ART[it.svg] || <span style={{ fontSize: size * 0.7 }}>❓</span>}</div>;
      return <div className={`inline-flex items-center justify-center ${className}`} style={{ width: size, height: size }}><Pic file={file} alt={it.n} size={size} fallback={fb} /></div>;
    }

    // スタジオ（えらんだ かざりで かわる）
    function StudioScene({ deco = {}, children, className = '', small }) {
      const k = deco.kabe && SHOP_ITEM[deco.kabe], li = deco.light && SHOP_ITEM[deco.light], de = deco.desk && SHOP_ITEM[deco.desk], fl = deco.floor && SHOP_ITEM[deco.floor];
      const bgImg = IMG_OK.has('studio.webp') && !k;
      const z = small ? 0.55 : 1;
      return (
        <div className={`relative overflow-hidden ${className}`} style={{ background: k ? k.bg : 'linear-gradient(#e0f2fe, #f0f9ff 70%)' }}>
          {bgImg && <img src={IMG + 'studio.webp'} className="absolute inset-0 w-full h-full object-cover" draggable={false} />}
          {!bgImg && <div className="absolute inset-x-0 bottom-0" style={{ height: '22%', background: 'repeating-linear-gradient(90deg, #d6a571 0 60px, #c08a52 60px 62px)' }} />}
          {li && <div className="absolute inset-x-0 top-1 flex justify-around" style={{ fontSize: 42 * z }}>{[0, 1, 2].map(i => <span key={i} className={i === 1 ? 'floaty' : ''}>{li.e}</span>)}</div>}
          {fl && <><span className="absolute left-2 bottom-2" style={{ fontSize: 64 * z }}>{fl.e}</span><span className="absolute right-2 bottom-2" style={{ fontSize: 64 * z }}>{fl.e}</span></>}
          {de && <span className="absolute bottom-[18%] right-[22%]" style={{ fontSize: 44 * z }}>{de.e}</span>}
          <div className="relative h-full">{children}</div>
        </div>
      );
    }

    // =====================================================================
    //  7. がめんの ぶひん
    // =====================================================================
    function Btn({ children, onClick, color = '#0f766e', light = '#ccfbf1', className = '', disabled, style }) {
      return (
        <button onClick={onClick} disabled={disabled}
          className={`btn3d rounded-2xl font-bold px-5 py-3 text-2xl border-2 ${className}`}
          style={disabled ? { background: '#e7e5e4', borderColor: '#a8a29e', color: '#78716c', ...style } : { background: light, borderColor: color, color: '#1e293b', ...style }}>
          {children}
        </button>
      );
    }
    const Heart = ({ s = 26 }) => <span className="inline-block leading-none align-middle" style={{ fontSize: s }}>❤️</span>;
    function Seikai({ show }) {
      if (!show) return null;
      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center pointer-events-none">
          <div className="confetti absolute inset-x-0 top-24 h-80">
            {['⭐', '✨', '🎉', '❤️', '✨', '🌟', '⭐', '❤️'].map((e, i) => <span key={i} className="text-4xl" style={{ left: `${8 + i * 11}%`, animationDelay: `${(i % 4) * 0.12}s` }}>{e}</span>)}
          </div>
          <div className="pop win px-12 py-4 text-6xl font-bold text-teal-700">できた！</div>
        </div>
      );
    }

    // ペラリさんの ことば（1もじずつ でる）
    function MsgWin({ size = 96, compact = false, acc }) {
      const talk = useTalk();
      const [n, setN] = useState(0);
      const text = talk.text || '';
      useEffect(() => {
        setN(0);
        if (!text) return;
        let i = 0;
        const t = setInterval(() => { i += 1; setN(i); if (i >= text.length) clearInterval(t); }, 36);
        return () => clearInterval(t);
      }, [talk.k]);
      return (
        <div className="flex items-end gap-2 w-full">
          <button onClick={() => talk.repeat()} className="shrink-0 active:scale-95 transition" aria-label="もういちど きく">
            <Pera mood={talk.mood} size={size} className={talk.talking ? 'bob' : ''} acc={acc} />
          </button>
          <div onClick={() => setN(text.length)} className={`win flex-1 px-5 ${compact ? 'py-1.5 text-xl min-h-[54px]' : 'py-3 text-2xl min-h-[84px]'} font-bold leading-relaxed`}>
            <span className={n >= text.length && text ? 'tri' : ''}>{text.slice(0, n) || '　'}</span>
          </div>
          <button onClick={() => talk.repeat()} className={`btn3d shrink-0 bg-white border-2 border-teal-800 rounded-2xl px-3 ${compact ? 'py-1 text-base' : 'py-2 text-lg'} font-bold`}>🔊<br />もういちど</button>
        </div>
      );
    }

    // りゆうの カード（しゅるいで 色わけ）
    function RCard({ c, text, onClick, className = '', glow, showKind, noLabel, style }) {
      const set = useContext(SetCtx);
      const k = KIND[c.k];
      const colored = set.color || showKind;
      return (
        <button onClick={onClick} className={`rcard btn3d ${glow ? 'glow' : ''} ${className}`}
          style={colored ? { background: k.bg, borderColor: k.bd, ...style } : { background: '#fff', borderColor: '#57534e', ...style }}>
          {colored && !noLabel && <span className="kind" style={{ borderColor: k.bd, color: k.bd }}>{k.e} {k.name}</span>}
          {text || c.t}
        </button>
      );
    }

    // ヒント（3だんかい）：2かい まちがえると ボタンが ひかり、3かい まちがえると いちばん くわしい ヒントが でる
    function useHint() {
      const [miss, setMiss] = useState(0);
      const [level, setLevel] = useState(0);
      const types = useRef([]);
      const picks = useRef([]);
      const addMiss = (type) => {
        if (type) types.current.push(type);
        setMiss(m => { const n = m + 1; if (n >= 3) setLevel(3); return n; });
        Sound.retry();
      };
      const more = () => setLevel(l => Math.min(3, l + 1));
      const rec = (extra) => ({ miss, hint: level, types: [...new Set(types.current)].join('・'), picks: picks.current.join('・'), ...extra });
      return { miss, level, addMiss, more, rec, picks, setLevel };
    }
    function HintBtn({ h }) {
      return <button onClick={() => { Sound.tap(); h.more(); }} disabled={h.level >= 3}
        className={`btn3d rounded-2xl border-2 px-4 py-2 text-xl font-bold ${h.level >= 3 ? 'bg-stone-100 border-stone-300 text-stone-400' : 'bg-yellow-100 border-yellow-500'} ${h.miss >= 2 && h.level < 3 ? 'glow' : ''}`}>
        💡 ヒント{h.level ? ` ${'①②③'[h.level - 1]}` : ''}</button>;
    }

    // ---- 50おんの キーボード ----
    const KANA_COLS = [
      ['あ', 'い', 'う', 'え', 'お'], ['か', 'き', 'く', 'け', 'こ'], ['さ', 'し', 'す', 'せ', 'そ'], ['た', 'ち', 'つ', 'て', 'と'], ['な', 'に', 'ぬ', 'ね', 'の'],
      ['は', 'ひ', 'ふ', 'へ', 'ほ'], ['ま', 'み', 'む', 'め', 'も'], ['や', '', 'ゆ', '', 'よ'], ['ら', 'り', 'る', 'れ', 'ろ'], ['わ', '', 'を', '', 'ん'],
      ['ー', '、', '。', '！', '？'],
    ];
    const DAKU = { か: 'が', き: 'ぎ', く: 'ぐ', け: 'げ', こ: 'ご', さ: 'ざ', し: 'じ', す: 'ず', せ: 'ぜ', そ: 'ぞ', た: 'だ', ち: 'ぢ', つ: 'づ', て: 'で', と: 'ど', は: 'ば', ひ: 'び', ふ: 'ぶ', へ: 'べ', ほ: 'ぼ', う: 'ゔ' };
    const HANDAKU = { は: 'ぱ', ひ: 'ぴ', ふ: 'ぷ', へ: 'ぺ', ほ: 'ぽ' };
    const SMALL = { あ: 'ぁ', い: 'ぃ', う: 'ぅ', え: 'ぇ', お: 'ぉ', つ: 'っ', や: 'ゃ', ゆ: 'ゅ', よ: 'ょ', わ: 'ゎ' };
    const inv = (m) => Object.fromEntries(Object.entries(m).map(([a, b]) => [b, a]));
    const UNDAKU = inv(DAKU), UNHAN = inv(HANDAKU), UNSMALL = inv(SMALL);
    // さいごの もじに ゛ ゜ ちいさく を つける（もう いちど おすと もとに もどる）
    function applyMod(text, mod) {
      if (!text) return text;
      const last = text.slice(-1), kata = /[ァ-ヶ]/.test(last), h = toHira(last);
      let n = null;
      if (mod === 'daku') n = DAKU[h] || UNDAKU[h] || (UNHAN[h] ? DAKU[UNHAN[h]] : null);
      if (mod === 'han') n = HANDAKU[h] || UNHAN[h] || (UNDAKU[h] && HANDAKU[UNDAKU[h]]) || null;
      if (mod === 'small') n = SMALL[h] || UNSMALL[h] || null;
      if (!n) return text;
      return text.slice(0, -1) + (kata ? toKata(n) : n);
    }
    function KanaKeyboard({ onInput, extra }) {
      const [kata, setKata] = useState(false);
      const press = (fn) => { Sound.key(); onInput(fn); };
      return (
        <div className="bg-slate-100 border-t-4 border-teal-700 rounded-t-2xl p-1.5 flex flex-col gap-1 items-center w-full">
          <div className="flex gap-1 flex-row-reverse">
            {KANA_COLS.map((col, i) => (
              <div key={i} className={`flex flex-col gap-1 ${i === 10 ? 'mr-2' : ''}`}>
                {col.map((ch, j) => ch
                  ? <button key={j} className="kkey" onClick={() => press(t => t + (kata && i < 10 ? toKata(ch) : ch))}>{kata && i < 10 ? toKata(ch) : ch}</button>
                  : <div key={j} style={{ width: '2.75rem', height: '2.75rem' }} />)}
              </div>
            ))}
          </div>
          <div className="flex gap-1.5 flex-wrap justify-center items-center">
            <button className="kkey fn" style={{ width: '4.5rem' }} onClick={() => press(t => applyMod(t, 'daku'))}>゛<span className="text-xs">てんてん</span></button>
            <button className="kkey fn" style={{ width: '4.5rem' }} onClick={() => press(t => applyMod(t, 'han'))}>゜<span className="text-xs">まる</span></button>
            <button className="kkey fn" style={{ width: '5.2rem' }} onClick={() => press(t => applyMod(t, 'small'))}>ちいさく</button>
            <button className="kkey fn" style={{ width: '6rem' }} onClick={() => press(t => t + ' ')}>あき</button>
            <button className="kkey fn" style={{ width: '6rem', background: kata ? '#fde68a' : '#e0f2fe' }} onClick={() => { Sound.tap(); setKata(k => !k); }}>{kata ? 'カタカナ' : 'ひらがな'}</button>
            <button className="kkey fn" style={{ width: '5.5rem', background: '#fee2e2' }} onClick={() => press(t => t.slice(0, -1))}>⌫ けす</button>
            {extra && <span className="inline-flex gap-2 ml-3">{extra}</span>}
          </div>
        </div>
      );
    }
    // かく ところ（タップで えらぶ。Chromebook の キーボードの ときは ふつうの いれもの）
    function WriteBox({ value, onChange, active, onFocus, pc, wide, ph }) {
      if (pc) return <input value={value} onChange={e => onChange(e.target.value)} onFocus={onFocus} autoFocus={active}
        className={`border-4 rounded-xl px-3 py-0.5 text-2xl font-bold ${active ? 'border-teal-500 bg-teal-50' : 'border-stone-300 bg-white'}`} style={{ width: wide ? '100%' : '14em', userSelect: 'text' }} placeholder={ph || ''} />;
      return (
        <button onClick={onFocus} className={`inline-flex items-center border-4 rounded-xl px-3 py-0.5 text-2xl font-bold text-left ${active ? 'border-teal-500 bg-teal-50' : 'border-stone-300 bg-white'}`}
          style={{ minWidth: wide ? '100%' : '8em', minHeight: '2.6rem' }}>
          <span className="whitespace-pre-wrap">{value}</span>{active && <span className="caret" />}{!value && !active && <span className="text-stone-300">{ph || 'ここに かく'}</span>}
        </button>
      );
    }

    // =====================================================================
    //  8. もんだい
    // =====================================================================
    // ⓪ ことばを ならべて「わたしは、〇〇が すきです。」
    function QOrder({ it, me, onDone }) {
      const talk = useTalk();
      const h = useHint();
      const target = useMemo(() => [{ t: me }, { t: 'は、', j: 1 }, { t: it.n }, { t: 'が', j: 1 }, { t: 'すきです。' }].map((c, i) => ({ ...c, i })), []);
      const [cards] = useState(() => shuffle(target));
      const [k, setK] = useState(0);
      const [shake, setShake] = useState(-1);
      const tips = [`だれが すきなのかな？ じぶんの ことから はじめよう。`, `「${me}」の あとには、ちいさい ことばが くるよ。`, `なにが すき？`, `「${it.n}」の あとには、ちいさい ことばが くるよ。`, `さいごは「すきです。」で おわるよ。`];
      useEffect(() => { talk.say(`ことばの カードを ならべて、「${it.n}が すき」の ぶんを つくろう。`); }, []);
      useEffect(() => { if (h.level === 1) talk.say(tips[Math.min(k, 4)]); if (h.level === 2) talk.say('うすい もじの とおりに ならべて みよう。'); if (h.level === 3) talk.say('ひかって いる カードを おしてね。'); }, [h.level]);
      const tap = (c) => {
        if (c.i < k) return;
        if (c.i === k) {
          Sound.put(); const n = k + 1; setK(n);
          if (n === 5) { talk.say(sent1(me, it), { mood: 'happy' }); setTimeout(() => onDone(h.rec({ answer: sent1(me, it) })), 1600); }
          return;
        }
        h.picks.current.push(`${c.t}（ちがう）`);
        const ga = (x) => x.t === 'は、' || x.t === 'が';
        h.addMiss(ga(c) && ga(target[k]) ? 'は・が' : 'ことばの じゅんばん');
        setShake(c.i); setTimeout(() => setShake(-1), 500);
        talk.say(`「${c.t}」では ないよ。${tips[k]}`, { mood: 'think' });
      };
      return (
        <div className="flex flex-col items-center gap-5 w-full">
          <div className="flex flex-wrap gap-2 items-center justify-center bg-white rounded-2xl p-4 border-4 border-teal-200 w-full">
            {target.map((c, i) => i < k
              ? <span key={i} className={`rcard ${c.j ? 'text-2xl' : ''}`} style={{ background: c.j ? '#dcfce7' : '#fff7ed', borderColor: c.j ? '#16a34a' : '#ea580c', minWidth: c.j ? '3rem' : '5rem' }}>{c.t}</span>
              : <span key={i} className="slot text-3xl font-bold text-stone-300">{h.level >= 2 ? c.t : (i + 1)}</span>)}
          </div>
          <div className="flex flex-wrap gap-4 justify-center min-h-[4rem]">
            {cards.map(c => c.i < k ? null : (
              <button key={c.i} onClick={() => tap(c)} className={`rcard btn3d ${shake === c.i ? 'shake' : ''} ${h.level >= 3 && c.i === k ? 'glow' : ''}`}
                style={{ background: c.j ? '#dcfce7' : '#fff7ed', borderColor: c.j ? '#16a34a' : '#ea580c', fontSize: c.j ? '1.5rem' : undefined, minWidth: c.j ? '3.5rem' : '5rem' }}>{c.t}</button>
            ))}
          </div>
          <HintBtn h={h} />
        </div>
      );
    }

    // ぶんを みせる（1つめは できて いる ぶん、2つめは つくって いる ぶん）
    function TwoLines({ me, it, children, line1 = true }) {
      return (
        <div className="bg-white rounded-2xl p-4 border-4 border-teal-200 w-full flex flex-col gap-1">
          {line1 && <div className="sent text-slate-700">① {sent1(me, it)}</div>}
          <div className="sent flex flex-wrap items-center gap-x-1 gap-y-2">② {children}</div>
        </div>
      );
    }
    // カードを えらぶ ため の ならび（あう カード ＋ あわない カード）
    function makeChoices(it, nOk, nWrong) {
      const mine = shuffle(it.mine.filter(id => CARD[id].k !== 5));
      const rest = shuffle(it.ok.filter(id => !mine.includes(id)));
      const ok = [...mine.slice(0, Math.max(1, nOk - 1)), ...rest].slice(0, nOk);
      const wrong = shuffle(D.wrongCards(it)).slice(0, nWrong).map(c => c.id);
      return shuffle([...ok, ...wrong]).map(id => CARD[id]);
    }
    const askOf = (it, cs) => `${it.n}の ${[...new Set(cs.filter(c => it.ok.includes(c.id)).map(c => KIND[c.k].long))].slice(0, 3).join('や ')}を おもいだしてね。`;

    // ① りゆうの カードを 1まい
    function QCard1({ it, me, onDone }) {
      const talk = useTalk();
      const h = useHint();
      const [cs] = useState(() => makeChoices(it, 3, 1));
      const [gone, setGone] = useState([]);
      const [shake, setShake] = useState(null);
      const [got, setGot] = useState(null);
      useEffect(() => { talk.say(`${it.n}の どんな ところが すき？ りゆうの カードを 1まい えらんでね。`); }, []);
      useEffect(() => {
        if (h.level === 1) talk.say(askOf(it, cs));
        if (h.level === 2) talk.say(`カードを よむね。${cs.filter(c => !gone.includes(c.id)).map(c => c.t).join('、')}。`);
        if (h.level === 3) talk.say(`ひかって いる カードは、どれも ${it.n}に あうよ。`);
      }, [h.level]);
      const tap = (c) => {
        if (got) return;
        if (!it.ok.includes(c.id)) {
          h.picks.current.push(`${c.t}✖`); h.addMiss('あわない カード');
          setShake(c.id); setTimeout(() => { setShake(null); setGone(g => [...g, c.id]); }, 500);
          talk.say(`「${c.t}」は、${it.n}には あわないね。${askOf(it, cs)}`, { mood: 'think' });
          return;
        }
        Sound.put(); h.picks.current.push(c.t); setGot(c);
        const s2 = `そのりゆうは、${c.t}${ENDW[endOf(c)]}`;
        talk.say(`${sent1(me, it)} ${s2}`, { mood: 'happy' });
        setTimeout(() => onDone(h.rec({ answer: sent1(me, it) + s2, s2 })), 2600);
      };
      return (
        <div className="flex flex-col items-center gap-5 w-full">
          <TwoLines me={me} it={it}>
            <span>そのりゆうは、</span>
            {got ? <span className="text-teal-700 underline decoration-4 underline-offset-8">{got.t}</span> : <span className="slot">？</span>}
            <span>{got ? ENDW[endOf(got)] : '。'}</span>
          </TwoLines>
          <div className="flex flex-wrap gap-5 justify-center pt-3">
            {cs.map(c => gone.includes(c.id) || (got && got.id === c.id) ? null :
              <RCard key={c.id} c={c} onClick={() => tap(c)} className={shake === c.id ? 'shake' : ''} glow={h.level >= 3 && it.ok.includes(c.id)} showKind={h.level >= 2} />)}
          </div>
          <HintBtn h={h} />
        </div>
      );
    }

    // 「からです」「だからです」を えらぶ ボタン
    function EndingPick({ word, need, onOk, h, chosen, setChosen, small }) {
      const talk = useTalk();
      const choose = (e) => {
        if (need && e !== need) {
          h.addMiss(missType(need)); h.picks.current.push(`${ENDW[e]}（ちがう）`);
          talk.say(h.miss >= 1 ? endRule(word, need) : `「${word}${ENDW[e]}」。こえに だして よんで みよう。ちょっと へんだね。`, { mood: 'think' });
          return;
        }
        Sound.put(); if (setChosen) setChosen(e); onOk && onOk(e);
      };
      return (
        <span className="inline-flex gap-2">
          {['kara', 'dakara'].map(e => (
            <button key={e} onClick={() => choose(e)}
              className={`btn3d rounded-xl border-2 font-bold ${small ? 'px-2 py-1 text-xl' : 'px-4 py-2 text-3xl'} ${chosen === e ? 'bg-teal-200 border-teal-600' : 'bg-white border-teal-400'} ${h.level >= 3 && need === e ? 'glow' : ''}`}>{ENDW[e]}</button>
          ))}
        </span>
      );
    }
    const ruleTalk = (w, need) => need === 'dakara'
      ? `「しずか」「ふわふわ」の ような ことばの あとは「だからです」に なるよ。`
      : `「〜い」で おわる ことばや、うごきの ことばの あとは「からです」だよ。`;

    // ② ぶんの おわり
    function QEnding({ it, me, onDone }) {
      const talk = useTalk();
      const h = useHint();
      const [cs] = useState(() => {
        const ok = shuffle(it.ok.map(id => CARD[id]));
        const na = ok.filter(c => c.f === 'na'), other = ok.filter(c => c.f !== 'na');
        return shuffle([...na.slice(0, 1), ...other].slice(0, 3));
      });
      const [card, setCard] = useState(null);
      const [done, setDone] = useState(null);
      useEffect(() => { talk.say(`${it.n}の すきな ところの カードを 1まい えらんでね。`); }, []);
      useEffect(() => {
        if (!card) return;
        if (h.level === 1) talk.say(`「${card.t}からです」「${card.t}だからです」。どっちかな？`);
        if (h.level === 2) talk.say(ruleTalk(card.t, endOf(card)));
        if (h.level === 3) talk.say('ひかって いる ほうを おしてね。');
      }, [h.level]);
      const pickCard = (c) => { Sound.put(); setCard(c); h.picks.current.push(c.t); talk.say(`「${c.t}」だね。ぶんの おわりは「からです」かな、「だからです」かな？`); };
      const ok = (e) => {
        setDone(e);
        const s2 = `そのりゆうは、${card.t}${ENDW[e]}`;
        talk.say(`${sent1(me, it)} ${s2}`, { mood: 'happy' });
        setTimeout(() => onDone(h.rec({ answer: sent1(me, it) + s2, s2 })), 2600);
      };
      return (
        <div className="flex flex-col items-center gap-5 w-full">
          <TwoLines me={me} it={it}>
            <span>そのりゆうは、</span>
            {card ? <span className="text-teal-700">{card.t}</span> : <span className="slot">？</span>}
            {done ? <span className="text-teal-700 underline decoration-4 underline-offset-8">{ENDW[done]}</span> : <span className="slot" style={{ minWidth: '9rem' }}>？</span>}
          </TwoLines>
          {!card && <div className="flex flex-wrap gap-5 justify-center pt-3">{cs.map(c => <RCard key={c.id} c={c} onClick={() => pickCard(c)} />)}</div>}
          {card && !done && <EndingPick word={card.t} need={endOf(card)} onOk={ok} h={h} />}
          {card && !done && <HintBtn h={h} />}
        </div>
      );
    }

    // ③ カードを 2まい つなぐ
    function QCard2({ it, me, onDone }) {
      const talk = useTalk();
      const h = useHint();
      const [cs] = useState(() => makeChoices(it, Math.min(5, it.ok.length), 1));
      const [gone, setGone] = useState([]);
      const [shake, setShake] = useState(null);
      const [a, setA] = useState(null);
      const [b, setB] = useState(null);
      const [done, setDone] = useState(null);
      useEffect(() => { talk.say(`こんどは りゆうの カードを 2まい つなぐよ。1まいめを えらんでね。`); }, []);
      useEffect(() => {
        if (!b) {
          if (h.level === 1) talk.say(askOf(it, cs));
          if (h.level === 2) talk.say(`カードを よむね。${cs.filter(c => !gone.includes(c.id) && c !== a).map(c => c.t).join('、')}。`);
          if (h.level === 3) talk.say(`ひかって いる カードは、どれも ${it.n}に あうよ。`);
        } else {
          if (h.level === 1) talk.say(`「${b.t}からです」「${b.t}だからです」。どっちかな？`);
          if (h.level === 2) talk.say(ruleTalk(b.t, endOf(b)));
          if (h.level === 3) talk.say('ひかって いる ほうを おしてね。');
        }
      }, [h.level]);
      const tap = (c) => {
        if (b) return;
        if (!it.ok.includes(c.id)) {
          h.picks.current.push(`${c.t}✖`); h.addMiss('あわない カード');
          setShake(c.id); setTimeout(() => { setShake(null); setGone(g => [...g, c.id]); }, 500);
          talk.say(`「${c.t}」は、${it.n}には あわないね。`, { mood: 'think' });
          return;
        }
        Sound.put(); h.picks.current.push(c.t);
        if (!a) { setA(c); h.setLevel(0); talk.say(`「${c.t}」を つなぐ ときは「${c.te}」に なるよ。2まいめを えらんでね。`); }
        else { setB(c); h.setLevel(0); talk.say(`「${a.te} ${c.t}」。ぶんの おわりは「からです」かな、「だからです」かな？`); }
      };
      const ok = (e) => {
        setDone(e);
        const s2 = `そのりゆうは、${a.te} ${b.t}${ENDW[e]}`;
        talk.say(`${sent1(me, it)} ${s2}`, { mood: 'happy' });
        setTimeout(() => onDone(h.rec({ answer: sent1(me, it) + s2, s2 })), 3000);
      };
      return (
        <div className="flex flex-col items-center gap-5 w-full">
          <TwoLines me={me} it={it}>
            <span>そのりゆうは、</span>
            {a ? <span className="text-teal-700">{a.te}</span> : <span className="slot">1</span>}
            {b ? <span className="text-teal-700">{b.t}</span> : <span className="slot">2</span>}
            {done ? <span className="text-teal-700 underline decoration-4 underline-offset-8">{ENDW[done]}</span> : <span className="slot" style={{ minWidth: '7rem' }}>？</span>}
          </TwoLines>
          {!b && <div className="flex flex-wrap gap-5 justify-center pt-3">
            {cs.map(c => gone.includes(c.id) || c === a ? null :
              <RCard key={c.id} c={c} onClick={() => tap(c)} className={shake === c.id ? 'shake' : ''} glow={h.level >= 3 && it.ok.includes(c.id)} showKind={h.level >= 2} />)}
          </div>}
          {b && !done && <EndingPick word={b.t} need={endOf(b)} onOk={ok} h={h} />}
          {!done && <HintBtn h={h} />}
        </div>
      );
    }

    const doneBtn = (check) => <button onClick={check} className="btn3d rounded-2xl border-2 border-green-700 bg-green-100 px-5 py-2 text-2xl font-bold">✅ できた！</button>;

    // ④・はってん：りゆうを じぶんで かく
    function QWrite({ it, me, st, pc, onDone }) {
      const talk = useTalk();
      const h = useHint();
      const pres = st.blanks;
      const [texts, setTexts] = useState(pres.map(() => ''));
      const [ends, setEnds] = useState(pres.map(() => null));
      const [act, setAct] = useState(0);
      const [ideas] = useState(() => shuffle(it.ok).slice(0, 6).map(id => CARD[id]));
      const [done, setDone] = useState(false);
      const naze = pres[0].startsWith('なぜ');
      useEffect(() => {
        talk.say(pres.length > 1 ? `${it.n}の すきな ところを 2つ かこう。「それに、」の あとに、もう 1つの りゆうを かくよ。`
          : naze ? `「なぜ すきかと いうと、」の あとに、${it.n}が すきな りゆうを かこう。` : `${it.n}が すきな りゆうを、じぶんで かいて みよう。`);
      }, []);
      useEffect(() => {
        if (h.level === 1) talk.say(`${it.n}の どんな ところが すき？ ${KIND[ideas[0].k].ask}`);
        if (h.level === 2) talk.say('カードを おすと、その ことばが はいるよ。');
        if (h.level === 3) talk.say(`たとえば「${ideas[0].t}」と かいて みよう。さいごに「からです」か「だからです」を えらんでね。`);
      }, [h.level]);
      const edit = (fn) => { const t = [...texts]; t[act] = fn(t[act]); setTexts(t); };
      const setEnd = (i, e) => { const x = [...ends]; x[i] = e; setEnds(x); };
      const useIdea = (c) => { Sound.put(); h.picks.current.push(`${c.t}（ヒント）`); const t = [...texts]; t[act] = c.t; setTexts(t); const x = [...ends]; x[act] = null; setEnds(x); };
      const check = () => {
        const parts = texts.map((t, i) => { const s = splitEnding(t); return { text: s.text, end: s.end || ends[i] }; });
        for (let i = 0; i < parts.length; i++) {
          if (!parts[i].text) { setAct(i); talk.say(`「${pres[i]}」の あとに、りゆうを かいてね。`); return; }
          if (!parts[i].end) { setAct(i); talk.say('さいごに「からです」か「だからです」を えらんでね。'); return; }
        }
        if (parts.length > 1 && parts[0].text === parts[1].text) { setAct(1); talk.say('「それに、」の あとには、べつの りゆうを かこう。'); return; }
        for (let i = 0; i < parts.length; i++) {
          const need = expectEnding(parts[i].text);
          if (need && need !== parts[i].end) {
            setAct(i); h.addMiss(missType(need)); h.picks.current.push(`${parts[i].text}${ENDW[parts[i].end]}（ちがう）`);
            talk.say(endRule(parts[i].text, need), { mood: 'think' });
            return;
          }
        }
        setDone(true);
        const s2 = parts.map((p, i) => `${pres[i]}${p.text}${ENDW[p.end]}`).join('');
        talk.say(`${sent1(me, it)} ${s2}`, { mood: 'happy' });
        setTimeout(() => onDone(h.rec({ answer: sent1(me, it) + s2, s2, written: parts.map(p => p.text).join('／') })), 2800);
      };
      return (
        <div className="wsent flex flex-col items-center gap-2 w-full">
          <div className="bg-white rounded-2xl px-4 py-2 border-4 border-teal-200 w-full flex flex-col gap-1">
            <div className="sent text-slate-700">① {sent1(me, it)}</div>
            {pres.map((pre, i) => (
              <div key={i} className="sent flex flex-wrap items-center gap-2">
                {i === 0 ? '② ' : '　 '}{pre}
                <WriteBox value={texts[i]} active={act === i && !done} onFocus={() => setAct(i)} pc={pc} onChange={v => { const t = [...texts]; t[i] = v; setTexts(t); }} />
                <EndingPick small h={h} chosen={ends[i]} setChosen={e => { setEnd(i, e); }} />
              </div>
            ))}
          </div>
          {h.level >= 2 && !done && <div className="flex flex-wrap gap-2 justify-center">{ideas.map(c => <RCard key={c.id} c={c} onClick={() => useIdea(c)} showKind noLabel style={{ fontSize: '1.2rem', minHeight: '2.4rem', minWidth: 0, padding: '.1rem .6rem' }} />)}</div>}
          {!done && (pc ? <div className="flex gap-3"><HintBtn h={h} />{doneBtn(check)}</div> : <KanaKeyboard onInput={edit} extra={<><HintBtn h={h} />{doneBtn(check)}</>} />)}
        </div>
      );
    }

    // ⑤ まとめ：2つの ぶんを ぜんぶ じぶんで かく
    function QAll({ it, me, pc, onDone }) {
      const talk = useTalk();
      const h = useHint();
      const [lines, setLines] = useState(['', '']);
      const [act, setAct] = useState(0);
      const [done, setDone] = useState(false);
      const model = [sent1(me, it), 'そのりゆうは、〇〇からです。'];
      useEffect(() => { talk.say(`${it.n}を しょうかいする ぶんを、ぜんぶ じぶんで かこう。1つめは「すき」の ぶん、2つめは りゆうの ぶんだよ。`); }, []);
      useEffect(() => {
        if (h.level === 1) talk.say(`1つめは「${me}は、${it.n}が すきです。」、2つめは「そのりゆうは、〜からです。」の かたちで かくよ。`);
        if (h.level === 2) talk.say('うすい もじを みながら かいて みよう。');
        if (h.level === 3) {
          const l = [...lines];
          if (!/すき/.test(norm(l[0])) || !/です。?$/.test(norm(l[0]))) l[0] = sent1(me, it);
          if (!norm(l[1])) l[1] = 'そのりゆうは、';
          setLines(l); setAct(1);
          talk.say('1つめの ぶんと、2つめの はじめを いれたよ。つづきを かこう。');
        }
      }, [h.level]);
      const edit = (fn) => { const l = [...lines]; l[act] = fn(l[act]); setLines(l); };
      const check = () => {
        const fix = (s) => { const t = String(s).trim(); return t && !/[。！？]$/.test(t) ? t + '。' : t; };
        const l1 = fix(lines[0]), l2 = fix(lines[1]);
        const n1 = norm(l1), n2 = norm(l2);
        if (!n1) { setAct(0); talk.say('1つめの ぶんを かこう。'); return; }
        if (!n1.includes('すき')) { setAct(0); h.addMiss('すきです が ない'); talk.say(`1つめは「${it.n}が すきです。」の ぶんだよ。「すき」を いれよう。`, { mood: 'think' }); return; }
        if (!/です[。！]$/.test(n1)) { setAct(0); h.addMiss('です が ない'); talk.say('1つめの ぶんの さいごは「すきです。」に しよう。', { mood: 'think' }); return; }
        if (!n2) { setAct(1); talk.say('2つめに、りゆうの ぶんを かこう。'); return; }
        if (!n2.includes('から')) { setAct(1); h.addMiss('から が ない'); talk.say('りゆうの ぶんは「そのりゆうは、〜からです。」の かたちで かこう。', { mood: 'think' }); return; }
        if (!/です[。！]$/.test(n2)) { setAct(1); h.addMiss('です が ない'); talk.say('2つめの ぶんの さいごは「からです。」に しよう。', { mood: 'think' }); return; }
        const m = n2.match(/^(.*?)(だ)?から(です)?[。！]$/);
        const word = m ? m[1].split('、').pop() : '';
        const need = expectEnding(word);
        if (m && need && need !== (m[2] ? 'dakara' : 'kara')) { setAct(1); h.addMiss(missType(need)); talk.say(endRule(word, need), { mood: 'think' }); return; }
        setLines([l1, l2]); setDone(true);
        talk.say(`${l1} ${l2}`, { mood: 'happy' });
        setTimeout(() => onDone(h.rec({ answer: l1 + l2, s1: l1, s2: l2, written: `${l1}／${l2}` })), 2800);
      };
      return (
        <div className="wsent flex flex-col items-center gap-2 w-full">
          <div className="bg-white rounded-2xl px-4 py-1.5 border-4 border-teal-200 w-full flex flex-col gap-1">
            {[0, 1].map(i => (
              <div key={i} className="flex items-start gap-2">
                <span className="sent" style={{ lineHeight: 1.5 }}>{'①②'[i]}</span>
                <div className="flex-1 flex flex-col">
                  {h.level >= 2 && !done && <div className="text-lg leading-tight text-stone-400 font-bold pl-1">{model[i]}</div>}
                  <WriteBox wide value={lines[i]} active={act === i && !done} onFocus={() => setAct(i)} pc={pc} onChange={v => { const l = [...lines]; l[i] = v; setLines(l); }} ph={i ? 'りゆうの ぶん' : 'すきな ものの ぶん'} />
                </div>
              </div>
            ))}
          </div>
          {!done && (pc ? <div className="flex gap-3"><HintBtn h={h} />{doneBtn(check)}</div> : <KanaKeyboard onInput={edit} extra={<><HintBtn h={h} />{doneBtn(check)}</>} />)}
        </div>
      );
    }

    // =====================================================================
    //  9. はっぴょう（テレビに うつる）
    // =====================================================================
    function TVShow({ name, it, s1, s2, deco, onDone, gain }) {
      const [phase, setPhase] = useState('count');
      const [n, setN] = useState(3);
      const sayIt = () => Speech.say(`${s1} ${s2}`);
      useEffect(() => {
        Speech.say(`${name}さんの ばんぐみが はじまるよ！ じゅんびは いい？`);
        const t1 = setTimeout(() => setN(2), 2600), t2 = setTimeout(() => setN(1), 3400), t3 = setTimeout(() => { setN(0); setPhase('go'); Sound.seikai(); Speech.say('どうぞ！ こえに だして よんでね。'); }, 4200);
        return () => [t1, t2, t3].forEach(clearTimeout);
      }, []);
      const read = () => { setPhase('clap'); Sound.clap(); Sound.heart(); Speech.say(`はくしゅ！ みてくれた ひとが ${gain}にん ふえたよ！`); setTimeout(onDone, 2600); };
      return (
        <div className="fixed inset-0 z-40 bg-slate-900/80 flex items-center justify-center p-3">
          <div className="pop bg-slate-800 rounded-[2rem] p-4 pb-3 w-full max-w-5xl shadow-2xl border-8 border-slate-700">
            <div className="flex items-center gap-3 mb-2 text-white font-bold text-xl">
              <span className="onair bg-red-600 rounded-lg px-3 py-0.5">● オンエア</span>
              <span>すきの わけ テレビ ／ {name}さんの しょうかい コーナー</span>
            </div>
            <StudioScene deco={deco} className="rounded-2xl" >
              <div className="flex items-center gap-4 p-5 min-h-[22rem]">
                <Pera size={150} mood={phase === 'clap' ? 'happy' : 'normal'} acc={deco.pera} className={phase === 'go' ? 'bob' : ''} />
                <div className="flex-1 flex flex-col items-center gap-3">
                  <div className="bg-white/95 rounded-3xl p-3 border-4 border-amber-300"><ItemArt it={it} size={120} /></div>
                  <div className="bg-white/95 rounded-2xl px-5 py-3 border-4 border-teal-400 w-full">
                    <div className="text-4xl font-bold leading-relaxed">{s1}</div>
                    <div className="text-4xl font-bold leading-relaxed text-teal-800">{s2}</div>
                  </div>
                </div>
              </div>
              {phase === 'count' && n > 0 && <div key={n} className="pop absolute inset-0 flex items-center justify-center text-[9rem] font-bold text-white" style={{ textShadow: '0 0 20px #0008' }}>{n}</div>}
              {phase === 'clap' && <div className="absolute inset-0 flex items-center justify-center pointer-events-none"><div className="fly text-6xl font-bold bg-white/90 rounded-full px-6 py-2 border-4 border-pink-400">❤️ ＋{gain}</div></div>}
              {phase === 'clap' && <div className="absolute left-4 bottom-2 text-5xl">👏👏</div>}
            </StudioScene>
            <div className="flex gap-3 justify-center mt-3">
              <button onClick={sayIt} className="btn3d bg-white border-2 border-slate-400 rounded-2xl px-4 py-2 text-xl font-bold">🔊 おてほん</button>
              <Btn onClick={read} disabled={phase !== 'go'} color="#dc2626" light="#fee2e2" className={`text-3xl px-10 ${phase === 'go' ? 'glow' : ''}`}>📣 よんだよ！</Btn>
            </div>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 10. れんしゅう（1かい ぶん）：ばしょ → もの → もんだい → はっぴょう
    // =====================================================================
    const HEART_PER = 3;
    function TownGrid({ progress, onPick }) {
      return (

                {IMG_OK.has(`place_${pl.id}.webp`)

                  : <span className="text-5xl leading-none">{pl.e}</span>}{pl.name}
                <span className="text-sm text-stone-600 leading-none">⭐ {got} / 15</span>

    function Shelf({ pl, progress, onPick }) {

    function Practice({ st, n, intro, name, progress, pc, onRecord, onIntro, onSave, onFinish, onQuit }) {
      const talk = useTalk();
      const set = useContext(SetCtx);
      const [phase, setPhase] = useState('town');
      const [pl, setPl] = useState(null);
      const [it, setIt] = useState(null);
      const [idx, setIdx] = useState(0);
      const [tv, setTv] = useState(null);
      const [seikai, setSeikai] = useState(false);
      const got = useRef({ heart: 0, items: [], miss: 0 });
      const t0 = useRef(0);
      const me = meOf(progress);
      useEffect(() => { talk.say((intro || `${st.no} 「${st.name}」。`) + ' どこへ いく？ ばしょを えらんでね。'); }, []);
      const pickPlace = (p) => { setPl(p); setPhase('shelf'); talk.say(`${p.say} すきな ものを 1つ えらんでね。`); };
      const pickItem = (x) => { setIt(x); t0.current = Date.now(); setPhase('q'); };
      const done = (r) => {
        const s1 = r.s1 || sent1(me, it), s2 = r.s2;
        onRecord({ stage: st.id, place: pl.name, item: it.n, answer: r.answer, result: !r.miss && !r.hint ? '○' : '△', miss: r.miss, hint: r.hint,
          types: r.types, picks: r.picks, written: r.written || '', secs: Math.round((Date.now() - t0.current) / 100) / 10 });
        got.current.miss += r.miss;
        const next = () => {
          onIntro(it, s1, s2, st.id, HEART_PER);
          got.current.heart += HEART_PER; got.current.items.push(it.id);
          const k = idx + 1; setTv(null); setSeikai(false);
          if (k >= n) { onFinish({ ...got.current }); return; }
          onSave({ st: st.id, left: n - k });
          setIdx(k); setIt(null); setPhase('shelf');
          talk.say(`${k + 1}つめ！ つぎは なにを しょうかい する？`);
        };
        if (set.happyo) setTv({ s1, s2, next });
        else { Sound.seikai(); setSeikai(true); setTimeout(next, 1600); }
      };
      const Q = { order: QOrder, card1: QCard1, ending: QEnding, card2: QCard2, write: QWrite, all: QAll }[st.type];
      return (
        <div className={`w-full max-w-5xl flex flex-col ${phase === 'q' ? 'gap-1.5 pt-1' : 'gap-3'} px-3 pb-0 relative`} style={{ zIndex: 1 }}>
          <div className="flex items-center gap-2">
            <div className="text-xl font-bold bg-teal-700 text-white rounded-full px-4 py-1">{st.no} {st.name}</div>
            <div className="flex gap-1">{Array.from({ length: n }, (_, i) => <span key={i} className={`w-7 h-7 rounded-full border-2 flex items-center justify-center text-sm ${i < idx ? 'bg-pink-400 border-pink-600' : i === idx ? 'bg-yellow-200 border-yellow-500' : 'bg-white border-stone-300'}`}>{i < idx ? '❤' : ''}</span>)}</div>
            {phase === 'q' && it && <div className="flex items-center gap-1 ml-2"><ItemArt it={it} size={44} /><span className="text-2xl font-bold">{it.n}</span></div>}
            <div className="flex-1" />
            {phase === 'shelf' && <button onClick={() => { Sound.tap(); setPhase('town'); talk.say('どこへ いく？'); }} className="btn3d bg-white border-2 border-teal-700 rounded-2xl px-3 py-1 text-xl font-bold">🗺️ ほかの ばしょ</button>}
            {phase === 'q' && <button onClick={() => { Sound.tap(); setPhase('shelf'); }} className="btn3d bg-white border-2 border-stone-400 rounded-2xl px-3 py-1 text-lg font-bold">↩ ものを えらびなおす</button>}
            <button onClick={onQuit} className="btn3d bg-white border-2 border-stone-400 rounded-2xl px-3 py-1 text-lg font-bold">やすむ</button>
          </div>
          <MsgWin size={phase === 'q' ? 60 : 92} compact={phase === 'q'} acc={progress.deco.pera} />
          {phase === 'town' && <TownGrid progress={progress} onPick={pickPlace} />}
          {phase === 'shelf' && pl && <>
            {/* たなの 画面は、その ばしょの 絵を 画面 いっぱいの 背景に する（もんだいの 画面は すっきりの まま） */}
            {IMG_OK.has(`place_${pl.id}.webp`) && <img src={`${IMG}place_${pl.id}.webp`} alt="" className="fixed inset-0 w-full h-full object-cover pointer-events-none" style={{ zIndex: -1 }} draggable={false} />}
            <div className="relative self-start flex items-center gap-2 text-2xl font-bold bg-white/95 rounded-2xl border-4 px-4 py-0.5" style={{ color: pl.color, borderColor: pl.color, zIndex: 1 }}><span className="text-3xl">{pl.e}</span>{pl.name}</div>
            <Shelf pl={pl} progress={progress} onPick={pickItem} />
          </>}
          {phase === 'q' && it && (
            <div className="flex flex-col items-center gap-2">
              {!['write', 'all'].includes(st.type) && <div className="flex items-center gap-3"><ItemArt it={it} size={76} /><span className="text-3xl font-bold">{it.n}</span>{it.sub && <span className="text-lg text-stone-500">（{it.sub}）</span>}</div>}
              <Q key={`${it.id}-${idx}`} it={it} me={me} st={st} pc={pc} onDone={done} />
            </div>
          )}
          {tv && <TVShow name={name} it={it} s1={tv.s1} s2={tv.s2} deco={progress.deco} gain={HEART_PER} onDone={tv.next} />}
          <Seikai show={seikai} />
        </div>
      );
    }

            {r.newTitle && <div className="pop text-2xl font-bold bg-yellow-100 border-4 border-yellow-400 rounded-2xl px-5 py-2">🎖️ あたらしい しょうごう：{r.newTitle}</div>}

          <div className="relative min-h-screen flex flex-col items-center gap-3 px-6 py-5">

    function printCards(list, mode, name) {
      const el = document.getElementById('printarea');
      const pages = mode === 'one' ? list.map(x => [x]) : Array.from({ length: Math.ceil(list.length / 4) }, (_, i) => list.slice(i * 4, i * 4 + 4));
      if (!el.__root) el.__root = ReactDOM.createRoot(el);
      el.__root.render(
        <div>{pages.map((pg, i) => (
          <div key={i} className="ppage" style={{ width: '279mm', height: '192mm', display: 'grid', gap: '6mm', gridTemplateColumns: mode === 'one' ? '1fr' : '1fr 1fr', gridTemplateRows: mode === 'one' ? '1fr' : '1fr 1fr' }}>

        ))}</div>

      setTimeout(() => { try { window.print(); } catch (e) { alert('いんさつ できませんでした。'); } }, 600);

      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });

      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(api.pending());
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };
      const act = async (fn, okText) => {
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); onChanged(); } }
        catch (e) { flash('うまく いきませんでした：' + e.message); }
      };
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '﻿' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`すきのわけ_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`すきのわけ_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'sukiwake') { flash('このアプリのバックアップではありません'); return; }

          await act(() => api.restore(pin, d), 'バックアップから元にもどしました');
        };
        rd.readAsText(f);
      };
      const opt = (key, list) => list.map(([v, t]) =>

        </table>
      );
      const allTexts = data.students.flatMap(st => (st.texts || []).map(t => Object.assign([...t], { who: st.name }))).sort((a, b) => String(b[0]).localeCompare(String(a[0])));
