<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fef9ef; font-family: 'BIZ UDPGothic', sans-serif; color: #1e293b; }
    .card { text-align: center; background: #fff; border: 6px solid #fde68a; border-radius: 32px; padding: 32px 40px; max-width: 560px; margin: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.06); }
    .owl { font-size: 96px; line-height: 1; animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    h1 { font-size: 30px; color: #92400e; margin: 16px 0 8px; }
    p { font-size: 20px; line-height: 1.7; margin: 0 0 24px; }
    .start { display: inline-block; text-decoration: none; background: #f43f5e; color: #fff; font-size: 34px; font-weight: 700; padding: 18px 48px; border-radius: 22px; border-bottom: 8px solid #be123c; }
    .start:active { transform: translateY(4px); border-bottom-width: 4px; }
    .note { margin-top: 24px; font-size: 13px; color: #94a3b8; }
    .help { margin-top: 20px; font-size: 18px; line-height: 1.8; color: #475569; }
    .sub { display: inline-block; margin-top: 6px; text-decoration: none; background: #fff; color: #be123c; font-size: 22px; font-weight: 700; padding: 10px 24px; border-radius: 16px; border: 3px solid #f43f5e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="owl">🦉</div>
    <h1>おんどくはかせの ちょうせんじょう</h1>
    <p>ホーホーはかせと いっしょに<br>おんどくに ちょうせん しよう！</p>
    <!-- Apps Script の画面は かこいの中で 表示されるため、あたらしい タブで 開く -->
    <a class="start" id="start" href="<?= startUrl ?>" target="_blank" rel="noopener">▶ はじめる</a>
    <div class="note">※マイクを使うため、アプリは あたらしい タブで ひらきます。</div>
    <div class="help" id="help" hidden>
      ひらかないときは、こちらを おしてね。<br>
      <a class="sub" href="<?= startUrl ?>" target="_top">▶ このページで ひらく</a>
    </div>
  </div>
  <script>
    document.getElementById('start').addEventListener('click', function () {
      setTimeout(function () { document.getElementById('help').hidden = false; }, 1200);
    });
  </script>
</body>
</html>
