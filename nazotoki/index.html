<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワンダせんせいの なぞとき たんていじむしょ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root {
      --bg: #fdf6e3; --ink: #1e293b; --sub: #64748b; --line: #e7dcc3;
      --navy: #1e3a8a; --brown: #7c4a1e; --gold: #f59e0b;
      --itsu: #ef4444; --doko: #16a34a; --dare: #2563eb; --nani: #ca8a04;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; }
    button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
    input, select { font-family: inherit; }
    ruby rt { font-size: .5em; color: #57534e; font-weight: 400; }
    .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 28px; color: var(--brown); }
    .emoji { font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; line-height: 1; }
    .kw { word-break: keep-all; overflow-wrap: anywhere; }

    /* 立体ボタン */
    .btn3d { word-break: keep-all; border: 0; border-bottom: 6px solid rgba(0,0,0,.28); border-radius: 1.1rem; font-weight: 700; transition: transform .08s, border-bottom-width .08s, filter .15s; display: inline-flex; align-items: center; justify-content: center; gap: .4em; user-select: none; line-height: 1.25; }
    .btn3d:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 3px; }
    .btn3d:disabled { opacity: .35; cursor: not-allowed; }
    .btn3d:hover:not(:disabled) { filter: brightness(1.05); }
    .c-navy { background: #2563eb; color: #fff; border-bottom-color: #1e3a8a; }
    .c-green { background: #10b981; color: #fff; border-bottom-color: #047857; }
    .c-amber { background: #fbbf24; color: #451a03; border-bottom-color: #d97706; }
    .c-orange { background: #f97316; color: #fff; border-bottom-color: #c2410c; }
    .c-red { background: #f43f5e; color: #fff; border-bottom-color: #be123c; }
    .c-violet { background: #8b5cf6; color: #fff; border-bottom-color: #6d28d9; }
    .c-brown { background: #a16207; color: #fff; border-bottom-color: #713f12; }
    .c-slate { background: #475569; color: #fff; border-bottom-color: #1e293b; }
    .c-white { background: #fff; color: #334155; border: 2px solid #d6cbb3; border-bottom: 6px solid #d6cbb3; }
    .s-sm { padding: .45rem .8rem; font-size: 1rem; }
    .s-md { padding: .7rem 1.2rem; font-size: 1.25rem; }
    .s-lg { padding: .9rem 1.5rem; font-size: 1.6rem; }
    .s-xl { padding: 1.1rem 2rem; font-size: 2rem; }

    .wrap { max-width: 1280px; margin: 0 auto; padding: .75rem; }
    .row { display: flex; align-items: center; gap: .6rem; }
    .col { display: flex; flex-direction: column; gap: .6rem; }
    .wrapflex { flex-wrap: wrap; }
    .grow { flex: 1 1 auto; min-width: 0; }
    .between { justify-content: space-between; }
    .center { justify-content: center; }
    .tc { text-align: center; }
    .bold { font-weight: 700; }
    .muted { color: var(--sub); }
    .card { background: #fff; border: 3px solid var(--line); border-radius: 1.4rem; padding: 1rem; }
    .pill { display: inline-flex; align-items: center; gap: .3em; padding: .2em .7em; border-radius: 999px; font-weight: 700; font-size: .95rem; }

    /* ワンダせんせい */
    .wanda { position: relative; flex: 0 0 auto; cursor: pointer; }
    .wanda img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    .wanda.bob img { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .bubble { position: relative; background: #fff; border: 3px solid #1e3a8a33; border-radius: 1.2rem; padding: .8rem 1rem; font-size: 1.35rem; line-height: 1.9; font-weight: 700; box-shadow: 0 4px 0 #1e3a8a1a; }
    .bubble.left::before { content: ''; position: absolute; left: -14px; top: 26px; border: 10px solid transparent; border-right: 14px solid #1e3a8a33; border-left: 0; }
    .bubble.left::after { content: ''; position: absolute; left: -9px; top: 28px; border: 8px solid transparent; border-right: 11px solid #fff; border-left: 0; }
    .speak { border: 0; background: #e0e7ff; color: #1e3a8a; border-radius: .8rem; padding: .3rem .6rem; font-weight: 700; font-size: 1rem; }

    /* 文章 */
    .story { font-size: 1.85rem; line-height: 2.35; letter-spacing: .02em; }
    .story .sent { display: block; padding: 0 .3rem; border-radius: .6rem; transition: background .2s; }
    .story .sent.reading { background: #fef3c7; }
    .story mark { background: transparent; color: inherit; border-bottom: 5px solid currentColor; padding-bottom: 1px; }
    .hl-itsu { border-bottom-color: var(--itsu) !important; }
    .hl-doko { border-bottom-color: var(--doko) !important; }
    .hl-dare { border-bottom-color: var(--dare) !important; }
    .hl-nani { border-bottom-color: var(--nani) !important; }
    mark.glow { animation: markglow 1s ease-in-out infinite; border-radius: .3rem; }
    @keyframes markglow { 50% { background: #fde68a; } }
    .pic { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 1.2rem; border: 4px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.12); background: #f1f5f9; display: block; }

    /* 手がかりカード */
    .clues { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }
    .clue { border-radius: 1rem; border: 3px dashed #d6cbb3; background: #fffdf7; padding: .4rem .6rem; min-height: 4.2rem; }
    .clue.on { border-style: solid; background: #fff; }
    .clue.now { box-shadow: 0 0 0 4px #fde68a; }
    .clue .lab { font-size: .95rem; font-weight: 700; }
    .clue .val { font-size: 1.25rem; font-weight: 700; line-height: 1.8; }

    /* 問い */
    .qbox { border-radius: 1.2rem; padding: .6rem 1rem; color: #fff; font-weight: 700; font-size: 1.5rem; line-height: 2; display: flex; align-items: center; gap: .6rem; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
    .choice { min-height: 5.2rem; font-size: 1.6rem; line-height: 1.9; padding: .4rem .8rem; }
    .choice.gone { visibility: hidden; }
    .glowbtn { animation: glowbtn 1s ease-in-out infinite; }
    @keyframes glowbtn { 50% { box-shadow: 0 0 0 7px #fde047; } }
    .pulse { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.06); } }

    /* 入力のわく */
    .frame { font-size: 1.7rem; font-weight: 700; display: flex; align-items: center; flex-wrap: wrap; gap: .25rem; line-height: 2.2; }
    .box { width: 2.6rem; height: 2.9rem; border: 3px solid #94a3b8; border-radius: .6rem; background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; }
    .box.next { border-color: #2563eb; box-shadow: 0 0 0 3px #bfdbfe; }
    .box.ok { background: #dcfce7; border-color: #16a34a; }

    /* 50音表 */
    .kb { display: grid; gap: .3rem; }
    .kcol { display: grid; grid-template-rows: repeat(5, 1fr); gap: .3rem; }
    .key { width: 100%; min-width: 2.6rem; height: 2.8rem; font-size: 1.45rem; padding: 0; border-radius: .7rem; }
    .key.blank { visibility: hidden; }
    .tabs { display: flex; gap: .4rem; }
    .tab { border: 3px solid #d6cbb3; background: #fff; border-radius: .9rem; padding: .3rem .9rem; font-size: 1.15rem; font-weight: 700; color: #475569; }
    .tab.on { background: #1e3a8a; border-color: #1e3a8a; color: #fff; }

    /* ごほうび */
    .modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: #fff; border-radius: 1.6rem; padding: 1.3rem; max-width: 760px; width: 100%; max-height: 94vh; overflow: auto; border: 5px solid #fde68a; }
    .seikai { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .seikai span { font-size: 6rem; font-weight: 700; color: #f97316; -webkit-text-stroke: 4px #fff; paint-order: stroke fill; text-shadow: 0 6px 0 #c2410c55; animation: pop .9s ease-out both; }
    @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 40% { transform: scale(1.15); opacity: 1; } 70% { transform: scale(1); } 100% { transform: scale(1); opacity: 1; } }
    .sticker { width: 5.2rem; height: 5.2rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 3rem; background: #fff; border: 5px solid; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
    .sticker.big { width: 9rem; height: 9rem; font-size: 5.4rem; border-width: 7px; animation: spin .9s ease-out both; }
    @keyframes spin { 0% { transform: rotateY(90deg) scale(.4); } 100% { transform: rotateY(0) scale(1); } }
    .sticker.none { background: #f1f5f9; border-color: #cbd5e1 !important; color: #94a3b8; font-size: 2.2rem; font-weight: 700; }
    .confetti { position: fixed; top: -20px; z-index: 55; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

    /* ホーム */
    .office { position: relative; border-radius: 1.6rem; overflow: hidden; border: 4px solid #d6b98c; }
    .lvcard { border-radius: 1.4rem; padding: 1rem; border: 4px solid; background: #fff; text-align: left; display: flex; gap: .8rem; align-items: center; }
    .stagegrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .7rem; }
    .stage { border-radius: 1.2rem; padding: .7rem .5rem; min-height: 8.6rem; flex-direction: column; font-size: 1.1rem; }
    .dots { display: flex; gap: .25rem; justify-content: center; }
    .dot { width: .9rem; height: .9rem; border-radius: 50%; background: #e2e8f0; border: 2px solid #cbd5e1; }
    .dot.on { background: #fbbf24; border-color: #d97706; }
    .dot.now { background: #fff; border-color: #2563eb; }

    /* 先生用 */
    .tbl { border-collapse: collapse; width: 100%; font-size: .95rem; background: #fff; }
    .tbl th, .tbl td { border: 1px solid #e2e8f0; padding: .35rem .5rem; text-align: left; vertical-align: top; }
    .tbl th { background: #f8fafc; }
    .inp { font-size: 1.05rem; padding: .45rem .6rem; border: 2px solid #cbd5e1; border-radius: .6rem; }
    .bar { height: .7rem; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
    .bar > i { display: block; height: 100%; }

    .play { display: grid; grid-template-columns: minmax(0, 44fr) minmax(0, 56fr); gap: 1rem; align-items: start; }
    @media (max-width: 980px) { .play { grid-template-columns: 1fr; } .stagegrid { grid-template-columns: repeat(3, 1fr); } }
    @media (prefers-reduced-motion: reduce) { .pulse, .glowbtn, .wanda.bob img, mark.glow { animation: none !important; } }
  </style>

      { id: 'sweet', name: 'デザート', color: '#db2777', items: [['🍰', 'ショートケーキ'], ['🎂', 'バースデーケーキ'], ['🍮', 'プリン'], ['🍦', 'ソフトクリーム'], ['🍨', 'アイス'], ['🍧', 'かきごおり'], ['🍩', 'ドーナツ'], ['🍪', 'クッキー'], ['🧁', 'カップケーキ'], ['🍫', 'チョコレート'], ['🍬', 'キャンディ'], ['🍭', 'ペロペロキャンディ'], ['🍡', 'だんご']] },
      { id: 'stat', name: 'ぶんぼうぐ', color: '#7c3aed', items: [['✏️', 'えんぴつ'], ['🖍️', 'クレヨン'], ['🖊️', 'ペン'], ['🖌️', 'ふで'], ['📏', 'じょうぎ'], ['📐', 'さんかくじょうぎ'], ['✂️', 'はさみ'], ['📎', 'クリップ'], ['📌', 'がびょう'], ['📒', 'ノート'], ['📕', 'ほん'], ['🎒', 'ランドセル'], ['🗂️', 'ファイル']] },
    ];
    const STICKERS = [];
    STICKER_CATS.forEach(c => c.items.forEach(([e, n], i) => STICKERS.push({ id: `${c.id}${i + 1}`, cat: c.id, e, n, color: c.color })));
    const STICKER_MAP = Object.fromEntries(STICKERS.map(s => [s.id, s]));

    /* =========================================================
       小さな 道具
       ========================================================= */
    const pad2 = n => String(n).padStart(2, '0');
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
    function ymd() { const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`; }
    function fnv(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
    const hashPin = pin => fnv('nazotoki:' + pin);
    const CURRENT = { settings: { ...DEFAULT_SETTINGS } };

    /* ---- ふりがな ----  書き方： {漢字|よみ} */
    const MARK_RE = /\{([^|}]+)\|([^}]+)\}/g;
    const plain = s => String(s == null ? '' : s).replace(MARK_RE, '$1');
    const yomi = s => String(s == null ? '' : s).replace(MARK_RE, '$2');
    function R({ t, className, style }) {
      const s = String(t == null ? '' : t);
      const out = []; let last = 0; let m; let k = 0;
      const re = new RegExp(MARK_RE.source, 'g');
      const furi = CURRENT.settings.furigana;
      while ((m = re.exec(s))) {
        if (m.index > last) out.push(<React.Fragment key={k++}>{s.slice(last, m.index)}</React.Fragment>);
        out.push(furi ? <ruby key={k++}>{m[1]}<rt>{m[2]}</rt></ruby> : <React.Fragment key={k++}>{m[1]}</React.Fragment>);
        last = re.lastIndex;
      }
      if (last < s.length) out.push(<React.Fragment key={k++}>{s.slice(last)}</React.Fragment>);
      return <span className={className} style={style}>{out}</span>;
    }
    // ひらがな ⇔ カタカナ
    const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
    const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    const isKata = c => /[ァ-ヺー]/.test(c);

    /* =========================================================
       ほぞん（localStorage と IndexedDB）
       ========================================================= */
    const newDeviceId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    function normalizeState(s) {
      s = s && typeof s === 'object' ? s : {};
      const obj = v => (v && typeof v === 'object' ? v : {});
      return {
        version: 1, profile: s.profile || null, settings: { ...DEFAULT_SETTINGS, ...obj(s.settings) },
        progress: obj(s.progress), solved: obj(s.solved), stickers: obj(s.stickers), textSticker: obj(s.textSticker),
        bonus: obj(s.bonus), rank: Number(s.rank) || 0, sync: obj(s.sync), deviceId: s.deviceId || newDeviceId(),
      };
    }
    function loadState() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { s = null; }
      const st = normalizeState(s);
      if (!s || !s.deviceId) saveState(st);
      CURRENT.settings = st.settings;
      return st;
    }
    function saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { console.warn(e); } }

    // 入口ページ（Apps Script）から開いたとき、URLの # のあとに 記録の送り先と合言葉が ついてくる
    const REC_URL_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/|macros\/)s\/[A-Za-z0-9_-]+\/(exec|dev)$/;
    (function applyLinkConfig() {
      if (!location.hash) return;
      const h = new URLSearchParams(location.hash.slice(1));
      const rec = h.get('rec');
      if (!rec) return;
      if (REC_URL_RE.test(rec)) {
        const st = loadState();
        if (st.sync.url !== rec || st.sync.key !== (h.get('key') || '')) {
          saveState({ ...st, sync: { ...st.sync, url: rec, key: h.get('key') || '', lastSummary: null } });
        }
      }

    })();

    const DB_NAME = 'wanda-nazotoki';
    let dbPromise = null;
    function getDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath: 'id', autoIncrement: true });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }
    async function idbReq(storeName, mode, fn) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const req = fn(tx.objectStore(storeName));
        let result;
        if (req) req.onsuccess = () => { result = req.result; };
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }
    const DB = {
      add: (s, v) => idbReq(s, 'readwrite', st => st.add(v)),
      put: (s, v) => idbReq(s, 'readwrite', st => st.put(v)),
      getAll: (s) => idbReq(s, 'readonly', st => st.getAll()),
      clear: (s) => idbReq(s, 'readwrite', st => st.clear()),
    };

    function downloadFile(name, content, type) {
      const blob = content instanceof Blob ? content : new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
    function pickFile(accept) {
      return new Promise((resolve) => {
        const input = document.createElement('input'); input.type = 'file'; input.accept = accept;
        input.onchange = () => resolve(input.files && input.files[0] ? input.files[0] : null);
        input.click();
      });
    }

    /* =========================================================
       読み上げ・効果音・ファンファーレ
       ========================================================= */
    function speechText(s) {
      return yomi(s).replace(/[〇]+/g, 'まるまる').replace(/＿/g, '').replace(/[「」]/g, '、').replace(/\n/g, '　');
    }
    const TTS = {
      voice: null, token: 0,
      init() {
        if (!('speechSynthesis' in window)) return;
        const choose = () => {
          const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
          this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
        };
        choose();
        speechSynthesis.onvoiceschanged = choose;
      },
      speak(markup, { force = false, rate } = {}) {
        return new Promise(resolve => {
          if (!('speechSynthesis' in window) || !markup || (!CURRENT.settings.voice && !force)) return resolve();
          const text = speechText(markup);
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = rate || CURRENT.settings.rate || 0.8; u.pitch = 1.1;
          let done = false;
          const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
          const timer = setTimeout(finish, 2500 + text.length * 450 / (u.rate || 1));
          u.onend = finish; u.onerror = finish;
          this.current = u; // Chrome で onend が 来なくなるのを ふせぐため 参照を のこす
          speechSynthesis.speak(u);
        });
      },
      cancel() { this.token++; if ('speechSynthesis' in window) speechSynthesis.cancel(); },
    };
    TTS.init();

    let AUDIO = null;
    function audioCtx() {
      if (!CURRENT.settings.sfx) return null;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        AUDIO = AUDIO || new AC();
        if (AUDIO.state === 'suspended') AUDIO.resume();
        return AUDIO;
      } catch (e) { return null; }
    }
    function tone(ctx, { f, t, dur, type = 'sine', vol = 0.12, attack = 0.012, release = 0.08, dest }) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.setValueAtTime(vol, Math.max(t + attack, t + dur - release));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }
    const SFX_SEQ = {
      tap: [[660, 0.06, 0.08]],
      key: [[880, 0.05, 0.07]],
      ng: [[392, 0.16, 0.07], [330, 0.24, 0.06]],   // やさしい音（ブザーに しない）
      hint: [[659, 0.08, 0.08], [784, 0.08, 0.08], [988, 0.12, 0.08]],
      open: [[523, 0.08], [784, 0.12]],
    };
    function sfx(name) {
      const ctx = audioCtx(); if (!ctx) return;
      let t = ctx.currentTime + 0.01;
      (SFX_SEQ[name] || []).forEach(([f, dur, vol = 0.12]) => { tone(ctx, { f, t, dur, vol }); t += dur; });
    }
    // ファンファーレ（この アプリの ための オリジナルの ふし）
    const MIDI = { G4: 67, A4: 69, B4: 71, C5: 72, D5: 74, E5: 76, F5: 77, G5: 79, A5: 81, B5: 83, C6: 84, D6: 86, E6: 88, G6: 91 };
    const FANFARE = {
      ok: { beat: 0.1, notes: [['C5', 0, 1], ['E5', 1, 1], ['G5', 2, 1], ['C6', 3, 2], ['G5', 5, 1], [['C5', 'E5', 'G5', 'C6'], 6, 5]] },
      set: { beat: 0.12, notes: [['G4', 0, 1], ['G4', 1, 1], ['C5', 2, 2], ['E5', 4, 1], ['D5', 5, 1], ['E5', 6, 1], ['G5', 7, 2], [['C5', 'E5', 'G5', 'C6'], 9, 8]] },
      clear: { beat: 0.12, notes: [['C5', 0, 1], ['E5', 1, 1], ['G5', 2, 1], ['C6', 3, 2], ['A5', 5, 1], ['B5', 6, 1], ['C6', 7, 2], ['G5', 9, 1], ['A5', 10, 1], ['B5', 11, 1], ['D6', 12, 2], ['C6', 14, 1], ['D6', 15, 1], ['E6', 16, 2], [['G5', 'C6', 'E6', 'G6'], 18, 10]] },
    };
    function fanfare(kind) {
      const ctx = audioCtx(); if (!ctx) return;
      const def = FANFARE[kind] || FANFARE.ok;
      const t0 = ctx.currentTime + 0.03;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(ctx.destination);
      def.notes.forEach(([nm, at, len]) => {
        const chord = Array.isArray(nm);
        (chord ? nm : [nm]).forEach(x => {
          const f = 440 * Math.pow(2, (MIDI[x] - 69) / 12);
          const t = t0 + at * def.beat, dur = len * def.beat * 0.95;
          tone(ctx, { f, t, dur, type: 'square', vol: chord ? 0.025 : 0.04, release: 0.07, dest: lp });
          tone(ctx, { f, t, dur, type: 'triangle', vol: chord ? 0.06 : 0.1, release: 0.07 });
        });
      });
    }
    function confetti(n = 40) {
      const colors = ['#f97316', '#2563eb', '#16a34a', '#ef4444', '#eab308', '#a855f7'];
      for (let i = 0; i < n; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.width = el.style.height = (8 + Math.random() * 8) + 'px';
        el.style.background = pick(colors);
        el.style.borderRadius = Math.random() < .5 ? '50%' : '2px';
        el.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
        el.style.animationDelay = (Math.random() * .4) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
    }

    /* =========================================================
       すすみぐあい
       ========================================================= */
    const prog = (st, id) => st.progress[id] || { idx: 0, cleared: false, clears: 0 };
    const isCleared = (id, st) => !!prog(st, id).cleared;
    function isStageOpen(s, st) {
      if (st.settings.unlockAll) return true;
      if (s.no > 1) return isCleared(`L${s.lv}-${s.no - 1}`, st);
      if (s.lv === 1) return true;
      return isCleared('L1-4', st); // レベル2は、レベル1で 4つの 手がかりを 1つずつ 練習してから
    }
    function lockHint(s) {
      if (s.no > 1) return `ステージ${s.no - 1}を おえると ひらくよ`;
      return 'レベル1の ステージ4を おえると ひらくよ';
    }
    const solvedCount = st => ALL_TEXTS.filter(id => st.solved[id]).length;
    function titleIndex(n) { let i = 0; TITLES.forEach((t, k) => { if (n >= t.min) i = k; }); return i; }
    const titleOf = st => TITLES[titleIndex(solvedCount(st))];
    const stickerCount = st => STICKERS.filter(s => st.stickers[s.id]).length;
    function findNext(st) {
      for (const s of STAGES) if (isStageOpen(s, st) && !isCleared(s.id, st)) return s;
      return null;
    }
    const stageLabel = s => `レベル${s.lv} ステージ${s.no}`;

    /* =========================================================
       先生の スプレッドシートへ 記録を 送る
       ========================================================= */
    const SYNC_BATCH = 200;
    function syncColumns() { return STAGES.map(s => ({ id: s.id.toLowerCase(), short: `${s.lv}-${s.no}`, label: `${stageLabel(s)} ${s.name}` })); }
    async function buildSummary(st) {
      const hist = await DB.getAll('history');
      const stages = {};
      STAGES.forEach(s => {
        const p = prog(st, s.id);
        stages[s.id.toLowerCase()] = { clear: p.cleared ? 1 : 0, plays: p.clears || 0, pos: p.idx || 0, solved: s.texts.filter(x => st.solved[x.id]).length };
      });
      const clues = {}; KEYS.forEach(k => { clues[k] = { n: 0, first: 0 }; });
      const errors = {};
      let lastAt = 0;
      hist.forEach(h => {
        lastAt = Math.max(lastAt, h.at || 0);
        (h.errors || []).forEach(e => { errors[e] = (errors[e] || 0) + 1; });
        const c = clues[h.key]; if (c) { c.n++; if (!h.mistakes && !h.hints) c.first++; }
      });
      const t = titleOf(st);
      const next = findNext(st);
      const solved = solvedCount(st);
      const firstTexts = ALL_TEXTS.filter(id => st.solved[id] && st.solved[id].first).length;
      return {
        title: `${t.icon} ${t.name}`, solved, all: ALL_TEXTS.length, first: firstTexts,
        stickers: stickerCount(st), allStickers: STICKERS.length, lastAt,
        current: next ? `${stageLabel(next)}（${(prog(st, next.id).idx || 0) + 1}つめ）` : 'ぜんぶ クリア',
        stages, clues, errors,
      };
    }
    function syncRecord(st, h) {
      return {
        uid: `${st.deviceId}-${h.at}-${h.textId}-${h.key}`, at: h.at, level: `レベル${h.lv}`, stage: STAGE_MAP[h.stageId] ? `${stageLabel(STAGE_MAP[h.stageId])} ${STAGE_MAP[h.stageId].name}` : h.stageId,
        textId: h.textId, clue: KNAME[h.key] || h.key, q: plain(h.q), correct: plain(h.correct), answers: (h.answers || []).map(plain).join(' → '),
        result: h.result, mistakes: h.mistakes, hints: h.hints, sec: h.sec, errors: [...new Set(h.errors || [])].map(e => ERR[e] || e).join('、'),
      };
    }
    const SYNC_ERRORS = {
      key: '合言葉が一致しません。入口ページから開き直すか、正しい合言葉を入力してください。',
      'not-json': 'Apps Script から正しい返事がありません。デプロイの「アクセスできるユーザー」が「全員」になっているか確認してください。',
      fetch: '送信できませんでした。インターネット接続と、Apps Script のデプロイ（アクセスできるユーザー「全員」）を確認してください。',
    };
    const Sync = {
      running: null,
      run(app, opts = {}) {
        if (this.running) return this.running;
        this.running = this._run(app, opts).finally(() => { this.running = null; });
        return this.running;
      },
      async _run(app, { all = false } = {}) {
        const st = app.stateRef.current;
        const sync = st.sync || {};
        if (!sync.url || !st.profile) return { ok: false, reason: 'nourl' };
        if (navigator.onLine === false) return { ok: false, reason: 'offline' };
        try {
          const hist = (await DB.getAll('history')).sort((a, b) => a.at - b.at);
          const targets = hist.filter(h => all || !h.sent);
          const summary = await buildSummary(st);
          const sumKey = fnv(st.profile.name + JSON.stringify(summary));
          if (!targets.length && !all && sync.lastSummary === sumKey) return { ok: true, sent: 0 };
          let i = 0;
          do {
            const batch = targets.slice(i, i + SYNC_BATCH);
            const payload = {
              app: APP_ID, v: 1, key: sync.key || '', deviceId: st.deviceId, name: st.profile.name,
              summary, columns: syncColumns(), errorNames: ERR, records: batch.map(h => syncRecord(st, h)),
            };
            let res;
            try {
              res = await fetch(sync.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
            } catch (e) { throw new Error('fetch'); }
            let data;
            try { data = await res.json(); } catch (e) { throw new Error('not-json'); }
            if (!data || !data.ok) throw new Error((data && data.error) || 'server');
            for (const h of batch) if (!h.sent) await DB.put('history', { ...h, sent: true });
            i += SYNC_BATCH;
          } while (i < targets.length);
          app.update(s => ({ ...s, sync: { ...s.sync, lastOkAt: Date.now(), lastError: null, lastSummary: sumKey } }));
          return { ok: true, sent: targets.length };
        } catch (e) {
          const code = String((e && e.message) || e);
          app.update(s => ({ ...s, sync: { ...s.sync, lastError: code, lastErrorAt: Date.now() } }));
          return { ok: false, reason: code };
        }
      },
    };
    const syncErrorText = code => SYNC_ERRORS[code] || `送信できませんでした（${code}）。`;

    /* =========================================================
       50音表（レベル2）
       ========================================================= */
    const KANA_COLS = [
      ['あ', 'い', 'う', 'え', 'お'], ['か', 'き', 'く', 'け', 'こ'], ['さ', 'し', 'す', 'せ', 'そ'], ['た', 'ち', 'つ', 'て', 'と'],
      ['な', 'に', 'ぬ', 'ね', 'の'], ['は', 'ひ', 'ふ', 'へ', 'ほ'], ['ま', 'み', 'む', 'め', 'も'], ['や', '', 'ゆ', '', 'よ'],
      ['ら', 'り', 'る', 'れ', 'ろ'], ['わ', '', 'を', '', 'ん'],
    ];
    const DAKU = { か: 'が', き: 'ぎ', く: 'ぐ', け: 'げ', こ: 'ご', さ: 'ざ', し: 'じ', す: 'ず', せ: 'ぜ', そ: 'ぞ', た: 'だ', ち: 'ぢ', つ: 'づ', て: 'で', と: 'ど', は: 'ば', ひ: 'び', ふ: 'ぶ', へ: 'べ', ほ: 'ぼ' };
    const HANDAKU = { は: 'ぱ', ひ: 'ぴ', ふ: 'ぷ', へ: 'ぺ', ほ: 'ぽ' };
    const SMALL = { あ: 'ぁ', い: 'ぃ', う: 'ぅ', え: 'ぇ', お: 'ぉ', つ: 'っ', や: 'ゃ', ゆ: 'ゅ', よ: 'ょ', わ: 'ゎ' };
    const invert = o => Object.fromEntries(Object.entries(o).map(([a, b]) => [b, a]));
    const UNDAKU = invert(DAKU), UNHANDAKU = invert(HANDAKU), UNSMALL = invert(SMALL);
    const baseOf = h => UNDAKU[h] || UNHANDAKU[h] || UNSMALL[h] || h;
    // 「゛」「゜」「小」を 前の 字に つける
    function applyMark(ch, mark) {
      if (!ch) return null;
      const kata = isKata(ch) && ch !== 'ー';
      const h = toHira(ch);
      const b = baseOf(h);
      let out = null;
      if (mark === '゛') out = DAKU[h] || (UNDAKU[h] ? UNDAKU[h] : (UNHANDAKU[h] && DAKU[UNHANDAKU[h]]) || null);
      if (mark === '゜') out = HANDAKU[h] || (UNHANDAKU[h] ? UNHANDAKU[h] : (UNDAKU[h] && HANDAKU[UNDAKU[h]]) || null);
      if (mark === '小') out = SMALL[h] || UNSMALL[h] || null;
      if (!out || out === h) return b === h && !out ? null : out;
      return kata ? toKata(out) : out;
    }
    // ヒント：つぎに おす ボタン
    function nextKeyPlan(answer, typed) {
      const A = [...answer], T = [...typed];
      const okPrefix = T.every((c, i) => c === A[i]);
      if (!okPrefix) {
        // 最後の 1字に しるしを つければ よい とき
        const head = T.slice(0, -1);
        const last = T[T.length - 1];
        const want = A[T.length - 1];
        if (head.every((c, i) => c === A[i]) && want && toHira(last) === baseOf(toHira(want)) && (isKata(last) === isKata(want))) {
          const h = toHira(want);
          return { mark: UNDAKU[h] ? '゛' : UNHANDAKU[h] ? '゜' : '小' };
        }
        return { del: true };
      }
      const c = A[T.length];
      if (!c) return {};
      if (c === 'ー') return { kana: 'ー', kata: true };
      return { kana: baseOf(toHira(c)), kata: isKata(c) };
    }

    // 文章（ヒントの 線・読んでいる 文を 光らせる）
    function Story({ text, marks = [], reading = -1 }) {
      return (
        <div className="story kw" data-story="1">
          {text.t.map((s, si) => {
            const ms = [];
            marks.forEach(m => {
              const span = text.span[m.key];
              const p = text.pos && text.pos[m.key] != null ? text.pos[m.key] : text.t.findIndex(x => x.includes(span));
              if (p !== si) return;
              const at = s.indexOf(span);
              if (at >= 0) ms.push({ ...m, at, end: at + span.length });
            });
            ms.sort((a, b) => a.at - b.at);
            const parts = []; let cur = 0;
            ms.forEach((m, i) => {
              if (m.at < cur) return; // かさなる ときは 先の ものだけ
              if (m.at > cur) parts.push(<R key={'p' + i} t={s.slice(cur, m.at)} />);
              parts.push(<mark key={'m' + i} className={`hl-${m.key} ${m.glow ? 'glow' : ''}`} style={{ color: 'inherit' }} data-mark={m.key}><R t={s.slice(m.at, m.end)} /></mark>);
              cur = m.end;
            });
            if (cur < s.length) parts.push(<R key="last" t={s.slice(cur)} />);
            return <span key={si} className={`sent ${reading === si ? 'reading' : ''}`}>{parts}</span>;
          })}
        </div>
      );

    function Play({ app, stageId, go }) {
      const stage = STAGE_MAP[stageId];
      const st = app.state;
      const startIdx = prog(st, stageId).cleared ? 0 : (prog(st, stageId).idx || 0);
      const [ti, setTi] = useState(Math.min(startIdx, stage.texts.length - 1));
      const text = stage.texts[ti];
      const keys = KEYS.filter(k => text.qs[k]);
      const [qi, setQi] = useState(0);
      const key = keys[qi];
      const Q = text.qs[key];
      const [filled, setFilled] = useState({});
      const [reading, setReading] = useState(-1);
      const [mistakes, setMistakes] = useState(0);
      const [hint, setHint] = useState(0);
      const [gone, setGone] = useState({});
      const [typed, setTyped] = useState('');
      const [kata, setKata] = useState(false);
      const [msg, setMsg] = useState(null);       // ワンダせんせいの ことば
      const [pose, setPose] = useState('normal');
      const [flash, setFlash] = useState(false);  // 「せいかい！」
      const [done, setDone] = useState(null);     // 1つの 文章が おわった
      const [busy, setBusy] = useState(false);
      const qStart = useRef(Date.now());
      const answers = useRef([]);
      const errs = useRef([]);
      const textLog = useRef({});
      const token = useRef(0);
      const order = useMemo(() => (stage.lv === 1 && Q ? shuffle([{ t: Q.a, e: 'ok' }, ...Q.ng]) : []), [text.id, key]);

      const qText = Q ? Q.q : '';
      // 文章を 1文ずつ 読む
      const readStory = async (tok) => {
        for (let i = 0; i < text.t.length; i++) {
          if (token.current !== tok) return;
          setReading(i);
          await TTS.speak(text.t[i]);
        }
        if (token.current === tok) setReading(-1);
      };
      const askQuestion = async (tok, withStory) => {
        if (withStory && st.settings.autoRead) { await readStory(tok); if (token.current !== tok) return; await sleep(250); }
        if (token.current !== tok) return;
        setPose('normal'); setMsg(null);
        TTS.speak(qText);
      };
      // あたらしい 問い
      useEffect(() => {
        const tok = ++token.current;
        qStart.current = Date.now(); answers.current = []; errs.current = [];
        setMistakes(0); setHint(0); setGone({}); setTyped(''); setMsg(null); setPose('normal');
        if (Q && stage.lv === 2) setKata(false); // いつも ひらがなから（カタカナに するかは 子どもが きめる）
        askQuestion(tok, qi === 0);
        return () => { token.current++; TTS.cancel(); };
      }, [text.id, qi]);
      useEffect(() => {
        // つぎの 挿絵を 先に よんでおく
        const nx = stage.texts[ti + 1]; if (nx) { const im = new Image(); im.src = `img/${nx.id}.webp`; }
      }, [ti]);

      const say = (t, p = 'normal') => { setMsg(t); setPose(p); TTS.speak(t); };
      const showHint = (lvl) => {
        const h = Math.max(hint, lvl);
        setHint(h); sfx('hint');
        if (h === 1) say(HINT1[key] + (text.t.length > 1 ? '　もんだいと おなじ ことばが ある 文を さがそう。' : ''), 'think');
        if (h === 2) say(`${KNAME[key]}の こたえは、${['あか', 'みどり', 'あお', 'きいろ'][KEYS.indexOf(key)]}の せんの ところに あるよ。`, 'think');
        if (h >= 3) say(`ここだよ。「${text.span[key]}」`, 'think');
      };
      const nextHint = () => showHint(Math.min(3, hint + 1));

      const record = async (result) => {
        const h = {
          at: Date.now(), lv: stage.lv, stageId, textId: text.id, key, q: Q.q, correct: stage.lv === 1 ? Q.a : Q.a,
          answers: answers.current, result, mistakes, hints: hint, sec: Math.round((Date.now() - qStart.current) / 1000),
          errors: errs.current, sent: false,
        };
        textLog.current[key] = h;
        try { await DB.add('history', h); } catch (e) { console.warn(e); }
      };

      const correct = async (note) => {
        setBusy(true);
        token.current++; TTS.cancel();
        await record(hint ? 'ヒントで せいかい' : 'せいかい');
        setFilled(f => ({ ...f, [key]: true }));
        setFlash(true); fanfare('ok'); setPose('happy');
        setMsg(note || null);
        const t0 = Date.now();
        await TTS.speak(note ? 'せいかい！ ' + note : 'せいかい！', { force: false });
        await sleep(Math.max(300, 1300 - (Date.now() - t0)));
        setFlash(false);
        if (qi + 1 < keys.length) { setQi(qi + 1); setBusy(false); return; }
        finishText();
      };
      const wrong = (err, said) => {
        const n = mistakes + 1;
        setMistakes(n);
        errs.current.push(err);
        sfx('ng');
        // 3回 まちがえたら、いちばん くわしい ヒントを 出す
        if (n >= 3) showHint(3);
        else say(said, 'cheer');
      };

      // レベル1
      const choose = (c, i) => {
        if (busy || gone[i]) return;
        answers.current.push(c.t);
        if (c.e === 'ok') { correct(); return; }
        setGone(g => ({ ...g, [i]: true }));
        const other = KEYS.find(k => k !== key && text.span[k] === c.t);
        const said = c.e === 'cross' && other
          ? `それは「${KNAME[other]}」の ことばだよ。「${KNAME[key]}」は ${KDESC[key]}`
          : c.e === 'trap' ? 'その ことばも 文の なかに あるね。でも、もんだいを もう いちど よんで みよう。'
          : 'おしい！ 文の なかに その ことばが あるかな？ もう いちど よんで みよう。';
        wrong(c.e === 'ok' ? 'near' : c.e, said);
      };

      // レベル2
      const A = Q && stage.lv === 2 ? [...Q.a] : [];
      const typeKey = k => { if (busy) return; if ([...typed].length >= A.length) { sfx('ng'); return; } sfx('key'); setTyped(t => t + k); };
      const markKey = m => {
        if (busy) return;
        const T = [...typed]; const last = T[T.length - 1];
        const r = applyMark(last, m);
        if (!r) { sfx('ng'); return; }
        sfx('key'); T[T.length - 1] = r; setTyped(T.join(''));
      };
      const delKey = () => { if (busy) return; setTyped(t => [...t].slice(0, -1).join('')); };
      const check = () => {
        if (busy) return;
        const T = [...typed];
        answers.current.push(typed);
        if (typed === Q.a) { correct(); return; }
        if (toHira(typed) === toHira(Q.a)) {
          errs.current.push('kana');
          setTyped(Q.a);
          correct(isKata(A[0]) ? `「${Q.a}」は カタカナで かくよ。` : `「${Q.a}」は ひらがなで かくよ。`);
          return;
        }
        const other = (Q.other || []).findIndex(o => toHira(o) === toHira(typed));
        let keep = 0; while (keep < T.length && T[keep] === A[keep]) keep++;
        setTyped(A.slice(0, keep).join(''));
        if (other >= 0) {
          const ok = KEYS.filter(k => k !== key)[other];
          wrong('cross', `それは「${KNAME[ok]}」の こたえだよ。「${KNAME[key]}」は ${KDESC[key]}`);
        } else {
          wrong('input', keep ? 'ここまでは あってるよ！ つづきを かんがえよう。' : 'おしい！ 文を もう いちど よんで みよう。');
        }
      };

      async function finishText() {
        const logs = textLog.current;
        const first = keys.every(k => logs[k] && !logs[k].mistakes && !logs[k].hints);
        let newSticker = null, rankUp = null, bonus = [];
        app.update(s => {
          const was = s.solved[text.id];
          const solved = { ...s.solved, [text.id]: { at: Date.now(), first: (was && was.first) || first, times: ((was && was.times) || 0) + 1 } };
          let stickers = { ...s.stickers }, textSticker = { ...s.textSticker }, bonusMap = { ...s.bonus };
          const free = () => STICKERS.filter(x => !stickers[x.id]);
          if (!was && !textSticker[text.id]) {
            const f = free();
            if (f.length) { newSticker = pick(f); stickers[newSticker.id] = Date.now(); textSticker[text.id] = newSticker.id; }
          }
          // レベルの 50もんを ぜんぶ といたら ボーナス 2まい
          const lvKey = `L${stage.lv}`;
          if (!bonusMap[lvKey] && LEVELS.find(L => L.lv === stage.lv).list.every(x => solved[x.id])) {
            bonusMap[lvKey] = Date.now();
            for (let i = 0; i < 2; i++) { const f = free(); if (f.length) { const b = pick(f); stickers[b.id] = Date.now(); bonus.push(b); } }
          }
          const n = ALL_TEXTS.filter(id => solved[id]).length;
          const r = titleIndex(n);
          if (r > (s.rank || 0)) rankUp = TITLES[r];
          // すすみぐあい
          const p = prog(s, stageId);
          const idx = ti + 1;
          const cleared = idx >= stage.texts.length;
          const progress = { ...s.progress, [stageId]: cleared ? { idx: 0, cleared: true, clears: (p.clears || 0) + 1 } : { ...p, idx } };
          return { ...s, solved, stickers, textSticker, bonus: bonusMap, rank: Math.max(r, s.rank || 0), progress };
        });
        fanfare('set'); confetti(30);
        setPose('happy');
        const stageDone = ti + 1 >= stage.texts.length;
        setDone({ first, sticker: newSticker, bonus, rankUp, stageDone });
        setBusy(false);
        const sum = keys.map(k => `${KNAME[k]}、${text.span[k]}`).join('。');
        await TTS.speak(`じけん かいけつ！ ${sum}。` + (newSticker ? `シールを どうぞ。${newSticker.n}の シールだよ。` : ''));
        Sync.run(app);
      }
      const nextText = () => {
        TTS.cancel();
        if (done && done.stageDone) { setDone({ ...done, clearScreen: true }); fanfare('clear'); confetti(70); TTS.speak(`ステージ${stage.no} クリア！ すごいね！`); return; }
        setDone(null); setFilled({}); setQi(0); setTi(ti + 1);
      };

      const glow = useMemo(() => (stage.lv === 2 && hint >= 3 ? nextKeyPlan(Q.a, typed) : {}), [hint, typed, key]);
      const marks = [];
      keys.forEach(k => { if (filled[k]) marks.push({ key: k }); });
      if (hint >= 2 && !filled[key]) marks.push({ key, glow: hint >= 3 });
      const full = [...typed].length === A.length;

      if (done && done.clearScreen) {
        const got = stage.texts.map(x => st.textSticker[x.id]).filter(Boolean).map(id => STICKER_MAP[id]);
        const nxt = STAGES[STAGES.indexOf(stage) + 1];
        return (
          <div className="wrap tc">
            <div className="card col" style={{ alignItems: 'center', marginTop: '1rem' }} data-stage-clear="1">
              <Wanda pose="happy" size={200} />
              <div className="bold" style={{ fontSize: '2.6rem', color: '#f97316' }}>ステージ{stage.no} クリア！</div>
              <div style={{ fontSize: '1.3rem' }}>このステージで あつめた シール</div>
              <div className="row wrapflex center">{got.map(s => <Sticker key={s.id} s={s} />)}</div>
              {done.rankUp && <div className="bold" style={{ fontSize: '1.4rem' }}>🏅 しょうごうが「{done.rankUp.name}」に なったよ！</div>}
              <div className="row wrapflex center" style={{ marginTop: '.6rem' }}>
                <Btn color="white" size="lg" onClick={() => go({ name: 'home' })}>🏠 おわる</Btn>
                {nxt && nxt.lv === stage.lv && isStageOpen(nxt, app.state) && <Btn color="green" size="lg" onClick={() => go({ name: 'play', stageId: nxt.id, k: Date.now() })} data-next-stage="1">つぎの ステージへ ▶</Btn>}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="wrap">
          <TopBar
            left={<Btn color="white" size="sm" onClick={() => { TTS.cancel(); go({ name: 'stages', lv: stage.lv }); }} data-back="1">◀ もどる</Btn>}
            title={<span>{stageLabel(stage)}：<R t={stage.name} /></span>}
            right={<span className="dots">{stage.texts.map((x, i) => <span key={x.id} className={`dot ${i < ti || (i === ti && done) ? 'on' : ''} ${i === ti && !done ? 'now' : ''}`} />)}</span>}
          />
          {(() => {
            const picEl = <img className="pic" src={`img/${text.id}.webp`} alt="さしえ" data-pic={text.id} style={stage.lv === 2 ? { maxHeight: '36vh', objectFit: 'cover' } : null} />;
            const cluesEl = <Clues text={text} keys={keys} filled={filled} now={done ? null : key} />;
            const storyEl = (
              <div className="card" style={{ padding: stage.lv === 2 ? '.6rem .8rem' : undefined }}>
                <div className="row between" style={{ marginBottom: '.2rem' }}>
                  <span className="pill" style={{ background: '#fef3c7', color: '#92400e' }}>📄 なぞの ぶんしょう</span>
                  <button className="speak" onClick={() => { const tok = ++token.current; readStory(tok); }} data-read="1">🔊 よむ</button>
                </div>
                <Story text={text} marks={marks} reading={reading} />
              </div>
            );
            const hintBtn = <Btn color="amber" size="md" className={mistakes >= 2 && hint < 3 ? 'glowbtn' : ''} onClick={nextHint} data-hint="1">💡 ヒント{hint ? `（${hint}）` : ''}</Btn>;
            const qEl = !done && Q && (
              <div className="row" style={{ alignItems: 'flex-start' }}>
                <Wanda pose={pose} size={stage.lv === 2 ? 90 : 110} onClick={() => TTS.speak(msg || qText, { force: true })} />
                <div className="col grow" style={{ gap: '.4rem' }}>
                  <div className="qbox" style={{ background: KCOLOR[key] }} data-question={key}>
                    <span className="pill" style={{ background: '#fff', color: KCOLOR[key], fontSize: '1.1rem' }}>{KICON[key]} {KNAME[key]}</span>
                    <R t={Q.q} className="kw grow" />
                    <button className="speak" onClick={() => TTS.speak(qText, { force: true })}>🔊</button>
                  </div>
                  {msg && <div className="bubble left kw" style={{ fontSize: '1.2rem', padding: '.5rem .8rem' }} data-msg="1"><R t={msg} /></div>}
                </div>
              </div>
            );
            const countEl = <span className="muted" style={{ fontSize: '.95rem' }}>{keys.length > 1 ? `てがかり ${qi + 1} / ${keys.length}` : ''}</span>;
            if (stage.lv === 1) {
              return (
                <div className="play">
                  <div className="col">{picEl}{cluesEl}</div>
                  <div className="col">
                    {storyEl}
                    {qEl}
                    {!done && Q && (
                      <>
                        <div className="choices" data-choices="1">
                          {order.map((c, i) => (
                            <Btn key={i} color="white" className={`choice kw ${gone[i] ? 'gone' : ''} ${hint >= 3 && c.e === 'ok' ? 'glowbtn' : ''}`} onClick={() => choose(c, i)} data-choice={c.e === 'ok' ? 'ok' : c.e}>
                              <R t={c.t} />
                            </Btn>
                          ))}
                        </div>
                        <div className="row between">{hintBtn}{countEl}</div>
                      </>
                    )}
                  </div>
                </div>
              );
            }
            return (
              <div className="play" style={{ gridTemplateColumns: 'minmax(0, 40fr) minmax(0, 60fr)' }}>
                <div className="col">{picEl}{storyEl}{cluesEl}</div>
                <div className="col">
                  {qEl}
                  {!done && Q && (
                    <div className="card col" style={{ gap: '.5rem', padding: '.7rem' }}>
                      <Frame f={Q.f} typed={typed} len={A.length} />
                      <Keyboard onKey={typeKey} onMark={markKey} onDel={delKey} glow={glow} kata={kata} setKata={setKata} />
                      <div className="row between wrapflex">
                        {hintBtn}
                        {countEl}
                        <div className="row">
                          <Btn color="white" size="sm" onClick={() => setTyped('')} data-key="clear">ぜんぶ けす</Btn>
                          <Btn color="green" size="lg" disabled={!full} className={full ? 'pulse' : ''} onClick={check} data-check="1">こたえる ✔</Btn>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            );
          })()}
          {flash && <div className="seikai"><span>せいかい！</span></div>}
          {done && !done.clearScreen && (
            <Modal>
              <div className="col" style={{ alignItems: 'center', textAlign: 'center' }} data-text-done="1">
                <div className="bold" style={{ fontSize: '2.2rem', color: '#f97316' }}>🎉 じけん かいけつ！</div>
                <div className="row wrapflex center" style={{ width: '100%', gap: '.5rem' }}>
                  {keys.map(k => (
                    <div key={k} className="clue on" style={{ borderColor: KCOLOR[k], flex: '1 1 40%', maxWidth: '22rem' }}>
                      <div className="lab" style={{ color: KCOLOR[k] }}>{KICON[k]} {KNAME[k]}</div>
                      <div className="val kw"><R t={text.span[k]} /></div>
                    </div>
                  ))}
                </div>
                {done.sticker ? (
                  <div className="col" style={{ alignItems: 'center' }}>
                    <div style={{ fontSize: '1.3rem' }}>シールを ゲット！</div>
                    <Sticker s={done.sticker} big />
                    <div className="bold" style={{ fontSize: '1.4rem' }}>{done.sticker.n}</div>
                  </div>
                ) : <div className="row center"><Wanda pose="happy" size={140} bob={false} /><div className="bubble left" style={{ fontSize: '1.3rem' }}>よく できたね！</div></div>}
                {done.bonus && done.bonus.length > 0 && <div className="col" style={{ alignItems: 'center' }}><div className="bold">レベル{stage.lv} ぜんぶ クリアの ボーナス！</div><div className="row">{done.bonus.map(b => <Sticker key={b.id} s={b} />)}</div></div>}
                {done.rankUp && (
                  <div className="card row" style={{ background: '#fef9c3', borderColor: '#facc15' }} data-rankup="1">
                    <span className="emoji" style={{ fontSize: '3.2rem' }}>{done.rankUp.icon}</span>
                    <div className="bold" style={{ fontSize: '1.3rem', textAlign: 'left' }}>たんていバッジを どうぞ！<br />しょうごうが「{done.rankUp.name}」に なったよ！</div>
                  </div>
                )}
                <Btn color="green" size="lg" onClick={nextText} data-next="1">{done.stageDone ? 'ステージ クリア！ ▶' : 'つぎの なぞへ ▶'}</Btn>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    /* =========================================================
       シールの コレクション・しょうごう
       ========================================================= */
    function Collection({ app, go }) {
      const st = app.state;
      const [cat, setCat] = useState(STICKER_CATS[0].id);
      const C = STICKER_CATS.find(c => c.id === cat);

          <div className="row wrapflex" style={{ gap: '.4rem', marginBottom: '.8rem' }}>

              const n = STICKERS.filter(s => s.cat === c.id && st.stickers[s.id]).length;

                  {st.stickers[s.id] ? <Sticker s={s} /> : <Sticker none />}
                  <div className="bold" style={{ fontSize: '.95rem' }}>{st.stickers[s.id] ? s.n : '？？？'}</div>
                </div>
              ))}

          </div>
          <div className="muted tc" style={{ marginTop: '.6rem' }}>なぞを はじめて とくと、シールが 1まい もらえるよ。</div>

    function Badges({ app, go }) {
      const st = app.state;
      const n = solvedCount(st);
      return (
        <div className="wrap">
          <TopBar left={<Btn color="white" size="sm" onClick={() => go({ name: 'home' })}>🏠 もどる</Btn>} title="🏅 しょうごうと たんていバッジ" />
          <div className="col">
            {TITLES.map((t, i) => {
              const got = n >= t.min;
              return (
                <div key={i} className="card row" style={{ opacity: got ? 1 : .5, borderColor: got ? '#facc15' : undefined }}>
                  <span className="emoji" style={{ fontSize: '2.8rem' }}>{got ? t.icon : '🔒'}</span>
                  <div className="grow"><div className="bold" style={{ fontSize: '1.5rem' }}>{t.name}</div><div className="muted">なぞを {t.min}つ とく{t.min === 100 ? '（ぜんぶ）' : ''}</div></div>
                  {got && <span className="pill" style={{ background: '#fef3c7', color: '#92400e' }}>ゲット！</span>}
                </div>

    /* =========================================================
       先生用画面
       ========================================================= */
    function PinPad({ onOk, onCancel, check }) {
      const [v, setV] = useState('');
      const [err, setErr] = useState(false);
      const press = d => {
        const nv = (v + d).slice(0, 4); setV(nv); setErr(false);
        if (nv.length === 4) { if (check(nv)) onOk(); else { setErr(true); setTimeout(() => setV(''), 400); } }
      };
      return (
        <Modal onClose={onCancel}>
          <div className="col" style={{ alignItems: 'center' }}>
            <div className="bold" style={{ fontSize: '1.3rem' }}>先生用画面：暗証番号（4けた）</div>
            <div style={{ fontSize: '2rem', letterSpacing: '.5em', minHeight: '2.4rem' }}>{'●'.repeat(v.length)}{'○'.repeat(4 - v.length)}</div>
            {err && <div style={{ color: '#be123c' }} className="bold">番号がちがいます</div>}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 4.5rem)', gap: '.5rem' }}>
              {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => <Btn key={d} color="white" size="lg" onClick={() => press(d)} data-pin={d}>{d}</Btn>)}
              <Btn color="white" size="md" onClick={() => setV('')}>けす</Btn>
              <Btn color="white" size="lg" onClick={() => press('0')} data-pin="0">0</Btn>
              <Btn color="white" size="md" onClick={onCancel}>やめる</Btn>
            </div>
          </div>
        </Modal>
      );
    }
    function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
    function RecordsTab({ app }) {
      const st = app.state;
      const [hist, setHist] = useState(null);
      useEffect(() => { DB.getAll('history').then(h => setHist(h.sort((a, b) => b.at - a.at))).catch(() => setHist([])); }, []);
      if (!hist) return <div>よみこみちゅう…</div>;
      const byKey = {}; KEYS.forEach(k => { byKey[k] = { n: 0, first: 0, mis: 0, hints: 0 }; });
      const errs = {};
      hist.forEach(h => {
        const b = byKey[h.key]; if (b) { b.n++; if (!h.mistakes && !h.hints) b.first++; b.mis += h.mistakes || 0; if (h.hints) b.hints++; }
        (h.errors || []).forEach(e => { errs[e] = (errs[e] || 0) + 1; });
      });
      const hard = {};
      hist.forEach(h => { if (h.mistakes || h.hints) { const k = h.textId + ':' + h.key; const x = hard[k] || (hard[k] = { ...h, mis: 0, times: 0, hintMax: 0, answers: [] }); x.mis += h.mistakes || 0; x.times++; x.hintMax = Math.max(x.hintMax, h.hints || 0); x.answers = [...x.answers, ...(h.answers || [])]; } });
      const hardList = Object.values(hard).sort((a, b) => b.mis - a.mis || b.hintMax - a.hintMax).slice(0, 30);
      return (
        <div className="col">
          <div className="row wrapflex">
            {[['といた文章', `${solvedCount(st)} / ${ALL_TEXTS.length}`], ['シール', `${stickerCount(st)} / ${STICKERS.length}`], ['しょうごう', titleOf(st).name], ['答えた問い', `${hist.length}`]].map(([a, b]) => (
              <div key={a} className="card grow" style={{ padding: '.6rem' }}><div className="muted" style={{ fontSize: '.9rem' }}>{a}</div><div className="bold" style={{ fontSize: '1.3rem' }}>{b}</div></div>
            ))}
          </div>
          <div className="card">
            <div className="bold">手がかりごとの ようす（どの手がかりで つまずいているか）</div>
            <table className="tbl" style={{ marginTop: '.4rem' }} data-clue-table="1">
              <thead><tr><th>手がかり</th><th>答えた数</th><th>1回で正解（ヒントなし）</th><th>まちがえた回数</th><th>ヒントを使った問い</th></tr></thead>
              <tbody>{KEYS.map(k => { const b = byKey[k]; const p = pct(b.first, b.n); return (
                <tr key={k}><td style={{ color: KCOLOR[k] }} className="bold">{KICON[k]} {KNAME[k]}</td><td>{b.n}</td>
                  <td><div className="row"><div className="bar grow"><i style={{ width: p + '%', background: KCOLOR[k] }} /></div><span style={{ width: '3.5em' }}>{b.n ? p + '%' : '－'}</span></div></td>
                  <td>{b.mis}</td><td>{b.hints}</td></tr>); })}</tbody>
            </table>
          </div>
          <div className="card">
            <div className="bold">まちがい方</div>
            <div className="row wrapflex" style={{ marginTop: '.4rem' }}>{Object.keys(ERR).map(e => <span key={e} className="pill" style={{ background: '#f1f5f9' }}>{ERR[e]}：{errs[e] || 0}回</span>)}</div>
            <div className="muted" style={{ fontSize: '.85rem', marginTop: '.3rem' }}>手がかりの取りちがえ＝「いつ」に場所を答える など。文の中の別のことば＝2文・3文で、ほかの時間や場所を選んだ。ひらがな・カタカナのちがい＝正解として数えています。</div>
          </div>
          <div className="card">
            <div className="bold">ステージの ようす</div>
            <table className="tbl" style={{ marginTop: '.4rem' }}>
              <thead><tr><th>ステージ</th><th>状態</th><th>といた文章</th></tr></thead>
              <tbody>{STAGES.map(s => { const p = prog(st, s.id); const n = s.texts.filter(x => st.solved[x.id]).length; return (
                <tr key={s.id}><td>{stageLabel(s)}：{plain(s.name)}</td><td>{p.cleared ? `◎ クリア（${p.clears}回）` : p.idx ? `${p.idx} / 5 まで` : isStageOpen(s, st) ? '未着手' : '🔒'}</td><td>{n} / {s.texts.length}</td></tr>); })}</tbody>
            </table>
          </div>
          <div className="card">
            <div className="bold">つまずいた問い（まちがいが多い順）</div>
            {hardList.length ? (
              <table className="tbl" style={{ marginTop: '.4rem' }} data-hard="1">
                <thead><tr><th>文章</th><th>手がかり</th><th>問い</th><th>正しい答え</th><th>答えた内容</th><th>まちがい</th><th>ヒント</th></tr></thead>
                <tbody>{hardList.map((h, i) => (
                  <tr key={i}><td>{h.textId}<br /><span className="muted" style={{ fontSize: '.8rem' }}>{TEXT_MAP[h.textId] ? TEXT_MAP[h.textId].t.map(plain).join('') : ''}</span></td><td style={{ color: KCOLOR[h.key] }}>{KNAME[h.key]}</td><td>{plain(h.q)}</td><td>{plain(h.correct)}</td><td>{h.answers.map(plain).join(' → ')}</td><td>{h.mis}</td><td>{h.hintMax ? `${h.hintMax}だんかい` : ''}</td></tr>
                ))}</tbody>
              </table>
            ) : <div className="muted">まだ ありません。</div>}
          </div>
          <div className="card">
            <div className="bold">さいきんの 記録</div>
            <table className="tbl" style={{ marginTop: '.4rem' }}>
              <thead><tr><th>日時</th><th>文章</th><th>手がかり</th><th>結果</th><th>答えた内容</th><th>秒</th></tr></thead>
              <tbody>{hist.slice(0, 40).map((h, i) => <tr key={i}><td>{fmtDate(h.at)}</td><td>{h.textId}</td><td>{KNAME[h.key]}</td><td>{h.result}{h.mistakes ? `（まちがい${h.mistakes}）` : ''}</td><td>{(h.answers || []).map(plain).join(' → ')}</td><td>{h.sec}</td></tr>)}</tbody>
            </table>
          </div>
        </div>
      );
    }
    function SettingsTab({ app }) {
      const st = app.state; const s = st.settings;
      const set = (k, v) => app.update(x => ({ ...x, settings: { ...x.settings, [k]: v } }));
      const Opt = ({ k, label, opts }) => (
        <div className="row wrapflex" style={{ padding: '.4rem 0', borderBottom: '1px solid #f1f5f9' }}>
          <div className="bold" style={{ width: '14rem' }}>{label}</div>
          {opts.map(([v, t]) => <button key={String(v)} className={`tab ${s[k] === v ? 'on' : ''}`} onClick={() => set(k, v)} data-set={`${k}:${v}`}>{t}</button>)}
        </div>
      );
      const [name, setName] = useState(st.profile.name);
      const [pin, setPin] = useState(''); const [pin2, setPin2] = useState(''); const [msg, setMsg] = useState('');
      return (
        <div className="col">
          <div className="card">
            <Opt k="voice" label="ワンダせんせいの声" opts={[[true, 'あり'], [false, 'なし']]} />
            <Opt k="rate" label="読み上げの速さ" opts={[[0.6, 'とても ゆっくり'], [0.7, 'ゆっくり'], [0.8, '少し ゆっくり'], [0.9, 'ふつう'], [1.0, 'はやめ']]} />
            <Opt k="autoRead" label="文章の自動読み上げ" opts={[[true, 'する'], [false, 'しない（🔊ボタンで読む）']]} />
            <Opt k="furigana" label="ふりがな" opts={[[true, 'つける'], [false, 'つけない']]} />
            <Opt k="fontSize" label="文字の大きさ" opts={[['m', 'ふつう'], ['l', '大きい'], ['xl', 'とても大きい']]} />
            <Opt k="sfx" label="効果音・ファンファーレ" opts={[[true, 'あり'], [false, 'なし']]} />
            <Opt k="unlockAll" label="ステージ" opts={[[false, '順番に開く'], [true, 'すべて開く']]} />
            <div className="row" style={{ marginTop: '.5rem' }}><Btn color="white" size="sm" onClick={() => TTS.speak('あさ、ゆうとくんは こうえんで ボールを けりました。', { force: true })}>🔊 読み上げを ためす</Btn></div>
          </div>
          <div className="card col">
            <div className="bold">子どもの名前</div>
            <div className="row"><input className="inp" value={name} onChange={e => setName(e.target.value)} /><Btn color="navy" size="sm" onClick={() => { if (name.trim()) { app.update(x => ({ ...x, profile: { ...x.profile, name: name.trim().slice(0, 20) } })); setMsg('名前を変更しました。'); } }}>変更</Btn></div>
            <div className="bold">暗証番号の変更</div>
            <div className="row wrapflex">
              <input className="inp" style={{ width: 120 }} type="password" inputMode="numeric" maxLength={4} placeholder="新しい番号" value={pin} onChange={e => setPin(e.target.value.replace(/\D/g, ''))} />
              <input className="inp" style={{ width: 120 }} type="password" inputMode="numeric" maxLength={4} placeholder="確認" value={pin2} onChange={e => setPin2(e.target.value.replace(/\D/g, ''))} />
              <Btn color="navy" size="sm" onClick={() => {
                if (!/^\d{4}$/.test(pin)) return setMsg('暗証番号は4けたの数字にしてください。');
                if (pin !== pin2) return setMsg('確認用の番号が一致しません。');
                app.update(x => ({ ...x, profile: { ...x.profile, pin: hashPin(pin) } })); setPin(''); setPin2(''); setMsg('暗証番号を変更しました。');
              }}>変更</Btn>
            </div>
            {msg && <div className="bold" style={{ color: '#047857' }}>{msg}</div>}
          </div>
        </div>
      );
    }
    function DataTab({ app }) {
      const st = app.state;
      const [url, setUrl] = useState(st.sync.url || '');
      const [key, setKey] = useState(st.sync.key || '');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(null);
      const refresh = () => DB.getAll('history').then(h => setPending(h.filter(x => !x.sent).length)).catch(() => setPending(0));
      useEffect(() => { refresh(); }, []);
      const saveSync = () => {
        const u = url.trim();
        if (u && !REC_URL_RE.test(u)) { setMsg('URLの形がちがいます。「https://script.google.com/macros/s/…/exec」の形のURLを入れてください。'); return; }
        app.update(s => ({ ...s, sync: { ...s.sync, url: u, key: key.trim(), lastSummary: null } }));
        setMsg('送り先を保存しました。');
      };
      const send = async (all) => {
        setMsg('送信しています…');
        const r = await Sync.run(app, { all });
        refresh();
        setMsg(r.ok ? `送信しました（${r.sent}件）。` : r.reason === 'nourl' ? '送り先が設定されていません。' : r.reason === 'offline' ? 'インターネットにつながっていません。' : syncErrorText(r.reason));
      };
      const csv = async () => {
        const hist = (await DB.getAll('history')).sort((a, b) => a.at - b.at);
        const head = ['日時', 'なまえ', 'レベル', 'ステージ', '文章番号', '手がかり', '問い', '正しい答え', '答えた内容', '結果', 'まちがえた回数', 'ヒントの段階', 'かかった時間(秒)', 'つまずき'];
        const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
        const rows = hist.map(h => { const r = syncRecord(st, h); return [fmtDate(h.at), st.profile.name, r.level, r.stage, r.textId, r.clue, r.q, r.correct, r.answers, r.result, r.mistakes, r.hints, r.sec, r.errors]; });
        downloadFile(`なぞとき_きろく_${st.profile.name}_${ymd()}.csv`, '﻿' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
      };
      const backup = async () => {
        const hist = await DB.getAll('history');
        downloadFile(`なぞとき_バックアップ_${st.profile.name}_${ymd()}.json`, JSON.stringify({ app: APP_ID, at: Date.now(), state: st, history: hist }), 'application/json');
      };
      const restore = async () => {
        const f = await pickFile('application/json,.json');
        if (!f) return;
        try {
          const d = JSON.parse(await f.text());
          if (d.app !== APP_ID || !d.state) throw new Error('bad');
          if (!confirm('今の記録を消して、バックアップから戻します。よろしいですか？')) return;
          await DB.clear('history');
          for (const h of d.history || []) { const { id, ...rest } = h; await DB.add('history', rest); }
          app.replace(normalizeState(d.state));
          setMsg('バックアップから戻しました。');
        } catch (e) { setMsg('このファイルは読み込めませんでした。'); }
      };
      const wipe = async () => {
        if (!confirm('この端末の記録（すすみぐあい・シール・答えた記録）をすべて消します。よろしいですか？')) return;
        if (!confirm('本当に消しますか？ 元にはもどせません。')) return;
        await DB.clear('history');
        app.update(s => ({ ...s, progress: {}, solved: {}, stickers: {}, textSticker: {}, bonus: {}, rank: 0 }));
        refresh(); setMsg('記録を消しました。');
      };
      const stat = (a, b) => <div className="card grow" style={{ padding: '.6rem' }}><div className="muted" style={{ fontSize: '.9rem' }}>{a}</div><div className="bold" style={{ fontSize: '1.1rem' }}>{b}</div></div>;
      return (
        <div className="col">
          <div className="card col">
            <div className="bold">先生のスプレッドシートへの送信</div>
            <div className="row wrapflex">
              {stat('まだ送っていない記録', pending == null ? '…' : `${pending}件`)}
              {stat('さいごに送れた日時', st.sync.lastOkAt ? fmtDate(st.sync.lastOkAt) : '－')}
              {stat('送り先', st.sync.url ? '設定ずみ' : 'なし')}
            </div>
            {st.sync.lastError && <div style={{ color: '#be123c' }}>前回のエラー：{syncErrorText(st.sync.lastError)}</div>}
            <label><div className="bold" style={{ fontSize: '.9rem' }}>送り先のURL（…/exec）</div><input className="inp" style={{ width: '100%' }} value={url} onChange={e => setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/……/exec" data-sync-url="1" /></label>
            <label><div className="bold" style={{ fontSize: '.9rem' }}>合言葉</div><input className="inp" value={key} onChange={e => setKey(e.target.value)} data-sync-key="1" /></label>
            <div className="muted" style={{ fontSize: '.85rem' }}>入口ページから開けば、URLと合言葉は自動で入ります。</div>
            <div className="row wrapflex">
              <Btn color="navy" size="sm" onClick={saveSync}>送り先を保存</Btn>
              <Btn color="green" size="sm" onClick={() => send(false)}>今すぐ送る</Btn>
              <Btn color="white" size="sm" onClick={() => send(true)}>全部を送り直す</Btn>
            </div>
          </div>
          <div className="card col">
            <div className="bold">ファイル</div>
            <div className="row wrapflex">
              <Btn color="white" size="sm" onClick={csv} data-csv="1">📄 CSVで書き出す</Btn>
              <Btn color="white" size="sm" onClick={backup}>💾 バックアップ</Btn>
              <Btn color="white" size="sm" onClick={restore}>📂 バックアップから戻す</Btn>
              <Btn color="red" size="sm" onClick={wipe}>🗑️ 記録を消す</Btn>
            </div>
          </div>
          {msg && <div className="bold" style={{ color: '#1e3a8a' }} data-data-msg="1">{msg}</div>}
        </div>
      );
    }
    function Teacher({ app, go }) {
      const [tab, setTab] = useState('rec');
      return (
        <div className="wrap">
          <TopBar left={<Btn color="white" size="sm" onClick={() => go({ name: 'home' })}>🏠 もどる</Btn>} title={`⚙️ 先生用画面（${app.state.profile.name}）`} />
          <div className="row wrapflex" style={{ marginBottom: '.8rem' }}>
            {[['rec', '📊 記録'], ['set', '🛠️ 設定'], ['data', '💾 データ']].map(([k, t]) => <button key={k} className={`tab ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)} data-ttab={k}>{t}</button>)}
          </div>
          {tab === 'rec' && <RecordsTab app={app} />}
          {tab === 'set' && <SettingsTab app={app} />}
          {tab === 'data' && <DataTab app={app} />}
        </div>
      );
    }

    /* =========================================================
       アプリ全体
       ========================================================= */
    function App() {
      const [state, setState] = useState(loadState);
      const stateRef = useRef(state);
      const [view, setView] = useState({ name: 'home' });
      const [pinOpen, setPinOpen] = useState(false);
      // すぐに 計算して 保存する（ごほうびの 結果を その場で 使うため）
      const update = useCallback(fn => {
        const next = fn(stateRef.current); stateRef.current = next; CURRENT.settings = next.settings; saveState(next); setState(next);
        return next;
      }, []);
      const replace = useCallback(next => { stateRef.current = next; CURRENT.settings = next.settings; saveState(next); setState(next); }, []);
      const app = { state, stateRef, update, replace };
      CURRENT.settings = state.settings;
      useEffect(() => { document.documentElement.style.fontSize = (FONT_PX[state.settings.fontSize] || 16) + 'px'; }, [state.settings.fontSize]);
      useEffect(() => {
        const trySync = () => Sync.run({ stateRef, update });
        const id = setTimeout(trySync, 1500);
        window.addEventListener('online', trySync);
        return () => { clearTimeout(id); window.removeEventListener('online', trySync); };
      }, []);
      const go = v => { TTS.cancel(); if (v.name === 'teacher') { setPinOpen(true); return; } setView(v); window.scrollTo(0, 0); };
      if (!state.profile) return <Setup onDone={p => update(s => ({ ...s, profile: p }))} />;
      let body;
      if (view.name === 'stages') body = <Stages app={app} lv={view.lv} go={go} />;
      else if (view.name === 'play') body = <Play key={view.stageId + (view.k || '')} app={app} stageId={view.stageId} go={go} />;
      else if (view.name === 'collection') body = <Collection app={app} go={go} />;
      else if (view.name === 'badges') body = <Badges app={app} go={go} />;
      else if (view.name === 'teacher') body = <Teacher app={app} go={go} />;
      else body = <Home app={app} go={go} />;
      return (
        <>
          {body}
          {pinOpen && <PinPad check={v => hashPin(v) === state.profile.pin} onOk={() => { setPinOpen(false); setView({ name: 'teacher' }); }} onCancel={() => setPinOpen(false)} />}
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
