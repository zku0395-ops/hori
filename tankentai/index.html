          </div>
        </div>
      );
    }
    function DataTab({ app }) {
      const st = app.state;
      const [url, setUrl] = useState(st.sync.url || '');
      const [key, setKey] = useState(st.sync.key || '');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(null);
      const refresh = () => DB.getAll('history').then(h => setPending(h.filter(x => !x.sent).length)).catch(() => setPending(0));
      useEffect(() => { refresh(); }, []);
      const sheetPending = st.roster.reduce((n, k) => n + PREFS.filter(p => { const kp = kidPref(st, k.id, p.id); return (kp.rev || 0) !== (kp.sentRev || 0); }).length, 0);
      const saveSync = () => {
        const u = url.trim();
        if (u && !REC_URL_RE.test(u)) { setMsg('URLの形がちがいます。「https://script.google.com/macros/s/…/exec」の形のURLを入れてください。'); return; }
        app.update(s => ({ ...s, sync: { ...s.sync, url: u, key: key.trim(), lastSummary: {} } }));
        setMsg('送り先を保存しました。');
      };
      const send = async (all) => {
        setMsg('送信しています…');
        const r = await Sync.run(app, { all });
        refresh();
        setMsg(r.ok ? `送信しました（${r.sent}件）。` : r.reason === 'nourl' ? '送り先が設定されていません。' : r.reason === 'offline' ? 'インターネットにつながっていません。' : syncErrorText(r.reason));
      };
      const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
      const nameOf = id => (st.roster.find(k => k.id === id) || { name: '' }).name;
      const csvQuiz = async () => {
        const hist = (await DB.getAll('history')).sort((a, b) => a.at - b.at);
        const head = ['日時', 'なまえ', '都道府県', '項目', '問い', '正しい答え', '答えた内容', '結果', 'まちがえた回数', 'ヒントの段階', 'かかった時間(秒)'];
        const rows = hist.map(h => { const r = syncRecord(st, h); return [fmtDate(h.at), nameOf(h.kid), r.pref, r.item, r.q, r.correct, r.answers, r.result, r.mistakes, r.hints, r.sec]; });
        downloadFile(`たんけんたい_クイズ_${ymd()}.csv`, '﻿' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
      };
      const csvSheet = () => {
        const head = ['なまえ', '都道府県', 'できた項目'];
        const maxItems = Math.max(...PREFS.map(p => p.items.length));
        for (let i = 1; i <= maxItems; i++) head.push(`${i} 項目`, `${i} 写真`, `${i} 書いた文`);
        const rows = [];
        st.roster.forEach(k => PREFS.forEach(p => {
          const sp = sheetPayload(st, k.id, k.name, p);
          const r = [k.name, sp.pref, `${sp.done} / ${sp.total}`];
          sp.items.forEach(it => r.push(it.name, it.photo && it.done ? it.photo : '', it.text));
          rows.push(r);
        }));
        downloadFile(`たんけんたい_しんぶん_${ymd()}.csv`, '﻿' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
      };
      const backup = async () => {
        const hist = await DB.getAll('history');
        downloadFile(`たんけんたい_バックアップ_${ymd()}.json`, JSON.stringify({ app: APP_ID, at: Date.now(), state: st, history: hist }), 'application/json');
      };
      const restore = async () => {
        const f = await pickFile('application/json,.json');
        if (!f) return;
        try {
          const d = JSON.parse(await f.text());
          if (d.app !== APP_ID || !d.state) throw new Error('bad');
          if (!confirm('今の記録を消して、バックアップから戻します。よろしいですか？')) return;
          await DB.clear('history');
          for (const h of d.history || []) { const { id, ...rest } = h; await DB.add('history', rest); }
          app.replace(normalizeState(d.state));
          setMsg('バックアップから戻しました。');
        } catch (e) { setMsg('このファイルは読み込めませんでした。'); }
      };
      const wipe = async () => {
        if (!confirm('この端末の記録（全員の すすみぐあい・シール・書いたシート・クイズの記録）をすべて消します。名簿と設定は残ります。よろしいですか？')) return;
        if (!confirm('本当に消しますか？ 元にはもどせません。')) return;
        await DB.clear('history');
        app.update(s => ({ ...s, kids: {} }));
        refresh(); setMsg('記録を消しました。');
      };
      const stat = (a, b) => <div className="card grow" style={{ padding: '.6rem' }}><div className="muted" style={{ fontSize: '.9rem' }}>{a}</div><div className="bold" style={{ fontSize: '1.1rem' }}>{b}</div></div>;
      return (
        <div className="col">
          <div className="card col">
            <div className="bold">先生のスプレッドシートへの送信</div>
            <div className="row wrapflex">
              {stat('まだ送っていないクイズの記録', pending == null ? '…' : `${pending}件`)}
              {stat('まだ送っていないシート', `${sheetPending}まい`)}
              {stat('さいごに送れた日時', st.sync.lastOkAt ? fmtDate(st.sync.lastOkAt) : '－')}
              {stat('送り先', st.sync.url ? '設定ずみ' : 'なし')}
            </div>
            {st.sync.lastError && <div style={{ color: '#be123c' }}>前回のエラー：{syncErrorText(st.sync.lastError)}</div>}
            <label><div className="bold" style={{ fontSize: '.9rem' }}>送り先のURL（…/exec）</div><input className="inp" style={{ width: '100%' }} value={url} onChange={e => setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/……/exec" data-sync-url="1" /></label>
            <label><div className="bold" style={{ fontSize: '.9rem' }}>合言葉</div><input className="inp" value={key} onChange={e => setKey(e.target.value)} data-sync-key="1" /></label>
            <div className="muted" style={{ fontSize: '.85rem' }}>入口ページから開けば、URLと合言葉は自動で入ります。</div>
            <div className="row wrapflex">
              <Btn color="navy" size="sm" onClick={saveSync}>送り先を保存</Btn>
              <Btn color="green" size="sm" onClick={() => send(false)} data-send="1">今すぐ送る</Btn>
              <Btn color="white" size="sm" onClick={() => send(true)}>全部を送り直す</Btn>
            </div>
          </div>
          <div className="card col">
            <div className="bold">ファイル</div>
            <div className="row wrapflex">
              <Btn color="white" size="sm" onClick={csvSheet} data-csv-sheet="1">📄 シートをCSVで書き出す</Btn>
              <Btn color="white" size="sm" onClick={csvQuiz} data-csv-quiz="1">📄 クイズの記録をCSVで書き出す</Btn>
              <Btn color="white" size="sm" onClick={backup}>💾 バックアップ</Btn>
              <Btn color="white" size="sm" onClick={restore}>📂 バックアップから戻す</Btn>
              <Btn color="red" size="sm" onClick={wipe}>🗑️ 記録を消す</Btn>
            </div>
          </div>
          {msg && <div className="bold" style={{ color: '#1e3a8a' }} data-data-msg="1">{msg}</div>}
        </div>
      );
    }
    function Teacher({ app, go, tab, setTab, back }) {
      return (
        <div className="wrap">
          <TopBar left={<Btn color="white" size="sm" onClick={back}>◀ もどる</Btn>} title="⚙️ 先生用画面" />
          <div className="row wrapflex" style={{ marginBottom: '.8rem' }}>
            {[['rec', '📊 記録'], ['roster', '👥 名簿'], ['set', '🛠️ 設定'], ['data', '💾 データ']].map(([k, t]) => <button key={k} className={`tab ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)} data-ttab={k}>{t}</button>)}
          </div>
          {tab === 'rec' && <RecordsTab app={app} go={go} />}
          {tab === 'roster' && <div className="card"><RosterEditor app={app} /></div>}
          {tab === 'set' && <SettingsTab app={app} />}
          {tab === 'data' && <DataTab app={app} />}
        </div>
      );
    }

    /* =========================================================
       アプリ全体
       ========================================================= */
    function App() {
      const [state, setState] = useState(loadState);
      const stateRef = useRef(state);
      const [view, setView] = useState({ name: 'names' });
      const [kid, setKid] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [ttab, setTtab] = useState('rec');
      // すぐに 計算して 保存する（ごほうびの 結果を その場で 使うため）
      const update = useCallback(fn => {
        const next = fn(stateRef.current); stateRef.current = next; CURRENT.settings = next.settings; saveState(next); setState(next);
        return next;
      }, []);
      const replace = useCallback(next => { stateRef.current = next; CURRENT.settings = next.settings; saveState(next); setState(next); }, []);
      const app = { state, stateRef, update, replace };
      CURRENT.settings = state.settings;
      useEffect(() => { document.documentElement.style.fontSize = (FONT_PX[state.settings.fontSize] || 16) + 'px'; }, [state.settings.fontSize]);
      useEffect(() => {
        const trySync = () => Sync.run({ stateRef, update });
        const id = setTimeout(trySync, 1500);
        window.addEventListener('online', trySync);
        return () => { clearTimeout(id); window.removeEventListener('online', trySync); };
      }, []);
      const go = v => {
        TTS.cancel();
        if (v.name === 'teacher') { setPinOpen(true); return; }
        if (v.name === 'sheet' && !v.ret) v = { ...v, ret: view };
        setView(v); window.scrollTo(0, 0);
      };
      if (!state.setupDone) return <Setup app={app} />;
      const validKid = kid && state.roster.some(k => k.id === kid);
      let body;
      if (view.name === 'teacher') body = <Teacher app={app} go={go} tab={ttab} setTab={setTtab} back={() => go(validKid ? { name: 'home' } : { name: 'names' })} />;
      else if (view.name === 'sheet') body = <SheetPage app={app} kid={view.kid || kid} pid={view.pid} go={go} back={() => { TTS.cancel(); if (document.fullscreenElement) document.exitFullscreen(); setView(view.ret || { name: 'home' }); window.scrollTo(0, 0); }} />;
      else if (!validKid || view.name === 'names') body = <PickName app={app} go={go} onPick={id => { setKid(id); setView({ name: 'home' }); }} />;
      else if (view.name === 'pref') body = <PrefPage app={app} kid={kid} pid={view.pid} go={go} />;
      else if (view.name === 'item') body = <ItemPage key={view.iid} app={app} kid={kid} pid={view.pid} iid={view.iid} go={go} />;
      else if (view.name === 'stamp') body = <StampPage app={app} kid={kid} pid={view.pid} go={go} />;
      else if (view.name === 'book') body = <Book app={app} kid={kid} go={go} />;
      else body = <Home app={app} kid={kid} go={go} />;
      return (
        <>
          {body}
          {pinOpen && <PinPad check={v => hashPin(v) === state.pin} onOk={() => { setPinOpen(false); setView({ name: 'teacher' }); }} onCancel={() => setPinOpen(false)} />}
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
