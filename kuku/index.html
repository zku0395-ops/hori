<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忍者九九修行</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'BIZ UDPGothic', sans-serif; background: #eef2ff; margin: 0; color: #1e1b4b;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .btn3d { border-bottom-width: 6px; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; }
    .pop { animation: pop .45s cubic-bezier(.17,.89,.32,1.28) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floaty { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .shake { animation: shake .45s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-9px); } 40%,80% { transform: translateX(9px); } }
    .glow { animation: glow 1.1s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 14px rgba(250,204,21,0); } }
    .coinfly { animation: coinfly 1.1s ease-out forwards; }
    .fly { animation: fly .5s ease-in forwards; }
    @keyframes fly { 0% { left: 18%; transform: rotate(0); opacity: 1; } 90% { left: 72%; transform: rotate(810deg); opacity: 1; } 100% { left: 74%; transform: rotate(900deg); opacity: 0; } }
    .fade-out { animation: fadeout 2.6s forwards; }
    @keyframes fadeout { 0% { transform: scale(.4); opacity: 0; } 10% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    .ouch { animation: ouch .5s .45s; }
    @keyframes ouch { 0%,100% { transform: translateX(0); filter: none; } 20% { transform: translateX(14px); filter: brightness(1.8); } 50% { transform: translateX(-8px); } 75% { transform: translateX(5px); } }
    .smoke { animation: smoke 1.4s ease-out forwards; }
    @keyframes smoke { 0% { transform: scale(.3); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
    .vanish { transition: opacity .9s .3s, transform .9s .3s; opacity: 0; transform: scale(.5); }
    .runaway { transition: transform 1.2s ease-in, opacity 1.2s; transform: translateX(160%); opacity: 0; }
    .enemy-idle { animation: eidle 2.2s ease-in-out infinite; }
    @keyframes eidle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes coinfly { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }
    .bump { animation: bump .5s; }
    @keyframes bump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.35); } }
    .drop-in { animation: dropin .35s ease-out both; }
    @keyframes dropin { from { transform: translateY(-26px) scale(.6); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    .hop { animation: hop 2.4s ease-in-out infinite; }
    @keyframes hop { 0%,70%,100% { transform: translateY(0); } 80% { transform: translateY(-14px); } 90% { transform: translateY(0); } }
    .spin { animation: spin 1.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .confetti span { position: absolute; animation: fall 1.6s ease-in forwards; }
    @keyframes fall { from { transform: translateY(-40px) rotate(0); opacity: 1; } to { transform: translateY(260px) rotate(320deg); opacity: 0; } }
    .bubble:after { content: ''; position: absolute; left: -14px; top: 22px; border: 8px solid transparent; border-right: 8px solid #fff; }
    .chara-img { filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
    .night { background: linear-gradient(#0b1033 0%, #1e2a6b 55%, #2f3f86 100%); }
    .washi { background-color: #f8f5ec; background-image: radial-gradient(circle at 20% 30%, rgba(99,102,241,.06) 0 20px, transparent 21px), radial-gradient(circle at 70% 70%, rgba(99,102,241,.06) 0 16px, transparent 17px); background-size: 110px 110px; }
    .tray { background: linear-gradient(#a16207, #854d0e); border: 3px solid #713f12; }
    .wall { background: linear-gradient(#fbfaf7, #ece7da); }
    .roof { clip-path: polygon(6% 100%, 0 70%, 12% 0, 88% 0, 100% 70%, 94% 100%); }
    .stone { background-color: #6b7280; background-image: linear-gradient(90deg, rgba(0,0,0,.15) 1px, transparent 1px), linear-gradient(rgba(0,0,0,.15) 1px, transparent 1px); background-size: 44px 22px; }
    .boards { background: repeating-linear-gradient(90deg, #c08a52 0 46px, #a87342 46px 48px); }
    .walk { transition: left .6s ease-in-out; }
    .throw { animation: throw .55s ease-in forwards; }
    @keyframes throw { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--tx), var(--ty)) rotate(720deg); opacity: 1; } }
    .sway { animation: sway 3.4s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: translateX(-90px); } to { transform: translateX(90px); } }
    .lid-open { animation: lid .6s ease-out forwards; transform-origin: 10% 100%; }
    @keyframes lid { to { transform: rotate(-35deg) translateY(-8px); } }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#312e81;font-weight:bold;">じゅんび ちゅう…</div>
  </div>

  <!-- 問題の データと 絵は GitHub Pages から読みこみます（このファイルを短くするため） -->
  <script>
    (function () {
      var h = location.hostname;
      var local = location.protocol === 'file:' || /github\.io$/.test(h) || h === 'localhost' || h === '127.0.0.1';
      window.KUKU_BASE = local ? '' : 'https://zku0395-ops.github.io/hori/kuku/';
      var V = '1';
      window.KUKU_READY = new Promise(function (ok, ng) {
        var s = document.createElement('script');
        s.src = window.KUKU_BASE + 'data/mondai.js?v=' + V;
        s.onload = ok; s.onerror = function () { ng(new Error('data/mondai.js')); };
        document.head.appendChild(s);
      });
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;
    const APP_VERSION = '1.1.0';
    const BASE = window.KUKU_BASE;
    const IMG = BASE + 'img/';

    // =====================================================================
    //  1. 小さな道具
    // =====================================================================
    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const pickOne = (a) => a[Math.floor(Math.random() * a.length)];
    const uniq = (a) => [...new Set(a)];
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
    const nowStr = () => {
      const d = new Date(), p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const safeStore = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
    };
    const downloadText = (name, text, type) => {
      const blob = new Blob([text], { type: type || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    };

    // =====================================================================
    //  2. こえ と おと
    // =====================================================================
    const Speech = {
      rate: 0.8, pitch: 1.0, voice: null,
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = this.pitch;
          let done = false;
          const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
          u.onend = end; u.onerror = end;
          // 声が出ない端末でも先へ進めるように、長さに合わせて待つ
          setTimeout(end, 1500 + text.length * 230 / this.rate);
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() { try { this.ok && window.speechSynthesis.cancel(); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }

    const Sound = {
      on: true, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      tone(freq, at, dur, type = 'triangle', vol = 0.16) {
        const c = this.get(); if (!c || !this.on) return;
        const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      // このアプリのための オリジナルの おと（わの ひびき：ペンタトニック）
      fanfare() {
        [[587, 0], [659, .11], [880, .22]].forEach(([f, t]) => this.tone(f, t, .16, 'triangle', .18));
        [587, 880, 1175].forEach(f => this.tone(f, .36, .7, 'triangle', .11));
      },
      big() { // ステージ クリア
        [[440, 0], [523, .14], [587, .28], [659, .42], [880, .62], [1047, .82]].forEach(([f, t]) => this.tone(f, t, .2, 'triangle', .17));
        [440, 659, 880, 1047].forEach(f => this.tone(f, 1.05, 1.1, 'triangle', .11));
      },
      retry() { this.tone(330, 0, .14, 'sine', .06); this.tone(294, .12, .2, 'sine', .06); }, // まちがえたとき（小さな音）
      tap() { this.tone(660, 0, .06, 'sine', .07); },
      step() { this.tone(392, 0, .05, 'sine', .07); this.tone(523, .07, .06, 'sine', .06); }, // しのびあし
      coin() { this.tone(988, 0, .08, 'square', .05); this.tone(1319, .08, .22, 'square', .05); },
      buy() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, i * .07, .18, 'square', .05)); },
      whoosh() { this.tone(1200, 0, .12, 'sawtooth', .03); this.tone(700, .08, .12, 'sawtooth', .03); }, // しゅりけん
      hit() { this.tone(880, 0, .07, 'square', .06); this.tone(1320, .06, .12, 'triangle', .1); },
    };

    // ---- 読み上げの ことば ----
    const fmtSpeech = (t) => String(t || '')
      .replace(/(\d+)\s*つ分/g, (m, n) => `${n}つぶん`).replace(/分/g, 'ぶん')
      .replace(/忍者/g, 'にんじゃ').replace(/九九/g, 'くく').replace(/修行/g, 'しゅぎょう')
      .replace(/[＝=]\s*□/g, ' は いくつ').replace(/×/g, ' かける ').replace(/[＝=]/g, ' は ').replace(/＋/g, ' たす ')
      .replace(/□/g, 'しかく')
      // 絵文字と まるすうじは よまない
      .replace(/[⓪①②③④⑤]/g, '').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '');
    // こどもの がめんの 漢字には ふりがなを つける
    const RUBY = { '忍者': 'にんじゃ', '九九': 'くく', '修行': 'しゅぎょう', '分': 'ぶん' };
    const Rb = ({ t }) => String(t || '').split(/(忍者|九九|修行|分)/).map((x, i) => RUBY[x] ? <ruby key={i}>{x}<rt style={{ fontSize: '0.5em' }}>{RUBY[x]}</rt></ruby> : x);

    // =====================================================================
    //  3. データ（data/mondai.js から）
    // =====================================================================
    let D = null, STAGES = [], ITEM = {}, ALL_ITEMS = [], COLOR = {}, TREASURE = {}, FLOOR_OF = {}, ENEMY = {};
    const DAN_ORDER = () => D.FLOORS.map(f => f.a);
    const iriStages = () => STAGES.filter(s => s.iri);
    const floorStages = (a) => STAGES.filter(s => s.a === a);
    const hattenStages = () => STAGES.filter(s => s.hatten);
    const tenshu = () => STAGES.find(s => s.tenshu);
    const review = () => STAGES.find(s => s.review);
    // じゅんばんに すすむ ステージ（いりぐち → 1かい〜9かい → てんしゅかく）
    const mainStages = () => [...iriStages(), ...DAN_ORDER().flatMap(a => floorStages(a)), tenshu()];
    const STEP_NUM = '⓪①②③④';
    const stageLabel = (st) => st.iri ? `いりぐち ${'①②③'[Number(st.id.slice(2)) - 1]}` : st.a ? `${st.a}の だん ${STEP_NUM[st.s]}` : st.tenshu ? '🏯' : st.review ? '🔁' : `はってん${st.id === 'H1' ? '①' : '②'}`;
    const stepName = (st) => st.iri ? 'しのびの いりぐち' : st.a ? `${FLOOR_OF[st.a].f}かい ${st.a}の だん ${STEP_NUM[st.s]}${st.title}` : st.tenshu ? 'てんしゅかく' : st.review ? 'ふくしゅう' : 'はってん';
    // たたかう あいて（④にんじゃ しけん・てんしゅかく）
    const enemyOf = (st) => st.tenshu ? D.ENEMIES.find(en => en.f === 'T') : st.kind === 'shiken' && st.a ? D.ENEMIES.find(en => en.f === FLOOR_OF[st.a].f) : null;
    const roomFile = (en) => `room_${en.f === 'T' ? 't' : en.f}.webp`;
    const tonae = (a, b) => D.TONAE[a][b - 1];
    const tonaeText = (a, b) => tonae(a, b).join(' ');
    const kukuKey = (a, b) => `${a}×${b}`;

    // まちがいの しゅるい（記録の ことば。あとから 変えないこと）
    const MT = { next: 'となりの こたえ', dan: 'ちがう だん', add: 'たしざん', rev: 'すうじの いれかわり', other: 'そのほか',
      count: 'かぞえまちがい', mixup: 'とりちがい', swap: 'いれちがい', eq: 'ちがう しき' };

    // =====================================================================
    //  4. もんだいづくり
    // =====================================================================
    function drawFrom(list, n, key = (x) => JSON.stringify(x)) {
      const out = []; let bag = [];
      for (let i = 0; i < n; i++) {
        if (!bag.length) bag = shuffle(list);
        let x = bag.pop();
        if (out.length && key(out[out.length - 1]) === key(x) && bag.length) { bag.unshift(x); x = bag.pop(); }
        out.push(x);
      }
      return out;
    }
    const pairsOf = (as, bs) => as.flatMap(a => bs.map(b => [a, b]));
    const fact = (kind, a, b, extra) => ({ kind, a, b, N: a * b, ...extra });
    const passedDans = (p) => DAN_ORDER().filter(a => p.cleared[`${a}-4`]);

    function buildProblems(st, n, prog, startB = 1) {
      const k = st.kind;
      if (['per', 'phrase', 'shiki'].includes(k)) return drawFrom(pairsOf(st.as, st.bs), n).map(([a, b]) => fact(k, a, b));
      if (['deai', 'tonae', 'junban'].includes(k)) return range(startB, 9).map(b => fact(k, st.a, b));
      if (k === 'bara' || k === 'shiken') return shuffle(range(1, 9)).map(b => fact(k, st.a, b));
      if (k === 'mix') {
        const dans = st.all ? range(1, 9) : (passedDans(prog).length ? passedDans(prog) : [DAN_ORDER()[0]]);
        // にがてな くく（まちがえた かずが おおい もの）を おおめに だす
        const pool = pairsOf(dans, range(1, 9)).map(([a, b]) => ({ a, b, w: 1 + Math.min(3, (prog.weak || {})[kukuKey(a, b)] || 0) * 2 }));
        const out = [];
        while (out.length < n && pool.length) {
          let r = Math.random() * pool.reduce((s, x) => s + x.w, 0), j = 0;
          while (r > pool[j].w && j < pool.length - 1) { r -= pool[j].w; j++; }
          const [x] = pool.splice(j, 1);
          out.push(fact(k, x.a, x.b));
        }
        return out;
      }
      if (k === 'findEq') {
        const list = pairsOf(range(2, 9), range(2, 9));
        return drawFrom(list, n).map(([a, b]) => fact(k, a, b));
      }
      if (k === 'blank') {
        const list = pairsOf(range(2, 9), range(2, 9));
        return drawFrom(list, n).map(([a, b]) => fact(k, a, b, { pos: Math.random() < .6 ? 1 : 0 }));
      }
      return [];
    }

    // 記録の「もんだい」と「こたえ」の ことば
    function problemLabel(p) {
      switch (p.kind) {
        case 'per': return `${p.a}まいの ${p.b}つ分（1つ分）`;
        case 'phrase': return `${p.a}まいの ${p.b}つ分（いいかた）`;
        case 'shiki': return `${p.a}まいの ${p.b}つ分（しき）`;
        case 'findEq': return `こたえが ${p.N}の しき`;
        case 'blank': return p.pos ? `${p.a}×□＝${p.N}` : `□×${p.b}＝${p.N}`;
        default: return `${p.a}×${p.b}`;
      }
    }
    function answerLabel(p) {
      if (p.kind === 'per') return `${p.a}まい`;
      if (p.kind === 'phrase') return `${p.a}まいの ${p.b}つ分`;
      if (p.kind === 'shiki') return `${p.a}×${p.b}＝${p.N}`;
      if (p.kind === 'findEq') return `${p.a}×${p.b}`;
      if (p.kind === 'blank') return String(p.pos ? p.b : p.a);
      return String(p.N);
    }
    const usesKuku = (p) => !['per', 'phrase'].includes(p.kind);

    // まちがえた こたえ x の しゅるいと、こえかけ
    function classify(a, b, x) {
      const N = a * b;
      if (b > 1 && x === a * (b - 1)) return [MT.next, `${x}は ${a} × ${b - 1}の こたえ。${a}の だんは ${a}ずつ ふえるから、あと ${a}だよ。`];
      if (b < 9 && x === a * (b + 1)) return [MT.next, `${x}は ${a} × ${b + 1}の こたえ。1つ すぎたね。`];
      if (x === a + b) return [MT.add, `${a} たす ${b}に なって いるよ。かけざんは ${a}が ${b}つ分 だよ。`];
      if (N >= 10 && x >= 10 && String(x) === String(N).split('').reverse().join('')) return [MT.rev, 'すうじの じゅんばんが ぎゃくに なって いるよ。'];
      const other = range(1, 9).find(c => c !== a && c * b === x);
      if (other) return [MT.dan, `${x}は ${other}の だんの こたえだね。いまは ${a}の だんだよ。`];
      return [MT.other, `${a}の だんを はじめから となえて みよう。`];
    }
    // こたえの せんたくし（こたえ・となりの こたえ・ちがう だん・たしざん・いれかわり から 3つ）
    function kukuOptions(a, b, size = 4, near = false) {
      const N = a * b;
      const cand = near
        ? [a * (b - 1), a * (b + 1), a + b]
        : shuffle([a * (b - 1), a * (b + 1), (a + 1) * b, (a - 1) * b, a + b, N >= 10 ? Number(String(N).split('').reverse().join('')) : N + 1]);
      const xs = [N];
      [...cand, N + 1, N + 2, N - 1].forEach(x => { if (xs.length < size && x > 0 && x <= 81 && x !== N && !xs.includes(x)) xs.push(x); });
      return shuffle(xs);
    }

    // =====================================================================
    //  5. しんちょく（進み具合）
    // =====================================================================
    const newProgress = () => ({ v: 1, t: 0, coins: 0, earned: 0, items: [], cleared: {}, treasures: [], enemies: [], part: null, weak: {},
      welcome: 0, unlockAll: false, hatten: false, skipIri: false, look: null });
    function parseProgress(s) {
      let p = null;
      try { p = typeof s === 'string' ? (s ? JSON.parse(s) : null) : s; } catch (e) { p = null; }
      const q = { ...newProgress(), ...(p || {}) };
      ['items', 'treasures', 'enemies'].forEach(k => { if (!Array.isArray(q[k])) q[k] = []; });
      ['cleared', 'weak'].forEach(k => { if (!q[k] || typeof q[k] !== 'object') q[k] = {}; });
      return q;
    }
    const isCleared = (p, id) => !!p.cleared[id] || (p.skipIri && /^0-/.test(id));
    const stageOpen = (p, st) => {
      if (st.hatten) return !!(p.unlockAll || p.hatten);
      if (st.review) return !!p.unlockAll || passedDans(p).length >= 2;
      if (p.unlockAll) return true;
      const ms = mainStages(), i = ms.findIndex(s => s.id === st.id);
      return i <= 0 || isCleared(p, ms[i - 1].id);
    };
    const currentStage = (p) => mainStages().find(st => stageOpen(p, st) && !isCleared(p, st.id)) || tenshu();
    const floorsCleared = (p) => passedDans(p).length;
    const hattenAll = (p) => hattenStages().every(st => p.cleared[st.id]);
    const titlesOf = (p) => D.TITLES.filter(t => t.all ? hattenAll(p) : floorsCleared(p) >= t.f).map(t => t.n);
    const titleOf = (p) => { const t = titlesOf(p).filter(n => n !== 'にんじゃ マスター'); return hattenAll(p) ? 'にんじゃ マスター' : (t[t.length - 1] || D.TITLES[0].n); };
    const ownedColors = (p) => [...D.COLORS, ...ALL_ITEMS.filter(it => it.color && p.items.includes(it.id)).map(it => it.color)];
    const defaultLook = () => ({ color: 'ao', form: 1, buki: null, mochi: null, aibou: null });

    // こたえかた（えらぶ／すうじ）
    function modeFor(st, prog, settings) {
      if (['deai', 'tonae', 'per', 'phrase', 'shiki', 'findEq'].includes(st.kind)) return 'choice';
      if (settings.mode === 'choice' || settings.mode === 'key') return settings.mode;
      if (st.kind === 'junban') return 'choice';
      if (st.kind === 'bara') return prog.cleared[st.id] ? 'key' : 'choice';
      return 'key';
    }

    // =====================================================================
    //  6. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    const LOG_HEADER = ['日時', 'なまえ', 'ステージ', 'しゅぎょう', 'もんだい', 'こたえ', 'けっか', 'まちがい', 'ヒント', 'まちがいの しゅるい', 'えらんだ こたえ', 'くく', 'こたえかた', 'びょう', 'ID'];
    const DEFAULT_SETTINGS = { rate: 0.8, pitch: 1.0, font: 1, sound: true, count: 5, mode: 'auto', tonae: true, pass: 7 };

    // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
    const emptyStu = () => ({ count: 0, ok: 0, secs: 0, last: '', stages: {}, types: {}, kuku: {}, missProb: {} });
    const addKuku = (m, k, ok, miss, hint) => { const a = m[k] || (m[k] = [0, 0, 0, 0]); a[0]++; a[1] += ok; a[2] += miss; a[3] += hint ? 1 : 0; };
    function aggregate(rows) {
      const students = {}, classTypes = {}, classKuku = {};
      rows.forEach(r => {
        const name = String(r[1] || '').trim(); if (!name) return;
        const st = String(r[2]), ok = r[6] === '○' ? 1 : 0;
        const s = students[name] || (students[name] = emptyStu());
        const day = String(r[0] instanceof Date ? r[0].toISOString() : r[0]).slice(0, 10).replace(/-/g, '/');
        if (day > s.last) s.last = day;
        s.count++; s.ok += ok; s.secs += Number(r[13]) || 0;
        const g = s.stages[st] || (s.stages[st] = [0, 0]);
        g[0]++; g[1] += ok;
        String(r[9] || '').split('・').forEach(k => { if (k) { s.types[k] = (s.types[k] || 0) + 1; classTypes[k] = (classTypes[k] || 0) + 1; } });
        const kk = String(r[11] || '');
        if (kk) { addKuku(s.kuku, kk, ok, Number(r[7]) || 0, Number(r[8]) || 0); addKuku(classKuku, kk, ok, Number(r[7]) || 0, Number(r[8]) || 0); }
        if (!ok && Number(r[7]) > 0) { const k = `${st}：${r[4]}`; s.missProb[k] = (s.missProb[k] || 0) + 1; }
      });
      return { students, classTypes, classKuku };
    }

    const Local = {
      key: 'kagemaru_kuku_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}
        this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: { ...DEFAULT_SETTINGS } };
        return this.mem;
      },
      save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
    };

    const PENDING_KEY = 'kagemaru_kuku_pending_v1';
    const COPY_KEY = (name) => 'kagemaru_kuku_copy_' + name;
    const recRow = (stamp, name, r) => [stamp, name, r.stage, r.step, r.problem, r.answer, r.result, r.miss, r.hint, r.types, r.picks, r.kuku, r.how, r.secs, r.id];
    const FLAGS = ['unlockAll', 'hatten', 'skipIri'];
    const api = {
      async init() {
        if (HAS_GAS) return gas('getInitData');
        const d = Local.data();
        return { students: d.roster, settings: { ...DEFAULT_SETTINGS, ...d.settings }, demo: true };
      },
      async student(name) {
        if (HAS_GAS) return gas('getStudent', name);
        return Local.data().progress[name] || '';
      },
      async sendOne(p) {
        if (HAS_GAS) return gas('saveResult', p);
        const d = Local.data();
        const old = parseProgress(d.progress[p.name]);
        const neu = parseProgress(p.progress);
        if (neu.t >= old.t) d.progress[p.name] = p.progress;
        const ids = new Set(d.log.map(r => r[14]));
        p.records.forEach(r => { if (!ids.has(r.id)) d.log.push(recRow(p.stamp, p.name, r)); });
        Local.save();
        return { ok: true };
      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす
      readQueue() { try { return JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) { return []; } },
      async save(payload) {
        const queue = api.readQueue().filter(q => !(q.name === payload.name && !q.records.length));
        queue.push({ ...payload, qid: uid() });
        safeStore.set(PENDING_KEY, JSON.stringify(queue));
        return api.flush();
      },
      pending() { return api.readQueue().length; },
      flushing: false,
      async flush() {
        if (api.flushing) return;
        api.flushing = true;
        try {
          for (let q = api.readQueue()[0]; q; q = api.readQueue()[0]) {
            await api.sendOne(q);
            safeStore.set(PENDING_KEY, JSON.stringify(api.readQueue().filter(x => x.qid !== q.qid)));
          }
        } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
        finally { api.flushing = false; }
      },
      async teacher(pin) {
        if (HAS_GAS) return gas('getTeacherData', pin);
        const d = Local.data();
        if (String(pin) !== String(d.pin)) return { ok: false };
        const agg = aggregate(d.log);
        return {
          ok: true, isDefaultPin: d.pin === '1234', demo: true, settings: { ...DEFAULT_SETTINGS, ...d.settings },
          students: d.roster.map(n => ({ name: n, progress: d.progress[n] || '', ...(agg.students[n] || emptyStu()) })),
          classTypes: agg.classTypes, classKuku: agg.classKuku,
        };
      },
      async setFlag(pin, name, key, val) {
        if (HAS_GAS) return gas('setFlag', pin, name, key, val);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p[key] = !!val; p.t = Date.now(); p.flagT = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async addCoins(pin, name, delta) {
        if (HAS_GAS) return gas('addCoins', pin, name, delta);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p.coins = Math.max(0, p.coins + delta); p.t = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async saveSettings(pin, s) {
        if (HAS_GAS) return gas('saveSettings', pin, s);
        const d = Local.data(); const { newPin, ...rest } = s;
        d.settings = { ...d.settings, ...rest }; if (newPin) d.pin = newPin; Local.save(); return { ok: true };
      },
      async logRows(pin) {
        if (HAS_GAS) return gas('getLogRows', pin);
        return { ok: true, rows: [LOG_HEADER, ...Local.data().log] };
      },
      async backup(pin) {
        if (HAS_GAS) return gas('getBackup', pin);
        const d = Local.data(); return { ok: true, data: { app: 'kuku', roster: d.roster.map(n => [n, d.progress[n] || '']), settings: d.settings } };
      },
      async restore(pin, data) {
        if (HAS_GAS) return gas('restoreBackup', pin, data);
        const d = Local.data(); (data.roster || []).forEach(([n, p]) => { if (!d.roster.includes(n)) d.roster.push(n); d.progress[n] = p; }); Local.save(); return { ok: true };
      },
      async clear(pin, name) {
        if (HAS_GAS) return gas('clearRecords', pin, name);
        const d = Local.data();
        d.log = d.log.filter(r => name && r[1] !== name);
        (name ? [name] : d.roster).forEach(n => { delete d.progress[n]; safeStore.del(COPY_KEY(n)); });
        Local.save(); return { ok: true };
      },
    };

    // =====================================================================
    //  7. え（カゲマルせんせい・にんじゃ・しゅりけん・たからもの）
    // =====================================================================
    const TalkCtx = createContext(null);
    const useTalk = () => useContext(TalkCtx);
    const MISSING = new Set();

    // 絵が よみこめない ときの カゲマルせんせい（自作の 絵）
    function KagemaruSvg({ size, mood }) {

    const MOOD_FILE = { normal: 'kagemaru.webp', happy: 'kagemaru_happy.webp', surprise: 'kagemaru_surprise.webp', cheer: 'kagemaru_cheer.webp' };

    // しゅりけん（自作の 絵）
    function Shuriken({ s = 24, color = '#64748b', className = '', style }) {

        <svg viewBox="0 0 40 40" width={s} height={s} className={className} style={style}>
          <path d="M20 1 L25 15 L39 20 L25 25 L20 39 L15 25 L1 20 L15 15 Z" fill={color} stroke="#1e293b" strokeWidth="2" strokeLinejoin="round" />

    function ToolSvg({ id, s }) {

    // こどもの にんじゃ（絵が よみこめない ときは 自作の 絵。いろ と かたち で かわる）

          <rect x="70" y="182" width="24" height="30" rx="8" fill={c.fuku} stroke="#0f172a" strokeWidth="3" />

        </svg>
      );
    }
    // にんじゃ（Canva の 絵 ninja_いろ_かたち.webp。もちものと あいぼうを かさねる）
    function Ninja({ look, size = 160, className = '', bare = false }) {

      const buki = !bare && lk.buki && ITEM[lk.buki], mochi = !bare && lk.mochi && ITEM[lk.mochi], aibou = !bare && lk.aibou && ITEM[lk.aibou];

    }

    // たからもの（Canva の 絵 treasure_id.webp。なければ 絵文字）
    function TreasureIcon({ id, size = 64, got = true, className = '' }) {
      const [, setErr] = useState(0);
      const t = TREASURE[id] || { e: '🎁', name: '' };

    // たからばこ（自作の 絵）
    function TreasureBox({ size = 120, open = false, children }) {

            <rect x="14" y="74" width="92" height="8" fill="#facc15" />
            <rect x="52" y="66" width="16" height="22" rx="3" fill="#facc15" stroke="#451a03" strokeWidth="3" />
            <g className={open ? 'lid-open' : ''} style={{ transformBox: 'fill-box', transformOrigin: '0% 100%' }}><path d="M14 58 q0 -30 46 -30 q46 0 46 30z" fill="#d97706" stroke="#451a03" strokeWidth="4" /><rect x="52" y="30" width="16" height="28" fill="#facc15" /></g>
          </svg>

    // たたかう あいて（Canva の 絵 enemy_id.webp。なければ 絵文字）
    function EnemyFace({ en, size = 150, got = true, className = '' }) {
      const [, setErr] = useState(0);

      if (!got) return <div className={`flex items-center justify-center rounded-2xl bg-slate-700 text-slate-400 font-bold ${className}`} style={{ width: size, height: size, fontSize: size * 0.5 }}>？</div>;

    // たたかいの 場面（へやの絵・にんじゃ・あいて・たいりょく）
    function BattleScene({ en, look, hp, max, hit, miss, end, bubble }) {
      return (
        <div className="relative w-full rounded-2xl border-4 border-slate-700 overflow-hidden" style={{ height: 168 }}>
          <Bg file={roomFile(en)} style={{ position: 'absolute', inset: 0 }} fallback={<div className="absolute inset-0" style={{ background: 'linear-gradient(#3b2f2f, #6b4f3a 60%, #a0764e)' }} />} />
          <div className="absolute inset-0 bg-black/20" />
          <div className="absolute bottom-1" style={{ left: '6%' }}><Ninja look={look} size={108} /></div>
          {hit > 0 && <div key={hit} className="absolute fly" style={{ top: 60 }}><Shuriken s={42} color="#cbd5e1" /></div>}
          <div style={{ right: '6%' }} className={`absolute bottom-1 flex flex-col items-center ${end === 'win' ? 'vanish' : end === 'escape' ? 'runaway' : ''}`}>
            <div className="bg-black/60 rounded-full px-2 py-1 mb-1 flex items-center gap-1">
              <span className="text-xs font-bold text-white">{en.name}</span>
              {Array.from({ length: max }, (_, j) => <span key={j} className={`inline-block w-4 h-3 rounded-sm ${j < hp ? 'bg-red-500' : 'bg-slate-500'}`} />)}
              {hp === 0 && !end && <span className="text-xs font-bold text-amber-300 ml-1">ふらふら…</span>}
            </div>
            <div key={'h' + hit} className={hit > 0 ? 'ouch' : ''}><EnemyFace en={en} size={124} className={end ? '' : 'enemy-idle'} /></div>
          </div>
          {end === 'win' && <div className="absolute bottom-4 text-8xl smoke" style={{ right: '8%' }}>💨</div>}
          {bubble && <div key={bubble.k} className={`absolute bg-white rounded-2xl border-4 border-slate-700 px-3 py-1 text-xl font-bold ${end ? 'pop' : 'fade-out'}`} style={{ right: '20%', top: 44, maxWidth: '45%' }}>{bubble.t}</div>}
          {miss > 0 && !end && <div key={'m' + miss} className="absolute top-14 fade-out text-2xl font-bold text-white bg-slate-800/70 rounded-xl px-2" style={{ right: '3%' }}>ひらり！</div>}

    // 背景（Canva の 絵。なければ 自作の 絵）
    function Bg({ file, className = '', style, children, fallback }) {
      const [ok, setOk] = useState(!MISSING.has(file));
      return (
        <div className={`relative overflow-hidden ${className}`} style={style}>
          {ok && <img src={IMG + file} alt="" onError={() => { MISSING.add(file); setOk(false); }} className="absolute inset-0 w-full h-full object-cover" draggable={false} />}
          {!ok && fallback}
          <div className="relative w-full h-full">{children}</div>

    }
    function CastleSvg() {
      return (
        <svg viewBox="0 0 800 350" preserveAspectRatio="xMidYMid slice" className="absolute inset-0 w-full h-full">
          <rect width="800" height="350" fill="#141c4d" />
          {[[60, 40], [180, 90], [300, 30], [520, 60], [700, 30], [760, 120], [420, 110], [110, 150]].map(([x, y], i) => <circle key={i} cx={x} cy={y} r="2" fill="#fef9c3" opacity=".8" />)}
          <circle cx="210" cy="120" r="80" fill="#fde68a" opacity=".95" /><circle cx="210" cy="120" r="96" fill="#fde68a" opacity=".18" />
          <rect x="0" y="300" width="800" height="50" fill="#14301f" />
          <path d="M380 300 L420 210 L700 210 L740 300 Z" fill="#475569" stroke="#1e293b" strokeWidth="3" />
          {[[430, 168, 260, 42], [455, 128, 210, 40], [480, 92, 160, 36], [505, 60, 110, 32]].map(([x, y, w, h], i) => (
            <g key={i}><rect x={x} y={y} width={w} height={h} fill="#f1f5f9" stroke="#1e293b" strokeWidth="2" />
              <path d={`M${x - 24} ${y + 6} L${x + w / 2} ${y - 22} L${x + w + 24} ${y + 6} Z`} fill="#1e3a5f" stroke="#0f172a" strokeWidth="2" />
              {range(0, Math.floor(w / 30) - 1).map(j => <rect key={j} x={x + 12 + j * 30} y={y + 14} width="10" height="14" fill="#334155" />)}</g>
          ))}
          <path d="M548 36 q12 -14 24 0" stroke="#facc15" strokeWidth="6" fill="none" />

    // =====================================================================
    //  8. もんだいの がめんの ぶひん
    // =====================================================================
    function Btn({ children, onClick, color = '#4338ca', light = '#e0e7ff', className = '', disabled, style }) {
      return (
        <button onClick={onClick} disabled={disabled}
          className={`btn3d rounded-2xl font-bold px-5 py-3 text-2xl border-2 ${disabled ? 'opacity-40' : ''} ${className}`}
          style={{ background: light, borderColor: color, color: '#1e1b4b', ...style }}>
          {children}
        </button>
      );
    }
    const Koban = ({ s = 28 }) => <svg viewBox="0 0 40 40" width={s} height={s} className="inline-block align-middle"><ellipse cx="20" cy="20" rx="13" ry="18" fill="#facc15" stroke="#a16207" strokeWidth="2.5" /><ellipse cx="20" cy="20" rx="8" ry="12" fill="none" stroke="#ca8a04" strokeWidth="1.5" /><rect x="17" y="14" width="6" height="12" rx="1" fill="#ca8a04" /></svg>;
    function CoinFly({ show }) {
      if (!show) return null;
      return <div key={show} className="coinfly fixed right-32 top-14 z-40 text-4xl pointer-events-none font-bold text-amber-500"><Koban s={40} />＋1</div>;
    }
    function Seikai({ show }) {
      if (!show) return null;
      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center pointer-events-none">
          <div className="confetti absolute inset-x-0 top-24 h-80">
            {['🎉', '⭐', '🎊', '✨', '🌸', '⭐', '✨', '🎉'].map((e, i) => <span key={i} className="text-4xl" style={{ left: `${8 + i * 11}%`, animationDelay: `${(i % 4) * 0.12}s` }}>{e}</span>)}
          </div>
          <div className="pop bg-white/95 border-8 border-indigo-400 rounded-[40px] px-12 py-5 shadow-2xl text-7xl font-bold text-rose-500" style={{ textShadow: '3px 3px 0 #fde68a' }}>せいかい！</div>
        </div>
      );
    }

    // まちがい と ヒントの かず（2かいで ヒントボタンが ひかり、3かいで いちばん くわしい ヒント）
    function useMiss(onAuto) {
      const [miss, setMiss] = useState(0);
      const [local, setLocal] = useState(0);
      const [hint, setHint] = useState(0);
      const [maxHint, setMaxHint] = useState(0);
      const types = useRef([]), picks = useRef([]);
      const add = (type, pick) => {
        setMiss(m => m + 1);
        if (type) types.current.push(type);
        if (pick !== undefined && pick !== null && pick !== '') picks.current.push(String(pick));
        setLocal(m => { const n = m + 1; if (n >= 3) { setHint(3); setMaxHint(3); onAuto && setTimeout(() => onAuto(3), 50); } return n; });
      };
      const up = () => { const lv = Math.min(3, hint + 1); setHint(lv); setMaxHint(x => Math.max(x, lv)); return lv; };
      const phase = () => { setLocal(0); setHint(0); };
      return { miss, local, hint, maxHint, add, up, phase, types, picks };
    }
    function HintButton({ m, onHint }) {
      return (
        <button onClick={() => onHint(m.up())} className={`btn3d rounded-2xl border-2 border-yellow-500 bg-yellow-100 px-4 py-2 text-xl font-bold ${m.local >= 2 && m.hint < 3 ? 'glow' : ''}`}>
          💡 ヒント{m.hint > 0 ? <span className="ml-1">{'●'.repeat(m.hint)}{'○'.repeat(3 - m.hint)}</span> : null}
        </button>
      );
    }
    const resultOf = (m) => ({ miss: m.miss, hint: m.maxHint, types: uniq(m.types.current), picks: m.picks.current });

    // えらぶ ボタン（まちがえた ものは うすく なって もう えらべない）
    function Choices({ options, removed = [], glowKey, onPick, disabled, big = false }) {
      return (
        <div className="flex flex-wrap gap-3 justify-center">
          {options.map(o => {
            const gone = removed.includes(o.key);
            return (
              <button key={o.key} onClick={() => !gone && !disabled && onPick(o)} disabled={gone || disabled}
                className={`btn3d rounded-3xl border-4 font-bold ${big ? 'text-5xl px-8 py-3 min-w-[130px]' : 'text-3xl px-6 py-3 min-w-[96px]'} ${gone ? 'opacity-25 bg-slate-100 border-slate-300' : 'bg-white border-indigo-500'} ${glowKey === o.key ? 'glow' : ''}`}>
                {o.label}
                {o.sub && <div className="text-lg text-indigo-700 mt-1">{o.sub}</div>}
              </button>
            );
          })}
        </div>
      );
    }
    // すうじの ボタン（0〜9）
    function Keypad({ onDigit, onBack, onOk, disabled, okGlow }) {
      const key = (d) => <button key={d} onClick={() => !disabled && onDigit(d)} disabled={disabled} className="btn3d w-20 h-16 rounded-2xl bg-white border-4 border-sky-400 text-4xl font-bold">{d}</button>;
      return (
        <div className="flex flex-col items-center gap-2">
          <div className="grid grid-cols-5 gap-2">{[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(key)}</div>
          <div className="flex gap-3">
            <button onClick={() => !disabled && onBack()} disabled={disabled} className="btn3d h-14 px-5 rounded-2xl bg-slate-50 border-4 border-slate-300 text-2xl font-bold">⌫ けす</button>
            <button onClick={() => !disabled && onOk()} disabled={disabled} className={`btn3d h-14 px-8 rounded-2xl bg-emerald-100 border-4 border-emerald-500 text-2xl font-bold ${okGlow ? 'glow' : ''}`}>✔ こたえる</button>
          </div>
        </div>
      );
    }
    function AnsBox({ v, active, glow, w = 'w-28' }) {
      return <span className={`inline-flex items-center justify-center ${w} h-20 rounded-2xl border-4 align-middle mx-1 ${active ? 'border-sky-500 bg-sky-50' : 'border-slate-300 bg-white'} ${glow ? 'glow' : ''}`}>{v === '' || v === undefined ? <span className="text-slate-300">□</span> : v}</span>;
    }

    // おぼん（しゅりけんが a まい）を b こ ならべる。cum：たした かずを かく
    const COL = { A: '#2563eb', B: '#db2777', N: '#16a34a' };
    function Trays({ a, b, s = 22, cum = false, newest = -1, hl = -1, total }) {
      const cols = b <= 3 ? b : b <= 6 ? 3 : 3;
      return (
        <div className="grid gap-2 justify-center" style={{ gridTemplateColumns: `repeat(${Math.max(1, cols)}, auto)` }}>
          {Array.from({ length: b }, (_, i) => (
            <div key={i} className={`tray rounded-2xl px-2 py-1 flex flex-col items-center ${i === newest ? 'drop-in' : ''} ${i === hl ? 'glow' : ''}`}>
              <div className="flex flex-wrap justify-center gap-0.5" style={{ maxWidth: s * 5 + 12 }}>{Array.from({ length: a }, (_, j) => <Shuriken key={j} s={s} />)}</div>
              {cum && <div className="text-lg font-bold text-amber-100 leading-none mt-0.5">{a * (i + 1)}</div>}
            </div>
          ))}
          {total !== undefined && null}
        </div>
      );
    }
    // しき（いろわけ：かけられる数＝あお、かける数＝ピンク、こたえ＝みどり）
    function Eq({ a, b, ans, size = 'text-6xl', box }) {
      return (
        <div className={`font-bold ${size} flex items-center gap-3 justify-center flex-wrap`}>
          <span style={{ color: COL.A }}>{a}</span><span>×</span><span style={{ color: COL.B }}>{b}</span><span>＝</span>
          {box || <span style={{ color: COL.N }}>{ans}</span>}
        </div>
      );
    }
    // くくの ひょう（ヒント）。upto：そこまで みせる、hl：ひからせる
    function KukuTable({ a, upto = 9, hl, ask, onClose }) {
      return (
        <div className="bg-white rounded-3xl border-4 border-sky-300 p-3 pop">
          <div className="flex items-center gap-3 mb-1"><div className="text-2xl font-bold flex-1">📜 {a}の だん</div>
            {onClose && <button onClick={onClose} className="btn3d bg-white border-2 border-slate-400 rounded-xl px-3 py-1 text-lg font-bold">とじる</button>}</div>
          <div className="flex flex-col gap-0.5">
            {range(1, upto).map(i => (
              <div key={i} className={`text-2xl font-bold rounded-xl px-3 py-0.5 flex items-center gap-2 ${hl === i ? 'bg-yellow-200 glow' : ''}`}>
                <span style={{ color: COL.A }}>{a}</span>×<span style={{ color: COL.B }}>{i}</span>＝<span style={{ color: COL.N }}>{i === ask ? '？' : a * i}</span>
                <span className="text-base text-indigo-700 ml-1">{i === ask ? tonae(a, i)[0] + ' …' : tonaeText(a, i)}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }
    // いっしょに かぞえる（ヒント3）：おぼんが 1つずつ でて、たした かずを よむ
    function CountAlong({ a, b, s = 20 }) {
      const talk = useTalk();
      const [k, setK] = useState(0);
      useEffect(() => {
        let alive = true;
        talk.say(range(1, b).map(i => a * i).join('、'), { mood: 'normal' });
        (async () => { for (let i = 1; i <= b; i++) { await wait(i === 1 ? 300 : 650 / Speech.rate); if (!alive) return; setK(i); } })();
        return () => { alive = false; };
      }, []);
      return <div className="bg-amber-50 rounded-3xl border-4 border-amber-300 p-2 pop"><Trays a={a} b={k} s={s} cum newest={k - 1} /></div>;
    }

    // ろうか（9まいの いた。にんじゃが 1もん ごとに すすむ。さいごに たからばこ）
    function Rouka({ n, i, look, color = '#6366f1', box = true }) {
      const pos = Math.max(0, Math.min(n, i));
      return (
        <div className="relative w-full rounded-2xl border-4 overflow-hidden" style={{ borderColor: color, height: 92 }}>
          <Bg file="rouka.webp" style={{ position: 'absolute', inset: 0 }} fallback={<div className="absolute inset-0"><div className="absolute inset-x-0 top-0 h-1/2 wall" /><div className="absolute inset-x-0 bottom-0 h-1/2 boards" /></div>} />
          <div className="absolute inset-0" style={{ background: color, opacity: .12 }} />
          <div className="absolute left-2 right-16 bottom-1 flex gap-1">{range(1, n).map(j => <div key={j} className={`flex-1 h-3 rounded-full ${j <= pos ? 'bg-yellow-300' : 'bg-white/70'}`} />)}</div>
          <div className="absolute bottom-3 walk" style={{ left: `calc(${(pos / n) * 100}% * 0.86)` }}><Ninja look={look} size={62} bare /></div>
          {box && <div className="absolute right-1 bottom-1"><TreasureBox size={58} /></div>}
        </div>
      );
    }

    // =====================================================================
    //  9. もんだい（しゅるいごと）
    // =====================================================================
    // しのびの いりぐち（1つ分は いくつ／〇の △つ分／かけざんの しき）
    function IriQ({ p, ctx }) {
      const talk = useTalk();
      const k = p.kind;
      const [phase, setPhase] = useState('ask'); // ask →（shiki：num）→ ok
      const [removed, setRemoved] = useState([]);
      const opts = useMemo(() => {
        const { a, b, N } = p;
        if (k === 'per') return shuffle(uniq([a, b, N, a + 1, a > 2 ? a - 1 : a + 2]).filter(x => x > 0).slice(0, 4)).map(x => ({ key: String(x), value: x, label: `${x}まい`, t: x === a ? 'ok' : (x === b || x === N) ? MT.mixup : MT.count }));
        if (k === 'phrase') {
          const xs = [{ key: 'ok', label: `${a}まいの ${b}つ分`, t: 'ok' }];
          if (a !== b) xs.push({ key: 'sw', label: `${b}まいの ${a}つ分`, t: MT.swap });
          xs.push({ key: 'c1', label: `${a}まいの ${b + 1}つ分`, t: MT.count });
          if (xs.length < 3) xs.push({ key: 'c2', label: `${a + 1}まいの ${b}つ分`, t: MT.count });
          return shuffle(xs);
        }
        const xs = [{ key: 'ok', label: `${a} × ${b}`, t: 'ok' }];
        if (a !== b) xs.push({ key: 'sw', label: `${b} × ${a}`, t: MT.swap });
        xs.push({ key: 'add', label: `${a} ＋ ${b}`, t: MT.add });
        if (xs.length < 3) xs.push({ key: 'c1', label: `${a} × ${b + 1}`, t: MT.count });
        return shuffle(xs);
      }, []);
      const numOpts = useMemo(() => kukuOptions(p.a, p.b, 4, true).map(x => ({ key: String(x), value: x, label: `${x}まい` })), []);
      const question = k === 'per' ? '1つの おぼんに なんまい？' : k === 'phrase' ? 'どう いうかな？' : 'しきは どれかな？';
      const doHint = (lv) => {
        if (phase === 'num') {
          if (lv === 1) talk.say(`${p.a}まいずつ、${p.b}つ分 だよ。`);
          if (lv === 2) talk.say('おぼんの したに、たした かずを かいたよ。');
          if (lv === 3) talk.say('いっしょに かぞえよう。');
          return;
        }
        if (lv === 1) talk.say(k === 'per' ? '1つの おぼんだけを みて かぞえよう。' : `1つの おぼんに なんまい？ おぼんは いくつ？ じゅんばんに かんがえよう。`);
        if (lv === 2) talk.say(`1つ分は ${p.a}まい。おぼんは ${p.b}つ だよ。`);
        if (lv === 3) talk.say('ひかって いる こたえだよ。');
      };
      const m = useMiss(doHint);
      useEffect(() => { talk.say(question); }, []);
      const pick = async (o) => {
        if (phase !== 'ask') return;
        if (o.t === 'ok') {
          if (k === 'shiki') { Sound.tap(); m.phase(); setRemoved([]); setPhase('num'); talk.say(`そう、${p.a} × ${p.b}。ぜんぶで なんまいかな？`, { mood: 'happy' }); return; }
          setPhase('ok');
          await ctx.celebrate(k === 'per' ? `1つ分は ${p.a}まい！` : `${p.a}まいの ${p.b}つ分！`);
          ctx.done(resultOf(m)); return;
        }
        m.add(o.t, o.label); Sound.retry(); setRemoved(r => [...r, o.key]);
        if (o.t === MT.swap) talk.say(k === 'phrase' ? `それだと 1つの おぼんに ${p.b}まいに なるよ。さきに 1つ分の かずを いおう。` : `${p.b} × ${p.a}だと、${p.b}まいの ${p.a}つ分に なるよ。さきに 1つ分の かず だよ。`);
        else if (o.t === MT.add) talk.say('おなじ かずずつ いくつ分は、たしざんでは なくて かけざんで かくよ。');
        else if (o.t === MT.mixup) talk.say(o.value === p.b ? `${p.b}は おぼんの かずだね。1つの おぼんを みよう。` : `${p.N}は ぜんぶの かずだね。1つの おぼんを みよう。`);
        else talk.say('もういちど かぞえて みよう。');
      };
      const pickN = async (o) => {
        if (phase !== 'num') return;
        if (o.value === p.N) { setPhase('ok'); await ctx.celebrate(`${p.a} × ${p.b} ＝ ${p.N}。ぜんぶで ${p.N}まい！`); ctx.done(resultOf(m)); return; }
        Sound.retry(); setRemoved(r => [...r, o.key]);
        const [t] = classify(p.a, p.b, o.value);
        m.add(t === MT.add ? MT.add : MT.count, o.value);
        talk.say(t === MT.add ? 'たしざんに なって いるよ。おぼんの しゅりけんを ぜんぶ かぞえよう。' : 'おぼんの しゅりけんを ぜんぶ かぞえよう。');
      };
      return (
        <div className="w-full flex flex-col items-center gap-3">
          <div className="bg-white/90 rounded-3xl border-4 border-amber-300 p-3">
            {phase === 'num' && m.hint >= 3 ? <CountAlong a={p.a} b={p.b} s={26} /> : <Trays a={p.a} b={p.b} s={26} cum={(phase === 'num' && m.hint >= 2) || phase === 'ok'} hl={phase === 'ask' && m.hint >= 2 && k === 'per' ? 0 : -1} />}
          </div>
          {phase === 'ask' && m.hint >= 2 && k !== 'per' && <div className="text-2xl font-bold bg-sky-50 border-2 border-sky-300 rounded-2xl px-4 py-1">1つ分：<span style={{ color: COL.A }}>{p.a}まい</span>　いくつ分：<span style={{ color: COL.B }}>{p.b}つ</span></div>}
          {k === 'shiki' && phase !== 'ask' && <Eq a={p.a} b={p.b} ans={phase === 'ok' ? p.N : '？'} size="text-5xl" />}
          {phase === 'ask' && <><div className="text-3xl font-bold">{question}</div><Choices big options={opts} removed={removed} glowKey={m.hint >= 3 ? (opts.find(o => o.t === 'ok') || {}).key : null} onPick={pick} /></>}
          {phase === 'num' && <><div className="text-3xl font-bold">ぜんぶで なんまい？</div><Choices big options={numOpts} removed={removed} glowKey={m.hint >= 3 ? String(p.N) : null} onPick={pickN} /></>}
          {phase !== 'ok' && <HintButton m={m} onHint={doHint} />}
        </div>
      );
    }

    // お城の 階・ふくしゅう・てんしゅかく・はってん②（九九の こたえ）
    function KukuQ({ p, st, ctx }) {
      const talk = useTalk();
      const k = p.kind;
      const { a, b, N } = p;
      const blank = k === 'blank';
      const ans = blank ? (p.pos ? b : a) : N;
      const mode = ctx.mode;
      const showTonae = k === 'tonae' || ((k === 'junban' || k === 'bara') && ctx.settings.tonae);
      const [phase, setPhase] = useState(k === 'deai' ? 'add' : 'ask'); // add →（deai）ask → ok
      const [removed, setRemoved] = useState([]);
      const [v, setV] = useState('');
      const [shake, setShake] = useState(0);
      const [table, setTable] = useState(false);
      const opts = useMemo(() => {
        if (blank) return shuffle(uniq([ans, ans + 1, ans > 1 ? ans - 1 : ans + 2, p.pos ? a : b]).filter(x => x > 0 && x <= 9).slice(0, 4)).map(x => ({ key: String(x), value: x, label: String(x) }));
        const xs = kukuOptions(a, b, k === 'tonae' || k === 'deai' ? 3 : 4, k === 'tonae' || k === 'deai');
        return xs.map(x => ({ key: String(x), value: x, label: String(x), sub: k === 'tonae' ? (x === N ? tonae(a, b)[1] : '') : '' }));
      }, []);
      // ①となえる の せんたくしには、こたえの よみかたを つける
      const tonaeOpts = useMemo(() => k !== 'tonae' ? opts : opts.map(o => {
        const bb = o.value / a;
        return { ...o, sub: Number.isInteger(bb) && bb >= 1 && bb <= 9 ? tonae(a, bb)[1] : '' };
      }), [opts]);
      const ask = () => {
        if (blank) return p.pos ? `${a} かける いくつで ${N}に なるかな？` : `いくつ かける ${b}で ${N}に なるかな？`;
        if (k === 'deai') return 'ぜんぶで なんまいかな？';
        return `${tonae(a, b)[0]}？`;
      };
      const doHint = (lv) => {
        if (blank) {
          const d = p.pos ? a : b;
          if (lv === 1) talk.say(p.pos ? `${d}の だんを となえて みよう。${N}に なるのは どこかな。` : `かける じゅんばんを かえても、こたえは おなじ。${d}の だんで ${N}に なるのは どこかな。`);
          if (lv === 2) { setTable(true); talk.say(`${d}の だんの ひょうを だしたよ。${N}を さがそう。`); }
          if (lv === 3) { setTable(true); talk.say(`ひかって いる ところだよ。`); }
          return;
        }
        if (lv === 1) talk.say(b === 1 ? `${a}が 1つ分 だよ。` : `${a}の だんは ${a}ずつ ふえるよ。${a} × ${b - 1}は ${a * (b - 1)}だったね。`);
        if (lv === 2) { if (k !== 'deai' && k !== 'tonae') setTable(true); talk.say(b === 1 ? `${a}まいが 1つ。` : `${a * (b - 1)} に ${a}を たすと いくつ？`); }
        if (lv === 3) talk.say('いっしょに かぞえよう。');
      };
      const m = useMiss(doHint);
      useEffect(() => {
        if (k === 'deai') talk.say(b === 1 ? `おぼんを だそう。「おぼんを ふやす」を おしてね。` : `おぼんを もう 1つ ふやそう。`);
        else if (k === 'tonae') talk.say(b === 1 ? `${tonaeText(a, 1)}。わたしの あとに となえてね。では、${tonae(a, 1)[0]}？` : `${tonae(a, b)[0]}？`, { speech: b === 1 ? `${tonaeText(a, 1)}。わたしの あとに となえてね。では、${tonae(a, 1)[0]}` : tonae(a, b)[0] });
        else talk.say(ask(), { speech: blank ? undefined : tonae(a, b)[0] });
      }, []);
      const right = async () => {
        setPhase('ok');
        const say = blank ? `${a} かける ${b} は ${N}！ □は ${ans}！` : tonaeText(a, b) + '！';
        await ctx.celebrate(say, blank ? undefined : tonaeText(a, b));
        ctx.done(resultOf(m));
      };
      const wrong = (x) => {
        Sound.retry(); setShake(s => s + 1); ctx.onMiss && ctx.onMiss();
        if (blank) {
          const d = p.pos ? a : b;
          m.add(MT.other, x);
          talk.say(`${d} × ${x} ＝ ${d * x}。${N}に なるかな？`);
          return;
        }
        const [t, msg] = classify(a, b, x);
        m.add(t, x); talk.say(msg);
      };
      const pick = (o) => { if (phase !== 'ask') return; if (o.value === ans) { right(); return; } setRemoved(r => [...r, o.key]); wrong(o.value); };
      const digit = (d) => { Sound.tap(); setV(x => (x + d).replace(/^0(?=\d)/, '').slice(0, 2)); };
      const backspace = () => { Sound.tap(); setV(x => x.slice(0, -1)); };
      const ok = () => {
        if (phase !== 'ask') return;
        if (v === '') { talk.say('すうじの ボタンで こたえを いれてね。'); return; }
        if (Number(v) === ans) { right(); return; }
        wrong(Number(v)); setV('');
      };
      const add = () => { if (phase !== 'add') return; Sound.step(); setPhase('ask'); talk.say(`${a}まいの ${b}つ分。${ask()}`); };
      const shownTrays = k === 'deai' ? (phase === 'add' ? b - 1 : b) : 0;
      const box = <AnsBox v={phase === 'ok' ? String(ans) : v} active={phase === 'ask' && mode === 'key'} glow={false} />;
      const eqBox = phase === 'ok' ? <span style={{ color: COL.N }}>{N}</span> : mode === 'key' && k !== 'deai' && k !== 'tonae' ? box : <span className="text-slate-400">？</span>;
      return (
        <div className="w-full flex flex-col items-center gap-3">
          {k === 'tonae' && b > 1 && (
            <div className="flex flex-wrap gap-2 justify-center max-w-4xl">
              {range(1, b - 1).map(i => <div key={i} className="bg-white rounded-xl border-2 border-indigo-200 px-2 py-0.5 text-lg font-bold">{a}×{i}＝{a * i}<span className="text-indigo-600 text-sm ml-1">{tonaeText(a, i)}</span>{m.hint >= 2 && i === b - 1 ? <span className="ml-1 text-rose-600">＋{a}→</span> : null}</div>)}
            </div>
          )}
          {k === 'deai' && (
            <div className="bg-white/90 rounded-3xl border-4 border-amber-300 p-3 min-h-[120px] flex flex-col items-center gap-2">
              {m.hint >= 3 && phase === 'ask' ? <CountAlong a={a} b={b} s={20} /> : <Trays a={a} b={shownTrays} s={20} cum={m.hint >= 2 || phase === 'ok'} newest={phase === 'ask' ? b - 1 : -1} />}
              {phase === 'add' && <Btn onClick={add} color="#b45309" light="#fef3c7" className="glow">➕ おぼんを ふやす</Btn>}
            </div>
          )}
          {(k !== 'deai' || phase !== 'add') && (
            <div className="flex flex-wrap items-start justify-center gap-4">
              <div className="flex flex-col items-center gap-3">
                <div key={shake} className={`bg-white rounded-3xl border-4 border-indigo-300 px-8 py-3 ${shake ? 'shake' : ''}`}>
                  {blank
                    ? <div className="font-bold text-6xl flex items-center gap-3 justify-center">
                        {p.pos ? <span style={{ color: COL.A }}>{a}</span> : <AnsBox v={phase === 'ok' ? String(a) : v} active={mode === 'key' && phase === 'ask'} />}<span>×</span>
                        {p.pos ? <AnsBox v={phase === 'ok' ? String(b) : v} active={mode === 'key' && phase === 'ask'} /> : <span style={{ color: COL.B }}>{b}</span>}<span>＝</span><span style={{ color: COL.N }}>{N}</span>
                      </div>
                    : <Eq a={a} b={b} box={eqBox} />}
                  {!blank && (showTonae || phase === 'ok') && <div className="text-3xl font-bold text-indigo-700 text-center mt-1">{tonae(a, b)[0]}　{phase === 'ok' ? tonae(a, b)[1] : '…'}</div>}
                </div>
                {phase === 'ask' && mode === 'key' && m.hint >= 3 && <div className="text-2xl font-bold bg-yellow-100 border-2 border-yellow-400 rounded-2xl px-4 py-1 glow">こたえは {ans} だよ</div>}
                {phase === 'ask' && (mode === 'key'
                  ? <Keypad onDigit={digit} onBack={backspace} onOk={ok} okGlow={v !== ''} />
                  : <Choices big options={tonaeOpts} removed={removed} glowKey={m.hint >= 3 ? String(ans) : null} onPick={pick} />)}
              </div>
              {table && phase !== 'ok' && (blank
                ? <KukuTable a={p.pos ? a : b} hl={m.hint >= 3 ? ans : null} onClose={() => setTable(false)} />
                : <KukuTable a={a} upto={b} ask={b} hl={b > 1 ? b - 1 : null} onClose={() => setTable(false)} />)}
              {!blank && k !== 'deai' && m.hint >= 3 && phase === 'ask' && <CountAlong a={a} b={b} s={16} />}
            </div>
          )}
          {phase !== 'ok' && phase !== 'add' && <HintButton m={m} onHint={doHint} />}
        </div>
      );
    }

    // はってん① こたえから しきを さがす
    function FindEqQ({ p, ctx }) {
      const talk = useTalk();
      const [removed, setRemoved] = useState([]);
      const [busy, setBusy] = useState(false);
      const opts = useMemo(() => {
        const xs = [{ key: 'ok', a: p.a, b: p.b, v: p.N }];
        const cand = shuffle(range(2, 9).flatMap(a => range(2, 9).map(b => [a, b]))).filter(([a, b]) => a * b !== p.N && Math.abs(a * b - p.N) <= 8);
        // おなじ だんの となり を 1つ、ほかは ちかい こたえ
        const near = [[p.a, p.b - 1], [p.a, p.b + 1]].filter(([a, b]) => b >= 1 && b <= 9);
        [...near, ...cand].forEach(([a, b]) => { if (xs.length < 4 && !xs.some(x => x.v === a * b)) xs.push({ key: `${a}x${b}`, a, b, v: a * b }); });
        return shuffle(xs).map(x => ({ ...x, label: `${x.a} × ${x.b}` }));
      }, []);
      const doHint = (lv) => {
        if (lv === 1) talk.say(`1つずつ、くくで こたえを かんがえて みよう。${p.N}に なるのは どれかな。`);
        if (lv === 2) talk.say('しきの したに、こたえを かいたよ。');
        if (lv === 3) talk.say('ひかって いる しきだよ。');
      };
      const m = useMiss(doHint);
      useEffect(() => { talk.say(`こたえが ${p.N}に なる くくは どれかな？`); }, []);
      const pick = async (o) => {
        if (busy) return;
        if (o.key === 'ok') { setBusy(true); await ctx.celebrate(`${tonaeText(p.a, p.b)}！ ${p.a} × ${p.b} ＝ ${p.N}`); ctx.done(resultOf(m)); return; }
        m.add(MT.eq, o.label); Sound.retry(); setRemoved(r => [...r, o.key]);
        talk.say(`${o.a} × ${o.b} は ${o.v}。${p.N}では ないね。`);
      };
      return (
        <div className="w-full flex flex-col items-center gap-4">
          <div className="bg-white rounded-3xl border-4 border-indigo-300 px-8 py-3 text-5xl font-bold">こたえが <span style={{ color: COL.N }}>{p.N}</span> の くくは？</div>
          <Choices big options={opts.map(o => ({ ...o, sub: m.hint >= 2 ? `＝ ${o.v}` : '' }))} removed={removed} glowKey={m.hint >= 3 ? 'ok' : null} onPick={pick} disabled={busy} />
          <HintButton m={m} onHint={doHint} />
        </div>
      );
    }

    const QUESTION = { per: IriQ, phrase: IriQ, shiki: IriQ, findEq: FindEqQ };

    // =====================================================================
    // 10. れんしゅう（1かい ぶん）
    // =====================================================================
    function Practice({ st, n, start, intro, settings, progress, onRecord, onCoin, onSave, onFinish, onQuit }) {
      const talk = useTalk();
      const problems = useMemo(() => buildProblems(st, n, progress, start || 1), []);
      const mode = useMemo(() => modeFor(st, progress, settings), []);
      const [i, setI] = useState(-1);
      const [seikai, setSeikai] = useState(0);
      const stats = useRef({ ok: 0, all: 0, coins: 0, weak: {} });
      const t0 = useRef(Date.now());
      const alive = useRef(true);
      // たたかい（④にんじゃ しけん・てんしゅかく）：まちがえずに こたえると あいての たいりょくが へる
      const en = useMemo(() => enemyOf(st), []);
      const need = Number(settings.pass) || 0;
      const maxHp = need > 0 ? need : problems.length;
      const [hp, setHp] = useState(maxHp);
      const [hit, setHit] = useState(0);
      const [missFx, setMissFx] = useState(0);
      const [end, setEnd] = useState(null);
      const [bubble, setBubble] = useState(null);
      const enemySay = (t, voice = true) => new Promise(res => {
        setBubble({ t, k: uid() });
        if (!voice) { setTimeout(res, 900); return; }
        const pitch = Speech.pitch; Speech.pitch = 0.55; Speech.say(fmtSpeech(t), res); Speech.pitch = pitch;
      });
      useEffect(() => () => { alive.current = false; }, []);
      useEffect(() => {
        (async () => {
          await talk.say(intro || st.intro, { mood: 'cheer' });
          if (en && alive.current) { await enemySay(en.hello); await wait(300); }
          if (alive.current) { t0.current = Date.now(); setI(0); }
        })();
      }, []);
      const ctx = {
        mode, settings,
        onMiss: () => { if (en) { setMissFx(x => x + 1); setBubble({ t: 'まだまだ！', k: uid() }); } },
        celebrate: async (text, speech) => {
          setSeikai(x => x + 1); Sound.fanfare(); onCoin(); stats.current.coins++;
          await talk.say(text, { mood: 'happy', speech });
          await wait(250);
          if (alive.current) setSeikai(0);
        },
        done: (res) => {
          if (!alive.current) return;
          const p = problems[i];
          const result = res.miss || res.hint ? '△' : '○';
          stats.current.all++; if (result === '○') stats.current.ok++;
          const kk = usesKuku(p) ? kukuKey(p.a, p.b) : '';
          if (kk) stats.current.weak[kk] = (stats.current.weak[kk] || 0) + (result === '○' ? -1 : 1);
          onRecord({
            stage: st.id, step: stepName(st), problem: problemLabel(p), answer: answerLabel(p), result,
            miss: res.miss || 0, hint: res.hint || 0, types: (res.types || []).join('・'), picks: (res.picks || []).join('・'),
            kuku: kk, how: ['per', 'phrase', 'shiki', 'findEq', 'deai', 'tonae'].includes(p.kind) || mode === 'choice' ? 'えらぶ' : 'すうじ',
            secs: Math.round((Date.now() - t0.current) / 100) / 10,
          });
          t0.current = Date.now();
          Sound.step();
          if (en && (result === '○' || need === 0)) { setHit(x => x + 1); Sound.whoosh(); setTimeout(() => Sound.hit(), 450); setHp(h => Math.max(0, h - 1)); }
          if (i + 1 >= problems.length) {
            if (!en) { onFinish({ ...stats.current, n: problems.length }); return; }
            // さいごの 1もん：たおしたら「まいった〜」と けむりで きえる。たりなければ にげる
            const won = need === 0 || stats.current.ok >= need;
            setI(problems.length);
            (async () => {
              await wait(700);
              if (!alive.current) return;
              setEnd(won ? 'win' : 'escape');
              await enemySay(won ? 'まいった〜！' : en.escape);
              await wait(900);
              if (alive.current) onFinish({ ...stats.current, n: problems.length, enemy: en.id, won });
            })();
            return;
          }
          // しけん・てんしゅかくは とちゅうから に しない（ごうかくを きめる ため）
          if (st.kind !== 'shiken' && !st.tenshu) onSave({ st: st.id, left: problems.length - i - 1, start: ['deai', 'tonae', 'junban'].includes(st.kind) ? p.b + 1 : 0 }, stats.current.weak);
          setI(i + 1);
        },
      };
      const p = problems[i];
      const Q = p && (QUESTION[p.kind] || KukuQ);
      const fl = st.a ? FLOOR_OF[st.a] : null;
      return (
        <div className="w-full max-w-6xl flex flex-col items-center gap-3">
          <KagemaruBar size={en ? 64 : 92} compact />
          <div className="flex items-center gap-3 w-full">
            <div className="text-xl font-bold bg-white rounded-2xl px-3 py-1 border-2 border-indigo-300 shrink-0">{stageLabel(st)} <Rb t={st.title} /></div>
            {en ? <div className="flex-1 text-xl font-bold text-slate-600">{Math.min(problems.length, Math.max(0, i) + 1)} / {problems.length}もん</div>
              : <div className="flex-1"><Rouka n={problems.length} i={Math.max(0, i)} look={progress.look} color={fl ? fl.color : st.tenshu ? '#d97706' : '#6366f1'} box={!!st.a || !!st.tenshu} /></div>}
            <button onClick={onQuit} className="btn3d bg-white border-2 border-slate-300 rounded-2xl px-3 py-1 text-lg font-bold shrink-0">✋ やめる</button>
          </div>
          {en && <BattleScene en={en} look={progress.look} hp={hp} max={maxHp} hit={hit} miss={missFx} end={end} bubble={bubble} />}
          {Q && <Q key={i} p={p} st={st} ctx={ctx} />}
          <Seikai show={seikai} />
        </div>
      );
    }

    // =====================================================================
    // 11. けっか
    // =====================================================================
    function ResultScreen({ view, look, onAgain, onNext, onHome }) {
      const talk = useTalk();
      const r = view.result;
      const st = view.st;
      const exam = st.kind === 'shiken' || st.tenshu;
      const tr = r.newTreasure && TREASURE[r.newTreasure];
      const fl = st.a ? FLOOR_OF[st.a] : null;
      const en = r.enemy && ENEMY[r.enemy];
      const [open, setOpen] = useState(false);
      useEffect(() => {
        Sound.big();
        (async () => {
          if (en && r.won) await talk.say(`${en.name}を たおした！ こばんを 10まい てに いれたよ。${r.newEnemy ? 'あいて ずかんに くわわったよ。' : ''}`, { mood: 'happy' });
          if (en && !r.won) await talk.say(`${en.name}は にげて しまった！`, { mood: 'surprise' });
          if (exam && !r.passed) { await talk.say(`おしい！ まちがえずに できたのは ${r.ok}もん。ごうかくは ${r.need}もん いじょう だよ。${st.tenshu ? 'ふくしゅうの へや' : '③ばらばら'}で しゅぎょう して、もういちど ちょうせん しよう。こばんを ${r.coins}まい あげるよ。`, { mood: 'cheer' }); return; }
          if (exam) await talk.say(st.tenshu ? 'すごい！ てんしゅかくの しけんに ごうかく！' : `ごうかく！ ${st.a}の だんの にんじゃ しけん クリア！`, { mood: 'cheer' });
          else if (r.stageClear) await talk.say(`やったね！『${st.title}』クリア！ ボーナスで こばんを ${r.bonus}まい あげるよ。`, { mood: 'happy' });
          else await talk.say(`${r.n}もん できたね！ こばんを ${r.coins}まい もらったよ。`, { mood: 'happy' });
          if (tr) {
            await wait(300); setOpen(true); Sound.big();
            await talk.say(`たからばこが ひらいた！ 「${tr.name}」を てに いれたよ！`, { mood: 'surprise' });
            if (fl) await talk.say(fl.karakuri, { mood: 'surprise' });
          }
          if (r.newTitle) await talk.say(`しょうごうが「${r.newTitle}」に なったよ！`, { mood: 'cheer' });
        })();
      }, []);
      return (
        <div className="w-full max-w-4xl flex flex-col items-center gap-4 p-4">
          <KagemaruBar size={110} />
          <div className="bg-white rounded-3xl border-4 border-indigo-400 p-6 flex flex-col items-center gap-3 pop w-full">
            <div className="text-5xl font-bold text-indigo-800">{exam ? (r.passed ? '🎉 ごうかく！' : '💪 おしい！') : r.stageClear ? '🏆 しゅぎょう クリア！' : '⭐ よく できました！'}</div>
            {exam && <div className="text-3xl font-bold text-center">まちがえずに {r.ok}もん ／ {r.n}もん{r.need ? <div className="text-xl text-slate-600">（ごうかくは {r.need}もん いじょう）</div> : null}</div>}
            <div className="text-5xl">{Array.from({ length: r.n }, (_, j) => j < r.ok ? '⭐' : '✩').join('')}</div>
            <div className="text-3xl font-bold flex items-center gap-1"><Koban s={36} /> ＋{r.coins + (r.bonus || 0)}まい</div>
            {en && (
              <div className={`flex items-center gap-4 rounded-3xl px-5 py-2 border-4 ${r.won ? 'bg-slate-800 border-amber-400 text-white' : 'bg-slate-100 border-slate-300'}`}>
                <EnemyFace en={en} size={90} className={r.won ? 'opacity-60 grayscale' : ''} />

            <div className="flex flex-wrap gap-2">{iriStages().map(st => <StageCard key={st.id} st={st} progress={progress} current={st.id === cur.id && !isCleared(progress, st.id)} onClick={onStage} />)}</div>

    // しゅりけん しゅぎょう（まとに こたえの しゅりけんを なげる。はずれても しっぱいに しない）
    function GameScreen({ progress, onEnd }) {
      const talk = useTalk();
      const dans = passedDans(progress).length ? passedDans(progress) : [DAN_ORDER()[0]];
      const [sel, setSel] = useState(null);
      const [list, setList] = useState([]);
      const [i, setI] = useState(0);
      const [removed, setRemoved] = useState([]);
      const [fly, setFly] = useState(null);
      const [hit, setHit] = useState(false);
      const [done, setDone] = useState(false);
      useEffect(() => { talk.say('しゅりけん しゅぎょうだよ。まとの くくの こたえが かいて ある しゅりけんを おして なげよう。どの だんで しゅぎょう する？'); }, []);
      const start = (ds) => { Sound.tap(); setSel(ds); setList(shuffle(ds.flatMap(a => range(1, 9).map(b => [a, b]))).slice(0, 10)); setI(0); setDone(false); setRemoved([]); };
      const cur = list[i];
      const opts = useMemo(() => cur ? kukuOptions(cur[0], cur[1], 3) : [], [i, list]);
      useEffect(() => { if (cur) talk.say(tonae(cur[0], cur[1])[0], { speech: tonae(cur[0], cur[1])[0] }); }, [i, list]);
      const throwIt = async (x, ev) => {
        if (fly || hit) return;
        const [a, b] = cur;
        const r = ev.currentTarget.getBoundingClientRect();
        const t = document.getElementById('mato').getBoundingClientRect();
        Sound.whoosh();
        setFly({ x, left: r.left + r.width / 2 - 30, top: r.top, tx: t.left + t.width / 2 - (r.left + r.width / 2), ty: t.top + t.height / 2 - r.top - 30, ok: x === a * b });
        await wait(560);
        setFly(null);
        if (x === a * b) {
          Sound.hit(); setHit(true);
          await talk.say(tonaeText(a, b) + '！ あたり！', { mood: 'happy' });
          setHit(false); setRemoved([]);
          if (i + 1 >= list.length) { setDone(true); Sound.big(); onEnd(3); talk.say('しゅぎょう かんりょう！ こばんを 3まい あげるよ。', { mood: 'cheer' }); return; }
          setI(i + 1);
        } else {
          Sound.retry(); setRemoved(rm => [...rm, x]);
          talk.say(`${tonae(a, b)[0]}…。もういちど なげて みよう。`);
        }
      };
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">
          <KagemaruBar size={90} compact />
          {!sel && (
            <div className="flex flex-wrap gap-3 justify-center">
              {dans.map(a => <Btn key={a} onClick={() => start([a])} color="#dc2626" light="#fee2e2">{a}の だん</Btn>)}
              {dans.length >= 2 && <Btn onClick={() => start(dans)} color="#7c3aed" light="#ede9fe">🔀 まぜて</Btn>}
            </div>
          )}
          {sel && !done && cur && (
            <div className="w-full flex flex-col items-center gap-4">
              <div className="text-xl font-bold bg-white rounded-2xl px-3 border-2 border-rose-300">🎯 {i + 1} / {list.length}</div>
              <div className="relative w-full h-56 rounded-3xl border-4 border-rose-300 overflow-hidden boards flex items-center justify-center">
                <div className="absolute inset-x-0 top-0 h-1/2 wall" />
                <div id="mato" className={`relative ${hit ? '' : 'sway'}`}>
                  <svg viewBox="0 0 160 160" width="170" height="170">{[78, 62, 46, 30].map((r, j) => <circle key={r} cx="80" cy="80" r={r} fill={j % 2 ? '#fff' : '#ef4444'} stroke="#7f1d1d" strokeWidth="2" />)}</svg>
                  <div className="absolute inset-0 flex items-center justify-center"><div className="bg-white/95 rounded-2xl px-3 py-1 text-4xl font-bold border-2 border-rose-400">{cur[0]}×{cur[1]}</div></div>
                  {hit && <div className="absolute -top-2 left-1/2 -translate-x-1/2 text-4xl font-bold text-amber-500 pop">あたり！</div>}
                </div>
              </div>
              <div className="flex gap-6 justify-center">
                {opts.map(x => (
                  <button key={x} disabled={removed.includes(x)} onClick={(ev) => throwIt(x, ev)} className={`btn3d rounded-full bg-slate-100 border-4 border-slate-500 w-32 h-32 flex flex-col items-center justify-center ${removed.includes(x) ? 'opacity-20' : ''}`}>
                    <Shuriken s={56} /><span className="text-3xl font-bold">{x}</span>
                  </button>
                ))}
              </div>
              {fly && <div className="fixed z-50 throw pointer-events-none" style={{ left: fly.left, top: fly.top, '--tx': `${fly.tx}px`, '--ty': `${fly.ty}px` }}><Shuriken s={60} /></div>}
            </div>
          )}
          {done && (
            <div className="bg-white rounded-3xl border-4 border-rose-300 p-6 flex flex-col items-center gap-3 pop">
              <div className="text-5xl font-bold text-rose-600">🎯 しゅぎょう かんりょう！</div>
              <div className="text-3xl font-bold flex items-center gap-1"><Koban s={36} /> ＋3まい</div>
              <div className="flex gap-3"><Btn onClick={() => start(sel)} color="#dc2626" light="#fee2e2">🔁 もういちど</Btn><Btn onClick={() => setSel(null)} color="#64748b" light="#f1f5f9">だんを えらぶ</Btn></div>
            </div>
          )}
        </div>
      );
    }

    // =====================================================================
    // 13. 先生用画面

    function PinPad({ onSubmit, onClose, error }) {
      const [v, setV] = useState('');
      const press = (d) => { const n = (v + d).slice(0, 4); setV(n); if (n.length === 4) { onSubmit(n); setTimeout(() => setV(''), 300); } };
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
          <div className="bg-white rounded-3xl p-6 w-80 flex flex-col items-center gap-3">
            <div className="text-2xl font-bold">🔒 せんせい用</div>
            <div className="text-base">暗証番号（4けた）を入れてください</div>
            <div className="flex gap-2">{[0, 1, 2, 3].map(i => <div key={i} className="w-10 h-12 border-2 rounded-lg flex items-center justify-center text-2xl">{v[i] ? '●' : ''}</div>)}</div>
            {error > 0 && <div className="text-rose-600 font-bold">番号がちがいます</div>}
            <div className="grid grid-cols-3 gap-2">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((d, i) => d === '' ? <div key={i} /> :
                <button key={i} onClick={() => d === '⌫' ? setV(v.slice(0, -1)) : press(d)} className="btn3d w-16 h-14 rounded-xl bg-slate-100 border-2 border-slate-300 text-2xl font-bold">{d}</button>)}
            </div>
            <button onClick={onClose} className="text-lg underline mt-1">とじる</button>
          </div>
        </div>
      );
    }

    const pct = (a, b) => b ? `${Math.round((a / b) * 100)}%` : '－';
    const topOf = (m, n = 5) => Object.entries(m || {}).sort((a, b) => b[1] - a[1]).slice(0, n);
    const rateColor = (a, b) => !b ? '#fff' : a / b < 0.6 ? '#fecaca' : a / b < 0.8 ? '#fef08a' : '#bbf7d0';
    const weakKuku = (kuku, n = 6) => Object.entries(kuku || {}).filter(([, g]) => g[0] >= 2 && g[1] / g[0] < 0.6).sort((x, y) => x[1][1] / x[1][0] - y[1][1] / y[1][0]).slice(0, n).map(([k]) => k);
    const TYPE_NOTE = {
      [MT.next]: '1つ前・1つ後ろの答え（例：5×4 で 15・25）。段を順に唱えて、何番目かを数えまちがえている',
      [MT.dan]: 'ほかの段の答え（例：5×4 で 24＝6×4）。段の取りちがえ',
      [MT.add]: 'たし算の答え（例：5×4 で 9）。かけ算の意味があいまい',
      [MT.rev]: '十の位と一の位が逆（例：6×7 で 24）',
      [MT.other]: '上のどれにも当てはまらない答え',
      [MT.count]: 'しゅりけんの数を数えまちがえた（しのびの いりぐち）',
      [MT.mixup]: '「1つ分の数」と「いくつ分」・ぜんぶの数を取りちがえた（しのびの いりぐち）',
      [MT.swap]: 'かけられる数と かける数の入れちがい（例：3まいの 4つ分 を 4×3）',
      [MT.eq]: 'こたえに合わない式を選んだ（はってん①）',
    };

        onSettings(s); setNewPin('');

      const csv = async () => {
        const r = await api.logRows(pin);
