    const TYPE_NOTE = {
      'あわない カード': 'ほかの ものの 理由のカード（いぬに「うみで ジャンプが できる」など）を選んだ',
      'だから→から': '「ふわふわ」「きれい」などの あとに「だからです」と書くところを、「からです」にした',
      'から→だから': '「かわいい」「できる」などの あとに「からです」と書くところを、「だからです」にした（かわいいだからです）',
      'ことばの じゅんばん': '⓪で、ことばの順番がちがった',
      'おだいの ことばが ない': '④で、1つめの文に お題（かいたい・いきたい など）がなかった',
      'です が ない': '④で、文の終わりが「です。」になっていなかった',
      'から が ない': '④で、理由の文に「から」がなかった',
    };
    const stageLabel = (id) => STAGE[id] ? `${STAGE[id].no} ${STAGE[id].name}` : id;
    const KIND_NAMES = () => D.KINDS.map(k => k.name);

    // お題 × ステージ の 表（つまずきが わかる）
    function GridTable({ grid }) {
      return (
        <table className="w-full text-center text-sm">
          <thead><tr className="bg-pink-50"><th className="p-1 text-left">お題</th>{STAGES.map(s => <th key={s.id} className="p-1">{s.no}</th>)}</tr></thead>
          <tbody>{D.TOPICS.map(t => (
            <tr key={t.id} className="border-t"><td className="p-1 text-left font-bold whitespace-nowrap" style={{ color: t.color }}>{t.head}</td>
              {STAGES.map(s => { const g = ((grid || {})[t.head] || {})[s.id] || [0, 0]; return <td key={s.id} style={{ background: rateColor(g[1], g[0]) }}>{g[0] ? `${g[1]}/${g[0]}` : ''}</td>; })}</tr>
          ))}</tbody>
        </table>
      );
    }
    function KindBars({ kinds }) {
      const total = KIND_NAMES().reduce((a, k) => a + ((kinds || {})[k] || 0), 0);
      return (
        <div className="flex flex-col gap-1">
          {D.KINDS.map(k => { const n = (kinds || {})[k.name] || 0; return (
            <div key={k.id} className="flex items-center gap-2"><span className="w-28 font-bold" style={{ color: k.bd }}>{k.e} {k.name}</span>
              <div className="flex-1 h-5 bg-stone-100 rounded"><div className="h-5 rounded" style={{ width: total ? `${n / total * 100}%` : 0, background: k.bd }} /></div><span className="w-10 text-right">{n}</span></div>
          ); })}
          {!total && <span className="text-stone-500 text-sm">まだ ありません</span>}
        </div>
      );
    }

    // ---- はっぴょうかい（先生の パソコンを 教室の モニターに うつして、きょう できた ふうせんカードを 大きく 出す）----
    function HappyoKai({ students, onClose, onReload }) {
      const today = nowStr().slice(0, 10);
      const list = students.map(st => {
        const p = parseProgress(st.progress);
        const cards = Object.entries(p.cards || {}).filter(([id, c]) => c && c.d === today && c.s2 && ITEM[id]).map(([id, c]) => ({ it: ITEM[id], c, hana: hasHana(p, id) }));
        return { name: st.name, cards };
      });
      const [who, setWho] = useState(null);
      const [i, setI] = useState(0);
      const [clap, setClap] = useState(0);
      const [mood, setMood] = useState('normal');
      const kid = who && list.find(x => x.name === who);
      const cur = kid && kid.cards[i];
      useEffect(() => { if (!cur) return; setMood('normal'); setClap(0); Speech.say(`${kid.name}さんの ばんです。${TOPIC[cur.it.t].head}の はっぴょうです。どうぞ！`); }, [who, i]);
      const big = () => { try { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e) {} };
      const doClap = () => { Sound.clap(); Sound.fuwa(); setMood('happy'); setClap(c => c + 1); Speech.say(`はくしゅ！ ${kid.name}さん、すてきな ゆめでした！`); };
      return (
        <div className="fixed inset-0 z-[60] bg-slate-900 flex flex-col p-3 gap-2">
          <div className="flex items-center gap-2 text-white font-bold">
            <span className="blink bg-red-600 rounded-lg px-3 py-0.5 text-xl">● はっぴょうかい</span>
            <span className="text-2xl">ゆめの ふうせん ステージ</span>
            <span className="flex-1" />
            <button onClick={onReload} className="rounded-xl bg-white/90 text-slate-800 px-3 py-1">🔄 さいしんに する</button>
            <button onClick={big} className="rounded-xl bg-white/90 text-slate-800 px-3 py-1">⛶ 画面いっぱい</button>
            <button onClick={() => { Speech.stop(); onClose(); }} className="rounded-xl bg-white text-slate-800 px-4 py-1">とじる</button>
          </div>
          {!kid && (
            <div className="flex-1 bg-white rounded-3xl p-6 overflow-auto">
              <div className="text-3xl font-bold mb-1">きょう（{today}）できた ふうせんカード</div>
              <div className="text-base text-stone-500 mb-4">名前を押すと、その子の カードを 1まいずつ 大きく 出します。子どもの Chromebook で できたあと、「🔄 さいしんに する」を押すと 新しい カードが 出ます。</div>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                {list.map(x => (
                  <button key={x.name} disabled={!x.cards.length} onClick={() => { Sound.tap(); setWho(x.name); setI(0); }}
                    className={`btn3d rounded-3xl border-4 py-5 text-4xl font-bold ${x.cards.length ? 'bg-pink-50 border-pink-600' : 'bg-stone-100 border-stone-300 text-stone-400'}`}>
                    {x.name}<div className="text-xl mt-1">{x.cards.length ? `🎈 ${x.cards.length}まい` : 'まだ ありません'}</div>
                  </button>
                ))}
              </div>
            </div>
          )}
          {kid && cur && (
            <StageBg className="flex-1 rounded-3xl">
              <div className="flex items-center gap-6 p-6 h-full">
                <Fuwari size={220} mood={mood} className="shrink-0" />
                <div className="flex-1 flex flex-col items-center gap-4">
                  <div className="bg-white/95 rounded-full px-8 py-1 text-4xl font-bold border-4 border-pink-300">{kid.name}さんの ゆめ{cur.hana ? ' 💮' : ''}</div>
                  <div className="bg-white/95 rounded-3xl p-3 border-4" style={{ borderColor: TOPIC[cur.it.t].color }}><ItemArt it={cur.it} size={190} /></div>
                  <div className="bg-white/95 rounded-3xl px-8 py-4 border-4 border-pink-400 w-full">
                    <div className="keep font-bold leading-relaxed" style={{ fontSize: sentSize(cur.c.s1, cur.c.s2, 3.6) }}><R>{cur.c.s1}</R></div>
                    <div className="keep font-bold leading-relaxed text-pink-800" style={{ fontSize: sentSize(cur.c.s1, cur.c.s2, 3.6) }}>{cur.c.s2}</div>
                  </div>
                </div>
              </div>
              {clap > 0 && <div key={clap} className="absolute inset-0 flex items-center justify-center pointer-events-none"><div className="fly text-8xl">👏🎈👏</div></div>}
            </StageBg>
          )}
          {kid && (
            <div className="flex gap-3 justify-center items-center">
              <button onClick={() => { Speech.stop(); setWho(null); }} className="btn3d rounded-2xl border-2 border-slate-400 bg-white px-5 py-2 text-2xl font-bold">👥 名前に もどる</button>
              <button disabled={i <= 0} onClick={() => setI(i - 1)} className="btn3d rounded-2xl border-2 border-slate-400 bg-white px-5 py-2 text-2xl font-bold disabled:opacity-40">◀ まえへ</button>
              <span className="text-white text-2xl font-bold">{i + 1} / {kid.cards.length}</span>
              <button disabled={i >= kid.cards.length - 1} onClick={() => setI(i + 1)} className="btn3d rounded-2xl border-2 border-slate-400 bg-white px-5 py-2 text-2xl font-bold disabled:opacity-40">つぎへ ▶</button>
              <button onClick={() => Speech.say(`${cur.c.s1} ${cur.c.s2}`)} className="btn3d rounded-2xl border-2 border-slate-400 bg-white px-5 py-2 text-2xl font-bold">🔊 おてほん</button>
              <button onClick={doClap} className="btn3d rounded-2xl border-2 border-red-500 bg-red-100 px-6 py-2 text-3xl font-bold">👏 はくしゅ</button>
            </div>
          )}
        </div>
      );
    }

    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(api.pending());
      const [kai, setKai] = useState(false);
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };
      const act = async (fn, okText) => {
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); onChanged(); } }
        catch (e) { flash('うまく いきませんでした：' + e.message); }
      };
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '﻿' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`ゆめふうせん_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`ゆめふうせん_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'yumefusen') { flash('このアプリのバックアップではありません'); return; }
          if (!confirm('バックアップから、子どもの進み具合・ほし・ふうせんカードを元にもどします。よろしいですか？')) return;
          await act(() => api.restore(pin, d), 'バックアップから元にもどしました');
        };
        rd.readAsText(f);
      };
      const opt = (key, list) => list.map(([v, t]) =>
        <button key={String(v)} onClick={() => setS({ ...s, [key]: v })} className={`ml-2 mt-1 rounded-lg px-3 py-1 border-2 ${s[key] === v ? 'bg-pink-200 border-pink-600' : 'bg-white'}`}>{t}</button>);
      const flagBtn = (key, on, off, onMsg, offMsg) => <button key={key} onClick={() => act(() => api.setFlag(pin, student.name, key, !prog[key]), prog[key] ? offMsg : onMsg)} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog[key] ? on : off}</button>;
      // はなまる（その子の いまの ふうせんカードに つける）
      const hanaBtn = (who, p, itemId) => {
        const c = p.cards[itemId]; if (!c || !c.s2) return null;
        const on = hasHana(p, itemId);
        return <button onClick={() => act(() => api.setHana(pin, who, itemId, on ? '' : c.s2), on ? 'はなまるを はずしました' : `${who} さんに はなまるを送りました`)}
          className={`rounded-lg px-2 py-0.5 border-2 font-bold whitespace-nowrap ${on ? 'bg-pink-200 border-pink-500' : 'bg-white border-stone-300'}`}>{on ? '💮 はなまる' : '💮 つける'}</button>;
      };
      const TextList = ({ texts, who }) => (
        <table className="w-full text-left text-base">
          <thead className="bg-pink-50"><tr>{who && <th className="p-1">なまえ</th>}<th className="p-1">日時</th><th>ステージ</th><th>もの</th><th>つくった ぶん</th><th>けっか</th><th>💮</th></tr></thead>
          <tbody>{texts.map((t, i) => {
            const name = t.who || sel, st = data.students.find(x => x.name === name), p = st ? parseProgress(st.progress) : null;
            const it = ITEM_BY_NAME[t[2]], c = p && it && p.cards[it.id];
            return <tr key={i} className="border-t align-top"><>{who && <td className="p-1 font-bold">{t.who}</td>}</><td className="p-1 text-sm whitespace-nowrap">{t[0]}</td><td className="text-sm">{stageLabel(t[1])}</td><td className="font-bold">{t[2]}</td>
              <td className="text-lg"><R>{t[3]}</R>{t[5] && <div className="text-sm text-rose-700">まちがい：{t[5]}</div>}</td><td className="text-center">{t[4]}</td>
              <td>{c && c.s2 && t[3].includes(c.s2) ? hanaBtn(name, p, it.id) : ''}</td></tr>;
          })}</tbody>
        </table>
      );
      const allTexts = data.students.flatMap(st => (st.texts || []).map(t => Object.assign([...t], { who: st.name }))).sort((a, b) => String(b[0]).localeCompare(String(a[0])));

      return (
        <div className="fixed inset-0 bg-stone-50 z-50 overflow-auto" style={{ userSelect: 'text' }}>
          <div className="max-w-6xl mx-auto p-4 text-base">
            <div className="flex items-center gap-3 mb-3">
              <div className="text-2xl font-bold flex-1">🔒 先生用画面 <span className="text-sm text-stone-500">ver {APP_VERSION}{data.demo ? '（おためしモード）' : ''}</span></div>
              <button onClick={() => setKai(true)} className="btn3d bg-pink-100 border-2 border-pink-500 rounded-xl px-4 py-2 font-bold">📺 はっぴょうかい</button>
              <button onClick={onClose} className="btn3d bg-white border-2 border-stone-400 rounded-xl px-4 py-2 font-bold">とじる</button>
            </div>
            {data.isDefaultPin && <div className="bg-rose-100 border-2 border-rose-400 rounded-xl p-2 mb-2">暗証番号が はじめの「1234」のままです。「せってい」で変えてください。</div>}
            {msg && <div className="fixed top-3 left-1/2 -translate-x-1/2 bg-pink-900 text-white rounded-xl px-4 py-2 z-[70]">{msg}</div>}
            {kai && <HappyoKai students={data.students} onClose={() => setKai(false)} onReload={async () => { await onChanged(); flash('さいしんに しました'); }} />}
            <div className="flex gap-2 mb-3 flex-wrap">
              {[['class', 'クラス全体'], ['child', '子どもごと'], ['texts', '書いた文'], ['settings', 'せってい'], ['data', 'データ']].map(([id, t]) => (
                <button key={id} onClick={() => setTab(id)} className={`rounded-xl px-4 py-2 font-bold border-2 ${tab === id ? 'bg-pink-200 border-pink-600' : 'bg-white border-stone-300'}`}>{t}</button>
              ))}
            </div>

            {tab === 'class' && (
              <div className="flex flex-col gap-4">
                <table className="w-full bg-white rounded-xl overflow-hidden text-left">
                  <thead className="bg-pink-100"><tr><th className="p-2">なまえ</th><th>いま</th><th>カード</th><th>ほし</th><th>問題</th><th>まちがえずに</th><th>多い まちがい</th><th>さいご</th></tr></thead>
                  <tbody>
                    {data.students.map(st => {
                      const p = parseProgress(st.progress);
                      return (
                        <tr key={st.name} className="border-t cursor-pointer hover:bg-pink-50" onClick={() => { setSel(st.name); setTab('child'); }}>
                          <td className="p-2 font-bold">{st.name}<div className="text-xs text-stone-500">{p.pc ? 'Chromebook の キーボード' : ''}</div></td>
                          <td className="text-sm">{stageLabel(currentStage(p).id)}</td>
                          <td>{cardCount(p)} / {D.ITEMS.length}</td>
                          <td>{p.stars}</td>
                          <td>{st.count}</td>
                          <td style={{ background: rateColor(st.ok, st.count) }}>{pct(st.ok, st.count)}</td>
                          <td className="text-sm">{topOf(st.types, 2).map(([k, n]) => `${k}（${n}）`).join('、') || '－'}</td>
                          <td>{st.last || '－'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div className="text-sm text-stone-500">まちがえずに：まちがえず、ヒントも使わずに できた問題の割合。行を押すと、その子のくわしい記録を開きます。</div>
                <div className="bg-white rounded-xl p-3">
                  <div className="font-bold mb-1">クラス全体の つまずき（お題 × ステージ。「まちがえずに できた数 / 問題の数」）</div>
                  <GridTable grid={data.classGrid} />
                </div>
                <div className="grid md:grid-cols-3 gap-3">
                  <div className="bg-white rounded-xl p-3">
                    <div className="font-bold mb-2">まちがいの しゅるい</div>
                    {topOf(data.classTypes, 10).map(([k, n]) => <div key={k} className="rounded-lg px-2 py-1 border bg-rose-50 mb-1"><b className="text-lg">{k}</b>　{n}回<div className="text-xs text-stone-600">{TYPE_NOTE[k] || ''}</div></div>)}
                    {!Object.keys(data.classTypes || {}).length && <span className="text-stone-500">まだ ありません</span>}
                  </div>
                  <div className="bg-white rounded-xl p-3">
                    <div className="font-bold mb-2">えらんだ「あわない カード」</div>
                    {topOf(data.classWrong, 15).map(([k, n]) => <div key={k} className="border-b py-1">{k}　<b>{n}回</b></div>)}
                    {!Object.keys(data.classWrong || {}).length && <span className="text-stone-500">まだ ありません</span>}
                  </div>
                  <div className="bg-white rounded-xl p-3">
                    <div className="font-bold mb-2">よく えらぶ みかた</div>
                    <KindBars kinds={data.classKinds} />
                  </div>
                </div>
              </div>
            )}

            {tab === 'child' && (
              <div className="flex flex-col gap-3">
                <div className="flex gap-2 flex-wrap">{data.students.map(st => <button key={st.name} onClick={() => setSel(st.name)} className={`rounded-xl px-3 py-1 border-2 font-bold ${sel === st.name ? 'bg-pink-200 border-pink-600' : 'bg-white'}`}>{st.name}</button>)}</div>
                {student && prog && <>
                  <div className="bg-white rounded-xl p-3 flex flex-wrap gap-4 items-center">
                    <div className="text-2xl font-bold">{student.name}</div>
                    <div>ふうせんカード {cardCount(prog)}・ほし {prog.stars}・しょうごう {titleOf(prog)}{prog.niji ? '・にじいろの ふうせん' : ''}</div>
                    <div className="flex gap-2 flex-wrap">
                      {flagBtn('unlockAll', '🔓 全部開く を やめる', '🔓 ステージを全部開く', 'ステージを全部開きました', '全部開く をやめました')}
                      {flagBtn('hatten', '🌟 はってんを とじる', '🌟 はってんを開く', 'はってんを開きました', 'はってんを閉じました')}
                      {flagBtn('pc', '⌨️ 画面の キーボードに もどす', '⌨️ Chromebook の キーボードに する', 'Chromebook のキーボードで書くようにしました', '画面のキーボードにもどしました')}
                    </div>
                  </div>
                  <div className="text-sm text-stone-500">ボタンで変えたことは、子どもが次に名前を押したときから変わります。</div>
                  <div className="grid md:grid-cols-2 gap-3">
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold mb-2">ステージごとの けっか</div>
                      <table className="w-full text-left"><thead><tr><th>ステージ</th><th>クリア</th><th>問題</th><th>まちがえずに</th></tr></thead>
                        <tbody>{STAGES.map(st => { const g = student.stages[st.id] || [0, 0]; return <tr key={st.id} className="border-t"><td className="p-1">{st.no} {st.name}</td><td>{isCleared(prog, st.id) ? '⭐' : ''}</td><td>{g[0] || ''}</td><td style={{ background: rateColor(g[1], g[0]) }}>{g[0] ? pct(g[1], g[0]) : ''}</td></tr>; })}</tbody></table>
                    </div>
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold mb-2">まちがいの しゅるい</div>
                      {topOf(student.types, 10).map(([k, n]) => <div key={k} className="rounded-lg px-2 py-1 border bg-rose-50 mb-1"><b>{k}</b>　{n}回<div className="text-xs text-stone-600">{TYPE_NOTE[k] || ''}</div></div>)}
                      {!Object.keys(student.types || {}).length && <span className="text-stone-500">まだ ありません</span>}
                      <div className="font-bold mt-3 mb-1">えらんだ「あわない カード」</div>
                      {topOf(student.wrong, 10).map(([k, n]) => <div key={k} className="border-b py-0.5">{k}　<b>{n}回</b></div>)}
                      {!Object.keys(student.wrong || {}).length && <span className="text-stone-500">まだ ありません</span>}
                    </div>
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold mb-1">つまずき（お題 × ステージ）</div>
                      <GridTable grid={student.grid} />
                    </div>
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold mb-2">よく えらぶ みかた（①②で選んだカード・③の書き出し）</div>
                      <KindBars kinds={student.kinds} />
                    </div>
                  </div>
                  <div className="bg-white rounded-xl p-3">
                    <div className="font-bold mb-2">ふうせんカード（{cardCount(prog)}まい・あたらしい順）　💮を押すと、子どもの カードに はなまるが 付きます</div>
                    <div className="flex flex-col gap-1 max-h-96 overflow-auto">
                      {Object.entries(prog.cards).sort((a, b) => String(b[1].d).localeCompare(String(a[1].d))).map(([id, c]) => ITEM[id] && <div key={id} className="border-b py-1 flex items-center gap-2"><b className="w-28 shrink-0">{ITEM[id].n}</b><span className="flex-1"><R>{c.s1}</R>{c.s2}　<span className="text-xs text-stone-500">{stageLabel(c.st)}・{c.d}</span></span>{hanaBtn(student.name, prog, id)}</div>)}
                    </div>
                  </div>
                  <div className="bg-white rounded-xl p-3"><div className="font-bold mb-2">書いた文（③④・はってん）</div><TextList texts={student.texts || []} /></div>
                </>}
              </div>
            )}

            {tab === 'texts' && (
              <div className="bg-white rounded-xl p-3">
                <div className="font-bold mb-1">子どもが自分で書いた文（③ じぶんで かく・④ まとめ・はってん）</div>
                <div className="text-sm text-stone-500 mb-2">アプリは、文のおわりの「からです・だからです」と、④の文の形だけを確かめています。中身（理由として合っているか）は、ここで読んで確かめてください。💮を押すと、その子の ふうせんカードに はなまるが付きます（いまの カードと同じ文のときだけ押せます）。</div>
                <TextList texts={allTexts} who />
                {!allTexts.length && <span className="text-stone-500">まだ ありません</span>}
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 text-lg">
                <div>よみあげの はやさ：{opt('rate', [[0.6, 'とても ゆっくり'], [0.7, 'ゆっくり'], [0.8, 'すこし ゆっくり（はじめ）'], [0.9, 'ふつうに ちかい'], [1, 'ふつう']])}</div>
                <div>もじの おおきさ：{opt('font', [[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']])}</div>
                <div>はっぴょう（ステージで よむ）：{opt('happyo', [[true, 'つかう'], [false, 'つかわない']])}</div>
                <div>りゆうの カードの いろわけ：{opt('color', [[true, 'あり'], [false, 'なし']])}<span className="text-sm text-stone-500 ml-2">（なし でも、ヒント②で色が つきます）</span></div>
                <div>こうかおん：{opt('sound', [[true, 'ならす'], [false, 'ならさない']])}</div>
                <div>暗証番号を変える：<input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} className="border-2 rounded-lg px-2 py-1 w-28 ml-2" placeholder="4けた" /></div>
                <div><button onClick={saveSettings} className="btn3d rounded-xl px-6 py-2 border-2 border-pink-600 bg-pink-100 font-bold text-xl">保存する</button></div>
                <div className="text-sm text-stone-500">ステージを全部開く・はってん・キーボードの切りかえは、「子どもごと」で1人ずつ変えます。</div>
              </div>
            )}

            {tab === 'data' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 text-lg">
                <div>まだ送れていない記録：{pending} 件 <button onClick={async () => { await api.flush(); setPending(api.pending()); flash('送り直しました'); }} className="ml-2 rounded-xl px-3 py-1 border-2 bg-white font-bold">いま送る</button></div>
                <div><button onClick={csv} className="rounded-xl px-4 py-2 border-2 bg-white font-bold">📄 記録をCSVで書き出す</button></div>
                <div className="flex gap-2 items-center flex-wrap"><button onClick={backup} className="rounded-xl px-4 py-2 border-2 bg-white font-bold">💾 バックアップを保存</button>
                  <label className="rounded-xl px-4 py-2 border-2 bg-white font-bold cursor-pointer">📂 バックアップから元にもどす<input type="file" accept=".json" className="hidden" onChange={restore} /></label></div>
                <div className="border-t pt-3 flex gap-2 flex-wrap items-center">
                  <span className="font-bold text-rose-700">記録を消す：</span>
                  {student && <button onClick={() => { if (confirm(`${student.name} さんの記録と進み具合を消します。元にもどせません。よろしいですか？`)) act(() => api.clear(pin, student.name), '消しました'); }} className="rounded-xl px-3 py-1 border-2 border-rose-300 bg-rose-50 font-bold">{student.name} さんだけ</button>}
                  <button onClick={() => { if (confirm('全員の記録と進み具合を消します。元にもどせません。よろしいですか？')) act(() => api.clear(pin, ''), '消しました'); }} className="rounded-xl px-3 py-1 border-2 border-rose-400 bg-rose-100 font-bold">全員</button>
                  <span className="text-sm text-stone-500">（「子どもごと」で選んでいる子）</span>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 14. アプリ
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [talk, setTalk] = useState({ text: '', mood: 'normal', talking: false, k: 0 });
      const [bump, setBump] = useState(0);
      const [soundOn, setSoundOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const progRef = useRef(progress);
      progRef.current = progress;
      const before = useRef(null);

      const talkApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setTalk({ text, mood: opts.mood || 'normal', talking: true, k: id });
          Speech.say(opts.speech || text, () => { if (sayId.current === id) setTalk(p => ({ ...p, talking: false })); resolve(); });
        });
        return { say: run, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const talkCtx = { ...talkApi, ...talk };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        ['sound', 'color', 'happyo'].forEach(k => { v[k] = v[k] !== false && v[k] !== 'false'; });
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8;
        Sound.on = v.sound; setSoundOn(Sound.on);
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        const recs = records.current; records.current = [];
        api.save({ name, progress: json, records: recs, stamp: nowStr(), time: Date.now() });
        return p;
      };

      const login = async (n) => {
        Sound.get(); Speech.say('');
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグと はなまるは スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) { p = { ...p, flagT: a.flagT }; FLAGS.forEach(k => { p[k] = !!a[k]; }); }
        if (server) p = { ...p, hana: a.hana || {} };
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false);
        setView({ v: 'home' });
      };
      const logout = () => { talkApi.stop(); setName(null); setView({ v: 'login' }); };

      const startStage = (st, part) => {
        records.current = [];
        const p = progRef.current;
        before.current = { title: titleOf(p), stars: p.stars };
        const n = part ? part.left : st.n;
        setView({ v: 'practice', st, n, intro: part ? 'つづきから はじめよう。' : null, key: uid() });
      };
      const onRecord = (r) => { records.current.push({ ...r, id: uid() }); };
      // 1つ できた：ふうせんカードを のこし、ほしを ふやす
      const onDream = (it, s1, s2, stId) => {
        const p = progRef.current, old = p.cards[it.id];
        // ⓪（りゆう なし）では、まえに つくった りゆうの ある カードを のこす
        const card = !s2 && old && old.s2 ? old : { s1, s2: s2 || '', st: stId, d: nowStr().slice(0, 10) };
        persist({ ...p, stars: p.stars + 1, cards: { ...p.cards, [it.id]: card } });
        setBump(x => x + 1);
      };
      const onSave = (part) => { persist({ ...progRef.current, part }); };
      const finish = (st, r) => {
        let p = { ...progRef.current, part: null };
        if (!p.cleared[st.id]) p.cleared = { ...p.cleared, [st.id]: 1 };
        let niji = false;
        if (!p.niji && topicsDone(p) >= D.TOPICS.length) { p.niji = 1; niji = true; }
        p = persist(p);
        const t = titleOf(p), newTitle = before.current && t !== before.current.title ? t : null;
        const sk = D.SKY.filter(s => before.current && before.current.stars < s.c && p.stars >= s.c).map(s => s.n);
        const cur = currentStage(p);
        const next = stageOpen(p, cur) && !isCleared(p, cur.id) && cur.id !== st.id ? () => startStage(cur) : null;
        setView({ v: 'result', st, r: { ...r, newTitle, newSky: sk.join('と '), niji }, next });
      };
      const quit = () => { talkApi.stop(); persist({ ...progRef.current }); setView({ v: 'home' }); };
      const cont = () => {
        const p = progRef.current;
        const part = p.part && STAGE[p.part.st];
        if (part && stageOpen(p, part)) { startStage(part, p.part); return; }
        startStage(currentStage(p));
      };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const p = { ...progRef.current, flagT: sp.flagT, hana: sp.hana || {}, t: sp.t || Date.now() };
              FLAGS.forEach(k => { p[k] = !!sp[k]; });
              const fresh = !me.progress ? { ...newProgress(), welcome: 1 } : p;
              progRef.current = fresh; setProgress(fresh); safeStore.set(COPY_KEY(name), JSON.stringify(fresh));
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-pink-800">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-stone-500 mt-2">{boot.error}</div></div>;

      const bar = (home = true) => (
        <TopBar name={name} progress={progress} bump={bump} onHome={home ? () => { talkApi.stop(); if (view.v === 'practice') quit(); else setView({ v: 'home' }); } : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }} />
      );
      const page = (inner, cls = 'soft') => <div className={`min-h-screen flex flex-col items-center ${cls}`}>{bar()}{inner}</div>;

      let body = null;
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (view.v === 'home') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <HomeScreen name={name} progress={progress} onContinue={cont} go={(v) => setView({ v })} onWelcome={() => persist({ ...progRef.current, welcome: 1 })}
            onHanaSeen={(ids) => { const p = progRef.current; const hs = { ...p.hanaSeen }; ids.forEach(id => { hs[id] = p.hana[id]; }); persist({ ...p, hanaSeen: hs }); }} /></div>;
      } else if (view.v === 'stages') {
        body = page(<StageScreen progress={progress} onStart={startStage} />);
      } else if (view.v === 'practice') {
        body = page(<Practice key={view.key} st={view.st} n={view.n} intro={view.intro} name={name} progress={progress} pc={!!progress.pc}
          onRecord={onRecord} onDream={onDream} onSave={onSave} onFinish={(r) => finish(view.st, r)} onQuit={quit} />, 'bg-pink-50');
      } else if (view.v === 'result') {
        body = page(<ResultScreen view={view} progress={progress} onAgain={() => startStage(view.st)} onNext={view.next} onHome={() => setView({ v: 'home' })} onSky={() => setView({ v: 'sky' })} />);
      } else if (view.v === 'album') {
        body = page(<AlbumScreen name={name} progress={progress} />, 'bg-sky-50');
      } else if (view.v === 'sky') {
        body = page(<SkyScreen progress={progress} />, 'bg-indigo-950');
      }

      return (
        <SetCtx.Provider value={settings}>
          <TalkCtx.Provider value={talkCtx}>
            {body}
            {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
            {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
            {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
          </TalkCtx.Provider>
        </SetCtx.Provider>
      );
    }

    window.YUME_READY.then(() => {
      D = window.YUME_DATA;
      D.TOPICS.forEach(t => { TOPIC[t.id] = t; });
      D.ITEMS.forEach(i => { ITEM[i.id] = i; ITEM_BY_NAME[i.n] = i; });
      D.CARDS.forEach(c => { CARD[c.id] = c; });
      D.KINDS.forEach(k => { KIND[k.id] = k; });
      IMG_OK = new Set(window.YUME_IMG || []);
      CARD_BY_LEN = D.CARDS.map(c => ({ ...c, key: toHira(norm(c.t)) })).sort((a, b) => b.key.length - a.key.length);
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:24px;line-height:1.8">データを よみこめませんでした。<br>ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<div style="font-size:14px;color:#888">' + e.message + '</div></div>';
    });
  </script>
</body>
</html>
