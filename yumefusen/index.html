<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フワリさんの ゆめの ふうせんやさん</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'BIZ UDPGothic', sans-serif; background: #fdf2f8; margin: 0; color: #1e293b;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .btn3d { border-bottom-width: 6px; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; }
    .win { background: #fff; border: 4px solid #be185d; border-radius: 18px; box-shadow: 0 6px 0 rgba(190,24,93,.22); }
    .soft { background-color: #fdf2f8; background-image: radial-gradient(circle at 25% 30%, rgba(190,24,93,.07) 0 3px, transparent 4px), radial-gradient(circle at 75% 70%, rgba(2,132,199,.07) 0 3px, transparent 4px); background-size: 46px 46px; }
    .pop { animation: pop .45s cubic-bezier(.17,.89,.32,1.28) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floaty { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .bob { animation: bob 1.2s steps(2) infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .shake { animation: shake .45s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-9px); } 40%,80% { transform: translateX(9px); } }
    .glow { animation: glow 1.1s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 14px rgba(250,204,21,0); } }
    .fly { animation: fly 1.4s ease-out forwards; }
    @keyframes fly { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { transform: translateY(-90px) scale(1); opacity: 0; } }
    .bump { animation: bump .5s; }
    @keyframes bump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.35); } }
    .confetti span { position: absolute; animation: fall 1.6s ease-in forwards; }
    @keyframes fall { from { transform: translateY(-40px) rotate(0); opacity: 1; } to { transform: translateY(260px) rotate(320deg); opacity: 0; } }
    .blink { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .caret { display: inline-block; width: 3px; height: 1.1em; background: #be185d; vertical-align: -0.15em; margin-left: 2px; animation: blink 1s steps(2) infinite; }
    .tri:after { content: '▼'; display: inline-block; margin-left: 6px; font-size: .7em; animation: floaty 1s infinite; }
    .chara-img { filter: drop-shadow(0 4px 4px rgba(0,0,0,.18)); }
    /* ふうせんが とんで いく */
    .rise { animation: rise 2.8s ease-in forwards; }
    @keyframes rise { 0% { transform: translateY(0) rotate(-3deg); } 30% { transform: translateY(-12vh) rotate(4deg); } 100% { transform: translateY(-120vh) rotate(-4deg); } }
    .sway { animation: sway 4s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes sway { 0%,100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-10px); } }
    .twinkle { animation: twinkle 2.4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
    .meteor { animation: meteor 3.5s linear infinite; }
    @keyframes meteor { 0% { transform: translate(0,0); opacity: 0; } 8% { opacity: 1; } 40% { transform: translate(-45vw, 30vh); opacity: 0; } 100% { opacity: 0; transform: translate(-45vw, 30vh); } }
    /* りゆうの カード */
    .rcard { position: relative; display: inline-flex; align-items: center; justify-content: center; border: 3px solid; border-radius: 14px;
      min-height: 3.6rem; min-width: 10.5rem; padding: .45rem .9rem .3rem; font-size: 1.7rem; font-weight: 700; line-height: 1.25; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
    .rcard .kind { position: absolute; top: -.75rem; left: .5rem; white-space: nowrap; font-size: .8rem; background: #fff; border: 2px solid; border-radius: 99px; padding: 0 .45rem; line-height: 1.35; }
    .slot { display: inline-flex; align-items: center; justify-content: center; min-width: 5.5rem; min-height: 3.6rem; border: 3px dashed #ec4899; border-radius: 14px; background: #fdf2f8; padding: 0 .5rem; }
    .sent { font-size: 2rem; font-weight: 700; line-height: 1.9; }
    .keep { word-break: keep-all; overflow-wrap: anywhere; }
    .wsent .sent { font-size: 1.6rem; line-height: 1.6; }
    ruby rt { font-size: .45em; font-weight: 700; }
    .kkey { width: 2.75rem; height: 2.75rem; font-size: 1.45rem; font-weight: 700; border-radius: 12px; border: 2px solid #94a3b8; background: #fff; border-bottom-width: 5px; }
    .kkey:active { transform: translateY(3px); border-bottom-width: 2px; }
    .kkey.fn { background: #f1f5f9; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#be185d;font-weight:bold;">じゅんび ちゅう…</div>
  </div>

  <!-- データと 絵は GitHub Pages から読みこみます（このファイルを短くするため） -->
  <script>
    (function () {
      var h = location.hostname;
      var local = location.protocol === 'file:' || /github\.io$/.test(h) || h === 'localhost' || h === '127.0.0.1';
      window.YUME_BASE = local ? '' : 'https://zku0395-ops.github.io/hori/yumefusen/';
      var V = '1';
      var load = function (f) {
        return new Promise(function (ok, ng) {
          var s = document.createElement('script');
          s.src = window.YUME_BASE + f + '?v=' + V;
          s.onload = ok; s.onerror = function () { ng(new Error(f)); };
          document.head.appendChild(s);
        });
      };
      window.YUME_READY = Promise.all([load('data/yume.js'), load('data/img.js')]);
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;
    const APP_VERSION = '1.0.1';
    const BASE = window.YUME_BASE;
    const IMG = BASE + 'img/';

    // =====================================================================
    //  1. 小さな道具
    // =====================================================================
    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const nowStr = () => {
      const d = new Date(), p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const safeStore = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
    };
    const downloadText = (name, text, type) => {
      const blob = new Blob([text], { type: type || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    };
    // いつも おなじ ばしょに ほしを おく ための かんたんな 乱数
    const seeded = (n) => { const x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); };

    // =====================================================================
    //  2. こえ と おと
    // =====================================================================
    const Speech = {
      rate: 0.8, pitch: 1.15, voice: null,
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(String(text));
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = this.pitch;
          let done = false;
          const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
          u.onend = end; u.onerror = end;
          // 声が出ない端末でも先へ進めるように、長さに合わせて待つ
          setTimeout(end, 1500 + String(text).length * 230 / this.rate);
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() { try { this.ok && window.speechSynthesis.cancel(); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }

    // このアプリのための オリジナルの おと
    const Sound = {
      on: true, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      tone(freq, at, dur, type = 'square', vol = 0.06) {
        const c = this.get(); if (!c || !this.on) return;
        const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      seikai() { [[784, 0], [988, .09], [1319, .18]].forEach(([f, t]) => this.tone(f, t, .14, 'square', .05)); this.tone(1568, .3, .35, 'triangle', .1); },
      fanfare() {
        [[523, 0], [659, .14], [784, .28], [1047, .42], [988, .7], [1047, .84], [1319, 1.0]].forEach(([f, t]) => this.tone(f, t, .16, 'square', .055));
        [262, 330, 392, 523].forEach(f => this.tone(f, 1.0, 1.0, 'triangle', .07));
      },
      clap() { for (let i = 0; i < 10; i++) this.tone(1800 + Math.random() * 900, i * .07, .04, 'square', .02); },
      retry() { this.tone(330, 0, .12, 'sine', .06); this.tone(294, .11, .18, 'sine', .06); }, // まちがえた とき（小さな おと）
      tap() { this.tone(880, 0, .05, 'square', .035); },
      put() { this.tone(660, 0, .05, 'triangle', .07); this.tone(990, .05, .06, 'triangle', .05); },
      fuwa() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, i * .12, .3, 'sine', .07)); }, // ふうせんが とぶ
      star() { this.tone(1568, 0, .12, 'triangle', .08); this.tone(2093, .1, .3, 'triangle', .08); },
      key() { this.tone(1200, 0, .03, 'triangle', .04); },
    };

    // =====================================================================
    //  3. データ（data/yume.js から）
    // =====================================================================
    let D = null, TOPIC = {}, ITEM = {}, ITEM_BY_NAME = {}, CARD = {}, KIND = {}, IMG_OK = new Set(), CARD_BY_LEN = [];

    // ステージ（id は 記録に つかうので かえない）
    const STAGES = [
      { id: '1', no: '①', name: 'りゆうの カード', type: 'card1', n: 5, desc: 'りゆうを カードから 1まい えらぶ' },
      { id: '2', no: '②', name: 'ぶんの おわり', type: 'ending', n: 5, desc: '「からです」と「だからです」を えらぶ' },
      { id: '3', no: '③', name: 'じぶんで かく', type: 'write', n: 3, blanks: ['そのりゆうは、'], desc: 'りゆうを じぶんで かく' },
      { id: '4', no: '④', name: 'まとめ', type: 'all', n: 3, desc: '2つの ぶんを ぜんぶ じぶんで かく' },
      { id: 'h1', no: 'はってん①', name: 'なぜなら', type: 'write', n: 3, blanks: ['なぜなら、'], hatten: true, desc: '「なぜなら、〜からです。」で かく' },
      { id: 'h2', no: 'はってん②', name: 'りゆうを 2つ', type: 'write', n: 3, blanks: ['そのりゆうは、', 'それに、'], hatten: true, desc: '「それに、」で りゆうを もう 1つ かく' },
    ];
    const STAGE = {}; STAGES.forEach(s => { STAGE[s.id] = s; });
    const MAIN = STAGES.filter(s => !s.hatten);

    // ---- ぶんを つくる ----
    const sent1 = (it) => `${TOPIC[it.t].head}は、${it.n}です。`;
    const endOf = (c) => c.f === 'na' ? 'dakara' : 'kara';
    const ENDW = { kara: 'からです。', dakara: 'だからです。' };
    const toHira = (s) => String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    const toKata = (s) => String(s).replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
    const norm = (s) => String(s || '').replace(/[\s　]+/g, '');
    // 「から」「だから」の どちらに なるか（わからない ときは null：どちらでも よい）
    const NA_WORDS = ['すき', 'きらい', 'きれい', 'げんき', 'しずか', 'べんり', 'じょうず', 'ゆうめい', 'にぎやか', 'おしゃれ', 'ふしぎ', 'たいせつ', 'だいじ', 'らく', 'かんたん', 'すてき', 'とくい', 'へいき',
      'さわやか', 'なめらか', 'やわらか', 'まっしろ', 'まっか', 'いっぱい', 'たくさん', 'いろいろ', 'おなじ', 'あんぜん', 'じょうぶ', 'とくべつ', 'しあわせ', 'ハッピー', 'りっぱ', 'まんまる', 'そう', 'カラフル'];
    const VERB_END = /(する|くる|なる|ある|いる|できる|とぶ|はしる|まわる|ひかる|のる|すすむ|およぐ|あそぶ|はねる|もぐる|うごく|でる|とれる|つくる|とる|わかる|いく|ける|げる|せる|ぜる|てる|ねる|へる|べる|める|れる|きる|ぎる|しる|じる|ちる|にる|ひる|びる|みる|りる|む|ぶ|ぐ|う|つ|す|く)$/;
    function expectEnding(raw) {
      const w = norm(raw).replace(/[。、！？!?]+$/, '');
      if (!w) return null;
      const h = toHira(w);
      for (const c of CARD_BY_LEN) if (h.endsWith(c.key)) return endOf(c);
      const last = w.slice(-1);
      if (/[ァ-ヺー]/.test(last)) return 'dakara';
      if (NA_WORDS.some(x => h.endsWith(toHira(x)))) return 'dakara';
      if (h.length >= 4 && /(..)\1$/.test(h)) return 'dakara'; // ふわふわ・きらきら
      if (/た$/.test(h)) return 'kara';
      if (/い$/.test(h)) return /[えけせてねへめれげぜでべぺ]い$/.test(h) ? 'dakara' : 'kara';
      if (VERB_END.test(h)) return 'kara';
      return null;
    }
    // かいた ことばの さいごに「からです」などが あれば とりだす
    // （子どもが 入れた わかち書きの あきは のこす）
    function splitEnding(raw) {
      const w = String(raw || '').replace(/[\s　]+/g, ' ').trim().replace(/[。\s]+$/, '');
      const m = w.match(/^(.*?)\s*(だから|から)\s*(です)?$/);
      if (m && m[1].trim()) return { text: m[1].trim(), end: m[2] === 'だから' ? 'dakara' : 'kara' };
      return { text: w, end: null };
    }
    const endRule = (w, need) => need === 'dakara'
      ? `「${w}」の あとは「だからです」に なるよ。「${w}だからです」。`
      : `「${w}」の あとは「からです」だよ。「だ」は いらないね。「${w}からです」。`;
    const missType = (need) => need === 'dakara' ? 'だから→から' : 'から→だから';

    // 「かいたい どうぶつ」の「か」を「飼」（ふりがな つき）に して 画面に だす
    function R({ children }) {
      const s = String(children == null ? '' : children);
      const t = D && D.TOPICS.find(x => x.ruby);
      if (!t) return s;
      const [from, kanji, yomi, rest] = t.ruby;
      const key = from + ' どうぶつ';
      const parts = s.split(key);
      if (parts.length < 2) return s;
      return <span>{parts.flatMap((p, i) => i === 0 ? [p] : [<React.Fragment key={i}><ruby>{kanji}<rt>{yomi}</rt></ruby>{rest} どうぶつ</React.Fragment>, p])}</span>;
    }

    // =====================================================================
    //  4. しんちょく（進み具合）
    // =====================================================================
    const FLAGS = ['unlockAll', 'hatten', 'pc'];
    const newProgress = () => ({ v: 1, t: 0, stars: 0, cards: {}, cleared: {}, part: null, welcome: 0, niji: 0, hana: {}, hanaSeen: {},
      unlockAll: false, hatten: false, pc: false });
    function parseProgress(s) {
      let p = null;
      try { p = typeof s === 'string' ? (s ? JSON.parse(s) : null) : s; } catch (e) { p = null; }
      const q = { ...newProgress(), ...(p || {}) };
      ['cards', 'cleared', 'hana', 'hanaSeen'].forEach(k => { if (!q[k] || typeof q[k] !== 'object') q[k] = {}; });
      q.stars = Number(q.stars) || 0;
      if (q.part && !(q.part.st in STAGE)) q.part = null; // なくした ステージ⓪の つづきは すてる
      return q;
    }
    const isCleared = (p, id) => !!p.cleared[id];
    const stageOpen = (p, st) => {
      if (st.hatten) return !!(p.hatten || p.unlockAll) && (st.id === 'h1' || p.unlockAll || isCleared(p, 'h1'));
      if (p.unlockAll) return true;
      const i = MAIN.findIndex(s => s.id === st.id);
      return i <= 0 || isCleared(p, MAIN[i - 1].id);
    };
    const currentStage = (p) => MAIN.find(st => stageOpen(p, st) && !isCleared(p, st.id))
      || STAGES.filter(s => s.hatten).find(st => stageOpen(p, st) && !isCleared(p, st.id))
      || MAIN[MAIN.length - 1];
    const cardCount = (p) => Object.keys(p.cards || {}).length;
    const titleOf = (p) => D.TITLES.filter(t => p.stars >= t.c).pop().n;
    const hasHana = (p, id) => !!(p.hana[id] && p.cards[id] && p.hana[id] === p.cards[id].s2);
    const topicsDone = (p) => D.TOPICS.filter(t => Object.keys(p.cards).some(id => ITEM[id] && ITEM[id].t === t.id)).length;

    // =====================================================================
    //  5. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    const LOG_HEADER = ['日時', 'なまえ', 'ステージ', 'おだい', 'もの', 'つくった ぶん', 'けっか', 'まちがい', 'ヒント', 'まちがいの しゅるい', 'えらんだ カード', 'かいた ことば', 'みかた', 'びょう', 'ID'];
    const WRITE_STAGES = ['3', '4', 'h1', 'h2'];
    const DEFAULT_SETTINGS = { rate: 0.8, font: 1, happyo: true, color: true, sound: true };

    // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
    const emptyStu = () => ({ count: 0, ok: 0, secs: 0, last: '', stages: {}, types: {}, wrong: {}, kinds: {}, grid: {}, texts: [] });
    function aggregate(rows) {
      const students = {}, classTypes = {}, classWrong = {}, classKinds = {}, classGrid = {};
      const inc = (m, k) => { m[k] = (m[k] || 0) + 1; };
      const cell = (g, t, st, ok) => { const a = g[t] || (g[t] = {}); const c = a[st] || (a[st] = [0, 0]); c[0]++; c[1] += ok; };
      rows.forEach(r => {
        const name = String(r[1] || '').trim(); if (!name) return;
        const s = students[name] || (students[name] = emptyStu());
        const when = String(r[0]), day = when.slice(0, 10);
        if (day > s.last) s.last = day;
        const st = String(r[2]), ok = r[6] === '○' ? 1 : 0, topic = String(r[3] || ''), item = String(r[4] || '');
        s.count++; s.ok += ok; s.secs += Number(r[13]) || 0;
        const g = s.stages[st] || (s.stages[st] = [0, 0]);
        g[0]++; g[1] += ok;
        cell(s.grid, topic, st, ok); cell(classGrid, topic, st, ok);
        String(r[9] || '').split('・').forEach(k => { if (k) { inc(s.types, k); inc(classTypes, k); } });
        String(r[12] || '').split('・').forEach(k => { if (k) { inc(s.kinds, k); inc(classKinds, k); } });
        String(r[10] || '').split('・').forEach(k => { if (k.slice(-1) !== '✖') return; const key = `${item}：${k.slice(0, -1)}`; inc(s.wrong, key); inc(classWrong, key); });
        if (WRITE_STAGES.includes(st)) s.texts.push([when, st, item, String(r[5] || ''), String(r[6] || ''), String(r[9] || ''), topic]);
      });
      Object.values(students).forEach(s => { s.texts = s.texts.slice(-80).reverse(); });
      return { students, classTypes, classWrong, classKinds, classGrid };
    }

    const Local = {
      key: 'yumefusen_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}
        this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: { ...DEFAULT_SETTINGS } };
        return this.mem;
      },
      save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
      update(name, fn) { const d = this.data(); const p = parseProgress(d.progress[name]); fn(p); p.t = Date.now(); d.progress[name] = JSON.stringify(p); this.save(); return { ok: true, progress: d.progress[name] }; },
    };

    const PENDING_KEY = 'yumefusen_pending_v1';
    const COPY_KEY = (name) => 'yumefusen_copy_' + name;
    const recRow = (stamp, name, r) => [stamp, name, r.stage, r.topic, r.item, r.answer, r.result, r.miss, r.hint, r.types, r.picks, r.written, r.kinds, r.secs, r.id];
    const api = {
      async init() {
        if (HAS_GAS) return gas('getInitData');
        const d = Local.data();
        return { students: d.roster, settings: { ...DEFAULT_SETTINGS, ...d.settings }, demo: true };
      },
      async student(name) {
        if (HAS_GAS) return gas('getStudent', name);
        return Local.data().progress[name] || '';
      },
      async sendOne(p) {
        if (HAS_GAS) return gas('saveResult', p);
        const d = Local.data();
        const old = parseProgress(d.progress[p.name]);
        const neu = parseProgress(p.progress);
        if (neu.t >= old.t) { neu.hana = old.hana; d.progress[p.name] = JSON.stringify(neu); }
        const ids = new Set(d.log.map(r => r[14]));
        p.records.forEach(r => { if (!ids.has(r.id)) d.log.push(recRow(p.stamp, p.name, r)); });
        Local.save();
        return { ok: true };
      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす
      readQueue() { try { return JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) { return []; } },
      async save(payload) {
        const queue = api.readQueue().filter(q => !(q.name === payload.name && !q.records.length));
        queue.push({ ...payload, qid: uid() });
        safeStore.set(PENDING_KEY, JSON.stringify(queue));
        return api.flush();
      },
      pending() { return api.readQueue().length; },
      flushing: false,
      async flush() {
        if (api.flushing) return;
        api.flushing = true;
        try {
          for (let q = api.readQueue()[0]; q; q = api.readQueue()[0]) {
            await api.sendOne(q);
            safeStore.set(PENDING_KEY, JSON.stringify(api.readQueue().filter(x => x.qid !== q.qid)));
          }
        } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
        finally { api.flushing = false; }
      },
      async teacher(pin) {
        if (HAS_GAS) return gas('getTeacherData', pin);
        const d = Local.data();
        if (String(pin) !== String(d.pin)) return { ok: false };
        const agg = aggregate(d.log);
        return {
          ok: true, isDefaultPin: d.pin === '1234', demo: true, settings: { ...DEFAULT_SETTINGS, ...d.settings },
          students: d.roster.map(n => ({ name: n, progress: d.progress[n] || '', ...(agg.students[n] || emptyStu()) })),
          classTypes: agg.classTypes, classWrong: agg.classWrong, classKinds: agg.classKinds, classGrid: agg.classGrid,
        };
      },
      async setFlag(pin, name, key, val) {
        if (HAS_GAS) return gas('setFlag', pin, name, key, val);
        return Local.update(name, p => { p[key] = !!val; p.flagT = Date.now(); });
      },
      async setHana(pin, name, item, text) {
        if (HAS_GAS) return gas('setHanamaru', pin, name, item, text);
        return Local.update(name, p => { if (text) p.hana[item] = text; else delete p.hana[item]; });
      },
      async saveSettings(pin, s) {
        if (HAS_GAS) return gas('saveSettings', pin, s);
        const d = Local.data(); const { newPin, ...rest } = s;
        d.settings = { ...d.settings, ...rest }; if (newPin) d.pin = newPin; Local.save(); return { ok: true };
      },
      async logRows(pin) {
        if (HAS_GAS) return gas('getLogRows', pin);
        return { ok: true, rows: [LOG_HEADER, ...Local.data().log] };
      },
      async backup(pin) {
        if (HAS_GAS) return gas('getBackup', pin);
        const d = Local.data(); return { ok: true, data: { app: 'yumefusen', roster: d.roster.map(n => [n, d.progress[n] || '']), settings: d.settings } };
      },
      async restore(pin, data) {
        if (HAS_GAS) return gas('restoreBackup', pin, data);
        const d = Local.data(); (data.roster || []).forEach(([n, p]) => { if (!d.roster.includes(n)) d.roster.push(n); d.progress[n] = p; }); Local.save(); return { ok: true };
      },
      async clear(pin, name) {
        if (HAS_GAS) return gas('clearRecords', pin, name);
        const d = Local.data();
        d.log = d.log.filter(r => name && r[1] !== name);
        (name ? [name] : d.roster).forEach(n => { delete d.progress[n]; safeStore.del(COPY_KEY(n)); });
        Local.save(); return { ok: true };
      },
    };

    // =====================================================================
    //  6. え（フワリさん・もの・ふうせん）
    //     ChatGPT で つくった 絵（img/。data/img.js に なまえが ある もの）が あれば それを、なければ 絵文字を だす

    const TalkCtx = createContext(null);

    // =====================================================================
    //  7. がめんの ぶひん
    // =====================================================================
    function Btn({ children, onClick, color = '#be185d', light = '#fce7f3', className = '', disabled, style }) {
      return (
        <button onClick={onClick} disabled={disabled}
          className={`btn3d rounded-2xl font-bold px-5 py-3 text-2xl border-2 ${className}`}
          style={disabled ? { background: '#e7e5e4', borderColor: '#a8a29e', color: '#78716c', ...style } : { background: light, borderColor: color, color: '#1e293b', ...style }}>

    function Seikai({ show }) {

          <div className="confetti absolute inset-x-0 top-24 h-80">

    // フワリさんの ことば（1もじずつ でる）
    function MsgWin({ size = 96, compact = false }) {
      const talk = useTalk();
      const [n, setN] = useState(0);
      const text = talk.text || '';
      useEffect(() => {
        setN(0);
        if (!text) return;
        let i = 0;
        const t = setInterval(() => { i += 1; setN(i); if (i >= text.length) clearInterval(t); }, 36);
        return () => clearInterval(t);
      }, [talk.k]);

        <div className="flex items-end gap-2 w-full">

          </button>

            <span className={n >= text.length && text ? 'tri' : ''}><R>{text.slice(0, n) || '　'}</R></span>
          </div>
          <button onClick={() => talk.repeat()} className={`btn3d shrink-0 bg-white border-2 border-pink-700 rounded-2xl px-3 ${compact ? 'py-1 text-base' : 'py-2 text-lg'} font-bold`}>🔊<br />もういちど</button>
        </div>
      );
    }

    // りゆうの カード（みかたで 色わけ）
    function RCard({ c, text, onClick, className = '', glow, showKind, noLabel, style }) {
      const set = useContext(SetCtx);
      const k = KIND[c.k];
      const colored = set.color || showKind;
      return (
        <button onClick={onClick} className={`rcard btn3d ${glow ? 'glow' : ''} ${className}`}
          style={colored ? { background: k.bg, borderColor: k.bd, ...style } : { background: '#fff', borderColor: '#57534e', ...style }}>
          {colored && !noLabel && <span className="kind" style={{ borderColor: k.bd, color: k.bd }}>{k.e} {k.name}</span>}
          {text || c.t}
        </button>
      );
    }

    // ヒント（3だんかい）：2かい まちがえると ボタンが ひかり、3かい まちがえると いちばん くわしい ヒントが でる
    function useHint() {
      const [miss, setMiss] = useState(0);
      const [level, setLevel] = useState(0);
      const types = useRef([]);
      const picks = useRef([]);
      const kinds = useRef([]);
      const addMiss = (type) => {
        if (type) types.current.push(type);
        setMiss(m => { const n = m + 1; if (n >= 3) setLevel(3); return n; });
        Sound.retry();
      };
      const more = () => setLevel(l => Math.min(3, l + 1));
      const rec = (extra) => ({ miss, hint: level, types: [...new Set(types.current)].join('・'), picks: picks.current.join('・'), kinds: kinds.current.join('・'), ...extra });
      return { miss, level, addMiss, more, rec, picks, kinds, setLevel };
    }
    function HintBtn({ h }) {
      return <button onClick={() => { Sound.tap(); h.more(); }} disabled={h.level >= 3}
        className={`btn3d rounded-2xl border-2 px-4 py-2 text-xl font-bold ${h.level >= 3 ? 'bg-stone-100 border-stone-300 text-stone-400' : 'bg-yellow-100 border-yellow-500'} ${h.miss >= 2 && h.level < 3 ? 'glow' : ''}`}>
        💡 ヒント{h.level ? ` ${'①②③'[h.level - 1]}` : ''}</button>;
    }

    // ---- 50おんの キーボード（教室の 50おん表と おなじ ならび）----
    const KANA_COLS = [
      ['あ', 'い', 'う', 'え', 'お'], ['か', 'き', 'く', 'け', 'こ'], ['さ', 'し', 'す', 'せ', 'そ'], ['た', 'ち', 'つ', 'て', 'と'], ['な', 'に', 'ぬ', 'ね', 'の'],
      ['は', 'ひ', 'ふ', 'へ', 'ほ'], ['ま', 'み', 'む', 'め', 'も'], ['や', '', 'ゆ', '', 'よ'], ['ら', 'り', 'る', 'れ', 'ろ'], ['わ', '', 'を', '', 'ん'],
      ['ー', '、', '。', '！', '？'],
    ];
    const DAKU = { か: 'が', き: 'ぎ', く: 'ぐ', け: 'げ', こ: 'ご', さ: 'ざ', し: 'じ', す: 'ず', せ: 'ぜ', そ: 'ぞ', た: 'だ', ち: 'ぢ', つ: 'づ', て: 'で', と: 'ど', は: 'ば', ひ: 'び', ふ: 'ぶ', へ: 'べ', ほ: 'ぼ', う: 'ゔ' };
    const HANDAKU = { は: 'ぱ', ひ: 'ぴ', ふ: 'ぷ', へ: 'ぺ', ほ: 'ぽ' };
    const SMALL = { あ: 'ぁ', い: 'ぃ', う: 'ぅ', え: 'ぇ', お: 'ぉ', つ: 'っ', や: 'ゃ', ゆ: 'ゅ', よ: 'ょ', わ: 'ゎ' };
    const inv = (m) => Object.fromEntries(Object.entries(m).map(([a, b]) => [b, a]));
    const UNDAKU = inv(DAKU), UNHAN = inv(HANDAKU), UNSMALL = inv(SMALL);
    // さいごの もじに ゛ ゜ ちいさく を つける（もう いちど おすと もとに もどる）
    function applyMod(text, mod) {
      if (!text) return text;
      const last = text.slice(-1), kata = /[ァ-ヶ]/.test(last), h = toHira(last);
      let n = null;
      if (mod === 'daku') n = DAKU[h] || UNDAKU[h] || (UNHAN[h] ? DAKU[UNHAN[h]] : null);
      if (mod === 'han') n = HANDAKU[h] || UNHAN[h] || (UNDAKU[h] && HANDAKU[UNDAKU[h]]) || null;
      if (mod === 'small') n = SMALL[h] || UNSMALL[h] || null;
      if (!n) return text;
      return text.slice(0, -1) + (kata ? toKata(n) : n);
    }
    function KanaKeyboard({ onInput, extra }) {
      const [kata, setKata] = useState(false);
      const press = (fn) => { Sound.key(); onInput(fn); };
      return (
        <div className="bg-slate-100 border-t-4 border-pink-600 rounded-t-2xl p-1.5 flex flex-col gap-1 items-center w-full">
          <div className="flex gap-1 flex-row-reverse">
            {KANA_COLS.map((col, i) => (
              <div key={i} className={`flex flex-col gap-1 ${i === 10 ? 'mr-2' : ''}`}>
                {col.map((ch, j) => ch
                  ? <button key={j} className="kkey" onClick={() => press(t => t + (kata && i < 10 ? toKata(ch) : ch))}>{kata && i < 10 ? toKata(ch) : ch}</button>
                  : <div key={j} style={{ width: '2.75rem', height: '2.75rem' }} />)}
              </div>
            ))}
          </div>
          <div className="flex gap-1.5 flex-wrap justify-center items-center">
            <button className="kkey fn" style={{ width: '4.5rem' }} onClick={() => press(t => applyMod(t, 'daku'))}>゛<span className="text-xs">てんてん</span></button>
            <button className="kkey fn" style={{ width: '4.5rem' }} onClick={() => press(t => applyMod(t, 'han'))}>゜<span className="text-xs">まる</span></button>
            <button className="kkey fn" style={{ width: '5.2rem' }} onClick={() => press(t => applyMod(t, 'small'))}>ちいさく</button>
            <button className="kkey fn" style={{ width: '6rem' }} onClick={() => press(t => t + ' ')}>あき</button>
            <button className="kkey fn" style={{ width: '6rem', background: kata ? '#fde68a' : '#e0f2fe' }} onClick={() => { Sound.tap(); setKata(k => !k); }}>{kata ? 'カタカナ' : 'ひらがな'}</button>
            <button className="kkey fn" style={{ width: '5.5rem', background: '#fee2e2' }} onClick={() => press(t => t.slice(0, -1))}>⌫ けす</button>
            {extra && <span className="inline-flex gap-2 ml-3">{extra}</span>}
          </div>
        </div>
      );
    }
    // かく ところ（タップで えらぶ。Chromebook の キーボードの ときは ふつうの いれもの）
    function WriteBox({ value, onChange, active, onFocus, pc, wide, ph }) {
      if (pc) return <input value={value} onChange={e => onChange(e.target.value)} onFocus={onFocus} autoFocus={active}
        className={`border-4 rounded-xl px-3 py-0.5 text-2xl font-bold ${active ? 'border-pink-500 bg-pink-50' : 'border-stone-300 bg-white'}`} style={{ width: wide ? '100%' : '14em', userSelect: 'text' }} placeholder={ph || ''} />;
      return (
        <button onClick={onFocus} className={`inline-flex items-center border-4 rounded-xl px-3 py-0.5 text-2xl font-bold text-left ${active ? 'border-pink-500 bg-pink-50' : 'border-stone-300 bg-white'}`}
          style={{ minWidth: wide ? '100%' : '8em', minHeight: '2.6rem' }}>
          <span className="whitespace-pre-wrap">{value}</span>{active && <span className="caret" />}{!value && !active && <span className="text-stone-300">{ph || 'ここに かく'}</span>}
        </button>
      );
    }

    // =====================================================================
    //  8. もんだい
    // =====================================================================
    // ぶんを みせる（1つめは できて いる ぶん、2つめは つくって いる ぶん）
    function TwoLines({ it, children }) {
      return (
        <div className="bg-white rounded-2xl p-4 border-4 border-pink-200 w-full flex flex-col gap-1">
          <div className="sent text-slate-700">① <R>{sent1(it)}</R></div>
          <div className="sent flex flex-wrap items-center gap-x-1 gap-y-2">② {children}</div>
        </div>
      );
    }
    const kindAsk = (it) => `${it.n}の できる ことや、ようす、きもちを おもいだしてね。`;

    // ① りゆうの カードを 1まい（あう カード 3まい ＋ ほかの ものの りゆう 1まい）
    function QCard1({ it, onDone }) {
      const talk = useTalk();
      const h = useHint();
      const [cs] = useState(() => shuffle([...it.cards.map(id => CARD[id]), shuffle(D.wrongCards(it))[0]]));
      const [gone, setGone] = useState([]);
      const [shake, setShake] = useState(null);
      const [got, setGot] = useState(null);
      useEffect(() => { talk.say(`どうして ${it.n}なのかな？ りゆうの カードを 1まい えらんでね。`); }, []);
      useEffect(() => {
        if (h.level === 1) talk.say(kindAsk(it));
        if (h.level === 2) talk.say(`カードを よむね。${cs.filter(c => !gone.includes(c.id)).map(c => c.t).join('、')}。`);
        if (h.level === 3) talk.say(`ひかって いる カードは、どれも ${it.n}に あうよ。`);
      }, [h.level]);
      const tap = (c) => {
        if (got) return;
        if (c.it !== it.id) {
          h.picks.current.push(`${c.t}✖`); h.addMiss('あわない カード');
          setShake(c.id); setTimeout(() => { setShake(null); setGone(g => [...g, c.id]); }, 500);
          talk.say(`「${c.t}」は、${ITEM[c.it].n}の りゆう みたいだね。${it.n}の りゆうを えらんでね。`, { mood: 'think' });
          return;
        }
        Sound.put(); h.picks.current.push(c.t); h.kinds.current.push(KIND[c.k].name); setGot(c);
        const s2 = `そのりゆうは、${c.t}${ENDW[endOf(c)]}`;
        talk.say(`${sent1(it)} ${s2}`, { mood: 'happy' });
        setTimeout(() => onDone(h.rec({ answer: sent1(it) + s2, s2 })), 2600);
      };
      return (
        <div className="flex flex-col items-center gap-5 w-full">
          <TwoLines it={it}>
            <span>そのりゆうは、</span>
            {got ? <span className="text-pink-700 underline decoration-4 underline-offset-8">{got.t}</span> : <span className="slot">？</span>}
            <span>{got ? ENDW[endOf(got)] : '。'}</span>
          </TwoLines>
          <div className="flex flex-wrap gap-5 justify-center pt-3">
            {cs.map(c => gone.includes(c.id) || (got && got.id === c.id) ? null :
              <RCard key={c.id} c={c} onClick={() => tap(c)} className={shake === c.id ? 'shake' : ''} glow={h.level >= 3 && c.it === it.id} showKind={h.level >= 2} />)}
          </div>
          <HintBtn h={h} />
        </div>
      );
    }

    // 「からです」「だからです」を えらぶ ボタン（よみあげ つき）
    function EndingPick({ word, need, onOk, h, chosen, setChosen, small }) {
      const talk = useTalk();
      const choose = (e) => {
        if (need && e !== need) {
          h.addMiss(missType(need)); h.picks.current.push(`${ENDW[e]}（ちがう）`);
          talk.say(h.miss >= 1 ? endRule(word, need) : `「${word}${ENDW[e]}」。こえに だして よんで みよう。ちょっと へんだね。`, { mood: 'think' });
          return;
        }
        Sound.put(); if (setChosen) setChosen(e); onOk && onOk(e);
      };
      return (
        <span className="inline-flex gap-2">
          {['kara', 'dakara'].map(e => (
            <button key={e} onClick={() => choose(e)}
              className={`btn3d rounded-xl border-2 font-bold ${small ? 'px-2 py-1 text-xl' : 'px-4 py-2 text-3xl'} ${chosen === e ? 'bg-pink-200 border-pink-600' : 'bg-white border-pink-400'} ${h.level >= 3 && need === e ? 'glow' : ''}`}>{ENDW[e]}</button>
          ))}
        </span>
      );
    }
    const ruleTalk = (need) => need === 'dakara'
      ? '「ふわふわ」「きれい」の ような ことばの あとは「だからです」に なるよ。'
      : '「〜い」で おわる ことばや、うごきの ことばの あとは「からです」だよ。';

    // ② ぶんの おわり：りょうほうを よみあげて、しぜんに きこえる ほうを えらぶ
    function QEnding({ it, onDone }) {
      const talk = useTalk();
      const h = useHint();
      const [cs] = useState(() => shuffle(it.cards.map(id => CARD[id])));
      const [card, setCard] = useState(null);
      const [done, setDone] = useState(null);
      useEffect(() => { talk.say(`${it.n}の りゆうの カードを 1まい えらんでね。`); }, []);
      useEffect(() => {
        if (!card) return;
        if (h.level === 1) talk.say(`「${card.t}からです」「${card.t}だからです」。どっちかな？`);
        if (h.level === 2) talk.say(ruleTalk(endOf(card)));
        if (h.level === 3) talk.say('ひかって いる ほうを おしてね。');
      }, [h.level]);
      const pickCard = (c) => { Sound.put(); setCard(c); h.picks.current.push(c.t); h.kinds.current.push(KIND[c.k].name); talk.say(`「${c.t}」だね。ぶんの おわりは「からです」かな、「だからです」かな？ 🔊を おすと、よんで みるよ。`); };
      const listen = () => { Sound.tap(); talk.say(`${card.t}からです。 ${card.t}だからです。 しぜんに きこえるのは どっちかな？`); };
      const ok = (e) => {
        setDone(e);
        const s2 = `そのりゆうは、${card.t}${ENDW[e]}`;
        talk.say(`${sent1(it)} ${s2}`, { mood: 'happy' });
        setTimeout(() => onDone(h.rec({ answer: sent1(it) + s2, s2 })), 2600);
      };
      return (
        <div className="flex flex-col items-center gap-5 w-full">
          <TwoLines it={it}>
            <span>そのりゆうは、</span>
            {card ? <span className="text-pink-700">{card.t}</span> : <span className="slot">？</span>}
            {done ? <span className="text-pink-700 underline decoration-4 underline-offset-8">{ENDW[done]}</span> : <span className="slot" style={{ minWidth: '9rem' }}>？</span>}
          </TwoLines>
          {!card && <div className="flex flex-wrap gap-5 justify-center pt-3">{cs.map(c => <RCard key={c.id} c={c} onClick={() => pickCard(c)} />)}</div>}
          {card && !done && <div className="flex gap-3 items-center flex-wrap justify-center">
            <button onClick={listen} className="btn3d bg-white border-2 border-sky-500 rounded-2xl px-4 py-2 text-2xl font-bold">🔊 よんで みる</button>
            <EndingPick word={card.t} need={endOf(card)} onOk={ok} h={h} />
          </div>}
          {card && !done && <HintBtn h={h} />}
        </div>
      );
    }

    const doneBtn = (check) => <button onClick={check} className="btn3d rounded-2xl border-2 border-green-700 bg-green-100 px-5 py-2 text-2xl font-bold">✅ できた！</button>;

    // ③・はってん：りゆうを じぶんで かく（書き出しボタン つき）
    function QWrite({ it, st, pc, onDone }) {
      const talk = useTalk();
      const h = useHint();
      const tp = TOPIC[it.t];
      const pres = st.blanks;
      const [texts, setTexts] = useState(pres.map(() => ''));
      const [ends, setEnds] = useState(pres.map(() => null));
      const [act, setAct] = useState(0);
      const [done, setDone] = useState(false);
      const ideas = useMemo(() => it.cards.map(id => CARD[id]), []);
      const naze = pres[0].startsWith('なぜ');
      useEffect(() => {
        talk.say(pres.length > 1 ? `${it.n}の りゆうを 2つ かこう。「それに、」の あとに、もう 1つの りゆうを かくよ。`
          : naze ? `「なぜなら、」の あとに、${it.n}の りゆうを かこう。` : `${it.n}の りゆうを、じぶんで かいて みよう。こまったら、したの「かきだし」の ボタンを おしてね。`);
      }, []);
      useEffect(() => {
        if (h.level === 1) talk.say(`${kindAsk(it)}`);
        if (h.level === 2) talk.say('カードを おすと、その ことばが はいるよ。');
        if (h.level === 3) talk.say(`たとえば「${ideas[0].t}」と かいて みよう。さいごに「からです」か「だからです」を えらんでね。`);
      }, [h.level]);
      const edit = (fn) => { const t = [...texts]; t[act] = fn(t[act]); setTexts(t); };
      const setEnd = (i, e) => { const x = [...ends]; x[i] = e; setEnds(x); };
      const put = (text, mark, kind) => { Sound.put(); h.picks.current.push(mark); if (kind) h.kinds.current.push(kind); const t = [...texts]; t[act] = text; setTexts(t); setEnd(act, null); };
      const start = (k) => {
        const s = tp.starts[k - 1];
        put(s, `${s.trim()}（かきだし）`, KIND[k].name);
        talk.say(`「${s.trim()}」の つづきを かこう。${KIND[k].ask}`);
      };
      const check = () => {
        const parts = texts.map((t, i) => { const s = splitEnding(t); return { text: s.text, end: s.end || ends[i] }; });
        for (let i = 0; i < parts.length; i++) {
          if (!parts[i].text) { setAct(i); talk.say(`「${pres[i]}」の あとに、りゆうを かいてね。`); return; }
          if (tp.starts.some(s => norm(s) === norm(parts[i].text))) { setAct(i); talk.say(`「${parts[i].text}」の つづきを かいてね。`); return; }
          if (!parts[i].end) { setAct(i); talk.say('さいごに「からです」か「だからです」を えらんでね。'); return; }
        }
        if (parts.length > 1 && norm(parts[0].text) === norm(parts[1].text)) { setAct(1); talk.say('「それに、」の あとには、べつの りゆうを かこう。'); return; }
        for (let i = 0; i < parts.length; i++) {
          const need = expectEnding(parts[i].text);
          if (need && need !== parts[i].end) {
            setAct(i); h.addMiss(missType(need)); h.picks.current.push(`${parts[i].text}${ENDW[parts[i].end]}（ちがう）`);
            talk.say(endRule(parts[i].text, need), { mood: 'think' });
            return;
          }
        }
        setDone(true);
        const s2 = parts.map((p, i) => `${pres[i]}${p.text}${ENDW[p.end]}`).join('');
        talk.say(`${sent1(it)} ${s2}`, { mood: 'happy' });
        setTimeout(() => onDone(h.rec({ answer: sent1(it) + s2, s2, written: parts.map(p => p.text).join('／') })), 2800);
      };
      return (
        <div className="wsent flex flex-col items-center gap-2 w-full">
          <div className="bg-white rounded-2xl px-4 py-2 border-4 border-pink-200 w-full flex flex-col gap-1">
            <div className="sent text-slate-700">① <R>{sent1(it)}</R></div>
            {pres.map((pre, i) => (
              <div key={i} className="sent flex flex-wrap items-center gap-2">
                {i === 0 ? '② ' : '　 '}{pre}
                <WriteBox value={texts[i]} active={act === i && !done} onFocus={() => setAct(i)} pc={pc} onChange={v => { const t = [...texts]; t[i] = v; setTexts(t); }} />
                <EndingPick small h={h} chosen={ends[i]} setChosen={e => { setEnd(i, e); }} />
              </div>
            ))}
          </div>
          {!done && <div className="flex flex-wrap gap-2 justify-center items-center">
            <span className="text-lg font-bold text-stone-600">✏️ かきだし：</span>
            {D.KINDS.map(k => <button key={k.id} onClick={() => start(k.id)} className="btn3d rounded-xl border-2 px-3 py-1 text-xl font-bold" style={{ background: k.bg, borderColor: k.bd }}>{k.e} {k.name}「{tp.starts[k.id - 1].trim()}…」</button>)}
          </div>}
          {h.level >= 2 && !done && <div className="flex flex-wrap gap-2 justify-center">{ideas.map(c => <RCard key={c.id} c={c} onClick={() => put(c.t, `${c.t}（ヒント）`, KIND[c.k].name)} showKind noLabel style={{ fontSize: '1.2rem', minHeight: '2.4rem', minWidth: 0, padding: '.1rem .6rem' }} />)}</div>}
          {!done && (pc ? <div className="flex gap-3"><HintBtn h={h} />{doneBtn(check)}</div> : <KanaKeyboard onInput={edit} extra={<><HintBtn h={h} />{doneBtn(check)}</>} />)}
        </div>
      );
    }

    // ④ まとめ：2つの ぶんを ぜんぶ じぶんで かく
    function QAll({ it, pc, onDone }) {
      const talk = useTalk();
      const h = useHint();
      const tp = TOPIC[it.t];
      const [lines, setLines] = useState(['', '']);
      const [act, setAct] = useState(0);
      const [done, setDone] = useState(false);
      const model = [sent1(it), 'そのりゆうは、〇〇からです。'];
      useEffect(() => { talk.say(`2つの ぶんを、ぜんぶ じぶんで かこう。1つめは「${tp.head}は、${it.n}です。」、2つめは りゆうの ぶんだよ。`); }, []);
      useEffect(() => {
        if (h.level === 1) talk.say(`1つめは「${tp.head}は、${it.n}です。」、2つめは「そのりゆうは、〜からです。」の かたちで かくよ。`);
        if (h.level === 2) talk.say('うすい もじを みながら かいて みよう。');
        if (h.level === 3) {
          const l = [...lines];
          if (!norm(l[0]).includes(tp.key) || !/です。?$/.test(norm(l[0]))) l[0] = sent1(it);
          if (!norm(l[1])) l[1] = 'そのりゆうは、';
          setLines(l); setAct(1);
          talk.say('1つめの ぶんと、2つめの はじめを いれたよ。つづきを かこう。');
        }
      }, [h.level]);
      const edit = (fn) => { const l = [...lines]; l[act] = fn(l[act]); setLines(l); };
      const check = () => {
        const fix = (s) => { const t = String(s).trim(); return t && !/[。！？]$/.test(t) ? t + '。' : t; };
        const l1 = fix(lines[0]), l2 = fix(lines[1]);
        const n1 = norm(l1), n2 = norm(l2);
        if (!n1) { setAct(0); talk.say('1つめの ぶんを かこう。'); return; }
        if (!n1.includes(tp.key)) { setAct(0); h.addMiss('おだいの ことばが ない'); talk.say(`1つめは「${tp.head}は、${it.n}です。」の ぶんだよ。「${tp.head}」から かこう。`, { mood: 'think' }); return; }
        if (!/です[。！]$/.test(n1)) { setAct(0); h.addMiss('です が ない'); talk.say('1つめの ぶんの さいごは「です。」に しよう。', { mood: 'think' }); return; }
        if (!n2) { setAct(1); talk.say('2つめに、りゆうの ぶんを かこう。'); return; }
        if (!n2.includes('から')) { setAct(1); h.addMiss('から が ない'); talk.say('りゆうの ぶんは「そのりゆうは、〜からです。」の かたちで かこう。', { mood: 'think' }); return; }
        if (!/です[。！]$/.test(n2)) { setAct(1); h.addMiss('です が ない'); talk.say('2つめの ぶんの さいごは「からです。」に しよう。', { mood: 'think' }); return; }
        const m = n2.match(/^(.*?)(だ)?から(です)?[。！]$/);
        const word = m ? m[1].split('、').pop() : '';
        const need = expectEnding(word);
        if (m && need && need !== (m[2] ? 'dakara' : 'kara')) { setAct(1); h.addMiss(missType(need)); talk.say(endRule(word, need), { mood: 'think' }); return; }
        setLines([l1, l2]); setDone(true);
        talk.say(`${l1} ${l2}`, { mood: 'happy' });
        setTimeout(() => onDone(h.rec({ answer: l1 + l2, s1: l1, s2: l2, written: `${l1}／${l2}` })), 2800);
      };
      return (
        <div className="wsent flex flex-col items-center gap-2 w-full">
          <div className="bg-white rounded-2xl px-4 py-1.5 border-4 border-pink-200 w-full flex flex-col gap-1">
            {[0, 1].map(i => (
              <div key={i} className="flex items-start gap-2">
                <span className="sent" style={{ lineHeight: 1.5 }}>{'①②'[i]}</span>
                <div className="flex-1 flex flex-col">
                  {h.level >= 2 && !done && <div className="text-lg leading-tight text-stone-400 font-bold pl-1"><R>{model[i]}</R></div>}
                  <WriteBox wide value={lines[i]} active={act === i && !done} onFocus={() => setAct(i)} pc={pc} onChange={v => { const l = [...lines]; l[i] = v; setLines(l); }} ph={i ? 'りゆうの ぶん' : `「${tp.head}は、」の ぶん`} />
                </div>
              </div>
            ))}
          </div>
          {!done && (pc ? <div className="flex gap-3"><HintBtn h={h} />{doneBtn(check)}</div> : <KanaKeyboard onInput={edit} extra={<><HintBtn h={h} />{doneBtn(check)}</>} />)}
        </div>
      );
    }

    // 文が ながい ときは 字を すこし 小さく する（rem）
    const sentSize = (s1, s2, base) => { const n = Math.max(String(s1 || '').length, String(s2 || '').length); return `${n > 34 ? base * 0.72 : n > 26 ? base * 0.85 : base}rem`; };

    // =====================================================================
    //  9. はっぴょう（ステージで よむ）と、ふうせんが とぶ
    // =====================================================================
    function StageBg({ children, className = '' }) {
      return (
        <div className={`relative overflow-hidden ${className}`} style={{ background: 'linear-gradient(#fde68a,#fbcfe8)' }}>
          {IMG_OK.has('stage.webp') && <img src={IMG + 'stage.webp'} alt="" className="absolute inset-0 w-full h-full object-cover" draggable={false} />}
          <div className="relative h-full">{children}</div>
        </div>
      );
    }
    // ふうせんに のって そらへ（ほしが ふえる）
    function BalloonFly({ it, gain, onDone }) {
      const tp = TOPIC[it.t];
      const [phase, setPhase] = useState('fly');
      useEffect(() => {
        Sound.fuwa();
        Speech.say(`${tp.cname}の ふうせんに のって、ゆめが そらへ とんで いくよ！`);
        const t1 = setTimeout(() => { setPhase('star'); if (gain) { Sound.star(); Speech.say('ゆめの そらに、ほしが 1つ ふえたよ！'); } }, 2900);
        const t2 = setTimeout(onDone, gain ? 5200 : 3600);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, []);
      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center overflow-hidden" style={{ background: 'linear-gradient(#1e1b4b, #7c3aed 60%, #f9a8d4)' }} onClick={onDone}>
          {IMG_OK.has('sky.webp') && <img src={IMG + 'sky.webp'} alt="" className="absolute inset-0 w-full h-full object-cover opacity-90" draggable={false} />}
          {phase === 'fly' && <div className="rise flex flex-col items-center mb-6">
            <Balloon color={tp.balloon} size={170} />
            <div className="-mt-4 bg-white/90 rounded-3xl p-2 border-4" style={{ borderColor: tp.color }}><ItemArt it={it} size={110} /></div>
          </div>}
          {phase === 'star' && <div className="absolute inset-0 flex flex-col items-center justify-center gap-4">
            <div className="pop twinkle text-[9rem] leading-none">⭐</div>
            {gain > 0 && <div className="pop bg-white/95 rounded-full px-8 py-2 text-4xl font-bold text-indigo-800 border-4 border-yellow-300">ほしが ＋{gain}</div>}
          </div>}
        </div>
      );
    }
    function StageShow({ name, it, s1, s2, onDone, gain = 1 }) {
      const [phase, setPhase] = useState('count');
      const [n, setN] = useState(3);
      const sayIt = () => Speech.say(`${s1} ${s2}`);
      useEffect(() => {
        Speech.say(`${name}さんの ゆめの はっぴょうだよ！ じゅんびは いい？`);
        const t1 = setTimeout(() => setN(2), 2600), t2 = setTimeout(() => setN(1), 3400), t3 = setTimeout(() => { setN(0); setPhase('go'); Sound.seikai(); Speech.say('どうぞ！ こえに だして よんでね。'); }, 4200);
        return () => [t1, t2, t3].forEach(clearTimeout);
      }, []);
      const read = () => { setPhase('clap'); Sound.clap(); Speech.say('はくしゅ！ すてきな ゆめだね！'); setTimeout(() => setPhase('fly'), 2400); };
      if (phase === 'fly') return <BalloonFly it={it} gain={gain} onDone={onDone} />;
      return (
        <div className="fixed inset-0 z-40 bg-slate-900/70 flex items-center justify-center p-3">
          <div className="pop bg-white rounded-[2rem] p-3 pb-3 w-full max-w-5xl shadow-2xl border-8" style={{ borderColor: TOPIC[it.t].color }}>
            <div className="flex items-center gap-3 mb-2 font-bold text-xl">
              <span className="blink bg-red-500 text-white rounded-lg px-3 py-0.5">● はっぴょう</span>
              <span>ゆめの ふうせん ステージ ／ {name}さん</span>
            </div>
            <StageBg className="rounded-2xl">
              <div className="flex items-center gap-4 p-5 min-h-[22rem]">
                <Fuwari size={150} mood={phase === 'clap' ? 'happy' : 'normal'} className={phase === 'go' ? 'bob' : ''} />
                <div className="flex-1 flex flex-col items-center gap-3">
                  <div className="bg-white/95 rounded-3xl p-2 border-4" style={{ borderColor: TOPIC[it.t].color }}><ItemArt it={it} size={120} /></div>
                  <div className="bg-white/95 rounded-2xl px-5 py-3 border-4 border-pink-400 w-full">
                    <div className="keep font-bold leading-relaxed" style={{ fontSize: sentSize(s1, s2, 2.25) }}><R>{s1}</R></div>
                    <div className="keep font-bold leading-relaxed text-pink-800" style={{ fontSize: sentSize(s1, s2, 2.25) }}>{s2}</div>
                  </div>
                </div>
              </div>
              {phase === 'count' && n > 0 && <div key={n} className="pop absolute inset-0 flex items-center justify-center text-[9rem] font-bold text-white" style={{ textShadow: '0 0 20px #0008' }}>{n}</div>}
              {phase === 'clap' && <div className="absolute left-4 bottom-2 text-5xl">👏👏</div>}
            </StageBg>
            <div className="flex gap-3 justify-center mt-3">
              <button onClick={sayIt} className="btn3d bg-white border-2 border-slate-400 rounded-2xl px-4 py-2 text-xl font-bold">🔊 おてほん</button>
              <Btn onClick={read} disabled={phase !== 'go'} color="#dc2626" light="#fee2e2" className={`text-3xl px-10 ${phase === 'go' ? 'glow' : ''}`}>📣 よんだよ！</Btn>
            </div>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 10. れんしゅう（1かい ぶん）：おだい → もの → もんだい → はっぴょう → ふうせん
    // =====================================================================
    function TopicGrid({ progress, onPick }) {
      return (
        <div className="grid grid-cols-3 gap-4 w-full">
          {D.TOPICS.map(t => {
            const got = D.ITEMS.filter(i => i.t === t.id && progress.cards[i.id]).length;
            return (
              <button key={t.id} onClick={() => { Sound.tap(); onPick(t); }} className="btn3d rounded-3xl border-4 py-2 flex items-center justify-center gap-3 font-bold text-3xl" style={{ borderColor: t.color, background: t.light }}>
                <Balloon color={t.balloon} size={50} className="sway" />
                <span className="flex flex-col items-start"><R>{t.head}</R><span className="text-base text-stone-600">{t.cname}の ふうせん・🎈 {got} / 12</span></span>
              </button>
            );
          })}
        </div>
      );
    }
    function ItemGrid({ tp, progress, onPick }) {
      return (
        <div className="grid grid-cols-6 gap-3 w-full">
          {D.ITEMS.filter(i => i.t === tp.id).map(it => (
            <button key={it.id} onClick={() => { Sound.tap(); onPick(it); }} className="btn3d relative rounded-2xl border-4 bg-white py-1.5 flex flex-col items-center font-bold text-lg leading-tight" style={{ borderColor: tp.color }}>
              {progress.cards[it.id] && <span className="absolute right-0.5 top-0 text-xl">🎈</span>}
              <ItemArt it={it} size={84} />
              <span className="px-1 keep">{it.n}</span>
            </button>
          ))}
        </div>
      );
    }

    function Practice({ st, n, intro, name, progress, pc, onRecord, onDream, onSave, onFinish, onQuit }) {
      const talk = useTalk();
      const set = useContext(SetCtx);
      const [phase, setPhase] = useState('topic');
      const [tp, setTp] = useState(null);
      const [it, setIt] = useState(null);
      const [idx, setIdx] = useState(0);
      const [show, setShow] = useState(null);
      const [seikai, setSeikai] = useState(false);
      const got = useRef({ stars: 0, items: [], miss: 0 });
      const t0 = useRef(0);
      useEffect(() => { talk.say((intro || `${st.no} 「${st.name}」。`) + ' どの ふうせんに する？ おだいを えらんでね。'); }, []);
      const pickTopic = (t) => { setTp(t); setPhase('items'); talk.say(`${t.head}。${t.say} ひとつ えらんでね。`); };
      const pickItem = (x) => { setIt(x); t0.current = Date.now(); setPhase('q'); };
      const done = (r) => {
        const s1 = r.s1 || sent1(it), s2 = r.s2;
        onRecord({ stage: st.id, topic: tp.head, item: it.n, answer: r.answer, result: !r.miss && !r.hint ? '○' : '△', miss: r.miss, hint: r.hint,
          types: r.types, picks: r.picks, written: r.written || '', kinds: r.kinds || '', secs: Math.round((Date.now() - t0.current) / 100) / 10 });
        got.current.miss += r.miss;
        const next = () => {
          onDream(it, s1, s2, st.id);
          got.current.stars += 1; got.current.items.push(it.id);
          const k = idx + 1; setShow(null); setSeikai(false);
          if (k >= n) { onFinish({ ...got.current }); return; }
          onSave({ st: st.id, left: n - k });
          setIdx(k); setIt(null); setPhase('topic');
          talk.say(`${k + 1}つめ！ つぎは どの ふうせんに する？`);
        };
        if (set.happyo) setShow({ s1, s2, next, fly: false });
        else { Sound.seikai(); setSeikai(true); setTimeout(() => { setSeikai(false); setShow({ s1, s2, next, fly: true }); }, 1300); }

            {phase === 'q' && it && <div className="flex items-center gap-1 ml-2"><ItemArt it={it} size={44} /><span className="text-2xl font-bold">{it.n}</span></div>}
            <div className="flex-1" />

            <button onClick={onQuit} className="btn3d bg-white border-2 border-stone-400 rounded-2xl px-3 py-1 text-lg font-bold">やすむ</button>
          </div>
          <MsgWin size={phase === 'q' ? 60 : 92} compact={phase === 'q'} />
          {phase === 'topic' && <TopicGrid progress={progress} onPick={pickTopic} />}
          {phase === 'items' && tp && <>
            <div className="self-start flex items-center gap-2 text-2xl font-bold bg-white rounded-2xl border-4 px-4 py-0.5" style={{ color: tp.color, borderColor: tp.color }}><Balloon color={tp.balloon} size={26} /><R>{tp.head}</R></div>

          {phase === 'q' && it && (
            <div className="flex flex-col items-center gap-2">
