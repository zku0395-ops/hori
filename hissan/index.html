    function TextChoices({ opts, gone = [], onPick, glowV, disabled }) {
      return (
        <div className="choices" style={{ gridTemplateColumns: `repeat(${opts.length}, 1fr)` }}>
          {opts.map(o => (
            <Btn key={String(o.v)} color="white" size="lg" className={`choice ${gone.includes(o.v) ? 'gone' : ''} ${glowV === o.v ? 'glow' : ''}`}
                 disabled={disabled || gone.includes(o.v)} onClick={() => onPick(o)} data-v={String(o.v)}>
              <R t={o.label} />
            </Btn>
          ))}
        </div>
      );
    }
    function SetDots({ idx }) {
      return (
        <div className="dots">
          {range0(PER_SET).map(i => (
            <div key={i} className={`dot ${i < idx ? 'done' : i === idx ? 'now' : ''}`}>
              {i < idx ? <AcornIcon size={22} /> : <span>{i + 1}</span>}
            </div>
          ))}
        </div>
      );
    }
    const RULE_TEXT = `${W.ichi}は　10 − ${W.hiku} ＋ ${W.hikareru}　で けいさん！\n${W.juu}は　1 へらして から ひこう！`;
    function RuleBar() {
      const c = CURRENT.settings.color !== false;
      return (
        <div className="rule">
          <span>1のくらいは　<b style={{ color: c ? '#059669' : undefined }}>10</b> − <b style={{ color: c ? '#2563eb' : undefined }}><R t={W.hiku} /></b> ＋ <b style={{ color: c ? '#dc2626' : undefined }}><R t={W.hikareru} /></b>　で けいさん！</span>
          <br /><R t={`${W.juu}は　1 へらして から ひこう！`} />
        </div>
      );
    }

    /* =========================================================
       問題の 画面（どの 問題も この わくで 動く）
       ========================================================= */
    function PlayLayout({ host, work, panel, top, picture }) {
      const h = host;
      const nHints = h.phase.hints ? h.phase.hints.length : 0;
      return (
        <div className="play">
          <div className="work" ref={h.workRef}>
            <div className="qhead">
              <span>{h.stage.label}</span>
              <R t={h.stage.name} />
              <span className="grow" />
              <SetDots idx={h.idx} />
            </div>
            {top}
            <svg className="ws" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
              {work}
              {picture && <g transform="translate(0 398)" key={JSON.stringify(picture)} className="fadein"><rect x="6" y="0" width="788" height="198" rx="18" fill="#fffbeb" stroke="#f3d9a6" strokeWidth="3" /><BankPicT pic={picture} /></g>}
            </svg>
            {h.status === 'ok' && <div className="okburst"><div className="t">せいかい！</div></div>}
          </div>
          <div className="panel">
            <div className="row" style={{ alignItems: 'flex-start', gap: '.8rem' }}>
              <div style={{ cursor: 'pointer' }} onClick={h.onReplay}><Kurumi size={88} mood={h.mood} talking={h.talking} /></div>
              <div className="bubble grow" style={{ minHeight: '5rem' }}>
                <R t={h.phase.prompt} />
                {h.fb && (
                  <div key={h.fb.key} className={h.fb.kind === 'ng' ? 'shake' : 'fadein'} style={{
                    marginTop: '.4rem', paddingTop: '.4rem', borderTop: '3px dashed #e2e8f0', fontSize: '1.25rem',
                    color: h.fb.kind === 'ng' ? '#c2410c' : h.fb.kind === 'ok' ? '#15803d' : h.fb.kind === 'hint' ? '#a16207' : '#0369a1',
                  }}>
                    {h.fb.kind === 'hint' ? '💡 ' : h.fb.kind === 'ok' ? '🎉 ' : ''}<R t={h.fb.text} />
                  </div>
                )}
              </div>
            </div>
            {h.status === 'ok' ? (
              <div className="col">
                <div className="card pop row center" style={{ borderColor: '#fcd34d', background: '#fffbeb', gap: '.8rem' }}>
                  <AcornIcon size={50} />
                  <div className="bold" style={{ fontSize: '1.8rem', color: '#7c4a1e' }}>＋1 どんぐり</div>
                </div>
                <Btn color={h.setEnd ? 'orange' : 'green'} size="xl" className="pop" onClick={h.onNext} data-next="1">
                  {h.setEnd ? <R t="1かい クリア！ ▶" /> : <R t="つぎの もんだいへ ▶" />}
                </Btn>
              </div>
            ) : (
              <>
                {panel}
                <div className="row wrapflex" style={{ marginTop: 'auto' }}>
                  <Btn color="amber" size="md" className={h.hintGlow ? 'glow' : ''} disabled={!nHints || h.hint >= nHints} onClick={h.onHint} data-hint="1">
                    💡 ヒント <span style={{ letterSpacing: '.1em' }}>{range0(Math.max(nHints, 1)).map(i => i < h.hint ? '●' : '○').join('')}</span>
                  </Btn>
                  <Btn color="white" size="md" onClick={h.onReplay}>🔊 もういちど</Btn>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }
    // ヒントの 絵（数える アニメーション つき）
    function BankPicT({ pic }) {
      const t = useTicker(2600, { run: !!pic.count, key: JSON.stringify(pic) });
      return <BankPic pic={pic} t={pic.count ? t : 1} />;
    }

    function ProblemHost({ app, stage, p, idx, no, onSolved, onNext }) {
      const s = app.state.settings;
      if (location.protocol === 'file:') window.__lastP = p; // 動作確認用
      const [phase, setPhaseState] = useState({ prompt: '', hints: [] });
      const [hint, setHint] = useState(0);
      const [fb, setFb] = useState(null);
      const [mood, setMood] = useState('normal');
      const [talking, setTalking] = useState(false);
      const [status, setStatus] = useState('play');
      const [res, setRes] = useState(null);
      const [hintGlow, setHintGlow] = useState(false);
      const [hintPress, setHintPress] = useState(0);   // 子どもが ヒントを おした 回数（いまの ところ）
      const workRef = useRef(null);
      const R_ = useRef({ answers: [], errors: [], mistakes: 0, maxHint: 0, start: Date.now(), done: false, phaseMiss: 0, hints: [], alive: true, memo: false });
      const speak = async (markup, force = false) => {
        if (!markup) return;
        setTalking(true);
        await TTS.speak(markup, { force });
        if (R_.current.alive) setTalking(false);
      };
      const saveRecord = (done) => {
        const r = R_.current;
        const entry = {
          at: Date.now(), stageId: stage.id, no, kind: stage.kind, label: probLabel(stage, p), correct: probCorrect(stage, p),
          answers: r.answers.slice(0, 40), result: done ? (r.mistakes ? `正解（まちがい${r.mistakes}回）` : '1回で正解') : 'とちゅうでやめた',
          mistakes: r.mistakes, hints: r.maxHint, sec: Math.round((Date.now() - r.start) / 1000), errors: r.errors.slice(0, 40),
          errB0: r.errB0 || [], b0: stage.kind === 'ten' ? p.n : (p.b != null ? p.b % 10 : null), memo: r.memo, color: s.color !== false, done,
        };
        DB.add('history', entry).then(() => Sync.run(app)).catch(e => console.warn(e));
      };
      useEffect(() => () => {
        R_.current.alive = false;
        TTS.cancel();
        if (!R_.current.done && R_.current.answers.length) saveRecord(false);
      }, []);
      const api = useMemo(() => ({
        phase: ({ prompt, hints = [], silent }) => {
          R_.current.phaseMiss = 0; R_.current.hints = hints;
          setPhaseState({ prompt, hints }); setHint(0); setHintPress(0); setFb(null); setMood('normal'); setHintGlow(false);
          if (!silent) speak(prompt);
        },
        memo: () => { R_.current.memo = true; },
        note: (txt) => { R_.current.answers.push(txt); },
        tip: (text) => { setFb({ text, kind: 'info', key: Date.now() }); speak(text); },
        // まちがえた とき（minHint：まちがい方に 合わせて 出す ヒントの 段階）
        ng: (txt, err, msg, minHint = 0, b0) => {
          const r = R_.current;
          if (r.done) return;
          r.answers.push(txt); r.mistakes++; r.phaseMiss++; if (err) r.errors.push(err);
          if (err === 'tenminus' && b0 != null) { r.errB0 = r.errB0 || []; r.errB0.push(b0); }
          sfx('ng');
          setMood('think');
          const text = msg || 'もう いちど やって みよう。';
          setFb({ text, kind: 'ng', key: Date.now() });
          let lv = minHint;
          if (r.phaseMiss >= 2) setHintGlow(true);
          if (r.phaseMiss >= 3 && r.hints.length) lv = r.hints.length;
          lv = Math.min(lv, r.hints.length);
          if (lv) { r.maxHint = Math.max(r.maxHint, lv); setHint(h => Math.max(h, lv)); }
          speak(text);
        },
        ok: (txt, extra) => {
          const r = R_.current;
          if (r.done) return;
          r.done = true; r.answers.push(txt);
          saveRecord(true);
          const out = onSolved();
          setRes(out);
          fanfare('ok');
          const el = workRef.current;
          if (el) { const b = el.getBoundingClientRect(); flyAcorns({ x: b.left + b.width / 2, y: b.top + b.height / 2 }, 1); }
          setStatus('ok'); setMood('happy');
          const text = 'せいかい！' + (extra ? '\n' + extra : '');
          setFb({ text, kind: 'ok', key: Date.now() });
          setTimeout(() => { if (r.alive) speak(text); }, 1150);
          if (out && out.bagUp) setTimeout(() => { if (r.alive) showBagUp(out.bagUp); }, 1300);
        },
      }), []);
      const host = {
        stage, idx, phase, fb, hint, hintPress, mood, talking, status, hintGlow, workRef, setEnd: !!(res && res.setEnd),
        onHint: () => {
          const r = R_.current;
          const lv = Math.min(r.hints.length, hint + 1);
          r.maxHint = Math.max(r.maxHint, lv);
          setHint(lv); setHintGlow(false); setHintPress(n => n + 1);
          setFb({ text: r.hints[lv - 1], kind: 'hint', key: Date.now() });
          speak(r.hints[lv - 1]);
        },
        onReplay: () => speak(fb ? `${phase.prompt}\n${fb.text}` : phase.prompt, true),
        onNext: () => { TTS.cancel(); onNext(res || {}); },
      };
      const Comp = KIND[stage.kind];
      return <Comp p={p} s={s} stage={stage} hint={hint} api={api} done={status === 'ok'} host={host} />;
    }

    // 10こ たまると ふくろに 入れる（どんぐりの かずが 10の まとまりを こえた とき）
    let BAGUP_SET = null;
    function showBagUp(n) { if (BAGUP_SET) BAGUP_SET({ n, key: Date.now() }); }
    function BagUpLayer() {
      const [b, setB] = useState(null);
      useEffect(() => { BAGUP_SET = setB; return () => { BAGUP_SET = null; }; }, []);
      useEffect(() => {
        if (!b) return;
        fanfare('bag');
        TTS.speak(`どんぐりが 10こ たまったね。ふくろに いれるよ。ふくろが ${b.n}こに なったよ。`);
        const tm = setTimeout(() => setB(null), 3400);
        return () => clearTimeout(tm);
      }, [b && b.key]);
      if (!b) return null;
      return <BagUpShow key={b.key} n={b.n} />;
    }
    function BagUpShow({ n }) {
      const t = useTicker(1800, { key: n });
      return (
        <div className="bagup">
          <div>
            <svg viewBox="0 0 520 220" width="460" height="195" aria-hidden="true">
              {range0(10).map(i => {
                const sx = 40 + (i % 5) * 48, sy = 70 + Math.floor(i / 5) * 56;
                const k = clamp(t * 1.6 - i * 0.05, 0, 1);
                const x = sx + (400 - sx) * k, y = sy + (120 - sy) * k;
                return <g key={i} opacity={1 - k * 0.9}><AcornShape x={x} y={y} r={20} /></g>;
              })}
              <Bag x={410} y={120} s={1.6 + (t > 0.7 ? 0.1 * Math.sin(t * 30) : 0)} />
            </svg>
            <div className="bold" style={{ fontSize: '1.9rem', color: '#7c4a1e' }}>10こで ふくろ 1つ！</div>
            <div className="bold row center" style={{ fontSize: '1.4rem', color: '#475569', gap: '.4rem' }}><BagIcon size={30} /> × {n}</div>
          </div>
        </div>
      );
    }

    /* =========================================================
       問題の 部品
       ========================================================= */
    // ---- じゅんび① 10 − □ ----
    function TenTask({ p, s, hint, api, done, host }) {
      const ans = 10 - p.n;
      const [v, setV] = useState(null);
      const [gone, setGone] = useState([]);
      useEffect(() => {
        api.phase({ prompt: `10この どんぐりから ${p.n}こ とると、のこりは なんこ？\n10 − ${p.n} ＝ □`, hints: [`10は ${p.n}と いくつ？ のこりの どんぐりを かぞえよう。`, `のこりの どんぐりに ばんごうを つけて かぞえるよ。`, `こたえは ${ans}。${ans}の ボタンを おそう。`] });
      }, []);
      const onKey = (d) => {
        if (done) return;
        if (d === ans) { sfx('pick'); setV(d); api.ok(`${d}`, `10 − ${p.n} ＝ ${ans}`); return; }
        setGone(g => [...g, d]);
        api.ng(`${d}`, 'tenminus', d === p.n ? `${p.n}は とった かずだね。のこりは いくつかな？` : `のこりの どんぐりを かぞえて みよう。`, 1, p.n);
      };
      const showPic = s.bag || hint >= 1;
      const work = (
        <g>
          <SvgText x={210} y={130} size={96}><tspan fill={col('ten')}>10</tspan></SvgText>
          <SvgText x={320} y={130} size={90}>−</SvgText>
          <SvgText x={410} y={130} size={96}><tspan fill={col('hiku')}>{p.n}</tspan></SvgText>
          <SvgText x={500} y={130} size={90}>＝</SvgText>
          <CellBox x={610} y={130} w={110} h={124} size={96} v={v} active={!done} />
          {!showPic && <SvgText x={400} y={300} size={26} color="#94a3b8">こまったら 💡ヒント</SvgText>}
        </g>
      );
      const picture = showPic ? { type: 'take10', b0: p.n, count: hint >= 2 } : null;
      return <PlayLayout host={host} work={work} picture={picture} panel={<Keypad onKey={onKey} gone={gone} glowKey={hint >= 3 ? ans : null} disabled={done} />} />;
    }
    // ---- じゅんび② □ ＋ □ ----
    function AddTask({ p, s, hint, api, done, host }) {
      const ans = p.x + p.y;
      const [v, setV] = useState(null);
      const [gone, setGone] = useState([]);
      useEffect(() => {
        api.phase({ prompt: `のこりの どんぐり ${p.x}こと、ばらの どんぐり ${p.y}こを あわせると？\n${p.x} ＋ ${p.y} ＝ □`, hints: [`${p.x}から ${p.y}こ ふやすと いくつ？`, 'どんぐりに ばんごうを つけて かぞえるよ。', `こたえは ${ans}。${ans}の ボタンを おそう。`] });
      }, []);
      const onKey = (d) => {
        if (done) return;
        if (d === ans) { sfx('pick'); setV(d); api.ok(`${d}`, `${p.x} ＋ ${p.y} ＝ ${ans}`); return; }
        setGone(g => [...g, d]);
        api.ng(`${d}`, 'add', 'どんぐりを いっしょに かぞえよう。', 2);
      };
      const showPic = s.bag || hint >= 1;
      const work = (
        <g>
          <SvgText x={220} y={130} size={96}>{p.x}</SvgText>
          <SvgText x={320} y={130} size={90}>＋</SvgText>
          <SvgText x={410} y={130} size={96}><tspan fill={col('hikareru')}>{p.y}</tspan></SvgText>
          <SvgText x={500} y={130} size={90}>＝</SvgText>
          <CellBox x={610} y={130} w={110} h={124} size={96} v={v} active={!done} />
        </g>
      );
      return <PlayLayout host={host} work={work} picture={showPic ? { type: 'add', x: p.x, y: p.y, count: hint >= 2 } : null} panel={<Keypad onKey={onKey} gone={gone} glowKey={hint >= 3 ? ans : null} disabled={done} />} />;
    }
    // ---- じゅんび③ ひける？ ひけない？（ひけないときは しるしを つける）----
    function JudgeTask({ p, s, hint, api, done, host }) {
      const { A1, A0, B0 } = digits(p);
      const [step, setStep] = useState('judge');
      const [gone, setGone] = useState([]);
      const [marked, setMarked] = useState(false);
      useEffect(() => {
        api.phase({ prompt: `${W.ichi}は ${A0}から ${B0}。\n${A0}から ${B0}は ひける？`, hints: [`${W.ichi}の うえの ${A0}と、したの ${B0}を くらべよう。`, `ばらの どんぐり ${A0}こから ${B0}こ とれるかな？`, `こたえは「${p.borrow ? 'ひけない' : 'ひける'}」だよ。`] });
      }, []);
      const pickJudge = (o) => {
        if (done) return;
        const right = p.borrow ? 'no' : 'yes';
        if (o.v === right) {
          sfx('pick');
          if (!p.borrow) { api.ok('ひける', `${A0}から ${B0}は そのまま ひけるね。しるしは いらないよ。`); return; }
          api.note('ひけない');
          setStep('mark');
          api.phase({ prompt: `そうだね、ひけないね。\n${W.juu}の ${A1}に タッチして、ふくろを 1つ かりよう。`, hints: [`10を かりるのは となりの ${W.juu}だよ。`, `${W.juu}の ${A1}が ひかって いるよ。`, `ひかって いる ${A1}に タッチしよう。`] });
          return;
        }
        setGone(g => [...g, o.v]);
        api.ng(o.v === 'yes' ? 'ひける' : 'ひけない', o.v === 'yes' ? 'reverse' : 'judge', o.v === 'yes' ? `${A0}から ${B0}は とれないよ。${B0}の ほうが おおきいね。` : `${A0}から ${B0}は とれるよ。${A0}の ほうが おおきいね。`, 2);
      };
      const onTap = (id) => {
        if (done || step !== 'mark') return;
        if (id === 'mt') { sfx('mark'); setMarked(true); api.ok('しるし', `${A1}に ななめの せんを ひいて ${A1 - 1}。${W.ichi}の うえに 10。`); return; }
        api.ng(`しるし:${id}`, 'other', `10を かりるのは となりの ${W.juu}の ${A1}だよ。`, 2);
      };
      const glow = step === 'judge' ? (hint >= 2 ? ['mo', 'so'] : []) : (hint >= 2 ? ['mt'] : []);
      const view = { marked, decMode: 'auto', form: null, glow, onTap: step === 'mark' && !done ? onTap : null };
      const picture = s.bag && step === 'judge' && hint >= 2 && p.borrow ? { type: 'open', a1: A1, a0: A0, b0: B0 } : (s.bag && step === 'mark' && hint >= 2 ? { type: 'open', a1: A1, a0: A0, b0: B0 } : null);
      const panel = step === 'judge'
        ? <TextChoices opts={[{ v: 'yes', label: '⭕ ひける' }, { v: 'no', label: '❌ ひけない' }]} gone={gone} onPick={pickJudge} glowV={hint >= 3 ? (p.borrow ? 'no' : 'yes') : null} disabled={done} />
        : <div className="card tc bold" style={{ fontSize: '1.4rem', borderColor: '#fcd34d', background: '#fffbeb' }}>👆 <R t={`${W.juu}の ${A1}に タッチ`} /></div>;
      return <PlayLayout host={host} work={<g transform="translate(120 0)"><HissanView p={p} v={view} /></g>} picture={picture} panel={panel} />;
    }

    // ---- ひっ算（ステップ1〜6・はってん）----
    function formOf(stage, memoOpen) {
      if (stage.form === 'two' || stage.form === 'one') return stage.form;
      return memoOpen ? 'one' : null;
    }
    function cellSeq(stage, memoOpen) {
      const seq = [];
      if (stage.story) seq.push('e_a1', 'e_a0', 'e_b1', 'e_b0');
      seq.push('mark');
      const form = formOf(stage, memoOpen);
      if (form === 'two') ['f_b0', 'f_r1', 'f_r1c', 'f_a0', 'f_sum'].forEach(id => { if (!(stage.given || []).includes(id)) seq.push(id); });
      if (form === 'one') seq.push('f_b0', 'f_a0', 'f_sum');
      seq.push('h_ones');
      if (stage.decInput) seq.push('h_dec');
      seq.push('h_tens');
      return seq;
    }
    function expectOf(id, p) {
      const { A1, A0, B1, B0 } = digits(p);
      return { e_a1: A1, e_a0: A0, e_b1: B1, e_b0: B0, f_b0: B0, f_r1: 10 - B0, f_r1c: 10 - B0, f_a0: A0, f_sum: 10 - B0 + A0, h_ones: 10 - B0 + A0, h_dec: A1 - 1, h_tens: A1 - 1 - B1 }[id];
    }
    const CELL_NAME = { e_a1: 'しき（はじめの数）', e_a0: 'しき（はじめの数）', e_b1: 'しき（ひく数）', e_b0: 'しき（ひく数）', f_b0: '10−□', f_r1: '10−ひく数', f_r1c: '□＋', f_a0: 'たす数', f_sum: 'たし算', h_ones: '1の位', h_dec: 'へらした数', h_tens: '十の位', mark: 'しるし' };
    function HissanTask({ p, s, stage, hint, api, done, host }) {
      const { A1, A0, B1, B0 } = digits(p);
      const dec = A1 - 1, r1 = 10 - B0, sum = r1 + A0, ans = p.a - p.b;
      const [memoOpen, setMemoOpen] = useState(false);
      const [marked, setMarked] = useState(false);
      const [vals, setVals] = useState({});
      const [gone, setGone] = useState({});
      const seq = cellSeq(stage, memoOpen);
      const cur = done ? null : seq.find(id => id === 'mark' ? !marked : vals[id] == null);
      const copyForm = !!formOf(stage, memoOpen);   // 1のくらいの こたえを 式から うつす
      if (location.protocol === 'file:') window.__cur = { cur, exp: cur && cur !== 'mark' ? expectOf(cur, p) : null }; // 動作確認用
      const early = ['s1', 's2', 's3'].includes(stage.id);
      const exprDone = !stage.story || ['e_a1', 'e_a0', 'e_b1', 'e_b0'].every(id => vals[id] != null);
      const unit = p.unit || 'こ';

      const promptOf = (id) => {
        switch (id) {
          case 'e_a1': return { prompt: `おはなしを よんで、しきを つくろう。\nはじめに あった かずは？`, hints: ['おはなしの はじめに でて くる かずだよ。', `はじめに あった かずは ${p.a}。`, `${A1}の ボタンを おそう。`] };
          case 'e_a0': return { prompt: `おはなしを よんで、しきを つくろう。\nはじめに あった かずは？`, silent: true, hints: ['おはなしの はじめに でて くる かずだよ。', `はじめに あった かずは ${p.a}。`, `${A0}の ボタンを おそう。`] };
          case 'e_b1': return { prompt: `ひく かずは？\nへった かずを いれよう。`, hints: ['あげた・たべた・つかった かずを ひくよ。', `ひく かずは ${p.b}。`, `${B1}の ボタンを おそう。`] };
          case 'e_b0': return { prompt: `ひく かずは？\nへった かずを いれよう。`, silent: true, hints: ['あげた・たべた・つかった かずを ひくよ。', `ひく かずは ${p.b}。`, `${B0}の ボタンを おそう。`] };
          case 'mark': return {
            prompt: early || stage.story ? `${W.ichi}は ${A0}から ${B0}。ひけないね。\n${W.juu}の ${A1}に タッチして、10を かりよう。` : 'まず、くりさがりの しるしを つけよう。',
            hints: [`${W.ichi}は ${A0}から ${B0}は ひけないね。${W.juu}から 10を かりよう。`, `ふくろを 1つ あけると 10こ。${W.juu}の ${A1}は 1 へるよ。`, `ひかって いる ${A1}に タッチしよう。`],
          };
          case 'f_b0': return { prompt: `10から ひく ${W.kazu}は？\n${W.hiku}の ${W.ichi}だよ。`, hints: [`${W.hiku}は したの ${W.kazu}。その ${W.ichi}を みよう。`, `ひかって いる ${W.kazu}だよ。`, `${B0}の ボタンを おそう。`] };
          case 'f_r1': return { prompt: `10 − ${B0} は？`, hints: [`10この どんぐりから ${B0}こ とると？`, '10この どんぐりの えを みよう。', `のこりを いっしょに かぞえよう。こたえは ${r1}。`] };
          case 'f_r1c': return { prompt: `うえの こたえ ${r1}を、したの しきに うつそう。`, hints: ['うえの しきの こたえを うつすよ。', `ひかって いる ${r1}だよ。`, `${r1}の ボタンを おそう。`] };
          case 'f_a0': return { prompt: `たす ${W.kazu}は？\n${W.hikareru}の ${W.ichi}だよ。`, hints: [`${W.hikareru}は うえの ${W.kazu}。その ${W.ichi}を みよう。`, `ひかって いる ${W.kazu}だよ。`, `${A0}の ボタンを おそう。`] };
          case 'f_sum': return formOf(stage, memoOpen) === 'one'
            ? { prompt: `10 − ${B0} ＋ ${A0} は？`, hints: [`まず 10 − ${B0} で ${r1}。それに ${A0}を たそう。`, 'どんぐりの えを みよう。', `いっしょに かぞえよう。こたえは ${sum}。`] }
            : { prompt: `${r1} ＋ ${A0} は？`, hints: [`${r1}に ${A0}を たそう。`, 'どんぐりの えを みよう。', `いっしょに かぞえよう。こたえは ${sum}。`] };
          case 'h_ones': return copyForm
            ? { prompt: `${W.ichi}の こたえ ${sum}を、ひっさんに かこう。`, hints: ['しきの こたえを ひっさんに うつすよ。', `ひかって いる ${sum}だよ。`, `${sum}の ボタンを おそう。`] }
            : { prompt: `${W.ichi}の こたえは？` + (stage.form === 'memo' ? '\nこまったら 📝メモを おそう。' : ''), hints: [stage.form === 'none' ? `10 − ${W.hiku} ＋ ${W.hikareru}。しきを だすよ。` : `10 − ${W.hiku} ＋ ${W.hikareru} だよ。10 − ${B0} ＋ ${A0}。`, 'どんぐりの えを みよう。', `いっしょに かぞえよう。こたえは ${sum}。`] };
          case 'h_dec': return { prompt: `${W.juu}の ${A1}は、1 へらすと いくつ？`, hints: [`10を かしたから、${A1}は 1 へるよ。`, 'ふくろの えを みよう。', `${A1} − 1 ＝ ${dec}。${dec}の ボタンを おそう。`] };
          case 'h_tens':
            if (B1 === 0) return { prompt: `${W.juu}は、ひく ${W.kazu}が ないね。\n1 へらした ${dec}を そのまま かこう。`, hints: [`${W.juu}は ${dec}の まま だよ。`, 'ふくろの えを みよう。', `${dec}の ボタンを おそう。`] };
            return { prompt: `${W.juu}は、1 へらした ${dec}から ${B1}を ひこう。\n${dec} − ${B1} は？`, hints: [`${W.juu}は 1 へらして から ひくよ。${dec} − ${B1}。`, 'ふくろの えを みよう。', `いっしょに かぞえよう。こたえは ${dec - B1}。`] };
          default: return { prompt: '', hints: [] };
        }
      };
      useEffect(() => { if (cur) api.phase(promptOf(cur)); }, [cur]);
      // ステップ6：1のくらいで ヒントを おすと しきが でる
      useEffect(() => {
        if (cur === 'h_ones' && stage.form === 'none' && host.hintPress >= 1 && !memoOpen) { setMemoOpen(true); api.memo(); }
      }, [host.hintPress, cur]);

      const wrong = (id, d) => {
        switch (id) {
          case 'e_a1': case 'e_a0': return (id === 'e_a1' ? d === B1 : d === B0) ? ['order', `ひく かずが さきに なって いるよ。はじめに あった ${p.a}から ひくよ。`] : ['other', 'おはなしの かずを よく みよう。'];
          case 'e_b1': case 'e_b0': return (id === 'e_b1' ? d === A1 : d === A0) ? ['order', `${p.a}は はじめに あった かずだね。ひくのは ${p.b}だよ。`] : ['other', 'おはなしの かずを よく みよう。'];
          case 'f_b0': return ['copy', d === A0 ? `${A0}は ${W.hikareru}だね。10から ひくのは、${W.hiku}（したの ${W.kazu}）の ${B0}だよ。` : `${W.hiku}の ${W.ichi}を みよう。`, 2];
          case 'f_r1': return ['tenminus', `10 − ${B0} を もう いちど かんがえよう。10この どんぐりから ${B0}こ とると？`, 2];
          case 'f_r1c': return ['other', `うえの しきの こたえ ${r1}を うつそう。`, 2];
          case 'f_a0': return ['copy', d === B0 ? `${B0}は ${W.hiku}だね。たすのは、${W.hikareru}（うえの ${W.kazu}）の ${A0}だよ。` : `${W.hikareru}の ${W.ichi}を みよう。`, 2];
          case 'f_sum':
            if (d === B0 - A0) return ['reverse', `${B0} − ${A0} を して しまったかな？ 10 − ${B0} の ${r1}に、${A0}を たそう。`, 2];
            if (d === r1) return ['add', `${r1}に ${A0}を たすのを わすれて いないかな？`, 2];
            return ['add', 'どんぐりを いっしょに かぞえよう。', 2];
          case 'h_ones':
            if (d === B0 - A0) return ['reverse', `${A0}から ${B0}は ひけないね。${B0} − ${A0} を して しまったかな？\nふくろを 1つ あけて、10 − ${B0} ＋ ${A0} で けいさん しよう。`, 2];
            if (copyForm) return ['other', `しきの こたえ ${sum}を うつそう。`, 2];
            if (d === r1) return ['add', `10 − ${B0} で ${r1}。それに ${A0}を たそう。`, 2];
            if (d === 10 - A0 || d === 10 - A0 + B0) return ['copy', `10から ひくのは ${W.hiku}の ${B0}だよ。`, 2];
            return ['other', `10 − ${B0} ＋ ${A0} で けいさん しよう。`, 2];
          case 'h_dec':
            if (d === A1) return ['nodec', `10を かしたから、${A1}は 1 へるよ。${A1} − 1 は？`, 2];
            return ['other', `${A1}から 1 へらすと？`, 2];
          case 'h_tens':
            if (d === A1 - B1) return ['nodec', `${W.juu}は 1 へらしたかな？ ${A1}は ${dec}に なって いるよ。`, 2];
            return ['other', B1 ? `${dec} − ${B1} を もう いちど かんがえよう。` : `${dec}を そのまま かこう。`, 2];
          default: return ['other', '', 0];
        }
      };
      const onKey = (d) => {
        if (done || !cur) return;
        if (cur === 'mark') { api.tip(`まず ${W.juu}の ${A1}に タッチして しるしを つけよう。`); return; }
        const exp = expectOf(cur, p);
        if (d === exp) {
          sfx('pick');
          const nv = { ...vals, [cur]: d };
          setVals(nv);
          const rest = seq.filter(id => id === 'mark' ? !marked : nv[id] == null);
          if (!rest.length) {
            const zero = cur === 'h_tens' && exp === 0;
            const tail = p.story ? `\nのこりは ${ans}${unit}。` : '';
            api.ok(`${p.a}−${p.b}=${ans}`, (zero ? `${W.juu}の 0は かかないよ。\n` : '') + `${p.a} − ${p.b} ＝ ${ans}` + tail);
          }
          return;
        }
        setGone(g => ({ ...g, [cur]: [...(g[cur] || []), d] }));
        const [err, msg, lv] = wrong(cur, d);
        api.ng(`${CELL_NAME[cur]}:${d}`, err, msg, lv, B0);
      };
      const onTap = (id) => {
        if (done || cur !== 'mark') return;
        if (id === 'mt') { sfx('mark'); setMarked(true); return; }
        api.ng(`しるし:${id}`, 'other', `10を かりるのは となりの ${W.juu}の ${A1}だよ。`, 2);
      };
      const openMemo = () => { if (!memoOpen && vals.h_ones == null && !done) { sfx('open'); setMemoOpen(true); api.memo(); } };

      // ひかる ところと ヒントの 絵
      const glow = [];
      let picture = null;
      const bag = s.bag;
      if (cur && hint >= 2) {
        if (cur === 'mark') { glow.push('mt'); if (bag) picture = { type: 'open', a1: A1, a0: A0, b0: B0 }; else glow.push('mo', 'so'); }
        if (cur === 'f_b0') glow.push('so');
        if (cur === 'f_a0') glow.push('mo');
        if (cur === 'f_r1') { if (bag) picture = { type: 'take10', b0: B0, count: hint >= 3 }; else glow.push('so'); }
        if (cur === 'f_r1c') glow.push('f_r1');
        if (cur === 'f_sum') { if (bag) picture = formOf(stage, memoOpen) === 'one' ? { type: 'ones', b0: B0, a0: A0, count: hint >= 3 } : { type: 'add', x: r1, y: A0, count: hint >= 3 }; else glow.push('f_r1c', 'f_a0'); }
        if (cur === 'h_ones') { if (copyForm) glow.push('f_sum'); else if (bag) picture = { type: 'ones', b0: B0, a0: A0, count: hint >= 3 }; else glow.push('mo', 'so'); }
        if (cur === 'h_dec') { if (bag) picture = { type: 'dec', a1: A1, show: hint >= 3 }; else glow.push('mt'); }
        if (cur === 'h_tens') { if (bag) picture = B1 ? { type: 'tens', dec, b1: B1, count: hint >= 3 } : { type: 'dec', a1: A1, show: true }; else glow.push('st'); }
      }
      const keyGlow = cur && cur !== 'mark' && hint >= 3 ? expectOf(cur, p) : null;
      const guides = stage.trace ? { f_b0: B0, f_r1: r1, f_r1c: r1, f_a0: A0, f_sum: sum, h_ones: sum, h_tens: dec - B1, h_dec: dec } : {};
      const given = Object.fromEntries((stage.given || []).map(id => [id, true]));
      const fm = formOf(stage, memoOpen);
      const view = {
        marked, markGuide: stage.trace, decMode: stage.decInput ? 'input' : 'auto', vals, guides, active: cur, glow,
        form: fm || (stage.form === 'memo' && vals.h_ones == null ? 'memo' : null), given, hideB1: B1 === 0,
        onTap: cur === 'mark' ? onTap : null, onMemo: stage.form === 'memo' && !memoOpen && vals.h_ones == null && !done ? openMemo : null,
      };
      const showRule = stage.rule || (cur === 'h_ones' && hint >= 1);
      const storyText = p.story ? p.story.replace('{a}', p.a).replace('{b}', p.b) : null;
      const top = (
        <>
          {storyText && <div className="story"><R t={storyText} /></div>}
          {showRule && exprDone && <RuleBar />}
        </>
      );
      const work = !exprDone ? <ExprView v={{ vals, active: cur }} /> : <HissanView p={p} v={view} />;
      const panel = cur === 'mark'
        ? <div className="card tc bold" style={{ fontSize: '1.4rem', borderColor: '#fcd34d', background: '#fffbeb', lineHeight: 1.8 }}>👆 <R t={`${W.juu}の ${A1}に タッチして\nくりさがりの しるしを つけよう`} /></div>
        : (
          <>
            <Keypad onKey={onKey} gone={(cur && gone[cur]) || []} glowKey={keyGlow} disabled={done} />
            {stage.form === 'memo' && !memoOpen && vals.h_ones == null && exprDone && !done && <Btn color="violet" size="md" onClick={openMemo} data-memo-btn="1">📝 メモ（しきを だす）</Btn>}
          </>
        );
      return <PlayLayout host={host} work={work} picture={picture} top={top} panel={panel} />;
    }
    const KIND = { ten: TenTask, add: AddTask, judge: JudgeTask, hissan: HissanTask };

    function PlayScreen({ app, stage, onSetEnd }) {
      const [setup] = useState(() => {
        const pr = prog(app.stateRef.current, stage.id);
        if (Array.isArray(pr.cur) && pr.cur.length === PER_SET) return { list: pr.cur, idx: clamp(pr.idx || 0, 0, PER_SET - 1), fresh: false };
        return { list: genSet(stage), idx: 0, fresh: true };
      });
      useEffect(() => {
        if (setup.fresh) app.update(st => ({ ...st, progress: { ...st.progress, [stage.id]: { ...prog(st, stage.id), cur: setup.list, idx: 0 } } }));
      }, []);
      const [idx, setIdx] = useState(setup.idx);
      const list = setup.list;
      const pr0 = prog(app.stateRef.current, stage.id);
      const no = (pr0.sets || 0) * PER_SET + idx + 1;
      const onSolved = () => {
        const newIdx = idx + 1;
        const setEnd = newIdx >= PER_SET;
        const gain = 1 + (setEnd ? SET_BONUS : 0);
        let out = {};
        app.update(st => {
          const pr = prog(st, stage.id);
          const before = st.acorns;
          const sets = (pr.sets || 0) + (setEnd ? 1 : 0);
          const stageClear = setEnd && sets % SETS_TO_CLEAR === 0;
          const firstClear = stageClear && !pr.cleared;
          out = { setEnd, stageClear, firstClear, setNo: ((sets - 1) % SETS_TO_CLEAR) + 1, bagUp: Math.floor((before + 1) / 10) > Math.floor(before / 10) ? Math.floor((before + 1) / 10) : 0, before: before + 1 };
          return {
            ...st, acorns: st.acorns + gain, earned: st.earned + gain,
            progress: { ...st.progress, [stage.id]: { ...pr, sets, idx: setEnd ? 0 : newIdx, cur: setEnd ? null : pr.cur, cleared: pr.cleared || stageClear, clears: Math.floor(sets / SETS_TO_CLEAR), firstClearAt: pr.firstClearAt || (firstClear ? Date.now() : undefined), lastAt: Date.now() } },
          };
        });
        return out;
      };
      const onNext = (res) => {
        if (res.setEnd) { onSetEnd(res); return; }
        setIdx(i => Math.min(PER_SET - 1, i + 1));
        window.scrollTo(0, 0);
      };
      return <ProblemHost key={`${stage.id}-${idx}`} app={app} stage={stage} p={list[idx]} idx={idx} no={no} onSolved={onSolved} onNext={onNext} />;
    }

    /* =========================================================
       ステップの アイコン
       ========================================================= */
    function StageIcon({ id, size = 72 }) {
      const txt = (t, y = 44, fs = 22, c = '#1e293b') => <text x="40" y={y} textAnchor="middle" dominantBaseline="central" fontSize={fs} fontWeight="900" fill={c}>{t}</text>;
      const bg = <rect x="4" y="4" width="72" height="72" rx="16" fill="#fff" stroke="#e7d5b8" strokeWidth="3" />;
      const body = {
        j1: <>{bg}<g transform="translate(40 44) scale(.7)"><Bag x={0} y={0} /></g></>,
        j2: <>{bg}<AcornShape x={26} y={42} r={12} />{txt('+', 42, 22)}<AcornShape x={54} y={42} r={12} /></>,
        j3: <>{bg}{txt('72', 30, 24, col('hikareru'))}<line x1="34" y1="16" x2="22" y2="42" stroke="#475569" strokeWidth="3" />{txt('−37', 58, 22, col('hiku'))}</>,
        s1: <>{bg}{txt('10−7', 30, 18, '#94a3b8')}{txt('✏️', 58, 22)}</>,
        s2: <>{bg}{txt('10−7', 30, 18)}{txt('＝□', 56, 20)}</>,
        s3: <>{bg}{txt('10−□', 30, 18)}{txt('□＋□', 56, 18)}</>,
        s4: <>{bg}{txt('10−□＋□', 40, 13)}</>,
        s5: <>{bg}{txt('📝', 42, 34)}</>,
        s6: <>{bg}{txt('72', 30, 22, col('hikareru'))}{txt('−37', 54, 20, col('hiku'))}</>,
        h1: <>{bg}{txt('42', 30, 22)}{txt('− 7', 54, 20)}</>,
        h2: <>{bg}{txt('43', 26, 20)}{txt('−36', 46, 18)}{txt('7', 66, 16, '#059669')}</>,
        h3: <>{bg}{txt('📖', 42, 34)}</>,
      }[id];
      return <svg viewBox="0 0 80 80" width={size} height={size} aria-hidden="true" style={{ flex: 'none' }}>{body}</svg>;
    }

    /* =========================================================
       ホーム（もりの どんぐりぎんこう）
       ========================================================= */
    let GREETED = false;
    function HomeScreen({ app, onPlay, onMenu, onHouse, onAlbum }) {
      const st = app.state;
      const next = findNext(st);
      const name = st.profile ? st.profile.name : '';
      const t = titleOf(st);
      const [talking, setTalking] = useState(false);
      const pos = next ? stepPos(st, next.id) : 0;
      const msg = next
        ? `どんぐり ぎんこうへ ようこそ！\nきょうは「${next.label} ${next.name}」に ちょうせん しよう。`
        : 'ぜんぶ クリア！ すごいね！\nすきな ステップで あそぼう。';
      const say = async (force = false) => { setTalking(true); await TTS.speak(`${name}さん、${msg}`, { force }); setTalking(false); };
      useEffect(() => { if (!GREETED) { GREETED = true; say(); } return () => TTS.cancel(); }, []);
      return (
        <div className="home">
          <div className="home-scene">
            <BankScene onKurumi={() => say(true)} talking={talking} bags={Math.floor(st.acorns / 10)} friends={friendsOf(st)} />
          </div>
          <div className="col home-side kids">
            <div className="bubble" style={{ fontSize: '1.3rem' }}>
              <span>{name}さん、</span><R t={msg} />
            </div>
            <div className="card row wrapflex" style={{ padding: '.6rem .9rem', borderColor: '#fde68a' }}>
              <span style={{ fontSize: '2rem' }} className="emoji">{t.icon}</span>
              <div className="grow" style={{ minWidth: '8.5em' }}><div className="muted" style={{ fontSize: '.9rem' }}>いまの しょうごう</div><div className="bold" style={{ fontSize: '1.25rem' }}>{t.name}</div></div>
              <div className="tc"><div className="muted" style={{ fontSize: '.9rem', whiteSpace: 'nowrap' }}>どんぐり</div><div className="bold" style={{ fontSize: '1.3rem', whiteSpace: 'nowrap' }}><AcornCount n={st.acorns} size={22} /></div></div>
            </div>
            {next ? (
              <Btn color="green" size="xl" onClick={() => onPlay(next)} data-start="1">▶ {pos > 0 ? 'つづきから' : 'はじめる'}</Btn>
            ) : (
              <Btn color="green" size="xl" onClick={onMenu}>▶ あそぶ</Btn>
            )}
            {next && <div className="tc muted bold" style={{ marginTop: '-.3rem' }}><R t={`${next.label}　${next.name}（${pos + 1}もんめから）`} /></div>}
            <Btn color="amber" size="lg" onClick={onMenu} data-menu="1">📋 メニュー（ステップ）</Btn>
            <div className="row">
              <Btn color="wood" size="lg" className="grow" onClick={onHouse} data-house="1">🏠 もりの おうち</Btn>
              <Btn color="violet" size="lg" className="grow" onClick={onAlbum} data-album="1">📖 アルバム</Btn>
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================
       メニュー（ステップえらび）
       ========================================================= */
    function MenuScreen({ app, onOpen }) {
      const st = app.state;
      const next = findNext(st);
      const item = (s) => {
        const open = isStageOpen(s, st);
        const cleared = isCleared(s.id, st);
        const skipped = isSkipped(s.id, st);
        const pr = prog(st, s.id);
        const pos = stepPos(st, s.id);
        return (
          <button key={s.id} className={`mitem ${next && next.id === s.id ? 'next' : ''}`} disabled={!open} onClick={() => { sfx('tap'); onOpen(s); }} data-stage={s.id}>
            <div>{open ? <StageIcon id={s.id} size={72} /> : <div style={{ width: 72, height: 72, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 40 }}>🔒</div>}</div>
            <div className="grow">
              <div style={{ fontSize: '1rem', color: '#a0612b' }}>{s.label}</div>
              <div><R t={s.name} /></div>
              <div style={{ fontSize: '.95rem', color: '#64748b', lineHeight: 1.6 }}>{open ? <R t={s.sub} /> : <R t={lockHint(s)} />}</div>
              {open && !cleared && <div className="minibar"><div style={{ width: `${pos / (PER_SET * SETS_TO_CLEAR) * 100}%` }} /></div>}
            </div>
            <div className="tc" style={{ minWidth: '4.8rem' }}>
              {cleared && <div className="tag" style={{ background: '#22c55e', color: '#fff' }}>クリア{pr.clears > 1 ? ` ×${pr.clears}` : ''}</div>}
              {skipped && !cleared && <div className="tag" style={{ background: '#e2e8f0', color: '#475569' }}>とばした</div>}
              {cleared && s.friend && <div className="emoji" style={{ fontSize: '1.8rem', marginTop: '.2rem' }}>{FRIEND_MAP[s.friend].e}</div>}
              {open && !cleared && !skipped && <div style={{ fontSize: '1rem', color: '#7c4a1e' }}>{pos}/{PER_SET * SETS_TO_CLEAR}</div>}
              {open && !cleared && next && next.id === s.id && <div className="tag" style={{ background: '#fde047', color: '#451a03' }}>つぎは ここ</div>}
            </div>
          </button>
        );
      };
      return (
        <div className="wrap">
          <div className="board">
            <div className="board-title">🌰 メニュー 🌰</div>
            <div className="grp-title">じゅんび</div>
            <div className="menu-grid">{STAGES.filter(s => s.grp === 'prep').map(item)}</div>
            <div className="grp-title">ひきざんの ひっさん（くりさがり あり）</div>
            <div className="menu-grid">{STAGES.filter(s => s.grp === 'main').map(item)}</div>
            <div className="grp-title">はってん</div>
            <div className="menu-grid">{STAGES.filter(s => s.grp === 'adv').map(item)}</div>
          </div>
        </div>
      );
    }

    /* =========================================================
       導入（クルミせんせいの お話）
       ========================================================= */
    const P72 = { a: 72, b: 37 };
    const filled = (keys, t, step = 0.12, from = 0.08) => { const o = {}; const vals = { f_b0: 7, f_r1: 3, f_r1c: 3, f_a0: 2, f_sum: 5, h_ones: 5, h_tens: 3 }; keys.forEach((k, i) => { if (t >= from + i * step) o[k] = vals[k]; }); return o; };
    const HV = ({ p = P72, v, x = 30, y = 40 }) => <g transform={`translate(${x} ${y})`}><HissanView p={p} v={v} /></g>;
    const Pic = ({ pic, t, y = 330 }) => <g transform={`translate(0 ${y})`}><rect x="6" y="0" width="788" height="198" rx="18" fill="#fffbeb" stroke="#f3d9a6" strokeWidth="3" /><BankPic pic={pic} t={t} /></g>;
    const INTRO = {
      j1: [

    function IntroScreen({ stage, onStart }) {
      const slides = INTRO[stage.id] || [];
      const [i, setI] = useState(0);
      const [talking, setTalking] = useState(false);
      const sl = slides[i];
      const t = useTicker(sl && sl.dur ? sl.dur : 1, { run: !!(sl && sl.dur), key: i });
      useEffect(() => {
        if (!sl) return;
        let alive = true;
        (async () => { setTalking(true); await TTS.speak(sl.say); if (alive) setTalking(false); })();
        return () => { alive = false; TTS.cancel(); };
      }, [i]);
      useEffect(() => { if (!sl) onStart(); }, [sl]);
      if (!sl) return null;
      const Art = sl.Art;
      const last = i === slides.length - 1;
      return (
        <div className="play">
          <div className="work">
            <div className="qhead"><span>{stage.label}</span><R t={stage.name} /><span className="grow" /><span className="muted">{i + 1} / {slides.length}</span></div>
            <svg className="ws" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet"><Art t={sl.dur ? t : 1} /></svg>
          </div>
          <div className="panel">
            <div className="row" style={{ alignItems: 'flex-start', gap: '1rem' }}>
              <Kurumi size={110} talking={talking} mood="normal" />
              <div className="bubble grow" key={i}><R t={sl.say} /></div>
            </div>
            <div className="row center wrapflex">
              {i > 0 && <Btn color="white" size="lg" onClick={() => setI(i - 1)}>◀ まえ</Btn>}
              <Btn color="white" size="lg" onClick={() => TTS.speak(sl.say, { force: true })}>🔊</Btn>
              {!last && <Btn color="sky" size="lg" onClick={() => setI(i + 1)} data-intro-next="1">つぎ ▶</Btn>}
            </div>
            {last && <Btn color="green" size="xl" className="pop" onClick={onStart} data-intro-start="1"><R t="もんだいを はじめる ▶" /></Btn>}
            <div style={{ marginTop: 'auto' }} className="tc">
              {!last && <Btn color="white" size="sm" onClick={onStart} data-intro-skip="1"><R t="おはなしを とばす ▶▶" /></Btn>}
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================

    function SetClearScreen({ app, stage, res, titleUp, onContinue, onHouse, onHome, onNextStage }) {
      const stageClear = res.stageClear;
      const friend = res.firstClear && stage.friend ? FRIEND_MAP[stage.friend] : null;
      const [talking, setTalking] = useState(false);
      const nextStage = stageClear ? findNext(app.state) : null;
      const bonusRef = useRef(null);
      useEffect(() => {
        fanfare(stageClear ? 'clear' : 'set');
        const tm = setTimeout(() => {
          const el = bonusRef.current;
          if (el) { const b = el.getBoundingClientRect(); flyAcorns({ x: b.left + b.width / 2, y: b.top + b.height / 2 }, SET_BONUS); }
        }, 900);
        const before = res.before || 0;
        const bagN = Math.floor((before + SET_BONUS) / 10) > Math.floor(before / 10) ? Math.floor((before + SET_BONUS) / 10) : 0;
        const tmBag = bagN ? setTimeout(() => showBagUp(bagN), 2300) : null;
        const text = (stageClear ? `${stage.label} クリア！ おめでとう！` : `1かい クリア！ よく がんばったね。`) + `\nボーナスの どんぐりを ${SET_BONUS}こ あげるよ。`
          + (friend ? `\n${friend.name}が あそびに きたよ！` : '') + (titleUp ? `\nしょうごうが「${titleUp.name}」に なったよ！` : '');
        const tm2 = setTimeout(async () => { setTalking(true); await TTS.speak(text); setTalking(false); }, bagN ? 5600 : (stageClear ? 2600 : 1700));
        return () => { clearTimeout(tm); clearTimeout(tm2); if (tmBag) clearTimeout(tmBag); TTS.cancel(); };
      }, []);
      const setNo = res.setNo || 1;
      return (
        <div className="wrap tc kids" style={{ maxWidth: 900 }}>
          <Confetti />
          <div className="row center" style={{ marginTop: '.4rem' }}><Kurumi size={140} mood="happy" talking={talking} /></div>
          <div className="pop bold" style={{ fontSize: stageClear ? '3rem' : '3.3rem', color: '#15803d', textShadow: '0 4px 0 #bbf7d0', lineHeight: 1.3 }}>
            {stageClear ? <>🏆 <R t={`${stage.label} クリア！`} /></> : '🎉 1かい クリア！'}
          </div>
          {stageClear && <div className="bold" style={{ fontSize: '1.5rem', marginTop: '.3rem' }}><R t={stage.name} /></div>}
          <div className="card row center pop" style={{ margin: '1rem auto', maxWidth: 560, borderColor: '#fcd34d', background: '#fffbeb', gap: '1rem' }}>
            <div ref={bonusRef} className="row" style={{ gap: '.2rem' }}>{range0(SET_BONUS).map(i => <AcornIcon key={i} size={48} />)}</div>
            <div className="bold" style={{ fontSize: '1.8rem', color: '#7c4a1e' }}>ボーナス ＋{SET_BONUS}</div>
          </div>
          {friend && (
            <div className="card pop" style={{ maxWidth: 560, margin: '0 auto 1rem', borderColor: '#86efac', background: '#f0fdf4' }}>
              <div className="emoji wiggle" style={{ fontSize: '5rem' }}>{friend.e}</div>
              <div className="bold" style={{ fontSize: '1.6rem', color: '#15803d' }}>{friend.name}が あそびに きたよ！</div>
              <div className="muted bold">📖 アルバムに はいったよ</div>
            </div>
          )}
          <div className="card" style={{ maxWidth: 640, margin: '0 auto 1rem' }}>
            <div className="bold" style={{ fontSize: '1.2rem', marginBottom: '.4rem' }}><R t={`${stage.label}　${stage.name}`} /></div>
            <div className="row center" style={{ gap: '.5rem' }}>
              {range0(SETS_TO_CLEAR).map(i => (
                <div key={i} style={{ width: 64, height: 64, borderRadius: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', background: i < setNo ? '#fffbeb' : '#f8fafc', border: `3px solid ${i < setNo ? '#e7c58f' : '#e2e8f0'}` }}>{i < setNo ? <BagIcon size={36} /> : ''}</div>
              ))}
            </div>
            <div className="muted bold" style={{ marginTop: '.4rem' }}>{stageClear ? 'クリア！' : `あと ${SETS_TO_CLEAR - setNo}かいで クリア`}</div>
            {titleUp && <div className="bold" style={{ color: '#15803d', fontSize: '1.3rem', marginTop: '.4rem' }}>{titleUp.icon} <R t={`しょうごうが「${titleUp.name}」に なったよ！`} /></div>}
          </div>
          <div className="col" style={{ maxWidth: 560, margin: '0 auto' }}>
            {!stageClear && <Btn color="green" size="xl" onClick={onContinue} data-continue="1"><R t="つぎの 5もんへ ▶" /></Btn>}
            {stageClear && nextStage && <Btn color="green" size="xl" onClick={() => onNextStage(nextStage)} data-continue="1"><R t="つぎの ステップへ ▶" /></Btn>}

              <Btn color="wood" size="lg" className="grow" onClick={onHouse}>🏠 もりの おうち</Btn>

    /* =========================================================
       もりの おうち（どんぐりで かって、すきな ところに おく）
       ========================================================= */
    function HouseScreen({ app }) {
      const st = app.state;
      const [cat, setCat] = useState(SHOP[0].id);
      const [buying, setBuying] = useState(null);
      const [placing, setPlacing] = useState(null);
      const c = SHOP.find(x => x.id === cat);
      const placedAt = (id) => st.placed[id];
      const tapItem = (it) => {
        if (st.owned[it.id]) { sfx('open'); setPlacing(it); TTS.speak(`${it.name}を どこに おく？`); return; }
        sfx('open'); setBuying(it);
        TTS.speak(st.acorns >= it.price ? `${it.name}は どんぐり ${it.price}こ だよ。かいますか？` : `${it.name}は どんぐり ${it.price}こ。あと ${it.price - st.acorns}こ たりないよ。`);
      };
      const buy = (it) => {
        const cur = app.stateRef.current;
        if (cur.owned[it.id] || cur.acorns < it.price) return;
        const opened = (cur.acorns % 10) < (it.price % 10);
        app.update(s => ({ ...s, acorns: s.acorns - it.price, owned: { ...s.owned, [it.id]: Date.now() } }));
        acornSound(); fanfare('ok');
        setBuying(null); setPlacing(it);
        TTS.speak(`${it.name}を かったよ！` + (opened ? 'ばらの どんぐりが たりないから、ふくろを 1つ あけたよ。' : '') + 'どこに おく？');
      };
      const place = (it, spot) => {
        app.update(s => {
          const placed = { ...s.placed };
          Object.keys(placed).forEach(k => { if (placed[k] === spot) delete placed[k]; });
          if (spot) placed[it.id] = spot; else delete placed[it.id];
          return { ...s, placed };
        });
        sfx('pick'); setPlacing(null);
        if (spot) TTS.speak(`${SPOT_MAP[spot].name}に おいたよ。`);
      };
      return (
        <div className="wrap kids" style={{ maxWidth: 1400 }}>
          <div className="house">
            <div className="card" style={{ padding: '.6rem' }}>
              <div className="row between" style={{ marginBottom: '.4rem' }}>
                <div className="bold" style={{ fontSize: '1.6rem', color: '#7c4a1e' }}>🏠 もりの おうち</div>
                <div className="acornpill" style={{ fontSize: '1.4rem' }}><AcornCount n={st.acorns} size={26} /></div>
              </div>
              <HouseScene placed={st.placed} pickSpot={placing ? (spot) => place(placing, spot) : null} />
              <div className="muted bold" style={{ marginTop: '.3rem' }}>かった ものを おすと、おく ばしょを えらべるよ。</div>
            </div>
            <div className="card">
              <div className="cats">
                {SHOP.map(x => <button key={x.id} className={`cat ${cat === x.id ? 'on' : ''}`} onClick={() => { sfx('tap'); setCat(x.id); }} data-cat={x.id}><span className="emoji" style={{ fontSize: '1.4rem' }}>{x.icon}</span>{x.name}</button>)}
              </div>
              <div className="shop-grid">
                {c.list.map(it => {
                  const owned = !!st.owned[it.id];
                  const poor = !owned && st.acorns < it.price;
                  const at = placedAt(it.id);
                  return (
                    <button key={it.id} className={`item ${owned ? 'owned' : ''} ${poor ? 'poor' : ''}`} onClick={() => tapItem(it)} data-item={it.id}>
                      {owned && <span className="badge">{at ? CIRCLED[SPOTS.findIndex(s => s.id === at)] : 'もってる'}</span>}
                      <span className="em emoji">{it.e}</span>
                      <span className="nm">{it.name}</span>
                      {!owned && <span className="pr"><AcornIcon size={20} />{it.price}</span>}
                      {owned && <span className="pr" style={{ fontSize: '1rem' }}>{at ? 'おいて ある' : 'おく ▶'}</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
          {buying && (
            <Modal onClose={() => setBuying(null)}>
              <div className="card tc kids" style={{ maxWidth: 460, margin: '0 auto' }}>
                <div className="emoji pop" style={{ fontSize: '6rem' }}>{buying.e}</div>
                <div className="bold" style={{ fontSize: '1.8rem' }}>{buying.name}</div>
                <div className="row center bold" style={{ fontSize: '1.6rem', color: '#7c4a1e', margin: '.3rem 0 .8rem', gap: '.3rem' }}><AcornIcon size={32} />{buying.price}こ</div>
                {st.acorns >= buying.price ? (
                  <>
                    <div className="bold" style={{ fontSize: '1.5rem', marginBottom: '.8rem' }}>かいますか？</div>
                    <div className="row">
                      <Btn color="green" size="lg" className="grow" onClick={() => buy(buying)} data-buy="yes" silent>⭕ はい</Btn>
                      <Btn color="white" size="lg" className="grow" onClick={() => setBuying(null)} data-buy="no">❌ いいえ</Btn>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="bold" style={{ fontSize: '1.4rem', lineHeight: 1.8, marginBottom: '.8rem' }}>どんぐりが たりないよ。<br />あと <span style={{ color: '#b45309', fontSize: '1.8rem' }}>{buying.price - st.acorns}</span>こ。<br />もんだいを といて あつめよう！</div>
                    <Btn color="sky" size="lg" onClick={() => setBuying(null)}>OK</Btn>
                  </>
                )}
              </div>
            </Modal>
          )}
          {placing && (
            <Modal onClose={() => setPlacing(null)}>
              <div className="card kids" style={{ maxWidth: 620, margin: '0 auto' }}>
                <div className="row center" style={{ marginBottom: '.5rem' }}>
                  <span className="emoji" style={{ fontSize: '3.4rem' }}>{placing.e}</span>
                  <span className="bold" style={{ fontSize: '1.6rem' }}>{placing.name}を どこに おく？</span>
                </div>
                <div className="spots">
                  {SPOTS.map((sp, i) => {
                    const here = Object.entries(st.placed).find(([k, v]) => v === sp.id);
                    const other = here && here[0] !== placing.id ? ITEM_MAP[here[0]] : null;
                    return (
                      <Btn key={sp.id} color={placedAt(placing.id) === sp.id ? 'green' : 'white'} size="md" onClick={() => place(placing, sp.id)} data-place={sp.id} style={{ justifyContent: 'flex-start' }}>
                        <span style={{ fontWeight: 900 }}>{CIRCLED[i]}</span> {sp.name} {other && <span className="emoji">{other.e}</span>}
                      </Btn>
                    );
                  })}
                </div>
                <div className="row" style={{ marginTop: '.7rem' }}>
                  {placedAt(placing.id) && <Btn color="white" size="md" className="grow" onClick={() => place(placing, null)}>📦 しまう</Btn>}
                  <Btn color="slate" size="md" className="grow" onClick={() => setPlacing(null)}>とじる</Btn>
                </div>
                <div className="muted bold" style={{ marginTop: '.4rem' }}>おうちの えの まるい ところを おしても おけるよ。</div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    function PinPad({ onSuccess, onClose, check }) {
      const [digitsIn, setDigits] = useState('');
      const [shake, setShake] = useState(false);
      const press = (d) => {
        if (digitsIn.length >= 4) return;
        const v = digitsIn + d;
        setDigits(v);
        if (v.length === 4) {
          setTimeout(() => {
            if (check(v)) onSuccess();
            else { sfx('ng'); setShake(true); setTimeout(() => { setShake(false); setDigits(''); }, 450); }
          }, 150);
        }
      };
      return (
        <Modal onClose={onClose}>
          <div className={`card tc ${shake ? 'shake' : ''}`} style={{ maxWidth: 380, margin: '0 auto' }}>

    function SyncPanel({ app }) {
      const sync = app.state.sync || {};
      const [pending, setPending] = useState(null);
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState('');
      const [editing, setEditing] = useState(!sync.url);
      const [url, setUrl] = useState(sync.url || '');
      const [key, setKey] = useState(sync.key || '');
      const countPending = async () => { try { setPending((await DB.getAll('history')).filter(h => !h.sent).length); } catch (e) { setPending(null); } };
      useEffect(() => { countPending(); }, [sync.lastOkAt, sync.lastErrorAt]);
      const send = async (all) => {
        setBusy(true); setMsg('');
        const r = await Sync.run(app, { all });
        setBusy(false); countPending();
        if (r.ok) setMsg(r.sent ? `${r.sent}件の記録を送りました。` : '送っていない記録はありません（一覧は最新です）。');
        else if (r.reason === 'offline') setMsg('インターネットにつながっていません。');
      };
      const save = () => {
        const u = url.trim();
        if (!REC_URL_RE.test(u)) { setMsg('URLの形がちがいます。「https://script.google.com/macros/s/…/exec」の形のURLを入れてください。'); return; }
        if (!key.trim()) { setMsg('合言葉を入れてください。'); return; }
        app.update(s => ({ ...s, sync: { ...s.sync, url: u, key: key.trim(), lastError: null, lastSummary: null } }));
        setEditing(false); setMsg('送り先を保存しました。「今すぐ送る」で送信を確かめてください。');
      };
      const clearUrl = () => {
        if (!confirm('記録の送り先を消しますか？（この端末の記録は消えません）')) return;
        app.update(s => ({ ...s, sync: {} }));
        setUrl(''); setKey(''); setEditing(true); setMsg('送り先を消しました。');
      };
      const errShown = sync.lastError && (!sync.lastOkAt || sync.lastErrorAt > sync.lastOkAt);
      const stat = (label, value, ok) => <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '.8rem', padding: '.6rem .9rem' }}><div className="muted" style={{ fontSize: '.85rem' }}>{label}</div><div className="bold" style={{ color: ok ? '#047857' : undefined }}>{value}</div></div>;
      return (
        <div className="card" style={{ borderColor: '#bae6fd' }}>
          <div className="bold" style={{ fontSize: '1.2rem' }}>📡 先生のスプレッドシートへの送信</div>
          <div className="muted" style={{ marginBottom: '.6rem' }}>1問とくたびに、結果を先生のGoogleスプレッドシートへ自動で送ります。送れなかった記録は、次につながったときに送り直します。</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))', gap: '.6rem', marginBottom: '.6rem' }}>
            {stat('送り先', sync.url ? '✅ 設定ずみ' : '未設定', !!sync.url)}
            {stat('まだ送っていない記録', pending == null ? '…' : `${pending}件`)}
            {stat('最後に送れた日時', sync.lastOkAt ? fmtDate(sync.lastOkAt) : '—')}
          </div>
          {errShown && <div style={{ background: '#fff1f2', border: '1px solid #fecdd3', color: '#9f1239', borderRadius: '.8rem', padding: '.6rem', marginBottom: '.6rem' }}>⚠️ {syncErrorText(sync.lastError)}</div>}
          {sync.url && (
            <div className="row wrapflex" style={{ marginBottom: '.5rem' }}>
              <Btn color="sky" size="md" disabled={busy} onClick={() => send(false)}>📤 今すぐ送る</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={() => send(true)}>🔁 これまでの記録をまとめて送る</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={() => setEditing(v => !v)}>✏️ 送り先を入力</Btn>
            </div>
          )}
          {!sync.url && <div className="muted" style={{ marginBottom: '.5rem' }}>入口ページ（Apps Script）の「はじめる」から開くと、送り先は自動で設定されます。入口ページを通さずに開いた端末では、スプレッドシートのメニュー「クルミせんせい → 子どもに配るURLと合言葉を表示」で出るURLと合言葉を、ここに入力してください。</div>}
          {editing && (
            <div className="col" style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '.8rem', padding: '.7rem' }}>
              <label><div className="bold" style={{ fontSize: '.9rem' }}>送り先のURL（…/exec）</div><input className="inp" style={{ width: '100%' }} value={url} onChange={e => setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/……/exec" /></label>
              <label><div className="bold" style={{ fontSize: '.9rem' }}>合言葉</div><input className="inp" style={{ width: '100%' }} value={key} onChange={e => setKey(e.target.value)} /></label>
              <div className="row"><Btn color="green" size="sm" onClick={save}>保存</Btn>{sync.url && <Btn color="white" size="sm" onClick={clearUrl}>送り先を消す</Btn>}</div>
            </div>
          )}
          {busy && <div className="bold muted" style={{ marginTop: '.4rem' }}>送信中…</div>}
          {msg && <div className="bold" style={{ marginTop: '.4rem' }}>{msg}</div>}
        </div>
      );
    }
    function DataTab({ app }) {
      const [msg, setMsg] = useState('');
      const [busy, setBusy] = useState(false);
      const exportCSV = async () => {
        const hist = (await DB.getAll('history')).sort((a, b) => a.at - b.at);
        const esc = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
        const rows = [['日時', 'ステップ', '問題番号', '問題', '正しい答え', '答えた内容', '結果', 'まちがえた回数', 'ヒントの回数', 'かかった時間(秒)', 'つまずき', 'メモ', '色分け']];
        hist.forEach(h => {
          const s = STAGE_MAP[h.stageId];
          rows.push([fmtDate(h.at), s ? stageName(s) : h.stageId, h.no, h.label, h.correct, (h.answers || []).join(' → '), h.result, h.mistakes, h.hints, h.sec, [...new Set(h.errors || [])].map(e => ERR[e] || e).join('、'), h.memo ? 'つかった' : '', h.color === false ? 'なし' : 'あり']);
        });
        const name = app.state.profile ? app.state.profile.name : 'record';
        downloadFile(`ひっ算の記録_${name}_${ymd()}.csv`, '﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n'), 'text/csv');
        setMsg(`${hist.length}件の記録をCSVで書き出しました。`);
      };
      const exportBackup = async () => {
        setBusy(true);
        try {
          const history = await DB.getAll('history');
          const name = app.state.profile ? app.state.profile.name : 'backup';
          downloadFile(`ひっ算バックアップ_${name}_${ymd()}.json`, JSON.stringify({ app: APP_ID, kind: 'backup', version: 1, state: app.stateRef.current, history }), 'application/json');
          setMsg('バックアップを書き出しました。');
        } finally { setBusy(false); }
      };
      const importBackup = async () => {
        const file = await pickFile('.json,application/json');
        if (!file) return;
        let data;
        try { data = JSON.parse(await file.text()); } catch (e) { setMsg('ファイルを読み込めませんでした。'); return; }
        if (!data || data.app !== APP_ID || data.kind !== 'backup') { setMsg('このアプリのバックアップファイルを選んでください。'); return; }
        if (!confirm('今のChromebookの記録を、バックアップの内容で置き換えます。よろしいですか？')) return;
        setBusy(true);
        try {
          await DB.clear('history');
          for (const h of data.history || []) await DB.put('history', h);
          const st = data.state || {};
          app.update(cur => {
            const next = normalizeState({ ...st, deviceId: st.deviceId || cur.deviceId });
            return { ...next, sync: cur.sync && cur.sync.url ? cur.sync : next.sync };
          });
          setMsg('バックアップから元にもどしました。');
        } catch (e) { setMsg('読み込み中にエラーが起きました。'); }
        finally { setBusy(false); }
      };
      const resetAll = async () => {
        if (!confirm('この児童の記録・ステップの進み具合・どんぐり・かぐ・ともだちをすべて消します。元にもどせません。よろしいですか？')) return;
        if (!confirm('本当に消しますか？（設定と名前は残ります）')) return;
        await DB.clear('history');
        app.update(s => ({ ...s, progress: {}, acorns: 0, earned: 0, owned: {}, placed: {}, sync: { ...s.sync, lastSummary: null } }));
        setMsg('記録を消しました。');
      };
      return (
        <div className="col" style={{ gap: '1rem' }}>
          <SyncPanel app={app} />
          <div className="card" style={{ borderColor: '#e2e8f0' }}>
            <div className="bold" style={{ fontSize: '1.2rem' }}>記録の書き出し（CSV）</div>
            <div className="muted" style={{ marginBottom: '.5rem' }}>すべての問題の結果を、スプレッドシートで開けるファイルにします。</div>
            <Btn color="sky" size="md" onClick={exportCSV}>📄 CSVで書き出す</Btn>
          </div>
          <div className="card" style={{ borderColor: '#e2e8f0' }}>
            <div className="bold" style={{ fontSize: '1.2rem' }}>バックアップ</div>
            <div className="muted" style={{ marginBottom: '.5rem' }}>記録・進み具合・どんぐり・かぐ・設定をまとめて保存します。Chromeの閲覧データを消すと記録も消えるので、ときどきバックアップしてください。端末を替えるときにも使えます。</div>
            <div className="row wrapflex">
              <Btn color="sky" size="md" disabled={busy} onClick={exportBackup}>💾 バックアップを書き出す</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={importBackup}>📥 バックアップから元にもどす</Btn>
            </div>
          </div>
          <div className="card" style={{ borderColor: '#fecdd3' }}>
            <div className="bold" style={{ fontSize: '1.2rem', color: '#be123c' }}>記録をすべて消す</div>
            <div className="muted" style={{ marginBottom: '.5rem' }}>新しい児童が使うときなどに使います。どんぐり・かぐ・ともだちも消えます。</div>
            <Btn color="red" size="md" onClick={resetAll}>🗑️ 記録を消す</Btn>
          </div>
          {msg && <div className="bold" style={{ color: '#047857', fontSize: '1.1rem' }}>{msg}</div>}
        </div>
      );
    }

    /* =========================================================
       アプリ全体
       ========================================================= */
    function Header({ app, view, onHome, onBack, onTeacher, onHouse }) {
      const { state } = app;
      const t = titleOf(state);
      const showBack = !['home', 'setup', 'teacher', 'setclear'].includes(view.name);
      return (
        <header className="hdr">
          <div className="hdr-in">
            {showBack && <Btn color="white" size="sm" onClick={onBack} data-back="1">◀ もどる</Btn>}
            <button className="logo" onClick={onHome}>
              <AcornIcon size={30} /><span className="lt">クルミせんせいの どんぐり ぎんこう</span>
            </button>
            <span className="grow" />
            {state.profile && view.name !== 'teacher' && (
              <>
                <button id="acorn-pill" className="acornpill" onClick={onHouse} title="もりの おうち"><AcornCount n={state.acorns} size={24} /></button>
                <span className="bold muted" style={{ fontSize: '1.05rem', whiteSpace: 'nowrap' }}><span className="emoji">{t.icon}</span> {state.profile.name}さん</span>
                <button className="tbtn" onClick={onTeacher} title="先生用" data-teacher="1">⚙ せんせい</button>
              </>
            )}
          </div>
        </header>
      );
    }

    function App() {
      const [state, setState] = useState(loadState);
      const stateRef = useRef(state);
      const update = useCallback((fn) => {
        const next = fn(stateRef.current);
        stateRef.current = next;
        CURRENT.settings = next.settings;
        setState(next); saveState(next);
        return next;
      }, []);
      const app = { state, update, stateRef };
      const [view, setView] = useState(state.profile ? { name: 'home' } : { name: 'setup' });
      const [pinOpen, setPinOpen] = useState(false);

      useEffect(() => {
        const trySync = () => Sync.run({ state: stateRef.current, update, stateRef });
        trySync();
        window.addEventListener('online', trySync);
        return () => window.removeEventListener('online', trySync);
      }, []);
      useEffect(() => { document.documentElement.style.fontSize = (FONT_PX[state.settings.fontSize] || 16) + 'px'; }, [state.settings.fontSize]);

      const go = v => { TTS.cancel(); setView(v); window.scrollTo(0, 0); };
      if (location.protocol === 'file:') window.__hissan = { go, update, stateRef, genSet, STAGES, view, DB }; // 動作確認用
      const openStage = (stage) => {
        const p = prog(stateRef.current, stage.id);
        const fresh = !(p.sets || 0) && !(p.idx || 0) && !p.cleared;
        go(fresh && INTRO[stage.id] ? { name: 'intro', stageId: stage.id } : { name: 'play', stageId: stage.id, titleBefore: titleOf(stateRef.current), k: Date.now() });
      };
      const back = () => {
        if (view.name === 'play' || view.name === 'intro') go({ name: 'menu' });
        else go({ name: 'home' });
      };
      const stage = view.stageId ? STAGE_MAP[view.stageId] : null;

      return (
        <div style={{ minHeight: '100vh' }}>
          <Header app={app} view={view} onHome={() => !['setup', 'teacher'].includes(view.name) && go({ name: 'home' })} onBack={back}
                  onTeacher={() => setPinOpen(true)} onHouse={() => !['setup', 'teacher'].includes(view.name) && go({ name: 'house' })} />
          {view.name === 'setup' && <SetupScreen onDone={(profile) => { update(s => ({ ...s, profile })); Sync.run(app); go({ name: 'home' }); }} />}
          {view.name === 'home' && <HomeScreen app={app} onPlay={openStage} onMenu={() => go({ name: 'menu' })} onHouse={() => go({ name: 'house' })} onAlbum={() => go({ name: 'album' })} />}
          {view.name === 'menu' && <MenuScreen app={app} onOpen={openStage} />}
          {view.name === 'intro' && stage && <IntroScreen key={stage.id} stage={stage} onStart={() => go({ name: 'play', stageId: stage.id, titleBefore: titleOf(stateRef.current), k: Date.now() })} />}
          {view.name === 'play' && stage && (
            <PlayScreen key={stage.id + (view.k || '')} app={app} stage={stage} onSetEnd={(res) => {
              const before = view.titleBefore;
              const after = titleOf(stateRef.current);
              go({ name: 'setclear', stageId: stage.id, res, titleUp: res.stageClear && before && before.name !== after.name ? after : null });
            }} />
          )}
          {view.name === 'setclear' && stage && (
            <SetClearScreen key={JSON.stringify(view.res)} app={app} stage={stage} res={view.res} titleUp={view.titleUp}
                            onContinue={() => go({ name: 'play', stageId: stage.id, titleBefore: titleOf(stateRef.current), k: Date.now() })}
                            onNextStage={openStage} onHouse={() => go({ name: 'house' })} onHome={() => go({ name: 'home' })} />
          )}
          {view.name === 'house' && <HouseScreen app={app} />}
          {view.name === 'album' && <AlbumScreen app={app} />}
          {view.name === 'teacher' && <TeacherScreen app={app} onExit={() => go({ name: 'home' })} />}
          <BagUpLayer />
          {pinOpen && (
            <PinPad onClose={() => setPinOpen(false)}
                    check={v => state.profile && hashPin(v) === state.profile.pin}
                    onSuccess={() => { setPinOpen(false); go({ name: 'teacher' }); }} />
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      render() {
        if (this.state.err) return (
          <div className="wrap tc" style={{ maxWidth: 640 }}>
            <div style={{ fontSize: 64 }}>🐿️💦</div>
            <div className="bold" style={{ fontSize: '1.6rem' }}>こまったことが おきたよ</div>
            <div className="muted" style={{ fontSize: '1.1rem', margin: '.5rem 0 1rem' }}>せんせいに しらせてね。（ページを さいよみこみ すると なおることが あります）</div>
            <pre style={{ textAlign: 'left', fontSize: 12, background: '#f1f5f9', padding: 12, borderRadius: 8, overflow: 'auto' }}>{String(this.state.err && this.state.err.stack || this.state.err)}</pre>
            <button className="btn3d c-sky s-md" onClick={() => location.reload()}>さいよみこみ</button>
          </div>
        );
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
