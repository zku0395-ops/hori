<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クルミせんせいの どんぐり ぎんこう</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root {
      --bg: #f3f7ec; --ink: #1e293b; --sub: #64748b; --line: #e2e8f0;
      --wood: #7c4a1e; --wood-l: #d6c4a8; --leaf: #16a34a; --cream: #fffdf6;
      --c-hikareru: #dc2626; --c-hiku: #2563eb; --c-ten: #059669;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; }
    button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
    input, select { font-family: inherit; }
    ruby rt { font-size: .5em; color: #475569; font-weight: 400; }
    .bubble, .mitem, .qhead, .board, .choice, .kids, .rule { word-break: keep-all; overflow-wrap: anywhere; }
    .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 28px; color: var(--wood); }
    .emoji { font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; line-height: 1; }

    /* 立体ボタン */
    .btn3d { word-break: keep-all; border: 0; border-bottom: 6px solid rgba(0,0,0,.28); border-radius: 1.1rem; font-weight: 700; transition: transform .08s, border-bottom-width .08s, filter .15s; display: inline-flex; align-items: center; justify-content: center; gap: .4em; user-select: none; line-height: 1.25; }
    .btn3d:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 3px; }
    .btn3d:disabled { opacity: .4; cursor: not-allowed; }
    .btn3d:hover:not(:disabled) { filter: brightness(1.05); }
    .c-sky { background: #0ea5e9; color: #fff; border-bottom-color: #0369a1; }
    .c-red { background: #f43f5e; color: #fff; border-bottom-color: #be123c; }
    .c-green { background: #16a34a; color: #fff; border-bottom-color: #166534; }
    .c-amber { background: #fbbf24; color: #451a03; border-bottom-color: #d97706; }
    .c-violet { background: #8b5cf6; color: #fff; border-bottom-color: #6d28d9; }
    .c-wood { background: #a0612b; color: #fff; border-bottom-color: #6b3a14; }
    .c-slate { background: #475569; color: #fff; border-bottom-color: #1e293b; }
    .c-white { background: #fff; color: #334155; border: 2px solid #cbd5e1; border-bottom: 6px solid #cbd5e1; }
    .c-orange { background: #f97316; color: #fff; border-bottom-color: #c2410c; }
    .s-sm { padding: .45rem .8rem; font-size: 1rem; }
    .s-md { padding: .7rem 1.2rem; font-size: 1.25rem; }
    .s-lg { padding: .9rem 1.5rem; font-size: 1.6rem; }
    .s-xl { padding: 1.1rem 2rem; font-size: 2rem; }

    /* レイアウト */
    .wrap { max-width: 1200px; margin: 0 auto; padding: .75rem; }
    .row { display: flex; align-items: center; gap: .6rem; }
    .col { display: flex; flex-direction: column; gap: .6rem; }
    .wrapflex { flex-wrap: wrap; }
    .grow { flex: 1 1 auto; min-width: 0; }
    .center { justify-content: center; }
    .between { justify-content: space-between; }
    .card { background: #fff; border-radius: 1.4rem; border: 4px solid var(--wood-l); box-shadow: 0 2px 8px rgba(0,0,0,.05); padding: 1rem; }
    .muted { color: var(--sub); }
    .bold { font-weight: 700; }
    .tc { text-align: center; }

    /* ヘッダー */
    .hdr { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.96); box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    .hdr-in { max-width: 1400px; margin: 0 auto; padding: 0 .75rem; display: flex; align-items: center; gap: .5rem; height: 56px; overflow: hidden; }
    .logo { display: flex; align-items: center; gap: .4rem; font-weight: 900; color: var(--wood); font-size: 1.3rem; background: none; border: 0; padding: 0; white-space: nowrap; }
    .tbtn { font-size: .85rem; color: #94a3b8; border: 1px solid #e2e8f0; border-radius: .6rem; padding: .3rem .55rem; background: #fff; white-space: nowrap; }
    .acornpill { display: inline-flex; align-items: center; gap: .25rem; background: #fffbeb; border: 3px solid #e7c58f; border-radius: 999px; padding: .05rem .7rem .05rem .3rem; font-weight: 900; font-size: 1.3rem; color: #7c4a1e; white-space: nowrap; }
    .acornpill.bump { animation: bump .5s ease; }
    @keyframes bump { 30% { transform: scale(1.25); } }
    @media (max-width: 760px) { .logo .lt { display: none; } }

    /* ホーム */
    .home { max-width: 1400px; margin: 0 auto; padding: .6rem .75rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 32%); gap: .8rem; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
    .home-scene { border-radius: 1.4rem; overflow: hidden; background: #dcfce7; display: flex; align-items: center; justify-content: center; min-height: 0; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    .home-scene svg { width: 100%; height: 100%; }
    .home-side { min-height: 0; overflow-y: auto; padding-bottom: .5rem; }
    @media (max-width: 900px) { .home { grid-template-columns: 1fr; height: auto; } .home-scene { aspect-ratio: 1000 / 750; } }

    /* 問題の画面 */
    .play { max-width: 1400px; margin: 0 auto; padding: .6rem .75rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 34%); gap: .75rem; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
    .work { position: relative; background: var(--cream); border-radius: 1.4rem; border: 4px solid var(--wood-l); box-shadow: inset 0 0 0 3px #fff, 0 2px 8px rgba(0,0,0,.05); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .work svg.ws { flex: 1 1 auto; width: 100%; height: 100%; min-height: 0; touch-action: manipulation; user-select: none; -webkit-user-select: none; display: block; }
    .panel { display: flex; flex-direction: column; gap: .55rem; min-height: 0; overflow-y: auto; padding-bottom: .5rem; }
    .qhead { padding: .5rem .9rem .2rem; font-size: 1.05rem; font-weight: 700; color: var(--wood); display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .rule { margin: .1rem .9rem 0; padding: .3rem .8rem; border: 3px solid #93c5fd; border-radius: .9rem; background: #eff6ff; font-size: 1.05rem; font-weight: 700; line-height: 1.75; color: #1e3a8a; }
    .story { margin: .2rem .9rem 0; padding: .5rem .9rem; border: 3px solid #e7c58f; border-radius: 1rem; background: #fffbeb; font-size: 1.45rem; font-weight: 700; line-height: 2; }
    @media (max-width: 900px) {
      .play { grid-template-columns: 1fr; height: auto; }
      .work { height: 64vh; }
    }

    /* ふきだし */
    .bubble { position: relative; background: #fff; border: 4px solid #e7c58f; border-radius: 1.3rem; padding: .75rem 1rem .6rem; font-size: 1.4rem; line-height: 1.95; font-weight: 700; color: #1e293b; }
    .bubble::before { content: ''; position: absolute; left: -16px; top: 26px; border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-right: 15px solid #e7c58f; }

    /* 数字の ボタン */
    .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: .45rem; }
    .key { font-size: 2.3rem; padding: .45rem 0 .35rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .key.gone { opacity: .22; }
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: .6rem; }
    .choice { font-size: 1.9rem; padding: .8rem .4rem; }
    .choice.gone { opacity: .25; text-decoration: line-through; }

    /* すすみぐあい */
    .dots { display: flex; gap: .35rem; align-items: center; }
    .dot { width: 2.2rem; height: 2.2rem; border-radius: 999px; border: 3px dashed #e7c58f; display: flex; align-items: center; justify-content: center; background: #fff; font-weight: 700; color: var(--wood); }
    .dot.now { border-style: solid; border-color: #a0612b; box-shadow: 0 0 0 4px #fde9c8; }
    .dot.done { border-style: solid; border-color: #fcd34d; background: #fffbeb; }

    /* 動き */
    .pop { animation: popup .45s cubic-bezier(.175,.885,.32,1.275) both; }
    @keyframes popup { 0% { transform: scale(.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    .pulse { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .glow { animation: glow 1.2s ease-in-out infinite; }
    @keyframes glow { 50% { box-shadow: 0 0 0 8px rgba(251,191,36,.6); } }
    .confetti { position: fixed; top: -60px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
    .fadein { animation: fadein .5s ease both; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .okburst { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; animation: okburst 2.2s ease forwards; }
    .okburst .t { font-size: 5.5rem; font-weight: 900; color: #16a34a; -webkit-text-stroke: 3px #fff; paint-order: stroke; text-shadow: 0 0 0 #fff, 0 6px 0 #166534, 0 10px 24px rgba(22,101,52,.35); letter-spacing: .06em; }
    @keyframes okburst { 0% { transform: scale(.3); opacity: 0; } 14% { transform: scale(1.15); opacity: 1; } 24% { transform: scale(1); } 78% { opacity: 1; } 100% { transform: scale(1.05); opacity: 0; } }
    .bagup { position: fixed; inset: 0; z-index: 65; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .bagup > div { background: rgba(255,255,255,.96); border: 6px solid #e7c58f; border-radius: 2rem; padding: 1rem 2rem; box-shadow: 0 12px 30px rgba(0,0,0,.18); animation: bagup 3.4s ease forwards; text-align: center; }
    @keyframes bagup { 0% { transform: scale(.4); opacity: 0; } 10% { transform: scale(1.05); opacity: 1; } 16% { transform: scale(1); } 86% { opacity: 1; } 100% { opacity: 0; } }
    .flyacorn { position: fixed; z-index: 70; pointer-events: none; }
    .kurumi { display: block; user-select: none; -webkit-user-drag: none; animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
    image.kurumi { transform-box: fill-box; }
    .kurumi.talking { animation: talk .45s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    @keyframes talk { 50% { transform: translateY(-3px) scale(1.02, .98); } }
    .scene-wrap { position: relative; width: 100%; height: 100%; }
    .wiggle { animation: wiggle 1s ease-in-out infinite; transform-origin: 50% 90%; }
    @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    /* メニュー */
    .board { background: #fff; border: 10px solid #c79a62; border-radius: 1.6rem; box-shadow: 0 10px 24px rgba(124,74,30,.14); padding: 1rem 1rem 1.2rem; }
    .board-title { text-align: center; font-size: 2rem; font-weight: 900; letter-spacing: .15em; color: var(--wood); margin-bottom: .6rem; }
    .grp-title { font-size: 1.15rem; font-weight: 900; color: var(--wood); margin: .8rem 0 .4rem; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: .7rem; }
    .mitem { display: flex; align-items: center; gap: .8rem; text-align: left; border-radius: 1.1rem; border: 3px solid #e7d5b8; background: #fffaf2; color: #1e293b; padding: .55rem .8rem; font-size: 1.35rem; font-weight: 700; line-height: 1.75; min-height: 96px; }
    .mitem:hover:not(:disabled) { background: #fdf3e2; }
    .mitem.next { border-color: #f59e0b; box-shadow: 0 0 0 4px rgba(251,191,36,.35); }
    .mitem:disabled { opacity: .5; cursor: not-allowed; }
    .tag { display: inline-block; font-size: .85rem; border-radius: 999px; padding: .05rem .6rem; font-weight: 700; line-height: 1.6; }
    .minibar { height: 8px; background: #f3e6d1; border-radius: 99px; overflow: hidden; margin-top: .2rem; }
    .minibar > div { height: 100%; background: #a0612b; border-radius: 99px; }

    /* もりの おうち・アルバム */
    .house { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 36%); gap: .8rem; }
    @media (max-width: 900px) { .house { grid-template-columns: 1fr; } }
    .cats { display: flex; gap: .45rem; flex-wrap: wrap; margin-bottom: .7rem; }
    .cat { border-radius: 1rem; padding: .45rem .9rem; font-size: 1.15rem; font-weight: 700; border: 3px solid #e7d5b8; background: #fff; color: var(--wood); display: inline-flex; align-items: center; gap: .35rem; }
    .cat.on { background: #a0612b; color: #fff; border-color: #6b3a14; }
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .6rem; }
    .item { position: relative; display: flex; flex-direction: column; align-items: center; gap: .15rem; background: #fff; border: 3px solid #e7d5b8; border-bottom-width: 6px; border-radius: 1.1rem; padding: .5rem .3rem .4rem; font-weight: 700; color: #1e293b; }
    .item .em { font-size: 2.8rem; }
    .item .nm { font-size: 1rem; text-align: center; line-height: 1.3; min-height: 2.6em; display: flex; align-items: center; word-break: keep-all; overflow-wrap: anywhere; }
    .item .pr { display: inline-flex; align-items: center; gap: .2rem; font-size: 1.2rem; color: #7c4a1e; }
    .item.owned { background: #f0fdf4; border-color: #86efac; }
    .item.poor { opacity: .55; }
    .item .badge { position: absolute; top: .3rem; right: .3rem; background: #22c55e; color: #fff; border-radius: 999px; font-size: .78rem; padding: 0 .45rem; }
    .spots { display: grid; grid-template-columns: repeat(2, 1fr); gap: .45rem; }
    .friend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: .7rem; }
    .friend { border-radius: 1.2rem; border: 4px solid #e7d5b8; background: #fff; padding: .6rem; text-align: center; font-weight: 700; }
    .friend .em { font-size: 4rem; }
    .friend.empty { background: #f8fafc; border-style: dashed; border-color: #cbd5e1; color: #94a3b8; }
    .friend.empty .em { filter: grayscale(1) brightness(0); opacity: .14; }

    /* 先生用 */
    .tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .8rem; }
    .tab { border-radius: 1rem; padding: .6rem 1.1rem; font-size: 1.1rem; font-weight: 700; border: 2px solid #e2e8f0; background: #fff; color: #475569; }
    .tab.on { background: #0ea5e9; color: #fff; border-color: #0284c7; }
    .trow { border-top: 1px solid #f1f5f9; padding: .9rem 0; display: grid; grid-template-columns: 1fr 2fr; gap: .6rem; }
    .trow .lb { font-weight: 700; font-size: 1.05rem; }
    .trow .ds { font-size: .85rem; color: #64748b; }
    .opt { border-radius: .7rem; padding: .45rem .9rem; font-weight: 700; border: 2px solid #cbd5e1; background: #fff; color: #475569; font-size: 1rem; }
    .opt.on { background: #0ea5e9; color: #fff; border-color: #0284c7; }
    table.tbl { border-collapse: collapse; width: 100%; font-size: .95rem; }
    table.tbl th, table.tbl td { border-bottom: 1px solid #f1f5f9; padding: .45rem .5rem; text-align: left; vertical-align: top; }
    table.tbl th { background: #f8fafc; color: #475569; white-space: nowrap; }
    .inp { border-radius: .7rem; border: 2px solid #cbd5e1; padding: .5rem .7rem; font-size: 1.1rem; }
    @media (max-width: 700px) { .trow { grid-template-columns: 1fr; } }

    .modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; padding: 1rem; }

    @media (prefers-reduced-motion: reduce) {
      .pulse, .glow, .wiggle, .kurumi { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"><div class="loading">🌰 よみこみちゅう…</div></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* =========================================================
       きほんの 設定
       ========================================================= */
    const STORE_KEY = 'kurumiHissan.v1';   // localStorage のキー
    const APP_ID = 'kurumi-hissan';        // 記録を送るときの アプリの 名前
    const PER_SET = 5;                     // 1かいの 問題の 数
    const SETS_TO_CLEAR = 2;               // 何かい おえると クリアか（5問 × 2かい）
    const SET_BONUS = 3;                   // 1かい（5問）おえた ときの ボーナス
    const DEFAULT_SETTINGS = {
      rate: 0.8,            // 読み上げの 速さ
      color: true,          // 色分け（ひかれる数＝赤、ひく数＝青、10＝緑）
      bag: true,            // 10の ふくろの 絵
      startStage: 'j1',     // 始める ステップ
      skipPrep: false,      // じゅんび①〜③を とばす
      unlockAll: false,     // すべての ステップを 開く
      advanced: false,      // 発展を 開く
      voice: true,          // クルミせんせいの 声
      sfx: true,            // 効果音・ファンファーレ
      fontSize: 'm',
    };
    const FONT_PX = { m: 16, l: 18, xl: 20 };
    const TITLES = [
      { min: 0, name: 'どんぐり みならい', icon: '🌰' },
      { min: 2, name: 'ぎんこう いん', icon: '👜' },
      { min: 4, name: 'まどぐち めいじん', icon: '🎖️' },
      { min: 7, name: 'ひっさん はかせ', icon: '🎓' },
      { min: 9, name: 'ぎんこう ちょう', icon: '👑' },
    ];
    // つまずきの 種類（先生用の 名前）
    const ERR = {
      reverse: '大きい方から小さい方をひいた',
      nodec: '十の位を1へらしていない',
      tenminus: '10−ひく数のまちがい',
      add: 'たし算のまちがい',
      copy: '式に入れる数字のまちがい',
      judge: 'ひけるかどうかの見分け',
      order: '式の数の順番',
      other: 'その他',
    };
    const ERR_KEYS = Object.keys(ERR);

    /* =========================================================
       小さな 道具
       ========================================================= */
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const pad2 = n => String(n).padStart(2, '0');
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    const rInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const range0 = n => Array.from({ length: n }, (_, i) => i);
    function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
    function ymd() { const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`; }
    function hashPin(pin) { let h = 2166136261; for (const c of 'hissan:' + pin) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
    function fnv(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
    const CURRENT = { settings: { ...DEFAULT_SETTINGS } };

    /* ---- ふりがな ----
       書き方： [漢字|よみ]  例：'[十|じゅう]のくらい' */
    const MARK_RE = /\[([^|\]]+)\|([^\]]+)\]/g;
    const stripMarkup = s => String(s).replace(MARK_RE, (m, k) => k);
    const KANJI_RE = /[一-鿿々]/;
    function R({ t, className, style }) {
      const s = String(t == null ? '' : t);
      const out = []; let last = 0; let m; let k = 0;
      const re = new RegExp(MARK_RE.source, 'g');
      const plain = (txt) => {
        if (KANJI_RE.test(txt) && window.__furiganaWarn) window.__furiganaWarn(txt, s);
        txt.split('\n').forEach((part, i) => { if (i > 0) out.push(<br key={'b' + (k++)} />); if (part) out.push(<React.Fragment key={'t' + (k++)}>{part}</React.Fragment>); });
      };
      while ((m = re.exec(s))) {
        plain(s.slice(last, m.index));
        out.push(<ruby key={'r' + (k++)}>{m[1]}<rt>{m[2]}</rt></ruby>);
        last = re.lastIndex;
      }
      plain(s.slice(last));
      return <span className={className} style={style}>{out}</span>;
    }
    // よく つかう ことば
    const W = {
      hiku: 'ひく[数|かず]', hikareru: 'ひかれる[数|かず]', juu: '[十|じゅう]のくらい', ichi: '1のくらい',
      suuji: '[数字|すうじ]', kazu: '[数|かず]',
    };
    const KANA_KO = ['ぜろこ', 'いっこ', 'にこ', 'さんこ', 'よんこ', 'ごこ', 'ろっこ', 'ななこ', 'はっこ', 'きゅうこ', 'じゅっこ'];
    // 読み上げ用の 文（記号を ことばに する）
    function speechText(s) {
      return String(s)
        .replace(MARK_RE, (m, k, y) => y)
        .replace(/\s*[−-]\s*(?=\d|□|ひく)/g, ' ひく ')
        .replace(/\s*[＋+]\s*/g, ' たす ')
        .replace(/\s*[＝=]\s*/g, ' は ')
        .replace(/□/g, 'しかく')
        .replace(/(^|[^\d])(\d)こ/g, (m, a, n) => a + (KANA_KO[Number(n)] || m))
        .replace(/10こ/g, 'じゅっこ')
        .replace(/1のくらい/g, 'いちのくらい')
        .replace(/[📝💡🔊▶◀✨🎉]/gu, '')
        .replace(/\n/g, '　');
    }

    /* =========================================================
       ほぞん（localStorage と IndexedDB）
       ========================================================= */
    const newDeviceId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    function normalizeState(s) {
      s = s && typeof s === 'object' ? s : {};
      return {
        version: 1, profile: s.profile || null, settings: { ...DEFAULT_SETTINGS, ...(s.settings || {}) },
        progress: s.progress && typeof s.progress === 'object' ? s.progress : {},
        acorns: Number(s.acorns) || 0, earned: Number(s.earned) || 0,
        owned: s.owned && typeof s.owned === 'object' ? s.owned : {},
        placed: s.placed && typeof s.placed === 'object' ? s.placed : {},
        sync: s.sync || {}, deviceId: s.deviceId || newDeviceId(),
      };
    }
    function loadState() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { s = null; }
      const st = normalizeState(s);
      if (!s || !s.deviceId) saveState(st);
      CURRENT.settings = st.settings;
      return st;
    }
    function saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { console.warn(e); } }

    // 入口ページ（Apps Script）から開いたとき、URLの # のあとに 記録の送り先と合言葉が ついてくる
    const REC_URL_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/|macros\/)s\/[A-Za-z0-9_-]+\/(exec|dev)$/;
    (function applyLinkConfig() {
      if (!location.hash) return;
      const h = new URLSearchParams(location.hash.slice(1));
      const rec = h.get('rec');
      if (!rec) return;
      if (REC_URL_RE.test(rec)) {
        const st = loadState();
        if (st.sync.url !== rec || st.sync.key !== (h.get('key') || '')) {
          saveState({ ...st, sync: { ...st.sync, url: rec, key: h.get('key') || '', lastSummary: null } });
        }
      }
      history.replaceState(null, '', location.pathname + location.search);
    })();

    const DB_NAME = 'kurumi-hissan';
    let dbPromise = null;
    function getDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath: 'id', autoIncrement: true }).createIndex('stageId', 'stageId');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }
    async function idbReq(storeName, mode, fn) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const req = fn(tx.objectStore(storeName));
        let result;
        if (req) req.onsuccess = () => { result = req.result; };
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }
    const DB = {
      add: (s, v) => idbReq(s, 'readwrite', st => st.add(v)),
      put: (s, v) => idbReq(s, 'readwrite', st => st.put(v)),
      getAll: (s) => idbReq(s, 'readonly', st => st.getAll()),
      clear: (s) => idbReq(s, 'readwrite', st => st.clear()),
    };

    function downloadFile(name, content, type) {
      const blob = content instanceof Blob ? content : new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
    function pickFile(accept) {
      return new Promise((resolve) => {
        const input = document.createElement('input'); input.type = 'file'; input.accept = accept;
        input.onchange = () => resolve(input.files && input.files[0] ? input.files[0] : null);
        input.click();
      });
    }

    /* =========================================================
       読み上げ・効果音・ファンファーレ
       ========================================================= */
    const TTS = {
      voice: null,
      init() {
        if (!('speechSynthesis' in window)) return;
        const choose = () => {
          const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
          this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
        };
        choose();
        speechSynthesis.onvoiceschanged = choose;
      },
      speak(markup, { force = false } = {}) {
        return new Promise(resolve => {
          if (!('speechSynthesis' in window) || !markup || (!CURRENT.settings.voice && !force)) return resolve();
          const text = speechText(markup);
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          const rate = Number(CURRENT.settings.rate) || 0.8;
          u.rate = rate; u.pitch = 1.1;
          let done = false;
          const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
          const timer = setTimeout(finish, 2000 + text.length * 400 / rate);
          u.onend = finish; u.onerror = finish;
          this.current = u; // Chrome で onend が 来なくなるのを ふせぐため 参照を のこす
          speechSynthesis.speak(u);
        });
      },
      cancel() { if ('speechSynthesis' in window) speechSynthesis.cancel(); },
    };
    TTS.init();

    let AUDIO = null;
    function audioCtx() {
      if (!CURRENT.settings.sfx) return null;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        AUDIO = AUDIO || new AC();
        if (AUDIO.state === 'suspended') AUDIO.resume();
        return AUDIO;
      } catch (e) { return null; }
    }
    function tone(ctx, { f, t, dur, type = 'sine', vol = 0.12, attack = 0.012, release = 0.08, dest }) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.setValueAtTime(vol, Math.max(t + attack, t + dur - release));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }
    const SFX_SEQ = {
      tap: [[660, 0.06]],
      pick: [[880, 0.07, 0.1]],
      ng: [[392, 0.16, 0.07], [330, 0.24, 0.06]],   // やさしい音（ブザーに しない）
      mark: [[587, 0.07, 0.1], [784, 0.1, 0.1]],
      count: [[988, 0.06, 0.08]],
      open: [[523, 0.08], [784, 0.12]],
    };
    function sfx(name) {
      const ctx = audioCtx(); if (!ctx) return;
      let t = ctx.currentTime + 0.01;
      (SFX_SEQ[name] || []).forEach(([f, dur, vol = 0.12]) => { tone(ctx, { f, t, dur, vol }); t += dur; });
    }
    // ファンファーレ（この アプリの ための オリジナルの ふし）
    const MIDI = { F4: 65, G4: 67, A4: 69, B4: 71, C5: 72, D5: 74, E5: 76, F5: 77, G5: 79, A5: 81, B5: 83, C6: 84, D6: 86, E6: 88, F6: 89, G6: 91 };
    const FANFARE = {
      ok: { beat: 0.11, notes: [['F4', 0, 1], ['A4', 1, 1], ['C5', 2, 1], ['F5', 3, 2], ['C5', 5, 1], [['A4', 'C5', 'F5', 'A5'], 6, 5]] },
      set: { beat: 0.12, notes: [['C5', 0, 1], ['D5', 1, 1], ['E5', 2, 1], ['G5', 3, 3], ['E5', 6, 1], ['G5', 7, 1], ['A5', 8, 1], ['G5', 9, 1], [['C5', 'E5', 'G5', 'C6'], 10, 8]] },
      clear: { beat: 0.12, notes: [['G4', 0, 1], ['C5', 1, 1], ['E5', 2, 1], ['G5', 3, 2], ['E5', 5, 1], ['G5', 6, 1], ['A5', 7, 2], ['G5', 9, 1], ['A5', 10, 1], ['C6', 11, 2], ['B5', 13, 1], ['C6', 14, 1], ['D6', 15, 2], [['G5', 'C6', 'E6', 'G6'], 17, 10]] },
      bag: { beat: 0.09, notes: [['C5', 0, 1], ['E5', 1, 1], ['G5', 2, 1], ['C6', 3, 1], ['E6', 4, 3]] },
    };
    function fanfare(kind) {
      const ctx = audioCtx(); if (!ctx) return;
      const def = FANFARE[kind] || FANFARE.ok;
      const t0 = ctx.currentTime + 0.03;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(ctx.destination);
      def.notes.forEach(([nm, at, len]) => {
        const chord = Array.isArray(nm);
        (chord ? nm : [nm]).forEach(x => {
          const f = 440 * Math.pow(2, (MIDI[x] - 69) / 12);
          const t = t0 + at * def.beat, dur = len * def.beat * 0.95;
          tone(ctx, { f, t, dur, type: 'square', vol: chord ? 0.025 : 0.04, release: 0.07, dest: lp });
          tone(ctx, { f, t, dur, type: 'triangle', vol: chord ? 0.06 : 0.1, release: 0.07 });
        });
      });
    }
    function acornSound(delay = 0) {
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime + 0.01 + delay;
      tone(ctx, { f: 1047, t, dur: 0.06, type: 'triangle', vol: 0.12 });
      tone(ctx, { f: 1568, t: t + 0.06, dur: 0.22, type: 'triangle', vol: 0.11, release: 0.18 });
    }
    function useTicker(ms, { loop = false, run = true, key } = {}) {
      const [t, setT] = useState(0);
      useEffect(() => {
        if (!run) { setT(0); return; }
        let raf; const start = performance.now();
        const tick = now => {
          let x = (now - start) / ms;
          x = loop ? x % 1 : Math.min(1, x);
          setT(x);
          if (loop || x < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [ms, loop, run, key]);
      return t;
    }

    /* =========================================================
       絵（すべて この アプリの ための オリジナル）
       ========================================================= */
    const f1 = v => Math.round(v * 10) / 10;
    // ---- クルミせんせい（りすの ぎんこういん。絵は Canva で作成）----
    // mood: normal / happy / think
    const KURUMI_IMG = { normal: 'img/kurumi.webp', happy: 'img/kurumi_happy.webp', think: 'img/kurumi_think.webp' };
    Object.values(KURUMI_IMG).forEach(src => { const im = new Image(); im.src = src; });
    function Kurumi({ mood = 'normal', talking = false, size = 140, className = '' }) {
      return (
        <img src={KURUMI_IMG[mood] || KURUMI_IMG.normal} alt="クルミせんせい" draggable="false"
             className={`kurumi ${talking ? 'talking' : ''} ${className}`} style={{ height: size * 1.2, width: 'auto', flex: 'none' }} />
      );
    }

    // ---- どんぐり ----
    function AcornShape({ x, y, r = 18 }) {
      return (
        <g pointerEvents="none">
          <ellipse cx={x} cy={y + r * 0.22} rx={r * 0.74} ry={r * 0.82} fill="#c9822f" stroke="#6b3a14" strokeWidth={Math.max(1.5, r * 0.1)} />
          <ellipse cx={x - r * 0.25} cy={y + r * 0.1} rx={r * 0.16} ry={r * 0.36} fill="#e8b26f" opacity=".8" />
          <path d={`M ${x - r * 0.9} ${y - r * 0.12} Q ${x} ${y - r * 1.2} ${x + r * 0.9} ${y - r * 0.12} Q ${x} ${y + r * 0.12} ${x - r * 0.9} ${y - r * 0.12} Z`} fill="#8a5a2b" stroke="#6b3a14" strokeWidth={Math.max(1.5, r * 0.1)} strokeLinejoin="round" />
          <path d={`M ${x - r * 0.45} ${y - r * 0.35} l ${r * 0.9} 0 M ${x - r * 0.25} ${y - r * 0.6} l ${r * 0.5} 0`} stroke="#b07a45" strokeWidth={Math.max(1, r * 0.08)} />
          <rect x={x - r * 0.08} y={y - r * 1.12} width={r * 0.16} height={r * 0.3} rx={r * 0.06} fill="#6b3a14" />
        </g>
      );
    }
    // halo：まわりの 色（green／red）、crossed：とった（青の ✕）
    const HALO = { green: '#059669', red: '#dc2626', blue: '#2563eb', gold: '#d97706' };
    function Acorn({ x, y, r = 18, halo, crossed, num, numColor }) {
      const useColor = CURRENT.settings.color !== false;
      const hc = halo && useColor ? HALO[halo] : halo ? '#94a3b8' : null;
      return (
        <g>
          {hc && !crossed && <circle cx={x} cy={y} r={r * 1.22} fill={hc} opacity=".14" stroke={hc} strokeWidth={Math.max(2, r * 0.12)} />}
          <g opacity={crossed ? 0.3 : 1}><AcornShape x={x} y={y} r={r} /></g>
          {crossed && <path d={`M ${x - r} ${y - r} L ${x + r} ${y + r} M ${x + r} ${y - r} L ${x - r} ${y + r}`} stroke={useColor ? HALO.blue : '#475569'} strokeWidth={Math.max(3, r * 0.2)} strokeLinecap="round" />}
          {num != null && (
            <g className="pop" style={{ transformOrigin: `${x}px ${y - r * 1.6}px` }}>
              <circle cx={x} cy={y - r * 1.75} r={r * 0.62} fill="#fff" stroke={numColor || '#0284c7'} strokeWidth="3" />
              <text x={x} y={y - r * 1.72} textAnchor="middle" dominantBaseline="central" fontSize={r * 0.82} fontWeight="900" fill={numColor || '#0369a1'}>{num}</text>
            </g>
          )}
        </g>
      );
    }
    // ---- 10この ふくろ ----
    function Bag({ x, y, s = 1, crossed, dashed, label = true }) {
      const useColor = CURRENT.settings.color !== false;
      return (
        <g transform={`translate(${x} ${y}) scale(${s})`} opacity={dashed ? 0.35 : 1}>
          <path d="M -26 -16 Q -40 30 -22 40 Q 0 48 22 40 Q 40 30 26 -16 Q 14 -24 0 -24 Q -14 -24 -26 -16 Z" fill="#d9a066" stroke="#6b3a14" strokeWidth="3.5" strokeLinejoin="round" strokeDasharray={dashed ? '6 5' : undefined} />
          <path d="M -14 -24 Q 0 -32 14 -24 L 10 -34 Q 0 -40 -10 -34 Z" fill="#c08345" stroke="#6b3a14" strokeWidth="3" strokeLinejoin="round" />
          <path d="M -16 -22 Q 0 -16 16 -22" fill="none" stroke="#7c2d12" strokeWidth="4" strokeLinecap="round" />
          {label && (
            <g>
              <circle cx="0" cy="12" r="15" fill="#fff" stroke={useColor ? HALO.green : '#475569'} strokeWidth="3" />
              <text x="0" y="13" textAnchor="middle" dominantBaseline="central" fontSize="17" fontWeight="900" fill={useColor ? HALO.green : '#1e293b'}>10</text>
            </g>
          )}
          {crossed && <path d="M -26 -26 L 26 38 M 26 -26 L -26 38" stroke={useColor ? HALO.blue : '#475569'} strokeWidth="6" strokeLinecap="round" />}
        </g>

    }
    function AcornIcon({ size = 26 }) {
      return <svg viewBox="-20 -24 40 44" width={size} height={size * 1.1} style={{ flex: 'none', verticalAlign: 'middle' }} aria-hidden="true"><AcornShape x={0} y={0} r={17} /></svg>;
    }
    function BagIcon({ size = 28 }) {
      return <svg viewBox="-34 -44 68 92" width={size} height={size * 92 / 68} style={{ flex: 'none', verticalAlign: 'middle' }} aria-hidden="true"><Bag x={0} y={0} s={1} /></svg>;
    }
    // どんぐりの かず（ふくろ ○こ ＋ ばら ○こ）
    function AcornCount({ n, size = 24 }) {
      return (
        <span className="row" style={{ gap: '.15rem', display: 'inline-flex' }}>
          <BagIcon size={size} /><span>{Math.floor(n / 10)}</span>
          <span style={{ width: '.25rem' }} />
          <AcornIcon size={size} /><span>{n % 10}</span>
        </span>
      );
    }
    // どんぐりが ヘッダーの さいふへ とんで いく
    const ACORN_HTML = '<svg viewBox="-20 -24 40 44" width="40" height="44"><ellipse cx="0" cy="4" rx="12.6" ry="14" fill="#c9822f" stroke="#6b3a14" stroke-width="2"/><path d="M -15.3 -2 Q 0 -20.4 15.3 -2 Q 0 2 -15.3 -2 Z" fill="#8a5a2b" stroke="#6b3a14" stroke-width="2"/><rect x="-1.4" y="-19" width="2.8" height="5" fill="#6b3a14"/></svg>';
    function flyAcorns(from, count = 1) {
      const target = document.getElementById('acorn-pill');
      if (!target || !from) return;
      const tr = target.getBoundingClientRect();
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'flyacorn';
        el.innerHTML = ACORN_HTML;
        el.style.left = (from.x - 20) + 'px'; el.style.top = (from.y - 22) + 'px';
        document.body.appendChild(el);
        const dx = tr.left + 18 - from.x, dy = tr.top + tr.height / 2 - from.y;
        if (el.animate) {
          const a = el.animate([
            { transform: 'translate(0,0) scale(.4)', opacity: 0 },
            { transform: 'translate(0,-40px) scale(1.3)', opacity: 1, offset: 0.25 },
            { transform: `translate(${dx}px, ${dy}px) scale(.6)`, opacity: 1 },
          ], { duration: 1000, delay: i * 160, easing: 'cubic-bezier(.5,0,.6,1)', fill: 'forwards' });

        } else setTimeout(() => el.remove(), 1200);

    const SvgText = ({ x, y, children, size = 30, color = '#1e293b', anchor = 'middle', weight = 900 }) => (

    const col = (role) => CURRENT.settings.color === false ? '#1e293b' : ({ hikareru: '#dc2626', hiku: '#2563eb', ten: '#059669', dec: '#b91c1c' })[role] || '#1e293b';

    /* ---- どんぐりと ふくろの 絵（ヒントと じゅんび）----

    function acornRow(n, x0, y, gap, r, opts = () => ({})) {

    function TenFrame({ x, y, r = 20, gap = 52, crossFrom = 10, halo = 'green', nums }) {

    }
    function countNums(k, list) { const o = {}; list.slice(0, k).forEach((idx, j) => { o[idx] = j + 1; }); return o; }
    function BankPic({ pic, t = 1 }) {
      if (!pic) return null;
      const P = pic;
      if (P.type === 'take10') {
        const rest = 10 - P.b0;
        const k = P.count ? Math.min(rest, Math.floor(t * (rest + 1.2))) : 0;
        return (
          <g>
            <Bag x={70} y={92} s={1.25} dashed />
            <SvgText x={70} y={168} size={20} color="#7c4a1e">あけた ふくろ</SvgText>

            <SvgText x={640} y={66} size={40}><tspan fill={col('ten')}>10</tspan> − <tspan fill={col('hiku')}>{P.b0}</tspan> ＝ {P.count && k >= rest ? rest : '？'}</SvgText>
            <SvgText x={640} y={130} size={22} color="#475569">{P.b0}こ とると のこりは？</SvgText>

        );
      }
      if (P.type === 'add') {
        const gap = 54, x0 = 70;
        const order = range0(P.x + P.y);
        const k = P.count ? Math.min(order.length, Math.floor(t * (order.length + 1.2))) : 0;
        const nums = P.count ? countNums(k, order) : {};
        return (
          <g>
            {acornRow(P.x, x0, 110, gap, 20, i => ({ halo: 'green', num: nums[i], numColor: HALO.green }))}
            <SvgText x={x0 + P.x * gap - gap / 2 + 4} y={110} size={40}>＋</SvgText>
            {acornRow(P.y, x0 + P.x * gap + 18, 110, gap, 20, i => ({ halo: 'red', num: nums[P.x + i], numColor: HALO.red }))}
            <SvgText x={680} y={110} size={40}>{P.x} ＋ <tspan fill={col('hikareru')}>{P.y}</tspan> ＝ {P.count && k >= order.length ? P.x + P.y : '？'}</SvgText>
          </g>
        );
      }
      if (P.type === 'ones') {
        const rest = 10 - P.b0;
        const order = range0(rest).concat(range0(P.a0).map(i => 10 + i));
        const k = P.count ? Math.min(order.length, Math.floor(t * (order.length + 1.2))) : 0;
        const nums = P.count ? countNums(k, order) : {};
        return (
          <g>
            <TenFrame x={56} y={70} r={18} gap={46} crossFrom={rest} nums={nums} />
            <SvgText x={56 + 46 * 5 - 6} y={92} size={40}>＋</SvgText>
            {P.a0 === 0 ? <SvgText x={340} y={92} size={26} color={col('hikareru')}>ばらは 0こ</SvgText>
              : range0(P.a0).map(i => <Acorn key={i} x={330 + (i % 4) * 44} y={70 + Math.floor(i / 4) * 54} r={18} halo="red" num={nums[10 + i]} numColor={HALO.red} />)}
            <SvgText x={640} y={66} size={34}><tspan fill={col('ten')}>10</tspan> − <tspan fill={col('hiku')}>{P.b0}</tspan> ＋ <tspan fill={col('hikareru')}>{P.a0}</tspan></SvgText>
            <SvgText x={640} y={124} size={34}>＝ {P.count && k >= order.length ? rest + P.a0 : '？'}</SvgText>
          </g>
        );
      }
      if (P.type === 'open') {
        // まえ： A1ふくろ ＋ ばら A0こ → あと： (A1−1)ふくろ ＋ 10こ ＋ ばら A0こ
        return (
          <g>
            <SvgText x={200} y={14} size={20} color="#475569">いま</SvgText>
            {range0(P.a1).map(i => <Bag key={i} x={40 + i * 36} y={58} s={0.5} />)}
            {range0(P.a0).map(i => <Acorn key={i} x={50 + (i % 4) * 30} y={112 + Math.floor(i / 4) * 30} r={12} halo="red" />)}
            {P.a0 === 0 && <SvgText x={90} y={118} size={20} color={col('hikareru')}>ばらは 0こ</SvgText>}
            <SvgText x={200} y={180} size={20} color="#7c4a1e">ばら {P.a0}こから {P.b0}こは とれない</SvgText>
            <SvgText x={414} y={90} size={44} color="#d97706">➡</SvgText>
            <SvgText x={620} y={14} size={20} color="#475569">ふくろを 1つ あけると</SvgText>
            {range0(P.a1 - 1).map(i => <Bag key={i} x={470 + i * 36} y={58} s={0.5} />)}
            {range0(10).map(i => <Acorn key={'t' + i} x={470 + (i % 5) * 28} y={108 + Math.floor(i / 5) * 30} r={11} halo="green" />)}
            {range0(P.a0).map(i => <Acorn key={'l' + i} x={630 + (i % 4) * 28} y={108 + Math.floor(i / 4) * 30} r={11} halo="red" />)}
            <SvgText x={620} y={180} size={20} color="#7c4a1e">10こから {P.b0}こ とれるね</SvgText>
          </g>
        );
      }
      if (P.type === 'tens') {
        const k = P.count ? Math.min(P.dec - P.b1, Math.floor(t * (P.dec - P.b1 + 1.2))) : 0;
        const g = Math.min(66, 480 / Math.max(1, P.dec)), bs = Math.min(0.9, g / 72);
        return (
          <g>
            {range0(P.dec).map(i => <Bag key={i} x={60 + i * g} y={84} s={bs} crossed={i >= P.dec - P.b1} />)}
            {P.count && range0(k).map(i => <g key={'n' + i}><circle cx={60 + i * g} cy={22} r="15" fill="#fff" stroke="#0284c7" strokeWidth="3" /><text x={60 + i * g} y={23} textAnchor="middle" dominantBaseline="central" fontSize="18" fontWeight="900" fill="#0369a1">{i + 1}</text></g>)}
            <SvgText x={680} y={84} size={38}><tspan fill={col('dec')}>{P.dec}</tspan> − <tspan fill={col('hiku')}>{P.b1}</tspan> ＝ {P.count && k >= P.dec - P.b1 ? P.dec - P.b1 : '？'}</SvgText>
            <SvgText x={350} y={170} size={22} color="#475569">ふくろ {P.dec}こから {P.b1}こ とると？</SvgText>
          </g>
        );
      }
      if (P.type === 'dec') {
        return (
          <g>
            {range0(P.a1).map(i => { const g = Math.min(66, 480 / P.a1); return <Bag key={i} x={60 + i * g} y={84} s={Math.min(0.9, g / 72)} dashed={i === P.a1 - 1} />; })}
            <SvgText x={Math.max(130, 60 + (P.a1 - 1) * Math.min(66, 480 / P.a1))} y={164} size={20} color="#b45309">1のくらいに かした</SvgText>
            <SvgText x={690} y={84} size={38}><tspan fill={col('hikareru')}>{P.a1}</tspan> − 1 ＝ {P.show ? P.a1 - 1 : '？'}</SvgText>
          </g>
        );
      }
      return null;
    }

    /* =========================================================
       ひっ算の 絵（プリントと 同じ ならび）
       ========================================================= */
    // 位置：左から 記号・十のくらい・1のくらい。上から くりさがりの だん・ひかれる数・ひく数・こたえ
    const HG = { sx: 76, tx: 162, ox: 262, by: 40, my: 122, sy: 222, line: 272, ay: 332 };
    const FORM_POS = {
      two: { f_b0: [520, 122], f_r1: [660, 122], f_r1c: [398, 222], f_a0: [520, 222], f_sum: [660, 222] },
      one: { f_b0: [520, 122], f_a0: [656, 122], f_sum: [656, 222] },
    };
    const digits = (p) => ({ A1: Math.floor(p.a / 10), A0: p.a % 10, B1: Math.floor(p.b / 10), B0: p.b % 10 });

    // 数字を いれる 四角
    function CellBox({ x, y, w = 76, h = 84, v, guide, active, color = '#1e293b', size = 60, boxed = true, zero }) {
      const showBox = boxed || active;
      return (
        <g pointerEvents="none">
          {showBox && <rect x={x - w / 2} y={y - h / 2} width={w} height={h} rx="10" fill={active ? '#fffbeb' : '#fff'} stroke={active ? '#f59e0b' : '#94a3b8'} strokeWidth={active ? 5 : 3} strokeDasharray={active ? '10 6' : undefined} />}
          {active && <rect x={x - w / 2 - 6} y={y - h / 2 - 6} width={w + 12} height={h + 12} rx="14" fill="none" stroke="#fbbf24" strokeWidth="4" className="pulse" />}
          {v != null && !zero && <text x={x} y={y + 3} textAnchor="middle" dominantBaseline="central" fontSize={size} fontWeight="900" fill={color} className="pop" style={{ transformOrigin: `${x}px ${y}px` }}>{v}</text>}
          {v != null && zero && (
            <g>
              <text x={x} y={y + 3} textAnchor="middle" dominantBaseline="central" fontSize={size} fontWeight="900" fill="#cbd5e1">0</text>
              <path d={`M ${x - 22} ${y + 26} L ${x + 22} ${y - 22}`} stroke="#94a3b8" strokeWidth="4" strokeLinecap="round" />
            </g>
          )}
          {v == null && guide != null && <text x={x} y={y + 3} textAnchor="middle" dominantBaseline="central" fontSize={size} fontWeight="700" fill="#cbd5e1">{guide}</text>}
        </g>
      );
    }
    function GlowRect({ x, y, w, h }) {
      return <rect x={x - w / 2} y={y - h / 2} width={w} height={h} rx="14" fill="rgba(251,191,36,.18)" stroke="#f59e0b" strokeWidth="6" className="pulse" pointerEvents="none" />;
    }

    /* v：ひっ算の ようす
       marked（しるし）, markGuide（うすい しるし）, decMode（'auto'：小さな数を 自動で 出す／'input'：自分で 入れる）,
       vals（入れた 数字）, guides（うすい 数字）, active（いま 入れる ところ）, glow（光らせる ところ）,
       form（'two'／'one'／'memo'（とじた メモ）／null）, given（はじめから 出ている 数字）, hideB1, onTap, onMemo */
    function HissanView({ p, v }) {
      const { A1, A0, B1, B0 } = digits(p);
      const vals = v.vals || {}, guides = v.guides || {}, glow = v.glow || [];
      const dec = A1 - 1, r1 = 10 - B0, sum = r1 + A0;
      const tap = id => v.onTap ? (e) => { if (e.cancelable) e.preventDefault(); v.onTap(id); } : undefined;
      const digit = (id, x, y, n, role, show = true) => (
        <g key={id} onPointerDown={tap(id)} style={v.onTap ? { cursor: 'pointer' } : undefined} data-dig={id}>
          <rect x={x - 48} y={y - 48} width="96" height="96" fill="transparent" />
          {show && <text x={x} y={y + 4} textAnchor="middle" dominantBaseline="central" fontSize="78" fontWeight="900" fill={col(role)} pointerEvents="none">{n}</text>}
        </g>
      );
      const has = id => glow.includes(id);
      const form = v.form;
      const fp = form === 'two' ? FORM_POS.two : form === 'one' ? FORM_POS.one : null;
      const given = v.given || {};
      const fCell = (id, value, role) => {
        const [x, y] = fp[id];
        if (given[id]) return <text key={id} x={x} y={y + 3} textAnchor="middle" dominantBaseline="central" fontSize="60" fontWeight="900" fill={col(role)}>{value}</text>;
        return <CellBox key={id} x={x} y={y} v={vals[id]} guide={guides[id]} active={v.active === id} color={col(role)} />;
      };
      const zeroTens = vals.h_tens === 0 && A1 - 1 - B1 === 0;
      return (
        <g>
          {/* ます目（点線）*/}
          <g stroke="#cbd5e1" strokeWidth="2" strokeDasharray="7 6" fill="none" pointerEvents="none">
            {[112, 212].map(x => <rect key={x} x={x} y={8} width="100" height="64" />)}
            {[72, 172, 282].map(y => <rect key={y} x={40} y={y} width="272" height="100" />)}
            {[112, 212].map(x => <line key={'v' + x} x1={x} y1={72} x2={x} y2={382} />)}
          </g>
          <line x1="40" y1={HG.line} x2="312" y2={HG.line} stroke="#1e293b" strokeWidth="5" />
          <text x={HG.sx} y={HG.sy + 2} textAnchor="middle" dominantBaseline="central" fontSize="70" fontWeight="900" fill="#1e293b">−</text>
          {/* ひかれる数・ひく数 */}
          {digit('mt', HG.tx, HG.my, A1, 'hikareru')}
          {digit('mo', HG.ox, HG.my, A0, 'hikareru')}
          {digit('st', HG.tx, HG.sy, B1, 'hiku', !v.hideB1)}
          {digit('so', HG.ox, HG.sy, B0, 'hiku')}
          {/* くりさがりの しるし */}
          {(v.marked || v.markGuide) && (
            <g pointerEvents="none" opacity={v.marked ? 1 : 0.5}>
              <line x1={HG.tx + 30} y1={HG.my - 40} x2={HG.tx - 30} y2={HG.my + 42} stroke={v.marked ? '#475569' : '#94a3b8'} strokeWidth="6" strokeLinecap="round" strokeDasharray={v.marked ? undefined : '8 7'} />
              <text x={HG.ox} y={HG.by + 2} textAnchor="middle" dominantBaseline="central" fontSize="40" fontWeight="900" fill={v.marked ? col('ten') : '#cbd5e1'}>10</text>
              {(v.decMode === 'auto' || !v.marked) && <text x={HG.tx} y={HG.by + 2} textAnchor="middle" dominantBaseline="central" fontSize="44" fontWeight="900" fill={v.marked ? col('dec') : '#cbd5e1'}>{dec}</text>}
            </g>
          )}
          {v.marked && v.decMode === 'input' && <CellBox x={HG.tx} y={HG.by} w={64} h={56} size={42} v={vals.h_dec} guide={guides.h_dec} active={v.active === 'h_dec'} color={col('dec')} boxed={v.active === 'h_dec' || vals.h_dec != null} />}
          {/* こたえ */}
          <CellBox x={HG.tx} y={HG.ay} w={84} h={88} size={72} v={vals.h_tens} guide={guides.h_tens} active={v.active === 'h_tens'} boxed={false} zero={zeroTens} />
          <CellBox x={HG.ox} y={HG.ay} w={84} h={88} size={72} v={vals.h_ones} guide={guides.h_ones} active={v.active === 'h_ones'} boxed={false} />
          {zeroTens && <SvgText x={HG.tx} y={HG.ay + 64} size={20} color="#64748b">0は かかない</SvgText>}
          {/* ひかる ところ */}
          {has('mt') && <GlowRect x={HG.tx} y={HG.my} w={90} h={92} />}
          {has('mo') && <GlowRect x={HG.ox} y={HG.my} w={90} h={92} />}
          {has('st') && <GlowRect x={HG.tx} y={HG.sy} w={90} h={92} />}
          {has('so') && <GlowRect x={HG.ox} y={HG.sy} w={90} h={92} />}
          {/* 1のくらいの 式 */}
          {(form === 'two' || form === 'one' || form === 'memo') && (
            <path d={`M 322 82 L 342 ${(HG.my + HG.sy) / 2} L 322 262`} fill="none" stroke="#dc2626" strokeWidth="4" strokeLinejoin="round" pointerEvents="none" opacity={CURRENT.settings.color === false ? 0.5 : 1} />
          )}
          {(form === 'two' || form === 'one') && <SvgText x={420} y={60} size={20} color="#64748b" weight={700}>1のくらい</SvgText>}
          {form === 'two' && (
            <g>
              <text x={398} y={125} textAnchor="middle" dominantBaseline="central" fontSize="60" fontWeight="900" fill={col('ten')}>10</text>
              <text x={458} y={125} textAnchor="middle" dominantBaseline="central" fontSize="56" fontWeight="900">−</text>
              <text x={590} y={125} textAnchor="middle" dominantBaseline="central" fontSize="56" fontWeight="900">＝</text>
              <text x={458} y={225} textAnchor="middle" dominantBaseline="central" fontSize="56" fontWeight="900">＋</text>
              <text x={590} y={225} textAnchor="middle" dominantBaseline="central" fontSize="56" fontWeight="900">＝</text>
              {fCell('f_b0', B0, 'hiku')}{fCell('f_r1', r1)}{fCell('f_r1c', r1)}{fCell('f_a0', A0, 'hikareru')}{fCell('f_sum', sum)}
            </g>
          )}
          {form === 'one' && (
            <g>
              <text x={398} y={125} textAnchor="middle" dominantBaseline="central" fontSize="60" fontWeight="900" fill={col('ten')}>10</text>
              <text x={458} y={125} textAnchor="middle" dominantBaseline="central" fontSize="56" fontWeight="900">−</text>
              <text x={588} y={125} textAnchor="middle" dominantBaseline="central" fontSize="56" fontWeight="900">＋</text>
              <text x={588} y={225} textAnchor="middle" dominantBaseline="central" fontSize="56" fontWeight="900">＝</text>
              {fCell('f_b0', B0, 'hiku')}{fCell('f_a0', A0, 'hikareru')}{fCell('f_sum', sum)}
            </g>
          )}
          {form === 'memo' && (
            <g onPointerDown={v.onMemo ? (e) => { if (e.cancelable) e.preventDefault(); v.onMemo(); } : undefined} style={v.onMemo ? { cursor: 'pointer' } : undefined} data-memo="1">
              <rect x={360} y={78} width={400} height={188} rx="18" fill="#fff" stroke="#94a3b8" strokeWidth="3" strokeDasharray="10 8" />
              <SvgText x={560} y={126} size={30} color="#475569">📝 けいさんメモ</SvgText>
              <SvgText x={560} y={178} size={26} color="#475569" weight={700}><tspan fill={col('ten')}>10</tspan> − <tspan fill={col('hiku')}>ひくかず</tspan> ＋ <tspan fill={col('hikareru')}>ひかれるかず</tspan></SvgText>
              {v.onMemo && <SvgText x={560} y={226} size={20} color="#94a3b8" weight={700}>おすと しきが でるよ</SvgText>}
            </g>
          )}
          {fp && Object.keys(fp).filter(has).map(id => <GlowRect key={'g' + id} x={fp[id][0]} y={fp[id][1]} w={92} h={100} />)}
          {has('h_ones') && <GlowRect x={HG.ox} y={HG.ay} w={92} h={96} />}
        </g>
      );
    }
    // おはなしの 問題の 式（□□ − □□）
    function ExprView({ v }) {
      const vals = v.vals || {};
      const cell = (id, x) => <CellBox key={id} x={x} y={190} w={96} h={110} size={84} v={vals[id]} active={v.active === id} color={col(id.startsWith('e_a') ? 'hikareru' : 'hiku')} />;
      return (
        <g>
          <SvgText x={400} y={70} size={30} color="#7c4a1e">しきを つくろう</SvgText>
          {cell('e_a1', 160)}{cell('e_a0', 262)}
          <text x={400} y={194} textAnchor="middle" dominantBaseline="central" fontSize="80" fontWeight="900">−</text>
          {cell('e_b1', 538)}{cell('e_b0', 640)}
          <SvgText x={211} y={278} size={22} color={col('hikareru')} weight={700}>はじめの かず</SvgText>
          <SvgText x={589} y={278} size={22} color={col('hiku')} weight={700}>ひく かず</SvgText>
        </g>
      );
    }

    /* ---- ホームの けしき（もりの どんぐりぎんこう。絵は Canva で作成）---- */
    function BankScene({ onKurumi, talking, mood = 'normal', bags = 0, friends = [] }) {
      return (
        <svg viewBox="0 0 1000 750" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <image href="img/bank.webp" x="0" y="0" width="1000" height="750" preserveAspectRatio="xMidYMid slice" />
          {/* かんばん */}
          <text x="603" y="252" textAnchor="middle" dominantBaseline="central" fontSize="31" fontWeight="900" fill="#5b3412" stroke="#f5deb3" strokeWidth="5" paintOrder="stroke">どんぐり ぎんこう</text>
          {/* ちょきんの ふくろ */}
          <g>{range0(Math.min(bags, 12)).map(i => <Bag key={i} x={790 + (i % 4) * 46} y={690 - Math.floor(i / 4) * 52} s={0.62} />)}</g>
          {/* あそびに きた ともだち */}
          <g>{friends.slice(0, 8).map((f, i) => <text key={f.id} x={330 + i * 58} y={680} textAnchor="middle" dominantBaseline="central" fontSize="50" className="emoji">{f.e}</text>)}</g>
          {/* クルミせんせい */}
          <g style={{ cursor: 'pointer' }} onClick={onKurumi}>
            <image href={KURUMI_IMG[mood] || KURUMI_IMG.normal} x="20" y="360" height="380" width="290" preserveAspectRatio="xMidYMax meet" className={talking ? 'kurumi talking' : 'kurumi'} />
          </g>
        </svg>
      );
    }

    /* ---- もりの おうち（なかの ようす）---- */
    const SPOTS = [
      { id: 'tenjo', name: 'てんじょう', x: 560, y: 70 },
      { id: 'mado', name: 'まど', x: 258, y: 190 },
      { id: 'kabe1', name: 'かべ（まんなか）', x: 500, y: 230 },
      { id: 'kabe2', name: 'かべ（みぎ）', x: 780, y: 330 },
      { id: 'tana1', name: 'たな（ひだり）', x: 700, y: 150 },
      { id: 'tana2', name: 'たな（みぎ）', x: 840, y: 150 },
      { id: 'tsukue', name: 'つくえの うえ', x: 197, y: 355 },
      { id: 'yuka1', name: 'ゆか ①', x: 110, y: 640 },
      { id: 'yuka2', name: 'ゆか ②', x: 420, y: 615 },
      { id: 'yuka3', name: 'ゆか ③', x: 640, y: 615 },
      { id: 'yuka4', name: 'ゆか ④', x: 900, y: 610 },
    ];
    const SPOT_MAP = Object.fromEntries(SPOTS.map(s => [s.id, s]));
    const CIRCLED = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩', '⑪', '⑫'];
    function HouseScene({ placed = {}, showNums = true, pickSpot, hl }) {
      const bySpot = {};
      Object.entries(placed).forEach(([itemId, spot]) => { if (ITEM_MAP[itemId]) bySpot[spot] = ITEM_MAP[itemId]; });
      return (
        <svg viewBox="0 0 1000 750" style={{ width: '100%', height: 'auto', display: 'block', borderRadius: '1.2rem' }} aria-hidden="true">
          <image href="img/house.webp" x="0" y="0" width="1000" height="750" preserveAspectRatio="xMidYMid slice" />
          {SPOTS.map((s, i) => {
            const it = bySpot[s.id];
            const on = hl === s.id;
            return (
              <g key={s.id} onPointerDown={pickSpot ? (e) => { if (e.cancelable) e.preventDefault(); pickSpot(s.id); } : undefined} style={pickSpot ? { cursor: 'pointer' } : undefined} data-spot={s.id}>
                {(!it || pickSpot) && <circle cx={s.x} cy={s.y} r="46" fill={pickSpot ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.35)'} stroke={on ? '#f59e0b' : '#a8a29e'} strokeWidth={on ? 7 : 3} strokeDasharray="9 7" />}
                {it && <text x={s.x} y={s.y + 4} textAnchor="middle" dominantBaseline="central" fontSize="82" className="emoji">{it.e}</text>}
                {showNums && (!it || pickSpot) && <text x={s.x + (it ? 38 : 0)} y={s.y + (it ? -38 : 2)} textAnchor="middle" dominantBaseline="central" fontSize={it ? 30 : 36} fontWeight="900" fill="#7c4a1e" stroke="#fff" strokeWidth="5" paintOrder="stroke">{CIRCLED[i]}</text>}
              </g>
            );
          })}
        </svg>
      );
    }

    function Confetti() {
      const pieces = useMemo(() => Array.from({ length: 46 }, (_, i) => ({ i, left: Math.random() * 100, delay: Math.random() * 0.9, dur: 2.4 + Math.random() * 1.8, ch: pick(['🌰', '🍂', '⭐', '✨', '🍁', '🎉', '🌟']), size: 24 + Math.random() * 18 })), []);
      return <>{pieces.map(p => <div key={p.i} className="confetti" style={{ left: p.left + 'vw', animationDuration: p.dur + 's', animationDelay: p.delay + 's', fontSize: p.size }}>{p.ch}</div>)}</>;
    }

    /* =========================================================
       ステップ
       form：1のくらいの 式（two：2つの式／one：1つの式／memo：メモで出す／none：出さない（ヒントで出す））
       ========================================================= */
    const STAGES = [
      { id: 'j1', grp: 'prep', label: 'じゅんび①', name: '10 − □', sub: '10この ふくろから とる', kind: 'ten', friend: 'usagi' },
      { id: 'j2', grp: 'prep', label: 'じゅんび②', name: '□ ＋ □', sub: 'のこりと ばらを あわせる', kind: 'add', friend: 'harinezumi' },
      { id: 'j3', grp: 'prep', label: 'じゅんび③', name: 'くりさがりの しるし', sub: 'ひける？ ひけない？', kind: 'judge', friend: 'araiguma' },
      { id: 's1', grp: 'main', label: 'ステップ1', name: 'なぞって おぼえよう', sub: 'うすい [数字|すうじ]と おなじ ボタンを おす', kind: 'hissan', form: 'two', trace: true, rule: true, friend: 'kitsune' },
      { id: 's2', grp: 'main', label: 'ステップ2', name: '□に [数字|すうじ]を かこう', sub: 'しきの こたえを かく', kind: 'hissan', form: 'two', given: ['f_b0', 'f_a0'], rule: true, friend: 'fukurou' },
      { id: 's3', grp: 'main', label: 'ステップ3', name: 'しきの [数字|すうじ]も じぶんで', sub: 'ひく[数|かず]・ひかれる[数|かず]も いれる', kind: 'hissan', form: 'two', rule: true, friend: 'kaeru' },
      { id: 's4', grp: 'main', label: 'ステップ4', name: '1つの しきに しよう', sub: '10 − □ ＋ □ ＝ □', kind: 'hissan', form: 'one', rule: true, friend: 'kuma' },
      { id: 's5', grp: 'main', label: 'ステップ5', name: 'メモを つかって', sub: 'こまったら 📝メモ', kind: 'hissan', form: 'memo', zero: true, rule: true, friend: 'shika' },
      { id: 's6', grp: 'main', label: 'ステップ6', name: 'ひっさんだけで', sub: 'しきは ヒントで でる', kind: 'hissan', form: 'none', zero: true, decInput: true, friend: 'inoshishi' },
      { id: 'h1', grp: 'adv', label: 'はってん ア', name: '2けた − 1けた', sub: '42 − 7 など', kind: 'hissan', form: 'memo', decInput: true, gen: 'oneDigit', friend: 'kotori' },
      { id: 'h2', grp: 'adv', label: 'はってん イ', name: 'こたえが 1けた', sub: '43 − 36 など', kind: 'hissan', form: 'memo', decInput: true, gen: 'small', friend: 'tentoumushi' },
      { id: 'h3', grp: 'adv', label: 'はってん ウ', name: 'おはなしの もんだい', sub: 'しきを つくって ひっさん', kind: 'hissan', form: 'memo', story: true, zero: true, friend: 'chou' },
    ];
    const STAGE_MAP = Object.fromEntries(STAGES.map(s => [s.id, s]));
    const MAIN_IDS = ['j1', 'j2', 'j3', 's1', 's2', 's3', 's4', 's5', 's6'];
    const ADV_IDS = ['h1', 'h2', 'h3'];

    /* ---- あそびに くる ともだち（ステップを クリアすると くる）---- */
    const FRIENDS = [
      { id: 'usagi', e: '🐰', name: 'うさぎさん' },
      { id: 'harinezumi', e: '🦔', name: 'はりねずみさん' },
      { id: 'araiguma', e: '🦝', name: 'あらいぐまさん', alt: ['🐿️', 'しまりすさん'] },
      { id: 'kitsune', e: '🦊', name: 'きつねさん' },
      { id: 'fukurou', e: '🦉', name: 'ふくろうさん' },
      { id: 'kaeru', e: '🐸', name: 'かえるさん' },
      { id: 'kuma', e: '🐻', name: 'くまさん' },
      { id: 'shika', e: '🦌', name: 'しかさん' },
      { id: 'inoshishi', e: '🐗', name: 'いのししさん' },
      { id: 'kotori', e: '🐦', name: 'ことりさん' },
      { id: 'tentoumushi', e: '🐞', name: 'てんとうむしさん' },
      { id: 'chou', e: '🦋', name: 'ちょうちょさん' },
    ];

    /* ---- もりの おうちの かぐ・かざり（どんぐりで かう）---- */
    const SHOP = [
      { id: 'kagu', name: 'かぐ', icon: '🛋️', items: [['🪑', 'いす', 6, ['💺', 'いす']], ['📚', 'ほんだな', 8], ['🧸', 'くまの ぬいぐるみ', 7], ['🕰️', 'おきどけい', 10], ['🛏️', 'ベッド', 12], ['🛋️', 'ソファ', 15], ['📺', 'テレビ', 18], ['🎹', 'ピアノ', 20]] },
      { id: 'kazari', name: 'かざり', icon: '🖼️', items: [['🎈', 'ふうせん', 3], ['⭐', 'ほし', 3], ['🔔', 'すず', 4], ['🖼️', 'え', 5], ['🏮', 'ちょうちん', 6], ['🪞', 'かがみ', 7, ['🕯️', 'ろうそく']], ['🎏', 'こいのぼり', 8], ['🌈', 'にじ', 9]] },
      { id: 'mori', name: 'しょくぶつ・たべもの', icon: '🌻', items: [['🍎', 'りんご', 2], ['🍄', 'きのこ', 3], ['🌷', 'チューリップ', 3], ['🌻', 'ひまわり', 4], ['🌵', 'サボテン', 5], ['🧁', 'カップケーキ', 5], ['🍯', 'はちみつ', 6], ['🎂', 'ケーキ', 12]] },
    ];
    // 古い Chromebook で 出ない 絵文字は、べつの ものに 入れかえる
    function emojiSupported(ch) {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 40;
        const x = c.getContext('2d', { willReadFrequently: true });
        x.textBaseline = 'top'; x.font = '32px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
        x.fillStyle = '#000'; x.fillText(ch, 2, 2);
        const d = x.getImageData(0, 0, 40, 40).data;
        for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 40 && (Math.abs(d[i] - d[i + 1]) > 24 || Math.abs(d[i + 1] - d[i + 2]) > 24)) return true;
        return false;
      } catch (e) { return true; }
    }
    SHOP.forEach(cat => {
      cat.list = cat.items.map(([e, name, price, alt], i) => {
        let item = { id: `${cat.id}-${i}`, cat: cat.id, e, name, price };
        if (alt && !emojiSupported(e)) item = { ...item, e: alt[0], name: alt[1] };
        return item;
      });
    });
    FRIENDS.forEach(f => { if (f.alt && !emojiSupported(f.e)) { f.e = f.alt[0]; f.name = f.alt[1]; } });
    const FRIEND_MAP = Object.fromEntries(FRIENDS.map(f => [f.id, f]));
    const ALL_ITEMS = SHOP.flatMap(c => c.list);
    const ITEM_MAP = Object.fromEntries(ALL_ITEMS.map(it => [it.id, it]));

    /* =========================================================
       問題を つくる（1かい ＝ 5問。毎回 ちがう 問題）
       ========================================================= */
    // 2けた − 2けた、1のくらいで くりさがる、こたえは 2けた
    function genPair({ zero = false } = {}) {
      const A1 = rInt(3, 9), B1 = rInt(1, A1 - 2);
      const A0 = zero ? 0 : rInt(1, 8), B0 = rInt(A0 + 1, 9);
      return { a: A1 * 10 + A0, b: B1 * 10 + B0 };
    }
    const STORIES = [
      { t: 'どんぐりぎんこうに どんぐりが {a}こ あります。\nうさぎさんが {b}こ ひきだしました。\nのこりは なんこですか。', u: 'こ' },
      { t: 'りすさんは どんぐりを {a}こ もって います。\nともだちに {b}こ あげました。\nのこりは なんこですか。', u: 'こ' },
      { t: 'かごに くりが {a}こ あります。\nみんなで {b}こ たべました。\nのこりは なんこですか。', u: 'こ' },
      { t: 'きのみが {a}こ あります。\n{b}こ つかって ケーキを つくりました。\nのこりは なんこですか。', u: 'こ' },
      { t: 'はっぱが {a}まい あります。\nかぜで {b}まい とんで いきました。\nのこりは なんまいですか。', u: 'まい' },
      { t: 'どんぐりを {a}こ ひろいました。\nぎんこうに {b}こ あずけました。\nてもとに のこった どんぐりは なんこですか。', u: 'こ' },
    ];
    function genOne(stage, i, zeroAt) {
      if (stage.kind === 'ten') return null;
      if (stage.gen === 'oneDigit') {
        const A1 = rInt(2, 9), A0 = Math.random() < 0.15 ? 0 : rInt(1, 8), B0 = rInt(A0 + 1, 9);
        return { a: A1 * 10 + A0, b: B0 };
      }
      if (stage.gen === 'small') {
        const A1 = rInt(2, 9), A0 = Math.random() < 0.15 ? 0 : rInt(1, 8), B0 = rInt(A0 + 1, 9);
        return { a: A1 * 10 + A0, b: (A1 - 1) * 10 + B0 };
      }
      return genPair({ zero: stage.zero && i === zeroAt });
    }
    function genSet(stage) {
      const out = [];
      const seen = new Set();
      if (stage.kind === 'ten') {
        return shuffle(range0(9).map(i => i + 1)).slice(0, PER_SET).map(n => ({ n, key: `10-${n}` }));
      }
      if (stage.kind === 'add') {
        const all = [];
        for (let x = 1; x <= 8; x++) for (let y = 1; x + y <= 9; y++) all.push({ x, y, key: `${x}+${y}` });
        return shuffle(all).slice(0, PER_SET);
      }
      if (stage.kind === 'judge') {
        const kinds = shuffle([true, true, true, false, false]);
        return kinds.map(borrow => {
          for (let t = 0; t < 30; t++) {
            let q;
            if (borrow) q = genPair();
            else { const A1 = rInt(3, 9), B1 = rInt(1, A1 - 1), A0 = rInt(1, 9), B0 = rInt(1, A0); q = { a: A1 * 10 + A0, b: B1 * 10 + B0 }; }
            if (!seen.has(q.a + '-' + q.b)) { seen.add(q.a + '-' + q.b); return { ...q, borrow, key: q.a + '-' + q.b }; }
          }
          return { ...genPair(), borrow: true };
        });
      }
      const zeroAt = stage.zero ? rInt(1, PER_SET - 1) : -1;
      let prevB0 = -1;
      for (let i = 0; i < PER_SET; i++) {
        let q = null;
        for (let t = 0; t < 40; t++) {
          q = genOne(stage, i, zeroAt);
          const k = q.a + '-' + q.b;
          if (!seen.has(k) && (q.b % 10 !== prevB0 || t > 30)) break;
        }
        seen.add(q.a + '-' + q.b); prevB0 = q.b % 10;
        if (stage.story) { const s = STORIES[(i + rInt(0, STORIES.length - 1)) % STORIES.length]; q = { ...q, story: s.t, unit: s.u }; }
        out.push({ ...q, key: q.a + '-' + q.b });
      }
      return out;
    }
    const probLabel = (stage, p) => stage.kind === 'ten' ? `10 − ${p.n}` : stage.kind === 'add' ? `${p.x} ＋ ${p.y}` : `${p.a} − ${p.b}` + (stage.kind === 'judge' ? '（ひける？）' : '');
    const probCorrect = (stage, p) => stage.kind === 'ten' ? String(10 - p.n) : stage.kind === 'add' ? String(p.x + p.y) : stage.kind === 'judge' ? (p.borrow ? 'ひけない（しるしを つける）' : 'ひける') : String(p.a - p.b);

    /* =========================================================
       すすみぐあい
       progress[ステップ] = { sets（おえた かい）, idx（いまの かいの 何問目）, cur（いまの かいの 5問）, cleared, clears }
       ========================================================= */
    const prog = (st, id) => st.progress[id] || {};
    const isCleared = (id, st) => !!prog(st, id).cleared;
    function startIndex(st) {
      const s = st.settings;
      let i = Math.max(0, MAIN_IDS.indexOf(s.startStage));
      if (s.skipPrep) i = Math.max(i, MAIN_IDS.indexOf('s1'));
      return i;
    }
    const isSkipped = (id, st) => { const i = MAIN_IDS.indexOf(id); return i >= 0 && i < startIndex(st); };
    const isDone = (id, st) => isCleared(id, st) || isSkipped(id, st);
    function titleOf(st) {
      const n = MAIN_IDS.filter(id => isDone(id, st)).length;
      let t = TITLES[0]; TITLES.forEach(x => { if (n >= x.min) t = x; });
      return t;
    }
    function isStageOpen(stage, st) {
      if (stage.grp === 'adv') return !!st.settings.advanced;
      if (st.settings.unlockAll) return true;
      const i = MAIN_IDS.indexOf(stage.id);
      return i <= startIndex(st) || isDone(MAIN_IDS[i - 1], st);
    }
    function lockHint(stage) {
      if (stage.grp === 'adv') return 'せんせいが ひらいて くれるよ';
      const i = MAIN_IDS.indexOf(stage.id);
      return `${STAGE_MAP[MAIN_IDS[i - 1]].label}を クリアすると ひらくよ`;
    }
    function findNext(st) {
      for (const id of MAIN_IDS) { const s = STAGE_MAP[id]; if (!isSkipped(id, st) && isStageOpen(s, st) && !isCleared(id, st)) return s; }
      return null;
    }
    const stepPos = (st, id) => { const p = prog(st, id); return Math.min(PER_SET * SETS_TO_CLEAR, (p.sets || 0) * PER_SET + (p.idx || 0)); };
    const ownedCount = st => ALL_ITEMS.filter(it => st.owned[it.id]).length;
    const friendsOf = st => STAGES.filter(s => isCleared(s.id, st) && s.friend).map(s => FRIEND_MAP[s.friend]).filter(Boolean);

    /* =========================================================
       先生の スプレッドシートへ 記録を 送る
       ========================================================= */
    const SYNC_BATCH = 200;
    const stageName = s => `${s.label} ${stripMarkup(s.name)}`;
    function syncColumns() {
      return STAGES.map(s => ({ id: s.id, short: s.label.replace('じゅんび', 'じ').replace('ステップ', 'S').replace('はってん ', '発'), label: stageName(s) }));
    }
    async function buildSummary(st) {
      const hist = await DB.getAll('history');
      const stages = {};
      const errors = {};
      STAGES.forEach(s => { const p = prog(st, s.id); stages[s.id] = { clear: p.cleared ? 1 : 0, plays: p.clears || 0, pos: stepPos(st, s.id), skip: isSkipped(s.id, st) ? 1 : 0, solved: 0, first: 0 }; });
      let solved = 0, first = 0, lastAt = 0;
      hist.forEach(h => {
        lastAt = Math.max(lastAt, h.at || 0);
        (h.errors || []).forEach(e => { errors[e] = (errors[e] || 0) + 1; });
        if (!h.done) return;
        solved++; if (!h.mistakes) first++;
        const x = stages[h.stageId]; if (x) { x.solved++; if (!h.mistakes) x.first++; }
      });
      const t = titleOf(st);
      const next = findNext(st);
      return {
        title: `${t.icon} ${t.name}`, cleared: MAIN_IDS.filter(id => isDone(id, st)).length, mains: MAIN_IDS.length,
        solved, first, lastAt, acorns: st.acorns, earned: st.earned, items: ownedCount(st), allItems: ALL_ITEMS.length, friends: friendsOf(st).length,
        current: next ? `${next.label}（${stepPos(st, next.id) + 1}問目）` : 'ぜんぶ クリア',
        stages, errors,
      };
    }
    function syncRecord(st, h) {
      const s = STAGE_MAP[h.stageId];
      return {
        uid: `${st.deviceId}-${h.at}-${h.stageId}-${h.no}`, at: h.at, stage: s ? stageName(s) : h.stageId, stageId: h.stageId,
        no: h.no, label: h.label, correct: h.correct, answers: (h.answers || []).join(' → '), result: h.result,
        mistakes: h.mistakes, hints: h.hints, sec: h.sec, errors: [...new Set(h.errors || [])].map(e => ERR[e] || e).join('、'),
        memo: h.memo ? 'つかった' : '', color: h.color === false ? 'なし' : 'あり',
      };
    }
    const SYNC_ERRORS = {
      key: '合言葉が一致しません。入口ページから開き直すか、正しい合言葉を入力してください。',
      'not-json': 'Apps Script から正しい返事がありません。デプロイの「アクセスできるユーザー」が「全員」になっているか確認してください。',
      fetch: '送信できませんでした。インターネット接続と、Apps Script のデプロイ（アクセスできるユーザー「全員」）を確認してください。',
    };
    const Sync = {
      running: null,
      run(app, opts = {}) {
        if (this.running) return this.running;
        this.running = this._run(app, opts).finally(() => { this.running = null; });
        return this.running;
      },
      async _run(app, { all = false } = {}) {
        const st = app.stateRef.current;
        const sync = st.sync || {};
        if (!sync.url || !st.profile) return { ok: false, reason: 'nourl' };
        if (navigator.onLine === false) return { ok: false, reason: 'offline' };
        try {
          const hist = (await DB.getAll('history')).sort((a, b) => a.at - b.at);
          const targets = hist.filter(h => all || !h.sent);
          const summary = await buildSummary(st);
          const sumKey = fnv(st.profile.name + JSON.stringify(summary));
          if (!targets.length && !all && sync.lastSummary === sumKey) return { ok: true, sent: 0 };
          let i = 0;
          do {
            const batch = targets.slice(i, i + SYNC_BATCH);
            const payload = {
              app: APP_ID, v: 1, key: sync.key || '', deviceId: st.deviceId, name: st.profile.name,
              summary, columns: syncColumns(), errorNames: ERR, records: batch.map(h => syncRecord(st, h)),
            };
            let res;
            try {
              res = await fetch(sync.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
            } catch (e) { throw new Error('fetch'); }
            let data;
            try { data = await res.json(); } catch (e) { throw new Error('not-json'); }
            if (!data || !data.ok) throw new Error((data && data.error) || 'server');
            for (const h of batch) if (!h.sent) await DB.put('history', { ...h, sent: true });
            i += SYNC_BATCH;
          } while (i < targets.length);
          app.update(s => ({ ...s, sync: { ...s.sync, lastOkAt: Date.now(), lastError: null, lastSummary: sumKey } }));
          return { ok: true, sent: targets.length };
        } catch (e) {
          const code = String((e && e.message) || e);
          app.update(s => ({ ...s, sync: { ...s.sync, lastError: code, lastErrorAt: Date.now() } }));
          return { ok: false, reason: code };
        }
      },
    };
    const syncErrorText = code => SYNC_ERRORS[code] || `送信できませんでした（${code}）。`;

    /* =========================================================
       画面の 部品
       ========================================================= */
    function Btn({ color = 'sky', size = 'md', className = '', onClick, silent, ...p }) {
      return <button {...p} onClick={(e) => { if (!silent) sfx('tap'); onClick && onClick(e); }} className={`btn3d c-${color} s-${size} ${className}`} />;
    }
    function Modal({ children, onClose }) {
      return (
        <div className="modal-bg" onClick={onClose}>
          <div className="pop" style={{ maxWidth: 640, width: '100%' }} onClick={e => e.stopPropagation()}>{children}</div>

    // 0〜9 の 数字の ボタン
    function Keypad({ onKey, gone = [], glowKey, disabled }) {
      return (
        <div className="keypad">
          {[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => (
            <Btn key={d} color="white" size="md" silent className={`key ${gone.includes(d) ? 'gone' : ''} ${glowKey === d ? 'glow' : ''}`}
                 disabled={disabled || gone.includes(d)} onClick={() => onKey(d)} data-key={d}>{d}</Btn>
