<!DOCTYPE html>

<head>

<style>

  @media print { #ui { display: none; } body { background: #fff; } #view { padding: 0; display: block; } #view svg { width: 210mm; height: 297mm; box-shadow: none; display: block; page-break-after: always; break-after: page; } #view svg.anssvg { display: none; } }

<body>

  <h1>サンカの かたち ワークシート（三角形・四角形）　<span class="note">先生用：しゅるいを選んで、PDF で保存するか、印刷します</span></h1>

<script>
'use strict';
// =====================================================================
//  サンカの かたち ワークシート
//  ・A4たて（210×297mm）を SVG で かきます。たんいは mm。
//  ・もんだいは「くみ（set）・しゅるい（type）・ばんごう（n）」から きまります（同じ ばんごうは、いつも 同じ もんだい）。
//  ・文字は ぜんぶ 全角で かきます（どの フォントでも、はばが そろうように）。
// =====================================================================
const TYPES = [
  { id: 1, mark: '①', title: '{三角形|さんかくけい}を かこう', img: 'mon1', say: ['{点|てん}と {点|てん}を じょうぎで むすんで、', '{三角形|さんかくけい}を かこう。'] },
  { id: 2, mark: '②', title: '{四角形|しかくけい}を かこう', img: 'mon2', say: ['{点|てん}と {点|てん}を じょうぎで むすんで、', '{四角形|しかくけい}を かこう。'] },
  { id: 3, mark: '③', title: 'へんと ちょう{点|てん}', img: 'fairy', say: ['へんを あおで なぞろう。', 'ちょう{点|てん}に あかで ○を つけよう。'] },
  { id: 4, mark: '④', title: 'かずを かぞえよう', img: 'mon3', say: ['へんの かずと ちょう{点|てん}の かずを かぞえて、', '□に すうじを かこう。'] },
  { id: 5, mark: '⑤', title: '{三角形|さんかくけい}・{四角形|しかくけい}を みつけよう', img: 'mon4', say: ['{三角形|さんかくけい}に あか、{四角形|しかくけい}に あおを ぬろう。', 'かずも □に かこう。'] },
  { id: 6, mark: '⑥', title: 'なまえと わけ', img: 'mon5', say: ['{形|かたち}の なまえに ○を つけよう。', 'わけも えらんで、○を つけよう。'] },
  { id: 7, mark: '⑦', title: 'へんを かきたそう', img: 'mon6', say: ['ふとい へんに、へんを かきたして、', '{三角形|さんかくけい}や {四角形|しかくけい}を かこう。'] },
  { id: 8, mark: '⑧', title: 'まとめ', img: 'fairy', say: ['うすい {字|じ}を なぞろう。', '□には すうじを かこう。'] },
];
const SHEETS = 50;
const FONT = "'BIZ UDGothic','Noto Sans CJK JP','Noto Sans JP','Meiryo',sans-serif";
const SAN = '{三角形|さんかくけい}', SHI = '{四角形|しかくけい}', TEN = 'ちょう{点|てん}', CHOKU = '{直線|ちょくせん}', KATA = '{形|かたち}', SEN = '{線|せん}';
const RED = '#e11d48', BLUE = '#2563eb', INK = '#111827';
const Z = (n) => String(n).replace(/[0-9]/g, c => '０１２３４５６７８９'[c]);
const Z2 = (n) => Z(String(n).padStart(2, '0'));
const f1 = (v) => Math.round(v * 100) / 100;

// ---- らんすう（たねから きまる）----
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function makeRng(seed) {
  let a = seed >>> 0;
  const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  r.int = (lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.shuffle = (arr) => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  return r;
}

// ---- 文字（{漢字|よみ} は ふりがな）----
const RUBY = /\{([^|}]+)\|([^}]+)\}/g;
function tokens(str) {
  const out = []; let last = 0, m; RUBY.lastIndex = 0;
  const plain = (s) => { s.split(/( )/).forEach(p => { if (p === ' ') out.push({ sp: 1 }); else if (p) out.push({ t: p }); }); };
  while ((m = RUBY.exec(str))) { if (m.index > last) plain(str.slice(last, m.index)); out.push({ t: m[1], r: m[2] }); last = m.index + m[0].length; }
  if (last < str.length) plain(str.slice(last));
  return out;
}
const tokW = (k, fs) => k.sp ? fs * 0.5 : k.r ? Math.max(k.t.length, k.r.length * 0.46) * fs : k.t.length * fs;
const textW = (str, fs) => tokens(str).reduce((w, k) => w + tokW(k, fs), 0);
function T(x, y, str, o = {}) {
  const fs = o.fs || 5.2, fill = o.fill || INK, wt = o.bold ? 700 : 400;
  const toks = tokens(str), total = toks.reduce((w, k) => w + tokW(k, fs), 0);
  let cx = o.anchor === 'middle' ? x - total / 2 : o.anchor === 'end' ? x - total : x, s = '';
  const one = (tx, ty, t, size) => `<text x="${f1(tx)}" y="${f1(ty)}" font-size="${f1(size)}" font-weight="${wt}" fill="${fill}" text-anchor="middle"${t.length > 1 ? ` textLength="${f1(t.length * size)}" lengthAdjust="spacingAndGlyphs"` : ''}>${t}</text>`;
  toks.forEach(k => {
    const w = tokW(k, fs);
    if (!k.sp) { s += one(cx + w / 2, y, k.t, fs); if (k.r) s += one(cx + w / 2, y - fs * 0.95, k.r, fs * 0.46); }
    cx += w;
  });
  return s;
}

// ---- 図形 ----
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const cross = (a, b) => a[0] * b[1] - a[1] * b[0];
const len = (a) => Math.hypot(a[0], a[1]);
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const centroid = (pts) => [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
function angles(pts) {
  const n = pts.length;
  return pts.map((p, i) => { const a = sub(pts[(i + n - 1) % n], p), b = sub(pts[(i + 1) % n], p); return Math.acos(Math.max(-1, Math.min(1, (a[0] * b[0] + a[1] * b[1]) / (len(a) * len(b) || 1)))) * 180 / Math.PI; });
}
function convex(pts) { const n = pts.length; let sg = 0; for (let i = 0; i < n; i++) { const c = cross(sub(pts[(i + 1) % n], pts[i]), sub(pts[(i + 2) % n], pts[(i + 1) % n])); if (Math.abs(c) < 1e-9) return false; if (sg && Math.sign(c) !== sg) return false; sg = Math.sign(c); } return true; }
const area2 = (pts) => Math.abs(pts.reduce((s, p, i) => s + cross(p, pts[(i + 1) % pts.length]), 0));
const polar = (deg, rad) => [Math.cos(deg * Math.PI / 180) * rad, Math.sin(deg * Math.PI / 180) * rad];
function rot(pts, deg) { const c = Math.cos(deg * Math.PI / 180), s = Math.sin(deg * Math.PI / 180); return pts.map(p => [p[0] * c - p[1] * s, p[0] * s + p[1] * c]); }

function triPts(r) {
  for (let k = 0; k < 200; k++) {
    const a0 = r() * 360, pts = [0, 1, 2].map(i => polar(a0 + i * 120 + (r() - 0.5) * 76, 0.6 + 0.4 * r()));
    if (Math.min(...angles(pts)) >= 30) return pts;
  }
  return [polar(-90, 1), polar(150, 1), polar(30, 1)];
}
function quadPts(r) {
  const kind = r();
  if (kind < 0.28) { const w = 0.55 + 0.45 * r(), h = 0.45 + 0.55 * r(); return rot([[-w, -h], [w, -h], [w, h], [-w, h]], r.pick([0, 0, 0, 14, -18, 45, 30])); }
  if (kind < 0.42) { const t = 0.3 + 0.4 * r(), sh = (r() - 0.5) * 0.5; return rot([[-t + sh, -0.7], [t + sh, -0.7], [1, 0.7], [-1, 0.7]], r.pick([0, 0, 180, 90, -90, 20])); }
  if (kind < 0.54) { const sk = 0.35 + 0.3 * r(); return rot([[-1 + sk, -0.65], [1, -0.65], [1 - sk, 0.65], [-1, 0.65]], r.pick([0, 0, 90, 25, -20])); }
  for (let k = 0; k < 300; k++) {
    const a0 = r() * 360, pts = [0, 1, 2, 3].map(i => polar(a0 + i * 90 + (r() - 0.5) * 50, 0.62 + 0.38 * r())), an = angles(pts);
    if (convex(pts) && Math.min(...an) >= 48 && Math.max(...an) <= 138) return pts;
  }
  return [[-1, -0.7], [1, -0.7], [1, 0.7], [-1, 0.7]];
}
// しゅるい：tri／quad は 正しい 形。curve（まがった 線）・round（まるい かど）・open（線が つながって いない）・oval は「どちらでも ない」
function makeShape(r, kind) {
  if (kind === 'tri') return { k: 'tri', why: 'a', pts: triPts(r) };
  if (kind === 'quad') return { k: 'quad', why: 'b', pts: quadPts(r) };
  if (kind === 'oval') return { k: 'non', why: 'c', mod: 'oval', pts: rot([[-1, -0.62 - 0.38 * r()], [1, -0.7], [1, 0.7], [-1, 0.7]], 0), rx: 1, ry: 0.55 + 0.45 * r() };
  const pts = r() < 0.5 ? triPts(r) : quadPts(r), n = pts.length;
  let longest = 0; pts.forEach((p, i) => { if (len(sub(pts[(i + 1) % n], p)) > len(sub(pts[(longest + 1) % n], pts[longest]))) longest = i; });
  if (kind === 'open') return { k: 'non', why: 'd', mod: 'open', pts, i: longest };
  if (kind === 'round') return { k: 'non', why: 'c', mod: 'round', pts, i: r.int(0, n - 1) };
  return { k: 'non', why: 'c', mod: 'curve', pts, i: r() < 0.6 ? longest : r.int(0, n - 1) };
}
// はこ（x,y,w,h）に おさまるように ひろげて、えがく
function placeShape(sh, box, pad = 4) {
  let ext = sh.pts.slice(); const n = sh.pts.length, c0 = centroid(sh.pts);
  let ctrl = null;
  if (sh.mod === 'curve') { const a = sh.pts[sh.i], b = sh.pts[(sh.i + 1) % n], m = lerp(a, b, 0.5), d = sub(m, c0), l = len(d) || 1, bl = len(sub(b, a)); ctrl = [m[0] + d[0] / l * bl * 0.55, m[1] + d[1] / l * bl * 0.55]; ext.push(lerp(m, ctrl, 0.55)); }
  if (sh.mod === 'oval') ext = [[-sh.rx, -sh.ry], [sh.rx, sh.ry]];
  const xs = ext.map(p => p[0]), ys = ext.map(p => p[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sc = Math.min((box.w - pad * 2) / (x1 - x0), (box.h - pad * 2) / (y1 - y0));
  const ox = box.x + box.w / 2 - (x0 + x1) / 2 * sc, oy = box.y + box.h / 2 - (y0 + y1) / 2 * sc;
  const tr = (p) => [f1(ox + p[0] * sc), f1(oy + p[1] * sc)];
  const P = sh.pts.map(tr); let d;
  if (sh.mod === 'oval') return { d: '', P: [], oval: { cx: f1(ox), cy: f1(oy), rx: f1(sh.rx * sc), ry: f1(sh.ry * sc) } };
  if (sh.mod === 'curve') { const q = tr(ctrl); const order = P.map((_, j) => P[(sh.i + 1 + j) % n]); d = 'M' + order.join(' L') + ` Q${q} ${order[0]}`; }
  else if (sh.mod === 'round') { const a = lerp(P[sh.i], P[(sh.i + n - 1) % n], 0.42).map(f1), b = lerp(P[sh.i], P[(sh.i + 1) % n], 0.42).map(f1); const order = P.map((_, j) => P[(sh.i + 1 + j) % n]).slice(0, n - 1); d = `M${b} L` + order.join(' L') + ` L${a} Q${P[sh.i]} ${b} Z`; }
  else if (sh.mod === 'open') { const g1 = lerp(P[sh.i], P[(sh.i + 1) % n], 0.3).map(f1), g2 = lerp(P[sh.i], P[(sh.i + 1) % n], 0.7).map(f1); const order = P.map((_, j) => P[(sh.i + 1 + j) % n]); d = `M${g2} L` + order.join(' L') + ` L${g1}`; }
  else d = 'M' + P.join(' L') + ' Z';
  return { d, P };
}
function drawShape(pl, o = {}) {
  const st = `fill="${o.fill || '#fff'}" stroke="${o.stroke || INK}" stroke-width="${o.sw || 0.9}" stroke-linejoin="round" stroke-linecap="round"`;
  if (pl.oval) return `<ellipse cx="${pl.oval.cx}" cy="${pl.oval.cy}" rx="${pl.oval.rx}" ry="${pl.oval.ry}" ${st}/>`;
  return `<path d="${pl.d}" ${st}/>`;
}

// ---- 点の ます目（G×G）----
function gridPts(G) { const a = []; for (let i = 0; i < G * G; i++) a.push([i % G, Math.floor(i / G)]); return a; }
function gTri(r, G) { const all = gridPts(G); for (let k = 0; k < 500; k++) { const p = r.shuffle(all).slice(0, 3); if (area2(p) >= 6 && Math.min(...angles(p)) >= 24) return p; } return [[0, 4], [4, 4], [2, 0]]; }
function orderRound(p) { const c = centroid(p); return p.slice().sort((a, b) => Math.atan2(a[1] - c[1], a[0] - c[0]) - Math.atan2(b[1] - c[1], b[0] - c[0])); }
function gQuad(r, G) { const all = gridPts(G); for (let k = 0; k < 2000; k++) { const p = orderRound(r.shuffle(all).slice(0, 4)), an = angles(p); if (convex(p) && area2(p) >= 10 && Math.min(...an) >= 38 && Math.max(...an) <= 145) return p; } return [[0, 0], [4, 0], [4, 3], [0, 3]]; }
function gBase(r, G, slant) { const all = gridPts(G); for (let k = 0; k < 500; k++) { const [a, b] = r.shuffle(all).slice(0, 2), d = sub(b, a); const axis = d[0] === 0 || d[1] === 0; if (len(d) >= 2 && len(d) <= 4.2 && (slant ? !axis : axis)) return [a, b]; } return [[0, 4], [3, 4]]; }
function gAddTri(r, G, base) { const all = gridPts(G); for (let k = 0; k < 500; k++) { const c = r.pick(all), p = [base[0], base[1], c]; if (area2(p) >= 5 && Math.min(...angles(p)) >= 24) return p; } return null; }
function gAddQuad(r, G, base) { const all = gridPts(G); for (let k = 0; k < 4000; k++) { const [c, d] = r.shuffle(all).slice(0, 2), p = [base[0], base[1], c, d], an = angles(p); if (convex(p) && area2(p) >= 8 && Math.min(...an) >= 35 && Math.max(...an) <= 148) return p; } return null; }

// ---- ぶひん ----
const rect = (x, y, w, h, o = {}) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${o.rx == null ? 2.5 : o.rx}" fill="${o.fill || 'none'}" stroke="${o.stroke || '#6b7280'}" stroke-width="${o.sw || 0.5}"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
const line = (a, b, o = {}) => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${o.stroke || INK}" stroke-width="${o.sw || 0.9}" stroke-linecap="round"/>`;
const circ = (p, rr, o = {}) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${rr}" fill="${o.fill || INK}" stroke="${o.stroke || 'none'}" stroke-width="${o.sw || 0}"/>`;
const poly = (pts, o = {}) => `<polygon points="${pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ')}" fill="${o.fill || 'none'}" stroke="${o.stroke || INK}" stroke-width="${o.sw || 0.9}" stroke-linejoin="round"/>`;
const qno = (i) => `（${Z(i + 1)}）`;
function away(p, c, d) { const v = sub(p, c), l = len(v) || 1; return [p[0] + v[0] / l * d, p[1] + v[1] / l * d]; }
const AX = 12, AW = 186, AY = 70, AH = 214;   // もんだいを かく ところ

// 点の ます目の もんだい（①②⑦）
function dotBox(i, label, G, body) {
  const bw = 90, bh = 104, bx = AX + (i % 2) * (bw + 6), by = AY + Math.floor(i / 2) * (bh + 6), s = 15, gx = bx + (bw - s * (G - 1)) / 2, gy = by + 27;
  const xy = (p) => [gx + p[0] * s, gy + p[1] * s];
  let q = rect(bx, by, bw, bh) + T(bx + 3, by + 11.5, qno(i) + label, { fs: 4.3 });
  q += gridPts(G).map(p => circ(xy(p), 0.85, { fill: '#374151' })).join('');
  const res = body(xy);
  return { q: q + (res.q || ''), a: res.a || '' };
}
const ansPoly = (pts, rei, at) => poly(pts, { fill: 'rgba(225,29,72,.14)', stroke: RED, sw: 1.3 }) + (rei ? T(at[0], at[1], '（れい）', { fs: 4.3, fill: RED, bold: true, anchor: 'end' }) : '');

function sheetDots(r, n) {   // n＝3：三角形、4：四角形
  const G = 5, gen = () => n === 3 ? gTri(r, G) : gQuad(r, G), nm = n === 3 ? SAN : SHI, parts = [];
  const order = '１→２→３' + (n === 4 ? '→４' : '') + '→１と むすぼう。';
  parts.push(dotBox(0, order, G, (xy) => { const p = gen(), P = p.map(xy), c = centroid(P); return { q: P.map((q, j) => circ(q, 2) + T(away(q, c, 6.5)[0], away(q, c, 6.5)[1] + 2, Z(j + 1), { fs: 5.4, bold: true, anchor: 'middle' })).join(''), a: ansPoly(P) }; }));

    return;
  }
  $('types').addEventListener('click', e => { const t = e.target.closest('button'); if (t) { st.type = Number(t.dataset.t); st.n = 1; say(''); render(); } });
  $('prev').onclick = () => { st.n = st.n > 1 ? st.n - 1 : SHEETS; render(); };
  $('next').onclick = () => { st.n = st.n < SHEETS ? st.n + 1 : 1; render(); };
  $('new').onclick = () => { st.set = 2 + Math.floor(Math.random() * 9998); say('あたらしい もんだいに しました。'); render(); };
  $('showans').onclick = () => { st.ans = !st.ans; render(); };
  $('print').onclick = () => window.print();
  const tail = () => st.set === 1 ? '' : `_kumi${st.set}`;
  $('pdf1').onclick = () => run(() => savePdf([() => sheetSvg(st.type, st.n, st.set, false, true, PX)], `katachi_${st.type}-${String(st.n).padStart(2, '0')}${tail()}.pdf`));
  $('pdf50').onclick = () => run(() => savePdf(Array.from({ length: SHEETS }, (_, i) => () => sheetSvg(st.type, i + 1, st.set, false, true, PX)), `katachi_${st.type}_50mai${tail()}.pdf`));
  $('pdfans').onclick = () => run(() => { const a = answerSvgs(st.type, st.set, true, PX); return savePdf(a.map(s => () => s), `katachi_${st.type}_kotae${tail()}.pdf`); });
  render();
}
init();
</script>
</body>
</html>
