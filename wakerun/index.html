    // =====================================================================
    // 12. おみせ
    // =====================================================================
    function ItemPic({ it, size = 56 }) {
      // 絵が ある ときは 正方形なので すこし 大きく する
      const big = HAS_IMG.has('wakerun_normal.webp') ? 1.3 : 0.8;
      if (it.slot === 'body') return <span className="inline-block"><Wakerun equip={{ body: it.id }} size={size * big} /></span>;
      if (it.slot === 'form') return <span className="inline-block"><Wakerun equip={{ form: it.id }} size={size * big} /></span>;
      if (it.slot === 'bg') return <span className="inline-block rounded-xl overflow-hidden" style={{ width: size * 1.5, height: size }}><SpaceBg equip={{ bg: it.id }} className="w-full h-full" /></span>;
      return <span style={{ fontSize: size, lineHeight: 1 }}>{it.e}</span>;
    }
    function TierChip({ it }) {
      const t = TIERS[it.tier] || TIERS[0];
      return <span className={`rounded-full font-bold border-2 whitespace-nowrap text-xs px-2 ${it.tier === 3 ? 'glow' : ''}`} style={{ color: t.color, borderColor: t.color, background: t.bg }}>{it.tier >= 2 ? '👑 ' : ''}{t.n}</span>;
    }
    function ShopScreen({ progress, onBuy, onEquip, onTitle }) {
      const talk = useTalk();
      const [cat, setCat] = useState(ITEM_CATS[0].id);
      const [confirm, setConfirm] = useState(null);
      const own = new Set(progress.items);
      const c = ITEM_CATS.find(x => x.id === cat);
      useEffect(() => { talk.say('ワケルンの おみせだよ。コインで かって、そうび できるよ。'); }, []);
      const tap = (it) => {
        Sound.tap();
        if (own.has(it.id)) {
          const on = progress.equip[it.slot] === it.id;
          onEquip(it.slot, on ? '' : it.id);
          talk.say(on ? `${it.n}を はずしたよ。` : `${it.n}を そうび したよ！`, { mood: 'happy' });
          return;
        }
        if (progress.coins < it.p) { talk.say(`${it.n}は コイン ${it.p}まい。あと ${it.p - progress.coins}まい あつめよう！`, { mood: 'think' }); return; }
        talk.say(`${it.n}を かいますか？`);
        setConfirm(it);
      };
      const buy = () => {
        const it = confirm; setConfirm(null);
        const before = titlesOf(progress), after = titlesOf({ ...progress, items: [...progress.items, it.id] });
        onBuy(it); Sound.buy();
        const nt = after.find(x => !before.includes(x));
        if (nt) onTitle(nt);
        else talk.say(`${it.n}を かったよ。そうび したよ！`, { mood: 'happy' });
      };
      return (
        <SpaceBg equip={progress.equip} dim={0.35} className="w-full flex-1" style={{ minHeight: 'calc(100vh - 64px)' }}>
          <div className="flex flex-col items-center gap-3 p-3">
            <div className="flex items-end gap-4 w-full max-w-6xl">
              <Wakerun equip={progress.equip} size={120} mood={talk.mood} />
              <div className="flex-1"><TalkBar noRobot dark /></div>
            </div>
            <div className="flex gap-2 flex-wrap justify-center">
              {ITEM_CATS.map(x => <button key={x.id} onClick={() => { Sound.tap(); setCat(x.id); }}
                className={`btn3d rounded-full border-4 px-4 py-2 text-xl font-bold ${cat === x.id ? 'bg-orange-400 text-white border-orange-600' : 'bg-white border-slate-300'}`}>
                {x.icon} {x.name} <span className="text-sm">{x.items.filter(it => own.has(it.id)).length}/{x.items.length}</span></button>)}
            </div>
            <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-3 bg-white/90 rounded-3xl p-3 w-full max-w-6xl">
              {c.items.map(it => {
                const have = own.has(it.id), on = progress.equip[it.slot] === it.id, can = progress.coins >= it.p;
                const t = TIERS[it.tier];
                return (
                  <button key={it.id} onClick={() => tap(it)} className="btn3d rounded-2xl border-4 p-2 flex flex-col items-center gap-1"
                    style={{ borderColor: on ? '#f97316' : t.color, background: it.tier >= 2 ? t.bg : '#fffbeb' }}>
                    <TierChip it={it} />
                    <span className={`h-[80px] flex items-center ${have || can ? '' : 'opacity-60'}`}><ItemPic it={it} size={60} /></span>
                    <span className="text-lg font-bold leading-tight text-center">{it.n}</span>
                    {have ? <span className={`text-base font-bold rounded-full px-3 ${on ? 'bg-orange-500 text-white' : 'bg-emerald-100 text-emerald-700'}`}>{on ? 'そうび中' : 'そうびする'}</span>
                      : <span className={`text-lg font-bold rounded-full px-3 ${can ? 'bg-amber-200' : 'bg-slate-100 text-slate-400'}`}>🪙 {it.p}まい</span>}
                  </button>
                );
              })}
            </div>
          </div>
          {confirm && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 flex flex-col items-center gap-3 pop">
                <ItemPic it={confirm} size={100} />
                <TierChip it={confirm} />
                <div className="text-3xl font-bold">{confirm.n}を かいますか？</div>
                <div className="text-2xl">🪙 {confirm.p}まい（のこり {progress.coins - confirm.p}まい）</div>
                <div className="flex gap-4 mt-2">
                  <Btn onClick={buy} color="#16a34a" light="#dcfce7" className="text-3xl px-10">かう</Btn>
                  <Btn onClick={() => setConfirm(null)} color="#64748b" light="#f1f5f9">やめる</Btn>
                </div>
              </div>
            </div>
          )}
        </SpaceBg>
      );
    }

    // =====================================================================
    // 13. ずかん・しょうごう・レベル
    // =====================================================================
    function ZukanScreen({ progress }) {
      const talk = useTalk();
      const [tab, setTab] = useState('shape');
      const samples = useMemo(() => {
        const m = {};
        SHAPES.forEach(s => FRACS.forEach(n => { m[`${s.id}_${n}`] = makeObj('target', n, { shape: s }); }));
        return m;
      }, []);
      const have = Object.keys(samples).filter(k => progress.zukan[k]).length;
      const lv = levelOf(progress.total), next = LEVELS[lv + 1];
      const titles = TITLES();
      useEffect(() => { talk.say(`かたち ずかんだよ。${Object.keys(samples).length}この うち ${have}こ みつけたよ。`); }, []);
      return (
        <SpaceBg equip={progress.equip} dim={0.4} className="w-full flex-1" style={{ minHeight: 'calc(100vh - 64px)' }}>
          <div className="flex flex-col items-center gap-3 p-3">
            <div className="w-full max-w-5xl"><TalkBar size={70} dark /></div>
            <div className="flex gap-2">
              {[['shape', '📖 かたち ずかん'], ['title', '🏆 しょうごう'], ['level', '⭐ レベル']].map(([id, n]) =>
                <button key={id} onClick={() => { Sound.tap(); setTab(id); }} className={`btn3d rounded-full border-4 px-5 py-2 text-xl font-bold ${tab === id ? 'bg-violet-500 text-white border-violet-700' : 'bg-white border-slate-300'}`}>{n}</button>)}
            </div>
            {tab === 'shape' && (
              <div className="bg-white/95 rounded-3xl p-3 w-full max-w-5xl overflow-x-auto">
                <div className="text-center text-xl font-bold mb-2">みつけた かたち：{have} / {Object.keys(samples).length}</div>
                <table className="mx-auto">
                  <thead><tr><th />{FRACS.map(n => <th key={n} className="px-2"><Frac k={1} n={n} size={1.2} /></th>)}</tr></thead>
                  <tbody>{SHAPES.map(s => (
                    <tr key={s.id}>
                      <td className="text-lg font-bold pr-2 whitespace-nowrap">{s.n}</td>
                      {FRACS.map(n => {
                        const k = `${s.id}_${n}`, c = progress.zukan[k] || 0;
                        return <td key={n} className="p-1"><button onClick={() => { Sound.tap(); talk.say(c ? `${s.n}の 1/${n}。${c}こ みつけたよ。` : `${s.n}の 1/${n}は まだ みつけて いないよ。`); }}
                          className={`rounded-2xl border-4 p-1 flex flex-col items-center ${c >= 10 ? 'border-amber-400 bg-amber-50' : c ? 'border-sky-300 bg-white' : 'border-slate-200 bg-slate-100'}`}>
                          <span style={c ? {} : { filter: 'grayscale(1) brightness(.4)', opacity: .35 }}><ShapeSvg o={samples[k]} size={78} /></span>
                          <span className="text-sm font-bold">{c ? `${c}こ${c >= 10 ? ' 👑' : ''}` : '？'}</span></button></td>;
                      })}
                    </tr>))}
                  </tbody>
                </table>
                <div className="text-center text-sm text-slate-500 mt-1">10こ みつけると 👑 に なるよ</div>
              </div>
            )}
            {tab === 'title' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full max-w-4xl">
                {titles.map(tl => { const ok = tl.ok(progress); return (
                  <div key={tl.id} className={`rounded-2xl border-4 p-3 flex items-center gap-3 ${ok ? 'bg-amber-50 border-amber-400' : 'bg-white/80 border-slate-300'}`}>
                    <span className="text-4xl">{ok ? '🏆' : '❔'}</span>
                    <div><div className="text-xl font-bold"><Rich text={ok ? tl.n : '？？？'} fsize={0.7} /></div><div className="text-base text-slate-600"><Rich text={tl.d} fsize={0.65} /></div></div>
                  </div>); })}
              </div>
            )}
            {tab === 'level' && (
              <div className="bg-white/95 rounded-3xl p-5 w-full max-w-3xl flex flex-col items-center gap-2">
                <div className="text-3xl font-bold">Lv.{lv + 1}「{LEVELS[lv].n}」</div>
                <div className="text-xl">みつけた かず：{progress.total}こ</div>
                {next && <><div className="w-full h-6 bg-slate-200 rounded-full overflow-hidden"><div className="h-full bg-amber-400" style={{ width: `${Math.min(100, (progress.total - LEVELS[lv].at) / (next.at - LEVELS[lv].at) * 100)}%` }} /></div>
                  <div className="text-lg">つぎの レベルまで あと {next.at - progress.total}こ</div></>}
                <div className="grid grid-cols-2 gap-1 mt-2 w-full">{LEVELS.map((l, i) => <div key={i} className={`rounded-lg px-2 py-1 ${i <= lv ? 'bg-amber-100 font-bold' : 'bg-slate-100 text-slate-400'}`}>Lv.{i + 1} {l.n}（{l.at}こ）</div>)}</div>
              </div>
            )}
          </div>
        </SpaceBg>
      );
    }

    function TitleModal({ title, onClose }) {
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-3xl p-8 flex flex-col items-center gap-3 pop">
            <div className="text-7xl">🏆</div>
            <div className="text-4xl font-bold text-amber-600">「<Rich text={title} fsize={0.8} />」</div>
            <div className="text-2xl">の しょうごうを もらったよ！</div>
            <Btn onClick={onClose} color="#16a34a" light="#dcfce7">やったね！</Btn>
          </div>
        </div>
      );
    }
    function LevelUpModal({ level, equip, onClose }) {
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-3xl p-8 flex flex-col items-center gap-3 pop">
            <div className="text-4xl font-bold text-indigo-600">レベル アップ！</div>
            <Wakerun equip={equip} size={140} mood="happy" className="floaty" />
            <div className="text-3xl font-bold">Lv.{level + 1}「{LEVELS[level].n}」</div>

          </div>

    // =====================================================================
    // 14. 先生用画面
    // =====================================================================
    function PinPad({ onSubmit, onClose, error }) {
      const [v, setV] = useState('');
      const press = (d) => { const n = (v + d).slice(0, 4); setV(n); if (n.length === 4) { onSubmit(n); setTimeout(() => setV(''), 300); } };
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
          <div className="bg-white rounded-3xl p-6 w-80 flex flex-col items-center gap-3">
            <div className="text-2xl font-bold">🔒 せんせい用</div>
            <div className="text-base">暗証番号（4けた）を入れてください</div>
            <div className="flex gap-2">{[0, 1, 2, 3].map(i => <div key={i} className="w-10 h-12 border-2 rounded-lg flex items-center justify-center text-2xl">{v[i] ? '●' : ''}</div>)}</div>
            {error > 0 && <div className="text-rose-600 font-bold">番号がちがいます</div>}
            <div className="grid grid-cols-3 gap-2">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((d, i) => d === '' ? <div key={i} /> :
                <button key={i} onClick={() => d === '⌫' ? setV(v.slice(0, -1)) : press(d)} className="btn3d w-16 h-14 rounded-xl bg-slate-100 border-2 border-slate-300 text-2xl font-bold">{d}</button>)}
            </div>
            <button onClick={onClose} className="text-lg underline mt-1">とじる</button>
          </div>
        </div>
      );
    }

    const pct = (a, b) => b ? `${Math.round((a / b) * 100)}%` : '－';
    const topOf = (m, n = 5) => Object.entries(m || {}).sort((a, b) => b[1] - a[1]).slice(0, n);
    const FRAC_KEYS = ['1/2', '1/4', '1/8', '1/3'];
    const stageLabel = (id) => { const st = STAGES.find(s => s.id === id); if (!st) return id; const i = mainStages().indexOf(st); return `${st.hatten ? 'はってん' : 'ステージ' + (st.no || i)} ${st.name}`; };

    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(api.pending());
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const cleared = (p) => mainStages().filter(st => isCleared(p, st)).length;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };
      const act = async (fn, okText) => {
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); onChanged(); } }
        catch (e) { flash('うまく いきませんでした：' + e.message); }
      };
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '﻿' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`ワケルン_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`ワケルン_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'wakerun') { flash('このアプリのバックアップではありません'); return; }
          if (!confirm('バックアップから、子どもの進み具合・コインを元にもどします。よろしいですか？')) return;
          await act(() => api.restore(pin, d), 'バックアップから元にもどしました');
        };
        rd.readAsText(f);
      };
      const opt = (key, list) => list.map(([v, t]) =>
        <button key={String(v)} onClick={() => setS({ ...s, [key]: v })} className={`ml-2 mt-1 rounded-lg px-3 py-1 border-2 ${s[key] === v ? 'bg-sky-200 border-sky-500' : 'bg-white'}`}>{t}</button>);
      const weak = (st) => {
        const list = FRAC_KEYS.filter(k => st.fracs[k] && st.fracs[k][0] >= 3).map(k => [k, st.fracs[k][1] / st.fracs[k][0]]).sort((a, b) => a[1] - b[1]);
        return list.length && list[0][1] < 0.8 ? `${list[0][0]}（${Math.round(list[0][1] * 100)}%）` : '－';
      };
      const confuseOf = (m, fr) => topOf(Object.fromEntries(Object.entries(m || {}).filter(([k]) => k.startsWith(fr + '→')).map(([k, v]) => [k.slice(fr.length + 1), v])), 3);

      return (
        <div className="fixed inset-0 bg-slate-50 z-50 overflow-auto">
          <div className="max-w-6xl mx-auto p-4 text-base">
            <div className="flex items-center gap-3 mb-3">
              <div className="text-2xl font-bold flex-1">🔒 先生用画面 <span className="text-sm text-slate-500">ver {APP_VERSION}{data.demo ? '（おためしモード）' : ''}</span></div>
              <button onClick={onClose} className="btn3d bg-white border-2 border-slate-400 rounded-xl px-4 py-2 font-bold">とじる</button>
            </div>
            {data.isDefaultPin && <div className="bg-rose-100 border-2 border-rose-400 rounded-xl p-2 mb-2">暗証番号が はじめの「1234」のままです。「せってい」で変えてください。</div>}
            {msg && <div className="fixed top-3 left-1/2 -translate-x-1/2 bg-sky-700 text-white rounded-xl px-4 py-2 z-50">{msg}</div>}
            <div className="flex gap-2 mb-3">
              {[['class', 'クラス全体'], ['child', '子どもごと'], ['settings', 'せってい'], ['data', 'データ']].map(([id, t]) => (
                <button key={id} onClick={() => setTab(id)} className={`rounded-xl px-4 py-2 font-bold border-2 ${tab === id ? 'bg-sky-200 border-sky-500' : 'bg-white border-slate-300'}`}>{t}</button>
              ))}
            </div>

            {tab === 'class' && (
              <div className="flex flex-col gap-4">
                <table className="w-full bg-white rounded-xl overflow-hidden text-left">
                  <thead className="bg-sky-100"><tr><th className="p-2">なまえ</th><th>クリア</th><th>レベル</th><th>みつけた数</th><th>まちがえずに</th><th>まちがえた タッチ</th><th>ヒント</th><th>コイン</th><th>さいご</th><th>いちばん にがてな 分数</th><th>よくある まちがい</th></tr></thead>
                  <tbody>
                    {data.students.map(st => {
                      const p = parseProgress(st.progress);
                      return (
                        <tr key={st.name} className="border-t cursor-pointer hover:bg-sky-50" onClick={() => { setSel(st.name); setTab('child'); }}>
                          <td className="p-2 font-bold">{st.name}</td>
                          <td>{cleared(p)} / {mainStages().length}</td>
                          <td>Lv.{levelOf(p.total) + 1}</td>
                          <td>{st.count}</td>
                          <td>{pct(st.ok, st.count)}</td>
                          <td>{st.miss}</td>
                          <td>{st.hint}</td>
                          <td>🪙 {p.coins}</td>
                          <td>{st.last || '－'}</td>
                          <td className="font-bold">{weak(st)}</td>
                          <td className="text-sm">{topOf(st.confuse, 2).map(([k, n]) => `${k}（${n}）`).join('、') || '－'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div className="text-sm text-slate-500">みつけた数：さがす分数を正しくタッチした数（1こ＝1問）。まちがえずに：その1こを見つけるまでに、まちがえたタッチがなかった割合。「1/3→1/4」は、1/3 をさがしているときに 1/4 をタッチしたことです。</div>
                <div className="grid md:grid-cols-2 gap-3">
                  <div className="bg-white rounded-xl p-3">
                    <div className="font-bold mb-2">クラス全体の 分数ごとの結果</div>
                    <table className="w-full text-left"><thead className="bg-slate-100"><tr><th className="p-1">分数</th><th>みつけた数</th><th>まちがえずに</th><th>まちがえた タッチ</th><th>よくある まちがい</th></tr></thead>
                      <tbody>{FRAC_KEYS.map(k => { const f = (data.classFracs || {})[k] || [0, 0, 0]; return <tr key={k} className="border-t"><td className="p-1 font-bold text-lg">{k}</td><td>{f[0]}</td><td>{pct(f[1], f[0])}</td><td>{f[2]}</td><td className="text-sm">{confuseOf(data.classConfuse, k).map(([w, n]) => `${w}（${n}）`).join('、') || '－'}</td></tr>; })}</tbody></table>
                  </div>
                  <div className="bg-white rounded-xl p-3">
                    <div className="font-bold mb-2">クラス全体の まちがいの しゅるい</div>
                    {topOf(data.classKinds, 5).map(([k, n]) => <div key={k} className="flex items-center gap-2 mb-1"><span className="w-40">{k}</span><div className="h-5 bg-rose-300 rounded" style={{ width: `${Math.min(100, n * 4)}%` }} /><span>{n}回</span></div>)}
                    {!Object.keys(data.classKinds || {}).length && <div className="text-slate-500">まだ ありません</div>}
                    <div className="text-sm text-slate-500 mt-2">ほかの ぶんすう：ちがう分数をタッチ。ひとしくない：同じ大きさに分けていない形をタッチ。2つぶん：2つ光っている形をタッチ（はってん）。</div>
                  </div>
                </div>
              </div>
            )}

            {tab === 'child' && (
              <div className="flex flex-col gap-3">
                <div className="flex gap-2 flex-wrap">
                  {data.students.map(st => <button key={st.name} onClick={() => setSel(st.name)} className={`rounded-xl px-4 py-2 font-bold border-2 ${sel === st.name ? 'bg-sky-200 border-sky-500' : 'bg-white border-slate-300'}`}>{st.name}</button>)}
                </div>
                {student && prog && (
                  <div className="grid md:grid-cols-2 gap-3">
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold text-xl mb-1">{student.name}</div>
                      <div>クリア：{cleared(prog)} / {mainStages().length}　レベル：{levelOf(prog.total) + 1}（{LEVELS[levelOf(prog.total)].n}）</div>
                      <div>コイン：🪙 {prog.coins}（これまでに {prog.earned}まい）　集めた品物：{prog.items.length} / {ALL_ITEMS.length}　ノーミス：{prog.perfect || 0}回</div>
                      <div>みつけた数：{student.count}　まちがえずに：{pct(student.ok, student.count)}　まちがえた タッチ：{student.miss}　ヒントを使った：{student.hint}　さいご：{student.last || '－'}</div>
                      <div className="mt-2 font-bold">ステージごとの結果</div>
                      <table className="w-full text-left text-sm">
                        <thead className="bg-slate-100"><tr><th className="p-1">ステージ</th><th>クリアした回</th><th>みつけた数</th><th>まちがえずに</th><th>まちがえた タッチ</th></tr></thead>
                        <tbody>
                          {STAGES.map(st => {
                            const g = student.stages[st.id] || [0, 0, 0];
                            return <tr key={st.id} className="border-t"><td className="p-1">{stageLabel(st.id)}{isCleared(prog, st) ? ' ⭐' : ''}</td><td>{prog.rounds[st.id] || 0} / {st.rounds}</td><td>{g[0] || '－'}</td><td>{pct(g[1], g[0])}</td><td>{g[2]}</td></tr>;
                          })}
                        </tbody>
                      </table>
                      <div className="mt-3 flex flex-wrap gap-2">
                        <button onClick={() => act(() => api.setFlag(pin, student.name, 'unlockAll', !prog.unlockAll), prog.unlockAll ? 'ステージの開放をやめました' : 'すべてのステージを開きました')} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog.unlockAll ? '🔓 全部開く：オン' : '🔒 全部開く：オフ'}</button>
                        <button onClick={() => act(() => api.setFlag(pin, student.name, 'hatten', !prog.hatten), prog.hatten ? 'はってんを閉じました' : 'はってんを開きました')} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog.hatten ? '✨ はってん：開いている' : '✨ はってん：閉じている'}</button>
                      </div>
                      <div className="mt-2 flex flex-wrap gap-2 items-center">
                        <span className="font-bold">コイン：</span>
                        {[-5, -1, 1, 5, 10].map(dv => <button key={dv} onClick={() => act(() => api.addCoins(pin, student.name, dv), `コインを ${dv > 0 ? '+' : ''}${dv} しました`)} className="rounded-lg px-3 py-1 border-2 bg-white font-bold">{dv > 0 ? '+' : ''}{dv}</button>)}
                      </div>
                      <div className="mt-3">
                        <button onClick={() => { if (confirm(`${student.name} さんの記録・進み具合・コイン・集めたものを、すべて消します。元にはもどせません。よろしいですか？`)) act(() => api.clear(pin, student.name), `${student.name} さんの記録を消しました`); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 この子の記録を消す</button>
                      </div>
                    </div>
                    <div className="bg-white rounded-xl p-3 flex flex-col gap-3">
                      <div>
                        <div className="font-bold mb-1">分数ごとの結果（どこで つまずいているか）</div>
                        <table className="w-full text-left"><thead className="bg-slate-100"><tr><th className="p-1">分数</th><th>みつけた数</th><th>まちがえずに</th><th>まちがえた タッチ</th><th>まちがえて タッチした もの</th></tr></thead>
                          <tbody>{FRAC_KEYS.map(k => { const f = student.fracs[k] || [0, 0, 0]; const r = f[0] ? f[1] / f[0] : 1;
                            return <tr key={k} className={`border-t ${f[0] && r < 0.6 ? 'bg-rose-50' : f[0] && r < 0.8 ? 'bg-amber-50' : ''}`}><td className="p-1 font-bold text-lg">{k}</td><td>{f[0]}</td><td>{pct(f[1], f[0])}</td><td>{f[2]}</td><td className="text-sm">{confuseOf(student.confuse, k).map(([w, n]) => `${w}（${n}）`).join('、') || '－'}</td></tr>; })}</tbody></table>
                      </div>
                      <div>
                        <div className="font-bold mb-1">まちがいの しゅるい</div>
                        {topOf(student.kinds, 5).map(([k, n]) => <div key={k} className="flex items-center gap-2 mb-1"><span className="w-40">{k}</span><div className="h-5 bg-rose-300 rounded" style={{ width: `${Math.min(100, n * 6)}%` }} /><span>{n}回</span></div>)}
                        {!Object.keys(student.kinds || {}).length && <div className="text-slate-500">まだ ありません</div>}
                      </div>
                      <div>
                        <div className="font-bold mb-1">形ごとの結果</div>
                        <table className="w-full text-left"><thead className="bg-slate-100"><tr><th className="p-1">形</th><th>正しく タッチ</th><th>まちがえて タッチ</th></tr></thead>
                          <tbody>{SHAPES.map(sh => { const v = student.shapes[sh.n] || [0, 0]; return <tr key={sh.id} className="border-t"><td className="p-1">{sh.n}</td><td>{v[0]}</td><td>{v[1]}</td></tr>; })}</tbody></table>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-3xl">
                <label className="flex items-center gap-3">よみあげの はやさ：<input type="range" min="0.5" max="1.2" step="0.05" value={s.rate} onChange={e => setS({ ...s, rate: Number(e.target.value) })} /> {s.rate}倍
                  <button className="border rounded px-2" onClick={() => { Speech.rate = s.rate; Speech.say('ワケルンの ぶんすう うちゅう パトロールだよ。1/2 を さがそう。'); }}>ためす</button></label>
                <div>もじの おおきさ：{opt('font', [[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']])}</div>
                <div>1回で みつける数：{opt('count', [[5, '5こ'], [10, '10こ'], [15, '15こ']])}</div>
                <div>おちる はやさ：{opt('speed', SPEEDS.map((x, i) => [i, x.n]))}</div>
                <div>いっしょに おちる数：{opt('at', [[2, '2こ'], [3, '3こ'], [4, '4こ'], [5, '5こ']])} <span className="text-sm text-slate-500">（少ないほど、さがしやすくなります）</span></div>
                <div>こうかおん：{opt('sound', [[true, 'ならす'], [false, 'ならさない']])}</div>
                <div className="text-sm text-slate-500">速さは自動では上がりません。慣れてきたら、ここで少しずつ上げてください。時間制限はありません。下まで落ちても失敗にはなりません。</div>
                <label>暗証番号を変える（4けた）：<input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} className="border-2 rounded px-2 py-1 w-24 ml-2" inputMode="numeric" placeholder="----" /></label>
                <div><button onClick={saveSettings} className="btn3d rounded-xl px-6 py-2 border-2 border-emerald-500 bg-emerald-100 font-bold text-xl">保存する</button>
                  <span className="text-sm text-slate-500 ml-2">（全員の画面に反映されます。子どもの画面は開き直すと変わります）</span></div>
              </div>
            )}

            {tab === 'data' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-2xl">
                <div>この端末に たまっている、まだ送れていない記録：<b>{pending}</b> 件
                  <button onClick={async () => { await api.flush(); setPending(api.pending()); flash(api.pending() ? 'まだ送れていません。ネットのつながりを確かめてください' : '送りました'); onChanged(); }} className="ml-2 rounded-xl px-3 py-1 border-2 bg-white font-bold">📤 スプレッドシートへ送る</button></div>
                <div><button onClick={csv} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">📄 記録をCSVで書き出す</button>
                  <div className="text-sm text-slate-500">ダウンロードできないときは、スプレッドシートの「きろく」シートを開き、ファイル → ダウンロード → CSV を選んでください。</div></div>
                <div className="flex gap-2 flex-wrap items-center">
                  <button onClick={backup} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">💾 バックアップを保存</button>
                  <label className="rounded-xl px-3 py-2 border-2 bg-white font-bold cursor-pointer">📂 バックアップから元にもどす<input type="file" accept=".json" className="hidden" onChange={restore} /></label>
                </div>
                <div><button onClick={() => { if (confirm('全員の記録・進み具合・コイン・集めたものを、すべて消します。元にはもどせません。よろしいですか？') && confirm('ほんとうに全員の記録を消しますか？')) act(() => api.clear(pin, ''), '全員の記録を消しました'); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 全員の記録を消す</button></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 15. アプリ ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [talk, setTalk] = useState({ text: '', mood: 'normal', talking: false });
      const [coinFx, setCoinFx] = useState({ k: 0, n: 0 });
      const [soundOn, setSoundOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const [levelUp, setLevelUp] = useState(null);
      const [newTitle, setNewTitle] = useState(null);
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const roundCoins = useRef(0);
      const progRef = useRef(progress);
      progRef.current = progress;

      const talkApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setTalk({ text, mood: opts.mood || 'normal', talking: true });
          Speech.say(text, () => { if (sayId.current === id) setTalk(p => ({ ...p, talking: false })); resolve(); });
        });
        return { say: run, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const talkCtx = { ...talkApi, ...talk, equip: progress.equip };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        v.sound = v.sound !== false && v.sound !== 'false';
        ['count', 'speed', 'at'].forEach(k => { v[k] = Number(v[k]); if (isNaN(v[k])) v[k] = DEFAULT_SETTINGS[k]; });
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8; Speech.pitch = Number(v.pitch) || 1.15;
        Sound.on = v.sound; setSoundOn(Sound.on);
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        const recs = records.current; records.current = [];
        api.save({ name, progress: json, records: recs, stamp: nowStr(), time: Date.now() });
        return p;
      };
      const updateProg = (fn) => { progRef.current = fn(progRef.current); setProgress(progRef.current); return progRef.current; };

      const login = async (n) => {
        Sound.get();
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグ（全部開く・はってん）は スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) p = { ...p, unlockAll: !!a.unlockAll, hatten: !!a.hatten, flagT: a.flagT };
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false);
        setView({ v: 'home' });
      };
      const logout = () => { talkApi.stop(); setName(null); setView({ v: 'login' }); };

      const roundOf = (st) => ((progRef.current.plays[st.id] || 0) % st.rounds) + 1;
      const start = (st, resume) => {
        talkApi.stop();
        records.current = []; roundCoins.current = 0;
        const part = resume && progRef.current.part && progRef.current.part.st === st.id ? progRef.current.part : null;
        if (st.kind === 'intro') { setView({ v: 'deau', st, key: uid() }); return; }
        if (st.kind === 'choose') { setView({ v: 'choose', st, round: part ? part.round : roundOf(st), found: part ? part.found : 0, key: uid() }); return; }
        setView({ v: 'hunt', st, round: part ? part.round : roundOf(st), found: part ? part.found : 0, ti: part ? part.ti || 0 : 0, key: uid() });
      };

      const onRecord = (r) => {
        records.current.push({ ...r, id: uid() });
        updateProg(p => ({ ...p, total: (p.total || 0) + 1, zukan: { ...p.zukan, [r.zukan]: (p.zukan[r.zukan] || 0) + 1 } }));
      };
      const onCoin = (n) => {
        roundCoins.current += n;
        setCoinFx(x => ({ k: x.k + 1, n })); Sound.coin();
        updateProg(p => ({ ...p, coins: p.coins + n, earned: p.earned + n }));
      };
      const onSave = (st, round) => (part) => persist({ ...progRef.current, part: { st: st.id, round, ...part } });

      const finish = (st, result) => {
        const before = titlesOf(progRef.current);
        const lvBefore = levelOf(progRef.current.total);
        let p = { ...progRef.current, part: null };
        const bonus = 5;
        p.coins += bonus; p.earned += bonus; roundCoins.current += bonus;
        const had = isCleared(p, st);
        p.rounds = { ...p.rounds, [st.id]: Math.min(st.rounds, (p.rounds[st.id] || 0) + 1) };
        p.plays = { ...p.plays, [st.id]: (p.plays[st.id] || 0) + 1 };
        if (result.perfect && st.kind !== 'intro') p.perfect = (p.perfect || 0) + 1;
        const stageClear = !had && isCleared(p, st);
        p = persist(p);
        let next = null;
        const ms = mainStages(), i = ms.findIndex(s => s.id === st.id);
        if (stageClear && !st.hatten && i >= 0 && ms[i + 1] && stageOpen(p, ms[i + 1])) next = () => start(ms[i + 1]);
        setView({ v: 'result', st, result: { ...result, coins: roundCoins.current, stageClear }, next });
        const nt = titlesOf(p).find(x => !before.includes(x));
        const lv = levelOf(p.total);
        if (lv > lvBefore) setTimeout(() => setLevelUp(lv), 2600);
        if (nt) setTimeout(() => { Sound.big(); setNewTitle(nt); }, lv > lvBefore ? 200 : 2600);
      };
      const quit = (st, round) => (part) => {
        talkApi.stop();
        persist({ ...progRef.current, part: part && part.found ? { st: st.id, round, ...part } : progRef.current.part });
        setView({ v: 'home' });
      };
      const buy = (it) => {
        const p = progRef.current;
        if (p.coins < it.p || p.items.includes(it.id)) return;
        persist({ ...p, coins: p.coins - it.p, items: [...p.items, it.id], equip: { ...p.equip, [it.slot]: it.id } });
      };
      const equip = (slot, id) => persist({ ...progRef.current, equip: { ...progRef.current.equip, [slot]: id } });

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const p = { ...progRef.current, unlockAll: !!sp.unlockAll, hatten: !!sp.hatten, flagT: sp.flagT, coins: sp.coins || 0, t: sp.t || Date.now() };
              const q = me.progress ? p : { ...newProgress(), t: Date.now() };
              progRef.current = q; setProgress(q); safeStore.set(COPY_KEY(name), JSON.stringify(q));
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-sky-100">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl text-white">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-slate-300 mt-2">{boot.error}</div></div>;

      const bar = (home = true) => (
        <TopBar name={name} coins={progress.coins} bump={coinFx.k} total={progress.total} onHome={home ? () => { talkApi.stop(); setView({ v: 'home' }); } : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }} />
      );

      let body = null;
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (view.v === 'home') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <HomeScreen name={name} progress={progress} onContinue={() => { const st = currentStage(progress); start(st, true); }}
            onStages={() => setView({ v: 'stages' })} onShop={() => setView({ v: 'shop' })} onZukan={() => setView({ v: 'zukan' })} /></div>;
      } else if (view.v === 'stages') {
        body = <div className="min-h-screen flex flex-col">{bar()}<StageScreen progress={progress} onStart={start} /></div>;
      } else if (view.v === 'deau') {
        body = <div className="min-h-screen flex flex-col">{bar()}<SpaceBg equip={progress.equip} dim={0.65} className="flex-1 flex justify-center" style={{ minHeight: 'calc(100vh - 64px)' }}>
          <div className="flex justify-center"><Deau key={view.key} onFinish={() => finish(view.st, { found: 0, perfect: false })} onQuit={() => { talkApi.stop(); setView({ v: 'home' }); }} /></div></SpaceBg></div>;
      } else if (view.v === 'choose') {
        body = <div className="min-h-screen flex flex-col relative"><CoinFly fx={coinFx} />{bar()}<SpaceBg equip={progress.equip} dim={0.65} className="flex-1 flex justify-center" style={{ minHeight: 'calc(100vh - 64px)' }}>
          <div className="flex justify-center"><Choose key={view.key} st={view.st} round={view.round} startFound={view.found} onRecord={onRecord} onCoin={onCoin}
            onSave={onSave(view.st, view.round)} onFinish={(r) => finish(view.st, r)} onQuit={quit(view.st, view.round)} /></div></SpaceBg></div>;
      } else if (view.v === 'hunt') {
        body = <div className="min-h-screen flex flex-col relative"><CoinFly fx={coinFx} />{bar()}
          <Hunt key={view.key} st={view.st} round={view.round} count={settings.count} startFound={view.found} startTi={view.ti} settings={settings} equip={progress.equip}
            onRecord={onRecord} onCoin={onCoin} onSave={onSave(view.st, view.round)} onFinish={(r) => finish(view.st, r)} onQuit={quit(view.st, view.round)} /></div>;
      } else if (view.v === 'result') {
        body = <div className="min-h-screen flex flex-col">{bar()}<ResultScreen view={view} progress={progress}
          onAgain={() => start(view.st)} onHome={() => setView({ v: 'home' })} onNext={view.next} /></div>;
      } else if (view.v === 'shop') {
        body = <div className="min-h-screen flex flex-col">{bar()}<ShopScreen progress={progress} onBuy={buy} onEquip={equip} onTitle={(t) => { Sound.big(); setNewTitle(t); }} /></div>;
      } else if (view.v === 'zukan') {
        body = <div className="min-h-screen flex flex-col">{bar()}<ZukanScreen progress={progress} /></div>;
      }

      return (
        <TalkCtx.Provider value={talkCtx}>
          {body}
          {levelUp != null && <LevelUpModal level={levelUp} equip={progress.equip} onClose={() => setLevelUp(null)} />}
          {newTitle && levelUp == null && <TitleModal title={newTitle} onClose={() => setNewTitle(null)} />}
          {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
          {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
        </TalkCtx.Provider>
      );
    }

    window.WAKE_READY.then(() => {
      const D = window.WAKE_DATA;
      STAGES = D.STAGES; SHAPES = D.SHAPES; DEN_YOMI = D.DEN_YOMI; NUM_YOMI = D.NUM_YOMI; TIERS = D.TIERS; ITEM_CATS = D.ITEM_CATS; FX = D.FX; LEVELS = D.LEVELS;
      HAS_IMG = new Set(D.IMAGES || []);
      ALL_ITEMS = ITEM_CATS.flatMap(c => c.items);
      ALL_ITEMS.forEach(it => { ITEM[it.id] = it; });
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:24px;line-height:1.8;color:#fff">データを よみこめませんでした。<br>ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<div style="font-size:14px;color:#aaa">' + e.message + '</div></div>';
    });
  </script>
</body>
