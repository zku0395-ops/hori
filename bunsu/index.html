    // ---- ひとしく わけて ある？（はい／いいえ）----
    function EqYN({ p, hint, api, done, host }) {
      const [gone, setGone] = useState([]);
      useEffect(() => {
        api.phase({ prompt: 'この ケーキは、おなじ おおきさに わけて あるかな？', hints: ['ピースの おおきさが みんな おなじか くらべよう。', 'ピースを かさねて みるよ。うごく わくと ピースが ぴったり かさなるかな？', `こたえは「${p.equal ? 'はい' : 'いいえ'}」だよ。`] });
      }, []);
      const choose = (o) => {
        if (o.v === p.equal) api.ok(o.v ? 'はい' : 'いいえ', p.equal ? 'みんな おなじ おおきさ。ひとしく わけて あるね。' : 'おおきさが ちがう ピースが あるね。ひとしく わけて いないよ。');
        else { setGone(g => [...g, o.v]); api.ng(o.v ? 'はい' : 'いいえ', 'equal', p.equal ? 'もう いちど よく みて みよう。ピースは みんな おなじ おおきさかな？' : 'よく みて！ おおきさが ちがう ピースが あるよ。'); }
      };
      const work = (
        <>
          <Cake cx={400} cy={258} r={198} n={p.n} sweeps={p.sweeps} />
          {hint >= 2 && !done && <GhostSweep cx={400} cy={258} r={198} n={p.n} sweeps={p.sweeps} />}
          {done && <SvgText x={400} y={500} size={34} color={p.equal ? '#047857' : '#c2410c'}>{p.equal ? 'ひとしく わけて ある' : 'ひとしく わけて いない'}</SvgText>}
        </>
      );
      const opts = [{ v: true, label: '⭕ はい' }, { v: false, label: '❌ いいえ' }];
      return <PlayLayout host={host} work={work} panel={<TextChoices opts={opts} gone={gone} glowV={hint >= 3 ? p.equal : undefined} onPick={choose} disabled={done} />} />;
    }

    // ---- ひとしく わけた ケーキを えらぶ ----
    const cardPos = k => k === 2 ? { xs: [210, 590], r: 150, cy: 262 } : { xs: [140, 400, 660], r: 108, cy: 262 };
    function EqPick({ p, hint, api, done, host }) {
      const [gone, setGone] = useState([]);
      useEffect(() => {
        api.phase({ prompt: 'おなじ おおきさに わけて ある ケーキは どれ？\nタップしよう。', hints: ['ピースが みんな おなじ おおきさの ケーキを さがそう。', 'ピースを かさねて くらべて みよう。', 'ひかって いる ケーキだよ。'] });
      }, []);
      const { xs, r, cy } = cardPos(p.cards.length);
      const tap = (j) => {
        if (done || gone.includes(j)) return;
        if (j === p.ans) api.ok(`${j + 1}ばんめ`, 'ピースが みんな おなじ おおきさ だね。');
        else { setGone(g => [...g, j]); api.ng(`${j + 1}ばんめ`, 'equal', 'その ケーキは、おおきさが ちがう ピースが あるよ。'); }
      };
      const work = p.cards.map((c, j) => (
        <CardG key={j} id={j} x={xs[j] - r - 26} y={cy - r - 26} w={r * 2 + 52} h={r * 2 + 52} onTap={() => tap(j)}
               state={done ? (j === p.ans ? 'ok' : 'normal') : gone.includes(j) ? 'gone' : 'normal'} glow={hint >= 3 && !done && j === p.ans}>
          <Cake cx={xs[j]} cy={cy} r={r} n={c.n} sweeps={c.sweeps} />
          {hint >= 2 && !done && !gone.includes(j) && <GhostSweep cx={xs[j]} cy={cy} r={r} n={c.n} sweeps={c.sweeps} />}
        </CardG>
      ));
      return <PlayLayout host={host} work={<g>{work}</g>} panel={<div className="muted bold tc" style={{ fontSize: '1.2rem' }}><R t="ケーキを タップして こたえてね。" /></div>} />;
    }

    // ---- おおきさが ちがう ピースを さがす ----
    function OddPiece({ p, hint, api, done, host }) {
      const [miss, setMiss] = useState([]);
      useEffect(() => {
        api.phase({ prompt: '1つだけ、おおきさが ちがう ピースが あるよ。\nどれかな？ タップしよう。', hints: ['ほかの ピースと くらべて、おおきすぎたり ちいさすぎたり する ピースを さがそう。', 'ピースを かさねて くらべて みよう。', 'ひかって いる ピースだよ。'] });
      }, []);
      const ps = pieceAngles(p.n, p.sweeps);
      const ref = p.odd === 0 ? 1 : 0;
      const tap = (i) => {
        if (done || miss.includes(i)) return;
        if (i === p.odd) api.ok(`${i + 1}ばんめのピース`, 'その ピースだけ おおきさが ちがうね。これでは ひとしく わけた ことに ならないね。');
        else { setMiss(m => [...m, i]); api.ng(`${i + 1}ばんめのピース`, 'equal', 'その ピースは ほかと おなじ おおきさだよ。'); }
      };
      return (
        <PlayLayout host={host} work={
          <>
            <Cake cx={400} cy={258} r={198} n={p.n} sweeps={p.sweeps} onPiece={done ? undefined : tap} glow={(hint >= 3 && !done) || done ? [p.odd] : []} />
            {hint >= 2 && !done && <GhostSweep cx={400} cy={258} r={198} n={p.n} sweeps={p.sweeps} refIdx={ref} />}
            {miss.map(i => { const [x, y] = P(400, 258, 120, ps[i].mid); return <text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="central" fontSize="46" fontWeight="900" fill="#94a3b8" pointerEvents="none">✕</text>; })}
          </>
        } panel={<div className="muted bold tc" style={{ fontSize: '1.2rem' }}><R t="ピースを タップして こたえてね。" /></div>} />
      );
    }

    // ---- いくつに わけた？ ----
    function CountTask({ p, hint, api, done, host }) {
      const [tapped, setTapped] = useState([]);
      const [gone, setGone] = useState([]);
      useEffect(() => {
        api.phase({ prompt: 'ケーキは ぜんぶで いくつに わけて あるかな？\nピースを タップすると ばんごうが つくよ。', hints: [p.colored.length ? 'いろが ついて いない ピースも かぞえるよ。ぜんぶ かぞえよう。' : 'ピースを 1つずつ かぞえよう。', 'いっしょに かぞえよう。', `こたえは ${tsu(p.d)} だよ。`] });
      }, []);
      const auto = useAutoCount(range0(p.d), hint >= 2 && !done, 'c' + hint);
      const numbers = done ? Object.fromEntries(range0(p.d).map(i => [i, i + 1])) : hint >= 2 ? auto : Object.fromEntries(tapped.map((pi, j) => [pi, j + 1]));
      const onPiece = (i) => { if (done || tapped.includes(i)) return; sfx('count'); setTapped(t => [...t, i]); };
      const choose = (o) => {
        if (o.v === p.d) api.ok(tsu(o.v), `${tsu(p.d)}に わけて あるね。`);
        else {
          setGone(g => [...g, o.v]);
          api.ng(tsu(o.v), 'count', p.colored.length && o.v === p.colored.length ? 'いろが ついて いない ピースも かぞえよう。' : 'もう いちど かぞえて みよう。ピースを タップすると かぞえやすいよ。');
        }
      };
      const work = (
        <>
          <Cake cx={400} cy={258} r={198} n={p.d} colored={p.colored} start={p.rot} onPiece={done ? undefined : onPiece} numbers={numbers} />
          {done && <SvgText x={400} y={500} size={34} color="#0369a1">{`ぜんぶで ${tsu(p.d)}`}</SvgText>}
        </>
      );
      return (
        <PlayLayout host={host} work={work} panel={
          <>
            <NumChoices opts={p.opts} gone={gone} glowV={hint >= 3 ? p.d : undefined} onPick={choose} disabled={done} />
            {tapped.length > 0 && !done && <div className="row center"><Btn color="white" size="sm" onClick={() => setTapped([])}>🔄 ばんごうを けす</Btn></div>}
          </>
        } />
      );
    }

    // ---- 分数を よむ（3つの だんかい：わけた かず → いろの かず → 分数）----
    function ReadTask({ p, s, hint, api, done, host }) {
      const steps = useMemo(() => stepsFor(p, s), []);
      const [phase, setPhase] = useState(steps[0] || 'frac');
      const [got, setGot] = useState({});
      const [gone, setGone] = useState([]);
      const [tapped, setTapped] = useState([]);
      useEffect(() => { api.guide(steps.length > 0); }, []);
      useEffect(() => {
        setGone([]); setTapped([]);
        if (phase === 'den') api.phase({ prompt: `①ケーキは ぜんぶで いくつに わけて あるかな？`, hints: ['いろが ついて いない ピースも、ぜんぶ かぞえよう。', 'いっしょに かぞえよう。', `こたえは ${tsu(p.d)} だよ。`] });
        else if (phase === 'num') api.phase({ prompt: '②いろが ついて いる ピースは いくつ？', hints: ['いろが ついて いる ピースだけ かぞえよう。', 'いっしょに かぞえよう。', `こたえは ${tsu(p.n)} だよ。`] });
        else api.phase({
          prompt: p.whole ? 'この ケーキを [分数|ぶんすう]で あらわすと？'
            : steps.length ? `${steps.length > 1 ? '③' : '②'}${tsu(p.d)}に わけた ${tsu(p.n)}ぶん。\n[分数|ぶんすう]で あらわすと？` : 'いろの ついた ところを [分数|ぶんすう]で あらわすと？',
          hints: [p.whole ? 'いくつに わけて、いくつ いろが ついて いるかな？' : 'わけた かずが したの かず（[分母|ぶんぼ]）、いろの ついた かずが うえの かず（[分子|ぶんし]）だよ。', 'ピースの かずを いっしょに かぞえよう。', `こたえは ${p.d}ぶんの${p.n} だよ。`],
        });
      }, [phase]);
      const order = phase === 'num' ? p.colored : range0(p.d);
      const auto = useAutoCount(order, hint >= 2 && !done, phase + hint);
      const numbers = done ? null : hint >= 2 ? auto : Object.fromEntries(tapped.map((pi, j) => [pi, j + 1]));
      const onPiece = (i) => {
        if (done || tapped.includes(i)) return;
        if (phase === 'num' && !p.colored.includes(i)) return;
        sfx('count'); setTapped(t => [...t, i]);
      };
      const next = () => { const k = steps.indexOf(phase); setPhase(steps[k + 1] || 'frac'); };
      const pickDen = (o) => {
        if (o.v === p.d) { sfx('pick'); api.note(`わけた数 ${o.v}`); setGot(g => ({ ...g, den: o.v })); next(); return; }
        setGone(g => [...g, o.v]);
        api.ng(`わけた数 ${o.v}`, 'count', o.v === p.n && p.n !== p.d ? 'いろが ついて いない ピースも、ぜんぶ かぞえよう。' : 'もう いちど かぞえて みよう。ピースを タップすると ばんごうが つくよ。');
      };
      const pickNum = (o) => {
        if (o.v === p.n) { sfx('pick'); api.note(`色の数 ${o.v}`); setGot(g => ({ ...g, num: o.v })); next(); return; }
        setGone(g => [...g, o.v]);
        if (o.v === p.d - p.n) api.ng(`色の数 ${o.v}`, 'uncolored', 'それは いろが ついて いない ピースの かずだよ。いろの ついた ピースを かぞえよう。');
        else if (o.v === p.d) api.ng(`色の数 ${o.v}`, 'count', 'それは ぜんぶの かずだよ。いろの ついた ピースだけ かぞえよう。');
        else api.ng(`色の数 ${o.v}`, 'count', 'もう いちど かぞえて みよう。');
      };
      const pickFrac = (o) => {
        const k = fkey(o.n, o.d);
        if (o.n === p.n && o.d === p.d) {
          api.ok(k, p.whole ? `${tsu(p.d)}に わけた ${tsu(p.d)}ぶんで、${fracMark(p.d, p.d)}。ケーキ ぜんぶで、1と おなじ だね。` : `${tsu(p.d)}に わけた ${tsu(p.n)}ぶんは ${fracMark(p.n, p.d)} だね。`);
          return;
        }
        setGone(g => [...g, k]);
        api.ng(k, o.err || 'other', (FRAC_NG[o.err] || FRAC_NG.count)(p, o));
      };
      const showGuide = steps.length > 0 || done;
      const unitAuto = steps.length === 1;   // ステージ2：いろの かずは 1
      const dV = done ? p.d : got.den, nV = done ? p.n : (got.num != null ? got.num : (unitAuto && got.den != null ? 1 : null));
      const work = (
        <>
          <Cake cx={232} cy={262} r={176} n={p.d} colored={p.colored} start={p.rot} onPiece={done ? undefined : onPiece} numbers={numbers} />
          {showGuide && <GuideLine x={452} y={92} v={dV} suffix={p.d >= 10 ? 'こに わけた' : 'つに わけた'} active={phase === 'den'} />}
          {showGuide && <GuideLine x={452} y={178} v={nV} suffix={(p.n >= 10 ? 'こぶん' : 'つぶん') + (p.whole ? '（ぜんぶ）' : '')} active={phase === 'num'} />}
          <FracSvg x={640} y={354} size={70} n={done ? p.n : null} d={done ? p.d : null} nBox={phase === 'frac' ? '#f59e0b' : undefined} dBox={phase === 'frac' ? '#f59e0b' : undefined} />
          {done && <SvgText x={540} y={311} size={22} color="#be185d" anchor="end">いろの かず</SvgText>}
          {done && <SvgText x={540} y={400} size={22} color="#1d4ed8" anchor="end">わけた かず</SvgText>}
          {done && <SvgText x={640} y={494} size={30} color="#9d174d">{`${p.d}ぶんの${p.n}`}</SvgText>}
        </>
      );
      let panel;
      if (phase === 'den') panel = <NumChoices opts={p.denOpts} gone={gone} glowV={hint >= 3 ? p.d : undefined} onPick={pickDen} disabled={done} />;
      else if (phase === 'num') panel = <NumChoices opts={p.numOpts} gone={gone} glowV={hint >= 3 ? p.n : undefined} onPick={pickNum} disabled={done} />;
      else panel = <FracChoices opts={p.opts} gone={gone} glowKey={hint >= 3 ? fkey(p.n, p.d) : undefined} onPick={pickFrac} disabled={done} />;
      return <PlayLayout host={host} work={work} panel={panel} />;
    }

    // ---- 絵を えらぶ（「{n/d} の ケーキは どれ？」）----
    function PicTask({ p, hint, api, done, host }) {
      const [gone, setGone] = useState([]);
      useEffect(() => {
        api.phase({ prompt: `${fracMark(p.n, p.d)} の ケーキは どれ？\nタップしよう。`, hints: [`したの かず ${p.d} は わけた かず。${tsu(p.d)}に わけた ケーキを さがそう。`, 'ケーキの したに、わけた かずを だすよ。', 'ひかって いる ケーキだよ。'] });
      }, []);
      const k = p.cards.length;
      const { xs, r } = cardPos(k);
      const cy = 318, rr = k === 2 ? 118 : 96;
      const ans = p.cards.findIndex(c => !c.err);
      const tap = (j) => {
        if (done || gone.includes(j)) return;
        const c = p.cards[j];
        if (!c.err) { api.ok(`${fkey(c.n, c.d)}の絵`, `${tsu(p.d)}に わけた ${tsu(p.n)}ぶん。${fracMark(p.n, p.d)} だね。`); return; }
        setGone(g => [...g, j]);
        const msg = c.err === 'uncolored' ? 'いろの ついて いる ピースの かずを たしかめよう。' : `${tsu(p.d)}に わけた ケーキを さがそう。ピースの かずを かぞえよう。`;
        api.ng(`${fkey(c.n, c.d)}の絵`, c.err, msg);
      };
      const work = (
        <>
          <FracSvg x={360} y={86} size={50} n={p.n} d={p.d} color="#9d174d" />
          <SvgText x={410} y={88} size={28} anchor="start" color="#9d174d">{`（${p.d}ぶんの${p.n}）`}</SvgText>
          {p.cards.map((c, j) => (
            <CardG key={j} id={j} x={xs[j] - rr - 24} y={cy - rr - 24} w={rr * 2 + 48} h={rr * 2 + 48} onTap={() => tap(j)}
                   state={done ? (j === ans ? 'ok' : 'normal') : gone.includes(j) ? 'gone' : 'normal'} glow={hint >= 3 && !done && j === ans}>
              <Cake cx={xs[j]} cy={cy} r={rr} n={c.d} colored={c.colored} />
            </CardG>
          ))}
          {(hint >= 2 || done) && p.cards.map((c, j) => <SvgText key={'t' + j} x={xs[j]} y={cy + rr + 44} size={24} color="#1d4ed8">{`${tsu(c.d)}に わけた`}</SvgText>)}
        </>
      );
      return <PlayLayout host={host} work={work} panel={<div className="muted bold tc" style={{ fontSize: '1.2rem' }}><R t="ケーキを タップして こたえてね。" /></div>} />;
    }

    // ---- 分数を つくる（色を ぬる）----
    function MakeTask({ p, s, hint, api, done, host }) {
      const [phase, setPhase] = useState(p.cutOpts ? 'cut' : 'paint');
      const [painted, setPainted] = useState([]);
      const [goneCut, setGoneCut] = useState([]);
      const guide = useMemo(() => guideFor(p, s), []);
      const whole = p.n === p.d;
      useEffect(() => { api.guide(guide); }, []);
      useEffect(() => {
        if (phase === 'cut') api.phase({ prompt: `${fracMark(p.n, p.d)} を つくるよ。\n${tsu(p.d)}に わけた ケーキは どれ？`, hints: [`したの かず（[分母|ぶんぼ]）の ${p.d} は、わけた かず だよ。`, 'ケーキの したに、わけた かずを だすよ。', 'ひかって いる ケーキだよ。'] });
        else api.phase({
          prompt: whole ? `ケーキ ぜんぶに いろを ぬって、${fracMark(p.d, p.d)} を つくろう。\nぬれたら「できた！」を おしてね。`
            : guide ? `${tsu(p.d)}に わけた ケーキの ${tsu(p.n)}ぶんに いろを ぬろう。\nぬれたら「できた！」を おしてね。`
              : `${fracMark(p.n, p.d)} に なるように いろを ぬろう。\nぬれたら「できた！」を おしてね。`,
          hints: [`うえの かず（[分子|ぶんし]）の ${p.n} が、ぬる かず だよ。`, 'ぬった ピースに ばんごうが つくよ。かぞえて みよう。', 'ひかって いる ピースを タップしよう。'],
        });
      }, [phase]);
      const tapCut = (j) => {
        if (done || goneCut.includes(j)) return;
        const c = p.cutOpts[j];
        if (c === p.d) { sfx('pick'); api.note(`${c}つのケーキ`); setPhase('paint'); return; }
        setGoneCut(g => [...g, j]);
        api.ng(`${c}つのケーキ`, 'count', `その ケーキは ${tsu(c)}に わけて あるよ。${tsu(p.d)}に わけた ケーキを さがそう。`);
      };
      const onPiece = (i) => {
        if (done) return;
        if (painted.includes(i)) { sfx('unpaint'); setPainted(x => x.filter(y => y !== i)); }
        else { sfx('paint'); setPainted(x => [...x, i]); }
      };
      const check = () => {
        const c = painted.length;
        if (c === 0) { api.tip('ピースを タップして、いろを ぬろう。'); return; }
        if (c === p.n) { api.ok(`${c}つぬった`, whole ? `ぜんぶ ぬって ${fracMark(p.d, p.d)}。1と おなじ だね。` : `${tsu(p.d)}に わけた ${tsu(p.n)}ぶん、${fracMark(p.n, p.d)} が できたね。`); return; }
        let err = 'count', msg = `ぬったのは ${tsu(c)} だよ。${tsu(p.n)} ぬろう。`;
        if (whole) err = 'whole';
        else if (c === p.d - p.n) { err = 'uncolored'; msg = `ぬるのは うえの かず（[分子|ぶんし]）の ${p.n} だよ。いま ${tsu(c)} ぬって いるね。`; }
        else if (c === p.d) msg = `ぜんぶ ぬって しまったね。ぬるのは ${tsu(p.n)} だよ。`;
        api.ng(`${c}つぬった`, err, msg);
      };
      if (phase === 'cut') {
        const k = p.cutOpts.length;
        const { xs } = cardPos(k);
        const cy = 318, rr = k === 2 ? 118 : 96;
        const work = (
          <>
            <FracSvg x={360} y={86} size={50} n={p.n} d={p.d} color="#9d174d" />
            <SvgText x={410} y={88} size={28} anchor="start" color="#9d174d">{`（${p.d}ぶんの${p.n}）`}</SvgText>
            {p.cutOpts.map((c, j) => (
              <CardG key={j} id={j} x={xs[j] - rr - 24} y={cy - rr - 24} w={rr * 2 + 48} h={rr * 2 + 48} onTap={() => tapCut(j)}
                     state={goneCut.includes(j) ? 'gone' : 'normal'} glow={hint >= 3 && c === p.d}>
                <Cake cx={xs[j]} cy={cy} r={rr} n={c} />
              </CardG>
            ))}
            {hint >= 2 && p.cutOpts.map((c, j) => <SvgText key={'t' + j} x={xs[j]} y={cy + rr + 44} size={24} color="#1d4ed8">{`${tsu(c)}に わけた`}</SvgText>)}
          </>
        );
        return <PlayLayout host={host} work={work} panel={<div className="muted bold tc" style={{ fontSize: '1.2rem' }}><R t="ケーキを タップして えらんでね。" /></div>} />;
      }
      const c = painted.length;
      const showNums = guide || hint >= 2 || done;
      let glow = [];
      if (hint >= 3 && !done) {
        if (c < p.n) glow = range0(p.d).filter(i => !painted.includes(i)).slice(0, p.n - c);
        else if (c > p.n) glow = painted.slice(p.n);
      }
      const work = (
        <>
          <Cake cx={248} cy={262} r={190} n={p.d} colored={painted} start={p.rot} onPiece={done ? undefined : onPiece} glow={glow}
                numbers={showNums ? Object.fromEntries(painted.map((pi, j) => [pi, j + 1])) : null} />
          <FracSvg x={636} y={128} size={62} n={p.n} d={p.d} color="#9d174d" />
          <SvgText x={636} y={232} size={28} color="#9d174d">{`${p.d}ぶんの${p.n}`}</SvgText>
          {guide && <SvgText x={636} y={292} size={28} color="#1d4ed8">{`${tsu(p.d)}に わけた`}</SvgText>}
          {guide && <SvgText x={636} y={336} size={28} color="#be185d">{whole ? 'ぜんぶ ぬる' : `${tsu(p.n)}ぶん ぬる`}</SvgText>}
          <g pointerEvents="none">
            <rect x={520} y={384} width={232} height={108} rx="20" fill={c === p.n ? '#ecfdf5' : '#fff'} stroke={c === p.n ? '#10b981' : '#fbcfe8'} strokeWidth="5" />
            <text x={636} y={414} textAnchor="middle" dominantBaseline="central" fontSize="22" fontWeight="700" fill="#64748b">ぬった かず</text>
            <text x={636} y={458} textAnchor="middle" dominantBaseline="central" fontSize="44" fontWeight="900" fill="#be185d">{tsu(c)}</text>
          </g>
        </>
      );
      return (
        <PlayLayout host={host} work={work} panel={
          <div className="col">
            <Btn color="green" size="xl" disabled={done} onClick={check} data-done="1">✅ できた！</Btn>
            <div className="row center"><Btn color="white" size="sm" disabled={done || !painted.length} onClick={() => setPainted([])}>🧽 ぜんぶ けす</Btn></div>
          </div>
        } />
      );
    }

    // ---- 分母？ 分子？（なまえ）----
    function NamePartTask({ p, hint, api, done, host }) {
      const [gone, setGone] = useState([]);
      const tapMode = p.v.startsWith('tap');
      const ans = p.v.endsWith('Den') ? 'den' : 'num';
      const ansName = ans === 'den' ? '[分母|ぶんぼ]' : '[分子|ぶんし]';
      useEffect(() => {
        const prompt = tapMode ? `${ansName}は どっちかな？ タップしよう。` : ans === 'den' ? `したの かず ${p.d} は、なんと いうかな？` : `うえの かず ${p.n} は、なんと いうかな？`;
        api.phase({ prompt, hints: ['[分母|ぶんぼ]は したの かず、[分子|ぶんし]は うえの かず だよ。', NAMES_HINT, `こたえは「${tapMode ? (ans === 'den' ? `したの ${p.d}` : `うえの ${p.n}`) : ansName}」だよ。`] });
      }, []);
      const answer = (v, txt) => {
        if (v === ans) { api.ok(txt, ans === 'den' ? `したの かず ${p.d} が [分母|ぶんぼ] だね。` : `うえの かず ${p.n} が [分子|ぶんし] だね。`); return; }
        setGone(g => [...g, v]);
        api.ng(txt, 'name', ans === 'den' ? '[分母|ぶんぼ]は したの かず だよ。' : '[分子|ぶんし]は うえの かず だよ。');
      };
      const cy = 262, size = 150;
      const ay = ans === 'den' ? cy + size * 0.66 : cy - size * 0.62;
      const work = (
        <>
          <FracSvg x={400} y={cy} size={size} n={p.n} d={p.d}
                   onTapN={tapMode && !done ? () => answer('num', `うえの${p.n}`) : undefined} onTapD={tapMode && !done ? () => answer('den', `したの${p.d}`) : undefined}
                   glowN={tapMode && hint >= 3 && ans === 'num'} glowD={tapMode && hint >= 3 && ans === 'den'}
                   nColor={done && ans === 'num' ? '#be185d' : undefined} dColor={done && ans === 'den' ? '#1d4ed8' : undefined} />
          {!tapMode && !done && (
            <g pointerEvents="none">
              <path d={`M 170 ${ay} L 290 ${ay}`} stroke="#f97316" strokeWidth="12" strokeLinecap="round" />
              <path d={`M 268 ${ay - 22} L 300 ${ay} L 268 ${ay + 22}`} fill="none" stroke="#f97316" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round" />
              <SvgText x={130} y={ay - 46} size={26} color="#c2410c">この かず</SvgText>
            </g>
          )}
          {(hint >= 2 || done) && (
            <g pointerEvents="none">
              <text x={540} y={cy - size * 0.62} textAnchor="middle" dominantBaseline="central" fontSize="64" className="emoji">🧒</text>
              <SvgText x={655} y={cy - size * 0.62} size={30} color="#be185d">ぶんし</SvgText>
              <text x={540} y={cy + size * 0.66} textAnchor="middle" dominantBaseline="central" fontSize="64" className="emoji">👩</text>
              <SvgText x={655} y={cy + size * 0.66} size={30} color="#1d4ed8">ぶんぼ</SvgText>
            </g>
          )}
        </>
      );
      const opts = [{ v: 'den', label: '[分母|ぶんぼ]' }, { v: 'num', label: '[分子|ぶんし]' }];
      return (
        <PlayLayout host={host} work={work} panel={tapMode
          ? <div className="muted bold tc" style={{ fontSize: '1.2rem' }}><R t="かずを タップして こたえてね。" /></div>
          : <TextChoices opts={opts} gone={gone} glowV={hint >= 3 ? ans : undefined} onPick={o => answer(o.v, o.v === 'den' ? '分母' : '分子')} disabled={done} />} />
      );
    }

    // ---- 分母と 分子から 分数を えらぶ ----
    function ByNamesTask({ p, hint, api, done, host }) {
      const [gone, setGone] = useState([]);
      useEffect(() => {
        api.phase({ prompt: `[分母|ぶんぼ]が ${p.d}、[分子|ぶんし]が ${p.n} の [分数|ぶんすう]は どれ？`, hints: ['[分母|ぶんぼ]は したの かず、[分子|ぶんし]は うえの かず だよ。', NAMES_HINT, 'ひかって いる こたえだよ。'] });
      }, []);
      const choose = (o) => {
        const k = fkey(o.n, o.d);
        if (o.n === p.n && o.d === p.d) { api.ok(k, `[分母|ぶんぼ]が したで、[分子|ぶんし]が うえ。${fracMark(p.n, p.d)} だね。`); return; }
        setGone(g => [...g, k]);
        api.ng(k, o.err === 'name' ? 'name' : 'other', o.err === 'name' ? `うえと したが ぎゃくだよ。[分母|ぶんぼ]の ${p.d} は したに かくよ。` : 'もう いちど、[分母|ぶんぼ]と [分子|ぶんし]の かずを たしかめよう。');
      };
      const tag = (y, label, v, col) => (
        <g pointerEvents="none">
          <rect x={70} y={y - 46} width={330} height={92} rx="20" fill="#fff" stroke={col} strokeWidth="5" />
          <text x={110} y={y} dominantBaseline="central" fontSize="34" fontWeight="900" fill={col}>{label}</text>
          <text x={340} y={y} textAnchor="middle" dominantBaseline="central" fontSize="54" fontWeight="900" fill="#1e293b">{v}</text>
        </g>
      );
      const work = (
        <>
          {tag(190, 'ぶんぼ は', p.d, '#1d4ed8')}
          {tag(330, 'ぶんし は', p.n, '#be185d')}
          <FracSvg x={600} y={262} size={96} n={done ? p.n : null} d={done ? p.d : null} />
          {(hint >= 2 || done) && <SvgText x={720} y={262 - 96 * 0.62} size={26} color="#be185d">🧒 ぶんし</SvgText>}
          {(hint >= 2 || done) && <SvgText x={720} y={262 + 96 * 0.66} size={26} color="#1d4ed8">👩 ぶんぼ</SvgText>}
        </>
      );
      return <PlayLayout host={host} work={work} panel={<FracChoices opts={p.opts} gone={gone} glowKey={hint >= 3 ? fkey(p.n, p.d) : undefined} onPick={choose} disabled={done} />} />;
    }

    // ---- 分母は いくつ？ 分子は いくつ？ ----
    function PartNumTask({ p, hint, api, done, host }) {
      const [gone, setGone] = useState([]);
      const den = p.ask === 'den';
      const v = den ? p.d : p.n;
      useEffect(() => {
        api.phase({
          prompt: `この ケーキを [分数|ぶんすう]で あらわすと、${den ? '[分母|ぶんぼ]' : '[分子|ぶんし]'}は いくつ？`,
          hints: den ? ['[分母|ぶんぼ]は わけた かず。ケーキは いくつに わけて あるかな？', 'いっしょに かぞえよう。', `こたえは ${p.d} だよ。`] : ['[分子|ぶんし]は いろの ついた ピースの かず だよ。', 'いっしょに かぞえよう。', `こたえは ${p.n} だよ。`],
        });
      }, []);
      const auto = useAutoCount(den ? range0(p.d) : p.colored, hint >= 2 && !done, 'pn' + hint);
      const choose = (o) => {
        if (o.v === v) { api.ok(String(o.v), `${tsu(p.d)}に わけた ${tsu(p.n)}ぶんで ${fracMark(p.n, p.d)}。[分母|ぶんぼ]は ${p.d}、[分子|ぶんし]は ${p.n} だね。`); return; }
        setGone(g => [...g, o.v]);
        const msg = o.err === 'name' ? (den ? `${o.v} は いろの ついた かず。それは [分子|ぶんし]に なるよ。` : `${o.v} は わけた かず。それは [分母|ぶんぼ]に なるよ。`)
          : o.err === 'uncolored' ? 'それは いろが ついて いない ピースの かずだよ。' : 'もう いちど かぞえて みよう。';
        api.ng(String(o.v), o.err || 'count', msg);
      };
      const work = (
        <>
          <Cake cx={248} cy={262} r={186} n={p.d} colored={p.colored} start={p.rot} numbers={hint >= 2 && !done ? auto : null} />
          <FracSvg x={620} y={250} size={84} n={done ? p.n : null} d={done ? p.d : null} nBox={!den ? '#f59e0b' : undefined} dBox={den ? '#f59e0b' : undefined} />
          <SvgText x={620} y={den ? 250 + 84 * 0.66 + 82 : 250 - 84 * 0.62 - 78} size={28} color={den ? '#1d4ed8' : '#be185d'}>{den ? 'ぶんぼ' : 'ぶんし'}</SvgText>
        </>
      );
      return <PlayLayout host={host} work={work} panel={<NumChoices opts={p.opts} gone={gone} glowV={hint >= 3 ? v : undefined} onPick={choose} disabled={done} fmt={x => String(x)} />} />;
    }

    // ---- わけた かず・いろの かずは 分母？ 分子？ ----
    function WhichPartTask({ p, hint, api, done, host }) {
      const [gone, setGone] = useState([]);
      const den = p.ask === 'den';
      const ansName = den ? '[分母|ぶんぼ]' : '[分子|ぶんし]';
      useEffect(() => {
        api.phase({
          prompt: den ? `ケーキを ${tsu(p.d)}に わけたよ。\nこの ${p.d} は [分母|ぶんぼ]？ [分子|ぶんし]？` : `いろが ついて いる ピースは ${tsu(p.n)}。\nこの ${p.n} は [分母|ぶんぼ]？ [分子|ぶんし]？`,
          hints: ['わけた かずは [分母|ぶんぼ]、いくつぶん（いろの ついた かず）は [分子|ぶんし] だよ。', '[分数|ぶんすう]で かくと、こう なるよ。', `こたえは「${ansName}」だよ。`],
        });
      }, []);
      const choose = (o) => {
        if (o.v === p.ask) { api.ok(o.v === 'den' ? '分母' : '分子', den ? `わけた かず ${p.d} は [分母|ぶんぼ] だね。` : `いろの ついた かず ${p.n} は [分子|ぶんし] だね。`); return; }
        setGone(g => [...g, o.v]);
        api.ng(o.v === 'den' ? '分母' : '分子', 'name', den ? 'わけた かずは、したに かく かず だよ。' : 'いくつぶんかを あらわす かずは、うえに かく かず だよ。');
      };
      const work = (
        <>
          <Cake cx={248} cy={262} r={186} n={p.d} colored={p.colored} start={p.rot} hl={den ? range0(p.d) : []} glow={!den ? p.colored : []} />
          <g pointerEvents="none">
            <rect x={482} y={70} width={296} height={150} rx="24" fill={den ? '#eff6ff' : '#fdf2f8'} stroke={den ? '#3b82f6' : '#ec4899'} strokeWidth="5" />
            <text x={630} y={120} textAnchor="middle" dominantBaseline="central" fontSize="34" fontWeight="900" fill={den ? '#1d4ed8' : '#be185d'}>{den ? `${tsu(p.d)}に わけた` : `いろの ついた ${tsu(p.n)}`}</text>
            <text x={630} y={178} textAnchor="middle" dominantBaseline="central" fontSize="30" fontWeight="900" fill="#1e293b">{`この ${den ? p.d : p.n} は？`}</text>
          </g>
          {(hint >= 2 || done) && <FracSvg x={630} y={372} size={64} n={p.n} d={p.d} nColor={!den ? '#be185d' : undefined} dColor={den ? '#1d4ed8' : undefined} />}
          {(hint >= 2 || done) && <SvgText x={720} y={den ? 372 + 64 * 0.66 : 372 - 64 * 0.62} size={24} color={den ? '#1d4ed8' : '#be185d'} anchor="start">{den ? 'ぶんぼ' : 'ぶんし'}</SvgText>}
        </>
      );
      const opts = [{ v: 'den', label: '[分母|ぶんぼ]' }, { v: 'num', label: '[分子|ぶんし]' }];
      return <PlayLayout host={host} work={work} panel={<TextChoices opts={opts} gone={gone} glowV={hint >= 3 ? p.ask : undefined} onPick={choose} disabled={done} />} />;
    }

    // ---- {d/d} は いくつと おなじ？ ----
    function WholeEqTask({ p, hint, api, done, host }) {
      const [gone, setGone] = useState([]);
      useEffect(() => {
        api.phase({ prompt: `${fracMark(p.d, p.d)} は、いくつと おなじ かな？`, hints: [`${tsu(p.d)}に わけた ${tsu(p.d)}ぶんは、ケーキ ぜんぶ だね。`, 'ケーキ 1こと おなじ だよ。', 'こたえは 1 だよ。'] });
      }, []);
      const choose = (o) => {
        if (o.v === 1) { api.ok('1', `${fracMark(p.d, p.d)} は ケーキ ぜんぶ。1と おなじ だね。`); return; }
        setGone(g => [...g, o.v]);
        api.ng(String(o.v), 'whole', o.v === 0 ? 'ケーキは ぜんぶ いろが ついて いるよ。' : `ケーキは ${p.d}こ では ないよ。ケーキ ぜんぶで いくつぶん かな？`);
      };
      const all = range0(p.d);
      const work = (
        <>
          <Cake cx={248} cy={262} r={186} n={p.d} colored={all} />
          <FracSvg x={560} y={252} size={84} n={p.d} d={p.d} color="#9d174d" />
          <SvgText x={662} y={256} size={64} color="#1e293b">＝</SvgText>
          <SvgText x={740} y={256} size={84} color={done ? '#047857' : '#cbd5e1'}>{done ? '1' : '？'}</SvgText>
          {(hint >= 2 || done) && <SvgText x={620} y={440} size={28} color="#047857">ケーキ ぜんぶ ＝ 1</SvgText>}
        </>
      );
      return <PlayLayout host={host} work={work} panel={<NumChoices opts={p.opts} gone={gone} glowV={hint >= 3 ? 1 : undefined} onPick={choose} disabled={done} fmt={x => String(x)} />} />;
    }

    // ---- おおきさくらべ ----
    const endAngle = (n, d) => 90 - 360 * n / d;
    const firstN = n => range0(n);
    function CmpTask({ p, hint, api, done, host }) {
      const [gone, setGone] = useState([]);
      const L = p.L, Rt = p.Rt;
      useEffect(() => {
        api.phase({ prompt: p.three ? 'どちらが おおきいかな？ それとも おなじ かな？' : 'どちらが おおきいかな？', hints: ['いろの ついた ところの おおきさを くらべよう。', 'てんせんで くらべて みよう。いろは どこまで ついて いるかな？', 'ひかって いる こたえだよ。'] });
      }, []);
      const lm = fracMark(L.n, L.d), rm = fracMark(Rt.n, Rt.d);
      const choose = (o) => {
        if (o.v === p.ans) {
          api.ok(o.v, p.ans === 'same' ? `${lm} と ${rm} は おなじ おおきさ だね。` : `${p.ans === 'left' ? lm : rm} の ほうが おおきい ね。`);
          return;
        }
        setGone(g => [...g, o.v]);
        api.ng(o.v, 'compare', 'いろの ついた ところを よく くらべて みよう。');
      };
      const show = hint >= 2 || done;
      const work = (
        <>
          <Cake cx={210} cy={214} r={150} n={L.d} colored={firstN(L.n)} marks={show ? [endAngle(Rt.n, Rt.d)] : []} />
          <Cake cx={590} cy={214} r={150} n={Rt.d} colored={firstN(Rt.n)} marks={show ? [endAngle(L.n, L.d)] : []} />
          <FracSvg x={210} y={448} size={46} n={L.n} d={L.d} />
          <FracSvg x={590} y={448} size={46} n={Rt.n} d={Rt.d} />
          {done && <SvgText x={400} y={448} size={40} color="#047857">{p.ans === 'same' ? '＝' : p.ans === 'left' ? '＞' : '＜'}</SvgText>}
        </>
      );
      const opts = [{ v: 'left', label: `ひだりの ${lm}`, small: true }, { v: 'right', label: `みぎの ${rm}`, small: true }];
      if (p.three) opts.push({ v: 'same', label: 'おなじ', small: true });
      return <PlayLayout host={host} work={work} panel={<TextChoices opts={opts} gone={gone} glowV={hint >= 3 ? p.ans : undefined} onPick={choose} disabled={done} />} />;
    }

    // ---- おなじ おおきさの 分数を ぜんぶ さがす ----
    function FindSameTask({ p, hint, api, done, host }) {
      const [sel, setSel] = useState([]);
      const t = p.t;
      useEffect(() => {
        api.phase({ prompt: `${fracMark(t.n, t.d)} と おなじ おおきさの [分数|ぶんすう]を ぜんぶ えらぼう。\nえらんだら「できた！」を おしてね。`, hints: ['いろの ついた ところの おおきさが おなじ ものを さがそう。', 'てんせんの ところまで いろが ついて いるかな？', 'ひかって いる カードだよ。'] });
      }, []);
      const tap = (j) => { if (done) return; sfx('pick'); setSel(x => x.includes(j) ? x.filter(y => y !== j) : [...x, j]); };
      const check = () => {
        if (!sel.length) { api.tip('カードを タップして えらぼう。'); return; }
        const ans = p.cards.map((c, j) => c.eq ? j : -1).filter(j => j >= 0);
        const txt = sel.map(j => fkey(p.cards[j].n, p.cards[j].d)).join('・');
        const wrong = sel.some(j => !p.cards[j].eq);
        const missing = ans.some(j => !sel.includes(j));
        if (!wrong && !missing) { api.ok(txt, `${ans.map(j => fracMark(p.cards[j].n, p.cards[j].d)).join(' と ')} が、${fracMark(t.n, t.d)} と おなじ おおきさ だね。`); return; }
        api.ng(txt, 'compare', wrong ? 'おおきさが ちがう ものが まざって いるよ。' : 'まだ ほかにも あるよ。さがして みよう。');
      };
      const show = hint >= 2 || done;
      const work = (
        <>
          <Cake cx={110} cy={108} r={70} n={t.d} colored={firstN(t.n)} small />
          <FracSvg x={236} y={106} size={48} n={t.n} d={t.d} color="#9d174d" />
          <SvgText x={290} y={108} size={30} anchor="start" color="#9d174d">と おなじ おおきさは？</SvgText>
          {p.cards.map((c, j) => {
            const cx = 88 + j * 156;
            const st = done ? (c.eq ? 'ok' : 'normal') : sel.includes(j) ? 'sel' : 'normal';
            return (
              <CardG key={j} id={j} x={cx - 70} y={228} w={140} h={270} onTap={() => tap(j)} state={st} glow={hint >= 3 && !done && c.eq}>
                <Cake cx={cx} cy={312} r={56} n={c.d} colored={firstN(c.n)} small marks={show ? [endAngle(t.n, t.d)] : []} />
                <FracSvg x={cx} y={434} size={34} n={c.n} d={c.d} />
              </CardG>
            );
          })}
        </>
      );
      return (
        <PlayLayout host={host} work={work} panel={
          <div className="col">
            <Btn color="green" size="xl" disabled={done} onClick={check} data-done="1">✅ できた！</Btn>
            <div className="tc muted bold" style={{ fontSize: '1.15rem' }}><R t={`えらんだ カード：${sel.length}まい`} /></div>
          </div>
        } />
      );
    }

    const KIND = {
      eqYN: EqYN, eqPick: EqPick, oddPiece: OddPiece, count: CountTask, read: ReadTask, pic: PicTask, make: MakeTask,
      namePart: NamePartTask, byNames: ByNamesTask, partNum: PartNumTask, whichPart: WhichPartTask, wholeEq: WholeEqTask,
      cmp: CmpTask, findSame: FindSameTask,
    };

    /* =========================================================
       ステージの アイコン
       ========================================================= */
    function StageIcon({ id, size = 76 }) {
      const c = (props) => <Cake cx={40} cy={40} r={30} small {...props} />;
      const body = {
        s0: c({ n: 4 }),
        s1: c({ n: 6, numbers: { 0: 1, 1: 2, 2: 3 } }),
        s2: c({ n: 2, colored: [0] }),
        s3: <>{c({ n: 4, colored: [0] })}<text x="62" y="66" fontSize="24" className="emoji" textAnchor="middle" dominantBaseline="central">🖌️</text></>,
        s4: c({ n: 5, colored: [0, 1] }),
        s5: <>{c({ n: 5, colored: [0, 1, 2] })}<text x="62" y="66" fontSize="24" className="emoji" textAnchor="middle" dominantBaseline="central">🖌️</text></>,
        s6: <><rect x="6" y="6" width="68" height="68" rx="16" fill="#fff" stroke="#fbcfe8" strokeWidth="3" /><FracSvg x={40} y={40} size={28} n={2} d={5} nColor="#be185d" dColor="#1d4ed8" /></>,
        s7: c({ n: 8, colored: [0, 1, 2] }),
        tk: <><Cake cx={22} cy={40} r={17} n={2} colored={[0]} small /><Cake cx={58} cy={40} r={17} n={4} colored={[0, 1]} small /></>,
      }[id];
      return <svg viewBox="0 0 80 80" width={size} height={size} aria-hidden="true" style={{ flex: 'none' }}>{body}</svg>;
    }

    /* =========================================================
       ホーム（ケーキやさん）
       ========================================================= */
    let GREETED = false;
    function HomeScreen({ app, onPlay, onMenu, onShop, onCollection }) {
      const st = app.state;
      const next = findNext(st);
      const name = st.profile ? st.profile.name : '';
      const t = titleOf(st);
      const [talking, setTalking] = useState(false);
      const pos = next ? (prog(st, next.id).idx || 0) : 0;
      const msg = next
        ? `いらっしゃい！\nきょうは「${stageLabel(next)} ${next.name}」に ちょうせん しよう。`

    function ShopScreen({ app, onCollection }) {
      const st = app.state;
      const [cat, setCat] = useState(SHOP[0].id);
      const [buying, setBuying] = useState(null);
      const [got, setGot] = useState(null);
      const c = SHOP.find(x => x.id === cat);
      const tapItem = (it) => {
        if (st.owned[it.id]) { sfx('tap'); TTS.speak(`${it.name}。もう もって いるよ。`); return; }
        sfx('open'); setBuying(it);
        TTS.speak(st.coins >= it.price ? `${it.name}は ${it.price}コイン だよ。かいますか？` : `${it.name}は ${it.price}コイン。あと ${it.price - st.coins}コイン たりないよ。`);
      };
      const buy = (it) => {
        const cur = app.stateRef.current;
        if (cur.owned[it.id] || cur.coins < it.price) return;
        const cc = SHOP.find(x => x.id === it.cat);

    function PinPad({ onSuccess, onClose, check }) {
      const [digits, setDigits] = useState('');
      const [shake, setShake] = useState(false);
      const press = (d) => {
        if (digits.length >= 4) return;
        const v = digits + d;
        setDigits(v);
        if (v.length === 4) {
          setTimeout(() => {
            if (check(v)) onSuccess();
            else { sfx('ng'); setShake(true); setTimeout(() => { setShake(false); setDigits(''); }, 450); }
          }, 150);
        }
      };
      return (
        <Modal onClose={onClose}>
          <div className={`card tc ${shake ? 'shake' : ''}`} style={{ maxWidth: 380, margin: '0 auto' }}>
            <div className="bold" style={{ fontSize: '1.5rem' }}>🔐 先生用の画面</div>
            <div className="muted" style={{ marginBottom: '.8rem' }}>4けたの暗証番号を入れてください</div>

              {[0, 1, 2, 3].map(i => <span key={i} style={{ width: 22, height: 22, borderRadius: 99, border: '2px solid #334155', background: i < digits.length ? '#334155' : 'transparent' }} />)}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '.5rem' }}>
              {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => <Btn key={d} color="white" size="lg" onClick={() => press(d)} data-pin={d}>{d}</Btn>)}
              <Btn color="white" size="lg" onClick={() => setDigits(s => s.slice(0, -1))}>⌫</Btn>
              <Btn color="white" size="lg" onClick={() => press('0')} data-pin="0">0</Btn>
              <Btn color="slate" size="lg" onClick={onClose}>✕</Btn>
            </div>
          </div>
        </Modal>
      );
    }

    function RecordsTab({ app }) {

      useEffect(() => { DB.getAll('history').then(h => setHist(h.sort((a, b) => b.at - a.at))).catch(() => setHist([])); }, []);
      if (!hist) return <div className="card">読み込み中…</div>;
      const done = hist.filter(h => h.done);
      const first = done.filter(h => !h.mistakes).length;
      const errTotal = {}; hist.forEach(h => (h.errors || []).forEach(e => { errTotal[e] = (errTotal[e] || 0) + 1; }));
      const maxErr = Math.max(1, ...Object.values(errTotal));
      const t = titleOf(st);
      const box = (label, value) => <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '.8rem', padding: '.6rem .9rem' }}><div className="muted" style={{ fontSize: '.85rem' }}>{label}</div><div className="bold" style={{ fontSize: '1.3rem' }}>{value}</div></div>;
      return (

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '.6rem' }}>

              {box('称号', `${t.icon} ${t.name}`)}

              {box('1回で正解', done.length ? `${Math.round(first / done.length * 100)}%` : '—')}
              {box('コイン（いま／これまで）', `${st.coins} ／ ${st.earned}`)}
              {box('集めたグッズ', `${ownedCount(st)} / ${ALL_ITEMS.length}`)}
            </div>
          </div>
          <div className="card" style={{ borderColor: '#e2e8f0', overflowX: 'auto' }}>
            <div className="bold" style={{ fontSize: '1.2rem', marginBottom: '.4rem' }}>ステージごとの様子</div>
            <table className="tbl">
              <thead><tr><th>ステージ</th><th>状態</th><th>いまの位置</th><th>クリア回数</th><th>といた問題</th><th>1回で正解</th><th>ヒントを使った問題</th><th>多いつまずき</th></tr></thead>
              <tbody>
                {STAGES.map(s => {
                  const hs = done.filter(h => h.stageId === s.id);
                  const fr = hs.filter(h => !h.mistakes).length;
                  const errs = {}; hist.filter(h => h.stageId === s.id).forEach(h => (h.errors || []).forEach(e => { errs[e] = (errs[e] || 0) + 1; }));
                  const top = Object.entries(errs).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([e, n]) => `${ERR[e] || e}×${n}`).join('、');
                  const pr = prog(st, s.id);
                  const status = isCleared(s.id, st) ? '✅ クリア' : pr.idx ? '▶ 挑戦中' : isStageOpen(s, st) ? '—' : '🔒';
                  return <tr key={s.id}><td>{stageName(s)}</td><td>{status}</td><td>{pr.cleared ? `${(pr.clears || 0) + 1}周目の${(pr.idx || 0) + 1}問目` : pr.idx ? `${pr.idx + 1}問目 / ${PER_STAGE}` : '—'}</td><td>{pr.clears || 0}</td><td>{hs.length}</td><td>{hs.length ? `${fr}（${Math.round(fr / hs.length * 100)}%）` : '—'}</td><td>{hs.filter(h => h.hints).length}</td><td>{top || '—'}</td></tr>;
                })}
              </tbody>
            </table>
          </div>
          <div className="card" style={{ borderColor: '#e2e8f0' }}>
            <div className="bold" style={{ fontSize: '1.2rem', marginBottom: '.4rem' }}>つまずきの種類（まちがえた回数）</div>

            {ERR_KEYS.filter(k => errTotal[k]).map(k => (
              <div key={k} className="row" style={{ marginBottom: '.3rem' }}>
                <div style={{ width: 220, flex: 'none' }}>{ERR[k]}</div>
                <div className="grow" style={{ background: '#f1f5f9', borderRadius: 99, height: 18 }}><div style={{ width: `${errTotal[k] / maxErr * 100}%`, background: '#fb923c', height: 18, borderRadius: 99 }} /></div>
                <div style={{ width: 50, textAlign: 'right' }} className="bold">{errTotal[k]}</div>
              </div>
            ))}
          </div>
          <div className="card" style={{ borderColor: '#e2e8f0', overflowX: 'auto' }}>

              <tbody>

              </tbody>
            </table>
          </div>
        </div>
      );

          <TRow label="暗証番号の変更">
            <input className="inp" style={{ width: 120 }} type="password" inputMode="numeric" maxLength={4} placeholder="新しい番号" value={pin} onChange={e => setPin(e.target.value.replace(/\D/g, ''))} />
            <input className="inp" style={{ width: 120 }} type="password" inputMode="numeric" maxLength={4} placeholder="確認" value={pin2} onChange={e => setPin2(e.target.value.replace(/\D/g, ''))} />
            <Btn color="sky" size="sm" onClick={() => {
              if (!/^\d{4}$/.test(pin)) return setMsg('暗証番号は4けたの数字にしてください。');
              if (pin !== pin2) return setMsg('確認用の番号が一致しません。');
              update(st => ({ ...st, profile: { ...st.profile, pin: hashPin(pin) } })); setPin(''); setPin2(''); setMsg('暗証番号を変更しました。');
            }}>変更</Btn>
          </TRow>
          {msg && <div className="bold" style={{ color: '#047857', fontSize: '1.1rem' }}>{msg}</div>}
        </div>
      );
    }
    function SyncPanel({ app }) {
      const sync = app.state.sync || {};
      const [pending, setPending] = useState(null);
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState('');
      const [editing, setEditing] = useState(!sync.url);
      const [url, setUrl] = useState(sync.url || '');
      const [key, setKey] = useState(sync.key || '');
      const countPending = async () => { try { setPending((await DB.getAll('history')).filter(h => !h.sent).length); } catch (e) { setPending(null); } };
      useEffect(() => { countPending(); }, [sync.lastOkAt, sync.lastErrorAt]);
      const send = async (all) => {
        setBusy(true); setMsg('');
        const r = await Sync.run(app, { all });
        setBusy(false); countPending();
        if (r.ok) setMsg(r.sent ? `${r.sent}件の記録を送りました。` : '送っていない記録はありません（一覧は最新です）。');
        else if (r.reason === 'offline') setMsg('インターネットにつながっていません。');
      };
      const save = () => {
        const u = url.trim();
        if (!REC_URL_RE.test(u)) { setMsg('URLの形がちがいます。「https://script.google.com/macros/s/…/exec」の形のURLを入れてください。'); return; }
        if (!key.trim()) { setMsg('合言葉を入れてください。'); return; }
        app.update(s => ({ ...s, sync: { ...s.sync, url: u, key: key.trim(), lastError: null, lastSummary: null } }));
        setEditing(false); setMsg('送り先を保存しました。「今すぐ送る」で送信を確かめてください。');
      };
      const clearUrl = () => {
        if (!confirm('記録の送り先を消しますか？（この端末の記録は消えません）')) return;
        app.update(s => ({ ...s, sync: {} }));
        setUrl(''); setKey(''); setEditing(true); setMsg('送り先を消しました。');
      };
      const errShown = sync.lastError && (!sync.lastOkAt || sync.lastErrorAt > sync.lastOkAt);
      const stat = (label, value, ok) => <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '.8rem', padding: '.6rem .9rem' }}><div className="muted" style={{ fontSize: '.85rem' }}>{label}</div><div className="bold" style={{ color: ok ? '#047857' : undefined }}>{value}</div></div>;
      return (
        <div className="card" style={{ borderColor: '#bae6fd' }}>
          <div className="bold" style={{ fontSize: '1.2rem' }}>📡 先生のスプレッドシートへの送信</div>
          <div className="muted" style={{ marginBottom: '.6rem' }}>1問とくたびに、結果を先生のGoogleスプレッドシートへ自動で送ります。送れなかった記録は、次につながったときに送り直します。</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))', gap: '.6rem', marginBottom: '.6rem' }}>
            {stat('送り先', sync.url ? '✅ 設定ずみ' : '未設定', !!sync.url)}
            {stat('まだ送っていない記録', pending == null ? '…' : `${pending}件`)}
            {stat('最後に送れた日時', sync.lastOkAt ? fmtDate(sync.lastOkAt) : '—')}
          </div>
          {errShown && <div style={{ background: '#fff1f2', border: '1px solid #fecdd3', color: '#9f1239', borderRadius: '.8rem', padding: '.6rem', marginBottom: '.6rem' }}>⚠️ {syncErrorText(sync.lastError)}</div>}
          {sync.url && (
            <div className="row wrapflex" style={{ marginBottom: '.5rem' }}>
              <Btn color="sky" size="md" disabled={busy} onClick={() => send(false)}>📤 今すぐ送る</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={() => send(true)}>🔁 これまでの記録をまとめて送る</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={() => setEditing(v => !v)}>✏️ 送り先を入力</Btn>
            </div>
          )}
          {!sync.url && <div className="muted" style={{ marginBottom: '.5rem' }}>入口ページ（Apps Script）の「はじめる」から開くと、送り先は自動で設定されます。入口ページを通さずに開いた端末では、スプレッドシートのメニュー「モカせんせい → 子どもに配るURLと合言葉を表示」で出るURLと合言葉を、ここに入力してください。</div>}
          {editing && (
            <div className="col" style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '.8rem', padding: '.7rem' }}>
              <label><div className="bold" style={{ fontSize: '.9rem' }}>送り先のURL（…/exec）</div><input className="inp" style={{ width: '100%' }} value={url} onChange={e => setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/……/exec" /></label>
              <label><div className="bold" style={{ fontSize: '.9rem' }}>合言葉</div><input className="inp" style={{ width: '100%' }} value={key} onChange={e => setKey(e.target.value)} /></label>
              <div className="row"><Btn color="green" size="sm" onClick={save}>保存</Btn>{sync.url && <Btn color="white" size="sm" onClick={clearUrl}>送り先を消す</Btn>}</div>
            </div>
          )}
          {busy && <div className="bold muted" style={{ marginTop: '.4rem' }}>送信中…</div>}
          {msg && <div className="bold" style={{ marginTop: '.4rem' }}>{msg}</div>}
        </div>
      );
    }
    function DataTab({ app }) {
      const [msg, setMsg] = useState('');
      const [busy, setBusy] = useState(false);
      const exportCSV = async () => {
        const hist = (await DB.getAll('history')).sort((a, b) => a.at - b.at);
        const esc = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
        const rows = [['日時', 'ステージ', '問題番号', '問題', '正しい答え', '答えた内容', '結果', 'まちがえた回数', 'ヒントの回数', 'かかった時間(秒)', 'つまずき', '分母の範囲', '手がかり']];
        hist.forEach(h => {
          const s = STAGE_MAP[h.stageId];
          rows.push([fmtDate(h.at), s ? stageName(s) : h.stageId, h.no, h.label, h.correct, (h.answers || []).join(' → '), h.result, h.mistakes, h.hints, h.sec, [...new Set(h.errors || [])].map(e => ERR[e] || e).join('、'), h.range === 'g2' ? '2年生' : '2〜12', h.guide ? 'あり' : 'なし']);
        });
        const name = app.state.profile ? app.state.profile.name : 'record';
        downloadFile(`分数の記録_${name}_${ymd()}.csv`, '﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n'), 'text/csv');
        setMsg(`${hist.length}件の記録をCSVで書き出しました。`);
      };
      const exportBackup = async () => {
        setBusy(true);
        try {
          const history = await DB.getAll('history');
          const name = app.state.profile ? app.state.profile.name : 'backup';
          downloadFile(`分数バックアップ_${name}_${ymd()}.json`, JSON.stringify({ app: APP_ID, kind: 'backup', version: 1, state: app.stateRef.current, history }), 'application/json');
          setMsg('バックアップを書き出しました。');
        } finally { setBusy(false); }
      };
      const importBackup = async () => {
        const file = await pickFile('.json,application/json');
        if (!file) return;
        let data;
        try { data = JSON.parse(await file.text()); } catch (e) { setMsg('ファイルを読み込めませんでした。'); return; }
        if (!data || data.app !== APP_ID || data.kind !== 'backup') { setMsg('このアプリのバックアップファイルを選んでください。'); return; }
        if (!confirm('今のChromebookの記録を、バックアップの内容で置き換えます。よろしいですか？')) return;
        setBusy(true);
        try {
          await DB.clear('history');
          for (const h of data.history || []) await DB.put('history', h);
          const st = data.state || {};
          app.update(cur => {
            const next = normalizeState({ ...st, deviceId: st.deviceId || cur.deviceId });
            return { ...next, sync: cur.sync && cur.sync.url ? cur.sync : next.sync };
          });
          setMsg('バックアップから元にもどしました。');
        } catch (e) { setMsg('読み込み中にエラーが起きました。'); }
        finally { setBusy(false); }
      };
      const resetAll = async () => {
        if (!confirm('この児童の記録・ステージの進み具合・コイン・集めたグッズをすべて消します。元にもどせません。よろしいですか？')) return;
        if (!confirm('本当に消しますか？（設定と名前は残ります）')) return;
        await DB.clear('history');
        app.update(s => ({ ...s, progress: {}, coins: 0, earned: 0, owned: {}, sync: { ...s.sync, lastSummary: null } }));
        setMsg('記録を消しました。');
      };
      return (
        <div className="col" style={{ gap: '1rem' }}>
          <SyncPanel app={app} />
          <div className="card" style={{ borderColor: '#e2e8f0' }}>
            <div className="bold" style={{ fontSize: '1.2rem' }}>記録の書き出し（CSV）</div>
            <div className="muted" style={{ marginBottom: '.5rem' }}>すべての問題の結果を、スプレッドシートで開けるファイルにします。</div>
            <Btn color="sky" size="md" onClick={exportCSV}>📄 CSVで書き出す</Btn>
          </div>
          <div className="card" style={{ borderColor: '#e2e8f0' }}>
            <div className="bold" style={{ fontSize: '1.2rem' }}>バックアップ</div>
            <div className="muted" style={{ marginBottom: '.5rem' }}>記録・進み具合・コイン・グッズ・設定をまとめて保存します。Chromeの閲覧データを消すと記録も消えるので、ときどきバックアップしてください。端末を替えるときにも使えます。</div>
            <div className="row wrapflex">
              <Btn color="sky" size="md" disabled={busy} onClick={exportBackup}>💾 バックアップを書き出す</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={importBackup}>📥 バックアップから元にもどす</Btn>
            </div>
          </div>
          <div className="card" style={{ borderColor: '#fecdd3' }}>
            <div className="bold" style={{ fontSize: '1.2rem', color: '#be123c' }}>記録をすべて消す</div>
            <div className="muted" style={{ marginBottom: '.5rem' }}>新しい児童が使うときなどに使います。コインと集めたグッズも消えます。</div>
            <Btn color="red" size="md" onClick={resetAll}>🗑️ 記録を消す</Btn>
          </div>
          {msg && <div className="bold" style={{ color: '#047857', fontSize: '1.1rem' }}>{msg}</div>}
        </div>
      );
    }

    /* =========================================================
       アプリ全体
       ========================================================= */
    function Header({ app, view, onHome, onBack, onTeacher, onShop }) {
      const { state } = app;
      const t = titleOf(state);
      const showBack = !['home', 'setup', 'teacher', 'setclear'].includes(view.name);
      return (
        <header className="hdr">
          <div className="hdr-in">
            {showBack && <Btn color="white" size="sm" onClick={onBack} data-back="1">◀ もどる</Btn>}
            <button className="logo" onClick={onHome}>
              <span style={{ fontSize: '1.8rem' }} className="emoji">🎂</span><span className="lt">モカせんせいの ケーキやさん</span>
            </button>
            <span className="grow" />
            {state.profile && view.name !== 'teacher' && (
              <>
                <button id="coin-pill" className="coinpill" onClick={onShop} title="ショップ"><CoinIcon size={30} />{state.coins}</button>
                <span className="bold muted" style={{ fontSize: '1.05rem', whiteSpace: 'nowrap' }}>{t.icon} {state.profile.name}さん</span>
                <button className="tbtn" onClick={onTeacher} title="先生用" data-teacher="1">⚙ せんせい</button>
              </>
            )}
          </div>
        </header>
      );
    }

    function App() {
      const [state, setState] = useState(loadState);
      const stateRef = useRef(state);
      const update = useCallback((fn) => {
        const next = fn(stateRef.current);
        stateRef.current = next;
        CURRENT.settings = next.settings;
        setState(next); saveState(next);
        return next;
      }, []);
      const app = { state, update, stateRef };
      const [view, setView] = useState(state.profile ? { name: 'home' } : { name: 'setup' });
      const [pinOpen, setPinOpen] = useState(false);

      useEffect(() => {
        const trySync = () => Sync.run({ state: stateRef.current, update, stateRef });
        trySync();
        window.addEventListener('online', trySync);
        return () => window.removeEventListener('online', trySync);
      }, []);
      useEffect(() => { document.documentElement.style.fontSize = (FONT_PX[state.settings.fontSize] || 16) + 'px'; }, [state.settings.fontSize]);

      const go = v => { TTS.cancel(); setView(v); window.scrollTo(0, 0); };
      if (location.protocol === 'file:') window.__bunsu = { go, update, stateRef, genStage, STAGES, ALL_ITEMS, view }; // 動作確認用
      const openStage = (stage) => {
        const idx = prog(stateRef.current, stage.id).idx || 0;
        go(idx === 0 ? { name: 'intro', stageId: stage.id } : { name: 'play', stageId: stage.id, titleBefore: titleOf(stateRef.current), k: Date.now() });
      };
      const back = () => {
        if (view.name === 'play' || view.name === 'intro') go({ name: 'menu' });
        else go({ name: 'home' });
      };
      const stage = view.stageId ? STAGE_MAP[view.stageId] : null;

      return (
        <div style={{ minHeight: '100vh' }}>
          <Header app={app} view={view} onHome={() => !['setup', 'teacher'].includes(view.name) && go({ name: 'home' })} onBack={back}
                  onTeacher={() => setPinOpen(true)} onShop={() => !['setup', 'teacher'].includes(view.name) && go({ name: 'shop' })} />
          {view.name === 'setup' && <SetupScreen onDone={(profile) => { update(s => ({ ...s, profile })); Sync.run(app); go({ name: 'home' }); }} />}
          {view.name === 'home' && <HomeScreen app={app} onPlay={openStage} onMenu={() => go({ name: 'menu' })} onShop={() => go({ name: 'shop' })} onCollection={() => go({ name: 'collection' })} />}
          {view.name === 'menu' && <MenuScreen app={app} onOpen={openStage} />}
          {view.name === 'intro' && stage && <IntroScreen key={stage.id} stage={stage} onStart={() => go({ name: 'play', stageId: stage.id, titleBefore: titleOf(stateRef.current), k: Date.now() })} />}
          {view.name === 'play' && stage && (
            <PlayScreen key={stage.id + (view.k || '')} app={app} stage={stage} onSetEnd={(res) => {
              const before = view.titleBefore;
              const after = titleOf(stateRef.current);
              go({ name: 'setclear', stageId: stage.id, res, titleUp: res.stageEnd && before && before.name !== after.name ? after : null });
            }} />
          )}
          {view.name === 'setclear' && stage && (
            <SetClearScreen key={JSON.stringify(view.res)} app={app} stage={stage} res={view.res} titleUp={view.titleUp}
                            onContinue={() => go({ name: 'play', stageId: stage.id, titleBefore: titleOf(stateRef.current), k: Date.now() })}
                            onNextStage={openStage} onShop={() => go({ name: 'shop' })} onHome={() => go({ name: 'home' })} />
          )}
          {view.name === 'shop' && <ShopScreen app={app} onCollection={() => go({ name: 'collection' })} />}
          {view.name === 'collection' && <CollectionScreen app={app} onShop={() => go({ name: 'shop' })} />}
          {view.name === 'teacher' && <TeacherScreen app={app} onExit={() => go({ name: 'home' })} />}
          {pinOpen && (
            <PinPad onClose={() => setPinOpen(false)}
                    check={v => state.profile && hashPin(v) === state.profile.pin}
                    onSuccess={() => { setPinOpen(false); go({ name: 'teacher' }); }} />
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      render() {
        if (this.state.err) return (
          <div className="wrap tc" style={{ maxWidth: 640 }}>
            <div style={{ fontSize: 64 }}>🐻💦</div>
            <div className="bold" style={{ fontSize: '1.6rem' }}>こまったことが おきたよ</div>
            <div className="muted" style={{ fontSize: '1.1rem', margin: '.5rem 0 1rem' }}>せんせいに しらせてね。（ページを さいよみこみ すると なおることが あります）</div>
            <pre style={{ textAlign: 'left', fontSize: 12, background: '#f1f5f9', padding: 12, borderRadius: 8, overflow: 'auto' }}>{String(this.state.err && this.state.err.stack || this.state.err)}</pre>
            <button className="btn3d c-sky s-md" onClick={() => location.reload()}>さいよみこみ</button>
          </div>
        );
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
