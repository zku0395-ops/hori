<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モカせんせいの ケーキやさん</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root {
      --bg: #fff5f7; --ink: #1e293b; --sub: #64748b; --line: #e2e8f0;
      --choco: #7c2d12; --berry: #f472b6; --berry-d: #be185d; --cream: #fffaf0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; }
    button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
    input, select { font-family: inherit; }
    ruby rt { font-size: .5em; color: #475569; font-weight: 400; }
    .bubble, .mitem, .qhead, .board, .choice, .kids { word-break: keep-all; overflow-wrap: anywhere; }
    .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 28px; color: #9d174d; }
    .emoji { font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; line-height: 1; }

    /* 分数（たての 分数） */
    .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin: 0 .12em; font-weight: 900; font-variant-numeric: tabular-nums; }
    .frac > span { display: block; padding: 0 .14em; }
    .frac > i { display: block; align-self: stretch; height: .09em; min-height: 2px; background: currentColor; border-radius: 2px; margin: .07em 0; }
    .frac.inl { font-size: .86em; position: relative; top: -.04em; }
    .yomi { font-size: .95rem; font-weight: 700; color: #64748b; line-height: 1.2; }

    /* 立体ボタン */
    .btn3d { word-break: keep-all; border: 0; border-bottom: 6px solid rgba(0,0,0,.28); border-radius: 1.1rem; font-weight: 700; transition: transform .08s, border-bottom-width .08s, filter .15s; display: inline-flex; align-items: center; justify-content: center; gap: .4em; user-select: none; line-height: 1.25; }
    .btn3d:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 3px; }
    .btn3d:disabled { opacity: .4; cursor: not-allowed; }
    .btn3d:hover:not(:disabled) { filter: brightness(1.05); }
    .c-sky { background: #0ea5e9; color: #fff; border-bottom-color: #0369a1; }
    .c-red { background: #f43f5e; color: #fff; border-bottom-color: #be123c; }
    .c-green { background: #10b981; color: #fff; border-bottom-color: #047857; }
    .c-amber { background: #fbbf24; color: #451a03; border-bottom-color: #d97706; }
    .c-violet { background: #8b5cf6; color: #fff; border-bottom-color: #6d28d9; }
    .c-pink { background: #ec4899; color: #fff; border-bottom-color: #9d174d; }
    .c-choco { background: #a16207; color: #fff; border-bottom-color: #713f12; }
    .c-slate { background: #475569; color: #fff; border-bottom-color: #1e293b; }
    .c-white { background: #fff; color: #334155; border: 2px solid #cbd5e1; border-bottom: 6px solid #cbd5e1; }
    .c-orange { background: #f97316; color: #fff; border-bottom-color: #c2410c; }
    .s-sm { padding: .45rem .8rem; font-size: 1rem; }
    .s-md { padding: .7rem 1.2rem; font-size: 1.25rem; }
    .s-lg { padding: .9rem 1.5rem; font-size: 1.6rem; }
    .s-xl { padding: 1.1rem 2rem; font-size: 2rem; }

    /* レイアウト */
    .wrap { max-width: 1200px; margin: 0 auto; padding: .75rem; }
    .row { display: flex; align-items: center; gap: .6rem; }
    .col { display: flex; flex-direction: column; gap: .6rem; }
    .wrapflex { flex-wrap: wrap; }
    .grow { flex: 1 1 auto; min-width: 0; }
    .center { justify-content: center; }
    .between { justify-content: space-between; }
    .card { background: #fff; border-radius: 1.4rem; border: 4px solid #fbcfe8; box-shadow: 0 2px 8px rgba(0,0,0,.05); padding: 1rem; }
    .muted { color: var(--sub); }
    .bold { font-weight: 700; }
    .tc { text-align: center; }

    /* ヘッダー */
    .hdr { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.96); box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    .hdr-in { max-width: 1400px; margin: 0 auto; padding: 0 .75rem; display: flex; align-items: center; gap: .5rem; height: 56px; overflow: hidden; }
    .logo { display: flex; align-items: center; gap: .4rem; font-weight: 900; color: #9d174d; font-size: 1.3rem; background: none; border: 0; padding: 0; white-space: nowrap; }
    .tbtn { font-size: .85rem; color: #94a3b8; border: 1px solid #e2e8f0; border-radius: .6rem; padding: .3rem .55rem; background: #fff; white-space: nowrap; }
    .coinpill { display: inline-flex; align-items: center; gap: .3rem; background: #fffbeb; border: 3px solid #fcd34d; border-radius: 999px; padding: .1rem .7rem .1rem .25rem; font-weight: 900; font-size: 1.35rem; color: #92400e; white-space: nowrap; }
    .coinpill.bump { animation: bump .5s ease; }
    @keyframes bump { 30% { transform: scale(1.25); } }
    @media (max-width: 760px) { .logo .lt { display: none; } }

    /* ホーム */
    .home { max-width: 1400px; margin: 0 auto; padding: .6rem .75rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 32%); gap: .8rem; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
    .home-scene { border-radius: 1.4rem; overflow: hidden; background: #fde7ef; display: flex; align-items: center; justify-content: center; min-height: 0; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
    .home-scene svg { width: 100%; height: 100%; }
    .home-side { min-height: 0; overflow-y: auto; padding-bottom: .5rem; }
    @media (max-width: 900px) { .home { grid-template-columns: 1fr; height: auto; } .home-scene { aspect-ratio: 1000 / 750; } }

    /* 問題の画面 */
    .play { max-width: 1400px; margin: 0 auto; padding: .6rem .75rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 35%); gap: .75rem; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
    .work { position: relative; background: #fffdfa; border-radius: 1.4rem; border: 4px solid #fbcfe8; box-shadow: inset 0 0 0 3px #fff, 0 2px 8px rgba(0,0,0,.05); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .work svg.ws { flex: 1 1 auto; width: 100%; height: 100%; min-height: 0; touch-action: manipulation; user-select: none; -webkit-user-select: none; display: block; }
    .panel { display: flex; flex-direction: column; gap: .6rem; min-height: 0; overflow-y: auto; padding-bottom: .5rem; }
    .qhead { padding: .5rem .9rem .2rem; font-size: 1.05rem; font-weight: 700; color: #9d174d; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .bar50 { height: 10px; background: #fce7f3; border-radius: 99px; overflow: hidden; margin: 0 .9rem .2rem; }
    .bar50 > div { height: 100%; background: linear-gradient(90deg, #f9a8d4, #ec4899); border-radius: 99px; transition: width .4s; }
    @media (max-width: 900px) {
      .play { grid-template-columns: 1fr; height: auto; }
      .work { height: 62vh; }
    }

    /* ふきだし */
    .bubble { position: relative; background: #fff; border: 4px solid #f9a8d4; border-radius: 1.3rem; padding: .85rem 1rem .7rem; font-size: 1.45rem; line-height: 1.95; font-weight: 700; color: #1e293b; }
    .bubble::before { content: ''; position: absolute; left: -16px; top: 26px; border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-right: 15px solid #f9a8d4; }
    .bubble.top::before { left: 40px; top: -16px; border-left: 11px solid transparent; border-right: 11px solid transparent; border-bottom: 15px solid #f9a8d4; border-top: 0; }

    /* 選択肢 */
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: .6rem; }
    .choice { font-size: 2rem; padding: .8rem .4rem; }
    .choice.gone { opacity: .25; text-decoration: line-through; }
    .fchoice { padding: .6rem .3rem .5rem; }

    /* すすみぐあい */
    .dots { display: flex; gap: .35rem; align-items: center; }
    .dot { width: 2.2rem; height: 2.2rem; border-radius: 999px; border: 3px dashed #f9a8d4; display: flex; align-items: center; justify-content: center; background: #fff; font-weight: 700; color: #db2777; }
    .dot.now { border-style: solid; border-color: #ec4899; box-shadow: 0 0 0 4px #fce7f3; }
    .dot.done { border-style: solid; border-color: #fcd34d; background: #fffbeb; }

    /* 動き */
    .pop { animation: popup .45s cubic-bezier(.175,.885,.32,1.275) both; }
    @keyframes popup { 0% { transform: scale(.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    .pulse { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .glow { animation: glow 1.2s ease-in-out infinite; }
    @keyframes glow { 50% { box-shadow: 0 0 0 8px rgba(251,191,36,.6); } }
    .confetti { position: fixed; top: -60px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
    .fadein { animation: fadein .5s ease both; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .okburst { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; animation: okburst 2.2s ease forwards; }
    .okburst .t { font-size: 5.5rem; font-weight: 900; color: #ec4899; -webkit-text-stroke: 3px #fff; paint-order: stroke; text-shadow: 0 0 0 #fff, 0 6px 0 #9d174d, 0 10px 24px rgba(157,23,77,.35); letter-spacing: .06em; }
    @keyframes okburst { 0% { transform: scale(.3); opacity: 0; } 14% { transform: scale(1.15); opacity: 1; } 24% { transform: scale(1); } 78% { opacity: 1; } 100% { transform: scale(1.05); opacity: 0; } }
    .flycoin { position: fixed; z-index: 70; pointer-events: none; }
    .wiggle { animation: wiggle 1s ease-in-out infinite; transform-origin: 50% 90%; }
    @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    /* メニューボード */
    .board { background: #fff; border: 10px solid #f9a8d4; border-radius: 1.6rem; box-shadow: 0 10px 24px rgba(157,23,77,.12); padding: 1rem 1rem 1.2rem; }
    .board-title { text-align: center; font-size: 2rem; font-weight: 900; letter-spacing: .15em; color: #9d174d; margin-bottom: .6rem; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: .7rem; }
    .mitem { display: flex; align-items: center; gap: .8rem; text-align: left; border-radius: 1.1rem; border: 3px solid #fbcfe8; background: #fff7fa; color: #1e293b; padding: .55rem .8rem; font-size: 1.35rem; font-weight: 700; line-height: 1.75; min-height: 104px; }
    .mitem:hover:not(:disabled) { background: #fdf2f8; }
    .mitem.next { border-color: #f59e0b; box-shadow: 0 0 0 4px rgba(251,191,36,.35); }
    .mitem:disabled { opacity: .5; cursor: not-allowed; }
    .tag { display: inline-block; font-size: .85rem; border-radius: 999px; padding: .05rem .6rem; font-weight: 700; line-height: 1.6; }
    .minibar { height: 8px; background: #fce7f3; border-radius: 99px; overflow: hidden; margin-top: .2rem; }
    .minibar > div { height: 100%; background: #ec4899; border-radius: 99px; }

    /* ショップ・コレクション */
    .cats { display: flex; gap: .45rem; flex-wrap: wrap; margin-bottom: .8rem; }
    .cat { border-radius: 1rem; padding: .45rem .9rem; font-size: 1.2rem; font-weight: 700; border: 3px solid #fbcfe8; background: #fff; color: #9d174d; display: inline-flex; align-items: center; gap: .35rem; }
    .cat.on { background: #ec4899; color: #fff; border-color: #be185d; }
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .7rem; }
    .item { position: relative; display: flex; flex-direction: column; align-items: center; gap: .2rem; background: #fff; border: 3px solid #fbcfe8; border-bottom-width: 6px; border-radius: 1.1rem; padding: .6rem .3rem .5rem; font-weight: 700; color: #1e293b; }
    .item .em { font-size: 3.4rem; }
    .item .nm { font-size: 1.05rem; text-align: center; line-height: 1.3; min-height: 2.6em; display: flex; align-items: center; word-break: keep-all; overflow-wrap: anywhere; }
    .item .pr { display: inline-flex; align-items: center; gap: .2rem; font-size: 1.3rem; color: #92400e; }
    .item.owned { background: #f0fdf4; border-color: #86efac; }
    .item.poor { opacity: .55; }
    .item .badge { position: absolute; top: .3rem; right: .3rem; background: #22c55e; color: #fff; border-radius: 999px; font-size: .8rem; padding: 0 .45rem; }
    .col-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: .45rem; }
    @media (max-width: 900px) { .col-grid { grid-template-columns: repeat(5, 1fr); } }
    .slot { aspect-ratio: 1 / 1; border-radius: 1rem; border: 3px solid #fbcfe8; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; font-weight: 700; font-size: .85rem; text-align: center; line-height: 1.2; padding: .2rem; }
    .slot .em { font-size: 2.6rem; }
    .slot.empty { background: #f8fafc; border-style: dashed; border-color: #cbd5e1; color: #94a3b8; }
    .slot.empty .em { filter: grayscale(1) brightness(0); opacity: .14; }

    /* 先生用 */
    .tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .8rem; }
    .tab { border-radius: 1rem; padding: .6rem 1.1rem; font-size: 1.1rem; font-weight: 700; border: 2px solid #e2e8f0; background: #fff; color: #475569; }
    .tab.on { background: #0ea5e9; color: #fff; border-color: #0284c7; }
    .trow { border-top: 1px solid #f1f5f9; padding: .9rem 0; display: grid; grid-template-columns: 1fr 2fr; gap: .6rem; }
    .trow .lb { font-weight: 700; font-size: 1.05rem; }
    .trow .ds { font-size: .85rem; color: #64748b; }
    .opt { border-radius: .7rem; padding: .45rem .9rem; font-weight: 700; border: 2px solid #cbd5e1; background: #fff; color: #475569; font-size: 1rem; }
    .opt.on { background: #0ea5e9; color: #fff; border-color: #0284c7; }
    table.tbl { border-collapse: collapse; width: 100%; font-size: .95rem; }
    table.tbl th, table.tbl td { border-bottom: 1px solid #f1f5f9; padding: .45rem .5rem; text-align: left; vertical-align: top; }
    table.tbl th { background: #f8fafc; color: #475569; white-space: nowrap; }
    .inp { border-radius: .7rem; border: 2px solid #cbd5e1; padding: .5rem .7rem; font-size: 1.1rem; }
    @media (max-width: 700px) { .trow { grid-template-columns: 1fr; } }

    .modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; padding: 1rem; }

    @media (prefers-reduced-motion: reduce) {
      .pulse, .glow, .wiggle { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"><div class="loading">🎂 よみこみちゅう…</div></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* =========================================================
       きほんの 設定
       ========================================================= */
    const STORE_KEY = 'mokaBunsu.v1';      // localStorage のキー
    const APP_ID = 'moka-bunsu';           // 記録を送るときの アプリの 名前
    const PER_STAGE = 50;                  // 1ステージの 問題の 数
    const PER_SET = 5;                     // 1かいの 問題の 数
    const SET_BONUS = 3;                   // 1かい（5問）おえた ときの ボーナス
    const DEFAULT_SETTINGS = {
      range: 'g3',          // 分母の範囲（g3：2〜12／g2：2年生モード 2・3・4・8）
      guide: 'auto',        // 3つの段階の手がかり（auto：問題に合わせて減らす／always：いつも／off：出さない）
      look: 'cake',         // 円の見た目（cake：ケーキ／plain：ただの円）
      unlockAll: false,     // すべての ステージを 開く
      special: false,       // とくべつステージ（大きさくらべ）を 開く
      voice: true,          // モカせんせいの 声
      sfx: true,            // 効果音・ファンファーレ
      fontSize: 'm',
    };
    const FONT_PX = { m: 16, l: 18, xl: 20 };
    const TITLES = [
      { min: 0, name: 'ケーキやさん みならい', icon: '🥚' },
      { min: 2, name: 'ケーキ コック', icon: '🧁' },
      { min: 5, name: 'パティシエ', icon: '🎂' },
      { min: 8, name: 'ぶんすう マスター', icon: '👑' },
    ];
    // つまずきの 種類（先生用の 名前）
    const ERR = {
      swap: '分母と分子の入れちがい',
      uncolored: '色のない部分を数えた',
      ratio: '色ありと色なしをくらべた',
      count: '数えまちがい',
      equal: '等分の見落とし',
      name: '分母・分子の名前のまちがい',
      whole: '全部（1）のまちがい',
      compare: '大きさくらべのまちがい',
      other: 'その他',
    };
    const ERR_KEYS = Object.keys(ERR);

    /* =========================================================
       小さな 道具
       ========================================================= */
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const pad2 = n => String(n).padStart(2, '0');
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
    function ymd() { const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`; }
    function hashPin(pin) { let h = 2166136261; for (const c of 'bunsu:' + pin) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
    function fnv(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
    // 決まった 乱数（問題を いつも 同じに する）
    function seeded(seed) { let s = (typeof seed === 'number' ? seed : parseInt(fnv(String(seed)), 16)) >>> 0 || 1; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    const rPick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
    const rInt = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
    const rShuffle = (rng, arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const CURRENT = { settings: { ...DEFAULT_SETTINGS } };

    /* ---- ふりがなと 分数 ----
       書き方： [漢字|よみ]  例：'[分母|ぶんぼ]'
                {分子/分母} 例：'{2/5}' → たての 分数（読み上げは「ごぶんのに」） */
    const MARK_RE = /\[([^|\]]+)\|([^\]]+)\]|\{([0-9○△]+)\/([0-9○△]+)\}/g;
    const stripMarkup = s => String(s).replace(MARK_RE, (m, k, y, n, d) => k != null ? k : `${n}/${d}`);
    const KANA_NUM = ['ぜろ', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう', 'じゅう', 'じゅういち', 'じゅうに'];
    const KANA_TSU = ['', 'ひとつ', 'ふたつ', 'みっつ', 'よっつ', 'いつつ', 'むっつ', 'ななつ', 'やっつ', 'ここのつ', 'とお'];
    const KANA_KO = ['ぜろこ', 'いっこ', 'にこ', 'さんこ', 'よんこ', 'ごこ', 'ろっこ', 'ななこ', 'はっこ', 'きゅうこ', 'じゅっこ', 'じゅういっこ', 'じゅうにこ'];
    const kn = x => ({ '○': 'まる', '△': 'さんかく' })[x] || KANA_NUM[Number(x)] || String(x);
    const fracYomi = (n, d) => `${kn(d)}ぶんの${kn(n)}`;
    // 「5つ」「10こ」：9までは「つ」、10からは「こ」
    const tsu = n => n < 10 ? `${n}つ` : `${n}こ`;
    const KANJI_RE = /[一-鿿々]/;
    function R({ t, className, style }) {
      const s = String(t == null ? '' : t);
      const out = []; let last = 0; let m; let k = 0;
      const re = new RegExp(MARK_RE.source, 'g');
      const plain = (txt) => {
        if (KANJI_RE.test(txt) && window.__furiganaWarn) window.__furiganaWarn(txt, s);
        txt.split('\n').forEach((part, i) => { if (i > 0) out.push(<br key={'b' + (k++)} />); if (part) out.push(<React.Fragment key={'t' + (k++)}>{part}</React.Fragment>); });
      };
      while ((m = re.exec(s))) {
        plain(s.slice(last, m.index));
        if (m[1] != null) out.push(<ruby key={'r' + (k++)}>{m[1]}<rt>{m[2]}</rt></ruby>);
        else out.push(<Frac key={'f' + (k++)} n={m[3]} d={m[4]} inline />);
        last = re.lastIndex;
      }
      plain(s.slice(last));
      return <span className={className} style={style}>{out}</span>;
    }
    function Frac({ n, d, inline, size, color, className = '', style }) {
      return (
        <span className={`frac ${inline ? 'inl' : ''} ${className}`} style={{ fontSize: size, color, ...style }} aria-label={`${d}ぶんの${n}`}>
          <span>{n}</span><i /><span>{d}</span>
        </span>
      );
    }
    // 読み上げ用の 文（数は ひらがなに して 読みまちがいを ふせぐ）
    function speechText(s) {
      return String(s)
        .replace(MARK_RE, (m, k, y, n, d) => k != null ? y : fracYomi(n, d))
        .replace(/(\d+)ぶんの(\d+)/g, (m, d, n) => fracYomi(n, d))
        .replace(/(\d+)つ/g, (m, n) => KANA_TSU[Number(n)] || m)
        .replace(/(\d+)こ/g, (m, n) => KANA_KO[Number(n)] || m)
        .replace(/[①②③]/g, c => ({ '①': 'いち、', '②': 'に、', '③': 'さん、' })[c])
        .replace(/\n/g, '　');
    }

    /* =========================================================
       ほぞん（localStorage と IndexedDB）
       ========================================================= */
    const newDeviceId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    function normalizeState(s) {
      s = s && typeof s === 'object' ? s : {};
      return {
        version: 1, profile: s.profile || null, settings: { ...DEFAULT_SETTINGS, ...(s.settings || {}) },
        progress: s.progress && typeof s.progress === 'object' ? s.progress : {},
        coins: Number(s.coins) || 0, earned: Number(s.earned) || 0,
        owned: s.owned && typeof s.owned === 'object' ? s.owned : {},
        sync: s.sync || {}, deviceId: s.deviceId || newDeviceId(),
      };
    }
    function loadState() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { s = null; }
      const st = normalizeState(s);
      if (!s || !s.deviceId) saveState(st);
      CURRENT.settings = st.settings;
      return st;
    }
    function saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { console.warn(e); } }

    // 入口ページ（Apps Script）から開いたとき、URLの # のあとに 記録の送り先と合言葉が ついてくる
    const REC_URL_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/|macros\/)s\/[A-Za-z0-9_-]+\/(exec|dev)$/;
    (function applyLinkConfig() {
      if (!location.hash) return;
      const h = new URLSearchParams(location.hash.slice(1));
      const rec = h.get('rec');
      if (!rec) return;
      if (REC_URL_RE.test(rec)) {
        const st = loadState();
        if (st.sync.url !== rec || st.sync.key !== (h.get('key') || '')) {
          saveState({ ...st, sync: { ...st.sync, url: rec, key: h.get('key') || '', lastSummary: null } });
        }
      }
      history.replaceState(null, '', location.pathname + location.search);
    })();

    const DB_NAME = 'moka-bunsu';
    let dbPromise = null;
    function getDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath: 'id', autoIncrement: true }).createIndex('stageId', 'stageId');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }
    async function idbReq(storeName, mode, fn) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const req = fn(tx.objectStore(storeName));
        let result;
        if (req) req.onsuccess = () => { result = req.result; };
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }
    const DB = {
      add: (s, v) => idbReq(s, 'readwrite', st => st.add(v)),
      put: (s, v) => idbReq(s, 'readwrite', st => st.put(v)),
      getAll: (s) => idbReq(s, 'readonly', st => st.getAll()),
      clear: (s) => idbReq(s, 'readwrite', st => st.clear()),
    };

    function downloadFile(name, content, type) {
      const blob = content instanceof Blob ? content : new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
    function pickFile(accept) {
      return new Promise((resolve) => {
        const input = document.createElement('input'); input.type = 'file'; input.accept = accept;
        input.onchange = () => resolve(input.files && input.files[0] ? input.files[0] : null);
        input.click();
      });
    }

    /* =========================================================
       読み上げ・効果音・ファンファーレ
       ========================================================= */
    const TTS = {
      voice: null,
      init() {
        if (!('speechSynthesis' in window)) return;
        const choose = () => {
          const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
          this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
        };
        choose();
        speechSynthesis.onvoiceschanged = choose;
      },
      speak(markup, { force = false } = {}) {
        return new Promise(resolve => {
          if (!('speechSynthesis' in window) || !markup || (!CURRENT.settings.voice && !force)) return resolve();
          const text = speechText(markup);
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = 0.92; u.pitch = 1.1;
          let done = false;
          const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
          const timer = setTimeout(finish, 2000 + text.length * 400);
          u.onend = finish; u.onerror = finish;
          this.current = u; // Chrome で onend が 来なくなるのを ふせぐため 参照を のこす
          speechSynthesis.speak(u);
        });
      },
      cancel() { if ('speechSynthesis' in window) speechSynthesis.cancel(); },
    };
    TTS.init();

    let AUDIO = null;
    function audioCtx() {
      if (!CURRENT.settings.sfx) return null;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        AUDIO = AUDIO || new AC();
        if (AUDIO.state === 'suspended') AUDIO.resume();
        return AUDIO;
      } catch (e) { return null; }
    }
    function tone(ctx, { f, t, dur, type = 'sine', vol = 0.12, attack = 0.012, release = 0.08, dest }) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.setValueAtTime(vol, Math.max(t + attack, t + dur - release));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }
    const SFX_SEQ = {
      tap: [[660, 0.06]],
      pick: [[880, 0.07, 0.1]],
      ng: [[392, 0.16, 0.07], [330, 0.24, 0.06]],   // やさしい音（ブザーに しない）
      paint: [[784, 0.07, 0.1]],
      unpaint: [[523, 0.07, 0.08]],
      count: [[988, 0.06, 0.08]],
      open: [[523, 0.08], [784, 0.12]],
    };
    function sfx(name) {
      const ctx = audioCtx(); if (!ctx) return;
      let t = ctx.currentTime + 0.01;
      (SFX_SEQ[name] || []).forEach(([f, dur, vol = 0.12]) => { tone(ctx, { f, t, dur, vol }); t += dur; });
    }
    // ファンファーレ（この アプリの ための オリジナルの ふし）
    const MIDI = { G4: 67, A4: 69, B4: 71, C5: 72, D5: 74, E5: 76, F5: 77, G5: 79, A5: 81, B5: 83, C6: 84, D6: 86, E6: 88, G6: 91 };
    const FANFARE = {
      ok: { beat: 0.11, notes: [['G4', 0, 1], ['C5', 1, 1], ['E5', 2, 1], ['G5', 3, 2], ['E5', 5, 1], [['C5', 'E5', 'G5', 'C6'], 6, 5]] },
      set: { beat: 0.12, notes: [['C5', 0, 1], ['C5', 1, 1], ['C5', 2, 1], ['G5', 3, 3], ['F5', 6, 1], ['G5', 7, 1], ['A5', 8, 1], ['G5', 9, 1], [['C5', 'E5', 'G5', 'C6'], 10, 8]] },
      clear: { beat: 0.12, notes: [['G4', 0, 1], ['C5', 1, 1], ['E5', 2, 1], ['G5', 3, 2], ['C6', 5, 1], ['G5', 6, 1], ['A5', 7, 2], ['F5', 9, 1], ['A5', 10, 1], ['C6', 11, 2], ['B5', 13, 1], ['C6', 14, 1], ['D6', 15, 2], [['G5', 'C6', 'E6', 'G6'], 17, 10]] },
    };
    function fanfare(kind) {
      const ctx = audioCtx(); if (!ctx) return;
      const def = FANFARE[kind] || FANFARE.ok;
      const t0 = ctx.currentTime + 0.03;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(ctx.destination);
      def.notes.forEach(([nm, at, len]) => {
        const chord = Array.isArray(nm);
        (chord ? nm : [nm]).forEach(x => {
          const f = 440 * Math.pow(2, (MIDI[x] - 69) / 12);
          const t = t0 + at * def.beat, dur = len * def.beat * 0.95;
          tone(ctx, { f, t, dur, type: 'square', vol: chord ? 0.025 : 0.04, release: 0.07, dest: lp });
          tone(ctx, { f, t, dur, type: 'triangle', vol: chord ? 0.06 : 0.1, release: 0.07 });
        });
      });
    }
    function coinSound(delay = 0) {
      const ctx = audioCtx(); if (!ctx) return;
      const t = ctx.currentTime + 0.01 + delay;
      tone(ctx, { f: 1319, t, dur: 0.07, type: 'triangle', vol: 0.12 });
      tone(ctx, { f: 1760, t: t + 0.07, dur: 0.32, type: 'triangle', vol: 0.12, release: 0.25 });
      tone(ctx, { f: 2637, t: t + 0.07, dur: 0.2, type: 'sine', vol: 0.04 });
    }

    /* =========================================================
       すすみぐあい
       ========================================================= */
    const prog = (st, id) => st.progress[id] || {};
    const isCleared = (id, st) => !!prog(st, id).cleared;
    function titleOf(st) {
      const n = MAIN_IDS.filter(id => isCleared(id, st)).length;
      let t = TITLES[0]; TITLES.forEach(x => { if (n >= x.min) t = x; });
      return t;
    }
    function isStageOpen(stage, st) {
      if (stage.special) return !!st.settings.special;
      if (st.settings.unlockAll) return true;
      const i = MAIN_IDS.indexOf(stage.id);
      return i <= 0 || isCleared(MAIN_IDS[i - 1], st);
    }
    function lockHint(stage) {
      if (stage.special) return 'せんせいが ひらいて くれるよ';
      return `ステージ${stage.no - 1}の 50もんを おえると ひらくよ`;
    }
    function findNext(st) {
      for (const id of MAIN_IDS) { const s = STAGE_MAP[id]; if (isStageOpen(s, st) && !isCleared(id, st)) return s; }
      return null;
    }
    const ownedCount = st => ALL_ITEMS.filter(it => st.owned[it.id]).length;

    /* =========================================================
       先生の スプレッドシートへ 記録を 送る
       ========================================================= */
    const SYNC_BATCH = 200;
    const stageLabel = s => s.special ? 'とくべつ' : `ステージ${s.no}`;
    const stageName = s => `${stageLabel(s)} ${stripMarkup(s.name)}`;
    function syncColumns() {
      return STAGES.map(s => ({ id: s.id, short: s.special ? '特' : `${s.no}`, label: stageName(s) }));
    }
    async function buildSummary(st) {
      const hist = await DB.getAll('history');
      const stages = {};
      const errors = {};
      STAGES.forEach(s => { const p = prog(st, s.id); stages[s.id] = { clear: p.cleared ? 1 : 0, plays: p.clears || 0, pos: p.idx || 0, solved: 0, first: 0 }; });
      let solved = 0, first = 0, lastAt = 0;
      hist.forEach(h => {
        lastAt = Math.max(lastAt, h.at || 0);
        (h.errors || []).forEach(e => { errors[e] = (errors[e] || 0) + 1; });
        if (!h.done) return;
        solved++; if (!h.mistakes) first++;
        const x = stages[h.stageId]; if (x) { x.solved++; if (!h.mistakes) x.first++; }
      });
      const t = titleOf(st);
      const next = findNext(st);
      return {
        title: `${t.icon} ${t.name}`, cleared: MAIN_IDS.filter(id => isCleared(id, st)).length, mains: MAIN_IDS.length,
        solved, first, lastAt, coins: st.coins, earned: st.earned, items: ownedCount(st), allItems: ALL_ITEMS.length,
        current: next ? `${stageLabel(next)}（${(prog(st, next.id).idx || 0) + 1}問目）` : 'ぜんぶ クリア',
        stages, errors,
      };
    }
    function syncRecord(st, h) {
      const s = STAGE_MAP[h.stageId];
      return {
        uid: `${st.deviceId}-${h.at}-${h.stageId}-${h.no}`, at: h.at, stage: s ? stageName(s) : h.stageId, stageId: h.stageId,
        no: h.no, label: h.label, correct: h.correct, answers: (h.answers || []).join(' → '), result: h.result,
        mistakes: h.mistakes, hints: h.hints, sec: h.sec, errors: [...new Set(h.errors || [])].map(e => ERR[e] || e).join('、'),
        range: h.range === 'g2' ? '2年生' : '2〜12', guide: h.guide ? 'あり' : 'なし',
      };
    }
    const SYNC_ERRORS = {
      key: '合言葉が一致しません。入口ページから開き直すか、正しい合言葉を入力してください。',
      'not-json': 'Apps Script から正しい返事がありません。デプロイの「アクセスできるユーザー」が「全員」になっているか確認してください。',
      fetch: '送信できませんでした。インターネット接続と、Apps Script のデプロイ（アクセスできるユーザー「全員」）を確認してください。',
    };
    const Sync = {
      running: null,
      run(app, opts = {}) {
        if (this.running) return this.running;
        this.running = this._run(app, opts).finally(() => { this.running = null; });
        return this.running;
      },
      async _run(app, { all = false } = {}) {
        const st = app.stateRef.current;
        const sync = st.sync || {};
        if (!sync.url || !st.profile) return { ok: false, reason: 'nourl' };
        if (navigator.onLine === false) return { ok: false, reason: 'offline' };
        try {
          const hist = (await DB.getAll('history')).sort((a, b) => a.at - b.at);
          const targets = hist.filter(h => all || !h.sent);
          const summary = await buildSummary(st);
          const sumKey = fnv(st.profile.name + JSON.stringify(summary));
          if (!targets.length && !all && sync.lastSummary === sumKey) return { ok: true, sent: 0 };
          let i = 0;
          do {
            const batch = targets.slice(i, i + SYNC_BATCH);
            const payload = {
              app: APP_ID, v: 1, key: sync.key || '', deviceId: st.deviceId, name: st.profile.name,
              summary, columns: syncColumns(), errorNames: ERR, records: batch.map(h => syncRecord(st, h)),
            };
            let res;
            try {
              res = await fetch(sync.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
            } catch (e) { throw new Error('fetch'); }
            let data;
            try { data = await res.json(); } catch (e) { throw new Error('not-json'); }
            if (!data || !data.ok) throw new Error((data && data.error) || 'server');
            for (const h of batch) if (!h.sent) await DB.put('history', { ...h, sent: true });
            i += SYNC_BATCH;
          } while (i < targets.length);
          app.update(s => ({ ...s, sync: { ...s.sync, lastOkAt: Date.now(), lastError: null, lastSummary: sumKey } }));
          return { ok: true, sent: targets.length };
        } catch (e) {
          const code = String((e && e.message) || e);
          app.update(s => ({ ...s, sync: { ...s.sync, lastError: code, lastErrorAt: Date.now() } }));
          return { ok: false, reason: code };
        }
      },
    };
    const syncErrorText = code => SYNC_ERRORS[code] || `送信できませんでした（${code}）。`;

    /* =========================================================
       図形の 計算
       角度は 算数と 同じ 向き（右が 0°、反時計回りに ふえる）。
       ケーキの ピースは 上（90°）から 時計回りに ならべる。
       ========================================================= */
    const DEG = Math.PI / 180;
    const P = (cx, cy, r, a) => [cx + r * Math.cos(a * DEG), cy - r * Math.sin(a * DEG)];
    const f1 = v => Math.round(v * 10) / 10;
    function sectorD(cx, cy, r, a1, sweep) {
      if (Math.abs(sweep) >= 359.9) return `M ${cx - r} ${cy} A ${r} ${r} 0 1 0 ${cx + r} ${cy} A ${r} ${r} 0 1 0 ${cx - r} ${cy} Z`;
      const [x1, y1] = P(cx, cy, r, a1), [x2, y2] = P(cx, cy, r, a1 + sweep);
      return `M ${cx} ${cy} L ${f1(x1)} ${f1(y1)} A ${r} ${r} 0 ${Math.abs(sweep) > 180 ? 1 : 0} ${sweep > 0 ? 0 : 1} ${f1(x2)} ${f1(y2)} Z`;
    }
    function pieceAngles(n, sweeps, start = 90) {
      const sw = sweeps || Array.from({ length: n }, () => 360 / n);
      let a = start;
      return sw.map(s => { const r = { a1: a, sweep: s, mid: a - s / 2 }; a -= s; return r; });
    }
    function useTicker(ms, { loop = false, run = true, key } = {}) {
      const [t, setT] = useState(0);
      useEffect(() => {
        if (!run) { setT(0); return; }
        let raf; const start = performance.now();
        const tick = now => {
          let x = (now - start) / ms;
          x = loop ? x % 1 : Math.min(1, x);
          setT(x);
          if (loop || x < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [ms, loop, run, key]);
      return t;
    }

    /* =========================================================
       絵（すべて この アプリの ための オリジナル）
       ========================================================= */
    // ---- モカせんせい（くまの パティシエ）----
    // mood: normal / happy / think
    function MokaBody({ mood = 'normal', talking = false }) {
      const happy = mood === 'happy', think = mood === 'think';
      const FUR = '#b7793f', FUR_D = '#6b3f1d', MUZ = '#f5dcbc';
      return (
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="3.2s" repeatCount="indefinite" />

          <ellipse cx="100" cy="196" rx="54" ry="40" fill="#fff" stroke="#cbd5e1" strokeWidth="4" />
          <path d="M 70 176 Q 100 170 130 176 L 136 226 Q 100 236 64 226 Z" fill="#f9a8d4" stroke="#db2777" strokeWidth="3" />
          <path d="M 92 196 q 8 -10 16 0 q -8 12 -16 0 z" fill="#fff" />
          {/* うで */}
          <g transform={`rotate(${happy ? 140 : 18} 52 182)`}><ellipse cx="52" cy="200" rx="13" ry="22" fill={FUR} stroke={FUR_D} strokeWidth="4" /></g>
          <g transform={`rotate(${happy ? -140 : -18} 148 182)`}><ellipse cx="148" cy="200" rx="13" ry="22" fill={FUR} stroke={FUR_D} strokeWidth="4" /></g>
          {/* みみ */}
          <circle cx="50" cy="66" r="22" fill={FUR} stroke={FUR_D} strokeWidth="4" /><circle cx="50" cy="66" r="11" fill={MUZ} />
          <circle cx="150" cy="66" r="22" fill={FUR} stroke={FUR_D} strokeWidth="4" /><circle cx="150" cy="66" r="11" fill={MUZ} />
          {/* あたま */}
          <g transform={think ? 'rotate(-6 100 110)' : undefined}>
            <ellipse cx="100" cy="110" rx="64" ry="58" fill={FUR} stroke={FUR_D} strokeWidth="4" />
            <ellipse cx="100" cy="132" rx="32" ry="24" fill={MUZ} />
            <ellipse cx="66" cy="128" rx="11" ry="7" fill="#f9a8d4" opacity=".8" />
            <ellipse cx="134" cy="128" rx="11" ry="7" fill="#f9a8d4" opacity=".8" />
            {happy ? (

              <g>
                <ellipse cx="78" cy={think ? 98 : 104} rx="7" ry="8" fill="#2b1a0e">

                </ellipse>
                <ellipse cx="122" cy={think ? 98 : 104} rx="7" ry="8" fill="#2b1a0e">
                  <animate attributeName="ry" values="8;8;1;8" keyTimes="0;0.93;0.96;1" dur="5s" repeatCount="indefinite" />
                </ellipse>

              </g>
            )}
            <ellipse cx="100" cy="122" rx="10" ry="7" fill="#3b2414" />
            {talking ? (
              <ellipse cx="100" cy="141" rx="8" ry="6" fill="#9f1239">
                <animate attributeName="ry" values="6;2;6" dur="0.3s" repeatCount="indefinite" />
              </ellipse>
            ) : (
              <path d={happy ? 'M 88 136 Q 100 152 112 136' : think ? 'M 92 141 Q 100 137 108 141' : 'M 90 137 Q 100 146 110 137'} fill={happy ? '#9f1239' : 'none'} stroke="#3b2414" strokeWidth="3.5" strokeLinecap="round" />
            )}

    function Confetti() {

    /* =========================================================
       問題を つくる（ステージごとに 50問。いつも 同じ 順番）
       ========================================================= */
    // 分母の 範囲（ブロック a〜d は 10問ずつ。mix は まぜて 出す）
    const DEN = {
      g3: { a: [2, 3, 4], b: [5, 6], c: [8], d: [10, 12], mix: [2, 3, 4, 5, 6, 8, 10, 12] },
      g2: { a: [2, 4], b: [3, 4], c: [8], d: [4, 8], mix: [2, 3, 4, 8] },
    };
    // ステージ2・3（分子が 1）の 分母
    const UNIT_DEN = {
      g3: [[2], [3, 4], [5, 6], [8, 10, 12], null],
      g2: [[2], [3, 4], [4, 8], [3, 8], null],
    };
    const denOf = (range, b) => { const D = DEN[range] || DEN.g3; return [D.a, D.b, D.c, D.d, D.mix][b]; };
    // ステージ1（かぞえる）は 同じ 答えが つづかないように 分母を まぜる
    const COUNT_DEN = {
      g3: [[2, 3, 4], [3, 4, 5, 6], [5, 6, 8], [6, 8, 10, 12], null],
      g2: [[2, 3, 4], [2, 3, 4, 8], [3, 4, 8], [4, 8, 3], null],
    };
    const countDenOf = (range, b) => (COUNT_DEN[range] || COUNT_DEN.g3)[b] || (DEN[range] || DEN.g3).mix;
    // ケーキの 向き（ときどき 半ピース ずらす。2つに わけるときは いろいろな 向き）
    const rRot = (rng, d) => d === 2 ? rPick(rng, [90, 0, 45, 135]) : rPick(rng, [90, 90, 90 - 180 / d]);
    const unitDenOf = (range, b) => (UNIT_DEN[range] || UNIT_DEN.g3)[b] || (DEN[range] || DEN.g3).mix;
    const fkey = (n, d) => `${n}/${d}`;
    const sameVal = (a, b) => a.n * b.d === b.n * a.d;

    // 色を ぬる ピース（まとめて ぬる／ばらばらに ぬる）
    function colorSet(rng, n, d, scatter = false) {
      if (scatter) return rShuffle(rng, Array.from({ length: d }, (_, i) => i)).slice(0, n).sort((a, b) => a - b);
      const k = rInt(rng, 0, d - 1);
      return Array.from({ length: n }, (_, i) => (k + i) % d).sort((a, b) => a - b);
    }
    // ひとしくない わけ方
    function uneven(rng, n, lv) {
      const base = 360 / n;
      const sw = Array(n).fill(base);
      const i = rInt(rng, 0, n - 1);
      let j = rInt(rng, 0, n - 2); if (j >= i) j++;
      const delta = base * (lv === 'big' ? 0.38 + rng() * 0.12 : 0.15 + rng() * 0.05);
      sw[i] += delta; sw[j] -= delta;
      return sw;
    }
    function pickNum(rng, d) {
      if (d === 2) return 1;
      if (rng() < 0.85) return rInt(rng, 2, d - 1);
      return 1;
    }
    // 分数の 選択肢（正解・分母と分子の入れちがい・色のない数・色ありと色なし）
    function fracOpts(rng, n, d) {
      const ok = { n, d, err: null };
      const list = [ok];
      const add = o => { if (o.n >= 1 && o.d >= 1 && o.d <= 13 && !list.some(x => x.n === o.n && x.d === o.d)) list.push(o); };
      if (n !== d) add({ n: d, d: n, err: 'swap' });
      const more = [];
      if (d - n >= 1 && d - n !== n) more.push({ n: d - n, d, err: 'uncolored' });
      if (d - n >= 1) more.push({ n, d: d - n, err: 'ratio' });
      rShuffle(rng, more).forEach(o => { if (list.length < 3) add(o); });
      [{ n: n + 1, d, err: 'count' }, { n, d: d + 1, err: 'count' }, { n: Math.max(1, n - 1), d, err: 'count' }].forEach(o => { if (list.length < 3 && o.n <= o.d) add(o); });
      return rShuffle(rng, list);
    }
    // 数の 選択肢
    function numOpts(rng, v, extra = [], k = 3) {
      const list = [{ v, err: null }];
      extra.forEach(o => { if (o.v >= 1 && !list.some(x => x.v === o.v)) list.push(o); });
      const near = rShuffle(rng, [v + 1, v - 1]).concat(rShuffle(rng, [v + 2, v - 2]));
      near.forEach(x => { if (list.length < k && x >= 1 && !list.some(y => y.v === x)) list.push({ v: x, err: 'count' }); });
      return list.slice(0, k).sort((a, b) => a.v - b.v);
    }
    // 絵の 選択肢（「{n/d} の ケーキは どれ？」）
    function picCards(rng, n, d, dens) {
      const cards = [{ n, d, err: null }];
      const cand = [];
      if (d - n !== n && d - n >= 1) cand.push({ n: d - n, d, err: 'uncolored' });
      if (n + d <= 12) cand.push({ n, d: n + d, err: 'ratio' });
      rShuffle(rng, dens.concat([d - 1, d + 1])).forEach(x => { if (x > n && x >= 2 && x <= 12 && x !== d) cand.push({ n, d: x, err: 'count' }); });

    function ProblemHost({ app, stage, p, onSolved, onNext }) {
      const s = app.state.settings;
      if (location.protocol === 'file:') window.__lastP = p; // 動作確認用
      const [phase, setPhaseState] = useState({ prompt: '', hints: [] });
      const [hint, setHint] = useState(0);
      const [fb, setFb] = useState(null);
      const [mood, setMood] = useState('normal');
      const [talking, setTalking] = useState(false);
      const [status, setStatus] = useState('play');
      const [res, setRes] = useState(null);
      const [hintGlow, setHintGlow] = useState(false);
      const workRef = useRef(null);
      const R_ = useRef({ answers: [], errors: [], mistakes: 0, maxHint: 0, start: Date.now(), done: false, phaseMiss: 0, hints: [], alive: true, guide: false });
      const speak = async (markup, force = false) => {
        if (!markup) return;
        setTalking(true);
        await TTS.speak(markup, { force });
        if (R_.current.alive) setTalking(false);
      };
      const saveRecord = (done) => {
        const r = R_.current;
        const entry = {
          at: Date.now(), stageId: stage.id, no: p.no, kind: p.kind, label: p.label, correct: p.correct,
          answers: r.answers.slice(0, 30), result: done ? (r.mistakes ? `正解（${r.mistakes + 1}回目）` : '1回で正解') : 'とちゅうでやめた',
          mistakes: r.mistakes, hints: r.maxHint, sec: Math.round((Date.now() - r.start) / 1000), errors: r.errors.slice(0, 30),
          range: stageRange(stage, s), guide: r.guide, done,
        };
        DB.add('history', entry).then(() => Sync.run(app)).catch(e => console.warn(e));
      };
      useEffect(() => () => {
        R_.current.alive = false;
        TTS.cancel();
        if (!R_.current.done && R_.current.answers.length) saveRecord(false);
      }, []);
      const api = useMemo(() => ({
        phase: ({ prompt, hints = [] }) => {
          R_.current.phaseMiss = 0; R_.current.hints = hints;
          setPhaseState({ prompt, hints }); setHint(0); setFb(null); setMood('normal'); setHintGlow(false);
          speak(prompt);
        },
        guide: (v) => { R_.current.guide = !!v; },
        note: (txt) => { R_.current.answers.push(txt); },
        tip: (text) => { setFb({ text, kind: 'info', key: Date.now() }); speak(text); },
        ng: (txt, err, msg) => {
          const r = R_.current;
          if (r.done) return;
          r.answers.push(txt); r.mistakes++; r.phaseMiss++; if (err) r.errors.push(err);
          sfx('ng');
          setMood('think');
          setFb({ text: msg || 'もう いちど やって みよう。', kind: 'ng', key: Date.now() });
          if (r.phaseMiss >= 2) setHintGlow(true);
          if (r.phaseMiss >= 3 && r.hints.length) { const lv = r.hints.length; r.maxHint = Math.max(r.maxHint, lv); setHint(lv); }
          speak(msg || 'もう いちど やって みよう。');
        },
        ok: (txt, extra) => {
          const r = R_.current;
          if (r.done) return;
          r.done = true; r.answers.push(txt);
          saveRecord(true);
          setRes(onSolved());
          fanfare('ok');
          const el = workRef.current;
          if (el) { const b = el.getBoundingClientRect(); flyCoins({ x: b.left + b.width / 2, y: b.top + b.height / 2 }, 1); }
          setStatus('ok'); setMood('happy');
          const text = 'せいかい！' + (extra ? '\n' + extra : '');
          setFb({ text, kind: 'ok', key: Date.now() });
          setTimeout(() => { if (r.alive) speak(text); }, 1150);
        },
      }), []);
      const host = {
        stage, no: p.no, phase, fb, hint, mood, talking, status, hintGlow, workRef, setEnd: !!(res && res.setEnd),
        onHint: () => {
          const r = R_.current;
          const lv = Math.min(r.hints.length, hint + 1);
          r.maxHint = Math.max(r.maxHint, lv);
          setHint(lv); setHintGlow(false);
          setFb({ text: r.hints[lv - 1], kind: 'hint', key: Date.now() });
          speak(r.hints[lv - 1]);
        },
        onReplay: () => speak(fb ? `${phase.prompt}\n${fb.text}` : phase.prompt, true),
        onNext: () => { TTS.cancel(); onNext(res || {}); },
      };
      const Comp = KIND[p.kind];
      return <Comp p={p} s={s} hint={hint} api={api} done={status === 'ok'} host={host} />;
    }

    function PlayScreen({ app, stage, onSetEnd }) {
      const range = stageRange(stage, app.state.settings);
      const list = useMemo(() => genStage(stage.id, range), [stage.id, range]);
      const [idx, setIdx] = useState(() => clamp(prog(app.stateRef.current, stage.id).idx || 0, 0, PER_STAGE - 1));
      const onSolved = () => {
        const newIdx = idx + 1;
        const setEnd = newIdx % PER_SET === 0;
        const stageEnd = newIdx >= PER_STAGE;
        const gain = 1 + (setEnd ? SET_BONUS : 0);
        app.update(st => {
          const pr = prog(st, stage.id);
          return {
            ...st, coins: st.coins + gain, earned: st.earned + gain,
            progress: { ...st.progress, [stage.id]: { ...pr, idx: stageEnd ? 0 : newIdx, cleared: pr.cleared || stageEnd, clears: (pr.clears || 0) + (stageEnd ? 1 : 0), firstClearAt: pr.firstClearAt || (stageEnd ? Date.now() : undefined), lastAt: Date.now() } },
          };
        });
        return { setEnd, stageEnd, setNo: Math.ceil(newIdx / PER_SET) };
      };
      const onNext = (res) => {
        if (res.setEnd) { onSetEnd(res); return; }
        setIdx(i => Math.min(PER_STAGE - 1, i + 1));
        window.scrollTo(0, 0);
      };
      return <ProblemHost key={`${stage.id}-${idx}-${range}`} app={app} stage={stage} p={list[idx]} onSolved={onSolved} onNext={onNext} />;
    }
