  }
  function applyShuanbo(b, f) {
    const patch = {};
    if (f.cls && b.className) patch.className = b.className;
    if (f.subj && b.subjects.length) {
      // 週案簿の 教科を 先に、いま 使っている ほかの 教科を あとに
      const used = new Set();
      ['timetable', 'weekly', 'units', 'materials'].forEach((k) => list(k).forEach((r) => { if (r.subject) used.add(r.subject); }));
      patch.subjects = b.subjects.concat(S.subjects.filter((x) => used.has(x) && !b.subjects.includes(x)));
      patch.standards = b.standards;
      patch.standardTotal = b.standardTotal;
    }
    if (f.wk) {
      // モジュールと（使っていれば）7校時を 校時に 足す
      const ps = S.periods.slice();
      if (!ps.some((p) => p.id === 'm')) ps.unshift({ id: 'm', name: 'モジュール', start: '08:30', end: '08:45', weight: 1 / 3 });
      if (b.usesP7 && !ps.some((p) => p.id === '7')) ps.push({ id: '7', name: '7校時', start: '', end: '', weight: 1 });
      if (ps.length !== S.periods.length) patch.periods = ps;
      if (isDate(b.start)) patch.shuanboStart = mondayOf(b.start);
    }
    if (Object.keys(patch).length) {
      Object.assign(S, patch);
      persist(() => api.saveSettings(patch));
    }
    if (f.tt && b.timetable.length) {
      const recs = b.timetable.map((x) => ({ id: ttId(x.day, x.pid), day: x.day, period: x.pid, subject: x.subject, memo: (get('timetable', ttId(x.day, x.pid)) || {}).memo || '' }));
      const keep = new Set(recs.map((r) => r.id));
      removeRecs('timetable', list('timetable').filter((r) => !keep.has(r.id)).map((r) => r.id), { render: false });
      putRecs('timetable', recs, { render: false });
    }
    let nWeeks = 0, nRecs = 0;
    if (f.wk) {
      const recs = [], dayRecs = [], weekRecs = [];
      const dates = new Set();
      b.weeks.forEach((w) => {
        if (w.focus) weekRecs.push({ id: 'v' + w.monday, monday: w.monday, focus: w.focus });
        if (w.days.some((d) => d.fixed)) nWeeks++;
        w.days.forEach((d) => {
          dates.add(d.date);
          d.recs.forEach((r) => recs.push(r));
          const dr = { id: 'y' + d.date, date: d.date, fixed: d.fixed ? 1 : '', yasumi: d.yasumi };
          if (f.notes) Object.assign(dr, { biko: d.biko, kiroku: d.kiroku });
          dayRecs.push(dr);
        });
      });
      nRecs = recs.length;
      const keep = new Set(recs.map((r) => r.id));
      removeRecs('weekly', list('weekly').filter((r) => dates.has(r.date) && !keep.has(r.id)).map((r) => r.id), { render: false });
      putRecs('weekly', recs, { render: false });
      putRecs('days', dayRecs, { render: false });
      putRecs('weeks', weekRecs, { render: false });
    }
    dataVersion++;
    render();
    setTimeout(() => openDialog({
      title: '✅ 取りこみました',
      readOnly: true,
      body: `<ul style="margin:0;padding-left:1.2em">${patch.className ? `<li>学級名：${esc(patch.className)}</li>` : ''}${patch.subjects ? `<li>教科・領域：${patch.subjects.length}／標準時数の 合計：${patch.standardTotal || '—'}</li>` : ''}${f.tt ? `<li>基本の時間割：${b.timetable.length}コマ</li>` : ''}${f.wk ? `<li>週案：${nWeeks}週分（${nRecs}コマ）${f.notes ? '・備考と記録欄' : ''}</li>` : ''}</ul>
        <p class="hint">スプレッドシートへの 保存には 少し 時間が かかります。上の「保存しています…」が「✓ 保存ずみ」に なるまで、画面を 閉じないでください。</p>
        <div class="toolbar" style="margin:0"><button class="btn" data-act="goTab" data-room="yotei" data-tab="week">週案を見る</button><button class="btn" data-act="goTab" data-room="yotei" data-tab="hours">時数の集計を見る</button></div>`,
    }), 0);
  }

  /* =========================================================
     週案の 下書き（毎週火曜日から、次の週の分を 自動で 作る）と、
     週案簿（Excel）に 貼り付けられる ファイルの 書き出し
     ========================================================= */
  /* 共通ここから */
  const SB_CONTENT_ROWS = [13, 21, 31, 39, 49, 57, 65]; // 1〜7校時の 学習内容の セル（祝日名の 縦書きにも 使う）
  const DRAFT_DAYS = [2, 3, 4, 5, 6, 0]; // 火〜日 は 次の週の 下書きを 作る（月曜日は 作らない）
  function weekNo(mon) {
    if (!isDate(S.shuanboStart)) return 0;
    const n = Math.floor(daysBetween(S.shuanboStart, mon) / 7) + 1;
    return n >= 1 && n <= 53 ? n : 0;
  }
  function draftTarget() { const t = today(); return DRAFT_DAYS.includes(dayOf(t)) ? addDays(mondayOf(t), 7) : ''; }
  // これから 来る 週で、下書きが できている 週
  function upcomingDraft() {
    const mon = addDays(mondayOf(today()), 7);
    const wk = get('weeks', 'v' + mon);
    return wk && isDate(wk.draftAt) ? { mon, at: wk.draftAt } : null;
  }
  function weekHasPlan(mon) { return weekDates(mon).some((d) => Number((dayInfo(d) || {}).fixed)); }
  function periodIndex(pid) { return S.periods.findIndex((p) => p.id === pid); }
  // 下書きの 学習内容：先週の 同じ 曜日・校時が 同じ 教科なら その内容、なければ いちばん近い 前の 同じ 教科の 内容
  // 書きこみの 教科（空なら 基本の時間割の 教科）
  function entrySubject(w) {
    if (w.subject === NONE) return '';
    return w.subject || ((baseLesson(dayOf(w.date), w.period) || {}).subject || '');
  }
  // 前の 同じ 教科の 書きこみ（先週の 同じ 曜日・校時を 先に 見る）
  function prevEntry(date, pid, subject) {
    const w1 = get('weekly', wkId(addDays(date, -7), pid));
    if (w1 && (w1.content || w1.aim) && entrySubject(w1) === subject) return w1;
    let best = null;
    list('weekly').forEach((w) => {
      if (!(w.content || w.aim) || !isDate(w.date) || w.date >= date || entrySubject(w) !== subject) return;
      if (!best || w.date > best.date || (w.date === best.date && periodIndex(w.period) > periodIndex(best.period))) best = w;
    });
    return best;
  }
  // 下書きを 作る（計算だけ）：書きこみの ない 時間に、時間割・授業時数・単元・前の 時間の 内容から 入れる 記録と、週の しるし
  function draftRecs(mon) {
    const recs = [];
    const mark = { id: 'v' + mon, monday: mon, draftAt: today() };
    if (weekHasPlan(mon)) return { recs, mark, plan: true };
    weekDates(mon).filter((d) => !offReason(d)).forEach((d) => {
      const di = dayInfo(d);
      const jisu = di && Number(di.jisu) > 0 ? Number(di.jisu) : 0;
      S.periods.forEach((p) => {
        if (get('weekly', wkId(d, p.id))) return;
        const L = lesson(d, p.id);
        const base = { id: wkId(d, p.id), date: d, period: p.id, hours: '', subject2: '', hours2: '', note: '', unitId: '' };
        if (!L.subject) {
          // 授業時数より 後の 最初の 時間に、下校などの 予定を 書いておく（週案簿と 同じ）
          if (jisu && periodNo(p.id) === jisu + 1) {
            const ev = eventsOn(d).find((e) => /下校|時程|時間授業/.test(e.title));
            if (ev) recs.push(Object.assign(base, { subject: NONE, content: ev.title }));
          }
          return;
        }
        const unitId = autoUnit(L.subject, d);
        // 単元の 一覧が あれば、次の 時の めあて・学習内容を 入れる
        const items = unitId ? unitItems(unitId) : [];
        const item = items[unitCountBefore(unitId, d, p.id) + recs.filter((r) => r.unitId === unitId).length];
        if (item) { recs.push(Object.assign(base, { subject: L.subject, unitId, head: item.head || '', aim: item.aim || '', content: item.content || '' })); return; }
        const carry = S.draftCarry ? prevEntry(d, p.id, L.subject) : null;
        recs.push(Object.assign(base, { subject: L.subject, unitId, head: carry ? carry.head || '' : '', aim: carry ? carry.aim || '' : '', content: carry ? carry.content || '' : (unitId && !S.sbUnit ? get('units', unitId).name : '') }));
      });
    });
    return { recs, mark, plan: false };
  }
  /* 共通ここまで */
  // 下書きを 作って 保存する
  function makeDraft(mon) {
    const r = draftRecs(mon);
    putRecs('weekly', r.recs, { render: false });
    putRecs('weeks', r.mark, { render: false });
    return { n: r.recs.length, plan: r.plan };
  }
  // Apps Script の 中では、火曜日の朝の 自動作成（トリガー）を つけておく（自分で オフに した ときを のぞく）
  function ensureDraftTrigger() {
    if (!IN_GAS || !S.autoDraft || meta.draftTrigger || S.draftTriggerOff) return;
    setDraftTrigger(true, true);
  }
  function setDraftTrigger(on, quiet) {
    return gasCall('apiSetDraftTrigger', on).then((v) => {
      meta.draftTrigger = !!v;
      meta.triggerError = '';
      if (!quiet || view.room === 'settings') render();
    }, (err) => {
      meta.triggerError = err && err.message ? err.message : String(err);
      if (!quiet || view.room === 'settings') render();
    });
  }
  // 火曜日〜日曜日に 開いたとき、次の週の 下書きが まだなら 作る（Apps Script の 自動作成が 動かなかったときの 予備）
  function autoDraftCheck() {
    if (!S || !S.autoDraft) return;
    const mon = draftTarget();
    if (!mon) return;
    const wk = get('weeks', 'v' + mon);
    if (wk && isDate(wk.draftAt)) return;
    if (!weekDates(mon).some((d) => !offReason(d))) return; // 休みの 週
    makeDraft(mon);
    render();
  }

  /* ---------- 週案簿に 貼り付ける 形 ---------- */
  /* 共通ここから */
  function gyojiOrder(a, b) {
    // 取りこんだ 行事予定は 列の 順（D→E→F）、自分で 入れた 予定は あと
    const ia = /^s\d{8}/.test(a.id), ib = /^s\d{8}/.test(b.id);
    if (ia !== ib) return ia ? -1 : 1;
    return ia ? a.id.localeCompare(b.id) : (a.time || '99').localeCompare(b.time || '99');
  }
  function shuanboMerges() {
    const out = [];
    SB_DAY_COLS.forEach((c) => {
      const hc = nextCol(c);
      [[7, 7], [8, 8], [10, 11], [13, 19], [21, 27], [28, 29], [31, 37], [39, 45], [46, 47], [49, 55], [57, 63], [65, 71], [72, 72]]
        .forEach(([a, b]) => out.push(`${c}${a}:${hc}${b}`));
    });
    return out;
  }
  // 出張と 補教（週案簿の 備考にも 入れる）
  function subId(date, pid) { return `hk${date}-${pid}`; }
  function subsOn(date) {
    return list('subs').filter((x) => x.date === date)
      .sort((a, b) => S.periods.findIndex((p) => p.id === String(a.period)) - S.periods.findIndex((p) => p.id === String(b.period)));
  }
  // 備考に 足す 行（自分で 備考に 書いた ものとは 重ねない）
  function tripLines(date) {
    const di = dayInfo(date) || {};
    const lines = list('trainings').filter((x) => x.date === date && x.trip).map((x) => `出張：${x.title}`);
    const ss = subsOn(date);
    if (ss.length) lines.push('補教：' + ss.map((x) => { const p = S.periods.find((q) => q.id === String(x.period)); return `${p ? p.name : x.period} ${x.teacher || '未定'}`; }).join('、'));
    return lines.filter((l) => !String(di.biko || '').includes(l));
  }
  // 週案簿の 学習内容の 欄：1行目（単元名・学習形態）／○めあて／学習内容
  function shuanboText(L) {
    const lines = [];
    const body = String(L.content || '');
    if (L.head) lines.push(L.head);
    else if (S.sbUnit && L.w && L.unit && L.unit.name && !body.startsWith(L.unit.name)) lines.push(L.unit.name);
    if (L.aim) lines.push((S.aimMark || '') + L.aim);
    if (body) lines.push(body);
    return lines.join('\n');
  }
  function shuanboCells(mon) {
    const cells = {};
    const splits = [];
    const days = DAYS.map((_, i) => addDays(mon, i)).concat([addDays(mon, 5)]); // 月〜土
    const satSchool = !offReason(days[5]);
    const module = S.periods.find((p) => p.weight < 1);
    days.forEach((d, i) => {
      if (i === 5 && !satSchool) return;
      const c = SB_DAY_COLS[i], hc = nextCol(c);
      // 行事（1行目に 1つめ、2行目に のこり）
      const gy = eventsOn(d).filter((e) => e.cat === '行事' || e.cat === KYUGYO).sort(gyojiOrder).map((e) => e.title);
      if (gy[0]) cells[c + '7'] = gy[0];
      if (gy.length > 1) cells[c + '8'] = gy.slice(1).join('　');
      const off = offReason(d);
      if (off) {
        // 週案簿と 同じく、祝日などは 名前を 1字ずつ 縦に、長い休みは 空白
        const name = off === '授業なし' ? '' : off;
        if (!name) cells[c + '13'] = ' ';
        else Array.from(name).slice(0, SB_CONTENT_ROWS.length).forEach((ch, k) => { cells[c + SB_CONTENT_ROWS[k]] = ch; });
        return;
      }
      if (module) {
        const L = lesson(d, module.id);
        if (L.subject) { cells[c + '9'] = L.subject; if (Math.abs(L.hours - module.weight) > 0.01) cells[hc + '9'] = L.hours; }
        if (L.content) cells[c + '10'] = L.content;
      }
      S.periods.filter((p) => p.weight >= 1).forEach((p) => {
        const r = SB_PERIOD_ROWS[periodNo(p.id)];
        if (!r) return;
        const L = lesson(d, p.id);
        if (L.subject) { cells[c + r] = L.subject; if (Math.abs(L.hours - 1) > 0.01) cells[hc + r] = L.hours; }
        let content = shuanboText(L);
        if (L.subject2) {
          content = `（＋${L.subject2} ${fmtH(L.hours2)}）` + (content ? '\n' + content : '');
          splits.push(`${jdate(d)} ${p.name}`);
        }
        if (content) cells[c + (r + 1)] = content;
      });
      const di = dayInfo(d) || {};
      String(di.yasumi || '').split('\n').map((x) => x.trim()).filter(Boolean).forEach((line) => {
        const m = line.match(/^(中休み|昼休み)：\s*(.*)$/);
        const row = m && m[1] === '昼休み' ? '46' : '28';
        const text = m ? m[2] : line;
        cells[c + row] = cells[c + row] ? cells[c + row] + '　' + text : text;
      });
      const biko = [di.biko].concat(tripLines(d)).filter(Boolean).join('\n');
      if (biko) cells[c + '72'] = biko;
      if (di.kiroku) cells[c + '73'] = di.kiroku;
    });
    return { cells, splits, lastCol: satSchool ? 'M' : 'K' };
  }
  /* 共通ここまで */
  async function downloadShuanbo(mon) {
    const X = await loadXlsx();
    const { cells, lastCol } = shuanboCells(mon);
    const no = weekNo(mon);
    const ws = {};
    const put = (addr, v) => { ws[addr] = typeof v === 'number' ? { t: 'n', v } : { t: 's', v: String(v) }; };
    put('A1', `${S.className} 週案の下書き　${no ? `第${no}週　` : ''}${jdate(mon)}〜`);
    put('A2', `コピーする範囲：B7:${lastCol}73　→　週案簿の「${no || 'その週の'}」シートの B7 を選んで［形式を選択して貼り付け］→［値］`);
    DAYS.map((_, i) => addDays(mon, i)).concat([addDays(mon, 5)]).forEach((d, i) => put(SB_DAY_COLS[i] + '5', `${md(d)}（${WD[dayOf(d)]}）`));
    [['A7', '行事'], ['A9', 'モジュール'], ['A28', '中休み'], ['A46', '昼休み'], ['A72', '備考'], ['A73', '記録欄']].forEach(([a, v]) => put(a, v));
    Object.keys(SB_PERIOD_ROWS).forEach((n) => put('A' + SB_PERIOD_ROWS[n], Number(n)));
    Object.keys(cells).forEach((a) => put(a, cells[a]));
    ws['!ref'] = 'A1:M73';
    ws['!merges'] = shuanboMerges().map((r) => X.utils.decode_range(r));
    ws['!cols'] = [{ wch: 8 }].concat(SB_DAY_COLS.flatMap(() => [{ wch: 18 }, { wch: 5 }]));
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, String(no || '週案'));
    const blob = new Blob([X.write(wb, { type: 'array', bookType: 'xlsx' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    downloadBlob(blob, `週案の下書き_${no ? '第' + no + '週_' : ''}${mon}.xlsx`);
  }
  function exportShuanbo(mon) {
    const { splits, lastCol } = shuanboCells(mon);
    const no = weekNo(mon);
    const wk = get('weeks', 'v' + mon) || {};
    openDialog({
      title: `📤 週案簿に貼る　${no ? `第${no}週` : ''}（${jdate(mon)}〜）`,
      readOnly: true,
      body: `<p style="margin:0">この週の週案を、週案簿（Excel）の 週の シートと 同じ形の ファイルに 書き出します。</p>
        <ol class="steps">
          <li>「Excelファイルを作る」を押して、ファイルを ダウンロードします。</li>
          <li>そのファイルを Excel で開き、左上の 名前ボックスに <b>B7:${lastCol}73</b> と入れて Enter →［コピー］（Ctrl＋C）</li>
          <li>週案簿の「<b>${no || 'その週の'}</b>」シートで <b>B7</b> を選び、右クリック →［形式を選択して貼り付け］→［値］→［OK］（Ctrl＋Alt＋V でも 開けます）</li>
        </ol>
        ${splits.length ? `<p class="warn-box" style="margin:0">⚠ 1時間を 2つの教科に 分けた時間（${splits.map(esc).join('、')}）は、1つめの教科だけが 入ります。週案簿で 分けてから、2つめの教科を 入れてください。</p>` : ''}
        ${wk.focus ? `<label class="field">今週の重点（週案簿の G3 に 貼ってください）<textarea class="input" id="focusCopy" rows="2" readonly>${esc(wk.focus)}</textarea></label>` : ''}
        <div class="toolbar" style="margin:0">
          <button class="btn primary" data-act="dlShuanbo" data-mon="${mon}">📥 Excelファイルを作る</button>
          ${IN_GAS ? `<button class="btn" data-act="sheetShuanbo" data-mon="${mon}">Googleスプレッドシートに 書き出す</button>` : ''}
          ${wk.focus ? '<button class="btn" data-act="copyFocus">📋 今週の重点を コピー</button>' : ''}
        </div>
        <p class="hint" id="exportMsg" role="status"></p>
        <p class="hint">貼り付けると、週案簿の その週の 行事・教科・時数・学習内容・休み時間・備考・記録欄が 入れかわります。右側の 時数の集計は、週案簿が 自動で 計算します。${IN_GAS ? 'ダウンロードが できないときは「Googleスプレッドシートに 書き出す」で 開き、［ファイル］→［ダウンロード］→［Microsoft Excel］で 保存してください。' : ''}</p>`,
    });
  }
  function exportMsg(text) { const el = document.getElementById('exportMsg'); if (el) el.textContent = text; }

  /* =========================================================
     子どもの部屋
     ========================================================= */
  const NOTE_TAGS = ['よかったこと', '学習', '生活', 'コミュニケーション', '行動', '体・健康', 'その他'];
  const NOTE_TAG_HUE = { 'よかったこと': 40, '学習': 210, '生活': 140, 'コミュニケーション': 280, '行動': 0, '体・健康': 170 };
  const PLAN_TERMS = ['年間', '1学期', '2学期', '3学期'];
  const PLAN_AREAS = ['国語', '算数', '生活単元', '日常生活', '自立活動', 'コミュニケーション', '行動・社会性', '交流学級'];
  const LEVELS = { '◎': 'よくできた', '○': 'おおむねできた', '△': 'もう少し' };
  const CONTACT_METHODS = ['連絡帳', '電話', '面談', '送り迎えのとき', 'メール・アプリ', 'その他'];
  const PRIVACY_NOTE = '🔒 この部屋には 子どもの 大切な 情報が 入ります。呼び名で、必要な ことだけを 短く 書きましょう。診断名や 検査の 結果などは 書かないでください。';

  // いまの 学期（3学期制）
  function termNow(date) {
    const d = date || today();
    const m = parse(d).getMonth() + 1;
    const i = TERMS.findIndex((t) => t.months.includes(m));
    return { nendo: nendoOf(d), term: TERMS[i].name };
  }
  // 学期の はじめと おわり（「年間」は 年度の はじめと おわり）
  function termRange(nendo, term) {
    const t = TERMS.find((x) => x.name === term);
    if (!t) return [`${nendo}-04-01`, `${nendo + 1}-03-31`];
    const first = t.months[0], last = t.months[t.months.length - 1];
    const y = (m) => nendo + (m < 4 ? 1 : 0);
    return [`${y(first)}-${pad(first)}-01`, ymd(new Date(y(last), last, 0))];
  }
  function kidHue(id) { const i = children().findIndex((c) => c.id === id); return i < 0 ? -1 : Math.round((i * 71 + 200) % 360); }
  function kidChip(id) {
    const k = get('children', id);
    if (!k) return '<span class="chip gray">（消した子）</span>';
    return `<span class="chip kid" style="--h:${Math.max(kidHue(id), 0)}">🧒 ${esc(k.name)}</span>`;
  }
  function tagChip(tag) {
    if (!tag) return '';
    const h = NOTE_TAG_HUE[tag];
    return `<span class="chip${h === undefined ? ' gray' : ''}" style="--h:${h || 0};font-size:12px">${esc(tag)}</span>`;
  }
  const byDateDesc = (a, b) => String(b.date).localeCompare(String(a.date)) || String(b.id).localeCompare(String(a.id));
  function notesOf(cid) { return list('notes').filter((n) => !cid || n.childId === cid).sort(byDateDesc); }
  function contactsOf(cid) { return list('contacts').filter((c) => !cid || c.childId === cid).sort(byDateDesc); }
  function planOf(cid, nendo) { return get('plans', `p${cid}-${nendo}`); }
  function goalsOf(cid, nendo, term) {
    return list('goals').filter((g) => g.childId === cid && Number(g.nendo) === nendo && (!term || g.term === term))
      .sort((a, b) => PLAN_TERMS.indexOf(a.term) - PLAN_TERMS.indexOf(b.term) || (Number(a.order) || 0) - (Number(b.order) || 0));
  }
  function kidOptions(selected, firstLabel) {
    return (firstLabel ? opt('', selected || '', firstLabel) : '') + children().map((k) => opt(k.id, selected, k.name)).join('');
  }
  function noteRow(n, showKid) {
    return `<li class="note-row"><span class="nd">${md(n.date)}</span>${showKid ? kidChip(n.childId) : ''}${tagChip(n.tag)}
      <span class="nt" data-act="editNote" data-id="${esc(n.id)}" role="button" tabindex="0">${nl(n.text)}</span></li>`;
  }
  function contactCard(c, showKid) {
    const done = c.followup && list('tasks').some((x) => x.fromId === `${c.id}:f`);
    return `<article class="contact">
      <div class="meta"><b style="color:var(--ink)">${isDate(c.date) ? jdate(c.date) : ''}</b>${showKid ? kidChip(c.childId) : ''}${c.method ? `<span class="tag">${esc(c.method)}</span>` : ''}<span class="grow"></span>
        <button class="btn small" data-act="editContact" data-id="${esc(c.id)}">直す</button></div>
      ${c.content ? `<div class="ct-body">${nl(c.content)}</div>` : ''}
      ${c.followup ? `<div class="mine"><b>👉 次にすること</b><div class="task" style="border:0;padding:4px 0 0"><div class="tmain">${nl(c.followup)}</div>${done ? '<span class="tag">✓ やることに入れました</span>' : `<button class="btn small" data-act="contactToTask" data-id="${esc(c.id)}">＋ やることへ</button>`}</div></div>` : ''}
    </article>`;
  }
  function goalCard(g) {
    return `<div class="goal-card" data-act="editGoal" data-id="${esc(g.id)}" role="button" tabindex="0">
      <div class="meta">${g.area ? `<span class="tag">${esc(g.area)}</span>` : ''}${g.term === '年間' ? '<span class="tag">年間</span>' : ''}${g.level ? `<b class="lv" title="${esc(LEVELS[g.level] || '')}">${esc(g.level)} ${esc(LEVELS[g.level] || '')}</b>` : '<span class="tag">評価 まだ</span>'}</div>
      <div class="g-goal">🎯 ${nl(g.goal)}</div>
      ${g.support ? `<div class="g-sub">🛠 ${nl(g.support)}</div>` : ''}
      ${g.evaluation ? `<div class="g-sub">📝 ${nl(g.evaluation)}</div>` : ''}
    </div>`;
  }

  function viewKodomo() {
    const kids = children();
    const note = `<p class="privacy">${PRIVACY_NOTE}</p>`;
    if (!kids.length) {
      return note + `<div class="empty-note" style="margin-top:12px">まず、学級の子どもを 登録してください。<br><button class="btn primary" style="margin-top:8px" data-act="editChild">＋ 子どもを追加</button></div>`;
    }
    if (!kids.some((k) => k.id === view.childId)) view.childId = kids[0].id;
    const tab = view.tab.kodomo;
    return subtabs('kodomo', [['child', '🧒 一人ひとり'], ['notes', '📝 日々の記録'], ['plans', '📋 指導計画'], ['contacts', '📞 保護者連絡']]) + note +
      ({ child: viewKid, notes: viewNotes, plans: viewPlans, contacts: viewContacts })[tab]();
  }

  /* ---------- 一人ひとり ---------- */
  function viewKid() {
    const kids = children();
    const k = get('children', view.childId);
    const tn = termNow();
    const term = view.planTerm || tn.term;
    const plan = planOf(k.id, tn.nendo) || {};
    const goals = goalsOf(k.id, tn.nendo, term);
    const notes = notesOf(k.id);
    const cts = contactsOf(k.id).slice(0, 4);
    const xs = list('exchange').filter((x) => x.childId === k.id)
      .sort((a, b) => Number(a.day) - Number(b.day) || periodIndex(String(a.period)) - periodIndex(String(b.period)));
    const pName = (pid) => (S.periods.find((p) => p.id === String(pid)) || { name: pid + '校時' }).name;
    return `<div class="pills" style="margin:4px 0 12px">${kids.map((x) => `<button class="pill${x.id === k.id ? ' on' : ''}" data-act="pickKid" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join('')}
        <button class="pill" data-act="editChild">＋ 子どもを追加</button></div>
      <section class="card" style="margin-bottom:16px">
        <div class="toolbar"><h2 class="sec">${kidChip(k.id)} <span class="muted" style="font-size:15px;font-weight:400">${esc(k.grade)}　交流学級：${esc(k.homeroom || '—')}</span></h2><span class="grow"></span>
          <button class="btn small primary" data-act="shoken" data-id="${esc(k.id)}">🌱 所見のたね</button>
          <button class="btn small" data-act="editChild" data-id="${esc(k.id)}">直す</button></div>
        <div class="row2">
          <div class="info"><b>⭐ 好きなこと・得意なこと</b><div>${k.likes ? nl(k.likes) : '<span class="muted">（「直す」から 書けます）</span>'}</div></div>
          <div class="info"><b>🤝 配慮・支援のポイント</b><div>${k.care ? nl(k.care) : '<span class="muted">（「直す」から 書けます）</span>'}</div></div>
        </div>
      </section>
      <div class="grid2">
        <div class="stack">
          <section class="card">
            <div class="toolbar"><h2 class="sec">📋 個別の指導計画（${wareki(tn.nendo).replace(/年$/, '')}年度）</h2><span class="grow"></span>
              <button class="btn small" data-act="editPlan" data-id="${esc(k.id)}">願い・長期目標</button></div>
            ${plan.wishSelf || plan.wishParent || plan.longGoal ? `<dl class="plan-dl">
              ${plan.wishSelf ? `<dt>本人の願い</dt><dd>${nl(plan.wishSelf)}</dd>` : ''}${plan.wishParent ? `<dt>保護者の願い</dt><dd>${nl(plan.wishParent)}</dd>` : ''}${plan.longGoal ? `<dt>長期目標</dt><dd>${nl(plan.longGoal)}</dd>` : ''}</dl>` : ''}
            <div class="pills" style="margin:8px 0">${PLAN_TERMS.map((x) => `<button class="pill${x === term ? ' on' : ''}" data-act="planTerm" data-term="${x}">${x}${x === tn.term ? '（いま）' : ''}</button>`).join('')}</div>
            ${goals.length ? `<div class="stack" style="gap:8px">${goals.map(goalCard).join('')}</div>` : `<div class="empty-note">${esc(term)}の 目標は まだ ありません。</div>`}
            <div class="toolbar" style="margin:10px 0 0"><span class="grow"></span><button class="btn small" data-act="editGoal" data-kid="${esc(k.id)}" data-term="${esc(term)}">＋ 目標を足す（段階表からも 選べます）</button></div>
          </section>
          ${kidStagesCard(k)}
          <section class="card">
            <div class="toolbar"><h2 class="sec">🚶 交流の時間</h2><span class="grow"></span><button class="btn small" data-act="goTab" data-room="yotei" data-tab="koryu">交流学級の表</button></div>
            ${xs.length ? `<ul class="day-list">${xs.map((x) => `<li><div class="pname">${WD[Number(x.day)]}曜日<span class="ptime">${esc(pName(x.period))}</span></div><div class="what">${chip(x.subject) || '—'} <span class="muted">${esc(x.room || k.homeroom || '')}</span>${x.memo ? `<div class="content">${esc(x.memo)}</div>` : ''}</div></li>`).join('')}</ul>` : '<p class="hint">交流の時間は ありません。</p>'}
          </section>
        </div>
        <div class="stack">
          <section class="card">
            <div class="toolbar"><h2 class="sec">📝 日々の記録（${notes.length}件）</h2><span class="grow"></span>
              <button class="btn small" data-act="kidNotes" data-id="${esc(k.id)}">すべて見る</button></div>
            ${quickNoteForm(k.id)}
            ${notes.length ? `<ul class="notes">${notes.slice(0, 12).map((n) => noteRow(n, false)).join('')}</ul>` : '<p class="hint" style="margin-top:8px">気づいたことを、ひとことずつ 残していきましょう。</p>'}
          </section>
          <section class="card">
            <div class="toolbar"><h2 class="sec">📞 保護者との連絡</h2><span class="grow"></span>
              <button class="btn small" data-act="editContact" data-kid="${esc(k.id)}">＋ 記録</button></div>
            ${cts.length ? `<div class="stack" style="gap:8px">${cts.map((c) => contactCard(c, false)).join('')}</div>` : '<p class="hint">連絡の記録は まだ ありません。</p>'}
          </section>
        </div>
      </div>`;
  }
  function quickNoteForm(kid) {
    return `<form class="quick" data-form="quickNote" style="margin-bottom:8px">
      ${kid ? `<input type="hidden" name="childId" value="${esc(kid)}">` : `<select class="input" name="childId" required style="width:auto" aria-label="子ども">${kidOptions(view.noteKid || '', '子どもを選ぶ')}</select>`}
      <select class="input" name="tag" style="width:auto" aria-label="分類">${NOTE_TAGS.map((t) => opt(t, view.lastTag || 'よかったこと')).join('')}</select>
      <input class="input" name="text" required maxlength="1000" placeholder="気づいたことを ひとこと（Enter で 記録）" aria-label="記録">
      <button type="submit" class="btn primary">記録</button>
    </form>`;
  }

  /* ---------- 日々の記録 ---------- */
  function viewNotes() {
    const tn = termNow();
    const [from, to] = view.noteTerm === 'all' ? ['0000-00-00', '9999-99-99'] : view.noteTerm === 'year' ? termRange(tn.nendo, '年間') : termRange(tn.nendo, tn.term);
    const inRange = (n) => n.date >= from && n.date <= to;
    const counts = children().map((k) => `${esc(k.name)} ${notesOf(k.id).filter(inRange).length}`).join('・');
    return `<section class="card" style="margin-bottom:12px">${quickNoteForm('')}
        <p class="hint">${view.noteTerm === 'all' ? 'これまでの' : view.noteTerm === 'year' ? '今年度の' : `${tn.term}の`} 記録の数：${counts}　<span class="muted">（少ない子にも 目を向けましょう）</span></p></section>
      <div class="toolbar">
        <select class="input" style="width:auto" data-chg="noteKid" aria-label="子どもで しぼりこむ">${kidOptions(view.noteKid, 'すべての子')}</select>
        <select class="input" style="width:auto" data-chg="noteTag" aria-label="分類で しぼりこむ">${opt('', view.noteTag, 'すべての分類')}${NOTE_TAGS.map((t) => opt(t, view.noteTag)).join('')}</select>
        <select class="input" style="width:auto" data-chg="noteTerm" aria-label="期間">${opt('term', view.noteTerm, `${tn.term}`)}${opt('year', view.noteTerm, '今年度')}${opt('all', view.noteTerm, 'すべて')}</select>
        <input class="input" style="max-width:240px" type="search" placeholder="🔍 さがす" value="${esc(view.noteQ)}" data-inp="noteQ" aria-label="記録を さがす">
      </div>
      <div id="note-list">${noteList(from, to)}</div>`;
  }
  function noteList(from, to) {
    if (!from) {
      const tn = termNow();
      [from, to] = view.noteTerm === 'all' ? ['0000-00-00', '9999-99-99'] : view.noteTerm === 'year' ? termRange(tn.nendo, '年間') : termRange(tn.nendo, tn.term);
    }
    const q = view.noteQ.trim().toLowerCase();
    const ns = notesOf(view.noteKid).filter((n) => n.date >= from && n.date <= to && (!view.noteTag || n.tag === view.noteTag) && (!q || String(n.text).toLowerCase().includes(q)));
    if (!ns.length) return '<div class="empty-note">記録は ありません。</div>';
    const dates = Array.from(new Set(ns.map((n) => n.date)));
    return dates.map((d) => `<h3 class="group-title">${isDate(d) ? jdate(d) : '日付なし'}</h3><section class="card" style="padding:8px 14px"><ul class="notes">${ns.filter((n) => n.date === d).map((n) => noteRow(n, true)).join('')}</ul></section>`).join('');
  }
  function editNote(id, preset) {
    const n = id ? get('notes', id) : Object.assign({ date: today(), tag: 'よかったこと' }, preset || {});
    if (!n) return;
    openDialog({
      title: id ? '記録を直す' : '記録を書く',
      body: `<div class="row2">
          <label class="field">子ども <select name="childId" required>${kidOptions(n.childId, '—')}</select></label>
          <label class="field">日付 <input type="date" name="date" required value="${esc(n.date)}"></label>
        </div>
        <label class="field">分類 <select name="tag">${NOTE_TAGS.map((t) => opt(t, n.tag)).join('')}</select></label>
        <label class="field">記録 <textarea name="text" rows="4" required maxlength="1000">${esc(n.text)}</textarea></label>
        <p class="hint">事実（したこと・言ったこと）と、そのときの 支援を 短く 書いておくと、所見や 評価に 使いやすく なります。</p>`,
      deleteLabel: id ? 'この記録を消す' : '',
      onDelete: () => removeRecs('notes', id),
      onSave: (f) => {
        if (!f.childId) return '子どもを 選んでください。';
        putRecs('notes', { id: id || uid('nt'), childId: f.childId, date: f.date, tag: f.tag, text: f.text.trim() });
      },
    });
  }

  /* ---------- 指導計画 ---------- */
  function viewPlans() {
    const tn = termNow();
    const term = view.planTerm || tn.term;
    const rows = children().map((k) => {
      const gs = goalsOf(k.id, tn.nendo, term);
      const done = gs.filter((g) => g.level || g.evaluation).length;
      return `<tr><td><button class="btn link" data-act="pickKid" data-id="${esc(k.id)}">${kidChip(k.id)}</button></td>
        <td>${gs.length ? `<ul class="plan-goals">${gs.map((g) => `<li data-act="editGoal" data-id="${esc(g.id)}" role="button" tabindex="0">${g.area ? `<b>${esc(g.area)}</b>：` : ''}${esc(short(g.goal, 40))}${g.level ? ` <b class="lv">${esc(g.level)}</b>` : ''}</li>`).join('')}</ul>` : '<span class="muted">目標が ありません</span>'}</td>
        <td style="white-space:nowrap">${gs.length ? `${done} / ${gs.length}${done === gs.length ? ' ✅' : ''}` : '—'}</td>
        <td><button class="btn small" data-act="editGoal" data-kid="${esc(k.id)}" data-term="${esc(term)}">＋ 目標</button></td></tr>`;
    }).join('');
    return `<div class="pills" style="margin:4px 0 12px">${PLAN_TERMS.map((x) => `<button class="pill${x === term ? ' on' : ''}" data-act="planTerm" data-term="${x}">${x}${x === tn.term ? '（いま）' : ''}</button>`).join('')}</div>
      <p class="hint" style="margin-bottom:8px">${wareki(tn.nendo).replace(/年$/, '')}年度 ${esc(term)}の 個別の指導計画です。目標を 押すと、手立てや 評価を 書けます。評価の 時期の 前に、評価ずみの 数を 確かめましょう。</p>
      <div class="table-wrap"><table class="list"><thead><tr><th>子ども</th><th>目標</th><th>評価ずみ</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function editPlan(kid) {
    const k = get('children', kid);
    if (!k) return;
    const nendo = termNow().nendo;
    const id = `p${kid}-${nendo}`;
    const p = get('plans', id) || {};
    openDialog({
      title: `${k.name}　${wareki(nendo).replace(/年$/, '')}年度の 願い・長期目標`,
      body: `<label class="field">本人の願い <textarea name="wishSelf" rows="2" maxlength="1000">${esc(p.wishSelf)}</textarea></label>
        <label class="field">保護者の願い <textarea name="wishParent" rows="2" maxlength="1000">${esc(p.wishParent)}</textarea></label>
        <label class="field">長期目標（1年間） <textarea name="longGoal" rows="3" maxlength="2000">${esc(p.longGoal)}</textarea></label>
        <label class="field">メモ <textarea name="memo" rows="2" maxlength="2000">${esc(p.memo)}</textarea></label>`,
      onSave: (f) => putRecs('plans', { id, childId: kid, nendo, wishSelf: f.wishSelf.trim(), wishParent: f.wishParent.trim(), longGoal: f.longGoal.trim(), memo: f.memo.trim() }),
    });
  }
  function editGoal(id, kid, term) {
    const nendo = termNow().nendo;
    const g = id ? get('goals', id) : { childId: kid, nendo, term: term || termNow().term };
    if (!g) return;
    const k = get('children', g.childId);
    view.goalPick = {};
    openDialog({
      title: `${k ? k.name + '　' : ''}${id ? '目標を直す' : '目標を足す'}`,
      body: `<div class="row2">
          <label class="field">学期 <select name="term">${PLAN_TERMS.map((x) => opt(x, g.term)).join('')}</select></label>
          <label class="field">領域・教科 <input name="area" list="area-list" maxlength="30" value="${esc(g.area)}" placeholder="例：国語"></label>
        </div>
        <datalist id="area-list">${PLAN_AREAS.map((a) => `<option value="${esc(a)}">`).join('')}</datalist>

  /* ---------- 所見のたね（学期の 記録と 指導計画を 1つの 文に まとめる） ---------- */
  function shokenText(kid, nendo, term) {
    const k = get('children', kid);
    const [from, to] = termRange(nendo, term);
    const lines = [`【${k.name}　${wareki(nendo).replace(/年$/, '')}年度 ${term}の 記録】`];
    const goals = goalsOf(kid, nendo).filter((g) => g.term === term || g.term === '年間');
    if (goals.length) {
      lines.push('', '■ 個別の指導計画');
      goals.forEach((g) => {
        lines.push(`・${g.area ? g.area + '：' : ''}${g.goal}${g.term === '年間' ? '（年間）' : ''}`);
        if (g.support) lines.push(`　手立て：${g.support.replace(/\n/g, ' ')}`);
        if (g.level || g.evaluation) lines.push(`　評価${g.level ? `（${g.level}）` : ''}：${(g.evaluation || '').replace(/\n/g, ' ')}`);
      });
    }
    const ns = notesOf(kid).filter((n) => n.date >= from && n.date <= to).reverse();
    if (ns.length) {
      lines.push('', `■ 日々の記録（${ns.length}件）`);
      NOTE_TAGS.forEach((t) => {
        const part = ns.filter((n) => (n.tag || 'その他') === t);
        if (!part.length) return;
        lines.push(`〈${t}〉`);
        part.forEach((n) => lines.push(`・${md(n.date)} ${String(n.text).replace(/\n/g, ' ')}`));
      });
    }
    const sl = stageLogsOf(kid).filter((x) => x.date >= from && x.date <= to).reverse();
    if (sl.length) {
      lines.push('', '■ 段階の あゆみ');
      sl.forEach((x) => lines.push(`・${md(x.date)} ${x.subject}：${x.from || '—'} → ${x.to}`));
    }
    const cs = contactsOf(kid).filter((c) => c.date >= from && c.date <= to).reverse();
    if (cs.length) {
      lines.push('', '■ 保護者との連絡');
      cs.forEach((c) => lines.push(`・${md(c.date)} ${c.method ? c.method + '：' : ''}${String(c.content || '').replace(/\n/g, ' ')}`));
    }
    if (lines.length === 1) lines.push('', 'この 学期の 記録は まだ ありません。');
    return lines.join('\n');
  }
  function showShoken(kid, term) {
    const k = get('children', kid);
    if (!k) return;
    const tn = termNow();
    const t = term || (view.planTerm && view.planTerm !== '年間' ? view.planTerm : tn.term);
    openDialog({
      title: `🌱 所見のたね　${k.name}`,
      readOnly: true,
      attrs: `data-kid="${esc(kid)}"`,
      body: `<div class="pills">${TERMS.map((x) => `<button type="button" class="pill${x.name === t ? ' on' : ''}" data-act="shokenTerm" data-kid="${esc(kid)}" data-term="${x.name}">${x.name}</button>`).join('')}</div>
        <textarea class="input" id="draftText" rows="16" aria-label="所見のたね">${esc(shokenText(kid, tn.nendo, t))}</textarea>
        <div class="toolbar" style="margin:0"><button class="btn primary" data-act="copyDraft">📋 コピーする</button><span class="hint" id="copyMsg" role="status"></span></div>
        <p class="hint">学期の 指導計画・日々の記録・保護者との連絡を 集めました。通知表の 所見や、指導計画の 評価を 書くときの 材料に してください（ここで 書きかえても 保存は されません）。</p>`,

  const STAFF_ROLES = ['支援員', '介助員', '学習補助員', '専科', '通級', 'スクールカウンセラー', '看護師', 'その他'];

  const sbId = (sid, day, pid) => `sb${sid}-${day}-${pid}`;
  const sdId = (sid, date, pid) => `sd${sid}-${date}-${pid}`;

  function staffList() { return list('staff').sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0) || String(a.name).localeCompare(String(b.name), 'ja')); }
  function staffOn(date) { const d = String(dayOf(date)); return staffList().filter((x) => String(x.days || '').includes(d)); }
  const NO_PLAN = '—'; // その日だけ「動きなし」
  // その日の 動き（その日だけの 変更 → なければ 曜日の 基本）
  function staffRaw(sid, date, pid) {
    const o = get('staffPlans', sdId(sid, date, pid));
    if (o) return String(o.text || '');
    const b = get('staffPlans', sbId(sid, dayOf(date), pid));
    return b ? String(b.text || '') : '';
  }
  function staffText(sid, date, pid) { const t = staffRaw(sid, date, pid); return t === NO_PLAN ? '' : t; }
  function staffDaysLabel(days) { return String(days || '').split('').filter((c) => /[1-6]/.test(c)).map((c) => WD[Number(c)]).join('・') || '—'; }
  // 交流学級の 名前（子どもの 交流学級と、交流の 行き先から）
  function classNames() {
    const names = new Set();
    children().forEach((k) => { if (k.homeroom) names.add(k.homeroom); });
    list('exchange').forEach((x) => { if (x.room) names.add(x.room); });
    list('classes').forEach((c) => { if (c.name) names.add(c.name); });
    return Array.from(names).sort((a, b) => zen2han(a).localeCompare(zen2han(b), 'ja', { numeric: true }));
  }
  function classRec(name) { return list('classes').find((c) => c.name === name); }
  // ある 学級への この週の 交流（休みの 日は のぞく）
  function classWeek(name, mon) {
    const out = [];
    weekDates(mon).forEach((d) => {
      if (offReason(d)) return;
      S.periods.forEach((p) => {
        outsAt(dayOf(d), p.id).forEach((o) => {
          if ((o.x.room || o.child.homeroom) === name) out.push({ date: d, p, child: o.child, x: o.x });
        });
      });
    });
    return out;
  }
  function orgKids(o) { return String(o.childIds || '').split(',').map((x) => x.trim()).filter((id) => get('children', id)); }

  function viewRenkei() {

      title: id ? `${x.name} さんの 情報` : '支援員さんなどを 追加',

          <label class="field">名前 <input name="name" required maxlength="20" value="${esc(x.name)}" placeholder="例：〇〇さん"></label>

        <div class="field">勤務曜日 <div class="pills">${DAYS.map((d) => `<label class="check" style="font-weight:400"><input type="checkbox" name="d${d}" ${String(x.days || '').includes(String(d)) ? 'checked' : ''}> ${WD[d]}</label>`).join('')}</div></div>

      onSave: (f) => {
        const days = DAYS.filter((d) => f['d' + d]).join('');
        const order = id ? x.order : Math.max(0, ...list('staff').map((s) => Number(s.order) || 0)) + 1;

      },

  }
  function staffDayText(date) {
    const lines = [`${jdate(date)} の 動き`];
    staffOn(date).forEach((x) => {
      lines.push('', `【${x.name}さん${x.role ? '（' + x.role + '）' : ''}】`);
      let n = 0;
      S.periods.forEach((p) => {
        const t = staffText(x.id, date, p.id);
        if (!t) return;
        n++;
        const L = lesson(date, p.id);
        lines.push(`・${p.name}${L.subject ? '（' + L.subject + '）' : ''}：${t}`);
      });
      if (!n) lines.push('・（動きは まだ 入っていません）');
    });
    lines.push('', 'よろしく お願いします。');
    openDialog({
      title: `📋 ${jdate(date)} 支援員さんへの 文`,
      readOnly: true,
      body: `<textarea class="input" id="draftText" rows="14" aria-label="支援員さんへの 文">${esc(lines.join('\n'))}</textarea>
        <div class="toolbar" style="margin:0"><button class="btn primary" data-act="copyDraft">📋 コピーする</button><span class="hint" id="copyMsg" role="status"></span></div>`,
    });
  }

  const DASHES = /^[—\-ー－―‐]$/;
  function changeStaffDay(el) {
    const { sid, date, pid } = el.dataset;
    const id = sdId(sid, date, pid);
    let v = el.value.trim();
    if (DASHES.test(v)) v = NO_PLAN;
    const b = get('staffPlans', sbId(sid, dayOf(date), pid));
    const base = b ? String(b.text || '') : '';
    if (!v || v === base) {
      removeRecs('staffPlans', id, { render: false });
      el.value = base;
      el.classList.remove('own');
    } else {
      putRecs('staffPlans', { id, staffId: sid, date, day: '', period: pid, text: v }, { render: false });
      el.value = v;
      el.classList.add('own');
    }
  }
  function changeStaffBase(el) {
    const { sid, day, pid } = el.dataset;
    const id = sbId(sid, day, pid);
    const v = el.value.trim();
    if (!v) removeRecs('staffPlans', id, { render: false });
    else putRecs('staffPlans', { id, staffId: sid, date: '', day: Number(day), period: pid, text: v }, { render: false });
    // 上の その日の 表で、変更していない 欄を 新しい 基本に そろえる
    document.querySelectorAll('[data-chg=staffDay]').forEach((x) => {
      if (x.dataset.sid === sid && x.dataset.pid === pid && dayOf(x.dataset.date) === Number(day) && !x.classList.contains('own')) x.value = v;
    });
  }

      ${orgs.length ? `<div class="cards">${orgs.map((o) => `<article class="card org">

        <h3 style="margin:4px 0;font-size:17px">${esc(o.name)}</h3>

      </article>`).join('')}</div>` : '<div class="empty-note">放課後等デイサービス・相談機関などを「＋ 関係機関を追加」から 入れてください。</div>'}
      <div class="toolbar" style="margin-top:20px" id="org-logs"><h2 class="sec">📞 連絡の 記録</h2><span class="grow"></span>
        <select class="input" style="width:auto" data-chg="orgId" aria-label="関係機関で しぼりこむ">${opt('', view.orgId, 'すべての関係機関')}${orgs.map((o) => opt(o.id, view.orgId, o.name)).join('')}</select></div>
      ${logs.length ? `<div class="stack" style="gap:8px" id="log-list">${logs.map((l) => {
        const o = get('orgs', l.orgId);
        const done = l.followup && list('tasks').some((x) => x.fromId === `${l.id}:f`);
        return `<section class="card" style="padding:10px 14px">
          <div class="meta"><b style="color:var(--ink)">${isDate(l.date) ? jdate(l.date) : ''}</b><span class="tag">${esc(o ? o.name : '（消した 機関）')}</span>${l.childId ? kidChip(l.childId) : ''}${l.method ? `<span class="tag">${esc(l.method)}</span>` : ''}<span class="grow"></span><button class="btn small" data-act="editOrgLog" data-id="${esc(l.id)}">直す</button></div>
          ${l.content ? `<div class="ct-body">${nl(l.content)}</div>` : ''}
          ${l.followup ? `<div class="mine"><b>👉 次にすること</b><div class="task" style="border:0;padding:4px 0 0"><div class="tmain">${nl(l.followup)}</div>${done ? '<span class="tag">✓ やることに入れました</span>' : `<button class="btn small" data-act="orgLogToTask" data-id="${esc(l.id)}">＋ やることへ</button>`}</div></div>` : ''}
        </section>`;
      }).join('')}</div>` : '<div class="empty-note">連絡の 記録は まだ ありません。</div>'}`;
  }

      deleteLabel: id ? 'この記録を消す' : '',
      onDelete: () => removeRecs('orgLogs', id),
      onSave: (f) => {

        putRecs('orgLogs', { id: id || uid('ol'), orgId: f.orgId, childId: f.childId, date: f.date, method: f.method, content: f.content.trim(), followup: f.followup.trim() });
      },
    });

  /* =========================================================
     研究・研修の部屋
     ========================================================= */
  const TRAIN_KINDS = ['法定研修', '特別支援教育', '教科・授業', '校内研修', 'ICT', '生徒指導・人権', '自主研修・読書', 'その他'];
  const REPORTS = [['', 'なし'], ['あり', 'あり（まだ）'], ['提出ずみ', '提出ずみ']];
  const STUDY_STEPS = ['指導案 第一稿', '部会で 検討', '指導案 提出', '授業', '協議会', 'まとめ・報告'];
  const MINE = '自分の授業', VISIT = '参観';
  const fmtHours = (h) => String(Math.round(h * 10) / 10);

  function trainingsOf(nendo) { return list('trainings').filter((x) => isDate(x.date) && nendoOf(x.date) === nendo); }
  function researchOf(nendo) { return list('research').find((r) => Number(r.nendo) === nendo); }
  function stepsDone(s) { return String(s.steps || '').split(',').filter((x) => STUDY_STEPS.includes(x)); }
  function nextStep(s) { const d = stepsDone(s); return STUDY_STEPS.find((x) => !d.includes(x)) || ''; }
  // 報告書が まだの 研修（締め切りの 近い 順）
  function reportsDue() {
    return list('trainings').filter((x) => x.report === 'あり').sort((a, b) => (isDate(a.reportDue) ? a.reportDue : '9999').localeCompare(isDate(b.reportDue) ? b.reportDue : '9999'));
  }
  // ロビーの「これからの予定」に 出す 研修と 研究授業
  function kenkyuEvents(from, to) {
    const out = [];
    list('trainings').forEach((x) => { if (isDate(x.date) && x.date >= from && x.date <= to) out.push({ id: x.id, date: x.date, time: x.time || '', cat: x.trip ? '出張' : '研修', hue: 300, title: x.title, act: 'editTraining' }); });
    list('studies').forEach((s) => { if (isDate(s.date) && s.date >= from && s.date <= to) out.push({ id: s.id, date: s.date, time: s.time || '', cat: s.kind === VISIT ? '参観' : '研究授業', hue: 300, title: s.kind === VISIT ? `${s.teacher || ''} ${s.room || ''} ${s.subject || ''}`.trim() || '授業参観' : s.title || s.subject || '研究授業', act: 'editStudy' }); });
    return out;
  }

  function viewKenkyu() {
    if (!view.kenNendo) view.kenNendo = nendoOf(today());
    return subtabs('kenkyu', [['trainings', '🎓 研修の記録'], ['research', '🔬 校内研究・研究授業']]) +
      `<div class="toolbar">
        <button class="btn" data-act="kenNendo" data-n="-1">◀</button>
        <h2 class="wk-title">${wareki(view.kenNendo).replace('年', '年度')}</h2>
        <button class="btn" data-act="kenNendo" data-n="1">▶</button>
        ${view.kenNendo !== nendoOf(today()) ? '<button class="btn small" data-act="kenNendo" data-n="0">今年度</button>' : ''}
      </div>` +
      ({ trainings: viewTrainings, research: viewResearch })[view.tab.kenkyu]();
  }

  /* ---------- 研修の記録 ---------- */
  function trainingCard(x) {
    const t = today();
    const future = x.date > t;
    const left = isDate(x.reportDue) ? daysBetween(t, x.reportDue) : null;
    const added = (k) => list('tasks').some((v) => v.fromId === `${x.id}:${k}`);
    const rep = x.report === '提出ずみ' ? '<span class="tag">✓ 報告書 提出ずみ</span>'
      : x.report === 'あり' ? `<span class="tag${left !== null && left <= 7 ? ' red' : ''}">📝 報告書${left === null ? '' : left < 0 ? `：${-left}日 すぎ` : left ? `：あと${left}日` : '：きょうまで'}</span>` : '';
    return `<article class="card train">
      <div class="meta"><b style="color:var(--ink)">${jdate(x.date)}${x.time ? ' ' + esc(x.time) : ''}</b>${x.kind ? `<span class="tag">${esc(x.kind)}</span>` : ''}${x.trip ? '<span class="tag">🚗 出張</span>' : ''}${future ? '<span class="tag">これから</span>' : ''}${rep}</div>
      <div class="ken-title"><h3>${esc(x.title)}</h3><button class="btn small" data-act="editTraining" data-id="${esc(x.id)}">直す</button></div>
      <div class="meta">${x.org ? `<span>🏢 ${esc(x.org)}</span>` : ''}${x.place ? `<span>📍 ${esc(x.place)}</span>` : ''}${Number(x.hours) ? `<span>⏱ ${fmtHours(Number(x.hours))}時間</span>` : ''}${safeUrl(x.url) ? `<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">📎 資料 ↗</a>` : ''}</div>
      ${x.trip ? `<div class="mine"><b>🚗 補教</b><div>${subsSummary(x.date) ? esc(subsSummary(x.date)) : '<span class="muted">まだ 決めていません</span>'}</div>
        <div class="toolbar" style="margin:4px 0 0;justify-content:flex-end"><button class="btn small" data-act="editSubs" data-id="${esc(x.id)}" data-date="${esc(x.date)}">🚗 補教の 計画</button>
          ${subsOn(x.date).length ? `<button class="btn small" data-act="subsText" data-date="${esc(x.date)}">📋 補教の お願い</button>` : ''}
          ${future && !added('h') ? `<button class="btn small" data-act="trainToTask" data-id="${esc(x.id)}" data-k="h">＋ やることへ</button>` : added('h') ? '<span class="tag">✓ やることに入れました</span>' : ''}</div></div>` : ''}
      ${x.learned ? `<div class="mine"><b>💡 学んだこと</b><div>${nl(x.learned)}</div></div>` : ''}
      ${x.apply ? `<div class="mine"><b>🧩 学級で 生かすこと</b><div>${nl(x.apply)}</div>
        <div style="text-align:right;margin-top:4px">${added('a') ? '<span class="tag">✓ やることに入れました</span>' : `<button class="btn small" data-act="trainToTask" data-id="${esc(x.id)}" data-k="a">＋ やることへ</button>`}</div></div>` : ''}
      ${x.report === 'あり' ? `<div style="text-align:right;margin-top:8px">${added('r') ? '<span class="tag">✓ 報告書を やることに入れました</span>' : `<button class="btn small" data-act="trainToTask" data-id="${esc(x.id)}" data-k="r">＋ 報告書を やることへ</button>`}
        <button class="btn small" data-act="reportDone" data-id="${esc(x.id)}">✓ 提出した</button></div>` : ''}
    </article>`;
  }
  function viewTrainings() {
    const t = today();
    const all = trainingsOf(view.kenNendo).filter((x) => !view.trainKind || x.kind === view.trainKind);
    const coming = all.filter((x) => x.date > t).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
    const done = all.filter((x) => x.date <= t).sort(byDateDesc);
    const sum = {};
    trainingsOf(view.kenNendo).filter((x) => x.date <= t).forEach((x) => {
      const k = x.kind || 'その他';
      sum[k] = sum[k] || { n: 0, h: 0 };
      sum[k].n++; sum[k].h += Number(x.hours) || 0;
    });
    const kinds = TRAIN_KINDS.filter((k) => sum[k]).concat(Object.keys(sum).filter((k) => !TRAIN_KINDS.includes(k)));
    const total = kinds.reduce((a, k) => ({ n: a.n + sum[k].n, h: a.h + sum[k].h }), { n: 0, h: 0 });
    const due = reportsDue();
    return `<div class="grid2 ken-top">
        <section class="card">
          <div class="toolbar"><h2 class="sec">📊 受講した 研修（${total.n}件・${fmtHours(total.h)}時間）</h2><span class="grow"></span>
            <button class="btn small" data-act="trainText">📋 一覧の文</button></div>
          ${kinds.length ? `<table class="list"><tbody>${kinds.map((k) => `<tr><td>${esc(k)}</td><td style="text-align:right">${sum[k].n}件</td><td style="text-align:right">${fmtHours(sum[k].h)}時間</td></tr>`).join('')}</tbody></table>`
            : '<div class="empty-note">この年度に 受講した 研修は まだ ありません。</div>'}
          <p class="hint" style="margin-top:6px">管理職との 面談や、研修履歴の 確認に 使えます。正式な 受講履歴は、教育委員会の 決まった 方法で 記録してください。</p>
        </section>
        <section class="card">
          <div class="toolbar"><h2 class="sec">📝 まだの 報告書（${due.length}件）</h2></div>

  // 指導案の 中身（単元計画・週案・個別の指導計画の 目標・研究主題から 集める）
  function shidoanModel(s, anon) {
    const u = get('units', s.unitId);
    const r = researchOf(nendoOf(s.date));
    const subj = s.subject || (u ? u.subject : '');
    const kids = children();
    const letter = (k) => String.fromCharCode(0x41 + kids.findIndex((c) => c.id === k.id)) + '児';
    // 単元の 対象の 子（「全員」や 空なら 全員）
    const target = u && u.target && !/全員/.test(u.target) ? kids.filter((k) => String(u.target).includes(k.name)) : kids;
    const { term } = termNow(s.date);
    const n = nendoOf(s.date);
    // 指導計画（週案で この単元に した 時間から）
    const ws = u ? list('weekly').filter((w) => w.unitId === u.id && isDate(w.date)).sort((a, b) => a.date.localeCompare(b.date) || S.periods.findIndex((p) => p.id === String(a.period)) - S.periods.findIndex((p) => p.id === String(b.period))) : [];
    let honji = 0;
    const plan = ws.map((w, i) => {
      const isHonji = !honji && w.date === s.date;
      if (isHonji) honji = i + 1;
      return { n: i + 1, content: w.content ? String(w.content).replace(/\n/g, ' ') : '', honji: isHonji };
    });
    return {
      title: `${S.className || '　　学級'}　${subj || '　　'} 学習指導案`,
      subj,
      when: `${wareki(parse(s.date).getFullYear())}${jdate(s.date)}${s.time ? ' ' + s.time : ''}`,
      nKids: target.length,
      unitName: u ? u.name : '',
      unitGoal: u && u.goal ? u.goal : '',
      kids: target.map((k) => {
        const g = list('goals').find((x) => x.childId === k.id && Number(x.nendo) === n && (x.term === term || x.term === '年間') && (x.area === subj || String(x.area || '').includes(subj)));
        return { name: anon ? letter(k) : k.name, grade: k.grade || '', goal: g ? g.goal || '' : '', support: g ? g.support || '' : '' };
      }),
      total: u && Number(u.hours) ? Number(u.hours) : ws.length,
      plan,
      honji,
      lessonTitle: s.title || '',
      aim: s.aim || '',
      flow: String(s.flow || '').split('\n').map((x) => x.trim()).filter(Boolean).map((x) => {
        const p = x.split(/[｜|]/);
        return { act: p[0].trim(), note: p.slice(1).join('｜').trim() };
      }),
      theme: r && r.theme ? r.theme : '',
      sub: r && r.sub ? r.sub.replace(/\n/g, ' ') : '',
    };
  }
  // 文の 形（コピー用）
  function shidoanText(s, anon) {
    const m = shidoanModel(s, anon);
    const L = [];
    L.push(m.title, '');
    L.push(`日時：${m.when}`, `児童：${m.nKids}名`, '授業者：', '');
    L.push(`1　単元名　「${m.unitName || '　　'}」`, '');
    L.push('2　単元の目標', `　${m.unitGoal}`, '');
    L.push('3　単元について', '（1）児童の実態', '　', '（2）教材について', '　', '（3）指導について', '　', '');
    L.push('4　一人ひとりの 目標と 手立て');
    m.kids.forEach((k) => L.push(`・${k.name}${k.grade ? '（' + k.grade + '）' : ''}`, `　目標：${k.goal}`, `　手立て：${k.support}`));
    if (!m.kids.length) L.push('・（子どもが 登録されていません）');
    L.push('', `5　指導計画（全${m.total || '　'}時間）`);
    m.plan.forEach((p) => L.push(`　第${p.n}時　${p.content || '（　　）'}${p.honji ? '　…本時' : ''}`));
    if (!m.plan.length) L.push('　（週案で この単元の 時間に 内容を 入れると、ここに 並びます）');
    L.push('', `6　本時の学習${m.honji ? `（${m.honji}／${m.total}時間目）` : ''}`);
    L.push(`（1）本時の題　${m.lessonTitle}`);
    L.push('（2）本時の目標', `　${m.aim.replace(/\n/g, '\n　')}`);
    L.push('（3）展開');
    if (m.flow.length) {
      L.push('　学習活動　／　指導上の留意点・手立て');
      m.flow.forEach((f, i) => L.push(`　${i + 1}　${f.act}${f.note ? `　／　${f.note}` : ''}`));
    } else L.push('　');
    L.push('（4）評価', '　', '');
    if (m.theme) L.push('7　研究主題との かかわり', `　研究主題：${m.theme}${m.sub ? '　' + m.sub : ''}`, '　');
    return L.join('\n');
  }

  /* ---------- Word の ファイル（.docx）を 作る ---------- */
  const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const W_WIDTH = 9638; // A4 の 横幅から 左右 20mm を 引いた 幅（1/20 ポイント）
  // XML に 書けない 文字を 取りのぞき、記号を 置きかえる

  async function makeDocx(title, bodyXml) {
    const X = await loadXlsx(); // ZIP を 作る 道具（SheetJS の CFB）を 使う
    const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const PKG = 'http://schemas.openxmlformats.org/package/2006/relationships';
    const files = [
      ['[Content_Types].xml', `${XML_HEAD}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`],
      ['_rels/.rels', `${XML_HEAD}<Relationships xmlns="${PKG}"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`],
      ['docProps/core.xml', `${XML_HEAD}<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xmlEsc(title)}</dc:title><dc:creator>仮想職員室</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().replace(/\.\d+Z$/, 'Z')}</dcterms:created></cp:coreProperties>`],
      ['word/document.xml', docxDocument(bodyXml)],
      ['word/styles.xml', docxStyles()],
      ['word/_rels/document.xml.rels', `${XML_HEAD}<Relationships xmlns="${PKG}"><Relationship Id="rId1" Type="${REL}/styles" Target="styles.xml"/></Relationships>`],
    ];
    const zip = X.CFB.utils.cfb_new({ root: 'R' });
    const enc = new TextEncoder();
    files.forEach(([path, xml]) => X.CFB.utils.cfb_add(zip, path, enc.encode(xml)));
    const bytes = X.CFB.write(zip, { fileType: 'zip', type: 'array', compression: true });

  }

  /* ---------- 出張と 補教 ---------- */
  function prevSchoolDay(date) { let d = date; for (let i = 0; i < 60; i++) { d = addDays(d, -1); if (!offReason(d)) return d; } return addDays(date, -1); }
  function trainingsOn(date) { return list('trainings').filter((x) => x.date === date).sort((a, b) => String(a.time || '').localeCompare(String(b.time || ''))); }
  function periodName(pid) { const p = S.periods.find((q) => q.id === String(pid)); return p ? p.name : String(pid); }
  function subsSummary(date) { const ss = subsOn(date); return ss.length ? ss.map((x) => `${periodName(x.period)} ${x.teacher || '未定'}`).join('、') : ''; }
  // 研修の 時刻の 1時間前から あと（移動の 時間）を、学級を あける 時間と 考える
  function guessAway(x) {
    const toMin = (s) => { const k = String(s || '').match(/^(\d{1,2}):(\d{2})/); return k ? Number(k[1]) * 60 + Number(k[2]) : null; };
    const start = toMin(x.time);
    if (start === null) return S.periods.map((p) => p.id);
    return S.periods.filter((p) => { const e = toMin(p.end); return e === null || e > start - 60; }).map((p) => p.id);
  }

  // 補教の お願い（文と Word で 使う 中身）
  function subsModel(date, withCare) {

    if (e.target.dataset.form === 'quickTask') {

      if (!f.title.trim()) return;
