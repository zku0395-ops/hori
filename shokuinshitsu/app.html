<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仮想職員室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 色：銀の 壁と 青い 光（近未来の 職員室） */
    :root {
      --bg: #eef2f6; --card: #ffffff; --ink: #1b2533; --sub: #5a6878; --line: #d8e0e9; --soft: #e9eff5;
      --board: #1a2532; --board-2: #223246; --board-ink: #e8f3ff;
      --primary: #1d6fb8; --primary-ink: #ffffff; --danger: #b42318; --warn: #b45309;
      --glow: #3fb4ff; --glow-soft: rgba(63, 180, 255, .18);
      --sun: #c0392b; --sat: #1d4ed8; --today: #e3f2ff; --today-line: #2f9be3; --off: #e2e8ee;
      --shadow: 0 1px 2px rgba(20, 40, 70, .06), 0 6px 18px rgba(20, 40, 70, .06);
      --chip-l: 90%; --chip-s: 62%; --chip-tl: 27%; --chip-ts: 55%; --bar-l: 45%;
      /* ロビーの 絵 */
      --wall: #e7edf3; --wall-back: #f4f7fa; --ridge: rgba(110, 132, 158, .30); --ceil: #f6f8fb;
      --floor: #d2dae3; --floor-2: #bcc7d3; --tier-top: #ccd5df; --tier-top2: #e1e7ee; --tier-side: #7b8796;
      --chair: #2b3139; --chair-2: #434a54; --table: #ffffff; --table-2: #dfe6ee;
      --fixture: #d3dae3; --fixture-2: #a7b2bf; --beam: rgba(255, 255, 255, .75); --door: #ffffff; --person: #283240;
      --globe-core: rgba(18, 74, 150, .92); --globe-edge: rgba(63, 180, 255, .30); --scene-ink: #1b2533;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d131a; --card: #141c26; --ink: #e3ecf5; --sub: #96a6b8; --line: #263241; --soft: #1a2430;
        --board: #080d13; --board-2: #101924; --board-ink: #e3f1ff;
        --primary: #2373b8; --primary-ink: #ffffff; --danger: #f87171; --warn: #fbbf24;
        --glow: #5fd0ff; --glow-soft: rgba(95, 208, 255, .16);
        --sun: #f87171; --sat: #93c5fd; --today: #0f2637; --today-line: #3fb0f0; --off: #121a23;
        --shadow: none; --chip-l: 25%; --chip-s: 32%; --chip-tl: 86%; --chip-ts: 70%; --bar-l: 55%;
        --wall: #17202b; --wall-back: #1c2734; --ridge: rgba(120, 175, 225, .14); --ceil: #141c25;
        --floor: #111922; --floor-2: #0b1118; --tier-top: #233040; --tier-top2: #2b3a4b; --tier-side: #0b1016;
        --chair: #07090c; --chair-2: #1b222b; --table: #dce7f2; --table-2: #9fb0c2;
        --fixture: #2a3644; --fixture-2: #1b2531; --beam: rgba(110, 200, 255, .30); --door: #e6f6ff; --person: #070b10;
        --globe-core: rgba(14, 60, 125, .92); --globe-edge: rgba(95, 208, 255, .30); --scene-ink: #e3ecf5;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; font-size: 16px; line-height: 1.6; }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--today-line); outline-offset: 2px; }
    a { color: inherit; }
    .loading, .fatal { min-height: 70vh; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; color: var(--sub); font-size: 20px; text-align: center; padding: 16px; }

    /* 上の 帯 */
    .top { background: linear-gradient(90deg, var(--board), var(--board-2)); color: var(--board-ink); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo { font-size: 28px; line-height: 1; }
    .title { font-weight: 700; font-size: 20px; letter-spacing: .06em; }
    .cls { font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status { font-size: 13px; padding: 3px 12px; border-radius: 999px; background: rgba(255, 255, 255, .12); white-space: nowrap; }
    .status.error { background: #fde2e1; color: #8a1c13; cursor: pointer; }
    .rooms { display: flex; gap: 4px; overflow-x: auto; background: var(--board-2); padding: 6px 12px 0; scrollbar-width: thin; box-shadow: inset 0 1px 0 rgba(95, 208, 255, .25); }
    .room-tab { border: 0; background: transparent; color: var(--board-ink); padding: 8px 14px; border-radius: 10px 10px 0 0; cursor: pointer; white-space: nowrap; font-weight: 700; opacity: .85; }
    .room-tab:hover { background: rgba(255, 255, 255, .1); opacity: 1; }
    .room-tab.on { background: var(--bg); color: var(--ink); opacity: 1; box-shadow: inset 0 3px 0 var(--glow); }
    .room-tab small { font-size: 11px; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: rgba(255, 255, 255, .18); font-weight: 400; }
    .room-tab.on small { background: var(--soft); }
    .demo-banner { background: #fff7e0; color: #7a4b00; border-bottom: 1px solid #f0d58c; padding: 8px 16px; font-size: 14px; }
    @media (prefers-color-scheme: dark) { .demo-banner { background: #3a3018; color: #f6d98a; border-color: #5a4a20; } }
    main { max-width: 1240px; margin: 0 auto; padding: 16px; }

    /* 共通の 部品 */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
    @media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
    h1, h2, h3 { line-height: 1.35; }
    h2.sec { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .btn { border: 1px solid var(--line); background: var(--card); padding: 6px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn:hover { background: var(--soft); border-color: var(--glow); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.danger { color: var(--danger); border-color: currentColor; }
    .btn.small { padding: 2px 10px; font-size: 14px; }
    .btn.link { border: 0; background: transparent; color: var(--primary); padding: 2px 4px; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .grow { flex: 1; }
    .hint { color: var(--sub); font-size: 14px; margin: 0; }
    .muted { color: var(--sub); }
    .empty-note { color: var(--sub); padding: 12px; text-align: center; border: 2px dashed var(--line); border-radius: 12px; }
    .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 16px; }
    .subtab { border: 1px solid var(--line); background: var(--card); padding: 6px 16px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--sub); }
    .subtab.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
    .chip { display: inline-block; padding: 0 .6em; border-radius: 999px; font-weight: 700; font-size: 14px; line-height: 1.7; background: hsl(var(--h) var(--chip-s) var(--chip-l)); color: hsl(var(--h) var(--chip-ts) var(--chip-tl)); white-space: nowrap; }
    .chip.gray { background: var(--soft); color: var(--sub); }
    .tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--sub); white-space: nowrap; }
    .tag.red { color: var(--danger); border-color: currentColor; font-weight: 700; }
    .out { display: inline-flex; align-items: baseline; gap: 2px; font-size: 12px; padding: 0 6px; border-radius: 6px; background: var(--soft); border: 1px dashed var(--sub); white-space: nowrap; }
    .out small { font-size: 11px; color: var(--sub); }
    .outs { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .field { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 14px; }
    .field input, .field select, .field textarea, .input { font-weight: 400; font-size: 16px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); width: 100%; }
    .field textarea { resize: vertical; line-height: 1.6; }
    .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    @media (max-width: 520px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
    .info { background: var(--soft); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    table.list { border-collapse: collapse; width: 100%; }
    table.list th, table.list td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    table.list th { background: var(--soft); font-size: 14px; white-space: nowrap; }
    table.list tr:last-child td { border-bottom: 0; }

    /* ロビー：円卓の間 */
    .scene { position: relative; aspect-ratio: 2 / 1; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: 16px; container-type: inline-size; background: var(--wall); }
    .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .scene .chair-hit { cursor: pointer; }
    .greet { position: absolute; left: 2.5%; top: 5%; color: var(--scene-ink); line-height: 1.4; }
    .greet b { display: block; font-size: clamp(15px, 2.1cqw, 26px); letter-spacing: .04em; }
    .greet span { font-size: clamp(11px, 1.25cqw, 15px); color: var(--sub); }
    .holo { position: absolute; transform: translate(-50%, -50%); width: 28cqw; text-align: center; color: #fff; pointer-events: none; text-shadow: 0 0 10px var(--glow), 0 0 2px rgba(0, 30, 70, .9); line-height: 1.2; }
    .holo .clock { font-size: clamp(16px, 3.8cqw, 46px); font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    .holo .hdate { font-size: clamp(9px, 1.45cqw, 18px); white-space: nowrap; }
    .holo .hline { font-size: clamp(9px, 1.2cqw, 15px); margin-top: .2em; }
    .holo .hdead { color: #ffe08a; font-weight: 700; margin-top: .3em; white-space: nowrap; }
    .holo .hsmall { font-size: clamp(8px, 1.05cqw, 13px); margin-top: .1em; opacity: .92; }
    .seat-label { position: absolute; border: 1px solid rgba(63, 180, 255, .65); background: rgba(255, 255, 255, .82); color: #10243a; border-radius: 999px; padding: .28em .9em; font-weight: 700; font-size: clamp(11px, 1.3cqw, 16px); white-space: nowrap; cursor: pointer; box-shadow: 0 0 0 3px var(--glow-soft), 0 4px 14px rgba(20, 60, 110, .18); backdrop-filter: blur(6px); transition: transform .15s, box-shadow .15s; }
    .seat-label.up { transform: translate(-50%, -100%); }
    .seat-label.down { transform: translate(-50%, 0); }
    .seat-label:hover, .seat-label:focus-visible { box-shadow: 0 0 0 4px rgba(63, 180, 255, .45), 0 0 22px rgba(63, 180, 255, .6); }
    .seat-label.up:hover { transform: translate(-50%, -100%) scale(1.06); }
    .seat-label.down:hover { transform: translate(-50%, 0) scale(1.06); }
    .seat-label.soon { border-style: dashed; color: #4b5b6d; background: rgba(255, 255, 255, .62); }
    .seat-label small { font-weight: 400; font-size: .78em; margin-left: .3em; }
    .seat-label.talk, .seat-label:hover, .seat-label:focus-visible { z-index: 3; }
    .bubble { position: absolute; top: 50%; width: max-content; max-width: min(24cqw, 300px); padding: .5em .85em; border-radius: 14px; background: #ffffff; color: #1b2533; font-weight: 400; font-size: clamp(11px, 1.15cqw, 14px); line-height: 1.55; white-space: normal; text-align: left; box-shadow: 0 6px 20px rgba(20, 60, 110, .22), 0 0 0 2px rgba(63, 180, 255, .55); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
    .bubble b { display: block; color: #1d6fb8; font-size: .92em; }
    .bubble::after { content: ''; position: absolute; top: 50%; margin-top: -7px; border: 7px solid transparent; }
    .seat-label.bl .bubble { right: calc(100% + 12px); transform: translate(8px, -50%); }
    .seat-label.bl .bubble::after { left: 100%; border-left-color: #ffffff; }
    .seat-label.br .bubble { left: calc(100% + 12px); transform: translate(-8px, -50%); }
    .seat-label.br .bubble::after { right: 100%; border-right-color: #ffffff; }
    .seat-label.talk .bubble, .seat-label:hover .bubble, .seat-label:focus-visible .bubble { opacity: 1; transform: translate(0, -50%); }
    .scene:has(.seat-label[data-seat]:hover) .seat-label.talk:not(:hover) .bubble { opacity: 0; }
    .char { animation: bobChar 3.6s ease-in-out infinite; }
    .char.talk { animation: hopChar .45s ease-in-out 2, bobChar 3.6s .9s ease-in-out infinite; }
    @keyframes bobChar { 50% { transform: translateY(-5px); } }
    @keyframes hopChar { 50% { transform: translateY(-16px); } }
    .char .blink { animation: blinkEye 5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blinkEye { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .seat-label.door-label { background: rgba(16, 36, 58, .82); color: #e8f6ff; border-color: rgba(255, 255, 255, .7); }
    @media (prefers-color-scheme: dark) {
      .seat-label { background: rgba(14, 26, 40, .78); color: #e3f2ff; }
      .seat-label.soon { background: rgba(14, 26, 40, .55); color: #9fb3c8; }
    }
    @container (max-width: 640px) { .seat-label, .greet span, .holo .hline:not(.hdead) { display: none; } }
    .globe-mer ellipse { transform-box: fill-box; transform-origin: center; animation: mer 9s linear infinite; }
    @keyframes mer { 0% { transform: scaleX(1); } 25% { transform: scaleX(.03); } 50% { transform: scaleX(1); } 75% { transform: scaleX(.03); } 100% { transform: scaleX(1); } }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .55; } }
    .scene.enter svg { animation: sceneIn 1s ease both; }
    .scene.enter .seat-label, .scene.enter .holo, .scene.enter .greet { animation: labelIn .9s .5s ease both; }
    @keyframes sceneIn { from { opacity: 0; transform: scale(1.04); } }
    @keyframes labelIn { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .char, .char.talk, .char .blink, .globe-mer ellipse, .pulse, .scene.enter svg, .scene.enter .seat-label, .scene.enter .holo, .scene.enter .greet { animation: none; } }
    .mini { font-size: 15px; margin: 4px 0 0; }
    .day-list { list-style: none; margin: 0; padding: 0; }
    .day-list li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .day-list li:last-child { border-bottom: 0; }
    .day-list .pname { font-weight: 700; }
    .day-list .ptime { display: block; font-size: 12px; color: var(--sub); font-weight: 400; }
    .day-list .what { min-width: 0; }
    .day-list .what .content { font-size: 14px; color: var(--sub); }
    .ev-list { list-style: none; margin: 0; padding: 0; }
    .ev-list li { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .ev-list li:last-child { border-bottom: 0; }
    .ev-list .when { font-weight: 700; min-width: 7.5em; }
    .ev-list .ev-title { cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    .doors { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .door { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px; cursor: pointer; box-shadow: var(--shadow); }
    .door:hover { border-color: var(--glow); box-shadow: 0 0 0 3px var(--glow-soft); }
    .door .icon { font-size: 30px; }
    .door b { display: block; font-size: 17px; margin-top: 4px; }
    .door span { font-size: 13px; color: var(--sub); }
    .door.soon { opacity: .7; border-style: dashed; box-shadow: none; }

    /* 週案・時間割の 表 */
    .wk-title { font-size: 18px; margin: 0 8px; }
    table.week { border-collapse: collapse; width: 100%; min-width: 880px; table-layout: fixed; }
    .week th, .week td { border: 1px solid var(--line); vertical-align: top; padding: 6px; }
    .week thead th { background: var(--soft); font-weight: 700; text-align: left; font-size: 14px; }
    .week th.pcol { width: 82px; background: var(--soft); text-align: center; vertical-align: middle; font-size: 14px; }
    .week .ptime { display: block; font-size: 11px; color: var(--sub); font-weight: 400; }
    .week td.cell { cursor: pointer; height: 88px; }
    .week td.cell:hover { background: var(--soft); }
    .week td.cell .empty { color: var(--line); font-size: 20px; }
    .week td.cell.edited { box-shadow: inset 3px 0 0 var(--primary); }
    .week .is-today { background: var(--today); }
    .week thead th.is-today { box-shadow: inset 0 -3px 0 var(--today-line); }
    .week td.offday { background: var(--off); color: var(--sub); text-align: center; vertical-align: middle; font-weight: 700; }
    .week .unit { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .week .content { font-size: 13px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .week .note { font-size: 12px; color: var(--sub); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .dh { white-space: nowrap; }
    .todaymark { font-size: 11px; background: var(--today-line); color: #fff; border-radius: 999px; padding: 0 6px; margin-left: 4px; }
    .hol-name { font-size: 12px; color: var(--sun); font-weight: 700; }
    .add-ev { border: 0; background: transparent; color: var(--sub); font-size: 12px; cursor: pointer; padding: 0; margin-top: 2px; }
    .add-ev:hover { color: var(--primary); text-decoration: underline; }
    .ttcell select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font-weight: 700; background: hsl(var(--h) var(--chip-s) var(--chip-l)); color: hsl(var(--h) var(--chip-ts) var(--chip-tl)); }
    .ttcell select.gray { background: var(--bg); color: var(--sub); }
    .ttcell input { width: 100%; margin-top: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; font-size: 13px; background: var(--bg); }
    .stay { font-size: 12px; color: var(--sub); margin-top: 4px; }
    .xcell { cursor: pointer; }
    .xcell:hover { background: var(--soft); }
    .xcell .base { font-size: 12px; color: var(--sub); }
    .xcell.on { background: hsl(180 50% 92%); }
    @media (prefers-color-scheme: dark) { .xcell.on { background: hsl(180 30% 20%); } }
    .xcell .xlabel { font-weight: 700; font-size: 14px; }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-weight: 700; }
    .pill.on { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
    .hours { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    /* 月の 予定 */
    .month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--line); border-top: 1px solid var(--line); background: var(--card); border-radius: 14px; overflow: hidden; }
    .month .wd { padding: 4px; font-weight: 700; text-align: center; background: var(--soft); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 14px; }
    .month .wd.sun { color: var(--sun); } .month .wd.sat { color: var(--sat); }
    .mday { min-height: 104px; padding: 4px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .mday:hover { background: var(--soft); }
    .mday.other { background: var(--off); }
    .mday.other .num { opacity: .5; }
    .mday .num { font-weight: 700; font-size: 14px; }
    .mday.sun .num, .mday.hol .num { color: var(--sun); }
    .mday.sat .num { color: var(--sat); }
    .mday.today { background: var(--today); box-shadow: inset 0 0 0 2px var(--today-line); }
    .mday.kyugyo { background: var(--off); }
    .ev { display: block; width: 100%; text-align: left; border: 0; border-left: 4px solid hsl(var(--h) 60% var(--bar-l)); background: hsl(var(--h) var(--chip-s) var(--chip-l)); color: hsl(var(--h) var(--chip-ts) var(--chip-tl)); font-size: 12px; line-height: 1.5; padding: 1px 5px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .ev.gray { background: var(--soft); color: var(--sub); border-left-color: var(--sub); }
    @media (max-width: 640px) { .mday { min-height: 70px; padding: 2px; } .ev { font-size: 10px; padding: 0 2px; border-left-width: 2px; } }

    /* 学習の 部屋 */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .unit-card { cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
    .unit-card:hover, .mat:hover { border-color: var(--glow); box-shadow: 0 0 0 3px var(--glow-soft); }
    .unit-card h3, .mat h3 { margin: 0; font-size: 17px; }
    .meta { font-size: 13px; color: var(--sub); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .bar { height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; display: flex; }
    .bar i { display: block; height: 100%; background: var(--primary); }
    .bar i.plan { background: hsl(150 30% 70%); }
    @media (prefers-color-scheme: dark) { .bar i.plan { background: hsl(150 20% 35%); } }
    .goal { margin: 0; font-size: 14px; }
    .group-title { font-size: 15px; color: var(--sub); margin: 18px 0 8px; }
    .mat { display: grid; grid-template-columns: 44px minmax(0, 1fr); grid-template-rows: 1fr auto; gap: 10px; }
    .mat-icon { font-size: 30px; line-height: 1; }
    .mat p { margin: 4px 0 0; font-size: 14px; color: var(--sub); }
    .mat-act { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
    .date-chips { display: flex; flex-wrap: wrap; gap: 4px; }

    /* 公務の部屋 */
    .tasks { list-style: none; margin: 0; padding: 0; }
    .task { display: flex; gap: 10px; align-items: flex-start; padding: 8px 2px; border-bottom: 1px solid var(--line); }
    .task:last-child { border-bottom: 0; }
    .tcheck { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--primary); flex: none; cursor: pointer; }
    .tcheck-ph { width: 22px; text-align: center; flex: none; }
    .tmain { min-width: 0; flex: 1; }
    .ttitle { font-weight: 700; cursor: pointer; }
    .ttitle:hover { text-decoration: underline; text-decoration-color: var(--glow); text-underline-offset: 3px; }
    .task.done .ttitle { text-decoration: line-through; color: var(--sub); font-weight: 400; }
    .task-group.late { border-color: var(--danger); }
    .task-group.late .group-title { color: var(--danger); }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick input[name=title] { flex: 1 1 260px; width: auto; }
    .check { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; }
    .check input { width: 20px; height: 20px; accent-color: var(--primary); }
    .mrow { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; padding: 6px 4px; border-bottom: 1px dashed var(--line); }
    .mrow:last-child { border-bottom: 0; }
    .mrow.now { background: var(--today); border-radius: 8px; }
    .mrow b { text-align: center; }
    .mrow ul { margin: 0; padding-left: 1.1em; }
    .meet .mcontent { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
    .mine { background: var(--soft); border-radius: 10px; padding: 8px 12px; margin-top: 10px; }
    .mine .task { align-items: center; }
    .tpl { display: flex; flex-direction: column; gap: 6px; }
    .tpl pre { white-space: pre-wrap; font-family: inherit; font-size: 13px; color: var(--sub); margin: 0; flex: 1; max-height: 9.6em; overflow: hidden; }
    #draftText { font-size: 15px; line-height: 1.7; resize: vertical; }
    .holo .hdead.late { color: #ffb4a8; }

    /* 設定 */
    .ptable input { width: 100%; }
    .ptable td { padding: 4px 6px; }

    /* 準備中の 部屋 */
    .soon-room { text-align: center; max-width: 640px; margin: 24px auto; }
    .soon-room .big { font-size: 64px; }
    .soon-room ul { text-align: left; display: inline-block; margin: 8px auto 16px; }
    .soon-room li { margin: 6px 0; }

    /* ダイアログ */
    dialog { border: 0; border-radius: 16px; padding: 0; width: min(580px, calc(100vw - 32px)); background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
    dialog::backdrop { background: rgba(20, 25, 20, .45); }
    dialog header { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--line); gap: 12px; }
    dialog h2 { margin: 0; font-size: 18px; }
    .dlg-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; max-height: min(65vh, 640px); overflow: auto; }
    dialog footer { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .x { border: 0; background: transparent; font-size: 20px; cursor: pointer; color: var(--sub); }

    .print-only { display: none; }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: #fff; color: #000; font-size: 11px; }
      .top, .rooms, .demo-banner, .subtabs, .noprint { display: none !important; }
      .print-only { display: block; }
      main { max-width: none; padding: 0; }
      .table-wrap { overflow: visible; border: 0; }
      table.week { min-width: 0; }
      .week td.cell { height: auto; }
      .week .content, .week .note { display: block; -webkit-line-clamp: unset; overflow: visible; }
      .card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div id="app"><div class="loading">🏫<div>職員室の かぎを あけています…</div></div></div>
  <dialog id="dlg"></dialog>

  <script>
  'use strict';

  /* =========================================================
     決まりごと
     ========================================================= */
  const KINDS = ['events', 'timetable', 'weekly', 'children', 'exchange', 'units', 'materials', 'tasks', 'duties', 'dutyItems', 'meetings', 'templates'];
  const DAYS = [1, 2, 3, 4, 5]; // 月〜金
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const KYUGYO = '休業日';
  // 予定の 種類と 色（色相）。-1 は 灰色
  const CATS = { '行事': 28, '会議': 212, '出張': 268, '締め切り': 0, '保護者': 145, '交流': 180, [KYUGYO]: -1, 'その他': 48 };
  const MAT_KINDS = { 'プリント': '📄', 'スライド': '🖼️', '動画': '🎬', 'アプリ': '📱', '絵本・本': '📚', '絵カード・写真': '🃏', '教具・具体物': '🧩', 'その他': '📎' };
  const NONE = 'なし';
  const GRADES = ['1年', '2年', '3年', '4年', '5年', '6年'];
  const ONDOKU_URL = 'https://zku0395-ops.github.io/hori/';
  const DEFAULT_SETTINGS = {
    className: '',
    periods: [
      { id: '1', name: '1校時', start: '08:45', end: '09:30' },
      { id: '2', name: '2校時', start: '09:35', end: '10:20' },
      { id: '3', name: '3校時', start: '10:40', end: '11:25' },
      { id: '4', name: '4校時', start: '11:30', end: '12:15' },
      { id: '5', name: '5校時', start: '13:35', end: '14:20' },
      { id: '6', name: '6校時', start: '14:25', end: '15:10' },
    ],
    subjects: ['国語', '算数', '生活', '社会', '理科', '音楽', '図工', '体育', '外国語活動', '道徳', '学級活動', '総合', '自立活動', '日常生活の指導', '生活単元学習', '遊びの指導'],
  };
  const ROOMS = [
    { id: 'lobby', icon: '🏠', name: 'ロビー' },
    { id: 'yotei', icon: '📅', name: '予定の部屋', desc: '週案・月の予定・時間割・交流学級' },
    { id: 'gakushu', icon: '📚', name: '学習の部屋', desc: '単元計画・教材の置き場' },
    { id: 'koumu', icon: '📝', name: '公務の部屋', desc: 'やること・校務分掌・会議メモ・文書のひな形' },
    { id: 'kodomo', icon: '🧒', name: '子どもの部屋', soon: true, desc: '個別の指導計画・日々の記録',
      ideas: ['個別の教育支援計画・個別の指導計画（目標と、見直しの時期）', '日々の様子の短いメモ（積み上げて所見や評価に使う）', '保護者との連絡の記録'] },
    { id: 'renkei', icon: '🤝', name: '連携の部屋', soon: true, desc: '交流学級・支援員・関係機関',
      ideas: ['交流学級の担任への申し送り', '支援員さんと共有する1日の動き', '関係機関（放課後等デイサービス・医療など）の連絡先と連絡の記録'] },
    { id: 'settings', icon: '⚙️', name: '設定' },
  ];

  /* =========================================================
     日付の 道具（日付は いつも 'yyyy-mm-dd' の 文字で あつかう）
     ========================================================= */
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function today() { return ymd(new Date()); }
  function dayOf(s) { return parse(s).getDay(); }
  function mondayOf(s) { return addDays(s, -((dayOf(s) + 6) % 7)); }
  function md(s) { const d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
  function jdate(s) { const d = parse(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）'; }
  function wareki(y) { return y >= 2019 ? '令和' + (y === 2019 ? '元' : y - 2018) + '年' : y + '年'; }
  function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }
  function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }

  // 国民の祝日（振替休日・国民の休日を ふくむ）
  const holidayCache = {};
  function holidaysOf(y) {
    if (holidayCache[y]) return holidayCache[y];
    const h = {};
    const set = (m, d, name) => { h[y + '-' + pad(m) + '-' + pad(d)] = name; };
    const nthMonday = (m, n) => 1 + ((8 - new Date(y, m - 1, 1).getDay()) % 7) + (n - 1) * 7;
    const k = y - 1980;
    set(1, 1, '元日');
    set(1, nthMonday(1, 2), '成人の日');
    set(2, 11, '建国記念の日');
    set(2, 23, '天皇誕生日');
    set(3, Math.floor(20.8431 + 0.242194 * k - Math.floor(k / 4)), '春分の日');
    set(4, 29, '昭和の日');
    set(5, 3, '憲法記念日');
    set(5, 4, 'みどりの日');
    set(5, 5, 'こどもの日');
    set(7, nthMonday(7, 3), '海の日');
    set(8, 11, '山の日');
    set(9, nthMonday(9, 3), '敬老の日');
    set(9, Math.floor(23.2488 + 0.242194 * k - Math.floor(k / 4)), '秋分の日');
    set(10, nthMonday(10, 2), 'スポーツの日');
    set(11, 3, '文化の日');
    set(11, 23, '勤労感謝の日');
    const base = Object.keys(h);
    base.forEach((s) => {
      // 祝日に はさまれた日は 国民の休日
      const mid = addDays(s, 1);
      if (!h[mid] && h[addDays(s, 2)] && base.includes(addDays(s, 2))) h[mid] = '国民の休日';
    });
    base.forEach((s) => {
      // 日曜日の 祝日の あとの 最初の 平日は 振替休日
      if (dayOf(s) !== 0) return;
      let d = addDays(s, 1);
      while (h[d]) d = addDays(d, 1);
      h[d] = '振替休日';
    });
    holidayCache[y] = h;
    return h;
  }
  function holiday(s) { return holidaysOf(parse(s).getFullYear())[s] || ''; }

  /* =========================================================
     データの 置き場所（Apps Script の 中なら スプレッドシート、外なら この端末）
     ========================================================= */
  const IN_GAS = typeof google !== 'undefined' && !!(google.script && google.script.run);

  function gasCall(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }

  const api = IN_GAS ? {
    load: async () => JSON.parse(await gasCall('apiGetAll')),
    put: (kind, recs) => gasCall('apiPut', kind, JSON.stringify(recs)),
    remove: (kind, ids) => gasCall('apiRemove', kind, JSON.stringify(ids)),
    saveSettings: (s) => gasCall('apiSaveSettings', JSON.stringify(s)),
  } : localApi();

  // 試作モード：この端末の ブラウザに だけ 保存する
  function localApi() {
    const KEY = 'kasou-shokuinshitsu-demo-v1';
    let mem = null;
    const read = () => { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : mem; } catch (e) { return mem; } };
    const write = (d) => { mem = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* 保存できない ときは この画面の あいだだけ 覚える */ } };
    const data = () => { let d = read(); if (!d) { d = sampleData(); write(d); } d.tables = d.tables || {}; d.settings = d.settings || {}; return d; };
    return {
      load: async () => data(),
      put: async (kind, recs) => {
        const d = data();
        const arr = d.tables[kind] || (d.tables[kind] = []);
        recs.forEach((r) => { const i = arr.findIndex((x) => x.id === r.id); if (i >= 0) arr[i] = Object.assign({}, arr[i], r); else arr.push(r); });
        write(d);
      },
      remove: async (kind, ids) => { const d = data(); d.tables[kind] = (d.tables[kind] || []).filter((r) => !ids.includes(r.id)); write(d); },
      saveSettings: async (s) => { const d = data(); Object.assign(d.settings, s); write(d); },
      reset: (withSample) => write(withSample ? sampleData() : { settings: {}, tables: {} }),
    };
  }

  /* =========================================================
     画面の 状態と データ
     ========================================================= */
  let S = null;                 // 設定
  const T = {};                 // 種類ごとの Map（id → 記録）
  const meta = { sheetUrl: '' };
  const view = {
    room: 'lobby',
    tab: { yotei: 'week', gakushu: 'units', koumu: 'tasks' },
    week: mondayOf(today()),
    month: today().slice(0, 7),
    childId: '',
    unitSubj: '',
    matSubj: '', matKind: '', matQ: '',
    taskCat: '', taskDuty: '', showDone: false,
    meetQ: '', meetKind: '',
    periodsDraft: null,
  };

  function list(kind) { return Array.from(T[kind].values()); }
  function get(kind, id) { return id ? T[kind].get(id) : undefined; }
  function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function nl(s) { return esc(s).replace(/\n/g, '<br>'); }
  function opt(value, selected, label) { return `<option value="${esc(value)}"${value === selected ? ' selected' : ''}>${esc(label === undefined ? value : label)}</option>`; }
  function safeUrl(u) { return /^https?:\/\/\S+$/i.test(String(u || '').trim()) ? String(u).trim() : ''; }

  /* ---------- 保存（画面は すぐ 変え、保存は 順番に 送る） ---------- */
  let queue = Promise.resolve();
  let pending = 0;
  let lastError = null;
  function persist(task) {
    pending++;
    setStatus();
    queue = queue.then(task).then(
      () => { pending--; setStatus(); },
      (err) => { pending--; lastError = err; setStatus(); console.error(err); }
    );
  }
  function putRecs(kind, recs, opt) {
    const full = [].concat(recs).map((r) => Object.assign({}, get(kind, r.id) || {}, r));
    full.forEach((r) => T[kind].set(r.id, r));
    if (!opt || opt.render !== false) render();
    persist(() => api.put(kind, full));
  }
  function removeRecs(kind, ids, opt) {
    ids = [].concat(ids).filter((id) => T[kind].has(id));
    if (!ids.length) return;
    ids.forEach((id) => T[kind].delete(id));
    if (!opt || opt.render !== false) render();
    persist(() => api.remove(kind, ids));
  }
  function saveSettings(patch) {
    Object.assign(S, patch);
    render();
    persist(() => api.saveSettings(patch));
  }
  function setStatus() {
    const el = document.getElementById('status');
    if (!el) return;
    el.className = 'status' + (lastError ? ' error' : '');
    if (lastError) {
      el.textContent = '⚠ 保存できなかった変更があります（押すと読み込み直します）';
      el.dataset.act = 'reload';
    } else {
      el.textContent = pending ? '保存しています…' : '✓ 保存ずみ';
      delete el.dataset.act;
    }
  }

  /* ---------- 設定 ---------- */
  function mergeSettings(s) {
    s = s || {};
    const out = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    if (typeof s.className === 'string') out.className = s.className;
    if (Array.isArray(s.periods) && s.periods.length) {
      out.periods = s.periods.filter((p) => p && p.id).map((p) => ({ id: String(p.id), name: String(p.name || ''), start: String(p.start || ''), end: String(p.end || '') }));
    }
    if (Array.isArray(s.subjects) && s.subjects.length) out.subjects = s.subjects.map(String).filter(Boolean);
    return out;
  }

  /* ---------- 時間割・週案の 読み方 ---------- */
  const ttId = (day, pid) => `t${day}-${pid}`;
  const wkId = (date, pid) => `w${date}-${pid}`;
  const xId = (cid, day, pid) => `x${cid}-${day}-${pid}`;

  function hueOf(subject) {
    const i = S.subjects.indexOf(subject);
    return i < 0 ? -1 : Math.round((i * 137.508 + 15) % 360);
  }
  function chip(subject) {
    if (!subject) return '';
    const h = hueOf(subject);
    return `<span class="chip${h < 0 ? ' gray' : ''}" style="--h:${Math.max(h, 0)}">${esc(subject)}</span>`;
  }
  function subjOptions(selected, firstLabel) {
    const subs = S.subjects.slice();
    if (selected && selected !== NONE && !subs.includes(selected)) subs.push(selected);
    return (firstLabel !== undefined ? opt('', selected || '', firstLabel) : '') + subs.map((s) => opt(s, selected)).join('');
  }
  function baseLesson(day, pid) { return get('timetable', ttId(day, pid)); }
  function lesson(date, pid) {
    const w = get('weekly', wkId(date, pid));
    const base = baseLesson(dayOf(date), pid);
    let subject = w && w.subject ? w.subject : (base ? base.subject : '');
    if (subject === NONE) subject = '';
    const unit = w && w.unitId ? get('units', w.unitId) : null;
    return { w, base, subject, unit, content: w ? w.content : '', note: w ? w.note : '' };
  }
  function children() {
    return list('children').sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0) || String(a.name).localeCompare(String(b.name), 'ja'));
  }
  function childOrder(id) { return children().findIndex((c) => c.id === id); }
  function outsAt(day, pid) {
    return list('exchange')
      .filter((x) => Number(x.day) === day && String(x.period) === pid && get('children', x.childId))
      .map((x) => ({ x, child: get('children', x.childId) }))
      .sort((a, b) => childOrder(a.child.id) - childOrder(b.child.id));
  }
  function outChip(o) {
    const room = o.x.room || o.child.homeroom || '交流';
    return `<span class="out" title="${esc(o.child.name)}：${esc(room)} ${esc(o.x.subject || '')}">🚶${esc(o.child.name)}<small>→${esc(room)}${o.x.subject ? ' ' + esc(o.x.subject) : ''}</small></span>`;
  }
  function eventsOn(date) {
    return list('events')
      .filter((e) => isDate(e.date) && e.date <= date && date <= (isDate(e.end) && e.end > e.date ? e.end : e.date))
      .sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
  }
  function offReason(date) {
    const d = dayOf(date);
    if (d === 0) return '日曜日';
    if (d === 6) return '土曜日';
    const h = holiday(date);
    if (h) return h;
    const k = eventsOn(date).find((e) => e.cat === KYUGYO);
    return k ? (k.title || KYUGYO) : '';
  }
  function nextSchoolDay(date) {
    let d = date;
    for (let i = 0; i < 120; i++) { d = addDays(d, 1); if (!offReason(d)) return d; }
    return addDays(date, 1);
  }
  function catHue(cat) { return Object.prototype.hasOwnProperty.call(CATS, cat) ? CATS[cat] : CATS['その他']; }
  function evChip(e) {
    const h = catHue(e.cat);
    return `<button class="ev${h < 0 ? ' gray' : ''}" style="--h:${Math.max(h, 0)}" data-act="editEvent" data-id="${esc(e.id)}" title="${esc((e.time ? e.time + ' ' : '') + e.title)}">${e.time ? esc(e.time) + ' ' : ''}${esc(e.title)}</button>`;
  }

  /* ---------- 単元 ---------- */
  function unitStats(u) {
    const t = today();
    let done = 0, plan = 0;
    const dates = [];
    list('weekly').forEach((w) => {
      if (w.unitId !== u.id || !isDate(w.date)) return;
      dates.push(w.date);
      if (w.date <= t) done++; else plan++;
    });
    return { done, plan, dates: dates.sort() };
  }
  function unitPhase(u) {
    const t = today();
    if (isDate(u.end) && u.end < t) return 'done';
    if (isDate(u.start) && u.start <= t) return 'now';
    if (!isDate(u.start) && isDate(u.end)) return 'now';
    return 'next';
  }
  function unitInRange(u, date) { return (!isDate(u.start) || u.start <= date) && (!isDate(u.end) || date <= u.end); }
  function autoUnit(subject, date) {
    const c = list('units').filter((u) => u.subject === subject && (isDate(u.start) || isDate(u.end)) && unitInRange(u, date));
    return c.length === 1 ? c[0].id : '';
  }
  function unitRange(u) {
    if (!isDate(u.start) && !isDate(u.end)) return '期間 未設定';
    return (isDate(u.start) ? md(u.start) : '') + '〜' + (isDate(u.end) ? md(u.end) : '');
  }
  function unitOptions(subject, date, selected) {
    const us = list('units').filter((u) => !subject || u.subject === subject || u.id === selected);
    us.sort((a, b) => Number(unitInRange(b, date)) - Number(unitInRange(a, date)) || String(a.start).localeCompare(String(b.start)));
    return opt('', selected, '（単元を選ばない）') + us.map((u) => opt(u.id, selected, u.name + (unitInRange(u, date) ? '' : '（期間外）'))).join('');
  }

  /* =========================================================
     画面を 描く
     ========================================================= */
  function render() {
    const y = window.scrollY;
    document.getElementById('app').innerHTML = viewHeader() + `<main>${viewBody()}</main>`;
    setStatus();
    window.scrollTo(0, y);
  }

  function viewHeader() {
    return `<header class="top">
        <div class="brand"><span class="logo">🏫</span><div style="min-width:0"><div class="title">仮想職員室</div><div class="cls">${esc(S.className || '学級名は「設定」で入れられます')}</div></div></div>
        <div id="status" class="status"></div>
      </header>
      <nav class="rooms" aria-label="部屋">${ROOMS.map((r) => `<button class="room-tab${view.room === r.id ? ' on' : ''}" data-act="go" data-room="${r.id}">${r.icon} ${esc(r.name)}${r.soon ? '<small>準備中</small>' : ''}</button>`).join('')}</nav>
      ${IN_GAS ? '' : '<div class="demo-banner">🧪 試作モード：Apps Script の外で開いているため、データはこの端末のブラウザにだけ保存されます。子どもの本当の情報は入れないでください。</div>'}`;
  }

  function viewBody() {
    const room = ROOMS.find((r) => r.id === view.room) || ROOMS[0];
    if (room.soon) return viewSoon(room);
    switch (room.id) {
      case 'yotei': return subtabs('yotei', [['week', '📝 週案'], ['month', '🗓 月の予定'], ['timetable', '🕘 基本の時間割'], ['koryu', '🚶 交流学級']]) + ({ week: viewWeek, month: viewMonth, timetable: viewTimetable, koryu: viewKoryu })[view.tab.yotei]();
      case 'gakushu': return subtabs('gakushu', [['units', '📘 単元計画'], ['materials', '🧰 教材の置き場']]) + ({ units: viewUnits, materials: viewMaterials })[view.tab.gakushu]();
      case 'koumu': return subtabs('koumu', [['tasks', '✅ やること'], ['duties', '🗂 校務分掌'], ['meetings', '📝 会議メモ'], ['templates', '📄 文書のひな形']]) + ({ tasks: viewTasks, duties: viewDuties, meetings: viewMeetings, templates: viewTemplates })[view.tab.koumu]();
      case 'settings': return viewSettings();
      default: return viewLobby();
    }
  }

  function subtabs(room, tabs) {
    return `<div class="subtabs" role="tablist">${tabs.map(([id, label]) => `<button class="subtab${view.tab[room] === id ? ' on' : ''}" role="tab" aria-selected="${view.tab[room] === id}" data-act="tab" data-room="${room}" data-tab="${id}">${label}</button>`).join('')}</div>`;
  }

  const SEATS = [

    { room: 'kodomo', a: 340 }, { room: 'settings', a: 60 }, { room: 'renkei', a: 120 },
  ];

  function greeting() {
    const hour = new Date().getHours();
    return hour < 11 ? 'おはようございます' : hour < 17 ? 'こんにちは' : 'おつかれさまです';
  }
  function short(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
  // いちばん近い 締め切り（公務の部屋の やること と、月の予定の「締め切り」）
  function nextDeadline() {
    const t = today();
    const evs = list('events').filter((e) => e.cat === '締め切り' && isDate(e.date) && e.date >= t).map((e) => ({ title: e.title, date: e.date, time: e.time || '' }));
    const tasks = openTasks().filter((x) => isDate(x.due) && x.due >= t).map((x) => ({ title: x.title, date: x.due, time: '' }));
    return evs.concat(tasks).sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')))[0];
  }
  function whenText(date) {
    const t = today();
    return date === t ? 'きょう' : date === addDays(t, 1) ? 'あした' : jdate(date);
  }

  // まん中の 地球儀に 出す：時計・日付・いま／つぎの 時間・締め切り
  function holoHtml() {
    const now = new Date();
    const t = ymd(now);
    const hm = pad(now.getHours()) + ':' + pad(now.getMinutes());
    let line;
    const off = offReason(t);
    if (off) line = `きょうは ${off}`;
    else {
      const ps = S.periods.filter((p) => /^\d{2}:\d{2}$/.test(p.start) && /^\d{2}:\d{2}$/.test(p.end)).sort((a, b) => a.start.localeCompare(b.start));
      const name = (p) => { const s = lesson(t, p.id).subject; return p.name + (s ? ' ' + s : ''); };
      const cur = ps.find((p) => p.start <= hm && hm < p.end);
      const next = ps.find((p) => p.start > hm);
      line = cur ? `いま：${name(cur)}（〜${cur.end}）` : next ? `つぎ：${name(next)}（${next.start}〜）` : 'きょうの授業は おわりました';
    }
    const dl = nextDeadline();
    const left = dl ? daysBetween(t, dl.date) : 0;
    const late = overdueTasks();
    return `<div class="clock">${now.getHours()}:${pad(now.getMinutes())}</div>
      <div class="hdate">${wareki(now.getFullYear())} ${jdate(t)}</div>
      <div class="hline">${esc(line)}</div>
      ${late.length ? `<div class="hline hdead late">⚠ 期限切れの やること ${late.length}件</div><div class="hline hsmall">${esc(short(late[0].title, 16))}</div>`
        : dl ? `<div class="hline hdead">⏰ ${left ? `締め切りまで あと${left}日` : 'きょうが 締め切り'}</div><div class="hline hsmall">${esc(short(dl.title, 16))}</div>`
        : '<div class="hline hsmall">⏰ 近い締め切りは ありません</div>'}`;
  }

  // 席の キャラクターの ひとこと（その部屋の いまの ようすを 話す）
  function seatTalk(room) {
    const t = today();
    switch (room) {
      case 'yotei': {
        const e = eventsBetween(t, addDays(t, 14))[0];
        return e ? `つぎの予定は ${whenText(e.date < t ? t : e.date)}${e.time ? ' ' + e.time : ''}の「${short(e.title, 18)}」だよ。` : '2週間の予定は まだ ないよ。月の予定に 入れてね。';
      }
      case 'gakushu': {
        const us = list('units').filter((u) => unitPhase(u) === 'now' && Number(u.hours) > 0)
          .map((u) => ({ u, left: Number(u.hours) - unitStats(u).done })).sort((a, b) => a.left - b.left);
        const x = us.find((v) => v.left > 0) || us[0];
        if (!x) return '単元計画を 入れると、時数を 数えるホー。';
        return x.left > 0 ? `「${short(x.u.name, 14)}」は 計画まで あと${x.left}時間だホー。` : `「${short(x.u.name, 14)}」は 計画時数に 達したホー。`;
      }
      case 'koumu': {
        const late = overdueTasks();
        if (late.length) return `期限が すぎた やることが ${late.length}件 あるペン！「${short(late[0].title, 14)}」から 片づけよう。`;
        const d = nextDeadline();
        if (d) {
          const n = daysBetween(t, d.date);
          return `締め切り「${short(d.title, 16)}」${n ? `まで あと${n}日` : 'は きょう'}だペン！`;
        }
        const n = openTasks().length;
        return n ? `やることは あと${n}件だペン。` : 'やることは ぜんぶ 終わったペン！おつかれさま。';
      }
      case 'kodomo': {
        const kids = children();
        if (!kids.length) return '「交流学級」のページで 子どもを 登録できるよ。';
        if (offReason(t)) return 'きょうは お休み。先生も ゆっくり 休んでね。';
        const n = new Set(list('exchange').filter((x) => Number(x.day) === dayOf(t) && get('children', x.childId)).map((x) => x.childId)).size;
        return n ? `きょうは ${n}人が 交流学級へ 行くよ。` : 'きょうは 交流学級へ 行く子は いないよ。';
      }
      case 'renkei': {
        const e = eventsBetween(t, addDays(t, 30)).find((v) => v.cat === '交流' || v.cat === '保護者');
        return e ? `「${short(e.title, 16)}」が ${whenText(e.date < t ? t : e.date)}に あるクマ。` : '連携の部屋は じゅんび中だクマ。';
      }
      default:
        return S.className ? '校時や 教科は ここで 変えられるよ。' : '学級名・校時・教科は ここで 決めてね。';
    }
  }
