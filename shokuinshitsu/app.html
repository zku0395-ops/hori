      <path d="M86 108 q14 9 28 0" stroke="#92400e" stroke-width="4" fill="none" stroke-linecap="round"/>` },
  };

  function chairSvg(x, y, s) {
    const legs = [-1, -0.4, 0.4, 1].map((k) => `<line x1="${x}" y1="${y - 3 * s}" x2="${x + k * 20 * s}" y2="${y + (Math.abs(k) < 1 ? 4 : 1) * s}"/>`).join('');
    return `<ellipse cx="${x}" cy="${y + 2 * s}" rx="${28 * s}" ry="${6 * s}" style="fill:rgba(0,0,0,.16)"/>
      <g style="stroke:var(--chair);stroke-width:${2.6 * s};stroke-linecap:round">${legs}</g>
      <rect x="${x - 2 * s}" y="${y - 30 * s}" width="${4 * s}" height="${27 * s}" style="fill:var(--chair-2)"/>
      <rect x="${x - 28 * s}" y="${y - 92 * s}" width="${56 * s}" height="${58 * s}" rx="${12 * s}" style="fill:var(--chair)"/>
      <ellipse cx="${x}" cy="${y - 30 * s}" rx="${27 * s}" ry="${8 * s}" style="fill:var(--chair-2)"/>`;
  }

  // 席に 座った キャラクター（座面の 位置に 合わせて 縮める）
  function charSvg(room, x, seatY, s, i) {
    const c = CHARS[room];
    if (!c) return '';
    const k = CHAR_K * s;
    return `<g transform="translate(${(x - 100 * k).toFixed(1)} ${(seatY - 190 * k).toFixed(1)}) scale(${k.toFixed(3)})">
      <g class="char${i === talkIdx ? ' talk' : ''}" id="char-${i}" style="animation-delay:${(-i * 0.7).toFixed(1)}s">${c.svg}</g></g>`;
  }

  // 円卓の 台（上の 面と 横の 面）
  function tierSvg(cx, cy, rx, ry, h, top) {
    return `<path d="M${cx - rx} ${cy} L${cx - rx} ${cy + h} A${rx} ${ry} 0 0 0 ${cx + rx} ${cy + h} L${cx + rx} ${cy} A${rx} ${ry} 0 0 1 ${cx - rx} ${cy} Z" style="fill:var(--tier-side)"/>
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" style="fill:url(#${top})"/>`;
  }

  function sceneHtml() {
    const pct = (x, y) => `left:${(x / SCENE_W * 100).toFixed(2)}%;top:${(y / SCENE_H * 100).toFixed(2)}%`;
    const G = GLOBE;
    // 左右の 壁の たてのみぞ（奥ほど 間が せまい）
    let ridges = '';
    for (let i = 0; i <= 28; i++) {
      const f = 1 - Math.pow(1 - i / 28, 1.6);
      const x = 220 * f, yt = 40 * f, yb = 470 - 70 * f;
      ridges += `<line x1="${x.toFixed(1)}" y1="${yt.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yb.toFixed(1)}"/><line x1="${(SCENE_W - x).toFixed(1)}" y1="${yt.toFixed(1)}" x2="${(SCENE_W - x).toFixed(1)}" y2="${yb.toFixed(1)}"/>`;
    }
    for (let x = 234; x < 980; x += 14) if (x < 405 || x > 795) ridges += `<line x1="${x}" y1="40" x2="${x}" y2="400"/>`;
    let rings = '';
    for (let rx = 480; rx <= 1180; rx += 42) rings += `<ellipse cx="600" cy="482" rx="${rx}" ry="${(rx * 0.24).toFixed(1)}"/>`;
    const lat = [-0.68, -0.34, 0, 0.34, 0.68].map((f) => { const dy = f * G.r; return `<ellipse cx="${G.x}" cy="${(G.y + dy).toFixed(1)}" rx="${Math.sqrt(G.r * G.r - dy * dy).toFixed(1)}" ry="${(9 - Math.abs(f) * 5).toFixed(1)}"/>`; }).join('');
    const mer = [0, 1, 2, 3].map((i) => `<ellipse cx="${G.x}" cy="${G.y}" rx="${G.r}" ry="${G.r}" style="animation-delay:${-i * 2.25}s"/>`).join('');

    // 席：奥の 席 → 机 → 手前の 席 の 順に 描く
    const seats = SEATS.map((st, i) => {
      const rad = st.a * Math.PI / 180;
      const x = 600 + (st.dist || 245) * Math.cos(rad), y = 428 + 58 * Math.sin(rad);
      const front = Math.sin(rad) > 0;
      const s = front ? 1 : 0.82;
      return Object.assign({ i, x, y, s, front, seatY: y - 30 * s, r: ROOMS.find((r) => r.id === st.room) }, st);
    });
    const chairs = (front) => seats.filter((c) => c.front === front)
      .map((c) => `<g class="chair-hit" data-act="go" data-room="${c.room}">${chairSvg(c.x, c.y, c.s)}${charSvg(c.room, c.x, c.seatY, c.s, c.i)}</g>`).join('');
    const labels = seats.map((c) => {
      const ch = CHARS[c.room];
      const ly = c.front ? c.y + 12 : c.seatY - 178 * CHAR_K * c.s - 6;
      return `<button class="seat-label ${c.front ? 'down' : 'up'} ${c.x < 600 ? 'bl' : 'br'}${c.r.soon ? ' soon' : ''}${c.i === talkIdx ? ' talk' : ''}" style="${pct(c.x, ly)}" data-act="go" data-room="${c.room}" data-seat="${c.i}" aria-label="${esc(c.r.name)}（${esc(ch.name)}）">${c.r.icon} ${esc(c.r.name)}${c.r.soon ? '<small>準備中</small>' : ''}
        <span class="bubble" aria-hidden="true"><b>${esc(ch.name)}</b>${esc(seatTalk(c.room))}</span></button>`;
    }).join('');

    const svg = `<svg viewBox="0 0 ${SCENE_W} ${SCENE_H}" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--wall-back)"/><stop offset="1" style="stop-color:var(--wall)"/></linearGradient>
        <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--floor)"/><stop offset="1" style="stop-color:var(--floor-2)"/></linearGradient>
        <linearGradient id="gTier" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tier-top2)"/><stop offset="1" style="stop-color:var(--tier-top)"/></linearGradient>
        <linearGradient id="gTable" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--table)"/><stop offset="1" style="stop-color:var(--table-2)"/></linearGradient>
        <linearGradient id="gFix" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--fixture)"/><stop offset="1" style="stop-color:var(--fixture-2)"/></linearGradient>
        <linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--beam)"/><stop offset="1" style="stop-color:var(--beam);stop-opacity:0"/></linearGradient>
        <linearGradient id="gDoor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--door)"/><stop offset="1" style="stop-color:var(--glow);stop-opacity:.55"/></linearGradient>
        <radialGradient id="gPanel"><stop offset="0" style="stop-color:var(--door);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--wall-back);stop-opacity:0"/></radialGradient>
        <radialGradient id="gCore" cx=".42" cy=".38" r=".75"><stop offset="0" style="stop-color:var(--glow);stop-opacity:.75"/><stop offset=".55" style="stop-color:var(--globe-core)"/><stop offset="1" style="stop-color:var(--globe-edge)"/></radialGradient>
        <radialGradient id="gHalo"><stop offset=".55" style="stop-color:var(--glow);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/></radialGradient>
        <filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
        <clipPath id="cFloor"><polygon points="0,470 220,400 980,400 1200,470 1200,600 0,600"/></clipPath>
      </defs>
      <!-- 部屋 -->
      <polygon points="0,0 1200,0 980,40 220,40" style="fill:var(--ceil)"/>
      <rect x="220" y="40" width="760" height="360" fill="url(#gBack)"/>
      <polygon points="0,0 220,40 220,400 0,470" style="fill:var(--wall)"/>
      <polygon points="1200,0 980,40 980,400 1200,470" style="fill:var(--wall)"/>
      <g style="stroke:var(--ridge);stroke-width:1.6">${ridges}</g>
      <rect x="400" y="60" width="400" height="320" fill="url(#gPanel)"/>
      <polygon points="0,470 220,400 980,400 1200,470 1200,600 0,600" fill="url(#gFloor)"/>
      <g clip-path="url(#cFloor)" style="fill:none;stroke:var(--ridge);stroke-width:1.4">${rings}</g>
      <!-- 三角の 入口 -->
      <polygon class="pulse" points="905,192 827,402 983,402" style="fill:var(--glow);opacity:.45" filter="url(#fBlur)"/>
      <polygon points="905,206 843,398 967,398" fill="url(#gDoor)" style="stroke:var(--fixture-2);stroke-width:3"/>
      <circle cx="905" cy="341" r="6.5" style="fill:var(--person)"/>
      <path d="M898 351 Q905 346 912 351 L915 373 L912 373 L911 397 L907 397 L905 377 L903 397 L899 397 L898 373 L895 373 Z" style="fill:var(--person)"/>
      <!-- 天井の 照明と 光 -->
      <polygon points="430,60 770,60 715,300 485,300" fill="url(#gBeam)"/>
      <path d="M350 0 L350 28 A250 28 0 0 0 850 28 L850 0 Z" fill="url(#gFix)"/>
      <ellipse cx="600" cy="28" rx="250" ry="28" style="fill:var(--door)"/>
      <ellipse cx="600" cy="28" rx="250" ry="28" style="fill:none;stroke:var(--glow);stroke-width:3;opacity:.7" filter="url(#fBlur)"/>
      <path d="M400 36 L400 48 A200 20 0 0 0 800 48 L800 36 Z" fill="url(#gFix)"/>
      <ellipse class="pulse" cx="600" cy="48" rx="200" ry="20" style="fill:var(--door)"/>
      <!-- 地球儀（ホログラム） -->
      <circle class="pulse" cx="${G.x}" cy="${G.y}" r="${G.r + 38}" fill="url(#gHalo)"/>
      <circle cx="${G.x}" cy="${G.y}" r="${G.r}" fill="url(#gCore)" style="stroke:var(--glow);stroke-width:2"/>
      <g style="fill:none;stroke:var(--glow);stroke-width:1.1;opacity:.5">${lat}</g>
      <g class="globe-mer" style="fill:none;stroke:var(--glow);stroke-width:1.1;opacity:.45">${mer}</g>
      <ellipse cx="${G.x}" cy="${G.y + 11}" rx="152" ry="22" style="fill:none;stroke:var(--glow);stroke-width:2.2;opacity:.8"/>
      <ellipse cx="${G.x}" cy="${G.y + 11}" rx="152" ry="22" style="fill:none;stroke:var(--glow);stroke-width:6;opacity:.35" filter="url(#fBlur)"/>
      <!-- 円卓の 台 -->
      ${tierSvg(600, 475, 430, 100, 18, 'gTier')}
      <ellipse cx="600" cy="493" rx="430" ry="100" style="fill:none;stroke:var(--glow);stroke-width:3;opacity:.6" filter="url(#fBlur)"/>
      ${tierSvg(600, 446, 360, 86, 14, 'gTier')}
      <ellipse cx="600" cy="446" rx="285" ry="66" style="fill:none;stroke:var(--door);stroke-width:3;opacity:.95"/>
      <ellipse cx="600" cy="446" rx="285" ry="66" style="fill:none;stroke:var(--glow);stroke-width:7;opacity:.5" filter="url(#fBlur)"/>
      <!-- 席と 円卓 -->
      ${chairs(false)}
      <ellipse cx="600" cy="452" rx="44" ry="9" style="fill:rgba(0,0,0,.16)"/>
      <rect x="591" y="424" width="18" height="28" style="fill:var(--fixture-2)"/>
      <path d="M435 418 L435 425 A165 34 0 0 0 765 425 L765 418 Z" style="fill:var(--table-2)"/>
      <ellipse cx="600" cy="418" rx="165" ry="34" fill="url(#gTable)"/>
      ${chairs(true)}
    </svg>`;

    const enter = sceneEntered ? '' : ' enter';
    sceneEntered = true;
    return `<section class="scene${enter}" aria-label="仮想職員室 円卓の間">
      ${svg}
      <div class="greet"><b>${greeting()}。</b><span>${esc(S.className || '仮想職員室へ ようこそ')}</span></div>
      <div class="holo" id="holo" style="${pct(G.x, G.y)}" aria-live="off">${holoHtml()}</div>
      ${labels}
      <button class="seat-label up door-label" style="${pct(905, 186)}" data-act="tomorrow">🌙 あしたの確認</button>
    </section>`;
  }

  // 席の キャラクターが 順番に 話す
  function nextTalk() {
    const labels = document.querySelectorAll('.seat-label[data-seat]');
    if (!labels.length) return;
    talkIdx = (talkIdx + 1) % labels.length;
    document.querySelectorAll('.scene .talk').forEach((el) => el.classList.remove('talk'));
    labels[talkIdx].classList.add('talk');
    const c = document.getElementById('char-' + talkIdx);
    if (c) c.classList.add('talk');
  }

  // ある日の 時間割の 一覧（ロビーと「あしたの確認」で 使う）
  function dayLessonsHtml(day) {
    return S.periods.map((p) => {
      const L = lesson(day, p.id);
      const outs = outsAt(dayOf(day), p.id);
      const sp = staffOn(day).map((x) => ({ x, t: staffText(x.id, day, p.id) })).filter((v) => v.t);
      const sub = get('subs', subId(day, p.id));
      if (!L.subject && !L.subject2 && !L.aim && !L.content && !L.note && (!outs.length || L.noClass) && !sp.length && !sub) return '';
      return `<li><div class="pname">${esc(p.name)}<span class="ptime">${esc(p.start)}〜${esc(p.end)}</span></div>
        <div class="what">${L.subject ? chip(L.subject) : '<span class="muted">（なし）</span>'}${L.subject2 ? ' ＋ ' + chip(L.subject2) : ''}
          ${L.unit ? `<span class="muted" style="font-size:13px">📘 ${esc(L.unit.name)}</span>` : ''}
          ${L.head ? `<div class="content head-line">${nl(L.head)}</div>` : ''}
          ${L.aim ? `<div class="content aim">${esc(S.aimMark || '○')}${esc(L.aim)}</div>` : ''}
          ${L.content ? `<div class="content">${nl(L.content)}</div>` : ''}
          ${L.note ? `<div class="content">📝 ${nl(L.note)}</div>` : ''}
          ${outs.length ? `<div class="outs">${outs.map(outChip).join('')}</div>` : ''}
          ${sp.map((v) => `<div class="staff-line">👥 ${esc(v.x.name)}：${esc(v.t)}</div>`).join('')}
          ${sub ? `<div class="sub-tag">🚗 補教：${esc(sub.teacher || '未定')}${sub.task ? '（' + esc(sub.task) + '）' : ''}</div>` : ''}</div></li>`;
    }).join('');
  }

  function evRow(e, base) {
    const start = e.date < base ? base : e.date;
    const left = daysBetween(today(), e.date);
    const when = start === today() ? 'きょう' : start === addDays(today(), 1) ? 'あした' : jdate(start);
    const h = e.hue !== undefined ? e.hue : catHue(e.cat);
    return `<li><span class="when">${when}${e.time ? ' ' + esc(e.time) : ''}</span>
      <span class="chip${h < 0 ? ' gray' : ''}" style="--h:${Math.max(h, 0)};font-size:12px">${esc(e.cat || 'その他')}</span>
      <span class="ev-title" data-act="${e.act || 'editEvent'}" data-id="${esc(e.id)}" role="button" tabindex="0">${esc(e.title)}</span>
      ${e.cat === '締め切り' && left >= 0 ? `<span class="tag red">${left ? `あと${left}日` : 'きょうまで'}</span>` : ''}</li>`;
  }
  function eventsBetween(from, to) {
    return list('events')
      .filter((e) => isDate(e.date) && (isDate(e.end) && e.end > e.date ? e.end : e.date) >= from && e.date <= to)
      .sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')));
  }

  function viewLobby() {
    const t = today();
    const off = offReason(t);
    const day = off ? nextSchoolDay(t) : t;
    const lessons = dayLessonsHtml(day);
    const evHtml = eventsBetween(t, addDays(t, 14)).concat(kenkyuEvents(t, addDays(t, 14)))
      .sort((a, b) => ((a.date < t ? t : a.date) + (a.time || '99')).localeCompare((b.date < t ? t : b.date) + (b.time || '99')))
      .map((e) => evRow(e, t)).join('');
    const nowUnits = list('units').filter((u) => unitPhase(u) === 'now').sort((a, b) => S.subjects.indexOf(a.subject) - S.subjects.indexOf(b.subject));

    const up = upcomingDraft();
    return `${sceneHtml()}
      ${up ? `<section class="card draft-card">
        <div class="toolbar" style="margin:0 0 4px"><h2 class="sec">📝 次の週の 週案の 下書きが できています</h2><span class="grow"></span>
          <button class="btn small" data-act="openWeek" data-date="${up.mon}">週案を見て直す</button>
          <button class="btn small primary" data-act="exportShuanbo" data-mon="${up.mon}">📤 週案簿に貼る</button></div>
        <p class="hint">${weekNo(up.mon) ? `第${weekNo(up.mon)}週 ` : ''}${jdate(up.mon)}〜 の週案を、時間割・行事予定・前の時間の内容から 作りました（${md(up.at)}）。直してから、週案簿に 貼り付けてください。${IN_GAS && safeUrl(meta.draftSheetUrl) ? `　<a href="${esc(meta.draftSheetUrl)}" target="_blank" rel="noopener noreferrer">週案簿に 貼る 形の スプレッドシート ↗</a>` : ''}</p>
      </section>` : ''}
      <div class="grid2">
        <section class="card">
          <div class="toolbar"><h2 class="sec">🕘 ${off ? `次の登校日 ${jdate(day)} の時間割` : 'きょうの時間割'}</h2><span class="grow"></span>
            <button class="btn small" data-act="openWeek" data-date="${day}">週案を開く</button></div>
          ${off ? `<p class="hint" style="margin-bottom:6px">きょう（${jdate(t)}）は ${esc(off)} です。</p>` : ''}
          ${lessons ? `<ul class="day-list">${lessons}</ul>` : `<div class="empty-note">時間割がまだ入っていません。<br><button class="btn link" data-act="goTab" data-room="yotei" data-tab="timetable">「基本の時間割」を入れる</button></div>`}
        </section>
        <div class="stack">
          <section class="card">
            <div class="toolbar"><h2 class="sec">✅ やること（${openTasks().length}件）</h2><span class="grow"></span>
              <button class="btn small" data-act="editTask">＋ 追加</button>
              <button class="btn small" data-act="goTab" data-room="koumu" data-tab="tasks">公務の部屋</button></div>
            ${openTasks().length ? `<ul class="tasks">${openTasks().sort(byDue).slice(0, 6).map((x) => taskRow(x, true)).join('')}</ul>${openTasks().length > 6 ? `<p class="hint" style="margin-top:6px">ほか ${openTasks().length - 6}件は 公務の部屋で 見られます。</p>` : ''}` : '<div class="empty-note">のこっている やることは ありません。</div>'}
          </section>
          <section class="card">
            <div class="toolbar"><h2 class="sec">📌 これからの予定（2週間）</h2><span class="grow"></span>
              <button class="btn small" data-act="newEvent" data-date="${t}">＋ 追加</button>
              <button class="btn small" data-act="goTab" data-room="yotei" data-tab="month">月の予定</button></div>
            ${evHtml ? `<ul class="ev-list">${evHtml}</ul>` : '<div class="empty-note">2週間以内の予定はありません。</div>'}
          </section>
          <section class="card">
            <div class="toolbar"><h2 class="sec">📘 進行中の単元</h2><span class="grow"></span>
              <button class="btn small" data-act="goTab" data-room="gakushu" data-tab="units">単元計画</button></div>
            ${nowUnits.length ? `<div class="stack" style="gap:10px">${nowUnits.map(unitMini).join('')}</div>` : '<div class="empty-note">進行中の単元はありません。</div>'}
          </section>
        </div>
      </div>
      <h2 class="sec" style="margin:24px 0 12px">🚪 部屋</h2>
      <div class="doors">${ROOMS.filter((r) => r.id !== 'lobby').map((r) => `<button class="door${r.soon ? ' soon' : ''}" data-act="go" data-room="${r.id}"><div class="icon">${r.icon}</div><b>${esc(r.name)}${r.soon ? ' <span class="tag">準備中</span>' : ''}</b><span>${esc(r.desc || '学級名・校時・教科')}</span></button>`).join('')}</div>`;
  }

  // 三角の 入口：帰る前に 次の 登校日を 確かめる
  function showTomorrow() {
    const t = today();
    const d = nextSchoolDay(t);
    const lessons = dayLessonsHtml(d);
    const evs = eventsOn(d);
    const dues = list('events').filter((e) => e.cat === '締め切り' && isDate(e.date) && e.date > t && e.date <= addDays(d, 3) && !evs.includes(e))
      .sort((a, b) => a.date.localeCompare(b.date));
    const tasks = openTasks().filter((x) => isDate(x.due) && x.due <= addDays(d, 3)).sort(byDue);
    openDialog({
      title: `🌙 あしたの確認　${jdate(d)}`,
      readOnly: true,
      body: `${d !== addDays(t, 1) ? `<p class="hint">次の登校日は ${jdate(d)} です。</p>` : ''}
        <h3 class="mini">🕘 時間割と準備</h3>
        ${lessons ? `<ul class="day-list">${lessons}</ul>` : '<div class="empty-note">時間割が入っていません。</div>'}
        ${trainingsOn(d).some((x) => x.trip) || subsOn(d).length ? `<h3 class="mini">🚗 出張・補教</h3>
          <p>${trainingsOn(d).filter((x) => x.trip).map((x) => `出張：${esc(x.title)}${x.time ? ' ' + esc(x.time) + '〜' : ''}`).join('<br>')}${subsSummary(d) ? `<br>補教：${esc(subsSummary(d))}` : '<br><span class="muted">補教の 計画は まだ です。</span>'}</p>
          <div class="toolbar" style="margin:4px 0 0"><button class="btn small" data-act="subsText" data-date="${d}">📋 補教の お願い</button><button class="btn small" data-act="editSubs" data-date="${d}">🚗 補教の 計画</button></div>` : ''}
        <h3 class="mini">📌 この日の予定</h3>
        ${evs.length ? `<ul class="ev-list">${evs.map((e) => evRow(e, d)).join('')}</ul>` : '<p class="hint">ありません。</p>'}
        ${dues.length ? `<h3 class="mini">⏰ 近い締め切り</h3><ul class="ev-list">${dues.map((e) => evRow(e, t)).join('')}</ul>` : ''}
        ${tasks.length ? `<h3 class="mini">✅ 早めに 片づけたい やること</h3><ul class="tasks">${tasks.map((x) => taskRow(x, true)).join('')}</ul>` : ''}
        <div><button class="btn" data-act="openWeek" data-date="${d}">週案を開いて直す</button></div>`,
    });
  }

  function unitMini(u) {
    const st = unitStats(u);
    return `<div data-act="editUnit" data-id="${esc(u.id)}" role="button" tabindex="0" style="cursor:pointer">
      <div class="meta">${chip(u.subject)} <b style="color:var(--ink);font-size:15px">${esc(u.name)}</b></div>
      ${progress(u, st)}</div>`;
  }

  function progress(u, st) {
    const hours = Number(u.hours) || 0;
    const total = Math.max(hours, st.done + st.plan, 1);
    const label = hours ? `実施 ${st.done} ／ 計画 ${hours} 時間` : `実施 ${st.done} 時間`;
    return `<div class="bar" title="${esc(label)}"><i style="width:${(st.done / total) * 100}%"></i><i class="plan" style="width:${(st.plan / total) * 100}%"></i></div>
      <div class="meta"><span>${label}</span>${st.plan ? `<span>（週案に このあと ${st.plan} 時間）</span>` : ''}${hours && st.done >= hours ? '<span class="tag">計画時数に達しました</span>' : ''}</div>`;
  }

  /* ---------- 予定の部屋：週案 ---------- */
  // 時数の 選択肢（値は 数、表示は 分数）
  /* 共通ここから */
  const HOUR_CHOICES = [1, 2 / 3, 0.5, 1 / 3];
  function hourOptions(selected, firstLabel) {
    const sel = selected === '' || selected === undefined || selected === null ? '' : fmtH(selected);
    return (firstLabel ? opt('', sel, firstLabel) : '') + HOUR_CHOICES.map((h) => `<option value="${h}"${sel === fmtH(h) ? ' selected' : ''}>${fmtH(h)}</option>`).join('');
  }
  function weekDates(mon) {
    const dates = DAYS.map((_, i) => addDays(mon, i));
    const sat = addDays(mon, 5);
    if (!offReason(sat)) dates.push(sat); // 土曜授業の 週
    return dates;
  }
  function subjectOrder(a, b) {
    const ia = S.subjects.indexOf(a), ib = S.subjects.indexOf(b);
    return (ia < 0) - (ib < 0) || ia - ib || String(a).localeCompare(String(b), 'ja');
  }
  /* 共通ここまで */

  function viewWeek() {
    const t = today();
    const mon = view.week;
    const dates = weekDates(mon);
    const offs = dates.map(offReason);
    const title = `${wareki(parse(mon).getFullYear())} ${jdate(mon)} 〜 ${jdate(dates[dates.length - 1])}`;
    const wk = get('weeks', 'v' + mon);

    const head = dates.map((d) => {
      const di = dayInfo(d);
      return `<th class="${d === t ? 'is-today' : ''}">
        <div class="dh"><b>${md(d)}</b>（${WD[dayOf(d)]}）${d === t ? '<span class="todaymark">きょう</span>' : ''}${di && Number(di.jisu) > 0 ? ` <span class="tag" title="この日の授業時数">${Number(di.jisu)}時間</span>` : ''}</div>
        ${holiday(d) ? `<div class="hol-name">${esc(holiday(d))}</div>` : ''}
        ${eventsOn(d).map(evChip).join('')}${subChipsHtml(d)}${tasksDueOn(d).map(taskChip).join('')}
        <button class="add-ev noprint" data-act="newEvent" data-date="${d}">＋予定</button></th>`;
    }).join('');

    const rows = S.periods.map((p, r) => `<tr class="${p.weight < 1 ? 'module-row' : ''}"><th class="pcol">${esc(p.name)}<span class="ptime">${esc(p.start)}${p.end ? '〜' + esc(p.end) : ''}${p.weight < 1 ? `<br>（${fmtH(p.weight)}時間）` : ''}</span></th>${dates.map((d, i) => {
      if (offs[i]) return r === 0 ? `<td class="offday" rowspan="${S.periods.length}">${esc(offs[i])}<br><small>お休み</small></td>` : '';
      return lessonCell(d, p.id, d === t);
    }).join('')}</tr>`).join('');

    // 日ごとの 休み時間・備考・記録欄
    const dayRow = (key, label) => `<tr class="day-notes"><th class="pcol">${label}</th>${dates.map((d) => {
      const di = dayInfo(d) || {};
      // 備考には 出張・補教も 出す（週案簿にも 入る）
      const extra = key === 'biko' ? tripLines(d) : [];
      return `<td class="cell daynote" data-act="editDay" data-date="${d}" tabindex="0" role="button">${di[key] ? nl(di[key]) : ''}${extra.length ? `<div class="trip-note">${nl(extra.join('\n'))}</div>` : ''}${!di[key] && !extra.length ? '<span class="empty noprint">＋</span>' : ''}</td>`;
    }).join('')}</tr>`;
    const hasYasumi = dates.some((d) => (dayInfo(d) || {}).yasumi);

    // 時数：この週・年度の 累計（この週の 終わりまで）・標準・達成率
    const week = {};
    dates.forEach((d) => dayHours(d, week));
    const n0 = nendoOf(mon);
    const total = cached('cum:' + mon, () => sumHours(`${n0}-04-01`, addDays(mon, 6)));
    const subjects = Array.from(new Set(Object.keys(week).concat(Object.keys(total)).concat(Object.keys(S.standards)))).sort(subjectOrder);
    const hoursTable = subjects.length ? `<div class="table-wrap"><table class="list hours-table"><thead><tr><th>教科</th>${subjects.map((s) => `<th>${chip(s)}</th>`).join('')}</tr></thead><tbody>
        <tr><th>この週</th>${subjects.map((s) => `<td>${week[s] ? fmtH(week[s]) : ''}</td>`).join('')}</tr>
        <tr><th>累計</th>${subjects.map((s) => `<td>${total[s] ? fmtH(total[s]) : ''}</td>`).join('')}</tr>
        <tr><th>標準</th>${subjects.map((s) => `<td>${S.standards[s] || ''}</td>`).join('')}</tr>
        <tr><th>達成率</th>${subjects.map((s) => `<td>${S.standards[s] ? Math.round((total[s] || 0) / S.standards[s] * 1000) / 10 + '%' : ''}</td>`).join('')}</tr>
      </tbody></table></div>` : '<span class="muted">まだありません</span>';

    return `<div class="toolbar noprint">
        <button class="btn" data-act="weekMove" data-n="-7">◀ 前の週</button>
        <button class="btn" data-act="weekMove" data-n="0">今週</button>
        <button class="btn" data-act="weekMove" data-n="7">次の週 ▶</button>
        <input class="input" type="date" style="width:auto" value="${mon}" data-chg="weekJump" aria-label="日付を選んで その週を開く">
        <span class="grow"></span>
        <button class="btn" data-act="makeDraft" data-mon="${mon}" title="書きこみのない時間に、時間割と前の時間の内容から下書きを入れます">📝 下書きを作る</button>
        <button class="btn primary" data-act="exportShuanbo" data-mon="${mon}">📤 週案簿に貼る</button>
        <button class="btn" data-act="print">🖨 印刷</button>
      </div>
      <h2 class="wk-title" style="margin:0 0 6px">${weekNo(mon) ? `<span class="tag" style="font-size:13px">第${weekNo(mon)}週</span> ` : ''}${title}${wk && isDate(wk.draftAt) ? ` <span class="tag" title="下書きを作った日">📝 ${md(wk.draftAt)} 下書き</span>` : ''}<span class="print-only">${esc(S.className)} 週案</span></h2>
      <div class="focus" data-act="editFocus" data-mon="${mon}" tabindex="0" role="button"><b>🎯 今週の重点</b>　${wk && wk.focus ? nl(wk.focus) : '<span class="muted noprint">（押して書きこめます）</span>'}</div>
      <div class="table-wrap"><table class="week"><thead><tr><th class="pcol">校時</th>${head}</tr></thead><tbody>${rows}</tbody>
        <tfoot>${hasYasumi ? dayRow('yasumi', '休み時間') : ''}${dayRow('biko', '備考')}${dayRow('kiroku', '記録欄')}</tfoot></table></div>
      <section class="card" style="margin-top:12px"><h3 class="mini" style="margin:0 0 8px">⏱ 時数（累計は ${n0}年4月から この週の 終わりまで）</h3>${hoursTable}</section>
      <p class="hint noprint" style="margin-top:8px">マスを押すと、その時間の学習内容や単元を書きこめます。何も書かない時間は「基本の時間割」のとおりに表示します。左に青い線があるマスは、この週だけ書きこんだ時間です。「—」は授業のない時間です。</p>`;
  }

  function lessonCell(date, pid, isToday) {
    const L = lesson(date, pid);
    const outs = outsAt(dayOf(date), pid);
    const hrs = (h) => (h && Math.abs(h - 1) > 0.01 ? `<small class="hrs">${fmtH(h)}</small>` : '');
    return `<td class="cell${isToday ? ' is-today' : ''}${L.w ? ' edited' : ''}${L.noClass ? ' nocls' : ''}" data-act="editLesson" data-date="${date}" data-pid="${esc(pid)}" tabindex="0" role="button">
      ${L.subject ? chip(L.subject) + hrs(L.hours) : ''}${L.subject2 ? `<span class="plus">＋</span>${chip(L.subject2)}${hrs(L.hours2)}` : ''}
      ${!L.subject && !L.subject2 ? (L.noClass ? '<span class="dash">—</span>' : '<span class="empty noprint">＋</span>') : ''}
      ${L.unit ? `<div class="unit">📘 ${esc(L.unit.name)}</div>` : ''}
      ${L.head ? `<div class="head-line">${nl(L.head)}</div>` : ''}
      ${L.aim ? `<div class="aim">${esc(S.aimMark || '○')}${esc(L.aim)}</div>` : ''}
      ${L.content ? `<div class="content">${nl(L.content)}</div>` : ''}
      ${L.note ? `<div class="note">📝 ${nl(L.note)}</div>` : ''}
      ${outs.length && !L.noClass ? `<div class="outs">${outs.map(outChip).join('')}</div>` : ''}
      ${get('subs', subId(date, pid)) ? `<div class="sub-tag">🚗 補教：${esc(get('subs', subId(date, pid)).teacher || '未定')}</div>` : ''}</td>`;
  }

  function editLesson(date, pid) {
    const p = S.periods.find((x) => x.id === pid);
    if (!p) return;
    const id = wkId(date, pid);
    const w = get('weekly', id) || {};
    const base = baseLesson(dayOf(date), pid);
    const baseSubj = base ? base.subject : '';
    const chosen = w.subject || '';
    const effective = chosen === NONE ? '' : (chosen || baseSubj);
    const unitId = w.unitId || (w.id ? '' : autoUnit(effective, date));
    const outs = outsAt(dayOf(date), pid);
    const di = dayInfo(date);
    const followLabel = di && Number(di.fixed) ? 'なし（週案簿で 空いていた時間）' : '基本の時間割のとおり' + (baseSubj ? `（${baseSubj}）` : '');
    openDialog({
      title: `${jdate(date)} ${p.name}`,
      attrs: `data-date="${date}" data-pid="${esc(pid)}" data-base="${esc(baseSubj)}"`,
      body: `<p class="hint">${esc(p.start)}${p.end ? '〜' + esc(p.end) : ''}　／　基本の時間割：${baseSubj ? chip(baseSubj) : 'なし'}</p>
        <div class="row2">
          <label class="field">教科
            <select name="subject" data-chg="lessonSubj">${opt('', chosen, followLabel)}${S.subjects.concat(chosen && chosen !== NONE && !S.subjects.includes(chosen) ? [chosen] : []).map((s) => opt(s, chosen)).join('')}${opt(NONE, chosen, 'なし（授業なし）')}</select></label>
          <label class="field">時数 <select name="hours">${hourOptions(w.hours, `ふつう（${fmtH(p.weight)}）`)}</select></label>
        </div>
        <div class="row2">
          <label class="field">2つ目の教科（1時間を 分けるとき） <select name="subject2">${opt('', w.subject2 || '', '—')}${S.subjects.concat(w.subject2 && !S.subjects.includes(w.subject2) ? [w.subject2] : []).map((s) => opt(s, w.subject2)).join('')}</select></label>
          <label class="field">2つ目の時数 <select name="hours2">${hourOptions(w.hours2 || 2 / 3)}</select></label>
        </div>
        <label class="field">① 単元 <select name="unitId" data-chg="lessonUnit">${unitOptions(effective, date, unitId)}</select></label>
        <details class="picker" open><summary>📋 一覧から 選ぶ（単元・めあて・学習内容が 入ります）</summary><div id="lesson-pick">${lessonPicker(effective, date, pid, unitId)}</div></details>
        <details class="picker"><summary>🪜 段階表から 選ぶ（スモールステップ）</summary><div id="step-pick">${effective ? stepPicker(effective) : '<p class="hint">教科を 選ぶと、段階表が 出ます。</p>'}</div></details>
        <label class="field">1行目（週案簿の 1行目：学習形態・場所など。空なら 単元名） <input name="head" maxlength="100" value="${esc(w.head)}" placeholder="例：体育館で（2グループ）"></label>
        <label class="field">② めあて <input name="aim" maxlength="300" value="${esc(w.aim)}" placeholder="例：はしを そろえて 長さを くらべよう"></label>
        <label class="field">③ 学習内容 <textarea name="content" rows="4" maxlength="4000" placeholder="例：①えんぴつの 長さくらべ&#10;②テープで 長さを うつしとる">${esc(w.content)}</textarea></label>
        <label class="check" style="font-weight:400"><input type="checkbox" name="addItem"> この めあて・学習内容を 一覧にも 入れる</label>
        <label class="field">メモ・ふりかえり <textarea name="note" rows="2" maxlength="1000" placeholder="例：準備物、子どもの様子、次の時間への引きつぎ">${esc(w.note)}</textarea></label>
        ${outs.length ? `<div class="info">この時間の交流：<div class="outs">${outs.map(outChip).join('')}</div></div>` : ''}
        ${get('subs', subId(date, pid)) ? `<div class="info">🚗 この時間は 補教です（${esc(get('subs', subId(date, pid)).teacher || '先生は 未定')}）${get('subs', subId(date, pid)).task ? '：' + esc(get('subs', subId(date, pid)).task) : ''}
          <button type="button" class="btn small" data-act="editSubs" data-date="${date}">補教の 計画</button></div>` : ''}`,
      deleteLabel: w.id ? 'この時間の書きこみを消す' : '',
      onDelete: () => removeRecs('weekly', id),
      onSave: (f) => {
        const rec = { id, date, period: pid, subject: f.subject, unitId: f.unitId, head: f.head.trim(), aim: f.aim.trim(), content: f.content.trim(), note: f.note.trim(),
          hours: f.hours === '' ? '' : Number(f.hours), subject2: f.subject2, hours2: f.subject2 ? Number(f.hours2) : '' };
        if (!rec.subject && !rec.unitId && !rec.head && !rec.aim && !rec.content && !rec.note && !rec.subject2 && rec.hours === '') { if (w.id) removeRecs('weekly', id); else render(); return; }
        // 一覧にも 入れる（同じ ものが なければ）
        const subj = f.subject === NONE ? '' : (f.subject || baseSubj);
        if (f.addItem && subj && (rec.aim || rec.content) && !list('lessonItems').some((x) => (x.unitId || '') === rec.unitId && x.aim === rec.aim && x.content === rec.content)) {
          putRecs('lessonItems', { id: uid('li'), subject: subj, unitId: rec.unitId, no: nextItemNo(subj, rec.unitId), head: rec.head, aim: rec.aim, content: rec.content }, { render: false });
        }
        putRecs('weekly', rec);
      },
    });
    scrollPickerToNext();
  }

  // 日ごとの 授業時数・休み時間・備考・記録欄
  function editDay(date) {
    const di = dayInfo(date) || {};
    openDialog({
      title: `${jdate(date)} の メモ`,
      body: `<label class="field">この日の 授業時数（モジュールを のぞく） <input type="number" name="jisu" min="0" max="8" value="${esc(di.jisu)}" placeholder="例：5（空けておくと 基本の時間割のとおり）"></label>
        <label class="field">休み時間（中休み・昼休み） <textarea name="yasumi" rows="2" maxlength="1000">${esc(di.yasumi)}</textarea></label>
        <label class="field">備考 <textarea name="biko" rows="3" maxlength="2000" placeholder="例：〇〇T 出張、見学の受け入れ">${esc(di.biko)}</textarea></label>
        <label class="field">記録欄 <textarea name="kiroku" rows="3" maxlength="2000">${esc(di.kiroku)}</textarea></label>
        <p class="hint">子どもや保護者の名前など、個人情報は 必要なことだけを 短く 書きましょう。</p>
        <div class="toolbar" style="margin:0"><button type="button" class="btn small" data-act="editSubs" data-date="${date}">🚗 この日の 補教の 計画（出張・休みで 学級を あける とき）</button></div>`,
      onSave: (f) => {
        const jisu = f.jisu === '' ? '' : Math.max(0, Math.min(8, Math.round(Number(f.jisu)) || 0));
        putRecs('days', { id: 'y' + date, date, jisu, fixed: di.fixed || '', yasumi: f.yasumi.trim(), biko: f.biko.trim(), kiroku: f.kiroku.trim() });
      },
    });
  }

  function editFocus(mon) {
    const wk = get('weeks', 'v' + mon) || {};
    openDialog({
      title: `今週の重点（${jdate(mon)}の週）`,
      body: `<label class="field">今週の重点 <textarea name="focus" rows="3" maxlength="1000" placeholder="例：運動会に向けて、友だちと声をかけ合って練習する">${esc(wk.focus)}</textarea></label>`,
      onSave: (f) => putRecs('weeks', { id: 'v' + mon, monday: mon, focus: f.focus.trim() }),
    });
  }

  /* ---------- 予定の部屋：時数の 集計（週案簿の 時数集計表と 同じ 形） ---------- */
  const TERMS = [{ name: '1学期', months: [4, 5, 6, 7] }, { name: '2学期', months: [8, 9, 10, 11, 12] }, { name: '3学期', months: [1, 2, 3] }];
  function viewHours() {
    const t = today();
    const n0 = nendoOf(t);
    const until = view.hoursAll ? `${n0 + 1}-03-31` : addDays(mondayOf(t), 6);
    const byMonth = cached(`hm:${n0}:${until}`, () => {
      const out = {};
      for (let d = `${n0}-04-01`; d <= until; d = addDays(d, 1)) {
        const m = parse(d).getMonth() + 1;
        const h = dayHours(d);
        Object.keys(h).forEach((s) => { (out[s] = out[s] || {})[m] = (out[s][m] || 0) + h[s]; });
      }
      return out;
    });
    const sum = (row, months) => months.reduce((a, m) => a + ((row || {})[m] || 0), 0);
    const all = Array.from(new Set(Object.keys(byMonth).concat(Object.keys(S.standards)))).sort(subjectOrder);
    const normal = all.filter((x) => !SPECIAL_SUBJECTS.includes(x));
    const special = all.filter((x) => SPECIAL_SUBJECTS.includes(x));
    const addRows = (names) => names.reduce((acc, s) => { MONTHS.forEach((m) => { acc[m] = (acc[m] || 0) + ((byMonth[s] || {})[m] || 0); }); return acc; }, {});
    const cell = (v) => `<td>${v ? fmtH(v) : ''}</td>`;
    const row = (label, data, std, cls) => {
      const total = sum(data, MONTHS);
      const months = TERMS.map((tm) => tm.months.map((m) => cell((data || {})[m])).join('') + `<td class="term">${fmtH(sum(data, tm.months))}</td>`).join('');
      return `<tr class="${cls || ''}"><th>${label}</th><td>${std || ''}</td>${months}<td class="total">${fmtH(total)}</td><td>${std ? fmtH(Math.max(0, std - total)) : ''}</td><td>${std ? Math.round(total / std * 1000) / 10 + '%' : ''}</td></tr>`;
    };
    // 国語計（図書・書写を ふくむ）
    const kokugo = normal.includes('国語') && KOKUGO_PARTS.some((x) => normal.includes(x)) ? ['国語'].concat(KOKUGO_PARTS.filter((x) => normal.includes(x))) : [];
    let body = '';
    normal.forEach((s) => {
      body += row(chip(s), byMonth[s], S.standards[s]);
      if (kokugo.length && s === kokugo[kokugo.length - 1]) body += row('国語計', addRows(kokugo), kokugo.reduce((a, x) => a + (S.standards[x] || 0), 0), 'sub');
    });
    const stdSum = (names) => names.reduce((a, x) => a + (S.standards[x] || 0), 0);
    body += row('小計（各教科等）', addRows(normal), stdSum(normal), 'sub');
    special.forEach((s) => { body += row(chip(s), byMonth[s], S.standards[s]); });
    if (special.length) body += row('小計（行事・児童会等）', addRows(special), stdSum(special), 'sub');
    body += row('合計', addRows(all), S.standardTotal || stdSum(all), 'grand');
    const head = `<tr><th>教科</th><th>標準</th>${TERMS.map((tm) => tm.months.map((m) => `<th>${m}月</th>`).join('') + `<th class="term">${tm.name}</th>`).join('')}<th class="total">累計</th><th>残り</th><th>達成率</th></tr>`;
    return `<div class="toolbar">
        <h2 class="wk-title" style="margin:0">⏱ ${wareki(n0).replace(/年$/, '')}年度 時数の集計<span class="print-only">　${esc(S.className)}</span></h2>
        <span class="grow"></span>
        <label class="check noprint"><input type="checkbox" data-chg="hoursAll" ${view.hoursAll ? 'checked' : ''}> 年度末までの 予定（基本の時間割）も ふくめる</label>
        <button class="btn noprint" data-act="print">🖨 印刷</button>
      </div>
      <p class="hint" style="margin-bottom:8px">${view.hoursAll ? '年度末まで、週案と 基本の時間割から 数えた 見こみです。' : `${n0}年4月1日から 今週の 終わり（${jdate(until)}）までの 週案から 数えています。`}授業のない日（休業日・祝日など）は 数えません。${Object.keys(S.standards).length ? '' : '標準時数は「設定」で 入れられます。'}</p>
      <div class="table-wrap"><table class="list jisu-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  /* ---------- 予定の部屋：月の予定 ---------- */
  function viewMonth() {
    const [y, m] = view.month.split('-').map(Number);
    const first = `${y}-${pad(m)}-01`;
    const start = addDays(first, -dayOf(first));
    const t = today();
    let cells = '';
    let d = start;
    for (let i = 0; i < 42; i++) {
      const inMonth = d.slice(0, 7) === view.month;
      if (i === 35 && !inMonth) break;
      const evs = eventsOn(d);
      const hol = holiday(d);
      const w = dayOf(d);
      const cls = ['mday', inMonth ? '' : 'other', w === 0 ? 'sun' : w === 6 ? 'sat' : '', hol ? 'hol' : '', d === t ? 'today' : '', evs.some((e) => e.cat === KYUGYO) ? 'kyugyo' : ''].filter(Boolean).join(' ');
      cells += `<div class="${cls}" data-act="newEvent" data-date="${d}" title="${jdate(d)} に予定を追加">
        <div class="num">${parse(d).getDate()}</div>${hol ? `<div class="hol-name">${esc(hol)}</div>` : ''}${evs.map(evChip).join('')}${trainingsOn(d).map((x) => trainChip(x)).join('')}${tasksDueOn(d).map(taskChip).join('')}</div>`;
      d = addDays(d, 1);
    }
    const monthEvents = list('events')
      .filter((e) => isDate(e.date) && e.date.slice(0, 7) <= view.month && (isDate(e.end) && e.end > e.date ? e.end : e.date).slice(0, 7) >= view.month)
      .sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')));

    return `<div class="toolbar">
        <button class="btn" data-act="monthMove" data-n="-1">◀ 前の月</button>
        <button class="btn" data-act="monthMove" data-n="0">今月</button>
        <button class="btn" data-act="monthMove" data-n="1">次の月 ▶</button>
        <h2 class="wk-title">${wareki(y)}（${y}年）${m}月</h2>
        <span class="grow"></span>
        <label class="btn" title="学校の月行事予定（Excel）を取りこむ">📥 行事予定を取りこむ<input type="file" accept=".xlsx,.xlsm" data-chg="importFile" hidden></label>
        <button class="btn primary" data-act="newEvent" data-date="${view.month === t.slice(0, 7) ? t : first}">＋ 予定を追加</button>
      </div>
      <div class="month">${WD.map((n, i) => `<div class="wd${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${n}</div>`).join('')}${cells}</div>
      <p class="hint" style="margin-top:8px">日付のマスを押すと予定を追加できます。種類を「${KYUGYO}」にした日（運動会の振替休業日など）は、週案でお休みとして表示します。</p>
      <h2 class="sec" style="margin:20px 0 8px">この月の予定（${monthEvents.length}件）</h2>
      ${monthEvents.length ? `<div class="table-wrap"><table class="list"><thead><tr><th>日付</th><th>時刻</th><th>種類</th><th>内容</th><th>メモ</th></tr></thead><tbody>${monthEvents.map((e) => `<tr>
        <td style="white-space:nowrap">${jdate(e.date)}${isDate(e.end) && e.end > e.date ? `〜${jdate(e.end)}` : ''}</td><td>${esc(e.time)}</td>
        <td><span class="chip${catHue(e.cat) < 0 ? ' gray' : ''}" style="--h:${Math.max(catHue(e.cat), 0)};font-size:12px">${esc(e.cat || 'その他')}</span></td>
        <td><button class="btn link" data-act="editEvent" data-id="${esc(e.id)}">${esc(e.title)}</button></td><td class="muted" style="font-size:14px">${nl(e.memo)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty-note">この月の予定はまだありません。</div>'}`;
  }

  function editEvent(id, date) {
    const e = id ? get('events', id) : { date: isDate(date) ? date : today(), cat: '行事' };
    if (!e) return;
    openDialog({
      title: id ? '予定を直す' : '予定を追加',
      body: `<label class="field">内容 <input name="title" required maxlength="200" value="${esc(e.title)}" placeholder="例：職員会議／校外学習／個別の指導計画 提出"></label>
        <div class="row2">
          <label class="field">日付 <input type="date" name="date" required value="${esc(e.date)}"></label>
          <label class="field">終わりの日（何日か続くとき） <input type="date" name="end" value="${esc(e.end)}"></label>
        </div>
        <div class="row2">
          <label class="field">時刻 <input type="time" name="time" value="${esc(e.time)}"></label>
          <label class="field">種類 <select name="cat">${Object.keys(CATS).map((c) => opt(c, e.cat || 'その他')).join('')}</select></label>
        </div>
        <label class="field">メモ <textarea name="memo" rows="3" maxlength="1000">${esc(e.memo)}</textarea></label>
        <p class="hint">「締め切り」はロビーと地球儀に「あと○日」と出ます。提出物は、公務の部屋の「やること」に入れると、終わったらチェックできます。「${KYUGYO}」の日は週案でお休みになります。</p>`,
      deleteLabel: id ? 'この予定を消す' : '',
      onDelete: () => removeRecs('events', id),
      onSave: (f) => {
        if (!isDate(f.date)) return '日付を入れてください。';
        putRecs('events', { id: id || uid('e'), title: f.title.trim(), date: f.date, end: isDate(f.end) && f.end > f.date ? f.end : '', time: f.time, cat: f.cat, memo: f.memo.trim() });
      },
    });
  }

  /* ---------- 予定の部屋：基本の時間割 ---------- */
  function viewTimetable() {
    const rows = S.periods.map((p) => `<tr><th class="pcol">${esc(p.name)}<span class="ptime">${esc(p.start)}〜${esc(p.end)}</span></th>${DAYS.map((d) => {
      const b = baseLesson(d, p.id) || {};
      const h = hueOf(b.subject);
      const outs = outsAt(d, p.id);
      return `<td class="ttcell">
        <select data-chg="tt" data-day="${d}" data-pid="${esc(p.id)}" class="${h < 0 ? 'gray' : ''}" style="--h:${Math.max(h, 0)}" aria-label="${WD[d]}曜日 ${esc(p.name)}の教科">${subjOptions(b.subject || '', '（なし）')}</select>
        <input data-chg="tt" data-day="${d}" data-pid="${esc(p.id)}" value="${esc(b.memo)}" maxlength="200" placeholder="メモ（場所・担当など）" aria-label="${WD[d]}曜日 ${esc(p.name)}のメモ">
        ${outs.length ? `<div class="outs">${outs.map(outChip).join('')}</div>` : ''}</td>`;
    }).join('')}</tr>`).join('');
    return `<p class="hint" style="margin-bottom:10px">ふだんの1週間の時間割です。週案は、この時間割をもとに表示されます。行事などで変わる週は「週案」で直します。校時の名前や時刻は「設定」で変えられます。</p>
      <div class="table-wrap"><table class="week"><thead><tr><th class="pcol">校時</th>${DAYS.map((d) => `<th>${WD[d]}曜日</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function changeTimetable(el) {
    const td = el.closest('td');
    const sel = td.querySelector('select');
    const memo = td.querySelector('input');
    const day = Number(sel.dataset.day), pid = sel.dataset.pid;
    const id = ttId(day, pid);
    const subject = sel.value, m = memo.value.trim();
    const h = hueOf(subject);
    sel.className = h < 0 ? 'gray' : '';
    sel.style.setProperty('--h', Math.max(h, 0));
    if (!subject && !m) removeRecs('timetable', id, { render: false });
    else putRecs('timetable', { id, day, period: pid, subject, memo: m }, { render: false });
  }

  /* ---------- 予定の部屋：交流学級 ---------- */
  function viewKoryu() {
    const kids = children();
    if (!kids.some((k) => k.id === view.childId)) view.childId = kids.length ? kids[0].id : '';
    const sel = get('children', view.childId);

    const overview = S.periods.map((p) => `<tr><th class="pcol">${esc(p.name)}</th>${DAYS.map((d) => {
      const outs = outsAt(d, p.id);
      return `<td>${outs.length ? `<div class="outs" style="margin:0">${outs.map(outChip).join('')}</div><div class="stay">教室に残る：${kids.length - outs.length}人</div>` : ''}</td>`;
    }).join('')}</tr>`).join('');

    const kidRows = kids.map((k) => {
      const n = list('exchange').filter((x) => x.childId === k.id).length;
      return `<tr><td><b>${esc(k.name)}</b></td><td>${esc(k.grade)}</td><td>${esc(k.homeroom)}</td><td>${n} 時間／週</td>
        <td><button class="btn small" data-act="editChild" data-id="${esc(k.id)}">直す</button></td></tr>`;
    }).join('');

    const editor = sel ? S.periods.map((p) => `<tr><th class="pcol">${esc(p.name)}</th>${DAYS.map((d) => {
      const x = get('exchange', xId(sel.id, d, p.id));
      const b = baseLesson(d, p.id);
      return `<td class="xcell${x ? ' on' : ''}" data-act="editX" data-day="${d}" data-pid="${esc(p.id)}" tabindex="0" role="button">
        <div class="base">学級：${b && b.subject ? esc(b.subject) : '—'}</div>
        ${x ? `<div class="xlabel">🚶 ${esc(x.room || sel.homeroom || '交流')}</div><div>${esc(x.subject)}</div>${x.memo ? `<div class="base">${esc(x.memo)}</div>` : ''}` : ''}</td>`;
    }).join('')}</tr>`).join('') : '';

    return `<div class="stack">
      <section class="card">
        <div class="toolbar"><h2 class="sec">🚶 交流の一覧（いつ・だれが・どこへ）</h2></div>
        ${kids.length ? `<p class="hint" style="margin-bottom:8px">何も書いていない時間は、${kids.length}人全員が教室にいます。</p>` : ''}
        ${kids.length ? `<div class="table-wrap"><table class="week"><thead><tr><th class="pcol">校時</th>${DAYS.map((d) => `<th>${WD[d]}曜日</th>`).join('')}</tr></thead><tbody>${overview}</tbody></table></div>`
          : '<div class="empty-note">まず下で、学級の子どもを登録してください。</div>'}
      </section>
      <section class="card">
        <div class="toolbar"><h2 class="sec">🧒 学級の子ども</h2><span class="grow"></span><button class="btn primary" data-act="editChild">＋ 子どもを追加</button></div>
        <p class="hint" style="margin-bottom:8px">名前は、呼び名やイニシャル（例：Aさん）で登録するのがおすすめです。</p>
        ${kids.length ? `<div class="table-wrap"><table class="list"><thead><tr><th>呼び名</th><th>学年</th><th>交流学級</th><th>交流</th><th></th></tr></thead><tbody>${kidRows}</tbody></table></div>` : ''}
      </section>
      ${sel ? `<section class="card">
        <div class="toolbar"><h2 class="sec">✏️ 交流の時間を入れる</h2></div>
        <div class="pills" style="margin-bottom:10px">${kids.map((k) => `<button class="pill${k.id === sel.id ? ' on' : ''}" data-act="pickChild" data-id="${esc(k.id)}">${esc(k.name)}</button>`).join('')}</div>
        <p class="hint" style="margin-bottom:8px">${esc(sel.name)}さんが交流学級へ行く時間のマスを押してください。もう一度押すと、直したり やめたりできます。</p>
        <div class="table-wrap"><table class="week"><thead><tr><th class="pcol">校時</th>${DAYS.map((d) => `<th>${WD[d]}曜日</th>`).join('')}</tr></thead><tbody>${editor}</tbody></table></div>
      </section>` : ''}
    </div>`;
  }

  function editChild(id) {
    const k = id ? get('children', id) : {};
    if (!k) return;
    openDialog({
      title: id ? `${k.name} の情報を直す` : '子どもを追加',
      body: `<label class="field">呼び名 <input name="name" required maxlength="20" value="${esc(k.name)}" placeholder="例：Aさん"></label>
        <div class="row2">
          <label class="field">学年 <select name="grade">${opt('', k.grade || '', '—')}${GRADES.map((g) => opt(g, k.grade)).join('')}</select></label>
          <label class="field">交流学級 <input name="homeroom" maxlength="20" value="${esc(k.homeroom)}" placeholder="例：3年2組"></label>
        </div>
        <label class="field">好きなこと・得意なこと <textarea name="likes" rows="2" maxlength="1000" placeholder="例：電車、パズル。数字を 数えるのが 得意">${esc(k.likes)}</textarea></label>
        <label class="field">配慮・支援のポイント <textarea name="care" rows="3" maxlength="1000" placeholder="例：大きな 音が 苦手（イヤーマフ）。予定の 変更は 絵カードで 前もって 伝える">${esc(k.care)}</textarea></label>
        <label class="field">メモ <textarea name="memo" rows="2" maxlength="500">${esc(k.memo)}</textarea></label>
        <p class="hint">障害名や診断などの くわしい情報は、ここには書かないでください。</p>`,
      deleteLabel: id ? 'この子を消す' : '',
      deleteConfirm: `${k.name} を消します。交流の時間・日々の記録・指導計画・保護者との連絡・申し送りの 記録も すべて 消えます。よろしいですか？`,
      onDelete: () => {
        ['exchange', 'notes', 'goals', 'plans', 'contacts', 'handovers', 'stageLogs'].forEach((kind) => removeRecs(kind, list(kind).filter((x) => x.childId === id).map((x) => x.id), { render: false }));
        // 関係機関との 連絡は 残し、子どもとの つながりだけ はずす
        putRecs('orgLogs', list('orgLogs').filter((x) => x.childId === id).map((x) => ({ id: x.id, childId: '' })), { render: false });
        putRecs('orgs', list('orgs').filter((o) => String(o.childIds || '').split(',').includes(id)).map((o) => ({ id: o.id, childIds: String(o.childIds).split(',').filter((c) => c && c !== id).join(',') })), { render: false });
        removeRecs('children', id);
      },
      onSave: (f) => {
        const order = id ? k.order : Math.max(0, ...list('children').map((c) => Number(c.order) || 0)) + 1;
        const rec = { id: id || uid('c'), name: f.name.trim(), grade: f.grade, homeroom: f.homeroom.trim(), memo: f.memo.trim(), likes: f.likes.trim(), care: f.care.trim(), order };
        if (!id) view.childId = rec.id;
        putRecs('children', rec);
      },
    });
  }

  function editX(day, pid) {
    const k = get('children', view.childId);
    const p = S.periods.find((x) => x.id === pid);
    if (!k || !p) return;
    const id = xId(k.id, day, pid);
    const x = get('exchange', id);
    const b = baseLesson(day, pid);
    openDialog({
      title: `${k.name}　${WD[day]}曜日 ${p.name}`,
      body: `<p class="hint">特別支援学級の時間割：${b && b.subject ? chip(b.subject) : 'なし'}</p>
        <div class="row2">
          <label class="field">交流学級での教科 <input name="subject" list="subj-list" maxlength="20" value="${esc(x ? x.subject : '')}" placeholder="例：音楽"></label>
          <label class="field">行き先 <input name="room" maxlength="20" value="${esc(x ? x.room : k.homeroom)}" placeholder="例：3年2組"></label>
        </div>
        <datalist id="subj-list">${S.subjects.map((s) => `<option value="${esc(s)}">`).join('')}</datalist>
        <label class="field">メモ <input name="memo" maxlength="200" value="${esc(x ? x.memo : '')}" placeholder="例：支援員さん つきそい"></label>`,
      saveLabel: x ? '保存する' : '交流の時間にする',
      deleteLabel: x ? '交流をやめる' : '',
      deleteConfirm: '',
      onDelete: () => removeRecs('exchange', id),
      onSave: (f) => putRecs('exchange', { id, childId: k.id, day, period: pid, subject: f.subject.trim(), room: f.room.trim(), memo: f.memo.trim() }),
    });
  }

  /* ---------- 学習の部屋：単元計画 ---------- */
  function viewUnits() {
    const all = list('units').filter((u) => !view.unitSubj || u.subject === view.unitSubj);
    const sorter = (a, b) => String(a.start || '9999').localeCompare(String(b.start || '9999')) || S.subjects.indexOf(a.subject) - S.subjects.indexOf(b.subject);
    const groups = [['now', '▶ 進行中'], ['next', '⏳ これから（期間が未設定のものも ここ）'], ['done', '✅ おわった単元']];
    const used = Array.from(new Set(list('units').map((u) => u.subject).filter(Boolean)));
    return `<div class="toolbar">
        <select class="input" style="width:auto" data-chg="unitSubj" aria-label="教科でしぼりこむ">${opt('', view.unitSubj, 'すべての教科')}${S.subjects.filter((s) => used.includes(s)).concat(used.filter((s) => !S.subjects.includes(s))).map((s) => opt(s, view.unitSubj)).join('')}</select>
        <span class="grow"></span>
        <button class="btn primary" data-act="editUnit">＋ 単元を追加</button>
      </div>
      <p class="hint">週案で単元を選んだ時間が、自動で「実施した時数」として数えられます（きょうまでは実施、あしたからは予定）。</p>
      ${all.length ? groups.map(([ph, label]) => {
        const us = all.filter((u) => unitPhase(u) === ph).sort(sorter);
        if (!us.length) return '';
        return `<h3 class="group-title">${label}（${us.length}）</h3><div class="cards">${us.map(unitCard).join('')}</div>`;
      }).join('') : '<div class="empty-note" style="margin-top:12px">単元がまだありません。「＋ 単元を追加」から入れてください。</div>'}`;
  }

  function unitCard(u) {
    const st = unitStats(u);
    const mats = list('materials').filter((m) => m.unitId === u.id).length;
    return `<article class="card unit-card" data-act="editUnit" data-id="${esc(u.id)}" tabindex="0" role="button">
      <div class="meta">${chip(u.subject)}<span>📆 ${unitRange(u)}</span>${u.target ? `<span>👥 ${esc(u.target)}</span>` : ''}${mats ? `<span>🧰 教材 ${mats}</span>` : ''}</div>
      <h3>${esc(u.name)}</h3>
      ${progress(u, st)}
      ${u.goal ? `<p class="goal">🎯 ${nl(u.goal)}</p>` : ''}</article>`;
  }

  /* 段階表ここから */
  // スモールステップの 段階表（はじめに 入れておく 内容）。学習指導要領（平成29年告示）の 内容を もとに、1時間で 扱える 大きさに 分けた 目安。
  // 1段階〜3段階：特別支援学校（知的障害）小学部の 段階。小1〜小3：小学校の 学年の 内容。ステップ1〜3：教科の 段階の ない 指導の 目安
  // [段階, 領域, [[めあて, 学習内容], …]]
  const STEP_DEFAULT = {
    ko: ['国語', [
      ['1段階', '聞くこと・話すこと', [['先生の声に気付こう', '名前を呼ばれたら顔を向けたり、手を挙げたりする'], ['読み聞かせを楽しもう', '繰り返しのある絵本を聞き、声や身振りで応じる'], ['「ちょうだい」を伝えよう', '欲しい物を指さし・身振り・声で伝える']]],

  // 段階表の 行（id は 教科ごとの 通し番号）
  function stepRows() {
    const rows = [];
    Object.keys(STEP_DEFAULT).forEach((code) => {
      const [subject, groups] = STEP_DEFAULT[code];
      let n = 0;
      groups.forEach(([stage, area, steps]) => steps.forEach(([aim, content]) => { n++; rows.push({ id: `sk-${code}-${n}`, subject, stage, area, no: n, aim, content }); }));
    });
    return rows;
  }
  /* 段階表ここまで */

  /* ---------- 学習の部屋：スモールステップの 段階表 ---------- */
  const STAGE_ORDER = ['1段階', '2段階', '3段階', '小1', '小2', '小1・2', '小3', 'ステップ1', 'ステップ2', 'ステップ3'];
  const stageRank = (s) => { const i = STAGE_ORDER.indexOf(s); return i < 0 ? 99 : i; };
  const circled = (n) => (n >= 1 && n <= 20 ? String.fromCharCode(0x2460 + n - 1) : `(${n})`);
  function stepsOf(subject) {
    return list('steps').filter((x) => x.subject === subject)
      .sort((a, b) => stageRank(a.stage) - stageRank(b.stage) || String(a.stage).localeCompare(String(b.stage)) || (Number(a.no) || 0) - (Number(b.no) || 0));
  }
  function stagesOf(subject) { return Array.from(new Set(stepsOf(subject).map((x) => x.stage || ''))); }
  function areasOf(subject) {
    return Array.from(new Set(list('steps').filter((x) => x.subject === subject).sort((a, b) => (Number(a.no) || 0) - (Number(b.no) || 0)).map((x) => x.area || '')));
  }
  function stepSubjects() {
    const has = new Set(list('steps').map((x) => x.subject));
    return S.subjects.filter((x) => has.has(x)).concat(Array.from(has).filter((x) => x && !S.subjects.includes(x)));
  }
  const stepBtn = (x) => `<button class="stp" data-act="editStep" data-id="${esc(x.id)}"><b>${esc(S.aimMark || '○')}${esc(x.aim)}</b><small>${esc(x.content)}</small></button>`;
  function viewSteps() {
    if (!list('steps').length) {
      return `<div class="empty-note">段階表が ありません。<br><button class="btn primary" data-act="stepsSeed" style="margin-top:8px">🪜 はじめの 段階表を 入れる</button></div>`;
    }
    const subs = stepSubjects();
    if (!subs.includes(view.stepSubj)) view.stepSubj = subs[0] || '';
    const subj = view.stepSubj;
    const stages = stagesOf(subj), areas = areasOf(subj);
    if (view.stepStage && !stages.includes(view.stepStage)) view.stepStage = '';
    const st = view.stepStage;
    const all = stepsOf(subj);
    const body = st
      ? (kidsAtStage(subj, st).length ? `<p class="hint">この 段階の 子：${kidsAtStage(subj, st).map((k) => esc(k.name)).join('・')}</p>` : '') + areas.map((a) => { const xs = all.filter((x) => x.stage === st && (x.area || '') === a); return xs.length ? `<section class="card"><h3 class="mini" style="margin:0 0 6px">${esc(a || '（領域なし）')}</h3><div class="stp-list">${xs.map(stepBtn).join('')}</div></section>` : ''; }).join('')
      : `<div class="table-wrap"><table class="list steps-table"><thead><tr><th>領域</th>${stages.map((s) => `<th>${esc(s)}${kidsAtStage(subj, s).map((k) => `<span class="kid-mini">${esc(k.name)}</span>`).join('')}</th>`).join('')}</tr></thead><tbody>
          ${areas.map((a) => `<tr><th>${esc(a || '（領域なし）')}</th>${stages.map((s) => `<td>${all.filter((x) => x.stage === s && (x.area || '') === a).map(stepBtn).join('')}</td>`).join('')}</tr>`).join('')}
        </tbody></table></div>`;
    return `<div class="toolbar noprint">
        <select class="input" style="width:auto" data-chg="stepSubj" aria-label="教科">${subs.map((x) => opt(x, subj)).join('')}</select>
        <select class="input" style="width:auto" data-chg="stepStageView" aria-label="段階">${opt('', st, 'すべての段階（一覧表）')}${stages.map((s) => opt(s, st)).join('')}</select>
        <span class="grow"></span>
        <button class="btn" data-act="print">🖨 印刷</button>
        <button class="btn primary" data-act="editStep">＋ ステップを追加</button>
      </div>
      <h2 class="wk-title print-only">${esc(subj)} 段階表</h2>
      <p class="hint noprint">1段階〜3段階は 特別支援学校（知的障害）小学部の 段階、小1〜小3は 小学校の 学年の 内容です。学習指導要領を もとに、1時間で 扱える 大きさに 分けた 目安です。押すと 直したり、単元の「めあて・学習内容」に 入れたり できます。週案の マスからも 選べます。</p>
      <div class="stack" id="step-view">${body}</div>
      <p class="hint noprint" style="margin-top:10px"><button class="btn small" data-act="stepsSeed">↺ はじめの 段階表で 足りない ものを 足す</button></p>`;
  }
  function editStep(id) {
    const x = id ? get('steps', id) : { subject: view.stepSubj || S.subjects[0] || '', stage: view.stepStage || '' };
    if (!x) return;
    const subj = x.subject;
    const units = list('units').filter((u) => u.subject === subj);
    openDialog({
      title: id ? 'ステップを 直す' : 'ステップを 追加',
      body: `<div class="row2">
          <label class="field">教科 <select name="subject">${subjOptions(subj)}</select></label>
          <label class="field">段階 <input name="stage" list="stage-list" maxlength="20" value="${esc(x.stage)}" placeholder="例：2段階"></label>
        </div>
        <datalist id="stage-list">${STAGE_ORDER.map((s) => `<option value="${esc(s)}">`).join('')}</datalist>
        <div class="row2">
          <label class="field">領域 <input name="area" list="area-list" maxlength="40" value="${esc(x.area)}"></label>
          <label class="field">並び順 <input type="number" name="no" min="1" max="9999" value="${esc(x.no || Math.max(0, ...list('steps').filter((s) => s.subject === subj).map((s) => Number(s.no) || 0)) + 1)}"></label>
        </div>
        <datalist id="area-list">${areasOf(subj).map((a) => `<option value="${esc(a)}">`).join('')}</datalist>
