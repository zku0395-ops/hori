        <div class="mat-act">${url ? `<a class="btn primary small" href="${esc(url)}" target="_blank" rel="noopener noreferrer">開く ↗</a>` : ''}<button class="btn small" data-act="editMat" data-id="${esc(m.id)}">直す</button></div>
      </article>`;
    }).join('')}</div>`;
  }

  function editMat(id) {
    const m = id ? get('materials', id) : { subject: view.matSubj, kind: view.matKind || 'プリント' };
    if (!m) return;
    const units = list('units').sort((a, b) => S.subjects.indexOf(a.subject) - S.subjects.indexOf(b.subject) || String(a.start).localeCompare(String(b.start)));
    openDialog({
      title: id ? '教材を直す' : '教材を追加',
      body: `<label class="field">名前 <input name="name" required maxlength="100" value="${esc(m.name)}" placeholder="例：ひらがな なぞりプリント（あ行）"></label>
        <div class="row2">
          <label class="field">教科 <select name="subject">${subjOptions(m.subject || '', '—')}</select></label>
          <label class="field">種類 <select name="kind">${Object.keys(MAT_KINDS).map((k) => opt(k, m.kind || 'その他', MAT_KINDS[k] + ' ' + k)).join('')}</select></label>
        </div>
        <label class="field">リンク（URL） <input type="url" name="url" maxlength="1000" value="${esc(m.url)}" placeholder="https://drive.google.com/…"></label>
        <label class="field">使う単元 <select name="unitId">${opt('', m.unitId || '', '（えらばない）')}${units.map((u) => opt(u.id, m.unitId, `［${u.subject}］${u.name}`)).join('')}</select></label>
        <label class="field">メモ <textarea name="memo" rows="3" maxlength="1000" placeholder="例：Aさん用に文字を大きくした版あり">${esc(m.memo)}</textarea></label>`,
      deleteLabel: id ? 'この教材を消す' : '',
      onDelete: () => removeRecs('materials', id),
      onSave: (f) => {
        const url = f.url.trim();
        if (url && !safeUrl(url)) return 'リンクは https:// で始まるものを入れてください。';
        putRecs('materials', { id: id || uid('m'), name: f.name.trim(), subject: f.subject, kind: f.kind, url, unitId: f.unitId, memo: f.memo.trim() });
      },
    });
  }

  /* ---------- 設定 ---------- */
  function viewSettings() {
    const ps = view.periodsDraft || S.periods;
    return `<div class="stack" style="max-width:820px">
      <section class="card">
        <h2 class="sec" style="margin-bottom:10px">🏷 学級名</h2>
        <div class="toolbar" style="margin:0"><input class="input" id="set-class" maxlength="40" value="${esc(S.className)}" placeholder="例：ひまわり学級" style="max-width:360px"><button class="btn primary" data-act="saveClass">保存する</button></div>
      </section>
      <section class="card">
        <h2 class="sec" style="margin-bottom:10px">🕘 校時と時刻</h2>
        <div class="table-wrap"><table class="list ptable"><thead><tr><th>名前</th><th>はじまり</th><th>おわり</th><th></th></tr></thead><tbody>
          ${ps.map((p, i) => `<tr data-pid="${esc(p.id)}">
            <td><input class="input" data-f="name" value="${esc(p.name)}" maxlength="20" aria-label="校時の名前"></td>
            <td><input class="input" type="time" data-f="start" value="${esc(p.start)}" aria-label="はじまり"></td>
            <td><input class="input" type="time" data-f="end" value="${esc(p.end)}" aria-label="おわり"></td>
            <td style="white-space:nowrap"><button class="btn small" data-act="periodMove" data-i="${i}" data-n="-1" ${i === 0 ? 'disabled' : ''} aria-label="上へ">↑</button>
              <button class="btn small" data-act="periodMove" data-i="${i}" data-n="1" ${i === ps.length - 1 ? 'disabled' : ''} aria-label="下へ">↓</button>
              <button class="btn small danger" data-act="periodDel" data-i="${i}" aria-label="消す">✕</button></td></tr>`).join('')}
        </tbody></table></div>
        <div class="toolbar" style="margin:10px 0 0"><button class="btn" data-act="periodAdd">＋ 校時を足す</button><span class="grow"></span>
          ${view.periodsDraft ? '<span class="tag red">まだ保存していません</span><button class="btn" data-act="periodCancel">もとにもどす</button>' : ''}
          <button class="btn primary" data-act="periodSave">保存する</button></div>
        <p class="hint" style="margin-top:8px">「朝の会」「帰りの会」なども足せます。消した校時に入れていた時間割や週案は、表示されなくなります（もう一度同じ校時を足しても もどりません）。</p>
      </section>
      <section class="card">
        <h2 class="sec" style="margin-bottom:10px">📚 教科・領域</h2>
        <label class="field">1行に1つずつ書きます。並び順が、色や表示の順番になります。
          <textarea class="input" id="set-subjects" rows="10">${esc(S.subjects.join('\n'))}</textarea></label>
        <div class="toolbar" style="margin:10px 0 0"><span class="grow"></span><button class="btn primary" data-act="saveSubjects">保存する</button></div>
      </section>
      <section class="card">
        <h2 class="sec" style="margin-bottom:10px">💾 データの保存場所</h2>
        ${IN_GAS ? `<p style="margin:0 0 8px">データは、学校のGoogleアカウントの スプレッドシートに保存しています。</p>
            ${safeUrl(meta.sheetUrl) ? `<a class="btn" href="${esc(meta.sheetUrl)}" target="_blank" rel="noopener noreferrer">スプレッドシートを開く ↗</a>` : ''}
            <p class="hint" style="margin-top:8px">シートは見るのは自由ですが、書きかえは この画面から行ってください。</p>`
          : `<p style="margin:0 0 8px">いまは試作モードです。データはこの端末のブラウザにだけ保存されています。</p>
            <div class="toolbar" style="margin:0"><button class="btn" data-act="demoReset" data-sample="1">サンプルを入れなおす</button><button class="btn danger" data-act="demoReset" data-sample="">試作データをすべて消す</button></div>`}
      </section>
    </div>`;
  }

  function readPeriodRows() {
    return Array.from(document.querySelectorAll('.ptable tbody tr')).map((tr) => ({
      id: tr.dataset.pid,
      name: tr.querySelector('[data-f=name]').value.trim(),
      start: tr.querySelector('[data-f=start]').value,
      end: tr.querySelector('[data-f=end]').value,
    }));
  }

  /* ---------- 準備中の 部屋 ---------- */
  function viewSoon(room) {
    return `<section class="card soon-room">
      <div class="big">${room.icon}</div>
      <h2>${esc(room.name)}は じゅんび中です</h2>
      <p>この部屋に入れるものの案です。どれから作るか、相談しながら決めましょう。</p>
      <ul>${room.ideas.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>
      <div><button class="btn" data-act="go" data-room="lobby">🏠 ロビーにもどる</button></div>
    </section>`;
  }

  /* =========================================================
     ダイアログ
     ========================================================= */
  let dlg = null;
  function openDialog(o) {
    const el = document.getElementById('dlg');
    dlg = o;
    el.innerHTML = `<form id="dlgForm" ${o.attrs || ''}>
      <header><h2>${esc(o.title)}</h2><button type="button" class="x" data-act="dlgClose" aria-label="閉じる">✕</button></header>
      <div class="dlg-body">${o.body}<p class="hint" id="dlgMsg" role="alert" style="color:var(--danger)"></p></div>
      <footer>${o.readOnly ? `<span class="grow"></span><button type="button" class="btn primary" data-act="dlgClose">閉じる</button>`
        : `${o.deleteLabel ? `<button type="button" class="btn danger" data-act="dlgDelete">${esc(o.deleteLabel)}</button>` : ''}<span class="grow"></span>
        <button type="button" class="btn" data-act="dlgClose">やめる</button>
        <button type="submit" class="btn primary">${esc(o.saveLabel || '保存する')}</button>`}</footer></form>`;
    el.showModal();
    const first = el.querySelector('.dlg-body input:not([type=hidden]), .dlg-body select, .dlg-body textarea');
    if (first) first.focus();
    else el.querySelector('footer .btn').focus();
  }
  function closeDialog() {
    const el = document.getElementById('dlg');
    if (el.open) el.close();
    dlg = null;
  }

  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'dlgForm' || !dlg || dlg.readOnly) { e.preventDefault(); return; }
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const o = dlg;
    closeDialog();
    const msg = o.onSave(f);
    if (typeof msg === 'string') {
      // 入力に 足りない ところが あれば もう一度 開く
      openDialog(o);
      const form = document.getElementById('dlgForm');
      Object.keys(f).forEach((k) => { const field = form.elements[k]; if (field) field.value = f[k]; });
      if (form.elements.subject && form.elements.subject.dataset.chg === 'lessonSubj') { CHANGES.lessonSubj(form.elements.subject); form.elements.unitId.value = f.unitId; }
      document.getElementById('dlgMsg').textContent = msg;
    }
  });

  /* =========================================================
     ボタンや 入力の 動き
     ========================================================= */
  const ACTIONS = {
    go: (d) => { view.room = d.room; view.periodsDraft = null; render(); window.scrollTo(0, 0); },
    goTab: (d) => { view.room = d.room; view.tab[d.room] = d.tab; render(); window.scrollTo(0, 0); },
    tab: (d) => { view.tab[d.room] = d.tab; render(); },
    reload: () => { if (confirm('スプレッドシートから読み込み直します。保存できなかった変更は消えます。よろしいですか？')) location.reload(); },
    print: () => window.print(),
    weekMove: (d) => { view.week = Number(d.n) ? addDays(view.week, Number(d.n)) : mondayOf(today()); render(); },
    tomorrow: () => showTomorrow(),
    openWeek: (d) => { closeDialog(); view.room = 'yotei'; view.tab.yotei = 'week'; view.week = mondayOf(d.date); render(); window.scrollTo(0, 0); },
    monthMove: (d) => {
      const n = Number(d.n);
      if (!n) view.month = today().slice(0, 7);
      else { const [y, m] = view.month.split('-').map(Number); const x = new Date(y, m - 1 + n, 1); view.month = x.getFullYear() + '-' + pad(x.getMonth() + 1); }
      render();
    },
    newEvent: (d) => editEvent('', d.date),
    editEvent: (d) => editEvent(d.id),
    editLesson: (d) => editLesson(d.date, d.pid),
    editChild: (d) => editChild(d.id || ''),
    pickChild: (d) => { view.childId = d.id; render(); },
    editX: (d) => editX(Number(d.day), d.pid),
    editUnit: (d) => editUnit(d.id || ''),
    editMat: (d) => editMat(d.id || ''),
    dlgClose: () => closeDialog(),
    dlgDelete: () => {
      if (!dlg) return;
      const o = dlg;
      const text = o.deleteConfirm === undefined ? `「${o.title}」を消します。よろしいですか？` : o.deleteConfirm;
      if (text && !confirm(text)) return;
      closeDialog();
      o.onDelete();
    },
    saveClass: () => saveSettings({ className: document.getElementById('set-class').value.trim() }),
    saveSubjects: () => {
      const subs = Array.from(new Set(document.getElementById('set-subjects').value.split('\n').map((s) => s.trim()).filter((s) => s && s !== NONE)));
      if (!subs.length) { alert('教科を1つ以上入れてください。'); return; }
      saveSettings({ subjects: subs });
    },
    periodMove: (d) => {
      const ps = readPeriodRows();
      const i = Number(d.i), j = i + Number(d.n);
      if (j < 0 || j >= ps.length) return;
      [ps[i], ps[j]] = [ps[j], ps[i]];
      view.periodsDraft = ps; render();
    },
    periodDel: (d) => {
      const ps = readPeriodRows();
      if (ps.length <= 1) { alert('校時は1つ以上必要です。'); return; }
      ps.splice(Number(d.i), 1);
      view.periodsDraft = ps; render();
    },
    periodAdd: () => {
      const ps = readPeriodRows();
      const used = new Set(ps.map((p) => p.id).concat(S.periods.map((p) => p.id)));
      let n = 1;
      while (used.has(String(n))) n++;
      ps.push({ id: String(n), name: '', start: '', end: '' });
      view.periodsDraft = ps; render();
      const inputs = document.querySelectorAll('.ptable [data-f=name]');
      if (inputs.length) inputs[inputs.length - 1].focus();
    },
    periodCancel: () => { view.periodsDraft = null; render(); },
    periodSave: () => {
      const ps = readPeriodRows();
      if (ps.some((p) => !p.name)) { alert('校時の名前を入れてください。'); return; }
      view.periodsDraft = null;
      saveSettings({ periods: ps });
    },
    demoReset: (d) => {
      if (!confirm(d.sample ? 'サンプルのデータを入れなおします。いまの試作データは消えます。よろしいですか？' : '試作データをすべて消します。よろしいですか？')) return;
      api.reset(!!d.sample);
      boot();
    },
  };

  const CHANGES = {
    tt: changeTimetable,
    weekJump: (el) => { if (isDate(el.value)) { view.week = mondayOf(el.value); render(); } },
    unitSubj: (el) => { view.unitSubj = el.value; render(); },
    matSubj: (el) => { view.matSubj = el.value; render(); },
    matKind: (el) => { view.matKind = el.value; render(); },
    lessonSubj: (el) => {
      const form = el.form;
      const date = form.dataset.date;
      const subject = el.value === NONE ? '' : (el.value || form.dataset.base);
      form.elements.unitId.innerHTML = unitOptions(subject, date, autoUnit(subject, date));
    },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act];
    if (!fn) return;
    e.preventDefault();
    fn(el.dataset, el);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target;
    if (el.matches && el.matches('[role=button][data-act]')) { e.preventDefault(); el.click(); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-chg]');
    if (el && CHANGES[el.dataset.chg]) CHANGES[el.dataset.chg](el);
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.inp === 'matQ') {
      view.matQ = el.value;
      const box = document.getElementById('mat-list');
      if (box) box.innerHTML = materialList();
    }
  });
  window.addEventListener('beforeunload', (e) => { if (pending) { e.preventDefault(); e.returnValue = ''; } });

  /* =========================================================
     はじまり
     ========================================================= */
  async function boot() {
    try {
      const data = await api.load();
      S = mergeSettings(data.settings);
      KINDS.forEach((k) => { T[k] = new Map(((data.tables || {})[k] || []).filter((r) => r && r.id).map((r) => [String(r.id), r])); });
      meta.sheetUrl = data.sheetUrl || '';
      lastError = null;
      render();
    } catch (err) {
      console.error(err);
      document.getElementById('app').innerHTML = `<div class="fatal">⚠️<div>職員室のデータを読みこめませんでした。</div>
        <div style="font-size:14px">${esc(err && err.message ? err.message : err)}</div>
        <button class="btn primary" onclick="location.reload()">もう一度読みこむ</button></div>`;
    }
  }

  /* =========================================================
     試作モードの サンプル（きょうの日付に 合わせて 作る）
     ========================================================= */
  function sampleData() {
    const t = today();
    const mon = mondayOf(t);
    const tt = {
      1: ['日常生活の指導', '国語', '算数', '生活単元学習', '生活単元学習', ''],
      2: ['日常生活の指導', '算数', '国語', '体育', '図工', '自立活動'],
      3: ['日常生活の指導', '国語', '算数', '音楽', '学級活動', ''],
      4: ['日常生活の指導', '算数', '国語', '生活単元学習', '体育', '自立活動'],
      5: ['日常生活の指導', '国語', '算数', '図工', '図工', ''],
    };
    const timetable = [];
    Object.keys(tt).forEach((d) => tt[d].forEach((s, i) => { if (s) timetable.push({ id: ttId(d, String(i + 1)), day: Number(d), period: String(i + 1), subject: s, memo: s === '体育' ? '体育館' : s === '日常生活の指導' ? '朝の会・着がえ' : '' }); }));
    const children = [
      { id: 'cA', name: 'Aさん', grade: '2年', homeroom: '2年1組', order: 1, memo: '' },
      { id: 'cB', name: 'Bさん', grade: '3年', homeroom: '3年2組', order: 2, memo: '' },
      { id: 'cC', name: 'Cさん', grade: '4年', homeroom: '4年1組', order: 3, memo: '' },
    ];
    const ex = [['cB', 1, '4', '音楽'], ['cC', 2, '4', '体育'], ['cA', 3, '4', '音楽'], ['cC', 3, '5', '学級活動'], ['cB', 4, '5', '体育'], ['cC', 5, '4', '図工'], ['cA', 5, '5', '図工']];
    const exchange = ex.map(([c, d, p, s]) => ({ id: xId(c, d, p), childId: c, day: d, period: p, subject: s, room: children.find((k) => k.id === c).homeroom, memo: c === 'cA' ? '支援員さん つきそい' : '' }));
    const units = [
      { id: 'u1', subject: '国語', name: '「おおきな かぶ」を音読しよう', start: addDays(mon, -14), end: addDays(mon, 18), hours: 16, target: '全員', goal: '役になりきって、はっきりした声で音読する。', memo: '音読はかせ（ステージ5）も使う' },
      { id: 'u2', subject: '算数', name: 'ながさくらべ', start: addDays(mon, -7), end: addDays(mon, 21), hours: 12, target: 'Aさん・Bさん', goal: '2つのものの長さを、はしをそろえてくらべる。', memo: '' },
      { id: 'u3', subject: '生活単元学習', name: '秋を みつけよう', start: mon, end: addDays(mon, 25), hours: 12, target: '全員', goal: '校庭で秋の自然を見つけ、絵や写真で友だちに伝える。', memo: '雨の日は図書室で図鑑' },
      { id: 'u4', subject: '自立活動', name: '気持ちを ことばで 伝えよう', start: addDays(mon, -30), end: addDays(mon, 60), hours: 15, target: '全員', goal: '困ったときに「手伝ってください」と伝える。', memo: '' },
      { id: 'u5', subject: '図工', name: 'ちぎり絵で つくろう', start: addDays(mon, 28), end: addDays(mon, 45), hours: 6, target: '全員', goal: '', memo: '' },
    ];
    const contents = {
      u1: ['範読を聞いて、登場人物を確かめる', '「うんとこしょ どっこいしょ」を みんなで', '役に分かれて音読する', '音読はかせで 録音して ふりかえる'],
      u2: ['えんぴつと クレヨンの 長さくらべ', 'はしを そろえて くらべる', 'テープで 長さを うつしとる'],
      u3: ['秋みつけの めあてを 決める', '校庭で どんぐり・落ち葉を さがす', '見つけたものを 絵に かく'],
      u4: ['「てつだってください」カードの 練習'],
    };
    const weekly = [];
    const counter = {};
    for (let d = addDays(mon, -14); d <= addDays(mon, 4); d = addDays(d, 1)) {
      const w = dayOf(d);
      if (w === 0 || w === 6 || holiday(d)) continue;
      (tt[w] || []).forEach((s, i) => {
        const u = units.find((x) => x.subject === s && x.start <= d && d <= x.end && contents[x.id]);
        if (!u) return;
        const n = counter[u.id] = (counter[u.id] || 0) + 1;
        const list = contents[u.id];
        weekly.push({ id: wkId(d, String(i + 1)), date: d, period: String(i + 1), subject: '', unitId: u.id, content: list[(n - 1) % list.length], note: '' });
      });
    }
    // 予定は 土日・祝日を さけて 入れる
    const schoolDay = (n) => { let d = addDays(t, n); while (dayOf(d) === 0 || dayOf(d) === 6 || holiday(d)) d = addDays(d, 1); return d; };
    let evNo = 0;
    const ev = (n, title, cat, time, memo) => ({ id: 'e' + (++evNo), date: schoolDay(n), end: '', time: time || '', title, cat, memo: memo || '' });
    const events = [
      ev(0, '職員会議', '会議', '15:40', '議題：後期の行事について'),
      ev(2, '個別の指導計画（後期）の見直し 提出', '締め切り', '', '教頭先生へ'),
      ev(6, '校外学習（動物園）', '行事', '08:30', '雨天時は翌日'),
      ev(8, '保護者面談（Aさん）', '保護者', '15:30'),
      ev(12, '交流学級の担任と打ち合わせ', '交流', '15:45'),
      ev(15, '特別支援教育コーディネーター研修', '出張', '13:30', '午後から出張。補欠は教務へ'),
      ev(20, '開校記念日', KYUGYO),
    ];
    const materials = [
      { id: 'm-ondoku', name: 'おんどくはかせの ちょうせんじょう', subject: '国語', kind: 'アプリ', url: ONDOKU_URL, unitId: 'u1', memo: '自作の音読アプリ。全員の記録は「音読はかせ 記録」のスプレッドシートで見られます。' },
      { id: 'm2', name: 'ひらがな なぞりプリント（あ行〜な行）', subject: '国語', kind: 'プリント', url: '', unitId: '', memo: '文字を大きくした版あり' },
      { id: 'm3', name: '長さくらべ 絵カード', subject: '算数', kind: '絵カード・写真', url: '', unitId: 'u2', memo: '' },
      { id: 'm4', name: 'きもちカード（うれしい・こまった・いや）', subject: '自立活動', kind: '絵カード・写真', url: '', unitId: 'u4', memo: '' },
      { id: 'm5', name: '秋の しぜん 写真スライド', subject: '生活単元学習', kind: 'スライド', url: '', unitId: 'u3', memo: '' },
    ];
    return { settings: { className: 'ひまわり学級（サンプル）' }, tables: { events, timetable, weekly, children, exchange, units, materials } };
  }

  boot();
  setInterval(() => { const el = document.getElementById('holo'); if (el && S) el.innerHTML = holoHtml(); }, 30000);
  </script>
