<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホーせんぱいと おうちさがし たんていだん</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'BIZ UDPGothic', sans-serif; background: #fef9ec; margin: 0; color: #1e293b;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      word-break: keep-all; overflow-wrap: anywhere; }
    .btn3d { border-bottom-width: 6px; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; }
    .pop { animation: pop .45s cubic-bezier(.17,.89,.32,1.28) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floaty { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .shake { animation: shake .4s 2; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25%,75% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
    .glow { animation: glow 1.1s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 14px rgba(250,204,21,0); } }
    .answer3d { animation: answer3d 1s ease-in-out infinite; }
    @keyframes answer3d { 0%,100% { filter: drop-shadow(0 0 10px #facc15) drop-shadow(0 0 26px #fde047); } 50% { filter: drop-shadow(0 0 4px #facc15); } }
    .walk { animation: walk .32s ease-in-out infinite; }
    @keyframes walk { 0%,100% { translate: 0 0; } 50% { translate: 0 -9px; } }
    .bob { animation: floaty 1.2s ease-in-out infinite; }
    .answer { animation: answer 1s ease-in-out infinite; }
    @keyframes answer { 0%,100% { box-shadow: 0 0 0 4px #facc15, 0 0 18px 6px rgba(250,204,21,.9); } 50% { box-shadow: 0 0 0 4px #fde047, 0 0 30px 14px rgba(250,204,21,.35); } }
    .sticker { animation: sticker .9s cubic-bezier(.17,.89,.32,1.28) both; }
    @keyframes sticker { 0% { transform: scale(2.4) rotate(-25deg); opacity: 0; } 60% { transform: scale(.9) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(-4deg); } }
    .bubble { position: relative; }
    .bubble:before { content: ''; position: absolute; left: 28px; top: -14px; border: 8px solid transparent; border-bottom: 8px solid #fff; }
    .paper { background-image: linear-gradient(#fde68a55 1px, transparent 1px); background-size: 100% 2.2rem; }
    mark.kw { background: #fde047; color: #b91c1c; border-radius: 6px; padding: 0 3px; }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#92400e;font-weight:bold;">じゅんび ちゅう…</div>
  </div>

  <!-- データと絵は GitHub Pages から読みこみます（このファイルを短くするため） -->
  <script>
    (function () {
      var h = location.hostname;
      var local = location.protocol === 'file:' || /github\.io$/.test(h) || h === 'localhost' || h === '127.0.0.1';
      window.OUCHI_BASE = local ? '' : 'https://zku0395-ops.github.io/hori/ouchisagashi/';
      var V = '3';
      window.OUCHI_READY = new Promise(function (ok, ng) {
        var s = document.createElement('script');
        s.src = window.OUCHI_BASE + 'data/data.js?v=' + V;
        s.onload = ok; s.onerror = function () { ng(new Error('data/data.js')); };
        document.head.appendChild(s);
      });
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo } = React;
    const APP_VERSION = '1.2.0';
    const BASE = window.OUCHI_BASE;
    const IMG = BASE + 'img/';
    let D = null, HAS_IMG = new Set();

    // =====================================================================
    //  1. 小さな道具
    // =====================================================================
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const pad = (n) => String(n).padStart(2, '0');
    const nowStr = () => { const d = new Date(); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const safeStore = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
    };
    const downloadText = (name, text, type) => {
      const blob = new Blob([text], { type: type || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    };
    const plain = (s) => String(s).replace(/[【】]/g, '');
    const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '－';
    const rateColor = (a, b) => !b ? '' : a / b < 0.6 ? 'bg-red-200' : a / b < 0.8 ? 'bg-yellow-200' : 'bg-green-200';

    // =====================================================================
    //  2. こえ と おと
    // =====================================================================
    const Speech = {
      rate: 0.8, voice: null,
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd, pitch) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = pitch || 1;
          let done = false;
          const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
          u.onend = end; u.onerror = end;
          // 声が出ない端末でも先へ進めるように、長さに合わせて待つ
          setTimeout(end, 1500 + text.length * 260 / this.rate);
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() { try { this.ok && window.speechSynthesis.cancel(); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }
    const PITCH_HO = 0.85, PITCH_RES = 1.3;
    const sayP = (text, pitch) => new Promise(r => Speech.say(text, r, pitch));

    const Sound = {
      on: true, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      tone(freq, at, dur, type = 'triangle', vol = 0.16) {
        const c = this.get(); if (!c || !this.on) return;
        const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      // このアプリのための オリジナルの おと
      found() { [[587, 0], [740, .12], [880, .24], [1175, .4]].forEach(([f, t]) => this.tone(f, t, .22, 'triangle', .16)); },
      big() { [[523, 0], [659, .15], [784, .3], [1046, .5], [784, .75], [1046, .9]].forEach(([f, t]) => this.tone(f, t, .22, 'triangle', .17)); [523, 659, 784, 1046].forEach(f => this.tone(f, 1.15, 1.0, 'triangle', .11)); },
      retry() { this.tone(330, 0, .14, 'sine', .06); this.tone(294, .12, .2, 'sine', .06); }, // まちがえたとき（小さな音）
      tap() { this.tone(660, 0, .06, 'sine', .07); },
      hint() { [523, 659].forEach((f, i) => this.tone(f, i * .1, .18, 'sine', .09)); },
      erase() { this.tone(440, 0, .1, 'sine', .05); },
    };

    // =====================================================================
    //  3. 絵（自作の SVG と 絵文字。ChatGPT の 絵が とどいたら その 絵を つかう）
    // =====================================================================
    // 1まいに ならべた 絵（シート）から 1こ ぶんを 出す
    function Sprite({ file, i, cols, rows, className, style }) {
      const c = i % cols, r = Math.floor(i / cols);
      return <div className={className} style={{ ...style, backgroundImage: `url(${IMG + file})`, backgroundRepeat: 'no-repeat',
        backgroundSize: `${cols * 100}% ${rows * 100}%`, backgroundPosition: `${cols > 1 ? c / (cols - 1) * 100 : 0}% ${rows > 1 ? r / (rows - 1) * 100 : 0}%` }} />;
    }
    const Emo = ({ x, y, s, children }) => <text x={x} y={y} fontSize={s} textAnchor="middle" dominantBaseline="central">{children}</text>;
    function TreeArt({ kind, x, y }) { // x,y は ねもと
      const crown = kind === 'sakura' ? '#f9a8d4' : '#22c55e';
      const dot = kind === 'apple' ? '#dc2626' : kind === 'mikan' ? '#f97316' : '#fdf2f8';
      return <g transform={`translate(${x},${y})`}>
        <rect x="-3" y="-22" width="6" height="22" fill="#92400e" />
        <circle cx="0" cy="-34" r="16" fill={crown} stroke="#166534" strokeWidth={kind === 'sakura' ? 0 : 1} />
        {[[-7, -38], [6, -40], [0, -30], [-9, -28], [9, -28]].map(([a, b], i) => <circle key={i} cx={a} cy={b} r={kind === 'sakura' ? 2 : 3.4} fill={dot} />)}
      </g>;
    }
    function CarArt({ color, x, y }) { // x,y は まんなかの した
      return <g transform={`translate(${x},${y})`}>
        <path d="M-11 -13 L-7 -22 H7 L11 -13 Z" fill={color} stroke="#1e293b" strokeWidth="1.2" />
        <rect x="-17" y="-14" width="34" height="10" rx="3" fill={color} stroke="#1e293b" strokeWidth="1.2" />
        <path d="M-6 -20 H-1 V-14 H-9 Z M1 -20 H6 L9 -14 H1 Z" fill="#e0f2fe" />
        <circle cx="-9" cy="-3" r="4.2" fill="#1e293b" /><circle cx="9" cy="-3" r="4.2" fill="#1e293b" />
        <circle cx="-9" cy="-3" r="1.6" fill="#cbd5e1" /><circle cx="9" cy="-3" r="1.6" fill="#cbd5e1" />
      </g>;
    }
    // いえ（やね・かべ・にわの もの・のりもの）。ななめ上から 見た 立体的な かたち。viewBox 180×120
    function HouseSvg({ h }) {
      const g = D.GARDEN[h.garden], v = D.VEHICLE[h.vehicle], wall = D.WALL[h.wall], roof = D.ROOF[h.roof];
      const ln = { stroke: '#334155', strokeWidth: 1.6, strokeLinejoin: 'round' };
      return <svg viewBox="0 0 180 120" className="w-full h-full block">
        <ellipse cx="92" cy="106" rx="80" ry="9" fill="#00000018" />
        {g.e.indexOf('tree:') === 0 ? <TreeArt kind={g.e.slice(5)} x={28} y={106} /> : <Emo x={28} y={84} s={36}>{g.e}</Emo>}
        {/* よこの かべ（かげ） */}
        <path d="M112 60 L136 48 V92 L112 104 Z" fill={wall} {...ln} /><path d="M112 60 L136 48 V92 L112 104 Z" fill="#0f172a" opacity=".22" />
        <rect x="58" y="60" width="54" height="44" fill={wall} {...ln} />
        {/* やね（よこ・まえ） */}
        <path d="M85 24 L109 12 L142 48 L118 62 Z" fill={roof} {...ln} /><path d="M85 24 L109 12 L142 48 L118 62 Z" fill="#0f172a" opacity=".2" />
        <path d="M52 62 L85 24 L118 62 Z" fill={roof} {...ln} />
        {h.window === 'まる' ? <circle cx="71.5" cy="78" r="8" fill="#e0f2fe" stroke="#fff" strokeWidth="2.4" /> : h.window === 'さんかく' ? <path d="M71.5 68 L81 86 H62 Z" fill="#e0f2fe" stroke="#fff" strokeWidth="2.4" strokeLinejoin="round" /> : <rect x="63.5" y="70" width="16" height="16" fill="#e0f2fe" stroke="#fff" strokeWidth="2.4" />}
        <rect x="88" y="76" width="14" height="28" rx="1.5" fill={D.DOOR[h.door] || '#a16207'} {...ln} strokeWidth="1.2" /><circle cx="99" cy="91" r="1.4" fill="#fff" />
        <path d="M118 70 L130 64 V78 L118 84 Z" fill="#e0f2fe" opacity=".85" stroke="#334155" strokeWidth="1" />
        {v.e.indexOf('car:') === 0 ? <g transform="translate(156,108) scale(1.15)"><CarArt color={v.e.slice(4)} x={0} y={0} /></g> : <Emo x={156} y={90} s={32}>{v.e}</Emo>}
      </svg>;
    }
    function HouseArt({ h }) {
      const f = 'h_' + h.id + '.webp';
      if (HAS_IMG.has(f)) return <img src={IMG + f} alt="" draggable="false" className="w-full h-full block" style={{ objectFit: 'contain', objectPosition: 'bottom', filter: 'drop-shadow(0 8px 6px #0004)' }} />;
      return <HouseSvg h={h} />;
    }
    // めじるし
    function MarkArt({ m }) {
      let art;
      if (HAS_IMG.has('m_' + m.id + '.webp')) return <img src={IMG + 'm_' + m.id + '.webp'} alt="" draggable="false" className="w-full h-full" style={{ objectFit: 'contain' }} />;
      if (m.e === 'pond') art = <svg viewBox="0 0 60 60" className="w-full h-full"><ellipse cx="30" cy="38" rx="26" ry="14" fill="#38bdf8" stroke="#0369a1" strokeWidth="2" /><ellipse cx="22" cy="35" rx="8" ry="3" fill="#bae6fd" /></svg>;
      else if (m.e === 'lighthouse') art = <svg viewBox="0 0 60 60" className="w-full h-full"><path d="M22 56 L26 20 H34 L38 56 Z" fill="#fff" stroke="#334155" strokeWidth="2" /><path d="M24.5 34 H35.5 L36.6 44 H23.4 Z" fill="#ef4444" /><rect x="24" y="11" width="12" height="9" fill="#fde047" stroke="#334155" strokeWidth="2" /><path d="M22 11 L30 3 L38 11 Z" fill="#ef4444" stroke="#334155" strokeWidth="2" /></svg>;
      else if (m.e === 'windmill') art = <svg viewBox="0 0 60 60" className="w-full h-full"><path d="M22 56 L26 26 H34 L38 56 Z" fill="#fde68a" stroke="#334155" strokeWidth="2" /><g stroke="#334155" strokeWidth="2" fill="#fff"><path d="M30 24 L26 4 H34 Z" /><path d="M30 24 L50 20 V28 Z" /><path d="M30 24 L34 44 H26 Z" /><path d="M30 24 L10 28 V20 Z" /></g><circle cx="30" cy="24" r="3" fill="#ef4444" /></svg>;
      else art = <div className="w-full h-full flex items-center justify-center" style={{ fontSize: '2em', lineHeight: 1 }}>{m.e}</div>;
      return art;
    }
    // じゅうにん
    function Face({ h, size }) {
      const f = 'r_' + h.id + '.webp';
      if (HAS_IMG.has(f)) return <img src={IMG + f} alt="" draggable="false" className="rounded-full bg-white border-4 border-amber-300" style={{ width: size, height: size, objectFit: 'cover', objectPosition: 'center 20%' }} />;
      return <div className="rounded-full bg-white border-4 border-amber-300 flex items-center justify-center" style={{ width: size, height: size, fontSize: size * 0.6, lineHeight: 1 }}>{h.face}</div>;
    }
    // たんてい（しゅじんこう）。90×130
    function Hero() {
      if (HAS_IMG.has('hero.webp')) return <img src={IMG + 'hero.webp'} alt="" draggable="false" style={{ width: 130, height: 188, objectFit: 'contain', objectPosition: 'bottom', filter: 'drop-shadow(0 6px 4px #0005)' }} />;
      return <svg viewBox="0 0 90 130" width="130" height="188">
        <ellipse cx="45" cy="124" rx="26" ry="6" fill="#00000030" />
        <rect x="31" y="96" width="11" height="26" rx="5" fill="#1e3a8a" /><rect x="48" y="96" width="11" height="26" rx="5" fill="#1e3a8a" />
        <path d="M22 62 Q45 50 68 62 L72 102 H18 Z" fill="#d6a15c" stroke="#334155" strokeWidth="2" strokeLinejoin="round" />
        <path d="M45 58 V102" stroke="#334155" strokeWidth="1.5" /><circle cx="50" cy="72" r="2" fill="#334155" /><circle cx="50" cy="84" r="2" fill="#334155" />
        <circle cx="45" cy="38" r="22" fill="#fcd9b6" stroke="#334155" strokeWidth="2" />
        <circle cx="37" cy="40" r="3" fill="#1e293b" /><circle cx="53" cy="40" r="3" fill="#1e293b" /><path d="M39 48 Q45 53 51 48" fill="none" stroke="#1e293b" strokeWidth="2" strokeLinecap="round" />
        <path d="M22 30 Q45 2 68 30 Z" fill="#b45309" stroke="#334155" strokeWidth="2" /><path d="M14 31 Q45 22 76 31 Q45 37 14 31 Z" fill="#92400e" stroke="#334155" strokeWidth="2" />
        <circle cx="74" cy="84" r="9" fill="#e0f2fe" fillOpacity=".8" stroke="#334155" strokeWidth="3" /><path d="M67 91 L60 99" stroke="#334155" strokeWidth="4" strokeLinecap="round" />
      </svg>;
    }
    // ホーせんぱい（フクロウの たんてい）
    function Ho({ mood = 'normal', size = 120, className = '' }) {
      const f = 'ho_' + mood + '.webp';
      if (HAS_IMG.has(f)) return <img src={IMG + f} alt="" className={className} style={{ width: size, height: size, objectFit: 'contain' }} draggable="false" />;
      const eye = (cx) => mood === 'happy'
        ? <path d={`M${cx - 9} 52 Q${cx} 42 ${cx + 9} 52`} fill="none" stroke="#1e293b" strokeWidth="3.5" strokeLinecap="round" />
        : <g><circle cx={cx} cy="50" r="12" fill="#fff" stroke="#1e293b" strokeWidth="2" /><circle cx={cx + (mood === 'think' ? 3 : 0)} cy={mood === 'think' ? 46 : 50} r="5.5" fill="#1e293b" /><circle cx={cx + 2} cy="47" r="1.8" fill="#fff" /></g>;
      return <svg viewBox="0 0 120 120" width={size} height={size} className={className}>
        <ellipse cx="60" cy="74" rx="38" ry="40" fill="#a16207" stroke="#1e293b" strokeWidth="2.5" />
        <ellipse cx="60" cy="84" rx="24" ry="26" fill="#fde68a" />
        {[[52, 76], [68, 76], [60, 88], [50, 98], [70, 98]].map(([x, y], i) => <path key={i} d={`M${x - 4} ${y} Q${x} ${y + 5} ${x + 4} ${y}`} fill="none" stroke="#b45309" strokeWidth="2" />)}
        <circle cx="45" cy="50" r="16" fill="#fef3c7" /><circle cx="75" cy="50" r="16" fill="#fef3c7" />
        {eye(45)}{eye(75)}
        <path d="M55 60 L60 70 L65 60 Z" fill="#f59e0b" stroke="#1e293b" strokeWidth="1.5" />
        <path d="M24 78 Q14 92 26 104 Q34 92 30 78 Z" fill="#854d0e" stroke="#1e293b" strokeWidth="2" />
        <path d="M96 78 Q106 92 94 104 Q86 92 90 78 Z" fill="#854d0e" stroke="#1e293b" strokeWidth="2" />
        {/* たんていの ぼうし */}
        <path d="M30 34 Q60 2 90 34 Z" fill="#b45309" stroke="#1e293b" strokeWidth="2.5" />
        <path d="M22 36 Q60 26 98 36 Q60 42 22 36 Z" fill="#92400e" stroke="#1e293b" strokeWidth="2" />
        <path d="M45 20 L75 20 M40 27 L80 27" stroke="#fde68a" strokeWidth="2" /><circle cx="60" cy="12" r="4" fill="#fde68a" stroke="#1e293b" strokeWidth="1.5" />
        {/* むしめがね */}
        <circle cx="98" cy="96" r="10" fill="#e0f2fe" fillOpacity=".8" stroke="#1e293b" strokeWidth="3" /><path d="M105 104 L114 114" stroke="#1e293b" strokeWidth="5" strokeLinecap="round" />
        <path d="M70 112 l6 4 M50 112 l-6 4" stroke="#f59e0b" strokeWidth="4" strokeLinecap="round" />
      </svg>;
    }
    // ぶん（【 】の ことばに いろを つける）
    function Marked({ text, on }) {
      const parts = String(text).split(/【|】/);
      return <span>{parts.map((p, i) => i % 2 === 1 && on ? <mark key={i} className="kw">{p}</mark> : <span key={i}>{p}</span>)}</span>;
    }
    const Btn = ({ color = 'sky', className = '', children, ...rest }) => {
      const c = { sky: 'bg-sky-500 border-sky-700 text-white', green: 'bg-green-500 border-green-700 text-white', amber: 'bg-amber-400 border-amber-600 text-amber-950',
        gray: 'bg-slate-200 border-slate-400 text-slate-700', white: 'bg-white border-slate-300 text-slate-700', red: 'bg-red-500 border-red-700 text-white', purple: 'bg-violet-500 border-violet-700 text-white' }[color];
      return <button {...rest} className={`btn3d rounded-2xl font-bold disabled:opacity-40 ${c} ${className}`}>{children}</button>;
    };

    // =====================================================================
    //  4. しんちょく
    // =====================================================================
    const newProgress = () => ({ t: 0, clear: {}, stickers: [], solved: 0, part: null, unlockAll: false, hatten: false, flagT: 0 });
    const parseProgress = (s) => { let p = null; try { p = JSON.parse(s || 'null'); } catch (e) {} const n = newProgress(); return p && typeof p === 'object' ? { ...n, ...p, clear: p.clear || {}, stickers: p.stickers || [] } : n; };
    const mainStages = () => D.STAGES.filter(s => !s.hatten);
    const isCleared = (p, st) => (p.clear[st.id] || 0) > 0;
    const stageOpen = (p, st) => {
      if (st.hatten) return !!p.hatten;
      if (p.unlockAll) return true;
      const ms = mainStages(), i = ms.findIndex(s => s.id === st.id);
      return i <= 0 || isCleared(p, ms[i - 1]);
    };
    const currentStage = (p) => { const ms = mainStages(); return ms.find(s => !isCleared(p, s)) || ms[ms.length - 1]; };
    const areaName = (st) => st.area === 'all' ? 'いろいろな ばしょ' : D.area(st.area).n;

    // =====================================================================
    //  5. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    const LOG_HEADER = ['日時', 'なまえ', 'ステージ', 'もん', 'ばしょ', 'じゅうにん', 'ヒントの ぶん', 'けっか', 'まちがい', 'ヒント', 'まちがえた いえ', 'まちがいの しゅるい', 'よみあげ', 'びょう', 'ID'];
    const DEFAULT_SETTINGS = { rate: 0.8, font: 1, read: true, sound: true, map: true, wide: true };
    const KIND_ORDER = ['やね', 'かべ', 'ドア', 'まど', 'にわ', 'のりもの', 'みち', 'となり（めじるし）', 'となり（いえ）', 'むかい', 'みぎ／ひだり', 'なんけんめ', 'あいだ', 'うちけし', 'うちけし（2つ）', 'いらない ぶん'];

    // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
    const emptyStu = () => ({ count: 0, ok: 0, miss: 0, hint: 0, last: '', stages: {}, kinds: {}, lens: {} });
    function aggregate(rows) {
      const students = {}, classKinds = {};
      rows.forEach(r => {
        const name = String(r[1] || '').trim(); if (!name) return;
        const st = String(r[2]), ok = r[7] === '○' ? 1 : 0, miss = Number(r[8]) || 0, hint = Number(r[9]) || 0;
        const s = students[name] || (students[name] = emptyStu());
        const day = String(r[0]).slice(0, 10);
        if (day > s.last) s.last = day;
        s.count++; s.ok += ok; s.miss += miss; s.hint += hint ? 1 : 0;
        const g = s.stages[st] || (s.stages[st] = [0, 0, 0]); g[0]++; g[1] += ok; g[2] += miss;
        const ks = String(r[6] || '').split('・').filter(Boolean);
        const len = ks.filter(k => k !== 'いらない ぶん').length;
        const l = s.lens[len] || (s.lens[len] = [0, 0]); l[0]++; l[1] += ok;
        ks.forEach(k => { const a = s.kinds[k] || (s.kinds[k] = [0, 0]); a[0]++; const c = classKinds[k] || (classKinds[k] = [0, 0]); c[0]++; });
        String(r[11] || '').split('・').filter(Boolean).forEach(k => { const a = s.kinds[k] || (s.kinds[k] = [0, 0]); a[1]++; const c = classKinds[k] || (classKinds[k] = [0, 0]); c[1]++; });
      });
      return { students, classKinds };
    }

    const Local = {
      key: 'ouchi_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}
        this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: { ...DEFAULT_SETTINGS } };
        return this.mem;
      },
      save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
    };
    const PENDING_KEY = 'ouchi_pending_v1';
    const COPY_KEY = (name) => 'ouchi_copy_' + name;
    const recRow = (stamp, name, r) => [stamp, name, r.stage, r.q, r.area, r.who, r.kinds, r.result, r.miss, r.hint, r.wrongs, r.wkinds, r.read, r.secs, r.id];
    const api = {
      async init() {
        if (HAS_GAS) return gas('getInitData');
        const d = Local.data();
        return { students: d.roster, settings: { ...DEFAULT_SETTINGS, ...d.settings }, demo: true };
      },
      async student(name) {
        if (HAS_GAS) return gas('getStudent', name);
        return Local.data().progress[name] || '';
      },
      async sendOne(p) {
        if (HAS_GAS) return gas('saveResult', p);
        const d = Local.data();
        const old = parseProgress(d.progress[p.name]), neu = parseProgress(p.progress);
        if (neu.t >= old.t) {
          if (old.flagT && old.flagT > (neu.t || 0)) { neu.unlockAll = !!old.unlockAll; neu.hatten = !!old.hatten; neu.flagT = old.flagT; }
          d.progress[p.name] = JSON.stringify(neu);
        }
        const ids = new Set(d.log.map(r => r[14]));
        p.records.forEach(r => { if (!ids.has(r.id)) d.log.push(recRow(p.stamp, p.name, r)); });
        Local.save();
        return { ok: true };
      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす
      readQueue() { try { return JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) { return []; } },
      async save(payload) {
        const queue = api.readQueue().filter(q => !(q.name === payload.name && !q.records.length));
        queue.push({ ...payload, qid: uid() });
        safeStore.set(PENDING_KEY, JSON.stringify(queue));
        return api.flush();
      },
      pending() { return api.readQueue().reduce((n, q) => n + q.records.length, 0); },
      flushing: false,
      async flush() {
        if (api.flushing) return;
        api.flushing = true;
        try {
          for (let q = api.readQueue()[0]; q; q = api.readQueue()[0]) {
            await api.sendOne(q);
            safeStore.set(PENDING_KEY, JSON.stringify(api.readQueue().filter(x => x.qid !== q.qid)));
          }
        } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
        finally { api.flushing = false; }
      },
      async teacher(pin) {
        if (HAS_GAS) return gas('getTeacherData', pin);
        const d = Local.data();
        if (String(pin) !== String(d.pin)) return { ok: false };
        const agg = aggregate(d.log);
        return {
          ok: true, isDefaultPin: d.pin === '1234', demo: true, settings: { ...DEFAULT_SETTINGS, ...d.settings },
          students: d.roster.map(n => ({ name: n, progress: d.progress[n] || '', ...(agg.students[n] || emptyStu()) })),
          classKinds: agg.classKinds,
        };
      },
      async setFlag(pin, name, key, val) {
        if (HAS_GAS) return gas('setFlag', pin, name, key, val);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p[key] = !!val; p.t = Date.now(); p.flagT = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async saveSettings(pin, s) {
        if (HAS_GAS) return gas('saveSettings', pin, s);
        const d = Local.data(); const { newPin, ...rest } = s;
        d.settings = { ...d.settings, ...rest }; if (newPin) d.pin = newPin; Local.save(); return { ok: true };
      },
      async logRows(pin) {
        if (HAS_GAS) return gas('getLogRows', pin);
        return { ok: true, rows: [LOG_HEADER, ...Local.data().log] };
      },
      async backup(pin) {
        if (HAS_GAS) return gas('getBackup', pin);
        const d = Local.data(); return { ok: true, data: { app: 'ouchisagashi', roster: d.roster.map(n => [n, d.progress[n] || '']), settings: d.settings } };
      },
      async restore(pin, data) {
        if (HAS_GAS) return gas('restoreBackup', pin, data);
        if (!data || data.app !== 'ouchisagashi') return { ok: false };
        const d = Local.data(); (data.roster || []).forEach(([n, p]) => { if (!d.roster.includes(n)) d.roster.push(n); d.progress[n] = p; }); Local.save(); return { ok: true };
      },
      async clear(pin, name) {
        if (HAS_GAS) return gas('clearRecords', pin, name);
        const d = Local.data();
        d.log = d.log.filter(r => name && r[1] !== name);
        (name ? [name] : d.roster).forEach(n => { delete d.progress[n]; });
        Local.save(); return { ok: true };
      },
    };
