    // =====================================================================
    //  7. まち（ななめ上から 見た まちを あるいて さがす）
    // =====================================================================
    // town：{ cells:[{ house か mark, r:みち, s:'u' おくがわ / 'd' てまえがわ, c:ます }], roads:みちの かず, slots:ますの かず }
    // wide：ひろい まち（みちが くねくね まがり、いえの あいだが 広く、行きどまりの こみちが ある）
    const HW = 420, HH = 280;
    const BG_TW = 2560, BG_TH = 1150; // はいけいの 絵を ならべる 大きさ（絵の 下 3分の2 ほどが じめん）
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const DECO = ['ido', 'benchi', 'iwa', 'taru', 'kirikabu', 'gaito'];
    const DECO_E = { ido: '🪣', benchi: '🪑', iwa: '🪨', taru: '🛢️', kirikabu: '🪵', gaito: '🏮' };
    function makeWorld(town, wide) {
      const { cells, roads: nR, slots: S } = town;
      const SW = wide ? 640 : 520, MX = wide ? 340 : 240, AMP = wide ? 85 : 0;
      const W = MX * 2 + S * SW;
      const hasD = (r) => cells.some(c => c.r === r && c.s === 'd');
      // みちの たかさ：てまえがわに いえが ある みちの 下は、広く あける
      const rel = []; let y = HH + AMP;
      for (let r = 0; r < nR; r++) { rel.push(y); y += 60 + (hasD(r) ? HH + 50 : 0) + HH + AMP * 2 + (wide ? 80 : 0); }
      const total = rel[nR - 1] + AMP + (hasD(nR - 1) ? HH + 190 : 140);
      const TOP = Math.round(total * 0.15), H = total + TOP;
      const roadY = (r, x) => TOP + rel[r] + AMP * (0.75 * Math.sin(x / 270 + r * 2.1) + 0.25 * Math.sin(x / 97 + r * 1.3));
      const X0 = MX - 150, X1 = W - MX + 150;
      const slotX = (c) => MX + c * SW + SW / 2;
      const placed = cells.map(c => {
        const x = slotX(c.c), yr = roadY(c.r, x);
        return { ...c, x, by: c.s === 'u' ? yr - 26 : yr + 44 + (c.mark ? 240 : HH) };
      });
      // たての みち（みちと みちを つなぐ）
      const links = [];
      for (let b = 0; b < nR - 1; b++) {
        const ks = S >= 4 ? [0, wide && b % 2 === 0 && S >= 5 ? 3 : Math.floor(S / 2), S] : [0, S];
        ks.forEach((k, j) => {
          const x = k === 0 ? MX - 40 : k === S ? W - MX + 40 : MX + k * SW;
          links.push({ x, r0: b, r1: b + 1, y0: roadY(b, x), y1: roadY(b + 1, x), bend: wide && k > 0 && k < S ? (b % 2 ? 40 : -40) : 0 });
        });
      }
      // 行きどまりの こみち（ひろい まちだけ）：あいて いる ますに、かざりの ある こみちを つくる
      if (wide) {
        let n = 0;
        for (let r = 0; r < nR; r++) for (let c = 0; c < S; c++) {
          if (cells.some(k => k.r === r && k.s === 'u' && k.c === c)) continue;
          const x = slotX(c), yr = roadY(r, x);
          links.push({ x, r0: null, r1: r, y0: yr - 200, y1: yr, bend: 0, dead: true, deco: DECO[(n++ + r) % DECO.length] });
        }
      }
      const linkX = (L, y) => L.x + (L.bend ? L.bend * Math.sin(Math.PI * (y - L.y0) / (L.y1 - L.y0)) : 0);
      return { W, H, TOP, nR, S, roadY, X0, X1, cells: placed, links, linkX };
    }
    function DecoArt({ id }) {
      if (HAS_IMG.has('d_' + id + '.webp')) return <img src={IMG + 'd_' + id + '.webp'} alt="" draggable="false" className="w-full h-full" style={{ objectFit: 'contain', objectPosition: 'bottom', filter: 'drop-shadow(0 6px 4px #0004)' }} />;
      return <div className="w-full h-full flex items-end justify-center" style={{ fontSize: 110, lineHeight: 1.1 }}>{DECO_E[id]}</div>;
    }

    // まちの 絵（ちずでも つかう）
    function WorldLayer({ world, area, colored, stateOf, onHouse, shakeId, near, onInspect, isMap, children }) {
      const { W, H, TOP, nR, roadY, X0, X1, cells, links, linkX } = world;
      const bgImg = HAS_IMG.has('bg_' + area.id + '.webp');
      const roadColor = (r) => colored ? D.ROADS[r].c : area.road;
      const paths = useMemo(() => {
        const road = (r) => { let d = ''; for (let x = X0; x <= X1; x += 40) d += (d ? ' L' : 'M') + x + ' ' + Math.round(roadY(r, x)); return d; };
        const link = (L) => { let d = ''; for (let i = 0; i <= 12; i++) { const y = L.y0 + (L.y1 - L.y0) * i / 12; d += (d ? ' L' : 'M') + Math.round(linkX(L, y)) + ' ' + Math.round(y); } return d; };
        return { roads: Array.from({ length: nR }, (_, r) => road(r)), links: links.map(link) };
      }, [world]);
      const op = bgImg && !colored ? .8 : .92, k = isMap ? 1.7 : 1;
      return (
        <div className="absolute left-0 top-0" style={{ width: W, height: H, background: `linear-gradient(${area.sky} 0, ${area.sky} ${TOP - 40}px, ${area.ground} ${TOP + 30}px)` }}>
          {/* はいけい：じめんは、絵の 下の ぶぶんを かがみうつしに ならべる（広い まちでも もようが 大きく ならないように）。上には とおくの けしき */}
          {bgImg && Array.from({ length: Math.ceil(H / (BG_TH - 2)) }, (_, j) => Array.from({ length: Math.ceil(W / (BG_TW - 2)) }, (_, i) => (
            <div key={i + '-' + j} className="absolute" style={{ left: i * (BG_TW - 2), top: j * (BG_TH - 2), width: BG_TW, height: BG_TH, backgroundRepeat: 'no-repeat', transform: `scale(${i % 2 ? -1 : 1}, ${j % 2 ? -1 : 1})`, backgroundImage: `linear-gradient(#ffffff33,#ffffff33), url(${IMG}bg_${area.id}.webp)`, backgroundSize: `${BG_TW}px ${Math.round(BG_TW * 2 / 3)}px`, backgroundPosition: `0 ${-(Math.round(BG_TW * 2 / 3) - BG_TH)}px` }} />
          )))}
          {bgImg && <div className="absolute left-0 top-0" style={{ width: W, height: Math.round(W / 9) + 120, backgroundImage: `linear-gradient(#ffffff33,#ffffff33), url(${IMG}bg_${area.id}.webp)`, backgroundSize: `${W}px auto`, backgroundPosition: 'top', WebkitMaskImage: 'linear-gradient(#000 0, #000 55%, transparent 100%)', maskImage: 'linear-gradient(#000 0, #000 55%, transparent 100%)' }} />}
          <svg width={W} height={H} className="absolute left-0 top-0 pointer-events-none" style={{ zIndex: 1 }} fill="none" strokeLinecap="round" strokeLinejoin="round">
            {/* てまえがわの いえへ つづく こみち */}
            {cells.filter(c => c.s === 'd').map((c, i) => <path key={'p' + i} d={`M${c.x} ${roadY(c.r, c.x)} V${c.by - 70}`} stroke={roadColor(c.r)} strokeWidth="60" opacity={op} />)}
            {/* たての みち・行きどまりの こみち */}
            {paths.links.map((d, i) => <path key={'l' + i} d={d} stroke={area.road} strokeWidth={links[i].dead ? 64 : 80} opacity={bgImg ? .72 : .92} />)}
            {/* よこの みち */}
            {paths.roads.map((d, r) => <g key={'r' + r}>
              <path d={d} stroke="#00000030" strokeWidth="96" transform="translate(0,8)" />
              <path d={d} stroke={roadColor(r)} strokeWidth="96" opacity={op} />
              <path d={d} stroke="#ffffffcc" strokeWidth="5" strokeDasharray="26 24" strokeLinecap="butt" />
            </g>)}
          </svg>
          {/* みちの なまえ */}
          {colored && paths.roads.map((_, r) => [0.14, 0.5, 0.86].map(f => { const x = X0 + (X1 - X0) * f; return (
            <div key={r + '-' + f} className="absolute bg-white rounded-full font-bold text-slate-800 border-4 flex items-center justify-center pointer-events-none" style={{ left: x - 120 * k, top: roadY(r, x) - 26 * k, width: 240 * k, height: 52 * k, fontSize: 30 * k, borderColor: D.ROADS[r].c, zIndex: 1 }}>{D.ROADS[r].n}</div>
          ); }))}
          {/* 行きどまりの かざり */}
          {links.filter(L => L.dead).map((L, i) => <div key={'d' + i} className="absolute pointer-events-none" style={{ left: L.x - 100, top: L.y0 - 170, width: 200, height: 200, zIndex: 2 }}><DecoArt id={L.deco} /></div>)}
          {/* いえ と めじるし */}
          {cells.map((c, i) => {
            if (c.mark) return (
              <div key={'m' + i} className="absolute flex flex-col items-center justify-end pointer-events-none" style={{ left: c.x - 130, top: c.by - 230, width: 260, height: 230, zIndex: 2 }}>
                <div style={{ width: 230, height: 190, fontSize: 64 }}><MarkArt m={c.mark} /></div>
                <div className="font-bold bg-white rounded-xl px-4 border-2 border-slate-300 whitespace-nowrap" style={{ fontSize: 30 * (isMap ? 1.6 : 1) }}>{c.mark.n}</div>
              </div>
            );
            const h = c.house, stt = stateOf(h), off = stt === 'wrong' || stt === 'out';
            return (
              <div key={h.id} className={`absolute ${shakeId === h.id ? 'shake' : ''}`} style={{ left: c.x - HW / 2, top: c.by - HH, width: HW, height: HH, zIndex: 2 }}>
                <button disabled={off} onClick={(e) => { e.stopPropagation(); onHouse(h); }} aria-label="いえ" className={`w-full h-full block ${off ? 'opacity-30' : stt === 'answer' ? 'answer3d' : 'active:scale-95'}`} style={{ transition: 'transform .1s' }}>
                  <HouseArt h={h} />
                </button>
                {stt === 'wrong' && <div className="absolute inset-0 flex items-center justify-center font-bold text-red-500 pointer-events-none" style={{ fontSize: 170, lineHeight: 1 }}>✕</div>}
                {near && near.indexOf(h.id) >= 0 && !off && onInspect && <button onClick={(e) => { e.stopPropagation(); onInspect(h); }} className="bob absolute left-1/2 btn3d rounded-full bg-green-500 border-green-700 text-white font-bold whitespace-nowrap px-6 py-2" style={{ top: c.s === 'u' ? -60 : HH - 30, marginLeft: -120, width: 240, fontSize: 34, zIndex: 5 }}>🔍 しらべる</button>}
              </div>
            );
          })}
          {children}
        </div>
      );
    }

    function Town({ town, wide, area, colored, stateOf, onInspect, active, allowMap, mapSignal, shakeId }) {
      const world = useMemo(() => makeWorld(town, wide), [town, wide]);
      const vpRef = useRef(null), layerRef = useRef(null), meRef = useRef(null), heroRef = useRef(null);
      // pos：いま いる ところ。loc は、よこの みち（road）か たての みち（link）か
      const pos = useRef(null);
      if (!pos.current) { const r = world.nR - 1, x = world.X0 + 130; pos.current = { x, y: world.roadY(r, x), loc: { t: 'road', r } }; }
      const cam = useRef(null), path = useRef([]), goal = useRef(null), keys = useRef({}), nearRef = useRef('');
      const [near, setNear] = useState([]);
      const [map, setMap] = useState(false);
      const [size, setSize] = useState({ w: 800, h: 560 });
      const live = useRef({});
      live.current = { active, map, size, onInspect, stateOf };

      useEffect(() => {
        const el = vpRef.current; if (!el) return;
        const set = () => setSize({ w: el.clientWidth, h: el.clientHeight });
        set();
        const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(set) : null;
        if (ro) ro.observe(el); else window.addEventListener('resize', set);
        return () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', set); };
      }, []);
      useEffect(() => { if (mapSignal) setMap(true); }, [mapSignal]);

      const fit = Math.min(size.w / world.W, size.h / world.H);
      const scale = Math.max(fit, size.h / 1000);
      const scaleRef = useRef(scale); scaleRef.current = scale;
      const XA = world.X0 + 50, XB = world.X1 - 50;

      // みちじゅん：いまの ところから、みち tr の x=tx まで
      const route = (tr, tx) => {
        const P = pos.current, items = [];
        let cr, cx;
        if (P.loc.t === 'link') {
          const L = world.links[P.loc.i], up = !L.dead && tr <= L.r0;
          items.push({ t: 'link', i: P.loc.i, y: up ? L.y0 : L.y1 }); cr = up ? L.r0 : L.r1; cx = L.x;
        } else { cr = P.loc.r; cx = P.x; }
        while (cr !== tr) {
          const dir = tr > cr ? 1 : -1, top = Math.min(cr, cr + dir);
          let bi = -1, bd = Infinity;
          world.links.forEach((L, i) => { if (L.dead || L.r0 !== top) return; const d = Math.abs(cx - L.x) + Math.abs(tx - L.x); if (d < bd) { bd = d; bi = i; } });
          if (bi < 0) break;
          const L = world.links[bi];
          items.push({ t: 'road', r: cr, x: L.x }); items.push({ t: 'link', i: bi, y: dir > 0 ? L.y1 : L.y0 });
          cr += dir; cx = L.x;
        }
        items.push({ t: 'road', r: tr, x: tx });
        return items;
      };
      const cellOf = (h) => world.cells.find(c => c.house === h);
      const walkToHouse = (h) => {
        if (!live.current.active) return;
        const at = cellOf(h); if (!at) return;
        Sound.tap();
        if (nearRef.current.split(',').indexOf(h.id) >= 0) { path.current = []; live.current.onInspect(h); return; }
        goal.current = h; path.current = route(at.r, at.x);
      };
      const onGround = (e) => {
        if (!live.current.active || live.current.map) return;
        const rect = vpRef.current.getBoundingClientRect(), sc = scaleRef.current, c = cam.current || { x: 0, y: 0 };
        const x = (e.clientX - rect.left) / sc + c.x, y = (e.clientY - rect.top) / sc + c.y;
        goal.current = null;
        // 行きどまりの こみち
        const sp = world.links.findIndex(L => L.dead && Math.abs(x - L.x) < 110 && y > L.y0 - 180 && y < L.y1 - 60);
        if (sp >= 0) { const L = world.links[sp]; path.current = route(L.r1, L.x).concat([{ t: 'link', i: sp, y: L.y0 }]); return; }
        const tx = clamp(x, XA, XB);
        let r = 0; for (let i = 1; i < world.nR; i++) if (Math.abs(y - world.roadY(i, tx)) < Math.abs(y - world.roadY(r, tx))) r = i;
        path.current = route(r, tx);
      };

      // うごかす（1コマ ごと）
      useEffect(() => {
        let raf, last = performance.now();
        const face = (d) => { if (d && meRef.current) meRef.current.dataset.face = d < 0 ? '-1' : '1'; };
        const tick = (now) => {
          const dt = Math.min(0.05, (now - last) / 1000); last = now;
          const L0 = live.current, P = pos.current, k = keys.current, v = 470 * dt, sc = scaleRef.current;
          const enterRoad = (r) => { P.loc = { t: 'road', r }; P.y = world.roadY(r, P.x); };
          const settle = () => { if (P.loc.t !== 'link') return; const L = world.links[P.loc.i]; if (P.y >= L.y1 - 1) { P.x = L.x; enterRoad(L.r1); } else if (L.r0 !== null && P.y <= L.y0 + 1) { P.x = L.x; enterRoad(L.r0); } };
          let moving = false;
          if (L0.active && !L0.map) {
            const dx = (k.right ? 1 : 0) - (k.left ? 1 : 0), dy = (k.down ? 1 : 0) - (k.up ? 1 : 0);
            if (dx || dy) {
              path.current = []; goal.current = null;
              if (P.loc.t === 'road') {
                const r = P.loc.r;
                let mx = dx;
                if (dy) {
                  // ちかくの たての みちに 入る。とおい ときは、そこまで よこに あるく
                  let bi = -1, bd = Infinity;
                  world.links.forEach((L, i) => { if ((dy < 0 ? L.r1 : L.r0) !== r) return; const d = Math.abs(P.x - L.x); if (d < bd) { bd = d; bi = i; } });
                  if (bi >= 0 && bd < Math.max(v, 6)) { const L = world.links[bi]; P.loc = { t: 'link', i: bi }; P.x = L.x; P.y = dy < 0 ? L.y1 : L.y0; mx = 0; moving = true; }
                  else if (bi >= 0 && !dx) mx = world.links[bi].x > P.x ? 1 : -1;
                  if (bi >= 0 && !dx && P.loc.t === 'road' && bd <= v) { P.x = world.links[bi].x; mx = 0; moving = true; }
                }
                if (mx && P.loc.t === 'road') { P.x = clamp(P.x + mx * v, XA, XB); P.y = world.roadY(r, P.x); face(mx); moving = true; }
              } else {
                const L = world.links[P.loc.i];
                if (dy) { P.y = clamp(P.y + dy * v, L.y0, L.y1); P.x = world.linkX(L, P.y); moving = true; if ((dy > 0 && P.y >= L.y1) || (dy < 0 && P.y <= L.y0)) settle(); }
                else if (dx) { if (L.y1 - P.y < 110) { P.x = L.x; enterRoad(L.r1); } else if (L.r0 !== null && P.y - L.y0 < 110) { P.x = L.x; enterRoad(L.r0); } }
              }
            } else if (path.current.length) {
              moving = true;
              const t = path.current[0];
              if (t.t === 'road') {
                if (P.loc.t !== 'road' || P.loc.r !== t.r) P.loc = { t: 'road', r: t.r };
                const d = t.x - P.x; face(d);
                if (Math.abs(d) <= v) { P.x = t.x; path.current.shift(); } else P.x += Math.sign(d) * v;
                P.y = world.roadY(t.r, P.x);
              } else {
                const L = world.links[t.i]; P.loc = { t: 'link', i: t.i };
                const d = t.y - P.y;
                if (Math.abs(d) <= v) { P.y = t.y; path.current.shift(); } else P.y += Math.sign(d) * v;
                P.x = world.linkX(L, P.y);
              }
              if (!path.current.length) { settle(); if (goal.current) { const h = goal.current; goal.current = null; L0.onInspect(h); } }
            } else settle();
          }
          // ちかくの いえ（みちの 両がわ）
          const ids = P.loc.t === 'road' ? world.cells.filter(c => c.house && c.r === P.loc.r && Math.abs(P.x - c.x) < 200).map(c => c.house.id) : [];
          const key = ids.join(',');
          if (key !== nearRef.current) { nearRef.current = key; setNear(ids); }
          // カメラ
          const vw = L0.size.w / sc, vh = L0.size.h / sc;
          const tx = world.W <= vw ? -(vw - world.W) / 2 : clamp(P.x - vw / 2, 0, world.W - vw);
          const ty = world.H <= vh ? -(vh - world.H) / 2 : clamp(P.y - vh * 0.58, 0, world.H - vh);
          if (!cam.current) cam.current = { x: tx, y: ty };
          cam.current.x += (tx - cam.current.x) * Math.min(1, dt * 7); cam.current.y += (ty - cam.current.y) * Math.min(1, dt * 7);
          if (layerRef.current) layerRef.current.style.transform = `translate(${-cam.current.x * sc}px, ${-cam.current.y * sc}px) scale(${sc})`;
          if (meRef.current) { meRef.current.style.transform = `translate(${P.x - 65}px, ${P.y - 180}px)`; meRef.current.style.zIndex = 3; }
          if (heroRef.current) { heroRef.current.className = moving ? 'walk' : ''; heroRef.current.style.transform = `scaleX(${meRef.current && meRef.current.dataset.face === '-1' ? -1 : 1})`; }
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [world]);

      // キーボードの やじるし
      useEffect(() => {
        const M = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
        const dn = (e) => { if (M[e.key]) { keys.current[M[e.key]] = true; e.preventDefault(); } };
        const up = (e) => { if (M[e.key]) keys.current[M[e.key]] = false; };
        window.addEventListener('keydown', dn); window.addEventListener('keyup', up);
        return () => { window.removeEventListener('keydown', dn); window.removeEventListener('keyup', up); };
      }, []);
      const hold = (dir) => ({
        onPointerDown: (e) => { e.preventDefault(); e.stopPropagation(); Sound.get(); keys.current[dir] = true; },
        onPointerUp: () => { keys.current[dir] = false; }, onPointerLeave: () => { keys.current[dir] = false; }, onPointerCancel: () => { keys.current[dir] = false; },
        onContextMenu: (e) => e.preventDefault(),
      });
      const arrow = 'btn3d rounded-2xl bg-white/95 border-slate-400 text-slate-700 font-bold flex items-center justify-center select-none touch-none';
      const p = pos.current;

      return (
        <div ref={vpRef} className="absolute inset-0 touch-none" onPointerDown={onGround} onScroll={(e) => { e.currentTarget.scrollLeft = 0; e.currentTarget.scrollTop = 0; }} style={{ background: HAS_IMG.has('bg_' + area.id + '.webp') ? '#efe7d6' : area.ground, overflow: 'clip' }}>
          <div ref={layerRef} className="absolute left-0 top-0" style={{ transformOrigin: '0 0', willChange: 'transform' }}>
            <WorldLayer world={world} area={area} colored={colored} stateOf={stateOf} onHouse={walkToHouse} shakeId={shakeId} near={active ? near : null} onInspect={(h) => { path.current = []; onInspect(h); }}>
              <div ref={meRef} className="absolute left-0 top-0 pointer-events-none" style={{ width: 130, height: 188 }}><div ref={heroRef}><Hero /></div></div>
            </WorldLayer>
          </div>
          {/* やじるしの ボタン */}
          {active && !map && <div className="absolute left-3 bottom-3 grid grid-cols-3 gap-1 z-10" style={{ width: 186 }} onPointerDown={e => e.stopPropagation()}>
            <div /><button className={arrow} style={{ height: 58, fontSize: 28 }} {...hold('up')} aria-label="うえ">▲</button><div />
            <button className={arrow} style={{ height: 58, fontSize: 28 }} {...hold('left')} aria-label="ひだり">◀</button>
            <button className={arrow} style={{ height: 58, fontSize: 28 }} {...hold('down')} aria-label="した">▼</button>
            <button className={arrow} style={{ height: 58, fontSize: 28 }} {...hold('right')} aria-label="みぎ">▶</button>
          </div>}
          {active && !map && allowMap && fit < scale * 0.98 && <button onPointerDown={e => e.stopPropagation()} onClick={() => { Sound.tap(); setMap(true); }} className="absolute right-3 top-3 z-10 btn3d rounded-2xl bg-white border-slate-400 font-bold px-4 py-2 text-xl">🗺️ ちず</button>}
          {/* ちず（まち ぜんたい） */}
          {map && (
            <div className="absolute inset-0 z-10 bg-white" onPointerDown={e => e.stopPropagation()}>
              <div className="absolute" style={{ left: (size.w - world.W * fit) / 2, top: (size.h - world.H * fit) / 2, width: world.W * fit, height: world.H * fit }}>
                <div className="absolute left-0 top-0" style={{ transformOrigin: '0 0', transform: `scale(${fit})` }}>
                  <WorldLayer world={world} area={area} colored={colored} stateOf={stateOf} shakeId={null} near={null} isMap onHouse={(h) => { if (!active) return; setMap(false); walkToHouse(h); }}>
                    <div className="absolute bob pointer-events-none" style={{ left: p.x - 100, top: p.y - 250, fontSize: 190, lineHeight: 1, zIndex: 4 }}>📍</div>
                  </WorldLayer>
                </div>
              </div>
              <div className="absolute left-3 top-3 bg-white/95 rounded-xl px-3 py-1 font-bold border-2 border-slate-300">🗺️ ちず　<span className="font-normal">いえを タッチすると、そこまで あるくよ</span></div>
              {active && <button onClick={() => { Sound.tap(); setMap(false); }} className="absolute right-3 top-3 btn3d rounded-2xl bg-sky-500 border-sky-700 text-white font-bold px-4 py-2 text-xl">✕ とじる</button>}
            </div>
          )}
        </div>
      );
    }

    // =====================================================================
    //  8. もんだいの がめん
    // =====================================================================
    // まちがえた いえに あわせた こえかけ
    function wrongMessage(areaId, h, clues) {
      const real = clues.filter(c => c.t !== 'extra'), fails = real.filter(c => !D.match(h, c));
      const c = fails[0]; if (!c) return 'もういちど よんで みよう。';
      const head = real.length > 1 && fails.length === 1 ? 'おしい！ ' : '';
      const ref = (r) => D.refText(areaId, r);
      let m = '';
      const shape = (c.t === 'neg' || c.t === 'neg2') && c.a === 'window';
      if (c.t === 'roof') m = h.wall === c.v ? 'それは かべの いろだよ。やねの いろを みて みよう。' : h.door === c.v ? 'それは ドアの いろだよ。やねの いろを みて みよう。' : D.VEHICLE[h.vehicle].c === c.v ? 'それは くるまの いろだよ。やねの いろを みて みよう。' : 'やねの いろが ちがうよ。やねを よく みて みよう。';
      else if (c.t === 'door') m = h.roof === c.v ? 'それは やねの いろだよ。ドアの いろを みて みよう。' : h.wall === c.v ? 'それは かべの いろだよ。ドアの いろを みて みよう。' : D.VEHICLE[h.vehicle].c === c.v ? 'それは くるまの いろだよ。ドアの いろを みて みよう。' : 'ドアの いろが ちがうよ。ドアを よく みて みよう。';
      else if (c.t === 'window') m = 'まどの かたちが ちがうよ。まどを よく みて みよう。';
      else if (c.t === 'wall') m = h.roof === c.v ? 'それは やねの いろだよ。かべの いろを みて みよう。' : h.door === c.v ? 'それは ドアの いろだよ。かべの いろを みて みよう。' : 'かべの いろが ちがうよ。かべを よく みて みよう。';
      else if (c.t === 'garden') m = `にわを みて みよう。${D.GARDEN[c.v].n}は あるかな。`;
      else if (c.t === 'vehicle') m = `いえの まえを みて みよう。${D.VEHICLE[c.v].n}は あるかな。`;
      else if (c.t === 'neg2') m = `「でも ありません」に きを つけよう。${c.vs[0]}でも ${c.vs[1]}でも ない いえだよ。`;
      else if (c.t === 'neg') m = c.a !== 'garden' && c.a !== 'vehicle' ? `「では ありません」に きを つけよう。${c.v}では ない いえだよ。` : `「${(c.a === 'garden' ? D.GARDEN[c.v] : D.VEHICLE[c.v]).nv}」に きを つけよう。${(c.a === 'garden' ? D.GARDEN[c.v] : D.VEHICLE[c.v]).n}が ない いえだよ。`;
      else if (c.t === 'row') m = `みちが ちがうよ。${D.ROADS[c.v].n}を さがして みよう。`;
      else if (c.t === 'near') m = `ばしょが ちがうよ。${ref(c.ref)}の となりを みて みよう。`;
      else if (c.t === 'side') m = `ばしょが ちがうよ。${ref(c.ref)}の ${c.dir === 'R' ? 'みぎ' : 'ひだり'}を みて みよう。`;
      else if (c.t === 'opp') m = `ばしょが ちがうよ。みちを はさんで、${ref(c.ref)}の むかいを みて みよう。`;
      else if (c.t === 'ord') m = `ばしょが ちがうよ。ならんで いる いえを、${c.dir === 'R' ? 'みぎ' : 'ひだり'}の はしから じゅんに かぞえて みよう。`;
      else if (c.t === 'between') m = `ばしょが ちがうよ。${ref(c.refs[0])}と ${ref(c.refs[1])}の あいだを みて みよう。`;
      return head + m;
    }

    function HouseButton({ h, state, onTap, big }) {
      // state: '' | 'wrong' | 'out' | 'answer' | 'sel'
      const off = state === 'wrong' || state === 'out';
      return (
        <button disabled={off} onClick={() => onTap(h)}
          className={`relative w-full rounded-xl bg-white/90 border-2 transition-all ${off ? 'opacity-25 border-slate-200' : state === 'answer' ? 'answer border-yellow-400' : state === 'sel' ? 'border-sky-500 ring-4 ring-sky-300' : 'border-white shadow active:scale-95'}`}
          style={{ aspectRatio: '5 / 3' }} aria-label="いえ">
          <HouseArt h={h} />
          {state === 'wrong' && <div className="absolute inset-0 flex items-center justify-center text-slate-500 font-bold" style={{ fontSize: big ? '4rem' : '2.2rem' }}>✕</div>}
        </button>
      );
    }

    function Play({ st, targets, startQi, settings, got, onSolved, onFinish, onQuit }) {
      const [qi, setQi] = useState(startQi || 0);
      const [q, setQ] = useState(null);
      const [wrong, setWrong] = useState([]);      // まちがえた いえ
      const [out, setOut] = useState([]);          // ヒント3で けした いえ
      const [sel, setSel] = useState(null);
      const [hintLv, setHintLv] = useState(0);
      const [focus, setFocus] = useState(-1);      // ヒント3で いま よんで いる 文
      const [showAnswer, setShowAnswer] = useState(false);
      const [phase, setPhase] = useState('ask');   // ask / walk / correct
      const [ho, setHo] = useState({ text: '', mood: 'normal' });
      const [resTalk, setResTalk] = useState(false);
      const [shakeId, setShakeId] = useState(null);
      const [mapSignal, setMapSignal] = useState(0);
      const run = useRef(0), t0 = useRef(Date.now()), log = useRef({ wrongs: [], wkinds: [] }), results = useRef([]);
      const alive = useRef(true);
      useEffect(() => () => { alive.current = false; run.current++; Speech.stop(); }, []);

      const target = q && q.target, areaId = q && target.area, area = q && D.area(areaId);
      const me = (h) => h.i % 2 ? 'ぼく' : 'わたし';
      const introText = (h) => `こんにちは。${h.who}です。${me(h)}の いえを さがして ください。`;

      const hoSay = async (text, mood = 'normal') => { const id = ++run.current; setResTalk(false); setHo({ text, mood }); await sayP(text, PITCH_HO); return alive.current && run.current === id; };
      const readClues = async (qq) => {
        if (!settings.read) return;
        const id = ++run.current; setResTalk(true);
        await sayP(introText(qq.target) + ' ' + qq.clues.map(c => plain(D.text(qq.target.area, c))).join(' '), PITCH_RES);
        if (alive.current && run.current === id) setResTalk(false);
      };

      // もんだいを つくる
      useEffect(() => {
        const t = D.house(targets[qi]);
        const qq = D.makeQuestion(st, t, qi);
        setQ(qq); setWrong([]); setOut([]); setSel(null); setHintLv(0); setFocus(-1); setShowAnswer(false); setPhase('ask'); setMapSignal(0);
        setHo({ text: settings.read ? 'はなしを よく きいて、まちを あるいて いえを さがそう。' : 'ぶんを よんで、まちを あるいて いえを さがそう。', mood: 'normal' });
        t0.current = Date.now(); log.current = { wrongs: [], wkinds: [] };
        readClues(qq);
      }, [qi]);

      // まちの かたち：10けんは 3ぼんの みち（ばしょごとに きまった ならび）、6けん・8けんは 2ほんの みち
      const town = useMemo(() => {
        if (!q) return null;
        if (q.shown.length >= 10) return { cells: D.cells(q.target.area), roads: 3, slots: D.SLOTS };
        const per = Math.ceil(q.shown.length / 2);
        return { cells: q.shown.map((h, i) => ({ house: h, r: i < per ? 0 : 1, s: 'u', c: i < per ? i : i - per + 1 })), roads: 2, slots: per + 1 };
      }, [q]);
      if (!q) return null;
      const real = q.clues.filter(c => c.t !== 'extra');
      const miss = wrong.length;

      // ヒント
      const doHint = async (lv, wrongNow) => {
        if (phase !== 'ask') return;
        Sound.hint(); setHintLv(l => Math.max(l, lv)); setSel(null);
        if (lv === 1) {
          const t = real.length === 1 ? 'ぶんを よく よんで、おなじ ところが ある いえを さがそう。' : 'ぶんを 1つずつ よんで、いえを たしかめよう。ぜんぶ あう いえは、1けん だけだよ。';
          hoSay(t + (q.clues.length > real.length ? ' いえに かんけいの ない ぶんも あるよ。' : ''), 'think');
        } else if (lv === 2) {
          hoSay('だいじな ことばに、いろを つけたよ。その ことばを みながら、いえを しらべよう。', 'think');
        } else {
          setPhase('walk'); setMapSignal(n => n + 1);
          let live = q.shown.filter(h => !(wrongNow || wrong).includes(h.id));
          let okk = await hoSay('いっしょに、1つずつ たしかめよう。', 'think');
          for (let i = 0; okk && i < q.clues.length; i++) {
            const c = q.clues[i];
            setFocus(i);
            if (c.t === 'extra') { okk = await hoSay(`「${plain(c.s)}」 この ぶんは、いえの ばしょとは かんけいが ないね。`, 'think'); continue; }
            okk = await hoSay(`「${plain(D.text(areaId, c))}」 あわない いえを けすよ。`, 'think');
            if (!okk) break;
            const gone = live.filter(h => !D.match(h, c));
            live = live.filter(h => D.match(h, c));
            if (gone.length) { Sound.erase(); setOut(o => o.concat(gone.map(h => h.id))); await sleep(900); }
          }
          if (!alive.current) return;
          setFocus(-1); setShowAnswer(true); setPhase('ask');
          hoSay('のこった いえが こたえだよ。ちずの いえを タッチして、そこまで あるこう。', 'happy');
        }
      };

      const tap = (h) => { if (phase !== 'ask') return; Sound.tap(); setSel(h); };
      const decide = async () => {
        const h = sel; if (!h || phase !== 'ask') return;
        setSel(null);
        if (h === target) {
          setPhase('correct'); setShowAnswer(true); Sound.found();
          const isNew = !got.includes(target.id);
          const rec = { stage: st.id, q: qi + 1, area: area.n, who: target.who, kinds: q.clues.map(D.kind).join('・'), result: miss ? '△' : '○', miss, hint: hintLv,
            wrongs: log.current.wrongs.join('・'), wkinds: [...new Set(log.current.wkinds)].join('・'), read: settings.read ? 'あり' : 'なし', secs: Math.round((Date.now() - t0.current) / 100) / 10 };
          results.current.push({ id: target.id, isNew, miss });
          onSolved(rec, target, qi + 1 < targets.length ? qi + 1 : null);
          const id = ++run.current; setResTalk(true); setHo({ text: 'みごとな すいりだ！', mood: 'happy' });
          await sayP(`せいかい！ ここが ${me(target)}の いえです。ありがとう！ おれいに シールを どうぞ。`, PITCH_RES);
          if (alive.current && run.current === id) setResTalk(false);
        } else {
          Sound.retry(); setShakeId(h.id); setTimeout(() => setShakeId(null), 900);
          const fails = real.filter(c => !D.match(h, c));
          // いらない 文に つられた とき（「すきな いろは あか」で あかい やねを えらんだ など）
          const trap = q.clues.find(c => c.t === 'extra' && c.trap && h[c.trap.a] === c.trap.v);
          log.current.wrongs.push(h.who);
          if (trap) log.current.wkinds.push('いらない ぶん'); else if (fails[0]) log.current.wkinds.push(D.kind(fails[0]));
          const nw = wrong.concat([h.id]); setWrong(nw);
          const ok2 = await hoSay(trap ? `「${trap.s}」は、いえの ことでは ないよ。いえの ことを かいた ぶんを さがそう。` : wrongMessage(areaId, h, q.clues), 'think');
          if (ok2 && nw.length >= 3 && hintLv < 3) doHint(3, nw);
        }
      };
      const next = () => { Speech.stop(); if (qi + 1 < targets.length) setQi(qi + 1); else onFinish(results.current); };

      const stateOf = (h) => wrong.includes(h.id) ? 'wrong' : out.includes(h.id) ? 'out' : showAnswer && h === target ? 'answer' : sel === h ? 'sel' : '';
      const hintGlow = phase === 'ask' && miss >= 2 && hintLv < 3;
      return (
        <div className="flex-1 flex flex-col p-3 gap-2" style={{ minHeight: 'calc(100vh - 56px)' }}>
          <div className="flex items-center gap-3">
            <div className="text-lg font-bold text-amber-900">{st.no}　{area.e} {area.n}</div>
            <div className="flex gap-1">{targets.map((_, i) => <div key={i} className={`w-7 h-7 rounded-full border-2 flex items-center justify-center text-sm font-bold ${i < qi || (i === qi && phase === 'correct') ? 'bg-amber-400 border-amber-600' : i === qi ? 'bg-white border-sky-500' : 'bg-white border-slate-300 text-slate-400'}`}>{i + 1}</div>)}</div>
            <div className="flex-1" />
            <Btn color="white" className="px-4 py-1 text-base" onClick={() => onQuit()}>✋ やめる</Btn>
          </div>

          <div className="flex-1 grid gap-3" style={{ gridTemplateColumns: 'minmax(300px, 36%) 1fr' }}>
            {/* ひだり：じゅうにんの はなし と ホーせんぱい */}
            <div className="flex flex-col gap-2">
              <div className="flex items-center gap-3">
                <button onClick={() => settings.read && readClues(q)} className={resTalk ? 'floaty' : ''} aria-label="じゅうにん"><Face h={target} size={84} /></button>
                <div className="text-2xl font-bold">{target.who}さん</div>
                {settings.read && <Btn color="sky" className="ml-auto px-4 py-2 text-lg" onClick={() => readClues(q)}>🔊 もういちど</Btn>}
              </div>
              <div className="bubble bg-white rounded-2xl border-2 border-amber-300 p-3 shadow">
                <div className="text-base text-slate-600 mb-1">{introText(target)}</div>
                <div className="flex flex-col gap-2">
                  {q.clues.map((c, i) => (
                    <div key={i} className={`flex gap-2 text-2xl leading-relaxed font-bold rounded-xl px-2 py-1 ${focus === i ? 'bg-yellow-100 ring-2 ring-yellow-400' : ''}`}>
                      {q.clues.length > 1 && <span className="shrink-0 w-8 h-8 mt-1 rounded-full bg-amber-200 text-amber-900 text-lg flex items-center justify-center">{i + 1}</span>}
                      <Marked text={D.text(areaId, c)} on={hintLv >= 2} />
                    </div>
                  ))}
                </div>
              </div>
              <div className="mt-auto flex flex-col gap-2">
                <HoTalk text={ho.text} mood={ho.mood} size={84} onRepeat={() => ho.text && sayP(ho.text, PITCH_HO)} />
                {phase !== 'correct' && <Btn color="amber" disabled={phase !== 'ask' || hintLv >= 3} className={`px-4 py-2 text-xl ${hintGlow ? 'glow' : ''}`} onClick={() => doHint(Math.min(3, hintLv + 1))}>💡 ヒント{hintLv > 0 && hintLv < 3 ? `（${hintLv + 1}つめ）` : ''}</Btn>}
              </div>
            </div>

            {/* みぎ：まち */}
            <div className="relative rounded-2xl border-4 border-white shadow overflow-hidden" style={{ minHeight: 420 }}>
              <Town key={qi} town={town} wide={settings.wide !== false} area={area} colored={q.shown.length >= 10} stateOf={stateOf} onInspect={tap} active={phase === 'ask' && !sel} allowMap={settings.map !== false} mapSignal={mapSignal} shakeId={shakeId} />

              {/* えらんだ いえを 大きく みる */}
              {sel && phase === 'ask' && (
                <div className="absolute inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-20" onClick={() => setSel(null)}>
                  <div className="pop bg-white rounded-3xl p-4 flex flex-col items-center gap-3 w-full" style={{ maxWidth: 520 }} onClick={e => e.stopPropagation()}>
                    <div className="text-xl font-bold text-slate-600">🔍 この いえかな？</div>
                    <div className="w-full rounded-2xl bg-sky-50 border-2 border-sky-200" style={{ aspectRatio: '3 / 2' }}><HouseArt h={sel} /></div>
                    <div className="flex gap-3 w-full">
                      <Btn color="gray" className="flex-1 py-3 text-xl" onClick={() => setSel(null)}>ほかの いえを みる</Btn>
                      <Btn color="green" className="flex-1 py-3 text-2xl" onClick={decide}>この いえ です！</Btn>
                    </div>
                  </div>
                </div>
              )}
              {/* せいかい */}
              {phase === 'correct' && (
                <div className="absolute inset-0 bg-amber-50/85 flex items-center justify-center p-4 z-20">
                  <div className="pop bg-white rounded-3xl p-4 flex flex-col items-center gap-2 border-4 border-amber-300 w-full" style={{ maxWidth: 520 }}>
                    <div className="text-3xl font-bold text-red-500">⭕ せいかい！</div>
                    <div className="w-2/3 rounded-2xl bg-sky-50" style={{ aspectRatio: '3 / 2' }}><HouseArt h={target} /></div>
                    <div className="flex items-center gap-3">
                      <div className="sticker"><Face h={target} size={88} /></div>
                      <div className="text-xl font-bold">{target.who}さんの<br />おれいの シール{results.current.length && results.current[results.current.length - 1].isNew ? <span className="ml-2 bg-red-500 text-white rounded-full px-2 text-base">あたらしい！</span> : null}</div>
                    </div>
                    <Btn color="green" className="px-10 py-3 text-2xl glow" onClick={next}>{qi + 1 < targets.length ? 'つぎへ ▶' : 'けっかを みる ▶'}</Btn>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function ResultScreen({ st, results, progress, stageClear, onAgain, onHome, onNext, say }) {
      const perfect = results.filter(r => !r.miss).length, news = results.filter(r => r.isNew).length;
      const msg = stageClear ? 'じけん かいけつ！ つぎの じけんに すすめるよ。' : perfect === results.length ? 'ぜんぶ 1かいで みつけたね。すばらしい すいりだ！' : 'みんなの おうちが みつかったよ。よく がんばったね。';
      useEffect(() => { Sound.big(); say(msg); }, []);
      return (
        <div className="flex-1 p-5 flex flex-col items-center gap-4" style={{ background: 'linear-gradient(#fde68a,#fef9ec)' }}>
          <div className="text-4xl font-bold text-amber-900 pop">🎉 じけん かいけつ！</div>
          <div className="w-full max-w-3xl"><HoTalk text={msg} mood="happy" size={110} onRepeat={() => say(msg)} /></div>
          <div className="flex gap-4 flex-wrap justify-center">
            {results.map((r, i) => { const h = D.house(r.id); return <div key={i} className="sticker bg-white rounded-2xl border-2 border-amber-300 p-2 flex flex-col items-center relative" style={{ animationDelay: i * 0.18 + 's', width: 120 }}>
              <Face h={h} size={76} /><div className={`font-bold text-center leading-tight mt-1 whitespace-nowrap ${h.who.length > 5 ? 'text-xs' : ''}`}>{h.who}さん</div>
              {r.isNew && <div className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full px-2 text-sm font-bold">NEW</div>}</div>; })}
          </div>
          <div className="text-xl bg-white rounded-2xl px-6 py-2 border-2 border-amber-200">1かいで みつけた：<b>{perfect}</b> / {results.length}　　あたらしい シール：<b>{news}</b>まい　　🔎 {D.titleOf(progress.stickers.length)}</div>
          <div className="flex gap-4">
            {onNext && <Btn color="green" className="px-8 py-4 text-2xl glow" onClick={onNext}>つぎの じけんへ ▶</Btn>}
            <Btn color="sky" className="px-8 py-4 text-2xl" onClick={onAgain}>🔁 もういちど</Btn>
            <Btn color="white" className="px-8 py-4 text-2xl" onClick={onHome}>🏠 ホーム</Btn>
          </div>
        </div>
      );
    }

    // =====================================================================
    //  9. 先生用画面
    // =====================================================================
    function PinPad({ onSubmit, onClose, error }) {
      const [v, setV] = useState('');
      useEffect(() => { setV(''); }, [error]);
      const push = (d) => { const n = (v + d).slice(0, 4); setV(n); if (n.length === 4) onSubmit(n); };
      return (
        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50">
          <div className="bg-white rounded-3xl p-6 w-80 text-center">
            <div className="text-xl font-bold mb-2">🔒 せんせい用（暗証番号）</div>
            <div className="text-3xl tracking-[0.5em] h-10 mb-1">{'●'.repeat(v.length)}</div>
            <div className="h-6 text-red-600 text-sm">{error ? '番号が ちがいます' : ''}</div>
            <div className="grid grid-cols-3 gap-2">
              {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => <Btn key={d} color="white" className="py-3 text-2xl" onClick={() => push(d)}>{d}</Btn>)}
              <Btn color="gray" className="py-3 text-base" onClick={onClose}>とじる</Btn>
              <Btn color="white" className="py-3 text-2xl" onClick={() => push(0)}>0</Btn>
              <Btn color="gray" className="py-3 text-base" onClick={() => setV(v.slice(0, -1))}>けす</Btn>
            </div>
          </div>
        </div>
      );
    }
    const kindKeys = (m) => KIND_ORDER.filter(k => m[k]).concat(Object.keys(m).filter(k => !KIND_ORDER.includes(k)));
    function KindTable({ kinds }) {
      const ks = kindKeys(kinds || {});
      if (!ks.length) return <div className="text-slate-500">まだ きろくが ありません。</div>;
      return <table className="text-sm border-collapse"><thead><tr className="bg-slate-100">{['文の しゅるい', '出た かず', 'つまずいた かず', 'つまずいた わりあい'].map(h => <th key={h} className="border px-2 py-1">{h}</th>)}</tr></thead>
        <tbody>{ks.map(k => { const [n, w] = kinds[k]; return <tr key={k}><td className="border px-2 py-1 font-bold">{k}</td><td className="border px-2 py-1 text-right">{n}</td><td className="border px-2 py-1 text-right">{w}</td>
          <td className={`border px-2 py-1 text-right ${n && w / n >= 0.4 ? 'bg-red-200' : n && w / n >= 0.2 ? 'bg-yellow-200' : ''}`}>{pct(w, n)}</td></tr>; })}</tbody></table>;
    }
    const worstKind = (kinds) => { const ks = Object.keys(kinds || {}).filter(k => kinds[k][0] >= 2 && kinds[k][1] > 0); ks.sort((a, b) => kinds[b][1] / kinds[b][0] - kinds[a][1] / kinds[a][0]); return ks[0] ? `${ks[0]}（${kinds[ks[0]][1]}/${kinds[ks[0]][0]}）` : '－'; };

    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('class');
      const [who, setWho] = useState(data.students[0] ? data.students[0].name : '');
      const [s, setS] = useState({ ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [busy, setBusy] = useState(false);
      const fileRef = useRef(null);
      const act = async (fn, done) => { setBusy(true); setMsg(''); try { const r = await fn(); if (r && r.ok === false) setMsg('できませんでした。'); else { setMsg(done || 'できました。'); await onChanged(); } } catch (e) { setMsg('できませんでした：' + (e && e.message || e)); } setBusy(false); };
      const stu = data.students.find(x => x.name === who);
      const sp = stu ? parseProgress(stu.progress) : newProgress();
      const tabs = [['class', 'クラス全体'], ['child', '子どもごと'], ['set', 'せってい'], ['data', 'データ']];
      const th = 'border px-2 py-1 bg-slate-100', td = 'border px-2 py-1';
      return (
        <div className="fixed inset-0 bg-white z-40 overflow-auto" style={{ fontSize: 16 }}>
          <div className="flex items-center gap-2 px-4 py-2 bg-slate-800 text-white sticky top-0 z-10">
            <div className="font-bold text-lg">🔒 先生用画面{data.demo ? '（おためしモード）' : ''}</div>
            {tabs.map(([k, n]) => <button key={k} onClick={() => { setTab(k); setMsg(''); }} className={`px-3 py-1 rounded-lg font-bold ${tab === k ? 'bg-white text-slate-800' : 'bg-slate-600'}`}>{n}</button>)}
            <div className="flex-1" /><span className="text-xs opacity-70">版 {APP_VERSION}</span>
            <button onClick={onClose} className="px-3 py-1 rounded-lg bg-red-500 font-bold">とじる</button>
          </div>
          <div className="p-4">
            {data.isDefaultPin && <div className="bg-yellow-100 border border-yellow-300 rounded-lg px-3 py-2 mb-3">暗証番号が はじめの 1234 のままです。「せってい」で変えてください。</div>}
            {msg && <div className="bg-sky-100 border border-sky-300 rounded-lg px-3 py-2 mb-3">{msg}</div>}

            {tab === 'class' && <div>
              <table className="text-sm border-collapse mb-5"><thead><tr>{['なまえ', 'クリアした ステージ', 'シール', 'といた かず', '1回で みつけた わりあい', 'まちがえた かず', 'ヒントを つかった かず', 'つまずきやすい 文', 'さいごの 日'].map(h => <th key={h} className={th}>{h}</th>)}</tr></thead>
                <tbody>{data.students.map(x => { const p = parseProgress(x.progress); return <tr key={x.name}>
                  <td className={td + ' font-bold'}><button className="underline text-sky-700" onClick={() => { setWho(x.name); setTab('child'); }}>{x.name}</button></td>
                  <td className={td + ' text-right'}>{mainStages().filter(st => isCleared(p, st)).length} / {mainStages().length}</td>
                  <td className={td + ' text-right'}>{p.stickers.length} / 60</td><td className={td + ' text-right'}>{x.count}</td>
                  <td className={`${td} text-right ${rateColor(x.ok, x.count)}`}>{pct(x.ok, x.count)}</td><td className={td + ' text-right'}>{x.miss}</td><td className={td + ' text-right'}>{x.hint}</td>
                  <td className={td}>{worstKind(x.kinds)}</td><td className={td}>{x.last || '－'}</td></tr>; })}</tbody></table>
              <div className="font-bold mb-1">クラス全体：どの しゅるいの 文で つまずいているか</div>
              <KindTable kinds={data.classKinds} />
              <div className="text-xs text-slate-500 mt-2">「つまずいた かず」は、その しゅるいの 文に 合わない いえを えらんだ もんだいの 数です。赤：40%以上　黄：20%以上。</div>
            </div>}

            {tab === 'child' && <div>
              <div className="flex gap-2 flex-wrap mb-3">{data.students.map(x => <button key={x.name} onClick={() => setWho(x.name)} className={`px-3 py-1 rounded-lg font-bold border ${who === x.name ? 'bg-sky-500 text-white border-sky-600' : 'bg-white border-slate-300'}`}>{x.name}</button>)}</div>
              {stu && <div className="flex flex-col gap-4">
                <div>といた かず <b>{stu.count}</b>　1回で みつけた <b>{pct(stu.ok, stu.count)}</b>　まちがえた かず <b>{stu.miss}</b>　ヒント <b>{stu.hint}</b>回　シール <b>{sp.stickers.length}</b>まい（{D.titleOf(sp.stickers.length)}）</div>
                <div><div className="font-bold mb-1">文の しゅるい ごと（どこで つまずいているか）</div><KindTable kinds={stu.kinds} /></div>
                <div><div className="font-bold mb-1">文の かず ごと</div>
                  <table className="text-sm border-collapse"><thead><tr>{['文の かず', 'といた かず', '1回で みつけた わりあい'].map(h => <th key={h} className={th}>{h}</th>)}</tr></thead>
                    <tbody>{Object.keys(stu.lens).sort().map(k => <tr key={k}><td className={td}>{k}つの 文</td><td className={td + ' text-right'}>{stu.lens[k][0]}</td><td className={`${td} text-right ${rateColor(stu.lens[k][1], stu.lens[k][0])}`}>{pct(stu.lens[k][1], stu.lens[k][0])}</td></tr>)}</tbody></table></div>
                <div><div className="font-bold mb-1">ステージ ごと</div>
                  <table className="text-sm border-collapse"><thead><tr>{['ステージ', 'ないよう', 'クリア', 'といた かず', '1回で みつけた わりあい', 'まちがえた かず'].map(h => <th key={h} className={th}>{h}</th>)}</tr></thead>
                    <tbody>{D.STAGES.filter(st => stu.stages[st.id] || isCleared(sp, st)).map(st => { const g = stu.stages[st.id] || [0, 0, 0]; return <tr key={st.id}><td className={td}>{st.no}（{st.id}）</td><td className={td}>{areaName(st)}：{st.t}</td><td className={td + ' text-center'}>{isCleared(sp, st) ? '⭐' : ''}</td>
                      <td className={td + ' text-right'}>{g[0]}</td><td className={`${td} text-right ${rateColor(g[1], g[0])}`}>{pct(g[1], g[0])}</td><td className={td + ' text-right'}>{g[2]}</td></tr>; })}</tbody></table></div>
                <div className="flex gap-3 flex-wrap items-center border-t pt-3">
                  <label className="flex items-center gap-2"><input type="checkbox" className="w-5 h-5" checked={!!sp.unlockAll} disabled={busy} onChange={e => act(() => api.setFlag(pin, who, 'unlockAll', e.target.checked))} />ステージを 全部開く</label>
                  <label className="flex items-center gap-2"><input type="checkbox" className="w-5 h-5" checked={!!sp.hatten} disabled={busy} onChange={e => act(() => api.setFlag(pin, who, 'hatten', e.target.checked))} />はってんを 開く</label>
                  <button disabled={busy} className="ml-auto px-3 py-1 rounded-lg bg-red-100 border border-red-300 text-red-700 font-bold" onClick={() => { if (window.confirm(`${who} の 記録と 進み具合を 消します。元に もどせません。よろしいですか？`)) act(() => api.clear(pin, who), '消しました。'); }}>この子の 記録を 消す</button>
                </div>
              </div>}
            </div>}

            {tab === 'set' && <div className="flex flex-col gap-4 max-w-2xl">
              <div><div className="font-bold">じゅうにんの 文の 読み上げ</div>
                <div className="flex gap-2 mt-1">{[[true, '読み上げる'], [false, '読み上げない（自分で 読む）']].map(([v, n]) => <button key={n} onClick={() => setS({ ...s, read: v })} className={`px-3 py-1 rounded-lg border font-bold ${s.read === v ? 'bg-sky-500 text-white' : 'bg-white'}`}>{n}</button>)}</div>
                <div className="text-xs text-slate-500">「読み上げない」にしても、ホーせんぱいの 声かけと ヒントは 読み上げます。</div></div>
              <div><div className="font-bold">読み上げの 速さ</div>
                <div className="flex gap-2 mt-1">{[0.6, 0.7, 0.8, 0.9, 1].map(v => <button key={v} onClick={() => setS({ ...s, rate: v })} className={`px-3 py-1 rounded-lg border font-bold ${Number(s.rate) === v ? 'bg-sky-500 text-white' : 'bg-white'}`}>{v}倍</button>)}</div></div>
              <div><div className="font-bold">文字の 大きさ</div>
                <div className="flex gap-2 mt-1">{[[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']].map(([v, n]) => <button key={v} onClick={() => setS({ ...s, font: v })} className={`px-3 py-1 rounded-lg border font-bold ${Number(s.font) === v ? 'bg-sky-500 text-white' : 'bg-white'}`}>{n}</button>)}</div></div>
              <div><div className="font-bold">「🗺️ ちず」ボタン（町全体を 上から みる）</div>
                <div className="flex gap-2 mt-1">{[[true, 'つかう'], [false, 'つかわない（歩いて さがす）']].map(([v, n]) => <button key={n} onClick={() => setS({ ...s, map: v })} className={`px-3 py-1 rounded-lg border font-bold ${(s.map !== false) === v ? 'bg-sky-500 text-white' : 'bg-white'}`}>{n}</button>)}</div>
                <div className="text-xs text-slate-500">「つかわない」にしても、3つめの ヒントでは ちずが 出ます。</div></div>
              <div><div className="font-bold">まちの ひろさ</div>
                <div className="flex gap-2 mt-1">{[[true, 'ひろい（みちが まがる・たくさん あるく）'], [false, 'ふつう（みちが まっすぐ・いえが ちかい）']].map(([v, n]) => <button key={n} onClick={() => setS({ ...s, wide: v })} className={`px-3 py-1 rounded-lg border font-bold ${(s.wide !== false) === v ? 'bg-sky-500 text-white' : 'bg-white'}`}>{n}</button>)}</div>
                <div className="text-xs text-slate-500">あるくのが たいへんな 子が いる ときは「ふつう」に します。いえの ならびは どちらも 同じです。</div></div>
              <div><div className="font-bold">効果音</div>
                <div className="flex gap-2 mt-1">{[[true, 'ならす'], [false, 'ならさない']].map(([v, n]) => <button key={n} onClick={() => setS({ ...s, sound: v })} className={`px-3 py-1 rounded-lg border font-bold ${s.sound === v ? 'bg-sky-500 text-white' : 'bg-white'}`}>{n}</button>)}</div></div>
              <div><div className="font-bold">暗証番号を 変える（4けたの 数字）</div>
                <input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} inputMode="numeric" className="border rounded-lg px-3 py-1 mt-1 w-32 text-xl" placeholder="変えない" /></div>
              <div><button disabled={busy || (newPin !== '' && newPin.length !== 4)} className="px-6 py-2 rounded-lg bg-green-500 text-white font-bold disabled:opacity-40"
                onClick={() => act(async () => { const r = await api.saveSettings(pin, { ...s, newPin: newPin || undefined }); if (r && r.ok) onSettings(s, newPin || null); return r; }, '設定を 保存しました。')}>保存する</button></div>
            </div>}

            {tab === 'data' && <div className="flex flex-col gap-3 max-w-2xl">
              <div className="border rounded-lg p-3">まだ 送れていない 記録：<b>{api.pending()}</b>件　<button disabled={busy} className="px-3 py-1 rounded-lg bg-sky-500 text-white font-bold" onClick={() => act(() => api.flush(), '送りました。')}>いま 送る</button></div>
              <div className="border rounded-lg p-3">記録を CSV で 書き出す　<button disabled={busy} className="px-3 py-1 rounded-lg bg-sky-500 text-white font-bold" onClick={() => act(async () => { const r = await api.logRows(pin); if (r.ok) downloadText('おうちさがし_きろく.csv', '﻿' + r.rows.map(row => row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n'), 'text/csv'); return r; }, '書き出しました。')}>CSV</button></div>
              <div className="border rounded-lg p-3">バックアップ（進み具合と 設定）　<button disabled={busy} className="px-3 py-1 rounded-lg bg-sky-500 text-white font-bold" onClick={() => act(async () => { const r = await api.backup(pin); if (r.ok) downloadText('おうちさがし_バックアップ.json', JSON.stringify(r.data), 'application/json'); return r; }, '保存しました。')}>保存する</button>
                　<button disabled={busy} className="px-3 py-1 rounded-lg bg-white border font-bold" onClick={() => fileRef.current.click()}>元に もどす</button>
                <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; const fr = new FileReader(); fr.onload = () => { let d = null; try { d = JSON.parse(fr.result); } catch (er) {} act(() => api.restore(pin, d), '元に もどしました。'); }; fr.readAsText(f); }} /></div>
              <div className="border border-red-300 rounded-lg p-3">全員の 記録と 進み具合を 消す　<button disabled={busy} className="px-3 py-1 rounded-lg bg-red-500 text-white font-bold" onClick={() => { if (window.confirm('全員の 記録と 進み具合を 消します。元に もどせません。よろしいですか？')) act(() => api.clear(pin, ''), '消しました。'); }}>全部 消す</button></div>
            </div>}
          </div>
        </div>
      );
    }

    // =====================================================================
    //  10. ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [soundOn, setSoundOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const pinRef = useRef(null);
      const progRef = useRef(progress);
      progRef.current = progress;
      const say = (t) => { sayP(t, PITCH_HO); };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        ['sound', 'read', 'map', 'wide'].forEach(k => { v[k] = v[k] !== false && v[k] !== 'false'; });
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8;
        Sound.on = v.sound; setSoundOn(Sound.on);
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p, recs) => {
        p = { ...p, t: Date.now() };
        progRef.current = p; setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        api.save({ name, progress: json, records: recs || [], stamp: nowStr(), time: Date.now() });
        return p;
      };

      const login = async (n) => {
        Sound.get();
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグ（全部開く・はってん）は スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) p = { ...p, unlockAll: !!a.unlockAll, hatten: !!a.hatten, flagT: a.flagT };
        progRef.current = p; setProgress(p); setName(n); setBusy(false);
        setView({ v: 'home' });
      };
      const logout = () => { Speech.stop(); setName(null); setView({ v: 'login' }); };

      const start = (st, resume) => {
        Speech.stop();
        const part = resume && progRef.current.part && progRef.current.part.st === st.id ? progRef.current.part : null;
        const targets = part ? part.targets : D.pickTargets(st);
        setView({ v: 'play', st, targets, qi: part ? part.qi : 0, key: uid() });
      };
      const onSolved = (st, targets) => (rec, target, nextQi) => {
        const p = progRef.current;
        persist({ ...p, solved: (p.solved || 0) + 1, stickers: p.stickers.includes(target.id) ? p.stickers : [...p.stickers, target.id],
          part: nextQi === null ? null : { st: st.id, targets, qi: nextQi } }, [{ ...rec, id: uid() }]);
      };
      const finish = (st) => (results) => {
        let p = progRef.current;
        const had = isCleared(p, st);
        p = persist({ ...p, part: null, clear: { ...p.clear, [st.id]: (p.clear[st.id] || 0) + 1 } });
        const ms = mainStages(), i = ms.findIndex(s => s.id === st.id);
        const nextSt = !st.hatten && i >= 0 && ms[i + 1] && stageOpen(p, ms[i + 1]) ? ms[i + 1] : null;
        setView({ v: 'result', st, results, stageClear: !had && !!nextSt, nextSt });
      };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          Speech.stop(); pinRef.current = v; setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pinRef.current);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const q = me.progress ? { ...progRef.current, unlockAll: !!sp.unlockAll, hatten: !!sp.hatten, flagT: sp.flagT, t: sp.t || Date.now() } : { ...newProgress(), t: Date.now() };
              progRef.current = q; setProgress(q); safeStore.set(COPY_KEY(name), JSON.stringify(q));
              if (!me.progress) setView({ v: 'home' });
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-amber-800">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-slate-500 mt-2">{boot.error}</div></div>;

      const bar = (home = true) => (
        <TopBar name={name} progress={progress} onHome={home ? () => { Speech.stop(); setView({ v: 'home' }); } : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }} />
      );
      let body = null;
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} busy={busy} />;
      } else if (view.v === 'home') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <HomeScreen key={name} name={name} progress={progress} say={say} onStages={() => setView({ v: 'stages' })} onAlbum={() => setView({ v: 'album' })}
            onContinue={() => { const part = progress.part && D.STAGES.find(s => s.id === progress.part.st); if (part && stageOpen(progress, part)) start(part, true); else start(currentStage(progress)); }} /></div>;
      } else if (view.v === 'stages') {
        body = <div className="min-h-screen flex flex-col">{bar()}<StageScreen progress={progress} onStart={(st) => start(st)} /></div>;
      } else if (view.v === 'album') {
        body = <div className="min-h-screen flex flex-col">{bar()}<AlbumScreen progress={progress} /></div>;
      } else if (view.v === 'play') {
        body = <div className="min-h-screen flex flex-col bg-white">{bar()}
          <Play key={view.key} st={view.st} targets={view.targets} startQi={view.qi} settings={settings} got={progress.stickers}
            onSolved={onSolved(view.st, view.targets)} onFinish={finish(view.st)} onQuit={() => { Speech.stop(); setView({ v: 'home' }); }} /></div>;
      } else if (view.v === 'result') {
        body = <div className="min-h-screen flex flex-col">{bar()}<ResultScreen st={view.st} results={view.results} progress={progress} stageClear={view.stageClear} say={say}
          onAgain={() => start(view.st)} onHome={() => setView({ v: 'home' })} onNext={view.nextSt ? () => start(view.nextSt) : null} /></div>;
      }

      return (
        <div>
          {body}
          {pinOpen && <PinPad error={pinError} onSubmit={submitPin} onClose={() => setPinOpen(false)} />}
          {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={() => reloadTeacher()}
            onSettings={(s, np) => { applySettings(s); if (np) { pinRef.current = np; setPin(np); } }} />}
        </div>
      );
    }

    window.OUCHI_READY.then(() => {
      D = window.OUCHI;
      HAS_IMG = new Set(D.IMAGES || []);
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:22px;">データを よみこめませんでした。ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<br><small>' + String(e && e.message || e) + '</small></div>';
    });
  </script>
</body>
</html>
