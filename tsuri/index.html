    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(api.pending());
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };
      const act = async (fn, okText) => {
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); onChanged(); } }
        catch (e) { flash('うまく いきませんでした：' + e.message); }
      };
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '﻿' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`つりマスター_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`つりマスター_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'tsuri') { flash('このアプリのバックアップではありません'); return; }
          if (!confirm('バックアップから、子どもの進み具合・お金・ずかん・買った物を元にもどします。よろしいですか？')) return;
          await act(() => api.restore(pin, d), 'バックアップから元にもどしました');
        };
        rd.readAsText(f);
      };
      const opt = (key, list) => list.map(([v, t]) =>
        <button key={String(v)} onClick={() => setS({ ...s, [key]: v })} className={`ml-2 mt-1 rounded-lg px-3 py-1 border-2 ${s[key] === v ? 'bg-sky-200 border-sky-600' : 'bg-white'}`}>{t}</button>);
      const flagBtn = (key, on, off, onMsg, offMsg) => <button key={key} onClick={() => act(() => api.setFlag(pin, student.name, key, !prog[key]), prog[key] ? offMsg : onMsg)} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog[key] ? on : off}</button>;
      const curText = (p) => stageName(currentStage(p));

      return (
        <div className="fixed inset-0 bg-stone-50 z-50 overflow-auto">
          <div className="max-w-6xl mx-auto p-4 text-base">
            <div className="flex items-center gap-3 mb-3">
              <div className="text-2xl font-bold flex-1">🔒 先生用画面 <span className="text-sm text-stone-500">ver {APP_VERSION}{data.demo ? '（おためしモード）' : ''}</span></div>
              <button onClick={onClose} className="btn3d bg-white border-2 border-stone-400 rounded-xl px-4 py-2 font-bold">とじる</button>
            </div>
            {data.isDefaultPin && <div className="bg-rose-100 border-2 border-rose-400 rounded-xl p-2 mb-2">暗証番号が はじめの「1234」のままです。「せってい」で変えてください。</div>}
            {msg && <div className="fixed top-3 left-1/2 -translate-x-1/2 bg-sky-900 text-white rounded-xl px-4 py-2 z-50">{msg}</div>}
            <div className="flex gap-2 mb-3">
              {[['class', 'クラス全体'], ['child', '子どもごと'], ['settings', 'せってい'], ['data', 'データ']].map(([id, t]) => (
                <button key={id} onClick={() => setTab(id)} className={`rounded-xl px-4 py-2 font-bold border-2 ${tab === id ? 'bg-sky-200 border-sky-600' : 'bg-white border-stone-300'}`}>{t}</button>
              ))}
            </div>

            {tab === 'class' && (
              <div className="flex flex-col gap-4">
                <table className="w-full bg-white rounded-xl overflow-hidden text-left">
                  <thead className="bg-sky-100"><tr><th className="p-2">なまえ</th><th>いま</th><th>つりば</th><th>でんたく</th><th>おかね</th><th>ずかん</th><th>問題</th><th>まちがえずに</th><th>多い まちがい</th><th>さいご</th></tr></thead>
                  <tbody>
                    {data.students.map(st => {
                      const p = parseProgress(st.progress);
                      return (
                        <tr key={st.name} className="border-t cursor-pointer hover:bg-sky-50" onClick={() => { setSel(st.name); setTab('child'); }}>
                          <td className="p-2 font-bold">{st.name}</td>
                          <td className="text-sm">{curText(p)}</td>
                          <td>{spotsCleared(p)} / 6</td>
                          <td className="text-sm">{p.realCalc ? 'てもと' : 'がめん'}</td>
                          <td>{yen(p.yen)}</td>
                          <td>{speciesOf(p)}</td>
                          <td>{st.count}</td>
                          <td>{pct(st.ok, st.count)}</td>
                          <td className="text-sm font-bold text-rose-700">{topOf(st.types, 2).map(([k, n]) => `${k}（${n}）`).join('、') || '－'}</td>
                          <td>{st.last || '－'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div className="text-sm text-stone-500">まちがえずに：まちがえず、ヒントも使わずに できた問題の割合。でんたく：がめん＝アプリの電卓、てもと＝手元の本物の電卓（「子どもごと」で切りかえます）。</div>
                <div className="grid md:grid-cols-2 gap-3">
                  <div className="bg-white rounded-xl p-3"><div className="font-bold mb-2">クラス全体の まちがいの しゅるい</div><TypeList types={data.classTypes} /></div>
                  <div className="bg-white rounded-xl p-3"><div className="font-bold mb-2">クラス全体の だんかいごとの表</div><StepTable steps={data.classSteps} />
                    <div className="text-xs text-stone-500 mt-1">赤：60%未満　黄：60〜79%　緑：80%以上（6つの つりばを あわせた数）</div></div>
                </div>
              </div>
            )}

            {tab === 'child' && (
              <div className="flex flex-col gap-3">
                <div className="flex gap-2 flex-wrap">
                  {data.students.map(st => <button key={st.name} onClick={() => setSel(st.name)} className={`rounded-xl px-4 py-2 font-bold border-2 ${sel === st.name ? 'bg-sky-200 border-sky-600' : 'bg-white border-stone-300'}`}>{st.name}</button>)}
                </div>
                {student && prog && (
                  <div className="grid md:grid-cols-2 gap-3">
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold text-xl mb-1">{student.name}　<span className="text-base">🎖️ {titleOf(prog)}</span></div>
                      <div>クリアした つりば：{spotsCleared(prog)} / 6　ずかん：{speciesOf(prog)} / {D.FISH.length}しゅるい（ぬし {nushiOf(prog)}）</div>
                      <div>おかね：{yen(prog.yen)}えん（これまでに {yen(prog.earned)}えん）　買った物：{prog.items.length}こ</div>
                      <div>問題：{student.count}　まちがえずに：{pct(student.ok, student.count)}　さいご：{student.last || '－'}</div>
                      <div className="text-sm text-stone-600">いま：{curText(prog)}</div>
                      <div className="mt-2 font-bold">ステージごとの結果</div>
                      <div className="max-h-72 overflow-auto">
                        <table className="w-full text-left text-sm">
                          <thead className="bg-stone-100 sticky top-0"><tr><th className="p-1">ステージ</th><th>クリア</th><th>問題</th><th>まちがえずに</th></tr></thead>
                          <tbody>
                            {STAGES.map(st => {
                              const g = student.stages[st.id] || [0, 0];
                              if (!g[0] && !prog.cleared[st.id]) return null;
                              return <tr key={st.id} className="border-t"><td className="p-1">{st.id}　{stageName(st)}</td><td>{prog.cleared[st.id] ? '⭐' : ''}</td><td>{g[0]}</td><td style={{ background: rateColor(g[1], g[0]) }}>{pct(g[1], g[0])}</td></tr>;
                            })}
                          </tbody>
                        </table>
                      </div>
                      <div className="mt-3 flex flex-wrap gap-2">
                        {flagBtn('realCalc', '🧮 でんたく：てもとの 本物', '🧮 でんたく：アプリの がめん', '手元の本物の電卓を使う形にしました（答えだけ入れます）', 'アプリの画面の電卓にもどしました')}
                        {flagBtn('unlockAll', '🔓 全部開く：オン', '🔒 全部開く：オフ', 'すべてのステージと つりばを開きました（ふねが なくても行けます）', 'ステージの開放をやめました')}
                        {flagBtn('hatten', '✨ はってん：開いている', '✨ はってん：閉じている', 'はってん（つり たいかい）を開きました', 'はってんを閉じました')}
                      </div>
                      <div className="mt-2 flex flex-wrap gap-2 items-center">
                        <span className="font-bold">おかね：</span>
                        {[-10000, -1000, 1000, 10000].map(dv => <button key={dv} onClick={() => act(() => api.addYen(pin, student.name, dv), `おかねを ${dv > 0 ? '+' : ''}${yen(dv)}えん しました`)} className="rounded-lg px-3 py-1 border-2 bg-white font-bold">{dv > 0 ? '+' : ''}{yen(dv)}</button>)}
                      </div>
                      <div className="mt-3">
                        <button onClick={() => { if (confirm(`${student.name} さんの記録・進み具合・お金・ずかん・買った物を、すべて消します。元にはもどせません。よろしいですか？`)) act(() => api.clear(pin, student.name), `${student.name} さんの記録を消しました`); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 この子の記録を消す</button>
                      </div>
                    </div>
                    <div className="bg-white rounded-xl p-3 flex flex-col gap-3">
                      <div><div className="font-bold mb-1">だんかいごとの表</div><StepTable steps={student.steps} /></div>
                      <div><div className="font-bold mb-1">まちがいの しゅるい</div><TypeList types={student.types} /></div>
                      <div>
                        <div className="font-bold mb-1">まちがえた問題と 電卓で押したキー（新しい順・15問まで）</div>
                        {!(student.misses || []).length && <span className="text-stone-500">まだ ありません</span>}
                        {(student.misses || []).map((m, k) => <div key={k} className="text-sm border-b py-1"><div><span className="text-stone-500">{m[0]}　{m[1]}</span>　{m[2]}　<b className="text-rose-700">{m[3]}</b></div>{m[4] && <div className="font-mono text-xs text-stone-700 break-all">{m[4]}</div>}</div>)}
                        <div className="text-xs text-stone-500 mt-1">キーの書き方：「たい:200×3=→600○」＝たいの ますで 200 × 3 ＝ と押して 600（○正解・✖まちがい）。「てもと」は手元の電卓で答えだけ入れたとき。</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-3xl">
                <label className="flex items-center gap-3">よみあげの はやさ：<input type="range" min="0.5" max="1.2" step="0.05" value={s.rate} onChange={e => setS({ ...s, rate: Number(e.target.value) })} /> {s.rate}倍
                  <button className="border rounded px-2" onClick={() => { Speech.rate = s.rate; Speech.say('1ぴき 200えんの たいが 3びき つれた。'); }}>ためす</button></label>
                <div>もじの おおきさ：{opt('font', [[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']])}</div>
                <div>1回の 問題の数：{opt('count', [[3, 'すくなめ'], [5, 'ふつう'], [10, 'おおめ']])}<div className="text-sm text-stone-500 ml-2">ふつう：⓪〜② は5問、③ は3問、④ は2問、⑤ と はってん は1問です。すくなめ・おおめ にすると、それに合わせて へったり ふえたり します。</div></div>
                <div>こうかおん：{opt('sound', [[true, 'ならす'], [false, 'ならさない']])}</div>
                <div>おんがく（BGM）：{opt('bgm', [[true, 'つかう'], [false, 'つかわない']])}<div className="text-sm text-stone-500 ml-2">つかう にすると、子どもの画面の上に 🎵 ボタンが出て、オン・オフできます（はじめは オン）。</div></div>
                <div className="text-sm text-stone-600">電卓（アプリの画面か、手元の本物か）は、「子どもごと」で 1人ずつ切りかえます。</div>
                <label>暗証番号を変える（4けた）：<input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} className="border-2 rounded px-2 py-1 w-24 ml-2" inputMode="numeric" placeholder="----" /></label>
                <div><button onClick={saveSettings} className="btn3d rounded-xl px-6 py-2 border-2 border-emerald-500 bg-emerald-100 font-bold text-xl">保存する</button>
                  <span className="text-sm text-stone-500 ml-2">（全員の画面に反映されます。子どもの画面は開き直すと変わります）</span></div>
              </div>
            )}

            {tab === 'data' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-2xl">
                <div>この端末に たまっている、まだ送れていない記録：<b>{pending}</b> 件
                  <button onClick={async () => { await api.flush(); setPending(api.pending()); flash(api.pending() ? 'まだ送れていません。ネットのつながりを確かめてください' : '送りました'); onChanged(); }} className="ml-2 rounded-xl px-3 py-1 border-2 bg-white font-bold">📤 スプレッドシートへ送る</button></div>
                <div><button onClick={csv} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">📄 記録をCSVで書き出す</button>
                  <div className="text-sm text-stone-500">ダウンロードできないときは、スプレッドシートの「きろく」シートを開き、ファイル → ダウンロード → CSV を選んでください。</div></div>
                <div className="flex gap-2 flex-wrap items-center">
                  <button onClick={backup} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">💾 バックアップを保存</button>
                  <label className="rounded-xl px-3 py-2 border-2 bg-white font-bold cursor-pointer">📂 バックアップから元にもどす<input type="file" accept=".json" className="hidden" onChange={restore} /></label>
                </div>
                <div><button onClick={() => { if (confirm('全員の記録・進み具合・お金・ずかん・買った物を、すべて消します。元にはもどせません。よろしいですか？') && confirm('ほんとうに全員の記録を消しますか？')) act(() => api.clear(pin, ''), '全員の記録を消しました'); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 全員の記録を消す</button></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 17. アプリ ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [stageSel, setStageSel] = useState(null);
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [talk, setTalk] = useState({ text: '', mood: 'normal', talking: false, k: 0 });
      const [getFx, setGetFx] = useState(null);
      const [soundOn, setSoundOn] = useState(true);
      const [bgmOn, setBgmOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const newFish = useRef([]);
      const before = useRef(null);
      const progRef = useRef(progress);
      progRef.current = progress;

      const talkApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setTalk({ text, mood: opts.mood || 'normal', talking: true, k: id });
          Speech.say(fmtSpeech(opts.speech || text), () => { if (sayId.current === id) setTalk(p => ({ ...p, talking: false })); resolve(); });
        });
        return { say: run, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const talkCtx = { ...talkApi, ...talk, gen: progress.gen };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        v.sound = v.sound !== false && v.sound !== 'false';
        v.bgm = v.bgm === true || v.bgm === 'true';
        v.count = [3, 5, 10].includes(Number(v.count)) ? Number(v.count) : 5;
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8;
        Sound.on = v.sound; setSoundOn(Sound.on);
        if (!v.bgm) Bgm.stop();
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);
      useEffect(() => { if (name && settings.bgm && bgmOn) Bgm.start(); else Bgm.stop(); }, [name, settings.bgm, bgmOn]);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        const recs = records.current; records.current = [];
        api.save({ name, progress: json, records: recs, stamp: nowStr(), time: Date.now() });
        return p;
      };
      const updateProg = (fn) => { progRef.current = fn(progRef.current); setProgress(progRef.current); return progRef.current; };

      const login = async (n) => {
        Sound.get(); Speech.say('');
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグは スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) { p = { ...p, flagT: a.flagT }; FLAGS.forEach(k => { p[k] = !!a[k]; }); }
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false);
        setView({ v: p.look ? 'home' : 'first' });
      };
      const logout = () => { talkApi.stop(); Bgm.stop(); setName(null); setView({ v: 'login' }); };

      const startStage = (st, part) => {
        setStageSel(null);
        records.current = []; newFish.current = [];
        const p = progRef.current;
        before.current = { titles: titlesOf(p) };
        const n = part ? part.left : stepCount(STEP_OF(st), settings.count);
        setView({ v: 'practice', st, n, intro: part ? 'つづきから はじめよう。' : null, key: uid() });
      };
      const onRecord = (r) => { records.current.push({ ...r, id: uid() }); };
      // つれた さかなを ずかんに いれる
      const onCatch = (r) => {
        updateProg(p => {
          const z = p.zukan[r.f.id] || { n: 0, max: 0 };
          if (!z.n && !newFish.current.includes(r.f.id)) newFish.current.push(r.f.id);
          return { ...p, zukan: { ...p.zukan, [r.f.id]: { n: z.n + r.c, max: Math.max(z.max, r.size) } } };
        });
      };
      // 1もん できた：ごうけいの おかねが もらえる（ヒントを つかっても おなじ）
      const onSolved = (total, mul) => {
        updateProg(p => ({ ...p, yen: p.yen + total, earned: p.earned + total, seenMul: mul ? 1 : p.seenMul }));
        setGetFx({ k: uid(), yen: total }); Sound.coin();
      };
      const onSave = (part) => { persist({ ...progRef.current, part }); };

      const finish = (st, result) => {
        let p = { ...progRef.current, part: null };
        const firstClear = !p.cleared[st.id];
        if (firstClear) p.cleared = { ...p.cleared, [st.id]: 1 };
        p = persist(p);
        const b = before.current || { titles: [] };
        const newTitle = titlesOf(p).filter(t => !b.titles.includes(t)).pop() || null;
        const cur = currentStage(p);
        let next = null, boatNeed = null;
        if (stageOpen(p, cur) && !isCleared(p, cur.id)) {
          if (needBoat(p, SPOT[cur.spot])) boatNeed = cur.spot;
          else next = () => startStage(cur);
        }
        setView({ v: 'result', st, result: { ...result, newFish: [...newFish.current], firstClear, newTitle, boatNeed }, next });
      };
      const quit = () => { talkApi.stop(); persist({ ...progRef.current }); setView({ v: 'home' }); };
      const buy = (it) => {
        const p = progRef.current;
        if (p.yen < it.p || p.items.includes(it.id)) return;
        persist({ ...p, yen: p.yen - it.p, items: [...p.items, it.id], uki: it.cat === 'uki' ? it.id : p.uki });
      };
      const cont = () => {
        const p = progRef.current;
        const part = p.part && STAGE[p.part.st];
        if (part && stageOpen(p, part) && !needBoat(p, SPOT[part.spot])) { startStage(part, p.part); return; }
        startStage(currentStage(p));
      };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const p = { ...progRef.current, flagT: sp.flagT, yen: sp.yen || 0, t: sp.t || Date.now() };
              FLAGS.forEach(k => { p[k] = !!sp[k]; });
              const fresh = !me.progress ? { ...newProgress(), welcome: 1, look: progRef.current.look } : p;
              progRef.current = fresh; setProgress(fresh); safeStore.set(COPY_KEY(name), JSON.stringify(fresh));
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-sky-900">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-stone-500 mt-2">{boot.error}</div></div>;

      const bar = (home = true) => (
        <TopBar name={name} progress={progress} bump={getFx ? getFx.k : 0} onHome={home ? () => { talkApi.stop(); if (view.v === 'practice') quit(); else setView({ v: 'home' }); } : null}
          onLogout={() => { if (view.v === 'practice') quit(); logout(); }} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }}
          bgmAllowed={settings.bgm} bgmOn={bgmOn} onBgm={() => setBgmOn(x => !x)} />
      );
      const page = (inner) => <div className="min-h-screen flex flex-col items-center sea">{bar()}{inner}</div>;
      const modal = stageSel && <StageModal key={stageSel.id} st={stageSel} progress={progress} onClose={() => setStageSel(null)} onStart={() => startStage(stageSel)} onResume={() => startStage(stageSel, progress.part)} />;

      let body = null;
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (view.v === 'first') {
        body = <div className="min-h-screen flex flex-col items-center sea">{bar(false)}<DressScreen progress={progress} first onSave={(lk, gen, uki) => { persist({ ...progRef.current, look: lk, gen, uki }); setView({ v: 'home' }); }} /></div>;
      } else if (view.v === 'home') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <HomeScreen name={name} progress={progress} onContinue={cont} go={(v) => setView({ v })} onWelcome={() => persist({ ...progRef.current, welcome: 1 })} /></div>;
      } else if (view.v === 'map') {
        body = page(<MapScreen progress={progress} onSpot={(s) => { Sound.tap(); setView({ v: 'spot', s }); }} />);
      } else if (view.v === 'spot') {
        body = page(<><SpotScreen key={view.s.id} sp={view.s} progress={progress} go={(v) => setView({ v })} onStage={(st) => { Sound.tap(); setStageSel(st); }} />{modal}</>);
      } else if (view.v === 'practice') {
        body = <div className="min-h-screen flex flex-col items-center sea">
          <div className="w-full">{bar()}</div><GetFly fx={getFx} />
          <div className="w-full flex justify-center py-2"><Practice key={view.key} st={view.st} n={view.n} intro={view.intro} progress={progress}
            onRecord={onRecord} onCatch={onCatch} onSolved={onSolved} onSave={onSave} onFinish={(r) => finish(view.st, r)} onQuit={quit} /></div></div>;
      } else if (view.v === 'result') {
        body = page(<ResultScreen view={view} progress={progress} onAgain={() => startStage(view.st)} onNext={view.next} onHome={() => setView({ v: 'home' })} onShop={() => setView({ v: 'shop' })} />);
      } else if (view.v === 'shop') {
        body = page(<ShopScreen progress={progress} onBuy={buy} />);
      } else if (view.v === 'tank') {
        body = page(<TankScreen progress={progress} />);
      } else if (view.v === 'zukan') {
        body = page(<ZukanScreen progress={progress} />);
      } else if (view.v === 'dress') {
        body = page(<DressScreen progress={progress} onSave={(lk, gen, uki) => persist({ ...progRef.current, look: lk, gen, uki })} />);
      }

      return (
        <SetCtx.Provider value={settings}>
          <TalkCtx.Provider value={talkCtx}>
            {body}
            {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
            {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
            {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
          </TalkCtx.Provider>
        </SetCtx.Provider>
      );
    }

    window.TSURI_READY.then(() => {
      D = window.TSURI_DATA;
      D.SPOTS.forEach(s => { SPOT[s.id] = s; });
      D.FISH.forEach(f => { FISH[f.id] = f; });
      STAGES = buildStages();
      STAGES.forEach(s => { STAGE[s.id] = s; });
      D.ITEM_CATS.forEach(c => c.items.forEach(it => { it.cat = c.id; }));
      ALL_ITEMS = D.ITEM_CATS.flatMap(c => c.items);
      ALL_ITEMS.forEach(it => { ITEM[it.id] = it; });
      [...D.COLORS, ...ALL_ITEMS.filter(it => it.color).map(it => it.color)].forEach(c => { COLOR[c.id] = c; });
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:24px;line-height:1.8">さかなの データを よみこめませんでした。<br>ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<div style="font-size:14px;color:#888">' + e.message + '</div></div>';
    });
  </script>
</body>
</html>
