<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲンじいの つりマスター への みち</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'BIZ UDPGothic', sans-serif; background: #e0f2fe; margin: 0; color: #082f49;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .btn3d { border-bottom-width: 6px; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; }
    /* メッセージの まど */
    .win { background: #0c4a6e; color: #fff; border: 4px solid #bae6fd; border-radius: 16px; box-shadow: 0 0 0 4px #0c4a6e, 0 8px 0 4px rgba(8,47,73,.25); }
    .win-light { background: #fffdf7; border: 4px solid #0c4a6e; border-radius: 16px; box-shadow: 0 6px 0 rgba(8,47,73,.2); }
    .sea { background: linear-gradient(#bae6fd 0 30%, #7dd3fc 30% 100%); }
    .pop { animation: pop .45s cubic-bezier(.17,.89,.32,1.28) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floaty { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .bob { animation: bob 1.2s steps(2) infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .shake { animation: shake .45s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-9px); } 40%,80% { transform: translateX(9px); } }
    .glow { animation: glow 1.1s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 14px rgba(250,204,21,0); } }
    .coinfly { animation: coinfly 1.6s ease-out forwards; }
    @keyframes coinfly { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }
    .bump { animation: bump .5s; }
    @keyframes bump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.3); } }
    .confetti span { position: absolute; animation: fall 1.6s ease-in forwards; }
    @keyframes fall { from { transform: translateY(-40px) rotate(0); opacity: 1; } to { transform: translateY(260px) rotate(320deg); opacity: 0; } }
    .niji { animation: niji 3s linear infinite; }
    @keyframes niji { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
    .shine { animation: shine 2.4s ease-in-out infinite; }
    @keyframes shine { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25) drop-shadow(0 0 6px #fff7); } }
    .chara-img { filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
    .caret:after { content: '▼'; display: inline-block; margin-left: 6px; font-size: .7em; animation: floaty 1s infinite; }
    /* うき */
    .uki-wait { animation: ukiwait 1.6s ease-in-out infinite; }
    @keyframes ukiwait { 0%,100% { transform: translate(-50%, -50%) translateY(0); } 50% { transform: translate(-50%, -50%) translateY(5px); } }
    .uki-bite { animation: ukibite .5s ease-in-out infinite; }
    @keyframes ukibite { 0%,100% { transform: translate(-50%, -50%) translateY(10px); } 50% { transform: translate(-50%, -50%) translateY(22px); } }
    .ring { position: absolute; border: 3px solid rgba(255,255,255,.85); border-radius: 50%; animation: ring 1.2s ease-out infinite; transform: translate(-50%, -50%); }
    @keyframes ring { from { width: 10px; height: 4px; opacity: 1; } to { width: 110px; height: 34px; opacity: 0; } }
    .jump { animation: jump .9s cubic-bezier(.2,.9,.3,1.2) both; }
    @keyframes jump { 0% { transform: translateY(80px) scale(.3) rotate(-30deg); opacity: 0; } 60% { transform: translateY(-20px) scale(1.1) rotate(8deg); opacity: 1; } 100% { transform: translateY(0) scale(1) rotate(0); } }
    /* すいそう */
    .swim { position: absolute; animation: swim var(--d, 14s) linear infinite; animation-delay: var(--dl, 0s); }
    @keyframes swim { 0% { left: 2%; transform: scaleX(1); } 48% { left: 82%; transform: scaleX(1); } 50% { left: 82%; transform: scaleX(-1); } 98% { left: 2%; transform: scaleX(-1); } 100% { left: 2%; transform: scaleX(1); } }
    .bubble { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); animation: bubble var(--d, 6s) linear infinite; }
    @keyframes bubble { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-420px); opacity: 0; } }
    .wave { animation: wave 6s ease-in-out infinite alternate; }
    @keyframes wave { from { transform: translateX(-20px); } to { transform: translateX(20px); } }
    /* けいさんの シート */
    .box { display: inline-flex; align-items: center; justify-content: flex-end; border: 3px solid; border-radius: .7rem; padding: 0 .5rem; font-weight: 700; min-height: 3rem; font-variant-numeric: tabular-nums; background: #fff; }
    .box.on { outline: 5px solid #facc15; outline-offset: 2px; }
    .tag-p { background: #dbeafe; border-color: #2563eb; color: #1e3a8a; }
    .tag-c { background: #fef9c3; border-color: #ca8a04; color: #713f12; }
    .tag-m { background: #ffedd5; border-color: #ea580c; color: #7c2d12; }
    .tag-t { background: #dcfce7; border-color: #16a34a; color: #14532d; }
    .calc-key { border-bottom-width: 5px; transition: transform .06s, border-bottom-width .06s; }
    .calc-key:active { transform: translateY(3px); border-bottom-width: 2px; }
    .seg { font-family: 'BIZ UDPGothic', monospace; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#0c4a6e;font-weight:bold;">じゅんび ちゅう…</div>
  </div>

  <!-- さかなの データと 絵は GitHub Pages から読みこみます（このファイルを短くするため） -->
  <script>
    (function () {
      var h = location.hostname;
      var local = location.protocol === 'file:' || /github\.io$/.test(h) || h === 'localhost' || h === '127.0.0.1';
      window.TSURI_BASE = local ? '' : 'https://zku0395-ops.github.io/hori/tsuri/';
      var V = '1';
      var load = function (f) {
        return new Promise(function (ok, ng) {
          var s = document.createElement('script');
          s.src = window.TSURI_BASE + f + '?v=' + V;
          s.onload = ok; s.onerror = function () { ng(new Error(f)); };
          document.head.appendChild(s);
        });
      };
      window.TSURI_READY = load('data/tsuri.js');
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;
    const APP_VERSION = '1.0.7';
    const BASE = window.TSURI_BASE;
    const IMG = BASE + 'img/';

    // =====================================================================
    //  1. 小さな道具
    // =====================================================================
    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const uniq = (a) => [...new Set(a)];
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const nowStr = () => {
      const d = new Date(), p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    // おかねの ひょうじ（さいふは 3けたごとに「,」。けいさんの シートは でんたくと おなじ ように「,」なし）
    const yen = (n) => Number(n || 0).toLocaleString('ja-JP');
    const safeStore = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
    };
    const downloadText = (name, text, type) => {
      const blob = new Blob([text], { type: type || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    };

    // =====================================================================
    //  2. こえ と おと
    // =====================================================================
    const Speech = {
      rate: 0.8, pitch: 1.0, voice: null,
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(String(text));
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = this.pitch;
          let done = false;
          const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
          u.onend = end; u.onerror = end;
          // 声が出ない端末でも先へ進めるように、長さに合わせて待つ
          setTimeout(end, 1500 + String(text).length * 230 / this.rate);
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() { try { this.ok && window.speechSynthesis.cancel(); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }

    // このアプリのための オリジナルの おと
    const Sound = {
      on: true, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      toneAt(freq, t, dur, type = 'square', vol = 0.06) {
        const c = this.ctx; if (!c) return;
        const o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      tone(freq, at, dur, type = 'square', vol = 0.06) { const c = this.get(); if (!c || !this.on) return; this.toneAt(freq, c.currentTime + at, dur, type, vol); },
      sweep(f0, f1, dur, type = 'sine', vol = 0.06) {
        const c = this.get(); if (!c || !this.on) return;
        const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
      },
      seikai() { [[784, 0], [988, .09], [1319, .18]].forEach(([f, t]) => this.tone(f, t, .14, 'square', .05)); this.tone(1568, .3, .35, 'triangle', .1); },
      fanfare() {
        [[523, 0], [659, .14], [784, .28], [1047, .42], [988, .7], [1047, .84], [1319, 1.0]].forEach(([f, t]) => this.tone(f, t, .16, 'square', .055));
        [262, 330, 392, 523].forEach(f => this.tone(f, 1.0, 1.0, 'triangle', .07));
      },
      levelup() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, i * .09, .12, 'square', .05)); },
      retry() { this.tone(330, 0, .12, 'sine', .06); this.tone(294, .11, .18, 'sine', .06); }, // まちがえた とき（小さな おと）
      tap() { this.tone(880, 0, .05, 'square', .035); },
      key() { this.tone(1200, 0, .04, 'square', .03); },
      count(i) { this.tone(523 * Math.pow(2, Math.min(i, 12) / 12), 0, .1, 'triangle', .08); },
      coin() { this.tone(988, 0, .07, 'square', .045); this.tone(1319, .07, .2, 'square', .045); },
      cast() { this.sweep(900, 300, .35, 'sine', .07); },
      splash() { [0, .05, .1].forEach((t, i) => this.tone(200 + i * 90, t, .12, 'sine', .05)); },
      bite() { this.tone(1046, 0, .08, 'square', .06); this.tone(1318, .1, .12, 'square', .06); },
      reel() { [0, .06, .12, .18, .24, .3].forEach((t, i) => this.tone(600 + i * 60, t, .04, 'square', .03)); },
      rare() { [784, 988, 1175, 1568, 1976, 2349].forEach((f, i) => this.tone(f, i * .07, .16, 'triangle', .08)); },
    };

    // おんがく（BGM）。このアプリのための オリジナルの きょく（ゆったり した うみの うた）
    const N = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const MEL = [72, 0, 74, 76, 79, 0, 76, 0, 74, 72, 74, 0, 69, 0, 0, 0, 67, 0, 69, 72, 74, 0, 72, 0, 69, 67, 69, 72, 72, 0, 0, 0];
    const BASS = [48, 0, 0, 0, 55, 0, 0, 0, 53, 0, 0, 0, 57, 0, 0, 0, 52, 0, 0, 0, 50, 0, 0, 0, 53, 0, 0, 0, 48, 0, 0, 0];
    const Bgm = {
      timer: null, step: 0, next: 0,
      start() {
        if (this.timer) return;
        const c = Sound.get(); if (!c) return;
        this.next = c.currentTime + 0.15; this.step = 0;
        this.timer = setInterval(() => {
          const cc = Sound.ctx; if (!cc) return;
          while (this.next < cc.currentTime + 0.35) {
            const m = MEL[this.step], b = BASS[this.step];
            if (m) Sound.toneAt(N(m), this.next, 0.26, 'triangle', 0.035);
            if (b) Sound.toneAt(N(b), this.next, 0.6, 'triangle', 0.045);
            this.next += 0.28; this.step = (this.step + 1) % MEL.length;
          }
        }, 90);
      },
      stop() { if (this.timer) clearInterval(this.timer); this.timer = null; },
    };

    // ---- 読み上げの ことば ----
    const fmtSpeech = (t) => String(t || '')
      .replace(/〜/g, '').replace(/[「」『』]/g, '、').replace(/[①②③④⑤⓪]/g, '')
      .replace(/×/g, ' かける ').replace(/＋/g, ' たす ').replace(/＝/g, ' は ')
      .replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '');

    // =====================================================================
    //  3. データ（data/tsuri.js から）
    // =====================================================================
    let D = null, STAGES = [], STAGE = {}, SPOT = {}, FISH = {}, ITEM = {}, ALL_ITEMS = [], COLOR = {};
    const STEP_OF = (st) => (st.spot === 7 ? D.HATTEN_STEPS : D.STEPS).find(s => s.k === st.k);
    function buildStages() {
      const out = [];
      D.SPOTS.forEach(sp => (sp.hatten ? D.HATTEN_STEPS : D.STEPS).forEach(s => out.push({ id: `${sp.id}-${s.k}`, spot: sp.id, k: s.k, hatten: !!sp.hatten })));
      return out;
    }
    const stageName = (st) => `${SPOT[st.spot].name}　${st.hatten ? '' : '⓪①②③④⑤'[st.k] + ' '}${STEP_OF(st).name}`;
    const mainChain = () => STAGES.filter(s => !s.hatten);
    const spotFish = (sid) => D.FISH.filter(f => f.s === sid);

    // =====================================================================
    //  4. もんだいを つくる
    //     1もん ＝ 1かいの つり。つる さかなの しゅるい と かず は アプリが きめる
    // =====================================================================
    const owned = (p, cat) => ALL_ITEMS.filter(it => it.cat === cat && p.items.includes(it.id));
    const bonusOf = (p, key) => ALL_ITEMS.filter(it => p.items.includes(it.id) && it[key]).reduce((m, it) => (it.cat === 'boat' ? m : Math.max(m, it[key])), 0)
      + (p.items.includes('bigship') && key === 'nushi' ? ITEM.bigship.nushi : 0);
    const nushiChance = (p) => 0.06 + bonusOf(p, 'nushi');
    // さかなの おおきさ（えさが いいほど おおきく なりやすい）
    const sizeOf = (f, p) => { const r = Math.pow(Math.random(), Math.max(0.35, 1.5 - bonusOf(p, 'size') * 1.6)); return Math.round(f.min + (f.max - f.min) * r); };
    const cmText = (cm) => (cm >= 100 ? `${Math.floor(cm / 100)}メートル${cm % 100 ? ` ${cm % 100}センチ` : ''}` : `${cm}センチ`);

    function countRange(st, step, sp) {
      const cmax = sp.cmax;
      if (step.mode === 'count') return [1, cmax];
      if (step.mode === 'add') return [2, sp.id >= 4 ? 5 : 4];
      return [2, cmax];
    }
    function genProblem(st, p, prev) {
      const step = STEP_OF(st), sp = SPOT[st.spot];
      let rows = [];
      if (step.kinds === 'slide') {
        rows = D.SLIDE.map(([id, price]) => ({ f: FISH[id], p: price, plain: 1 }));
      } else if (step.kinds === 'mix8') {
        const pool = shuffle(D.FISH.filter(f => !f.nushi));
        rows = pool.slice(0, 8).map(f => ({ f, p: f.p, plain: 1 }));
      } else {
        const list = spotFish(sp.id);
        const normal = list.filter(f => !f.nushi), nushi = list.find(f => f.nushi);
        const withNushi = nushi && Math.random() < nushiChance(p);
        let kinds;
        if (step.kinds === 'all') kinds = [...shuffle(normal), ...(withNushi ? [nushi] : [])];
        else {
          const k = rand(step.kinds[0], step.kinds[1]);
          kinds = shuffle(normal).slice(0, k);
          if (withNushi) kinds[k - 1] = nushi;
        }
        rows = kinds.map(f => ({ f, p: f.p }));
      }
      const [c0, c1] = countRange(st, step, sp);
      // まえの もんだいと まったく おなじ に ならないように する
      for (let tryN = 0; tryN < 6; tryN++) {
        rows.forEach(r => { r.c = rand(c0, c1); });
        const key = rows.map(r => r.f.id + r.c).join();
        if (!prev || key !== prev) break;
      }
      rows.forEach(r => { r.size = sizeOf(r.f, p); r.m = r.p * r.c; });
      return { rows, total: rows.reduce((s, r) => s + r.m, 0), mode: step.mode, key: rows.map(r => r.f.id + r.c).join() };
    }
    const isNushi = (r) => !!(r.f.nushi && !r.plain);
    const probText = (pr) => pr.rows.map(r => `${r.f.n}${r.p}えん×${r.c}`).join('・');

    // こたえる ますの じゅんばん：かず → かけざん（たしざん）→ ごうけい
    function blanksOf(pr) {
      if (pr.mode === 'count') return [{ t: 'count', r: 0 }];
      if (pr.mode === 'add') return [{ t: 'count', r: 0 }, { t: 'add', r: 0 }];
      if (pr.mode === 'mul') return [{ t: 'count', r: 0 }, { t: 'mul', r: 0 }];
      return [...pr.rows.map((_, r) => ({ t: 'count', r })), ...pr.rows.map((_, r) => ({ t: 'mul', r })), { t: 'total' }];
    }
    const answerOf = (pr, b) => (b.t === 'count' ? pr.rows[b.r].c : b.t === 'total' ? pr.total : pr.rows[b.r].m);
    // でんたくで おす キーの じゅんばん（ヒント③）
    const keysOf = (pr, b) => {
      const ds = (n) => String(n).split('');
      if (b.t === 'add') { const r = pr.rows[b.r]; return [...Array(r.c).fill(0).flatMap((_, i) => (i ? ['+', ...ds(r.p)] : ds(r.p))), '=']; }
      if (b.t === 'mul') { const r = pr.rows[b.r]; return [...ds(r.p), '*', ...ds(r.c), '=']; }
      if (b.t === 'total') return [...pr.rows.flatMap((r, i) => (i ? ['+', ...ds(r.m)] : ds(r.m))), '='];
      return [];
    };
    const KEY_LABEL = { '+': '＋', '-': '−', '*': '×', '/': '÷', '=': '＝', C: 'C' };
    const keyText = (ks) => ks.map(k => KEY_LABEL[k] || k).join('');
    const formulaOf = (pr, b) => {
      if (b.t === 'add') { const r = pr.rows[b.r]; return Array(r.c).fill(r.p).join(' ＋ ') + ' ＝'; }
      if (b.t === 'mul') { const r = pr.rows[b.r]; return `${r.p} × ${r.c} ＝`; }
      if (b.t === 'total') return pr.rows.map(r => r.m).join(' ＋ ') + ' ＝';
      return '';
    };

    // まちがいの しゅるい
    const MT = { zero: 'ゼロの かず', op: '＋と ×', count: 'かぞえまちがい', wasure: 'たしわすれ', sugi: 'たしすぎ', kaisu: 'たす かいすう', price: 'ちがう ねだん', key: 'おしまちがい' };
    const noZero = (n) => String(n).replace(/0/g, '');
    function classify(pr, b, v) {
      const ans = answerOf(pr, b);
      if (b.t === 'count') return MT.count;
      if (noZero(v) === noZero(ans) && v !== ans && v > 0) return MT.zero;
      if (b.t === 'mul') {
        const r = pr.rows[b.r];
        if (v === r.p + r.c) return MT.op;
        if (pr.rows.some((o, i) => i !== b.r && (o.p * r.c === v || o.m === v))) return MT.price;
        if (v === r.p * (r.c - 1) || v === r.p * (r.c + 1)) return MT.kaisu;
        return MT.key;
      }
      if (b.t === 'add') {
        const r = pr.rows[b.r];
        if (v === r.p * (r.c - 1) || v === r.p * (r.c + 1) || (v % r.p === 0 && v > 0)) return MT.kaisu;
        if (v === r.p + r.c) return MT.op;
        return MT.key;
      }
      // ごうけい
      const ms = pr.rows.map(r => r.m);
      if (ms.some(m => v === pr.total - m) || ms.includes(v) || (v < pr.total && v > 0 && subsetSum(ms, v))) return MT.wasure;
      if (ms.some(m => v === pr.total + m)) return MT.sugi;
      if (ms.length === 2 && v === ms[0] * ms[1]) return MT.op;
      return MT.key;
    }
    const subsetSum = (ms, v) => { for (let mask = 1; mask < (1 << ms.length) - 1; mask++) { let s = 0; ms.forEach((m, i) => { if (mask & (1 << i)) s += m; }); if (s === v) return true; } return false; };
    // まちがいに あわせた こえかけ
    function missWord(pr, b, type, v) {
      const r = b.r != null ? pr.rows[b.r] : null;
      switch (type) {
        case MT.count: return Math.abs(v - r.c) === 1 ? 'おしい！ もう いちど、1ぴきずつ さわって かぞえよう。' : `${r.f.n}を ゆびで さわって、1ぴきずつ かぞえよう。`;
        case MT.zero: return `0の かずが ちがうよ。${b.t === 'total' ? 'それぞれの えんを' : `ねだんは ${r.p}えん。`} よく みて、0が いくつ あるか たしかめよう。`;
        case MT.op: return b.t === 'mul' ? `「＋」を おしたかな？ ${r.p} × ${r.c} だよ。「×」の キーを おそう。` : '「×」を おしたかな？ ここは たしざんだよ。「＋」の キーを おそう。';
        case MT.price: return `ちがう さかなの ねだんを つかったかな？ ${r.f.n}は 1ぴき ${r.p}えん だよ。`;
        case MT.kaisu: return b.t === 'add' ? `たす かずが ちがうよ。${r.p}えんを ${r.c}かい たそう。` : `かける かずを たしかめよう。${r.f.n}は ${r.c}ひき だよ。`;
        case MT.wasure: return 'たしわすれが あるよ。うえの えんを ぜんぶ たそう。';
        case MT.sugi: return 'おなじ えんを 2かい たしたかな？ 1つずつ たしていこう。';
        default: return 'でんたくの おしまちがいかな？「C」を おして、もう いちど ゆっくり おそう。';
      }
    }

    // =====================================================================
    //  5. しんちょく（進み具合）
    // =====================================================================
    const FLAGS = ['unlockAll', 'hatten', 'realCalc'];
    const defaultLook = () => ({ form: 1, color: 'ao', hat: null });
    const newProgress = () => ({ v: 1, t: 0, yen: 0, earned: 0, items: [], cleared: {}, zukan: {}, look: null, gen: { color: 'ao', hat: null }, uki: null,
      part: null, welcome: 0, seenMul: 0, unlockAll: false, hatten: false, realCalc: false });
    function parseProgress(s) {
      let p = null;
      try { p = typeof s === 'string' ? (s ? JSON.parse(s) : null) : s; } catch (e) { p = null; }
      const q = { ...newProgress(), ...(p || {}) };
      if (!Array.isArray(q.items)) q.items = [];
      ['cleared', 'zukan'].forEach(k => { if (!q[k] || typeof q[k] !== 'object') q[k] = {}; });
      if (!q.gen || typeof q.gen !== 'object') q.gen = { color: 'ao', hat: null };
      q.yen = Number(q.yen) || 0; q.earned = Number(q.earned) || 0;
      return q;
    }
    const isCleared = (p, id) => !!p.cleared[id];
    const spotCleared = (p, sid) => isCleared(p, `${sid}-5`);
    const spotsCleared = (p) => D.SPOTS.filter(s => !s.hatten && spotCleared(p, s.id)).length;
    const needBoat = (p, sp) => sp.boat && !p.items.includes(sp.boat) && !p.unlockAll;
    const stageOpen = (p, st) => {
      if (st.hatten) return !!(p.hatten || p.unlockAll);
      if (p.unlockAll) return true;
      const ch = mainChain(), i = ch.findIndex(s => s.id === st.id);
      return i <= 0 || isCleared(p, ch[i - 1].id);
    };
    const spotOpen = (p, sid) => stageOpen(p, STAGE[`${sid}-${sid === 7 ? 1 : 0}`]);
    const currentStage = (p) => {
      const ch = mainChain();
      return ch.find(st => stageOpen(p, st) && !isCleared(p, st.id))
        || STAGES.filter(s => s.hatten).find(st => stageOpen(p, st) && !isCleared(p, st.id))
        || ch[ch.length - 1];
    };
    const speciesOf = (p) => Object.keys(p.zukan).filter(id => FISH[id] && p.zukan[id].n > 0).length;
    const nushiOf = (p) => D.FISH.filter(f => f.nushi && p.zukan[f.id] && p.zukan[f.id].n > 0).length;
    const titleOk = (p, t) => t.t === 'start' || (t.t === 'spot' ? spotsCleared(p) >= t.v : t.t === 'nushi' ? nushiOf(p) >= t.v : speciesOf(p) >= t.v);
    const titlesOf = (p) => D.TITLES.filter(t => titleOk(p, t)).map(t => t.n);
    const titleOf = (p) => titlesOf(p).pop();
    const ownedColors = (p) => [...D.COLORS, ...ALL_ITEMS.filter(it => it.color && p.items.includes(it.id)).map(it => it.color)];
    const ukiOf = (p) => (p.uki && p.items.includes(p.uki) ? ITEM[p.uki] : null);
    const stepCount = (step, count) => Math.max(1, Math.round(step.n * (Number(count) || 5) / 5));

    // =====================================================================
    //  6. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    const LOG_HEADER = ['日時', 'なまえ', 'ステージ', 'つりば', 'だんかい', 'もんだい', 'ごうけい', 'けっか', 'まちがい', 'ヒント', 'まちがいの しゅるい', 'おした キー', 'でんたく', 'びょう', 'ID'];
    const DEFAULT_SETTINGS = { rate: 0.8, font: 1, count: 5, sound: true, bgm: false };

    // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
    const emptyStu = () => ({ count: 0, ok: 0, secs: 0, last: '', stages: {}, steps: {}, types: {}, misses: [] });
    const stepKey = (stage) => { const [s, k] = String(stage).split('-'); return s === '7' ? `はってん${k}` : `${k}`; };
    function aggregate(rows) {
      const students = {}, classTypes = {}, classSteps = {};
      const inc = (m, k) => { m[k] = (m[k] || 0) + 1; };
      rows.forEach(r => {
        const name = String(r[1] || '').trim(); if (!name) return;
        const s = students[name] || (students[name] = emptyStu());
        const day = String(r[0] instanceof Date ? r[0].toISOString() : r[0]).slice(0, 10).replace(/-/g, '/');
        if (day > s.last) s.last = day;
        const st = String(r[2]), ok = r[7] === '○' ? 1 : 0;
        s.count++; s.ok += ok; s.secs += Number(r[13]) || 0;
        const g = s.stages[st] || (s.stages[st] = [0, 0]); g[0]++; g[1] += ok;
        const sk = stepKey(st);
        [s.steps, classSteps].forEach(m => { const a = m[sk] || (m[sk] = [0, 0]); a[0]++; a[1] += ok; });
        String(r[10] || '').split('・').forEach(k => { if (k) { inc(s.types, k); inc(classTypes, k); } });
        if (!ok && Number(r[8]) > 0) s.misses.push([String(r[0]).slice(0, 16), st, String(r[5]), String(r[10] || ''), String(r[11] || '')]);
      });
      Object.values(students).forEach(s => { s.misses = s.misses.slice(-15).reverse(); });
      return { students, classTypes, classSteps };
    }

    const Local = {
      key: 'tsuri_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}
        this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: { ...DEFAULT_SETTINGS } };
        return this.mem;
      },
      save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
    };

    const PENDING_KEY = 'tsuri_pending_v1';
    const COPY_KEY = (name) => 'tsuri_copy_' + name;
    const recRow = (stamp, name, r) => [stamp, name, r.stage, r.spot, r.step, r.mondai, r.total, r.result, r.miss, r.hint, r.types, r.keys, r.calc, r.secs, r.id];
    const api = {
      async init() {
        if (HAS_GAS) return gas('getInitData');
        const d = Local.data();
        return { students: d.roster, settings: { ...DEFAULT_SETTINGS, ...d.settings }, demo: true };
      },
      async student(name) {
        if (HAS_GAS) return gas('getStudent', name);
        return Local.data().progress[name] || '';
      },
      async sendOne(p) {
        if (HAS_GAS) return gas('saveResult', p);
        const d = Local.data();
        const old = parseProgress(d.progress[p.name]);
        const neu = parseProgress(p.progress);
        if (neu.t >= old.t) d.progress[p.name] = p.progress;
        const ids = new Set(d.log.map(r => r[14]));
        p.records.forEach(r => { if (!ids.has(r.id)) d.log.push(recRow(p.stamp, p.name, r)); });
        Local.save();
        return { ok: true };
      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす
      readQueue() { try { return JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) { return []; } },
      async save(payload) {
        const queue = api.readQueue().filter(q => !(q.name === payload.name && !q.records.length));
        queue.push({ ...payload, qid: uid() });
        safeStore.set(PENDING_KEY, JSON.stringify(queue));
        return api.flush();
      },
      pending() { return api.readQueue().length; },
      flushing: false,
      async flush() {
        if (api.flushing) return;
        api.flushing = true;
        try {
          for (let q = api.readQueue()[0]; q; q = api.readQueue()[0]) {
            await api.sendOne(q);
            safeStore.set(PENDING_KEY, JSON.stringify(api.readQueue().filter(x => x.qid !== q.qid)));
          }
        } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
        finally { api.flushing = false; }
      },
      async teacher(pin) {
        if (HAS_GAS) return gas('getTeacherData', pin);
        const d = Local.data();
        if (String(pin) !== String(d.pin)) return { ok: false };
        const agg = aggregate(d.log);
        return {
          ok: true, isDefaultPin: d.pin === '1234', demo: true, settings: { ...DEFAULT_SETTINGS, ...d.settings },
          students: d.roster.map(n => ({ name: n, progress: d.progress[n] || '', ...(agg.students[n] || emptyStu()) })),
          classTypes: agg.classTypes, classSteps: agg.classSteps,
        };
      },
      async setFlag(pin, name, key, val) {
        if (HAS_GAS) return gas('setFlag', pin, name, key, val);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p[key] = !!val; p.t = Date.now(); p.flagT = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async addYen(pin, name, delta) {
        if (HAS_GAS) return gas('addYen', pin, name, delta);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p.yen = Math.max(0, p.yen + delta); p.t = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async saveSettings(pin, s) {
        if (HAS_GAS) return gas('saveSettings', pin, s);
        const d = Local.data(); const { newPin, ...rest } = s;
        d.settings = { ...d.settings, ...rest }; if (newPin) d.pin = newPin; Local.save(); return { ok: true };
      },
      async logRows(pin) {
        if (HAS_GAS) return gas('getLogRows', pin);
        return { ok: true, rows: [LOG_HEADER, ...Local.data().log] };
      },
      async backup(pin) {
        if (HAS_GAS) return gas('getBackup', pin);
        const d = Local.data(); return { ok: true, data: { app: 'tsuri', roster: d.roster.map(n => [n, d.progress[n] || '']), settings: d.settings } };
      },
      async restore(pin, data) {
        if (HAS_GAS) return gas('restoreBackup', pin, data);
        const d = Local.data(); (data.roster || []).forEach(([n, p]) => { if (!d.roster.includes(n)) d.roster.push(n); d.progress[n] = p; }); Local.save(); return { ok: true };
      },
      async clear(pin, name) {
        if (HAS_GAS) return gas('clearRecords', pin, name);
        const d = Local.data();
        d.log = d.log.filter(r => name && r[1] !== name);
        (name ? [name] : d.roster).forEach(n => { delete d.progress[n]; safeStore.del(COPY_KEY(n)); });
        Local.save(); return { ok: true };
      },
    };

    // =====================================================================
    //  7. え（ゲンじい・つりびと・さかな・はいけい）
    //     ChatGPT で つくった 絵（img/）が あれば それを、なければ 自作の 絵を だす
    // =====================================================================
    const TalkCtx = createContext(null);
    const useTalk = () => useContext(TalkCtx);
    const SetCtx = createContext(DEFAULT_SETTINGS);
    const MISSING = new Set();

    // 絵（なければ fallback）
    function Pic({ file, alt, size, className = '', fallback, style }) {
      const [, setErr] = useState(0);
      if (!file || MISSING.has(file)) return fallback || null;
      return <img src={IMG + file} alt={alt || ''} onError={() => { MISSING.add(file); setErr(e => e + 1); }} className={`chara-img select-none ${className}`} style={{ width: size, height: size, objectFit: 'contain', ...style }} draggable={false} />;
    }

    // ふくの あおい ところを、えらんだ いろに ぬりかえる（ゲンじいの ベスト・つりびとの ふく）
    const RECOLOR_CACHE = new Map();
    function rgb2hsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
      if (mx === mn) return [0, 0, l];
      const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      return [h * 60, s, l];
    }
    function hsl2rgb(h, s, l) {
      h = ((h % 360) + 360) % 360 / 360;
      if (!s) return [l * 255, l * 255, l * 255];
      const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
      const f = (t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
      return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
    }
    function recolor(src, color) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            if (color.id === 'ao') { resolve(src); return; }
            const cv = document.createElement('canvas');
            cv.width = img.naturalWidth; cv.height = img.naturalHeight;
            const cx = cv.getContext('2d');
            cx.drawImage(img, 0, 0);
            const id = cx.getImageData(0, 0, cv.width, cv.height), a = id.data, W = cv.width, H = cv.height;
            for (let i = 0; i < a.length; i += 4) {
              if (a[i + 3] < 10) continue;
              const [h, s, l] = rgb2hsl(a[i], a[i + 1], a[i + 2]);
              if (h < 192 || h > 258 || s < 0.5 || l < 0.08 || l > 0.93) continue;
              const px = (i / 4) % W, py = Math.floor(i / 4 / W);
              const nh = color.niji ? (py / H) * 300 + (px / W) * 60 : color.h + (h - 222) * 0.4;
              const ns = Math.min(1, s * color.s), nl = Math.max(0.04, Math.min(0.96, l + color.l));
              const [r, g, b] = hsl2rgb(nh, ns, nl);
              a[i] = r; a[i + 1] = g; a[i + 2] = b;
            }
            cx.putImageData(id, 0, 0);
            resolve(cv.toDataURL('image/png'));
          } catch (e) { resolve(src); } // ぬりかえられない ときは そのまま
        };
        img.onerror = () => reject(new Error('no image'));
        img.src = src;
      });
    }
    // ぬりかえた 絵（なければ fallback の 自作の 絵）
    function useRecolored(file, color) {
      const key = file + '|' + color.id;
      const [src, setSrc] = useState(RECOLOR_CACHE.get(key) || null);
      const [fail, setFail] = useState(MISSING.has(file));
      useEffect(() => {
        setFail(MISSING.has(file));
        if (RECOLOR_CACHE.has(key)) { setSrc(RECOLOR_CACHE.get(key)); return; }
        if (MISSING.has(file)) return;
        let alive = true;
        recolor(IMG + file, color).then(u => { RECOLOR_CACHE.set(key, u); if (alive) setSrc(u); }).catch(() => { MISSING.add(file); if (alive) setFail(true); });
        return () => { alive = false; };
      }, [key]);
      return [src, fail];
    }
    const solidCss = (color) => (color.css && !color.css.startsWith('linear') ? color.css : color.id === 'kin' ? '#d97706' : color.id === 'gin' ? '#94a3b8' : '#2563eb');
    const fxOf = (color) => (color.niji ? 'niji' : color.shine ? 'shine' : '');

    // ゲンじい（自作の 絵。ChatGPT の 絵が ない ときに だす）
    function GenSvg({ size, mood, vest = '#2563eb' }) {
      const happy = mood === 'happy', cheer = mood === 'cheer';
      return (
        <svg viewBox="0 0 200 200" width={size} height={size}>
          <path d="M36 198 q2 -70 64 -76 q62 6 64 76z" fill="#f8fafc" stroke="#1e293b" strokeWidth="4" />
          <path d="M40 198 q2 -64 46 -72 l6 72z M160 198 q-2 -64 -46 -72 l-6 72z" fill={vest} stroke="#1e293b" strokeWidth="3" />
          <rect x="54" y="160" width="20" height="14" rx="3" fill="#fff" opacity=".35" />
          {cheer && <g><path d="M160 150 q20 -30 14 -56" stroke="#1e293b" strokeWidth="18" strokeLinecap="round" fill="none" /><path d="M160 150 q20 -30 14 -56" stroke={vest} strokeWidth="12" strokeLinecap="round" fill="none" /><circle cx="174" cy="88" r="14" fill="#e8b27d" stroke="#1e293b" strokeWidth="3" /></g>}
          <circle cx="100" cy="82" r="42" fill="#e8b27d" stroke="#1e293b" strokeWidth="4" />
          <ellipse cx="60" cy="86" rx="10" ry="16" fill="#f1f5f9" stroke="#94a3b8" strokeWidth="2" />
          <ellipse cx="140" cy="86" rx="10" ry="16" fill="#f1f5f9" stroke="#94a3b8" strokeWidth="2" />
          <path d="M58 62 q42 -22 84 0 l0 12 q-42 -20 -84 0z" fill="#f8fafc" stroke="#1e293b" strokeWidth="3" />
          <path d="M136 60 l18 -10 l-2 14 l14 4 l-18 6z" fill="#f8fafc" stroke="#1e293b" strokeWidth="3" />
          <path d="M70 80 q10 -8 20 0 M110 80 q10 -8 20 0" stroke="#f8fafc" strokeWidth="7" strokeLinecap="round" fill="none" />
          {happy
            ? <><path d="M74 92 q7 -8 14 0" stroke="#1e293b" strokeWidth="4" fill="none" strokeLinecap="round" /><path d="M112 92 q7 -8 14 0" stroke="#1e293b" strokeWidth="4" fill="none" strokeLinecap="round" /></>
            : <><circle cx="81" cy="92" r="5" fill="#1e293b" /><circle cx="119" cy="92" r="5" fill="#1e293b" /><circle cx="83" cy="90" r="1.6" fill="#fff" /><circle cx="121" cy="90" r="1.6" fill="#fff" /></>}
          <ellipse cx="100" cy="104" rx="9" ry="7" fill="#d6955b" />
          <path d="M76 116 q24 -12 48 0 q-10 26 -24 26 q-14 0 -24 -26z" fill="#f8fafc" stroke="#94a3b8" strokeWidth="2" />
          <path d="M88 118 q12 10 24 0" stroke="#7f1d1d" strokeWidth="4" fill={happy ? '#b91c1c' : 'none'} strokeLinecap="round" />
          <circle cx="68" cy="106" r="6" fill="#f87171" opacity=".35" /><circle cx="132" cy="106" r="6" fill="#f87171" opacity=".35" />
          {cheer && <text x="20" y="40" fontSize="30">💪</text>}
        </svg>
      );
    }
    const GEN_FILE = { normal: 'gen.webp', happy: 'gen_happy.webp', cheer: 'gen_cheer.webp' };
    // ゲンじい（ふくの いろと ぼうしは、おみせで かった もので かえられる）
    function Gen({ mood = 'normal', size = 120, className = '', look }) {
      const lk = look || { color: 'ao', hat: null };
      const color = COLOR[lk.color] || D.COLORS[0];
      const want = GEN_FILE[mood] || GEN_FILE.normal;
      const file = !MISSING.has(want) ? want : GEN_FILE.normal;
      const small = size < 90;
      const f2 = small ? file.replace('.webp', '_face.webp') : file;
      const [src, fail] = useRecolored(f2, color);

    const calcOf = (a, op, b) => { const r = op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : b === 0 ? NaN : a / b; return Math.round(r * 1e6) / 1e6; };

    // がめんの でんたく（ほんものの でんたくと おなじ ならび）

        if (disabled) return;

            return { ...s, disp: d, fresh: false, keys };
          }

            const r = calcOf(s.acc, s.op, Number(s.disp));
            return { disp: isFinite(r) && Math.abs(r) < 1e10 ? String(r) : 'E', acc: null, op: null, fresh: true, keys };
          }
          // ＋ − × ÷
          if (s.op && !s.fresh) {
            const r = calcOf(s.acc, s.op, Number(s.disp));
            return { disp: isFinite(r) && Math.abs(r) < 1e10 ? String(r) : 'E', acc: r, op: k, fresh: true, keys };

          return { ...s, acc: s.op && s.fresh ? s.acc : Number(s.disp), op: k, fresh: true, keys };
        });

      let glowKey = null, glowSubmit = false;
      if (guide && guide.length) {

        if (!pre) glowKey = 'C';
        else if (st.keys.length < guide.length) glowKey = guide[st.keys.length];
        else glowSubmit = true;
      }
      const ok = st.disp !== 'E';
      return (
        <div className="flex flex-col gap-2 items-stretch">
          <div className="rounded-[22px] px-3 pb-3 pt-2 border-4 border-slate-700 shadow-lg" style={{ background: 'linear-gradient(#475569,#334155)' }}>
            <div className="flex justify-between items-center mb-1">
              <span className="text-xs font-bold text-slate-200 tracking-widest">でんたく</span>

            </div>

      const [v, setV] = useState('');
      useEffect(() => { setV(''); }, [resetK]);
      const press = (k) => { if (disabled) return; Sound.key(); if (k === '⌫') setV(x => x.slice(0, -1)); else setV(x => (x + k).replace(/^0+(?=\d)/, '').slice(0, 10)); };
      return (
        <div className="flex flex-col gap-2">
          <div className="win-light px-3 py-2 text-lg font-bold leading-snug">🧮 てもとの でんたくで けいさん して、こたえを いれよう。</div>
          {guide && guide.length > 0 && <div className="bg-yellow-100 border-2 border-yellow-400 rounded-xl px-2 py-1 text-center"><div className="text-sm font-bold">でんたくで おす じゅんばん</div><div className="text-3xl font-bold seg">{keyText(guide)}</div></div>}
          <div className="rounded-lg px-3 py-1 border-4 border-slate-700 text-5xl font-bold text-right seg" style={{ background: '#fff' }}>{v || '　'}</div>
          <div className="grid grid-cols-3 gap-2">
            {['7', '8', '9', '4', '5', '6', '1', '2', '3', '0', '00', '⌫'].map(k => <button key={k} onClick={() => press(k)} className="calc-key h-12 rounded-xl border-2 border-slate-500 bg-slate-50 text-3xl font-bold">{k}</button>)}
          </div>
          <Btn onClick={() => v && onSubmit(Number(v), 'てもと')} disabled={disabled || !v} color="#15803d" light="#dcfce7" className="text-2xl">⬅ こたえを いれる</Btn>
        </div>
      );
    }
    // なんびき？（1〜10 の ボタン。まちがえた ボタンは けす）
    function CountPad({ onPick, off, glowN, disabled }) {
      return (
        <div className="flex flex-col gap-2">
          <div className="win-light px-3 py-2 text-xl font-bold">なんびき かな？</div>
          <div className="grid grid-cols-5 gap-2">
            {Array.from({ length: 10 }, (_, i) => i + 1).map(n => {
              const gone = off.includes(n);
              return <button key={n} disabled={gone || disabled} onClick={() => onPick(n)}
                className={`btn3d h-20 rounded-2xl border-2 text-4xl font-bold ${gone ? 'opacity-0' : 'bg-yellow-50 border-yellow-500'} ${glowN === n ? 'glow' : ''}`}>{n}</button>;
            })}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 10. つり（1もんに つき、さかなの しゅるいの かずだけ なげる）
    // =====================================================================
    function FishingScene({ pr, sp, look, uki, first, onCatch, onDone }) {
      const talk = useTalk();
      const [idx, setIdx] = useState(0);
      const [stage, setStage] = useState('ready'); // ready → wait → bite → show
      const [caught, setCaught] = useState([]);
      const alive = useRef(true);
      const timer = useRef(null);
      useEffect(() => {
        if (first) talk.say('「なげる」を おして、つりざおを ふろう！');
        return () => { alive.current = false; clearTimeout(timer.current); };
      }, []);
      const r = pr.rows[idx];
      const cast = () => {
        if (stage !== 'ready') return;
        Sound.cast(); setStage('wait');
        timer.current = setTimeout(() => { if (alive.current) { setStage('bite'); Sound.bite(); talk.say('うきが しずんだ！ いまだ、「ひく」を おそう！', { mood: 'cheer' }); } }, 1300 + Math.random() * 1900);
        setTimeout(() => Sound.splash(), 450);
      };
      const pull = async () => {
        if (stage === 'wait') { talk.say('まだ だよ。うきが しずむまで まとう。'); return; }
        if (stage !== 'bite') return;
        Sound.reel(); setStage('show');
        const fr = r;
        setCaught(c => [...c, fr]); onCatch(fr);
        if (isNushi(fr)) Sound.rare(); else Sound.seikai();
        const msg = isNushi(fr) ? `すごい！ ${fr.f.n}の ぬしだ！ ${cmText(fr.size)}も あるぞ！` : `${fr.f.n}が つれた！ ${fr.c > 1 ? 'たくさん つれたね。' : ''}`;
        await talk.say(msg, { mood: 'happy' });
        if (!alive.current) return;
        if (idx + 1 < pr.rows.length) { setIdx(idx + 1); setStage('ready'); talk.say(pick(['つぎも なげよう！', 'もう いちど なげよう！', 'つぎの さかなを つろう！'])); }
        else { await wait(300); if (alive.current) onDone(); }
      };
      // ふねの えもじは、つりばの 絵が ない ときだけ だす（絵には ふねが かいて ある）
      const [bgOk, setBgOk] = useState(!MISSING.has(`spot_${sp.id}.webp`));
      useEffect(() => { const im = new Image(); im.onerror = () => { MISSING.add(`spot_${sp.id}.webp`); setBgOk(false); }; im.src = IMG + `spot_${sp.id}.webp`; }, []);
      const boat = !bgOk && sp.id >= 5 && sp.id <= 6 ? (sp.id === 6 ? '🛥️' : '🚣') : null;
      const ukiE = uki ? uki.e : null;
      const cast_ = stage !== 'ready';
      const fx = cast_ ? 64 : 27, fy = cast_ ? 66 : 58;
      return (
        <div className="flex gap-3 w-full">
          <SpotBg sp={sp} className="flex-1 rounded-3xl border-4 border-sky-900" style={{ height: 'min(440px, calc(100vh - 230px))', minHeight: 330 }}>
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 w-full h-full pointer-events-none">
              <line x1="14" y1="72" x2="26" y2="36" stroke="#78350f" strokeWidth="1.1" vectorEffect="non-scaling-stroke" style={{ strokeWidth: 6 }} strokeLinecap="round" />
              <line x1="26" y1="36" x2={fx} y2={fy} stroke="#f8fafc" vectorEffect="non-scaling-stroke" style={{ strokeWidth: 2, transition: 'all .6s' }} />
            </svg>
            <div className="absolute" style={{ left: '2%', bottom: '4%' }}>
              {boat && <div className="absolute left-0 right-0 text-center" style={{ bottom: -18, fontSize: 120, lineHeight: 1 }}>{boat}</div>}
              <div className="relative"><Hero look={look} size={150} flip /></div>
            </div>
            <div className={`absolute ${stage === 'wait' ? 'uki-wait' : stage === 'bite' ? 'uki-bite' : ''}`} style={{ left: `${fx}%`, top: `${fy}%`, transform: 'translate(-50%, -50%)', transition: 'left .6s, top .6s' }}>
              {ukiE ? <span style={{ fontSize: 34 }}>{ukiE}</span>
                : <svg width="26" height="40" viewBox="0 0 26 40"><path d="M13 0 v8" stroke="#1c1917" strokeWidth="2" /><ellipse cx="13" cy="18" rx="9" ry="11" fill="#ef4444" stroke="#1c1917" strokeWidth="2" /><path d="M4 20 h18 a9 11 0 0 1 -18 0z" fill="#fff" stroke="#1c1917" strokeWidth="2" /></svg>}
            </div>
            {stage === 'bite' && <><div className="ring" style={{ left: `${fx}%`, top: `${fy + 4}%` }} /><div className="absolute text-6xl font-bold text-yellow-300 pop" style={{ left: `${fx + 3}%`, top: `${fy - 26}%`, textShadow: '3px 3px 0 #b91c1c' }}>！</div></>}
            {stage === 'show' && r && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div className="jump bg-white/95 rounded-3xl border-4 px-5 py-3 flex flex-col items-center gap-1" style={{ borderColor: isNushi(r) ? '#eab308' : '#0369a1', boxShadow: isNushi(r) ? '0 0 30px #facc15' : undefined }}>
                  {isNushi(r) && <div className="text-2xl font-bold text-amber-600">👑 ぬし</div>}
                  <div className="flex flex-wrap justify-center gap-1 max-w-[520px]">{Array.from({ length: r.c }, (_, j) => <FishPic key={j} f={r.f} size={r.c > 4 ? 76 : 110} />)}</div>
                  <div className="text-4xl font-bold">{r.f.n}</div>
                  <div className="text-lg font-bold text-sky-700">いちばん おおきいのは {cmText(r.size)}</div>
                </div>
              </div>
            )}
            <div className="absolute right-3 bottom-3 flex gap-3">
              <Btn onClick={cast} disabled={stage !== 'ready'} color="#0369a1" light="#e0f2fe" className={`text-3xl px-8 ${stage === 'ready' ? 'glow' : ''}`}>🎣 なげる</Btn>
              <Btn onClick={pull} disabled={stage === 'ready' || stage === 'show'} color="#b91c1c" light="#fee2e2" className={`text-3xl px-8 ${stage === 'bite' ? 'glow' : ''}`}>💪 ひく！</Btn>
            </div>
            <div className="absolute left-3 top-3 bg-white/90 rounded-full px-3 py-1 text-lg font-bold">{idx + 1} / {pr.rows.length}かいめ</div>
          </SpotBg>
          <div className="w-56 shrink-0 win-light p-2 flex flex-col gap-2 overflow-auto" style={{ maxHeight: 'min(440px, calc(100vh - 230px))' }}>
            <div className="text-lg font-bold text-center">🪣 つれた さかな</div>
            {caught.map((c, i) => <div key={i} className="rounded-xl bg-sky-50 border-2 border-sky-200 p-1 pop"><div className="text-sm font-bold">{c.f.n}</div><div className="flex flex-wrap">{Array.from({ length: c.c }, (_, j) => <FishPic key={j} f={c.f} size={34} />)}</div></div>)}
            {!caught.length && <div className="text-base text-stone-500 text-center">まだ いないよ</div>}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 11. けいさんの シート（スライドと おなじ ならび）
    // =====================================================================
    // さかなの むれ（さわると 1、2、3 と ばんごうが つく）
    function FishGroup({ r, size, marks, onTap, five, animN }) {
      const items = Array.from({ length: r.c }, (_, j) => j);
      const one = (j) => {
        const n = marks ? marks.indexOf(j) + 1 : 0;
        const an = animN != null && j < animN;
        return (
          <button key={j} onClick={() => onTap && onTap(j)} className={`relative rounded-lg ${an ? 'bg-yellow-200' : ''}`} style={{ padding: 1 }}>
            <FishPic f={r.f} size={size} />
            {(n > 0 || an) && <span className="absolute -top-1 -right-1 bg-rose-600 text-white rounded-full text-sm font-bold w-6 h-6 flex items-center justify-center pop">{an ? j + 1 : n}</span>}
          </button>
        );
      };
      if (five) {
        const gs = []; for (let k = 0; k < items.length; k += 5) gs.push(items.slice(k, k + 5));
        return <div className="flex flex-wrap gap-2" data-c={r.c}>{gs.map((g, k) => <div key={k} className="flex flex-wrap rounded-xl border-4 border-dashed border-rose-400 bg-rose-50/70 p-0.5">{g.map(one)}</div>)}</div>;
      }
      return <div className="flex flex-wrap" data-c={r.c}>{items.map(one)}</div>;
    }
    // ます（こたえを いれる はこ）
    function Box({ v, on, kind, unit, w = '6.5rem', big, sm, shake }) {
      return (
        <span className="inline-flex items-center gap-1">
          <span className={`box tag-${kind} ${on ? 'on' : ''} ${shake ? 'shake' : ''} ${big ? 'text-4xl' : sm ? 'text-2xl min-h-[2.3rem]' : 'text-3xl'}`} style={{ minWidth: w }}>{v == null ? (on ? '？' : '') : v}</span>
          {unit && <span className="text-2xl font-bold">{unit}</span>}
        </span>
      );
    }
    const PriceTag = ({ p, small }) => <span className={`box tag-p ${small ? 'text-lg min-h-0 py-0 px-1.5' : 'text-2xl'}`}>{small ? '' : '1ぴき '}{p}えん</span>;

    function Sheet({ pr, blanks, bi, vals, shakeK, hint, marks, onTap, anim, done }) {
      const cur = blanks[bi];
      const isOn = (t, r) => !done && cur && cur.t === t && (r == null || cur.r === r);
      const val = (t, r) => { const j = blanks.findIndex(b => b.t === t && (r == null || b.r === r)); return j >= 0 ? vals[j] : null; };
      const shakeOn = (t, r) => isOn(t, r) && shakeK > 0;
      const five = cur && cur.t === 'count' && hint >= 2;
      const animN = (r) => (anim && anim.r === r ? anim.n : null);
      const formula = cur && cur.t !== 'count' && hint >= 2 && !done;
      const FormulaHint = () => {
        if (!formula) return null;
        if (cur.t === 'mul') { const r = pr.rows[cur.r]; return <div className="pop flex items-center gap-2 text-4xl font-bold bg-white rounded-2xl border-4 border-yellow-400 px-4 py-1"><span className="box tag-p text-4xl">{r.p}</span>×<span className="box tag-c text-4xl">{r.c}</span>＝ ？</div>; }
        if (cur.t === 'add') { const r = pr.rows[cur.r]; return <div className="pop flex flex-wrap items-center gap-1 text-3xl font-bold bg-white rounded-2xl border-4 border-yellow-400 px-3 py-1">{Array(r.c).fill(0).map((_, i) => <React.Fragment key={i}>{i ? '＋' : ''}<span className="box tag-p text-3xl">{r.p}</span></React.Fragment>)}＝ ？</div>; }
        return <div className="pop flex flex-wrap items-center gap-1 text-3xl font-bold bg-white rounded-2xl border-4 border-yellow-400 px-3 py-1">{pr.rows.map((r, i) => <React.Fragment key={i}>{i ? '＋' : ''}<span className="box tag-m text-3xl">{r.m}</span></React.Fragment>)}＝ ？</div>;
      };

      if (pr.mode === 'count' || pr.mode === 'add' || pr.mode === 'mul') {
        const r = pr.rows[0], c = val('count', 0);
        return (
          <div className="flex flex-col gap-3 items-start w-full">
            <div className="win-light p-3 w-full flex flex-col gap-3">
              <div className="flex items-center gap-3"><FishPic f={r.f} size={90} /><span className="text-3xl font-bold">{r.f.n}</span>{isNushi(r) && <span className="text-xl font-bold text-amber-600">👑 ぬし</span>}<span className="flex-1" />{pr.mode !== 'count' && <PriceTag p={r.p} />}</div>
              <div className="bg-sky-50 rounded-2xl p-2"><FishGroup r={r} size={r.c > 6 ? 84 : 110} marks={marks[0]} onTap={(j) => onTap(0, j)} five={five} animN={animN(0)} /></div>
              <div className="flex items-center gap-3 text-2xl font-bold">つれた かず：<Box v={c} on={isOn('count', 0)} kind="c" unit="ひき" w="5rem" big shake={shakeOn('count', 0)} key={'c' + shakeK} /></div>
            </div>
            {pr.mode === 'add' && c != null && (
              <div className="win-light p-3 w-full flex flex-wrap items-center gap-2 text-3xl font-bold pop">
                {Array(r.c).fill(0).map((_, i) => <React.Fragment key={i}>{i ? <span>＋</span> : null}<span className="box tag-p text-3xl">{r.p}</span></React.Fragment>)}
                <span>＝</span><Box v={val('add', 0)} on={isOn('add', 0)} kind="m" unit="えん" big shake={shakeOn('add', 0)} key={'a' + shakeK} />
              </div>
            )}
            {pr.mode === 'mul' && c != null && (
              <div className="win-light p-3 w-full flex flex-wrap items-center gap-3 text-4xl font-bold pop">
                <span className="box tag-p text-4xl">{r.p}えん</span><span>×</span><span className="box tag-c text-4xl">{r.c}ひき</span><span>＝</span>
                <Box v={val('mul', 0)} on={isOn('mul', 0)} kind="m" unit="えん" big shake={shakeOn('mul', 0)} key={'m' + shakeK} />
              </div>
            )}
            {pr.mode === 'count' && done && (
              <div className="win-light p-3 flex flex-wrap items-center gap-2 text-3xl font-bold pop">
                <span className="text-xl">ゲンじいの けいさん：</span><span className="box tag-p">1ぴき {r.p}えん</span>×<span className="box tag-c">{r.c}ひき</span>＝<span className="box tag-t">{r.m}えん</span>
              </div>
            )}
            <FormulaHint />
          </div>
        );
      }
      // いくつかの しゅるい（スライド3まいめと おなじ ならび）
      const nr = pr.rows.length, small = nr >= 5, tiny = nr >= 7;
      const fs0 = nr <= 3 ? 58 : nr <= 5 ? 46 : 36;
      const fsOf = (c) => Math.min(fs0, Math.floor((tiny ? 400 : 430) / c));
      return (
        <div className="flex flex-col gap-1.5 w-full">
          {pr.rows.map((r, i) => (
            <div key={i} className={`flex items-center gap-2 rounded-2xl border-2 px-2 ${small ? 'py-0' : 'py-1'} ${cur && cur.r === i && !done ? 'bg-yellow-50 border-yellow-400' : 'bg-white/95 border-sky-200'}`}>
              <div className={`flex ${tiny ? 'flex-row gap-1 w-32' : 'flex-col w-24'} items-center shrink-0`}><FishPic f={r.f} size={tiny ? 34 : small ? 46 : 58} /><span className="text-sm font-bold leading-tight text-center">{isNushi(r) ? '👑' : ''}{r.f.n}</span></div>
              <div className="flex-1 min-w-0"><FishGroup r={r} size={fsOf(r.c)} marks={marks[i]} onTap={(j) => onTap(i, j)} five={five && cur.r === i} animN={animN(i)} /></div>
              <span className={`box tag-p ${small ? 'text-xl min-h-[2.4rem]' : 'text-2xl'}`}>{r.p}えん</span>
              <span className="text-2xl font-bold">×</span>
              <Box v={val('count', i)} on={isOn('count', i)} kind="c" unit="ひき" w="3.6rem" sm={tiny} shake={shakeOn('count', i)} key={'c' + i + '-' + shakeK} />
              <span className="text-2xl font-bold">＝</span>
              <Box v={val('mul', i)} on={isOn('mul', i)} kind="m" unit="えん" w={small ? '6.5rem' : '7.5rem'} sm={tiny} shake={shakeOn('mul', i)} key={'m' + i + '-' + shakeK} />
            </div>
          ))}
          <div className="flex flex-wrap items-center gap-1.5 rounded-2xl border-4 border-emerald-500 bg-emerald-50 px-3 py-1.5">
            <span className="text-2xl font-bold mr-1">ごうけい</span>
            {pr.rows.map((r, i) => <React.Fragment key={i}>{i ? <span className="text-xl font-bold">＋</span> : null}<span className={`box tag-m ${small ? 'text-base min-h-[2rem] px-1' : 'text-xl min-h-[2.2rem]'}`} style={{ minWidth: small ? '2.6rem' : '3.5rem' }}>{val('mul', i) ?? ''}</span></React.Fragment>)}
            <span className="text-2xl font-bold">＝</span>
            <Box v={val('total')} on={isOn('total')} kind="t" unit="えん" w="8rem" big={!small} shake={shakeOn('total')} key={'t' + shakeK} />
          </div>
          <FormulaHint />
        </div>
      );
    }

    // =====================================================================
    // 12. 1かいの つり（もんだい いくつか）
    // =====================================================================
    function Practice({ st, n, intro, progress, onRecord, onCatch, onSolved, onSave, onFinish, onQuit }) {
      const talk = useTalk();
      const step = STEP_OF(st), sp = SPOT[st.spot];
      const real = !!progress.realCalc;
      const [i, setI] = useState(0);
      const [pr, setPr] = useState(() => genProblem(st, progress, null));
      const [phase, setPhase] = useState('intro');
      const [bi, setBi] = useState(0);
      const [vals, setVals] = useState({});
      const [miss, setMiss] = useState(0);       // いまの ますで まちがえた かず
      const [hint, setHint] = useState(0);       // いまの ますの ヒント
      const [off, setOff] = useState([]);        // けした かずの ボタン
      const [marks, setMarks] = useState({});
      const [anim, setAnim] = useState(null);
      const [shakeK, setShakeK] = useState(0);
      const [resetK, setResetK] = useState(0);
      const [seikai, setSeikai] = useState(0);
      const [busy, setBusy] = useState(false);
      const P = useRef({ miss: 0, hint: 0, types: [], keys: [] });
      const stats = useRef({ ok: 0, all: 0, yen: 0 });
      const t0 = useRef(Date.now());
      const alive = useRef(true);
      const blanks = useMemo(() => blanksOf(pr), [pr]);
      const cur = blanks[bi];
      const calcWord = real ? 'てもとの でんたくで' : 'でんたくで';
      useEffect(() => () => { alive.current = false; }, []);
      useEffect(() => {
        (async () => {
          await talk.say(intro || `${sp.name}で つりを しよう！ ${step.topic}。`, { mood: 'happy' });
          if (alive.current) setPhase('fish');
        })();
      }, []);

      const ask = (b) => {
        const r = b.r != null ? pr.rows[b.r] : null;
        if (b.t === 'count') return pr.rows.length > 1 ? `${r.f.n}は なんびき かな？` : `${r.f.n}は なんびき つれたかな？ さわって かぞえて、かずを おそう。`;
        if (b.t === 'add') return `1ぴき ${r.p}えんが ${r.c}ひき。${calcWord}、${r.p}えんを ${r.c}かい たそう。`;
        if (b.t === 'mul') return pr.rows.length > 1 ? `${r.f.n}は、${r.p} × ${r.c} だね。${calcWord} けいさん しよう。` : `1ぴき ${r.p}えんが ${r.c}ひき。${calcWord}、${r.p} × ${r.c} を けいさん しよう。`;
        return `さいごに、ぜんぶの えんを たして、ごうけいを もとめよう。`;
      };
      const startSheet = () => {
        setPhase('sheet'); setBi(0); t0.current = Date.now();
        talk.say(pr.rows.length > 1 ? `つれた さかなを かぞえて、ねだんを けいさん しよう。まずは ${ask(blanks[0])}` : ask(blanks[0]));
      };
      const nextBlank = (j) => { setBi(j); setMiss(0); setHint(0); setOff([]); setAnim(null); setResetK(k => k + 1); };

      const doHint = async (lv) => {
        const b = cur, r = b.r != null ? pr.rows[b.r] : null;
        if (b.t === 'count') {
          if (lv === 1) talk.say(`${r.f.n}を 1ぴきずつ ゆびで さわって かぞえよう。さわると すうじが でるよ。`, { mood: 'cheer' });
          if (lv === 2) talk.say('5ひきずつ わくで かこんだよ。5の まとまりを つかって かぞえよう。', { mood: 'cheer' });
          if (lv === 3) {
            for (let k = 1; k <= r.c; k++) { if (!alive.current) return; setAnim({ r: b.r, n: k }); Sound.count(k); await new Promise(res => Speech.say(String(k), res)); }
            talk.say(`いっしょに かぞえたね。${r.c}ひき。ひかって いる かずを おそう。`, { mood: 'happy' });
          }
          return;
        }
        if (lv === 1) {
          if (b.t === 'add') talk.say(`${r.p}えんを ${r.c}かい たすよ。${calcWord}「${r.p}」「＋」「${r.p}」…と おして、さいごに「＝」だよ。`, { mood: 'cheer' });
          else if (b.t === 'mul') talk.say(`1ぴき ${r.p}えんが ${r.c}ひき だから、${r.p} × ${r.c}。${calcWord}「${r.p}」「×」「${r.c}」「＝」と おそう。`, { mood: 'cheer' });
          else talk.say('それぞれの えんを ぜんぶ たそう。「＋」で つないで、さいごに「＝」だよ。', { mood: 'cheer' });
        }
        if (lv === 2) talk.say(`しきを みてね。${b.t === 'total' ? 'オレンジの えんを ぜんぶ たすよ。' : 'あおが ねだん、きいろが なんびき だよ。'}`, { mood: 'cheer' });
        if (lv === 3) talk.say(real ? 'でんたくで おす じゅんばんを だしたよ。そのとおりに おそう。' : 'ひかって いる キーを じゅんばんに おそう。さいごに「こたえを いれる」だよ。', { mood: 'happy' });
      };
      const upHint = () => { if (busy || phase !== 'sheet') return; const lv = Math.min(3, hint + 1); setHint(lv); P.current.hint = Math.max(P.current.hint, lv); doHint(lv); };

      const answer = async (v, keys) => {
        if (busy || phase !== 'sheet') return;
        const b = cur, ans = answerOf(pr, b);
        if (b.t !== 'count') P.current.keys.push(`${b.t === 'total' ? 'ごうけい' : pr.rows[b.r].f.n}:${keys}→${v}${v === ans ? '○' : '✖'}`);
        if (v === ans) {
          const nv = { ...vals, [bi]: v };
          setVals(nv); Sound.coin();
          if (bi + 1 < blanks.length) {
            setBusy(true);
            const nb = blanks[bi + 1];
            let say = pick(['そうだね！', 'あたり！', 'いいね！']);
            if (b.t === 'mul' && pr.mode === 'mul' && i === 0 && !progress.seenMul) say = `せいかい！ ${Array(pr.rows[0].c).fill(pr.rows[0].p).join('＋')} と おなじ こたえ だね。× を つかうと はやいね！`;
            nextBlank(bi + 1);
            await talk.say(`${say} ${ask(nb)}`, { mood: 'happy' });
            if (alive.current) setBusy(false);
            return;
          }
          finishProblem(nv);
          return;
        }
        // まちがい
        const type = classify(pr, b, v);
        P.current.miss++; P.current.types.push(type);
        setShakeK(k => k + 1); Sound.retry();
        if (b.t === 'count') setOff(o => uniq([...o, v]));
        setResetK(k => k + 1);
        const m = miss + 1; setMiss(m);
        const w = missWord(pr, b, type, v);
        if (m >= 3 && hint < 3) { setHint(3); P.current.hint = 3; await talk.say(w, { mood: 'cheer' }); if (alive.current) doHint(3); }
        else talk.say(w, { mood: 'cheer' });
      };

      const finishProblem = async (nv) => {
        setBusy(true); setPhase('done');
        const res = P.current;
        const result = res.miss || res.hint ? '△' : '○';
        stats.current.all++; if (result === '○') stats.current.ok++;
        stats.current.yen += pr.total;
        onRecord({
          stage: st.id, spot: sp.name, step: step.name, mondai: probText(pr), total: pr.total, result,
          miss: res.miss, hint: res.hint, types: uniq(res.types).join('・'), keys: res.keys.join(' ／ '), calc: real ? 'てもと' : 'がめん',
          secs: Math.round((Date.now() - t0.current) / 100) / 10,
        });
        onSolved(pr.total, pr.mode === 'mul');
        setSeikai(x => x + 1); Sound.seikai();
        await talk.say(pr.mode === 'count' ? `${pr.rows[0].c}ひき！ 1ぴき ${pr.rows[0].p}えん だから、ぜんぶで ${pr.total}えん。${pr.total}えん もらえるよ！` : `ぜんぶで ${pr.total}えん！ ${pr.total}えん もらえるよ！`, { mood: 'happy' });
        if (!alive.current) return;
        setSeikai(0);
        if (i + 1 >= n) { onFinish({ ...stats.current, n }); return; }
        onSave({ st: st.id, left: n - i - 1 });
        P.current = { miss: 0, hint: 0, types: [], keys: [] };
        setPr(genProblem(st, progress, pr.key)); setI(i + 1); setVals({}); setMarks({}); nextBlank(0); setBi(0); setPhase('fish'); setBusy(false);
      };

      const tapFish = (r, j) => {
        if (phase !== 'sheet') return;
        const m = marks[r] || [];
        if (m.includes(j)) return;
        const nm = [...m, j];
        setMarks({ ...marks, [r]: nm }); Sound.count(nm.length); Speech.say(String(nm.length));
      };
      const guide = cur && cur.t !== 'count' && hint >= 3 && phase === 'sheet' ? keysOf(pr, cur) : null;

      return (
        <div className="w-full max-w-[1400px] flex flex-col gap-2 px-2">
          <MsgWin size={56} compact />
          <div className="flex items-center gap-3 w-full">
            <div className="text-lg font-bold bg-white rounded-2xl px-3 py-0.5 border-2 border-sky-900 shrink-0">{sp.icon} {stageName(st)}</div>
            <div className="text-lg font-bold text-sky-900 truncate bg-white/90 rounded-full px-3">{step.topic}</div>
            <div className="flex-1" /><div className="text-xl font-bold text-stone-700 bg-white/90 rounded-full px-3">{i + 1} / {n}もん</div>
            <button onClick={onQuit} className="btn3d bg-white border-2 border-stone-300 rounded-2xl px-3 py-1 text-lg font-bold shrink-0">✋ やめる</button>
          </div>
          {phase === 'intro' && <div className="h-80 flex items-center justify-center text-7xl floaty">🎣</div>}
          {phase === 'fish' && <FishingScene key={'f' + i} pr={pr} sp={sp} look={progress.look} uki={ukiOf(progress)} first={i === 0} onCatch={onCatch} onDone={startSheet} />}
          {(phase === 'sheet' || phase === 'done') && (
            <div className="flex gap-3 items-start w-full">
              <div className="flex-1 min-w-0"><Sheet pr={pr} blanks={blanks} bi={bi} vals={vals} shakeK={shakeK} hint={hint} marks={marks} onTap={tapFish} anim={anim} done={phase === 'done'} /></div>
              <div className="w-[330px] shrink-0 flex flex-col gap-2">
                {phase === 'sheet' && <>
                  <div className="flex gap-2">
                    <button onClick={upHint} className={`btn3d flex-1 rounded-2xl border-2 border-yellow-500 bg-yellow-100 px-3 py-2 text-xl font-bold ${miss >= 2 && hint < 3 ? 'glow' : ''}`}>
                      💡 ヒント{hint > 0 ? <span className="ml-1">{'●'.repeat(hint)}{'○'.repeat(3 - hint)}</span> : null}
                    </button>
                    {cur.t === 'count' && <button onClick={() => { Sound.tap(); setMarks({ ...marks, [cur.r]: [] }); }} className="btn3d rounded-2xl border-2 border-stone-300 bg-white px-3 py-2 text-lg font-bold">↺ かぞえなおす</button>}
                  </div>
                  {cur.t === 'count'
                    ? <CountPad onPick={(v) => answer(v)} off={off} glowN={hint >= 3 && anim && anim.n >= pr.rows[cur.r].c ? pr.rows[cur.r].c : null} disabled={busy} />
                    : real ? <NumPad onSubmit={answer} guide={guide} resetK={`${bi}-${resetK}`} disabled={busy} />
                    : <Calculator onSubmit={answer} guide={guide} resetK={`${bi}-${resetK}`} disabled={busy} />}
                </>}
                {phase === 'done' && <div className="text-7xl text-center floaty pt-10">🎉</div>}
              </div>
            </div>
          )}
          <Seikai show={seikai} text={`${pr.total}えん！`} />
        </div>
      );
    }

    const topOf = (m, n = 5) => Object.entries(m || {}).sort((a, b) => b[1] - a[1]).slice(0, n);
    const rateColor = (a, b) => !b ? '#fff' : a / b < 0.6 ? '#fecaca' : a / b < 0.8 ? '#fef08a' : '#bbf7d0';
    const TYPE_NOTE = {
      'ゼロの かず': '0の数がちがった（60 と 600、2000 と 200 など。けたの まちがい）',
      '＋と ×': 'かけ算のところで「＋」を押した（200＋3＝203 など）、または たし算で「×」を押した',
      'かぞえまちがい': 'つれた魚の数を、かぞえまちがえた',
      'たしわすれ': 'ごうけいで、たしていない えんが あった',
      'たしすぎ': 'ごうけいで、同じ えんを2回たした',
      'たす かいすう': 'たし算で、たす回数が多い・少ない（かけ算では、かける数がちがった）',
      'ちがう ねだん': 'ほかの魚の ねだんを使った',
      'おしまちがい': '上のどれにも当てはまらない、電卓の押しまちがい',
    };
    const STEP_ROWS = () => [...D.STEPS.map(s => [`${s.k}`, `${'⓪①②③④⑤'[s.k]} ${s.name}`]), ...D.HATTEN_STEPS.map(s => [`はってん${s.k}`, `✨ ${s.name}`])];

        <table className="text-sm border-collapse w-full">
