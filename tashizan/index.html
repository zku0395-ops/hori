<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>たしざん ひっさん クエスト</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"UD デジタル 教科書体 NK-R","UD デジタル 教科書体 N-R","BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  background:#1d3b2a;color:#222;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{max-width:960px;margin:0 auto;min-height:100%;background:#f7f3e3;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#3b2a6b;color:#fff;font-size:20px}
.bar .sp{flex:1}
.bar .pill{background:#fff2;border-radius:20px;padding:4px 12px;white-space:nowrap}
.bar button{white-space:nowrap;font-size:18px;border:0;border-radius:12px;padding:8px 14px;background:#ffd54a;color:#333;font-weight:bold}
.expwrap{width:110px;height:12px;background:#fff3;border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.expbar{height:100%;background:#7CFC9a;width:0}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
h2{margin:14px 0 6px;text-align:center;font-size:28px}
.pic{display:inline-block;line-height:1}
.pic img{height:1em;width:auto;vertical-align:middle}

/* まち */
#map{position:relative;flex:1;min-height:520px;overflow:hidden;
  background:
   radial-gradient(circle at 12% 15%,#2e7d32 0 9%,transparent 10%),
   radial-gradient(circle at 90% 12%,#2e7d32 0 8%,transparent 9%),
   radial-gradient(circle at 6% 80%,#2e7d32 0 8%,transparent 9%),
   radial-gradient(circle at 94% 85%,#2e7d32 0 9%,transparent 10%),
   linear-gradient(#8bd36a,#6cc04f);background-size:cover;background-position:center}
#map .road{position:absolute;background:#d9c59a;border-radius:20px}
.bld{position:absolute;transform:translate(-50%,-50%);border:0;background:none;text-align:center;padding:0}
.bld .ic{font-size:128px;filter:drop-shadow(0 6px 4px #0004);display:block;transition:transform .15s}
.bld:active .ic{transform:scale(.92)}
.bld .lb{display:inline-block;background:#fff;border:3px solid #3b2a6b;border-radius:16px;padding:4px 12px;font-size:22px;font-weight:bold;color:#3b2a6b}
.bld.main .ic{animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#title{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:30px;font-weight:bold;color:#fff;text-shadow:0 3px 0 #3b2a6b,0 0 8px #3b2a6b}

/* ぼうけんの ちず */
#wmap{position:relative;width:100%;aspect-ratio:16/10;max-height:66vh;overflow:hidden;
  background:linear-gradient(#9fdcff 0 12%,#b7e39a 22%,#86d166 55%,#6cc04f);background-size:cover;background-position:center}
#wmap svg{position:absolute;inset:0;width:100%;height:100%}
#wmap polyline{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.pa{stroke:#fff8;stroke-width:14;stroke-dasharray:4 18}
.pb{stroke:#e2c27a;stroke-width:18}
.deco{position:absolute;transform:translate(-50%,-50%);pointer-events:none;opacity:.95}
.nd{position:absolute;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;border:5px solid #3b2a6b;background:#fff;padding:0;z-index:2}
.nd .no{font-size:26px;font-weight:bold;color:#3b2a6b}
.nd .nm{position:absolute;left:50%;bottom:92%;transform:translateX(-50%);font-size:44px;filter:drop-shadow(0 3px 2px #0005)}
.nd.cl{background:#ffe27a}
.nd.lk{background:#ccc;border-color:#888}.nd.lk .no{color:#777}.nd.lk .nm{font-size:28px}
.nd.boss{width:72px;height:72px;border-color:#c62828}.nd.boss .nm{font-size:58px}
.nd.nx{animation:glow 1s infinite}
.nd.tw{width:auto;height:auto;border-radius:16px;padding:2px 10px;font-size:20px;font-weight:bold;color:#3b2a6b}
.nd.tw .nm{font-size:60px}
#whero{position:absolute;transform:translate(-110%,-80%);font-size:76px;z-index:3;transition:left .36s linear,top .36s linear;pointer-events:none;filter:drop-shadow(0 4px 2px #0006)}
#whero .pic{animation:bob .6s infinite;display:inline-block}
#wInfo{display:flex;align-items:center;gap:10px;padding:12px;flex-wrap:wrap;justify-content:center}
#wInfo .wt{cursor:pointer;flex:1;min-width:240px;font-size:22px;background:#fff;border:4px solid #3b2a6b;border-radius:16px;padding:10px 14px}
#wInfo button{font-size:22px;font-weight:bold;border:0;border-radius:16px;padding:14px 16px;background:#fff;box-shadow:0 5px 0 #b9ae86;color:#3b2a6b}
#wInfo button.go{background:#e53935;color:#fff;box-shadow:0 5px 0 #8e1c1a;font-size:26px}
#wInfo button.go.tn{background:#3b2a6b;box-shadow:0 5px 0 #1e1440}
#wInfo button:disabled{opacity:.35}
@media(max-width:640px){.bar{font-size:16px;gap:6px;padding:6px 8px}.bar button{font-size:15px;padding:6px 8px}.expwrap{width:50px}#field{height:190px}#mon{font-size:110px;top:40px}#hero{font-size:96px}.nd{width:40px;height:40px;border-width:3px}.nd .no{font-size:18px}.nd .nm{font-size:28px}.nd.boss{width:48px;height:48px}.nd.boss .nm{font-size:36px}.nd.tw .nm{font-size:36px}.nd.tw{font-size:14px}#whero{font-size:36px}}

/* バトル */
#field{position:relative;height:240px;background:linear-gradient(#8fd3ff 0 55%,#7ccf5e 55%);background-size:cover;background-position:center;overflow:hidden}
#mon{position:absolute;right:12%;top:46px;font-size:150px;transition:transform .2s}
#mon.hit{animation:hit .5s}
#mon.dead{transition:all .8s;transform:rotate(40deg) scale(.1);opacity:0}
@keyframes hit{20%{transform:translateX(18px) rotate(8deg);filter:brightness(2)}60%{transform:translateX(-10px)}}
#hero{position:absolute;left:10%;bottom:8px;font-size:130px}
#hero.atk{animation:atk .5s}
@keyframes atk{40%{transform:translateX(160px) scale(1.15)}}
#slash{position:absolute;right:16%;top:70px;font-size:110px;opacity:0;pointer-events:none}
#slash.go{animation:sl .5s}
@keyframes sl{30%{opacity:1;transform:scale(1.3) rotate(-20deg)}100%{opacity:0;transform:scale(1.6)}}
#monInfo{position:absolute;right:8px;top:6px;max-width:42%;text-align:right;line-height:1.3;background:#fffd;border-radius:12px;padding:4px 10px;font-size:20px;font-weight:bold}
#msg{position:absolute;left:8px;top:6px;cursor:pointer;z-index:2;background:#fffd;border-radius:12px;padding:6px 12px;font-size:22px;font-weight:bold;max-width:55%}
#work{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;padding:12px}
#hissan{background:#fff;border:4px solid #3b2a6b;border-radius:18px;padding:14px 22px 18px}
.row{display:grid;grid-template-columns:60px 84px 84px 84px 216px}
.hc{display:flex;align-items:center;padding-left:16px;font-size:20px;color:#888}
.cell{position:relative;height:92px;display:flex;align-items:center;justify-content:center;font-size:68px;font-weight:bold}
.kurai .cell{height:46px;font-size:24px;color:#666;font-weight:normal}
rt{font-size:.55em;font-weight:normal}
.line{height:6px;background:#222;border-radius:3px;margin:8px 0 10px}
.box{width:74px;height:84px;border:4px solid #999;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fafafa;color:#1565c0}
.cbox{position:absolute;right:-17px;bottom:-6px;width:34px;height:40px;border:3px dashed #999;border-radius:8px;font-size:28px;
  display:flex;align-items:center;justify-content:center;background:#fff;color:#e65100;z-index:2}
.box.act,.cbox.act{border-color:#ff9800;border-style:solid;background:#fff3c4;animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 7px #ffb30066}}
.ng{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#side{flex:1;min-width:280px;max-width:420px;display:flex;flex-direction:column;gap:10px}
#hintBtn{font-size:24px;font-weight:bold;border:4px solid #00897b;background:#e0f7f4;border-radius:16px;padding:12px;color:#00695c}
#hintBtn.pulse{animation:glow 1s infinite;background:#fff3c4}
#hint{background:#fff;border:3px solid #00897b;border-radius:16px;padding:10px;font-size:20px;display:none}
#hint.on{display:block}
.grp{margin:6px 0;display:flex;align-items:center;gap:8px}
.grp .gl{width:5.2em;font-size:18px;flex:none}
.dots{display:grid;grid-template-columns:repeat(5,36px);gap:5px}
.dot{width:36px;height:36px;cursor:pointer;border-radius:50%;border:3px solid #0003;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:#fff}
.dot.r{background:#ef5350}.dot.b{background:#42a5f5}.dot.y{background:#ffb300}
.dot.cnt{outline:4px solid #222;outline-offset:1px}
#pad{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;padding:10px 12px 16px;margin-top:auto;background:#e9e2c8}
#pad button{font-size:40px;font-weight:bold;height:76px;border-radius:16px;border:0;background:#fff;box-shadow:0 5px 0 #b9ae86;color:#222}
#pad button:active{transform:translateY(4px);box-shadow:0 1px 0 #b9ae86}
/* Chromebook など、たての ひくい がめんでは すこし ちいさく */
@media(max-height:820px){#field{height:170px}#mon{font-size:112px;top:36px}#hero{font-size:118px}#slash{top:40px;font-size:90px}
  #work{padding:8px 12px}#hissan{padding:6px 18px 10px}.kurai .cell{height:38px}.cell{height:70px;font-size:56px}.box{width:62px;height:66px}.line{margin:4px 0 6px}
  #pad{padding:8px 12px 10px}#pad button{height:62px;font-size:34px}}
@media(max-width:640px){#pad{grid-template-columns:repeat(5,1fr)}.row{grid-template-columns:34px 58px 58px 58px 150px}.hc{padding-left:10px}.dots{grid-template-columns:repeat(5,25px);gap:3px}.dot{width:25px;height:25px;font-size:13px;border-width:2px}.cell{font-size:52px;height:76px}.box{width:60px;height:70px}}

/* いえ・みせ・たから */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px}
.card{background:#fff;border:4px solid #3b2a6b;border-radius:18px;padding:10px;text-align:center;font-size:20px}
.card{word-break:keep-all;overflow-wrap:anywhere}   /* なまえは ことばの きれめで おりかえす */
.card .e{font-size:92px;line-height:1.1}
.card .e img{max-width:100%;object-fit:contain}
.card.no{opacity:.35}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 12px 0}
.cats button{font-size:20px;font-weight:bold;border:0;border-radius:16px;padding:10px 11px;background:#fff;box-shadow:0 5px 0 #b9ae86;color:#3b2a6b;white-space:nowrap}
.cats button:active{transform:translateY(4px);box-shadow:0 1px 0 #b9ae86}
.cats button.on{background:#3b2a6b;color:#fff;box-shadow:0 5px 0 #1e1440}
.cats button small{font-size:15px;font-weight:normal;opacity:.8}
.grp{font-size:22px;font-weight:bold;color:#3b2a6b;padding:10px 16px 0}
.card button{white-space:nowrap;font-size:19px;font-weight:bold;border:0;border-radius:12px;padding:8px 12px;background:#ffd54a;margin-top:4px}
.card button:disabled{background:#ccc;color:#777}
#homeTop{text-align:center;font-size:24px;padding:10px}
#homeTop .big{font-size:130px;display:flex;align-items:flex-end;justify-content:center;gap:10px}
#homeTop .holds{display:inline-flex;gap:8px;font-size:.62em;align-items:flex-end}
#hero .holds{position:absolute;left:92%;bottom:0;display:flex;gap:4px;font-size:.44em;align-items:flex-end;white-space:nowrap}
.card.held{border-color:#ff9800;background:#fff3c4}
.card .hb{font-size:17px;font-weight:bold;color:#e65100}
.card button.off{background:#fff;border:3px solid #999}
.card button[data-hold]{font-size:22px;padding:10px 22px;box-shadow:0 4px 0 #b9ae86}
.card button[data-hold]:active{transform:translateY(3px);box-shadow:0 1px 0 #b9ae86}
#reset{margin:20px auto;font-size:16px;border:2px solid #999;background:#fff;border-radius:10px;padding:6px 12px;color:#666}

/* なまえを えらぶ(Apps Script で うごかす とき) */
#s-name{align-items:center;padding:20px 14px;background:#f7f3e3}
#s-name h1{font-size:34px;color:#3b2a6b;margin:10px 0 4px;text-align:center}
#s-name .sub{font-size:24px;margin-bottom:14px}
#nameList{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;width:100%;max-width:820px}
#nameList button{font-size:30px;font-weight:bold;padding:22px 10px;border:0;border-radius:20px;background:#fff;color:#3b2a6b;box-shadow:0 6px 0 #b9ae86}
#nameList button:active{transform:translateY(4px);box-shadow:0 2px 0 #b9ae86}
#nameMsg{font-size:22px;text-align:center;margin:14px}
#nameMsg button{font-size:22px;font-weight:bold;border:0;border-radius:14px;padding:10px 20px;background:#ffd54a;margin-top:8px}
#net{font-size:15px;opacity:.85;white-space:nowrap}

/* せんせいよう */
.bar #tBtn{background:#fff3;color:#fff}
#s-teacher{padding:10px 14px 24px;font-family:"BIZ UDPGothic","Yu Gothic",sans-serif}
#s-teacher h2{font-size:24px}
.ttabs{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.ttabs button{font-size:20px;font-weight:bold;border:3px solid #3b2a6b;background:#fff;color:#3b2a6b;border-radius:14px;padding:8px 18px}
.ttabs button.on{background:#3b2a6b;color:#fff}
.tbox{background:#fff;border:3px solid #3b2a6b;border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:18px}
.tbox h3{margin:0 0 8px;font-size:20px}
.tbox table{border-collapse:collapse;width:100%;font-size:16px}
.tbox th,.tbox td{border:1px solid #ccc;padding:4px 6px;text-align:center}
.tbox th{background:#eee8f8}
.tbox td.l{text-align:left}
.tbox .hi{background:#ffe0e0;font-weight:bold}
.tbox button,.tbox select{font-size:18px;font-family:inherit;border:2px solid #3b2a6b;border-radius:10px;padding:6px 12px;background:#fff;margin:4px 4px 4px 0}
.tbox button.on{background:#3b2a6b;color:#fff}
.tbox .note{color:#666;font-size:15px}
.tbox .danger{border-color:#c62828;color:#c62828}
#pinShow{font-size:40px;letter-spacing:12px;margin:8px 0}
.pinPad{display:grid;grid-template-columns:repeat(3,80px);gap:8px;justify-content:center}
.pinPad button{margin:0!important;padding:0!important;height:64px;font-size:30px!important;background:#fff!important;color:#222!important;border:2px solid #999!important}
/* もじを おおきく */
body.big #msg{font-size:28px}body.big #wInfo .wt{font-size:27px}body.big #hint{font-size:24px}body.big .card{font-size:24px}body.big #ovBox{font-size:30px}body.big .bld .lb{font-size:26px}

/* しゅじんこうを えらぶ */
#heroChg{font-size:22px;font-weight:bold;border:0;border-radius:16px;padding:12px 20px;background:#fff;box-shadow:0 5px 0 #b9ae86;color:#3b2a6b}
#heroChg:active{transform:translateY(4px);box-shadow:0 1px 0 #b9ae86}
#ovBox.wide{max-width:860px}
.hsel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px;margin:8px 0}
.hsel button{margin:0!important;padding:8px 4px!important;background:#fff!important;color:#3b2a6b!important;border:5px solid #bbb!important;border-radius:18px!important;font-size:22px!important;box-shadow:0 5px 0 #b9ae86}
.hsel button.on{border-color:#ff9800!important;background:#fff3c4!important}
.hsel .e{font-size:120px!important;display:block}
@media(max-width:640px){#ovBox.wide{padding:14px 10px;font-size:22px}.hsel button{font-size:17px!important;white-space:nowrap}.hsel{grid-template-columns:repeat(2,1fr)}.hsel .e{font-size:64px!important}}
@media(max-height:820px){#ovBox.wide{padding:10px 20px}.hsel .e{font-size:92px!important}.hsel button{font-size:20px!important;padding:4px!important}#ovBox.wide>button{margin-top:4px;padding:8px 26px}}

/* オーバーレイ */
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#ov.on{display:flex}
#ovBox{background:#fff;border-radius:24px;border:6px solid #ffd54a;padding:22px 28px;text-align:center;font-size:26px;max-width:520px;width:100%}
#ovBox .e{font-size:120px;line-height:1.1}
#ovBox .e.tap{animation:bob 1s infinite;cursor:pointer}
#ovBox button{font-size:26px;font-weight:bold;border:0;border-radius:16px;padding:12px 26px;background:#3b2a6b;color:#fff;margin-top:12px}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button id="backBtn" style="display:none">◀ まちへ</button>
    <span class="pill">レベル <b id="lv">1</b><span class="expwrap"><span class="expbar" id="expbar" style="display:block"></span></span></span>
    <span class="pill">🪙 <b id="coin">0</b></span>
    <span class="sp"></span>
    <span id="net"></span>
    <button id="sndBtn">🔊</button>
    <button id="tBtn" title="せんせいよう">🔒</button>
  </div>

  <!-- なまえを えらぶ(Apps Script で うごかす ときだけ) -->
  <div class="screen" id="s-name">
    <h1>たしざん ひっさん クエスト</h1>
    <div class="sub">じぶんの なまえを おしてね</div>
    <div id="nameList"></div>
    <div id="nameMsg"></div>
  </div>

  <!-- まち -->
  <div class="screen" id="s-town">
    <div id="map">
      <div class="road" style="left:46%;top:20%;width:8%;height:70%"></div>
      <div class="road" style="left:12%;top:62%;width:76%;height:9%"></div>
      <div id="title">たしざん ひっさん クエスト</div>
      <button class="bld main" style="left:50%;top:27%" data-go="world"><span class="ic" id="b-gate"></span><span class="lb">まちの そとへ</span></button>
      <button class="bld" style="left:18%;top:70%" data-go="home"><span class="ic" id="b-home"></span><span class="lb">あなたの いえ</span></button>
      <button class="bld" style="left:50%;top:80%" data-go="shop"><span class="ic" id="b-shop"></span><span class="lb">おみせ</span></button>
      <button class="bld" style="left:82%;top:70%" data-go="tre"><span class="ic" id="b-tre"></span><span class="lb">たからの へや</span></button>
    </div>
  </div>

  <!-- ぼうけんの ちず -->
  <div class="screen" id="s-world">
    <div id="wmap"></div>
    <div id="wInfo"></div>
  </div>

  <!-- バトル -->
  <div class="screen" id="s-battle">
    <div id="field">
      <div id="msg"></div>
      <div id="monInfo"></div>
      <div id="hero"></div>
      <div id="mon"></div>
      <div id="slash">💥</div>
    </div>
    <div id="work">
      <div id="hissan"></div>
      <div id="side">
        <button id="hintBtn">💡 ヒント</button>
        <div id="hint"></div>
      </div>
    </div>
    <div id="pad"></div>
  </div>

  <!-- いえ -->
  <div class="screen" id="s-home">
    <div id="homeTop"></div>
    <div style="text-align:center"><button id="heroChg">しゅじんこうを かえる</button></div>
    <h2>もちもの <span id="homeCnt" style="font-size:20px"></span></h2>
    <div id="homeHow" style="text-align:center;font-size:20px;padding:0 12px"></div>
    <div id="homeItems"></div>
  </div>

  <!-- みせ -->
  <div class="screen" id="s-shop">
    <h2>おみせ</h2>
    <div class="cats" id="shopCats"></div>
    <div class="list" id="shopList"></div>
  </div>

  <!-- たから -->
  <div class="screen" id="s-tre">
    <h2>たからの へや</h2>
    <div class="list" id="treList"></div>
  </div>

  <!-- せんせいよう -->
  <div class="screen" id="s-teacher"></div>
</div>

<div id="ov"><div id="ovBox"></div></div>

<script>
/* ====== がぞうの さしかえ ======
   Canvaで つくった がぞう(img フォルダ)の ばしょを いれると、えもじの かわりに ひょうじされます。
   からっぽ('')の ままなら えもじで うごきます。 */
const IMG = {
  townBg:'img/town-bg.jpg',      // まちの はいけい(よこなが)
  worldBg:'img/world-bg.jpg',    // ぼうけんの ちずの はいけい(よこなが)
  battleBg:'img/battle-bg.jpg',  // バトルの はいけい(よこなが)
  hero:'img/hero.png',           // しゅじんこう(まほうつかい)

let ac=null;
function tone(f,t,d,type){if(!S.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||'triangle';o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  const s=ac.currentTime+t;g.gain.setValueAtTime(.18,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}

   せりふを にほんごの こえで よみます。すこし ゆっくりめ(VOICE_RATE)。🔊/🔇 ボタンで けせます。 */
const VOICE_RATE=0.85;
let jaVoice=null,lastSpeak='';
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));jaVoice=v.find(v=>/google/i.test(v.name))||v[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
// がめんの もじ(HTML)から、よむ ことばだけを とりだす
function plain(t){
  return String(t).replace(/<button[\s\S]*?<\/button>/g,' ')
    .replace(/<ruby>[\s\S]*?<rt>([\s\S]*?)<\/rt><\/ruby>/g,'$1')
    .replace(/<br\s*\/?>|<\/div>/g,'。').replace(/<[^>]+>/g,'')
    .replace(/[一十百]/g,k=>RUBY[k]).replace(/＋/g,' たす ').replace(/（|）/g,'、')
    .replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F\u200D]/gu,'').replace(/[　\s]+/g,' ').replace(/、\s*。/g,'。').replace(/(。\s*)+/g,'。').replace(/^。/,'').trim();
}
function speak(t){
  const x=plain(t);if(!x)return;lastSpeak=x;
  if(!S.snd||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang='ja-JP';u.rate=S.cfg.rate||VOICE_RATE;if(jaVoice)u.voice=jaVoice;speechSynthesis.speak(u)}catch(e){}
}
function speakAgain(){if(lastSpeak)speak(lastSpeak)}

/* ====== もんだい ====== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function gen(t){
  for(let k=0;k<5000;k++){
    const a10=R(1,9),a1=R(0,9),b10=R(0,9),b1=R(0,9),o=a1+b1,c=o>=10?1:0,tt=a10+b10+c;
    let ok=false;
    if(t===1)ok=b10===0&&b1>=1&&a1>=1&&o<=9;
    if(t===2)ok=b10>=1&&o<=9&&o>=1&&tt<=9;
    if(t===3)ok=a1===0&&b1===0&&b10>=1&&tt<=9;
    if(t===4)ok=b10===0&&o>=10&&a10<=8;
    if(t===5)ok=b10>=1&&o>=11&&tt<=9;
    if(t===6)ok=o===10&&tt<=9;
    if(t===8)ok=a1===0&&b1===0&&tt>=10;
    if(t===9)ok=b10>=1&&o<=9&&o>=1&&tt>=10;
    if(t===10)ok=b10>=1&&o>=10&&tt>=10;
    if(ok)return {a10,a1,b10,b1,o,c,tt,a:a10*10+a1,b:b10*10+b1};
  }
  return {a10:2,a1:3,b10:0,b1:4,o:7,c:0,tt:2,a:23,b:4};
}

function nextQ(){
  let P,k=0;do{P=gen(B.st.types[R(0,B.st.types.length-1)]);k++}while(B.used[P.a+'+'+P.b]&&k<50);
  B.used[P.a+'+'+P.b]=1;B.P=P;B.step=0;B.wrong=0;B.busy=false;B.miss={o:0,c:0,t:0,h:0};B.hintUsed=0;B.autoUsed=0;
  const sum=P.a+P.b;

   '<div class="row"><div class="cell">＋</div><div class="cell"></div><div class="cell">'+(P.b10||'')+cb+'</div><div class="cell">'+P.b1+'</div><div class="hc" id="hc-b"></div></div>'+

}
const STEP_MSG={o:'一のくらいを たそう',c:'くりあがりの 1 を かこう',t:'十のくらいを たそう',h:'百のくらいを かこう'};
function mark(){

    h+='<div class="tbox"><h3>ステージごとの記録</h3><table><tr><th>ステージ</th><th>とけた問題</th><th>まちがえた問題</th>'+KIND.map(k=>'<th>'+k[1]+'の<br>まちがい</th>').join('')+'<th>ヒント</th><th>自動ヒント</th></tr>';
    STAGES.forEach((st,i)=>{
      const L=LOG.filter(r=>r.st===i+1);if(!L.length&&i+1>G.cleared+1)return;
      const sum=k=>L.reduce((a,r)=>a+r[k],0),ng=L.filter(r=>missOf(r)>0).length,mx=Math.max(...KIND.map(k=>sum(k[0])),1);
      h+='<tr><td class="l">'+(i+1)+' '+st.name+(i<G.cleared?' ⭐':'')+'</td><td>'+L.length+'</td><td>'+ng+(L.length?'（'+Math.round(ng/L.length*100)+'%）':'')+'</td>'+
        KIND.map(k=>{const v=sum(k[0]);return '<td class="'+(v&&v===mx?'hi':'')+'">'+v+'</td>'}).join('')+'<td>'+sum('hint')+'</td><td>'+sum('auto')+'</td></tr>';
    });
    h+='</table><div class="note">赤い ますは、そのステージで いちばん まちがいが多い位です。</div></div>';
    const bad=LOG.filter(r=>missOf(r)>=2).slice(-15).reverse();
    h+='<div class="tbox"><h3>つまずいた問題（2回以上まちがえた問題・新しい順に15こ）</h3>'+(bad.length?'<table><tr><th>日時</th><th>ステージ</th><th>問題</th><th>まちがえた ところ</th><th>ヒント</th></tr>'+
      bad.map(r=>'<tr><td>'+fmtD(r.d)+'</td><td>'+r.st+'</td><td>'+r.a+' ＋ '+r.b+' ＝ '+(r.a+r.b)+'</td><td class="l">'+KIND.filter(k=>r[k[0]]).map(k=>k[1]+' '+r[k[0]]+'回').join('、')+'</td><td>'+(r.auto?'自動':r.hint?'使った':'')+'</td></tr>').join('')+'</table>':'<div class="note">まだ ありません。</div>')+'</div>';
    h+='<div class="tbox"><h3>いまの ようす</h3>レベル '+lvOf(G.exp)+'　コイン '+G.coins+'　クリアした ステージ '+G.cleared+'／'+STAGES.length+'　とけた問題 ぜんぶで '+LOG.length+'</div>';
  }else if(tTab==='cfg'){
    const opt=(name,v,cur,label)=>'<button data-c="'+name+'" data-v="'+v+'" class="'+(String(cur)===String(v)?'on':'')+'">'+label+'</button>';
    h+='<div class="tbox"><h3>読み上げの速さ</h3>'+[[0.7,'とても ゆっくり'],[0.8,'ゆっくり'],[0.85,'すこし ゆっくり（はじめ）'],[0.95,'ふつう'],[1.05,'すこし はやい']].map(x=>opt('rate',x[0],S.cfg.rate,x[1])).join('')+'<br><button data-a="try">🔊 ためしに きく</button></div>';
    h+='<div class="tbox"><h3>文字の大きさ</h3>'+opt('big',false,S.cfg.big,'ふつう')+opt('big',true,S.cfg.big,'おおきい')+'<div class="note">メッセージ・ヒント・ちずの説明などの文字が大きくなります。</div></div>';
    h+='<div class="tbox"><h3>ステージ</h3>'+opt('allOpen',false,S.cfg.allOpen,'じゅんばんに 開く（はじめ）')+opt('allOpen',true,S.cfg.allOpen,'ぜんぶ 開く')+'<div class="note">「ぜんぶ 開く」にすると、クリアしていない ステージにも 行けます。</div></div>';
    h+='<div class="tbox"><h3>暗証番号</h3>新しい番号（4けたの数字）：<input id="newPin" inputmode="numeric" maxlength="4" style="font-size:20px;width:5em"> <button data-a="pin">かえる</button><div class="note" id="pinNote">はじめの番号は 1234 です。</div></div>';
    if(HAS_GAS)h+='<div class="note">設定は、スプレッドシートの「せってい」シートに保存され、全員に きょうつうです。</div>';
  }else{
    h+='<div class="tbox"><h3>記録を書き出す（CSV）</h3>1問ごとの記録を、Excel や スプレッドシートで開けるファイルにします。<br><button data-a="csv">⬇ CSVを 書き出す</button></div>';
    if(HAS_GAS){
      h+='<div class="tbox"><h3>バックアップ</h3>記録と しんちょくは、スプレッドシートに入っています。スプレッドシートの「ファイル → コピーを作成」で、まるごと のこせます。</div>';
      h+=who+'<div class="tbox"><h3>消す</h3>'+(tWho?'<button class="danger" data-a="clrOne">'+(tArm==='clrOne'?'ほんとうに 消す？ もう一度 押す':'えらんだ子の 記録と ゲームを 消す')+'</button> ':'')+'<button class="danger" data-a="clrAll">'+(tArm==='clrAll'?'ほんとうに 全員ぶん 消す？ もう一度 押す':'全員の 記録と ゲームを 消す')+'</button><div class="note" id="clrNote">記録（きろくシートの行）と、コイン・レベル・たから・もちもの・クリア・主人公を消します。名簿の名前は のこります。</div></div>';
    }else{
    h+='<div class="tbox"><h3>バックアップ</h3>コイン・レベル・たから・記録・設定を、まるごと ファイルに保存します。べつの Chromebook に うつすときにも使えます。<br><button data-a="bk">⬇ バックアップを 保存</button> <button data-a="rs">⬆ バックアップから もどす</button><input type="file" id="rsFile" accept=".json,application/json" style="display:none"><div class="note" id="rsNote"></div></div>';
    h+='<div class="tbox"><h3>消す</h3><button class="danger" data-a="clrLog">'+(tArm==='clrLog'?'ほんとうに 消す？ もう一度 押す':'記録だけを 消す')+'</button> <button class="danger" data-a="clrGame">'+(tArm==='clrGame'?'ほんとうに もどす？ もう一度 押す':'ゲームを さいしょに もどす')+'</button><div class="note">「ゲームを さいしょに もどす」は、コイン・レベル・たから・もちもの・クリアを消します。記録と設定は のこります。</div></div>';
    }
  }
  $('s-teacher').innerHTML=h;
  document.querySelectorAll('#s-teacher [data-w]').forEach(b=>b.textContent=T.students[+b.dataset.w].name);
}
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
const today=()=>{const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
$('s-teacher').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){tTab=b.dataset.t;tArm='';drawTeacher();return}
  if(b.dataset.w){tWho=T.students[+b.dataset.w].name;drawTeacher();return}
  if(b.dataset.c){const v=b.dataset.v;S.cfg[b.dataset.c]=v==='true'?true:v==='false'?false:+v;saveLocal();applyCfg();drawTeacher();
    if(HAS_GAS)gas('saveSettings',tPin,{rate:S.cfg.rate,big:S.cfg.big,allOpen:S.cfg.allOpen}).catch(()=>{});return}
  const a=b.dataset.a,arm=tArm;tArm='';
  if(a==='try'){const o=S.snd;S.snd=true;speak('いっしょに かぞえて みよう');S.snd=o}
  else if(a==='pin'){const v=$('newPin').value.trim();if(/^\d{4}$/.test(v)&&HAS_GAS){gas('saveSettings',tPin,{newPin:v}).then(r=>{if(r&&r.ok){tPin=v;$('pinNote').textContent='番号を '+v+' に かえました。'}}).catch(()=>{$('pinNote').textContent='かえられませんでした。'})}
    else if(/^\d{4}$/.test(v)){S.cfg.pin=v;saveLocal();drawTeacher();$('pinNote').textContent='番号を '+v+' に かえました。'}else $('pinNote').textContent='4けたの数字を入れてください。'}
  else if(a==='csv'){
    const rows=[['日時','なまえ','ステージ','ステージ名','問題','答え','一の位のまちがい','くりあがりのまちがい','十の位のまちがい','百の位のまちがい','ヒント','自動ヒント']];
    (HAS_GAS?T.log:S.log).forEach(r=>{const x=new Date(r.d);rows.push([x.getFullYear()+'/'+(x.getMonth()+1)+'/'+x.getDate()+' '+x.getHours()+':'+String(x.getMinutes()).padStart(2,'0'),r.name||'',r.st,STAGES[r.st-1].name,r.a+'+'+r.b,r.a+r.b,r.mo,r.mc,r.mt,r.mh,r.hint,r.auto])});
    download('tashizan_kiroku_'+today()+'.csv','﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');
  }
  else if(a==='bk')download('tashizan_backup_'+today()+'.json',JSON.stringify(S),'application/json');
  else if(a==='rs')$('rsFile').click();
  else if(a==='clrOne'||a==='clrAll'){
    if(arm!==a){tArm=a;drawTeacher();return}
    const n=a==='clrOne'?tWho:'';
    gas('clearRecords',tPin,n).then(()=>{if(!n||n===me)me='';if(n)delete pend[n];else pend={};pendSave();return tReload()}).catch(()=>{drawTeacher();$('clrNote').textContent='消せませんでした。もういちど ためして ください。'});
  }
  else if(a==='clrLog'){if(arm!=='clrLog'){tArm='clrLog'}else{S.log=[];save()}drawTeacher()}
  else if(a==='clrGame'){if(arm!=='clrGame'){tArm='clrGame'}else{Object.assign(S,{coins:0,exp:0,cleared:0,tre:[],items:[],hero:'',hold:[]});save();status()}drawTeacher()}
};
$('s-teacher').onchange=e=>{
  if(e.target.id!=='rsFile'||!e.target.files[0])return;
  const fr=new FileReader();fr.onload=()=>{
    try{const d=JSON.parse(fr.result);if(typeof d!=='object'||typeof d.coins!=='number'||!Array.isArray(d.tre))throw 0;
      S=Object.assign({coins:0,exp:0,cleared:0,tre:[],items:[],snd:true,log:[],cfg:{}},d);S.cfg=Object.assign({},CFG0,S.cfg||{});if(!Array.isArray(S.log))S.log=[];
      save();applyCfg();status();drawTeacher();$('rsNote').textContent='もどしました。'}
    catch(err){$('rsNote').textContent='このファイルは つかえません。'}
  };fr.readAsText(e.target.files[0]);
};
function applyCfg(){document.body.classList.toggle('big',!!S.cfg.big)}

/* ====== はじめ ====== */
(function init(){
  let h='';for(let i=1;i<=9;i++)h+='<button data-d="'+i+'">'+i+'</button>';h+='<button data-d="0">0</button>';$('pad').innerHTML=h;
  $('pad').onclick=e=>{const b=e.target.closest('button');if(b)press(+b.dataset.d)};
  document.addEventListener('keydown',e=>{if($('s-battle').classList.contains('on')&&!$('ov').classList.contains('on')&&/^[0-9]$/.test(e.key))press(+e.key)});
  $('b-gate').innerHTML=pic(IMG.gate,'🏯');$('b-home').innerHTML=pic(IMG.home,'🏠');$('b-shop').innerHTML=pic(IMG.shop,'🏪');$('b-tre').innerHTML=pic(IMG.treasureRoom,'💎');
  if(IMG.townBg){$('map').style.backgroundImage='url('+BASE+IMG.townBg+')';document.querySelectorAll('#map .road').forEach(r=>r.style.display='none')}
  document.querySelectorAll('.bld').forEach(b=>b.onclick=()=>{tone(600,0,.1);if(b.dataset.go==='world')wpos=0;show(b.dataset.go)});
  $('backBtn').onclick=()=>{const on=document.querySelector('.screen.on').id;B=null;walking=false;try{speechSynthesis.cancel()}catch(e){}
    if(on==='s-battle')show('world');
    else if(HAS_GAS&&(on==='s-town'||!me)){sync();me='';show('name')}
    else show('town')};
  $('sndBtn').onclick=()=>{S.snd=!S.snd;save();status();if(!S.snd)try{speechSynthesis.cancel()}catch(e){}};
  $('msg').onclick=speakAgain;
  $('tBtn').onclick=pinAsk;
  applyCfg();$('hero').onclick=speakAgain;
  $('heroChg').onclick=()=>heroAsk(false);
  status();
  show(HAS_GAS?'name':'town');
  if(HAS_GAS)syncSoon(300);   // まえに おくれなかった きろくを おくりなおす
})();
</script>
