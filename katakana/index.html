    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .robo-wave { animation: wave 1.2s ease-in-out infinite; transform-origin: 150px 140px; transform-box: view-box; }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-25deg); } }
    .antenna-glow { animation: glow 1.6s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .draw-stroke { animation: drawStroke var(--dur, 0.8s) linear forwards; }
    @keyframes drawStroke { to { stroke-dashoffset: 0; } }
    .beat-on { transform: scale(1.15); }
    .btn3d { border-bottom-width: 6px; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active { transform: translateY(4px); border-bottom-width: 2px; }

    // =====================================================================

    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

    const spread = (items, n) => {

      while (out.length < n) {
        let s = shuffle(items);
        if (out.length && s.length > 1 && s[0] === out[out.length - 1]) s.push(s.shift());

    const SMALL = 'ャュョァィゥェォ';

    const SMALL_TO_BIG = { 'ャ': 'ヤ', 'ュ': 'ユ', 'ョ': 'ヨ', 'ッ': 'ツ', 'ァ': 'ア', 'ィ': 'イ', 'ゥ': 'ウ', 'ェ': 'エ', 'ォ': 'オ' };
    const LOOK_ALIKE = { 'シ': 'ツ', 'ツ': 'シ', 'ソ': 'ン', 'ン': 'ソ', 'ク': 'タ', 'タ': 'ク', 'ケ': 'ク', 'ウ': 'ワ', 'ワ': 'ウ', 'フ': 'ワ',
      'ヌ': 'メ', 'メ': 'ヌ', 'ス': 'ヌ', 'コ': 'ユ', 'ユ': 'コ', 'ヨ': 'コ', 'チ': 'テ', 'テ': 'チ', 'ア': 'マ', 'マ': 'ア', 'ル': 'レ', 'レ': 'ル',

      'ポ': 'ボ', 'ボ': 'ポ', 'ガ': 'カ', 'ギ': 'キ', 'グ': 'ク', 'ゲ': 'ケ', 'ゴ': 'コ', 'ザ': 'サ', 'ジ': 'シ', 'ズ': 'ス', 'ダ': 'タ', 'デ': 'テ',
      'カ': 'ガ', 'サ': 'ザ', 'ハ': 'バ', 'ホ': 'ボ', 'ラ': 'ヲ', 'リ': 'ソ', 'イ': 'ト', 'ヤ': 'セ', 'ミ': 'シ', 'ニ': 'コ', 'キ': 'チ' };

    // まちがえやすい かきかた（ケキ・コプ・キヤベツ など）
    const misspell = (w, type) => {
      const out = [];

      chars.forEach((c, i) => {
        const before = chars.slice(0, i).join(''), after = chars.slice(i + 1).join('');
        if (c === 'ー') out.push(before + after);
        if (SMALL_TO_BIG[c]) { out.push(before + SMALL_TO_BIG[c] + after); out.push(before + after); }
      });
      const alike = [];
      chars.forEach((c, i) => {
        if (LOOK_ALIKE[c]) alike.push(chars.slice(0, i).join('') + LOOK_ALIKE[c] + chars.slice(i + 1).join(''));
      });
      const list = type === 'kotoba' ? [...shuffle(alike), ...out] : [...shuffle(out), ...shuffle(alike)];
      return uniq(list).filter(x => x && x !== w);

    const composeMark = (base, mark) => mark === '゛' ? String.fromCharCode(base.charCodeAt(0) + 1)

    const Speech = {

      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;

          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);

      },

    const Sound = {

        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      tone(freq, at, dur, type = 'sine', vol = 0.18) {
        const c = this.get(); if (!c || !this.on) return;
        const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      correct() { this.tone(1046, 0, 0.18, 'triangle'); this.tone(1318, 0.12, 0.3, 'triangle'); },

        const c = this.get(); if (!c || !this.on) return;

        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 1500; g.gain.value = 0.5;

      },

    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;

    // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
    const addStat = (map, key, kind, ok) => {
      const m = map[key] || (map[key] = {});
      const k = m[kind] || (m[kind] = [0, 0]);
      k[0]++; k[1] += ok;
    };
    function aggregate(rows) {
      const students = {}, classTargets = {};
      rows.forEach(r => {
        const [t, name, , , , problem, target, kind, result] = r;
        if (!name) return;
        const s = students[name] || (students[name] = { count: 0, ok: 0, last: '', targets: {}, words: {} });

        s.count++; s.ok += ok;

    // スプレッドシートに つながって いない ときの おためしモード

    const PENDING_KEY = 'robotan_katakana_pending_v1';
    const api = {
      async init() {

    // =====================================================================
    //  5. しんちょく（すすみぐあい）
    // =====================================================================
    const newProgress = () => ({ v: 1, done: {}, cleared: {}, level: 2, streak: 0, wearOff: [], unlockAll: false });
    function parseProgress(s) {
      if (!s) return newProgress();
      try { return { ...newProgress(), ...(typeof s === 'string' ? JSON.parse(s) : s) }; } catch (e) { return newProgress(); }
    }
    const clearedCount = (p) => ROWS.filter(r => p.cleared[r.id]).length;
    const partRows = (partId) => ROWS.filter(r => r.part === partId);
    const partCleared = (p, partId) => partRows(partId).every(r => p.cleared[r.id]);
    const partOpen = (p, partId) => p.unlockAll || partId === 1 || partCleared(p, partId - 1);
    const rowOpen = (p, row) => {
      if (p.unlockAll || p.cleared[row.id]) return true;
      if (!partOpen(p, row.part)) return false;
      const rows = partRows(row.part), i = rows.findIndex(r => r.id === row.id);
      return i === 0 || !!p.cleared[rows[i - 1].id];
    };
    const stepDone = (p, row, step) => (p.done[row.id] || []).includes(step);
    const stepOpen = (p, row, i) => p.unlockAll || p.cleared[row.id] || i === 0 || stepDone(p, row, row.steps[i - 1]);
    const nextStepIndex = (p, row) => { const i = row.steps.findIndex(s => !stepDone(p, row, s)); return i < 0 ? row.steps.length - 1 : i; };
    const wearsOf = (p) => WEARS.filter(w => clearedCount(p) >= w.need).map(w => w.id).filter(id => !p.wearOff.includes(id));

    // =====================================================================
    //  6. ロボタン
    // =====================================================================
    function Robotan({ mood = 'normal', talking = false, wear = [], size = 180, wave = false }) {
      const eyes = mood === 'happy'
        ? <g stroke="#0c4a6e" strokeWidth="5" fill="none" strokeLinecap="round"><path d="M68 72 q10 -12 20 0" /><path d="M112 72 q10 -12 20 0" /></g>
        : mood === 'think'
          ? <g fill="#0c4a6e"><circle cx="78" cy="68" r="7" /><circle cx="122" cy="68" r="7" /><path d="M68 52 l18 4" stroke="#0c4a6e" strokeWidth="4" strokeLinecap="round" /><path d="M132 52 l-18 4" stroke="#0c4a6e" strokeWidth="4" strokeLinecap="round" /></g>
          : <g className="robo-blink"><circle cx="78" cy="70" r="9" fill="#0c4a6e" /><circle cx="122" cy="70" r="9" fill="#0c4a6e" /><circle cx="81" cy="67" r="3" fill="#fff" /><circle cx="125" cy="67" r="3" fill="#fff" /></g>;
      const mouth = talking
        ? <ellipse className="robo-mouth-talk" cx="100" cy="90" rx="10" ry="7" fill="#be123c" />
        : mood === 'happy' ? <path d="M84 86 q16 18 32 0 z" fill="#be123c" />
          : <path d="M88 88 q12 9 24 0" stroke="#0c4a6e" strokeWidth="4" fill="none" strokeLinecap="round" />;
      return (

          {/* あし */}
          <rect x="72" y="192" width="20" height="22" rx="6" fill="#94a3b8" />
          <rect x="108" y="192" width="20" height="22" rx="6" fill="#94a3b8" />
          <rect x="64" y="208" width="34" height="14" rx="7" fill={wear.includes('boots') ? '#ef4444' : '#64748b'} />
          <rect x="102" y="208" width="34" height="14" rx="7" fill={wear.includes('boots') ? '#ef4444' : '#64748b'} />
          {/* うで */}
          <rect x="32" y="136" width="30" height="14" rx="7" fill="#38bdf8" stroke="#0369a1" strokeWidth="3" />
          <g className={wave ? 'robo-wave' : ''}>
            <rect x="138" y="136" width="30" height="14" rx="7" fill="#38bdf8" stroke="#0369a1" strokeWidth="3" />
            <circle cx="170" cy="143" r="9" fill="#fbbf24" stroke="#b45309" strokeWidth="3" />
          </g>
          <circle cx="30" cy="143" r="9" fill="#fbbf24" stroke="#b45309" strokeWidth="3" />
          {/* からだ */}
          <rect x="60" y="122" width="80" height="74" rx="20" fill="#7dd3fc" stroke="#0369a1" strokeWidth="4" />
          <rect x="76" y="140" width="48" height="36" rx="10" fill="#e0f2fe" stroke="#0369a1" strokeWidth="2" />
          {wear.includes('heart')
            ? <path d="M100 170 l-12 -12 a7 7 0 0 1 12 -8 a7 7 0 0 1 12 8 z" fill="#f43f5e" />
            : <g><circle cx="90" cy="158" r="5" fill="#22c55e" /><circle cx="110" cy="158" r="5" fill="#f59e0b" /></g>}
          {/* アンテナ */}
          <line x1="100" y1="30" x2="100" y2="12" stroke="#475569" strokeWidth="4" />
          {wear.includes('star')
            ? <path d="M100 -2 l4 9 10 1 -8 6 3 10 -9 -6 -9 6 3 -10 -8 -6 10 -1 z" fill="#facc15" stroke="#ca8a04" strokeWidth="1.5" className="antenna-glow" />
            : <circle cx="100" cy="10" r="7" fill="#f59e0b" className="antenna-glow" />}
          {/* みみ */}
          <rect x="26" y="58" width="16" height="34" rx="7" fill="#38bdf8" stroke="#0369a1" strokeWidth="3" />
          <rect x="158" y="58" width="16" height="34" rx="7" fill="#38bdf8" stroke="#0369a1" strokeWidth="3" />
          {/* あたま */}
          <rect x="40" y="28" width="120" height="92" rx="30" fill="#7dd3fc" stroke="#0369a1" strokeWidth="4" />
          <rect x="54" y="42" width="92" height="64" rx="20" fill="#f0f9ff" />
          {eyes}
          <circle cx="64" cy="88" r="7" fill="#fda4af" opacity=".8" />
          <circle cx="136" cy="88" r="7" fill="#fda4af" opacity=".8" />
          {mouth}
          {wear.includes('glasses') && <g fill="none" stroke="#1e293b" strokeWidth="3.5"><circle cx="78" cy="70" r="15" /><circle cx="122" cy="70" r="15" /><line x1="93" y1="70" x2="107" y2="70" /></g>}
          {wear.includes('ribbon') && <g><path d="M130 34 l-14 -14 l0 26 z M130 34 l14 -14 l0 26 z" fill="#f472b6" stroke="#be185d" strokeWidth="2" /><circle cx="130" cy="33" r="5" fill="#be185d" /></g>}
          {wear.includes('bowtie') && <g><path d="M100 124 l-16 -9 v18 z M100 124 l16 -9 v18 z" fill="#2563eb" stroke="#1e3a8a" strokeWidth="2" /><circle cx="100" cy="124" r="4" fill="#1e3a8a" /></g>}
          {wear.includes('crown') && <path d="M66 32 l6 -22 l14 14 l14 -20 l14 20 l14 -14 l6 22 z" fill="#facc15" stroke="#a16207" strokeWidth="3" />}
        </svg>
      );
    }

    // ふきだしつきの ロボタン
    function RoboPanel({ size = 150, wear = [], row = false }) {
      const robo = useRobo();
      return (
        <div className={`flex ${row ? 'flex-row items-center' : 'flex-col items-center'} gap-2`}>
          <div className="animate-float shrink-0"><Robotan size={size} mood={robo.state.mood} talking={robo.state.talking} wear={wear} /></div>
          {robo.state.text && (
            <div className="relative bg-white border-4 border-sky-300 rounded-3xl px-4 py-3 text-xl md:text-2xl font-bold text-slate-700 shadow-sm max-w-xs leading-relaxed">
              {robo.state.text}
            </div>
          )}
        </div>
      );
    }

    // =====================================================================
    //  7. がめんの ぶひん
    // =====================================================================
    function Btn({ children, onClick, color = '#0ea5e9', light = '#e0f2fe', className = '', disabled, big }) {
      return (
        <button onClick={disabled ? undefined : onClick} disabled={disabled}
          className={`btn3d rounded-3xl font-black ${big ? 'text-3xl px-10 py-5' : 'text-xl px-6 py-3'} ${disabled ? 'opacity-40' : ''} ${className}`}
          style={{ background: light, color, borderColor: color, borderWidth: '3px', borderBottomWidth: undefined }}>
          {children}
        </button>
      );
    }

    function SpeakerBtn({ onClick, label = 'きく', size = 'md' }) {
      return (
        <button onClick={onClick}
          className={`btn3d bg-amber-100 border-amber-400 border-4 rounded-full font-black text-amber-700 flex items-center justify-center gap-2 ${size === 'lg' ? 'w-40 h-40 text-6xl flex-col' : 'px-5 py-2 text-2xl'}`}>
          <span>🔊</span>{size === 'lg' ? <span className="text-2xl">{label}</span> : <span className="text-lg">{label}</span>}
        </button>
      );
    }

    function Hanamaru({ show }) {
      if (!show) return null;
      return (
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-30">
          <svg viewBox="0 0 200 200" className="w-64 h-64 animate-popup">
            {[...Array(10)].map((_, i) => {
              const a = (i / 10) * Math.PI * 2;
              return <ellipse key={i} cx={100 + Math.cos(a) * 62} cy={100 + Math.sin(a) * 62} rx="26" ry="18" fill="#fda4af" opacity=".85"
                transform={`rotate(${(a * 180) / Math.PI} ${100 + Math.cos(a) * 62} ${100 + Math.sin(a) * 62})`} />;
            })}
            <circle cx="100" cy="100" r="58" fill="#fff1f2" />
            <path d="M60 110 C 55 60, 150 50, 140 100 C 132 140, 70 140, 78 100 C 84 76, 124 76, 118 102" fill="none" stroke="#e11d48" strokeWidth="9" strokeLinecap="round" />
          </svg>
        </div>
      );
    }

    // もんだいの すすみ（●●○○○）
    function Dots({ total, current }) {
      return (
        <div className="flex gap-2">
          {[...Array(total)].map((_, i) => (
            <div key={i} className={`w-5 h-5 rounded-full border-2 ${i < current ? 'bg-amber-400 border-amber-500' : i === current ? 'bg-white border-amber-500' : 'bg-white border-slate-300'}`} />
          ))}
        </div>
      );
    }

    // ことばの なかの 1もじに いろを つける
    function WordText({ w, mark, markIndex, className = '' }) {
      return (
        <span className={`kana ${className}`}>
          {[...w].map((c, i) => (
            <span key={i} style={{ color: (markIndex === i || (markIndex === undefined && mark && c === mark)) ? '#e11d48' : undefined }}>{c}</span>
          ))}
        </span>
      );
    }

    // てびょうし（はく）
    function BeatBoxes({ word, active }) {
      const morae = toMorae(word);
      return (
        <div className="flex gap-2 justify-center flex-wrap">
          {morae.map((m, i) => (
            <div key={i} className={`w-20 h-24 rounded-2xl border-4 flex flex-col items-center justify-center transition-transform ${active === i ? 'beat-on bg-yellow-200 border-yellow-500' : 'bg-white border-slate-200'}`}>
              <span className="kana text-4xl text-slate-700">{m}</span>
              <span className="text-2xl h-8">{m === 'ッ' ? '✊' : m === 'ー' ? '〰️' : (active === i ? '👏' : '')}</span>
            </div>
          ))}
        </div>
      );
    }
    const useBeats = () => {
      const [active, setActive] = useState(-1);
      const timers = useRef([]);
      const stop = () => { timers.current.forEach(clearTimeout); timers.current = []; setActive(-1); };
      const play = (word) => {
        stop();
        const morae = toMorae(word);
        morae.forEach((m, i) => timers.current.push(setTimeout(() => {
          setActive(i);
          if (m === 'ー') Sound.hum(); else if (m !== 'ッ') Sound.clap();
        }, 300 + i * 750)));
        timers.current.push(setTimeout(() => setActive(-1), 300 + morae.length * 750));
      };
      useEffect(() => stop, []);
      return [active, play];
    };

    // =====================================================================
    //  8. がくしゅう：みる・きく
    // =====================================================================
    function introCards(row) {
      if (row.type === 'seion') return row.chars.map(ch => ({ kind: 'kana', ch }));
      if (row.type === 'daku') return row.chars.map(ch => ({ kind: 'daku', ch }));
      if (row.type === 'similar') return row.sets.map(set => ({ kind: 'similar', set }));
      return row.words.map((x, i) => ({ kind: 'word', ...x, first: i === 0 }));
    }
    const cardSpeech = (card, row) => {
      if (card.kind === 'kana' || card.kind === 'daku') {
        const kw = KANA_WORD[card.ch];
        let s = '';
        if (card.kind === 'daku') { const b = baseOf(card.ch); s += `${b.base}に ${b.mark === '゛' ? 'てんてん' : 'まる'}を つけると、${card.ch}。 `; }
        else s += `${card.ch}。 `;
        s += kw ? `${kw[0]}の ${card.ch}。` : `${card.ch}は、ことばでは あまり つかわないよ。`;
        return s;
      }
      if (card.kind === 'similar') return `${card.set.chars.join('と、')}。 ${card.set.tip}`;
      return `${card.w}。`;
    };
    const cardBubble = (card, row) => {
      if (card.kind === 'similar') return card.set.tip;
      if (card.kind === 'word') return card.first && PART_NOTE[row.part] ? PART_NOTE[row.part] : 'てを たたいて いって みよう！';
      if (card.kind === 'daku') return `${baseOf(card.ch).mark === '゛' ? 'てんてん' : 'まる'}を つけると おとが かわるよ。`;
      return 'よく みて、いっしょに いって みよう！';
    };

    function IntroStep({ row, onFinish }) {
      const robo = useRobo();
      const cards = useMemo(() => introCards(row), [row]);
      const [i, setI] = useState(0);
      const [beat, playBeats] = useBeats();
      const card = cards[i];
      const speak = async () => {
        await robo.say(cardBubble(card, row), { speech: cardSpeech(card, row) });
        if (card.kind === 'word') playBeats(card.w);
      };
      useEffect(() => { speak(); }, [i]);
      const next = () => { Sound.tap(); if (i + 1 < cards.length) setI(i + 1); else onFinish(); };

      let body;
      if (card.kind === 'kana' || card.kind === 'daku') {
        const kw = KANA_WORD[card.ch];
        const b = baseOf(card.ch);
        body = (
          <div className="flex flex-col items-center gap-4">
            {card.kind === 'kana' ? (
              <div className="flex items-center gap-6">
                <div className="flex flex-col items-center"><span className="text-lg text-slate-400 font-bold">ひらがな</span>
                  <span className="kana text-7xl text-slate-400 bg-white rounded-3xl px-6 py-4 border-4 border-slate-200">{toHira(card.ch)}</span></div>
                <span className="text-5xl text-sky-400">➡</span>
                <button onClick={speak} className="flex flex-col items-center"><span className="text-lg text-sky-600 font-bold">カタカナ</span>
                  <span className="kana text-[9rem] text-sky-700 bg-white rounded-3xl px-8 py-4 border-4 border-sky-300 animate-popup" key={card.ch}>{card.ch}</span></button>
              </div>
            ) : (
              <div className="flex items-center gap-4">
                <span className="kana text-8xl text-slate-500 bg-white rounded-3xl px-6 py-4 border-4 border-slate-200">{b.base}</span>
                <span className="text-5xl text-slate-400 font-black">＋</span>
                <span className="kana text-8xl text-orange-500 bg-orange-50 rounded-3xl px-6 py-4 border-4 border-orange-300">{b.mark}</span>
                <span className="text-5xl text-slate-400 font-black">＝</span>
                <button onClick={speak}><span className="kana text-[8rem] text-orange-600 bg-white rounded-3xl px-6 py-4 border-4 border-orange-400 inline-block animate-popup" key={card.ch}>{card.ch}</span></button>
              </div>
            )}
            {kw ? (
              <div className="flex items-center gap-4 bg-white rounded-3xl px-8 py-3 border-4 border-orange-100">
                <span className="text-7xl">{kw[1]}</span>
                <WordText w={kw[0]} markIndex={kw[0].indexOf(card.ch)} className="text-6xl text-slate-700" />
              </div>
            ) : <div className="text-2xl font-bold text-slate-500 bg-white rounded-3xl px-8 py-4">ことばでは あまり つかわない もじ だよ</div>}
          </div>
        );
      } else if (card.kind === 'similar') {
        body = (
          <div className="flex items-center gap-6">
            {card.set.chars.map(c => (
              <button key={c} onClick={() => robo.speak(c)} className="kana text-[8rem] bg-white rounded-3xl px-8 py-4 border-4 border-sky-300 text-sky-700">{c}</button>
            ))}
          </div>
        );
      } else {
        body = (
          <div className="flex flex-col items-center gap-5">
            <div className="flex items-center gap-6 bg-white rounded-3xl px-10 py-4 border-4 border-emerald-200">
              <span className="text-8xl">{card.e}</span>
              <WordText w={card.w} mark={row.target} className="text-7xl text-slate-700" />
            </div>
            <BeatBoxes word={card.w} active={beat} />
            <Btn onClick={() => playBeats(card.w)} color="#059669" light="#d1fae5">👏 てを たたこう</Btn>
          </div>
        );
      }
      return (
        <div className="flex flex-col items-center gap-6 w-full">
          <Dots total={cards.length} current={i} />
          {body}
          <div className="flex gap-4">
            <SpeakerBtn onClick={speak} label="もういちど" />
            <Btn big onClick={next} color="#0284c7" light="#bae6fd">{i + 1 < cards.length ? 'つぎへ ▶' : 'おしまい ✔'}</Btn>
          </div>
        </div>
      );
    }

    // =====================================================================
    //  9. がくしゅう：えらぶ もんだい
    // =====================================================================
    // もんだいの つくりかた
    function qSound(ch, pool) {
      return { type: 'sound', answer: ch, pool, opt: 'kana', target: ch, problem: ch,
        bubble: 'きこえた もじは どれかな？', speech: `${ch}。 ${ch}は どれかな？`, replay: ch };
    }
    function qHira(ch, pool) {
      return { type: 'hira', answer: ch, pool, opt: 'kana', target: ch, problem: toHira(ch),
        bubble: 'おなじ おとの カタカナは どれかな？', speech: `${toHira(ch)}と おなじ おとの カタカナは どれかな？`, replay: ch };
    }
    function qTenten(ch, pool) {
      const { base, mark } = baseOf(ch);
      return { type: 'tenten', base, answer: mark || 'なし', pool, opt: 'mark', target: ch, problem: ch, reveal: ch,
        bubble: 'てんてん？ まる？ どれを つけるかな？', speech: `${ch}。 ${ch}に するには、どれを つけるかな？`, replay: ch };
    }
    function qWordSound(x, pool, target) {
      return { type: 'wordsound', answer: x.w, emoji: x.e, pool, opt: 'word', target: target || '', problem: x.w,
        bubble: 'きこえた ことばは どれかな？', speech: `${x.w}。 ${x.w}は どれかな？`, replay: x.w };
    }
    function qWordText(x, pool, target) {
      return { type: 'wordtext', answer: x.w, word: x.w, pool, opt: 'emoji', target: target || '', problem: x.w,
        bubble: 'なんて かいて あるかな？ えを えらんでね。', speech: 'なんて かいて あるかな？ えを えらんでね。', replay: null };
    }

    function makeQuestions(row, step) {
      const N = QUESTIONS_PER_STEP;
      const before = charsBefore(row);
      const kanaPool = (ch, chars) => [...shuffle(chars.filter(c => c !== ch && c !== 'ヲ' && c !== 'ヂ' && c !== 'ヅ')), ...shuffle(before)];
      const usable = (row.chars || []).filter(c => c !== 'ヂ' && c !== 'ヅ');

      if (row.type === 'seion') {
        const list = spread(row.chars, N);
        if (step === 'yomu') return list.map(ch => qSound(ch, kanaPool(ch, row.chars)));
        if (step === 'hira') return list.map(ch => qHira(ch, kanaPool(ch, row.chars)));
        if (step === 'check') return shuffle(list.map((ch, i) => i < 3 ? qSound(ch, kanaPool(ch, row.chars)) : qHira(ch, kanaPool(ch, row.chars))));
      }
      if (row.type === 'similar') {
        const sets = step === 'miwake1' ? row.sets.slice(0, 4) : step === 'miwake2' ? row.sets.slice(4) : row.sets;
        return spread(sets, N).map(set => { const ch = pickOne(set.chars); return qSound(ch, shuffle(set.chars.filter(c => c !== ch))); });
      }
      if (row.type === 'daku') {
        const list = spread(usable, N);
        const dPool = (ch) => [baseOf(ch).base, ...shuffle(usable.filter(c => c !== ch)), ...shuffle(before)];
        // 2たくの ときは さいしょの ものが でる（パぎょうは ゛ と まちがえやすい）
        const markPool = (ch) => row.id === '2p' ? ['゛', 'なし'] : ['なし', '゜'];
        if (step === 'yomu') return list.map(ch => qSound(ch, dPool(ch)));
        if (step === 'tenten') {
          // 4もんは てんてん（まる）を つける。1もんは「そのまま」が こたえ。
          return shuffle(list.map((ch, i) => {
            if (i === 4) { const b = baseOf(ch).base; const q = qTenten(b, []); q.answer = 'なし'; q.base = b; q.reveal = b; q.pool = [baseOf(ch).mark]; q.speech = `${b}。 ${b}に するには、どれを つけるかな？`; q.replay = b; return q; }
            const q = qTenten(ch, []); q.pool = markPool(ch).filter(m => m !== q.answer); return q;
          }));
        }
        if (step === 'check') return shuffle(list.map((ch, i) => {
          if (i < 3) return qSound(ch, dPool(ch));
          const q = qTenten(ch, []); q.pool = markPool(ch).filter(m => m !== q.answer); return q;
        }));
      }
      if (row.type === 'word' || row.type === 'kotoba') {
        const words = row.words;
        const others = (x) => shuffle(words.filter(y => y.w !== x.w));
        const spellPool = (x) => [...misspell(x.w, row.type), ...others(x).map(y => y.w)];
        const picPool = (x) => [...others(x), ...shuffle(allWords().filter(y => !words.includes(y)))].map(y => y.w);
        const list = shuffle(words).slice(0, N);
        const t = row.target;
        if (step === 'yomu') return list.map(x => qWordSound(x, spellPool(x), t));
        if (step === 'pic') return list.map(x => qWordText(x, picPool(x), t));
        if (step === 'check') {
          return shuffle(list.map((x, i) => (row.type === 'kotoba' ? i < 2 : i < 3) ? qWordSound(x, spellPool(x), t) : qWordText(x, picPool(x), t)));
        }
      }
      return [];
    }

    const emojiOf = (w) => (allWords().find(x => x.w === w) || {}).e || '❓';

    function ChoiceQuiz({ row, step, level, onAnswer, onRecord, onFinish, isCheck }) {
      const robo = useRobo();
      const questions = useMemo(() => makeQuestions(row, step), [row, step]);
      const [qi, setQi] = useState(0);
      const [options, setOptions] = useState([]);
      const [removed, setRemoved] = useState([]);
      const [solved, setSolved] = useState(false);
      const [shakeVal, setShakeVal] = useState(null);
      const tries = useRef(0);
      const firstOk = useRef(0);
      const busy = useRef(false);
      const q = questions[qi];

      useEffect(() => {
        if (!q) return;
        const n = Math.min(level, 1 + q.pool.length);
        // えの せんたくしは おなじ えが ならばないように する
        const look = (v) => q.opt === 'emoji' ? emojiOf(v) : v;
        const picked = [];
        for (const v of uniq(q.pool)) {
          if (picked.length >= n - 1) break;
          if (look(v) !== look(q.answer) && !picked.some(x => look(x) === look(v))) picked.push(v);
        }
        setOptions(shuffle([q.answer, ...picked]));
        setRemoved([]); setSolved(false); tries.current = 0; busy.current = false;
        robo.say(q.bubble, { speech: q.speech, mood: 'normal' });
      }, [qi]);

      const replay = () => { if (q.replay) robo.speak(q.replay); else robo.say(q.bubble, { speech: q.speech }); };

      const choose = async (v) => {
        if (busy.current || solved || removed.includes(v)) return;
        if (v === q.answer) {
          busy.current = true;
          const first = tries.current === 0;
          if (first) firstOk.current++;
          onAnswer(first);
          onRecord({ problem: q.problem, target: q.target, kind: 'よむ', result: first ? '○' : '△', tries: tries.current + 1 });
          setSolved(true); Sound.correct();
          const reveal = q.type === 'wordtext' ? `${q.word}。 ` : q.type === 'tenten' ? `${q.reveal}。 ` : '';
          const praise = pickOne(PRAISE);
          await robo.say(praise, { speech: reveal + praise, mood: 'happy' });
          await new Promise(r => setTimeout(r, 400));
          if (qi + 1 < questions.length) setQi(qi + 1);
          else onFinish({ firstOk: firstOk.current, total: questions.length, pass: isCheck ? firstOk.current >= PASS_LINE : true });
        } else {
          tries.current++;
          Sound.retry();
          setShakeVal(v); setTimeout(() => setShakeVal(null), 500);
          setRemoved(r => [...r, v]);
          if (tries.current === 1) onAnswer(false);
          robo.say('おしいね。もういちど かんがえて みよう。', { speech: q.replay ? `おしいね。 もういちど きいてね。 ${q.replay}。` : 'おしいね。 もういちど かんがえて みよう。', mood: 'think' });
        }
      };

      if (!q) return null;
      const remaining = options.filter(o => !removed.includes(o));
      const hintOn = remaining.length === 1 && !solved;

      // もんだいの だしかた
      let prompt;
      if (q.type === 'sound') prompt = solved
        ? <div className="kana text-[9rem] text-sky-700 bg-white rounded-3xl px-10 py-2 border-4 border-sky-300 animate-popup">{q.answer}</div>
        : <SpeakerBtn size="lg" onClick={replay} label="きいてね" />;
      if (q.type === 'hira') prompt = (
        <div className="flex items-center gap-4">
          <span className="kana text-[8rem] text-slate-600 bg-white rounded-3xl px-8 py-2 border-4 border-slate-300">{toHira(q.answer)}</span>
          {solved && <><span className="text-5xl text-sky-400">➡</span><span className="kana text-[8rem] text-sky-700 bg-white rounded-3xl px-8 py-2 border-4 border-sky-300 animate-popup">{q.answer}</span></>}
          {!solved && <SpeakerBtn onClick={replay} />}
        </div>
      );
      if (q.type === 'tenten') prompt = (
        <div className="flex items-center gap-4">
          <span className="kana text-[8rem] text-slate-600 bg-white rounded-3xl px-8 py-2 border-4 border-slate-300">{q.base}</span>
          <span className="text-5xl font-black text-slate-400">＋</span>
          <span className="kana text-7xl text-orange-400 bg-orange-50 rounded-3xl w-28 h-28 flex items-center justify-center border-4 border-dashed border-orange-300">{solved ? (q.answer === 'なし' ? '' : q.answer) : '？'}</span>
          {solved && <><span className="text-5xl font-black text-slate-400">＝</span><span className="kana text-[8rem] text-orange-600 bg-white rounded-3xl px-8 py-2 border-4 border-orange-400 animate-popup">{q.reveal}</span></>}
          {!solved && <SpeakerBtn onClick={replay} />}
        </div>
      );
      if (q.type === 'wordsound') prompt = (
        <div className="flex items-center gap-6 bg-white rounded-3xl px-10 py-4 border-4 border-emerald-200">
          <span className="text-8xl">{q.emoji}</span>
          {solved ? <span className="kana text-7xl text-emerald-700 animate-popup">{q.answer}</span> : <SpeakerBtn onClick={replay} />}
        </div>
      );
      if (q.type === 'wordtext') prompt = (
        <div className="flex items-center gap-6 bg-white rounded-3xl px-10 py-4 border-4 border-yellow-300">
          <span className="kana text-7xl text-slate-700">{q.word}</span>
          {solved && <span className="text-8xl animate-popup">{emojiOf(q.word)}</span>}
        </div>
      );

      const optLabel = (v) => {
        if (q.opt === 'emoji') return <span className="text-7xl">{emojiOf(v)}</span>;
        // うすい もとの もじに しるしを かさねて みせる
        if (q.opt === 'mark') return (
          <span className="flex flex-col items-center gap-1">
            <span className="relative inline-block">
              <span className="kana text-7xl text-slate-300">{q.base}</span>
              {v !== 'なし' && <span className="kana text-7xl text-orange-500 absolute left-0 top-0">{v}</span>}
            </span>
            <span className="text-xl font-black">{v === 'なし' ? 'そのまま' : v === '゛' ? 'てんてん' : 'まる'}</span>
          </span>
        );
        if (q.opt === 'word') return <span className="kana text-5xl md:text-6xl whitespace-nowrap">{v}</span>;
        return <span className="kana text-8xl">{v}</span>;
      };

      return (
        <div className="flex flex-col items-center gap-6 w-full relative">
          <Dots total={questions.length} current={qi} />
          <div className="min-h-[11rem] flex items-center justify-center">{prompt}</div>
          <div className="flex flex-wrap justify-center gap-5">
            {options.map(v => {
              const gone = removed.includes(v);
              const right = solved && v === q.answer;
              return (
                <button key={v} onClick={() => choose(v)}
                  className={`btn3d min-w-[9rem] min-h-[9rem] px-5 rounded-3xl border-4 flex items-center justify-center transition-all
                    ${gone ? 'opacity-20 scale-90 bg-slate-100 border-slate-200 text-slate-400' : right ? 'bg-rose-50 border-rose-400 text-rose-600' : 'bg-white border-sky-300 text-slate-700'}
                    ${shakeVal === v ? 'animate-shake' : ''} ${hintOn && v === q.answer ? 'animate-hint' : ''}`}>
                  {optLabel(v)}
                </button>
              );
            })}
          </div>
          <Hanamaru show={solved} />
        </div>
      );
    }

    // =====================================================================
    // 10. がくしゅう：ことばを つくる
    // =====================================================================
    function extraTile(word, row) {
      const chars = [...word];
      const special = chars.find(c => SMALL_TO_BIG[c]);
      if (special) return SMALL_TO_BIG[special];
      if (row.target === 'ー') { const i = chars.indexOf('ー'); return vowelKana(chars[i - 1]) || 'イ'; }
      const alike = chars.map(c => LOOK_ALIKE[c]).filter(c => c && !chars.includes(c));
      return alike.length ? pickOne(alike) : 'ソ';
    }

    // ーの まえの もじの ぼいん（ケ→エ）：「ケエキ」と かく まちがいに そなえる
    function vowelKana(ch) {
      for (const t of [GOJUON, DAKU_TABLE]) for (const r of t) { const i = r.indexOf(ch); if (i >= 0) return 'アイウエオ'[i]; }
      return '';
    }

    function BuildWord({ row, level, onAnswer, onRecord, onFinish }) {
      const robo = useRobo();
      const words = useMemo(() => shuffle(row.words), [row]);
      const [wi, setWi] = useState(0);
      const [tiles, setTiles] = useState([]);
      const [filled, setFilled] = useState(0);
      const [shakeId, setShakeId] = useState(null);
      const [miss, setMiss] = useState(0);
      const [solved, setSolved] = useState(false);
      const [beat, playBeats] = useBeats();
      const mistakes = useRef(0);
      const firstOk = useRef(0);
      const x = words[wi];
      const chars = [...x.w];
      const moraOf = [];
      toMorae(x.w).forEach((m, k) => { for (const _ of m) moraOf.push(k); });

      useEffect(() => {
        let t = chars.map((c, i) => ({ id: i, ch: c, used: false }));
        if (level >= 3) t.push({ id: 99, ch: extraTile(x.w, row), used: false });
        setTiles(shuffle(t)); setFilled(0); setMiss(0); setSolved(false); mistakes.current = 0;
        robo.say('きいて、ことばを つくろう！', { speech: `${x.w}。 ${x.w}を つくろう！` });
      }, [wi]);

      const tap = async (tile) => {
        if (solved || tile.used) return;
        if (tile.ch === chars[filled]) {
          Sound.tick();
          setTiles(ts => ts.map(t => t.id === tile.id ? { ...t, used: true } : t));
          const nf = filled + 1;
          setFilled(nf); setMiss(0);
          if (nf === chars.length) {
            setSolved(true); Sound.correct();
            const first = mistakes.current === 0;
            if (first) firstOk.current++;
            onAnswer(first);
            onRecord({ problem: x.w, target: row.target || '', kind: 'ことば', result: first ? '○' : '△', tries: mistakes.current + 1 });
            const p = pickOne(PRAISE);
            await robo.say(p, { speech: `${x.w}。 ${p}`, mood: 'happy' });
            await new Promise(r => setTimeout(r, 400));
            if (wi + 1 < words.length) setWi(wi + 1);
            else onFinish({ firstOk: firstOk.current, total: words.length, pass: true });
          }
        } else {
          Sound.retry();
          if (mistakes.current === 0) onAnswer(false);
          mistakes.current++;
          setMiss(m => m + 1);
          setShakeId(tile.id); setTimeout(() => setShakeId(null), 500);
          robo.say('ちがう もじ だよ。よく きいてね。', { speech: `ちがう もじ だよ。 ${x.w}。`, mood: 'think' });
        }
      };

      const nextTileId = !solved && miss >= 2 ? (tiles.find(t => !t.used && t.ch === chars[filled]) || {}).id : null;

      return (
        <div className="flex flex-col items-center gap-5 w-full relative">
          <Dots total={words.length} current={wi} />
          <div className="flex items-center gap-5">
            <span className="text-8xl">{x.e}</span>
            <SpeakerBtn onClick={() => robo.speak(x.w)} />
            <Btn onClick={() => playBeats(x.w)} color="#059669" light="#d1fae5">👏</Btn>
          </div>
          <div className="flex gap-2">
            {chars.map((c, i) => (
              <div key={i} className={`w-24 h-24 rounded-2xl border-4 flex items-center justify-center ${i < filled ? 'bg-sky-50 border-sky-400' : i === filled ? 'bg-white border-dashed border-amber-400' : 'bg-white border-dashed border-slate-300'} ${beat === moraOf[i] ? 'beat-on' : ''}`}>
                {i < filled && <span className="kana text-6xl text-sky-700">{c}</span>}
              </div>
            ))}
          </div>
          <div className="flex flex-wrap justify-center gap-4 mt-2">
            {tiles.map(t => (
              <button key={t.id} onClick={() => tap(t)}
                className={`btn3d w-28 h-28 rounded-3xl border-4 flex items-center justify-center transition-all
                  ${t.used ? 'opacity-0 pointer-events-none' : 'bg-white border-amber-300 text-slate-700'}
                  ${shakeId === t.id ? 'animate-shake' : ''} ${nextTileId === t.id ? 'animate-hint' : ''}`}>
                <span className="kana text-7xl">{t.ch}</span>
              </button>
            ))}
          </div>
          <Hanamaru show={solved} />
        </div>
      );
    }

    // =====================================================================
    // 11. がくしゅう：なぞる・かく
    // =====================================================================
    const VB = 109;
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const segDist = (p, a, b) => {
      const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy;
      if (!l) return dist(p, a);
      const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l));
      return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
    };
    const distToLine = (p, pts) => {
      if (pts.length === 1) return dist(p, pts[0]);
      let m = Infinity;
      for (let i = 0; i < pts.length - 1; i++) m = Math.min(m, segDist(p, pts[i], pts[i + 1]));
      return m;
    };
    // ひとかくを しらべる：'ok' | 'reverse' | 'start' | 'miss'
    function judgeStroke(trace, g, tol) {
      const s = g.pts[0], e = g.pts[g.pts.length - 1];
      const t0 = trace[0], t1 = trace[trace.length - 1];
      if (g.len < 18) return trace.some(p => distToLine(p, g.pts) <= tol) ? 'ok' : 'start';
      const dS = dist(t0, s), dE = dist(t1, e);
      if (dS > tol * 1.2) return (dist(t0, e) < tol && dist(t1, s) < tol) ? 'reverse' : 'start';
      const onPath = trace.filter(p => distToLine(p, g.pts) <= tol).length / trace.length;
      const covered = g.pts.filter(q => distToLine(q, trace) <= tol).length / g.pts.length;
      return (dE <= tol * 1.3 && onPath >= 0.7 && covered >= 0.7) ? 'ok' : 'miss';
    }

    function Tracer({ items, mode, onRecord, onFinish, header }) {
      const robo = useRobo();
      const [ci, setCi] = useState(0);
      const item = items[ci];
      const paths = STROKES[item.ch] || [];
      const [geo, setGeo] = useState(null);
      const [phase, setPhase] = useState('demo');
      const [demoIdx, setDemoIdx] = useState(-1);
      const [si, setSi] = useState(0);
      const [line, setLine] = useState([]);
      const [strokeFails, setStrokeFails] = useState(0);
      const [hintKey, setHintKey] = useState(0);
      const [msg, setMsg] = useState('');
      const [done, setDone] = useState(false);
      const fails = useRef(0);
      const firstOk = useRef(0);
      const drawing = useRef(null);
      const pathRefs = useRef([]);
      const timers = useRef([]);
      const svgRef = useRef(null);
      const tol = mode === 'write' ? 20 : 17;

      const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };
      useEffect(() => clearTimers, []);

      // かたちを はかる
      useEffect(() => {
        const g = paths.map((d, i) => {
          const el = pathRefs.current[i];
          const len = el.getTotalLength();
          const n = 24, pts = [];
          for (let k = 0; k <= n; k++) { const p = el.getPointAtLength((len * k) / n); pts.push({ x: p.x, y: p.y }); }
          return { len, pts };
        });
        setGeo(g);
      }, [ci]);

      const runDemo = (after) => {
        clearTimers();
        setPhase('demo'); setSi(0); setStrokeFails(0); setMsg(''); setLine([]); setDemoIdx(-1);
        let t = 500;
        paths.forEach((_, i) => {
          timers.current.push(setTimeout(() => setDemoIdx(i), t));
          const len = geo ? geo[i].len : 60;
          t += Math.max(600, len * 12) + 350;
        });
        timers.current.push(setTimeout(() => { setDemoIdx(-1); setPhase('draw'); if (after) after(); }, t + 200));
      };

      useEffect(() => {
        if (!geo) return;
        setDone(false); fails.current = 0;
        robo.say('よく みてね。かく じゅんばんを おぼえよう。', { speech: `${item.ch}。 よく みてね。` });
        runDemo(() => robo.say(mode === 'write' ? 'こんどは じぶんで かいて みよう！' : 'みどりの まるから なぞって みよう！'));
      }, [geo]);

      const toPt = (e) => {
        const svg = svgRef.current, pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const m = svg.getScreenCTM();
        if (m) { const r = pt.matrixTransform(m.inverse()); return { x: r.x, y: r.y }; }
        const rect = svg.getBoundingClientRect();
        return { x: ((e.clientX - rect.left) / rect.width) * VB, y: ((e.clientY - rect.top) / rect.height) * VB };
      };
      const down = (e) => {
        if (phase !== 'draw' || done || !geo) return;
        e.preventDefault();
        try { svgRef.current.setPointerCapture(e.pointerId); } catch (err) {}
        drawing.current = [toPt(e)];
        setLine(drawing.current);
      };
      const move = (e) => {
        if (!drawing.current) return;
        const p = toPt(e), last = drawing.current[drawing.current.length - 1];
        if (dist(p, last) < 0.8) return;
        drawing.current = [...drawing.current, p];
        setLine(drawing.current);
      };
      const up = () => {
        if (!drawing.current) return;
        const tr = drawing.current; drawing.current = null; setLine([]);
        const res = judgeStroke(tr, geo[si], tol);
        if (res === 'ok') {
          Sound.tick(); setMsg('');
          const ns = si + 1;
          setSi(ns); setStrokeFails(0);
          if (ns >= paths.length) finishChar();
          return;
        }
        fails.current++;
        setStrokeFails(f => f + 1);
        setHintKey(k => k + 1);
        Sound.retry();
        let text = 'おしい！ もういちど かいて みよう。';
        if (res === 'reverse') text = 'むきが ぎゃくだよ。みどりの まるから かこう。';
        else if (res === 'start') {
          const other = geo.findIndex((g, i) => i > si && dist(tr[0], g.pts[0]) < tol);
          text = other >= 0 ? 'かく じゅんばんが ちがうよ。みどりの まるから かこう。' : 'みどりの まるから かいて みよう。';
        }
        setMsg(text);
        robo.say(text, { mood: 'think' });
      };

      const finishChar = async () => {
        setDone(true); Sound.correct();
        const first = fails.current === 0;
        if (first) firstOk.current++;
        onRecord({ problem: item.problem, target: item.ch, kind: mode === 'write' ? 'かく' : 'なぞる', result: first ? '○' : '△', tries: fails.current + 1 });
        const p = pickOne(PRAISE);
        await robo.say(p, { mood: 'happy' });
        await new Promise(r => setTimeout(r, 600));
        if (ci + 1 < items.length) { setGeo(null); setSi(0); setCi(ci + 1); }
        else onFinish({ firstOk: firstOk.current, total: items.length, pass: true });
      };

      const showDot = phase === 'draw' && !done && si < paths.length && (mode === 'trace' || strokeFails >= 1);
      const showCurGhost = mode === 'trace' || strokeFails >= 2;
      const g = geo && geo[si];
      let arrow = null;
      if (showDot && g) {
        const a = g.pts[0], b = g.pts[Math.min(3, g.pts.length - 1)];
        const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        arrow = <g transform={`translate(${a.x} ${a.y}) rotate(${ang})`}><path d="M10 -4 L17 0 L10 4 Z" fill="#16a34a" /></g>;
      }

      return (
        <div className="flex flex-col items-center gap-3 w-full relative">
          <Dots total={items.length} current={ci} />
          {header && header(item, ci)}
          <div className="relative bg-white rounded-3xl border-4 border-slate-300 shadow-sm" style={{ width: 'min(58vh, 88vw, 430px)', height: 'min(58vh, 88vw, 430px)' }}>
            <svg ref={svgRef} viewBox={`0 0 ${VB} ${VB}`} className="w-full h-full touch-none"
              onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>
              <line x1={VB / 2} y1="4" x2={VB / 2} y2={VB - 4} stroke="#cbd5e1" strokeWidth="0.6" strokeDasharray="3 3" />
              <line x1="4" y1={VB / 2} x2={VB - 4} y2={VB / 2} stroke="#cbd5e1" strokeWidth="0.6" strokeDasharray="3 3" />
              {/* はかる ための せん（みえない） */}
              {paths.map((d, i) => <path key={`m${ci}-${i}`} ref={el => pathRefs.current[i] = el} d={d} fill="none" stroke="none" />)}
              {/* なぞる ための うすい もじ */}
              {mode === 'trace' && paths.map((d, i) => <path key={`b${i}`} d={d} fill="none" stroke="#e2e8f0" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round" />)}
              {phase === 'draw' && !done && showCurGhost && paths[si] && <path d={paths[si]} fill="none" stroke={mode === 'trace' ? '#bae6fd' : '#f1f5f9'} strokeWidth="9" strokeLinecap="round" strokeLinejoin="round" />}
              {/* おてほん */}
              {phase === 'demo' && geo && paths.map((d, i) => i > demoIdx ? null : (
                <path key={`d${i}`} d={d} fill="none" stroke="#0ea5e9" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round"
                  className={i === demoIdx ? 'draw-stroke' : ''}
                  style={i === demoIdx ? { strokeDasharray: geo[i].len, strokeDashoffset: geo[i].len, '--dur': `${Math.max(600, geo[i].len * 12)}ms` } : undefined} />
              ))}
              {/* まちがえた ときの ヒント */}
              {phase === 'draw' && !done && strokeFails > 0 && g && (
                <path key={`h${hintKey}`} d={paths[si]} fill="none" stroke="#fb923c" strokeWidth="4" strokeLinecap="round" opacity=".8"
                  className="draw-stroke" style={{ strokeDasharray: g.len, strokeDashoffset: g.len, '--dur': `${Math.max(600, g.len * 12)}ms` }} />
              )}
              {/* かけた せん */}
              {phase === 'draw' && paths.map((d, i) => i < si ? <path key={`k${i}`} d={d} fill="none" stroke="#1e293b" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" /> : null)}
              {showDot && g && (
                <g>
                  <circle cx={g.pts[0].x} cy={g.pts[0].y} r="5.5" fill="#22c55e" stroke="#fff" strokeWidth="1.2" />
                  <text x={g.pts[0].x} y={g.pts[0].y + 2.2} textAnchor="middle" fontSize="6.5" fontWeight="bold" fill="#fff">{si + 1}</text>
                  {arrow}
                </g>
              )}
              {line.length > 0 && <polyline points={line.map(p => `${p.x},${p.y}`).join(' ')} fill="none" stroke="#ef4444" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" opacity=".75" />}
            </svg>
            <Hanamaru show={done} />
          </div>
          <div className="h-8 text-xl font-bold text-rose-500">{msg}</div>
          <div className="flex gap-4">
            <Btn onClick={() => { if (!done) { robo.say('よく みてね。'); runDemo(); } }} color="#0284c7" light="#e0f2fe">👀 おてほん</Btn>
            <Btn onClick={() => { if (!done && phase === 'draw') { setSi(0); setStrokeFails(0); setMsg(''); } }} color="#64748b" light="#f1f5f9">🧽 けす</Btn>
          </div>
        </div>
      );
    }

    function traceItems(row, step) {
      if (row.type === 'similar') return row.traceChars.map(ch => ({ ch, problem: ch }));
      if (row.chars) return row.chars.map(ch => ({ ch, problem: ch }));
      // ことばは みじかい もの 2つを 1もじずつ（ながく なりすぎないように）
      return shuffle(row.words).sort((a, b) => a.w.length - b.w.length).slice(0, 2).flatMap(x => [...x.w].map((ch, i) => ({ ch, problem: x.w, word: x, idx: i })));
    }

    // =====================================================================
    // 12. がくしゅうの がめん
    // =====================================================================
    function Activity({ row, step, progress, onAnswer, onQuit, onFinish, wear }) {
      const robo = useRobo();
      const records = useRef([]);
      const onRecord = (r) => records.current.push({ ...r, part: row.part, row: row.name, step: STEP_INFO[step].label });
      const finish = (meta) => onFinish(records.current, meta || { pass: true });
      const part = PARTS[row.part - 1];
      const common = { row, step, level: progress.level, onAnswer, onRecord, onFinish: finish };
      const items = useMemo(() => traceItems(row, step), [row, step]);

      let body;
      if (step === 'intro' || step === 'compare') body = <IntroStep row={row} onFinish={() => finish({ pass: true })} />;
      else if (step === 'build') body = <BuildWord {...common} />;
      else if (step === 'trace' || step === 'write') {
        const header = items[0].word ? (item) => (

              <h2 className="text-4xl font-black mb-4" style={{ color: part.color }}>{part.icon} {part.title}</h2>

    function RowScreen({ row, progress, onStep, onBack, bar, wear }) {

      useEffect(() => {
        robo.say(cleared ? 'クリア したね！ すきな ところを もういちど やって みよう。' : `つぎは 「${STEP_INFO[row.steps[ni]].label}」 だよ。`);

              <RoboPanel size={150} wear={wear} />

                  return (

                      {i > 0 && <span className="text-2xl text-slate-300">➜</span>}

    // =====================================================================

    function PinPad({ onSubmit, onClose, error }) {
      const [pin, setPin] = useState('');
      const [shake, setShake] = useState(false);
      useEffect(() => { if (error) { setShake(true); setPin(''); setTimeout(() => setShake(false), 500); } }, [error]);
      const press = (d) => {
        if (pin.length >= 4) return;
        const p = pin + d; setPin(p);
        if (p.length === 4) onSubmit(p);
      };
      return (
        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50">
          <div className={`bg-white rounded-3xl p-6 w-80 flex flex-col items-center gap-4 ${shake ? 'animate-shake' : ''}`}>
            <div className="text-xl font-black text-slate-700">先生用画面　暗証番号</div>
            <div className="flex gap-3">{[0, 1, 2, 3].map(i => <div key={i} className={`w-6 h-6 rounded-full border-2 border-slate-400 ${i < pin.length ? 'bg-slate-600' : ''}`} />)}</div>

            <div className="grid grid-cols-3 gap-3">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9', 'けす', '0', '×'].map(k => (
                <button key={k} onClick={() => k === 'けす' ? setPin(pin.slice(0, -1)) : k === '×' ? onClose() : press(k)}
                  className="w-16 h-16 rounded-2xl bg-slate-100 text-2xl font-bold text-slate-700 active:bg-slate-300">{k}</button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const KINDS = ['よむ', 'ことば', 'なぞる', 'かく'];
    const statOf = (t) => { let n = 0, o = 0; if (t) Object.values(t).forEach(([a, b]) => { n += a; o += b; }); return [n, o]; };
    const rateColor = (n, o) => !n ? '#f1f5f9' : o / n >= 0.8 ? '#bbf7d0' : o / n >= 0.6 ? '#fef08a' : '#fecaca';
    const pct = (n, o) => n ? `${Math.round((o / n) * 100)}%` : '－';

    const GOJUON = [
      ['ア', 'イ', 'ウ', 'エ', 'オ'], ['カ', 'キ', 'ク', 'ケ', 'コ'], ['サ', 'シ', 'ス', 'セ', 'ソ'], ['タ', 'チ', 'ツ', 'テ', 'ト'], ['ナ', 'ニ', 'ヌ', 'ネ', 'ノ'],
      ['ハ', 'ヒ', 'フ', 'ヘ', 'ホ'], ['マ', 'ミ', 'ム', 'メ', 'モ'], ['ヤ', '', 'ユ', '', 'ヨ'], ['ラ', 'リ', 'ル', 'レ', 'ロ'], ['ワ', '', '', '', 'ヲ'], ['ン', '', '', '', ''],
    ];
    const DAKU_TABLE = [['ガ', 'ギ', 'グ', 'ゲ', 'ゴ'], ['ザ', 'ジ', 'ズ', 'ゼ', 'ゾ'], ['ダ', 'ヂ', 'ヅ', 'デ', 'ド'], ['バ', 'ビ', 'ブ', 'ベ', 'ボ'], ['パ', 'ピ', 'プ', 'ペ', 'ポ']];
    const SPECIAL = [['ー', 'ッ', 'ャ', 'ュ', 'ョ']];

    // つまずきの ランキング（2かい いじょう とりくんで 80% みまん）
    const weakList = (targets) => Object.entries(targets || {})
      .map(([ch, t]) => { const [n, o] = statOf(t); return { ch, t, n, o, r: n ? o / n : 1 }; })
      .filter(x => x.n >= 2 && x.r < 0.8)
      .sort((a, b) => a.r - b.r || b.n - a.n);
    const weakKind = (t) => {
      let worst = null;
      KINDS.forEach(k => { if (t[k] && t[k][0] >= 1) { const r = t[k][1] / t[k][0]; if (r < 0.8 && (!worst || r < worst.r)) worst = { k, r }; } });
      return worst ? worst.k : '';
    };

    function CharGrid({ table, targets, onPick, picked }) {
      return (
        <div className="inline-grid gap-1" style={{ gridTemplateColumns: `repeat(${table[0].length}, minmax(0, 1fr))` }}>
          {table.flat().map((ch, i) => {
            if (!ch) return <div key={i} />;
            const [n, o] = statOf(targets[ch]);
            return (
              <button key={i} onClick={() => onPick(ch)} className={`w-16 h-16 rounded-xl flex flex-col items-center justify-center border-2 ${picked === ch ? 'border-slate-700' : 'border-transparent'}`} style={{ background: rateColor(n, o) }}>
                <span className="kana text-2xl text-slate-700">{ch}</span>
                <span className="text-xs text-slate-600">{pct(n, o)}</span>
              </button>
            );
          })}
        </div>
      );
    }

    function TeacherView({ data, pin, onClose, onChanged }) {
      const [sel, setSel] = useState(null);
      const [picked, setPicked] = useState(null);
      const [busy, setBusy] = useState(false);
      const students = data.students;
      const s = students.find(x => x.name === sel);

      const classWeak = weakList(data.classTargets).slice(0, 12);

      const summaryRow = (st) => {
        const p = parseProgress(st.progress);
        const c = clearedCount(p);
        const nextRow = ROWS.find(r => !p.cleared[r.id]);
        return { p, c, now: nextRow ? `コース${nextRow.part}・${nextRow.name}` : 'ぜんぶ クリア', weak: weakList(st.targets).slice(0, 4) };
      };

      const toggleUnlock = async () => {
        setBusy(true);
        const p = parseProgress(s.progress);
        const res = await api.setUnlock(pin, s.name, !p.unlockAll).catch(() => null);
        setBusy(false);
        if (res && res.ok) onChanged(s.name, res.progress);
      };

      return (
        <div className="fixed inset-0 bg-slate-50 z-40 overflow-auto" style={{ userSelect: 'text' }}>
          <div className="max-w-6xl mx-auto p-4 md:p-6">

              <h2 className="text-2xl font-black text-slate-700">先生用画面　学習の記録</h2>

            </div>
            {data.isDefaultPin && <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 mb-4 text-amber-800 text-sm font-bold">暗証番号が初期値（1234）のままです。スプレッドシートの「せってい」シートで変更してください。</div>}
            {data.demo && <div className="bg-sky-50 border-2 border-sky-200 rounded-xl p-3 mb-4 text-sky-800 text-sm">おためしモードです。記録はこの端末のブラウザにだけ保存されます。</div>}

            <div className="flex gap-2 flex-wrap mb-4">
              <button onClick={() => { setSel(null); setPicked(null); }} className={`px-4 py-2 rounded-full font-bold border-2 ${!sel ? 'bg-slate-700 text-white border-slate-700' : 'bg-white text-slate-600 border-slate-300'}`}>クラス全体</button>
              {students.map(st => (
                <button key={st.name} onClick={() => { setSel(st.name); setPicked(null); }} className={`px-4 py-2 rounded-full font-bold border-2 ${sel === st.name ? 'bg-sky-600 text-white border-sky-600' : 'bg-white text-slate-600 border-slate-300'}`}>{st.name}</button>
              ))}
            </div>

            {!s && (
              <div className="flex flex-col gap-4">
                <div className="bg-white rounded-2xl border-2 border-slate-200 overflow-x-auto">
                  <table className="w-full text-left">
                    <thead className="bg-slate-100 text-slate-600 text-sm"><tr>
                      <th className="p-3">なまえ</th><th className="p-3">いま学習中</th><th className="p-3">クリア</th><th className="p-3">回答数</th><th className="p-3">1回目正答率</th><th className="p-3">最終学習日</th><th className="p-3">つまずいている文字</th>
                    </tr></thead>
                    <tbody>
                      {students.map(st => {
                        const x = summaryRow(st);
                        return (
                          <tr key={st.name} className="border-t border-slate-100 hover:bg-sky-50 cursor-pointer" onClick={() => setSel(st.name)}>
                            <td className="p-3 font-bold">{st.name}</td>
                            <td className="p-3">{x.now}{x.p.unlockAll ? '（全開放）' : ''}</td>
                            <td className="p-3">{x.c} / {ROWS.length}</td>
                            <td className="p-3">{st.count}</td>
                            <td className="p-3"><span className="px-2 py-1 rounded" style={{ background: rateColor(st.count, st.ok) }}>{pct(st.count, st.ok)}</span></td>
                            <td className="p-3">{st.last || '－'}</td>
                            <td className="p-3">{x.weak.length ? x.weak.map(w => <span key={w.ch} className="kana inline-block text-xl mr-1 px-2 rounded" style={{ background: rateColor(w.n, w.o) }}>{w.ch}</span>) : <span className="text-slate-400 text-sm">なし</span>}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                  <div className="font-black text-slate-700 mb-2">クラス全体で つまずきが多い文字</div>
                  {classWeak.length === 0 ? <div className="text-slate-400">まだ ありません</div> : (
                    <div className="flex flex-wrap gap-2">
                      {classWeak.map(w => (
                        <div key={w.ch} className="rounded-xl px-3 py-2 text-center" style={{ background: rateColor(w.n, w.o) }}>
                          <div className="kana text-3xl">{w.ch}</div>
                          <div className="text-xs">{pct(w.n, w.o)}（{w.n}回）</div>
                          <div className="text-xs font-bold text-rose-600">{weakKind(w.t)}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <Legend />
              </div>
            )}

            {s && (() => {
              const x = summaryRow(s);
              const t = s.targets || {};
              const pk = picked && t[picked];
              const weak = weakList(t);
              const weakWords = Object.entries(s.words || {}).filter(([, [n, o]]) => n >= 1 && o / n < 0.8).sort((a, b) => a[1][1] / a[1][0] - b[1][1] / b[1][0]).slice(0, 12);
              return (
                <div className="flex flex-col gap-4">
                  <div className="bg-white rounded-2xl border-2 border-slate-200 p-4 flex flex-wrap gap-6 items-center">
                    <div className="text-2xl font-black">{s.name}</div>
                    <div>いま：<b>{x.now}</b></div>
                    <div>回答数：<b>{s.count}</b></div>
                    <div>1回目正答率：<b>{pct(s.count, s.ok)}</b></div>
                    <div>最終学習日：<b>{s.last || '－'}</b></div>
                    <button disabled={busy} onClick={toggleUnlock} className="ml-auto px-4 py-2 rounded-full border-2 font-bold border-violet-400 text-violet-700 bg-violet-50">
                      {x.p.unlockAll ? '🔓 全コース開放中（元に戻す）' : '🔒 全コースを開放する'}
                    </button>
                  </div>

                  <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                    <div className="font-black text-slate-700 mb-2">コースの進み具合</div>
                    {PARTS.map(p => (
                      <div key={p.id} className="flex items-center gap-2 mb-2 flex-wrap">
                        <div className="w-40 text-sm font-bold" style={{ color: p.color }}>コース{p.id} {p.title}</div>
                        {partRows(p.id).map(r => {
                          const d = (x.p.done[r.id] || []).length;
                          const cl = x.p.cleared[r.id];
                          return <div key={r.id} className="text-xs px-2 py-1 rounded-lg border" style={{ background: cl ? '#bbf7d0' : d ? '#fef9c3' : '#f8fafc' }}>{r.name} {cl ? '✔' : `${d}/${r.steps.length}`}</div>;
                        })}
                      </div>
                    ))}
                  </div>

                  <div className="grid md:grid-cols-2 gap-4">
                    <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                      <div className="font-black text-slate-700 mb-2">文字ごとの 1回目正答率（押すと くわしく）</div>
                      <div className="flex flex-wrap gap-6">
                        <div><div className="text-sm text-slate-500 mb-1">清音</div><CharGrid table={GOJUON} targets={t} onPick={setPicked} picked={picked} /></div>
                        <div className="flex flex-col gap-4">
                          <div><div className="text-sm text-slate-500 mb-1">濁音・半濁音</div><CharGrid table={DAKU_TABLE} targets={t} onPick={setPicked} picked={picked} /></div>
                          <div><div className="text-sm text-slate-500 mb-1">長音・促音・拗音</div><CharGrid table={SPECIAL} targets={t} onPick={setPicked} picked={picked} /></div>
                        </div>
                      </div>
                      {picked && (
                        <div className="mt-3 p-3 rounded-xl bg-slate-50 border border-slate-200">
                          <span className="kana text-3xl mr-3">{picked}</span>
                          {pk ? KINDS.filter(k => pk[k]).map(k => <span key={k} className="inline-block mr-2 px-2 py-1 rounded text-sm" style={{ background: rateColor(pk[k][0], pk[k][1]) }}>{k}：{pk[k][1]}/{pk[k][0]}（{pct(pk[k][0], pk[k][1])}）</span>)
                            : <span className="text-slate-400">まだ記録がありません</span>}
                        </div>
                      )}
                      <Legend />
                    </div>
                    <div className="flex flex-col gap-4">
                      <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                        <div className="font-black text-slate-700 mb-2">つまずいている文字（正答率の低い順）</div>
                        {weak.length === 0 ? <div className="text-slate-400">いまのところ ありません</div> : (
                          <table className="w-full text-sm">
                            <thead className="text-slate-500"><tr><th className="text-left p-1">文字</th><th className="p-1">全体</th>{KINDS.map(k => <th key={k} className="p-1">{k}</th>)}<th className="p-1">にがて</th></tr></thead>
                            <tbody>
                              {weak.slice(0, 15).map(w => (
                                <tr key={w.ch} className="border-t border-slate-100">
                                  <td className="kana text-2xl p-1">{w.ch}</td>
                                  <td className="p-1 text-center"><span className="px-2 rounded" style={{ background: rateColor(w.n, w.o) }}>{pct(w.n, w.o)}</span></td>
                                  {KINDS.map(k => <td key={k} className="p-1 text-center">{w.t[k] ? <span className="px-1 rounded" style={{ background: rateColor(w.t[k][0], w.t[k][1]) }}>{pct(w.t[k][0], w.t[k][1])}</span> : '－'}</td>)}
                                  <td className="p-1 text-center font-bold text-rose-600">{weakKind(w.t)}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        )}
                      </div>
                      <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                        <div className="font-black text-slate-700 mb-2">つまずいている ことば</div>
                        {weakWords.length === 0 ? <div className="text-slate-400">いまのところ ありません</div> : (
                          <div className="flex flex-wrap gap-2">{weakWords.map(([w, [n, o]]) => <span key={w} className="kana text-xl px-3 py-1 rounded-lg" style={{ background: rateColor(n, o) }}>{w} <span className="text-xs">{pct(n, o)}</span></span>)}</div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })()}
            <p className="text-xs text-slate-400 mt-6">※「1回目正答率」は、1回目で正解した割合です（まちがえた後にやり直して正解したものは含みません）。書き順データ：KanjiVG（CC BY-SA 3.0）</p>
          </div>
        </div>
      );
    }
    function Legend() {
      return (
        <div className="flex gap-3 text-xs text-slate-600 mt-3 flex-wrap">
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#fecaca' }} />60%未満</span>
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#fef08a' }} />60〜79%</span>
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#bbf7d0' }} />80%以上</span>
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#f1f5f9' }} />まだ</span>
        </div>
      );
    }

    // =====================================================================
    // 16. アプリ ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [bootError, setBootError] = useState('');
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [soundOn, setSoundOn] = useState(true);
      const [robo, setRobo] = useState({ text: '', mood: 'normal', talking: false });
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [loading, setLoading] = useState(false);
      const sayId = useRef(0);
      const progRef = useRef(progress);
      progRef.current = progress;

      // ロボタンが はなす
      const roboApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          if (text !== null) setRobo({ text, mood: opts.mood || 'normal', talking: true });
          else setRobo(r => ({ ...r, talking: true }));
          const speech = opts.speech || text || '';
          let finished = false;
          const end = () => { if (finished) return; finished = true; if (sayId.current === id) setRobo(r => ({ ...r, talking: false })); resolve(); };
          const guard = setTimeout(end, 1500 + (speech.length * 330) / Speech.rate);
          Speech.say(speech, () => { clearTimeout(guard); end(); });
        });
        return {
          say: (text, opts) => run(text, opts),
          speak: (speech) => run(null, { speech }),
          stop: () => { sayId.current++; Speech.stop(); setRobo(r => ({ ...r, talking: false })); },
        };
      }, []);
      const ctx = useMemo(() => ({ ...roboApi, state: robo }), [roboApi, robo]);

      useEffect(() => {
        api.init().then(d => {
          if (d.settings) { Speech.rate = Number(d.settings.rate) || 0.8; Speech.pitch = Number(d.settings.pitch) || 1.3; }
          setBoot(d);
          api.flush();
        }).catch(e => setBootError(String(e && e.message || e)));
      }, []);

      const selectStudent = async (n) => {
        Sound.get(); Sound.tap();
        setLoading(true);
        try {
          const p = await api.student(n);
          setProgress(parseProgress(p)); setName(n);
          setView({ v: 'home' });
        } catch (e) { alert('よみこみに しっぱい しました。もういちど おしてください。'); }
        setLoading(false);
      };

      const persist = (p, records) => {
        api.save({ name, progress: JSON.stringify(p), records, stamp: today(), time: Date.now() });
      };

      const onAnswer = (firstTry) => {
        setProgress(p => {
          let { level, streak } = p;
          if (firstTry) { streak++; if (streak >= 4 && level < 3) { level = 3; streak = 0; } }
          else { streak = 0; level = 2; }
          return { ...p, level, streak };
        });
      };

      const finishStep = (row, step, records, meta) => {
        const p0 = progRef.current;
        const before = clearedCount(p0);
        const done = { ...p0.done, [row.id]: uniq([...(p0.done[row.id] || []), ...(step !== 'check' || meta.pass ? [step] : [])]) };
        const cleared = { ...p0.cleared };
        let stamp = null;
        if (step === 'check' && meta.pass) { if (!cleared[row.id]) stamp = STAMPS[rowIndex(row.id)]; cleared[row.id] = true; }
        const p = { ...p0, done, cleared };
        const newWear = WEARS.find(w => w.need > before && w.need <= clearedCount(p)) || null;
        setProgress(p);
        persist(p, records);
        setView({ v: 'result', row, result: { step, meta, stamp, newWear } });
      };

      const quitStep = (row, records) => {
        if (records.length) persist(progRef.current, records);
        setView({ v: 'row', row });
      };

      const toggleWear = (id) => {
        const p = { ...progress, wearOff: progress.wearOff.includes(id) ? progress.wearOff.filter(x => x !== id) : [...progress.wearOff, id] };
        setProgress(p); persist(p, []);
      };

      const logout = () => { roboApi.stop(); setName(null); setView({ v: 'login' }); };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (pin) => {
        const d = await api.teacher(pin).catch(() => null);
        if (!d || !d.ok) { setPinError(e => e + 1); return; }
        setPinOpen(false); setTeacher({ data: d, pin });
      };
      const teacherChanged = (n, prog) => {
        setTeacher(t => ({ ...t, data: { ...t.data, students: t.data.students.map(s => s.name === n ? { ...s, progress: prog } : s) } }));
        if (n === name) setProgress(parseProgress(prog));
      };

      if (bootError) return <div className="p-10 text-xl text-rose-600 font-bold">よみこみに しっぱい しました：{bootError}</div>;
      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-sky-700">じゅんび ちゅう…</div>;

      const wear = wearsOf(progress);
      const bar = (extra) => (
        <TopBar name={name} onLogout={logout} onTeacher={openTeacher} soundOn={soundOn}
          onSound={() => { Sound.on = !soundOn; setSoundOn(!soundOn); }}>{extra}</TopBar>
      );

      let screen;
      if (!name || view.v === 'login') screen = <LoginScreen students={boot.students} onSelect={selectStudent} onTeacher={openTeacher} demo={boot.demo} />;
      else if (view.v === 'home') screen = <HomeScreen name={name} progress={progress} bar={bar()} onPart={(id) => setView({ v: 'part', part: id })} onWearToggle={toggleWear} />;
      else if (view.v === 'part') screen = <PartScreen partId={view.part} progress={progress} bar={bar()} wear={wear} onBack={() => setView({ v: 'home' })} onRow={(r) => setView({ v: 'row', row: r })} />;
      else if (view.v === 'row') screen = <RowScreen key={view.row.id + JSON.stringify(progress.done[view.row.id] || [])} row={view.row} progress={progress} bar={bar()} wear={wear} onBack={() => setView({ v: 'part', part: view.row.part })} onStep={(s) => { Sound.tap(); setView({ v: 'act', row: view.row, step: s, key: Date.now() }); }} />;
      else if (view.v === 'act') screen = <Activity key={view.key} row={view.row} step={view.step} progress={progress} wear={wear} onAnswer={onAnswer}
        onQuit={(recs) => quitStep(view.row, recs)} onFinish={(recs, meta) => finishStep(view.row, view.step, recs, meta)} />;
      else if (view.v === 'result') screen = <ResultScreen result={view.result} wear={wear}
        onNext={() => setView({ v: 'row', row: view.row })} onHome={() => setView({ v: 'home' })} />;

      return (
        <RoboCtx.Provider value={ctx}>
          {screen}
          {loading && <div className="fixed inset-0 bg-white/60 flex items-center justify-center text-3xl font-bold text-sky-700 z-50">よみこみ ちゅう…</div>}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
          {teacher && <TeacherView data={teacher.data} pin={teacher.pin} onChanged={teacherChanged}
            onClose={async () => {
              setTeacher(null);
              if (name) { try { setProgress(parseProgress(await api.student(name))); } catch (e) {} }
            }} />}
        </RoboCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
