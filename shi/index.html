<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オノマトペの 詩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  :root { --bg:#f2f6ef; --paper:#fff; --ink:#23302a; --muted:#6b7a70; --line:#d5dfd2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px)); }
  h1 { margin:0 0 6px; font-size:clamp(26px,4vw,40px); text-align:center; }
  p.lead { margin:0 0 22px; text-align:center; color:var(--muted); font-size:clamp(15px,2vw,20px); }
  .list { max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
  a.card { display:flex; flex-direction:column; align-items:center; gap:10px; text-decoration:none; color:inherit;
    background:var(--paper); border:3px solid var(--c); border-radius:20px; padding:14px 12px 16px;
    box-shadow:0 6px 0 var(--c); transition:transform .08s, box-shadow .08s; }
  a.card:active { transform:translateY(5px); box-shadow:0 1px 0 var(--c); }
  a.card:focus-visible { outline:4px solid #2b67d8; outline-offset:3px; }
  a.card img { width:100%; max-width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:12px; background:#fff; }
  .name { word-break:keep-all; overflow-wrap:anywhere; font-weight:700; font-size:clamp(18px,2.2vw,24px); text-align:center; line-height:1.4; }
  .name span { display:block; font-size:1.4em; }
</style>
</head>
<body>
  <h1>オノマトペの <ruby>詩<rt>し</rt></ruby></h1>
  <p class="lead">よみたい <ruby>詩<rt>し</rt></ruby>を おしてね</p>
  <div class="list">
    <a class="card" style="--c:#2f7fb5" href="ame/"><img src="ame/img/e0.jpg" alt=""><div class="name"><span>☔</span>あめの ひの おさんぽ</div></a>
    <a class="card" style="--c:#c2461f" href="matsuri/"><img src="matsuri/img/e0.jpg" alt=""><div class="name"><span>🥁</span>どうぶつ たちの おまつり</div></a>
    <a class="card" style="--c:#2a8f8a" href="ofuro/"><img src="ofuro/img/e0.jpg" alt=""><div class="name"><span>🛁</span>おふろ だいすき</div></a>
    <a class="card" style="--c:#c23b3b" href="undoukai/"><img src="undoukai/img/e0.jpg" alt=""><div class="name"><span>🏃</span>わくわく うんどうかい</div></a>
    <a class="card" style="--c:#3c6fb0" href="yuki/"><img src="yuki/img/e0.jpg" alt=""><div class="name"><span>⛄</span>ゆきの ひ</div></a>
  </div>
</body>
</html>
