    // =====================================================================
    // 自作の 絵（合う 絵文字が ない もの）
    function SvgItem({ id, size = 60 }) {
      const s = { width: size, height: size, display: 'block' };
      if (id === 'hachimaki') return (
        <svg viewBox="0 0 100 100" style={s}><path d="M8 52 Q50 30 92 52 L92 64 Q50 42 8 64 Z" fill="#fff" stroke="#334155" strokeWidth="3" />
          <path d="M14 56 Q50 38 86 56" stroke="#dc2626" strokeWidth="5" fill="none" strokeDasharray="10 8" />
          <path d="M84 56 q14 -4 12 12 q-6 -6 -12 -2 z" fill="#fff" stroke="#334155" strokeWidth="3" /><path d="M86 62 q8 10 0 22 q-2 -10 -6 -14 z" fill="#fff" stroke="#334155" strokeWidth="3" /></svg>);
      if (id === 'chef') return (
        <svg viewBox="0 0 100 100" style={s}><circle cx="32" cy="38" r="20" fill="#fff" stroke="#94a3b8" strokeWidth="3" /><circle cx="68" cy="38" r="20" fill="#fff" stroke="#94a3b8" strokeWidth="3" /><circle cx="50" cy="26" r="22" fill="#fff" stroke="#94a3b8" strokeWidth="3" />
          <rect x="22" y="44" width="56" height="34" rx="4" fill="#fff" stroke="#94a3b8" strokeWidth="3" /><path d="M24 58 H76" stroke="#e2e8f0" strokeWidth="3" /></svg>);
      if (id === 'apron') return (
        <svg viewBox="0 0 100 100" style={s}><path d="M30 10 Q50 0 70 10" stroke="#78350f" strokeWidth="4" fill="none" /><path d="M32 12 H68 V36 L82 40 V90 Q50 98 18 90 V40 L32 36 Z" fill="#d97706" stroke="#78350f" strokeWidth="3" />
          <rect x="30" y="54" width="40" height="22" rx="4" fill="#b45309" stroke="#78350f" strokeWidth="3" /><path d="M42 54 V44 M58 54 V46" stroke="#475569" strokeWidth="4" /><circle cx="42" cy="42" r="3" fill="#94a3b8" /></svg>);
      if (id === 'cape') return (
        <svg viewBox="0 0 100 100" style={s}><path d="M30 6 Q50 14 70 6 L92 92 Q50 100 8 92 Z" fill="#dc2626" stroke="#7f1d1d" strokeWidth="3" /><path d="M50 14 L50 92" stroke="#b91c1c" strokeWidth="2" /><circle cx="50" cy="10" r="6" fill="#facc15" stroke="#a16207" strokeWidth="2" /></svg>);
      const th = THEMES[id];
      if (th) return <div style={{ ...s, borderRadius: size * .12, overflow: 'hidden', border: '2px solid #92400e' }}><div style={{ height: '64%', background: th.wall }} /><div style={{ height: '36%', background: th.floor }} /></div>;
      return <span style={{ fontSize: size * .8 }}>❓</span>;
    }
    // かべと ゆか（自作の 絵）
    const THEMES = {
      wood: { wall: 'repeating-linear-gradient(90deg,#f8e2bf 0 44px,#ecd0a3 44px 47px)', floor: 'repeating-linear-gradient(90deg,#c08a52 0 60px,#a8743f 60px 63px)' },
      grass: { wall: 'linear-gradient(#bae6fd,#e0f2fe)', floor: 'repeating-linear-gradient(100deg,#86efac 0 10px,#4ade80 10px 14px)' },
      brick: { wall: 'repeating-linear-gradient(0deg,#fde4cf 0 3px,transparent 3px 26px),repeating-linear-gradient(90deg,#c2410c 0 46px,#fde4cf 46px 49px),#c2410c', floor: 'repeating-linear-gradient(90deg,#78716c 0 40px,#57534e 40px 43px)' },
      stripe: { wall: 'repeating-linear-gradient(90deg,#fde68a 0 22px,#fffbeb 22px 44px)', floor: 'repeating-linear-gradient(90deg,#d6a46a 0 60px,#b9854c 60px 63px)' },
      dots: { wall: 'radial-gradient(circle,#93c5fd 6px,transparent 7px) 0 0/34px 34px,#eff6ff', floor: '#7dd3fc' },
      check: { wall: 'conic-gradient(#fecaca 25%,#fff 0 50%,#fecaca 0 75%,#fff 0) 0 0/40px 40px', floor: 'conic-gradient(#334155 25%,#f8fafc 0 50%,#334155 0 75%,#f8fafc 0) 0 0/36px 36px' },
      tatami: { wall: 'repeating-linear-gradient(90deg,#fffaf0 0 56px,#a16207 56px 59px),#fffaf0', floor: 'repeating-linear-gradient(0deg,#d9e7a8 0 4px,#c5d88a 4px 7px)' },
      sakura: { wall: 'radial-gradient(circle,#f9a8d4 5px,transparent 6px) 0 0/40px 40px,radial-gradient(circle,#fbcfe8 4px,transparent 5px) 20px 20px/40px 40px,#fff1f2', floor: '#f5d0c5' },
      sea: { wall: 'radial-gradient(circle,rgba(255,255,255,.7) 4px,transparent 5px) 0 0/50px 60px,linear-gradient(#38bdf8,#0369a1)', floor: 'radial-gradient(circle,#fcd34d 2px,transparent 3px) 0 0/16px 16px,#fde68a' },
      night: { wall: 'radial-gradient(circle,#fff 1.5px,transparent 2px) 0 0/38px 30px,radial-gradient(circle,#fde68a 2px,transparent 3px) 17px 13px/60px 50px,linear-gradient(#1e1b4b,#312e81)', floor: 'repeating-linear-gradient(90deg,#3f3f46 0 60px,#27272a 60px 63px)' },
      gold: { wall: 'repeating-linear-gradient(45deg,#fde68a 0 18px,#fbbf24 18px 22px),#fde68a', floor: 'linear-gradient(90deg,#d97706,#fbbf24,#d97706)' },
    };
    function ItemPic({ it, size = 60 }) {
      if (it.svg) return <SvgItem id={it.svg} size={size} />;
      return <span className="leading-none inline-block" style={{ fontSize: size * 0.85 }}>{it.e}</span>;
    }
    function TierChip({ it }) {
      const t = D.TIERS[it.tier] || D.TIERS[0];
      return <span className={`rounded-full font-bold border-2 whitespace-nowrap text-xs px-2 ${it.tier === 3 ? 'glow' : ''}`} style={{ color: t.color, borderColor: t.color, background: t.bg }}>{it.tier === 3 ? '👑 ' : ''}{t.n}</span>;
    }

    function ShopScreen({ progress, onBuy }) {
      const gaji = useGaji();
      const [cat, setCat] = useState(null);
      const [confirm, setConfirm] = useState(null);
      const own = new Set(progress.items);
      const c = cat && D.ITEM_CATS.find(x => x.id === cat);
      useEffect(() => { gaji.say('こうぼうの おみせだよ。コインで かぐや どうぐ、ぼくの ふくを かえるよ。どの たなを みる？'); }, []);
      const enter = (id) => { Sound.tap(); setCat(id); gaji.say(`${D.ITEM_CATS.find(x => x.id === id).name}の たなだよ。`); };
      const tap = (it) => {
        Sound.tap();
        if (own.has(it.id)) { gaji.say(`${it.n}は もう もって いるよ。`); return; }
        if (progress.coins < it.p) { gaji.say(`${it.n}は コイン ${it.p}まい。あと ${it.p - progress.coins}まい あつめよう！`, { mood: 'think' }); return; }
        gaji.say(`${it.n}を かいますか？`);
        setConfirm(it);
      };
      const buy = () => {
        const it = confirm; setConfirm(null);
        onBuy(it); Sound.buy(); if (it.tier === 3) Sound.big();
        gaji.say(it.slot ? `${it.n}を かったよ。「こうぼう」で ぼくに つけてね。` : `${it.n}を かったよ。「こうぼう」に かざってね。`, { mood: 'happy' });
      };
      return (
        <div className="w-full flex-1 flex flex-col items-center gap-3 p-3 wood">
          <div className="bg-white/90 rounded-3xl p-2 w-full max-w-5xl"><GajiBar size={90} compact equip={progress.equip} /></div>
          {!c && (
            <div className="grid grid-cols-3 gap-3 w-full max-w-4xl">
              {D.ITEM_CATS.map(x => {
                const n = x.items.filter(it => own.has(it.id)).length;
                return (
                  <button key={x.id} onClick={() => enter(x.id)} className="btn3d rounded-2xl border-4 bg-white flex flex-col items-center py-3" style={{ borderColor: x.color }}>
                    <span className="text-6xl">{x.icon}</span>
                    <span className="text-2xl font-bold mt-1">{x.name}</span>
                    <span className="text-sm font-bold rounded-full px-2 mt-1 bg-slate-100">{n === x.items.length ? '🏆 ' : ''}{n} / {x.items.length}</span>
                  </button>
                );
              })}
            </div>
          )}
          {c && (
            <div className="w-full max-w-5xl flex flex-col gap-3">
              <div className="flex items-center gap-3">
                <button onClick={() => { Sound.tap(); setCat(null); }} className="btn3d shrink-0 bg-white border-2 border-slate-300 rounded-2xl px-4 py-2 text-xl font-bold">◀ もどる</button>
                <div className="flex-1 text-center text-3xl font-bold py-2 rounded-2xl bg-white border-4" style={{ borderColor: c.color }}>{c.icon} {c.name}</div>
              </div>
              <div className="grid grid-cols-3 sm:grid-cols-5 gap-3 bg-white/90 rounded-3xl p-3">
                {c.items.map(it => {
                  const have = own.has(it.id), can = progress.coins >= it.p;
                  return (
                    <button key={it.id} onClick={() => tap(it)} className={`btn3d rounded-2xl border-4 p-1 flex flex-col items-center ${it.tier === 3 ? 'bg-amber-50' : 'bg-white'}`} style={{ borderColor: have ? '#34d399' : (D.TIERS[it.tier] || D.TIERS[0]).color }}>
                      <TierChip it={it} />
                      <span className={`h-16 flex items-center ${have || can ? '' : 'opacity-60'}`}><ItemPic it={it} size={60} /></span>
                      <span className="text-base font-bold mt-1 leading-tight h-10 flex items-center text-center">{it.n}</span>
                      <span className={`text-xl font-bold rounded-full px-2 ${have ? 'bg-emerald-100 text-emerald-700' : can ? 'bg-amber-100' : 'bg-slate-100 text-slate-400'}`}>{have ? '✓' : `🪙 ${it.p}`}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
          {confirm && (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 flex flex-col items-center gap-3 pop">
                <ItemPic it={confirm} size={100} />
                <TierChip it={confirm} />
                <div className="text-3xl font-bold">{confirm.n}を かいますか？</div>
                <div className="text-2xl">🪙 {confirm.p}まい（のこり {progress.coins - confirm.p}まい）</div>
                <div className="flex gap-4 mt-2">
                  <Btn onClick={buy} color="#16a34a" light="#dcfce7" className="text-3xl px-10">かう</Btn>
                  <Btn onClick={() => setConfirm(null)} color="#64748b" light="#f1f5f9">やめる</Btn>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // こうぼうの へや：かべと ゆか・かぐ・どうぐ・ガジガジせんせい
    const SPOTS = {
      wall: [{ l: 6, t: 10 }, { l: 22, t: 6 }, { l: 64, t: 8 }, { l: 80, t: 12 }],
      shelf: [{ l: 60, t: 33 }, { l: 70, t: 33 }, { l: 80, t: 33 }, { l: 60, t: 51 }, { l: 70, t: 51 }, { l: 80, t: 51 }],
      floor: [{ l: 4, t: 70 }, { l: 16, t: 76 }, { l: 28, t: 70 }, { l: 66, t: 74 }, { l: 78, t: 70 }, { l: 88, t: 77 }],
    };
    const LIMIT = { wall: 4, shelf: 6, floor: 6 };
    function RoomView({ progress, size = 900 }) {
      const th = THEMES[(progress.theme && ITEM[progress.theme] && ITEM[progress.theme].svg) || 'wood'];
      const placed = { wall: [], shelf: [], floor: [] };
      (progress.room || []).forEach(id => { const it = ITEM[id]; if (it && placed[it.place] && placed[it.place].length < LIMIT[it.place]) placed[it.place].push(it); });
      const h = size * 0.56;
      return (
        <div className="relative rounded-3xl overflow-hidden border-8 border-amber-800 shadow-xl" style={{ width: size, height: h, maxWidth: '100%' }}>
          <div className="absolute inset-x-0 top-0" style={{ height: '64%', background: th.wall }} />
          <div className="absolute inset-x-0 bottom-0" style={{ height: '36%', background: th.floor }} />
          <div className="absolute inset-x-0" style={{ top: '64%', height: 8, background: '#78350f' }} />
          {/* たな（自作の 絵） */}
          <div className="absolute" style={{ left: '57%', top: '27%', width: '34%', height: '40%' }}>
            <div className="absolute inset-x-0" style={{ top: '42%', height: 10, background: '#92400e', borderRadius: 4, boxShadow: '0 3px 0 #451a03' }} />
            <div className="absolute inset-x-0" style={{ top: '88%', height: 10, background: '#92400e', borderRadius: 4, boxShadow: '0 3px 0 #451a03' }} />
          </div>
          {Object.entries(placed).map(([pl, its]) => its.map((it, i) => (
            <div key={it.id} className="absolute" style={{ left: `${SPOTS[pl][i].l}%`, top: `${SPOTS[pl][i].t}%` }}><ItemPic it={it} size={pl === 'floor' ? h * 0.2 : h * 0.15} /></div>
          )))}
          <div className="absolute" style={{ left: '50%', bottom: '4%', transform: 'translateX(-50%)' }}><Gaji equip={progress.equip} size={h * 0.62} mood="happy" /></div>
        </div>
      );
    }
    function RoomScreen({ progress, onChange }) {
      const gaji = useGaji();
      const [tab, setTab] = useState('kagu');
      const own = new Set(progress.items);
      useEffect(() => { gaji.say('ここは ぼくの こうぼう。かった ものを かざったり、ぼくに きせたり できるよ。', { mood: 'happy' }); }, []);
      const c = D.ITEM_CATS.find(x => x.id === tab);
      const mine = c.items.filter(it => own.has(it.id));
      const toggleRoom = (it) => {
        Sound.tap();
        const room = progress.room || [];
        if (room.includes(it.id)) { onChange({ room: room.filter(x => x !== it.id) }); return; }
        const n = room.filter(id => ITEM[id] && ITEM[id].place === it.place).length;
        if (n >= LIMIT[it.place]) { gaji.say(`${it.place === 'floor' ? 'ゆか' : it.place === 'wall' ? 'かべ' : 'たな'}は いっぱい。どれかを しまってね。`, { mood: 'think' }); return; }
        onChange({ room: [...room, it.id] });
      };
      const wear = (it) => { Sound.tap(); const eq = { ...(progress.equip || {}) }; eq[it.slot] = eq[it.slot] === it.id ? '' : it.id; onChange({ equip: eq }); };
      const theme = (it) => { Sound.tap(); onChange({ theme: progress.theme === it.id ? '' : it.id }); };
      const isOn = (it) => c.kind === 'room' ? (progress.room || []).includes(it.id) : c.kind === 'theme' ? progress.theme === it.id : (progress.equip || {})[it.slot] === it.id;
      return (
        <div className="w-full flex-1 flex flex-col items-center gap-3 p-3 wood">
          <RoomView progress={progress} size={Math.min(900, window.innerWidth - 40)} />
          <div className="flex flex-wrap gap-2 justify-center">
            {D.ITEM_CATS.map(x => <button key={x.id} onClick={() => { Sound.tap(); setTab(x.id); }} className={`rounded-2xl px-4 py-2 text-xl font-bold border-4 ${tab === x.id ? 'bg-white' : 'bg-white/60'}`} style={{ borderColor: tab === x.id ? x.color : '#e7e5e4' }}>{x.icon} {x.name}</button>)}
          </div>
          <div className="bg-white/90 rounded-3xl p-3 w-full max-w-5xl">
            {!mine.length && <div className="text-xl text-center py-4">まだ もって いないよ。「🛒 おみせ」で かえるよ。</div>}
            <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
              {mine.map(it => (
                <button key={it.id} onClick={() => c.kind === 'room' ? toggleRoom(it) : c.kind === 'theme' ? theme(it) : wear(it)}
                  className={`btn3d rounded-2xl border-4 p-2 flex flex-col items-center ${isOn(it) ? 'bg-emerald-50 border-emerald-500' : 'bg-white border-amber-300'}`}>
                  <ItemPic it={it} size={56} />
                  <span className="text-sm font-bold mt-1 leading-tight text-center">{it.n}</span>
                  <span className="text-sm font-bold">{isOn(it) ? (c.kind === 'wear' ? '✓ つけて いる' : '✓ かざって いる') : (c.kind === 'wear' ? 'つける' : 'かざる')}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 14. 先生用画面
    // =====================================================================
    function PinPad({ onSubmit, onClose, error }) {
      const [v, setV] = useState('');
      const press = (d) => { const n = (v + d).slice(0, 4); setV(n); if (n.length === 4) { onSubmit(n); setTimeout(() => setV(''), 300); } };
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
          <div className="bg-white rounded-3xl p-6 w-80 flex flex-col items-center gap-3">
            <div className="text-2xl font-bold">🔒 せんせい用</div>
            <div className="text-base">暗証番号（4けた）を入れてください</div>
            <div className="flex gap-2">{[0, 1, 2, 3].map(i => <div key={i} className="w-10 h-12 border-2 rounded-lg flex items-center justify-center text-2xl">{v[i] ? '●' : ''}</div>)}</div>
            {error > 0 && <div className="text-rose-600 font-bold">番号がちがいます</div>}
            <div className="grid grid-cols-3 gap-2">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((d, i) => d === '' ? <div key={i} /> :
                <button key={i} onClick={() => d === '⌫' ? setV(v.slice(0, -1)) : press(d)} className="btn3d w-16 h-14 rounded-xl bg-slate-100 border-2 border-slate-300 text-2xl font-bold">{d}</button>)}
            </div>
            <button onClick={onClose} className="text-lg underline mt-1">とじる</button>
          </div>
        </div>
      );
    }

    const pct = (a, b) => b ? `${Math.round((a / b) * 100)}%` : '－';
    const topOf = (m, n = 5) => Object.entries(m || {}).sort((a, b) => b[1] - a[1]).slice(0, n);
    const pieceText = (k) => { const [a, b] = k.split('>'); return `${a} を ${b} に`; };

    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(api.pending());
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const cleared = (p) => mainStages().filter(st => p.cleared[st.id]).length;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };
      const act = async (fn, okText) => {
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); onChanged(); } }
        catch (e) { flash('うまく いきませんでした：' + e.message); }
      };
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '﻿' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`ローマ字_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`ローマ字_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'romaji') { flash('このアプリのバックアップではありません'); return; }
          if (!confirm('バックアップから、子どもの進み具合・コインを元にもどします。よろしいですか？')) return;
          await act(() => api.restore(pin, d), 'バックアップから元にもどしました');
        };
        rd.readAsText(f);
      };
      const opt = (key, list) => list.map(([v, t]) =>
        <button key={String(v)} onClick={() => setS({ ...s, [key]: v })} className={`ml-2 mt-1 rounded-lg px-3 py-1 border-2 ${s[key] === v ? 'bg-amber-200 border-amber-500' : 'bg-white'}`}>{t}</button>);
      const allStages = [...mainStages(), ...hattenStages()];

      return (
        <div className="fixed inset-0 bg-slate-50 z-50 overflow-auto">
          <div className="max-w-6xl mx-auto p-4 text-base">
            <div className="flex items-center gap-3 mb-3">
              <div className="text-2xl font-bold flex-1">🔒 先生用画面 <span className="text-sm text-slate-500">ver {APP_VERSION}{data.demo ? '（おためしモード）' : ''}</span></div>
              <button onClick={onClose} className="btn3d bg-white border-2 border-slate-400 rounded-xl px-4 py-2 font-bold">とじる</button>
            </div>
            {data.isDefaultPin && <div className="bg-rose-100 border-2 border-rose-400 rounded-xl p-2 mb-2">暗証番号が はじめの「1234」のままです。「せってい」で変えてください。</div>}
            {msg && <div className="fixed top-3 left-1/2 -translate-x-1/2 bg-amber-700 text-white rounded-xl px-4 py-2 z-50">{msg}</div>}
            <div className="flex gap-2 mb-3">
              {[['class', 'クラス全体'], ['child', '子どもごと'], ['settings', 'せってい'], ['data', 'データ']].map(([id, t]) => (
                <button key={id} onClick={() => setTab(id)} className={`rounded-xl px-4 py-2 font-bold border-2 ${tab === id ? 'bg-amber-200 border-amber-500' : 'bg-white border-slate-300'}`}>{t}</button>
              ))}
            </div>

            {tab === 'class' && (
              <div className="flex flex-col gap-4">
                <table className="w-full bg-white rounded-xl overflow-hidden text-left">
                  <thead className="bg-amber-100"><tr><th className="p-2">なまえ</th><th>クリア</th><th>ひょう</th><th>コイン</th><th>問題</th><th>まちがえずに</th><th>しいん（あお）の まちがい</th><th>ぼいん（あか）の まちがい</th><th>まちがえやすい もじ</th><th>さいご</th></tr></thead>
                  <tbody>
                    {data.students.map(st => {
                      const p = parseProgress(st.progress);
                      return (
                        <tr key={st.name} className="border-t cursor-pointer hover:bg-amber-50" onClick={() => { setSel(st.name); setTab('child'); }}>
                          <td className="p-2 font-bold">{st.name}</td>
                          <td>{cleared(p)} / {mainStages().length}</td>
                          <td>{tableCount(p)} / {SEION_CELLS().length}</td>
                          <td>🪙 {p.coins}</td>
                          <td>{st.count}</td>
                          <td>{pct(st.ok, st.count)}</td>
                          <td>{st.cmiss}</td>
                          <td>{st.vmiss}</td>
                          <td className="font-bold text-lg">{topOf(st.kanaMiss, 3).map(([k]) => k).join(' ') || '－'}</td>
                          <td>{st.last || '－'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div className="text-sm text-slate-500">まちがえずに：ヒントも使わずに できた問題の割合。しいん（あお）／ぼいん（あか）の まちがい：まちがえて選んだ ピースの数。</div>
                <div className="bg-white rounded-xl p-3 flex flex-wrap gap-4">
                  <div>
                    <div className="font-bold mb-2">クラス全体の まちがえやすい もじ（赤いほど多い。数字は回数）</div>
                    <KanaTable which="seion" heat={data.classKana || {}} small />
                  </div>
                  <div className="flex-1 min-w-[240px]">
                    <div className="font-bold mb-2">まちがえやすい ピース（正しい ピース を 選んだ ピース に）</div>
                    <div className="flex flex-col gap-1">{topOf(data.classPiece, 12).map(([k, n]) => <div key={k} className="rounded-lg px-2 py-1 border bg-rose-50"><b className="text-xl">{pieceText(k)}</b>　{n}回</div>)}{!Object.keys(data.classPiece || {}).length && <span className="text-slate-500">まだ ありません</span>}</div>
                  </div>
                </div>
              </div>
            )}

            {tab === 'child' && (
              <div className="flex flex-col gap-3">
                <div className="flex gap-2 flex-wrap">
                  {data.students.map(st => <button key={st.name} onClick={() => setSel(st.name)} className={`rounded-xl px-4 py-2 font-bold border-2 ${sel === st.name ? 'bg-amber-200 border-amber-500' : 'bg-white border-slate-300'}`}>{st.name}</button>)}
                </div>
                {student && prog && (
                  <div className="grid md:grid-cols-2 gap-3">
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold text-xl mb-1">{student.name}　<span className="text-base">🎖️ {titleOf(prog)}</span></div>
                      <div>クリア：{cleared(prog)} / {mainStages().length}　ひょう：{tableCount(prog)} / {SEION_CELLS().length}　コイン：🪙 {prog.coins}（これまでに {prog.earned}まい）　買った品物：{prog.items.length}</div>
                      <div>問題：{student.count}　まちがえずに：{pct(student.ok, student.count)}　しいんの まちがい：{student.cmiss}　ぼいんの まちがい：{student.vmiss}　さいご：{student.last || '－'}</div>
                      <div className="mt-2 font-bold">ステージごとの結果</div>
                      <table className="w-full text-left text-sm">
                        <thead className="bg-slate-100"><tr><th className="p-1">ステージ</th><th>できた だんかい</th><th>問題</th><th>まちがえずに</th><th>しいん</th><th>ぼいん</th></tr></thead>
                        <tbody>
                          {allStages.map(st => {
                            const g = student.stages[stageNo(st)] || [0, 0, 0, 0];
                            const done = st.steps.filter(x => stepDone(prog, st, x)).length;
                            if (!g[0] && !done) return null;
                            return <tr key={st.id} className="border-t"><td className="p-1">{stageLabel(st)} {st.title}{prog.cleared[st.id] ? ' 🏆' : ''}</td><td>{done} / {st.steps.length}</td><td>{g[0]}</td><td>{pct(g[1], g[0])}</td><td>{g[2]}</td><td>{g[3]}</td></tr>;
                          })}
                        </tbody>
                      </table>
                      <div className="mt-3 flex flex-wrap gap-2">
                        <button onClick={() => act(() => api.setFlag(pin, student.name, 'unlockAll', !prog.unlockAll), prog.unlockAll ? 'ステージの開放をやめました' : 'すべてのステージを開きました')} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog.unlockAll ? '🔓 全部開く：オン' : '🔒 全部開く：オフ'}</button>
                        <button onClick={() => act(() => api.setFlag(pin, student.name, 'hatten', !prog.hatten), prog.hatten ? 'はってんを閉じました' : 'はってんを開きました')} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog.hatten ? '✨ はってん：開いている' : '✨ はってん：閉じている'}</button>
                      </div>
                      <div className="mt-2 flex flex-wrap gap-2 items-center">
                        <span className="font-bold">コイン：</span>
                        {[-5, -1, 1, 5, 10].map(dv => <button key={dv} onClick={() => act(() => api.addCoins(pin, student.name, dv), `コインを ${dv > 0 ? '+' : ''}${dv} しました`)} className="rounded-lg px-3 py-1 border-2 bg-white font-bold">{dv > 0 ? '+' : ''}{dv}</button>)}
                      </div>
                      <div className="mt-3">
                        <button onClick={() => { if (confirm(`${student.name} さんの記録・進み具合・コイン・集めたものを、すべて消します。元にはもどせません。よろしいですか？`)) act(() => api.clear(pin, student.name), `${student.name} さんの記録を消しました`); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 この子の記録を消す</button>
                      </div>
                    </div>
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold mb-1">まちがえやすい もじ（赤いほど多い）</div>
                      <KanaTable which="seion" heat={student.kanaMiss || {}} small />
                      {Object.keys(student.kanaMiss || {}).some(k => tableOfKana(k) !== 'seion') && <div className="text-sm mt-1">ほか：{topOf(Object.fromEntries(Object.entries(student.kanaMiss).filter(([k]) => tableOfKana(k) !== 'seion')), 10).map(([k, n]) => `${k}（${n}）`).join('、')}</div>}
                      <div className="font-bold mt-3">まちがえやすい ピース</div>
                      <div className="flex flex-col gap-1 mt-1">{topOf(student.pieceMiss, 10).map(([k, n]) => <div key={k} className="rounded-lg px-2 py-1 border bg-rose-50"><b className="text-lg">{pieceText(k)}</b>　{n}回</div>)}{!Object.keys(student.pieceMiss || {}).length && <span className="text-slate-500">まだ ありません</span>}</div>
                      <div className="text-xs text-slate-500 mt-1">「k を h に」は、k の ピースを えらぶ ところで h を えらんだ という意味です。「－ を k に」は、あ・い・う・え・お に あおい ピースを つけようとした ことを表します。</div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-3xl">
                <label className="flex items-center gap-3">よみあげの はやさ：<input type="range" min="0.5" max="1.2" step="0.05" value={s.rate} onChange={e => setS({ ...s, rate: Number(e.target.value) })} /> {s.rate}倍
                  <button className="border rounded px-2" onClick={() => { Speech.rate = s.rate; Speech.say('ガジガジせんせいの ローマじ こうぼうだよ。'); }}>ためす</button></label>
                <div>もじの おおきさ：{opt('font', [[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']])}</div>
                <div>1回の 問題の数：{opt('count', [[3, '3問'], [5, '5問'], [10, '10問']])}</div>
                <div>こうかおん：{opt('sound', [[true, 'ならす'], [false, 'ならさない']])}</div>
                <label>暗証番号を変える（4けた）：<input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} className="border-2 rounded px-2 py-1 w-24 ml-2" inputMode="numeric" placeholder="----" /></label>
                <div><button onClick={saveSettings} className="btn3d rounded-xl px-6 py-2 border-2 border-emerald-500 bg-emerald-100 font-bold text-xl">保存する</button>
                  <span className="text-sm text-slate-500 ml-2">（全員の画面に反映されます。子どもの画面は開き直すと変わります）</span></div>
              </div>
            )}

            {tab === 'data' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-2xl">
                <div>この端末に たまっている、まだ送れていない記録：<b>{pending}</b> 件
                  <button onClick={async () => { await api.flush(); setPending(api.pending()); flash(api.pending() ? 'まだ送れていません。ネットのつながりを確かめてください' : '送りました'); onChanged(); }} className="ml-2 rounded-xl px-3 py-1 border-2 bg-white font-bold">📤 スプレッドシートへ送る</button></div>
                <div><button onClick={csv} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">📄 記録をCSVで書き出す</button>
                  <div className="text-sm text-slate-500">ダウンロードできないときは、スプレッドシートの「きろく」シートを開き、ファイル → ダウンロード → CSV を選んでください。</div></div>
                <div className="flex gap-2 flex-wrap items-center">
                  <button onClick={backup} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">💾 バックアップを保存</button>
                  <label className="rounded-xl px-3 py-2 border-2 bg-white font-bold cursor-pointer">📂 バックアップから元にもどす<input type="file" accept=".json" className="hidden" onChange={restore} /></label>
                </div>
                <div><button onClick={() => { if (confirm('全員の記録・進み具合・コイン・集めたものを、すべて消します。元にはもどせません。よろしいですか？') && confirm('ほんとうに全員の記録を消しますか？')) act(() => api.clear(pin, ''), '全員の記録を消しました'); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 全員の記録を消す</button></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 15. アプリ ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [stageSel, setStageSel] = useState(null);
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [talk, setTalk] = useState({ text: '', mood: 'normal', talking: false });
      const [coinFx, setCoinFx] = useState(0);
      const [soundOn, setSoundOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const [award, setAward] = useState(null);
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const progRef = useRef(progress);
      progRef.current = progress;

      const gajiApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setTalk({ text: fmtText(text), mood: opts.mood || 'normal', talking: true });
          Speech.say(fmtSpeech(opts.speech || text), () => { if (sayId.current === id) setTalk(p => ({ ...p, talking: false })); resolve(); });
        });
        return { say: run, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const gajiCtx = { ...gajiApi, ...talk, equip: progress.equip };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        v.sound = v.sound !== false && v.sound !== 'false';
        v.count = Number(v.count) || 5;
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8; Speech.pitch = Number(v.pitch) || 1.1;
        Sound.on = v.sound; setSoundOn(Sound.on);
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        const recs = records.current; records.current = [];
        api.save({ name, progress: json, records: recs, stamp: nowStr(), time: Date.now() });
        return p;
      };
      const updateProg = (fn) => { progRef.current = fn(progRef.current); setProgress(progRef.current); return progRef.current; };
      const titleStart = useRef([]);   // れんしゅうを はじめた ときの しょうごう

      const login = async (n) => {
        Sound.get(); Speech.say('');
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグ（全部開く・はってん）は スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) p = { ...p, unlockAll: !!a.unlockAll, hatten: !!a.hatten, flagT: a.flagT };
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false);
        setView({ v: 'map' });
      };
      const logout = () => { gajiApi.stop(); setName(null); setView({ v: 'login' }); };

      const startStep = (st, step, left) => {
        setStageSel(null);
        records.current = [];
        titleStart.current = titlesOf(progRef.current);
        const n = left || Number(settings.count) || 5;
        setView({ v: 'practice', st, step, n, intro: left ? 'つづきから はじめよう。' : null, key: uid() });
      };
      const onRecord = (r) => { records.current.push({ ...r, id: uid() }); };
      const onCoin = () => { setCoinFx(x => x + 1); Sound.coin(); updateProg(p => ({ ...p, coins: p.coins + 1, earned: p.earned + 1 })); };
      const onFill = (k) => {
        if (progRef.current.table[k]) return;
        updateProg(p => ({ ...p, table: { ...p.table, [k]: 1 } }));
      };
      const onSave = (part) => persist({ ...progRef.current, part });

      const finish = (st, step, result) => {
        let p = { ...progRef.current, part: null };
        p.steps = { ...p.steps, [st.id]: { ...(p.steps[st.id] || {}), [step]: 1 } };
        let bonus = 0, stageClear = false;
        if (!p.cleared[st.id] && st.steps.every(s => p.steps[st.id][s])) {
          p.cleared = { ...p.cleared, [st.id]: 1 };
          bonus = 5; stageClear = true;
          p.coins += bonus; p.earned += bonus;
        }
        p = persist(p);
        const newTitle = titlesOf(p).filter(t => !titleStart.current.includes(t)).pop() || null;
        if (newTitle) setTimeout(() => { setAward(newTitle); Sound.big(); }, 3500);
        let next = null;
        const si = st.steps.indexOf(step);
        if (si + 1 < st.steps.length && stepOpen(p, st, st.steps[si + 1])) next = () => startStep(st, st.steps[si + 1]);
        else {
          const list = st.hatten ? hattenStages() : mainStages(), i = list.findIndex(s => s.id === st.id);
          if (list[i + 1] && stageOpen(p, list[i + 1])) next = () => { setView({ v: 'map' }); setStageSel(list[i + 1]); };
        }
        setView({ v: 'result', st, step, result: { ...result, bonus, stageClear, newTitle }, next });
      };
      const quit = () => { gajiApi.stop(); persist(progRef.current); setView({ v: 'map' }); };
      const buy = (it) => {
        const p = progRef.current;
        if (p.coins < it.p || p.items.includes(it.id)) return;
        persist({ ...p, coins: p.coins - it.p, items: [...p.items, it.id] });
      };
      const cont = () => {
        const p = progRef.current;
        const part = p.part && STAGES.find(s => s.id === p.part.st);
        if (part && stageOpen(p, part)) { startStep(part, p.part.step, p.part.left); return; }
        const st = currentStage(p);
        startStep(st, nextStep(p, st));
      };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const p = { ...progRef.current, unlockAll: !!sp.unlockAll, hatten: !!sp.hatten, flagT: sp.flagT, coins: sp.coins || 0, t: sp.t || Date.now() };
              const fresh = !me.progress ? { ...newProgress(), welcome: 1 } : p;
              progRef.current = fresh; setProgress(fresh); safeStore.set(COPY_KEY(name), JSON.stringify(fresh));
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-amber-800">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-slate-500 mt-2">{boot.error}</div></div>;

      const bar = (home = true) => (
        <TopBar name={name} coins={progress.coins} bump={coinFx} title={titleOf(progress)} onHome={home ? () => { gajiApi.stop(); if (view.v === 'practice') quit(); else setView({ v: 'map' }); } : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }} />
      );

      let body = null;
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (view.v === 'map') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <MapScreen name={name} progress={progress} onStage={(st) => { Sound.tap(); setStageSel(st); }} onContinue={cont}
            onShop={() => setView({ v: 'shop' })} onRoom={() => setView({ v: 'room' })} onTable={() => setView({ v: 'table' })}
            onWelcome={() => persist({ ...progRef.current, welcome: 1 })} />
          {stageSel && <StageModal key={stageSel.id} st={stageSel} progress={progress} onClose={() => setStageSel(null)}
            onStep={(s) => startStep(stageSel, s)} onResume={() => startStep(stageSel, progress.part.step, progress.part.left)} />}</div>;
      } else if (view.v === 'practice') {
        body = <div className="min-h-screen flex flex-col items-center relative">{bar()}<CoinFly show={coinFx} />
          <div className="w-full flex justify-center p-2"><Practice key={view.key} st={view.st} step={view.step} n={view.n} intro={view.intro} settings={settings}
            onRecord={onRecord} onCoin={onCoin} onFill={onFill} onSave={onSave} onFinish={(r) => finish(view.st, view.step, r)} onQuit={quit} /></div></div>;
      } else if (view.v === 'result') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<ResultScreen view={view}
          onAgain={() => startStep(view.st, view.step)} onNext={view.next} onHome={() => setView({ v: 'map' })} /></div>;
      } else if (view.v === 'shop') {
        body = <div className="min-h-screen flex flex-col">{bar()}<ShopScreen progress={progress} onBuy={buy} /></div>;
      } else if (view.v === 'room') {
        body = <div className="min-h-screen flex flex-col">{bar()}<RoomScreen progress={progress} onChange={(ch) => persist({ ...progRef.current, ...ch })} /></div>;
      } else if (view.v === 'table') {
        body = <div className="min-h-screen flex flex-col items-center wood">{bar()}<TableScreen progress={progress} /></div>;
      }

      return (
        <GajiCtx.Provider value={gajiCtx}>
          {body}
          {award && view.v !== 'practice' && (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={() => setAward(null)}>
              <div className="bg-white rounded-3xl p-8 flex flex-col items-center gap-3 pop">
                <div className="text-7xl">🎖️</div>
                <div className="text-4xl font-bold text-amber-600">「{award}」</div>
                <div className="text-2xl">の しょうごうを もらったよ！</div>
                <Btn onClick={() => setAward(null)} color="#16a34a" light="#dcfce7">やったね！</Btn>
              </div>
            </div>
          )}
          {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
          {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
        </GajiCtx.Provider>
      );
    }

    window.ROMAJI_READY.then(() => {
      R = window.ROMAJI_KANA; D = window.ROMAJI_DATA;
      STAGES = D.STAGES;
      ALL_ITEMS = D.ITEM_CATS.flatMap(c => c.items);
      ALL_ITEMS.forEach(it => { ITEM[it.id] = it; });
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:24px;line-height:1.8">もんだいの データを よみこめませんでした。<br>ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<div style="font-size:14px;color:#888">' + e.message + '</div></div>';
    });
  </script>
</body>
</html>
