        if (lv === 1) talk.say(two ? `${p.d} × □ が ${p.N}より ちいさくて、いちばん ちかい かずを さがそう。` : `${p.d} × □ ＝ ${p.N}。${p.d}の だんの くくで、${p.N}に なるのは どれかな。`, { mood: 'think' });
        if (lv === 2) { setTable(true); talk.say(`${p.d}の だんの ひょうだよ。${p.N}を さがそう。`, { mood: 'think' }); }
        if (lv === 3) { setTable(true); talk.say(two ? `${p.d} × ${p.a} ＝ ${p.d * p.a}。のこりが あまりだよ。` : `${p.d} × ${p.a} ＝ ${p.N}。こたえは ${p.a}だよ。`, { mood: 'think' }); }
      };
      const m = useMiss(doHint);
      useEffect(() => {
        if (story) talk.say(p.story.text + '　まず、しきを えらぼう。');
        else if (k === 'mulBlank') talk.say(`${p.d} × □ ＝ ${p.N}。□に はいる かずは？`);
        else if (k === 'divKuku') talk.say(`${p.N} ÷ ${p.d}。${p.d}の だんの くくで かんがえよう。${p.d} × □ ＝ ${p.N}`);
        else if (k === 'zeroOne') talk.say(p.z === 'zero' ? `0この くだものを ${hikiText(p.d)}に わけると、1ぴき なんこ？ ${p.N} ÷ ${p.d}` : p.z === 'one' ? `${p.N}この くだものを 1ぴきに あげると？ ${p.N} ÷ 1` : `${p.N}この くだものを ${hikiText(p.N)}に わけると？ ${p.N} ÷ ${p.N}`);
        else if (two) talk.say(`${p.N} ÷ ${p.d}。こたえと あまりを いれよう。`);
        else talk.say(`${p.N} ÷ ${p.d} ＝ □`);
      }, []);
      const pickEq = async (o) => {
        if (phase !== 'eq') return;
        if (o.key === 'ok') { Sound.ok(); m.phase(); setTable(false); setPhase('num'); talk.say(`そう、${p.N} ÷ ${p.d}！ こたえは いくつかな。`, { mood: 'happy' }); return; }
        m.add(o.t, o.label); Sound.retry(); setRemoved(r => [...r, o.key]);
        talk.say(eqWrongSay(o, p), { mood: 'think' });
      };
      const digit = (d) => { Sound.tap(); setV(x => { const y = [...x]; y[focus] = (y[focus] + d).replace(/^0(?=\d)/, '').slice(0, 2); return y; }); };
      const backspace = () => { Sound.tap(); setV(x => { const y = [...x]; if (y[focus] === '' && two && focus === 1) { setFocus(0); return y; } y[focus] = y[focus].slice(0, -1); return y; }); };
      const ok = async () => {
        if (phase !== 'num') return;
        if (two && focus === 0 && v[0] !== '' && v[1] === '') { setFocus(1); talk.say('つぎは あまりを いれよう。'); return; }
        if (v[0] === '' || (two && v[1] === '')) { talk.say('すうじの ボタンで こたえを いれてね。'); return; }
        const a = Number(v[0]), r = Number(v[1]);
        if (a === p.a && (!two || r === p.r)) {
          setPhase('ok');
          const eq = two ? `${p.N} ÷ ${p.d} ＝ ${p.a} あまり ${p.r}` : k === 'mulBlank' ? `${p.d} × ${p.a} ＝ ${p.N}` : `${p.N} ÷ ${p.d} ＝ ${p.a}`;
          await ctx.celebrate(story ? `${eq}。こたえは ${p.a}${unit}！` : `${eq}！`);
          ctx.done(resultOf(m)); return;
        }
        Sound.retry(); setShake(x => x + 1);
        const label = two ? `${v[0]}あまり${v[1]}` : v[0];
        if (two && r >= p.d) { m.add(MT.rem, label); talk.say(`あまりが ${p.d}より おおきいよ。もっと くばれるね。`, { mood: 'think' }); }
        else if (k === 'zeroOne') { m.add(MT.count, label); talk.say(p.z === 'zero' ? 'くだものが ないから、だれも もらえないね。' : p.z === 'one' ? '1ぴきが ぜんぶ もらうよ。' : 'みんなに 1こずつ だね。', { mood: 'think' }); }
        else if (a === p.d) { m.add(MT.mixup, label); talk.say(`${p.d}は わる かずだね。${p.d} × □ ＝ ${p.N}の □を さがそう。`, { mood: 'think' }); }
        else { m.add(MT.kuku, label); talk.say(two ? `${p.d} × ${a} ＝ ${p.d * a}。たしかめて みよう。` : `${p.d} × ${a} ＝ ${p.d * a}。${p.N}に なるかな？`, { mood: 'think' }); }
        setV(['', '']); setFocus(0);
      };
      const box = (i) => <button onClick={() => phase === 'num' && setFocus(i)}><AnsBox v={phase === 'ok' ? String(i ? p.r : p.a) : v[i]} active={phase === 'num' && focus === i} /></button>;
      const zeroPic = k === 'zeroOne' && (
        p.z === 'zero' ? <DealPic n={0} d={p.d} e={p.fruit.e} animals={ctx.animals(p.d)} img={ctx.collected} s={30} />
          : p.z === 'one' ? (phase === 'ok' ? <DealPic n={p.N} d={1} e={p.fruit.e} animals={ctx.animals(1)} img={ctx.collected} s={30} /> : <div className="flex flex-col items-center gap-1"><AnimalFace id={ctx.animals(1)[0]} size={64} img={ctx.collected.includes(ctx.animals(1)[0])} /><div className="flex gap-1">{Array.from({ length: p.N }, (_, j) => <Stamp key={j} e={p.fruit.e} s={34} />)}</div></div>)
            : (phase === 'ok' ? <DealPic n={p.N} d={p.N} e={p.fruit.e} animals={ctx.animals(p.N)} img={ctx.collected} s={30} /> : <div className="flex flex-col items-center gap-1"><div className="flex gap-2">{ctx.animals(p.N).map(a => <AnimalFace key={a} id={a} size={56} img={ctx.collected.includes(a)} />)}</div><div className="flex gap-1">{Array.from({ length: p.N }, (_, j) => <Stamp key={j} e={p.fruit.e} s={34} />)}</div></div>)
      );
      return (
        <div className="w-full flex flex-col items-center gap-3">
          {story && <StoryCard p={p} color={m.hint >= 2 && phase === 'eq'} />}
          {story && phase === 'eq' && <><div className="text-2xl font-bold">しきは どれかな？</div><Choices big options={eqOpts} removed={removed} glowKey={m.hint >= 3 ? 'ok' : null} onPick={pickEq} /></>}
          {zeroPic && <div className="bg-white rounded-3xl border-4 border-lime-300 p-3">{zeroPic}</div>}
          {phase !== 'eq' && (
            <div className="flex flex-wrap items-start justify-center gap-4">
              <div className="flex flex-col items-center gap-3">
                <div key={shake} className={`bg-white rounded-3xl border-4 border-lime-300 px-6 py-3 text-6xl font-bold flex items-center flex-wrap justify-center ${shake ? 'shake' : ''}`}>
                  {k === 'mulBlank'
                    ? <><span style={{ color: COL.D }}>{p.d}</span><span className="mx-3">×</span>{box(0)}<span className="mx-3">＝</span><span style={{ color: COL.N }}>{p.N}</span></>
                    : <><span style={{ color: COL.N }}>{p.N}</span><span className="mx-3">÷</span><span style={{ color: COL.D }}>{p.d}</span><span className="mx-3">＝</span>{box(0)}{two && <><span className="text-4xl mx-2">あまり</span>{box(1)}</>}{unit && <span className="text-4xl ml-2"><Rb t={unit} /></span>}</>}
                </div>
                {k === 'divKuku' && <div className="text-3xl font-bold bg-sky-50 rounded-2xl px-4 py-2 border-2 border-sky-300"><span style={{ color: COL.D }}>{p.d}</span> × <AnsBox v={phase === 'ok' ? String(p.a) : v[0]} w="w-16" /> ＝ <span style={{ color: COL.N }}>{p.N}</span></div>}
                {story && m.hint >= 3 && phase === 'num' && <div className="bg-white rounded-3xl border-4 border-lime-300 p-2">{picOf(p, p.type, ctx, 20)}</div>}
                {phase === 'num' && <Keypad onDigit={digit} onBack={backspace} onOk={ok} okGlow={v[0] !== '' && (!two || v[1] !== '')} />}
              </div>
              {table && phase !== 'ok' && k !== 'zeroOne' && <KukuTable d={p.d} hl={m.hint >= 3 ? p.a : null} onClose={() => setTable(false)} />}
            </div>
          )}
          {phase !== 'ok' && (
            <div className="flex gap-3">
              <HintButton m={m} onHint={doHint} />
              {phase === 'num' && k !== 'zeroOne' && !table && m.maxHint >= 2 && <button onClick={() => setTable(true)} className="btn3d rounded-2xl border-2 border-sky-500 bg-sky-50 px-4 py-2 text-xl font-bold">📋 くくの ひょう</button>}
            </div>
          )}
        </div>
      );
    }

    const QUESTION = {
      same: SameQ, fix: FixQ, deal: DealQ, dealAsk: DealQ, predict: DealQ, eqDeal: DealQ, remDeal: DealQ, pack: PackQ,
      which: WhichQ, which2: WhichQ, eqPic: EqPicQ, storyEq: StoryEqQ, storyBuild: StoryBuildQ,
      mulBlank: NumQ, divKuku: NumQ, calc: NumQ, story3: NumQ, remCalc: NumQ, zeroOne: NumQ,
    };

    // =====================================================================
    // 10. れんしゅう（1かい ぶん）
    // =====================================================================
    function Practice({ st, n, intro, collected, onRecord, onCoin, onSave, onFinish, onQuit }) {
      const talk = useTalk();
      const problems = useMemo(() => buildProblems(st, n), []);
      const [i, setI] = useState(-1);
      const [seikai, setSeikai] = useState(0);
      const stats = useRef({ ok: 0, all: 0, coins: 0 });
      const t0 = useRef(Date.now());
      const alive = useRef(true);
      const animalCache = useRef({});
      useEffect(() => () => { alive.current = false; }, []);
      useEffect(() => {
        (async () => {
          await talk.say(intro || st.intro, { mood: 'cheer' });
          if (alive.current) { t0.current = Date.now(); setI(0); }
        })();
      }, []);
      const ctx = {
        collected,
        // この もんだいで でる どうぶつ（おなじ もんだいの なかでは おなじ どうぶつ）
        animals: (k) => { const key = `${i}-${k}`; return animalCache.current[key] || (animalCache.current[key] = pickAnimals(k, collected)); },
        celebrate: async (first) => {
          await talk.say(first, { mood: 'happy' });
          if (!alive.current) return;
          setSeikai(x => x + 1); Sound.fanfare(); onCoin(); stats.current.coins++;
          await talk.say('せいかい！', { mood: 'happy' });
          await wait(400);
          if (alive.current) setSeikai(0);
        },
        done: (res) => {
          if (!alive.current) return;
          const p = problems[i];
          const result = res.miss || res.hint ? '△' : '○';
          stats.current.all++; if (result === '○') stats.current.ok++;
          onRecord({
            stage: stageNo(st), step: st.hatten ? 'はってん' : danLabel(st.dan), problem: problemLabel(p), answer: answerLabel(p), result,
            miss: res.miss || 0, hint: res.hint || 0, types: (res.types || []).join('・'), picks: (res.picks || []).join('・'),
            div: usesDiv(p) ? String(p.d) : '', secs: Math.round((Date.now() - t0.current) / 100) / 10,
          });
          t0.current = Date.now();
          if (i + 1 >= problems.length) { onFinish({ ...stats.current, n: problems.length }); return; }
          onSave({ st: st.id, left: problems.length - i - 1 });
          setI(i + 1);
        },
      };
      const p = problems[i];
      const Q = p && QUESTION[p.kind];
      return (
        <div className="w-full max-w-6xl flex flex-col items-center gap-3">
          <MinoriBar size={96} compact />
          <div className="flex items-center gap-3 w-full">
            <div className="text-xl font-bold bg-white rounded-2xl px-3 py-1 border-2 border-lime-300 shrink-0">{stageLabel(st)} <Rb t={st.title} /></div>
            {problems.length > 10 && <div className="text-xl font-bold shrink-0">{Math.max(0, i) + 1} / {problems.length}</div>}
            <div className="flex gap-1 flex-1">{problems.map((_, j) => <div key={j} className={`h-4 flex-1 rounded-full ${j < i ? 'bg-lime-500' : j === i ? 'bg-lime-200 ring-2 ring-lime-500' : 'bg-white border border-lime-200'}`} />)}</div>
            <button onClick={onQuit} className="btn3d bg-white border-2 border-slate-300 rounded-2xl px-3 py-1 text-lg font-bold shrink-0">✋ やめる</button>
          </div>
          {Q && <Q key={i} p={p} st={st} ctx={ctx} />}
          <Seikai show={seikai} />
        </div>
      );
    }

    // =====================================================================
    // 11. けっか
    // =====================================================================
    function ResultScreen({ view, onAgain, onNext, onHome }) {
      const talk = useTalk();
      const r = view.result;
      const a = r.newAnimal && ANIMAL[r.newAnimal];
      useEffect(() => {
        Sound.big();
        (async () => {
          if (r.stageClear) await talk.say(`やったね！『${view.st.title}』クリア！ ボーナスで くだものを ${r.bonus}こ あげるよ。`, { mood: 'happy' });
          else await talk.say(`${r.n}もん できたね！ くだものを ${r.coins}こ もらったよ。`, { mood: 'happy' });
          if (a) { Sound.big(); await talk.say(`あっ！ ${a.name}が のうえんに やって きたよ。なかまに なったね！`, { mood: 'happy' }); }
        })();
      }, []);
      return (
        <div className="w-full max-w-4xl flex flex-col items-center gap-4 p-4">
          <MinoriBar size={110} />
          <div className="bg-white rounded-3xl border-4 border-lime-400 p-6 flex flex-col items-center gap-3 pop w-full">
            <div className="text-5xl font-bold text-lime-700">{r.stageClear ? '🏆 ステージ クリア！' : '⭐ よく できました！'}</div>
            <div className="text-6xl">{r.n > 10 ? `⭐ × ${r.n}` : Array.from({ length: r.n }, () => '⭐').join('')}</div>
            <div className="text-3xl font-bold">🍎 ＋{r.coins + (r.bonus || 0)}こ</div>
            {a && (
              <div className="flex items-center gap-4 bg-yellow-50 border-4 border-yellow-300 rounded-3xl px-6 py-3 pop">
                <AnimalFace id={a.id} size={130} className="hop" />
                <div><div className="text-2xl font-bold text-amber-700">🎉 あたらしい なかま！</div><div className="text-4xl font-bold">{a.name}</div><div className="text-lg">のうえんに やって きたよ</div></div>
              </div>
            )}
            {r.newTitle && <div className="text-2xl font-bold bg-amber-100 rounded-2xl px-4 py-2">🎖️ あたらしい しょうごう「{r.newTitle}」</div>}
          </div>
          <div className="flex flex-wrap gap-4 justify-center">
            {onNext && <Btn onClick={onNext} color="#16a34a" light="#dcfce7" className="text-3xl px-8">つぎへ ▶</Btn>}
            <Btn onClick={onAgain} color="#0284c7" light="#e0f2fe">🔁 もういちど</Btn>
            <Btn onClick={onHome} color="#4d7c0f" light="#ecfccb">🗺️ ちずへ</Btn>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 12. はじめの がめん・ちず
    // =====================================================================
    function FarmBg({ className = '', children, style }) {
      const [ok, setOk] = useState(!MISSING.has('farm.webp'));
      return (
        <div className={`relative field overflow-hidden ${className}`} style={style}>
          {ok && <img src={IMG + 'farm.webp'} alt="" onError={() => { MISSING.add('farm.webp'); setOk(false); }} className="absolute inset-0 w-full h-full object-cover" draggable={false} />}
          {!ok && <div className="absolute inset-0 pointer-events-none text-6xl"><span className="absolute" style={{ left: '6%', top: '22%' }}>🌳</span><span className="absolute" style={{ left: '80%', top: '18%' }}>🏡</span><span className="absolute" style={{ left: '45%', top: '8%' }}>☀️</span></div>}
          <div className="relative w-full h-full">{children}</div>
        </div>
      );
    }

    function LoginScreen({ students, onSelect, onTeacher, demo }) {
      return (
        <div className="min-h-screen flex flex-col items-center gap-5 p-6 meadow">
          <FarmBg className="rounded-3xl w-full max-w-4xl border-4 border-lime-500 shadow-lg" style={{ aspectRatio: '16 / 7' }}>
            <div className="flex items-end gap-4 px-6 pb-4 h-full">
              <Minori size={190} className="floaty" />
              <div className="bg-white/85 rounded-3xl px-5 py-3 mb-3 shadow">
                <div className="text-2xl font-bold text-lime-900">ミノリせんせいの</div>
                <div className="text-5xl font-bold text-white" style={{ textShadow: '3px 3px 0 #3f6212, -1px -1px 0 #3f6212' }}>わけわけ のうえん</div>
                <div className="text-xl mt-1 text-lime-950 font-bold">くだものを なかよく わけよう！ わりざんの べんきょう</div>
              </div>
            </div>
          </FarmBg>
          {demo && <div className="bg-yellow-100 border-2 border-yellow-400 rounded-xl px-4 py-2 text-lg">おためしモード（スプレッドシートに つながって いません。きろくは この たんまつだけに のこります）</div>}
          <div className="text-3xl font-bold">じぶんの なまえを おしてね</div>
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 w-full max-w-3xl">
            {students.map(n => (
              <button key={n} onClick={() => onSelect(n)} className="btn3d bg-white border-4 border-lime-500 rounded-3xl py-6 text-4xl font-bold">{n}</button>
            ))}
          </div>
          {!students.length && <div className="text-2xl bg-white rounded-xl p-4">「名簿」シートに なまえを いれてください。</div>}
          <button onClick={onTeacher} className="fixed right-3 bottom-3 bg-white/90 border-2 border-slate-300 rounded-xl px-3 py-2 text-lg font-bold">🔒 せんせい</button>
          <div className="fixed left-3 bottom-2 text-xs text-lime-900/60">ver {APP_VERSION}</div>
        </div>
      );

    function TopBar({ name, coins, bump, title, onHome, onLogout, onTeacher, soundOn, onSound }) {
      return (
        <div className="w-full flex items-center gap-2 px-3 py-2 bg-white/95 border-b-4 border-lime-300 sticky top-0 z-30">
          {onHome && <button onClick={onHome} className="btn3d bg-lime-50 border-2 border-lime-600 rounded-2xl px-3 py-1 text-xl font-bold">🗺️ ちず</button>}
          <div className="text-2xl font-bold ml-1">{name} さん</div>
          {title && <div className="text-base font-bold bg-amber-100 border-2 border-amber-300 rounded-full px-3">🎖️ {title}</div>}
          <div className="flex-1" />
          <div key={bump} className={`flex items-center gap-1 bg-rose-50 border-2 border-rose-300 rounded-full px-4 py-1 text-2xl font-bold ${bump ? 'bump' : ''}`}>🍎 {coins}</div>
          <button onClick={onSound} className="text-3xl px-2" aria-label="おと">{soundOn ? '🔊' : '🔇'}</button>
          <button onClick={onTeacher} className="text-lg px-2 border-2 border-slate-300 rounded-xl bg-white">🔒</button>
          <button onClick={onLogout} className="text-lg px-3 py-1 border-2 border-slate-300 rounded-xl bg-white font-bold">おわる</button>
        </div>

    function StageCard({ st, progress, current, onClick }) {
      const open = stageOpen(progress, st), clear = !!progress.cleared[st.id];
      return (
        <button onClick={() => open && onClick(st)} disabled={!open}
          className={`btn3d relative rounded-2xl border-4 flex flex-col items-center justify-center py-1 px-2 min-w-[118px] min-h-[64px] ${clear ? 'bg-yellow-50 border-amber-400' : open ? 'bg-white border-lime-500' : 'bg-stone-200 border-stone-300 opacity-70'} ${current ? 'glow' : ''}`}>
          <div className="text-xs font-bold text-lime-800">{stageLabel(st)}</div>
          <div className="text-lg font-bold leading-tight text-center" style={{ wordBreak: 'keep-all' }}><Rb t={st.title} /></div>
          {!open && <div className="absolute -top-3 -left-2 text-2xl">🔒</div>}
          {clear && <div className="absolute -top-3 -right-2 text-2xl">⭐</div>}
        </button>
      );
    }

    function MapScreen({ name, progress, onStage, onContinue, onShop, onFarm, onZukan, onWelcome }) {
      const talk = useTalk();
      const cur = currentStage(progress);
      useEffect(() => {
        if (!progress.welcome) {
          talk.say(`${name}さん、わけわけ のうえんへ ようこそ！ わたしは ミノリせんせい。とれた くだものを、どうぶつの なかまと なかよく わけようね。`, { mood: 'happy' });

            <Btn onClick={onFarm} color="#4d7c0f" light="#ecfccb">🏡 のうえん</Btn>
            <Btn onClick={onZukan} color="#0284c7" light="#e0f2fe">🐾 なかま ずかん</Btn>

          <div className="w-full max-w-5xl flex flex-col gap-2">

                    <div className="text-lg font-bold leading-tight" style={{ wordBreak: 'keep-all' }}>{DAN_NUM[dn.n]} <Rb t={dn.title} /></div>

            {showH && (

    function StageModal({ st, progress, onStart, onResume, onClose }) {
      const talk = useTalk();
      useEffect(() => { talk.say(st.intro); }, []);
      const part = progress.part && progress.part.st === st.id ? progress.part : null;
      return (
        <div className="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-lime-50 rounded-3xl p-5 border-4 border-lime-400 flex flex-col items-center gap-4 pop max-w-3xl w-full" onClick={e => e.stopPropagation()}>
            <div className="text-lg font-bold text-lime-800">{st.hatten ? '✨ はってん' : danLabel(st.dan)}</div>
            <div className="text-4xl font-bold">{stageLabel(st)} <Rb t={st.title} /></div>
            <div className="flex items-start gap-3"><Minori size={90} /><div className="text-2xl bg-white rounded-2xl px-4 py-3 leading-loose font-bold"><Rb t={st.intro} /></div></div>
            {progress.cleared[st.id] && <div className="text-xl font-bold text-amber-700">⭐ クリアずみ（なんかいでも できるよ）</div>}
            <div className="flex gap-3 flex-wrap justify-center">

              <Btn onClick={onClose} color="#64748b" light="#f1f5f9">とじる</Btn>
            </div>
          </div>
        </div>
      );
    }

    // のうえん（かった ものと なかまが いる）
    const SPOT = {
      ki: (i) => ({ x: 5 + i * 9.7, y: 44 + (i % 2) * 5, s: 7 }),
      tatemono: (i) => ({ x: 8 + i * 9.2, y: 58 + (i % 2) * 4, s: 7.5 }),
      dougu: (i) => ({ x: 4 + i * 9.6, y: 73 + (i % 2) * 3, s: 5.5 }),
      hatake: (i) => ({ x: 3 + i * 9.8, y: 88, s: 5 }),
    };
    function FarmView({ progress, big = false }) {
      const hide = progress.hide || [];
      const items = D.ITEM_CATS.flatMap(c => c.items.map((it, i) => ({ it, pos: SPOT[c.id](i) }))).filter(x => progress.items.includes(x.it.id) && !hide.includes(x.it.id));
      return (
        <FarmBg className="rounded-3xl border-4 border-lime-500 w-full" style={{ aspectRatio: '16 / 9' }}>
          {items.map(({ it, pos }) => (
            <div key={it.id} className="absolute leading-none" style={{ left: `${pos.x}%`, top: `${pos.y}%`, fontSize: `${pos.s * (big ? 0.62 : 0.5)}vw`, transform: 'translate(-10%,-60%)' }} title={it.n}>{it.e}</div>
          ))}
          {progress.animals.map((id, j) => (
            <div key={id} className="absolute hop" style={{ left: `${8 + (j % 6) * 15}%`, top: `${j < 6 ? 62 : 74}%`, animationDelay: `${j * 0.3}s` }}>
              <AnimalFace id={id} size={big ? 84 : 60} />
            </div>
          ))}
        </FarmBg>
      );
    }
    function FarmScreen({ progress, onToggle, onShop }) {
      const talk = useTalk();
      const [edit, setEdit] = useState(false);
      useEffect(() => { talk.say(progress.items.length || progress.animals.length ? 'みんなの のうえんだよ。おみせで かった ものが ならんで いるね。' : 'まだ なにも ないね。くだもので おみせの ものを かうと、のうえんに ならぶよ。'); }, []);
      const mine = ALL_ITEMS.filter(it => progress.items.includes(it.id));
      return (
        <div className="w-full max-w-6xl p-3 flex flex-col items-center gap-3">
          <MinoriBar size={90} compact />
          <FarmView progress={progress} big />
          <div className="flex gap-3">
            <Btn onClick={onShop} color="#db2777" light="#fce7f3">🛒 おみせへ</Btn>
            {mine.length > 0 && <Btn onClick={() => setEdit(!edit)} color="#64748b" light="#f1f5f9">{edit ? '✔ おわる' : '👀 だす・しまう'}</Btn>}
          </div>
          {edit && (
            <div className="flex flex-wrap gap-2 justify-center bg-white rounded-3xl p-3 border-2 border-lime-300">
              {mine.map(it => { const hidden = (progress.hide || []).includes(it.id); return <button key={it.id} onClick={() => onToggle(it.id)} className={`rounded-2xl border-2 px-3 py-1 text-xl font-bold ${hidden ? 'bg-slate-100 border-slate-300 opacity-60' : 'bg-lime-50 border-lime-400'}`}>{it.e} {it.n}{hidden ? '（しまった）' : ''}</button>; })}
            </div>
          )}
        </div>
      );
    }

    // なかま ずかん
    function ZukanScreen({ progress }) {
      const talk = useTalk();
      useEffect(() => { talk.say(`なかま ずかんだよ。いま ${progress.animals.length}ひき。ぜんぶで 12ひき いるよ。`); }, []);
      const danOf = (id) => { const dn = D.DAN.find(d => d.animal === id); if (dn) return `${DAN_NUM[dn.n]}${dn.title}を クリア`; return 'はってんを クリア'; };
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">
          <MinoriBar size={90} compact />
          <div className="text-2xl font-bold bg-white rounded-2xl px-4 py-1 border-2 border-lime-300">🐾 {progress.animals.length} / {D.ANIMALS.length}　🎖️ {titleOf(progress)}</div>
          <div className="grid grid-cols-3 sm:grid-cols-4 gap-3 w-full">
            {D.ANIMALS.map(a => {
              const got = progress.animals.includes(a.id);
              return (
                <button key={a.id} onClick={() => got && talk.say(`${a.name}だよ。`)} className={`rounded-3xl border-4 p-2 flex flex-col items-center ${got ? 'bg-white border-amber-300' : 'bg-stone-100 border-stone-300'}`}>
                  {got ? <AnimalFace id={a.id} size={110} /> : <div className="w-[110px] h-[110px] flex items-center justify-center text-6xl text-stone-400 font-bold">？</div>}
                  <div className="text-xl font-bold">{got ? a.name : '？？？'}</div>
                  {!got && <div className="text-sm text-stone-500">{danOf(a.id)}</div>}
                </button>
              );
            })}
          </div>
          <div className="flex flex-wrap gap-2 justify-center">
            {D.TITLES.map(t => { const on = titlesOf(progress).includes(t.n); return <span key={t.n} className={`rounded-full px-3 py-1 border-2 font-bold ${on ? 'bg-amber-100 border-amber-400' : 'bg-white border-slate-200 text-slate-400'}`}>{on ? '🎖️' : '🔒'} {t.n}{t.all ? '（ぜんぶ クリア）' : `（なかま ${t.a}ひき）`}</span>; })}
          </div>
        </div>
      );
    }

    // おみせ
    const TIER = { 5: ['ふつう', '#e5e7eb', '#64748b'], 15: ['ごうか', '#dbeafe', '#2563eb'], 30: ['ちょうごうか', '#fae8ff', '#a21caf'], 60: ['でんせつ', '#fef3c7', '#d97706'] };
    function ShopScreen({ progress, onBuy }) {
      const talk = useTalk();
      const [cat, setCat] = useState(D.ITEM_CATS[0].id);
      useEffect(() => { talk.say('いらっしゃい！ くだもので、のうえんの ものが かえるよ。'); }, []);
      const c = D.ITEM_CATS.find(x => x.id === cat);
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">
          <MinoriBar size={90} compact />
          <div className="flex gap-2 flex-wrap justify-center">
            {D.ITEM_CATS.map(x => <button key={x.id} onClick={() => setCat(x.id)} className={`btn3d rounded-2xl border-2 px-4 py-2 text-xl font-bold ${cat === x.id ? 'bg-pink-100 border-pink-500' : 'bg-white border-slate-300'}`}>{x.icon} {x.name}</button>)}
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 w-full">
            {c.items.map(it => {
              const have = progress.items.includes(it.id), can = progress.coins >= it.p;
              const [tn, bg, col] = TIER[it.p];
              return (
                <div key={it.id} className="bg-white rounded-3xl border-4 p-2 flex flex-col items-center gap-1" style={{ borderColor: col }}>
                  <div className="text-xs font-bold rounded-full px-2" style={{ background: bg, color: col }}>{tn}</div>
                  <div className="text-6xl leading-none my-1">{it.e}</div>
                  <div className="text-lg font-bold text-center leading-tight">{it.n}</div>
                  {have ? <div className="text-lg font-bold text-lime-700">✔ かった</div>
                    : <button onClick={() => { if (!can) { talk.say(`あと ${it.p - progress.coins}こ あつめよう。`); return; } Sound.buy(); onBuy(it); talk.say(`${it.n}を かったよ。のうえんに ならんだよ。`, { mood: 'happy' }); }}
                      className={`btn3d rounded-2xl border-2 px-3 py-1 text-xl font-bold ${can ? 'bg-rose-50 border-rose-400' : 'bg-slate-100 border-slate-300 opacity-60'}`}>🍎 {it.p}</button>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 13. 先生用画面
    // =====================================================================
    function PinPad({ onSubmit, onClose, error }) {
      const [v, setV] = useState('');
      const press = (d) => { const n = (v + d).slice(0, 4); setV(n); if (n.length === 4) { onSubmit(n); setTimeout(() => setV(''), 300); } };
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
          <div className="bg-white rounded-3xl p-6 w-80 flex flex-col items-center gap-3">
            <div className="text-2xl font-bold">🔒 せんせい用</div>
            <div className="text-base">暗証番号（4けた）を入れてください</div>
            <div className="flex gap-2">{[0, 1, 2, 3].map(i => <div key={i} className="w-10 h-12 border-2 rounded-lg flex items-center justify-center text-2xl">{v[i] ? '●' : ''}</div>)}</div>
            {error > 0 && <div className="text-rose-600 font-bold">番号がちがいます</div>}
            <div className="grid grid-cols-3 gap-2">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((d, i) => d === '' ? <div key={i} /> :
                <button key={i} onClick={() => d === '⌫' ? setV(v.slice(0, -1)) : press(d)} className="btn3d w-16 h-14 rounded-xl bg-slate-100 border-2 border-slate-300 text-2xl font-bold">{d}</button>)}
            </div>
            <button onClick={onClose} className="text-lg underline mt-1">とじる</button>
          </div>
        </div>
      );
    }

    const pct = (a, b) => b ? `${Math.round((a / b) * 100)}%` : '－';
    const topOf = (m, n = 5) => Object.entries(m || {}).sort((a, b) => b[1] - a[1]).slice(0, n);
    const DIVS = ['2', '3', '4', '5', '6', '7', '8', '9'];
    const rateColor = (a, b) => !b ? '#fff' : a / b < 0.6 ? '#fecaca' : a / b < 0.8 ? '#fef08a' : '#bbf7d0';
    const weakDiv = (div) => DIVS.filter(d => div && div[d] && div[d][0] >= 3 && div[d][1] / div[d][0] < 0.6).map(d => `÷${d}`).join(' ');
    const TYPE_NOTE = {
      [MT.count]: 'かずを かぞえまちがえた',
      [MT.mixup]: '「1つぶん」と「いくつ分」・わる数・ぜんぶの数を取りちがえた（くばる／つめるの絵の取りちがいも）',
      [MT.swap]: 'わられる数と わる数の入れちがい（例：2÷6）',
      [MT.op]: '＋・−・× を選んだ',
      [MT.kuku]: '九九の まちがい（わり算の答え）',
      [MT.fair]: '1こずつ じゅんばんに くばれなかった（かたよって くばった）',
      [MT.rem]: 'あまりの まちがい（あまりが わる数より大きい など）',
    };

    function DivTable({ div }) {
      return (
        <table className="text-center text-sm">
          <thead><tr><th className="p-1">わる数</th>{DIVS.map(d => <th key={d} className="px-2">÷{d}</th>)}</tr></thead>
          <tbody>
            <tr><td className="p-1 font-bold">問題</td>{DIVS.map(d => <td key={d}>{div && div[d] ? div[d][0] : 0}</td>)}</tr>
            <tr><td className="p-1 font-bold">まちがえずに</td>{DIVS.map(d => { const g = (div && div[d]) || [0, 0]; return <td key={d} className="rounded" style={{ background: rateColor(g[1], g[0]) }}>{pct(g[1], g[0])}</td>; })}</tr>
          </tbody>
        </table>
      );
    }

    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(api.pending());
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };
      const act = async (fn, okText) => {
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); onChanged(); } }
        catch (e) { flash('うまく いきませんでした：' + e.message); }
      };
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '﻿' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`わり算_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`わり算_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'warizan') { flash('このアプリのバックアップではありません'); return; }
          if (!confirm('バックアップから、子どもの進み具合・くだもの・なかまを元にもどします。よろしいですか？')) return;
          await act(() => api.restore(pin, d), 'バックアップから元にもどしました');
        };
        rd.readAsText(f);
      };
      const opt = (key, list) => list.map(([v, t]) =>
        <button key={String(v)} onClick={() => setS({ ...s, [key]: v })} className={`ml-2 mt-1 rounded-lg px-3 py-1 border-2 ${s[key] === v ? 'bg-lime-200 border-lime-600' : 'bg-white'}`}>{t}</button>);

      return (
        <div className="fixed inset-0 bg-slate-50 z-50 overflow-auto">
          <div className="max-w-6xl mx-auto p-4 text-base">
            <div className="flex items-center gap-3 mb-3">
              <div className="text-2xl font-bold flex-1">🔒 先生用画面 <span className="text-sm text-slate-500">ver {APP_VERSION}{data.demo ? '（おためしモード）' : ''}</span></div>
              <button onClick={onClose} className="btn3d bg-white border-2 border-slate-400 rounded-xl px-4 py-2 font-bold">とじる</button>
            </div>
            {data.isDefaultPin && <div className="bg-rose-100 border-2 border-rose-400 rounded-xl p-2 mb-2">暗証番号が はじめの「1234」のままです。「せってい」で変えてください。</div>}
            {msg && <div className="fixed top-3 left-1/2 -translate-x-1/2 bg-lime-800 text-white rounded-xl px-4 py-2 z-50">{msg}</div>}
            <div className="flex gap-2 mb-3">
              {[['class', 'クラス全体'], ['child', '子どもごと'], ['settings', 'せってい'], ['data', 'データ']].map(([id, t]) => (
                <button key={id} onClick={() => setTab(id)} className={`rounded-xl px-4 py-2 font-bold border-2 ${tab === id ? 'bg-lime-200 border-lime-600' : 'bg-white border-slate-300'}`}>{t}</button>
              ))}
            </div>

            {tab === 'class' && (
              <div className="flex flex-col gap-4">
                <table className="w-full bg-white rounded-xl overflow-hidden text-left">
                  <thead className="bg-lime-100"><tr><th className="p-2">なまえ</th><th>クリア</th><th>なかま</th><th>くだもの</th><th>問題</th><th>まちがえずに</th><th>多い まちがい</th><th>にがてな わる数</th><th>さいご</th></tr></thead>
                  <tbody>
                    {data.students.map(st => {
                      const p = parseProgress(st.progress);
                      const cur = currentStage(p);
                      return (
                        <tr key={st.name} className="border-t cursor-pointer hover:bg-lime-50" onClick={() => { setSel(st.name); setTab('child'); }}>
                          <td className="p-2 font-bold">{st.name}</td>
                          <td>{clearedCount(p)} / {mainStages().length}<div className="text-xs text-slate-500">いま：{cur.id} {cur.title}</div></td>
                          <td>{p.animals.length} / {D.ANIMALS.length}</td>
                          <td>🍎 {p.coins}</td>
                          <td>{st.count}</td>
                          <td>{pct(st.ok, st.count)}</td>
                          <td>{topOf(st.types, 2).map(([k, n]) => `${k}（${n}）`).join('、') || '－'}</td>
                          <td className="font-bold text-rose-700">{weakDiv(st.div) || '－'}</td>
                          <td>{st.last || '－'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div className="text-sm text-slate-500">まちがえずに：まちがえず、ヒントも使わずに できた問題の割合。にがてな わる数：3問以上といて、まちがえずに できた割合が 60%未満の わる数。</div>
                <div className="grid md:grid-cols-2 gap-3">
                  <div className="bg-white rounded-xl p-3">
                    <div className="font-bold mb-2">クラス全体の まちがいの しゅるい</div>
                    {topOf(data.classTypes, 10).map(([k, n]) => <div key={k} className="rounded-lg px-2 py-1 border bg-rose-50 mb-1"><b className="text-lg">{k}</b>　{n}回<div className="text-xs text-slate-600">{TYPE_NOTE[k] || ''}</div></div>)}
                    {!Object.keys(data.classTypes || {}).length && <span className="text-slate-500">まだ ありません</span>}
                  </div>
                  <div className="bg-white rounded-xl p-3">
                    <div className="font-bold mb-2">クラス全体の わる数ごとの結果（⑦⑧⑨・はってん②）</div>
                    <DivTable div={data.classDiv} />
                    <div className="text-xs text-slate-500 mt-1">赤：60%未満　黄：60〜79%　緑：80%以上</div>
                  </div>
                </div>
              </div>
            )}

            {tab === 'child' && (
              <div className="flex flex-col gap-3">
                <div className="flex gap-2 flex-wrap">
                  {data.students.map(st => <button key={st.name} onClick={() => setSel(st.name)} className={`rounded-xl px-4 py-2 font-bold border-2 ${sel === st.name ? 'bg-lime-200 border-lime-600' : 'bg-white border-slate-300'}`}>{st.name}</button>)}
                </div>
                {student && prog && (
                  <div className="grid md:grid-cols-2 gap-3">
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold text-xl mb-1">{student.name}　<span className="text-base">🎖️ {titleOf(prog)}</span></div>
                      <div>クリア：{clearedCount(prog)} / {mainStages().length}　なかま：{prog.animals.length} / {D.ANIMALS.length}　くだもの：🍎 {prog.coins}（これまでに {prog.earned}こ）　かった もの：{prog.items.length}</div>
                      <div>問題：{student.count}　まちがえずに：{pct(student.ok, student.count)}　さいご：{student.last || '－'}</div>
                      <div className="mt-2 font-bold">ステージごとの結果</div>
                      <table className="w-full text-left text-sm">
                        <thead className="bg-slate-100"><tr><th className="p-1">ステージ</th><th>クリア</th><th>問題</th><th>まちがえずに</th></tr></thead>
                        <tbody>
                          {STAGES.map(st => {
                            const g = student.stages[stageNo(st)] || [0, 0];
                            if (!g[0] && !prog.cleared[st.id]) return null;
                            return <tr key={st.id} className="border-t"><td className="p-1">{stageLabel(st)} {st.title}</td><td>{prog.cleared[st.id] ? '⭐' : ''}</td><td>{g[0]}</td><td style={{ background: rateColor(g[1], g[0]) }}>{pct(g[1], g[0])}</td></tr>;
                          })}
                        </tbody>
                      </table>
                      <div className="mt-3 flex flex-wrap gap-2">
                        <button onClick={() => act(() => api.setFlag(pin, student.name, 'unlockAll', !prog.unlockAll), prog.unlockAll ? 'ステージの開放をやめました' : 'すべてのステージを開きました')} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog.unlockAll ? '🔓 全部開く：オン' : '🔒 全部開く：オフ'}</button>
                        <button onClick={() => act(() => api.setFlag(pin, student.name, 'hatten', !prog.hatten), prog.hatten ? 'はってんを閉じました' : 'はってんを開きました')} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog.hatten ? '✨ はってん：開いている' : '✨ はってん：閉じている'}</button>
                      </div>
                      <div className="mt-2 flex flex-wrap gap-2 items-center">
                        <span className="font-bold">くだもの：</span>
                        {[-5, -1, 1, 5, 10].map(dv => <button key={dv} onClick={() => act(() => api.addCoins(pin, student.name, dv), `くだものを ${dv > 0 ? '+' : ''}${dv} しました`)} className="rounded-lg px-3 py-1 border-2 bg-white font-bold">{dv > 0 ? '+' : ''}{dv}</button>)}
                      </div>
                      <div className="mt-3">
                        <button onClick={() => { if (confirm(`${student.name} さんの記録・進み具合・くだもの・なかまを、すべて消します。元にはもどせません。よろしいですか？`)) act(() => api.clear(pin, student.name), `${student.name} さんの記録を消しました`); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 この子の記録を消す</button>
                      </div>
                    </div>
                    <div className="bg-white rounded-xl p-3 flex flex-col gap-3">
                      <div>
                        <div className="font-bold mb-1">まちがいの しゅるい</div>
                        {topOf(student.types, 10).map(([k, n]) => <div key={k} className="rounded-lg px-2 py-1 border bg-rose-50 mb-1"><b>{k}</b>　{n}回<div className="text-xs text-slate-600">{TYPE_NOTE[k] || ''}</div></div>)}
                        {!Object.keys(student.types || {}).length && <span className="text-slate-500">まだ ありません</span>}
                      </div>
                      <div>
                        <div className="font-bold mb-1">わる数ごとの結果</div>
                        <DivTable div={student.div} />
                      </div>
                      <div>
                        <div className="font-bold mb-1">まちがえた問題（多い順）</div>
                        {topOf(student.missProb, 10).map(([k, n]) => <div key={k} className="text-sm border-b py-0.5">{k}　<b>{n}回</b></div>)}
                        {!Object.keys(student.missProb || {}).length && <span className="text-slate-500">まだ ありません</span>}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-3xl">
                <label className="flex items-center gap-3">よみあげの はやさ：<input type="range" min="0.5" max="1.2" step="0.05" value={s.rate} onChange={e => setS({ ...s, rate: Number(e.target.value) })} /> {s.rate}倍
                  <button className="border rounded px-2" onClick={() => { Speech.rate = s.rate; Speech.say('ミノリせんせいの わけわけ のうえんだよ。'); }}>ためす</button></label>
                <div>もじの おおきさ：{opt('font', [[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']])}</div>
                <div>1回の 問題の数（⓪〜⑧・はってん）：{opt('count', [[3, '3問'], [5, '5問'], [10, '10問']])}</div>
                <div>1回の 問題の数（⑨けいさん れんしゅう）：{opt('calcCount', [[5, '5問'], [10, '10問'], [20, '20問']])}</div>
                <div>こうかおん：{opt('sound', [[true, 'ならす'], [false, 'ならさない']])}</div>
                <label>暗証番号を変える（4けた）：<input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} className="border-2 rounded px-2 py-1 w-24 ml-2" inputMode="numeric" placeholder="----" /></label>
                <div><button onClick={saveSettings} className="btn3d rounded-xl px-6 py-2 border-2 border-emerald-500 bg-emerald-100 font-bold text-xl">保存する</button>
                  <span className="text-sm text-slate-500 ml-2">（全員の画面に反映されます。子どもの画面は開き直すと変わります）</span></div>
              </div>
            )}

            {tab === 'data' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-2xl">
                <div>この端末に たまっている、まだ送れていない記録：<b>{pending}</b> 件
                  <button onClick={async () => { await api.flush(); setPending(api.pending()); flash(api.pending() ? 'まだ送れていません。ネットのつながりを確かめてください' : '送りました'); onChanged(); }} className="ml-2 rounded-xl px-3 py-1 border-2 bg-white font-bold">📤 スプレッドシートへ送る</button></div>
                <div><button onClick={csv} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">📄 記録をCSVで書き出す</button>
                  <div className="text-sm text-slate-500">ダウンロードできないときは、スプレッドシートの「きろく」シートを開き、ファイル → ダウンロード → CSV を選んでください。</div></div>
                <div className="flex gap-2 flex-wrap items-center">
                  <button onClick={backup} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">💾 バックアップを保存</button>
                  <label className="rounded-xl px-3 py-2 border-2 bg-white font-bold cursor-pointer">📂 バックアップから元にもどす<input type="file" accept=".json" className="hidden" onChange={restore} /></label>
                </div>
                <div><button onClick={() => { if (confirm('全員の記録・進み具合・くだもの・なかまを、すべて消します。元にはもどせません。よろしいですか？') && confirm('ほんとうに全員の記録を消しますか？')) act(() => api.clear(pin, ''), '全員の記録を消しました'); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 全員の記録を消す</button></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 14. アプリ ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [stageSel, setStageSel] = useState(null);
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [talk, setTalk] = useState({ text: '', mood: 'normal', talking: false });
      const [coinFx, setCoinFx] = useState(0);
      const [soundOn, setSoundOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const progRef = useRef(progress);
      progRef.current = progress;

      const talkApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setTalk({ text, mood: opts.mood || 'normal', talking: true });
          Speech.say(fmtSpeech(opts.speech || text), () => { if (sayId.current === id) setTalk(p => ({ ...p, talking: false })); resolve(); });
        });
        return { say: run, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const talkCtx = { ...talkApi, ...talk };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        v.sound = v.sound !== false && v.sound !== 'false';
        v.count = Number(v.count) || 5; v.calcCount = Number(v.calcCount) || 5;
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8; Speech.pitch = Number(v.pitch) || 1.1;
        Sound.on = v.sound; setSoundOn(Sound.on);
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        const recs = records.current; records.current = [];
        api.save({ name, progress: json, records: recs, stamp: nowStr(), time: Date.now() });
        return p;
      };
      const updateProg = (fn) => { progRef.current = fn(progRef.current); setProgress(progRef.current); return progRef.current; };
      const titleStart = useRef([]);

      const login = async (n) => {
        Sound.get(); Speech.say('');
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグ（全部開く・はってん）は スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) p = { ...p, unlockAll: !!a.unlockAll, hatten: !!a.hatten, flagT: a.flagT };
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false);
        setView({ v: 'map' });
      };
      const logout = () => { talkApi.stop(); setName(null); setView({ v: 'login' }); };

      const startStage = (st, left) => {
        setStageSel(null);
        records.current = [];
        titleStart.current = titlesOf(progRef.current);
        const n = left || (st.calc ? Number(settings.calcCount) || 5 : Number(settings.count) || 5);
        setView({ v: 'practice', st, n, intro: left ? 'つづきから はじめよう。' : null, key: uid() });
      };
      const onRecord = (r) => { records.current.push({ ...r, id: uid() }); };
      const onCoin = () => { setCoinFx(x => x + 1); Sound.coin(); updateProg(p => ({ ...p, coins: p.coins + 1, earned: p.earned + 1 })); };
      const onSave = (part) => persist({ ...progRef.current, part });

      const finish = (st, result) => {
        let p = { ...progRef.current, part: null };
        let bonus = 0, stageClear = false, newAnimal = null;
        if (!p.cleared[st.id]) {
          p.cleared = { ...p.cleared, [st.id]: 1 };
          bonus = 5; stageClear = true;
        }
        const earned = animalsEarned(p).filter(a => !p.animals.includes(a));
        if (earned.length) { p.animals = [...p.animals, ...earned]; newAnimal = earned[0]; bonus += 10; }
        p.coins += bonus; p.earned += bonus;
        p = persist(p);
        const newTitle = titlesOf(p).filter(t => !titleStart.current.includes(t)).pop() || null;
        let next = null;
        const list = st.hatten ? hattenStages() : mainStages(), i = list.findIndex(s => s.id === st.id);
        if (list[i + 1] && stageOpen(p, list[i + 1])) next = () => startStage(list[i + 1]);
        setView({ v: 'result', st, result: { ...result, bonus, stageClear, newAnimal, newTitle }, next });
      };
      const quit = () => { talkApi.stop(); persist(progRef.current); setView({ v: 'map' }); };
      const buy = (it) => {
        const p = progRef.current;
        if (p.coins < it.p || p.items.includes(it.id)) return;
        persist({ ...p, coins: p.coins - it.p, items: [...p.items, it.id] });
      };
      const toggleItem = (id) => {
        const p = progRef.current, hide = p.hide || [];
        persist({ ...p, hide: hide.includes(id) ? hide.filter(x => x !== id) : [...hide, id] });
      };
      const cont = () => {
        const p = progRef.current;
        const part = p.part && STAGES.find(s => s.id === p.part.st);
        if (part && stageOpen(p, part)) { startStage(part, p.part.left); return; }
        startStage(currentStage(p));
      };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const p = { ...progRef.current, unlockAll: !!sp.unlockAll, hatten: !!sp.hatten, flagT: sp.flagT, coins: sp.coins || 0, t: sp.t || Date.now() };
              const fresh = !me.progress ? { ...newProgress(), welcome: 1 } : p;
              progRef.current = fresh; setProgress(fresh); safeStore.set(COPY_KEY(name), JSON.stringify(fresh));
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-lime-800">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-slate-500 mt-2">{boot.error}</div></div>;

      const bar = (home = true) => (
        <TopBar name={name} coins={progress.coins} bump={coinFx} title={titleOf(progress)} onHome={home ? () => { talkApi.stop(); if (view.v === 'practice') quit(); else setView({ v: 'map' }); } : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }} />
      );

      let body = null;
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (view.v === 'map') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <MapScreen name={name} progress={progress} onStage={(st) => { Sound.tap(); setStageSel(st); }} onContinue={cont}
            onShop={() => setView({ v: 'shop' })} onFarm={() => setView({ v: 'farm' })} onZukan={() => setView({ v: 'zukan' })}
            onWelcome={() => persist({ ...progRef.current, welcome: 1 })} />
          {stageSel && <StageModal key={stageSel.id} st={stageSel} progress={progress} onClose={() => setStageSel(null)}
            onStart={() => startStage(stageSel)} onResume={() => startStage(stageSel, progress.part.left)} />}</div>;
      } else if (view.v === 'practice') {
        body = <div className="min-h-screen flex flex-col items-center relative">{bar()}<CoinFly show={coinFx} />
          <div className="w-full flex justify-center p-2"><Practice key={view.key} st={view.st} n={view.n} intro={view.intro} collected={progress.animals}
            onRecord={onRecord} onCoin={onCoin} onSave={onSave} onFinish={(r) => finish(view.st, r)} onQuit={quit} /></div></div>;
      } else if (view.v === 'result') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<ResultScreen view={view}
          onAgain={() => startStage(view.st)} onNext={view.next} onHome={() => setView({ v: 'map' })} /></div>;
      } else if (view.v === 'shop') {
        body = <div className="min-h-screen flex flex-col items-center meadow">{bar()}<ShopScreen progress={progress} onBuy={buy} /></div>;
      } else if (view.v === 'farm') {
        body = <div className="min-h-screen flex flex-col items-center meadow">{bar()}<FarmScreen progress={progress} onToggle={toggleItem} onShop={() => setView({ v: 'shop' })} /></div>;
      } else if (view.v === 'zukan') {
        body = <div className="min-h-screen flex flex-col items-center meadow">{bar()}<ZukanScreen progress={progress} /></div>;
      }

      return (
        <TalkCtx.Provider value={talkCtx}>
          {body}
          {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
          {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
        </TalkCtx.Provider>
      );
    }

    window.WARIZAN_READY.then(() => {
      D = window.WARIZAN_DATA;
      STAGES = D.STAGES;
      D.ANIMALS.forEach(a => { ANIMAL[a.id] = a; });
      ALL_ITEMS = D.ITEM_CATS.flatMap(c => c.items);
      ALL_ITEMS.forEach(it => { ITEM[it.id] = it; });
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:24px;line-height:1.8">もんだいの データを よみこめませんでした。<br>ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<div style="font-size:14px;color:#888">' + e.message + '</div></div>';
    });
  </script>
</body>
</html>
