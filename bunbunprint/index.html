<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ブンブンちょうろうの ぶんづくり プリント</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 landscape; margin: 0; }
    * { box-sizing: border-box; }
    html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { margin: 0; background: #e7e5e4; font-family: 'BIZ UDPGothic', sans-serif; color: #1c1917; }

    /* ---- 先生が えらぶ ところ（印刷しない） ---- */
    .controls { max-width: 297mm; margin: 0 auto; padding: 16px; }
    .panel { background: #fff; border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 2px 0 #d6d3d1; }
    .panel h1 { font-size: 26px; margin: 0; display: flex; align-items: center; gap: 10px; }
    .panel h1 img { width: 56px; height: 56px; object-fit: contain; }
    .panel h2 { font-size: 18px; margin: 0 0 10px; }
    .panel p { margin: 6px 0; line-height: 1.6; }
    .btn { font: inherit; font-size: 17px; font-weight: 700; border: 2px solid #b45309; background: #fff; color: #92400e; border-radius: 14px; padding: 10px 14px; cursor: pointer; box-shadow: 0 4px 0 #b45309; position: relative; }
    .btn:active { top: 4px; box-shadow: 0 0 0 #b45309; }
    .btn.big { font-size: 22px; padding: 14px 26px; background: #16a34a; border-color: #166534; color: #fff; box-shadow: 0 5px 0 #166534; }
    .btn.small { font-size: 14px; padding: 6px 10px; box-shadow: 0 3px 0 #b45309; }
    .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
    .pick label, .opt label { display: flex; align-items: center; gap: 8px; border: 2px solid #d6d3d1; border-radius: 12px; padding: 8px 10px; font-size: 15px; cursor: pointer; line-height: 1.4; }
    .pick label.on, .opt label.on { border-color: #b45309; background: #fef3c7; }
    .pick input, .opt input { width: 20px; height: 20px; flex: none; }
    .opt { display: flex; flex-wrap: wrap; gap: 8px; }
    .row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
    .row2 input[type=text] { font: inherit; font-size: 20px; padding: 8px 10px; border: 2px solid #a8a29e; border-radius: 10px; }
    .note { font-size: 14px; color: #57534e; }
    .count { font-size: 16px; font-weight: 700; color: #92400e; }
    .preview { overflow-x: auto; padding-bottom: 20px; }
    a.btn { display: inline-block; text-decoration: none; }

    /* ---- プリント（A4 よこ） ---- */
    .page { position: relative; width: 297mm; height: 210mm; background: #fff; margin: 0 auto 10mm; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
    .abs { position: absolute; }
    .tate { writing-mode: vertical-rl; }
    /* あたま */
    .hd { position: absolute; left: 8mm; right: 8mm; top: 6mm; height: 27mm; }
    .title { position: absolute; left: 0; top: 0; width: 98mm; height: 25mm; border: .6mm solid #7c3aed; border-radius: 3mm; padding: 2mm 3mm; }
    .title .t1 { font-size: 3.6mm; font-weight: 700; color: #7c3aed; }
    .title .t2 { white-space: nowrap; font-size: 5.6mm; font-weight: 700; color: #4c1d95; margin-top: .6mm; letter-spacing: .2mm; }
    .title .t3 { font-size: 3.8mm; font-weight: 700; margin-top: 1.6mm; color: #1c1917; white-space: nowrap; overflow: hidden; }
    .chorou { position: absolute; left: 101mm; top: 0; width: 25mm; height: 25mm; object-fit: contain; }
    .bubble { position: absolute; left: 127mm; top: 4mm; width: 48mm; white-space: nowrap; border: .5mm solid #7c3aed; border-radius: 3mm; padding: 1.6mm 2.4mm; font-size: 3.4mm; font-weight: 700; line-height: 1.55; background: #faf5ff; }
    .bubble:before { content: ''; position: absolute; left: -2.6mm; top: 5mm; border: 1.3mm solid transparent; border-right: 1.3mm solid #7c3aed; }
    .who { position: absolute; left: 177mm; right: 0; top: 0; height: 25mm; font-size: 4.4mm; font-weight: 700; }
    .who .date { position: absolute; left: 0; top: .5mm; display: flex; gap: 11mm; padding-left: 9mm; }
    .who .name { position: absolute; left: 0; right: 0; top: 7.5mm; display: flex; align-items: flex-end; gap: 1mm; border-bottom: .4mm solid #57534e; padding: 0 0 1mm 0; height: 9mm; }
    .who .name .nen { display: inline-block; min-width: 9mm; text-align: center; font-size: 5.6mm; }
    .who .name .nm { font-size: 6.4mm; padding-left: 3mm; }
    .who .dekita { position: absolute; left: 0; top: 18.5mm; display: flex; align-items: center; gap: 2mm; font-size: 3.6mm; }
    .who .dekita span.f { display: inline-block; width: 7mm; height: 7mm; border: .35mm solid #a8a29e; border-radius: 50%; text-align: center; line-height: 6.4mm; font-size: 4.4mm; }
    .keyb { position: absolute; right: 0; top: -3mm; background: #dc2626; color: #fff; font-size: 4.4mm; font-weight: 700; border-radius: 2mm; padding: .4mm 3mm; }
    /* もんだい */
    .prob { position: absolute; top: 36mm; width: 137mm; height: 167mm; border: .5mm solid #a8a29e; border-radius: 4mm; }
    .num { position: absolute; right: 2.5mm; top: 2.5mm; width: 9mm; height: 9mm; border-radius: 50%; background: #7c3aed; color: #fff; font-size: 5.4mm; font-weight: 700; text-align: center; line-height: 9mm; }
    .pic { position: absolute; top: 2.5mm; width: 46mm; height: 41mm; border: .4mm solid #d6d3d1; border-radius: 2.5mm; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #fff; }
    .pic img { width: 100%; height: 100%; object-fit: contain; }
    .pic .emo { font-size: 15mm; line-height: 1.1; text-align: center; }
    .info { position: absolute; left: 3mm; top: 3mm; font-size: 4.2mm; font-weight: 700; line-height: 1.5; }
    .info .big { font-size: 7mm; color: #7c3aed; }
    .sensei { position: absolute; left: 3mm; top: 25mm; width: 34mm; height: 17mm; border: .4mm dashed #a8a29e; border-radius: 2.5mm; font-size: 3mm; color: #78716c; padding: 1mm 2mm; }
    .sensei .maru { position: absolute; right: 2mm; top: 1.5mm; width: 14mm; height: 14mm; border: .35mm solid #d6d3d1; border-radius: 50%; }
    .tag { position: absolute; font-size: 3.2mm; font-weight: 700; color: #fff; background: #78716c; border-radius: 1.5mm; padding: .3mm 2mm; }
    .bank { position: absolute; left: 2.5mm; right: 2.5mm; border: .45mm dashed #c4b5fd; border-radius: 3mm; background: #fdfcff; }
    .cardw { position: absolute; display: flex; flex-direction: column; align-items: center; }
    .chk { width: 5mm; height: 5mm; border: .4mm solid #57534e; border-radius: .8mm; margin-bottom: 1.2mm; position: relative; background: #fff; }
    .chk .mk { position: absolute; left: -.6mm; top: -2.4mm; font-size: 6mm; line-height: 1; color: #dc2626; font-weight: 700; }
    .card { writing-mode: vertical-rl; font-weight: 700; border: .45mm solid #57534e; border-radius: 1.6mm; background: #fff; display: flex; align-items: center; justify-content: flex-start; padding-top: 1.4mm; line-height: 1; letter-spacing: .3mm; white-space: nowrap; }
    .ans { position: absolute; left: 2.5mm; right: 2.5mm; }
    .box { position: absolute; border: .45mm solid #57534e; border-radius: 1.4mm; background: #fff; }
    .box .cell { position: absolute; left: 0; right: 0; border-top: .25mm dashed #d6d3d1; }
    .box .w { position: absolute; left: 0; right: 0; top: 0; bottom: 0; writing-mode: vertical-rl; display: flex; align-items: center; justify-content: flex-start; font-weight: 700; line-height: 1; white-space: nowrap; }
    .box .w.key { color: #dc2626; }
    .box .w.rei { color: #78716c; font-family: 'BIZ UDPGothic', sans-serif; }
    .hoka { position: absolute; left: 3mm; bottom: 2mm; right: 3mm; font-size: 3.1mm; color: #dc2626; font-weight: 700; line-height: 1.45; }
    .legend { position: absolute; left: 8mm; bottom: 2.2mm; font-size: 2.9mm; color: #57534e; display: flex; gap: 2.5mm; }
    .legend span { border: .3mm solid; border-radius: 1mm; padding: 0 1.2mm; }
    .foot { position: absolute; right: 8mm; bottom: 2mm; font-size: 2.8mm; color: #a8a29e; }
    /* やりかた */
    .steps { position: absolute; left: 8mm; top: 36mm; width: 132mm; height: 167mm; border: .5mm solid #a8a29e; border-radius: 4mm; padding: 4mm 5mm; }
    .steps h3 { margin: 0 0 3mm; font-size: 6mm; color: #4c1d95; }
    .steps ol { margin: 0; padding-left: 0; list-style: none; }
    .steps li { display: flex; gap: 3mm; align-items: flex-start; font-size: 5mm; font-weight: 700; line-height: 1.55; margin-bottom: 3.2mm; }
    .steps li .n { flex: none; width: 8mm; height: 8mm; border-radius: 50%; background: #7c3aed; color: #fff; text-align: center; line-height: 8mm; font-size: 4.6mm; }
    .steps li small { display: block; font-size: 3.6mm; color: #57534e; font-weight: 400; line-height: 1.5; }
    .steps .cimg { position: absolute; right: 4mm; bottom: 3mm; width: 34mm; height: 34mm; object-fit: contain; }
    .steps .say { position: absolute; left: 5mm; bottom: 6mm; right: 40mm; border: .5mm solid #7c3aed; border-radius: 3mm; padding: 2mm 3mm; font-size: 4.2mm; font-weight: 700; line-height: 1.6; background: #faf5ff; }

    @media print {
      body { background: #fff; }
      .controls { display: none; }
      .preview { padding: 0; overflow: visible; }
      .page { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
    }
  </style>
</head>
<body>
  <div class="controls" id="controls">
    <div class="panel">
      <h1><img src="../bunbun/img/chorou_face.webp" alt="" onerror="this.remove()">ブンブンちょうろうの ぶんづくり プリント</h1>
      <p>アプリ「ブンブンちょうろうの ことばの ぼうけん」と おなじ文で、ことばを えらんで 文を つくる プリントです。A4よこ・たて書き。1まいに2問です。</p>
      <p class="note">印刷するときは、用紙を「A4」「よこ」、余白を「なし」、「背景のグラフィック」に チェックを入れてください。</p>
    </div>
    <div class="panel">
      <h2>① どの プリントを つくりますか</h2>
      <div class="opt" id="vers"></div>
      <div class="row2"><label class="check" style="display:flex;align-items:center;gap:8px;font-size:17px"><input type="checkbox" id="rei" checked style="width:22px;height:22px"> 「やりかた」の ページを はじめに 入れる</label></div>
    </div>
    <div class="panel">
      <h2>② エリア（1エリア＝2まい・4問）</h2>
      <div class="btns" style="margin-bottom:8px"><button class="btn small" id="allOn">ぜんぶ えらぶ</button> <button class="btn small" id="allOff">ぜんぶ はずす</button></div>
      <div class="pick" id="areas"></div>
    </div>
    <div class="panel">
      <h2>③ なまえ（入れなくても よい）</h2>
      <div class="row2"><input type="text" id="nen" placeholder="2" style="width:70px"> ねん　なまえ <input type="text" id="nm" placeholder="ひらがなで" style="width:240px"></div>
      <div class="row2"><button class="btn big" id="print">🖨 いんさつ する</button><span class="count" id="count"></span></div>
      <p class="note">PDF は <a href="https://github.com/zku0395-ops/hori/tree/main/bunbunprint/pdf" target="_blank" rel="noopener">pdf フォルダ（GitHub）</a> にも あります（なまえは 空いています）。</p>
    </div>
  </div>
  <div class="preview" id="out"></div>

  <script src="../bunbun/data/bunbun.js"></script>
  <script src="../bunbun/data/kumitate.js"></script>
  <script src="data/mondai.js"></script>
  <script>
  (function () {
    const D = window.BUNBUN_DATA, K = window.BUNBUN_KUMI, M = window.BUNBUNPRINT_DATA;
    const BUN = {}; D.BUN.forEach(b => { BUN[b.id] = b; });
    const AREA = {}; D.AREAS.forEach(a => { AREA[a.id] = a; });
    // カードの いろ（アプリと おなじ）
    const TAG = {
      n: { bg: '#dbeafe', bd: '#2563eb', name: 'だれ・なに' }, j: { bg: '#dcfce7', bd: '#16a34a', name: 'ちいさい ことば' },
      l: { bg: '#dcfce7', bd: '#16a34a', name: 'ちいさい ことば' }, v: { bg: '#fee2e2', bd: '#dc2626', name: 'どうする・なんだ' },
      a: { bg: '#ffedd5', bd: '#ea580c', name: 'ようす' }, d: { bg: '#f3e8ff', bd: '#9333ea', name: 'どのくらい・どんなふうに' },
      t: { bg: '#ccfbf1', bd: '#0d9488', name: 'いつ' }, c: { bg: '#fce7f3', bd: '#db2777', name: 'つなぐ ことば' },
    };
    const small = (g) => g === 'j' || g === 'l';
    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const len = (t) => [...String(t).replace(/ /g, '')].length;
    const flat = (t) => String(t).replace(/ /g, '');
    // いつも おなじ じゅんばんに なる「まぜかた」（ぶんの id で きまる）
    function rnd(seed) { let h = 2166136261; for (const ch of seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }

    // ---- もんだいを つくる ----
    const SET_IDS = M.SETS.flatMap(([, ids]) => ids);
    function makeQ(id, aid) {
      const b = BUN[id], P = K.prepare(b), cards = P.cards, words = cards.map(c => c.t);
      const extra = [];
      // まちがいやすい じょし（ぶんの はじめの じょしに にて いて、ぶんに ない もの）
      const j0 = cards.find(c => c.g === 'j');
      if (j0) { const cand = (M.JOSHI_MAYOI[j0.t] || []).find(x => !words.includes(x)); if (cand) extra.push({ t: cand, g: 'j' }); }
      // まちがいやすい ことば（おなじ しゅるいの ことばを、ほかの ぶんから 1つ）。カードが 8まい いじょうの ぶんは じょし だけ
      if (cards.length + extra.length < 5 || cards.length <= 7) {
        const want = ['a', 'd', 't'].find(g => cards.some(c => c.g === g)) || 'n';
        const order = [...(M.SETS.find(s => s[0] === aid) || [0, []])[1], ...SET_IDS].filter(x => x !== id);
        let pick = null;
        for (const oid of order) {
          const oc = K.prepare(BUN[oid]).cards.find(c => c.g === want && !words.includes(c.t) && !extra.some(e => e.t === c.t));
          if (oc) { pick = { t: oc.t, g: oc.g }; break; }
        }
        if (pick) extra.push(pick);
      }
      while (cards.length + extra.length < 5) extra.push({ t: ['を', 'に', 'で', 'へ'].find(x => !words.includes(x) && !extra.some(e => e.t === x)), g: 'j' });
      // えらぶ ことば：まぜて ならべる（みほんの じゅんばんに ならない ように）
      const r = rnd(id);
      let bank;
      for (let k = 0; k < 20; k++) {
        bank = [...cards.map((c, i) => ({ ...c, use: true, i })), ...extra.map(e => ({ ...e, use: false }))];
        for (let i = bank.length - 1; i > 0; i--) { const jx = Math.floor(r() * (i + 1)); [bank[i], bank[jx]] = [bank[jx], bank[i]]; }
        const used = bank.filter(x => x.use).map(x => x.t);
        if (!K.isOk(used, P.okFree)) break;
      }
      const alts = P.okNormal.filter(o => o.join('|') !== words.join('|'));
      return { id, b, P, cards, bank, alts, aid };
    }

    // ---- もんだいの わく（1もん） ----
    // v：'color' | 'mono'、mode：'' | 'key'（こたえ）| 'rei'（やりかたの れい）
    function probHtml(q, no, x, v, mode) {
      const W = 137, H = 167, color = v === 'color';
      const tg = (g) => (color ? TAG[g] || TAG.n : { bg: '#fff', bd: '#57534e' });
      let h = `<div class="prob" style="left:${x}mm">`;
      h += `<div class="num"${isNaN(no) ? ' style="font-size:3.8mm"' : ''}>${no}</div>`;
      const file = `img/q_${q.id}.webp`;
      h += `<div class="pic" style="right:14mm"><img src="${file}" alt="" data-emo="${esc(q.b.e)}"></div>`;
      h += `<div class="info">つかう ことばは<br><span class="big">${q.cards.length}</span> こ</div>`;
      h += `<div class="sensei">せんせい<div class="maru"></div></div>`;
      // えらぶ ことば
      const n = q.bank.length, innerW = W - 5 - 6;
      let f = 5.2;
      const cw = () => f + 4.2, gap = 2.2;
      while (n * cw() + (n - 1) * gap > innerW && f > 3.4) f -= .1;
      const maxCardH = 36;
      const cardH = (t) => Math.min(maxCardH, len(t) * f * 1.06 + 3.2);
      const bankH = Math.max(...q.bank.map(c => cardH(c.t))) + 6.2 + 7;
      const bankTop = 47;
      h += `<div class="bank" style="top:${bankTop}mm;height:${bankH}mm">`;
      h += `<div class="tag" style="right:2mm;top:-2.6mm;background:#7c3aed">えらぶ ことば（つかったら □に ✓）</div>`;
      const totalW = n * cw() + (n - 1) * gap;
      let cx = innerW - (innerW - totalW) / 2; // みぎから
      q.bank.forEach(c => {
        const ff = Math.min(f, (maxCardH - 3.2) / (len(c.t) * 1.06));
        const t = tg(c.g);
        cx -= cw();
        const mk = mode && c.use ? '<span class="mk">✓</span>' : '';
        h += `<div class="cardw" style="left:${cx + 3}mm;top:5mm;width:${cw()}mm"><div class="chk">${mk}</div>`;
        h += `<div class="card" style="width:${cw() - (small(c.g) ? 1.2 : 0)}mm;height:${cardH(c.t)}mm;font-size:${small(c.g) ? ff * .92 : ff}mm;background:${t.bg};border-color:${t.bd}">${esc(flat(c.t))}</div></div>`;
        cx -= gap;
      });
      h += `</div>`;
      // ぶんを かく わく（ことばの かずだけ。うえから したへ、みぎから ひだりへ）
      const ansTop = bankTop + bankH + 6, ansH = H - ansTop - (mode === 'key' && q.alts.length ? 12 : 4);
      const words = q.cards;
      const maxL = Math.max(...words.map(c => len(c.t)));
      const colGap = 4, boxGap = 2.4;
      let cell = Math.min(11, (ansH - 3) / (maxL + .3));
      const layout = () => {
        const out = []; let col = 0, y = 0;
        words.forEach(c => {
          const L = len(c.t) * cell * (small(c.g) ? .82 : 1) + 1;
          if (y > 0 && y + L > ansH) { col++; y = 0; }
          out.push({ c, col, y, L }); y += L + boxGap;
        });
        return { out, cols: col + 1 };
      };
      let lay = layout();
      while (lay.cols * (cell + 2 + colGap) > W - 10 && cell > 6) { cell -= .2; lay = layout(); }
      h += `<div class="ans" style="top:${ansTop}mm;height:${ansH}mm">`;
      h += `<div class="tag" style="right:2mm;top:-4.4mm;background:#b45309">ぶんを かこう</div>`;
      const bw = cell + 2;
      const usedW = lay.cols * bw + (lay.cols - 1) * colGap;
      const right0 = (W - 5 - usedW) / 2;
      lay.out.forEach(({ c, col, y, L }) => {
        const t = tg(c.g);
        const sm = small(c.g), w = sm ? bw * .86 : bw;
        const xr = right0 + col * (bw + colGap) + (bw - w) / 2;
        h += `<div class="box" style="right:${xr}mm;top:${y + 2}mm;width:${w}mm;height:${L}mm;border-color:${t.bd};background:${color ? t.bg + '80' : '#fff'}">`;
        const cs = (L - 1) / len(c.t);
        for (let k = 1; k < len(c.t); k++) h += `<div class="cell" style="top:${.5 + k * cs}mm"></div>`;
        if (mode) h += `<div class="w ${mode}" style="font-size:${Math.min(cs * .78, w * .7)}mm;padding-top:${cs * .12}mm;letter-spacing:${cs * .22}mm">${esc(flat(c.t))}</div>`;
        h += `</div>`;
      });
      h += `</div>`;
      if (mode === 'key' && q.alts.length) {
        const say = (a) => a.join(' ');
        const txt = q.alts.length <= 2 ? `ほかの こたえ：${q.alts.map(say).join('　／　')}` : `ほかの こたえ：「いつ」「どこで」「だれと」などの ことばを ほかの ばしょに うつしても せいかい（れい：${say(q.alts[0])}）`;
        h += `<div class="hoka">${esc(txt)}</div>`;
      }
      h += `</div>`;
      return h;
    }

    function headHtml(o) {
      const nen = o.nen ? esc(o.nen) : '', nm = o.name ? esc(o.name) : '';
      return `<div class="hd">
        <div class="title"><div class="t1">ことばを えらんで ぶんを つくろう</div><div class="t2">ブンブンちょうろうの ぶんづくり</div><div class="t3">${o.sub}</div></div>
        <img class="chorou" src="../bunbun/img/chorou_happy.webp" alt="" onerror="this.remove()">
        <div class="bubble">${o.bubble}</div>
        <div class="who">
          <div class="date"><span>　　がつ</span><span>　　にち</span></div>
          <div class="name"><span class="nen">${nen}</span>ねん　なまえ<span class="nm">${nm}</span></div>
          <div class="dekita">できたかな？ <span class="f">😊</span><span class="f">🙂</span><span class="f">😐</span> <span style="color:#78716c">（○を つけよう）</span></div>
        </div>
        ${o.key ? '<div class="keyb">こたえ</div>' : ''}
      </div>`;
    }

    function legendHtml(qs) {
      const gs = [...new Set(qs.flatMap(q => q.bank.map(c => (c.g === 'l' ? 'j' : c.g))))];
      const order = ['t', 'n', 'j', 'a', 'd', 'v', 'c'];
      return `<div class="legend">いろ：${order.filter(g => gs.includes(g)).map(g => `<span style="background:${TAG[g].bg};border-color:${TAG[g].bd}">${TAG[g].name}</span>`).join('')}</div>`;
    }

    function sheetHtml(aid, part, qs, v, o, key) {
      const a = AREA[aid];
      let h = `<div class="page">`;
      h += headHtml({ ...o, key, sub: `${a.icon} ${aid} ${a.name}　${a.topic}（${part}まいめ）`, bubble: key ? 'こたえだよ。<br>あかい じが こたえ。' : 'えを みて ことばを えらぼう。<br>わくに かいて<br>ぶんを つくろう！' });
      // たてがき なので、みぎが ①
      h += probHtml(qs[0], (part - 1) * 2 + 1, 152, v, key ? 'key' : '');
      h += probHtml(qs[1], (part - 1) * 2 + 2, 8, v, key ? 'key' : '');
      if (v === 'color') h += legendHtml(qs);
      h += `<div class="foot">ブンブンちょうろうの ぶんづくり プリント　${v === 'color' ? 'カラー' : 'しろくろ'}${key ? '・こたえ' : ''}</div>`;
      return h + `</div>`;
    }

    function reiHtml(v, o) {
      const q = makeQ(M.REI, 1);
      let h = `<div class="page">`;
      h += headHtml({ ...o, sub: 'やりかた', bubble: 'はじめに<br>やりかたを みて みよう。' });
      h += probHtml(q, 'れい', 152, v, 'rei');
      h += `<div class="steps"><h3>📝 やりかた</h3><ol>
        <li><span class="n">1</span><div>えを みよう。<small>だれが、なにを して いるかな？</small></div></li>
        <li><span class="n">2</span><div>つかう ことばを えらんで、□に ✓ を つけよう。<small>つかわない ことばも あるよ。「つかう ことばは ○こ」を みよう。</small></div></li>
        <li><span class="n">3</span><div>✓を つけた ことばを、わくに かこう。<small>みぎの わくから、うえから じゅんに かくよ。わくの ながさが ヒント！</small></div></li>
        <li><span class="n">4</span><div>こえに だして よもう。<small>「いぬが はしる。」いみが わかるかな？</small></div></li>
        <li><span class="n">5</span><div>「できたかな？」に ○を つけよう。</div></li>
      </ol>
      <div class="say">「は」「が」「を」などの ちいさい ことばは、ちいさい わくに かくよ。</div>
      <img class="cimg" src="../bunbun/img/chorou.webp" alt="" onerror="this.remove()"></div>`;
      return h + `</div>`;
    }

    // ---- ぜんたい ----
    const VERS = [['color', '🎨 カラー（いろわけ あり・れんしゅう）'], ['mono', '⬛ しろくろ（いろわけ なし・テスト）'], ['key', '🔴 こたえ']];
    const qp = new URLSearchParams(location.search);
    const st = {
      v: qp.get('v') || 'color',
      rei: qp.has('rei') ? qp.get('rei') === '1' : true,
      areas: qp.get('areas') ? qp.get('areas').split(',').map(Number) : M.SETS.map(s => s[0]),
      nen: '', name: '',
    };
    const QS = {}; M.SETS.forEach(([aid, ids]) => { QS[aid] = ids.map(id => makeQ(id, aid)); });
    window.BUNBUNPRINT_Q = QS;

    function render() {
      const o = { nen: st.nen, name: st.name };
      const key = st.v === 'key';
      const v = key ? 'color' : st.v;
      let h = '', pages = 0;
      if (st.rei && !key) { h += reiHtml(v, o); pages++; }
      M.SETS.filter(([aid]) => st.areas.includes(aid)).forEach(([aid]) => {
        const qs = QS[aid];
        h += sheetHtml(aid, 1, qs.slice(0, 2), v, o, key);
        h += sheetHtml(aid, 2, qs.slice(2, 4), v, o, key);
        pages += 2;
      });
      document.getElementById('out').innerHTML = h;
      document.getElementById('count').textContent = `${pages}まい`;
      // 絵が まだ ない ときは、アプリと おなじ 絵文字を 出す
      document.querySelectorAll('#out img[data-emo]').forEach(im => {
        const fb = () => { const d = document.createElement('div'); d.className = 'emo'; d.textContent = im.dataset.emo; im.replaceWith(d); };
        if (im.complete && !im.naturalWidth) fb(); else im.addEventListener('error', fb);
      });
      const imgs = [...document.querySelectorAll('#out img')];
      Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))).then(() => (document.fonts ? document.fonts.ready : 0)).then(() => { document.body.dataset.ready = '1'; });
    }

    function controls() {
      const vers = document.getElementById('vers');
      vers.innerHTML = VERS.map(([id, t]) => `<label class="${st.v === id ? 'on' : ''}"><input type="radio" name="v" value="${id}" ${st.v === id ? 'checked' : ''}>${t}</label>`).join('');
      vers.onchange = (e) => { st.v = e.target.value; controls(); render(); };
      const ar = document.getElementById('areas');
      ar.innerHTML = M.SETS.map(([aid]) => { const a = AREA[aid], on = st.areas.includes(aid); return `<label class="${on ? 'on' : ''}"><input type="checkbox" value="${aid}" ${on ? 'checked' : ''}>${a.icon} ${aid} ${a.name}${a.hatten ? '（はってん）' : ''}</label>`; }).join('');
      ar.onchange = (e) => { const id = Number(e.target.value); st.areas = e.target.checked ? [...st.areas, id].sort((x, y) => x - y) : st.areas.filter(x => x !== id); controls(); render(); };
    }
    document.getElementById('rei').checked = st.rei;
    document.getElementById('rei').onchange = (e) => { st.rei = e.target.checked; render(); };
    document.getElementById('allOn').onclick = () => { st.areas = M.SETS.map(s => s[0]); controls(); render(); };
    document.getElementById('allOff').onclick = () => { st.areas = []; controls(); render(); };
    document.getElementById('nen').oninput = (e) => { st.nen = e.target.value.slice(0, 3); render(); };
    document.getElementById('nm').oninput = (e) => { st.name = e.target.value.slice(0, 20); render(); };
    document.getElementById('print').onclick = () => window.print();
    if (qp.get('print') === '1') document.getElementById('controls').style.display = 'none';
    controls();
    render();
  })();
  </script>
</body>
</html>
