<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピカリせんせいの ものがたりの もり（ぶんしょうの プリント）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* B4 よこ（364mm × 257mm） */
    @page { size: 364mm 257mm; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'BIZ UDPGothic', sans-serif; color: #1c1917; background: #e7e5e4;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .bar { position: sticky; top: 0; z-index: 5; background: #312e81; color: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 16px; }
    .bar select, .bar button { font: inherit; font-weight: 700; padding: 8px 12px; border-radius: 10px; border: 2px solid #c7d2fe; }
    .bar label { display: inline-flex; align-items: center; gap: 4px; background: #fff; color: #1c1917; border-radius: 10px; padding: 6px 10px; font-weight: 700; }
    .bar .print { background: #fcd34d; border-color: #b45309; font-size: 18px; }
    .bar .note { width: 100%; font-size: 14px; color: #e0e7ff; }
    .pages { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .sheet { width: 364mm; height: 257mm; padding: 10mm; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 4mm; overflow: hidden; page-break-after: always; break-after: page; }
    @media screen { .sheet { zoom: var(--zoom, .5); } }
    @media print { body { background: #fff; } .bar { display: none; } .pages { padding: 0; gap: 0; } .sheet { box-shadow: none; } }

    .head { height: 26mm; display: flex; gap: 5mm; align-items: stretch; }
    .pic { width: 34mm; border-radius: 3mm; overflow: hidden; background: linear-gradient(#e0e7ff, #fef3c7); display: flex; align-items: center; justify-content: center; font-size: 8mm; flex-shrink: 0; }
    .pic img { width: 100%; height: 100%; object-fit: cover; }
    .title { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2mm; min-width: 0; }
    .title h1 { margin: 0; font-size: 9mm; line-height: 1.2; }
    .legend { display: flex; flex-wrap: wrap; gap: 2mm; font-size: 4.2mm; font-weight: 700; }
    .legend span { border-radius: 2mm; padding: .6mm 2.2mm; border: .4mm solid; }
    .nameBox { width: 95mm; display: flex; flex-direction: column; gap: 2mm; justify-content: center; font-size: 5.5mm; font-weight: 700; flex-shrink: 0; }
    .nameBox div { border-bottom: .5mm solid #57534e; padding-bottom: 1mm; }
    .paper { flex: 1; min-height: 0; border: .6mm solid #a8a29e; border-radius: 4mm; padding: 4mm; }
    .tate { writing-mode: vertical-rl; height: 100%; overflow: hidden; line-height: 1.6; font-feature-settings: 'vert' 1; }
    .gyou { display: block; margin: 0 .2em; white-space: nowrap; }
    .sp { display: inline-block; block-size: 1em; inline-size: .42em; }
    .tate ruby rt { font-size: .45em; color: #44403c; }
    .lit { border-radius: .3em; padding: .06em 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .badge { font-size: .62em; }
    .foot { height: 5mm; font-size: 3.6mm; color: #78716c; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="bar">
    <b style="font-size:20px">🖨 ぶんしょうの プリント（B4よこ）</b>
    <select id="story"></select>
    <span>いろ：</span>
    <span id="cats"></span>
    <button id="app" type="button">アプリと おなじ</button>
    <button id="none" type="button">いろなし</button>
    <button id="all" type="button">ぜんぶ</button>
    <button class="print" type="button" onclick="window.print()">🖨 いんさつ ・ PDFで ほぞん</button>
    <div class="note">PDFで保存するときは、出てきた画面の「送信先（プリンタ）」を「PDFに保存」にして「保存」を押します。用紙サイズは「B4」、向きは「横」になっているか確かめてください。「背景のグラフィック」にチェックを入れると、色が出ます。</div>
  </div>
  <div class="pages" id="pages">じゅんび ちゅう…</div>

  <script src="data/monogatari.js?v=1"></script>
  <script>
    (function () {
      var D = window.MONOGATARI_DATA;
      var CAT = {}; D.CATS.forEach(function (c) { CAT[c.id] = c; });
      var q = new URLSearchParams(location.search);
      var state = { s: q.get('s') || String(D.STORIES[0].id), c: q.get('c') || 'none' };

      function storyButtons(st) {
        var i = D.STORIES.indexOf(st);
        return st.buttons && st.buttons.length ? st.buttons : i < 3 ? ['itsu', 'doko', 'oto'] : D.CATS.map(function (c) { return c.id; });
      }
      // いろを つける しゅるい（none／app＝アプリと おなじ／all／itsu,doko …）
      function litCats(st, c) {
        if (c === 'none') return [];
        if (c === 'app') return storyButtons(st);
        if (c === 'all') return D.CATS.map(function (x) { return x.id; });
        return c.split(',').filter(function (x) { return CAT[x]; });
      }
      function esc(t) { return String(t).replace(/[&<>"]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]; }); }
      function render(nodes, st, lit) {
        return nodes.map(function (n) {
          if (n.t === 'text') return n.s.split(/( )/).map(function (s) { return s === ' ' ? '<span class="sp"></span>' : esc(s); }).join('');
          if (n.t === 'ruby') return '<ruby>' + esc(n.b) + '<rt>' + esc(n.r) + '</rt></ruby>';
          var inner = render(n.kids, st, lit);
          if (lit.indexOf(n.c) < 0) return inner;
          var c = CAT[n.c], bg = c.bg, bd = c.color, badge = '';
          if (n.c === 'dare') {
            var pi = Math.max(0, (n.n || 1) - 1);
            bg = D.PERSON_BG[pi] || bg; bd = D.PERSON_BORDER[pi] || bd;
            var person = n.k === 's' && st.people ? st.people[pi] : null;
            if (person && /^「/.test(D.plain(n.kids))) badge = '<span class="badge">' + person.e + '</span>';
          }
          return '<span class="lit" style="background:' + bg + ';box-shadow:inset 0 0 0 .5mm ' + bd + '">' + badge + inner + '</span>';
        }).join('');
      }
      function sheet(st, c) {
        var lit = litCats(st, c);
        var lines = st.lines.map(function (l) { return D.parse(l); });
        var maxLen = Math.max.apply(null, lines.map(function (ns) { var t = D.plain(ns); return t.replace(/ /g, '').length + (t.match(/ /g) || []).length * 0.42; }));
        // ぶんしょうの わく：よこ 335mm・たて 198mm に おさまる 大きさ（mm）
        var fs = Math.min(198 / (maxLen + 1.2), 335 / (lines.length * 1.7), 12);
        var legendCats = lit.length ? lit : storyButtons(st);
        var legend = legendCats.map(function (id) {
          var x = CAT[id];
          return '<span style="background:' + (lit.length ? x.bg : '#fff') + ';border-color:' + x.color + ';color:' + x.dark + '">' + x.e + ' ' + x.no + ' ' + x.n + '（' + { dare: 'あか', itsu: 'あお', doko: 'みどり', kimochi: 'ピンク', oto: 'オレンジ' }[id] + '）</span>';
        }).join('');
        var who = st.people && lit.indexOf('dare') >= 0 && st.people.length > 1
          ? '<span style="border-color:#b91c1c">' + st.people.map(function (p, i) { return p.e + ' ' + p.n + '＝' + (i === 0 ? 'こい あか' : 'うすい あか'); }).join('　') + '</span>' : '';
        return '<div class="sheet">' +
          '<div class="head">' +
            '<div class="pic"><span>' + st.scene + '</span><img src="img/' + st.img + '.webp" alt="" style="display:none" onload="this.style.display=\'\';this.previousSibling.remove()" onerror="this.remove()"></div>' +
            '<div class="title"><h1>' + esc(st.id + '. ' + st.title) + '</h1><div class="legend">' + (lit.length ? '' : '<b style="padding:.6mm 0">ぬる いろ：</b>') + legend + who + '</div></div>' +
            '<div class="nameBox"><div>なまえ</div><div>　　　がつ　　　にち</div></div>' +
          '</div>' +
          '<div class="paper"><div class="tate" data-max="' + fs.toFixed(2) + '" style="font-size:' + fs.toFixed(2) + 'mm">' +
            lines.map(function (ns) { return '<div class="gyou">' + render(ns, st, lit) + '</div>'; }).join('') +
          '</div></div>' +
          '<div class="foot"><span>ピカリせんせいの ものがたりの もり</span><span>' + (lit.length ? 'いろつき' : 'いろなし') + '</span></div>' +
        '</div>';
      }
      // わくに ぴったり おさまる 大きさに する（はみだしたら すこしずつ 小さく）
      function fit() {
        [].slice.call(document.querySelectorAll('.tate')).forEach(function (el) {
          var fs = parseFloat(el.dataset.max);
          el.style.fontSize = fs + 'mm';
          while (fs > 4 && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1)) { fs -= 0.2; el.style.fontSize = fs.toFixed(2) + 'mm'; }
          el.style.fontSize = (fs * 0.96).toFixed(2) + 'mm'; // いんさつで ずれても はみださない ように すこし よゆうを もつ
          el.scrollLeft = 0; el.scrollTop = 0;
        });
      }
      function draw() {
        var list = state.s === 'all' ? D.STORIES : D.STORIES.filter(function (x) { return String(x.id) === state.s; });
        if (!list.length) list = [D.STORIES[0]];
        document.getElementById('pages').innerHTML = list.map(function (st) { return sheet(st, state.c); }).join('');
        // チェックの ようす
        var st0 = list[0];
        var on = litCats(st0, state.c);
        D.CATS.forEach(function (c) { document.getElementById('cb_' + c.id).checked = on.indexOf(c.id) >= 0; });
        document.getElementById('story').value = state.s;
        history.replaceState(null, '', '?s=' + state.s + '&c=' + state.c);
        // 画面に あわせて 小さく 見せる
        var z = Math.min(1, (window.innerWidth - 40) / (364 * 96 / 25.4));
        document.documentElement.style.setProperty('--zoom', z.toFixed(3));
        var imgs = [].slice.call(document.images);
        Promise.all(imgs.map(function (im) { return im.complete ? 0 : new Promise(function (ok) { im.onload = im.onerror = ok; }); }))
          .then(function () { return document.fonts ? document.fonts.ready : 0; })
          .then(function () { fit(); document.body.dataset.ready = '1'; });
      }

      var sel = document.getElementById('story');
      sel.innerHTML = '<option value="all">ぜんぶの おはなし</option>' + D.STORIES.map(function (s) { return '<option value="' + s.id + '">' + s.id + '. ' + esc(s.title) + '</option>'; }).join('');
      sel.onchange = function () { state.s = sel.value; draw(); };
      document.getElementById('cats').innerHTML = D.CATS.map(function (c) {
        return '<label style="border:2px solid ' + c.color + '"><input type="checkbox" id="cb_' + c.id + '">' + c.e + ' ' + c.no + ' ' + c.n + '</label>';
      }).join(' ');
      D.CATS.forEach(function (c) {
        document.getElementById('cb_' + c.id).onchange = function () {
          var ids = D.CATS.filter(function (x) { return document.getElementById('cb_' + x.id).checked; }).map(function (x) { return x.id; });
          state.c = ids.length ? ids.join(',') : 'none'; draw();
        };
      });
      document.getElementById('app').onclick = function () { state.c = 'app'; draw(); };
      document.getElementById('none').onclick = function () { state.c = 'none'; draw(); };
      document.getElementById('all').onclick = function () { state.c = 'all'; draw(); };
      window.addEventListener('beforeprint', fit);
      window.addEventListener('resize', function () {
        var z = Math.min(1, (window.innerWidth - 40) / (364 * 96 / 25.4));
        document.documentElement.style.setProperty('--zoom', z.toFixed(3));
      });
      // PDF を つくる ツール用：つくる ファイルの いちらん
      window.MONO_PDF_FILES = [].concat(
        D.STORIES.map(function (s) { var n = ('0' + s.id).slice(-2); return [['s=' + s.id + '&c=none', 'ものがたり_' + n + '_いろなし.pdf'], ['s=' + s.id + '&c=app', 'ものがたり_' + n + '_いろつき.pdf']]; })
          .reduce(function (a, b) { return a.concat(b); }, []),
        [['s=all&c=none', 'ものがたり_ぜんぶ_いろなし.pdf'], ['s=all&c=app', 'ものがたり_ぜんぶ_いろつき.pdf']]
      );
      draw();
    })();
  </script>
</body>
</html>
