                <table className="bg-white border-collapse w-full">
                  <thead><tr className="bg-amber-100">{['おはなし', '印刷用ページ（えらんで 印刷・PDFで 保存）', 'できている PDF'].map(h => <th key={h} className="border px-2 py-1">{h}</th>)}</tr></thead>
                  <tbody>
                    {[...D.ALL.map(st => [String(st.id), `${st.id}. ${st.title}`, ('0' + st.id).slice(-2)]), ['all', 'ぜんぶの おはなし', 'ぜんぶ']].map(([sid, label, fn]) => (
                      <tr key={sid}>
                        <td className="border px-2 py-2 font-bold">{label}</td>
                        <td className="border px-2 py-2">
                          <a className="inline-block mr-2 px-3 py-2 rounded-xl bg-white border-2 font-bold" target="_blank" rel="noopener" href={`${BASE}print.html?s=${sid}&c=none`}>🖨 いろなし</a>
                          <a className="inline-block px-3 py-2 rounded-xl bg-amber-100 border-2 border-amber-400 font-bold" target="_blank" rel="noopener" href={`${BASE}print.html?s=${sid}&c=app`}>🖨 いろつき</a>
                        </td>
                        <td className="border px-2 py-2">
                          <a className="inline-block mr-2 underline" target="_blank" rel="noopener" href={`${BASE}pdf/${encodeURIComponent(`ものがたり_${fn}_いろなし.pdf`)}`}>📄 いろなし</a>
                          <a className="inline-block underline" target="_blank" rel="noopener" href={`${BASE}pdf/${encodeURIComponent(`ものがたり_${fn}_いろつき.pdf`)}`}>📄 いろつき</a>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div className="mt-3 text-sm text-stone-600">
                  印刷用ページは 新しいタブで 開きます。上の チェックで 色を つける しゅるいを えらべます（①〜⑤の 好きな 組み合わせ）。
                  「🖨 いんさつ ・ PDFで ほぞん」を押し、PDFに するときは 送信先を「PDFに保存」にします。用紙は「B4」・「横」、「背景のグラフィック」に チェックを 入れます。
                </div>
              </div>
            )}

            {tab === 'set' && (
              <div className="flex flex-col gap-4 max-w-3xl">
                <Row label="読み上げの速さ">{[0.6, 0.7, 0.8, 0.9, 1.0].map(v => <Choice key={v} on={s.rate === v} onClick={() => saveS({ rate: v })}>{v === 0.8 ? '0.8（ふつう）' : v}</Choice>)}</Row>
                <Row label="文字の大きさ">{[[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']].map(([v, l]) => <Choice key={v} on={s.font === v} onClick={() => saveS({ font: v })}>{l}</Choice>)}</Row>
                <Row label="③ たしかめ">{[[true, 'する'], [false, 'しない']].map(([v, l]) => <Choice key={l} on={s.quiz === v} onClick={() => saveS({ quiz: v })}>{l}</Choice>)}</Row>
                <Row label="効果音">{[[true, 'ならす'], [false, 'ならさない']].map(([v, l]) => <Choice key={l} on={s.sound === v} onClick={() => saveS({ sound: v })}>{l}</Choice>)}</Row>
                <Row label="🎧 はんどく">{[[true, '出す'], [false, '出さない']].map(([v, l]) => <Choice key={l} on={s.hando === v} onClick={() => saveS({ hando: v })}>{l}</Choice>)}</Row>
                <Row label="はんどくの 黄色い マーカー">{[[true, '出す（だいたいの 位置）'], [false, '出さない']].map(([v, l]) => <Choice key={l} on={s.handoMark === v} onClick={() => saveS({ handoMark: v })}>{l}</Choice>)}</Row>
                <Row label="よみきかせの声（Gemini）">{[[true, 'つかう'], [false, 'つかわない']].map(([v, l]) => <Choice key={l} on={s.tts === v} onClick={() => saveS({ tts: v })}>{l}</Choice>)}</Row>
                <Row label="声の しゅるい">
                  {VOICES.map(([v, l]) => <Choice key={v} on={s.voice === v} onClick={() => saveS({ voice: v })}>{v}（{l}）</Choice>)}
                  <button className="px-3 py-2 rounded-xl bg-sky-100 border-2 border-sky-300 font-bold" onClick={() => { Speech.gvoice = s.voice; Speech.sayVoice('こんにちは。わたしは ホタルの ピカリせんせい。いっしょに おはなしを よもうね。'); }}>🔊 ためす</button>
                </Row>
                {tts && (
                  <div className="bg-white rounded-xl p-3 border-2">
                    <div>APIキー：{tts.hasKey ? '✅ 入っています' : '❌ 入っていません（ブラウザの声で読みます）'}　モデル：{tts.model || '－'}</div>
                    <div>きょう作った声：{tts.today}　ドライブにある声：{tts.files}</div>
                    {tts.pauseUntil > Date.now() && <div className="text-rose-700">使いすぎのため、{new Date(tts.pauseUntil).toLocaleTimeString()} まで休んでいます</div>}
                    {tts.lastError && <div className="text-xs text-stone-500 break-all">さいごのエラー：{tts.lastError}</div>}
                    {HAS_GAS && tts.hasKey && (
                      <div className="mt-2">
                        <button className="px-3 py-2 rounded-xl bg-amber-200 border-2 border-amber-400 font-bold" disabled={prepState && !prepState.done && !prepState.stop} onClick={prepVoices}>🎙️ おはなしと セリフの 声を まとめて つくる</button>
                        {prepState && !prepState.done && !prepState.stop && <button className="ml-2 underline" onClick={() => { prepStop.current = true; }}>とめる</button>}
                        {prepState && <div className="mt-1">{prepState.i} / {prepState.n}（あたらしく {prepState.made}・もう あった {prepState.skip}）{prepState.done ? ' ✅ おわりました' : ''}{prepState.stop || ''}</div>}
                      </div>
                    )}
                  </div>
                )}
                <Row label="暗証番号を変える"><PinChange onSave={(v) => saveS({ newPin: v })} /></Row>
                <div className="text-sm text-stone-600">設定は全員の画面に反映されます。子どもの画面は、開き直すと変わります。</div>
              </div>
            )}

            {tab === 'data' && (
              <div className="flex flex-col gap-3 max-w-2xl">
                <button className="px-4 py-3 rounded-xl bg-white border-2 font-bold text-left" onClick={async () => { await api.flush(); setNote(`まだ送れていない記録：${api.pending()}`); }}>📤 まだ送れていない記録を送る（いま {api.pending()}）</button>
                <button className="px-4 py-3 rounded-xl bg-white border-2 font-bold text-left" onClick={csv}>📄 記録を CSV で書き出す</button>
                <button className="px-4 py-3 rounded-xl bg-white border-2 font-bold text-left" onClick={backup}>💾 バックアップを保存する</button>
                <label className="px-4 py-3 rounded-xl bg-white border-2 font-bold">📂 バックアップから もどす <input type="file" accept=".json" onChange={restore} className="ml-2" /></label>
                <button className="px-4 py-3 rounded-xl bg-rose-100 border-2 border-rose-300 font-bold text-left" onClick={() => clear('')}>🗑 全員の記録を消す</button>
              </div>
            )}
          </div>
        </div>
      );
    }
    // =====================================================================
    // 10-2. いろの チェック（先生が ①〜⑤の いろを たしかめて・直して から、子どもに 出す）
    // =====================================================================
    const KCAT = { t: 'itsu', p: 'doko', k: 'kimochi', y: 'kimochi', o: 'oto', s: 'dare', n: 'dare' };
    const FEELINGS = ['うれしい', 'たのしい', 'かなしい', 'さみしい', 'こわい', 'おこった', 'くやしい', 'はずかしい', 'しんぱい', 'ほっと した', 'がっかり', 'びっくり', 'わくわく', 'こまった', 'つまらない', 'きんちょう', 'おかしい', 'なつかしい'];
    const iroPens = (story) => [
      ...(story.people || []).map((p, i) => ({ id: 's' + (i + 1), k: 's', n: i + 1, cat: 'dare', label: `① せりふ：${p.e}${p.n}` })),
      ...(story.people || []).map((p, i) => ({ id: 'n' + (i + 1), k: 'n', n: i + 1, cat: 'dare', label: `① なまえ：${p.e}${p.n}` })),
      { id: 't', k: 't', n: 0, cat: 'itsu', label: '② いつ' },
      { id: 'p', k: 'p', n: 0, cat: 'doko', label: '③ どこ' },
      { id: 'k', k: 'k', n: 0, cat: 'kimochi', label: '④ きもちの ことば' },
      { id: 'y', k: 'y', n: 0, cat: 'kimochi', label: '④ きもちが わかる ようす' },
      { id: 'o', k: 'o', n: 0, cat: 'oto', label: '⑤ オノマトペ' },
    ];
    // 1行を「1もじずつ（ふりがなつきの 漢字は 1つ）」と「いろの はんい」に わける
    function toAtoms(line) {
      const atoms = [], spans = [];
      (function walk(nodes) {
        nodes.forEach(n => {
          if (n.t === 'text') { for (const ch of n.s) atoms.push({ ch }); return; }
          if (n.t === 'ruby') { atoms.push({ rb: n.b, rt: n.r }); return; }
          const sp = { k: n.k, n: n.n || 0, m: n.m || '', a: atoms.length, b: atoms.length - 1 };
          spans.push(sp); walk(n.kids); sp.b = atoms.length - 1;
        });
      })(D.parse(line));
      return { atoms, spans: spans.filter(s => s.b >= s.a) };
    }
    const atomText = (x) => x.rb !== undefined ? x.rb : x.ch;
    // 「1もじずつ」と「いろの はんい」から、もとの 書き方（{t:…} など）に もどす
    function fromAtoms(atoms, spans) {
      const list = spans.filter(s => s.b >= s.a).slice().sort((x, y) => x.a - y.a || y.b - x.b);
      const at = (x) => x.rb !== undefined ? `[${x.rb}:${x.rt}]` : x.ch;
      let i = 0;
      const emit = (from, to) => {
        let out = '', pos = from;
        while (i < list.length && list[i].a <= to) {
          const s = list[i++];
          for (; pos < s.a; pos++) out += at(atoms[pos]);
          out += '{' + s.k + (s.n || '') + ':' + emit(s.a, s.b) + (s.k === 'y' && s.m ? '|' + s.m : '') + '}';
          pos = s.b + 1;
        }
        for (; pos <= to; pos++) out += at(atoms[pos]);
        return out;
      };
      return emit(0, atoms.length - 1);
    }
    // ③ たしかめ の こたえが、ぶんしょうの いろの 中に みつからない もんだい
    function quizBroken(story, lines) {
      const spans = D.spans(lines);
      return (story.quiz || []).filter(q => {
        const t = norm(q.find || q.a);
        return !spans.some(sp => sp.c === q.c && (norm(sp.yomi).includes(t) || norm(sp.base).includes(t)));
      });
    }

    function IroCheck({ pin, onIro }) {
      const [sid, setSid] = useState(D.ALL[0].id);
      const story = D.ALL.find(s => s.id === sid) || D.ALL[0];
      const saved = iroLines(story) || story.lines;
      const [lines, setLines] = useState(saved);
      const [pen, setPen] = useState('t');
      const [start, setStart] = useState(null); // はじめの 字 { li, ai }
      const [msg, setMsg] = useState('');
      const [busy, setBusy] = useState(false);
      const pens = iroPens(story);
      const curPen = pens.find(p => p.id === pen) || pens[0];
      const model = useMemo(() => lines.map(toAtoms), [lines]);
      const dirty = lines.join('\n') !== saved.join('\n');
      const ok = iroOk(story);
      const fromBase = lines.join('\n') !== story.lines.join('\n');
      const okCount = D.ALL.filter(iroOk).length;

      const pick = (id) => {
        if (id === sid) return;
        if (dirty && !confirm('直した ところを まだ ほぞん して いません。ほかの おはなしに うつりますか？（直した ところは 消えます）')) return;
        const st = D.ALL.find(s => s.id === id);
        setSid(id); setLines(iroLines(st) || st.lines); setStart(null); setMsg(''); setPen('t');
      };
      const setLine = (li, spans) => {
        const nl = lines.slice(); nl[li] = fromAtoms(model[li].atoms, spans);
        const broken = quizBroken(story, nl);
        if (broken.length) { setMsg(`この ことばは「③ たしかめ」の こたえ（${broken.map(q => '「' + q.a + '」').join('・')}）です。いろを はずせません。問題も 直したい ときは、Claude に 伝えてください。`); return; }
        setLines(nl);
      };
      const tap = (li, ai) => {
        const { atoms, spans } = model[li];
        if (atoms[ai].ch === ' ') return;
        setMsg('');
        if (!start || start.li !== li) { setStart({ li, ai }); return; }
        const a = Math.min(start.ai, ai), b = Math.max(start.ai, ai);
        setStart(null);
        if (spans.some(s => s.k === curPen.k && (s.n || 0) === curPen.n && s.a === a && s.b === b)) { setMsg('そこには、もう おなじ いろが ついて います。'); return; }
        if (spans.some(s => !(b < s.a || a > s.b || (a <= s.a && b >= s.b) || (a >= s.a && b <= s.b)))) { setMsg('ほかの いろと「はんぶんだけ かさなる」つけ方は できません。さきに、かさなる いろを ✖ で はずしてください。'); return; }
        setLine(li, [...spans, { k: curPen.k, n: curPen.n, m: '', a, b }]);
      };
      const del = (li, si) => { setStart(null); setMsg(''); setLine(li, model[li].spans.filter((_, j) => j !== si)); };
      const setM = (li, si, m) => setLine(li, model[li].spans.map((s, j) => j === si ? { ...s, m } : s));
      const save = async (okFlag) => {
        setBusy(true); setMsg('');
        try {
          const r = await api.saveIro(pin, story.id, story.title, okFlag, storyHash(story), lines);
          if (r && r.ok) { onIro(r.iro); setMsg(okFlag ? '✅ ほぞんしました。この おはなしを 子どもに 出します。' : '⏸ ほぞんしました。この おはなしは 子どもに 出しません。'); }
          else setMsg('ほぞん できませんでした。もう一度 おしてください。');
        } catch (e) { setMsg('ほぞん できませんでした（ネットに つながって いるか たしかめてください）。'); }
        setBusy(false);
      };

      const colorOf = (s) => s.k === 'y' ? { bg: '#fdf2f8', bd: '#ec4899', dash: true }
        : (s.k === 's' || s.k === 'n') ? { bg: D.PERSON_BG[(s.n || 1) - 1] || '#fca5a5', bd: D.PERSON_BORDER[(s.n || 1) - 1] || '#ef4444', dash: s.k === 'n' }
        : { bg: CAT[KCAT[s.k]].bg, bd: CAT[KCAT[s.k]].color };
      // えらんで いる しゅるいの いろは はっきり、ほかの しゅるいは 下の 点線だけ
      const spanStyle = (s) => {
        const c = colorOf(s);
        return KCAT[s.k] === curPen.cat
          ? { background: c.bg, border: `2px ${c.dash ? 'dashed' : 'solid'} ${c.bd}`, borderRadius: 6, padding: '3px 1px', margin: '0 1px' }
          : { borderBottom: `3px dotted ${c.bd}`, paddingBottom: 1 };
      };
      const renderLine = (li) => {
        const { atoms, spans } = model[li];
        const list = spans.map((s, si) => ({ ...s, si })).sort((x, y) => x.a - y.a || y.b - x.b);
        let i = 0;
        const atomEl = (ai) => {
          const x = atoms[ai], isStart = start && start.li === li && start.ai === ai;
          return (
            <span key={'a' + ai} onClick={() => tap(li, ai)}
              style={{ cursor: x.ch === ' ' ? 'default' : 'pointer', borderRadius: 4, background: isStart ? '#fde047' : undefined, outline: isStart ? '2px solid #ca8a04' : undefined }}>
              {x.rb !== undefined ? <ruby>{x.rb}<rt>{x.rt}</rt></ruby> : x.ch}
            </span>
          );
        };
        const emit = (from, to) => {
          const out = []; let pos = from;
          while (i < list.length && list[i].a <= to) {
            const s = list[i++];
            for (; pos < s.a; pos++) out.push(atomEl(pos));
            out.push(<span key={'s' + s.si} style={spanStyle(s)}>{emit(s.a, s.b)}</span>);
            pos = s.b + 1;
          }
          for (; pos <= to; pos++) out.push(atomEl(pos));
          return out;
        };
        return emit(0, atoms.length - 1);
      };
      const count = (p) => model.reduce((a, m) => a + m.spans.filter(s => s.k === p.k && (s.n || 0) === p.n).length, 0);
      const listed = [];
      model.forEach((m, li) => m.spans.forEach((s, si) => { if (KCAT[s.k] === curPen.cat) listed.push({ li, si, s, text: m.atoms.slice(s.a, s.b + 1).map(atomText).join('') }); }));
      const penOf = (s) => pens.find(p => p.k === s.k && p.n === (s.n || 0));

      return (
        <div className="flex gap-4 items-start">
          {/* おはなしの いちらん */}
          <div className="w-72 shrink-0 bg-white rounded-xl border-2 p-2">
            <div className="font-bold px-1 pb-1">子どもに 出して いる おはなし：{okCount} / {D.ALL.length}</div>
            {D.ALL.map(s => (
              <button key={s.id} onClick={() => pick(s.id)}
                className={`block w-full text-left px-2 py-2 rounded-lg border-2 mb-1 ${s.id === sid ? 'bg-amber-100 border-amber-500 font-bold' : 'bg-white border-stone-200'}`}>
                {iroOk(s) ? '✅' : '⬜'} {s.id}. {s.title}
              </button>
            ))}
            <div className="text-sm text-stone-500 px-1 pt-1">✅＝たしかめた（子どもに 出る）　⬜＝まだ（子どもに 出ない）</div>
          </div>

          <div className="flex-1 min-w-0">
            <div className="bg-white rounded-xl border-2 p-3">
              <div className="flex items-center gap-3 flex-wrap">
                <div className="text-xl font-bold">{story.id}. {story.title}</div>
                <div className={`px-3 py-1 rounded-full font-bold ${ok && !dirty ? 'bg-emerald-100 text-emerald-800' : ok ? 'bg-amber-100 text-amber-900' : 'bg-stone-200 text-stone-700'}`}>
                  {ok && !dirty ? '✅ 子どもに 出して います' : ok ? '✏ 直した ところは、まだ 出して いません' : '⬜ まだ 子どもに 出して いません'}
                </div>
              </div>
              <div className="text-sm text-stone-600 mt-1">
                下の ボタンで しゅるいを えらぶと、その いろが はっきり 出ます。<b>いろを つける</b>：はじめの 字 → おわりの 字 の 順に 押します（1字だけの ときは、同じ 字を 2回）。<b>いろを はずす</b>：下の 一覧の ✖ を 押します。
              </div>
              <div className="flex flex-wrap gap-2 mt-3">
                {pens.map(p => {
                  const c = colorOf(p);
                  return (
                    <button key={p.id} onClick={() => { setPen(p.id); setStart(null); setMsg(''); }}
                      className={`px-3 py-2 rounded-xl font-bold ${pen === p.id ? 'ring-4 ring-amber-400' : ''}`}
                      style={{ background: c.bg, border: `2px ${c.dash ? 'dashed' : 'solid'} ${c.bd}`, color: '#1c1917' }}>
                      {p.label}（{count(p)}）
                    </button>
                  );
                })}
              </div>
              {msg && <div className="mt-3 bg-rose-50 border-2 border-rose-300 text-rose-900 rounded-xl px-3 py-2 font-bold">{msg}</div>}
              {start && <div className="mt-3 bg-yellow-50 border-2 border-yellow-300 rounded-xl px-3 py-2">「{curPen.label}」の はじめの 字を えらびました。つぎに、<b>おわりの 字</b>を 押して ください（同じ 行の 中で）。<button className="underline ml-2" onClick={() => setStart(null)}>やめる</button></div>}

              {/* ぶんしょう（よこ書き。1行＝アプリの 1れつ） */}
              <div className="mt-3 border-2 border-stone-200 rounded-xl p-3" style={{ fontSize: 24, lineHeight: 2.3, whiteSpace: 'pre-wrap', wordSpacing: '.25em' }}>
                {model.map((m, li) => (
                  <div key={li} className="flex gap-3 border-b border-stone-100">
                    <div className="w-8 shrink-0 text-right text-sm text-stone-400" style={{ lineHeight: '55px' }}>{li + 1}</div>
                    <div className="flex-1">{renderLine(li)}</div>
                  </div>
                ))}
              </div>

              {/* いま えらんで いる しゅるいの いちらん */}
              <div className="mt-3">
                <div className="font-bold">{CAT[curPen.cat].no} {CAT[curPen.cat].n} の いろが ついて いる ところ（{listed.length}こ）</div>
                {!listed.length && <div className="text-stone-500">まだ ありません。</div>}
                <div className="flex flex-col gap-1 mt-1">
                  {listed.map(({ li, si, s, text }) => {
                    const c = colorOf(s), p = penOf(s);
                    return (
                      <div key={`${li}-${si}`} className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm text-stone-500 w-12">{li + 1}行め</span>
                        <span className="px-2 py-1 rounded-lg font-bold" style={{ background: c.bg, border: `2px ${c.dash ? 'dashed' : 'solid'} ${c.bd}`, fontSize: 20 }}>{text}</span>
                        <span className="text-sm text-stone-600">{p ? p.label : ''}</span>
                        {s.k === 'y' && (
                          <label className="text-sm">→ わかる きもち：
                            <select className="border-2 rounded-lg px-2 py-1 ml-1 text-base" value={s.m || ''}
                              onChange={(e) => {
                                let v = e.target.value;
                                if (v === '__other') v = (prompt('この ようすから わかる きもちを、ひらがなで 入れてください（例：うれしい）', s.m || '') || '').replace(/[|{}\[\]]/g, '').trim().slice(0, 12);
                                setM(li, si, v);
                              }}>
                              <option value="">（えらばない）</option>
                              {[...new Set([...(s.m ? [s.m] : []), ...FEELINGS])].map(f => <option key={f} value={f}>{f}</option>)}
                              <option value="__other">そのほか（自分で 入れる）</option>
                            </select>
                          </label>
                        )}
                        <button onClick={() => del(li, si)} className="px-2 py-1 rounded-lg bg-stone-100 border-2 border-stone-300 font-bold">✖ はずす</button>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3 mt-4 pt-3 border-t-2">
                <button disabled={busy} onClick={() => save(true)} className="px-5 py-3 rounded-xl bg-emerald-300 border-2 border-emerald-600 font-bold text-lg disabled:opacity-50">✅ たしかめた（子どもに 出す）</button>
                {ok && <button disabled={busy} onClick={() => save(false)} className="px-4 py-3 rounded-xl bg-white border-2 border-stone-400 font-bold disabled:opacity-50">⏸ 子どもに 出すのを やめる</button>}
                {fromBase && <button disabled={busy} onClick={() => { if (confirm('いろを、はじめの（Claude が 作った）いろに もどします。よろしいですか？')) { setLines(story.lines); setStart(null); setMsg('はじめの いろに もどしました。「✅ たしかめた」を おすと ほぞん します。'); } }} className="px-4 py-3 rounded-xl bg-white border-2 border-stone-400 font-bold disabled:opacity-50">↩ はじめの いろに もどす</button>}
                {dirty && <button disabled={busy} onClick={() => { setLines(saved); setStart(null); setMsg(''); }} className="underline">直した ところを 取り消す</button>}
              </div>
              <div className="text-sm text-stone-500 mt-2">「✅ たしかめた」を おすまで、直した いろは ほぞん されません。ほぞん すると、子どもの 画面は 開き直した ときに 変わります。プリント（PDF・印刷用ページ）の 色は、はじめの いろの ままです。</div>
            </div>

            {(story.quiz || []).length > 0 && (
              <div className="bg-white rounded-xl border-2 p-3 mt-3">
                <div className="font-bold">③ たしかめ の 問題（見るだけ）</div>
                <ol className="list-decimal ml-6 mt-1">
                  {story.quiz.map((q, i) => <li key={i}>{CAT[q.c].no} {q.q}　→　<b>{q.a}</b>（ちがう こたえ：{q.ng.map(x => Array.isArray(x) ? x[0] : x).join('・')}）</li>)}
                </ol>
              </div>
            )}
          </div>
        </div>
      );
    }

    function Row({ label, children }) {
      return <div className="flex flex-wrap items-center gap-2"><div className="w-56 font-bold">{label}</div>{children}</div>;
    }
    function Choice({ on, onClick, children }) {
      return <button onClick={onClick} className={`px-3 py-2 rounded-xl border-2 font-bold ${on ? 'bg-amber-300 border-amber-600' : 'bg-white'}`}>{children}</button>;
    }
    function PinChange({ onSave }) {
      const [v, setV] = useState('');
      return (
        <span className="flex gap-2">
          <input value={v} onChange={e => setV(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="4けたの数字" className="border-2 rounded-xl px-3 py-2 w-36" inputMode="numeric" />
          <button disabled={v.length !== 4} onClick={() => { onSave(v); setV(''); }} className="px-3 py-2 rounded-xl bg-amber-200 border-2 border-amber-400 font-bold disabled:opacity-40">変える</button>
        </span>
      );
    }

    // =====================================================================
    // 11. アプリ全体
    // =====================================================================
    function applySettings(s) {
      Speech.rate = s.rate || 0.8;
      Speech.gemini = !!s.tts; Speech.gvoice = s.voice || 'Sulafat';
      Sound.on = !!s.sound;
      document.documentElement.style.fontSize = `${16 * (s.font || 1)}px`;
    }

    function App() {
      const [boot, setBoot] = useState(null);
      const [err, setErr] = useState('');
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState('');
      const [progress, setProgress] = useState(null);
      const [screen, setScreen] = useState('names');
      const [cur, setCur] = useState(null); // { index, step }
      const [clearInfo, setClearInfo] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinErr, setPinErr] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [, setIroVer] = useState(0);
      const pRef = useRef(null);
      const quizStat = useRef({ miss: 0 });

      useEffect(() => {
        (async () => {
          try {
            await window.MONO_READY;
            D = window.MONOGATARI_DATA;
            CAT = Object.fromEntries(D.CATS.map(c => [c.id, c]));
            D.ALL = D.STORIES;
            const r = await api.init();
            // 先生が たしかめた おはなし だけを 出す（おためしモードは、はじめは ぜんぶ 出す）
            applyIro(r.iro || (r.demo ? iroAllOk() : {}));
            const s = { ...DEFAULT_SETTINGS, ...(r.settings || {}) };
            setSettings(s); applySettings(s);
            setBoot(r);
            api.flush();
          } catch (e) { setErr(String(e && e.message || e)); }
        })();
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      const commit = (p, records = []) => {
        p.t = Date.now();
        pRef.current = p; setProgress({ ...p });
        api.save({ name, progress: JSON.stringify(p), records, time: Date.now(), stamp: nowStr() });
      };
      const pickName = async (n) => {
        if (!D.STORIES.length) return;
        Sound.get();
        Speech.avoid = n;
        let raw = '';
        try { raw = await api.student(n); } catch (e) {}
        const p = parseProgress(raw);
        pRef.current = p; setProgress(p); setName(n); setScreen('home');
        Speech.sayVoice(`${n}さん、こんばんは。`);
      };
      const openStory = (index, step = 1) => {
        quizStat.current = { miss: 0 };
        setCur({ index, step: step || 1 }); setScreen('story');
      };
      const onRecord = (r) => {
        const p = pRef.current;
        if (r.result !== '○') quizStat.current.miss++;
        commit(p, [r]);
      };
      const onKakera = (n) => { const p = pRef.current; p.kakera += n; pRef.current = p; setProgress({ ...p }); };
      const onStep = (step) => {
        const p = pRef.current; const st = D.STORIES[cur.index];
        p.resume = { story: st.id, step }; commit(p);
      };
      const onDone = () => {
        const p = pRef.current; const st = D.STORIES[cur.index];
        const first = !p.cleared[st.id];
        const perfect = settings.quiz && quizStat.current.miss === 0;
        const old = p.cleared[st.id] || { n: 0 };
        p.cleared[st.id] = { d: nowStr().slice(0, 10), n: (old.n || 0) + 1, perfect: !!(old.perfect || perfect) };
        const gained = 3;
        p.kakera += gained;
        let newItem = null;
        if (first) { newItem = D.FOREST.find(f => !p.forest.includes(f.id)) || null; if (newItem) p.forest.push(newItem.id); }
        p.resume = null;
        commit(p, [{ id: uid(), story: st.id, title: st.title, cat: 'おわり', q: '', a: '', result: '', miss: 0, hint: 0, picks: '', secs: 0 }]);
        setClearInfo({ story: st, gained, newItem, perfect }); setScreen('clear');
      };

      const submitPin = async (pin) => {
        const r = await api.teacher(pin);
        if (!r || !r.ok) { setPinErr(e => e + 1); return; }
        setPinOpen(false); setPinErr(0); setTeacher({ data: r, pin });
        Speech.stop();
      };
      // 先生が「いろの チェック」で 変えた とき：出す おはなしを 入れかえて、もり（または なまえ）の 画面に もどす
      const onIro = (iro) => {
        applyIro(iro);
        setCur(null); setClearInfo(null);
        setScreen(name && D.STORIES.length ? 'home' : 'names');
        setIroVer(v => v + 1);
      };
      const reloadTeacher = async () => {
        const r = await api.teacher(teacher.pin); if (r.ok) setTeacher({ ...teacher, data: r });
        if (name) { try { const raw = await api.student(name); const p = parseProgress(raw); if (p.t >= (pRef.current ? pRef.current.t : 0)) { pRef.current = p; setProgress(p); } } catch (e) {} }
      };

      if (err) return <div className="p-10 text-white text-2xl">データを よみこめませんでした（{err}）。ネットにつながっているか、たしかめてください。</div>;
      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-amber-200">じゅんび ちゅう…</div>;

      let body = null;
      const lock = () => setPinOpen(true);
      if (screen === 'names' || !progress) body = <NameSelect students={boot.students || []} demo={boot.demo} empty={!D.STORIES.length} onPick={pickName} onLock={lock} />;
      else if (screen === 'home') body = <Home name={name} progress={progress} onRead={openStory} onList={() => setScreen('list')} onZukan={() => setScreen('zukan')} onQuit={() => { Speech.stop(); setScreen('names'); setName(''); }} onLock={lock} />;
      else if (screen === 'list') body = <StoryList progress={progress} onPick={(i) => openStory(i, progress.resume && progress.resume.story === D.STORIES[i].id ? progress.resume.step : 1)} onBack={() => setScreen('home')} />;
      else if (screen === 'zukan') body = <Zukan progress={progress} onBack={() => setScreen('home')} />;
      else if (screen === 'story' && cur) body = <StoryScreen key={cur.index + '-' + cur.step} story={D.STORIES[cur.index]} index={cur.index} settings={settings} hatten={!!progress.hatten} startStep={cur.step}
        onRecord={onRecord} onKakera={onKakera} onStep={onStep} onDone={onDone} onExit={() => setScreen('home')} onLock={lock} />;
      else if (screen === 'clear' && clearInfo) body = <ClearScreen {...clearInfo} onHome={() => setScreen('home')} onZukan={() => setScreen('zukan')} onAgain={() => openStory(D.STORIES.indexOf(clearInfo.story), 1)} />;

      return (
        <div className="w-screen h-screen overflow-hidden">
          {body}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinErr} />}
          {teacher && <TeacherView data={teacher.data} pin={teacher.pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onIro={onIro}
            onSettings={(ns) => { setSettings(ns); applySettings(ns); }} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
