<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ピカリせんせいの ものがたりの もり</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'BIZ UDPGothic', sans-serif; background: #111836; margin: 0; color: #1c1917;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .btn3d { border-bottom-width: 6px; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; }
    .pop { animation: pop .45s cubic-bezier(.17,.89,.32,1.28) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floaty { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .shake { animation: shake .45s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-9px); } 40%,80% { transform: translateX(9px); } }
    .glow { animation: glow 1.1s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 14px rgba(250,204,21,0); } }
    .tailglow { animation: tailglow 2.2s ease-in-out infinite; }
    @keyframes tailglow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .bump { animation: bump .5s; }
    @keyframes bump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.3); } }
    .kakerafly { animation: kakerafly 1.4s ease-out forwards; }
    @keyframes kakerafly { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.3); } 100% { transform: translateY(-80px) scale(1); opacity: 0; } }
    /* もりを とぶ ホタル */
    .fly { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fef08a; box-shadow: 0 0 10px 4px rgba(254,240,138,.75);
      animation: fly var(--d, 9s) ease-in-out infinite, blink var(--b, 2.4s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
    @keyframes fly { 0%,100% { transform: translate(0,0); } 25% { transform: translate(30px,-20px); } 50% { transform: translate(-10px,-40px); } 75% { transform: translate(-30px,-10px); } }
    @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    .twinkle { animation: blink 3s ease-in-out infinite; }

    /* たて書きの ぶんしょう */
    .tate { writing-mode: vertical-rl; -webkit-writing-mode: vertical-rl; text-orientation: mixed; height: 100%; overflow-x: auto; overflow-y: hidden;
      line-height: 1.55; font-feature-settings: 'vert' 1; }
    .gyou { display: block; padding: .35em .18em; margin: 0 .16em; border-radius: .5em; transition: background .25s, box-shadow .25s; cursor: pointer; white-space: nowrap; }
    .gyou.reading { background: #fef08a; box-shadow: 0 0 0 3px #facc15; }
    .gyou.cursor { background: #fefce8; box-shadow: 0 0 0 3px #fde68a; }
    /* ② さがす：えらべる ことば */
    .tok { border-radius: .35em; cursor: pointer; transition: background .15s; }
    .finding .tok:hover { background: #f5f5f4; }
    .tok.picked { background: #fef9c3; box-shadow: inset 0 0 0 3px #eab308; }
    .tok.wrongpick { background: #e7e5e4; box-shadow: inset 0 0 0 2px #a8a29e; color: #78716c; text-decoration: line-through; text-decoration-color: #a8a29e; }
    .tok.got { outline: 3px solid #facc15; outline-offset: 1px; }
    .okmark { display: inline-block; font-size: .55em; }
    .gyou.hintline { animation: hintline 1.1s ease-in-out infinite; }
    @keyframes hintline { 0%,100% { box-shadow: 0 0 0 3px rgba(250,204,21,.95); background: #fefce8; } 50% { box-shadow: 0 0 0 8px rgba(250,204,21,.25); background: #fef9c3; } }
    .sp { display: inline-block; block-size: 1em; inline-size: .42em; }
    .tate ruby rt { font-size: .45em; font-weight: 400; color: #57534e; }
    .lit { border-radius: .35em; padding: .08em 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; animation: lit .5s ease-out both; }
    @keyframes lit { 0% { filter: brightness(1.6); box-shadow: 0 0 0 0 rgba(255,255,255,.9); } 60% { box-shadow: 0 0 14px 4px rgba(253,224,71,.6); } 100% { filter: none; box-shadow: none; } }
    .badge { display: inline-block; font-size: .62em; margin-bottom: .1em; }
    .tate::-webkit-scrollbar { height: 12px; }
    .tate::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 6px; }
    .paper { background: #fffdf5; border: 4px solid #fcd34d; border-radius: 22px; box-shadow: 0 6px 0 rgba(0,0,0,.18); }
    .bubble { position: relative; background: #fff; border: 3px solid #fbbf24; border-radius: 18px; }
    .night { background: radial-gradient(ellipse at 70% 10%, #24346b 0%, #141c3f 45%, #0b1029 100%); }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#fde68a;font-weight:bold;">じゅんび ちゅう…</div>
  </div>

  <!-- おはなしの データと 絵は GitHub Pages から読みこみます（このファイルを短くするため） -->
  <script>
    (function () {
      var h = location.hostname;
      var local = location.protocol === 'file:' || /github\.io$/.test(h) || h === 'localhost' || h === '127.0.0.1';
      window.MONO_BASE = local ? '' : 'https://zku0395-ops.github.io/hori/monogatari/';
      var V = '1';
      var load = function (f) {
        return new Promise(function (ok, ng) {
          var s = document.createElement('script');
          s.src = window.MONO_BASE + f + '?v=' + V;
          s.onload = ok; s.onerror = function () { ng(new Error(f)); };
          document.head.appendChild(s);
        });
      };
      window.MONO_READY = load('data/monogatari.js');
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const APP_VERSION = '0.5.1';
    const BASE = window.MONO_BASE;
    const IMG = BASE + 'img/';

    // =====================================================================
    //  1. 小さな道具
    // =====================================================================
    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const nowStr = () => {
      const d = new Date(), p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const norm = (t) => String(t || '').replace(/[\s　、。「」！？!?]/g, '');
    const safeStore = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
    };
    const downloadText = (name, text, type) => {
      const blob = new Blob([text], { type: type || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    };

    // =====================================================================
    //  2. こえ と おと
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });

    const Speech = {
      rate: 0.8, pitch: 1.05, voice: null,
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(String(text));
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = this.pitch;
          let done = false;
          const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
          u.onend = end; u.onerror = end;
          // 声が出ない端末でも先へ進めるように、長さに合わせて待つ
          setTimeout(end, 1500 + String(text).length * 230 / this.rate);
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() {
        try { this.ok && window.speechSynthesis.cancel(); } catch (e) {}
        this.tok++; if (this.audio) { try { this.audio.pause(); } catch (e) {} this.audio = null; }
      },
      // ピカリせんせいの こえ・よみきかせ（Gemini）。ぶんを「。」ごとに わけて こえを つくり、じゅんに ながす。
      // できた こえは この たんまつ（IndexedDB）にも おぼえて おく。
      // こえが 6びょうで まにあわない・つかえない・なまえが はいる ぶんは、ブラウザの こえで よむ
      gemini: false, gvoice: 'Sulafat', avoid: '', tok: 0, audio: null, cache: new Map(), off: false, WAIT: 6000,
      clean(t) { return String(t || '').replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '').replace(/ {2,}/g, ' '); },
      splitText(text) {
        return this.clean(text).split(/(?<=[。！？!?]」?)(?!」)\s*/).map(t => t.trim()).filter(t => /[ぁ-んァ-ヶ一-鿿a-zA-Z0-9]/.test(t));
      },
      useGemini(t) { return this.gemini && !this.off && HAS_GAS && t && !(this.avoid && t.includes(this.avoid)); },
      // 1つの ぶんの こえ（objectURL）。なければ サーバーに たのむ（おなじ ぶんを 2かい たのまない）
      voiceUrl(t) {
        const key = 'v2|' + this.gvoice + '|' + t; // v2：まちがった こえ（ほかの 詩など）が はいった まえの こえは つかわない
        if (this.cache.has(key)) return this.cache.get(key);
        const pr = (async () => {
          const blob = await VoiceDB.get(key);
          if (blob) return URL.createObjectURL(blob);
          const r = await gas('getVoice', t, this.gvoice);
          if (!r || !r.ok) {
            if (r && (r.reason === 'nokey' || r.reason === 'pause')) this.off = true; // APIキーが ない・つかいすぎ：この あいだは ブラウザの こえ
            throw new Error((r && r.reason) || 'voice');
          }
          const bin = atob(r.wav), u8 = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
          const b = new Blob([u8], { type: 'audio/wav' });
          VoiceDB.put(key, b);
          return URL.createObjectURL(b);
        })();
        pr.catch(() => { if (this.cache.get(key) === pr) this.cache.delete(key); });
        this.cache.set(key, pr);
        return pr;
      },
      // つぎに よむ ぶんを さきに たのんで おく
      prefetch(text) { if (this.useGemini(text)) this.voiceUrl(text).catch(() => {}); },
      // whole が true の ときは、ぶんを わけずに 1つの こえに する（おはなしの 1行）
      sayVoice(text, onEnd, whole) {
        text = this.clean(text);
        const parts = whole ? [String(text || '').trim()].filter(Boolean) : this.splitText(text);
        if (!parts.some(t => this.useGemini(t))) { this.stop(); this.say(text, onEnd); return; }
        this.stop();
        const tok = ++this.tok;
        let done = false;
        const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
        const urls = parts.map(() => null);
        const want = (i) => { if (i < parts.length && !urls[i] && this.useGemini(parts[i])) urls[i] = this.voiceUrl(parts[i]); };
        want(0); want(1);
        const next = (i) => {
          if (tok !== this.tok) return;
          if (i >= parts.length) { end(); return; }
          want(i + 1);
          const t = parts[i];
          const browser = () => { if (tok === this.tok) this.say(t, () => { if (tok === this.tok) next(i + 1); }); };
          if (!urls[i]) { browser(); return; }
          let timedOut = false;
          const timer = setTimeout(() => { timedOut = true; browser(); }, this.WAIT);
          urls[i].then(url => {
            clearTimeout(timer);
            if (timedOut || tok !== this.tok) return;
            try {
              const a = new Audio(url); this.audio = a;
              a.playbackRate = Math.max(0.5, Math.min(1.6, (this.rate || 0.8) / 0.8));
              a.onended = () => { if (this.audio === a) this.audio = null; next(i + 1); };
              a.onerror = () => { if (this.audio === a) this.audio = null; browser(); };
              const p = a.play(); if (p && p.catch) p.catch(() => browser());
            } catch (e) { browser(); }
          }).catch(() => { clearTimeout(timer); if (!timedOut) browser(); });
        };
        next(0);
      },
    };
    // Gemini の こえを この たんまつに おぼえて おく（ひらきなおしても すぐ でる）
    const VoiceDB = {
      db: null,
      open() {
        if (this.db) return this.db;
        this.db = new Promise((ok, ng) => {
          try {
            const r = indexedDB.open('monogatari_voice', 1);
            r.onupgradeneeded = () => r.result.createObjectStore('v');
            r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
          } catch (e) { ng(e); }
        });
        return this.db;
      },
      async get(k) { try { const db = await this.open(); return await new Promise(ok => { const q = db.transaction('v').objectStore('v').get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } },
      async put(k, v) { try { const db = await this.open(); db.transaction('v', 'readwrite').objectStore('v').put(v, k); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }

    // このアプリのための オリジナルの おと
    const Sound = {
      on: true, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      tone(freq, at, dur, type = 'sine', vol = 0.06) {
        const c = this.get(); if (!c || !this.on) return;
        const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      seikai() { [[784, 0], [988, .09], [1319, .18]].forEach(([f, t]) => this.tone(f, t, .16, 'triangle', .08)); this.tone(1568, .3, .4, 'sine', .08); },
      kira() { [1319, 1568, 1976, 2637].forEach((f, i) => this.tone(f, i * .06, .2, 'sine', .05)); },
      fanfare() {
        [[523, 0], [659, .14], [784, .28], [1047, .42], [988, .7], [1047, .84], [1319, 1.0]].forEach(([f, t]) => this.tone(f, t, .18, 'triangle', .07));
        [262, 330, 392, 523].forEach(f => this.tone(f, 1.0, 1.0, 'sine', .06));
      },
      retry() { this.tone(330, 0, .12, 'sine', .06); this.tone(294, .11, .18, 'sine', .06); }, // まちがえた とき（小さな おと）
      tap() { this.tone(880, 0, .05, 'triangle', .04); },
    };

    // =====================================================================
    //  3. データ（data/monogatari.js から）
    // =====================================================================
    let D = null, CAT = {};
    const lineSpeech = (nodes) => D.plain(nodes, true).replace(/〜/g, 'ー');
    // おはなしを よみやすい 形に して おく（行ごとの ノード・タグの いちらん）
    const prepared = new Map();
    function prep(story) {
      if (prepared.has(story.id)) return prepared.get(story.id);
      const lines = story.lines.map(l => D.parse(l));
      const spans = D.spans(lines);
      const p = { lines, spans, speech: lines.map(lineSpeech) };
      prepared.set(story.id, p);
      return p;
    }
    // はってん（先生が ひらく）：ボタンが 5つ そろって いない おはなしでも、ぶんしょうに ある しゅるいは ぜんぶ 出す
    const storyButtons = (story, idx, hatten) => {
      const base = story.buttons && story.buttons.length ? story.buttons : idx < 3 ? ['itsu', 'doko', 'oto'] : D.CATS.map(c => c.id);
      if (!hatten) return base;
      const P = prep(story);
      return D.CATS.map(c => c.id).filter(id => base.includes(id) || P.spans.some(x => x.c === id));
    };
    const catBtnOrder = (ids) => D.CATS.filter(c => ids.includes(c.id));
    // さがす ことばに あう タグ
    function findSpan(P, cat, text) {
      const t = norm(text);
      const list = P.spans.filter(s => s.c === cat);
      return list.find(s => norm(s.yomi) === t || norm(s.base) === t) || list.find(s => norm(s.yomi).includes(t) || norm(s.base).includes(t))
        || P.spans.find(s => norm(s.yomi).includes(t) || norm(s.base).includes(t)) || null;
    }
    const CAT_WORD = { dare: 'せりふ', itsu: 'いつ（じかん）', doko: 'どこ（ばしょ）', kimochi: 'きもち', oto: 'おとや ようす' };

    // =====================================================================
    //  4. しんちょく（進み具合）
    // =====================================================================
    const FLAGS = ['unlockAll', 'hatten'];
    const newProgress = () => ({ v: 1, t: 0, kakera: 0, cleared: {}, forest: [], resume: null, unlockAll: false, hatten: false });
    function parseProgress(s) {
      let p = null;
      try { p = typeof s === 'string' ? (s ? JSON.parse(s) : null) : s; } catch (e) { p = null; }
      const q = { ...newProgress(), ...(p || {}) };
      if (!q.cleared || typeof q.cleared !== 'object') q.cleared = {};
      if (!Array.isArray(q.forest)) q.forest = [];
      q.kakera = Number(q.kakera) || 0;
      return q;
    }
    const storyOpen = (p, i) => i === 0 || !!p.unlockAll || !!p.cleared[D.STORIES[i - 1].id];
    const currentIndex = (p) => {
      const i = D.STORIES.findIndex((s, k) => storyOpen(p, k) && !p.cleared[s.id]);
      return i >= 0 ? i : D.STORIES.length - 1;
    };
    const clearedCount = (p) => D.STORIES.filter(s => p.cleared[s.id]).length;

    // =====================================================================
    //  5. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const LOG_HEADER = ['日時', 'なまえ', 'おはなし', 'だいめい', 'しゅるい', 'もんだい', 'こたえ', 'けっか', 'まちがい', 'ヒント', 'えらんだ こたえ', 'びょう', 'ID'];
    const DEFAULT_SETTINGS = { rate: 0.8, font: 1, quiz: true, sound: true, tts: true, voice: 'Sulafat' };
    const VOICES = [['Sulafat', 'あたたかい'], ['Leda', 'わかわかしい'], ['Aoede', 'さわやか'], ['Achird', 'したしみやすい'], ['Callirrhoe', 'おだやか'], ['Despina', 'なめらか']];
    const CAT_NAMES = { dare: '①だれが いった', itsu: '②いつ', doko: '③どこ', kimochi: '④きもち', oto: '⑤オノマトペ' };

    // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
    const emptyStu = () => ({ count: 0, ok: 0, miss: 0, hint: 0, done: 0, last: '', stories: {}, cats: {}, sc: {}, misses: [] });
    function aggregate(rows) {
      const students = {}, classCats = {};
      const add = (m, k, ok, miss, hint) => { const a = m[k] || (m[k] = [0, 0, 0, 0]); a[0]++; a[1] += ok; a[2] += miss; a[3] += hint; };
      rows.forEach(r => {
        const name = String(r[1] || '').trim(); if (!name) return;
        const s = students[name] || (students[name] = emptyStu());
        const when = String(r[0]).slice(0, 16);
        const day = when.slice(0, 10);
        if (day > s.last) s.last = day;
        const cat = String(r[4]);
        if (cat === 'おわり') { s.done++; return; }
        const st = String(r[2]), ok = r[7] === '○' ? 1 : 0, miss = Number(r[8]) || 0, hint = Number(r[9]) || 0;
        s.count++; s.ok += ok; s.miss += miss; s.hint += hint;
        add(s.stories, st, ok, miss, hint); add(s.cats, cat, ok, miss, hint); add(classCats, cat, ok, miss, hint);
        add(s.sc, st + '|' + cat, ok, miss, hint);
        if (!ok) s.misses.push([when, st, cat, String(r[5]), String(r[6]), String(r[10] || ''), hint]);
      });
      Object.values(students).forEach(s => { s.misses = s.misses.slice(-15).reverse(); });
      return { students, classCats };
    }

    const Local = {
      key: 'monogatari_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}
        this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: { ...DEFAULT_SETTINGS } };
        return this.mem;
      },
      save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
    };

    const PENDING_KEY = 'monogatari_pending_v1';
    const recRow = (stamp, name, r) => [stamp, name, r.story, r.title, r.cat, r.q, r.a, r.result, r.miss, r.hint, r.picks, r.secs, r.id];
    const api = {
      async init() {
        if (HAS_GAS) return gas('getInitData');
        const d = Local.data();
        return { students: d.roster, settings: { ...DEFAULT_SETTINGS, ...d.settings }, demo: true };
      },
      async student(name) {
        if (HAS_GAS) return gas('getStudent', name);
        return Local.data().progress[name] || '';
      },
      async sendOne(p) {
        if (HAS_GAS) return gas('saveResult', p);
        const d = Local.data();
        const old = parseProgress(d.progress[p.name]);
        const neu = parseProgress(p.progress);
        if (neu.t >= old.t) d.progress[p.name] = p.progress;
        const ids = new Set(d.log.map(r => r[12]));
        p.records.forEach(r => { if (!ids.has(r.id)) d.log.push(recRow(p.stamp, p.name, r)); });
        Local.save();
        return { ok: true };
      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす
      readQueue() { try { return JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) { return []; } },
      async save(payload) {
        const queue = api.readQueue().filter(q => !(q.name === payload.name && !q.records.length));
        queue.push({ ...payload, qid: uid() });
        safeStore.set(PENDING_KEY, JSON.stringify(queue));
        return api.flush();
      },
      pending() { return api.readQueue().length; },
      flushing: false,
      async flush() {
        if (api.flushing) return;
        api.flushing = true;
        try {
          for (let q = api.readQueue()[0]; q; q = api.readQueue()[0]) {
            await api.sendOne(q);
            safeStore.set(PENDING_KEY, JSON.stringify(api.readQueue().filter(x => x.qid !== q.qid)));
          }
        } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
        finally { api.flushing = false; }

      async teacher(pin) {
        if (HAS_GAS) return gas('getTeacherData', pin);
        const d = Local.data();
        if (String(pin) !== String(d.pin)) return { ok: false };

        return {
          ok: true, isDefaultPin: d.pin === '1234', demo: true, settings: { ...DEFAULT_SETTINGS, ...d.settings },
          students: d.roster.map(n => ({ ...emptyStu(), ...(agg.students[n] || {}), name: n, progress: d.progress[n] || '' })),
          classCats: agg.classCats,
        };
      },
      async setFlag(pin, name, key, val) {
        if (HAS_GAS) return gas('setFlag', pin, name, key, val);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p[key] = !!val; p.t = Date.now(); p.flagT = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async saveSettings(pin, s) {
        if (HAS_GAS) return gas('saveSettings', pin, s);
        const d = Local.data(); const { newPin, ...rest } = s;

      },
      async ttsStatus(pin) {
        if (HAS_GAS) return gas('getTtsStatus', pin);

      },
      async logRows(pin) {
        if (HAS_GAS) return gas('getLogRows', pin);

      },
      async backup(pin) {
        if (HAS_GAS) return gas('getBackup', pin);

      },
      async restore(pin, data) {
        if (HAS_GAS) return gas('restoreBackup', pin, data);
        if (!data || data.app !== 'monogatari') return { ok: false };
        const d = Local.data(); (data.roster || []).forEach(([n, p]) => { if (!d.roster.includes(n)) d.roster.push(n); d.progress[n] = p; }); Local.save(); return { ok: true };

    // ---- たて書きの ぶんしょう ----
    function renderNodes(nodes, ctx, key = 'n') {
      return nodes.map((n, i) => {
        const k = `${key}-${i}`;
        if (n.t === 'text') return n.s.split(/( )/).map((s, j) => s === ' ' ? <span key={`${k}-${j}`} className="sp" /> : s ? <span key={`${k}-${j}`}>{s}</span> : null);
        if (n.t === 'ruby') return <ruby key={k}>{n.b}<rt>{n.r}</rt></ruby>;
        const on = ctx.isLit(n);
        const inner = renderNodes(n.kids, ctx, k);
        if (!on) return <span key={k}>{inner}</span>;
        const c = CAT[n.c];
        let bg = c.bg, bd = c.color;
        if (n.c === 'dare') { const pi = Math.max(0, (n.n || 1) - 1); bg = D.PERSON_BG[pi] || bg; bd = D.PERSON_BORDER[pi] || bd; }
        const person = n.c === 'dare' && n.k === 's' && ctx.story.people ? ctx.story.people[(n.n || 1) - 1] : null;
        const showBadge = person && /^「/.test(D.plain(n.kids));
        return (
          <span key={k} className="lit" onClick={(e) => { if (ctx.onSpan) { e.stopPropagation(); ctx.onSpan(n); } }}
            style={{ background: bg, boxShadow: `inset 0 0 0 2px ${bd}`, animationDelay: `${ctx.delay(n)}s`, color: '#1c1917' }}>
            {showBadge && <span className="badge">{person.e}</span>}{inner}
          </span>
        );
      });
    }

    // ---- ② さがす：ことばを えらべる ように 1行を わける ----
    //   その しゅるいの タグ（こたえ）は 1つの かたまり。ほかは 分かち書きの すきまで わける
    const PUNCT_ONLY = /^[、。「」！？!?ー〜…・\s]*$/;
    function tokenize(nodes, cat) {
      const toks = []; let cur = null;
      const brk = () => { cur = null; };
      const push = (a) => { if (!cur) { cur = { atoms: [], ans: null }; toks.push(cur); } cur.atoms.push(a); };
      const walk = (ns) => ns.forEach(n => {
        if (n.t === 'tag' && n.c === cat) { brk(); toks.push({ atoms: n.kids, ans: n }); brk(); return; }
        if (n.t === 'tag') { walk(n.kids); return; }
        if (n.t === 'ruby') { push(n); return; }
        n.s.split(/( )/).forEach(p => {
          if (p === ' ') { brk(); toks.push({ space: true }); }
          else if (p) {
            // 「、」「。」などは まえの ことばに くっつける（それだけを えらばない ように）
            if (PUNCT_ONLY.test(p) && !cur && toks.length && !toks[toks.length - 1].space) toks[toks.length - 1].tail = (toks[toks.length - 1].tail || '') + p;
            else push({ t: 'text', s: p });
          }
        });
      });
      walk(nodes);
      toks.forEach(t => { if (!t.space) t.pick = !!t.ans || !PUNCT_ONLY.test(D.plain(t.atoms)); });
      return toks;
    }
    // ① だれが いった で、こたえ では ない ところの 登場人物の 名前は「ちがう」に しない（えらんでも まちがいに かぞえない）
    const softName = (story, cat, t) => cat === 'dare' && !t.ans && !t.space && (story.people || []).some(p => D.plain(t.atoms).startsWith(p.n));
    const tokText = (t, yomi) => D.plain(t.atoms, yomi);
    const plainNodes = (ns, key) => ns.map((n, i) => n.t === 'text' ? n.s.split(/( )/).map((s, j) => s === ' ' ? <span key={`${key}-${i}-${j}`} className="sp" /> : s ? <span key={`${key}-${i}-${j}`}>{s}</span> : null)
      : n.t === 'ruby' ? <ruby key={`${key}-${i}`}>{n.b}<rt>{n.r}</rt></ruby> : <span key={`${key}-${i}`}>{plainNodes(n.kids, `${key}-${i}`)}</span>);
    function catStyle(n, story) {
      const c = CAT[n.c];
      let bg = c.bg, bd = c.color;
      if (n.c === 'dare') { const pi = Math.max(0, (n.n || 1) - 1); bg = D.PERSON_BG[pi] || bg; bd = D.PERSON_BORDER[pi] || bd; }
      return { background: bg, boxShadow: `inset 0 0 0 2px ${bd}`, color: '#1c1917' };
    }
    function renderFindLine(ns, li, find, story) {
      const toks = tokenize(ns, find.cat);
      return toks.map((t, ti) => {
        if (t.space) return <span key={ti} className="sp" />;
        const key = `${li}-${ti}`;
        const on = find.sel.includes(key);
        const inner = <>{plainNodes(t.atoms, key)}</>;
        let style = {}, cls = 'tok', mark = null;
        if (find.revealed) {
          if (t.ans) {
            style = catStyle(t.ans, story); cls += ' lit';
            const person = t.ans.c === 'dare' && t.ans.k === 's' && story.people ? story.people[(t.ans.n || 1) - 1] : null;
            if (person && /^「/.test(D.plain(t.ans.kids))) mark = <span className="badge">{person.e}</span>;
            if (on) cls += ' got';
          } else if (on && softName(story, find.cat, t)) cls += ' picked';
          else if (on) cls += ' wrongpick';
        } else if (on) cls += ' picked';
        return (
          <span key={ti}>
            <span className={cls} style={style} onClick={(e) => { e.stopPropagation(); if (t.pick) find.onTok(key, t); }}>
              {mark}{inner}{find.revealed && t.ans && on ? <span className="okmark">⭕</span> : null}
            </span>{t.tail || ''}
          </span>
        );
      });
    }
    function findResult(P, cat, sel, story) {
      let ans = 0, got = 0, wrong = 0; const picks = [], answers = [];
      P.lines.forEach((ns, li) => tokenize(ns, cat).forEach((t, ti) => {
        if (t.space) return;
        const on = sel.includes(`${li}-${ti}`);
        if (t.ans) { ans++; answers.push(tokText(t, true)); if (on) got++; }
        else if (on && !softName(story, cat, t)) wrong++;
        if (on) picks.push(tokText(t, true));
      }));
      return { ans, got, wrong, missed: ans - got, picks, answers };
    }

    function StoryText({ story, P, reading, cursor, litCat, hintLine, hintLines, hintNode, find, onLine, onSpan, fontScale }) {
      const box = useRef(null), refs = useRef([]);
      const [h, setH] = useState(400);
      const [w, setW] = useState(800);
      useEffect(() => {
        const el = box.current; if (!el) return;
        const fit = () => { setH(el.clientHeight); setW(el.clientWidth); };
        fit();
        const ro = new ResizeObserver(fit); ro.observe(el);
        return () => ro.disconnect();
      }, []);
      // いちばん ながい 行が 1れつに おさまる 大きさ
      const maxLen = useMemo(() => Math.max(...P.lines.map(ns => { const t = D.plain(ns); return t.replace(/ /g, '').length + (t.match(/ /g) || []).length * 0.42; })), [P]);
      // 1行の はば は およそ 2.1文字ぶん（ふりがな・すきま を ふくむ）。はいりきらない ときは よこに スクロール
      const fs = Math.max(16, Math.min((h - 44) / (maxLen + 1.6), (w - 40) / (P.lines.length * 2.1), 34 * (fontScale || 1)));
      useEffect(() => { const el = refs.current[reading ?? hintLine ?? cursor]; if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' }); }, [reading, hintLine, cursor]);
      const order = useMemo(() => {
        const m = new Map(); let i = 0;
        P.spans.forEach(s => { if (s.c === litCat) m.set(s.node, i++); });
        return m;
      }, [P, litCat]);
      const ctx = {
        story,
        isLit: (n) => (litCat && n.c === litCat) || n === hintNode,
        delay: (n) => (order.has(n) ? Math.min(order.get(n) * 0.25, 4) : 0),
        onSpan,
      };
      return (
        <div ref={box} className={`tate w-full h-full px-3 py-3 ${find && find.cat && !find.revealed ? 'finding' : ''}`} style={{ fontSize: fs }}>
          {P.lines.map((ns, i) => (
            <div key={i} ref={el => { refs.current[i] = el; }} onClick={() => onLine && onLine(i)}
              className={`gyou ${reading === i ? 'reading' : cursor === i ? 'cursor' : ''} ${(hintLine === i || (hintLines && hintLines.includes(i))) && reading !== i ? 'hintline' : ''}`}>
              {find && find.cat ? renderFindLine(ns, i, find, story) : renderNodes(ns, ctx, `l${i}`)}
            </div>
          ))}
        </div>
      );
    }

    function KakeraFly({ n }) {
      return <div className="kakerafly absolute left-1/2 top-1/3 -translate-x-1/2 text-4xl font-bold text-amber-300 pointer-events-none z-30" style={{ textShadow: '0 0 12px #fde047' }}>✨ ほしの かけら +{n}</div>;
    }

    // =====================================================================
    //  8. おはなしの がめん（① きく → ② さがす → ③ たしかめ）
    //   うえの ①②③ を おすと、なんかいでも もどって やりなおせる
    // =====================================================================
    const STEPS = [[1, '① きく', '👂'], [2, '② さがす', '🔦'], [3, '③ たしかめ', '✅']];
    const PRAISE = ['すごい！ よく みつけたね。', 'せいかい！ ぴかっと ひかったね。', 'そのとおり！ よく よめて いるね。', 'やったね！ だいせいかい。'];
    const FIND_ASK = {
      dare: 'だれが いったかな。せりふ（「 」の ことば）と、いった ひとの なまえを さがして さわってね。',
      itsu: 'いつ を あらわす ことばは どこかな。ぶんしょうを さわって えらんでね。',
      doko: 'どこ を あらわす ことばは どこかな。ばしょの ことばを さわって えらんでね。',
      kimochi: 'きもちを あらわす ことばは どこかな。ぶんしょうを さわって えらんでね。',
      oto: 'オノマトペは どこかな。おとや ようすを あらわす ことばを さわって えらんでね。',
    };
    const READ_MODE_KEY = 'monogatari_readmode';
    const VOICE_KEY = 'monogatari_voice_onoff';
    // よみあげ OFF の ときに 1行を ひからせて おく じかん（もじの かず と よみあげの はやさ から）
    const silentMs = (text, rate) => Math.round((900 + norm(text).length * 420) * 0.8 / (rate || 0.8));

    function StoryScreen({ story, index, settings, hatten, startStep, onRecord, onKakera, onStep, onDone, onExit, onLock }) {
      const P = useMemo(() => prep(story), [story]);
      const btns = useMemo(() => catBtnOrder(storyButtons(story, index, hatten)), [story, index, hatten]);
      const quizOn = settings.quiz && story.quiz && story.quiz.length > 0;
      const steps = STEPS.filter(s => s[0] < 3 || quizOn);
      const lastStep = quizOn ? 3 : 2;
      const [step, setStep] = useState(Math.min(startStep || 1, lastStep));
      const [maxStep, setMaxStep] = useState(Math.min(startStep || 1, lastStep));
      const [round, setRound] = useState(0); // おなじ だんかいを もういちど はじめる ときに ふやす
      const [msg, setMsg] = useState('');
      const [mood, setMood] = useState('normal');
      const [reading, setReading] = useState(null);
      const [readDone, setReadDone] = useState(false);
      const [mode, setMode] = useState(safeStore.get(READ_MODE_KEY) === 'line' ? 'line' : 'all');
      const [cursor, setCursor] = useState(0);
      const readTok = useRef(0);
      const silentTimer = useRef(null);
      // よみあげ ON／OFF（OFF でも、よむ ばしょの マーカーは うごく）。この たんまつに おぼえる
      const [voiceOn, setVoiceOn] = useState(safeStore.get(VOICE_KEY) !== 'off');
      // さがす
      const [fcat, setFcat] = useState(null);
      const [sel, setSel] = useState({});       // しゅるいごとの えらんだ ことば
      const [revealed, setRevealed] = useState({}); // しゅるいごとに たしかめた か
      const [tries, setTries] = useState({});       // しゅるいごとの やりなおしの かず（2かいめから こたえの ある 行を ひからせる）
      const [fly, setFly] = useState(0);
      // たしかめ
      const [qi, setQi] = useState(0);
      const [gone, setGone] = useState([]);
      const [miss, setMiss] = useState(0);
      const [hint, setHint] = useState(0);
      const [solved, setSolved] = useState(false);
      const [shakeKey, setShakeKey] = useState(null);
      const picks = useRef([]); const qStart = useRef(Date.now()); const fStart = useRef(Date.now());
      const q = quizOn && step === 3 ? story.quiz[qi] : null;
      const choices = useMemo(() => q ? shuffle([q.a, ...q.ng.map(x => Array.isArray(x) ? x[0] : x)]) : [], [qi, q, round]);
      const target = useMemo(() => q ? findSpan(P, q.c, q.find || q.a) : null, [q, P]);

      const speak = (t, m = 'normal') => { setMsg(t); setMood(m); Speech.sayVoice(t); };
      const stopRead = () => { readTok.current++; Speech.stop(); clearTimeout(silentTimer.current); setReading(null); };

      // 1行 よむ（そのあと つぎへ すすむ ときは onEnd）
      const readLine = (i, onEnd) => {
        const tok = ++readTok.current;
        setReading(i);
        clearTimeout(silentTimer.current);
        if (!voiceOn) {
          // こえは 出さずに、1行ぶんの じかん だけ マーカーを ひからせる
          Speech.stop();
          silentTimer.current = setTimeout(() => {
            if (tok !== readTok.current) return;
            if (onEnd) onEnd(); else setReading(null);
          }, silentMs(P.speech[i], settings.rate));
          return;
        }
        Speech.prefetch(P.speech[i + 1]);
        Speech.sayVoice(P.speech[i], () => {
          if (tok !== readTok.current) return;
          if (onEnd) onEnd(); else setReading(null);
        }, true);
      };
      const finishRead = () => { setReading(null); setReadDone(true); speak('さいごまで よんだね。つぎは ② さがす だよ。「つぎへ」を おしてね。', 'smile'); };
      const readFrom = (i) => {
        const go = (k) => {
          if (k >= P.lines.length) { finishRead(); return; }
          setCursor(k);
          readLine(k, () => setTimeout(() => go(k + 1), 250));
        };
        go(i);
      };
      // 1ぎょうずつ：その 行だけ よむ
      const readOne = (i) => {
        const k = Math.max(0, Math.min(P.lines.length - 1, i));
        setCursor(k);
        if (!voiceOn) {
          // よみあげ OFF：つぎを おすまで その 行を ひからせて おく（じぶんの ペースで よめる）
          readTok.current++; clearTimeout(silentTimer.current); Speech.stop(); setReading(k);
          if (k === P.lines.length - 1) { setReadDone(true); setMsg('さいごの ぎょうまで よんだね。「つぎへ」で ② さがす に すすもう。'); setMood('smile'); }
          return;
        }
        readLine(k, () => { setReading(null); if (k === P.lines.length - 1) { setReadDone(true); setMsg('さいごの ぎょうまで よんだね。「つぎへ」で ② さがす に すすもう。'); setMood('smile'); } });
      };
      const toggleVoice = () => {
        const v = !voiceOn;
        stopRead(); setVoiceOn(v); safeStore.set(VOICE_KEY, v ? 'on' : 'off');
        speak(v ? 'よみあげを するよ。' : 'よみあげは おやすみ。ひかって いる ぎょうを、こえに だして よんでみよう。');
      };
      const pickMode = (m) => {
        stopRead(); setMode(m); safeStore.set(READ_MODE_KEY, m);
        speak(m === 'line' ? '1ぎょうずつ よむよ。「つぎの ぎょう」を おすと、つぎの ぎょうを よむよ。' : 'さいごまで とおして よむよ。🔊 よんで を おしてね。');
      };

      const goStep = (n) => {
        if (n < 1 || n > lastStep) return;
        stopRead();
        if (n === step) setRound(r => r + 1); else setStep(n);
        setMaxStep(m => Math.max(m, n));
      };

      useEffect(() => {
        onStep(step);
        stopRead();
        if (step === 1) {
          setCursor(0);
          speak(mode === 'line'
            ? `「${story.title}」の おはなしだよ。「🔊 この ぎょう」を おすと、1ぎょうずつ よむよ。`
            : `「${story.title}」の おはなしだよ。🔊 よんで を おしてね。ぎょうを さわると、その ぎょうだけ よむよ。`);
        }
        if (step === 2) {
          setFcat(null); setSel({}); setRevealed({}); setTries({});
          speak('したの ボタンを えらんでね。こたえが どこに かいて あるか、じぶんで さがして ぶんしょうを さわろう。');
        }
        if (step === 3) { setQi(0); askQ(0); }
        return () => stopRead();
      }, [step, round]);

      // ---- ② さがす ----
      const curSel = fcat ? (sel[fcat] || []) : [];
      const isRevealed = fcat ? !!revealed[fcat] : false;
      const pressCat = (c) => {
        stopRead(); Sound.tap();
        setFcat(c.id); fStart.current = Date.now();
        if (revealed[c.id]) { speak((story.explain && story.explain[c.id]) || `${c.n} を あらわす ことばに いろが ついて いるよ。`); return; }
        speak(FIND_ASK[c.id] + 'えらんだら「🔍 たしかめる」を おしてね。');
      };
      const tapTok = (key, t) => {
        if (!fcat || isRevealed) return;
        Sound.tap();
        const cur = sel[fcat] || [];
        const on = cur.includes(key);
        setSel({ ...sel, [fcat]: on ? cur.filter(k => k !== key) : [...cur, key] });
        if (!on && voiceOn) { Speech.stop(); Speech.sayVoice(tokText(t, true), null, true); }
      };
      const check = () => {
        if (!fcat || isRevealed) return;
        const c = CAT[fcat];
        const r = findResult(P, fcat, curSel, story);
        setRevealed({ ...revealed, [fcat]: true });
        const ex = (story.explain && story.explain[fcat]) || '';
        let t;
        if (!curSel.length) t = `こたえは いろの ついた ところだよ。${ex}`;
        else if (r.missed === 0 && r.wrong === 0) t = `ぜんぶ みつけたね！ すごい！ ${ex}`;
        else {
          t = `${r.got}こ みつけたね。`;
          if (r.missed) t += `ほかにも ${r.missed}こ あったよ。`;
          if (r.wrong) t += `${CAT_WORD[fcat]} では ない ことばも えらんで いたね。`;
          t += `いろが ついた ところを みてね。${ex}`;
        }
        if (r.got > 0) { Sound.seikai(); setFly(f => f + 1); onKakera(1); } else Sound.kira();
        speak(t, r.got > 0 ? 'smile' : 'surprise');
        onRecord({
          id: uid(), story: story.id, title: story.title, cat: CAT_NAMES[fcat], q: 'さがす（ぶんしょうから さがす）', a: r.answers.join('・'),
          result: r.missed === 0 && r.wrong === 0 ? '○' : '△', miss: r.missed + r.wrong, hint: 0, picks: r.picks.join('・') || '（えらばない）',
          secs: Math.round((Date.now() - fStart.current) / 100) / 10,
        });
      };
      const redo = () => {
        if (!fcat) return;
        const n = { ...revealed }; delete n[fcat];
        setRevealed(n); setSel({ ...sel, [fcat]: [] }); fStart.current = Date.now();
        setTries({ ...tries, [fcat]: (tries[fcat] || 0) + 1 });
        speak('もういちど さがしてみよう。こたえは、ひかって いる ぎょうの なかに あるよ。' + FIND_ASK[fcat]);
      };
      const allChecked = btns.every(c => revealed[c.id]);

      // ---- ③ たしかめ ----
      function askQ(i) {
        const qq = story.quiz[i];
        setGone([]); setMiss(0); setHint(0); setSolved(false); picks.current = []; qStart.current = Date.now();
        speak(qq.q, 'normal');
      }
      const giveHint = (lv) => {
        const level = Math.min(3, Math.max(hint + 1, lv || 0));
        setHint(level);
        const c = CAT[q.c];
        if (level === 1) speak(q.h || c.hint);
        if (level === 2) speak('ひかって いる ぎょうを よく みてね。');
        if (level === 3) speak(`いろが ついた ところを みてね。「${q.a}」と かいて あるね。`);
      };
      const wrongMsg = (w) => {
        const m = q.ng.find(x => Array.isArray(x) && x[0] === w);
        if (m) return m[1];
        const s = P.spans.find(x => norm(x.yomi) === norm(w) || norm(x.base) === norm(w));
        if (s && s.c !== q.c) return `「${w}」は ${CAT_WORD[s.c]} を あらわす ことばだよ。もんだいを もういちど よんでみよう。`;
        if (s) return `「${w}」も ぶんしょうに あるね。でも、もんだいを もういちど よんでみよう。`;
        return `「${w}」は、ぶんしょうの どこにも ないよ。もういちど みてみよう。`;
      };
      const choose = (w) => {
        if (solved || gone.includes(w)) return;
        picks.current.push(w);
        if (w === q.a) {
          setSolved(true);
          Sound.seikai(); setFly(f => f + 1); onKakera(1);
          speak(pick(PRAISE), 'smile');
          onRecord({
            id: uid(), story: story.id, title: story.title, cat: CAT_NAMES[q.c], q: q.q, a: q.a,
            result: miss === 0 && hint === 0 ? '○' : '△', miss, hint, picks: picks.current.join('→'), secs: Math.round((Date.now() - qStart.current) / 100) / 10,
          });
          return;
        }
        Sound.retry();
        const m = miss + 1;
        setMiss(m); setGone([...gone, w]); setShakeKey(w + m);
        speak(wrongMsg(w), 'surprise');
        if (m >= 3) setTimeout(() => giveHint(3), 1800);
      };
      const nextQ = () => {
        if (qi + 1 < story.quiz.length) { setQi(qi + 1); askQ(qi + 1); }
        else onDone();
      };
      const goNext = () => {
        if (step === 1) { goStep(2); return; }
        if (step === 2) {
          if (!allChecked) { speak('まだ たしかめて いない ボタンが あるよ。ぜんぶ やってみよう。', 'surprise'); return; }
          if (quizOn) goStep(3); else onDone();
        }
      };

      const hintLine = step === 3 && hint >= 2 && target ? target.line : null;
      const hintNode = step === 3 && (hint >= 3 || solved) && target ? target.node : null;
      // ② さがす の ヒント：やりなおしの とき、こたえの ある 行を ひからせる
      const findHintLines = useMemo(() => {
        if (step !== 2 || !fcat || revealed[fcat] || !(tries[fcat] > 0)) return null;
        const out = [];
        P.lines.forEach((ns, li) => { if (tokenize(ns, fcat).some(t => t.ans)) out.push(li); });
        return out;
      }, [step, fcat, revealed, tries, P]);
      const find = step === 2 && fcat ? { cat: fcat, sel: curSel, revealed: isRevealed, onTok: tapTok } : null;
      const BackBtn = () => step > 1 ? <Btn color="white" className="!px-3" onClick={() => goStep(step - 1)}>◀ もどる</Btn> : null;

      return (
        <div className="w-full h-full flex flex-col bg-indigo-950">
          {/* うえの バー（①②③ を おすと その だんかいへ。なんかいでも やりなおせる） */}
          <div className="flex items-center gap-3 px-3 py-2 bg-indigo-900 text-white">
            <Btn color="white" className="!text-lg !px-3 !py-1" onClick={() => { stopRead(); onExit(); }}>◀ もり</Btn>
            <div className="text-xl font-bold truncate flex-1">📖 {story.title}</div>
            <div className="flex gap-1">
              {steps.map(([n, label, e]) => {
                const can = n <= maxStep;
                return (
                  <button key={n} disabled={!can} onClick={() => { Sound.tap(); goStep(n); }}
                    className={`btn3d border-2 px-3 py-1 rounded-full text-lg font-bold ${step === n ? 'bg-amber-300 text-amber-950 border-amber-600' : can ? 'bg-emerald-400 text-emerald-950 border-emerald-700' : 'bg-indigo-700 text-indigo-300 border-indigo-800'}`}>
                    {n < maxStep && step !== n ? '✔' : e} {label}{step === n && n < maxStep ? ' 🔁' : ''}
                  </button>
                );
              })}
            </div>
            <button onClick={onLock} className="text-xl opacity-60 px-2">🔒</button>
          </div>

          {/* まんなか：ぶんしょう と ピカリせんせい */}
          <div className="flex-1 min-h-0 flex gap-3 p-3">
            <div className="w-56 shrink-0 flex flex-col gap-2 min-h-0">
              <StoryPic story={story} className="w-full h-36 shrink-0" />
              <div className="flex-1 min-h-0 flex flex-col items-center justify-end gap-1">
                {msg && <Bubble text={msg} onSay={() => Speech.sayVoice(msg)} className="w-full text-base max-h-48 overflow-y-auto" />}
                <Pikari mood={mood} size={step === 3 ? 92 : 110} onClick={() => msg && Speech.sayVoice(msg)} />
              </div>
            </div>
            <div className="paper flex-1 min-w-0 relative">
              <StoryText story={story} P={P} reading={reading} cursor={step === 1 && mode === 'line' && reading === null ? cursor : null}
                litCat={null} hintLine={hintLine} hintLines={findHintLines} hintNode={hintNode} find={find} fontScale={settings.font}
                onLine={step === 2 ? null : (i) => { Sound.tap(); stopRead(); if (step === 1 && mode === 'line') readOne(i); else readLine(i); }}
                onSpan={null} />
              {fly > 0 && <KakeraFly key={fly} n={1} />}
            </div>
          </div>

          {/* したの バー */}
          <div className="shrink-0 px-3 pb-3">
            {step === 1 && (
              <div className="flex items-center gap-3 bg-indigo-900/80 rounded-2xl p-3">
                <button onClick={toggleVoice} aria-pressed={voiceOn}
                  className={`btn3d rounded-2xl border-2 px-3 py-2 font-bold text-base leading-tight self-stretch ${voiceOn ? 'bg-sky-200 border-sky-500 text-sky-950' : 'bg-stone-200 border-stone-400 text-stone-700'}`}>
                  <div className="text-2xl">{voiceOn ? '🔊' : '🔇'}</div>よみあげ<br />{voiceOn ? 'ON' : 'OFF'}
                </button>
                <div className="flex flex-col gap-1">
                  {[['all', '📖 ぜんぶ とおして'], ['line', '☝️ 1ぎょうずつ']].map(([m, l]) => (
                    <button key={m} onClick={() => pickMode(m)} className={`rounded-xl border-2 px-3 py-1 font-bold text-base ${mode === m ? 'bg-amber-300 border-amber-600 text-amber-950' : 'bg-indigo-800 border-indigo-600 text-indigo-100'}`}>{mode === m ? '● ' : '○ '}{l}</button>
                  ))}
                </div>
                {mode === 'all' ? (
                  <>
                    <Btn color="amber" className="!text-2xl" onClick={() => { stopRead(); readFrom(0); }}>{voiceOn ? '🔊 よんで' : '▶ スタート'}</Btn>
                    <Btn color="white" onClick={stopRead} disabled={reading === null}>⏹ とめる</Btn>
                    <div className="flex-1 text-indigo-100 text-lg">{voiceOn ? 'ぎょうを さわると、その ぎょうだけ よむよ。' : 'ひかる ぎょうを、こえに だして よもう。'}</div>
                  </>
                ) : (
                  <>
                    <Btn color="white" disabled={cursor <= 0} onClick={() => { stopRead(); readOne(cursor - 1); }}>◀ まえの ぎょう</Btn>
                    <Btn color="amber" className="!text-2xl" onClick={() => { stopRead(); readOne(cursor); }}>{voiceOn ? '🔊 この ぎょう' : '👉 この ぎょう'}</Btn>
                    <Btn color="sky" className="!text-2xl" disabled={cursor >= P.lines.length - 1} glow={!readDone && reading === null && cursor < P.lines.length - 1}
                      onClick={() => { stopRead(); readOne(cursor + 1); }}>つぎの ぎょう ▶</Btn>
                    <div className="flex-1 text-indigo-100 text-lg">{cursor + 1} / {P.lines.length} ぎょう</div>
                  </>
                )}
                <Btn color="green" className="!text-2xl" glow={readDone} onClick={goNext}>つぎへ ▶</Btn>
              </div>
            )}
            {step === 2 && (
              <div className="flex items-center gap-2 bg-indigo-900/80 rounded-2xl p-3">
                <BackBtn />
                <div className="flex-1 grid gap-2" style={{ gridTemplateColumns: `repeat(${btns.length}, minmax(0,1fr))` }}>
                  {btns.map(c => (
                    <button key={c.id} onClick={() => pressCat(c)}
                      className={`btn3d rounded-2xl border-2 px-1 py-1 font-bold text-lg leading-tight relative ${fcat === c.id ? 'ring-4 ring-amber-300' : ''}`}
                      style={{ background: fcat === c.id ? c.bg : '#fff', borderColor: c.color, color: c.dark }}>
                      <div className="text-xl">{c.e}</div>
                      <div>{c.no} {c.n}</div>
                      {revealed[c.id] && <span className="absolute -top-2 -right-2 bg-emerald-500 text-white rounded-full w-7 h-7 text-base flex items-center justify-center">✔</span>}
                    </button>
                  ))}
                </div>

    const pct = (a, b) => b ? `${Math.round((a / b) * 100)}%` : '－';
    const rateColor = (a, b) => !b ? '#fff' : a / b < 0.6 ? '#fecaca' : a / b < 0.8 ? '#fef08a' : '#bbf7d0';
    function Cell({ g }) {
      if (!g) return <td className="border px-2 py-1 text-center text-stone-400">－</td>;
      return (
        <td className="border px-2 py-1 text-center" style={{ background: rateColor(g[1], g[0]) }}>
          <div className="font-bold">{pct(g[1], g[0])}</div>
          <div className="text-xs text-stone-600">{g[0]}もん ✖{g[2]} 💡{g[3]}</div>

      const l = Object.values(CAT_NAMES).filter(k => cats[k] && cats[k][0] >= 2).map(k => [k, cats[k][1] / cats[k][0]]).sort((a, b) => a[1] - b[1]);

      'よみあげを するよ。', 'よみあげは おやすみ。ひかって いる ぎょうを、こえに だして よんでみよう。',
    ];
    function allVoiceTexts() {
      const out = new Set();
      const add = (t) => Speech.splitText(t).forEach(x => out.add(x));
      FIXED_LINES.forEach(add);
      D.CATS.forEach(c => add(c.hint));
      D.STORIES.forEach(s => {
        prep(s).speech.forEach(t => t.trim() && out.add(t.trim()));
        Object.values(s.explain || {}).forEach(add);
        (s.quiz || []).forEach(q => { add(q.q); if (q.h) add(q.h); });
        add(`「${s.title}」の おはなしだよ。🔊 よんで を おしてね。ぎょうを さわると、その ぎょうだけ よむよ。`);
        add(`「${s.title}」の おはなしだよ。「🔊 この ぎょう」を おすと、1ぎょうずつ よむよ。`);
        add(`きょうは「${s.title}」を よもう。`);
      });
      return [...out];
    }

      const [tab, setTab] = useState('class');

      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [note, setNote] = useState('');

      const [prepState, setPrepState] = useState(null);
      const prepStop = useRef(false);
      const stu = data.students.find(x => x.name === sel);
      useEffect(() => { if (tab === 'set') api.ttsStatus(pin).then(setTts).catch(() => {}); }, [tab]);
      const saveS = async (patch) => {
        const ns = { ...s, ...patch }; setS(ns);
        await api.saveSettings(pin, patch); onSettings(ns); setNote('ほぞんしました');
      };
      const flag = async (name, key, val) => { await api.setFlag(pin, name, key, val); onChanged(); };
      const csv = async () => {
        const r = await api.logRows(pin); if (!r.ok) return;
        const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
        downloadText('ものがたりの もり きろく.csv', '﻿' + r.rows.map(row => row.map(esc).join(',')).join('\r\n'), 'text/csv');
      };
      const backup = async () => { const r = await api.backup(pin); if (r.ok) downloadText('ものがたりの もり バックアップ.json', JSON.stringify(r.data)); };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => { try { const r = await api.restore(pin, JSON.parse(rd.result)); setNote(r.ok ? 'ふくげんしました' : 'このアプリの バックアップでは ありません'); onChanged(); } catch (er) { setNote('よみこめませんでした'); } };
        rd.readAsText(f);
      };
      const clear = async (name) => {
        if (!confirm(name ? `${name} の きろくを けします。よろしいですか？` : '全員の きろくを けします。よろしいですか？')) return;
        await api.clear(pin, name); onChanged(); setNote('けしました');
      };
      const prepVoices = async () => {
        const list = allVoiceTexts();
        prepStop.current = false;
        let made = 0, skip = 0;
        for (let i = 0; i < list.length; i++) {
          if (prepStop.current) break;
          setPrepState({ i, n: list.length, made, skip });
          let r; try { r = await gas('getVoice', list[i], s.voice, true); } catch (e) { r = { ok: false, reason: 'error' }; }
          if (r && r.ok) { if (r.cached) skip++; else { made++; await new Promise(ok => setTimeout(ok, 7000)); } }
          else if (r && r.reason === 'pause') { setPrepState({ i, n: list.length, made, skip, stop: '使える回数をこえたので、止めました。あした また おしてください。' }); return; }
        }
        setPrepState({ i: list.length, n: list.length, made, skip, done: true });
      };
      const tabs = [['class', 'クラス全体'], ['child', '子どもごと'], ['print', 'プリント'], ['set', 'せってい'], ['data', 'データ']];
      return (
        <div className="fixed inset-0 bg-stone-100 z-40 overflow-y-auto text-stone-800" style={{ fontSize: 16 }}>

            {data.isDefaultPin && <div className="mb-3 bg-rose-100 text-rose-800 rounded-xl p-3 font-bold">暗証番号が はじめの「1234」のままです。「せってい」で変えてください。</div>}
            {data.demo && <div className="mb-3 bg-amber-100 text-amber-900 rounded-xl p-3">おためしモードです。記録は この端末にだけ のこります。</div>}

            {tab === 'class' && (
              <div>
                <table className="bg-white border-collapse w-full">
                  <thead><tr className="bg-amber-100">
                    {['なまえ', 'いまの おはなし', 'よんだ', 'かけら', ...Object.values(CAT_NAMES), 'にがて', 'さいご'].map(h => <th key={h} className="border px-2 py-1">{h}</th>)}
                  </tr></thead>
                  <tbody>
                    {data.students.map(x => {
                      const p = parseProgress(x.progress);
                      return (
                        <tr key={x.name}>
                          <td className="border px-2 py-1 font-bold"><button className="underline" onClick={() => { setSel(x.name); setTab('child'); }}>{x.name}</button></td>
                          <td className="border px-2 py-1">{currentIndex(p) + 1}. {D.STORIES[currentIndex(p)].title}{p.unlockAll ? '（全部開く）' : ''}{p.hatten ? '（はってん）' : ''}</td>
                          <td className="border px-2 py-1 text-center">{clearedCount(p)} / {D.STORIES.length}</td>
                          <td className="border px-2 py-1 text-center">{p.kakera}</td>
                          {Object.values(CAT_NAMES).map(k => <Cell key={k} g={x.cats[k]} />)}

                    })}
                    <tr className="bg-indigo-50">
                      <td className="border px-2 py-1 font-bold" colSpan={4}>クラス全体</td>
                      {Object.values(CAT_NAMES).map(k => <Cell key={k} g={data.classCats[k]} />)}
                      <td className="border px-2 py-1 font-bold text-rose-700">{weakest(data.classCats)}</td><td className="border" />
                    </tr>
                  </tbody>
                </table>
                <div className="mt-2 text-sm text-stone-600">％は、まちがえず ヒントも使わずに できた問題の割合です（赤：60%未満、黄：60〜79%、緑：80%以上）。✖＝まちがえた回数、💡＝使ったヒントの段階の合計。</div>
              </div>
            )}

            {tab === 'child' && stu && (
              <div>
                <div className="flex flex-wrap gap-2 mb-3">
                  {data.students.map(x => <button key={x.name} onClick={() => setSel(x.name)} className={`px-4 py-2 rounded-xl font-bold border-2 ${sel === x.name ? 'bg-amber-300 border-amber-600' : 'bg-white'}`}>{x.name}</button>)}
                </div>
                {(() => {
                  const p = parseProgress(stu.progress);
                  return (
                    <div className="flex flex-wrap gap-3 items-center mb-3">
                      <div className="font-bold text-lg">よんだ おはなし {clearedCount(p)} / {D.STORIES.length}・ほしの かけら {p.kakera}・最後 {stu.last || '－'}</div>
                      <label className="flex items-center gap-2 bg-white rounded-xl px-3 py-2 border-2">
                        <input type="checkbox" checked={!!p.unlockAll} onChange={e => flag(stu.name, 'unlockAll', e.target.checked)} className="w-6 h-6" /> ぜんぶの おはなしを開く
                      </label>
                      <label className="flex items-center gap-2 bg-white rounded-xl px-3 py-2 border-2">
                        <input type="checkbox" checked={!!p.hatten} onChange={e => flag(stu.name, 'hatten', e.target.checked)} className="w-6 h-6" /> はってん：1〜3話でも ① だれが いった・④ きもち を出す
                      </label>
                      <button onClick={() => clear(stu.name)} className="px-3 py-2 rounded-xl bg-rose-100 border-2 border-rose-300 font-bold">この子の記録を消す</button>
                    </div>
                  );
                })()}
                <table className="bg-white border-collapse">
                  <thead><tr className="bg-amber-100"><th className="border px-2 py-1">おはなし</th>{Object.values(CAT_NAMES).map(k => <th key={k} className="border px-2 py-1">{k}</th>)}<th className="border px-2 py-1">ぜんたい</th></tr></thead>
                  <tbody>
                    {D.STORIES.map(st => (
                      <tr key={st.id}>
                        <td className="border px-2 py-1">{st.id}. {st.title}</td>
                        {Object.values(CAT_NAMES).map(k => <Cell key={k} g={stu.sc[st.id + '|' + k]} />)}
                        <Cell g={stu.stories[st.id]} />
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div className="mt-4 font-bold text-lg">まちがえた・ヒントを使った問題（新しい順）</div>
                <table className="bg-white border-collapse mt-1">
                  <thead><tr className="bg-amber-100">{['日時', 'おはなし', 'しゅるい', 'もんだい', 'こたえ', 'えらんだ じゅん', 'ヒント'].map(h => <th key={h} className="border px-2 py-1">{h}</th>)}</tr></thead>
                  <tbody>{stu.misses.map((m, i) => <tr key={i}>{m.map((v, j) => <td key={j} className="border px-2 py-1">{v}</td>)}</tr>)}</tbody>
                </table>
                {!stu.misses.length && <div className="text-stone-500 mt-1">まだ ありません。</div>}
              </div>
            )}

            {tab === 'print' && (
              <div className="max-w-4xl">
                <div className="mb-3">おはなしの 文章を、B4よこ・たて書きで 印刷します。「いろなし」は、子どもが 自分で 色を ぬる ときに 使います（上に「ぬる いろ」の 見本が 出ます）。「いろつき」は、アプリと 同じ ところに 色が ついて います。</div>
                <table className="bg-white border-collapse w-full">
                  <thead><tr className="bg-amber-100">{['おはなし', '印刷用ページ（えらんで 印刷・PDFで 保存）', 'できている PDF'].map(h => <th key={h} className="border px-2 py-1">{h}</th>)}</tr></thead>
                  <tbody>
                    {[...D.STORIES.map(st => [String(st.id), `${st.id}. ${st.title}`, ('0' + st.id).slice(-2)]), ['all', 'ぜんぶの おはなし', 'ぜんぶ']].map(([sid, label, fn]) => (
                      <tr key={sid}>
                        <td className="border px-2 py-2 font-bold">{label}</td>
                        <td className="border px-2 py-2">
                          <a className="inline-block mr-2 px-3 py-2 rounded-xl bg-white border-2 font-bold" target="_blank" rel="noopener" href={`${BASE}print.html?s=${sid}&c=none`}>🖨 いろなし</a>
                          <a className="inline-block px-3 py-2 rounded-xl bg-amber-100 border-2 border-amber-400 font-bold" target="_blank" rel="noopener" href={`${BASE}print.html?s=${sid}&c=app`}>🖨 いろつき</a>
                        </td>
                        <td className="border px-2 py-2">
                          <a className="inline-block mr-2 underline" target="_blank" rel="noopener" href={`${BASE}pdf/${encodeURIComponent(`ものがたり_${fn}_いろなし.pdf`)}`}>📄 いろなし</a>
                          <a className="inline-block underline" target="_blank" rel="noopener" href={`${BASE}pdf/${encodeURIComponent(`ものがたり_${fn}_いろつき.pdf`)}`}>📄 いろつき</a>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div className="mt-3 text-sm text-stone-600">
                  印刷用ページは 新しいタブで 開きます。上の チェックで 色を つける しゅるいを えらべます（①〜⑤の 好きな 組み合わせ）。
                  「🖨 いんさつ ・ PDFで ほぞん」を押し、PDFに するときは 送信先を「PDFに保存」にします。用紙は「B4」・「横」、「背景のグラフィック」に チェックを 入れます。
                </div>
              </div>
            )}

            {tab === 'set' && (
              <div className="flex flex-col gap-4 max-w-3xl">
                <Row label="読み上げの速さ">{[0.6, 0.7, 0.8, 0.9, 1.0].map(v => <Choice key={v} on={s.rate === v} onClick={() => saveS({ rate: v })}>{v === 0.8 ? '0.8（ふつう）' : v}</Choice>)}</Row>
                <Row label="文字の大きさ">{[[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']].map(([v, l]) => <Choice key={v} on={s.font === v} onClick={() => saveS({ font: v })}>{l}</Choice>)}</Row>
                <Row label="③ たしかめ">{[[true, 'する'], [false, 'しない']].map(([v, l]) => <Choice key={l} on={s.quiz === v} onClick={() => saveS({ quiz: v })}>{l}</Choice>)}</Row>
                <Row label="効果音">{[[true, 'ならす'], [false, 'ならさない']].map(([v, l]) => <Choice key={l} on={s.sound === v} onClick={() => saveS({ sound: v })}>{l}</Choice>)}</Row>
                <Row label="よみきかせの声（Gemini）">{[[true, 'つかう'], [false, 'つかわない']].map(([v, l]) => <Choice key={l} on={s.tts === v} onClick={() => saveS({ tts: v })}>{l}</Choice>)}</Row>
                <Row label="声の しゅるい">
                  {VOICES.map(([v, l]) => <Choice key={v} on={s.voice === v} onClick={() => saveS({ voice: v })}>{v}（{l}）</Choice>)}
                  <button className="px-3 py-2 rounded-xl bg-sky-100 border-2 border-sky-300 font-bold" onClick={() => { Speech.gvoice = s.voice; Speech.sayVoice('こんにちは。わたしは ホタルの ピカリせんせい。いっしょに おはなしを よもうね。'); }}>🔊 ためす</button>
                </Row>
                {tts && (
                  <div className="bg-white rounded-xl p-3 border-2">
                    <div>APIキー：{tts.hasKey ? '✅ 入っています' : '❌ 入っていません（ブラウザの声で読みます）'}　モデル：{tts.model || '－'}</div>
                    <div>きょう作った声：{tts.today}　ドライブにある声：{tts.files}</div>
                    {tts.pauseUntil > Date.now() && <div className="text-rose-700">使いすぎのため、{new Date(tts.pauseUntil).toLocaleTimeString()} まで休んでいます</div>}
                    {tts.lastError && <div className="text-xs text-stone-500 break-all">さいごのエラー：{tts.lastError}</div>}
                    {HAS_GAS && tts.hasKey && (
                      <div className="mt-2">
                        <button className="px-3 py-2 rounded-xl bg-amber-200 border-2 border-amber-400 font-bold" disabled={prepState && !prepState.done && !prepState.stop} onClick={prepVoices}>🎙️ おはなしと セリフの 声を まとめて つくる</button>
                        {prepState && !prepState.done && !prepState.stop && <button className="ml-2 underline" onClick={() => { prepStop.current = true; }}>とめる</button>}
                        {prepState && <div className="mt-1">{prepState.i} / {prepState.n}（あたらしく {prepState.made}・もう あった {prepState.skip}）{prepState.done ? ' ✅ おわりました' : ''}{prepState.stop || ''}</div>}
                      </div>
                    )}
                  </div>
                )}
                <Row label="暗証番号を変える"><PinChange onSave={(v) => saveS({ newPin: v })} /></Row>
                <div className="text-sm text-stone-600">設定は全員の画面に反映されます。子どもの画面は、開き直すと変わります。</div>
              </div>
            )}

            {tab === 'data' && (
              <div className="flex flex-col gap-3 max-w-2xl">
                <button className="px-4 py-3 rounded-xl bg-white border-2 font-bold text-left" onClick={async () => { await api.flush(); setNote(`まだ送れていない記録：${api.pending()}`); }}>📤 まだ送れていない記録を送る（いま {api.pending()}）</button>
                <button className="px-4 py-3 rounded-xl bg-white border-2 font-bold text-left" onClick={csv}>📄 記録を CSV で書き出す</button>
                <button className="px-4 py-3 rounded-xl bg-white border-2 font-bold text-left" onClick={backup}>💾 バックアップを保存する</button>
                <label className="px-4 py-3 rounded-xl bg-white border-2 font-bold">📂 バックアップから もどす <input type="file" accept=".json" onChange={restore} className="ml-2" /></label>
                <button className="px-4 py-3 rounded-xl bg-rose-100 border-2 border-rose-300 font-bold text-left" onClick={() => clear('')}>🗑 全員の記録を消す</button>
              </div>
            )}
          </div>
        </div>
      );
    }
    function Row({ label, children }) {
      return <div className="flex flex-wrap items-center gap-2"><div className="w-56 font-bold">{label}</div>{children}</div>;
    }
    function Choice({ on, onClick, children }) {
      return <button onClick={onClick} className={`px-3 py-2 rounded-xl border-2 font-bold ${on ? 'bg-amber-300 border-amber-600' : 'bg-white'}`}>{children}</button>;
    }
    function PinChange({ onSave }) {
      const [v, setV] = useState('');
      return (
        <span className="flex gap-2">
          <input value={v} onChange={e => setV(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="4けたの数字" className="border-2 rounded-xl px-3 py-2 w-36" inputMode="numeric" />
          <button disabled={v.length !== 4} onClick={() => { onSave(v); setV(''); }} className="px-3 py-2 rounded-xl bg-amber-200 border-2 border-amber-400 font-bold disabled:opacity-40">変える</button>
        </span>
      );
    }

    // =====================================================================
    // 11. アプリ全体
    // =====================================================================
    function applySettings(s) {
      Speech.rate = s.rate || 0.8;
      Speech.gemini = !!s.tts; Speech.gvoice = s.voice || 'Sulafat';
      Sound.on = !!s.sound;
      document.documentElement.style.fontSize = `${16 * (s.font || 1)}px`;
    }

    function App() {
      const [boot, setBoot] = useState(null);
      const [err, setErr] = useState('');
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState('');
      const [progress, setProgress] = useState(null);
      const [screen, setScreen] = useState('names');
      const [cur, setCur] = useState(null); // { index, step }
      const [clearInfo, setClearInfo] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinErr, setPinErr] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const pRef = useRef(null);
      const quizStat = useRef({ miss: 0 });

      useEffect(() => {
        (async () => {
          try {
            await window.MONO_READY;
            D = window.MONOGATARI_DATA;
            CAT = Object.fromEntries(D.CATS.map(c => [c.id, c]));
            const r = await api.init();
            const s = { ...DEFAULT_SETTINGS, ...(r.settings || {}) };
            setSettings(s); applySettings(s);
            setBoot(r);
            api.flush();
          } catch (e) { setErr(String(e && e.message || e)); }
        })();
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      const commit = (p, records = []) => {
        p.t = Date.now();
        pRef.current = p; setProgress({ ...p });
        api.save({ name, progress: JSON.stringify(p), records, time: Date.now(), stamp: nowStr() });
      };
      const pickName = async (n) => {
        Sound.get();
        Speech.avoid = n;
        let raw = '';
        try { raw = await api.student(n); } catch (e) {}
        const p = parseProgress(raw);
        pRef.current = p; setProgress(p); setName(n); setScreen('home');
        Speech.sayVoice(`${n}さん、こんばんは。`);
      };
      const openStory = (index, step = 1) => {
        quizStat.current = { miss: 0 };
        setCur({ index, step: step || 1 }); setScreen('story');
      };
      const onRecord = (r) => {
        const p = pRef.current;
        if (r.result !== '○') quizStat.current.miss++;
        commit(p, [r]);
      };
      const onKakera = (n) => { const p = pRef.current; p.kakera += n; pRef.current = p; setProgress({ ...p }); };
      const onStep = (step) => {
        const p = pRef.current; const st = D.STORIES[cur.index];
        p.resume = { story: st.id, step }; commit(p);
      };
      const onDone = () => {
        const p = pRef.current; const st = D.STORIES[cur.index];
        const first = !p.cleared[st.id];
        const perfect = settings.quiz && quizStat.current.miss === 0;
        const old = p.cleared[st.id] || { n: 0 };
        p.cleared[st.id] = { d: nowStr().slice(0, 10), n: (old.n || 0) + 1, perfect: !!(old.perfect || perfect) };
        const gained = 3;
        p.kakera += gained;
        let newItem = null;
        if (first) { newItem = D.FOREST.find(f => !p.forest.includes(f.id)) || null; if (newItem) p.forest.push(newItem.id); }
        p.resume = null;
        commit(p, [{ id: uid(), story: st.id, title: st.title, cat: 'おわり', q: '', a: '', result: '', miss: 0, hint: 0, picks: '', secs: 0 }]);
        setClearInfo({ story: st, gained, newItem, perfect }); setScreen('clear');
      };

      const submitPin = async (pin) => {
        const r = await api.teacher(pin);
        if (!r || !r.ok) { setPinErr(e => e + 1); return; }
        setPinOpen(false); setPinErr(0); setTeacher({ data: r, pin });
        Speech.stop();
      };
      const reloadTeacher = async () => {
        const r = await api.teacher(teacher.pin); if (r.ok) setTeacher({ ...teacher, data: r });
        if (name) { try { const raw = await api.student(name); const p = parseProgress(raw); if (p.t >= (pRef.current ? pRef.current.t : 0)) { pRef.current = p; setProgress(p); } } catch (e) {} }
      };

      if (err) return <div className="p-10 text-white text-2xl">データを よみこめませんでした（{err}）。ネットにつながっているか、たしかめてください。</div>;
      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-amber-200">じゅんび ちゅう…</div>;

      let body = null;
      const lock = () => setPinOpen(true);
      if (screen === 'names' || !progress) body = <NameSelect students={boot.students || []} demo={boot.demo} onPick={pickName} onLock={lock} />;
      else if (screen === 'home') body = <Home name={name} progress={progress} onRead={openStory} onList={() => setScreen('list')} onZukan={() => setScreen('zukan')} onQuit={() => { Speech.stop(); setScreen('names'); setName(''); }} onLock={lock} />;
      else if (screen === 'list') body = <StoryList progress={progress} onPick={(i) => openStory(i, progress.resume && progress.resume.story === D.STORIES[i].id ? progress.resume.step : 1)} onBack={() => setScreen('home')} />;
      else if (screen === 'zukan') body = <Zukan progress={progress} onBack={() => setScreen('home')} />;
      else if (screen === 'story' && cur) body = <StoryScreen key={cur.index + '-' + cur.step} story={D.STORIES[cur.index]} index={cur.index} settings={settings} hatten={!!progress.hatten} startStep={cur.step}
        onRecord={onRecord} onKakera={onKakera} onStep={onStep} onDone={onDone} onExit={() => setScreen('home')} onLock={lock} />;
      else if (screen === 'clear' && clearInfo) body = <ClearScreen {...clearInfo} onHome={() => setScreen('home')} onZukan={() => setScreen('zukan')} onAgain={() => openStory(D.STORIES.indexOf(clearInfo.story), 1)} />;

      return (
        <div className="w-screen h-screen overflow-hidden">
          {body}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinErr} />}
          {teacher && <TeacherView data={teacher.data} pin={teacher.pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher}
            onSettings={(ns) => { setSettings(ns); applySettings(ns); }} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
