    function ModelsTab() {
      const [models, setModels] = useState({});
      const [recTask, setRecTask] = useState(null);
      const [sec, setSec] = useState(0);
      const [msg, setMsg] = useState('');
      const recRef = useRef(null);
      const player = usePlayer();
      const reload = async () => { const all = await DB.getAll('models'); setModels(Object.fromEntries(all.map(m => [m.taskId, m]))); };
      useEffect(() => { reload(); return () => { if (recRef.current) try { recRef.current.mr.stop(); } catch (e) {} }; }, []);
      useEffect(() => {
        if (!recTask) return;
        const t0 = Date.now(); const id = setInterval(() => setSec((Date.now() - t0) / 1000), 200);
        return () => clearInterval(id);
      }, [recTask]);

      const start = async (taskId) => {
        player.stop();
        let stream;
        try { stream = await Mic.ensureProcessed(); } catch (e) { setMsg('マイクが使えません。Chromeの設定でマイクを許可してください。'); return; }
        const mime = pickMime();
        const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
        const chunks = [];
        mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        mr.onstop = async () => {
          const blob = new Blob(chunks, { type: mime || 'audio/webm' });
          if (blob.size) { await DB.put('models', { taskId, blob, mime: mime || 'audio/webm', at: Date.now() }); await reload(); setMsg('お手本を保存しました。'); }
        };
        mr.start(250);
        recRef.current = { mr, taskId };
        setSec(0); setRecTask(taskId); setMsg('');
      };
      const stop = () => { if (recRef.current) { try { recRef.current.mr.stop(); } catch (e) {} recRef.current = null; } setRecTask(null); };
      const remove = async (taskId) => { if (!confirm('このお手本の録音を削除しますか？')) return; await DB.del('models', taskId); await reload(); };

      const exportModels = async () => {
        const all = await DB.getAll('models');
        if (!all.length) { setMsg('書き出すお手本がありません。'); return; }
        const items = await Promise.all(all.map(async m => ({ taskId: m.taskId, mime: m.mime, at: m.at, data: await blobToDataURL(m.blob) })));
        downloadFile(`おてほんセット_${ymd()}.json`, JSON.stringify({ app: 'ondoku-hakase', kind: 'models', version: 1, items }), 'application/json');
        setMsg(`${items.length}件のお手本を書き出しました。ファイルをGoogleドライブなどで各Chromebookに渡し、「読み込む」で取り込んでください。`);
      };
      const importModels = async () => {
        const file = await pickFile('.json,application/json');
        if (!file) return;
        try {
          const data = JSON.parse(await file.text());
          if (!data || data.app !== 'ondoku-hakase' || data.kind !== 'models') throw new Error('kind');
          let n = 0;
          for (const it of data.items || []) {
            if (!TASK_LOOKUP[it.taskId]) continue;
            await DB.put('models', { taskId: it.taskId, mime: it.mime, at: it.at || Date.now(), blob: await dataURLToBlob(it.data) });
            n++;
          }
          await reload();
          setMsg(`${n}件のお手本を読み込みました。`);
        } catch (e) { setMsg('読み込めませんでした。「おてほんセット」のファイルを選んでください。'); }
      };

      return (
        <div className="grid gap-4">
          <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
            <div className="text-lg text-slate-700 leading-relaxed">
              先生の声でお手本を録音できます。録音がある課題では、子どもの「おてほん」ボタンで先生の声が流れます（「ゆっくり」は0.75倍速で再生）。<br />
              1台で録音したお手本は「書き出す」で1つのファイルにまとめ、他のChromebookで「読み込む」と全員に配れます。
            </div>
            <div className="flex gap-3 flex-wrap mt-3">
              <Btn color="sky" size="md" onClick={exportModels}>📤 お手本セットを書き出す</Btn>
              <Btn color="sky" size="md" onClick={importModels}>📥 お手本セットを読み込む</Btn>
            </div>
            {msg && <div className="mt-3 text-emerald-700 font-bold">{msg}</div>}
          </div>
          {STAGES.map(stage => (
            <div key={stage.id} className="bg-white rounded-2xl border-2 border-slate-200 p-4">
              <div className={`font-bold text-lg mb-2 ${STAGE_STYLE[stage.color].text}`}>{stage.icon} {stageLabel(stage)}「{stage.name}」</div>
              {stage.tasks.map((t, i) => {
                const m = models[t.id];
                const isRec = recTask === t.id;
                return (
                  <div key={t.id} className="flex items-center gap-2 flex-wrap border-t border-slate-100 py-2">
                    <span className="w-8 text-slate-500">{i + 1}</span>
                    <span className="flex-1 min-w-[200px]">{t.lines.map(l => stripMarkup(l)).join(' ／ ')}</span>
                    <span className={`text-sm w-20 ${m ? 'text-emerald-600 font-bold' : 'text-slate-400'}`}>{m ? '録音あり' : '録音なし'}</span>
                    {isRec
                      ? <button onClick={stop} className="rounded-xl bg-rose-500 text-white font-bold px-4 py-2 rec-pulse">■ 停止（{sec.toFixed(0)}秒）</button>
                      : <button disabled={!!recTask} onClick={() => start(t.id)} className="rounded-xl bg-rose-100 text-rose-700 font-bold px-4 py-2 border border-rose-300 disabled:opacity-40">● 録音</button>}
                    <button disabled={!m || !!recTask} onClick={() => player.playingId === t.id ? player.stop() : player.play(t.id, m.blob)} className="rounded-xl bg-sky-100 text-sky-700 font-bold px-4 py-2 border border-sky-300 disabled:opacity-40">{player.playingId === t.id ? '⏸ 停止' : '▶ 再生'}</button>
                    <button disabled={!m || !!recTask} onClick={() => remove(t.id)} className="rounded-xl bg-slate-100 text-slate-600 font-bold px-4 py-2 border border-slate-300 disabled:opacity-40">削除</button>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      );
    }

    function MicCalibration({ app }) {
      const [st, setSt] = useState('idle');
      const [msg, setMsg] = useState('');
      const run = async () => {
        try { await Mic.ensure(); } catch (e) { setMsg('マイクが使えません。'); return; }
        const noise = []; const voice = [];
        let mode = 'quiet';
        const fn = fr => { (mode === 'quiet' ? noise : voice).push(fr.db); };
        LEVEL.listeners.add(fn);
        setSt('quiet'); setMsg('');
        await sleep(1500);
        mode = 'speak'; setSt('speak');
        await sleep(4500);
        LEVEL.listeners.delete(fn);
        setSt('idle');
        const n = percentile(noise, 0.5) ?? -70;
        const v = voice.filter(d => d > n + 8);
        if (v.length < 15) { setMsg('声がうまく拾えませんでした。マイクに向かって、もう一度ふつうの声で読んでください。'); return; }
        const L = Math.round(percentile(v, 0.75) - 2);
        app.update(s => ({ ...s, settings: { ...s.settings, micGoodDb: clamp(L, -55, -10) } }));
        setMsg(`基準を ${clamp(L, -55, -10)} dB に設定しました。`);
      };
      return (
        <div>
          <div className="text-slate-600 mb-2">
            Chromebookごとにマイクの感度が違うため、「ちょうどよい声の大きさ」の基準を合わせられます。ボタンを押し、1.5秒静かにしたあと、子どもがふだん音読するくらいの声で4秒ほど読んでください。
          </div>
          <div className="flex items-center gap-3 flex-wrap">
            <Btn color="violet" size="md" disabled={st !== 'idle'} onClick={run}>🎚️ 基準を合わせる</Btn>
            <span className="font-bold">{st === 'quiet' ? '🤫 静かにしてください…' : st === 'speak' ? '🗣️ ふつうの声で読んでください！' : `現在の基準：${app.state.settings.micGoodDb} dB`}</span>
            <button className="text-sm underline text-slate-500" onClick={() => { app.update(s => ({ ...s, settings: { ...s.settings, micGoodDb: DEFAULT_SETTINGS.micGoodDb } })); setMsg('初期値にもどしました。'); }}>初期値にもどす</button>
          </div>
          {st !== 'idle' && <div className="mt-3"><VoiceMeter goodDb={app.state.settings.micGoodDb} /></div>}
          {msg && <div className="mt-2 text-emerald-700 font-bold">{msg}</div>}
        </div>
      );
    }

        </div>
      );
    }

    function SyncPanel({ app }) {
      const sync = app.state.sync || {};
      const [pending, setPending] = useState(null);
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState('');
      const [editing, setEditing] = useState(!sync.url);
      const [url, setUrl] = useState(sync.url || '');
      const [key, setKey] = useState(sync.key || '');
      const countPending = async () => { try { setPending((await DB.getAll('history')).filter(h => !h.sent).length); } catch (e) { setPending(null); } };
      useEffect(() => { countPending(); }, [sync.lastOkAt, sync.lastErrorAt]);
      const send = async (all) => {
        setBusy(true); setMsg('');
        const r = await Sync.run(app, { all });
        setBusy(false); countPending();
        if (r.ok) setMsg(r.sent ? `${r.sent}件の記録を送りました。` : '送っていない記録はありません（一覧は最新です）。');
        else if (r.reason === 'offline') setMsg('インターネットにつながっていません。');
      };
      const save = () => {
        const u = url.trim();
        if (!REC_URL_RE.test(u)) { setMsg('URLの形がちがいます。「https://script.google.com/macros/s/…/exec」の形のURLを入れてください。'); return; }
        if (!key.trim()) { setMsg('合言葉を入れてください。'); return; }
        app.update(s => ({ ...s, sync: { ...s.sync, url: u, key: key.trim(), lastError: null, lastSummary: null } }));
        setEditing(false); setMsg('送り先を保存しました。「今すぐ送る」で送信を確かめてください。');
      };
      const clear = () => {
        if (!confirm('記録の送り先を消しますか？（この端末の記録は消えません）')) return;
        app.update(s => ({ ...s, sync: {} }));
        setUrl(''); setKey(''); setEditing(true); setMsg('送り先を消しました。');
      };
      const errShown = sync.lastError && (!sync.lastOkAt || sync.lastErrorAt > sync.lastOkAt);
      const inputCls = 'w-full rounded-xl border-2 border-slate-300 px-3 py-2 text-base';
      return (
        <div className="bg-white rounded-2xl border-2 border-sky-200 p-4">
          <div className="text-xl font-bold mb-1">📡 先生のスプレッドシートへの送信</div>
          <div className="text-slate-600 mb-3">挑戦するたびに、点数を先生のGoogleスプレッドシートへ自動で送ります（録音は送りません）。送れなかった記録は、次につながったときに送り直します。</div>
          <div className="grid sm:grid-cols-3 gap-3 mb-3">
            <div className="rounded-xl bg-slate-50 border border-slate-200 p-3">
              <div className="text-sm text-slate-500">送り先</div>
              <div className={`font-bold ${sync.url ? 'text-emerald-700' : 'text-slate-500'}`}>{sync.url ? '✅ 設定ずみ' : '未設定'}</div>
            </div>
            <div className="rounded-xl bg-slate-50 border border-slate-200 p-3">
              <div className="text-sm text-slate-500">まだ送っていない記録</div>
              <div className="font-bold">{pending == null ? '…' : `${pending}件`}</div>
            </div>
            <div className="rounded-xl bg-slate-50 border border-slate-200 p-3">
              <div className="text-sm text-slate-500">最後に送れた日時</div>
              <div className="font-bold">{sync.lastOkAt ? fmtDate(sync.lastOkAt) : '—'}</div>
            </div>
          </div>
          {errShown && <div className="mb-3 rounded-xl bg-rose-50 border border-rose-200 p-3 text-rose-800">⚠️ {syncErrorText(sync.lastError)}</div>}
          {sync.url && (
            <div className="flex gap-3 flex-wrap mb-2">
              <Btn color="sky" size="md" disabled={busy} onClick={() => send(false)}>📤 今すぐ送る</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={() => send(true)}>🔁 これまでの記録をまとめて送る</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={() => setEditing(v => !v)}>✏️ 送り先を入力</Btn>
            </div>
          )}
          {!sync.url && <div className="text-slate-600 mb-2">入口ページ（Apps Script）の「はじめる」から開くと、送り先は自動で設定されます。入口ページを通さずに開いた端末では、スプレッドシートのメニュー「音読はかせ → 子どもに配るURLと合言葉を表示」で出るURLと合言葉を、ここに入力してください。</div>}
          {editing && (
            <div className="grid gap-2 mt-2 rounded-xl bg-slate-50 border border-slate-200 p-3">
              <label>
                <div className="font-bold text-sm mb-1">送り先のURL（…/exec）</div>
                <input className={inputCls} value={url} onChange={e => setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/……/exec" />
              </label>
              <label>
                <div className="font-bold text-sm mb-1">合言葉</div>
                <input className={inputCls} value={key} onChange={e => setKey(e.target.value)} />
              </label>
              <div className="flex gap-3 flex-wrap">
                <Btn color="green" size="sm" onClick={save}>保存</Btn>
                {sync.url && <Btn color="white" size="sm" onClick={clear}>送り先を消す</Btn>}
              </div>
            </div>
          )}
          {busy && <div className="mt-2 text-slate-600 font-bold">送信中…</div>}
          {msg && <div className="mt-2 text-slate-700 font-bold">{msg}</div>}
        </div>
      );
    }

    function DataTab({ app }) {
      const [msg, setMsg] = useState('');
      const [busy, setBusy] = useState(false);
      const exportCSV = async () => {
        const hist = (await DB.getAll('history')).sort((a, b) => a.at - b.at);
        const esc = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
        const rows = [['日時', 'ステージ', '課題番号', '課題', '合計', '声の大きさ', '読みの正確さ', '強弱', '速さ', '合格', '読んだ時間(秒)', '聞き取った言葉', '採点のきびしさ']];
        hist.forEach(h => {
          const x = TASK_LOOKUP[h.taskId];
          rows.push([fmtDate(h.at), x ? `${stageLabel(x.stage)} ${x.stage.name}` : '', x ? x.index + 1 : '', x ? taskLabel(x.task) : h.taskId, h.total, h.parts.vol, h.parts.acc, h.parts.dyn, h.parts.spd, h.total >= PASS_SCORE ? '合格' : '', h.readSec, h.heard, (STRICTNESS[h.strict] || {}).label || '']);
        });
        const name = app.state.profile ? app.state.profile.name : 'record';
        downloadFile(`音読記録_${name}_${ymd()}.csv`, '﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n'), 'text/csv');
        setMsg(`${hist.length}件の記録をCSVで書き出しました。`);
      };
      const exportBackup = async () => {
        setBusy(true);
        try {
          const history = await DB.getAll('history');
          const recs = await DB.getAll('recordings');
          const models = await DB.getAll('models');
          const recordings = await Promise.all(recs.map(async r => ({ id: r.id, taskId: r.taskId, mime: r.mime, total: r.total, at: r.at, data: await blobToDataURL(r.blob) })));
          const modelItems = await Promise.all(models.map(async m => ({ taskId: m.taskId, mime: m.mime, at: m.at, data: await blobToDataURL(m.blob) })));
          const name = app.state.profile ? app.state.profile.name : 'backup';
          downloadFile(`音読バックアップ_${name}_${ymd()}.json`, JSON.stringify({ app: 'ondoku-hakase', kind: 'backup', version: 1, state: app.stateRef.current, history, recordings, models: modelItems }), 'application/json');
          setMsg('バックアップを書き出しました。');
        } finally { setBusy(false); }
      };
      const importBackup = async () => {
        const file = await pickFile('.json,application/json');
        if (!file) return;
        let data;
        try { data = JSON.parse(await file.text()); } catch (e) { setMsg('ファイルを読み込めませんでした。'); return; }
        if (!data || data.app !== 'ondoku-hakase' || data.kind !== 'backup') { setMsg('バックアップのファイルを選んでください。'); return; }
        if (!confirm('今のChromebookの記録を、バックアップの内容で置き換えます。よろしいですか？')) return;
        setBusy(true);
        try {
          await DB.clear('history'); await DB.clear('recordings'); await DB.clear('models');
          for (const h of data.history || []) await DB.put('history', h);
          for (const r of data.recordings || []) await DB.put('recordings', { id: r.id, taskId: r.taskId, mime: r.mime, total: r.total, at: r.at, blob: await dataURLToBlob(r.data) });
          for (const m of data.models || []) await DB.put('models', { taskId: m.taskId, mime: m.mime, at: m.at, blob: await dataURLToBlob(m.data) });
          const st = data.state || {};
          app.update(cur => {
            const next = normalizeState({ ...st, deviceId: st.deviceId || cur.deviceId });
            // 送り先は、この端末に 設定されている ものを 優先する
            return { ...next, sync: cur.sync && cur.sync.url ? cur.sync : next.sync };
          });
          setMsg('バックアップから元にもどしました。');
        } catch (e) { setMsg('読み込み中にエラーが起きました。'); }
        finally { setBusy(false); }
      };
      const resetAll = async () => {
        if (!confirm('この児童の記録・録音・シールをすべて消します。元にもどせません。よろしいですか？')) return;
        if (!confirm('本当に消しますか？（先生のお手本の録音と設定は残ります）')) return;
        await DB.clear('history'); await DB.clear('recordings');
        app.update(s => ({ ...s, progress: {}, stickers: [] }));
        setMsg('記録を消しました。');
      };
      return (
        <div className="grid gap-4">
          <SyncPanel app={app} />
          <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
            <div className="text-xl font-bold mb-1">記録の書き出し（CSV）</div>
            <div className="text-slate-600 mb-2">すべての挑戦の点数を、スプレッドシートで開けるファイルにします。</div>
            <Btn color="sky" size="md" onClick={exportCSV}>📄 CSVで書き出す</Btn>
          </div>
          <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
            <div className="text-xl font-bold mb-1">バックアップ</div>
            <div className="text-slate-600 mb-2">記録・録音・お手本・設定をまとめて保存します。Chromeの閲覧データを消すと記録も消えるので、ときどきバックアップしてください。端末を替えるときにも使えます。</div>
            <div className="flex gap-3 flex-wrap">
              <Btn color="sky" size="md" disabled={busy} onClick={exportBackup}>💾 バックアップを書き出す</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={importBackup}>📥 バックアップから元にもどす</Btn>
            </div>
          </div>
          <div className="bg-white rounded-2xl border-2 border-rose-200 p-4">
            <div className="text-xl font-bold mb-1 text-rose-700">記録をすべて消す</div>
            <div className="text-slate-600 mb-2">新しい児童が使うときなどに使います。</div>
            <Btn color="red" size="md" onClick={resetAll}>🗑️ 記録を消す</Btn>
          </div>
          {msg && <div className="text-emerald-700 font-bold text-lg">{msg}</div>}
        </div>
      );
    }

    /* =========================================================
       アプリ全体
       ========================================================= */
    function Header({ app, view, onHome, onBack, onStickers, onTeacher }) {
      const { state } = app;
      const cleared = countCleared(state);
      return (
        <header className="bg-white/95 backdrop-blur shadow-sm sticky top-0 z-30">
          <div className="max-w-6xl mx-auto px-3 py-2 flex items-center gap-2">
            {view.name !== 'home' && view.name !== 'setup' && (
              <Btn color="white" size="sm" onClick={onBack}>◀ もどる</Btn>
            )}
            <button onClick={onHome} className="flex items-center gap-2 font-black text-amber-800 text-lg md:text-2xl">
              <span className="text-3xl">🦉</span><span className="hidden sm:inline">おんどくはかせの ちょうせんじょう</span>
            </button>
            <div className="flex-1" />
            {state.profile && view.name !== 'teacher' && (
              <>
                <span className="hidden md:inline text-lg font-bold text-slate-600">{TITLES[cleared].icon} {state.profile.name}さん</span>
                <Btn color="amber" size="sm" onClick={onStickers}>📒 シールちょう</Btn>
                <button onClick={onTeacher} className="text-sm text-slate-400 border border-slate-200 rounded-lg px-2 py-1 hover:bg-slate-50" title="先生用">⚙ せんせい</button>
              </>
            )}
          </div>
        </header>
      );
    }

    function App() {
      const [state, setState] = useState(loadState);
      const stateRef = useRef(state);
      const update = useCallback((fn) => {
        const next = fn(stateRef.current);
        stateRef.current = next;
        CURRENT.settings = next.settings;
        setState(next); saveState(next);
        return next;
      }, []);
      const app = { state, update, stateRef };
      const [view, setView] = useState(state.profile ? { name: 'home' } : { name: 'setup' });
      const [pinOpen, setPinOpen] = useState(false);

      // 送れていない 記録が あれば、ひらいた ときと ネットに つながった ときに 送る
      useEffect(() => {
        const trySync = () => Sync.run({ state: stateRef.current, update, stateRef });
        trySync();
        window.addEventListener('online', trySync);
        return () => window.removeEventListener('online', trySync);
      }, []);

      const go = v => { TTS.cancel(); setView(v); window.scrollTo(0, 0); };
      const openStage = stage => go({ name: 'stage', stageId: stage.id });
      const startTask = (stage, index) => go({ name: 'task', stageId: stage.id, index });
      const back = () => {
        if (view.name === 'task') go({ name: 'stage', stageId: view.stageId });
        else go({ name: 'home' });
      };

      return (
        <div className="min-h-screen pb-10">
          <Header app={app} view={view} onHome={() => view.name !== 'setup' && view.name !== 'teacher' && go({ name: 'home' })} onBack={back}
                  onStickers={() => go({ name: 'stickers' })} onTeacher={() => setPinOpen(true)} />
          {view.name === 'setup' && (
            <SetupScreen onDone={(profile) => { update(s => ({ ...s, profile })); Sync.run(app); go({ name: 'home' }); }} />
          )}
          {view.name === 'home' && <HomeScreen app={app} onOpenStage={openStage} onStartTask={startTask} />}
          {view.name === 'stage' && <StageScreen app={app} stage={STAGE_MAP[view.stageId]} onStartTask={startTask} />}
          {view.name === 'task' && (
            <TaskScreen key={`${view.stageId}-${view.index}`} app={app} stage={STAGE_MAP[view.stageId]} index={view.index}
                        onGoTask={startTask} onBackToStage={() => go({ name: 'stage', stageId: view.stageId })} />
          )}
          {view.name === 'stickers' && <StickerBook app={app} />}
          {view.name === 'teacher' && <TeacherScreen app={app} onExit={() => go({ name: 'home' })} />}
          {pinOpen && (
            <PinPad onClose={() => setPinOpen(false)}
                    check={v => state.profile && hashPin(v) === state.profile.pin}
                    onSuccess={() => { setPinOpen(false); go({ name: 'teacher' }); }} />
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      render() {
        if (this.state.err) return (
          <div className="max-w-xl mx-auto p-8 text-center">
            <div className="text-6xl mb-4">🦉💦</div>
            <div className="text-2xl font-bold mb-2">こまったことが おきたよ</div>
            <div className="text-lg text-slate-600 mb-4">せんせいに しらせてね。（ページを さいよみこみ すると なおることが あります）</div>
            <pre className="text-left text-xs bg-slate-100 p-3 rounded overflow-auto">{String(this.state.err && this.state.err.stack || this.state.err)}</pre>
            <button className="mt-4 btn3d bg-sky-500 border-sky-700 text-white px-5 py-3 text-xl" onClick={() => location.reload()}>さいよみこみ</button>
          </div>
        );
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
