    .hakase-bob { animation: bob 3.2s ease-in-out infinite; }

    .hakase-jump { animation: jump .55s ease-in-out 3; }
    @keyframes jump { 50% { transform: translateY(-16px); } }
    .hakase-eyes { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .beak-lower { animation: talk .22s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
    @keyframes talk { to { transform: scaleY(1.9); } }
    .wing-l { transform-box: fill-box; transform-origin: top right; animation: flapL .45s ease-in-out infinite alternate; }
    .wing-r { transform-box: fill-box; transform-origin: top left; animation: flapR .45s ease-in-out infinite alternate; }
    @keyframes flapL { to { transform: rotate(28deg); } }
    @keyframes flapR { to { transform: rotate(-28deg); } }

    /* 共通アニメーション */
    .pop { animation: popup .45s cubic-bezier(.175,.885,.32,1.275) both; }
    @keyframes popup { 0% { transform: scale(.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .float { display: inline-block; animation: float 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    .rec-pulse { animation: recpulse 1.2s ease-out infinite; }
    @keyframes recpulse { 0% { box-shadow: 0 0 0 0 rgba(244,63,94,.55); } 100% { box-shadow: 0 0 0 22px rgba(244,63,94,0); } }

    .stamp { border: 6px double #e11d48; color: #e11d48; border-radius: 9999px; padding: .35em .7em; transform: rotate(-12deg); font-weight: 900; letter-spacing: .1em; animation: stampin .5s cubic-bezier(.175,.885,.32,1.275) both .9s; background: rgba(255,255,255,.8); }

    @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
    .parchment { background: linear-gradient(180deg, #fffbeb, #fef3c7); border: 6px solid #d97706; box-shadow: inset 0 0 0 4px #fde68a, 0 20px 40px rgba(0,0,0,.25); }

    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

    function hashPin(pin) { let h = 2166136261; for (const c of 'ondoku:' + pin) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }

    /* ---- かなの 正規化 ---- */
    const KANA_FIX = { 'を': 'お', 'づ': 'ず', 'ぢ': 'じ', 'ゐ': 'い', 'ゑ': 'え', 'ゔ': 'ぶ', 'ゕ': 'か', 'ゖ': 'け' };
    function normChar(ch, keepUnknown = false) {
      let c = ch;
      const code = c.charCodeAt(0);
      if (code >= 0x30a1 && code <= 0x30f6) c = String.fromCharCode(code - 0x60);
      c = KANA_FIX[c] || c;
      if (/[ぁ-ゖ]/.test(c)) return c;
      if (/[a-zA-Z0-9]/.test(c)) return c.toLowerCase();
      if (keepUnknown && /[一-鿿々]/.test(c)) return '＊';
      return '';
    }
    const isSmallKana = c => /[ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ]/.test(c);

    function parseLine(line) {
      const tokens = [];
      const pushText = (s) => { for (const ch of s) tokens.push(ch === ' ' || ch === '　' ? { type: 'space' } : { type: 'char', text: ch }); };
      let last = 0; let m;
      const re = new RegExp(MARK_RE.source, 'g');
      while ((m = re.exec(line))) { pushText(line.slice(last, m.index)); tokens.push({ type: 'kanji', base: m[1], rt: m[2] }); last = re.lastIndex; }
      pushText(line.slice(last));
      return tokens;
    }

    const INFO_CACHE = {};
    function getTaskInfo(task, stage) {
      if (INFO_CACHE[task.id]) return INFO_CACHE[task.id];
      const lines = task.lines.map(parseLine);
      const target = []; const map = []; let mora = 0;
      lines.forEach((toks, li) => toks.forEach((tok, ti) => {
        const src = tok.type === 'kanji' ? tok.rt : tok.type === 'char' ? tok.text : '';
        for (const ch of src) {
          const n = normChar(ch.normalize('NFKC'));
          if (n) { target.push(n); map.push([li, ti]); }
          if (/[ぁ-ゖァ-ヺー]/.test(ch) && !isSmallKana(ch)) mora++;
        }
      }));
      const own = {};
      lines.forEach(toks => toks.forEach(tok => { if (tok.type === 'kanji') own[tok.base] = tok.rt; }));
      const dict = {};
      Object.entries({ ...READING_DICT, ...own }).forEach(([k, v]) => { dict[k.normalize('NFKC')] = v; });
      const keys = Object.keys(dict).sort((a, b) => b.length - a.length);
      const dictRe = new RegExp(keys.map(escapeRe).join('|'), 'g');
      const keep = stage && stage.keepSpace;
      const speech = task.tts || task.lines.map(l => { const t = stripMarkup(l); return keep ? t : t.replace(/[ 　]+/g, ''); });
      const maxLen = Math.max(...task.lines.map(l => stripMarkup(l).length));
      const info = { lines, target: target.join(''), map, mora, dict, dictRe, speech, maxLen, maxSec: clamp(mora * 1.0 + 10, 12, 90) };
      INFO_CACHE[task.id] = info;
      return info;
    }
    function taskLabel(task) { return task.title || stripMarkup(task.lines[0]).replace(/[ 　]+/g, ' '); }
    function taskYomiLabel(task) { return task.title || toYomiText(task.lines[0]); }

    function heardToKana(text, info) {
      const s = text.normalize('NFKC').replace(info.dictRe, m => info.dict[m] || m);
      return [...s].map(ch => normChar(ch, true)).join('');
    }
    function alignMatches(T, H) {
      const n = T.length, m = H.length;
      const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
      for (let i = 0; i <= n; i++) dp[i][0] = i;
      for (let j = 0; j <= m; j++) dp[0][j] = j;
      for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (T[i - 1] === H[j - 1] ? 0 : 1));
      }
      const matched = new Array(n).fill(false);
      let i = n, j = m;
      while (i > 0 && j > 0) {
        if (T[i - 1] === H[j - 1] && dp[i][j] === dp[i - 1][j - 1]) { matched[i - 1] = true; i--; j--; }
        else if (dp[i][j] === dp[i - 1][j - 1] + 1) { i--; j--; }
        else if (dp[i][j] === dp[i - 1][j] + 1) { i--; }
        else { j--; }
      }
      return { dist: dp[n][m], matched };
    }

    /* =========================================================

    const newDeviceId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

    const REC_URL_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/|macros\/)s\/[A-Za-z0-9_-]+\/(exec|dev)$/;
    (function applyLinkConfig() {

    const DB_NAME = 'ondoku-hakase';
    let dbPromise = null;
    function getDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath: 'id', autoIncrement: true }).createIndex('taskId', 'taskId');
          if (!db.objectStoreNames.contains('recordings')) db.createObjectStore('recordings', { keyPath: 'id' }).createIndex('taskId', 'taskId');
          if (!db.objectStoreNames.contains('models')) db.createObjectStore('models', { keyPath: 'taskId' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }
    async function idbReq(storeName, mode, fn) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const req = fn(tx.objectStore(storeName));
        let result;
        if (req) req.onsuccess = () => { result = req.result; };
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }
    const DB = {
      add: (s, v) => idbReq(s, 'readwrite', st => st.add(v)),
      put: (s, v) => idbReq(s, 'readwrite', st => st.put(v)),
      get: (s, k) => idbReq(s, 'readonly', st => st.get(k)),

    // 1回の ちょうせんを ほぞん。録音は「さいしん3回」と「さいこうてんの回」だけ のこす。

    async function pruneRecordings(taskId) {
      const recs = await DB.byTask('recordings', taskId);

      const best = [...recs].sort((a, b) => (b.total - a.total) || (b.at - a.at))[0];

    function blobToDataURL(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); }); }
    async function dataURLToBlob(url) { return (await fetch(url)).blob(); }
    function downloadFile(name, content, type) {

    /* =========================================================
       音声（マイク・録音・音声認識・読み上げ・効果音）
       ========================================================= */
    const LEVEL = { db: -100, listeners: new Set(), timer: null };
    const Mic = {
      stream: null, ctx: null, analyser: null, buf: null, processed: null,
      live() { return this.stream && this.stream.getAudioTracks().some(t => t.readyState === 'live'); },
      async ensure() {
        if (this.live()) { if (this.ctx.state === 'suspended') await this.ctx.resume(); return; }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-media');
        // 声の大きさを はかるので、自動音量調整などは オフにする
        this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = this.ctx || new AC();
        if (this.ctx.state === 'suspended') await this.ctx.resume();
        const src = this.ctx.createMediaStreamSource(this.stream);
        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 2048;
        src.connect(this.analyser);
        this.buf = new Float32Array(this.analyser.fftSize);
        if (!LEVEL.timer) {
          LEVEL.timer = setInterval(() => {
            if (!Mic.analyser) return;
            const fr = Mic.read();
            LEVEL.db = fr.db;
            LEVEL.listeners.forEach(fn => { try { fn(fr); } catch (e) { console.error(e); } });
          }, 50);
        }
      },
      // 先生の お手本録音用（ききやすい音にするため 自動調整 オン）
      async ensureProcessed() {
        if (this.processed && this.processed.getAudioTracks().some(t => t.readyState === 'live')) return this.processed;
        this.processed = await navigator.mediaDevices.getUserMedia({ audio: true });
        return this.processed;
      },
      read() {
        this.analyser.getFloatTimeDomainData(this.buf);
        let sum = 0, peak = 0;
        for (let i = 0; i < this.buf.length; i++) { const v = this.buf[i]; sum += v * v; const a = v < 0 ? -v : v; if (a > peak) peak = a; }
        const rms = Math.sqrt(sum / this.buf.length);
        return { db: 20 * Math.log10(rms + 1e-10), peak, buf: this.buf, sr: this.ctx.sampleRate };
      },
    };

    // 声の高さ（YIN法の かんたん版）
    let PITCH_WORK = new Float32Array(1024);
    function detectPitch(buf, sr) {
      const n = Math.floor(buf.length / 2);
      if (PITCH_WORK.length < n) PITCH_WORK = new Float32Array(n);
      const x = PITCH_WORK;
      for (let i = 0; i < n; i++) x[i] = (buf[2 * i] + buf[2 * i + 1]) * 0.5;
      const fs = sr / 2;
      const minTau = Math.max(2, Math.floor(fs / 650));
      const maxTau = Math.min(Math.floor(fs / 70), Math.floor(n / 2));
      const W = n - maxTau;
      const d = new Float32Array(maxTau + 1);
      for (let tau = 1; tau <= maxTau; tau++) { let s = 0; for (let j = 0; j < W; j++) { const v = x[j] - x[j + tau]; s += v * v; } d[tau] = s; }
      let run = 0; d[0] = 1;
      for (let tau = 1; tau <= maxTau; tau++) { run += d[tau]; d[tau] = run > 0 ? d[tau] * tau / run : 1; }
      let tau = -1;
      for (let t = minTau; t <= maxTau; t++) { if (d[t] < 0.18) { while (t + 1 <= maxTau && d[t + 1] < d[t]) t++; tau = t; break; } }
      if (tau < 0) return 0;
      const a = d[tau - 1], b = d[tau], c = tau + 1 <= maxTau ? d[tau + 1] : b;
      const den = a - 2 * b + c;
      const shift = den ? 0.5 * (a - c) / den : 0;
      const f = fs / (tau + (Math.abs(shift) < 1 ? shift : 0));
      return f >= 70 && f <= 650 ? f : 0;
    }

    function pickMime() {
      if (!window.MediaRecorder) return '';
      return ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    }

    // 音声認識（Chrome の webkitSpeechRecognition）
    class Recognizer {
      constructor() {
        this.SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        this.supported = !!this.SR;
        this.segments = []; this.error = null; this.noSpeech = false;
        this.active = false; this.running = false; this.r = null; this._onEnd = null;
      }
      start() { if (!this.supported || this.active) return; this.active = true; this._spawn(); }
      _spawn() {
        const r = new this.SR();
        r.lang = 'ja-JP'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 5;
        const seg = { finals: [], interim: '' };
        this.segments.push(seg);
        r.onresult = (e) => {
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const res = e.results[i];
            if (res.isFinal) { const alts = []; for (let k = 0; k < res.length; k++) alts.push(res[k].transcript); seg.finals[i] = alts; }
            else interim += res[0].transcript;
          }
          seg.interim = interim;
        };
        r.onerror = (e) => { if (e.error === 'no-speech') this.noSpeech = true; else if (e.error !== 'aborted') this.error = e.error; };
        r.onend = () => {
          this.running = false;
          if (this.active && !this.error && this.segments.length < 10) { setTimeout(() => { if (this.active) this._spawn(); }, 50); }
          else if (this._onEnd) { const f = this._onEnd; this._onEnd = null; f(); }
        };
        this.r = r;
        try { r.start(); this.running = true; } catch (err) { this.error = 'start-failed'; }
      }
      stop() {
        this.active = false;
        return new Promise((resolve) => {
          if (!this.r || !this.running) return resolve();
          const timer = setTimeout(() => { this._onEnd = null; try { this.r.abort(); } catch (e) {} resolve(); }, 3500);
          this._onEnd = () => { clearTimeout(timer); resolve(); };
          try { this.r.stop(); } catch (e) { clearTimeout(timer); resolve(); }
        });
      }
      abort() { this.active = false; this._onEnd = null; try { this.r && this.r.abort(); } catch (e) {} }
      candidates() {
        const segs = this.segments.map(s => { const f = s.finals.filter(Boolean); return { tops: f.map(a => a[0] || ''), alts: f, interim: s.interim || '' }; });
        const join = (ov) => segs.map((s, si) => s.tops.map((t, ri) => (ov && ov[0] === si && ov[1] === ri) ? ov[2] : t).join('') + s.interim).join('');
        const list = [join(null)];
        segs.forEach((s, si) => s.alts.forEach((alts, ri) => alts.slice(1).forEach(alt => list.push(join([si, ri, alt])))));
        return [...new Set(list.map(x => x.trim()))].filter(Boolean).slice(0, 60);
      }
    }

    // 1回の 録音（ノイズ測定 → 録音 → 音声認識）
    class RecSession {
      constructor({ maxSec = 60, onMax, withRecognition = true } = {}) {
        this.maxSec = maxSec; this.onMax = onMax;
        this.mode = 'idle'; this.noise = []; this.frames = []; this.chunks = [];
        this.recognizer = withRecognition ? new Recognizer() : null;
        this.tick = this.tick.bind(this);
        LEVEL.listeners.add(this.tick);
      }
      tick(fr) {
        if (this.mode === 'noise') this.noise.push(fr.db);
        else if (this.mode === 'rec') {
          const t = (performance.now() - this.t0) / 1000;
          const nd = this.noiseDb == null ? -70 : this.noiseDb;
          const f0 = fr.db > Math.max(nd + 8, -62) ? detectPitch(fr.buf, fr.sr) : 0;
          this.frames.push({ t, db: fr.db, peak: fr.peak, f0 });
          if (t > this.maxSec && !this.maxFired) { this.maxFired = true; this.onMax && this.onMax(); }
        }
      }
      beginNoise() { this.mode = 'noise'; }
      startRecognition() { this.recognizer && this.recognizer.start(); }
      startRecording() {
        this.noiseDb = this.noise.length ? percentile(this.noise, 0.5) : null;
        this.mode = 'rec'; this.t0 = performance.now();
        try {
          const mime = pickMime(); this.mime = mime || 'audio/webm';
          this.mr = new MediaRecorder(Mic.stream, mime ? { mimeType: mime, audioBitsPerSecond: 48000 } : undefined);
          this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
          this.mr.start(250);
        } catch (e) { this.mr = null; }
      }
      async stop() {
        this.mode = 'idle'; LEVEL.listeners.delete(this.tick);
        const blobP = new Promise(res => {
          if (!this.mr || this.mr.state === 'inactive') return res(null);
          this.mr.onstop = () => res(new Blob(this.chunks, { type: this.mime }));
          try { this.mr.stop(); } catch (e) { res(null); }
        });
        const recP = this.recognizer ? this.recognizer.stop() : Promise.resolve();
        const [blob] = await Promise.all([blobP, recP]);
        const rz = this.recognizer;
        return {
          frames: this.frames, noiseDb: this.noiseDb, blob, mime: this.mime,
          candidates: rz ? rz.candidates() : [],
          recogError: !rz ? null : (rz.supported ? rz.error : 'unsupported'),
        };
      }
      cancel() {
        this.mode = 'idle'; LEVEL.listeners.delete(this.tick);
        try { if (this.mr && this.mr.state !== 'inactive') this.mr.stop(); } catch (e) {}
        this.recognizer && this.recognizer.abort();
      }
    }

    // 読み上げ（はかせの声・お手本）
    const TTS = {
      voice: null,
      init() {
        if (!('speechSynthesis' in window)) return;
        const pick = () => {
          const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
          this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
        };
        pick();
        speechSynthesis.onvoiceschanged = pick;
      },
      speak(text, { rate = 1, pitch = 1 } = {}) {
        return new Promise(resolve => {
          if (!('speechSynthesis' in window) || !text) return resolve();
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = rate; u.pitch = pitch;
          let done = false;
          const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
          const timer = setTimeout(finish, 2000 + text.length * 380 / rate);
          u.onend = finish; u.onerror = finish;
          this.current = u; // Chrome で onend が 来なくなるのを ふせぐため 参照を のこす
          speechSynthesis.speak(u);
        });
      },
      cancel() { if ('speechSynthesis' in window) speechSynthesis.cancel(); },
    };
    TTS.init();

    // 録音の再生（小さい声の録音は 音量を 上げて 再生）
    let PLAY_CTX = null;
    function playBlob(blob, { rate = 1, boost = 1 } = {}) {
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.playbackRate = rate; audio.preservesPitch = true;
      if (boost > 1.05) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          PLAY_CTX = PLAY_CTX || new AC();
          if (PLAY_CTX.state === 'suspended') PLAY_CTX.resume();
          const src = PLAY_CTX.createMediaElementSource(audio);
          const g = PLAY_CTX.createGain(); g.gain.value = boost;
          const comp = PLAY_CTX.createDynamicsCompressor();
          src.connect(g); g.connect(comp); comp.connect(PLAY_CTX.destination);
        } catch (e) { /* ふつうに再生 */ }
      }
      const done = new Promise(res => {
        let fin = false;
        const end = () => { if (fin) return; fin = true; URL.revokeObjectURL(url); res(); };
        audio.onended = end; audio.onerror = end; audio.onpause = end;
      });
      audio.play().catch(() => {});
      return { audio, done };
    }
    const boostFor = level => (level == null ? 1 : clamp(10 ** ((-22 - level) / 20), 1, 6));

    // 効果音
    let SFX_CTX = null;
    const SFX_SEQ = {
      tap: [[660, 0.07]], count: [[523, 0.12, 0.10]], go: [[880, 0.14, 0.12]],
      pass: [[523, 0.12], [659, 0.12], [784, 0.12], [1047, 0.4]],
      try: [[523, 0.15], [659, 0.3]],
      sticker: [[784, 0.1], [988, 0.1], [1175, 0.3]],
      clear: [[523, 0.12], [523, 0.12], [523, 0.12], [698, 0.35], [880, 0.2], [1047, 0.5]],
      wrong: [[260, 0.25, 0.1]],
    };
    function sfx(name) {
      if (!CURRENT.settings.sfx) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        SFX_CTX = SFX_CTX || new AC();
        if (SFX_CTX.state === 'suspended') SFX_CTX.resume();
        let t = SFX_CTX.currentTime + 0.01;
        (SFX_SEQ[name] || []).forEach(([freq, dur, vol = 0.14]) => {
          const o = SFX_CTX.createOscillator(), g = SFX_CTX.createGain();
          o.type = 'sine'; o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g); g.connect(SFX_CTX.destination);
          o.start(t); o.stop(t + dur + 0.05);
          t += dur;
        });
      } catch (e) {}
    }

    /* =========================================================
       採点
       ========================================================= */
    function firstMissedWord(info, missed) {
      const isBreak = tok => tok.type === 'space' || (tok.type === 'char' && /[、。！？「」]/.test(tok.text));
      for (let li = 0; li < info.lines.length; li++) {
        const toks = info.lines[li];
        for (let ti = 0; ti < toks.length; ti++) {
          if (!missed.has(li + '-' + ti)) continue;
          let a = ti; while (a > 0 && !isBreak(toks[a - 1])) a--;
          let b = ti; while (b + 1 < toks.length && !isBreak(toks[b + 1])) b++;
          let s = '';
          for (let x = a; x <= b; x++) s += toks[x].type === 'kanji' ? toks[x].rt : toks[x].type === 'char' ? toks[x].text : '';
          return s.slice(0, 12);
        }
      }
      return '';
    }

    function scoreAttempt({ info, frames, noiseDb, candidates, strictKey, micGoodDb, isHaya }) {
      const S = STRICTNESS[strictKey] || STRICTNESS.normal;
      const W = isHaya ? WEIGHTS_HAYA : WEIGHTS;

      // --- よみの せいかくさ（音声認識の 結果と お手本を くらべる）
      let best = { sim: 0, raw: '', matched: new Array(info.target.length).fill(false) };
      for (const c of candidates) {
        const h = heardToKana(c, info);
        if (!h) continue;
        const { dist, matched } = alignMatches(info.target, h);
        const sim = Math.max(0, 1 - dist / Math.max(1, info.target.length));
        if (!best.raw || sim > best.sim + 1e-9) best = { sim, raw: c, matched };
      }
      const accR = best.raw ? clamp01((best.sim - S.accS0) / (0.95 - S.accS0)) : 0;

      // --- こえの おおきさ・つよさよわさ・はやさ（マイクの 音から）
      const dbAll = frames.map(f => f.db);
      const p10 = percentile(dbAll, 0.1);
      let noise = Number.isFinite(noiseDb) ? noiseDb : Infinity;
      if (p10 != null) noise = Math.min(noise, p10 + 2);
      noise = Number.isFinite(noise) ? clamp(noise, -95, -35) : -70;
      const thr = Math.max(noise + 8, -62);
      let voiced = frames.filter(f => f.db > thr);
      // まわりが にぎやかで 声を 見分けにくいのに、ことばは 正しく 聞き取れている ときは、
      // 録音の中で 大きい方の 音を 声として あつかう
      if (voiced.length < 4 && best.raw && best.sim >= 0.5 && frames.length >= 8) {
        const cut = percentile(dbAll, 0.4);
        voiced = frames.filter(f => f.db >= cut);
      }
      const silent = voiced.length < 4;
      let volR = 0, dynR = 0, spdR = 0, level = null, tooLoud = false, readSec = 0, rate = 0, speedDir = 'ok';
      if (!silent) {
        level = percentile(voiced.map(f => f.db), 0.75);
        const good = micGoodDb + S.volShift;
        const absR = clamp01((level - (good - 22)) / 22);
        const snrR = clamp01((level - noise - 8) / S.snrSpan);
        volR = Math.max(absR, snrR);
        const clip = voiced.filter(f => f.peak >= 0.98).length / voiced.length;
        if (clip > 0.08 || level > good + 14) { tooLoud = true; volR *= 0.9; }

        const k = S.dynScale;
        const rDb = clamp01((std(voiced.map(f => f.db)) - 1.5 * k) / (3.5 * k));
        let rF0 = rDb;
        const f0s = voiced.map(f => f.f0).filter(f => f > 0);
        if (f0s.length >= 6) {
          const med = percentile(f0s, 0.5);
          const st = f0s.map(f => 12 * Math.log2(f / med)).filter(x => Math.abs(x) < 10);
          if (st.length >= 6) rF0 = clamp01((std(st) - 0.6 * k) / (1.9 * k));
        }
        dynR = Math.max(S.dynFloor, 0.5 * rDb + 0.5 * rF0);
        if (info.mora <= 6) dynR = Math.max(dynR, 0.75);

        readSec = Math.max(0.3, voiced[voiced.length - 1].t - voiced[0].t + 0.05);
        rate = info.mora / readSec;
        if (isHaya) { spdR = clamp01((rate - 2) / (S.hayaTarget - 2)); if (spdR < 0.8) speedDir = 'slow'; }
        else if (info.mora <= 5) spdR = 1;
        else if (rate < S.speedLo) { spdR = clamp01((rate - S.speedLo * 0.4) / (S.speedLo * 0.6)); speedDir = 'slow'; }
        else if (rate > S.speedHi) { spdR = clamp01(1 - (rate - S.speedHi) / S.speedHi); speedDir = 'fast'; }
        else spdR = 1;
      }

      // 読んでいない（ちがう ことばを いった）ときは 声の点数も ひかえめに
      const gate = best.raw ? 0.3 + 0.7 * clamp01(best.sim / 0.5) : 0.3;
      const ratios = { vol: volR * gate, acc: accR, dyn: dynR * gate, spd: spdR * gate };
      const parts = {
        vol: Math.round(W.vol * ratios.vol), acc: Math.round(W.acc * ratios.acc),
        dyn: Math.round(W.dyn * ratios.dyn), spd: Math.round(W.spd * ratios.spd),
      };
      const total = parts.vol + parts.acc + parts.dyn + parts.spd;

      const missed = new Set();
      if (best.raw && best.sim >= 0.3 && best.sim < 0.97) {
        const counts = {};
        info.map.forEach(([li, ti], idx) => {
          const key = li + '-' + ti;
          counts[key] = counts[key] || [0, 0];
          counts[key][0]++;
          if (best.matched[idx]) counts[key][1]++;
        });
        Object.entries(counts).forEach(([key, [n, m]]) => { if (m / n < 0.5) missed.add(key); });
      }
      const r = { total, parts, weights: W, ratios, sim: best.sim, heard: best.raw, missed, silent, tooLoud, readSec, rate, speedDir, level, noise };
      r.comment = buildComment(r, info, isHaya);
      return r;
    }

    function buildComment(r, info, isHaya) {
      if (!r.heard && r.silent) return 'あれれ？ こえが きこえなかったぞ。マイクに むかって、もういちど よんで みよう！';
      if (!r.heard) return 'ううむ、はかせには ことばが よく ききとれなかったのう。おてほんを きいてから、はっきり よんで みよう！';
      const open = r.total >= 95 ? 'ほっほう！ すばらしい！' : r.total >= PASS_SCORE ? 'ほっほう！ ごうかくじゃ！' : r.total >= 60 ? 'おしい！ あと すこしじゃ！' : 'よく ちょうせん したのう！';
      const order = ['acc', 'vol', 'spd', 'dyn'];
      const top = order.reduce((a, k) => r.ratios[k] > r.ratios[a] ? k : a, order[0]);
      const low = order.reduce((a, k) => r.ratios[k] < r.ratios[a] ? k : a, order[0]);
      const praise = r.ratios[top] < 0.6 ? 'こえに だして ちょうせん できたのう。' : {
        acc: 'ことばを ただしく よめたのう。',
        vol: 'こえが よく きこえたぞ。',
        spd: isHaya ? 'したが よく まわって おる！' : 'ちょうど いい はやさじゃ。',
        dyn: 'よみかたに めりはりが あって じょうずじゃ。',
      }[top];
      let tip;
      if (r.ratios[low] < 0.8 && low !== top) {
        if (low === 'acc') { const w = firstMissedWord(info, r.missed); tip = w ? `「${w}」の ところを ゆっくり よんで みよう。` : 'おてほんを よく きいて、ゆっくり よんで みよう。'; }
        else if (low === 'vol') tip = r.tooLoud ? 'げんき いっぱいじゃ！ つぎは ちょうど いい こえで よもう。' : 'つぎは もうすこし おおきな こえで。こえメーターの みどりを めざそう！';
        else if (low === 'spd') tip = isHaya ? 'つぎは もうすこし はやく いえるかな？' : r.speedDir === 'fast' ? 'つぎは すこし ゆっくり よんで みよう。' : 'もうすこし すらすら よめると いいのう。';
        else tip = 'だいじな ことばを すこし つよく よむと、もっと すてきに なるぞ。';
      } else tip = r.total >= PASS_SCORE ? 'この ちょうしで がんばろう！' : 'もういちど よんで みよう！';
      return `${open} ${praise} ${tip}`;
    }

    /* =========================================================
       すすみぐあい
       ========================================================= */
    const isStageCleared = (stage, st) => stage.tasks.every(t => st.progress[t.id] && st.progress[t.id].passed);
    function isStageOpen(stage, st) {
      if (stage.optional || st.settings.unlockAll || stage.id === 's1') return true;
      if (stage.id === 'haya') return isStageCleared(STAGE_MAP.s2, st);
      const i = MAIN_IDS.indexOf(stage.id);
      return isStageCleared(STAGE_MAP[MAIN_IDS[i - 1]], st);
    }
    function isTaskOpen(stage, i, st) {
      if (!isStageOpen(stage, st)) return false;
      if (stage.optional || st.settings.unlockAll || i === 0) return true;
      const prev = st.progress[stage.tasks[i - 1].id];
      return !!(prev && prev.passed);
    }
    const countCleared = st => CLEAR_IDS.filter(id => isStageCleared(STAGE_MAP[id], st)).length;
    function findNextChallenge(st) {
      for (const id of CLEAR_IDS) {
        const s = STAGE_MAP[id];
        if (!isStageOpen(s, st)) continue;
        const i = s.tasks.findIndex((t, k) => isTaskOpen(s, k, st) && !(st.progress[t.id] && st.progress[t.id].passed));
        if (i >= 0) return { stage: s, index: i };
      }
      return null;
    }
    function stageLockHint(stage) {
      if (stage.id === 'haya') return 'ステージ2を クリアすると ひらくよ';
      return `ステージ${MAIN_IDS.indexOf(stage.id)}を クリアすると ひらくよ`;
    }
    function pickSticker(st) {
      const owned = new Set(Object.values(st.progress).map(p => p.sticker).filter(Boolean));
      const pool = STICKERS.filter(e => !owned.has(e));
      const list = pool.length ? pool : STICKERS;
      return list[Math.floor(Math.random() * list.length)];
    }
    const stageLabel = stage => stage.optional ? 'じゅんびうんどう' : stage.id === 'haya' ? `とくべつ ステージ` : `ステージ${stage.no}`;

    /* =========================================================
       先生の スプレッドシートへ 記録を 送る
       ========================================================= */
    const SYNC_BATCH = 200;
    function fnv(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }

    // いちらん シートの 列（ステージ1〜6 → 早口言葉 → じゅんびうんどう の順）
    function syncColumns() {
      const order = [...MAIN_IDS, 'haya', 'warm'];
      return order.flatMap(id => STAGE_MAP[id].tasks.map((t, i) => ({
        id: t.id,
        short: id === 'haya' ? `早${i + 1}` : id === 'warm' ? `準${i + 1}` : `${STAGE_MAP[id].no}-${i + 1}`,
        label: `${stageLabel(STAGE_MAP[id])} ${i + 1}もんめ：${t.lines.map(l => stripMarkup(l)).join(' ')}`.slice(0, 60),
      })));
    }
    function syncSummary(st) {
      const graded = ALL_TASKS.filter(x => !x.stage.optional);
      const ps = Object.values(st.progress);
      const next = findNextChallenge(st);
      const title = TITLES[countCleared(st)];
      const best = {};
      Object.entries(st.progress).forEach(([id, p]) => { if (p.tries) best[id] = p.best; });
      return {
        title: `${title.icon} ${title.name}`,
        passed: graded.filter(x => st.progress[x.task.id] && st.progress[x.task.id].passed).length,
        graded: graded.length,
        tries: ps.reduce((s, p) => s + (p.tries || 0), 0),
        lastAt: ps.reduce((m, p) => Math.max(m, p.lastAt || 0), 0),
        current: next ? `${stageLabel(next.stage)}の ${next.index + 1}もんめ` : 'ぜんぶ クリア',
        best,
      };
    }
    function syncRecord(st, h) {
      const x = TASK_LOOKUP[h.taskId];
      return {
        uid: `${st.deviceId}-${h.at}-${h.taskId}`, at: h.at, taskId: h.taskId,
        stage: x ? `${stageLabel(x.stage)} ${x.stage.name}` : '', no: x ? x.index + 1 : '', label: x ? taskLabel(x.task) : h.taskId,
        total: h.total, vol: h.parts.vol, acc: h.parts.acc, dyn: h.parts.dyn, spd: h.parts.spd,
        readSec: h.readSec, heard: h.heard || '', strict: (STRICTNESS[h.strict] || {}).label || '',
      };
    }
    const SYNC_ERRORS = {
      key: '合言葉が一致しません。入口ページから開き直すか、正しい合言葉を入力してください。',
      'not-json': 'Apps Script から正しい返事がありません。デプロイの「アクセスできるユーザー」が「全員」になっているか確認してください。',
      fetch: '送信できませんでした。インターネット接続と、Apps Script のデプロイ（アクセスできるユーザー「全員」）を確認してください。',
    };
    const Sync = {
      running: null,
      run(app, opts = {}) {
        if (this.running) return this.running;
        this.running = this._run(app, opts).finally(() => { this.running = null; });
        return this.running;
      },
      async _run(app, { all = false } = {}) {
        const st = app.stateRef.current;
        const sync = st.sync || {};
        if (!sync.url || !st.profile) return { ok: false, reason: 'nourl' };
        if (navigator.onLine === false) return { ok: false, reason: 'offline' };
        try {
          const hist = (await DB.getAll('history')).sort((a, b) => a.at - b.at);
          const targets = hist.filter(h => all || !h.sent);
          const summary = syncSummary(st);
          const sumKey = fnv(st.profile.name + JSON.stringify(summary));
          if (!targets.length && !all && sync.lastSummary === sumKey) return { ok: true, sent: 0 };
          let i = 0;
          do {
            const batch = targets.slice(i, i + SYNC_BATCH);
            const payload = {
              app: 'ondoku-hakase', v: 1, key: sync.key || '', deviceId: st.deviceId, name: st.profile.name,
              summary, columns: syncColumns(), records: batch.map(h => syncRecord(st, h)),
            };
            let res;
            try {
              res = await fetch(sync.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
            } catch (e) { throw new Error('fetch'); }
            let data;
            try { data = await res.json(); } catch (e) { throw new Error('not-json'); }
            if (!data || !data.ok) throw new Error((data && data.error) || 'server');
            for (const h of batch) if (!h.sent) await DB.put('history', { ...h, sent: true });
            i += SYNC_BATCH;
          } while (i < targets.length);
          app.update(s => ({ ...s, sync: { ...s.sync, lastOkAt: Date.now(), lastError: null, lastSummary: sumKey } }));
          return { ok: true, sent: targets.length };
        } catch (e) {
          const code = String((e && e.message) || e);
          app.update(s => ({ ...s, sync: { ...s.sync, lastError: code, lastErrorAt: Date.now() } }));
          return { ok: false, reason: code };
        }
      },
    };
    const syncErrorText = code => SYNC_ERRORS[code] || `送信できませんでした（${code}）。`;

    /* =========================================================
       見た目の 部品
       ========================================================= */
    function Hakase({ mood = 'normal', talking = false, size = 140 }) {
      const happy = mood === 'happy' || mood === 'cheer';
      const eyeY = mood === 'think' ? 86 : 92;
      const eyeR = mood === 'surprise' ? 16 : 13;
      return (
        <svg viewBox="0 0 200 210" width={size} height={size * 1.05} role="img" aria-label="ホーホーはかせ"
             className={mood === 'cheer' ? 'hakase-jump' : 'hakase-bob'} style={{ overflow: 'visible', flexShrink: 0 }}>
          <path d="M44 66 L34 24 L74 48 Z" fill="#7a4e2d" />
          <path d="M156 66 L166 24 L126 48 Z" fill="#7a4e2d" />
          <g className={happy ? 'wing-l' : ''}><ellipse cx="40" cy="138" rx="18" ry="42" fill="#7a4e2d" transform="rotate(12 40 138)" /></g>
          <g className={happy ? 'wing-r' : ''}><ellipse cx="160" cy="138" rx="18" ry="42" fill="#7a4e2d" transform="rotate(-12 160 138)" /></g>
          <ellipse cx="100" cy="126" rx="66" ry="74" fill="#9a6a43" />

    const BTN_COLORS = {
      sky: 'bg-sky-500 hover:bg-sky-600 border-sky-700 text-white',
      red: 'bg-rose-500 hover:bg-rose-600 border-rose-700 text-white',
      green: 'bg-emerald-500 hover:bg-emerald-600 border-emerald-700 text-white',
      amber: 'bg-amber-400 hover:bg-amber-500 border-amber-600 text-amber-950',
      violet: 'bg-violet-500 hover:bg-violet-600 border-violet-700 text-white',

    const BTN_SIZES = { sm: 'px-3 py-2 text-base', md: 'px-5 py-3 text-xl', lg: 'px-6 py-4 text-2xl', xl: 'px-8 py-5 text-3xl' };
    function Btn({ color = 'sky', size = 'md', className = '', onClick, ...p }) {
      return <button {...p} onClick={(e) => { sfx('tap'); onClick && onClick(e); }} className={`btn3d ${BTN_COLORS[color]} ${BTN_SIZES[size]} ${className}`} />;
    }

    function SceneCard({ task, compact = false, height }) {
      const n = task.pic.length;
      const size = compact ? (n <= 1 ? 60 : n <= 3 ? 44 : 36) : (n <= 1 ? 110 : n <= 3 ? 84 : 66);
      return (
        <div className="rounded-3xl border-4 border-white shadow-md flex items-center justify-center gap-2 overflow-hidden"
             style={{ background: SCENE_BG[task.bg] || SCENE_BG.sky, minHeight: compact ? 90 : (height || 190) }}>

            <span key={i} className="float select-none" style={{ fontSize: size, lineHeight: 1.15, animationDelay: `${i * 0.45}s` }}>{e}</span>
          ))}
        </div>
      );

    function Tok({ tok, miss }) {
      if (tok.type === 'space') return <span style={{ display: 'inline-block', width: '0.55em' }} />;
      if (tok.type === 'kanji') return <ruby className={miss ? 'miss' : ''}>{tok.base}<rt>{tok.rt}</rt></ruby>;
      return <span className={miss ? 'miss' : ''}>{tok.text}</span>;
    }

    function baseFontSize(info) {
      const L = info.maxLen;
      return L <= 6 ? 72 : L <= 10 ? 56 : L <= 16 ? 44 : L <= 22 ? 36 : 30;
    }

    // 行の はばを 文字数で みつもる（分かち書きの すきまは 0.55文字ぶん）
    const lineEm = toks => toks.reduce((s, t) => s + (t.type === 'space' ? 0.58 : t.type === 'kanji' ? Math.max(t.base.length * 1.06, t.rt.length * 0.45) : 1.06), 0) + 0.9;

    function TextCard({ task, info, fontScale = 1, slit = false, line = 0, onLine, missed, small = false }) {
      const boxRef = useRef(null);
      const [box, setBox] = useState({ w: 0, vw: window.innerWidth, vh: window.innerHeight });
      useEffect(() => {
        const el = boxRef.current;
        if (!el) return;
        const measure = () => setBox({ w: el.clientWidth, vw: window.innerWidth, vh: window.innerHeight });
        measure();
        window.addEventListener('resize', measure);
        const ro = window.ResizeObserver ? new ResizeObserver(measure) : null;
        if (ro) ro.observe(el);
        return () => { window.removeEventListener('resize', measure); if (ro) ro.disconnect(); };
      }, []);
      const multi = info.lines.length > 1;
      const lh = multi ? 1.85 : 2.05;
      // 1行が はみださない 大きさ
      const widest = Math.max(...info.lines.map(lineEm));
      const fitW = box.w ? (box.w - 56) / widest : Infinity;
      // 横長の画面（Chromebook）では、ボタンまで スクロールせずに 見えるように 高さも 合わせる
      let fitH = Infinity;
      if (!small && box.vw >= 1024) {
        // ヘッダーと見出し 約135px、1ぎょうずつボタン 約62px、カードの余白 約40px（ふりがなで 行が 少し 高くなるぶんも みこむ）
        const avail = box.vh - 135 - (multi ? 62 : 0) - 20 - 40 - (task.title ? 40 : 0);
        fitH = avail / (info.lines.length * lh * 1.08);
      }
      // 文字の大きさ設定は 最後に かける（はみだす ときは 分かち書きの ところで 折り返す）
      const base = Math.max(24, Math.min(baseFontSize(info), fitW, fitH) * fontScale) * (small ? 0.62 : 1);
      return (
        <div ref={boxRef} className="bg-white rounded-3xl border-4 border-amber-200 shadow-md px-4 py-4 md:px-6">
          {task.title && !small && <div className="text-center text-amber-700 font-bold mb-1" style={{ fontSize: Math.max(22, base * 0.55) }}>「{task.title}」</div>}
          <div className="flex justify-center">
            <div className="flex flex-col items-start gap-1 max-w-full">
              {info.lines.map((toks, li) => (
                <div key={li}
                     onClick={() => { if (slit && multi && onLine) onLine(li); }}
                     className={`ondoku-line ${slit && multi ? (li === line ? 'slit-on' : 'slit-off') : ''}`}
                     style={{ fontSize: base, lineHeight: lh }}>
                  {toks.map((tok, ti) => <Tok key={ti} tok={tok} miss={missed && missed.has(li + '-' + ti)} />)}
                </div>
              ))}
            </div>
          </div>
          {task.source && !small && <div className="text-sm text-slate-400 text-right mt-1">（{task.source}）</div>}
        </div>
      );
    }

    function VoiceMeter({ goodDb }) {
      const [db, setDb] = useState(-100);
      useEffect(() => {
        const id = setInterval(() => setDb(prev => Math.max(LEVEL.db, prev - 2.5)), 60);
        return () => clearInterval(id);
      }, []);
      const lo = goodDb - 30, hi = goodDb + 10;
      const pos = v => clamp01((v - lo) / (hi - lo)) * 100;
      const pct = pos(db), gs = pos(goodDb - 8), ge = pos(goodDb + 5);
      const zone = pct < gs ? 0 : pct > ge ? 2 : 1;
      const face = ['🤫', '😄', '😲'][zone];
      const label = ['もっと おおきく', 'ちょうど いい！', 'おおきすぎ かも'][zone];
      return (
        <div className="w-full">
          <div className="flex items-center justify-between text-lg font-bold mb-1">
            <span className="text-slate-600">📢 こえメーター</span>
            <span className={zone === 1 ? 'text-emerald-600' : zone === 0 ? 'text-slate-500' : 'text-orange-500'}>{label}</span>
          </div>
          <div className="relative h-10 rounded-full bg-slate-200 overflow-hidden border-2 border-slate-300">
            <div className="absolute inset-y-0 bg-emerald-200" style={{ left: `${gs}%`, width: `${ge - gs}%` }} />
            <div className="absolute inset-y-0 left-0 rounded-full transition-all duration-75"
                 style={{ width: `${pct}%`, background: zone === 1 ? '#10b981' : zone === 0 ? '#94a3b8' : '#f97316', opacity: 0.85 }} />
            <div className="absolute inset-y-0 flex items-center text-3xl transition-all duration-75" style={{ left: `calc(${pct}% - 18px)` }}>{face}</div>
          </div>
        </div>
      );
    }

    function TaskScreen({ app, stage, index, onGoTask, onBackToStage }) {
      const task = stage.tasks[index];
      const info = getTaskInfo(task, stage);
      const { state, update } = app;
      const settings = state.settings;
      const isHaya = stage.id === 'haya';
      const fontScale = FONT_SCALE[settings.fontSize] || 1;

      const [phase, setPhase] = useState('intro');   // intro | practice | countdown | recording | analyzing | result
      const [listened, setListened] = useState(false);
      const [count, setCount] = useState(3);
      const [line, setLine] = useState(0);
      const [slitOn, setSlitOn] = useState(settings.slit);
      const [elapsed, setElapsed] = useState(0);
      const [result, setResult] = useState(null);
      const [talk, setTalk] = useState({ text: '', mood: 'normal', talking: false });
      const [playing, setPlaying] = useState(null);
      const [modelRec, setModelRec] = useState(null);
      const [problem, setProblem] = useState(null);

      const sessRef = useRef(null);
      const audioRef = useRef(null);
      const tokenRef = useRef(0);
      const aliveRef = useRef(true);
      const resultBlobRef = useRef(null);

      const say = useCallback((text, mood = 'normal', speak = true) => {
        const doSpeak = speak && CURRENT.settings.hakaseVoice;
        setTalk({ text, mood, talking: doSpeak });
        if (doSpeak) TTS.speak(text, HAKASE_VOICE).then(() => { if (aliveRef.current) setTalk(t => t.text === text ? { ...t, talking: false } : t); });
      }, []);

      const stopAudio = () => {
        tokenRef.current++;
        TTS.cancel();
        if (audioRef.current) { try { audioRef.current.pause(); } catch (e) {} audioRef.current = null; }
        setPlaying(null);
        setTalk(t => ({ ...t, talking: false }));
      };

      useEffect(() => {
        aliveRef.current = true;
        DB.get('models', task.id).then(m => { if (aliveRef.current && m) setModelRec(m); }).catch(() => {});
        const intro = info.mora <= 6 && info.lines.length === 1
          ? 'この ことばを よんで みよう！ まずは おてほんを きいてね。'
          : isHaya ? 'はやくちことばじゃ！ まずは おてほんを きいて みよう。' : 'この ぶんを よんで みよう！ まずは おてほんを きいてね。';
        say(intro);
        return () => {
          aliveRef.current = false;
          tokenRef.current++;
          TTS.cancel();
          if (audioRef.current) try { audioRef.current.pause(); } catch (e) {}
          if (sessRef.current) sessRef.current.cancel();
        };
      }, []);

      useEffect(() => {
        if (phase !== 'recording') return;
        const t0 = Date.now();
        const id = setInterval(() => setElapsed((Date.now() - t0) / 1000), 200);
        return () => clearInterval(id);
      }, [phase]);

      const playModel = async (slow) => {
        stopAudio();
        const token = tokenRef.current;
        setPlaying(slow ? 'slow' : 'model');
        if (phase === 'practice') stopPractice();
        if (modelRec) {
          setLine(0);
          const p = playBlob(modelRec.blob, { rate: slow ? 0.75 : 1 });
          audioRef.current = p.audio;
          await p.done;
        } else {
          const baseRate = settings.modelSpeed === 'slow' ? 0.75 : settings.modelSpeed === 'fast' ? 1.05 : 0.9;
          const rate = baseRate * (slow ? 0.72 : 1);
          for (let i = 0; i < info.speech.length; i++) {
            if (token !== tokenRef.current) return;
            setLine(Math.min(i, info.lines.length - 1));
            await TTS.speak(info.speech[i], { rate });
            if (token !== tokenRef.current) return;
            await sleep(slow ? 450 : 250);
          }
        }
        if (token !== tokenRef.current || !aliveRef.current) return;
        setPlaying(null); setLine(0);
        if (!listened) {
          setListened(true);
          say('つぎは れんしゅうじゃ。こえに だして よんで みよう。じゅんびが できたら ろくおん ボタンを おしてね。');
        }
      };

      const playMine = async () => {
        if (!resultBlobRef.current) return;
        stopAudio();
        const token = tokenRef.current;
        setPlaying('mine');
        const p = playBlob(resultBlobRef.current, { boost: boostFor(result && result.level) });
        audioRef.current = p.audio;
        await p.done;
        if (token === tokenRef.current && aliveRef.current) setPlaying(null);
      };

      const startPractice = async () => {
        stopAudio();
        try { await Mic.ensure(); } catch (e) { return micProblem(); }
        setListened(true);
        setPhase('practice'); setLine(0);
        say('こえメーターを みながら よんで みよう。みどりの ところが ちょうど いい おおきさじゃ。');
      };
      const stopPractice = () => { setPhase('intro'); };

      const micProblem = () => {
        setProblem('mic');
        setPhase('intro');
        say('マイクが つかえないみたいじゃ。せんせいに しらせてね。', 'surprise');
      };

      const startRecording = async () => {
        stopAudio();
        setProblem(null);
        try { await Mic.ensure(); } catch (e) { return micProblem(); }
        if (resultBlobRef.current) resultBlobRef.current = null;
        setResult(null);
        const sess = new RecSession({ maxSec: info.maxSec, onMax: () => finishRecording() });
        sessRef.current = sess;
        setLine(0);
        setPhase('countdown'); setCount(3);
        say('3・2・1 の あとに よんでね。しずかに まってね。', 'normal', false);
        sess.beginNoise(); sfx('count');
        await sleep(1000); if (sessRef.current !== sess) return;
        setCount(2); sfx('count');
        await sleep(1000); if (sessRef.current !== sess) return;
        setCount(1); sfx('count'); sess.startRecognition();
        await sleep(1000); if (sessRef.current !== sess) return;
        setCount(0); sfx('go');
        await sleep(250); if (sessRef.current !== sess) return;
        sess.startRecording();
        setPhase('recording'); setElapsed(0);
        say(info.lines.length > 1 && slitOn ? 'よみおわったら「よみおわった！」を おしてね。つぎの ぎょうは ▼で すすむよ。' : 'よみおわったら「よみおわった！」を おしてね。', 'normal', false);
      };

      const cancelRecording = () => {
        const sess = sessRef.current;
        sessRef.current = null;
        if (sess) sess.cancel();
        setPhase('intro');
        say('とちゅうで やめたよ。じゅんびが できたら もういちど どうぞ。', 'normal', false);
      };

      const finishRecording = async () => {
        const sess = sessRef.current;
        if (!sess || sess.finishing) return;
        sess.finishing = true;
        setPhase('analyzing');
        say('ふむふむ… はかせが きいて おるぞ…', 'think', false);
        const raw = await sess.stop();
        sessRef.current = null;
        if (!aliveRef.current) return;

        if (raw.recogError && raw.recogError !== 'no-speech') {
          setProblem('recog:' + raw.recogError);
          setPhase('intro');
          say(raw.recogError === 'network'
            ? 'インターネットに つながって いないみたいじゃ。せんせいに しらせてね。'
            : 'はかせの みみが うまく はたらかなかった。もういちど ためして みてね。', 'surprise');
          return;
        }

        const res = scoreAttempt({ info, frames: raw.frames, noiseDb: raw.noiseDb, candidates: raw.candidates, strictKey: settings.strict, micGoodDb: settings.micGoodDb, isHaya });
        const at = Date.now();
        const entry = {
          taskId: task.id, stageId: stage.id, at, total: res.total, parts: res.parts, heard: res.heard,
          sim: Math.round(res.sim * 100) / 100, readSec: Math.round(res.readSec * 10) / 10, level: res.level, strict: settings.strict,
        };
        try { await saveAttempt(entry, raw.blob, raw.mime); } catch (e) { console.error('save failed', e); }
        resultBlobRef.current = raw.blob;

        const passed = res.total >= PASS_SCORE;
        let info2 = {};
        const before = app.stateRef.current;
        const prev = before.progress[task.id] || {};
        const firstPass = passed && !prev.passed;
        const stageWasCleared = isStageCleared(stage, before);
        const clearedBefore = countCleared(before);
        const newBestTime = isHaya && passed && (!prev.bestTime || res.readSec < prev.bestTime);
        const after = update(s => {
          const p = s.progress[task.id] || {};
          const sticker = p.sticker || (firstPass ? pickSticker(s) : null);
          info2.sticker = sticker;
          return {
            ...s,
            progress: {
              ...s.progress,
              [task.id]: {
                best: Math.max(p.best || 0, res.total), passed: !!(p.passed || passed), tries: (p.tries || 0) + 1, lastAt: at, sticker,
                bestTime: newBestTime ? Math.round(res.readSec * 10) / 10 : (p.bestTime || null),
              },
            },
            stickers: firstPass ? [...(s.stickers || []), { emoji: sticker, taskId: task.id, at }] : (s.stickers || []),
          };
        });
        Sync.run(app); // 先生の スプレッドシートへ（送れない ときは あとで 送りなおす）
        const stageCleared = !stage.optional && !stageWasCleared && isStageCleared(stage, after);
        const clearedAfter = countCleared(after);
        setResult({ ...res, passed, firstPass, sticker: info2.sticker, stageCleared, newTitle: clearedAfter > clearedBefore ? TITLES[clearedAfter] : null, newBestTime });
        setPhase('result');
        sfx(stageCleared ? 'clear' : passed ? 'pass' : 'try');
        say(res.comment, passed ? 'cheer' : res.heard ? 'happy' : 'surprise');
      };

      const retry = () => { stopAudio(); setResult(null); setPhase('intro'); say('もういちど ちょうせんじゃ！ がんばれ！', 'happy'); };
      const hasNext = index + 1 < stage.tasks.length;
      const everPassed = !!(state.progress[task.id] && state.progress[task.id].passed);
      const canGoNext = hasNext && !!result && (result.passed || everPassed || stage.optional || settings.unlockAll);
      const goNext = () => { stopAudio(); if (hasNext) onGoTask(stage, index + 1); else onBackToStage(); };

      const step = phase === 'result' || phase === 'analyzing' ? 4 : phase === 'countdown' || phase === 'recording' ? 3 : phase === 'practice' || listened ? 2 : 1;
      const multi = info.lines.length > 1;
      const slitActive = slitOn && multi;
      const busy = phase === 'countdown' || phase === 'recording' || phase === 'analyzing';

      return (
        <div className="max-w-6xl mx-auto p-3 md:p-5">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div className="text-xl font-bold text-slate-700">{stage.icon} {stageLabel(stage)}「{stage.name}」 {index + 1}もんめ</div>
            <StepBar step={step} />
          </div>

          {/* 横長の画面：左に 挿絵・はかせ・ボタン、右に ぶん。たて長の画面：挿絵 → ぶん → はかせ → ボタン */}
          <div className="grid grid-cols-1 lg:grid-cols-5 lg:grid-rows-[auto_auto_1fr] gap-4">
            <div className="lg:col-span-2 lg:col-start-1 lg:row-start-1">
              <SceneCard task={task} height={160} />
            </div>

            <div className="lg:col-span-3 lg:col-start-3 lg:row-start-1 lg:row-span-3 flex flex-col gap-3">
              {phase !== 'result' ? (
                <>
                  <div className="relative">
                    <TextCard task={task} info={info} fontScale={fontScale} slit={slitActive} line={line} onLine={setLine} />
                    {phase === 'countdown' && (
                      <div className="absolute inset-0 rounded-3xl bg-white/85 flex flex-col items-center justify-center">
                        <div key={count} className="count-num text-9xl font-black text-rose-500">{count > 0 ? count : 'はい！'}</div>
                        <div className="text-2xl font-bold text-slate-600 mt-2">しずかに まってね</div>
                      </div>
                    )}
                    {phase === 'analyzing' && (
                      <div className="absolute inset-0 rounded-3xl bg-white/85 flex flex-col items-center justify-center gap-2">
                        <div className="text-7xl float">🦉💭</div>
                        <div className="text-2xl font-bold text-slate-600">はかせが きいて いるよ…</div>
                      </div>
                    )}
                  </div>

                  {multi && (
                    <div className="flex flex-wrap items-center gap-2">
                      <button onClick={() => setSlitOn(v => !v)} className={`rounded-full px-4 py-2 text-lg font-bold border-2 ${slitOn ? 'bg-yellow-200 border-yellow-400 text-yellow-900' : 'bg-white border-slate-300 text-slate-500'}`}>
                        📏 1ぎょうずつ：{slitOn ? 'オン' : 'オフ'}
                      </button>
                      {slitActive && (
                        <>
                          <Btn color="white" size="md" disabled={line <= 0} onClick={() => setLine(l => Math.max(0, l - 1))}>▲ まえ</Btn>
                          <Btn color="amber" size="md" disabled={line >= info.lines.length - 1} onClick={() => setLine(l => Math.min(info.lines.length - 1, l + 1))}>▼ つぎの ぎょう</Btn>
                        </>
                      )}
                    </div>
                  )}
                </>
              ) : (
                <ResultPanel result={result} task={task} info={info} isHaya={isHaya} fontScale={fontScale}
                             playing={playing} onPlayMine={() => playing === 'mine' ? stopAudio() : playMine()}
                             onPlayModel={() => playing === 'model' ? stopAudio() : playModel(false)}
                             onRetry={retry} onNext={goNext} canNext={canGoNext} hasNext={hasNext} onBackToStage={() => { stopAudio(); onBackToStage(); }} />
              )}
            </div>

            <div className="lg:col-span-2 lg:col-start-1 lg:row-start-2 flex flex-col gap-3">
              <div className="flex items-end gap-2">
                <Hakase size={110} mood={talk.mood} talking={talk.talking} />
                <Bubble className="flex-1 !text-lg md:!text-xl">{talk.text}</Bubble>
              </div>
              {problem && (
                <div className="bg-rose-50 border-2 border-rose-300 rounded-2xl p-3 text-base text-rose-800">
                  <div className="font-bold">先生へ</div>
                  {problem === 'mic' && <div>マイクを使えませんでした。Chromeのアドレスバー左のアイコンから「マイク」を「許可」にして、ページを再読み込みしてください。</div>}
                  {problem.startsWith('recog:') && <div>音声認識でエラーが出ました（{problem.slice(6)}）。インターネット接続を確認してください。Chromeで開いているかも確認してください。</div>}
                </div>
              )}
            </div>

            {phase !== 'result' && (
              <div className="lg:col-span-2 lg:col-start-1 lg:row-start-3 flex flex-col gap-3">
                {(phase === 'practice' || phase === 'recording') && (
                  <div className="bg-white rounded-2xl border-2 border-slate-200 p-3"><VoiceMeter goodDb={settings.micGoodDb} /></div>
                )}
                {phase === 'recording' ? (
                  <>
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2 text-2xl font-bold text-rose-600">
                        <span className="w-5 h-5 rounded-full bg-rose-500 rec-pulse" /> ろくおんちゅう {elapsed.toFixed(0)}びょう
                      </div>
                      <Btn color="white" size="sm" onClick={cancelRecording}>やめる</Btn>
                    </div>
                    <Btn color="red" size="xl" className="w-full" onClick={() => finishRecording()}>⏹ よみおわった！</Btn>
                  </>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    <Btn color="sky" size="md" className="py-4 leading-tight" disabled={busy} onClick={() => playing === 'model' ? stopAudio() : playModel(false)}>
                      {playing === 'model' ? '⏸ とめる' : `🔊 おてほん${modelRec ? '（せんせい）' : ''}`}
                    </Btn>
                    <Btn color="sky" size="md" className="py-4 leading-tight" disabled={busy} onClick={() => playing === 'slow' ? stopAudio() : playModel(true)}>
                      {playing === 'slow' ? '⏸ とめる' : '🐢 ゆっくり おてほん'}
                    </Btn>
                    {phase === 'practice'
                      ? <Btn color="white" size="md" className="py-4 leading-tight" onClick={stopPractice}>💪 れんしゅう おわり</Btn>
                      : <Btn color="violet" size="md" className="py-4 leading-tight" disabled={busy} onClick={startPractice}>💪 れんしゅう</Btn>}
                    <Btn color="red" size="md" className="py-4 leading-tight" disabled={busy} onClick={startRecording}>🎤 ろくおん スタート</Btn>
                  </div>
                )}
              </div>
            )}
          </div>
          {phase === 'result' && result && result.passed && <Confetti />}
        </div>
      );
    }

    function ResultPanel({ result, task, info, isHaya, fontScale, playing, onPlayMine, onPlayModel, onRetry, onNext, canNext, hasNext, onBackToStage }) {
      const [shown, setShown] = useState(0);
      useEffect(() => {
        let raf; const t0 = performance.now();
        const stepFn = (t) => { const k = clamp01((t - t0) / 1100); setShown(Math.round(result.total * (1 - (1 - k) ** 3))); if (k < 1) raf = requestAnimationFrame(stepFn); };
        raf = requestAnimationFrame(stepFn);
        return () => cancelAnimationFrame(raf);
      }, [result]);
      const stars = result.total >= PASS_SCORE ? 3 : result.total >= 60 ? 2 : 1;
      return (
        <div className="bg-white rounded-3xl border-4 border-amber-200 shadow-md p-4 md:p-5 pop">
          <div className="flex items-center justify-center gap-4 flex-wrap">
            <div className="flex items-end gap-1">
              <span className="text-8xl font-black text-rose-500 tabular-nums leading-none">{shown}</span>
              <span className="text-3xl font-bold text-slate-600 mb-2">てん</span>
            </div>
            {result.passed && <div className="stamp text-3xl">ごうかく</div>}
          </div>
          <Stars n={stars} />
          {result.stageCleared && (
            <div className="mt-2 rounded-2xl bg-gradient-to-r from-amber-200 to-yellow-100 border-2 border-amber-400 p-3 text-center pop">
              <div className="text-3xl font-black text-amber-800">🎊 ステージ クリア！ 🎊</div>
              {result.newTitle && <div className="text-xl font-bold text-amber-900 mt-1">あたらしい しょうごう：{result.newTitle.icon} {result.newTitle.name}</div>}
            </div>
          )}
          {result.firstPass && result.sticker && (
            <div className="mt-2 flex items-center justify-center gap-3 text-2xl font-bold text-emerald-700">
              <span className="text-6xl pop" style={{ animationDelay: '1.2s' }}>{result.sticker}</span> シールを ゲット！
            </div>
          )}
          {isHaya && result.readSec > 0 && (
            <div className="mt-2 text-center text-2xl font-bold text-slate-700">
              ⏱ {result.readSec.toFixed(1)}びょう {result.newBestTime && <span className="text-rose-600">じこベスト！</span>}
            </div>
          )}
          <div className="mt-3 grid gap-2">
            {['vol', 'acc', 'dyn', 'spd'].map(k => (
              <div key={k} className="flex items-center gap-2 text-lg">
                <span className="w-9 text-2xl text-center">{PART_INFO[k].icon}</span>
                <span className="w-40 font-bold text-slate-700">{PART_INFO[k].label}</span>
                <div className="flex-1 h-5 rounded-full bg-slate-100 overflow-hidden border border-slate-200">
                  <div className={`h-full ${PART_INFO[k].bar} transition-all duration-1000`} style={{ width: `${(result.parts[k] / result.weights[k]) * 100}%` }} />
                </div>
                <span className="w-20 text-right font-bold tabular-nums">{result.parts[k]}/{result.weights[k]}</span>
              </div>
            ))}
          </div>
          {result.missed && result.missed.size > 0 && (
            <div className="mt-3">
              <div className="text-base font-bold text-orange-600 mb-1">🔍 はかせに ききとりにくかった ところ</div>
              <TextCard task={task} info={info} fontScale={fontScale} missed={result.missed} small />
            </div>
          )}
          <div className="mt-4 grid grid-cols-2 gap-3">
            <Btn color="sky" size="md" onClick={onPlayMine}>{playing === 'mine' ? '⏸ とめる' : '🔊 じぶんの こえ'}</Btn>
            <Btn color="sky" size="md" onClick={onPlayModel}>{playing === 'model' ? '⏸ とめる' : '🦉 おてほん'}</Btn>
            <Btn color={result.passed ? 'white' : 'red'} size="lg" onClick={onRetry}>🔁 もういちど</Btn>
            {canNext
              ? <Btn color="green" size="lg" onClick={onNext}>➡ つぎの もんだい</Btn>
              : <Btn color={result.passed ? 'green' : 'white'} size="lg" onClick={onBackToStage}>{result.passed && !hasNext ? '🏁 ステージへ' : '📋 もんだい いちらん'}</Btn>}
          </div>
        </div>
      );
    }

    /* =========================================================
       シールちょう
       ========================================================= */
    function StickerBook({ app }) {

      const list = ALL_TASKS;
      const got = list.filter(x => state.progress[x.task.id] && state.progress[x.task.id].sticker).length;

        <div className="max-w-6xl mx-auto p-4 md:p-6">
          <div className="bg-white rounded-3xl border-4 border-amber-200 p-4 mb-4 flex items-center gap-4">
            <span className="text-5xl">📒</span>
            <div>
              <div className="text-3xl font-bold">シールちょう</div>
              <div className="text-xl text-slate-600">あつめた シール：<span className="font-black text-rose-500">{got}</span> / {list.length}</div>
            </div>
          </div>
          {STAGES.map(stage => (
            <div key={stage.id} className="mb-4">
              <div className={`text-xl font-bold mb-2 ${STAGE_STYLE[stage.color].text}`}>{stage.icon} {stageLabel(stage)}「{stage.name}」</div>
              <div className="grid grid-cols-5 sm:grid-cols-8 gap-3">
                {stage.tasks.map((t, i) => {
                  const p = state.progress[t.id];
                  return (
                    <div key={t.id} className={`aspect-square rounded-2xl border-4 flex flex-col items-center justify-center ${p && p.sticker ? 'bg-yellow-50 border-yellow-300' : 'bg-slate-50 border-dashed border-slate-300'}`}>
                      <span className="text-5xl">{p && p.sticker ? p.sticker : '？'}</span>
                      <span className="text-xs text-slate-500">{i + 1}もんめ</span>

    /* =========================================================
       暗証番号
       ========================================================= */
    function PinPad({ onSuccess, onClose, check }) {
      const [digits, setDigits] = useState('');
      const [shake, setShake] = useState(false);
      const press = (d) => {
        if (digits.length >= 4) return;
        const v = digits + d;
        setDigits(v);
        if (v.length === 4) {
          setTimeout(() => {
            if (check(v)) onSuccess();
            else { sfx('wrong'); setShake(true); setTimeout(() => { setShake(false); setDigits(''); }, 450); }
          }, 150);
        }
      };
      return (
        <Modal onClose={onClose}>
          <div className={`bg-white rounded-3xl p-6 text-center shadow-xl ${shake ? 'shake' : ''}`}>
            <div className="text-2xl font-bold text-slate-700 mb-1">🔐 先生用の画面</div>
            <div className="text-base text-slate-500 mb-4">4けたの暗証番号を入れてください</div>
            <div className="flex justify-center gap-3 mb-5">
              {[0, 1, 2, 3].map(i => <span key={i} className={`w-6 h-6 rounded-full border-2 ${i < digits.length ? 'bg-slate-700 border-slate-700' : 'border-slate-300'}`} />)}
            </div>
            <div className="grid grid-cols-3 gap-3 max-w-xs mx-auto">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => <Btn key={d} color="white" size="lg" onClick={() => press(d)}>{d}</Btn>)}
              <Btn color="white" size="lg" onClick={() => setDigits(s => s.slice(0, -1))}>⌫</Btn>
              <Btn color="white" size="lg" onClick={() => press('0')}>0</Btn>
              <Btn color="slate" size="lg" onClick={onClose}>✕</Btn>
            </div>
          </div>
        </Modal>
      );
    }

    /* =========================================================
       はじめての 設定（先生が 行う）
       ========================================================= */
    function MicCheck() {
      const [st, setSt] = useState('idle');
      const test = async () => { try { await Mic.ensure(); setSt('ok'); } catch (e) { setSt('ng'); } };
      return (
        <div className="bg-slate-50 rounded-2xl p-4 border-2 border-slate-200">
          <div className="flex items-center gap-3 flex-wrap">
            <Btn color="sky" size="md" onClick={test}>🎤 マイクを確認する</Btn>
            {st === 'ok' && <span className="text-emerald-600 font-bold">マイクOK。声を出すとメーターが動きます。</span>}
            {st === 'ng' && <span className="text-rose-600 font-bold">マイクが使えません。アドレスバー左のアイコンから「マイク」を許可してください。</span>}
          </div>
          {st === 'ok' && <div className="mt-3"><VoiceMeter goodDb={CURRENT.settings.micGoodDb} /></div>}
        </div>
      );
    }

    function SetupScreen({ onDone }) {
      const [name, setName] = useState('');
      const [pin, setPin] = useState('');
      const [pin2, setPin2] = useState('');
      const [err, setErr] = useState('');
      const srOk = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      const submit = () => {
        if (!name.trim()) return setErr('名前を入力してください。');
        if (!/^\d{4}$/.test(pin)) return setErr('暗証番号は4けたの数字にしてください。');
        if (pin !== pin2) return setErr('確認用の暗証番号が一致しません。');
        onDone({ name: name.trim(), pin: hashPin(pin), createdAt: Date.now() });
      };
      const inputCls = 'w-full rounded-xl border-2 border-slate-300 px-4 py-3 text-xl focus:border-sky-400 outline-none';
      return (
        <div className="max-w-3xl mx-auto p-4 md:p-8">
          <div className="bg-white rounded-3xl border-4 border-amber-200 p-6 shadow-sm">
            <div className="flex items-center gap-4 mb-4">

    function usePlayer() {
      const [playingId, setPlayingId] = useState(null);
      const ref = useRef(null);
      const stop = () => { if (ref.current) { try { ref.current.pause(); } catch (e) {} ref.current = null; } setPlayingId(null); };
      const play = async (id, blob, opts) => {
        stop(); if (!blob) return;
        const p = playBlob(blob, opts); ref.current = p.audio; setPlayingId(id);
        await p.done; if (ref.current === p.audio) { ref.current = null; setPlayingId(null); }
      };
      useEffect(() => stop, []);
      return { playingId, play, stop };
    }

    function RecordsTab({ app }) {
      const { state } = app;
      const [hist, setHist] = useState(null);
      const [recIds, setRecIds] = useState(new Set());
      const [openTask, setOpenTask] = useState(null);
      const player = usePlayer();
      useEffect(() => {
        (async () => {
          try {
            const h = await DB.getAll('history');
            const keys = await DB.getAllKeys('recordings');
            setHist(h.sort((a, b) => b.at - a.at)); setRecIds(new Set(keys));
          } catch (e) { setHist([]); }
        })();
      }, []);

        if (player.playingId === h.id) return player.stop();
        const r = await DB.get('recordings', h.id);
        if (r) player.play(h.id, r.blob, { boost: boostFor(h.level) });
      };
      if (!hist) return <div className="text-xl p-6">読み込み中…</div>;
      const graded = ALL_TASKS.filter(x => !x.stage.optional);
      const passedCount = graded.filter(x => state.progress[x.task.id] && state.progress[x.task.id].passed).length;
      const cleared = countCleared(state);
      const lastAt = hist.length ? hist[0].at : null;
      const HistRow = ({ h, showTask }) => {

        return (

            <td className="py-2 pr-2 whitespace-nowrap text-slate-600">{fmtDate(h.at)}</td>

            <td className="py-2 pr-2 font-bold whitespace-nowrap">{h.total}点 {h.total >= PASS_SCORE && <span className="text-rose-600">合格</span>}</td>
            <td className="py-2 pr-2 text-sm text-slate-600 whitespace-nowrap">大{h.parts.vol} 正{h.parts.acc} 強{h.parts.dyn} 速{h.parts.spd}</td>
            <td className="py-2 pr-2 text-sm text-slate-600">{h.heard || '（聞き取りなし）'}</td>
            <td className="py-2 whitespace-nowrap">
              {recIds.has(h.id) ? <button onClick={() => playRec(h)} className="rounded-xl bg-sky-100 text-sky-700 font-bold px-3 py-1 border border-sky-300">{player.playingId === h.id ? '⏸ 停止' : '▶ 再生'}</button> : <span className="text-xs text-slate-400">録音なし</span>}

      return (
        <div className="grid gap-4">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            {[['名前', state.profile ? state.profile.name : ''], ['称号', `${TITLES[cleared].icon} ${TITLES[cleared].name}`], ['合格した課題', `${passedCount} / ${graded.length}`], ['挑戦回数（合計）', `${hist.length}回`]].map(([k, v]) => (
              <div key={k} className="bg-white rounded-2xl border-2 border-slate-200 p-3"><div className="text-sm text-slate-500">{k}</div><div className="text-xl font-bold">{v}</div></div>
            ))}
          </div>
          <div className="text-slate-600">最後に学習した日時：{lastAt ? fmtDate(lastAt) : 'まだありません'}　／　採点のきびしさ：{STRICTNESS[state.settings.strict].label}</div>

          <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
            <div className="text-xl font-bold mb-2">課題別の記録</div>
            {STAGES.map(stage => (
              <div key={stage.id} className="mb-3">
                <div className={`font-bold mb-1 ${STAGE_STYLE[stage.color].text}`}>{stage.icon} {stageLabel(stage)}「{stage.name}」</div>
                <table className="w-full text-left text-base table-fixed">
                  <colgroup>
                    <col style={{ width: '2.5rem' }} /><col /><col style={{ width: '7rem' }} /><col style={{ width: '4rem' }} /><col style={{ width: '8rem' }} /><col style={{ width: '6rem' }} />
                  </colgroup>
                  <tbody>
                    {stage.tasks.map((t, i) => {
                      const p = state.progress[t.id] || {};
                      const hs = hist.filter(h => h.taskId === t.id);
                      const open = openTask === t.id;

                        <React.Fragment key={t.id}>
                          <tr className="border-t border-slate-100">
                            <td className="py-2 pr-2 w-10 text-slate-500">{i + 1}</td>
                            <td className="py-2 pr-2 truncate">{taskLabel(t)}</td>
                            <td className="py-2 pr-2 whitespace-nowrap">{p.tries ? `最高 ${p.best}点` : '—'}</td>

                            <td className="py-2 pr-2 whitespace-nowrap">{p.passed ? <span className="text-rose-600 font-bold">合格</span> : ''}{p.bestTime ? `（${p.bestTime}秒）` : ''}</td>

              <table className="w-full text-left text-base"><tbody>{hist.slice(0, 30).map(h => <HistRow key={h.id} h={h} showTask />)}</tbody></table>
