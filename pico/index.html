      return <span className={`rounded-full font-bold border-2 whitespace-nowrap ${small ? 'text-[10px] px-1' : 'text-xs px-2'} ${it.tier === 3 ? 'glow' : ''}`} style={{ color: t.color, borderColor: t.color, background: t.bg }}>{it.tier === 3 ? '👑 ' : ''}{t.n}</span>;
    }
    const tierBorder = (it) => (TIERS[it.tier] || TIERS[0]).color;

    function ShopScreen({ progress, onBuy }) {
      const pico = usePico();
      const [cat, setCat] = useState(null);
      const [confirm, setConfirm] = useState(null);
      const [award, setAward] = useState(null);
      const own = new Set(progress.items);
      const c = cat && ITEM_CATS.find(x => x.id === cat);
      useEffect(() => { pico.say('ピコの おみせだよ。どの たなを みる？'); }, []);
      const enter = (id) => { Sound.tap(); setCat(id); pico.say(`${ITEM_CATS.find(x => x.id === id).name}の たなだよ。`); };
      const tap = (it) => {
        Sound.tap();
        if (own.has(it.id)) { pico.say(`${it.n}は もう もって いるよ。ピコの へやで つけられるよ。`); return; }
        if (progress.coins < it.p) { pico.say(`${it.n}は コイン ${it.p}まい。あと ${it.p - progress.coins}まい あつめよう！`, { mood: 'think' }); return; }
        pico.say(`${it.n}を かいますか？`);
        setConfirm(it);
      };
      const buy = () => {
        const it = confirm; setConfirm(null);
        const before = titlesOf(progress.items), after = titlesOf([...progress.items, it.id]);
        onBuy(it); Sound.buy();
        const nt = after.find(t => !before.includes(t));
        if (nt) { setAward(nt); Sound.big(); pico.say(`おめでとう！「${nt}」の しょうごうだ！`, { mood: 'happy' }); }
        else pico.say(`${it.n}を かったよ。ピコの へやで つけて みてね。`, { mood: 'happy' });
        if (!nt && it.tier === 3) Sound.big();
      };
      return (
        <div className="relative w-full flex-1 flex flex-col items-center gap-3 p-3" style={{ background: 'linear-gradient(#ffe4e6, #fff7ed)' }}>
          <div className="bg-white/90 rounded-3xl p-2 w-full max-w-5xl"><PicoBar compact /></div>
          {!c && (
            <div className="grid grid-cols-3 gap-4 w-full max-w-4xl">
              {ITEM_CATS.map(x => {
                const n = x.items.filter(it => own.has(it.id)).length;
                return (
                  <button key={x.id} onClick={() => enter(x.id)} className="btn3d rounded-3xl border-4 bg-white flex flex-col items-center py-4" style={{ borderColor: x.color }}>

    // ピコの へや（きせかえ）
    const DECO_MAX = 3;

      const pico = usePico();

      useEffect(() => { pico.say('ピコの へやだよ。おみせで かった ものを つけたり、おともを えらんだり できるよ。'); }, []);
      const set = (slot, v) => { Sound.tap(); onChange({ equip: { ...eq, [slot]: v } }); };
      const toggleDeco = (id) => {

      const sections = [['hat', 'ぼうし'], ['body', 'からだの いろ'], ['acc', 'アクセサリ'], ['bg', 'はいけい'], ['fx', 'えんしゅつ（なかまに した とき）']];
      const friends = ALL_MOBS.filter(m => progress.zukan[m.id]);
      const DECO_SPOT = [{ left: '4%', bottom: '4%' }, { left: '6%', top: '6%' }, { right: '6%', top: '6%' }];
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">
          <PicoBar compact />
          <div className="flex gap-4 w-full items-start flex-wrap justify-center">

              <RoomBg bg={bgOf(eq)} className="rounded-3xl border-4 border-white shadow flex items-end justify-center pb-4" style={{ width: 340, height: 360 }}>

                <div style={{ marginRight: eq.otomo ? 60 : 0 }}><Pico equip={eq} size={190} mood="happy" /></div>
              </RoomBg>
            </div>
            <div className="flex-1 min-w-[320px] flex flex-col gap-3">
              {sections.map(([slot, label]) => {

                return (
                  <div key={slot} className="bg-white rounded-3xl p-3">
                    <div className="text-2xl font-bold mb-2">{label}</div>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={() => set(slot, null)} className={`btn3d rounded-2xl border-4 px-3 py-2 text-lg font-bold ${!eq[slot] ? 'border-sky-500 bg-sky-100' : 'border-slate-200 bg-white'}`}>{slot === 'fx' ? '💖 ハート' : slot === 'body' ? 'みずいろ' : 'なし'}</button>
                      {mine.map(it => <button key={it.id} onClick={() => set(slot, it.id)} className={`btn3d rounded-2xl border-4 px-3 py-1 text-lg font-bold flex items-center gap-1 ${eq[slot] === it.id ? 'border-sky-500 bg-sky-100' : 'border-slate-200 bg-white'}`}><span className="text-2xl">{it.e}</span>{it.n}</button>)}
                      {!mine.length && <span className="text-slate-400 self-center">おみせの「{ITEM_CATS.find(c => c.slot === slot).name}」で かえるよ</span>}

              <div className="bg-white rounded-3xl p-3">

                  <button onClick={() => set('otomo', null)} className={`btn3d rounded-2xl border-4 px-3 py-2 text-lg font-bold ${!eq.otomo ? 'border-sky-500 bg-sky-100' : 'border-slate-200 bg-white'}`}>なし</button>

    const pct = (a, b) => b ? `${Math.round((a / b) * 100)}%` : '－';
    const accOf = (s) => s.keys + s.miss ? pct(s.keys, s.keys + s.miss) : '－';
    const cpmOf = (keys, secs) => secs > 0 ? Math.round((keys / secs) * 60) : '－';
    const topOf = (m, n = 5) => Object.entries(m || {}).sort((a, b) => b[1] - a[1]).slice(0, n);

    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(api.pending());
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const cleared = (p) => STAGES.filter(st => p.cleared[st.id]).length;
      const kinds = (p) => ALL_MOBS.filter(m => p.zukan[m.id]).length;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };
      const act = async (fn, okText) => {
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); onChanged(); } }
        catch (e) { flash('うまく いきませんでした：' + e.message); }
      };
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '\uFEFF' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`ピコ_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`ピコ_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'pico') { flash('このアプリのバックアップではありません'); return; }
          if (!confirm('バックアップから、子どもの進み具合・コインを元にもどします。よろしいですか？')) return;
          await act(() => api.restore(pin, d), 'バックアップから元にもどしました');
        };
        rd.readAsText(f);
      };
      const opt = (key, list) => list.map(([v, t]) =>
        <button key={String(v)} onClick={() => setS({ ...s, [key]: v })} className={`ml-2 mt-1 rounded-lg px-3 py-1 border-2 ${s[key] === v ? 'bg-sky-200 border-sky-500' : 'bg-white'}`}>{t}</button>);

      return (
        <div className="fixed inset-0 bg-slate-50 z-50 overflow-auto">

              {[['class', 'クラス全体'], ['child', '子どもごと'], ['settings', 'せってい'], ['data', 'データ']].map(([id, t]) => (

              ))}

                  <tbody>

                      <div>なかま：{prog.caught}（{kinds(prog)} / {ALL_MOBS.length}しゅるい）　コイン：🪙 {prog.coins}（これまでに {prog.earned}まい）　集めた品物：{prog.items.length}</div>
                      <div>うった数：{student.count}　正しく打てた割合：{accOf(student)}　はやさ：{cpmOf(student.pkeys, student.psecs)}　さいご：{student.last || '－'}</div>
                      <div className="mt-2 font-bold">だんかいごとの結果</div>
                      <table className="w-full text-left text-sm">
                        <thead className="bg-slate-100"><tr><th className="p-1">だんかい</th><th>問題</th><th>まちがえずに</th><th>正しく打てた割合</th><th>はやさ</th></tr></thead>
                        <tbody>
                          {STAGES.map((st, i) => {
                            const g = student.stages[stageNo(st)];
                            if (!g) return null;
                            return <tr key={st.id} className="border-t"><td className="p-1">{st.hatten ? `はってん${st.id}` : i + 1} {st.place}{prog.cleared[st.id] ? ' ⭐' : ''}</td><td>{g[0]}</td><td>{pct(g[1], g[0])}</td><td>{pct(g[2], g[2] + g[3])}</td><td>{cpmOf(g[4], g[5])}</td></tr>;
                          })}
                        </tbody>
                      </table>
                      <div className="mt-2 font-bold">はやさの のび（日ごと）</div>
                      <div className="flex items-end gap-1 h-24 border-b">
                        {Object.entries(student.days || {}).sort().slice(-14).map(([d, [k, sec]]) => {
                          const v = sec > 0 ? Math.round((k / sec) * 60) : 0;
                          return <div key={d} className="flex flex-col items-center justify-end h-full" title={d}><span className="text-xs">{v}</span><div className="w-6 bg-sky-400 rounded-t" style={{ height: `${Math.min(100, v / 1.5)}%` }} /><span className="text-[10px] text-slate-500">{d.slice(5)}</span></div>;
                        })}
                        {!Object.keys(student.days || {}).length && <span className="text-slate-500 text-sm">まだ ありません</span>}
                      </div>
                      <div className="mt-3 flex flex-wrap gap-2">
                        <button onClick={() => act(() => api.setFlag(pin, student.name, 'unlockAll', !prog.unlockAll), prog.unlockAll ? 'だんかいの開放をやめました' : 'すべてのだんかいを開きました')} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog.unlockAll ? '🔓 全部開く：オン' : '🔒 全部開く：オフ'}</button>
                        <button onClick={() => act(() => api.setFlag(pin, student.name, 'hatten', !prog.hatten), prog.hatten ? 'はってんを閉じました' : 'はってんを開きました')} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog.hatten ? '✨ はってん：開いている' : '✨ はってん：閉じている'}</button>
                      </div>
                      <div className="mt-2 flex flex-wrap gap-2 items-center">
                        <span className="font-bold">コイン：</span>
                        {[-5, -1, 1, 5, 10].map(dv => <button key={dv} onClick={() => act(() => api.addCoins(pin, student.name, dv), `コインを ${dv > 0 ? '+' : ''}${dv} しました`)} className="rounded-lg px-3 py-1 border-2 bg-white font-bold">{dv > 0 ? '+' : ''}{dv}</button>)}
                      </div>
                      <div className="mt-3">
                        <button onClick={() => { if (confirm(`${student.name} さんの記録・進み具合・コイン・集めたものを、すべて消します。元にはもどせません。よろしいですか？`)) act(() => api.clear(pin, student.name), `${student.name} さんの記録を消しました`); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 この子の記録を消す</button>
                      </div>
                    </div>
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold mb-1">まちがえやすい キー（数字は まちがえた回数）</div>
                      <Keyboard heat={student.keyMiss || {}} glow={false} finger={false} u={40} />
                      <div className="text-sm mt-1">{topOf(student.keyMiss, 8).map(([k, n]) => `${KEY_LABEL(k)}（${n}回・${FINGER_NAME[FINGER_OF[k]] || ''}）`).join('、') || 'まだ ありません'}</div>
                      <div className="font-bold mt-3">まちがえやすい 音</div>
                      <div className="flex flex-wrap gap-2 mt-1">{topOf(student.soundMiss, 16).map(([k, n]) => <span key={k} className="rounded-lg px-2 py-1 border bg-rose-50"><b className="text-xl">{k}</b> {n}回</span>)}{!Object.keys(student.soundMiss || {}).length && <span className="text-slate-500">まだ ありません</span>}</div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-3xl">
                <label className="flex items-center gap-3">よみあげの はやさ：<input type="range" min="0.5" max="1.2" step="0.05" value={s.rate} onChange={e => setS({ ...s, rate: Number(e.target.value) })} /> {s.rate}倍
                  <button className="border rounded px-2" onClick={() => { Speech.rate = s.rate; Speech.say('ピコロボの タイピング パトロールだよ。'); }}>ためす</button></label>
                <div>もじの おおきさ：{opt('font', [[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']])}</div>
                <div>1回の数（キー・1もじの だんかい）：{opt('count', [[10, '10ぴき'], [20, '20ぴき'], [30, '30ぴき']])}</div>
                <div>1回の数（ことば・ぶんの だんかい）：{opt('countLong', [[5, '5ひき'], [10, '10ぴき'], [15, '15ひき']])}</div>
                <div>いちばん はやくて ここまで：{opt('maxSpeed', SPEEDS.map((x, i) => [i, x.n]))}</div>
                <div>いっしょに でる いきもの：{opt('maxAt', [[1, '1ぴき'], [2, '2ひき'], [3, '3びき']])} <span className="text-sm text-slate-500">（ぶんの だんかいは いつも 1ぴき）</span></div>
                <div>つぎに おす キーを 光らせる：{opt('glow', [[true, '光らせる'], [false, '光らせない']])}</div>
                <div>ゆびの いろわけ（キーボードと 手の絵）：{opt('finger', [[true, 'だす'], [false, 'ださない']])}</div>
                <div>ひらがなの 下の ローマ字：{opt('romaji', [[true, 'だす'], [false, 'ださない']])}</div>
                <div>こうかおん：{opt('sound', [[true, 'ならす'], [false, 'ならさない']])}</div>
                <div className="text-sm text-slate-500">「光らせない」「ださない」に しても、まちがえて ヒントを 出したときは 見えます。上達してきたら、キーボードを 見ないで 打つ 練習に 使えます。</div>
                <label>暗証番号を変える（4けた）：<input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} className="border-2 rounded px-2 py-1 w-24 ml-2" inputMode="numeric" placeholder="----" /></label>
                <div><button onClick={saveSettings} className="btn3d rounded-xl px-6 py-2 border-2 border-emerald-500 bg-emerald-100 font-bold text-xl">保存する</button>
                  <span className="text-sm text-slate-500 ml-2">（全員の画面に反映されます。子どもの画面は開き直すと変わります）</span></div>
              </div>
            )}

            {tab === 'data' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-2xl">
                <div>この端末に たまっている、まだ送れていない記録：<b>{pending}</b> 件
                  <button onClick={async () => { await api.flush(); setPending(api.pending()); flash(api.pending() ? 'まだ送れていません。ネットのつながりを確かめてください' : '送りました'); onChanged(); }} className="ml-2 rounded-xl px-3 py-1 border-2 bg-white font-bold">📤 スプレッドシートへ送る</button></div>
                <div><button onClick={csv} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">📄 記録をCSVで書き出す</button>
                  <div className="text-sm text-slate-500">ダウンロードできないときは、スプレッドシートの「きろく」シートを開き、ファイル → ダウンロード → CSV を選んでください。</div></div>
                <div className="flex gap-2 flex-wrap items-center">
                  <button onClick={backup} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">💾 バックアップを保存</button>
                  <label className="rounded-xl px-3 py-2 border-2 bg-white font-bold cursor-pointer">📂 バックアップから元にもどす<input type="file" accept=".json" className="hidden" onChange={restore} /></label>
                </div>
                <div><button onClick={() => { if (confirm('全員の記録・進み具合・コイン・集めたものを、すべて消します。元にはもどせません。よろしいですか？') && confirm('ほんとうに全員の記録を消しますか？')) act(() => api.clear(pin, ''), '全員の記録を消しました'); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 全員の記録を消す</button></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 15. アプリ ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [place, setPlace] = useState(null);
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [talk, setTalk] = useState({ text: '', mood: 'normal', talking: false });
      const [coinFx, setCoinFx] = useState({ k: 0, n: 0 });
      const [soundOn, setSoundOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const [present, setPresent] = useState(false);
      const [levelUp, setLevelUp] = useState(null);
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const roundCoins = useRef(0);
      const progRef = useRef(progress);
      progRef.current = progress;

      const picoApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setTalk({ text, mood: opts.mood || 'normal', talking: true });
          Speech.say(opts.speech || text, () => { if (sayId.current === id) setTalk(p => ({ ...p, talking: false })); resolve(); });
        });
        return { say: run, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const picoCtx = { ...picoApi, ...talk, equip: progress.equip };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        ['glow', 'finger', 'romaji', 'sound'].forEach(k => { v[k] = v[k] !== false && v[k] !== 'false'; });
        ['count', 'countLong', 'maxSpeed', 'maxAt'].forEach(k => { v[k] = Number(v[k]); if (isNaN(v[k])) v[k] = DEFAULT_SETTINGS[k]; });
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8; Speech.pitch = Number(v.pitch) || 1.2;
        Sound.on = v.sound; setSoundOn(Sound.on);
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        const recs = records.current; records.current = [];
        api.save({ name, progress: json, records: recs, stamp: nowStr(), time: Date.now() });
        return p;
      };
      const updateProg = (fn) => { progRef.current = fn(progRef.current); setProgress(progRef.current); return progRef.current; };

      const login = async (n) => {
        Sound.get(); Speech.say('');
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグ（全部開く・はってん）は スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) p = { ...p, unlockAll: !!a.unlockAll, hatten: !!a.hatten, flagT: a.flagT };
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false);
        setView({ v: 'map' });
        // その日 はじめて なら「きょうの プレゼント」
        if (p.welcome && p.lastDay !== today()) setPresent(true);
      };
      const logout = () => { picoApi.stop(); setName(null); setView({ v: 'login' }); };

      const startPatrol = (st, left) => {
        setPlace(null);
        records.current = []; roundCoins.current = 0;
        const n = left || countOf(st, settings);
        const intro = left ? `${st.place}の つづきから はじめよう。` : st.intro;
        if (st.tutorial && !progRef.current.tut && !left) setView({ v: 'tutorial', st, n, intro, key: uid() });
        else setView({ v: 'patrol', st, n, intro, key: uid() });
      };

      const onRecord = (r) => { records.current.push({ ...r, id: uid() }); };
      const onCoin = (n) => {
        roundCoins.current += n;
        setCoinFx(x => ({ k: x.k + 1, n })); Sound.coin();
        updateProg(p => ({ ...p, coins: p.coins + n, earned: p.earned + n }));
      };
      const onCatch = (id) => updateProg(p => ({ ...p, caught: (p.caught || 0) + 1, zukan: { ...p.zukan, [id]: (p.zukan[id] || 0) + 1 } }));
      const onSave = (part) => persist({ ...progRef.current, part });

      const finish = (st, result) => {
        let p = { ...progRef.current, part: null };
        let bonus = 0, stageClear = false;
        const acc = result.keys + result.miss ? Math.round((result.keys / (result.keys + result.miss)) * 100) : 100;
        const cpm = result.secs > 0 ? Math.round((result.keys / result.secs) * 60) : 0;
        const b = p.best[st.id] || { acc: 0, cpm: 0 };
        p.best = { ...p.best, [st.id]: { acc: Math.max(b.acc, acc), cpm: Math.max(b.cpm, cpm) } };
        if (!p.cleared[st.id]) {
          p.cleared = { ...p.cleared, [st.id]: 1 };
          bonus = 5; stageClear = true;
          p.coins += bonus; p.earned += bonus;
        }
        const lv = levelOf(p.caught);
        const up = lv > (p.level || 0);
        p.level = lv;
        p = persist(p);
        let next = null;
        const ms = mainStages(), i = ms.findIndex(s => s.id === st.id);
        if (!st.hatten && i >= 0 && ms[i + 1] && stageOpen(p, ms[i + 1])) next = () => { setView({ v: 'map' }); setPlace(ms[i + 1]); };
        setView({ v: 'result', st, result: { ...result, bonus, stageClear, coins: roundCoins.current }, next });
        if (up) setTimeout(() => setLevelUp(lv), 2600);
      };
      const quit = () => {
        picoApi.stop();
        persist(progRef.current);
        setView({ v: 'map' });
      };
      const openPresent = (g) => {
        const p = progRef.current;
        const q = { ...p, lastDay: today(), days: (p.days || 0) + 1 };
        if (g.item) q.items = [...p.items, g.item.id]; else { q.coins = p.coins + g.coins; q.earned = p.earned + g.coins; }
        persist(q);
      };
      const buy = (it) => {
        const p = progRef.current;
        if (p.coins < it.p || p.items.includes(it.id)) return;
        persist({ ...p, coins: p.coins - it.p, items: [...p.items, it.id] });
      };
      const setSpeedPref = (v) => updateProg(p => ({ ...p, speed: v }));

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const p = { ...progRef.current, unlockAll: !!sp.unlockAll, hatten: !!sp.hatten, flagT: sp.flagT, coins: sp.coins || 0, t: sp.t || Date.now() };
              if (!me.progress) Object.assign(p, newProgress());
              progRef.current = p; setProgress(p); safeStore.set(COPY_KEY(name), JSON.stringify(p));
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-sky-800">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-slate-500 mt-2">{boot.error}</div></div>;

      const bar = (home = true) => (
        <TopBar name={name} coins={progress.coins} bump={coinFx.k} level={levelOf(progress.caught)} onHome={home ? () => { picoApi.stop(); if (view.v === 'patrol') quit(); else setView({ v: 'map' }); } : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }} />
      );

      let body = null;
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (view.v === 'map') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <PatrolMap name={name} progress={progress} onPlace={setPlace}
            onContinue={() => { const st = currentStage(progress); const part = progress.part && progress.part.st === st.id ? progress.part : null; startPatrol(st, part ? part.left : 0); }}
            onShop={() => setView({ v: 'shop' })} onZukan={() => setView({ v: 'zukan' })} onRoom={() => setView({ v: 'room' })}
            onWelcome={() => { Sound.buy(); persist({ ...progRef.current, welcome: 1, lastDay: today(), days: 1 }); }} />
          {place && <PlaceModal st={place} progress={progress} settings={settings} onClose={() => setPlace(null)} onSpeed={setSpeedPref}
            onStart={() => startPatrol(place)} onResume={() => startPatrol(place, progress.part.left)} />}</div>;
      } else if (view.v === 'tutorial') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<div className="w-full flex justify-center p-3">
          <Tutorial settings={settings} onDone={() => { updateProg(p => ({ ...p, tut: 1 })); setView({ ...view, v: 'patrol', key: uid() }); }} /></div></div>;
      } else if (view.v === 'patrol') {
        body = <div className="min-h-screen flex flex-col items-center relative"><CoinFly fx={coinFx} />
          <div className="w-full flex justify-center p-2"><Patrol key={view.key} st={view.st} n={view.n} intro={view.intro} settings={settings} progress={progress}
            onRecord={onRecord} onCoin={onCoin} onCatch={onCatch} onSave={onSave} onSpeed={setSpeedPref} onFinish={(r) => finish(view.st, r)} onQuit={quit} /></div></div>;
      } else if (view.v === 'result') {
        const st = view.st;
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<ResultScreen view={view} progress={progress}
          onAgain={() => startPatrol(st)} onMap={() => setView({ v: 'map' })} onNext={view.next} /></div>;
      } else if (view.v === 'shop') {
        body = <div className="min-h-screen flex flex-col">{bar()}<ShopScreen progress={progress} onBuy={buy} /></div>;
      } else if (view.v === 'zukan') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<ZukanScreen progress={progress} /></div>;
      } else if (view.v === 'room') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<RoomScreen progress={progress} onChange={(ch) => persist({ ...progRef.current, ...ch })} /></div>;
      }

      return (
        <PicoCtx.Provider value={picoCtx}>
          {body}
          {present && name && view.v === 'map' && <PresentModal progress={{ ...progress, days: (progress.days || 0) + 1 }} onOpen={openPresent} onClose={() => setPresent(false)} />}
          {levelUp != null && <LevelUpModal level={levelUp} equip={progress.equip} onClose={() => setLevelUp(null)} />}
          {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
          {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
        </PicoCtx.Provider>
      );
    }

    window.PICO_READY.then(() => {
      R = window.PICO_ROMAJI;
      const D = window.PICO_DATA;
      STAGES = D.STAGES; ITEM_CATS = D.ITEM_CATS; TIERS = D.TIERS; FX = D.FX; LEVELS = D.LEVELS;
      HAS_IMG = new Set(D.IMAGES || []);
      ALL_ITEMS = ITEM_CATS.flatMap(c => c.items);
      ALL_ITEMS.forEach(it => { ITEM[it.id] = it; });
      ALL_MOBS = STAGES.flatMap(st => st.mobs);
      ALL_MOBS.forEach(m => { MOB[m.id] = m; });
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:24px;line-height:1.8">もんだいの データを よみこめませんでした。<br>ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<div style="font-size:14px;color:#888">' + e.message + '</div></div>';
    });
  </script>
</body>
</html>
