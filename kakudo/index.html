<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワニワニ先生の ピザやさん</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root {
      --bg: #fff7ed; --ink: #1e293b; --sub: #64748b; --line: #e2e8f0;
      --brick: #b91c1c; --wani: #4ade80; --wani-d: #15803d; --cheese: #fde68a; --crust: #f59e0b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent; }
    button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
    input, select { font-family: inherit; }
    ruby rt { font-size: .5em; color: #475569; font-weight: 400; }
    .bubble, .mitem, .qhead, .step, .board, .choice, .kids { word-break: keep-all; overflow-wrap: anywhere; }
    .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 28px; color: #166534; }

    /* 立体ボタン */
    .btn3d { word-break: keep-all; border: 0; border-bottom: 6px solid rgba(0,0,0,.28); border-radius: 1.1rem; font-weight: 700; transition: transform .08s, border-bottom-width .08s, filter .15s; display: inline-flex; align-items: center; justify-content: center; gap: .4em; user-select: none; line-height: 1.25; }
    .btn3d:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 3px; }
    .btn3d:disabled { opacity: .4; cursor: not-allowed; }
    .btn3d:hover:not(:disabled) { filter: brightness(1.05); }
    .c-sky { background: #0ea5e9; color: #fff; border-bottom-color: #0369a1; }
    .c-red { background: #f43f5e; color: #fff; border-bottom-color: #be123c; }
    .c-green { background: #10b981; color: #fff; border-bottom-color: #047857; }
    .c-amber { background: #fbbf24; color: #451a03; border-bottom-color: #d97706; }
    .c-violet { background: #8b5cf6; color: #fff; border-bottom-color: #6d28d9; }
    .c-slate { background: #475569; color: #fff; border-bottom-color: #1e293b; }
    .c-white { background: #fff; color: #334155; border: 2px solid #cbd5e1; border-bottom: 6px solid #cbd5e1; }
    .c-orange { background: #f97316; color: #fff; border-bottom-color: #c2410c; }
    .s-sm { padding: .45rem .8rem; font-size: 1rem; }
    .s-md { padding: .7rem 1.2rem; font-size: 1.25rem; }
    .s-lg { padding: .9rem 1.5rem; font-size: 1.6rem; }
    .s-xl { padding: 1.1rem 2rem; font-size: 2rem; }

    /* レイアウト */
    .wrap { max-width: 1200px; margin: 0 auto; padding: .75rem; }
    .row { display: flex; align-items: center; gap: .6rem; }
    .col { display: flex; flex-direction: column; gap: .6rem; }
    .wrapflex { flex-wrap: wrap; }
    .grow { flex: 1 1 auto; min-width: 0; }
    .center { justify-content: center; }
    .between { justify-content: space-between; }
    .card { background: #fff; border-radius: 1.4rem; border: 4px solid #fed7aa; box-shadow: 0 2px 8px rgba(0,0,0,.05); padding: 1rem; }
    .muted { color: var(--sub); }
    .bold { font-weight: 700; }
    .tc { text-align: center; }

    /* ヘッダー */
    .hdr { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.96); box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    .hdr-in { max-width: 1400px; margin: 0 auto; padding: 0 .75rem; display: flex; align-items: center; gap: .5rem; height: 56px; overflow: hidden; }
    .logo { display: flex; align-items: center; gap: .4rem; font-weight: 900; color: #166534; font-size: 1.35rem; background: none; border: 0; padding: 0; }
    .tbtn { font-size: .85rem; color: #94a3b8; border: 1px solid #e2e8f0; border-radius: .6rem; padding: .3rem .55rem; background: #fff; }

    /* ホーム */
    .home { max-width: 1400px; margin: 0 auto; padding: .6rem .75rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 30%); gap: .8rem; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
    .home-scene { border-radius: 1.4rem; overflow: hidden; background: #8f1d1d; display: flex; align-items: center; justify-content: center; min-height: 0; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
    .home-side { min-height: 0; overflow-y: auto; padding-bottom: .5rem; }
    @media (max-width: 900px) { .home { grid-template-columns: 1fr; height: auto; } .home-scene { aspect-ratio: 1000 / 600; } }

    /* 問題の画面 */
    .play { max-width: 1400px; margin: 0 auto; padding: .6rem .75rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 34%); gap: .75rem; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
    .work { position: relative; background: #fffdf7; border-radius: 1.4rem; border: 4px solid #fde4b8; box-shadow: inset 0 0 0 3px #fff, 0 2px 8px rgba(0,0,0,.05); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .work svg.ws { flex: 1 1 auto; width: 100%; height: 100%; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
    .panel { display: flex; flex-direction: column; gap: .6rem; min-height: 0; overflow-y: auto; padding-bottom: .5rem; }
    .qhead { padding: .5rem .9rem .2rem; font-size: 1.05rem; font-weight: 700; color: #9a3412; display: flex; align-items: center; gap: .5rem; }
    @media (max-width: 900px) {
      .play { grid-template-columns: 1fr; height: auto; }
      .work { height: 62vh; }
    }

    /* ふきだし */
    .bubble { position: relative; background: #fff; border: 4px solid #86efac; border-radius: 1.3rem; padding: .7rem 1rem; font-size: 1.45rem; line-height: 1.9; font-weight: 700; color: #1e293b; }
    .bubble::before { content: ''; position: absolute; left: -16px; top: 26px; border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-right: 15px solid #86efac; }
    .bubble.ng { border-color: #fdba74; } .bubble.ng::before { border-right-color: #fdba74; }
    .bubble.ok { border-color: #f9a8d4; background: #fff1f2; } .bubble.ok::before { border-right-color: #f9a8d4; }
    .bubble.hint { border-color: #fcd34d; background: #fffbeb; } .bubble.hint::before { border-right-color: #fcd34d; }
    .bubble.top::before { left: 40px; top: -16px; border-left: 11px solid transparent; border-right: 11px solid transparent; border-bottom: 15px solid #86efac; border-top: 0; }

    /* 選択肢 */
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: .6rem; }
    .choice { font-size: 2rem; padding: .8rem .4rem; }
    .choice.gone { opacity: .25; text-decoration: line-through; }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; }
    .numpad .btn3d { font-size: 1.7rem; padding: .55rem 0; }
    .numdisp { font-size: 2.6rem; font-weight: 900; text-align: center; background: #fff; border: 4px solid #bae6fd; border-radius: 1rem; padding: .2rem .5rem; min-height: 3.6rem; letter-spacing: .05em; }

    /* 手順カード */
    .steps { display: flex; flex-wrap: wrap; gap: .35rem; padding: 0 .8rem .3rem; }
    .step { display: flex; align-items: center; gap: .3rem; border-radius: .9rem; padding: .1rem .6rem; font-size: 1.05rem; font-weight: 700; border: 3px solid #e2e8f0; background: #fff; color: #64748b; line-height: 1.75; }
    .step.now { border-color: #fbbf24; background: #fffbeb; color: #78350f; }
    .step.done { border-color: #86efac; background: #f0fdf4; color: #166534; }

    /* すすみぐあい */
    .dots { display: flex; gap: .4rem; align-items: center; }
    .dot { width: 2.4rem; height: 2.4rem; border-radius: 999px; border: 3px dashed #fdba74; display: flex; align-items: center; justify-content: center; background: #fff; }
    .dot.now { border-style: solid; border-color: #f97316; box-shadow: 0 0 0 4px #ffedd5; }
    .dot.done { border-style: solid; border-color: #fcd34d; background: #fffbeb; }

    /* 動き */
    .pop { animation: popup .45s cubic-bezier(.175,.885,.32,1.275) both; }
    @keyframes popup { 0% { transform: scale(.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    .bob { animation: bob 3.2s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    .jump { animation: jump .5s ease-in-out 3; }
    @keyframes jump { 50% { transform: translateY(-14px); } }
    .blink { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .talk { animation: talk .26s ease-in-out infinite alternate; }
    @keyframes talk { from { transform: rotate(0deg); } to { transform: rotate(-13deg); } }
    .sway { animation: sway 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
    .sway2 { animation-delay: -1.3s; } .sway3 { animation-delay: -2.6s; }
    @keyframes sway { 0%, 100% { transform: rotate(2.5deg); } 50% { transform: rotate(-2.5deg); } }
    .pulse { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .glow { animation: glow 1.2s ease-in-out infinite; }
    @keyframes glow { 50% { box-shadow: 0 0 0 8px rgba(251,191,36,.55); } }
    .flicker { animation: flicker .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes flicker { to { transform: scaleY(1.18) scaleX(.94); } }
    .confetti { position: fixed; top: -60px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
    .fadein { animation: fadein .5s ease both; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    /* メニューボード */
    .board { background: #1f3b2f; border: 14px solid #8b5a2b; border-radius: 1.4rem; box-shadow: inset 0 0 0 3px #2d5242, 0 10px 24px rgba(0,0,0,.2); padding: 1rem 1rem 1.2rem; color: #f8fafc; }
    .board-title { text-align: center; font-size: 2rem; font-weight: 900; letter-spacing: .2em; color: #fef3c7; margin-bottom: .6rem; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: .7rem; }
    .mitem { display: flex; align-items: center; gap: .8rem; text-align: left; border-radius: 1rem; border: 3px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06); color: #f8fafc; padding: .55rem .8rem; font-size: 1.35rem; font-weight: 700; line-height: 1.75; min-height: 96px; }
    .mitem:hover:not(:disabled) { background: rgba(255,255,255,.12); }
    .mitem.next { border-color: #fde047; box-shadow: 0 0 0 4px rgba(253,224,71,.35); }
    .mitem:disabled { opacity: .45; cursor: not-allowed; }
    .mitem rt { color: #cbd5e1; }
    .tag { display: inline-block; font-size: .85rem; border-radius: 999px; padding: .05rem .6rem; font-weight: 700; }

    /* 先生用 */
    .tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .8rem; }
    .tab { border-radius: 1rem; padding: .6rem 1.1rem; font-size: 1.1rem; font-weight: 700; border: 2px solid #e2e8f0; background: #fff; color: #475569; }
    .tab.on { background: #0ea5e9; color: #fff; border-color: #0284c7; }
    .trow { border-top: 1px solid #f1f5f9; padding: .9rem 0; display: grid; grid-template-columns: 1fr 2fr; gap: .6rem; }
    .trow .lb { font-weight: 700; font-size: 1.05rem; }
    .trow .ds { font-size: .85rem; color: #64748b; }
    .opt { border-radius: .7rem; padding: .45rem .9rem; font-weight: 700; border: 2px solid #cbd5e1; background: #fff; color: #475569; font-size: 1rem; }
    .opt.on { background: #0ea5e9; color: #fff; border-color: #0284c7; }
    table.tbl { border-collapse: collapse; width: 100%; font-size: .95rem; }
    table.tbl th, table.tbl td { border-bottom: 1px solid #f1f5f9; padding: .45rem .5rem; text-align: left; vertical-align: top; }
    table.tbl th { background: #f8fafc; color: #475569; white-space: nowrap; }
    .inp { border-radius: .7rem; border: 2px solid #cbd5e1; padding: .5rem .7rem; font-size: 1.1rem; }
    @media (max-width: 700px) { .trow { grid-template-columns: 1fr; } }

    .modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; padding: 1rem; }

    @media (prefers-reduced-motion: reduce) {
      .bob, .sway, .pulse, .glow, .flicker, .talk { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"><div class="loading">🐊 よみこみちゅう…</div></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* =========================================================
       きほんの 設定
       ========================================================= */
    const STORE_KEY = 'waniKakudo.v1';     // localStorage のキー
    const APP_ID = 'wani-kakudo';          // 記録を送るときの アプリの 名前
    const PROBLEMS_PER_STAGE = 5;
    const DEFAULT_SETTINGS = {
      scaleStep: 10,        // 目盛りの細かさ（10°とび／5°とび／1°とび）
      tolerance: 1,         // 正解の幅（±0〜2°）
      answerMode: 'choice', // 答え方（choice：3つから選ぶ／number：数字ボタン）
      snap: 'strong',       // 吸い付く強さ（strong／weak／off）
      colorAssist: true,    // ステージ6〜8で 使う目盛りを はじめから 色分けする
      magnifier: false,     // 読む所の 拡大鏡を いつも 出す
      moveButtons: true,    // ◀ ▶ ボタンで 動かす・回す
      estimate: true,       // 読む前に「直角より 大きい？小さい？」を 聞く
      voice: true,          // ワニワニ先生の 声
      sfx: true,            // 効果音
      fontSize: 'm',
      unlockAll: false,     // すべての ステージを 開く
      advanced: false,      // ステージ8（180°より大きい角）を 開く
    };
    const FONT_PX = { m: 16, l: 18, xl: 20 };
    const TITLES = [
      { min: 0, name: 'ピザやさん みならい', icon: '🥚' },
      { min: 2, name: 'ピザ コック', icon: '👨‍🍳' },
      { min: 5, name: 'ピザ めいじん', icon: '🏅' },
      { min: 8, name: 'かくど マスター', icon: '👑' },
    ];
    // つまずきの 種類（先生用の 名前）
    const ERR = {
      inout: '内側と外側の読みちがい',
      near: '目盛りの読みずれ',
      center: '中心のずれ',
      zero: '0°の線のずれ',
      hen: '辺の長さにつられた',
      right: '直角とのくらべちがい',
      part: '頂点・辺のまちがい',
      count: '数えまちがい',
      calc: '計算のまちがい',
      other: 'その他',
    };
    const ERR_KEYS = Object.keys(ERR);

    /* =========================================================
       小さな 道具
       ========================================================= */
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const pad2 = n => String(n).padStart(2, '0');
    const rand = (a, b) => a + Math.random() * (b - a);
    const randInt = (a, b) => Math.floor(rand(a, b + 1));
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
    function fmtDay(ts) { const d = new Date(ts); return `${d.getMonth() + 1}がつ ${d.getDate()}にち`; }
    function ymd() { const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`; }
    function hashPin(pin) { let h = 2166136261; for (const c of 'kakudo:' + pin) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
    function fnv(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
    // 決まった 乱数（ピザの トッピングの 位置を 毎回 同じに する）
    function seeded(seed) { let s = (typeof seed === 'number' ? seed : parseInt(fnv(String(seed)), 16)) >>> 0 || 1; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    const CURRENT = { settings: { ...DEFAULT_SETTINGS } };

    /* ---- ふりがな ----
       書き方： [漢字|よみ]  例：'[直角|ちょっかく]を さがそう' */
    const MARK_RE = /\[([^|\]]+)\|([^\]]+)\]/g;
    const stripMarkup = s => String(s).replace(MARK_RE, '$1');
    const toYomi = s => String(s).replace(MARK_RE, '$2');
    const KANJI_RE = /[一-鿿々]/;
    function R({ t, className, style }) {
      const s = String(t == null ? '' : t);
      const out = []; let last = 0; let m; let k = 0;
      const re = new RegExp(MARK_RE.source, 'g');
      const plain = (txt) => {
        if (KANJI_RE.test(txt) && window.__furiganaWarn) window.__furiganaWarn(txt, s);
        // 「\n」で 改行
        txt.split('\n').forEach((part, i) => { if (i > 0) out.push(<br key={'b' + (k++)} />); if (part) out.push(<React.Fragment key={'t' + (k++)}>{part}</React.Fragment>); });
      };
      while ((m = re.exec(s))) { plain(s.slice(last, m.index)); out.push(<ruby key={'r' + (k++)}>{m[1]}<rt>{m[2]}</rt></ruby>); last = re.lastIndex; }
      plain(s.slice(last));
      return <span className={className} style={style}>{out}</span>;
    }
    // 読み上げ用の 文
    const speechText = s => toYomi(s).replace(/(\d+)°/g, '$1ど').replace(/°/g, 'ど').replace(/□/g, 'しかく').replace(/\n/g, '　');

    /* =========================================================
       ほぞん（localStorage と IndexedDB）
       ========================================================= */
    const newDeviceId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    function normalizeState(s) {
      s = s && typeof s === 'object' ? s : {};
      return {
        version: 1, profile: s.profile || null, settings: { ...DEFAULT_SETTINGS, ...(s.settings || {}) },
        progress: s.progress || {}, runs: s.runs || {}, pizzas: Array.isArray(s.pizzas) ? s.pizzas : [],
        sync: s.sync || {}, deviceId: s.deviceId || newDeviceId(),
      };
    }
    function loadState() {
      let s = null;
      try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { s = null; }
      const st = normalizeState(s);
      if (!s || !s.deviceId) saveState(st);
      CURRENT.settings = st.settings;
      return st;
    }
    function saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) { console.warn(e); } }

    // 入口ページ（Apps Script）から開いたとき、URLの # のあとに 記録の送り先と合言葉が ついてくる
    const REC_URL_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/|macros\/)s\/[A-Za-z0-9_-]+\/(exec|dev)$/;
    (function applyLinkConfig() {
      if (!location.hash) return;
      const h = new URLSearchParams(location.hash.slice(1));
      const rec = h.get('rec');
      if (!rec) return;
      if (REC_URL_RE.test(rec)) {
        const st = loadState();
        if (st.sync.url !== rec || st.sync.key !== (h.get('key') || '')) {
          saveState({ ...st, sync: { ...st.sync, url: rec, key: h.get('key') || '', lastSummary: null } });
        }
      }
      history.replaceState(null, '', location.pathname + location.search);
    })();

    const DB_NAME = 'wani-kakudo';
    let dbPromise = null;
    function getDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath: 'id', autoIncrement: true }).createIndex('stageId', 'stageId');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }
    async function idbReq(storeName, mode, fn) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const req = fn(tx.objectStore(storeName));
        let result;
        if (req) req.onsuccess = () => { result = req.result; };
        tx.oncomplete = () => resolve(result);

    let SFX_CTX = null;

    /* =========================================================
       図形の 計算
       角度は 算数と 同じ 向き（右が 0°、反時計回りに ふえる）。
       SVG は 下向きが +y なので、点を 出すときに y を 反転する。
       ========================================================= */
    const DEG = Math.PI / 180;
    const P = (cx, cy, r, a) => [cx + r * Math.cos(a * DEG), cy - r * Math.sin(a * DEG)];
    const n360 = a => ((a % 360) + 360) % 360;
    const sdiff = (a, b) => { const d = n360(a - b); return d > 180 ? d - 360 : d; };   // a − b（−180〜180）
    const angOf = (dx, dy) => n360(Math.atan2(-dy, dx) / DEG);
    const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
    function segDist(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1, dy = y2 - y1; const L2 = dx * dx + dy * dy || 1;
      const t = clamp(((px - x1) * dx + (py - y1) * dy) / L2, 0, 1);
      return dist(px, py, x1 + t * dx, y1 + t * dy);
    }
    const f1 = v => Math.round(v * 10) / 10;
    // 反時計回りに sweep 度 すすむ 弧（sweep が マイナスなら 時計回り）
    function arcD(cx, cy, r, a1, sweep) {
      if (Math.abs(sweep) >= 359.9) {
        const [x1, y1] = P(cx, cy, r, a1), [x2, y2] = P(cx, cy, r, a1 + 180);
        return `M ${f1(x1)} ${f1(y1)} A ${r} ${r} 0 1 0 ${f1(x2)} ${f1(y2)} A ${r} ${r} 0 1 0 ${f1(x1)} ${f1(y1)}`;
      }
      const [x1, y1] = P(cx, cy, r, a1), [x2, y2] = P(cx, cy, r, a1 + sweep);
      return `M ${f1(x1)} ${f1(y1)} A ${r} ${r} 0 ${Math.abs(sweep) > 180 ? 1 : 0} ${sweep > 0 ? 0 : 1} ${f1(x2)} ${f1(y2)}`;
    }
    function sectorD(cx, cy, r, a1, sweep) {
      if (Math.abs(sweep) >= 359.9) return `M ${cx - r} ${cy} A ${r} ${r} 0 1 0 ${cx + r} ${cy} A ${r} ${r} 0 1 0 ${cx - r} ${cy} Z`;
      const [x1, y1] = P(cx, cy, r, a1), [x2, y2] = P(cx, cy, r, a1 + sweep);
      return `M ${cx} ${cy} L ${f1(x1)} ${f1(y1)} A ${r} ${r} 0 ${Math.abs(sweep) > 180 ? 1 : 0} ${sweep > 0 ? 0 : 1} ${f1(x2)} ${f1(y2)} Z`;

        window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp);

    // 目盛りの 値を えらぶ（10°とび・5°とび・1°とび）
    function pickDeg(step, { min = 10, max = 170, avoid = [] } = {}) {
      const all = [];
      for (let v = min; v <= max; v++) if (v % step === 0 && !avoid.includes(v)) all.push(v);
      let list = all;
      if (step === 5) { const f = all.filter(v => v % 10 !== 0); if (f.length) list = f; }
      if (step === 1) { const f = all.filter(v => v % 5 !== 0); if (f.length) list = f; }

    // 読んだ 数の 判定
    function judgeReading(ans, correct, tol, step, { full = 180 } = {}) {
      if (Math.abs(ans - correct) <= tol) return { ok: true };
      if (full === 180 && correct !== 90 && Math.abs(ans - (180 - correct)) <= tol) return { ok: false, err: 'inout' };
      if (Math.abs(ans - correct) <= Math.max(10, step * 2)) return { ok: false, err: 'near' };

      while (set.size < 3 && near.length) set.add(near.shift());

      let solved = 0, first = 0, lastAt = 0;

      { id: 'cheese', name: 'チーズ', draw: () => <path d="M -9 -7 L 9 -9 L 7 8 L -8 7 Z" fill="#fde047" stroke="#ca8a04" strokeWidth="1.8" strokeLinejoin="round" /> },

      { id: 'piman', name: 'ピーマン', draw: () => <path d="M -10 0 Q -10 -10 0 -10 Q 7 -10 10 -3 Q 12 5 5 10 Q -2 13 -8 8 Q -10 5 -10 0 Z" fill="none" stroke="#16a34a" strokeWidth="4.5" strokeLinejoin="round" /> },
      { id: 'salami', name: 'サラミ', draw: () => <g><circle r="12.5" fill="#b91c1c" stroke="#7f1d1d" strokeWidth="1.8" /><g fill="#fecaca"><circle cx="-4" cy="-4" r="1.7" /><circle cx="4" cy="-3" r="1.4" /><circle cx="-2" cy="4" r="1.5" /><circle cx="5" cy="5" r="1.3" /><circle cx="0" cy="0" r="1.2" /></g></g> },
      { id: 'kinoko', name: 'きのこ', draw: () => <g><path d="M -12 2 Q -12 -12 0 -12 Q 12 -12 12 2 Z" fill="#d6b98c" stroke="#92400e" strokeWidth="1.8" strokeLinejoin="round" /><rect x="-4.5" y="2" width="9" height="10" rx="2.5" fill="#f5e6c8" stroke="#92400e" strokeWidth="1.8" /></g> },
      { id: 'corn', name: 'コーン', draw: () => <g fill="#facc15" stroke="#ca8a04" strokeWidth="1.5"><rect x="-9" y="-6" width="7" height="8" rx="2.5" /><rect x="1" y="-8" width="7" height="8" rx="2.5" /><rect x="-4" y="2" width="7" height="8" rx="2.5" /></g> },
      { id: 'ebi', name: 'えび', draw: () => <g><path d="M -8 7 A 9 9 0 1 1 9 3" fill="none" stroke="#fb923c" strokeWidth="7.5" strokeLinecap="round" /><path d="M -8 7 A 9 9 0 1 1 9 3" fill="none" stroke="#fff7ed" strokeWidth="1.5" strokeDasharray="2 5" /><path d="M 9 3 L 15 0 L 13 8 Z" fill="#f97316" /></g> },
      { id: 'tamanegi', name: 'たまねぎ', draw: () => <g fill="none"><circle r="11" stroke="#c084fc" strokeWidth="3" /><circle r="6.5" stroke="#e9d5ff" strokeWidth="2.5" /></g> },
      { id: 'bacon', name: 'ベーコン', draw: () => <g><path d="M -13 -4 Q -6 -9 0 -4 Q 6 1 13 -4 L 13 5 Q 6 10 0 5 Q -6 0 -13 5 Z" fill="#fda4af" stroke="#be123c" strokeWidth="1.6" strokeLinejoin="round" /><path d="M -12 1 Q -6 -4 0 1 Q 6 6 12 1" fill="none" stroke="#fff1f2" strokeWidth="1.6" /></g> },
      { id: 'olive', name: 'オリーブ', draw: () => <circle r="6.5" fill="none" stroke="#1f2937" strokeWidth="5" /> },
      { id: 'basil', name: 'バジル', draw: () => <g><path d="M -11 5 Q -3 -13 13 -6 Q 4 11 -11 5 Z" fill="#22c55e" stroke="#15803d" strokeWidth="1.6" strokeLinejoin="round" /><path d="M -9 4 Q 2 -2 11 -5" fill="none" stroke="#15803d" strokeWidth="1.3" /></g> },
      { id: 'pine', name: 'パイナップル', draw: () => <path d="M -10 8 Q -11 10 -8 10 L 8 10 Q 11 10 10 8 L 1 -9 Q 0 -11 -1 -9 Z" fill="#fde047" stroke="#ca8a04" strokeWidth="1.8" strokeLinejoin="round" /> },
    ];
    const TOP_MAP = Object.fromEntries(TOPPINGS.map(t => [t.id, t]));
    function ToppingIcon({ id, size = 40 }) {
      const t = TOP_MAP[id]; if (!t) return null;
      return <svg viewBox="-17 -17 34 34" width={size} height={size} aria-hidden="true">{t.draw()}</svg>;
    }

    // ---- ピザ（まるごと）----
    function PizzaG({ toppings = [], seed = 'p', baked = false, r = 96 }) {
      const k = r / 96;
      const cheese = useMemo(() => {
        const rng = seeded(seed + ':cheese');
        const n = 18; const pts = [];
        for (let i = 0; i < n; i++) { const a = i / n * 360; const rr = 74 + rng() * 8; pts.push(P(0, 0, rr, a)); }
        let d = `M ${f1((pts[0][0] + pts[1][0]) / 2)} ${f1((pts[0][1] + pts[1][1]) / 2)}`;
        for (let i = 1; i <= n; i++) { const a = pts[i % n], b = pts[(i + 1) % n]; d += ` Q ${f1(a[0])} ${f1(a[1])} ${f1((a[0] + b[0]) / 2)} ${f1((a[1] + b[1]) / 2)}`; }
        return d + ' Z';
      }, [seed]);
      const spots = useMemo(() => { const rng = seeded(seed + ':spot'); return Array.from({ length: 7 }, () => { const rr = 60 * Math.sqrt(rng()); const a = rng() * 360; const [x, y] = P(0, 0, rr, a); return { x, y, rx: 5 + rng() * 6, ry: 3 + rng() * 4 }; }); }, [seed]);
      const pieces = useMemo(() => toppings.map((id, i) => {
        const rng = seeded(`${seed}:${i}:${id}`);
        return Array.from({ length: 5 }, () => { const rr = 64 * Math.sqrt(0.08 + rng() * 0.92); const a = rng() * 360; const [x, y] = P(0, 0, rr, a); return { x, y, rot: rng() * 360 }; });
      }), [seed, toppings.join(',')]);
      return (
        <g transform={k !== 1 ? `scale(${k})` : undefined}>
          <circle r="96" fill={baked ? '#d97706' : '#fbbf24'} stroke="#b45309" strokeWidth="3" />
          <circle r="85" fill="#ef4444" />
          <path d={cheese} fill={baked ? '#fcd34d' : '#fef3c7'} />
          {baked && spots.map((s, i) => <ellipse key={i} cx={s.x} cy={s.y} rx={s.rx} ry={s.ry} fill="#f59e0b" opacity=".45" />)}
          {toppings.map((id, i) => {
            const t = TOP_MAP[id]; if (!t) return null;
            return <g key={i}>{pieces[i].map((p, j) => <g key={j} transform={`translate(${f1(p.x)} ${f1(p.y)}) rotate(${Math.round(p.rot)})`}>{t.draw()}</g>)}</g>;
          })}
          {baked && <g stroke="rgba(120,53,15,.35)" strokeWidth="2">{[0, 45, 90, 135].map(a => { const [x1, y1] = P(0, 0, 92, a), [x2, y2] = P(0, 0, 92, a + 180); return <line key={a} x1={x1} y1={y1} x2={x2} y2={y2} />; })}</g>}
        </g>
      );
    }
    function Pizza({ size = 160, ...p }) {
      return <svg viewBox="-100 -100 200 200" width={size} height={size} style={{ flex: 'none' }} aria-hidden="true"><PizzaG {...p} /></svg>;
    }

    // ---- ピザの 1切れ（角の 学習用）----
    function PizzaSlice({ x, y, r, a1, sweep, edge = '#92400e', edgeW = 5, hlEdges = null, pepperoni = true, opacity = 1, onPointerDown, style }) {
      const [ex1, ey1] = P(x, y, r, a1), [ex2, ey2] = P(x, y, r, a1 + sweep);
      const crustW = Math.max(10, r * 0.09);
      const peps = [];
      if (pepperoni && Math.abs(sweep) >= 24) {
        const pr = Math.min(r * 0.09, Math.abs(sweep) * DEG * r * 0.6 * 0.25);
        [[0.6, 0.35], [0.45, 0.7], [0.75, 0.62]].forEach(([rf, af], i) => { if (i < 2 || Math.abs(sweep) > 60) { const [px, py] = P(x, y, r * rf, a1 + sweep * af); peps.push(<circle key={i} cx={px} cy={py} r={pr} fill="#dc2626" stroke="#991b1b" strokeWidth="1.5" />); } });
      }
      return (
        <g opacity={opacity} onPointerDown={onPointerDown} style={style}>
          <path d={sectorD(x, y, r, a1, sweep)} fill="#fde68a" />
          <path d={arcD(x, y, r - crustW / 2, a1, sweep)} fill="none" stroke="#d97706" strokeWidth={crustW} />
          {peps}
          <line x1={x} y1={y} x2={ex1} y2={ey1} stroke={hlEdges && hlEdges[0] ? hlEdges[0] : edge} strokeWidth={hlEdges && hlEdges[0] ? edgeW + 3 : edgeW} strokeLinecap="round" />
          <line x1={x} y1={y} x2={ex2} y2={ey2} stroke={hlEdges && hlEdges[1] ? hlEdges[1] : edge} strokeWidth={hlEdges && hlEdges[1] ? edgeW + 3 : edgeW} strokeLinecap="round" />
        </g>
      );
    }

    // ---- 角（2本の 辺）----
    function AngleFig({ x, y, a1, sweep, len = 220, len2, color = '#1e293b', w = 6, arc = 44, arcColor = '#f97316', fill = 'rgba(251,146,60,.18)', label, dot = true, dash }) {
      const [x1, y1] = P(x, y, len, a1), [x2, y2] = P(x, y, len2 || len, a1 + sweep);
      return (
        <g>
          {arc > 0 && <path d={sectorD(x, y, arc, a1, sweep)} fill={fill} />}
          {arc > 0 && <path d={arcD(x, y, arc, a1, sweep)} fill="none" stroke={arcColor} strokeWidth="4" />}
          <line x1={x} y1={y} x2={x1} y2={y1} stroke={color} strokeWidth={w} strokeLinecap="round" strokeDasharray={dash} />
          <line x1={x} y1={y} x2={x2} y2={y2} stroke={color} strokeWidth={w} strokeLinecap="round" strokeDasharray={dash} />
          {dot && <circle cx={x} cy={y} r={w * 0.9} fill={color} />}
          {label && (() => { const [lx, ly] = P(x, y, arc + 26, a1 + sweep / 2); return <text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="26" fontWeight="900" fill={arcColor}>{label}</text>; })()}
        </g>
      );
    }
    // 直角の しるし
    function RightMark({ x, y, a1, size = 26, color = '#e11d48', sweep = 90 }) {
      const [ax, ay] = P(x, y, size, a1), [bx, by] = P(x, y, size, a1 + (sweep > 0 ? 90 : -90));
      const cx = ax + bx - x, cy = ay + by - y;
      return <path d={`M ${ax} ${ay} L ${cx} ${cy} L ${bx} ${by}`} fill="none" stroke={color} strokeWidth="4" strokeLinejoin="round" />;
    }

    // ---- 三角定規（直角の かどが x,y。1本の 辺が rot の 向き）----
    function SetSquare({ x, y, rot = 0, a = 190, b = 110, kind = '30', glowCorner = false, ghost = false, onPointerDown, style }) {
      // kind '30'：30°・60°・90°、'45'：45°・45°・90°
      const bb = kind === '45' ? a : b;
      const [ax, ay] = P(x, y, a, rot), [bx, by] = P(x, y, bb, rot + 90);
      // 穴（内側の 小さい 三角形）
      const g = (px, py) => [x + (px - x) * 0.55 + ((ax + bx + x) / 3 - x) * 0.45, y + (py - y) * 0.55 + ((ay + by + y) / 3 - y) * 0.45];
      const [h0x, h0y] = g(x, y), [h1x, h1y] = g(ax, ay), [h2x, h2y] = g(bx, by);
      return (
        <g opacity={ghost ? 0.45 : 1} onPointerDown={onPointerDown} style={style}>
          <path d={`M ${x} ${y} L ${ax} ${ay} L ${bx} ${by} Z M ${h0x} ${h0y} L ${h2x} ${h2y} L ${h1x} ${h1y} Z`} fill="rgba(125,211,252,.55)" fillRule="evenodd" stroke="#0369a1" strokeWidth="3" strokeLinejoin="round" />
          <RightMark x={x} y={y} a1={rot} size={18} color="#0369a1" />
          {glowCorner && <circle cx={x} cy={y} r="22" fill="none" stroke="#f43f5e" strokeWidth="5" className="pulse" />}
        </g>
      );
    }

    // ---- 分度器 ----
    // x,y：中心。rot：内側の目盛りの 0 が ある 向き（ふつうは 0 ＝ 右）
    // step：見せる 目盛りの こまかさ。show：'both' / 'inner' / 'outer'。hl：色分けする 目盛り
    function Protractor({ x, y, rot = 0, R = 230, step = 10, show = 'both', hl = null, ghost = false, onBodyDown, onKnobDown, knob = false, glow = null }) {
      const ticks = useMemo(() => {
        const out = [];
        for (let a = 0; a <= 180; a++) {
          const is10 = a % 10 === 0, is5 = a % 5 === 0;
          if (!(is10 || (step <= 5 && is5) || step === 1)) continue;
          const len = is10 ? 20 : is5 ? 13 : 8;
          const [x1, y1] = P(0, 0, R, a), [x2, y2] = P(0, 0, R - len, a);
          out.push(<line key={a} x1={f1(x1)} y1={f1(y1)} x2={f1(x2)} y2={f1(y2)} stroke="#0f172a" strokeWidth={is10 ? 2.2 : 1.3} />);
          if (is10) { const [x3, y3] = P(0, 0, R - 80, a), [x4, y4] = P(0, 0, R - 92, a); out.push(<line key={'in' + a} x1={f1(x3)} y1={f1(y3)} x2={f1(x4)} y2={f1(y4)} stroke="#0f172a" strokeWidth="1.6" />); }
        }
        return out;
      }, [R, step]);
      const fillOf = (which) => !hl ? '#1e293b' : hl === which ? '#dc2626' : '#cbd5e1';
      const nums = [];
      for (let a = 0; a <= 180; a += 10) {
        const tr = 90 - a;
        if (show !== 'inner') { const [ox, oy] = P(0, 0, R - 36, a); nums.push(<text key={'o' + a} x={f1(ox)} y={f1(oy)} transform={`rotate(${tr} ${f1(ox)} ${f1(oy)})`} textAnchor="middle" dominantBaseline="central" fontSize={R * 0.074} fontWeight={hl === 'outer' ? 900 : 700} fill={fillOf('outer')} stroke="#fff" strokeWidth="3.5" paintOrder="stroke">{180 - a}</text>); }
        if (show !== 'outer') { const [ix, iy] = P(0, 0, R - 64, a); nums.push(<text key={'i' + a} x={f1(ix)} y={f1(iy)} transform={`rotate(${tr} ${f1(ix)} ${f1(iy)})`} textAnchor="middle" dominantBaseline="central" fontSize={R * 0.062} fontWeight={hl === 'inner' ? 900 : 700} fill={fillOf('inner')} stroke="#fff" strokeWidth="3.5" paintOrder="stroke">{a}</text>); }
      }
      const body = `M ${-R - 12} 14 L ${R + 12} 14 L ${R + 12} 0 A ${R + 12} ${R + 12} 0 0 0 ${-R - 12} 0 Z`;
      const band = hl && ((hl === 'outer' && show !== 'inner') || (hl === 'inner' && show !== 'outer'));
      const bandR = hl === 'outer' ? R - 36 : R - 64;
      return (
        <g transform={`translate(${f1(x)} ${f1(y)}) rotate(${f1(-rot)})`} opacity={ghost ? 0.4 : 1}>
          <path d={body} fill="rgba(224,242,254,.55)" stroke="#0284c7" strokeWidth="3" strokeLinejoin="round" onPointerDown={onBodyDown} style={{ cursor: onBodyDown ? 'grab' : 'default' }} />
          <g pointerEvents="none">
            {band && <path d={arcD(0, 0, bandR, 0, 180)} fill="none" stroke="#fde68a" strokeWidth={R * 0.1} strokeLinecap="round" opacity=".9" />}
            <path d={arcD(0, 0, R - 92, 0, 180)} fill="none" stroke="#0f172a" strokeWidth="1.6" />
            {ticks}
            {nums}
            <line x1={-R} y1="0" x2={R} y2="0" stroke={glow === 'zero' ? '#f43f5e' : '#0f172a'} strokeWidth={glow === 'zero' ? 6 : 2.5} className={glow === 'zero' ? 'pulse' : undefined} />
            <circle r="6" fill="#fff" stroke={glow === 'center' ? '#f43f5e' : '#0f172a'} strokeWidth="2.5" />
            <line x1="-14" y1="0" x2="14" y2="0" stroke="#0f172a" strokeWidth="2" />
            <line x1="0" y1="-14" x2="0" y2="8" stroke="#0f172a" strokeWidth="2" />
            {glow === 'center' && <circle r="20" fill="none" stroke="#f43f5e" strokeWidth="5" className="pulse" />}
          </g>
          {knob && (
            <g onPointerDown={onKnobDown} style={{ cursor: 'grab' }}>
              <line x1="0" y1={-R - 12} x2="0" y2={-R - 34} stroke="#0284c7" strokeWidth="4" />
              <circle cx="0" cy={-R - 52} r="24" fill="#f97316" stroke="#c2410c" strokeWidth="3" />
              <path d={`M -11 ${-R - 50} A 11 11 0 1 1 0 ${-R - 41}`} fill="none" stroke="#fff" strokeWidth="3.5" strokeLinecap="round" />
              <path d={`M -16 ${-R - 54} L -11 ${-R - 46} L -5 ${-R - 54}`} fill="none" stroke="#fff" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" />
            </g>
          )}
        </g>
      );
    }

    // ---- ワニの 口（角の 学習用）----
    // x,y：あごの つけね（頂点）。base：下あごの 向き。open：口の ひらき（反時計回り）
    function WaniMouth({ x, y, base = 0, open = 30, len = 260, rays = true, rayColor = '#1e3a8a', hlVertex = false, hlEdges = false, arc = true, arcR = 56, label, hat = true }) {
      const teeth = [];
      for (let t = 50; t < len - 34; t += 32) teeth.push(t);
      const lower = `M 0 0 L ${len - 18} 0 Q ${len + 2} 0 ${len + 4} 14 Q ${len} 32 ${len - 36} 34 L 40 42 Q -6 42 -24 22 Q -30 0 0 0 Z`;
      const upper = `M 0 0 L ${len - 18} 0 Q ${len + 4} 0 ${len + 6} -16 Q ${len} -34 ${len - 40} -38 L 90 -42 Q 66 -78 20 -74 Q -34 -66 -34 -24 Q -30 0 0 0 Z`;
      const hlc = '#f43f5e';
      return (
        <g transform={`translate(${f1(x)} ${f1(y)}) rotate(${f1(-base)})`}>
          {/* からだ（つけねの うしろ）*/}
          <ellipse cx="-70" cy="30" rx="70" ry="52" fill={GREEN} stroke={GREEN_D} strokeWidth="4" />
          <ellipse cx="-62" cy="44" rx="40" ry="26" fill="#bbf7d0" />
          {open > 2 && <path d={sectorD(0, 0, len * 0.9, 0, open)} fill="#fda4af" />}
          {arc && open > 2 && <path d={arcD(0, 0, arcR, 0, open)} fill="none" stroke="#f97316" strokeWidth="5" />}
          {/* 下あご */}
          <path d={lower} fill={GREEN} stroke={GREEN_D} strokeWidth="4" strokeLinejoin="round" />
          {teeth.map(t => <polygon key={t} points={`${t},0 ${t + 14},0 ${t + 7},-12`} fill="#fff" stroke="#cbd5e1" strokeWidth="1" />)}
          {/* 上あご */}
          <g transform={`rotate(${f1(-open)})`}>
            <path d={upper} fill={GREEN} stroke={GREEN_D} strokeWidth="4" strokeLinejoin="round" />
            {teeth.map(t => <polygon key={t} points={`${t},0 ${t + 14},0 ${t + 7},12`} fill="#fff" stroke="#cbd5e1" strokeWidth="1" />)}
            <ellipse cx={len - 10} cy="-24" rx="4" ry="2.8" fill="#166534" />
            {hat && (
              <g transform="translate(-14 -92) rotate(-8)">
                <circle cx="-14" cy="-6" r="15" fill="#fff" stroke="#cbd5e1" strokeWidth="2.5" />
                <circle cx="24" cy="-6" r="15" fill="#fff" stroke="#cbd5e1" strokeWidth="2.5" />
                <circle cx="5" cy="-15" r="18" fill="#fff" stroke="#cbd5e1" strokeWidth="2.5" />
                <ellipse cx="5" cy="0" rx="27" ry="9" fill="#fff" />
                <rect x="-20" y="0" width="50" height="16" rx="4" fill="#fff" stroke="#cbd5e1" strokeWidth="2.5" />
              </g>
            )}
            <circle cx="16" cy="-60" r="19" fill="#fff" stroke={GREEN_D} strokeWidth="3" />
            <circle cx="21" cy="-59" r="8.5" fill="#1e293b" /><circle cx="24" cy="-62" r="2.6" fill="#fff" />
            {rays && <line x1="0" y1="0" x2={len} y2="0" stroke={hlEdges ? hlc : rayColor} strokeWidth={hlEdges ? 9 : 5} strokeLinecap="round" />}
          </g>
          {rays && <line x1="0" y1="0" x2={len} y2="0" stroke={hlEdges ? hlc : rayColor} strokeWidth={hlEdges ? 9 : 5} strokeLinecap="round" />}
          <circle r={hlVertex ? 11 : 7} fill={hlVertex ? hlc : rayColor} />
          {hlVertex && <circle r="24" fill="none" stroke={hlc} strokeWidth="4" className="pulse" />}
          {label && (() => { const [lx, ly] = P(0, 0, arcR + 34, open / 2); return <text x={lx} y={ly} transform={`rotate(${f1(base)} ${lx} ${ly})`} textAnchor="middle" dominantBaseline="central" fontSize="30" fontWeight="900" fill="#ea580c" stroke="#fff" strokeWidth="6" paintOrder="stroke">{label}</text>; })()}
        </g>
      );
    }

    // ---- ピザやさん（ホームの 背景）----
    function FrameArt({ x, y, w = 130, h = 160, pizza, onClick, isNew }) {
      return (
        <g onClick={onClick} style={{ cursor: onClick ? 'pointer' : 'default' }}>
          <rect x={x - w / 2 + 4} y={y - h / 2 + 6} width={w} height={h} rx="4" fill="rgba(0,0,0,.25)" />
          <rect x={x - w / 2} y={y - h / 2} width={w} height={h} rx="4" fill="#292524" />
          <rect x={x - w / 2 + 9} y={y - h / 2 + 9} width={w - 18} height={h - 18} fill="#fafaf9" />
          <rect x={x - w / 2 + 16} y={y - h / 2 + 16} width={w - 32} height={h - 32} fill={pizza ? '#fff7ed' : '#f5f5f4'} stroke="#e7e5e4" strokeWidth="2" />
          {pizza ? (
            <g transform={`translate(${x} ${y - 6}) scale(${(w - 44) / 200})`}><PizzaG toppings={pizza.toppings} seed={pizza.id} baked /></g>
          ) : (
            <g>
              <circle cx={x} cy={y - 6} r={(w - 44) / 2} fill="none" stroke="#d6d3d1" strokeWidth="3" strokeDasharray="8 8" />
              <text x={x} y={y - 4} textAnchor="middle" dominantBaseline="middle" fontSize="36" fill="#d6d3d1" fontWeight="900">?</text>
            </g>
          )}
          {pizza && <text x={x} y={y + h / 2 - 24} textAnchor="middle" fontSize="13" fill="#78716c" fontWeight="700">{fmtDay(pizza.at)}</text>}
          {isNew && <text x={x + w / 2 - 8} y={y - h / 2 + 4} textAnchor="middle" fontSize="30">✨</text>}
        </g>
      );
    }
    function Bottle({ x, y, h = 46, color = '#15803d' }) {
      return <g><rect x={x - 7} y={y - h} width="14" height={h} rx="4" fill={color} /><rect x={x - 3} y={y - h - 14} width="6" height="16" rx="2" fill={color} /><rect x={x - 7} y={y - h * 0.6} width="14" height={h * 0.28} fill="rgba(255,255,255,.55)" /></g>;
    }
    function PlantPot({ x, y, s = 1 }) {
      return (

    /* =========================================================

    function Btn({ color = 'sky', size = 'md', className = '', onClick, silent, ...p }) {
      return <button {...p} onClick={(e) => { if (!silent) sfx('tap'); onClick && onClick(e); }} className={`btn3d c-${color} s-${size} ${className}`} />;
    }
    // おしている あいだ くりかえす ボタン（◀ ▶ など）
    function HoldBtn({ onStep, color = 'white', size = 'md', className = '', children, disabled, label }) {
      const timer = useRef(null);
      const stop = () => { clearTimeout(timer.current); clearInterval(timer.current); timer.current = null; };
      useEffect(() => stop, []);
      const start = (e) => {
        if (disabled) return;
        e.preventDefault();
        stop(); onStep();
        timer.current = setTimeout(() => { timer.current = setInterval(onStep, 90); }, 420);
      };
      return (
        <button className={`btn3d c-${color} s-${size} ${className}`} disabled={disabled} aria-label={label}
                onPointerDown={start} onPointerUp={stop} onPointerLeave={stop} onPointerCancel={stop} onContextMenu={e => e.preventDefault()}
                style={{ touchAction: 'none', minWidth: '3.4rem' }}>
          {children}
        </button>
      );

    function Modal({ children, onClose }) {
      return (
        <div className="modal-bg" onClick={onClose}>
          <div className="pop" style={{ maxWidth: 640, width: '100%' }} onClick={e => e.stopPropagation()}>{children}</div>
        </div>
      );
    }
    function useTicker(ms, { loop = false, run = true, key } = {}) {
      const [t, setT] = useState(0);
      useEffect(() => {
        if (!run) { setT(0); return; }
        let raf; const start = performance.now();
        const tick = now => {
          let x = (now - start) / ms;
          x = loop ? x % 1 : Math.min(1, x);
          setT(x);
          if (loop || x < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [ms, loop, run, key]);
      return t;
    }
    const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

    // ---- 選択肢 ----
    function Choices({ options, onPick, disabled, cols, big = true }) {

    // ---- 数字ボタン ----
    function NumPad({ onSubmit, disabled, unit = '°', max = 3 }) {
      const [v, setV] = useState('');

      return (

          <div className="numpad">
            {['7', '8', '9', '4', '5', '6', '1', '2', '3'].map(d => <Btn key={d} color="white" size="md" disabled={disabled} onClick={() => press(d)}>{d}</Btn>)}
            <Btn color="white" size="md" disabled={disabled} onClick={() => setV(v.slice(0, -1))}>⌫</Btn>
            <Btn color="white" size="md" disabled={disabled} onClick={() => press('0')}>0</Btn>
            <Btn color="green" size="md" disabled={disabled || !v} onClick={() => { onSubmit(Number(v)); setV(''); }}>OK</Btn>
          </div>

    // こどもへの ことば（漢字には すべて ふりがな）
    const MSG = {
      inout: 'どっちの 0から かぞえたかな？\n[辺|へん]が かさなって いる 0から かぞえよう。',
      near: 'おしい！ [目盛|めも]りを よく [見|み]て みよう。',
      other: '[直角|ちょっかく]より [大|おお]きいかな？ [小|ちい]さいかな？ よく [見|み]て みよう。',
      center: '[分度器|ぶんどき]の [中心|ちゅうしん]が [頂点|ちょうてん]から ずれて いるよ。',
      zero: '0の [線|せん]が [辺|へん]に ぴったり かさなって いないよ。',
      hen: '[辺|へん]の ながさでは なくて、ひらきぐあいで くらべよう。',
      right: '[直角|ちょっかく]と くらべて みよう。',
      again: 'もう いちど やって みよう。',
    };
    const PRAISE = ['せいかい！ すごいね！', 'やったね！ ばっちり！', 'すばらしい！', 'その ちょうし！', 'かんぺき！', 'よく できました！'];

    // ---- 何度かを 答える（見当 → 数）----
    // value：正しい 角度。onCorrect：正解の とき。onErr：まちがいの しゅるいを 知らせる
    function DegreeAnswer({ value, s, api, onCorrect, onErr, onPhase, prompt, hints, estimate = true, forceEstimate = false, full = 180, disabled, choices: choicesOverride }) {
      const useEst = forceEstimate || (estimate && s.estimate && full === 180);
      const [phase, setPhase] = useState(useEst ? 'est' : 'read');
      const [gone, setGone] = useState([]);
      const [goneEst, setGoneEst] = useState([]);
      const choices = useMemo(() => choicesOverride || readingChoices(value, s.scaleStep, { full }), [value, s.scaleStep, full]);
      useEffect(() => {
        onPhase && onPhase(phase);
        if (phase === 'est') api.phase({ prompt: 'まず [見当|けんとう]を つけよう。\nこの [角|かく]は [直角|ちょっかく]より [大|おお]きい？ [小|ちい]さい？', hints: ['[直角|ちょっかく]は 90° だよ。', '[点線|てんせん]の [直角|ちょっかく]と くらべて みよう。', '[点線|てんせん]より ひらいて いたら「[大|おお]きい」だよ。'] });
        else api.phase({ prompt, hints });
      }, [phase]);
      if (phase === 'est') {
        const correct = value < 90 ? 's' : value > 90 ? 'b' : 'r';
        const opts = [
          { value: 's', label: '[直角|ちょっかく]より\n[小|ちい]さい', gone: goneEst.includes('s') },
          { value: 'r', label: 'ちょうど\n[直角|ちょっかく]', gone: goneEst.includes('r') },
          { value: 'b', label: '[直角|ちょっかく]より\n[大|おお]きい', gone: goneEst.includes('b') },
        ];
        return <Choices options={opts} cols={3} big={false} disabled={disabled} onPick={v => {
          const txt = { s: '直角より小さい', r: '直角', b: '直角より大きい' }[v];
          if (v === correct) { sfx('snap'); api.note(txt); setPhase('read'); }
          else { setGoneEst(g => [...g, v]); onErr && onErr('right'); api.ng(txt, 'right', '[点線|てんせん]の [直角|ちょっかく]と くらべて みよう。'); }
        }} />;
      }
      const judge = (ans) => {
        const r = choicesOverride ? (ans === value ? { ok: true } : { ok: false, err: 'other' }) : judgeReading(ans, value, s.tolerance, s.scaleStep, { full });
        if (r.ok) { onCorrect(ans); return; }
        onErr && onErr(r.err);
        api.ng(`${ans}°`, r.err, MSG[r.err] || MSG.again);
        setGone(g => [...g, ans]);
      };
      if (s.answerMode === 'number' && !choicesOverride) return <NumPad disabled={disabled} onSubmit={judge} />;
      return <Choices options={choices.map(v => ({ value: v, label: `${v}°`, gone: gone.includes(v) }))} disabled={disabled} onPick={judge} />;
    }

    // ---- 手順カード ----
    function StepCards({ steps, now }) {

    // ---- 0から かぞえる アニメーション（ヒント）----
    // cx,cy：分度器の 中心。start：0の 向き。dir：+1 反時計回り／−1 時計回り
    function CountArc({ cx, cy, R, start, dir = 1, value, step = 10, color = '#f97316' }) {
      const seq = useMemo(() => {
        const a = []; for (let v = 10; v <= value; v += 10) a.push(v);
        let last = a.length ? a[a.length - 1] : 0;
        if (value % 10) { if (step === 5 || value % 5 === 0) { a.push(value); } else { for (let v = last + 1; v <= value; v++) a.push(v); } }
        return a.length ? a : [value];
      }, [value, step]);
      const t = useTicker(seq.length * 520 + 900, { key: `${value}-${start}-${dir}` });
      const i = Math.min(seq.length - 1, Math.floor(t * (seq.length + 1.7)));
      const cur = seq[Math.max(0, i)];
      const [lx, ly] = P(cx, cy, R + 34, start + dir * cur);
      return (
        <g pointerEvents="none">
          <path d={arcD(cx, cy, R + 8, start, dir * cur)} fill="none" stroke={color} strokeWidth="9" strokeLinecap="round" opacity=".85" />
          <circle cx={lx} cy={ly} r="25" fill={color} />
          <text x={lx} y={ly} textAnchor="middle" dominantBaseline="central" fontSize="22" fontWeight="900" fill="#fff">{cur}</text>
        </g>
      );
    }
    // ---- 拡大鏡 ----
    let MAG_ID = 0;
    function Magnifier({ fx, fy, lx, ly, r = 78, k = 2.6, children }) {

          <clipPath id={id}><circle cx={lx} cy={ly} r={r} /></clipPath>
          <circle cx={lx} cy={ly} r={r} fill="#fffdf7" />
          <g clipPath={`url(#${id})`}><g transform={`translate(${lx} ${ly}) scale(${k}) translate(${-fx} ${-fy})`}>{children}</g></g>
          <circle cx={lx} cy={ly} r={r} fill="none" stroke="#f59e0b" strokeWidth="7" />
          <text x={lx + r * 0.7} y={ly + r * 0.85} fontSize="30">🔍</text>

    // ---- トッピングを えらぶ ----
    function ToppingPicker({ toppings, onPick, picked, seed = 'run' }) {

        <div className="card fadein kids" style={{ borderColor: '#fda4af', background: '#fff1f2' }}>
          <div className="row" style={{ alignItems: 'center' }}>
            <div className={picked ? 'pop' : ''} key={toppings.length}><Pizza size={120} toppings={toppings} seed={seed} /></div>
            <div className="grow bold" style={{ fontSize: '1.35rem', lineHeight: 1.8 }}>
              {picked ? <R t={`${TOP_MAP[picked].name}を のせたよ！`} /> : <R t={'ごほうび！\nトッピングを 1つ えらんでね。'} />}
            </div>
          </div>
          {!picked && (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '.4rem', marginTop: '.5rem' }}>
              {TOPPINGS.map(t => (
                <button key={t.id} className="btn3d c-white" style={{ flexDirection: 'column', padding: '.35rem .2rem', fontSize: '.95rem', gap: 0 }} onClick={() => onPick(t.id)}>
                  <ToppingIcon id={t.id} size={42} />
                  <span>{t.name}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* =========================================================
       問題の 画面（どの 問題も この わくで 動く）
       ========================================================= */
    function PlayLayout({ host, svgRef, work, panel, steps, overlay, onPointerDown, viewBox = '0 0 800 520' }) {
      const h = host;
      const nHints = h.phase.hints ? h.phase.hints.length : 0;
      return (
        <div className="play">
          <div className="work">
            <div className="qhead">
              <span>{h.stage.special ? 'とくべつ' : `ステージ${h.stage.no}`}</span>
              <span style={{ color: '#c2410c' }}>{h.idx + 1}もんめ</span>
              <span className="grow" />
              <ProgressDots toppings={h.toppings} idx={h.idx} />
            </div>
            {steps}
            <svg ref={svgRef} className="ws" viewBox={viewBox} onPointerDown={onPointerDown} preserveAspectRatio="xMidYMid meet">{work}</svg>
            {overlay}
          </div>
          <div className="panel">
            <div className="row" style={{ alignItems: 'flex-start', gap: '1rem' }}>
              <div style={{ cursor: 'pointer' }} onClick={h.onReplay}><WaniSensei size={92} mood={h.mood} talking={h.talking} /></div>
              <div className="bubble grow" style={{ minHeight: '5rem' }}>
                <R t={h.phase.prompt} />
                {h.fb && (
                  <div key={h.fb.key} className={h.fb.kind === 'ng' ? 'shake' : 'fadein'} style={{
                    marginTop: '.4rem', paddingTop: '.4rem', borderTop: '3px dashed #e2e8f0', fontSize: '1.3rem',
                    color: h.fb.kind === 'ng' ? '#c2410c' : h.fb.kind === 'ok' ? '#be185d' : h.fb.kind === 'hint' ? '#a16207' : '#15803d',
                  }}>
                    {h.fb.kind === 'hint' ? '💡 ' : h.fb.kind === 'ok' ? '🎉 ' : ''}<R t={h.fb.text} />
                  </div>
                )}
              </div>
            </div>
            {h.status === 'ok' ? (
              <div className="col">
                <ToppingPicker toppings={h.picked ? [...h.toppings.slice(0, h.idx), h.picked] : h.toppings.slice(0, h.idx)} seed={h.seed} picked={h.picked} onPick={h.onPick} />
                {h.picked && (
                  <Btn color={h.isLast ? 'orange' : 'green'} size="xl" className="pop" onClick={h.onNext}>
                    {h.isLast ? <R t="ピザを やく 🔥" /> : <R t="つぎの もんだいへ ▶" />}
                  </Btn>
                )}
              </div>
            ) : (
              <>
                {panel}
                <div className="row wrapflex" style={{ marginTop: 'auto' }}>
                  <Btn color="amber" size="md" className={h.hintGlow ? 'glow' : ''} disabled={!nHints || h.hint >= nHints} onClick={h.onHint}>
                    💡 ヒント <span style={{ letterSpacing: '.1em' }}>{Array.from({ length: Math.max(nHints, 1) }, (_, i) => i < h.hint ? '●' : '○').join('')}</span>
                  </Btn>
                  <Btn color="white" size="md" onClick={h.onReplay}>🔊 もういちど</Btn>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function ProblemHost({ app, stage, idx, def, toppings, seed, onPicked, onNext, isLast }) {
      const s = app.state.settings;
      const p = useMemo(() => def.make(s), []);
      if (location.protocol === 'file:') window.__lastP = { p, kind: def.kind }; // 動作確認用
      const [phase, setPhaseState] = useState({ prompt: '', hints: [] });
      const [hint, setHint] = useState(0);
      const [fb, setFb] = useState(null);
      const [mood, setMood] = useState('normal');
      const [talking, setTalking] = useState(false);
      const [status, setStatus] = useState('play');
      const [picked, setPicked] = useState(null);
      const [hintGlow, setHintGlow] = useState(false);
      const R_ = useRef({ answers: [], errors: [], mistakes: 0, maxHint: 0, start: Date.now(), done: false, phaseMiss: 0, hints: [], prompt: '', alive: true });
      const speak = async (markup, force = false) => {
        if (!markup) return;
        setTalking(true);
        await TTS.speak(markup, { force });
        if (R_.current.alive) setTalking(false);
      };
      const saveRecord = (done) => {
        const r = R_.current;
        const entry = {
          at: Date.now(), stageId: stage.id, no: idx + 1, kind: def.kind, label: def.label + (p.v != null ? ` ${p.v}°` : ''),
          correct: (def.correct ? def.correct(p) : '') || (p.v != null ? `${p.v}°` : ''), answers: r.answers.slice(0, 30), result: done ? (r.mistakes ? `正解（${r.mistakes + 1}回目）` : '1回で正解') : 'とちゅうでやめた',
          mistakes: r.mistakes, hints: r.maxHint, sec: Math.round((Date.now() - r.start) / 1000), errors: r.errors.slice(0, 30),
          step: s.scaleStep, mode: s.answerMode, done,
        };
        DB.add('history', entry).then(() => Sync.run(app)).catch(e => console.warn(e));
      };
      useEffect(() => () => {
        R_.current.alive = false;
        TTS.cancel();
        if (!R_.current.done && R_.current.answers.length) saveRecord(false);
      }, []);
      const api = useMemo(() => ({
        phase: ({ prompt, hints = [] }) => {
          R_.current.phaseMiss = 0; R_.current.hints = hints; R_.current.prompt = prompt;
          setPhaseState({ prompt, hints }); setHint(0); setFb(null); setMood('normal'); setHintGlow(false);
          speak(prompt);
        },
        say: (text, kind = 'info') => { setFb({ text, kind, key: Date.now() }); setMood('happy'); speak(text); },
        note: (txt) => { R_.current.answers.push(txt); },
        ng: (txt, err, msg) => {
          const r = R_.current;
          if (r.done) return;
          r.answers.push(txt); r.mistakes++; r.phaseMiss++; if (err) r.errors.push(err);
          sfx('ng');
          setMood('think');
          setFb({ text: msg || MSG.again, kind: 'ng', key: Date.now() });
          if (r.phaseMiss >= 2) setHintGlow(true);
          if (r.phaseMiss >= 3 && r.hints.length) { const lv = r.hints.length; r.maxHint = Math.max(r.maxHint, lv); setHint(lv); }
          speak(msg || MSG.again);
        },
        ok: (txt, extra) => {
          const r = R_.current;
          if (r.done) return;
          r.done = true; r.answers.push(txt);
          saveRecord(true);
          sfx('ok');
          const praise = pick(PRAISE) + (extra ? '\n' + extra : '');
          setStatus('ok'); setMood('happy'); setFb({ text: praise, kind: 'ok', key: Date.now() });
          speak(praise);
        },
      }), []);
      const host = {
        stage, idx, phase, fb, hint, mood, talking, status, picked, toppings, seed, isLast, hintGlow,
        onHint: () => {
          const r = R_.current;
          const lv = Math.min(r.hints.length, hint + 1);
          r.maxHint = Math.max(r.maxHint, lv);
          setHint(lv); setHintGlow(false);
          setFb({ text: r.hints[lv - 1], kind: 'hint', key: Date.now() });
          speak(r.hints[lv - 1]);
        },
        onReplay: () => speak(fb ? `${phase.prompt}\n${fb.text}` : phase.prompt, true),
        onPick: (id) => { sfx('topping'); setPicked(id); onPicked(id); speak(`${TOP_MAP[id].name}を のせたよ！`); },
        onNext: () => { TTS.cancel(); onNext(); },
      };
      const Comp = def.Comp;
      return <Comp p={p} s={s} hint={hint} api={api} done={status === 'ok'} host={host} />;
    }

    function PlayScreen({ app, stage, onClear }) {
      const run0 = app.state.runs[stage.id];
      const [viewIdx, setViewIdx] = useState(run0 ? clamp(run0.idx, 0, PROBLEMS_PER_STAGE - 1) : 0);
      const [tops, setTops] = useState(run0 ? (run0.toppings || []).slice(0, run0.idx) : []);
      const seedRef = useRef(run0 && run0.seed ? run0.seed : 'pz' + Date.now().toString(36));
      const pizzaRef = useRef(null);
      useEffect(() => {
        if (!app.stateRef.current.runs[stage.id]) app.update(st => ({ ...st, runs: { ...st.runs, [stage.id]: { idx: 0, toppings: [], seed: seedRef.current, at: Date.now() } } }));
      }, []);
      const onPicked = (id) => {
        const next = [...tops.slice(0, viewIdx), id];
        setTops(next);
        if (viewIdx + 1 >= PROBLEMS_PER_STAGE) {
          const pizza = { id: seedRef.current, stageId: stage.id, toppings: next, at: Date.now() };
          pizzaRef.current = pizza;
          app.update(st => {
            const pr = st.progress[stage.id] || {};
            const runs = { ...st.runs }; delete runs[stage.id];
            return { ...st, pizzas: [pizza, ...st.pizzas], runs, progress: { ...st.progress, [stage.id]: { ...pr, cleared: true, plays: (pr.plays || 0) + 1, firstClearAt: pr.firstClearAt || Date.now(), lastAt: Date.now() } } };
          });
        } else {
          app.update(st => ({ ...st, runs: { ...st.runs, [stage.id]: { ...(st.runs[stage.id] || {}), seed: seedRef.current, idx: viewIdx + 1, toppings: next, at: Date.now() } } }));
        }
      };
      const onNext = () => {
        if (viewIdx + 1 >= PROBLEMS_PER_STAGE) { onClear(pizzaRef.current); return; }
        setViewIdx(v => v + 1);
        window.scrollTo(0, 0);
      };
      const def = stage.problems[viewIdx];
      return (
        <ProblemHost key={`${stage.id}-${viewIdx}`} app={app} stage={stage} idx={viewIdx} def={def} toppings={tops} seed={seedRef.current}
                     onPicked={onPicked} onNext={onNext} isLast={viewIdx + 1 >= PROBLEMS_PER_STAGE} />
      );
    }

    /* =========================================================
       問題の 部品（ステージ0〜3）
       ========================================================= */
    // ---- タップして 見つける ----
    function hitTarget(t, q) {
      if (t.hit) return t.hit(q);
      return t.type === 'seg' ? segDist(q.x, q.y, t.x1, t.y1, t.x2, t.y2) <= (t.w || 28) : dist(q.x, q.y, t.x, t.y) <= (t.r || 44);
    }
    function TargetMark({ t }) {
      if (t.mark) return t.mark();
      if (t.type === 'seg') {
        const mx = (t.x1 + t.x2) / 2, my = (t.y1 + t.y2) / 2;
        return <g pointerEvents="none"><line x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2} stroke="#22c55e" strokeWidth="12" strokeLinecap="round" opacity=".75" /><circle cx={mx} cy={my} r="18" fill="#22c55e" /><path d={`M ${mx - 8} ${my} l 5 6 l 10 -12`} fill="none" stroke="#fff" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" /></g>;
      }
      return <g pointerEvents="none"><circle cx={t.x} cy={t.y} r="24" fill="rgba(34,197,94,.25)" stroke="#22c55e" strokeWidth="5" /><path d={`M ${t.x - 10} ${t.y} l 6 7 l 13 -15`} fill="none" stroke="#15803d" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" /></g>;
    }
    function TargetHint({ t, level }) {
      if (t.hintDraw) return t.hintDraw(level);
      if (t.type === 'seg') return <line pointerEvents="none" x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2} stroke="#fbbf24" strokeWidth={level >= 3 ? 16 : 10} strokeLinecap="round" opacity=".6" className="pulse" strokeDasharray={level >= 3 ? undefined : '14 10'} />;
      if (level >= 3) return <g pointerEvents="none" className="pulse"><circle cx={t.x} cy={t.y} r="30" fill="none" stroke="#f59e0b" strokeWidth="6" /><path d={`M ${t.x - 70} ${t.y - 70} L ${t.x - 30} ${t.y - 30} M ${t.x - 30} ${t.y - 30} l 0 -18 M ${t.x - 30} ${t.y - 30} l -18 0`} stroke="#f59e0b" strokeWidth="7" strokeLinecap="round" /></g>;
      return <circle pointerEvents="none" cx={t.x} cy={t.y} r="80" fill="rgba(251,191,36,.18)" stroke="#fbbf24" strokeWidth="4" strokeDasharray="10 8" className="pulse" />;
    }
    function MissMark({ m }) {
      if (!m) return null;
      return <g key={m.k} pointerEvents="none" className="fadein"><circle cx={m.x} cy={m.y} r="18" fill="none" stroke="#f97316" strokeWidth="4" /><path d={`M ${m.x - 7} ${m.y - 7} l 14 14 M ${m.x + 7} ${m.y - 7} l -14 14`} stroke="#f97316" strokeWidth="4" strokeLinecap="round" /></g>;
    }
    // parts：[{ prompt, hints, targets:[{ id, type, ... }], wrong(q) => { text, err, msg } }]
    function TapTask({ host, api, done, hint, parts, draw, okText, okMsg }) {
      const ref = useRef(null);
      const [pi, setPi] = useState(0);
      const [found, setFound] = useState([]);
      const [prev, setPrev] = useState([]);
      const [miss, setMiss] = useState(null);
      const part = parts[pi];
      useEffect(() => { api.phase({ prompt: part.prompt, hints: part.hints }); }, [pi]);
      const down = e => {
        if (done) return;
        const q = svgPoint(ref.current, e);
        if (part.targets.some(t => found.includes(t.id) && hitTarget(t, q))) return;
        const t = part.targets.find(t => !found.includes(t.id) && hitTarget(t, q));
        if (t) {
          sfx('snap'); setMiss(null);
          const nf = [...found, t.id];
          if (nf.length >= part.targets.length) {
            setPrev(a => [...a, ...part.targets]); setFound([]);
            if (pi + 1 < parts.length) { api.note(part.noteText || 'OK'); setPi(pi + 1); }
            else api.ok(okText, okMsg);
          } else {
            setFound(nf);
            const left = part.targets.length - nf.length;
            api.say(`そう！ あと ${left}つ。`);
          }
          return;
        }
        const w = part.wrong ? part.wrong(q) : null;
        setMiss({ x: q.x, y: q.y, k: Date.now() });
        api.ng(w ? w.text : 'ちがう場所', w ? w.err : 'part', w ? w.msg : 'そこでは ないよ。もう いちど さがして みよう。');
      };
      const marks = [...prev, ...part.targets.filter(t => found.includes(t.id))];
      return (
        <PlayLayout host={host} svgRef={ref} onPointerDown={down} work={<>
          {draw({ pi, found, done, hint })}
          {!done && hint >= 2 && part.targets.filter(t => !found.includes(t.id)).map(t => <TargetHint key={'h' + t.id} t={t} level={hint} />)}
          {marks.map(t => <TargetMark key={'m' + t.id} t={t} />)}
          {!done && <MissMark m={miss} />}
        </>} />
      );
    }

    // ---- 絵の カードを えらぶ ----
    // cards：[{ id, label, x, y, w, h, draw(done) }]。order を わたすと その じゅんに タップする
    function PickTask({ host, api, done, hint, prompt, hints, cards, correctId, order, wrong, hintDraw, okMsg }) {
      const ref = useRef(null);
      const [gone, setGone] = useState([]);
      const [seq, setSeq] = useState([]);
      const [shake, setShake] = useState(null);
      useEffect(() => { api.phase({ prompt, hints }); }, []);
      const down = e => {
        if (done) return;
        const q = svgPoint(ref.current, e);
        const c = cards.find(c => q.x >= c.x && q.x <= c.x + c.w && q.y >= c.y && q.y <= c.y + c.h);
        if (!c || gone.includes(c.id) || seq.includes(c.id)) return;
        if (order) {
          const want = order[seq.length];
          if (c.id === want) {
            sfx('snap');
            const ns = [...seq, c.id]; setSeq(ns);
            if (ns.length === order.length) api.ok(ns.map(id => cards.find(x => x.id === id).label).join('→'), okMsg);
            else api.say(ns.length === 1 ? 'そう！ つぎに [大|おお]きいのは どれかな？' : 'そう！ さいごは どれかな？');
          } else {
            setShake(c.id + Date.now());
            const w = wrong ? wrong(c.id, seq) : {};
            api.ng(c.label, w.err || 'other', w.msg || 'もっと [大|おお]きい [角|かく]が あるよ。');
          }
          return;
        }
        if (c.id === correctId) { sfx('snap'); setSeq([c.id]); api.ok(c.label, okMsg); }
        else {
          setGone(g => [...g, c.id]);
          const w = wrong ? wrong(c.id) : {};
          api.ng(c.label, w.err || 'other', w.msg || MSG.again);
        }
      };
      return (
        <PlayLayout host={host} svgRef={ref} onPointerDown={down} work={<>
          {cards.map(c => {
            const isOk = seq.includes(c.id);
            const n = order ? seq.indexOf(c.id) : -1;
            return (
              <g key={c.id} opacity={gone.includes(c.id) ? 0.35 : 1} style={{ cursor: 'pointer' }}>
                <rect x={c.x} y={c.y} width={c.w} height={c.h} rx="22" fill="#fff" stroke={isOk ? '#22c55e' : '#fed7aa'} strokeWidth={isOk ? 7 : 4} />
                {c.draw(done)}
                <circle cx={c.x + 34} cy={c.y + 34} r="24" fill={isOk ? '#22c55e' : '#fb923c'} />
                <text x={c.x + 34} y={c.y + 35} textAnchor="middle" dominantBaseline="central" fontSize="28" fontWeight="900" fill="#fff">{c.label}</text>
                {n >= 0 && <g className="pop"><circle cx={c.x + c.w - 36} cy={c.y + 36} r="26" fill="#f43f5e" /><text x={c.x + c.w - 36} y={c.y + 37} textAnchor="middle" dominantBaseline="central" fontSize="28" fontWeight="900" fill="#fff">{n + 1}</text></g>}
              </g>
            );
          })}
          {hintDraw && !done && hint >= 2 && hintDraw(hint, seq)}
        </>} />
      );
    }

    // ---- ワニの 口を ひらく ----
    // check(open) → { ok, err, msg }
    function MouthTask({ host, api, done, hint, s, prompt, hints, start = 20, step = 5, max = 180, hx = 300, hy = 420, len = 260, check, back, front, okText, okMsg, steps, label, onOk }) {
      const ref = useRef(null);
      const [open, setOpen] = useState(start);
      const [shown, setShown] = useState(false);
      useEffect(() => { api.phase({ prompt, hints }); }, []);
      const set = v => setOpen(clamp(Math.round(v / step) * step, 0, max));
      const down = e => {
        if (done) return;
        const svg = ref.current;
        const fromPt = q => { let a = angOf(q.x - hx, q.y - hy); if (a > 270) a = 0; else if (a > max) a = max; set(a); };
        fromPt(svgPoint(svg, e));
        beginDrag(e, svg, { move: fromPt });
      };
      const submit = () => {
        const r = check(open);
        if (r.ok) { setShown(true); onOk && onOk(open); api.ok(okText ? okText(open) : `${open}°`, okMsg); }
        else api.ng(`口${open}°`, r.err, r.msg);
      };
      return (
        <PlayLayout host={host} svgRef={ref} onPointerDown={down} steps={steps} work={<>
          {back && back(open, hint, done)}
          <WaniMouth x={hx} y={hy} open={open} len={len} label={label ? label(open, done) : undefined} />
          {front && front(open, hint, done)}
          {!done && <text x="780" y="505" textAnchor="end" fontSize="20" fill="#94a3b8" fontWeight="700">ゆびで うごかせるよ ☝</text>}
        </>} panel={(
          <div className="col">
            {s.moveButtons && (
              <div className="row center">
                <HoldBtn size="lg" label="とじる" onStep={() => setOpen(o => clamp(o - step, 0, max))} disabled={done}>◀ <R t="とじる" /></HoldBtn>
                <HoldBtn size="lg" label="ひらく" onStep={() => setOpen(o => clamp(o + step, 0, max))} disabled={done}><R t="ひらく" /> ▶</HoldBtn>
              </div>
            )}
            <Btn color="green" size="xl" disabled={done} onClick={submit}>できた！</Btn>
          </div>
        )} />
      );
    }

    // ---- 3つ（か 4つ）から えらぶ（絵は 作業の ところに）----
    function ChoiceTask({ host, api, done, hint, prompt, hints, draw, options, correct, wrong, cols, okMsg, big = true }) {
      const ref = useRef(null);
      const [gone, setGone] = useState([]);
      useEffect(() => { api.phase({ prompt, hints }); }, []);
      return (
        <PlayLayout host={host} svgRef={ref} work={draw(hint, done)} panel={(
          <Choices options={options.map(o => ({ ...o, gone: gone.includes(o.value) }))} cols={cols} big={big} disabled={done} onPick={v => {
            const o = options.find(x => x.value === v);
            if (v === correct) api.ok(stripMarkup(o.label).replace(/\n/g, ''), okMsg);
            else { setGone(g => [...g, v]); const w = wrong ? wrong(v) : {}; api.ng(stripMarkup(o.label).replace(/\n/g, ''), w.err || 'other', w.msg || MSG.again); }
          }} />
        )} />
      );
    }

    // ---- 点線の 直角（ヒント）----
    function RightRef({ x, y, a1 = 0, len = 200, sweep = 90 }) {
      const [x2, y2] = P(x, y, len, a1 + sweep);
      return <g pointerEvents="none"><line x1={x} y1={y} x2={x2} y2={y2} stroke="#e11d48" strokeWidth="4" strokeDasharray="12 9" /><RightMark x={x} y={y} a1={a1} size={30} sweep={sweep} /></g>;
    }

    /* ---------- ステージ0：かどを みつけよう ---------- */
    const SLICE_POS = [
      { vx: 190, vy: 400, a1: 12 }, { vx: 610, vy: 140, a1: 194 }, { vx: 400, vy: 490, a1: 66 }, { vx: 400, vy: 40, a1: 248 },
    ];
    function makeSlice() { const o = pick(SLICE_POS); return { ...o, a1: o.a1 + randInt(-4, 4), sweep: randInt(40, 52), r: 330 }; }
    function sliceWrong(p, msgIn) {
      return q => {
        const d = dist(q.x, q.y, p.vx, p.vy);
        if (d > p.r * 0.86 && d < p.r * 1.12) return { text: 'ピザのみみ', err: 'part', msg: 'そこは ピザの みみ（まるい ところ）だよ。' + msgIn };
        return { text: 'ちがう場所', err: 'part', msg: msgIn };
      };
    }
    function S0Vertex({ p, ...k }) {

    function S1Mouth(props) {

        check={o => o === 90 ? { ok: true } : o < 90 ? { err: 'right', msg: 'まだ [直角|ちょっかく]より [小|ちい]さいよ。もう すこし ひらこう。' } : { err: 'right', msg: '[直角|ちょっかく]より [大|おお]きく なって いるよ。すこし とじよう。' }}

    /* ---------- ステージ2：どっちが 大きい？ ---------- */
    // カードの まんなかに おさまる 頂点の x
    function fitVX(cardX, cardW, r, a1, sweep) {

    /* ---------- ステージ3：ワニの口は まわる大きさ ---------- */

    const TURN_INFO = {

    function S3Mouth(props) {
