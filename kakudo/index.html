        okText={o => `口${o}°`} okMsg="まっすぐ！ 180°だね。"
        front={(o, hint, done) => <>
          {(done || hint >= 3) && <><RightMark x={330} y={420} a1={0} size={40} /><RightMark x={330} y={420} a1={90} size={40} /></>}
          {!done && hint >= 2 && <line x1="330" y1="420" x2="40" y2="420" stroke="#e11d48" strokeWidth="6" strokeDasharray="14 10" pointerEvents="none" />}
        </>} />;
    }

    /* =========================================================
       問題の 部品（ステージ4〜8・とくべつ）
       ========================================================= */
    // 分度器で 読む 角の かたち
    // rot：分度器の 向き。zero：0の 線が 内側('inner')か 外側('outer')か。v：角度
    function readGeom(rot, zero, v) {
      const z = zero === 'inner' ? rot : rot + 180;
      const o = zero === 'inner' ? rot + v : rot + 180 - v;
      return { z, o, r1: zero === 'inner' ? z : o };
    }
    function ReadScene({ cx, cy, R, rot, zero, v, step, show = 'both', hl = null }) {
      const g = readGeom(rot, zero, v);
      return (
        <g>
          <AngleFig x={cx} y={cy} a1={g.r1} sweep={v} len={R + 72} arc={34} w={5} color="#1e3a8a" dot={false} />
          <Protractor x={cx} y={cy} rot={rot} R={R} step={step} show={show} hl={hl} />
          <circle cx={cx} cy={cy} r="6" fill="#1e3a8a" />
        </g>
      );
    }
    const READ_HINTS = [
      '0の [線|せん]と かさなって いる [辺|へん]を さがそう。そこの 0から かぞえるよ。',
      '[色|いろ]の ついた [目盛|めも]りを [読|よ]もう。',
      '0から 10、20、30… と かぞえて みよう。',
    ];
    // 読むときの おたすけ（点線の直角・0から かぞえる・拡大鏡）
    function ReadAssist({ cx, cy, R, rot, zero, v, step, hint, forced = {}, s, est, scene }) {
      const g = readGeom(rot, zero, v);
      const showRight = (est && hint >= 2) || forced.right;
      const showCount = !est && hint >= 3;
      const showMag = !est && (hint >= 3 || forced.mag || s.magnifier);
      const [fx, fy] = P(cx, cy, R - 48, g.o);
      const lx = fx < 400 ? 690 : 110, ly = 112;
      return (
        <g pointerEvents="none">
          {showRight && (zero === 'inner' ? <RightRef x={cx} y={cy} a1={rot} len={R + 40} /> : <RightRef x={cx} y={cy} a1={rot + 180} sweep={-90} len={R + 40} />)}
          {showCount && <CountArc cx={cx} cy={cy} R={R} start={g.z} dir={zero === 'inner' ? 1 : -1} value={v} step={step} />}
          {showMag && <Magnifier fx={fx} fy={fy} lx={lx} ly={ly}>{scene}</Magnifier>}
        </g>
      );
    }
    const errForce = (f, e) => ({ ...f, color: f.color || e === 'inout', mag: f.mag || e === 'near', right: f.right || e === 'right' || e === 'other' });

    /* ---------- ステージ4：分度器と なかよし ---------- */
    const S4 = { cx: 400, cy: 455, R: 250 };
    const S4_NAMES = { center: '中心', zero: '0°の線', outer0: '外側の0', inner0: '内側の0', ninety: '90°の目盛り' };
    function S4Find({ p, s, ...k }) {
      const { cx, cy, R } = S4;
      const o0 = P(cx, cy, R - 36, 180), i0 = P(cx, cy, R - 64, 0), o180 = P(cx, cy, R - 36, 0), i180 = P(cx, cy, R - 64, 180);
      const T = {
        center: {
          prompt: '[分度器|ぶんどき]の [中心|ちゅうしん]を タップしよう。',
          hints: ['[中心|ちゅうしん]は 0の [線|せん]の まんなかに ある しるしだよ。', '[下|した]の まっすぐな [線|せん]の まんなかを [見|み]て みよう。', '→ の さきを タップしよう。'],
          targets: [{ id: 'c', type: 'pt', x: cx, y: cy, r: 32 }],
          wrong: () => ({ text: 'ちがう場所', err: 'part', msg: '[中心|ちゅうしん]は 0の [線|せん]の まんなかに ある しるしだよ。' }),
          hl: null,
        },
        zero: {
          prompt: '[分度器|ぶんどき]の 0の [線|せん]を タップしよう。',
          hints: ['0の [線|せん]は [分度器|ぶんどき]の [下|した]の まっすぐな [線|せん]だよ。', '[右|みぎ]と [左|ひだり]の 0を むすぶ [線|せん]だよ。', 'きいろの [線|せん]を タップしよう。'],
          targets: [{ id: 'z', type: 'seg', x1: cx - R, y1: cy, x2: cx + R, y2: cy, w: 22 }],
          wrong: () => ({ text: 'ちがう場所', err: 'part', msg: '0の [線|せん]は [分度器|ぶんどき]の [下|した]の まっすぐな [線|せん]だよ。' }),
          hl: null,
        },
        outer0: {
          prompt: '[外側|そとがわ]の [目盛|めも]りの 0を タップしよう。',
          hints: ['[外側|そとがわ]は、まるい ふちに ちかい ほうの [数字|すうじ]だよ。', '[色|いろ]の ついた [数字|すうじ]の 0を さがそう。', '→ の さきを タップしよう。'],
          targets: [{ id: 'o', type: 'pt', x: o0[0], y: o0[1], r: 26 }],
          wrong: q => dist(q.x, q.y, i0[0], i0[1]) < 30 ? { text: '内側の0', err: 'inout', msg: 'それは [内側|うちがわ]の 0だよ。[外側|そとがわ]の 0を さがそう。' }
            : dist(q.x, q.y, i180[0], i180[1]) < 30 ? { text: '内側の180', err: 'inout', msg: 'それは [内側|うちがわ]の 180だよ。' }
            : { text: 'ちがう場所', err: 'other', msg: '[外側|そとがわ]の [数字|すうじ]の 0を さがそう。' },
          hl: 'outer',
        },
        inner0: {
          prompt: '[内側|うちがわ]の [目盛|めも]りの 0を タップしよう。',
          hints: ['[内側|うちがわ]は、[中心|ちゅうしん]に ちかい ほうの [数字|すうじ]だよ。', '[色|いろ]の ついた [数字|すうじ]の 0を さがそう。', '→ の さきを タップしよう。'],
          targets: [{ id: 'i', type: 'pt', x: i0[0], y: i0[1], r: 24 }],
          wrong: q => dist(q.x, q.y, o0[0], o0[1]) < 30 ? { text: '外側の0', err: 'inout', msg: 'それは [外側|そとがわ]の 0だよ。[内側|うちがわ]の 0を さがそう。' }
            : dist(q.x, q.y, o180[0], o180[1]) < 30 ? { text: '外側の180', err: 'inout', msg: 'それは [外側|そとがわ]の 180だよ。' }
            : { text: 'ちがう場所', err: 'other', msg: '[内側|うちがわ]の [数字|すうじ]の 0を さがそう。' },
          hl: 'inner',
        },
        ninety: {
          prompt: '90°の [目盛|めも]りを タップしよう。',
          hints: ['90°は [直角|ちょっかく]。まんなかに あるよ。', 'いちばん [上|うえ]を [見|み]て みよう。', '→ の さきを タップしよう。'],
          targets: [{ id: 'n', type: 'pt', ...(() => { const [x, y] = P(cx, cy, R - 46, 90); return { x, y }; })(), r: 40, hit: q => Math.abs(sdiff(angOf(q.x - cx, q.y - cy), 90)) <= 4.5 && dist(q.x, q.y, cx, cy) > R - 110 && dist(q.x, q.y, cx, cy) < R + 30 }],
          wrong: () => ({ text: 'ちがう場所', err: 'other', msg: '90は まんなかの いちばん [上|うえ]に あるよ。' }),
          hl: null,
        },
      }[p.kind];
      return <TapTask {...k} okText={S4_NAMES[p.kind]}
        draw={({ hint, done }) => <Protractor x={cx} y={cy} R={R} step={s.scaleStep} hl={(hint >= 2 || done) ? T.hl : null} />}
        parts={[T]} />;
    }

    /* ---------- ステージ5：目盛りを よもう ---------- */
    function S5Read({ p, s, host, api, done, hint }) {
      const ref = useRef(null);
      const [forced, setForced] = useState({});
      const [ph, setPh] = useState('est');
      const cfg = { cx: 400, cy: p.cy, R: p.R, rot: p.rot, zero: p.zero, v: p.v, step: s.scaleStep };
      const hl = (p.color || forced.color || (ph === 'read' && hint >= 2)) ? p.zero : null;
      const scene = <ReadScene {...cfg} show={p.show} hl={hl} />;
      return (
        <PlayLayout host={host} svgRef={ref}
          work={<>{scene}<ReadAssist {...cfg} hint={hint} forced={forced} s={s} est={ph === 'est'} scene={scene} />{done && <text x="780" y="40" textAnchor="end" fontSize="40" fontWeight="900" fill="#e11d48">{p.v}°</text>}</>}
          panel={<DegreeAnswer value={p.v} s={s} api={api} disabled={done} onPhase={setPh}
            prompt={'この [角|かく]は [何度|なんど]かな？\n[分度器|ぶんどき]で [読|よ]もう。'} hints={READ_HINTS}
            onErr={e => setForced(f => errForce(f, e))}
            onCorrect={ans => api.ok(`${ans}°`)} />} />
      );
    }

    /* ---------- ステージ6：はかってみよう ---------- */
    const SNAP = { strong: { d: 46, a: 14 }, weak: { d: 18, a: 5 }, off: { d: 0, a: 0 } };
    function useProtractorCtl({ svgRef, init, vx, vy, phis, s, canMove = true, canRotate = true, active = true }) {
      const [pos, setPosState] = useState(init);
      const posRef = useRef(init);
      const setPos = np => { posRef.current = np; setPosState(np); };
      const cfg = SNAP[s.snap] || SNAP.strong;
      const isC = q => dist(q.x, q.y, vx, vy) <= 8;
      const isA = q => phis.some(ph => Math.abs(sdiff(q.rot, ph)) <= 2.5);
      const update = (np, c) => {
        let { x, y, rot } = np;
        if (canMove && c.d && dist(x, y, vx, vy) <= c.d) { x = vx; y = vy; }
        if (canRotate && c.a) for (const ph of phis) if (Math.abs(sdiff(rot, ph)) <= c.a) { rot = n360(ph); break; }
        const prev = posRef.current; const nx = { x, y, rot };
        if ((!isC(prev) && isC(nx)) || (!isA(prev) && isA(nx))) sfx('snap');
        setPos(nx);
      };
      const bodyDown = e => {
        if (!active || !canMove) return;
        e.stopPropagation();
        const svg = svgRef.current; const q0 = svgPoint(svg, e); const st = { ...posRef.current };
        beginDrag(e, svg, { move: q => update({ ...posRef.current, x: clamp(st.x + q.x - q0.x, 20, 780), y: clamp(st.y + q.y - q0.y, 30, 510) }, cfg) });
      };
      const knobDown = e => {
        if (!active || !canRotate) return;
        e.stopPropagation();
        const svg = svgRef.current; const q0 = svgPoint(svg, e);
        let last = angOf(q0.x - posRef.current.x, q0.y - posRef.current.y); let raw = posRef.current.rot;
        beginDrag(e, svg, { move: q => { const c = posRef.current; const a = angOf(q.x - c.x, q.y - c.y); raw += sdiff(a, last); last = a; update({ ...c, rot: n360(raw) }, cfg); } });
      };
      const nudge = (dx, dy, dr) => {
        if (!active) return;
        const p = posRef.current;
        const np = { x: clamp(p.x + dx, 20, 780), y: clamp(p.y + dy, 30, 510), rot: n360(p.rot + dr) };
        const closer = dist(np.x, np.y, vx, vy) < dist(p.x, p.y, vx, vy);
        const angCloser = phis.some(ph => Math.abs(sdiff(np.rot, ph)) < Math.abs(sdiff(p.rot, ph)));
        update(np, { d: closer && cfg.d ? 6 : 0, a: angCloser && cfg.a ? 1.5 : 0 });
      };
      const centerOK = isC(pos);
      const phi = phis.find(ph => Math.abs(sdiff(pos.rot, ph)) <= 2.5);
      const nearest = phis.reduce((b, ph) => Math.abs(sdiff(pos.rot, ph)) < Math.abs(sdiff(pos.rot, b)) ? ph : b, phis[0]);
      return { pos, setPos, bodyDown, knobDown, nudge, centerOK, zeroOK: phi != null, phi, nearest };
    }
    function ProtractorPad({ ctl, canMove = true, canRotate = true, disabled }) {
      const st = 3;
      return (
        <div className="row center wrapflex" style={{ gap: '1.2rem' }}>
          {canMove && (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 3.6rem)', gap: '.3rem' }}>
              <span /><HoldBtn label="うえ" disabled={disabled} onStep={() => ctl.nudge(0, -st, 0)}>▲</HoldBtn><span />
              <HoldBtn label="ひだり" disabled={disabled} onStep={() => ctl.nudge(-st, 0, 0)}>◀</HoldBtn><span style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '.8rem', color: '#64748b' }}>うごかす</span><HoldBtn label="みぎ" disabled={disabled} onStep={() => ctl.nudge(st, 0, 0)}>▶</HoldBtn>
              <span /><HoldBtn label="した" disabled={disabled} onStep={() => ctl.nudge(0, st, 0)}>▼</HoldBtn><span />
            </div>
          )}
          {canRotate && (
            <div className="col" style={{ gap: '.3rem', alignItems: 'center' }}>
              <HoldBtn label="ひだりまわり" color="orange" disabled={disabled} onStep={() => ctl.nudge(0, 0, 1)}>↺</HoldBtn>
              <span style={{ fontSize: '.8rem', color: '#64748b' }}>まわす</span>
              <HoldBtn label="みぎまわり" color="orange" disabled={disabled} onStep={() => ctl.nudge(0, 0, -1)}>↻</HoldBtn>
            </div>
          )}
        </div>
      );
    }
    const PLACE_STEPS = ['[中心|ちゅうしん]を [頂点|ちょうてん]に あわせる', '0の [線|せん]を [辺|へん]に かさねる', '0から かぞえて [読|よ]む'];
    function S6Measure({ p, s, host, api, done, hint }) {
      const ref = useRef(null);
      const R = 210;
      const [phase, setPhase] = useState('place');
      const [forced, setForced] = useState({});
      const [ph, setPh] = useState('est');
      const ctl = useProtractorCtl({ svgRef: ref, init: p.init, vx: p.vx, vy: p.vy, phis: p.phis, s, canMove: p.canMove, canRotate: p.canRotate, active: phase === 'place' && !done });
      const prompts = {
        move: '[分度器|ぶんどき]を うごかして、[中心|ちゅうしん]を [角|かく]の [頂点|ちょうてん]に あわせよう。',
        rotate: '[分度器|ぶんどき]を まわして、0の [線|せん]を [辺|へん]に かさねよう。\n（オレンジの つまみで まわせるよ）',
        both: '[分度器|ぶんどき]を [角|かく]に あわせよう。\nできたら「あわせた！」を おしてね。',
      };
      useEffect(() => {
        if (phase === 'place') api.phase({ prompt: prompts[p.task], hints: ['[分度器|ぶんどき]の [中心|ちゅうしん]を [頂点|ちょうてん]に、0の [線|せん]を [辺|へん]に かさねよう。', 'うすい [分度器|ぶんどき]と おなじ ところに うごかそう。', 'おたすけ！ [分度器|ぶんどき]を あわせたよ。'] });
      }, [phase]);
      useEffect(() => { if (phase === 'place' && hint >= 3) { ctl.setPos({ x: p.vx, y: p.vy, rot: n360(ctl.nearest) }); sfx('snap'); } }, [hint]);
      const submitPlace = () => {
        if (!ctl.centerOK) { setForced(f => ({ ...f, glowC: true })); api.ng('中心がずれている', 'center', MSG.center); return; }
        if (!ctl.zeroOK) { setForced(f => ({ ...f, glowZ: true })); api.ng('0の線がずれている', 'zero', MSG.zero); return; }
        sfx('snap'); ctl.setPos({ x: p.vx, y: p.vy, rot: n360(ctl.phi) }); api.note('分度器OK'); setPhase('read');
      };
      const rot = ctl.pos.rot;
      const zero = Math.abs(sdiff(rot, p.r1)) < 1 ? 'inner' : 'outer';
      const hl = phase === 'read' && (s.colorAssist || forced.color || hint >= 2) ? zero : null;
      const glow = phase !== 'place' ? null : (!ctl.centerOK && (hint >= 2 || forced.glowC)) ? 'center' : (!ctl.zeroOK && (hint >= 2 || forced.glowZ)) ? 'zero' : null;
      const scene = (
        <g>
          <AngleFig x={p.vx} y={p.vy} a1={p.r1} sweep={p.v} len={R + 80} arc={34} w={5} color="#1e3a8a" dot={false} />
          {phase === 'place' && hint >= 2 && <Protractor x={p.vx} y={p.vy} rot={ctl.nearest} R={R} step={s.scaleStep} ghost />}
          <Protractor x={ctl.pos.x} y={ctl.pos.y} rot={rot} R={R} step={s.scaleStep} hl={hl} glow={glow}
                      onBodyDown={phase === 'place' && p.canMove ? ctl.bodyDown : undefined} onKnobDown={ctl.knobDown} knob={phase === 'place' && p.canRotate && !done} />
          <circle cx={p.vx} cy={p.vy} r="7" fill="#1e3a8a" pointerEvents="none" />
        </g>
      );
      const cfg = { cx: p.vx, cy: p.vy, R, rot, zero, v: p.v, step: s.scaleStep };
      const now = phase === 'read' ? 2 : !ctl.centerOK ? 0 : !ctl.zeroOK ? 1 : 2;
      return (
        <PlayLayout host={host} svgRef={ref} steps={<StepCards steps={PLACE_STEPS} now={now} />}
          work={<>{scene}{phase === 'read' && <ReadAssist {...cfg} hint={hint} forced={forced} s={s} est={ph === 'est'} scene={scene} />}{done && <text x="780" y="40" textAnchor="end" fontSize="40" fontWeight="900" fill="#e11d48">{p.v}°</text>}</>}
          panel={phase === 'place' ? (
            <div className="col">
              {s.moveButtons && <ProtractorPad ctl={ctl} canMove={p.canMove} canRotate={p.canRotate} disabled={done} />}
              <Btn color="green" size="xl" disabled={done} onClick={submitPlace}>あわせた！</Btn>
            </div>
          ) : (
            <DegreeAnswer value={p.v} s={s} api={api} disabled={done} onPhase={setPh}
              prompt={'ぴったり！ [何度|なんど]かな？\n0から かぞえて [読|よ]もう。'} hints={READ_HINTS}
              onErr={e => setForced(f => errForce(f, e))} onCorrect={ans => api.ok(`${ans}°`)} />
          )} />
      );
    }

    /* ---------- ステージ7：角を つくろう ---------- */
    const CUSTOMERS = ['🐰', '🐻', '🐼', '🐸', '🐧', '🐱', '🐶', '🦊', '🐨', '🐯'];
    function OrderBubble({ x = 14, y = 12, v, who }) {
      return (
        <g pointerEvents="none">
          <rect x={x} y={y} width="290" height="100" rx="20" fill="#fff" stroke="#fda4af" strokeWidth="4" />
          <circle cx={x + 46} cy={y + 50} r="32" fill="#ffe4e6" />
          <text x={x + 46} y={y + 52} textAnchor="middle" dominantBaseline="central" fontSize="38">{who}</text>
          <text x={x + 90} y={y + 30} fontSize="20" fontWeight="700" fill="#9f1239">ちゅうもん！</text>
          <text x={x + 90} y={y + 76} fontSize="42" fontWeight="900" fill="#be123c">{v}°</text>
          <text x={x + 90 + String(v).length * 24 + 30} y={y + 76} fontSize="22" fontWeight="700" fill="#9f1239">の ピザ</text>
        </g>
      );
    }
    function S7Mouth({ p, s, ...k }) {
      const hx = 300, hy = 420, R = 230;
      return <MouthTask {...k} s={s} start={0} step={s.scaleStep} max={180} hx={hx} hy={hy}
        prompt={`ワニワニ[先生|せんせい]の [口|くち]を ${p.v}°に ひらこう。\nできたら「できた！」を おしてね。`}
        hints={['[下|した]あごが 0の [線|せん]に かさなって いるよ。[内側|うちがわ]の 0から かぞえよう。', '[色|いろ]の ついた [目盛|めも]りを [見|み]よう。', `0から かぞえて ${p.v}の ところまで ひらこう。`]}
        check={o => { const r = judgeReading(o, p.v, s.tolerance, s.scaleStep); return r.ok ? { ok: true } : { err: r.err, msg: MSG[r.err] }; }}
        okText={o => `${o}°`}
        front={(o, hint, done) => <>
          <Protractor x={hx} y={hy} R={R} step={s.scaleStep} hl={(s.colorAssist || hint >= 2) ? 'inner' : null} />
          <circle cx={hx} cy={hy} r="7" fill="#1e3a8a" pointerEvents="none" />
          {!done && hint >= 3 && <CountArc cx={hx} cy={hy} R={R} start={0} dir={1} value={p.v} step={s.scaleStep} />}
          <OrderBubble x={496} v={p.v} who={p.who} />
        </>} />;
    }
    function S7Make({ p, s, host, api, done, hint }) {
      const ref = useRef(null);
      const V = { x: 400, y: 420 }, R = 220;
      const baseDir = p.left ? 180 : 0;
      const tgtDir = p.left ? 180 - p.v : p.v;
      const zero = p.left ? 'outer' : 'inner';
      const [phase, setPhase] = useState(p.mode === 'full' ? 'place' : p.mode);
      const ctl = useProtractorCtl({ svgRef: ref, init: p.mode === 'full' ? p.init : { x: V.x, y: V.y, rot: 0 }, vx: V.x, vy: V.y, phis: [0], s, active: phase === 'place' && !done });
      const [dot, setDot] = useState(p.mode === 'line' ? tgtDir : null);
      const [line, setLine] = useState(null);
      const [drag, setDrag] = useState(null);
      const [forced, setForced] = useState({});
      const dotHints = [`[辺|へん]と かさなって いる 0から かぞえて ${p.v}を さがそう。`, '[色|いろ]の ついた [目盛|めも]りを [読|よ]もう。', `0から かぞえて ${p.v}の ところだよ。`];
      useEffect(() => {
        if (phase === 'place') api.phase({ prompt: '[分度器|ぶんどき]を [辺|へん]に あわせよう。\n（[中心|ちゅうしん]を [頂点|ちょうてん]に、0の [線|せん]を [辺|へん]に）', hints: ['[分度器|ぶんどき]の [中心|ちゅうしん]を [頂点|ちょうてん]に、0の [線|せん]を [辺|へん]に かさねよう。', 'うすい [分度器|ぶんどき]と おなじ ところに うごかそう。', 'おたすけ！ [分度器|ぶんどき]を あわせたよ。'] });
        if (phase === 'dot') api.phase({ prompt: `${p.v}°の ところに [点|てん]を うとう。\n[目盛|めも]りの そとがわを タップしてね。`, hints: dotHints });
        if (phase === 'line') api.phase({ prompt: '[頂点|ちょうてん]と [点|てん]を [線|せん]で むすぼう。\n[頂点|ちょうてん]から [点|てん]まで ゆびで なぞってね。', hints: ['[頂点|ちょうてん]から [点|てん]まで まっすぐ なぞろう。', '[点線|てんせん]の うえを なぞろう。', '[点|てん]を タップしても いいよ。'] });
      }, [phase]);
      useEffect(() => { if (phase === 'place' && hint >= 3) { ctl.setPos({ x: V.x, y: V.y, rot: 0 }); sfx('snap'); } }, [hint]);
      const readOf = d => zero === 'inner' ? d : 180 - d;
      const dotPt = d => P(V.x, V.y, R + 20, d);
      const finish = () => { setLine(tgtDir); api.ok(`${p.v}°の角`, 'お[客|きゃく]さんの [注文|ちゅうもん]どおりの ピザが できたね！'); };
      const down = e => {
        if (done) return;
        const svg = ref.current; const q = svgPoint(svg, e);
        if (phase === 'dot') {
          const d = dist(q.x, q.y, V.x, V.y); let a = angOf(q.x - V.x, q.y - V.y);
          if (d < R - 140 || d > R + 110) return;
          if (a > 185 && a < 355) return;
          if (a >= 355) a = 0; if (a > 180) a = 180;
          const st = s.scaleStep;
          sfx('pick'); setDot(clamp(Math.round(a / st) * st, 0, 180));
          return;
        }
        if (phase === 'line') {
          const [dx, dy] = dotPt(dot);
          const startNearDot = dist(q.x, q.y, dx, dy) < 50;
          setDrag({ x: q.x, y: q.y });
          beginDrag(e, svg, {
            move: m => setDrag({ x: m.x, y: m.y }),
            end: m => {
              setDrag(null);
              const endNearDot = dist(m.x, m.y, dx, dy) < 50;
              const endNearV = dist(m.x, m.y, V.x, V.y) < 50;
              const alongRay = dist(m.x, m.y, V.x, V.y) > 120 && Math.abs(sdiff(angOf(m.x - V.x, m.y - V.y), dot)) <= 4;
              if (endNearDot || alongRay || (startNearDot && (endNearV || dist(m.x, m.y, q.x, q.y) < 12))) { sfx('snap'); finish(); }
              else api.ng('線がずれた', 'other', '[頂点|ちょうてん]から [点|てん]まで まっすぐ なぞろう。');
            },
          });
        }
      };
      const submitPlace = () => {
        if (!ctl.centerOK) { setForced(f => ({ ...f, glowC: true })); api.ng('中心がずれている', 'center', MSG.center); return; }
        if (!ctl.zeroOK) { setForced(f => ({ ...f, glowZ: true })); api.ng('0の線がずれている', 'zero', MSG.zero); return; }
        sfx('snap'); ctl.setPos({ x: V.x, y: V.y, rot: 0 }); api.note('分度器OK'); setPhase('dot');
      };
      const submitDot = () => {
        if (dot == null) { api.say('さきに [目盛|めも]りの そとがわを タップして [点|てん]を うとう。'); return; }
        const val = readOf(dot);
        const r = judgeReading(val, p.v, s.tolerance, s.scaleStep);
        if (r.ok) {
          api.note(`点${val}°`);
          if (p.mode === 'dot') finish(); else { sfx('snap'); setDot(tgtDir); setPhase('line'); }
        } else { setForced(f => errForce(f, r.err)); api.ng(`点${val}°`, r.err, MSG[r.err]); }
      };
      const hl = phase === 'dot' && (s.colorAssist || forced.color || hint >= 2) ? zero : null;
      const glow = phase !== 'place' ? null : (!ctl.centerOK && (hint >= 2 || forced.glowC)) ? 'center' : (!ctl.zeroOK && (hint >= 2 || forced.glowZ)) ? 'zero' : null;
      const [bx, by] = P(V.x, V.y, R + 80, baseDir);
      const steps = p.mode === 'full' ? ['[辺|へん]を かく', '[分度器|ぶんどき]を あわせる', '[目盛|めも]りに [点|てん]を うつ', '[頂点|ちょうてん]と [点|てん]を むすぶ'] : null;
      const now = done ? 4 : { place: 1, dot: 2, line: 3 }[phase];
      const scene = (
        <g>
          {line != null && <PizzaSlice x={V.x} y={V.y} r={R + 40} a1={p.left ? tgtDir : 0} sweep={p.v} pepperoni />}
          <line x1={V.x} y1={V.y} x2={bx} y2={by} stroke="#1e3a8a" strokeWidth="6" strokeLinecap="round" />
          {phase === 'place' && hint >= 2 && <Protractor x={V.x} y={V.y} rot={0} R={R} step={s.scaleStep} ghost />}
          {phase !== 'line' && line == null && (
            <Protractor x={ctl.pos.x} y={ctl.pos.y} rot={ctl.pos.rot} R={R} step={s.scaleStep} hl={hl} glow={glow}
                        onBodyDown={phase === 'place' ? ctl.bodyDown : undefined} onKnobDown={ctl.knobDown} knob={phase === 'place' && !done} />
          )}
          {phase === 'line' && line == null && <Protractor x={V.x} y={V.y} rot={0} R={R} step={s.scaleStep} ghost />}
          {phase === 'line' && line == null && hint >= 2 && (() => { const [ex, ey] = dotPt(dot); return <line x1={V.x} y1={V.y} x2={ex} y2={ey} stroke="#f59e0b" strokeWidth="6" strokeDasharray="12 10" pointerEvents="none" />; })()}
          {drag && <line x1={V.x} y1={V.y} x2={drag.x} y2={drag.y} stroke="#ea580c" strokeWidth="6" strokeLinecap="round" pointerEvents="none" />}
          {line != null && (() => { const [ex, ey] = P(V.x, V.y, R + 80, line); return <line x1={V.x} y1={V.y} x2={ex} y2={ey} stroke="#ea580c" strokeWidth="6" strokeLinecap="round" />; })()}
          {dot != null && (() => { const [dx, dy] = dotPt(dot); return <g pointerEvents="none"><circle cx={dx} cy={dy} r="11" fill="#e11d48" stroke="#fff" strokeWidth="3" />{phase === 'line' && hint >= 3 && <circle cx={dx} cy={dy} r="26" fill="none" stroke="#f59e0b" strokeWidth="5" className="pulse" />}</g>; })()}
          <circle cx={V.x} cy={V.y} r="7" fill="#1e3a8a" pointerEvents="none" />
          {phase === 'line' && hint >= 3 && <circle cx={V.x} cy={V.y} r="24" fill="none" stroke="#f59e0b" strokeWidth="5" className="pulse" pointerEvents="none" />}
          {line != null && (() => { const [lx, ly] = P(V.x, V.y, 70, (p.left ? tgtDir : 0) + p.v / 2); return <text x={lx} y={ly} textAnchor="middle" dominantBaseline="central" fontSize="32" fontWeight="900" fill="#be123c" stroke="#fff" strokeWidth="6" paintOrder="stroke">{p.v}°</text>; })()}
        </g>
      );
      const assist = phase === 'dot' && !done ? (
        <g pointerEvents="none">
          {hint >= 3 && <CountArc cx={V.x} cy={V.y} R={R} start={baseDir} dir={p.left ? -1 : 1} value={p.v} step={s.scaleStep} />}
        </g>
      ) : null;
      return (
        <PlayLayout host={host} svgRef={ref} onPointerDown={down} steps={steps && <StepCards steps={steps} now={now} />}
          work={<><OrderBubble v={p.v} who={p.who} x={p.left ? 496 : 14} />{scene}{assist}</>}
          panel={phase === 'place' ? (
            <div className="col">
              {s.moveButtons && <ProtractorPad ctl={ctl} disabled={done} />}
              <Btn color="green" size="xl" disabled={done} onClick={submitPlace}>あわせた！</Btn>
            </div>
          ) : phase === 'dot' ? (
            <Btn color="green" size="xl" disabled={done} onClick={submitDot}>できた！</Btn>
          ) : null} />
      );
    }

    /* ---------- ステージ8：180°より大きい角 ---------- */
    function S8Reflex({ p, s, host, api, done, hint }) {
      const ref = useRef(null);
      const C = { x: 400, y: 400 }, R = 200;
      const add = p.method === 'add';
      const small = add ? p.v - 180 : 360 - p.v;
      const alpha = 360 - p.v;             // もう 1本の 辺の 向き（上の ほう）
      const zero = add ? 'outer' : 'inner'; // □を 読む 目盛り
      const [phase, setPhase] = useState('read');
      const [forced, setForced] = useState({});
      const [gone, setGone] = useState([]);
      useEffect(() => {
        if (phase === 'calc') api.phase({
          prompt: add ? '180° と □° を たそう。\n[角|かく]は [何度|なんど]かな？' : '360° から □° を ひこう。\n[角|かく]は [何度|なんど]かな？',
          hints: add ? ['180°に □°を たそう。', '180から 10ずつ かぞえよう。180、190、200…', `180 ＋ ${small} ＝ ${p.v}`] : ['360°から □°を ひこう。', '360から 10ずつ もどろう。360、350、340…', `360 − ${small} ＝ ${p.v}`],
        });
      }, [phase]);
      const choices = useMemo(() => {
        const set = new Set([p.v]);
        [add ? 180 - small : 180 + small, p.v + 10, p.v - 10, p.v + 20].forEach(x => { if (set.size < 3 && x > 0 && x < 360 && !set.has(x)) set.add(x); });
        return [...set].sort((a, b) => a - b);
      }, []);
      const [ex, ey] = P(C.x, C.y, R + 80, 0), [fx, fy] = P(C.x, C.y, R + 80, alpha);
      const smallStart = add ? alpha : 0;
      const [lx, ly] = P(C.x, C.y, R + 46, smallStart + small / 2);
      const scene = (
        <g>
          <path d={sectorD(C.x, C.y, 58, 0, -p.v)} fill="rgba(251,146,60,.18)" />
          <path d={arcD(C.x, C.y, 58, 0, -p.v)} fill="none" stroke="#f97316" strokeWidth="7" />
          {add && <line x1={C.x} y1={C.y} x2={C.x - R - 80} y2={C.y} stroke="#64748b" strokeWidth="4" strokeDasharray="12 9" />}
          <line x1={C.x} y1={C.y} x2={ex} y2={ey} stroke="#1e3a8a" strokeWidth="5" strokeLinecap="round" />
          <line x1={C.x} y1={C.y} x2={fx} y2={fy} stroke="#1e3a8a" strokeWidth="5" strokeLinecap="round" />
          {phase === 'read' && <Protractor x={C.x} y={C.y} rot={0} R={R} step={s.scaleStep} hl={(s.colorAssist || forced.color || hint >= 2) ? zero : null} />}
          <path d={arcD(C.x, C.y, phase === 'read' ? R + 14 : 90, smallStart, small)} fill="none" stroke="#2563eb" strokeWidth="7" />
          <circle cx={C.x} cy={C.y} r="6" fill="#1e3a8a" />
          <g><rect x={lx - 26} y={ly - 22} width="52" height="44" rx="6" fill="#fff" stroke="#2563eb" strokeWidth="4" /><text x={lx} y={ly + 1} textAnchor="middle" dominantBaseline="central" fontSize={22} fontWeight="900" fill="#2563eb">{phase === 'calc' ? `${small}°` : '□'}</text></g>
          <text x={C.x} y={C.y + 92} textAnchor="middle" fontSize="28" fontWeight="900" fill="#ea580c">？°</text>
          {done && <text x="780" y="40" textAnchor="end" fontSize="40" fontWeight="900" fill="#e11d48">{p.v}°</text>}
        </g>
      );
      const cfg = { cx: C.x, cy: C.y, R, rot: 0, zero, v: small, step: s.scaleStep };
      const calcJudge = ans => {
        if (Math.abs(ans - p.v) <= s.tolerance) api.ok(`${ans}°`, add ? `180° ＋ ${small}° ＝ ${p.v}°` : `360° − ${small}° ＝ ${p.v}°`);
        else { setGone(g => [...g, ans]); api.ng(`${ans}°`, 'calc', add ? '180°に □°を たそう。' : '360°から □°を ひこう。'); }
      };
      return (
        <PlayLayout host={host} svgRef={ref}
          work={<>{scene}{phase === 'read' && <ReadAssist {...cfg} hint={hint} forced={forced} s={s} est={false} scene={scene} />}</>}
          panel={phase === 'read' ? (
            <DegreeAnswer value={small} s={s} api={api} disabled={done} estimate={false}
              prompt={'まず [青|あお]い □の [角|かく]を\n[分度器|ぶんどき]で [読|よ]もう。'} hints={READ_HINTS}
              onErr={e => setForced(f => errForce(f, e))}
              onCorrect={ans => { sfx('snap'); api.note(`□=${ans}°`); setPhase('calc'); }} />
          ) : (
            <div className="col">
              <div className="numdisp" style={{ fontSize: '2rem' }}>{add ? `180° ＋ ${small}° ＝ ？` : `360° − ${small}° ＝ ？`}</div>
              {s.answerMode === 'number'
                ? <NumPad disabled={done} onSubmit={calcJudge} />
                : <Choices options={choices.map(v => ({ value: v, label: `${v}°`, gone: gone.includes(v) }))} disabled={done} onPick={calcJudge} />}
            </div>
          )} />
      );
    }

    /* ---------- とくべつ1：だいたい 何度？ ---------- */
    function TK1Guess({ p, s, host, api, done, hint }) {
      const ref = useRef(null);
      const [ph, setPh] = useState('est');
      const V = { x: p.v > 90 ? 470 : 230, y: 420 };
      return (
        <PlayLayout host={host} svgRef={ref}
          work={<>
            <AngleFig x={V.x} y={V.y} a1={0} sweep={p.v} len={300} arc={54} w={7} color="#1e3a8a" />
            {hint >= 2 && <RightRef x={V.x} y={V.y} len={280} />}
            {ph === 'read' && hint >= 3 && <Protractor x={V.x} y={V.y} R={220} step={10} ghost />}
            {done && <text x="780" y="40" textAnchor="end" fontSize="40" fontWeight="900" fill="#e11d48">{p.v}°</text>}
          </>}
          panel={<DegreeAnswer value={p.v} s={s} api={api} disabled={done} onPhase={setPh} forceEstimate choices={p.choices}
            prompt="この [角|かく]は だいたい [何度|なんど]？"
            hints={['[直角|ちょっかく]（90°）と くらべて みよう。', '[直角|ちょっかく]の [半分|はんぶん]は 45°くらいだよ。', 'うすい [分度器|ぶんどき]を [見|み]て みよう。']}
            onCorrect={ans => api.ok(`${ans}°`)} />} />
      );
    }

    /* ---------- とくべつ2：ワニワニ先生に ピザを あげよう ---------- */
    function TK2Feed({ p, s, ...k }) {
      const hx = 290, hy = 430;
      return <MouthTask {...k} s={s} start={10} step={10} max={180} hx={hx} hy={hy}
        prompt={`${p.v}°の ピザだよ。\nワニワニ[先生|せんせい]の [口|くち]を ${p.v}°に あけて、たべさせて あげよう。`}
        hints={['ピザの とがりかたと おなじに なるように ひらこう。', 'うすい ピザの かたちに あわせよう。', 'うすい [分度器|ぶんどき]を [見|み]て みよう。']}
        check={o => Math.abs(o - p.v) <= 10 ? { ok: true } : o < p.v ? { err: 'other', msg: 'もっと [大|おお]きく あけよう。' } : { err: 'other', msg: 'あけすぎ！ すこし とじよう。' }}
        okText={o => `口${o}°`} okMsg="ぱくっ！ おいしい！" onOk={() => setTimeout(() => sfx('chomp'), 500)}
        back={(o, hint, done) => <>
          {!done && hint >= 3 && <Protractor x={hx} y={hy} R={220} step={10} ghost />}
        </>}
        front={(o, hint, done) => <>
          {!done && hint >= 2 && <path d={sectorD(hx, hy, 230, 0, p.v)} fill="rgba(253,230,138,.45)" stroke="#d97706" strokeWidth="4" strokeDasharray="12 9" pointerEvents="none" />}
          {done ? (
            <g className="pop"><PizzaSlice x={hx + 4} y={hy} r={200} a1={2} sweep={Math.max(4, o - 4)} /><text x="600" y="120" textAnchor="middle" fontSize="54" fontWeight="900" fill="#e11d48" stroke="#fff" strokeWidth="8" paintOrder="stroke">ぱくっ！</text></g>
          ) : (
            <g pointerEvents="none">
              <rect x="560" y="20" width="230" height="230" rx="22" fill="#fff" stroke="#fed7aa" strokeWidth="4" />
              <PizzaSlice x={fitVX(560, 230, p.v > 90 ? 110 : 160, 0, p.v)} y={225} r={p.v > 90 ? 110 : 160} a1={0} sweep={p.v} />
              <text x="776" y="58" textAnchor="end" fontSize="34" fontWeight="900" fill="#be123c">{p.v}°</text>
            </g>
          )}
        </>} />;
    }

    /* =========================================================
       ステージの 中身（導入と 5問）
       ========================================================= */
    // ---- 紙を 2回 おって 直角を つくる ----
    const PAPER = [[-170, -120], [-40, -150], [110, -135], [175, -60], [160, 70], [90, 140], [-60, 130], [-160, 90], [-185, 0]];
    function FoldPaper({ t1 = 0, t2 = 0, mark = false, x = 400, y = 220, s = 1 }) {
      const sy = Math.cos(Math.PI * clamp(t1, 0, 1));
      const sx = Math.cos(Math.PI * clamp(t2, 0, 1));
      const pts = PAPER.map(q => q.join(',')).join(' ');
      const layer = (backSide, key) => <polygon key={key} points={pts} fill={backSide ? '#fbbf24' : '#fef3c7'} stroke="#d97706" strokeWidth="3" strokeLinejoin="round" />;
      const half = (flipX) => (
        <>
          <g clipPath="url(#fpBottom)">{layer(flipX, 'a')}</g>
          <g transform={`scale(1 ${f1(sy * 1000) / 1000})`}><g clipPath="url(#fpTop)">{layer((sy < 0) !== flipX, 'b')}</g></g>
        </>
      );
      return (
        <g transform={`translate(${x} ${y}) scale(${s})`}>
          <defs>
            <clipPath id="fpBottom"><rect x="-300" y="0" width="600" height="300" /></clipPath>
            <clipPath id="fpTop"><rect x="-300" y="-300" width="600" height="300" /></clipPath>
            <clipPath id="fpLeft"><rect x="-300" y="-300" width="300" height="600" /></clipPath>
            <clipPath id="fpRight"><rect x="0" y="-300" width="300" height="600" /></clipPath>
          </defs>
          <g clipPath="url(#fpLeft)">{half(false)}</g>
          <g transform={`scale(${f1(sx * 1000) / 1000} 1)`}><g clipPath="url(#fpRight)">{half(sx < 0)}</g></g>
          {t1 >= 1 && t2 <= 0 && <line x1="-190" y1="0" x2="190" y2="0" stroke="#b45309" strokeWidth="3" strokeDasharray="8 6" />}
          {mark && <g><RightMark x={0} y={0} a1={180} size={40} /><circle cx="0" cy="0" r="54" fill="none" stroke="#e11d48" strokeWidth="5" className="pulse" /></g>}
        </g>
      );
    }
    const ArtText = ({ x, y, children, size = 30, color = '#be123c', anchor = 'middle' }) => <text x={x} y={y} textAnchor={anchor} dominantBaseline="central" fontSize={size} fontWeight="900" fill={color} stroke="#fff" strokeWidth="7" paintOrder="stroke">{children}</text>;
    const loopOpen = t => 10 + 40 * (0.5 - 0.5 * Math.cos(2 * Math.PI * t));

    // 導入：slides の Art は { t（0〜1）, cycle（くりかえし回数）} を うけとる
    const INTRO = {
      s0: [
        { say: 'ワニワニ[先生|せんせい]の [口|くち]を [見|み]て。\nぱく ぱく、ひらいたり とじたり するね。', dur: 2400, loop: true, Art: ({ t }) => <WaniMouth x={300} y={400} open={loopOpen(t)} arc={false} rays={false} /> },
        { say: '[口|くち]の つけねを [頂点|ちょうてん]と いうよ。', Art: () => <><WaniMouth x={300} y={400} open={45} arc={false} hlVertex /><line x1="306" y1="410" x2="380" y2="470" stroke="#be123c" strokeWidth="4" /><ArtText x={450} y={482}>ちょうてん</ArtText></> },
        { say: '[上|うわ]あごと [下|した]あごの まっすぐな [線|せん]を [辺|へん]と いうよ。', Art: () => <><WaniMouth x={300} y={400} open={45} arc={false} hlEdges /><ArtText x={520} y={440}>へん</ArtText><ArtText x={430} y={230}>へん</ArtText></> },
        { say: '[辺|へん]の ひらきぐあいを [角|かく]と いうよ。\nピザの とがった ところも [角|かく]だね。', Art: () => <><g transform="translate(60 60) scale(.7)"><WaniMouth x={200} y={400} open={45} arc arcR={70} /></g><PizzaSlice x={480} y={420} r={280} a1={20} sweep={45} /><path d={arcD(480, 420, 70, 20, 45)} fill="none" stroke="#f97316" strokeWidth="7" /><ArtText x={600} y={470}>かく</ArtText><ArtText x={170} y={470}>かく</ArtText></> },
      ],
      s1: [
        { say: 'かみを おって [直角|ちょっかく]を つくろう。\nまず [半分|はんぶん]に おるよ。', dur: 1800, Art: ({ t }) => <FoldPaper t1={ease(Math.min(1, t * 1.25))} /> },
        { say: 'おった [線|せん]が かさなるように、\nもう いちど おるよ。', dur: 1800, Art: ({ t }) => <FoldPaper t1={1} t2={ease(Math.min(1, t * 1.25))} /> },
        { say: 'できた かどが [直角|ちょっかく]だよ。', Art: () => <FoldPaper t1={1} t2={1} mark x={480} y={200} s={1.3} /> },
        { say: '[三角定規|さんかくじょうぎ]にも [直角|ちょっかく]の かどが あるよ。\nノートや まどの かども [直角|ちょっかく]だね。', Art: () => <><SetSquare x={120} y={430} a={300} b={180} glowCorner /><g>{THINGS.note.draw(620, 250)}<RightMark x={558} y={328} a1={0} size={30} /></g></> },

        D('s8-1', '180°＋□', S8Reflex, S8make('add')),
        D('s8-2', '180°＋□', S8Reflex, S8make('add')),
        D('s8-3', '360°−□', S8Reflex, S8make('sub')),
        D('s8-4', '360°−□', S8Reflex, S8make('sub')),
        D('s8-5', 'どちらかで', S8Reflex, S8make(null)),

      { id: 'tk1', special: true, name: 'だいたい [何度|なんど]？', sub: '[見当|けんとう]を つける ゲーム', pizza: 'けんとう ピザ', icon: 'guess', problems: Array.from({ length: 5 }, (_, i) => D(`tk1-${i + 1}`, 'だいたい何度？', TK1Guess, () => { const v = pick([20, 30, 40, 50, 60, 70, 110, 120, 130, 140, 150, 160]); return { v, choices: guessChoices(v) }; })) },

    const STAGE_MAP = Object.fromEntries(STAGES.map(s => [s.id, s]));

    /* =========================================================
       ホーム（ピザやさん）
       ========================================================= */
    let GREETED = false;
    function HomeScreen({ app, onPlay, onMenu, onAlbum, newId }) {
      const { state } = app;
      const next = findNext(state);
      const name = state.profile ? state.profile.name : '';
      const t = titleOf(state);
      const [talking, setTalking] = useState(false);
      const run = next && state.runs[next.id];
      const msg = next
        ? `いらっしゃい！\nきょうは「${stageLabel(next)} ${next.name}」に ちょうせん しよう。`
        : 'ぜんぶ クリア！ すごいね！\nすきな ステージで あそぼう。';
      const say = async (force = false) => { setTalking(true); await TTS.speak(`${name}さん、${msg}`, { force }); setTalking(false); };
      useEffect(() => { if (!GREETED) { GREETED = true; say(); } return () => TTS.cancel(); }, []);
      return (
        <div className="home">
          <div className="home-scene">
            <ShopScene pizzas={state.pizzas} onFrame={onAlbum} onWani={() => say(true)} talking={talking} waniMood={newId ? 'happy' : 'normal'} newId={newId} />
          </div>
          <div className="col home-side kids">
            <div className="bubble" style={{ fontSize: '1.35rem' }}>

    /* =========================================================
       メニュー（ステージえらび）
       ========================================================= */
    function MenuScreen({ app, onOpen }) {
      const st = app.state;
      const next = findNext(st);
      const item = (s) => {
        const open = isStageOpen(s, st);
        const cleared = isCleared(s.id, st);
        const pr = st.progress[s.id] || {};
        const run = st.runs[s.id];
        return (
          <button key={s.id} className={`mitem ${next && next.id === s.id ? 'next' : ''}`} disabled={!open} onClick={() => { sfx('tap'); onOpen(s); }}>
            <div style={{ background: 'rgba(255,255,255,.1)', borderRadius: '1rem', padding: '.2rem' }}>{open ? <StageIcon kind={s.icon} size={72} /> : <div style={{ width: 72, height: 72, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 40 }}>🔒</div>}</div>
            <div className="grow">
              <div style={{ fontSize: '1rem', color: '#fde68a' }}>{s.special ? 'とくべつ' : `ステージ${s.no}`}{s.advanced ? '（はってん）' : ''}</div>

              {!cleared && run && <div className="tag" style={{ background: '#f59e0b', color: '#451a03' }}>{run.idx + 1}もんめ</div>}
              {open && !cleared && !run && next && next.id === s.id && <div className="tag" style={{ background: '#fde047', color: '#451a03' }}>つぎは ここ</div>}

    /* =========================================================
       導入（ワニワニ先生の お話）
       ========================================================= */
    function IntroScreen({ stage, onStart }) {
      const slides = INTRO[stage.id] || [];
      const [i, setI] = useState(0);
      const [clock, setClock] = useState({ t: 1, cycle: 0 });
      const [talking, setTalking] = useState(false);
      const sl = slides[i];
      useEffect(() => {
        if (!sl) return;
        let raf; let alive = true;
        if (sl.dur) {
          const st = performance.now();
          const tick = now => { const x = (now - st) / sl.dur; setClock({ t: sl.loop ? x % 1 : Math.min(1, x), cycle: sl.loop ? Math.floor(x) : 0 }); if (sl.loop || x < 1) raf = requestAnimationFrame(tick); };
          raf = requestAnimationFrame(tick);
        } else setClock({ t: 1, cycle: 0 });
        (async () => { setTalking(true); await TTS.speak(sl.say); if (alive) setTalking(false); })();
        return () => { alive = false; cancelAnimationFrame(raf); TTS.cancel(); };
      }, [i]);
      if (!sl) { onStart(); return null; }
      const Art = sl.Art;
      const last = i === slides.length - 1;
      return (
        <div className="play">
          <div className="work">
            <div className="qhead"><span>{stage.special ? 'とくべつ' : `ステージ${stage.no}`}</span><R t={stage.name} /><span className="grow" /><span className="muted">{i + 1} / {slides.length}</span></div>
            <svg className="ws" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet"><Art t={clock.t} cycle={clock.cycle} /></svg>
          </div>
          <div className="panel">
            <div className="row" style={{ alignItems: 'flex-start', gap: '1rem' }}>
              <WaniSensei size={110} talking={talking} mood="normal" />
              <div className="bubble grow" key={i}><R t={sl.say} /></div>
            </div>
            <div className="row center wrapflex">
              {i > 0 && <Btn color="white" size="lg" onClick={() => setI(i - 1)}>◀ まえ</Btn>}
              <Btn color="white" size="lg" onClick={() => TTS.speak(sl.say, { force: true })}>🔊</Btn>
              {!last && <Btn color="sky" size="lg" onClick={() => setI(i + 1)}>つぎ ▶</Btn>}
            </div>
            {last && <Btn color="green" size="xl" className="pop" onClick={onStart}><R t="もんだいを はじめる ▶" /></Btn>}
            <div style={{ marginTop: 'auto' }} className="tc">
              {!last && <Btn color="white" size="sm" onClick={onStart}><R t="おはなしを とばす ▶▶" /></Btn>}
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================
       ピザを やく
       ========================================================= */
    function BakeScreen({ pizza, stage, titleUp, onDone }) {
      const t = useTicker(4200, { key: pizza ? pizza.id : 'x' });
      const phase = t < 0.3 ? 'in' : t < 0.68 ? 'bake' : 'out';
      useEffect(() => { sfx('fold'); }, []);
      useEffect(() => {
        if (phase === 'out') {
          sfx('clear');
          TTS.speak(`${stage.pizza}が やけたよ！ おみせに かざろう。${titleUp ? `しょうごうが「${titleUp.name}」に なったよ！` : ''}`);
        }
      }, [phase]);
      if (!pizza) return null;
      const k = ease(Math.min(1, t / 0.3));
      return (
        <div className="wrap tc kids" style={{ maxWidth: 900 }}>
          {phase === 'out' && <Confetti />}
          <div style={{ position: 'relative', height: '58vh', maxHeight: 460 }}>
            <Oven>
              {phase === 'in' && <g transform={`translate(${200} ${300 - 90 * k}) scale(${0.5 - 0.25 * k})`}><PizzaG toppings={pizza.toppings} seed={pizza.id} /></g>}
              {phase === 'bake' && <text x="200" y="120" textAnchor="middle" fontSize="30" fontWeight="900" fill="#fff" stroke="#7c2d12" strokeWidth="6" paintOrder="stroke">じゅうう…</text>}
            </Oven>
            {phase === 'out' && (
              <div className="pop" style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <div style={{ background: 'rgba(255,255,255,.92)', borderRadius: '50%', padding: 18, boxShadow: '0 10px 30px rgba(0,0,0,.25)' }}>
                  <Pizza size={260} toppings={pizza.toppings} seed={pizza.id} baked />
                </div>
              </div>
            )}
          </div>
          {phase === 'out' && (
            <div className="col fadein" style={{ alignItems: 'center' }}>
              <div className="bubble top" style={{ fontSize: '1.6rem' }}>
                <R t={`${stage.pizza}が やけたよ！`} />
                {titleUp && <div style={{ color: '#be185d' }}>{titleUp.icon} <R t={`しょうごうが「${titleUp.name}」に なったよ！`} /></div>}
              </div>
              <Btn color="green" size="xl" onClick={onDone}><R t="おみせに かざる ▶" /></Btn>
            </div>
          )}
        </div>
      );
    }

    function AlbumScreen({ app }) {

    /* =========================================================
       暗証番号
       ========================================================= */
    function PinPad({ onSuccess, onClose, check }) {
      const [digits, setDigits] = useState('');
      const [shake, setShake] = useState(false);
      const press = (d) => {
        if (digits.length >= 4) return;
        const v = digits + d;
        setDigits(v);
        if (v.length === 4) {
          setTimeout(() => {
            if (check(v)) onSuccess();
            else { sfx('ng'); setShake(true); setTimeout(() => { setShake(false); setDigits(''); }, 450); }
          }, 150);
        }
      };
      return (
        <Modal onClose={onClose}>
          <div className={`card tc ${shake ? 'shake' : ''}`} style={{ maxWidth: 380, margin: '0 auto' }}>
            <div className="bold" style={{ fontSize: '1.5rem' }}>🔐 先生用の画面</div>
            <div className="muted" style={{ marginBottom: '.8rem' }}>4けたの暗証番号を入れてください</div>
            <div className="row center" style={{ marginBottom: '1rem' }}>
              {[0, 1, 2, 3].map(i => <span key={i} style={{ width: 22, height: 22, borderRadius: 99, border: '2px solid #334155', background: i < digits.length ? '#334155' : 'transparent' }} />)}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '.5rem' }}>
              {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => <Btn key={d} color="white" size="lg" onClick={() => press(d)}>{d}</Btn>)}
              <Btn color="white" size="lg" onClick={() => setDigits(s => s.slice(0, -1))}>⌫</Btn>
              <Btn color="white" size="lg" onClick={() => press('0')}>0</Btn>
              <Btn color="slate" size="lg" onClick={onClose}>✕</Btn>
            </div>
          </div>
        </Modal>
      );
    }

       はじめての 設定（先生が 行う）

    /* =========================================================
       先生用画面
       ========================================================= */
    function TeacherScreen({ app, onExit }) {
      const [tab, setTab] = useState('records');
      const tabs = [['records', '📊 記録'], ['settings', '⚙️ 設定'], ['data', '💾 データ']];
      return (
        <div className="wrap">
          <div className="row between wrapflex" style={{ marginBottom: '.8rem' }}>
            <div className="bold" style={{ fontSize: '1.8rem' }}>先生用の画面</div>
            <Btn color="slate" size="md" onClick={onExit}>✕ 子どもの画面にもどる</Btn>
          </div>
          <div className="tabs">{tabs.map(([k, lb]) => <button key={k} className={`tab ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)}>{lb}</button>)}</div>
          {tab === 'records' && <RecordsTab app={app} />}
          {tab === 'settings' && <SettingsTab app={app} />}
          {tab === 'data' && <DataTab app={app} />}
        </div>
      );
    }
    const stageName = s => `${stageLabel(s)} ${stripMarkup(s.name)}`;
    function RecordsTab({ app }) {
      const st = app.state;
      const [hist, setHist] = useState(null);
      useEffect(() => { DB.getAll('history').then(h => setHist(h.sort((a, b) => b.at - a.at))).catch(() => setHist([])); }, []);
      if (!hist) return <div className="card">読み込み中…</div>;
      const done = hist.filter(h => h.done);
      const first = done.filter(h => !h.mistakes).length;
      const errTotal = {}; hist.forEach(h => (h.errors || []).forEach(e => { errTotal[e] = (errTotal[e] || 0) + 1; }));

                  const top = Object.entries(errs).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([e, n]) => `${ERR[e] || e}×${n}`).join('、');

    }

    function SyncPanel({ app }) {
      const sync = app.state.sync || {};
      const [pending, setPending] = useState(null);
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState('');
      const [editing, setEditing] = useState(!sync.url);
      const [url, setUrl] = useState(sync.url || '');
      const [key, setKey] = useState(sync.key || '');
      const countPending = async () => { try { setPending((await DB.getAll('history')).filter(h => !h.sent).length); } catch (e) { setPending(null); } };
      useEffect(() => { countPending(); }, [sync.lastOkAt, sync.lastErrorAt]);
      const send = async (all) => {
        setBusy(true); setMsg('');
        const r = await Sync.run(app, { all });
        setBusy(false); countPending();
        if (r.ok) setMsg(r.sent ? `${r.sent}件の記録を送りました。` : '送っていない記録はありません（一覧は最新です）。');
        else if (r.reason === 'offline') setMsg('インターネットにつながっていません。');
      };
      const save = () => {
        const u = url.trim();
        if (!REC_URL_RE.test(u)) { setMsg('URLの形がちがいます。「https://script.google.com/macros/s/…/exec」の形のURLを入れてください。'); return; }
        if (!key.trim()) { setMsg('合言葉を入れてください。'); return; }
        app.update(s => ({ ...s, sync: { ...s.sync, url: u, key: key.trim(), lastError: null, lastSummary: null } }));
        setEditing(false); setMsg('送り先を保存しました。「今すぐ送る」で送信を確かめてください。');
      };
      const clearUrl = () => {
        if (!confirm('記録の送り先を消しますか？（この端末の記録は消えません）')) return;

        setUrl(''); setKey(''); setEditing(true); setMsg('送り先を消しました。');
      };
      const errShown = sync.lastError && (!sync.lastOkAt || sync.lastErrorAt > sync.lastOkAt);
      const stat = (label, value, ok) => <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '.8rem', padding: '.6rem .9rem' }}><div className="muted" style={{ fontSize: '.85rem' }}>{label}</div><div className="bold" style={{ color: ok ? '#047857' : undefined }}>{value}</div></div>;

        <div className="card" style={{ borderColor: '#bae6fd' }}>

            {stat('送り先', sync.url ? '✅ 設定ずみ' : '未設定', !!sync.url)}
            {stat('まだ送っていない記録', pending == null ? '…' : `${pending}件`)}
            {stat('最後に送れた日時', sync.lastOkAt ? fmtDate(sync.lastOkAt) : '—')}
          </div>
          {errShown && <div style={{ background: '#fff1f2', border: '1px solid #fecdd3', color: '#9f1239', borderRadius: '.8rem', padding: '.6rem', marginBottom: '.6rem' }}>⚠️ {syncErrorText(sync.lastError)}</div>}
          {sync.url && (
            <div className="row wrapflex" style={{ marginBottom: '.5rem' }}>
              <Btn color="sky" size="md" disabled={busy} onClick={() => send(false)}>📤 今すぐ送る</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={() => send(true)}>🔁 これまでの記録をまとめて送る</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={() => setEditing(v => !v)}>✏️ 送り先を入力</Btn>
            </div>
          )}
          {!sync.url && <div className="muted" style={{ marginBottom: '.5rem' }}>入口ページ（Apps Script）の「はじめる」から開くと、送り先は自動で設定されます。入口ページを通さずに開いた端末では、スプレッドシートのメニュー「ワニワニ先生 → 子どもに配るURLと合言葉を表示」で出るURLと合言葉を、ここに入力してください。</div>}
          {editing && (
            <div className="col" style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '.8rem', padding: '.7rem' }}>
              <label><div className="bold" style={{ fontSize: '.9rem' }}>送り先のURL（…/exec）</div><input className="inp" style={{ width: '100%' }} value={url} onChange={e => setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/……/exec" /></label>
              <label><div className="bold" style={{ fontSize: '.9rem' }}>合言葉</div><input className="inp" style={{ width: '100%' }} value={key} onChange={e => setKey(e.target.value)} /></label>
              <div className="row"><Btn color="green" size="sm" onClick={save}>保存</Btn>{sync.url && <Btn color="white" size="sm" onClick={clearUrl}>送り先を消す</Btn>}</div>

          {msg && <div className="bold" style={{ marginTop: '.4rem' }}>{msg}</div>}
        </div>
      );

      const resetAll = async () => {

      return (
        <div className="col" style={{ gap: '1rem' }}>

            <div className="bold" style={{ fontSize: '1.2rem' }}>バックアップ</div>
            <div className="muted" style={{ marginBottom: '.5rem' }}>記録・ピザ・設定をまとめて保存します。Chromeの閲覧データを消すと記録も消えるので、ときどきバックアップしてください。端末を替えるときにも使えます。</div>
            <div className="row wrapflex">
              <Btn color="sky" size="md" disabled={busy} onClick={exportBackup}>💾 バックアップを書き出す</Btn>
              <Btn color="white" size="md" disabled={busy} onClick={importBackup}>📥 バックアップから元にもどす</Btn>

          </div>
          <div className="card" style={{ borderColor: '#fecdd3' }}>
            <div className="bold" style={{ fontSize: '1.2rem', color: '#be123c' }}>記録をすべて消す</div>
            <div className="muted" style={{ marginBottom: '.5rem' }}>新しい児童が使うときなどに使います。</div>
            <Btn color="red" size="md" onClick={resetAll}>🗑️ 記録を消す</Btn>

        </div>

    function App() {

        CURRENT.settings = next.settings;
        setState(next); saveState(next);
        return next;
      }, []);
      const app = { state, update, stateRef };

      const [pinOpen, setPinOpen] = useState(false);
      const [resume, setResume] = useState(null);

      useEffect(() => {
        const trySync = () => Sync.run({ state: stateRef.current, update, stateRef });
        trySync();
        window.addEventListener('online', trySync);
        return () => window.removeEventListener('online', trySync);
      }, []);
      useEffect(() => { document.documentElement.style.fontSize = (FONT_PX[state.settings.fontSize] || 16) + 'px'; }, [state.settings.fontSize]);

      const go = v => { TTS.cancel(); setView(v); window.scrollTo(0, 0); };
      if (location.protocol === 'file:') window.__kakudo = { go, update, stateRef }; // 動作確認用
      const openStage = (stage) => {
        const run = stateRef.current.runs[stage.id];
        if (run && run.idx > 0) setResume(stage);
        else go({ name: 'intro', stageId: stage.id });
      };
      const back = () => {
        if (view.name === 'play' || view.name === 'intro') go({ name: 'menu' });
        else go({ name: 'home' });
      };
      const stage = view.stageId ? STAGE_MAP[view.stageId] : null;

      return (
        <div style={{ minHeight: '100vh' }}>
          <Header app={app} view={view} onHome={() => !['setup', 'teacher'].includes(view.name) && go({ name: 'home' })} onBack={back} onTeacher={() => setPinOpen(true)} />
          {view.name === 'setup' && <SetupScreen onDone={(profile) => { update(s => ({ ...s, profile })); Sync.run(app); go({ name: 'home' }); }} />}
          {view.name === 'home' && <HomeScreen app={app} newId={view.newId} onPlay={openStage} onMenu={() => go({ name: 'menu' })} onAlbum={() => go({ name: 'album' })} />}
          {view.name === 'menu' && <MenuScreen app={app} onOpen={openStage} />}
          {view.name === 'intro' && stage && <IntroScreen key={stage.id} stage={stage} onStart={() => go({ name: 'play', stageId: stage.id, titleBefore: titleOf(stateRef.current) })} />}
          {view.name === 'play' && stage && (
            <PlayScreen key={stage.id + (view.k || '')} app={app} stage={stage} onClear={(pizza) => {
              const before = view.titleBefore;
              const after = titleOf(stateRef.current);
              go({ name: 'bake', stageId: stage.id, pizza, titleUp: before && before.name !== after.name ? after : null });
            }} />
          )}
          {view.name === 'bake' && stage && <BakeScreen pizza={view.pizza} stage={stage} titleUp={view.titleUp} onDone={() => go({ name: 'home', newId: view.pizza && view.pizza.id })} />}
          {view.name === 'album' && <AlbumScreen app={app} />}
          {view.name === 'teacher' && <TeacherScreen app={app} onExit={() => go({ name: 'home' })} />}
          {resume && (
            <Modal onClose={() => setResume(null)}>
              <div className="card tc" style={{ maxWidth: 520, margin: '0 auto' }}>
                <div className="row center"><WaniSensei size={90} mood="happy" /></div>
                <div className="bold" style={{ fontSize: '1.5rem', lineHeight: 1.9, margin: '.4rem 0 1rem' }}><R t={`${stageLabel(resume)}の つづきが あるよ。\n${stateRef.current.runs[resume.id].idx + 1}もんめから やる？`} /></div>
                <div className="col">
                  <Btn color="green" size="lg" onClick={() => { const s = resume; setResume(null); go({ name: 'play', stageId: s.id, titleBefore: titleOf(stateRef.current) }); }}>▶ つづきから</Btn>
                  <Btn color="white" size="lg" onClick={() => { const s = resume; setResume(null); update(st => { const runs = { ...st.runs }; delete runs[s.id]; return { ...st, runs }; }); go({ name: 'intro', stageId: s.id }); }}>はじめから</Btn>
                </div>
              </div>
            </Modal>
          )}
          {pinOpen && (
            <PinPad onClose={() => setPinOpen(false)}
                    check={v => state.profile && hashPin(v) === state.profile.pin}
                    onSuccess={() => { setPinOpen(false); go({ name: 'teacher' }); }} />
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      render() {
        if (this.state.err) return (
          <div className="wrap tc" style={{ maxWidth: 640 }}>
            <div style={{ fontSize: 64 }}>🐊💦</div>
            <div className="bold" style={{ fontSize: '1.6rem' }}>こまったことが おきたよ</div>
            <div className="muted" style={{ fontSize: '1.1rem', margin: '.5rem 0 1rem' }}>せんせいに しらせてね。（ページを さいよみこみ すると なおることが あります）</div>
            <pre style={{ textAlign: 'left', fontSize: 12, background: '#f1f5f9', padding: 12, borderRadius: 8, overflow: 'auto' }}>{String(this.state.err && this.state.err.stack || this.state.err)}</pre>
            <button className="btn3d c-sky s-md" onClick={() => location.reload()}>さいよみこみ</button>
          </div>
        );
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
