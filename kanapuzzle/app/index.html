    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .robo-wave { animation: wave 1.2s ease-in-out infinite; transform-origin: 150px 140px; transform-box: view-box; }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-25deg); } }
    .antenna-glow { animation: aglow 1.6s ease-in-out infinite; }
    @keyframes aglow { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .screen-flicker { animation: flicker .9s steps(2) infinite; }
    @keyframes flicker { 50% { opacity: .35; } }
    .screw-pop { animation: screwPop 1.2s ease-out forwards; }

    // ことばの 絵（プリントと 同じ 絵）。[ことば, ファイル名, 色を かえる 文字の 位置]
    const PICS = {

      'プ': ['プリン', 'purin', 0], 'ペ': ['ペンギン', 'pengin', 0], 'ポ': ['ポスト', 'posuto', 0],

    const LEVELS = [1, 2, 3, 4];
    const LEVEL_NAME = { 1: 'かげ', 2: 'マス', 3: 'じぶんで', 4: 'どの もじ？' };
    const LEVEL_ICON = { 1: '👤', 2: '➕', 3: '💪', 4: '❓' };

    const levelLabel = (st, lv) => `★${lv} ${levelName(st, lv)}`;
    const ROUND = 5; // 1回の もんだいの かず

    // ★3 に まぜる「まちがいやすい ピース」：[にている もじ, その もじの なんかくめ（0から）]
    const DUMMY = {
      'ノ': ['ク', 0], 'フ': ['ヌ', 0], 'ヘ': ['ハ', 1], 'レ': ['ル', 1],
      'ニ': ['コ', 0], 'ハ': ['ソ', 0], 'ト': ['ナ', 1],
      'リ': ['ル', 1], 'ル': ['レ', 0], 'ヒ': ['レ', 0],
      'イ': ['ノ', 0], 'ナ': ['メ', 0], 'メ': ['ナ', 1],
      'カ': ['フ', 0], 'コ': ['ロ', 1], 'ユ': ['コ', 0],
      'ク': ['ワ', 1], 'ス': ['ヌ', 0], 'ヌ': ['ス', 0],
      'マ': ['ア', 0], 'ム': ['ノ', 0], 'ラ': ['フ', 0],
      'ア': ['マ', 0], 'ヤ': ['セ', 0], 'セ': ['ヤ', 0],
      'ワ': ['ウ', 2], 'ソ': ['ン', 1], 'ン': ['ソ', 1],
      'エ': ['ユ', 0], 'キ': ['チ', 2], 'テ': ['チ', 2],

    // にている もじの ちがいを 教える ことば
    const EXPLAIN = {
      'ソ': 'ソ の ながい せんは、うえから したへ かくよ。',

    const VOWEL_ROWS = ['アカサタナハマヤラワガザダバパャ', 'イキシチニヒミリギジヂビピ', 'ウクスツヌフムユルグズヅブプュ', 'エケセテネヘメレゲゼデベペ', 'オコソトノホモヨロヲゴゾドボポョ'];
    const vowelOf = (ch) => { const i = VOWEL_ROWS.findIndex(r => r.includes(ch)); return i < 0 ? 'ウ' : 'アイウエオ'[i]; };

    // =====================================================================
    //  3. 画の かたちを はかる・ピースを つくる
    // =====================================================================
    const SVGNS = 'http://www.w3.org/2000/svg';
    let meas = null;
    const bbCache = {};
    function bbox(d) {
      if (bbCache[d]) return bbCache[d];
      if (!meas) {
        meas = document.createElementNS(SVGNS, 'svg');
        meas.setAttribute('style', 'position:absolute;left:-9999px;top:0;width:10px;height:10px');
        document.body.appendChild(meas);
      }
      const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', d);
      meas.appendChild(p); const b = p.getBBox(); p.remove();
      return (bbCache[d] = { x: b.x, y: b.y, width: b.width, height: b.height });
    }
    function unionBox(paths) {
      const bs = paths.map(bbox);
      const x = Math.min(...bs.map(b => b.x)), y = Math.min(...bs.map(b => b.y));
      return { x, y, width: Math.max(...bs.map(b => b.x + b.width)) - x, height: Math.max(...bs.map(b => b.y + b.height)) - y };
    }
    const startPt = (d) => { const m = d.match(/M\s*([-\d.]+)[ ,]([-\d.]+)/); return [+m[1], +m[2]]; };
    // たて書きの 位置に なおす：ー は たてに、小さい字は マスの 右上へ（プリントと 同じ）
    function tateOf(ch) {
      if (ch === 'ー') return { tf: 'rotate(90 54.5 54.5)', pt: ([x, y]) => [109 - y, x], box: b => ({ x: 109 - b.y - b.height, y: b.x, width: b.height, height: b.width }) };
      if (SMALL.includes(ch)) {
        const b0 = unionBox(STROKES[ch]), k = 0.72, dx = 98 - (b0.x + b0.width) * k, dy = 9 - b0.y * k;
        return { tf: `translate(${dx} ${dy}) scale(${k})`, pt: ([x, y]) => [x * k + dx, y * k + dy], box: b => ({ x: b.x * k + dx, y: b.y * k + dy, width: b.width * k, height: b.height * k }) };
      }
      return { tf: '', pt: p => p, box: b => b };
    }
    const colOf = (ch) => SPECIAL.includes(ch) ? MARK_COL : BASE_COL;

    // ピースの 見える はんい（すこし よゆうを とる。小さい ピースも おしやすいように 広げる）
    function finishPart(p, corner) {
      const pad = 9, MIN = 34;
      let x = p.box.x - pad, y = p.box.y - pad, w = p.box.width + pad * 2, h = p.box.height + pad * 2;
      if (corner) { x -= 8; y -= 8; w += 8; h += 8; }
      if (w < MIN) { x -= (MIN - w) / 2; w = MIN; }
      if (h < MIN) { y -= (MIN - h) / 2; h = MIN; }
      p.vb = { x, y, w, h };
      p.corner = !!corner;
      p.cx = p.box.x + p.box.width / 2; p.cy = p.box.y + p.box.height / 2;
      return p;
    }

    // もんだい（'c:ア' / 'w:ケーキ'）から ピースを つくる
    const itemCache = {};
    function buildItem(key) {
      if (itemCache[key]) return itemCache[key];
      const kind = key.startsWith('w:') ? 'word' : isDaku(key.slice(2)) ? 'daku' : 'char';
      const val = key.slice(2);
      let parts = [], letters = [val], dummy = null;
      if (kind === 'char') {
        parts = STROKES[val].map((d, i) => finishPart({ id: 'p' + i, paths: [d], col: COLORS[i], num: i + 1, tf: '', slot: 0, box: bbox(d), start: startPt(d) }));

        if (dm) {
          const d = STROKES[dm[0]][dm[1]], b = bbox(d);
          // にている 画の ばんごうと 色に する（いちばん 大きさが にている 画）
          let best = parts[0], bs = Infinity;
          parts.forEach(p => { const s = Math.abs(p.box.width - b.width) + Math.abs(p.box.height - b.height); if (s < bs) { bs = s; best = p; } });
          dummy = finishPart({ id: 'dummy', paths: [d], col: best.col, num: best.num, tf: '', slot: 0, box: b, start: startPt(d), dummy: true,
            label: dm[0] + 'の ピース', from: dm[0], explain: `それは「${dm[0]}」の ピースだよ。` + (EXPLAIN[val] || 'かたちを よく くらべて みよう。') });
        }
      } else if (kind === 'daku') {
        const all = STROKES[val], n = STROKES[baseOf(val)].length;
        const mark = HANDAKU.includes(val) ? '゜' : '゛';
        parts = [
          finishPart({ id: 'p0', paths: all.slice(0, n), col: BASE_COL, num: 1, tf: '', slot: 0, box: unionBox(all.slice(0, n)), start: startPt(all[0]) }, true),
          finishPart({ id: 'p1', paths: all.slice(n), col: MARK_COL, num: 2, tf: '', slot: 0, box: unionBox(all.slice(n)), start: startPt(all[n]), mark }, true),
        ];
        // 「゛」なら「゜」を、「゜」なら「゛」を まぜる
        const other = mark === '゛' ? 'パ' : 'バ';
        const op = STROKES[other].slice(STROKES[baseOf(other)].length);
        const omark = mark === '゛' ? '゜' : '゛';
        dummy = finishPart({ id: 'dummy', paths: op, col: MARK_COL, num: 2, tf: '', slot: 0, box: unionBox(op), start: startPt(op[0]), dummy: true,
          label: omark + 'の ピース', from: omark, explain: `それは「${omark === '゛' ? 'てんてん' : 'まる'}」だよ。「${val}」には「${mark === '゛' ? 'てんてん' : 'まる'}」を つけるよ。` }, true);
      } else {
        letters = [...val];
        parts = letters.map((ch, i) => {
          const t = tateOf(ch);
          return finishPart({ id: 'p' + i, ch, paths: STROKES[ch], col: colOf(ch), num: i + 1, tf: t.tf, slot: i, box: t.box(unionBox(STROKES[ch])), start: t.pt(startPt(STROKES[ch][0])) }, true);
        });
        const sp = letters.find(ch => SPECIAL.includes(ch));
        if (sp) {
          const i = letters.indexOf(sp);
          if (sp === 'ー') {
            dummy = finishPart({ id: 'dummy', ch: 'ー', paths: STROKES['ー'], col: MARK_COL, num: i + 1, tf: '', slot: i, box: unionBox(STROKES['ー']), start: startPt(STROKES['ー'][0]), dummy: true,
              label: 'よこの ー', from: 'よこの ー', explain: 'たてがきの ときは、のばす ぼうも たてに かくよ。' }, true);
          } else {
            const big = SMALL_TO_BIG[sp];
            dummy = finishPart({ id: 'dummy', ch: big, paths: STROKES[big], col: MARK_COL, num: i + 1, tf: '', slot: i, box: unionBox(STROKES[big]), start: startPt(STROKES[big][0]), dummy: true,
              label: 'おおきい ' + big, from: big, explain: `それは おおきい「${big}」だよ。「${val}」の ${sp} は、ちいさく マスの みぎうえに かくよ。` }, true);
          }

      return (itemCache[key] = { key, kind, val, parts, dummy, letters, n: kind === 'word' ? letters.length : 1 });
    }

    // ★4 の えらぶ こたえ（ただしい こたえ ＋ まちがいやすい こたえ 2つ）
    function makeChoices(key, stage) {
      const it = buildItem(key), v = it.val;
      let alts = [];
      if (it.kind === 'char') {
        if (DUMMY[v]) alts.push(DUMMY[v][0]);
        const others = shuffle([...(stage.chars || '')].filter(c => c !== v && !alts.includes(c) && SEION.includes(c)));
        alts.push(...others);
        alts.push(...shuffle([...SEION]).filter(c => c !== v && !alts.includes(c)));
      } else if (it.kind === 'daku') {
        const code = v.charCodeAt(0);
        if ('バビブベボ'.includes(v)) alts.push(String.fromCharCode(code + 1));
        else if (HANDAKU.includes(v)) alts.push(String.fromCharCode(code - 1));
        alts.push(baseOf(v));
        alts.push(...shuffle([...(stage.chars || '')].filter(c => c !== v && !alts.includes(c))));
      } else {
        const ls = it.letters, i = ls.findIndex(ch => SPECIAL.includes(ch));
        if (i >= 0) {
          const sp = ls[i];
          const a = [...ls]; a[i] = sp === 'ー' ? vowelOf(ls[i - 1]) : SMALL_TO_BIG[sp];
          const b = [...ls]; b.splice(i, 1);
          alts.push(a.join(''), b.join(''));
        }
        alts.push(...shuffle(stage.words.map(w => w[0]).filter(w => w !== v)));
      }
      alts = uniq(alts).filter(a => a && a !== v).slice(0, 2);
      return shuffle([v, ...alts]);
    }

    // 1回ぶんの もんだい（そのステージの もんだい ＋ まえの ステージの ふくしゅう で 5もん）
    function makeRound(stage, level) {
      const own = [...stage.items];
      const list = courseStages(stage.course);
      const prev = list[list.findIndex(s => s.id === stage.id) - 1];
      const pool = prev ? shuffle(prev.items) : shuffle(own);
      let items = [...own];
      if (level >= 3) items = shuffle(items);
      for (let i = 0; items.length < ROUND && i < pool.length * 2; i++) items.push(pool[i % pool.length]);
      return items.slice(0, Math.max(ROUND, own.length));
    }

    const itemText = (key) => key.slice(2);
    // できたときの ことば（例：イ！ イルカの イ）
    function picOf(key) {
      const v = key.slice(2);
      if (key.startsWith('w:')) return WORD_FILE[v] ? { file: WORD_FILE[v], word: v, at: -1 } : null;
      const p = PICS[v];
      return p ? { file: p[1], word: p[0], at: p[2] } : null;
    }

    // =====================================================================
    //  4. こえ と おと
    // =====================================================================
    const Speech = {
      rate: 0.8, pitch: 1.3, voice: null,
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = this.pitch;
          let done = false;
          const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
          u.onend = end; u.onerror = end;
          // 声が出ない端末でも 先へ 進めるように、長さに 合わせて 待つ
          setTimeout(end, 1500 + text.length * 260 / this.rate);
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() { try { this.ok && window.speechSynthesis.cancel(); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }

    const Sound = {
      on: true, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      tone(freq, at, dur, type = 'triangle', vol = 0.16) {
        const c = this.get(); if (!c || !this.on) return;
        const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      // カチッ（ピースが はまった）
      click() { this.tone(1200, 0, 0.05, 'square', 0.06); this.tone(1800, 0.04, 0.08, 'triangle', 0.1); },
      correct() { this.tone(1046, 0, 0.18); this.tone(1318, 0.12, 0.3); },
      // まちがえたときは、ブザーではなく 小さな 音
      retry() { this.tone(392, 0, 0.16, 'sine', 0.08); this.tone(349, 0.13, 0.22, 'sine', 0.08); },
      tap() { this.tone(660, 0, 0.06, 'sine', 0.07); },
      screw() { this.tone(1568, 0, 0.08); this.tone(2093, 0.07, 0.14); },

    // ロボタンの こえ（ふきだし と よみあげ を いっしょに うごかす）

    // =====================================================================
    //  5. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    const LOG_HEADER = ['日時', 'なまえ', 'コース', 'ステージ', 'だんかい', 'もんだい', 'けっか', 'まちがい', 'ヒント', 'まちがえた ピース', 'ID'];
    const DEFAULT_SETTINGS = { rate: 0.8, pitch: 1.3, font: 1, sound: true, num: true, mihon: true };
    const FLAG_KEYS = ['unlockAll', 'daku', 'word', 'easy', 'start'];
    const PENDING_KEY = 'kanapuzzle_app_pending_v1';
    const COPY_KEY = (n) => 'kanapuzzle_app_copy_v1_' + n;

    // スプレッドシートに つながって いない ときの おためしモード
    const Local = {
      key: 'kanapuzzle_app_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}
        this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: {} };
        return this.mem;
      },
      save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
    };

    const api = {
      async init() {
        if (HAS_GAS) return gas('getInitData');
        const d = Local.data();
        return { students: d.roster, settings: { ...DEFAULT_SETTINGS, ...d.settings }, demo: true };
      },
      async student(name) {
        if (HAS_GAS) return gas('getStudent', name);
        return Local.data().progress[name] || '';
      },
      async sendOne(p) {
        if (HAS_GAS) return gas('saveResult', p);
        const d = Local.data();
        const old = parseProgress(d.progress[p.name]);
        const neu = parseProgress(p.progress);
        if (p.progress && neu.t >= old.t) {
          if ((old.flagT || 0) > (neu.flagT || 0)) { FLAG_KEYS.forEach(k => { neu[k] = old[k]; }); neu.flagT = old.flagT; }
          d.progress[p.name] = JSON.stringify(neu);
        }
        const ids = new Set(d.log.map(r => r[10]));
        p.records.forEach(r => { if (!ids.has(r.id)) d.log.push([p.stamp, p.name, r.course, r.stage, r.level, r.problem, r.result, r.miss, r.hint, r.wrong, r.id]); });
        Local.save();
        return { ok: true };
      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす
      readQueue() { try { return JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) { return []; } },
      async save(payload) {
        const queue = api.readQueue().filter(q => !(q.name === payload.name && !q.records.length));
        queue.push({ ...payload, qid: uid() });
        safeStore.set(PENDING_KEY, JSON.stringify(queue));
        return api.flush();
      },
      pending() { return api.readQueue().length; },
      flushing: false,
      async flush() {
        if (api.flushing) return;
        api.flushing = true;
        try {
          for (let q = api.readQueue()[0]; q; q = api.readQueue()[0]) {
            await api.sendOne(q);
            safeStore.set(PENDING_KEY, JSON.stringify(api.readQueue().filter(x => x.qid !== q.qid)));
          }
        } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
        finally { api.flushing = false; }

    function parseProgress(s) {

      if (!courseOpen(p, st.course)) return false;
      if (p.unlockAll || p.cleared[st.id] || beforeStart(p, st)) return true;
      const list = courseStages(st.course), i = list.findIndex(s => s.id === st.id);
      return i === 0 || !!p.cleared[list[i - 1].id];
    }
    const levelDone = (p, st, lv) => (p.done[st.id] || []).includes(lv);
    const levelOpen = (p, st, lv) => lv === 1 || p.unlockAll || p.cleared[st.id] || levelDone(p, st, lv - 1) || (beforeStart(p, st) && p.start !== st.id);
    const nextLevel = (p, st) => LEVELS.find(lv => !levelDone(p, st, lv)) || 4;

      if (id === 'smile') return <g>{at.map(([x, y]) => <g key={x}><circle cx={x} cy={y} r="7.5" fill="#fde047" /><path d={`M${x - 4} ${y + 1} q4 4 8 0`} stroke="#a16207" strokeWidth="1.5" fill="none" /></g>)}</g>;
      if (id === 'flower') return <g>{at.map(([x, y]) => <g key={x}>{[0, 72, 144, 216, 288].map(a => <circle key={a} cx={x + 4.5 * Math.cos(a * Math.PI / 180)} cy={y + 4.5 * Math.sin(a * Math.PI / 180)} r="3.6" fill="#f9a8d4" />)}<circle cx={x} cy={y} r="2.6" fill="#facc15" /></g>)}</g>;
      return <g><circle cx="64" cy="88" r="7" fill="#fda4af" opacity=".8" /><circle cx="136" cy="88" r="7" fill="#fda4af" opacity=".8" /></g>;
    }

    // ロボタン（ぶひん・いろ・むねの「もじ ディスプレイ」）
    function Robotan({ mood = 'normal', talking = false, equip = {}, color = 'sky', sticker = '', display = '', size = 180, wave = false }) {

      const has = (slot) => equip[slot];
      const eyes = mood === 'happy'

        : mood === 'think'
          ? <g fill="#0c4a6e"><circle cx="78" cy="68" r="7" /><circle cx="122" cy="68" r="7" /><path d="M68 52 l18 4" stroke="#0c4a6e" strokeWidth="4" strokeLinecap="round" /><path d="M132 52 l-18 4" stroke="#0c4a6e" strokeWidth="4" strokeLinecap="round" /></g>
          : <g className="robo-blink"><circle cx="78" cy="70" r="9" fill="#0c4a6e" /><circle cx="122" cy="70" r="9" fill="#0c4a6e" /><circle cx="81" cy="67" r="3" fill="#fff" /><circle cx="125" cy="67" r="3" fill="#fff" /></g>;
      const mouth = talking
        ? <ellipse className="robo-mouth-talk" cx="100" cy="92" rx="10" ry="7" fill="#be123c" />
        : mood === 'happy' ? <path d="M84 88 q16 18 32 0 z" fill="#be123c" />
          : <path d="M88 90 q12 9 24 0" stroke="#0c4a6e" strokeWidth="4" fill="none" strokeLinecap="round" />;
      return (

          <rect x="72" y="192" width="20" height="22" rx="6" fill="#94a3b8" />
          <rect x="108" y="192" width="20" height="22" rx="6" fill="#94a3b8" />
          <rect x="64" y="208" width="34" height="14" rx="7" fill="#64748b" />
          <rect x="102" y="208" width="34" height="14" rx="7" fill="#64748b" />
          {has('feet') && drawPart(equip.feet)}
          {/* うで */}
          <rect x="32" y="136" width="30" height="14" rx="7" fill={c2} stroke={c3} strokeWidth="3" />
          <circle cx="30" cy="143" r="9" fill="#fbbf24" stroke="#b45309" strokeWidth="3" />
          <g className={wave ? 'robo-wave' : ''}>
            <rect x="138" y="136" width="30" height="14" rx="7" fill={c2} stroke={c3} strokeWidth="3" />
            <circle cx="170" cy="143" r="9" fill="#fbbf24" stroke="#b45309" strokeWidth="3" />
            {has('arm') && equip.arm !== 'arm_shield' && drawPart(equip.arm)}
          </g>
          {equip.arm === 'arm_shield' && drawPart('arm_shield')}
          {/* からだ と むねの もじ ディスプレイ */}
          <rect x="60" y="122" width="80" height="74" rx="20" fill={c1} stroke={c3} strokeWidth="4" />
          <rect x="74" y="136" width="52" height="44" rx="10" fill="#0f172a" stroke={c3} strokeWidth="2" />
          {display
            ? <text x="100" y={display.length > 2 ? 164 : 168} textAnchor="middle" fontSize={[30, 30, 22, 15, 11.5][Math.min(display.length, 4)]} fill="#67e8f9" fontFamily="Klee One, BIZ UDPGothic, sans-serif" fontWeight="600">{display}</text>
            : <g className="screen-flicker"><path d="M80 152 h12 M98 160 h22 M84 168 h14" stroke="#67e8f9" strokeWidth="3" strokeLinecap="round" /></g>}
          {/* みみ */}
          <rect x="26" y="58" width="16" height="34" rx="7" fill={c2} stroke={c3} strokeWidth="3" />
          <rect x="158" y="58" width="16" height="34" rx="7" fill={c2} stroke={c3} strokeWidth="3" />
          {has('ear') && drawPart(equip.ear)}
          {/* アンテナの ぼう */}
          <line x1="100" y1="30" x2="100" y2="12" stroke="#475569" strokeWidth="4" />
          {/* あたま */}
          <rect x="40" y="28" width="120" height="92" rx="30" fill={c1} stroke={c3} strokeWidth="4" />
          <rect x="54" y="42" width="92" height="64" rx="20" fill="#f0f9ff" />
          {eyes}

          {has('head') && drawPart(equip.head)}

    const roboLook = (p) => ({ equip: p.equip || {}, color: p.color || 'sky', sticker: p.sticker || '', display: p.last || '' });

    // ふきだしつきの ロボタン
    function RoboPanel({ size = 150, look = {}, row = false }) {
      const robo = useRobo();
      return (
        <div className={`flex ${row ? 'flex-row items-center' : 'flex-col items-center'} gap-2`}>

          {robo.state.text && (

    // =====================================================================
    //  8. がめんの ぶひん
    // =====================================================================
    function Btn({ children, onClick, color = '#0ea5e9', light = '#e0f2fe', className = '', disabled, big, style }) {
      return (
        <button onClick={disabled ? undefined : onClick} disabled={disabled}
          className={`btn3d rounded-3xl font-bold ${big ? 'text-3xl px-10 py-5' : 'text-xl px-6 py-3'} ${disabled ? 'opacity-40' : ''} ${className}`}
          style={{ background: light, color, borderColor: color, borderWidth: '3px', ...style }}>
          {children}
        </button>
      );
    }
    function Dots({ total, current }) {
      return (
        <div className="flex gap-2 items-center">
          {Array.from({ length: total }).map((_, i) => (
            <div key={i} className={`w-5 h-5 rounded-full border-2 ${i < current ? 'bg-amber-400 border-amber-500' : i === current ? 'bg-sky-400 border-sky-600 scale-125' : 'bg-white border-slate-300'}`} />
          ))}
        </div>
      );
    }
    const Screw = ({ size = 28 }) => (
      <svg viewBox="0 0 40 40" width={size} height={size} style={{ display: 'inline-block', verticalAlign: 'middle' }}>
        <polygon points="20,3 35,11.5 35,28.5 20,37 5,28.5 5,11.5" fill="#cbd5e1" stroke="#475569" strokeWidth="3" strokeLinejoin="round" />
        <circle cx="20" cy="20" r="9" fill="#f1f5f9" stroke="#475569" strokeWidth="2" />
        <path d="M20 14 v12 M14 20 h12" stroke="#475569" strokeWidth="3.5" strokeLinecap="round" />
      </svg>
    );

    // ピース 1まい（SVG）
    function badgeAt(part) {
      const v = part.vb;
      if (part.corner) return [v.x + 8, v.y + 8];
      const [sx, sy] = part.start, dx = sx - part.cx, dy = sy - part.cy, L = Math.hypot(dx, dy) || 1;
      const cl = (a, lo, hi) => Math.min(Math.max(a, lo), hi);
      return [cl(sx + dx / L * 9, v.x + 7, v.x + v.w - 7), cl(sy + dy / L * 9, v.y + 7, v.y + v.h - 7)];
    }
    function PieceSvg({ part, w, h, showNum = true, glow = false }) {
      const v = part.vb;
      const [bx, by] = badgeAt(part);
      return (
        <svg viewBox={`${v.x} ${v.y} ${v.w} ${v.h}`} width={w} height={h} style={{ display: 'block', overflow: 'visible', filter: glow ? 'drop-shadow(0 0 6px #facc15) drop-shadow(0 0 3px #f59e0b)' : undefined }}>
          <g transform={part.tf || undefined}>
            {part.paths.map((d, i) => <path key={i} d={d} fill="none" stroke={part.col} strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" />)}
          </g>
          {!part.corner && <circle cx={part.start[0]} cy={part.start[1]} r="2.8" fill="#fff" stroke={part.col} strokeWidth="1.3" />}
          {showNum && <g>
            <circle cx={bx} cy={by} r="6" fill="#fff" stroke={part.col} strokeWidth="1.4" />
            <text x={bx} y={by + 2.8} fontSize="8" textAnchor="middle" fontWeight="700" fill={part.col} fontFamily="BIZ UDPGothic, sans-serif">{part.num}</text>
          </g>}
        </svg>
      );
    }

    // みほん（ちいさい もじ）
    function Mihon({ it, size = 70 }) {
      if (it.kind === 'word') {
        return (
          <div className="flex flex-col items-center">
            {it.letters.map((ch, i) => { const t = tateOf(ch); return (
              <svg key={i} viewBox="0 0 109 109" width={size * 0.5} height={size * 0.5} style={{ display: 'block' }}>
                <rect x="2" y="2" width="105" height="105" fill="#fff" stroke="#cbd5e1" strokeWidth="3" />
                <g transform={t.tf || undefined}>{STROKES[ch].map((d, j) => <path key={j} d={d} fill="none" stroke="#334155" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" />)}</g>
              </svg>); })}
          </div>
        );
      }
      return (
        <svg viewBox="0 0 109 109" width={size} height={size} style={{ display: 'block' }}>
          <rect x="1" y="1" width="107" height="107" rx="8" fill="#fff" stroke="#cbd5e1" strokeWidth="2" />
          {STROKES[it.val].map((d, i) => <path key={i} d={d} fill="none" stroke="#334155" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" />)}
        </svg>
      );
    }

    // わく（ピースを はめる ところ）
    function Frame({ it, level, placed, sq, glowPart, draft, onPointerDown, frameRef }) {
      const n = it.n, H = 109 * n;
      const real = it.parts;
      const cross = level <= 2;
      return (
        <svg ref={frameRef} viewBox={`0 0 109 ${H}`} width={sq} height={sq * n} onPointerDown={onPointerDown} data-frame={it.key}
          style={{ display: 'block', touchAction: 'none', overflow: 'visible', filter: 'drop-shadow(0 4px 0 #cbd5e1)' }}>
          {Array.from({ length: n }).map((_, j) => (
            <g key={j} transform={`translate(0 ${109 * j})`}>
              <rect x="0.5" y="0.5" width="108" height="108" rx={n > 1 ? 1 : 6} fill="#fff" stroke="#475569" strokeWidth={n > 1 ? 1.4 : 1.1} />
              {cross && <g stroke="#cbd5e1" strokeWidth=".9" strokeDasharray="3 3"><line x1="54.5" y1="4" x2="54.5" y2="105" /><line x1="4" y1="54.5" x2="105" y2="54.5" /></g>}
            </g>
          ))}
          {/* ★2：小さい字を 書く ところに むらさきの 点線の わく */}
          {it.kind === 'word' && level === 2 && real.filter(p => SMALL.includes(p.ch)).map(p => (
            <rect key={'sm' + p.id} x={p.box.x - 6} y={p.box.y - 6 + 109 * p.slot} width={p.box.width + 12} height={p.box.height + 12} rx="4" fill="none" stroke={MARK_COL} strokeWidth="1.2" strokeDasharray="3 2" />
          ))}
          {/* ★1：かげ と 書きはじめの 点 */}
          {level === 1 && real.map(p => (
            <g key={'k' + p.id} transform={`translate(0 ${109 * p.slot})`}>
              <g transform={p.tf || undefined}>{p.paths.map((d, i) => <path key={i} d={d} fill="none" stroke={p.col} strokeOpacity=".22" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round" />)}</g>
              <circle cx={p.start[0]} cy={p.start[1]} r="2.8" fill={p.col} />
            </g>
          ))}
          {level === 2 && it.kind !== 'word' && real.map(p => <circle key={'s' + p.id} cx={p.start[0]} cy={p.start[1]} r="2.6" fill="#94a3b8" />)}
          {/* ヒント：ただしい ところが ひかる */}
          {glowPart && (
            <g transform={`translate(0 ${109 * glowPart.slotAt})`} className="glow-path">
              <g transform={glowPart.tf || undefined}>{glowPart.paths.map((d, i) => <path key={i} d={d} fill="none" stroke={glowPart.col} strokeWidth="11" strokeLinecap="round" strokeLinejoin="round" />)}</g>
            </g>
          )}
          {/* はまった ピース */}
          {Object.entries(placed).map(([id, slot]) => {
            const p = real.find(x => x.id === id); if (!p) return null;
            return (
              <g key={'pl' + id} transform={`translate(0 ${109 * slot})`}>
                <g transform={p.tf || undefined}>{p.paths.map((d, i) => <path key={i} d={d} fill="none" stroke={p.col} strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" />)}</g>
              </g>
            );
          })}
          {/* ★3：えらんだ ピース（おく ばしょを きめる まえ） */}
          {draft && (
            <g transform={`translate(${draft.x - draft.part.cx} ${draft.y - draft.part.cy})`} opacity=".7">
              <g transform={draft.part.tf || undefined}>{draft.part.paths.map((d, i) => <path key={i} d={d} fill="none" stroke={draft.part.col} strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="2 3" />)}</g>
            </g>
          )}
        </svg>
      );
    }

    // ピースの ならべかた（はみだすときは 小さく する）
    function trayScale(parts, k, W, H) {
      for (let f = 1; f >= 0.35; f -= 0.05) {
        let x = 0, y = 0, rowH = 0, ok = true;
        for (const p of parts) {
          const w = p.vb.w * k * f + 20, h = p.vb.h * k * f + 20;
          if (w > W) { ok = false; break; }
          if (x + w > W) { y += rowH + 12; x = 0; rowH = 0; }
          x += w + 12; rowH = Math.max(rowH, h);
        }
        if (ok && y + rowH <= H) return f;
      }
      return 0.35;
    }

    // =====================================================================
    //  9. パズル（★1〜★3）
    // =====================================================================
    function Puzzle({ itemKey, stage, level, settings, easy, look, onSolved, firstOfRound }) {
      const robo = useRobo();
      const win = useWin();
      const it = useMemo(() => buildItem(itemKey), [itemKey]);
      const real = it.parts;
      const showNum = level <= 2 || settings.num;
      const lenient = level <= 2 || easy;
      // ★1・★2 は 書き順の じゅん。★3 は 番号を 出すときだけ じゅんばん（ことばは じゆう）
      const ordered = level <= 2 || (level === 3 && settings.num && it.kind !== 'word');
      const trayAll = useMemo(() => {
        if (level <= 2) return [...real];
        const a = shuffle([...real, ...(it.dummy ? [it.dummy] : [])]);
        // 番号の じゅんに ならんで しまったら ならべなおす
        if (a.length > 1 && a.every((p, i) => i === 0 || a[i - 1].num <= p.num)) a.reverse();
        return a;
      }, [itemKey, level]);
      const [placed, setPlaced] = useState({});     // ピースの id → マスの ばんごう
      const [gone, setGone] = useState({});         // けした まちがいやすい ピース
      const [draft, setDraft] = useState(null);     // ★3：えらんだ ピースの いち
      const [drag, setDrag] = useState(null);
      const [hint, setHint] = useState(0);
      const [miss, setMiss] = useState(0);
      const [fly, setFly] = useState(null);
      const [done, setDone] = useState(false);
      const [shakeId, setShakeId] = useState(null);
      const stats = useRef({ miss: 0, hint: 0, wrong: [] });
      const frameRef = useRef(null);
      const trayRefs = useRef({});
      const dragRef = useRef(null);
      const busy = useRef(false);

      const filled = (j) => Object.values(placed).includes(j);
      const slotsFor = (p) => it.kind === 'word' ? it.letters.map((ch, j) => j).filter(j => it.letters[j] === p.ch && !filled(j)) : [0];
      const remaining = real.filter(p => !(p.id in placed)).sort((a, b) => a.num - b.num);
      const nextPart = remaining[0] || null;
      // ことばで おなじ もじが 2つ あるときは、どちらでも よい
      const sameAsNext = (p) => nextPart && (p.id === nextPart.id || (it.kind === 'word' && p.ch === nextPart.ch));
      const glowPart = hint >= 2 && nextPart ? { ...nextPart, slotAt: slotsFor(nextPart)[0] ?? nextPart.slot } : null;

      // おおきさ
      const leftW = win.w >= 1100 ? 250 : 190;
      const availW = win.w - leftW - 48;
      const availH = win.h - 110;
      const sq = it.kind === 'word'
        ? Math.max(84, Math.min((availH - 8) / it.n, availW * 0.3, 175))
        : Math.max(200, Math.min(availH - 10, availW * 0.47, 520));
      const k = sq / 109;
      const trayW = availW - sq - 28;
      const infoH = 120, ctrlH = draft ? 84 : 0;
      // ★1 は 1まいずつ 出るので、1まいが 入る 大きさに する
      const f = useMemo(() => level === 1
        ? Math.min(...trayAll.map(p => trayScale([p], k, trayW - 16, availH - infoH - 84)))
        : trayScale(trayAll, k, trayW - 16, availH - infoH - 84), [trayAll, k, trayW, availH]);

      const prompt = () => {
        if (it.kind === 'word') return `えを みて、「${it.val}」を つくろう。`;
        if (it.kind === 'daku') return `「${yomi(it.val)}」を つくろう。もとの もじと、${HANDAKU.includes(it.val) ? 'まる' : 'てんてん'}の ピースだよ。`;
        return `「${yomi(it.val)}」を つくろう。`;
      };
      const howTo = () => {
        if (level === 1) return 'ピースを おすと、かげの ところに はまるよ。ゆびで うごかしても いいよ。';
        if (level === 2) return it.kind === 'word' ? 'うえの マスから じゅんばんに はめよう。' : '①から じゅんばんに ピースを はめよう。';
        if (lenient) return 'ピースを えらんで はめよう。にている ピースに きをつけてね。';
        return 'ピースを えらんで、わくの なかの ただしい ばしょに おこう。にている ピースに きをつけてね。';
      };
      useEffect(() => {
        robo.say(prompt(), { speech: (firstOfRound ? howTo() + ' ' : '') + prompt() });
        robo.setRepeat(() => robo.say(prompt()));
      }, [itemKey]);

      const hintText = () => {
        const p = nextPart; if (!p) return '';
        if (it.kind === 'word') {
          let t = `うえから ${p.slot + 1}ばんめは「${p.ch}」だよ。`;
          if (SMALL.includes(p.ch)) t += 'ちいさい もじは、マスの みぎうえに かくよ。';
          if (p.ch === 'ー') t += 'たてがきの のばす ぼうは、たてに かくよ。';
          return t;
        }
        if (it.kind === 'daku') return p.num === 1 ? `まず、もとの もじ「${baseOf(it.val)}」の ピースを はめよう。` : `つぎは ${p.mark === '゜' ? 'まる' : 'てんてん'}。みぎうえに つけるよ。`;
        let t = `つぎは ${p.num}かくめ。${CNAMES[p.num - 1]}の ピースだよ。`;
        if (level === 3 && it.dummy && !gone.dummy) t += 'にている ピースに きをつけてね。';
        return t;
      };

      const rectOfSlot = (p, slot) => {
        const r = frameRef.current.getBoundingClientRect(), kx = r.width / 109, ky = r.height / (109 * it.n);
        return { left: r.left + p.vb.x * kx, top: r.top + (p.vb.y + 109 * slot) * ky, width: p.vb.w * kx, height: p.vb.h * ky };
      };
      const rectOfTray = (p) => {
        const el = trayRefs.current[p.id];
        if (!el) return null;
        const r = el.getBoundingClientRect();
        return { left: r.left, top: r.top, width: r.width, height: r.height };
      };

      const applyHint = (lv) => {
        if (done) return;
        lv = Math.min(3, lv);
        setHint(lv);
        stats.current.hint = Math.max(stats.current.hint, lv);
        if (lv === 1) robo.say(hintText(), { mood: 'think' });
        else if (lv === 2) robo.say('ひかって いる ところに はめるよ。' + hintText());
        else if (nextPart) {
          robo.say('みて いてね。こう はめるよ。');
          const from = rectOfTray(nextPart), slot = slotsFor(nextPart)[0] ?? nextPart.slot;
          if (from && frameRef.current) {
            setFly({ part: nextPart, from, to: rectOfSlot(nextPart, slot), ghost: true, done: () => { setFly(null); robo.say('こんどは じぶんで はめて みよう。'); } });
          }
        }
      };

      const mistake = (label, text) => {
        stats.current.miss++;
        if (label) stats.current.wrong.push(label);
        Sound.retry();
        robo.say(text, { mood: 'think' });
        setMiss(m => {
          const n = m + 1;
          if (n >= 3 && hint < 3) setTimeout(() => applyHint(3), 1800);
          return n;
        });
      };

      const place = (p, slot) => {
        Sound.click();
        const np = { ...placed, [p.id]: slot };
        setPlaced(np); setDraft(null); setMiss(0); setHint(0);
        if (real.every(x => x.id in np)) {
          setDone(true);
          const st = stats.current;
          setTimeout(() => onSolved({ miss: st.miss, hint: st.hint, wrong: uniq(st.wrong) }), 450);
        }
      };

      const flyIn = (p, slot) => {
        const from = rectOfTray(p);
        if (!from || !frameRef.current) { place(p, slot); return; }
        busy.current = true;
        setFly({ part: p, from, to: rectOfSlot(p, slot), done: () => { setFly(null); busy.current = false; place(p, slot); } });
      };

      // ピースを ためす（at が null なら タップ）
      const tryPart = (p0, at) => {
        if (done || busy.current) return;
        let p = p0;
        if (p.dummy) {
          setGone(g => ({ ...g, [p.id]: true })); setDraft(null);
          mistake(p.label, p.explain);
          return;
        }
        if (ordered && nextPart && !sameAsNext(p)) {
          setShakeId(p.id); setTimeout(() => setShakeId(null), 500);
          robo.say(`つぎは ${CIRC[nextPart.num - 1]}の ピースだよ。`, { mood: 'think' });
          return;
        }
        if (ordered && it.kind === 'word' && nextPart && p.id !== nextPart.id) p = nextPart;
        const slots = ordered && it.kind === 'word' ? [nextPart.slot] : slotsFor(p);
        if (!slots.length) return;
        if (at == null) {
          if (lenient) { flyIn(p, slots[0]); return; }
          setDraft({ part: p, x: 54.5, y: 109 * it.n / 2 });
          robo.say('わくの なかの、おきたい ところを おしてね。やじるしの ボタンでも うごかせるよ。');
          return;
        }
        const inside = at.x > -10 && at.x < 119 && at.y > -10 && at.y < 109 * it.n + 10;
        if (!inside) return 'out';
        if (it.kind === 'word') {
          if (lenient) {
            const j = slots.reduce((a, b) => Math.abs(at.y - (109 * b + 54.5)) < Math.abs(at.y - (109 * a + 54.5)) ? b : a);
            place(p, j); return;
          }
          const j = Math.max(0, Math.min(it.n - 1, Math.floor(at.y / 109)));
          if (slots.includes(j)) { place(p, j); return; }
          setDraft(null);
          mistake('ばしょ', 'その マスじゃ ないよ。うえから じゅんばんに かんがえて みよう。');
          return 'miss';
        }
        if (lenient || Math.hypot(at.x - p.cx, at.y - p.cy) <= 17) { place(p, 0); return; }
        setDraft(null);
        mistake('ばしょ', 'おしい！ ばしょが ちがうよ。もういちど ピースを えらんで おいて みよう。');
        return 'miss';
      };

      // ゆびで うごかす
      const onDown = (e, p) => {
        if (done || busy.current) return;
        e.preventDefault();
        Sound.get();
        const r = e.currentTarget.getBoundingClientRect();
        const W = p.vb.w * k, H = p.vb.h * k;
        dragRef.current = { p, x0: e.clientX, y0: e.clientY, fx: (e.clientX - r.left) / r.width, fy: (e.clientY - r.top) / r.height, W, H, moved: false };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      };
      const onMove = (e) => {
        const d = dragRef.current; if (!d) return;
        if (!d.moved && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 10) return;
        d.moved = true;
        setDrag({ p: d.p, left: e.clientX - d.fx * d.W, top: e.clientY - d.fy * d.H, W: d.W, H: d.H });
      };
      const onUp = (e) => {
        const d = dragRef.current; dragRef.current = null;
        if (!d) return;
        setDrag(null);
        if (!d.moved) { Sound.tap(); tryPart(d.p, null); return; }
        const r = frameRef.current.getBoundingClientRect();
        const cx = e.clientX - d.fx * d.W + d.W / 2, cy = e.clientY - d.fy * d.H + d.H / 2;
        // ピースの まんなかの いち（わくの めもり）
        const pc = { x: (cx - r.left) / (r.width / 109) - (d.p.vb.x + d.p.vb.w / 2) + d.p.cx, y: (cy - r.top) / (r.height / (109 * it.n)) - (d.p.vb.y + d.p.vb.h / 2) + d.p.cy };
        tryPart(d.p, pc);
      };
      // ★3：わくを おして おく
      const onFrameDown = (e) => {
        if (!draft || done) return;
        const r = frameRef.current.getBoundingClientRect();
        const cl = (v, hi) => Math.max(0, Math.min(hi, v));
        const at = { x: cl((e.clientX - r.left) / (r.width / 109), 109), y: cl((e.clientY - r.top) / (r.height / (109 * it.n)), 109 * it.n) };
        setDraft(dr => ({ ...dr, ...at }));
        setTimeout(() => tryPart(draft.part, at), 250);
      };
      const nudge = (dx, dy) => setDraft(dr => dr && ({ ...dr, x: Math.max(0, Math.min(109, dr.x + dx)), y: Math.max(0, Math.min(109 * it.n, dr.y + dy)) }));

      const pic = it.kind === 'word' ? picOf(itemKey) : null;
      const visible = level === 1 ? (nextPart ? [nextPart] : []) : trayAll.filter(p => !(p.id in placed) && !gone[p.id]);
      const hintGlow = miss >= 2 && hint < 3;

      return (
        <div className="flex gap-4 px-4 pb-4" style={{ height: win.h - 92 }}>
          {/* ひだり：ロボタン */}
          <div className="flex flex-col items-center gap-3 shrink-0" style={{ width: leftW }}>
            <RoboPanel size={leftW >= 250 ? 140 : 110} look={look} />
            <div className="flex flex-col gap-2 w-full px-2">
              <Btn onClick={() => robo.repeat()} color="#b45309" light="#fef3c7">🔊 もういちど</Btn>
              <Btn onClick={() => applyHint(hint + 1)} color="#ca8a04" light="#fef9c3" className={hintGlow ? 'animate-hint' : ''} disabled={done}>💡 ヒント{hint ? ` ${hint}` : ''}</Btn>
            </div>
          </div>
          {/* まんなか：わく */}
          <div className="flex items-center justify-center shrink-0" style={{ width: sq + 8 }}>
            <Frame it={it} level={level} placed={placed} sq={sq} glowPart={glowPart} draft={draft} frameRef={frameRef} onPointerDown={onFrameDown} />
          </div>
          {/* みぎ：みほん と ピース */}
          <div className="flex-1 flex flex-col gap-3 min-w-0">
            <div className="flex items-center gap-4 bg-white rounded-3xl border-4 border-slate-100 px-4" style={{ height: infoH }}>
              {it.kind !== 'word' && <div className="text-center"><div className="kana text-6xl text-slate-600">{yomi(it.val)}</div><div className="text-sm text-slate-400 mt-1">よみかた</div></div>}
              {it.kind !== 'word' && level >= 2 && settings.mihon && <div className="text-center"><Mihon it={it} size={84} /><div className="text-xs text-slate-400">みほん</div></div>}
              {pic && <img src={IMG + pic.file + '.jpg'} alt="" className="h-[104px] w-[104px] object-contain rounded-2xl" onError={(e) => { e.target.style.display = 'none'; }} />}
              {it.kind === 'word' && level === 2 && settings.mihon && <div className="flex items-center gap-1"><Mihon it={it} size={Math.min(56, 210 / it.n)} /><span className="text-xs text-slate-400">みほん</span></div>}
              <div className="ml-auto text-right text-slate-500 font-bold">
                <div className="text-lg">{levelLabel(stage, level)}</div>
                {level === 3 && !lenient && <div className="text-sm">ピースを えらんで、ばしょを きめよう</div>}
              </div>
            </div>
            {draft && (
              <div className="flex items-center gap-2 bg-sky-50 rounded-3xl border-4 border-sky-200 px-3 py-2" style={{ height: ctrlH - 8 }}>
                <span className="text-lg font-bold text-sky-700 mr-1">うごかす</span>
                {[['◀', -4, 0], ['▲', 0, -4], ['▼', 0, 4], ['▶', 4, 0]].map(([t, dx, dy]) => (
                  <button key={t} onClick={() => nudge(dx, dy)} className="btn3d bg-white border-sky-400 border-4 rounded-2xl w-14 h-14 text-2xl font-bold text-sky-700">{t}</button>
                ))}
                <Btn onClick={() => tryPart(draft.part, { x: draft.x, y: draft.y })} color="#059669" light="#d1fae5" className="ml-2">✔ ここに はめる</Btn>
                <button onClick={() => setDraft(null)} className="ml-auto text-slate-500 font-bold px-3">✖ もどす</button>
              </div>
            )}
            <div className="flex-1 flex flex-wrap content-center items-center justify-center gap-3 bg-slate-50 rounded-3xl border-4 border-dashed border-slate-200 p-2 overflow-hidden">
              {visible.map(p => {
                const W = p.vb.w * k * f, H = p.vb.h * k * f;
                const isSel = draft && draft.part.id === p.id;
                const glowThis = hint >= 2 && nextPart && sameAsNext(p) && !p.dummy;
                const dimmed = ordered && nextPart && !sameAsNext(p) && level === 2;
                return (
                  <div key={p.id} ref={el => { trayRefs.current[p.id] = el; }}
                    className={`piece-card rounded-2xl bg-white border-4 p-2 cursor-pointer ${shakeId === p.id ? 'animate-shake' : ''} ${p.dummy && gone[p.id] ? 'fade-out' : ''}`}
                    style={{ borderColor: isSel ? '#0ea5e9' : glowThis ? '#facc15' : '#e2e8f0', opacity: (drag && drag.p.id === p.id) || (fly && fly.part.id === p.id && !fly.ghost) ? 0.2 : dimmed ? 0.55 : 1, transform: isSel ? 'translateY(-6px)' : undefined, boxShadow: '0 4px 0 #cbd5e1' }}
                    data-pid={p.id} data-dummy={p.dummy ? '1' : undefined}
                    onPointerDown={(e) => onDown(e, p)} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={() => { dragRef.current = null; setDrag(null); }}>
                    <PieceSvg part={p} w={W} h={H} showNum={showNum} glow={glowThis} />
                  </div>
                );
              })}
            </div>
          </div>
          {drag && (
            <div style={{ position: 'fixed', left: drag.left, top: drag.top, width: drag.W, height: drag.H, pointerEvents: 'none', zIndex: 40, opacity: 0.9 }}>
              <PieceSvg part={drag.p} w={drag.W} h={drag.H} showNum={showNum} />
            </div>
          )}
          {fly && <Flyer fly={fly} showNum={showNum} />}
        </div>
      );
    }

    // ピースが すーっと うごく
    function Flyer({ fly, showNum }) {
      const [pos, setPos] = useState(fly.from);
      useEffect(() => {
        const a = requestAnimationFrame(() => requestAnimationFrame(() => setPos(fly.to)));
        const t = setTimeout(() => fly.done(), fly.ghost ? 1500 : 650);
        return () => { cancelAnimationFrame(a); clearTimeout(t); };
      }, []);
      return (
        <div style={{ position: 'fixed', left: pos.left, top: pos.top, width: pos.width, height: pos.height, pointerEvents: 'none', zIndex: 45,
          transition: `all ${fly.ghost ? 1.1 : 0.55}s ease-in-out`, opacity: fly.ghost ? 0.75 : 1 }}>
          <PieceSvg part={fly.part} w="100%" h="100%" showNum={showNum && !fly.ghost} glow={fly.ghost} />
        </div>
      );
    }

    // =====================================================================
    // 10. ★4 どの もじ？
    // =====================================================================
    function Choose({ itemKey, stage, look, onSolved, firstOfRound }) {
      const robo = useRobo();
      const win = useWin();
      const it = useMemo(() => buildItem(itemKey), [itemKey]);
      const choices = useMemo(() => makeChoices(itemKey, stage), [itemKey]);
      const order = useMemo(() => {
        const a = shuffle(it.parts);
        if (a.length > 1 && a.every((p, i) => i === 0 || a[i - 1].num <= p.num)) a.reverse();
        return a;
      }, [itemKey]);
      const [gone, setGone] = useState({});
      const [hint, setHint] = useState(0);
      const [miss, setMiss] = useState(0);
      const [done, setDone] = useState(null);
      const stats = useRef({ miss: 0, hint: 0, wrong: [] });
      const isWord = it.kind === 'word';
      const prompt = isWord ? 'ピースを あわせると、どの ことばに なるかな？' : 'ピースを あわせると、どの もじに なるかな？';
      useEffect(() => {
        robo.say(prompt, { speech: (firstOfRound ? 'ピースを よく みてね。' : '') + prompt });
        robo.setRepeat(() => robo.say(prompt));
      }, [itemKey]);
      const leftW = win.w >= 1100 ? 250 : 190;
      const k = Math.min(3.2, (win.w - leftW - 120) / 109 / (isWord ? 2.6 : 1.9), (win.h - 380) / 109 / (isWord ? 1.2 : 1));
      const applyHint = (lv) => {
        if (done) return;
        lv = Math.min(3, lv); setHint(lv); stats.current.hint = Math.max(stats.current.hint, lv);
        if (lv === 1) robo.say(isWord ? 'ちいさい もじ や のばす ぼうの ピースを よく みてね。' : '①の ピースから じゅんばんに、あたまの なかで くみたてて みよう。', { mood: 'think' });
        else if (lv === 2) robo.say('ピースを くみたてると こうなるよ。');
        else robo.say('ひかって いる ボタンだよ。');
      };
      const choose = (c) => {
        if (done || gone[c]) return;
        if (c === it.val) {
          Sound.click();
          setDone(c);
          const st = stats.current;
          setTimeout(() => onSolved({ miss: st.miss, hint: st.hint, wrong: uniq(st.wrong) }), 400);
          return;
        }
        stats.current.miss++; stats.current.wrong.push(c);
        setGone(g => ({ ...g, [c]: true }));
        Sound.retry();
        const ex = !isWord && EXPLAIN[it.val] ? EXPLAIN[it.val] : isWord ? 'ちいさい もじ や のばす ぼうを よく みてね。' : 'ピースの かたちを よく みてね。';
        robo.say(`それは「${c}」だよ。${ex}`, { mood: 'think' });
        setMiss(m => { const n = m + 1; if (n >= 2 && hint < 3) setTimeout(() => applyHint(3), 1500); return n; });
      };
      const pic = isWord ? picOf(itemKey) : null;
      return (
        <div className="flex gap-4 px-4 pb-4" style={{ minHeight: win.h - 92 }}>
          <div className="flex flex-col items-center gap-3 shrink-0" style={{ width: leftW }}>
            <RoboPanel size={leftW >= 250 ? 140 : 110} look={look} />
            <div className="flex flex-col gap-2 w-full px-2">
              <Btn onClick={() => robo.repeat()} color="#b45309" light="#fef3c7">🔊 もういちど</Btn>
              <Btn onClick={() => applyHint(hint + 1)} color="#ca8a04" light="#fef9c3" className={miss >= 1 && hint < 3 ? 'animate-hint' : ''} disabled={!!done}>💡 ヒント{hint ? ` ${hint}` : ''}</Btn>
            </div>
          </div>
          <div className="flex-1 flex flex-col items-center gap-5">
            <div className="flex items-center gap-6 bg-slate-50 rounded-3xl border-4 border-dashed border-slate-200 p-4 flex-wrap justify-center">
              {pic && <img src={IMG + pic.file + '.jpg'} alt="" className="w-28 h-28 object-contain rounded-2xl" onError={(e) => { e.target.style.display = 'none'; }} />}
              {order.map(p => (
                <div key={p.id} className="rounded-2xl bg-white border-4 border-slate-200 p-2" style={{ boxShadow: '0 4px 0 #cbd5e1' }}>
                  <PieceSvg part={p} w={p.vb.w * k} h={p.vb.h * k} showNum={true} />
                </div>
              ))}
              {hint >= 2 && (
                <div className="flex flex-col items-center">
                  <Frame it={it} level={1} placed={{}} sq={isWord ? Math.min(90, 260 / it.n) : 130} />
                  <div className="text-sm text-slate-500 font-bold mt-1">くみたてると…</div>
                </div>
              )}
            </div>
            <div className="text-2xl font-bold text-slate-600">どれかな？ ボタンを おそう</div>
            <div className="flex gap-5 flex-wrap justify-center">
              {choices.map(c => {
                const right = c === it.val;
                const glow = hint >= 3 && right && !done;
                if (gone[c]) return <div key={c} className="rounded-3xl border-4 border-dashed border-slate-200 flex items-center justify-center text-slate-300 text-2xl" style={{ minWidth: isWord ? 220 : 150, height: 150 }}>✖</div>;
                return (
                  <button key={c} onClick={() => choose(c)}
                    className={`btn3d rounded-3xl border-4 bg-white kana text-slate-700 px-6 ${glow ? 'animate-hint' : ''}`}
                    style={{ minWidth: isWord ? 220 : 150, height: 150, fontSize: isWord ? 54 : 96, borderColor: done === c ? '#22c55e' : glow ? '#facc15' : '#0ea5e9', background: done === c ? '#dcfce7' : '#fff' }}>
                    {c}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 11. 1回ぶん（5もん）
    // =====================================================================
    function Activity({ stage, level, progress, settings, look, onSolvedOne, onQuit, onFinish }) {
      const robo = useRobo();
      const key = stage.id + '-' + level;
      const plan = useMemo(() => {
        const r = progress.resume && progress.resume[key];
        if (r && r.items && r.i < r.items.length) return { items: r.items, i: r.i };
        return { items: makeRound(stage, level), i: 0 };
      }, []);
      const [i, setI] = useState(plan.i);
      const [cele, setCele] = useState(null);
      const itemKey = plan.items[i];

      const solved = (res) => {
        const rec = {
          id: uid(), course: courseOf(stage.course).title, stage: stage.name, level: levelLabel(stage, level), problem: itemText(itemKey),
          result: res.miss === 0 && res.hint === 0 ? '○' : '△', miss: res.miss, hint: res.hint, wrong: res.wrong.join('・'),
        };
        onSolvedOne(itemKey, rec, { items: plan.items, i: i + 1 });
        Sound.correct();
        const pic = picOf(itemKey), v = itemText(itemKey);
        const praise = pickOne(['できたね！', 'すごい！', 'ぴったり！', 'やったね！', 'かんせい！']);
        let speech = `${praise} `;
        if (itemKey.startsWith('w:')) speech += `${v}！`;
        else speech += pic ? `${v}！ ${pic.word}の ${v}` : `${v}！`;
        robo.say(praise, { mood: 'happy', speech });
        setCele({ itemKey, pic, praise, rec });
        setTimeout(() => Sound.screw(), 500);
      };
      const next = () => {
        Sound.tap();
        setCele(null);
        if (i + 1 < plan.items.length) setI(i + 1);
        else onFinish();
      };

      return (
        <div className="min-h-screen" style={{ background: courseOf(stage.course).light }}>
          <div className="flex items-center gap-4 px-4" style={{ height: 80 }}>
            <Btn onClick={() => { robo.stop(); onQuit(); }} color="#64748b" light="#fff">◀ やめる</Btn>
            <Dots total={plan.items.length} current={i} />
            <div className="text-2xl font-bold" style={{ color: courseOf(stage.course).color }}>{stage.name}</div>
          </div>
          {level <= 3
            ? <Puzzle key={itemKey + i} itemKey={itemKey} stage={stage} level={level} settings={settings} easy={progress.easy} look={look} onSolved={solved} firstOfRound={i === plan.i} />
            : <Choose key={itemKey + i} itemKey={itemKey} stage={stage} look={look} onSolved={solved} firstOfRound={i === plan.i} />}
          {cele && <Celebrate cele={cele} onNext={next} last={i + 1 >= plan.items.length} />}
        </div>
      );
    }

    function Celebrate({ cele, onNext, last }) {
      const v = itemText(cele.itemKey), pic = cele.pic, isWord = cele.itemKey.startsWith('w:');
      return (
        <div className="fixed inset-0 bg-slate-900/30 flex items-center justify-center z-50 p-4">
          <div className="animate-popup bg-white rounded-[2.5rem] border-8 border-amber-300 p-6 flex flex-col items-center gap-3 max-w-lg w-full">
            <div className="text-4xl font-bold text-amber-500">{cele.praise}</div>
            <div className="flex items-center gap-6">
              <div className="kana text-slate-700" style={{ fontSize: isWord ? 64 : 120 }}>{v}</div>
              {pic && <img src={IMG + pic.file + '.jpg'} alt="" className="w-40 h-40 object-contain rounded-3xl" onError={(e) => { e.target.style.display = 'none'; }} />}
            </div>
            {pic && !isWord && (
              <div className="kana text-4xl text-slate-600">
                {[...pic.word].map((c, j) => <span key={j} style={{ color: j === pic.at ? '#e53935' : undefined }}>{c}</span>)}<span className="text-2xl"> の </span><span style={{ color: '#e53935' }}>{v}</span>
              </div>
            )}
            <div className="screw-pop flex items-center gap-2 text-3xl font-bold text-slate-600"><Screw size={40} /> ねじ ＋1</div>
            <Btn big onClick={onNext} color="#0284c7" light="#e0f2fe">{last ? 'おわり ▶' : 'つぎへ ▶'}</Btn>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 12. がめん（ログイン・ホーム・ステージ・けっか・こうじょう・ずかん）
    // =====================================================================
    const NAME_COLORS = [['#0284c7', '#e0f2fe'], ['#ea580c', '#ffedd5'], ['#059669', '#d1fae5'], ['#7c3aed', '#ede9fe'], ['#db2777', '#fce7f3'], ['#ca8a04', '#fef9c3'], ['#0891b2', '#cffafe'], ['#dc2626', '#fee2e2']];

    function LoginScreen({ students, onSelect, onTeacher, demo }) {
      return (
        <div className="min-h-screen flex flex-col items-center justify-center gap-6 p-6 bg-gradient-to-b from-sky-100 to-sky-50">
          <div className="flex items-center gap-6 flex-wrap justify-center">
            <div className="animate-float"><Robotan size={170} wave mood="happy" /></div>
            <div>
              <h1 className="text-5xl font-bold text-sky-700 leading-tight">ロボタンの<br /><span className="kana">カナカナパズル</span></h1>
              <p className="text-2xl font-bold text-slate-500 mt-3">じぶんの なまえを おしてね</p>
            </div>
          </div>
          {students.length === 0 ? (
            <div className="bg-white rounded-3xl p-8 text-xl font-bold text-slate-600 border-4 border-slate-200 max-w-xl text-center">
              せんせいへ：スプレッドシートの「名簿」シートに、子どもの なまえ（ひらがな）を いれてください。
            </div>
          ) : (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-5 max-w-5xl">
              {students.map((n, i) => {
                const [c, l] = NAME_COLORS[i % NAME_COLORS.length];
                return <Btn key={n} big onClick={() => onSelect(n)} color={c} light={l} className="min-w-[12rem]">{n}</Btn>;
              })}
            </div>
          )}
          <button onClick={onTeacher} className="fixed bottom-4 right-4 text-base text-slate-400 bg-white/70 border-2 border-slate-200 rounded-full px-4 py-2">🔒 せんせい</button>
          {demo && <div className="fixed bottom-4 left-4 text-sm text-slate-400">おためしモード（スプレッドシートと つながっていません）</div>}
        </div>
      );
    }

    function TopBar({ name, progress, onLogout, onTeacher, soundOn, onSound, onHome }) {
      return (

    // 記録の まとめ（コード.gs の aggregate_ と 同じ しくみ）
    function aggregate(rows) {
      const students = {}, classItems = {}, classWrong = {};
      const add = (map, key, lv, ok) => { const m = map[key] || (map[key] = {}); const k = m[lv] || (m[lv] = [0, 0]); k[0]++; k[1] += ok; };
      rows.forEach(r => {
        const name = String(r[1] || '').trim(); if (!name) return;
        const prob = String(r[5] || ''), lv = String(r[4] || '').slice(0, 2), ok = r[6] === '○' ? 1 : 0, hint = Number(r[8]) || 0, wrong = String(r[9] || '');
        const s = students[name] || (students[name] = { count: 0, ok: 0, hint: 0, last: '', items: {}, wrong: {} });
        s.count++; s.ok += ok; if (hint) s.hint++;
        const day = String(r[0]).slice(0, 10); if (day > s.last) s.last = day;
        if (!prob) return;
        add(s.items, prob, lv, ok); add(classItems, prob, lv, ok);
        if (wrong) wrong.split('・').forEach(w => {
          if (!w) return;
          const a = s.wrong[prob] || (s.wrong[prob] = {}); a[w] = (a[w] || 0) + 1;
          const b = classWrong[prob] || (classWrong[prob] = {}); b[w] = (b[w] || 0) + 1;
        });
      });
      return { students, classItems, classWrong };
    }
    const statOf = (t) => { let n = 0, o = 0; if (t) Object.values(t).forEach(([a, b]) => { n += a; o += b; }); return [n, o]; };
    const rateColor = (n, o) => !n ? '#f1f5f9' : o / n >= 0.8 ? '#bbf7d0' : o / n >= 0.6 ? '#fef08a' : '#fecaca';
    const pct = (n, o) => n ? `${Math.round((o / n) * 100)}%` : '－';
    const weakList = (items) => Object.entries(items || {})
      .map(([ch, t]) => { const [n, o] = statOf(t); return { ch, t, n, o, r: n ? o / n : 1 }; })
      .filter(x => x.n >= 2 && x.r < 0.8)
      .sort((a, b) => a.r - b.r || b.n - a.n);
    const topWrong = (w) => w ? Object.entries(w).sort((a, b) => b[1] - a[1]).slice(0, 3) : [];

    const GOJUON = [
      ['ア', 'イ', 'ウ', 'エ', 'オ'], ['カ', 'キ', 'ク', 'ケ', 'コ'], ['サ', 'シ', 'ス', 'セ', 'ソ'], ['タ', 'チ', 'ツ', 'テ', 'ト'], ['ナ', 'ニ', 'ヌ', 'ネ', 'ノ'],

    ];
    const DAKU_TABLE = [['ガ', 'ギ', 'グ', 'ゲ', 'ゴ'], ['ザ', 'ジ', 'ズ', 'ゼ', 'ゾ'], ['ダ', 'ヂ', 'ヅ', 'デ', 'ド'], ['バ', 'ビ', 'ブ', 'ベ', 'ボ'], ['パ', 'ピ', 'プ', 'ペ', 'ポ']];
    const ALL_WORDS = STAGES.filter(s => s.words).flatMap(s => s.words.map(w => w[0]));

        <div className="inline-grid gap-1" style={{ gridTemplateColumns: `repeat(${table[0].length}, minmax(0, 1fr))` }}>
          {table.flat().map((ch, i) => {

            const [n, o] = statOf(items[ch]);

              <button key={i} onClick={() => onPick(ch)} className={`w-14 h-14 rounded-xl flex flex-col items-center justify-center border-2 ${picked === ch ? 'border-slate-700' : 'border-transparent'}`} style={{ background: rateColor(n, o) }}>

                <span className="text-xs text-slate-600">{pct(n, o)}</span>
              </button>
            );
          })}
        </div>
      );
    }
    function Legend() {
      return (
        <div className="flex gap-3 text-xs text-slate-600 mt-3 flex-wrap">
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#fecaca' }} />60%未満</span>
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#fef08a' }} />60〜79%</span>
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#bbf7d0' }} />80%以上</span>
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#f1f5f9' }} />まだ</span>
        </div>
      );
    }
    const nowStageText = (p) => {
      for (const c of COURSES) {
        if (!courseOpen(p, c.id)) continue;
        const st = courseStages(c.id).find(s => !p.cleared[s.id]);
        if (st) return `${c.title}・${st.name}（★${nextLevel(p, st)}）`;
      }
      return 'ぜんぶ クリア';
    };

    function TeacherView({ data, pin, onClose, onReload, onSettings }) {
      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [picked, setPicked] = useState(null);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [busy, setBusy] = useState(false);
      const [pending, setPending] = useState(api.pending());
      const agg = useMemo(() => aggregate(data.rows || []), [data]);
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const st = student ? (agg.students[student.name] || { count: 0, ok: 0, hint: 0, last: '', items: {}, wrong: {} }) : null;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };
      const act = async (fn, okText) => {
        setBusy(true);
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); await onReload(); } }
        catch (e) { flash('うまく いきませんでした：' + (e && e.message || e)); }
        setBusy(false);
      };
      const flag = (key, val) => act(() => api.setFlag(pin, sel, key, val), '変更しました');
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '﻿' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`カナカナパズル_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`カナカナパズル_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'kanapuzzle') { flash('このアプリのバックアップではありません'); return; }
          if (!confirm('バックアップから しんちょく（すすみぐあい）を もどします。よろしいですか？')) return;
          act(() => api.restore(pin, d), 'バックアップから もどしました');
        };
        rd.readAsText(f);
        e.target.value = '';
      };
      const clear = (name) => {
        const who = name ? `「${name}」さん` : '全員';
        if (!confirm(`${who}の 記録と しんちょくを 消します。元に もどせません。よろしいですか？`)) return;

        act(() => api.clear(pin, name || ''), '消しました');

                          <div className="text-xs font-bold text-rose-600">{topWrong(agg.classWrong[w.ch]).map(([k, c]) => `${k}×${c}`).join(' ')}</div>

                    </div>

              <div className="flex flex-col gap-4">
                <div className="flex gap-2 flex-wrap">

                      </div>
                      <div className="flex flex-wrap gap-2 items-center">
                        <span className="font-bold text-slate-600">始めるステージ：</span>
                        <select disabled={busy} value={prog.start || ''} onChange={(e) => flag('start', e.target.value)} className="border-2 border-slate-300 rounded-lg px-3 py-2">
                          <option value="">さいしょから（れんしゅう）</option>
                          {STAGES.map(x => <option key={x.id} value={x.id}>{courseOf(x.course).title}・{x.name}（{x.label}）</option>)}
                        </select>
                        <span className="text-xs text-slate-500">選んだステージまでが 開きます（同じコースの中）。はってんのコースは、上のボタンで開いてください。</span>
                      </div>
                    </div>
                    <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                      <div className="font-bold text-slate-700 mb-2">ステージの 進み具合（⭐＝できた段階）</div>
                      {COURSES.map(c => (
                        <div key={c.id} className="flex items-center gap-2 mb-2 flex-wrap">
                          <div className="w-32 text-sm font-bold" style={{ color: c.color }}>{c.title}</div>
                          {courseStages(c.id).map(x => {
                            const d = (prog.done[x.id] || []).length, cl = prog.cleared[x.id];
                            return <div key={x.id} className="text-xs px-2 py-1 rounded-lg border" style={{ background: cl ? '#bbf7d0' : d ? '#fef9c3' : '#f8fafc' }}>{x.name} {cl ? '✔' : `${d}/4`}</div>;
                          })}
                        </div>
                      ))}
                    </div>
                    <div className="grid md:grid-cols-2 gap-4">
                      <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                        <div className="font-bold text-slate-700 mb-2">文字ごとの「1回目でできた」（押すと くわしく）</div>
                        <div className="flex flex-wrap gap-6">
                          <div><div className="text-sm text-slate-500 mb-1">清音</div><CharGrid table={GOJUON} items={st.items} onPick={setPicked} picked={picked} /></div>
                          <div><div className="text-sm text-slate-500 mb-1">濁音・半濁音</div><CharGrid table={DAKU_TABLE} items={st.items} onPick={setPicked} picked={picked} /></div>
                        </div>
                        <div className="text-sm text-slate-500 mt-3 mb-1">ことば</div>
                        <div className="flex flex-wrap gap-1">
                          {ALL_WORDS.map(w => { const [n, o] = statOf(st.items[w]); return <button key={w} onClick={() => setPicked(w)} className={`kana px-2 py-1 rounded-lg border-2 ${picked === w ? 'border-slate-700' : 'border-transparent'}`} style={{ background: rateColor(n, o) }}>{w}</button>; })}
                        </div>
                        <Legend />
                      </div>
                      <div className="flex flex-col gap-4">
                        <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                          <div className="font-bold text-slate-700 mb-2">{picked ? <>「<span className="kana text-2xl">{picked}</span>」の くわしい ようす</> : '文字を押すと、くわしい ようすが 出ます'}</div>
                          {picked && (st.items[picked] ? (

                              <div className="flex flex-wrap gap-2">

                              </div>
                              <div className="text-sm">よく あった まちがい：{topWrong(st.wrong[picked]).length ? topWrong(st.wrong[picked]).map(([k, c]) => <b key={k} className="mr-2">{k}（{c}回）</b>) : 'なし'}</div>
                            </div>
                          ) : <div className="text-slate-400">まだ 記録が ありません</div>)}
                        </div>
                        <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                          <div className="font-bold text-slate-700 mb-2">つまずいている 文字・ことば（低い順）</div>
                          {weakList(st.items).length === 0 ? <div className="text-slate-400">いまのところ ありません</div> : (
                            <table className="w-full text-sm">
                              <thead className="text-slate-500"><tr><th className="text-left p-1">文字</th><th className="p-1">全体</th>{['★1', '★2', '★3', '★4'].map(k => <th key={k} className="p-1">{k}</th>)}<th className="p-1 text-left">よくある まちがい</th></tr></thead>
                              <tbody>
                                {weakList(st.items).slice(0, 15).map(w => (
                                  <tr key={w.ch} className="border-t border-slate-100">
                                    <td className="kana text-xl p-1">{w.ch}</td>
                                    <td className="p-1 text-center"><span className="px-2 rounded" style={{ background: rateColor(w.n, w.o) }}>{pct(w.n, w.o)}</span></td>
                                    {['★1', '★2', '★3', '★4'].map(k => <td key={k} className="p-1 text-center">{w.t[k] ? <span className="px-1 rounded" style={{ background: rateColor(w.t[k][0], w.t[k][1]) }}>{pct(w.t[k][0], w.t[k][1])}</span> : '－'}</td>)}
                                    <td className="p-1 text-rose-600 font-bold">{topWrong(st.wrong[w.ch]).map(([k]) => k).join('、')}</td>
                                  </tr>

                              </tbody>
                            </table>

                      </div>

                    <div><button disabled={busy} onClick={() => clear(student.name)} className="px-4 py-2 rounded-full border-2 border-rose-300 text-rose-600 font-bold bg-white">🗑 {student.name}さんの 記録と しんちょくを 消す</button></div>
                  </>

            {tab === 'set' && (
              <div className="bg-white rounded-2xl border-2 border-slate-200 p-5 flex flex-col gap-5 max-w-3xl">
                <div>
                  <div className="font-bold text-slate-700">読み上げの 速さ：{s.rate}</div>

                </div>

                  <div className="font-bold text-slate-700 mb-1">文字の 大きさ</div>

                  <div className="text-xs text-slate-500 w-full">バックアップには、子どもごとの しんちょく（ステージ・ねじ・ぶひん）が 入ります。</div>
                </div>
                <div><button disabled={busy} onClick={() => clear('')} className="px-4 py-2 rounded-full border-2 border-rose-300 text-rose-600 font-bold">🗑 全員の 記録と しんちょくを 消す</button></div>
                <div className="text-xs text-slate-400">版 {APP_VERSION}　書き順データ：KanjiVG（CC BY-SA 3.0）　絵：Canva で作成</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 14. アプリ ぜんたい
    // =====================================================================
    function applySettings(s) {
      Speech.rate = Number(s.rate) || 0.8;
      Speech.pitch = Number(s.pitch) || 1.3;
      Sound.on = s.sound !== false;
      document.documentElement.style.fontSize = (16 * (Number(s.font) || 1)) + 'px';
    }

    function App() {
      const [boot, setBoot] = useState(null);
      const [bootError, setBootError] = useState('');
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [course, setCourse] = useState('sei');
      const [soundOn, setSoundOn] = useState(true);
      const [robo, setRobo] = useState({ text: '', mood: 'normal', talking: false });
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [loading, setLoading] = useState(false);
      const sayId = useRef(0);
      const repeatFn = useRef(null);
      const progRef = useRef(progress);
      progRef.current = progress;

      const roboApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          setRobo({ text, mood: opts.mood || 'normal', talking: true });
          Speech.say(opts.speech || text || '', () => { if (sayId.current === id) setRobo(r => ({ ...r, talking: false })); resolve(); });
        });
        return {
          say: (text, opts) => run(text, opts),
          stop: () => { sayId.current++; Speech.stop(); setRobo(r => ({ ...r, talking: false })); },
          setRepeat: (fn) => { repeatFn.current = fn; },
          repeat: () => { if (repeatFn.current) repeatFn.current(); },
        };
      }, []);
      const ctx = useMemo(() => ({ ...roboApi, state: robo }), [roboApi, robo]);

      useEffect(() => {
        api.init().then(d => {
          const s = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };
          setSettings(s); applySettings(s); setSoundOn(s.sound !== false);
          setBoot(d);
          api.flush();
        }).catch(e => setBootError(String(e && e.message || e)));
      }, []);

      const selectStudent = async (n) => {
        Sound.get(); Sound.tap();
        setLoading(true);
        try {
          const server = parseProgress(await api.student(n));
          // この端末の しんちょくの ほうが 新しければ、そちらを つかう（送れていない ときの ため）
          const local = parseProgress(safeStore.get(COPY_KEY(n)));
          let p = (local.t || 0) > (server.t || 0) ? local : server;
          if ((server.flagT || 0) > (p.flagT || 0)) { FLAG_KEYS.forEach(k => { p[k] = server[k]; }); p.flagT = server.flagT; }
          setProgress(p); setName(n); setCourse('sei');
          setView({ v: 'home' });
        } catch (e) { alert('よみこみに しっぱい しました。もういちど おしてください。'); }
        setLoading(false);
      };

      const persist = (p, records) => {
        const q = { ...p, t: Date.now() };
        safeStore.set(COPY_KEY(name), JSON.stringify(q));
        api.save({ name, progress: JSON.stringify(q), records, stamp: nowStr(), time: Date.now() });
        return q;
      };
      const update = (p, records = []) => { const q = persist(p, records); setProgress(q); };

      // 1もん できた
      const solvedOne = (stage, level, itemKey, rec, resumeNext) => {
        const p0 = progRef.current;
        const pic = picOf(itemKey);
        const zukan = pic ? { ...p0.zukan, [pic.file]: 1 } : p0.zukan;
        const key = stage.id + '-' + level;
        const resume = { ...p0.resume };
        if (resumeNext.i < resumeNext.items.length) resume[key] = resumeNext; else delete resume[key];
        update({ ...p0, screws: (p0.screws || 0) + 1, zukan, last: itemText(itemKey).length === 1 ? itemText(itemKey) : itemText(itemKey).slice(0, 4), resume }, [rec]);
      };
      // 1回（5もん） おわった
      const finishRound = (stage, level, gained) => {
        const p0 = progRef.current;
        const done = { ...p0.done, [stage.id]: uniq([...(p0.done[stage.id] || []), level]) };
        const cleared = { ...p0.cleared };
        let newPart = null;
        const equip = { ...p0.equip };
        if (level === 4 && !cleared[stage.id]) {
          cleared[stage.id] = true;
          newPart = STAGE_PART[stage.id];
          equip[BIG_PARTS[newPart].slot] = newPart; // もらった ぶひんは すぐ つける
        }
        if (level === 4) cleared[stage.id] = true;
        update({ ...p0, done, cleared, equip });
        setView({ v: 'result', result: { stage, level, newPart, gained } });
      };

      const logout = () => { roboApi.stop(); setName(null); setView({ v: 'login' }); api.flush(); };
      const openTeacher = () => { roboApi.stop(); setPinError(0); setPinOpen(true); };
      const submitPin = async (pin) => {
        const d = await api.teacher(pin).catch(() => null);
        if (!d || !d.ok) { setPinError(e => e + 1); return; }
        setPinOpen(false); setTeacher({ data: d, pin });
      };
      const reloadTeacher = async () => {
        const d = await api.teacher(teacher.pin).catch(() => null);
        if (d && d.ok) setTeacher(t => ({ ...t, data: d }));
        if (name && d && d.ok) {
          const x = d.students.find(s => s.name === name);
          if (x) {
            const sp = parseProgress(x.progress), p = { ...progRef.current };
            FLAG_KEYS.forEach(k => { p[k] = sp[k]; }); p.flagT = sp.flagT;
            if (!x.progress) { setProgress(newProgress()); safeStore.del(COPY_KEY(name)); } else setProgress(p);
          }
        }
      };

      if (bootError) return <div className="p-10 text-xl text-rose-600 font-bold">よみこみに しっぱい しました：{bootError}</div>;
      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-sky-700">じゅんび ちゅう…</div>;

      const look = roboLook(progress);
      const bar = (onHome) => (
        <TopBar name={name} progress={progress} onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onHome={onHome}
          onSound={() => { Sound.on = !soundOn; setSoundOn(!soundOn); }} />
      );
      const goHome = () => { roboApi.stop(); setView({ v: 'home' }); };

      let screen;
      if (!name || view.v === 'login') screen = <LoginScreen students={boot.students} onSelect={selectStudent} onTeacher={openTeacher} demo={boot.demo} />;
      else if (view.v === 'home') screen = <HomeScreen name={name} progress={progress} bar={bar()} course={course} setCourse={setCourse}
        onStage={(st) => { Sound.tap(); setView({ v: 'stage', stage: st }); }} onFactory={() => setView({ v: 'factory' })} onZukan={() => setView({ v: 'zukan' })} />;
      else if (view.v === 'stage') screen = <StageScreen key={view.stage.id + JSON.stringify(progress.done[view.stage.id] || [])} stage={view.stage} progress={progress} bar={bar(goHome)}
        onLevel={(lv) => { Sound.tap(); setView({ v: 'act', stage: view.stage, level: lv, key: Date.now(), screws0: progress.screws || 0 }); }} />;
      else if (view.v === 'act') screen = <Activity key={view.key} stage={view.stage} level={view.level} progress={progress} settings={settings} look={look}
        onSolvedOne={(itemKey, rec, resumeNext) => solvedOne(view.stage, view.level, itemKey, rec, resumeNext)}
        onQuit={() => setView({ v: 'stage', stage: view.stage })}
        onFinish={() => finishRound(view.stage, view.level, (progRef.current.screws || 0) - view.screws0)} />;
      else if (view.v === 'result') screen = <ResultScreen result={view.result} progress={progress}
        onNext={() => setView({ v: 'stage', stage: view.result.stage })} onHome={goHome} onFactory={() => setView({ v: 'factory' })} />;
      else if (view.v === 'factory') screen = <FactoryScreen progress={progress} bar={bar(goHome)} onChange={(p) => update(p)} />;
      else if (view.v === 'zukan') screen = <ZukanScreen progress={progress} bar={bar(goHome)} />;

      return (
        <RoboCtx.Provider value={ctx}>
          {screen}
          {loading && <div className="fixed inset-0 bg-white/60 flex items-center justify-center text-3xl font-bold text-sky-700 z-50">よみこみ ちゅう…</div>}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
          {teacher && <TeacherView data={teacher.data} pin={teacher.pin} onReload={reloadTeacher}
            onSettings={(s) => { setSettings(s); applySettings(s); setSoundOn(s.sound !== false); }}
            onClose={() => setTeacher(null)} />}
        </RoboCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
