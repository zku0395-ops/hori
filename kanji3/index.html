    function ShopScreen({ progress, onBuy }) {
      const ponta = usePonta();
      const [cat, setCat] = useState(null);       // null：モールの ちず
      const [confirm, setConfirm] = useState(null);
      const [award, setAward] = useState(null);
      const own = new Set(progress.items);
      const c = cat && ITEM_CATS.find(x => x.id === cat);
      useEffect(() => { ponta.say('ショッピングモールへ ようこそ！ どの おみせに はいる？'); }, []);
      // おみせに はいる・ちずに もどる
      const enter = (id) => {
        Sound.tap(); setCat(id);
        const cc = ITEM_CATS.find(x => x.id === id);
        ponta.say(`いらっしゃいませ！ ${cc.name}の おみせです。`);
      };
      const leave = () => { Sound.tap(); setCat(null); ponta.say('つぎは どの おみせに はいる？'); };
      const tap = (it) => {
        Sound.tap();
        if (own.has(it.id)) { ponta.say(`${it.n}は もう ずかんに あるよ。`); return; }
        if (progress.coins < it.p) { ponta.say(`${it.n}は コイン ${it.p}まい。あと ${it.p - progress.coins}まい あつめよう！`, { mood: 'think' }); return; }
        ponta.say(`${it.n}を かいますか？`);
        setConfirm(it);
      };
      const buy = () => {
        const it = confirm; setConfirm(null);
        const before = titlesOf(progress.items);
        const after = titlesOf([...progress.items, it.id]);
        onBuy(it);
        Sound.buy();
        const newT = after.find(t => !before.includes(t));
        if (newT) { setAward(newT); Sound.big(); ponta.say(`おめでとう！「${newT}」に なったよ！`, { mood: 'happy' }); }
        else ponta.say(`まいど ありがとう ございます！ ${it.n}を ずかんに いれたよ。`, { mood: 'happy' });
      };
      // おみせの のき（しまもようの ひさし）
      const awning = (color) => ({ background: `repeating-linear-gradient(90deg, ${color} 0 22px, #ffffff 22px 44px)` });
      return (
        <div className="relative w-full flex-1 flex flex-col items-center gap-3 p-3" style={{ background: `url(${IMG}bg_shop.webp) center/cover` }}>

                  const n = x.items.filter(it => own.has(it.id)).length;
                  return (
                    <button key={x.id} onClick={() => enter(x.id)} className="btn3d rounded-2xl border-4 bg-white overflow-hidden flex flex-col items-stretch" style={{ borderColor: x.color }}>
                      <div className="h-4" style={awning(x.color)} />
                      <div className="flex flex-col items-center py-2 px-1">
                        <span className="text-6xl">{x.icon}</span>
                        <span className="text-lg font-bold leading-tight mt-1" style={{ wordBreak: 'keep-all' }}>{x.name}</span>
                        <span className="text-sm font-bold rounded-full px-2 mt-1" style={{ background: n === x.items.length ? '#fef3c7' : '#f5f5f4' }}>{n === x.items.length ? '🏆 ' : ''}{n} / {x.items.length}</span>
                      </div>
                    </button>

                })}
              </div>
            </div>
          )}
          {c && (
            <div className="w-full max-w-5xl flex flex-col gap-3">

                <button onClick={leave} className="btn3d shrink-0 bg-white border-2 border-stone-300 rounded-2xl px-4 py-2 text-xl font-bold">◀ ちずへ</button>
                <div className="flex-1 rounded-2xl overflow-hidden border-4 bg-white" style={{ borderColor: c.color }}>
                  <div className="h-5" style={awning(c.color)} />
                  <div className="text-center text-3xl font-bold py-1">{c.icon} {c.name}の おみせ</div>
                </div>
              </div>
              <div className="bg-white/90 rounded-3xl p-3">
                <div className="grid grid-cols-3 sm:grid-cols-5 gap-3">
                  {c.items.map(it => {
                    const have = own.has(it.id), can = progress.coins >= it.p;
                    return (
                      <button key={it.id} onClick={() => tap(it)} className={`btn3d rounded-2xl border-4 p-1 flex flex-col items-center bg-white ${have ? 'border-emerald-400' : can ? 'border-amber-400' : 'border-stone-200'}`}>

                        <span className="text-base font-bold mt-1 leading-tight h-10 flex items-center text-center">{it.n}</span>

    const statOf = (t) => { let n = 0, o = 0; if (t) Object.values(t).forEach(([a, b]) => { n += a; o += b; }); return [n, o]; };
    const rateColor = (n, o) => !n ? '#f5f5f4' : o / n >= 0.8 ? '#bbf7d0' : o / n >= 0.6 ? '#fef08a' : '#fecaca';
    const pct = (n, o) => n ? `${Math.round((o / n) * 100)}%` : '－';
    const weakList = (kanji) => Object.entries(kanji || {}).map(([k, t]) => { const [n, o] = statOf(t); return { k, n, o, r: n ? o / n : 1 }; })
      .filter(x => x.n >= 2 && x.r < 0.8).sort((a, b) => a.r - b.r);
    const weakKind = (t) => {
      let worst = null;
      KIND_ORDER.forEach(kd => { if (t && t[kd]) { const r = t[kd][1] / t[kd][0]; if (!worst || r < worst.r) worst = { kd, r }; } });
      return worst ? `${KIND_NUM[worst.kd]}${worst.kd}` : '';
    };

    function KanjiGrid({ kanji, onPick, picked }) {
      return (
        <div className="flex flex-col gap-1">
          {STAGES.filter(s => s.type === 'kanji').map(st => (

              <span className="w-36 text-sm text-stone-500 truncate">{st.name}</span>
              {st.kanji.map(k => {
                const [n, o] = statOf(kanji && kanji[k]);
                return <button key={k} onClick={() => onPick(k)} className={`kyo w-12 h-12 rounded-lg text-2xl border-2 ${picked === k ? 'border-sky-600' : 'border-transparent'}`} style={{ background: rateColor(n, o) }}>{k}</button>;
              })}
            </div>
          ))}
        </div>
      );
    }

    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [picked, setPicked] = useState(null);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(api.pending());
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const cleared = (p) => STAGES.filter(st => p.cleared[st.id]).length;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };

      const act = async (fn, okText) => {
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); onChanged(); } }
        catch (e) { flash('うまく いきませんでした：' + e.message); }
      };
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '﻿' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`かんじモール_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`かんじモール_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'kanji3') { flash('このアプリのバックアップではありません'); return; }
          if (!confirm('バックアップから、子どもの進み具合・コインを元にもどします。よろしいですか？')) return;
          await act(() => api.restore(pin, d), 'バックアップから元にもどしました');
        };
        rd.readAsText(f);
      };

      return (
        <div className="fixed inset-0 bg-stone-50 z-50 overflow-auto">
          <div className="max-w-6xl mx-auto p-4 text-base">
            <div className="flex items-center gap-3 mb-3">
              <div className="text-2xl font-bold flex-1">🔒 先生用画面 <span className="text-sm text-stone-500">ver {APP_VERSION}{data.demo ? '（おためしモード）' : ''}</span></div>
              <button onClick={onClose} className="btn3d bg-white border-2 border-stone-400 rounded-xl px-4 py-2 font-bold">とじる</button>
            </div>
            {data.isDefaultPin && <div className="bg-rose-100 border-2 border-rose-400 rounded-xl p-2 mb-2">暗証番号が はじめの「1234」のままです。「せってい」で変えてください。</div>}
            {msg && <div className="fixed top-3 left-1/2 -translate-x-1/2 bg-sky-700 text-white rounded-xl px-4 py-2 z-50">{msg}</div>}
            <div className="flex gap-2 mb-3">
              {[['class', 'クラス全体'], ['child', '子どもごと'], ['settings', 'せってい'], ['data', 'データ']].map(([id, t]) => (
                <button key={id} onClick={() => setTab(id)} className={`rounded-xl px-4 py-2 font-bold border-2 ${tab === id ? 'bg-amber-200 border-amber-500' : 'bg-white border-stone-300'}`}>{t}</button>
              ))}
            </div>

            {tab === 'class' && (
              <div className="flex flex-col gap-4">
                <table className="w-full bg-white rounded-xl overflow-hidden text-left">
                  <thead className="bg-amber-100"><tr><th className="p-2">なまえ</th><th>クリア</th><th>コイン</th><th>かった数</th><th>解いた数</th><th>1回目正解</th><th>さいご</th><th>つまずいている字</th></tr></thead>
                  <tbody>
                    {data.students.map(st => {
                      const p = parseProgress(st.progress);
                      const w = weakList(st.kanji).slice(0, 5);
                      return (
                        <tr key={st.name} className="border-t cursor-pointer hover:bg-amber-50" onClick={() => { setSel(st.name); setTab('child'); }}>
                          <td className="p-2 font-bold">{st.name}</td>
                          <td>{cleared(p)} / {STAGES.length}</td>
                          <td>🪙 {p.coins}</td>
                          <td>{p.items.length}</td>
                          <td>{st.count}</td>
                          <td>{pct(st.count, st.ok)}</td>
                          <td>{st.last || '－'}</td>
                          <td className="kyo text-xl">{w.map(x => x.k).join(' ') || '－'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div className="bg-white rounded-xl p-3">
                  <div className="font-bold mb-2">クラス全体の字ごとの結果</div>
                  <Legend />
                  <div className="mt-2"><KanjiGrid kanji={data.classKanji} onPick={setPicked} picked={picked} /></div>
                  {picked && <KanjiDetail k={picked} t={data.classKanji[picked]} wrong={data.classWrong && data.classWrong[picked]} />}
                </div>
              </div>
            )}

            {tab === 'child' && (
              <div className="flex flex-col gap-3">
                <div className="flex gap-2 flex-wrap">
                  {data.students.map(st => <button key={st.name} onClick={() => { setSel(st.name); setPicked(null); }} className={`rounded-xl px-4 py-2 font-bold border-2 ${sel === st.name ? 'bg-sky-200 border-sky-500' : 'bg-white border-stone-300'}`}>{st.name}</button>)}
                </div>
                {student && prog && (
                  <div className="grid md:grid-cols-2 gap-3">
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold text-xl mb-1">{student.name}</div>
                      <div>クリア：{cleared(prog)} / {STAGES.length}　コイン：🪙 {prog.coins}（これまでに {prog.earned}まい）　かった数：{prog.items.length}</div>
                      <div>解いた数：{student.count}　1回目正解：{pct(student.count, student.ok)}　さいご：{student.last || '－'}</div>
                      <div className="mt-2 font-bold">つまずいている字</div>
                      <div className="flex flex-wrap gap-2 mt-1">
                        {weakList(student.kanji).slice(0, 12).map(x => (
                          <button key={x.k} onClick={() => setPicked(x.k)} className="rounded-lg px-2 py-1 border" style={{ background: rateColor(x.n, x.o) }}>
                            <span className="kyo text-2xl">{x.k}</span> {pct(x.n, x.o)} <span className="text-xs">{weakKind(student.kanji[x.k])}</span>
                          </button>
                        ))}
                        {!weakList(student.kanji).length && <span className="text-stone-500">いまは ありません</span>}
                      </div>
                      <div className="mt-3 flex flex-wrap gap-2">
                        <button onClick={() => act(() => api.setFlag(pin, student.name, 'unlockAll', !prog.unlockAll), prog.unlockAll ? 'ステージの開放をやめました' : 'すべてのステージを開きました')} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog.unlockAll ? '🔓 全部開く：オン' : '🔒 全部開く：オフ'}</button>
                        <button onClick={() => act(() => api.setFlag(pin, student.name, 'hatten', !prog.hatten), prog.hatten ? 'はってんを閉じました' : 'はってんを開きました')} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog.hatten ? '✨ はってん：開いている' : '✨ はってん：閉じている'}</button>
                      </div>
                      <div className="mt-2 flex flex-wrap gap-2 items-center">
                        <span className="font-bold">コイン：</span>
                        {[-5, -1, 1, 5, 10].map(dv => <button key={dv} onClick={() => act(() => api.addCoins(pin, student.name, dv), `コインを ${dv > 0 ? '+' : ''}${dv} しました`)} className="rounded-lg px-3 py-1 border-2 bg-white font-bold">{dv > 0 ? '+' : ''}{dv}</button>)}
                      </div>
                      <div className="mt-3">
                        <button onClick={() => { if (confirm(`${student.name} さんの記録・進み具合・コイン・買ったものを、すべて消します。元にはもどせません。よろしいですか？`)) act(() => api.clear(pin, student.name), `${student.name} さんの記録を消しました`); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 この子の記録を消す</button>
                      </div>
                    </div>
                    <div className="bg-white rounded-xl p-3">
                      <Legend />
                      <div className="mt-2"><KanjiGrid kanji={student.kanji} onPick={setPicked} picked={picked} /></div>
                      {picked && <KanjiDetail k={picked} t={student.kanji[picked]} wrong={student.wrong && student.wrong[picked]} />}
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-4 max-w-2xl">
                <label className="flex items-center gap-3">よみあげの はやさ：<input type="range" min="0.5" max="1.2" step="0.05" value={s.rate} onChange={e => setS({ ...s, rate: Number(e.target.value) })} /> {s.rate}倍
                  <button className="border rounded px-2" onClick={() => { Speech.rate = s.rate; Speech.say('ポンタせんせいの かんじ ショッピングモールだよ。'); }}>ためす</button></label>
                <div>もじの おおきさ：{[[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']].map(([v, t]) =>
                  <button key={v} onClick={() => setS({ ...s, font: v })} className={`ml-2 rounded-lg px-3 py-1 border-2 ${s.font === v ? 'bg-amber-200 border-amber-500' : 'bg-white'}`}>{t}</button>)}</div>
                <div>こうかおん（ファンファーレなど）：{[[true, 'ならす'], [false, 'ならさない']].map(([v, t]) =>
                  <button key={t} onClick={() => setS({ ...s, sound: v })} className={`ml-2 rounded-lg px-3 py-1 border-2 ${s.sound === v ? 'bg-amber-200 border-amber-500' : 'bg-white'}`}>{t}</button>)}</div>
                <div>かく はんていの きびしさ：{['やさしい', 'ふつう'].map(v =>
                  <button key={v} onClick={() => setS({ ...s, judge: v })} className={`ml-2 rounded-lg px-3 py-1 border-2 ${s.judge === v ? 'bg-amber-200 border-amber-500' : 'bg-white'}`}>{v}</button>)}</div>
                <div>ぶひんの いろわけ（10画いじょうの字）：{[[true, 'つかう'], [false, 'つかわない']].map(([v, t]) =>
                  <button key={t} onClick={() => setS({ ...s, parts: v })} className={`ml-2 rounded-lg px-3 py-1 border-2 ${s.parts === v ? 'bg-amber-200 border-amber-500' : 'bg-white'}`}>{t}</button>)}</div>
                <div>かく れんしゅうの すすめかた：
                  {[['3', 'なぞる → うすい → みほんなし'], ['2', 'うすい → みほんなし'], ['1', 'みほんなし だけ']].map(([v, t]) =>
                    <button key={v} onClick={() => setS({ ...s, flow: v })} className={`ml-2 mt-1 rounded-lg px-3 py-1 border-2 ${s.flow === v ? 'bg-amber-200 border-amber-500' : 'bg-white'}`}>{t}</button>)}</div>
                <label>暗証番号を変える（4けた）：<input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} className="border-2 rounded px-2 py-1 w-24 ml-2" inputMode="numeric" placeholder="----" /></label>
                <div><button onClick={saveSettings} className="btn3d rounded-xl px-6 py-2 border-2 border-emerald-500 bg-emerald-100 font-bold text-xl">保存する</button>
                  <span className="text-sm text-stone-500 ml-2">（全員の画面に反映されます。子どもの画面は開き直すと変わります）</span></div>
              </div>
            )}

            {tab === 'data' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-2xl">
                <div>この端末に たまっている、まだ送れていない記録：<b>{pending}</b> 件
                  <button onClick={async () => { await api.flush(); setPending(api.pending()); flash(api.pending() ? 'まだ送れていません。ネットのつながりを確かめてください' : '送りました'); onChanged(); }} className="ml-2 rounded-xl px-3 py-1 border-2 bg-white font-bold">📤 スプレッドシートへ送る</button></div>
                <div><button onClick={csv} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">📄 記録をCSVで書き出す</button>
                  <div className="text-sm text-stone-500">ダウンロードできないときは、スプレッドシートの「きろく」シートを開き、ファイル → ダウンロード → CSV を選んでください。</div></div>
                <div className="flex gap-2 flex-wrap items-center">
                  <button onClick={backup} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">💾 バックアップを保存</button>
                  <label className="rounded-xl px-3 py-2 border-2 bg-white font-bold cursor-pointer">📂 バックアップから元にもどす<input type="file" accept=".json" className="hidden" onChange={restore} /></label>
                </div>
                <div><button onClick={() => { if (confirm('全員の記録・進み具合・コイン・買ったものを、すべて消します。元にはもどせません。よろしいですか？') && confirm('ほんとうに全員の記録を消しますか？')) act(() => api.clear(pin, ''), '全員の記録を消しました'); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 全員の記録を消す</button></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function KanjiDetail({ k, t, wrong }) {
      const d = KANJI[k];
      const ws = Object.entries(wrong || {}).sort((a, b) => b[1] - a[1]).slice(0, 6);
      return (
        <div className="mt-3 border-t pt-3 flex gap-4 items-start flex-wrap">
          <div className="kyo text-6xl">{k}</div>
          <table className="text-left">
            <thead><tr><th className="pr-3">だんかい</th><th className="pr-3">回数</th><th>1回目正解</th></tr></thead>
            <tbody>{KIND_ORDER.filter(kd => (kd !== 'おくりがな' && kd !== 'はんたい') || (t && t[kd])).map(kd => { const v = t && t[kd]; return <tr key={kd}><td className="pr-3">{KIND_NUM[kd]} {kd}</td><td>{v ? v[0] : 0}</td><td style={{ background: rateColor(v ? v[0] : 0, v ? v[1] : 0) }} className="px-2">{v ? pct(v[0], v[1]) : '－'}</td></tr>; })}</tbody>
          </table>
          <div>
            <div className="font-bold">よく選んだ まちがい</div>
            {ws.length ? ws.map(([w, n]) => <div key={w}><span className="kyo text-xl">{w}</span> … {n}回</div>) : <div className="text-stone-500">なし</div>}
            {d && <div className="text-sm text-stone-500 mt-1">よみ：{d.yomi.join('・')}</div>}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 18. アプリ
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [ponta, setPonta] = useState({ text: '', mood: 'normal', talking: false });
      const [coinFx, setCoinFx] = useState(0);
      const [soundOn, setSoundOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const earnedNow = useRef(0);
      const progRef = useRef(progress);
      progRef.current = progress;

      const pontaApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setPonta({ text, mood: opts.mood || 'normal', talking: true });
          Speech.say(opts.speech || text, () => { if (sayId.current === id) setPonta(p => ({ ...p, talking: false })); resolve(); });
        });
        return { say: run, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const pontaCtx = { ...pontaApi, ...ponta };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8; Speech.pitch = Number(v.pitch) || 1.1;
        Sound.on = v.sound !== false && v.sound !== 'false'; setSoundOn(Sound.on);
        PARTS_ON = v.parts !== false && v.parts !== 'false';
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p, recs) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        api.save({ name, progress: json, records: recs || [], stamp: nowStr(), time: Date.now() });
        return p;
      };

      const login = async (n) => {
        Sound.get(); Speech.say('');
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグ（全部開く・はってん）は スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) p = { ...p, unlockAll: !!a.unlockAll, hatten: !!a.hatten, flagT: a.flagT };
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false);
        setView({ v: 'home' });
      };
      const logout = () => { pontaApi.stop(); setName(null); setView({ v: 'login' }); };

      const startStep = (st, step) => { records.current = []; earnedNow.current = 0; setView({ v: 'act', st, step, key: uid() }); };
      const updateProg = (fn) => { progRef.current = fn(progRef.current); setProgress(progRef.current); return progRef.current; };
      const onRecord = (r) => {
        const rec = { ...r, id: uid() };
        records.current.push(rec);
        // まちがえた字を おぼえておく（ふくしゅうで 多めに 出す）
        updateProg(p => {
          const miss = { ...p.miss };
          if (r.result !== '○') miss[r.k] = (miss[r.k] || 0) + 1;
          else if (miss[r.k]) miss[r.k] = Math.max(0, miss[r.k] - 1);
          return { ...p, miss };
        });
      };
      const onCoin = () => {
        earnedNow.current++;
        updateProg(p => ({ ...p, coins: p.coins + 1, earned: p.earned + 1 }));
        setCoinFx(x => x + 1); Sound.coin();
      };
      // とちゅうで やめても つづきから できるように、5もん ごとではなく 1もん ごとに ほぞん
      const onPartial = (part) => {
        const p = { ...progRef.current, part: part.left > 0 ? part : null };
        progRef.current = p;
        const recs = records.current; records.current = [];
        persist(p, recs);
      };
      const finishStep = (st, step) => {
        let p = { ...progRef.current, part: null };
        const done = uniq([...(p.done[st.id] || []), step]);
        p.done = { ...p.done, [st.id]: done };
        let bonus = 0, stageClear = false;
        if (!p.cleared[st.id] && stepsOf(st).every(s => done.includes(s))) {
          p.cleared = { ...p.cleared, [st.id]: 1 };
          bonus = 5; stageClear = true;
          p.coins += bonus; p.earned += bonus;
        }
        const recs = records.current; records.current = [];
        p = persist(p, recs);
        const steps = stepsOf(st);
        const ni = steps.indexOf(step) + 1;
        let next = null;
        if (ni < steps.length) next = () => startStep(st, steps[ni]);
        else {
          const all = [...STAGES, ...HATTEN];
          const nst = all[all.findIndex(s => s.id === st.id) + 1];
          if (nst && stageOpen(p, nst)) next = () => setView({ v: 'stage', st: nst });
        }
        setView({ v: 'result', st, result: { earned: earnedNow.current, bonus, stageClear }, next });
      };
      const quitStep = (st) => {
        const recs = records.current; records.current = [];
        persist(progRef.current, recs);
        pontaApi.stop();
        setView({ v: 'stage', st });
      };
      const buy = (it) => {
        const p = progRef.current;
        if (p.coins < it.p || p.items.includes(it.id)) return;
        persist({ ...p, coins: p.coins - it.p, items: [...p.items, it.id] }, []);
      };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const p = { ...progRef.current, unlockAll: !!sp.unlockAll, hatten: !!sp.hatten, flagT: sp.flagT, coins: sp.coins || 0, t: sp.t || Date.now() };
              if (!me.progress) Object.assign(p, newProgress());
              progRef.current = p; setProgress(p); safeStore.set(COPY_KEY(name), JSON.stringify(p));
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-amber-800">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-stone-500 mt-2">{boot.error}</div></div>;

      const bar = (home = true) => (
        <TopBar name={name} coins={progress.coins} bump={coinFx} onHome={home ? () => { pontaApi.stop(); setView({ v: 'home' }); } : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }} />
      );

      let body = null;
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (view.v === 'home') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <HomeScreen name={name} progress={progress} onStudy={() => setView({ v: 'map' })}
            onContinue={() => { const st = currentStage(progress); startStep(st, nextStep(progress, st)); }}
            onShop={() => setView({ v: 'shop' })} onZukan={() => setView({ v: 'zukan' })}
            onWelcome={() => { Sound.buy(); persist({ ...progRef.current, welcome: 1 }, []); }} /></div>;
      } else if (view.v === 'map') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<StageMap progress={progress} onStage={(st) => setView({ v: 'stage', st })} /></div>;
      } else if (view.v === 'stage') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<StageScreen key={view.st.id} st={view.st} progress={progress} onStep={(s) => startStep(view.st, s)} onBack={() => setView({ v: 'map' })} /></div>;
      } else if (view.v === 'act') {
        body = <div className="min-h-screen flex flex-col items-center relative">{bar()}<CoinFly show={coinFx} />
          <div className="w-full flex justify-center p-3"><Activity key={view.key} st={view.st} step={view.step} progress={progress} settings={settings}
            onRecord={onRecord} onCoin={onCoin} onPartial={onPartial}
            onFinish={() => finishStep(view.st, view.step)} onQuit={() => quitStep(view.st)} /></div></div>;
      } else if (view.v === 'result') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<ResultScreen result={view.result} coins={progress.coins}
          onNext={view.next} onStage={() => setView({ v: 'stage', st: view.st })} onShop={() => setView({ v: 'shop' })} /></div>;
      } else if (view.v === 'shop') {
        body = <div className="min-h-screen flex flex-col">{bar()}<ShopScreen progress={progress} onBuy={buy} /></div>;
      } else if (view.v === 'zukan') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<ZukanScreen progress={progress} /></div>;
      }

      return (
        <PontaCtx.Provider value={pontaCtx}>
          {body}
          {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
          {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
        </PontaCtx.Provider>
      );
    }

    window.KANJI3_READY.then(() => {
      const D = window.KANJI_DATA;
      KANJI = D.KANJI; STAGES = D.STAGES; HATTEN = D.HATTEN; PIC = new Set(D.PIC); PREV = D.PREV || {}; BU = D.BU || {};
      STROKES = window.KANJI_STROKES; PARTS = window.KANJI_PARTS || {};
