<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>フデリュウと かんじの ぼうけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3b2a1a; --paper: #fff8e6; --paper2: #f6e7c4; --wood: #8b5a2b; --wood-d: #5e3a17;
  --gold: #f2c14e; --gold-d: #b8862a; --navy: #1f2d4f; --navy2: #2f4374;
  --ok: #2e9e5b; --red: #e2574c;
  --ui: 'BIZ UDPGothic', 'Meiryo', sans-serif;
  --kanji: 'Klee One', 'UD デジタル 教科書体 N-R', 'Hiragino Mincho ProN', serif;
}
html { font-size: calc(18px * var(--fs, 1)); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--ui); color: var(--ink); background: #2a6fa3; -webkit-user-select: none; user-select: none; }
button { font-family: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
#app { position: fixed; inset: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.hidden { display: none !important; }
.muted { color: #8a7a66; }
.kf { font-family: var(--kanji); font-weight: 600; }
ruby rt { font-family: var(--ui); }
.fit img, .fit svg { width: 100%; height: 100%; object-fit: contain; display: block; }

/* ボタン（押すと しずむ） */
.btn { border: 3px solid var(--wood-d); border-radius: 14px; padding: .55em 1.2em; font-size: 1.1rem; font-weight: 700; background: var(--paper); box-shadow: 0 4px 0 var(--wood-d); transition: transform .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-d); }
.btn.big { font-size: 1.6rem; padding: .6em 2.2em; }
.btn.small { font-size: .9rem; padding: .35em .9em; border-width: 2px; box-shadow: 0 3px 0 var(--wood-d); }
.btn.gold { background: linear-gradient(#ffe08a, var(--gold)); border-color: var(--gold-d); box-shadow: 0 5px 0 #8a6218; }
.btn.green { background: linear-gradient(#9be29e, #5cc062); border-color: #2f7d34; box-shadow: 0 4px 0 #2f7d34; }
.btn.blue { background: linear-gradient(#9fd3ff, #4ea4ea); border-color: #2a6aa8; box-shadow: 0 4px 0 #2a6aa8; color: #fff; }
.btn.red { background: linear-gradient(#ffaaa3, #e2574c); border-color: #9e2f27; box-shadow: 0 4px 0 #9e2f27; color: #fff; }
.btn.hint { background: linear-gradient(#fff6c2, #f8d84a); border-color: #b8960a; box-shadow: 0 4px 0 #8a7008; }
.btn:disabled { opacity: .45; }
.glow { animation: glow 1s infinite; }
@keyframes glow { 0%,100% { box-shadow: 0 4px 0 var(--gold-d), 0 0 0 4px rgba(242,193,78,.6); } 50% { box-shadow: 0 4px 0 var(--gold-d), 0 0 0 12px rgba(242,193,78,.15); } }
.panel { background: var(--paper); border: 4px solid var(--wood); border-radius: 18px; box-shadow: 0 6px 0 var(--wood-d), 0 10px 30px rgba(0,0,0,.25); padding: 1.2rem 1.5rem; }

/* タイトル・名前 */
.title-screen { align-items: center; justify-content: center; background-size: cover; background-position: center; }
.bgsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
.title-box { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
.title-sub { font-size: 1.4rem; font-weight: 700; color: #fff; text-shadow: 0 2px 0 var(--wood-d), 0 0 8px rgba(0,0,0,.4); letter-spacing: .15em; }
.title-logo { margin: 0; font-size: clamp(2.6rem, 8vw, 5.4rem); line-height: 1.1; color: #fff8d0; font-weight: 700; -webkit-text-stroke: 3px var(--wood-d); paint-order: stroke fill; text-shadow: 0 6px 0 var(--wood-d), 0 10px 20px rgba(0,0,0,.35); }
.names-screen { align-items: center; justify-content: center; background: linear-gradient(#5aa0d4, #8fd0f2); padding: 1rem; }
.names-screen .panel { width: min(820px, 100%); max-height: 92%; display: flex; flex-direction: column; gap: 1rem; align-items: center; }
.names-screen h2 { margin: 0; font-size: 1.6rem; }
.name-list { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: .8rem; overflow: auto; padding: .3rem; }
.name-btn { font-size: 1.7rem; font-weight: 700; padding: .7rem .4rem; background: #fff; border: 4px solid var(--navy2); border-radius: 18px; box-shadow: 0 5px 0 var(--navy); }
.name-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--navy); }
.lock-btn { position: absolute; right: 1rem; bottom: 1rem; }
.ver { position: absolute; left: .8rem; bottom: .5rem; font-size: .75rem; color: rgba(0,0,0,.45); }

/* しゅじんこう えらび */
.hero-screen { align-items: center; justify-content: center; background: linear-gradient(#253a6b, #5b78b8); padding: 1rem; }
.hero-screen .panel { width: min(980px, 100%); max-height: 94%; overflow: auto; text-align: center; }
.hero-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8rem; margin: 1rem 0; }
.hero-card { background: #fff; border: 4px solid var(--wood); border-radius: 16px; box-shadow: 0 5px 0 var(--wood-d); padding: .5rem; display: flex; flex-direction: column; align-items: center; gap: .3rem; }
.hero-card.on { border-color: var(--gold); box-shadow: 0 5px 0 var(--gold-d), 0 0 0 5px rgba(242,193,78,.5); background: #fffbe6; }
.hero-card .hv { height: 190px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.hero-card .hn { font-size: 1.25rem; font-weight: 700; }

/* しゅじんこうの 絵（そうびを かさねる） */
.hero { position: relative; display: inline-flex; align-items: flex-end; justify-content: center; height: 100%; }
.hero > img, .hero > svg { height: 100%; width: auto; max-width: 100%; object-fit: contain; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); position: relative; z-index: 1; }
.hero .eq { position: absolute; z-index: 2; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.hero .eq-hat { top: -4%; left: 50%; transform: translateX(-50%); font-size: 2.1em; }
.hero .eq-weapon { right: -14%; top: 40%; font-size: 1.9em; transform: rotate(-20deg); }
.hero .eq-pet { right: -34%; bottom: 0; font-size: 1.9em; }
.hero .eq-aura { left: -22%; top: 10%; font-size: 1.5em; animation: bob 1.8s ease-in-out infinite; z-index: 0; }

/* ストーリー */
.story-screen { align-items: center; justify-content: flex-end; background: linear-gradient(#253a6b, #5b78b8); padding: 1.2rem; }
.story-art { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; gap: 1rem; min-height: 0; }
.story-box { width: min(900px, 100%); font-size: 1.45rem; line-height: 1.9; min-height: 6.5em; position: relative; padding-bottom: 3.6rem; }
.story-next { position: absolute; right: 1rem; bottom: .8rem; display: flex; gap: .6rem; }

/* 上の バー */
.topbar { display: flex; align-items: center; gap: .5rem; padding: .45rem .8rem; z-index: 5; background: linear-gradient(var(--navy2), var(--navy)); color: #fff; border-bottom: 3px solid var(--gold-d); flex-wrap: wrap; }
.topbar .tb-title { font-size: 1.25rem; font-weight: 700; flex: 1; text-align: center; white-space: nowrap; }
.chip { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35); border-radius: 99px; padding: .2em .8em; font-size: .95rem; white-space: nowrap; }
.topbar .btn { color: var(--ink); }

/* 地図 */
.map-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: .6rem; min-height: 0; }
.map-wrap { position: relative; aspect-ratio: 4 / 3; height: 100%; max-width: 100%; max-height: 100%; }
.map { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.map > img, .map > svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.map > svg.road { position: absolute; inset: 0; }
.pin { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: .15rem; border: 0; background: none; padding: 0; }
.pin .pi { font-size: 2.2rem; filter: drop-shadow(0 3px 2px rgba(0,0,0,.4)); animation: bob 2s ease-in-out infinite; }
.pin .pl { background: linear-gradient(#fffbe9, #f3dfae); border: 3px solid var(--wood); border-radius: 10px; padding: .2em .7em; font-size: 1.05rem; font-weight: 700; white-space: nowrap; box-shadow: 0 3px 0 var(--wood-d); }
.pin .ps { font-size: .8rem; background: var(--navy); color: #fff; border-radius: 99px; padding: .1em .6em; white-space: nowrap; }
.pin.locked { filter: grayscale(1) opacity(.8); }
.pin.locked .pi { animation: none; }
.pin.now .pl { border-color: #e2574c; box-shadow: 0 3px 0 #9e2f27, 0 0 0 4px rgba(226,87,76,.35); }
.meter-row { display: flex; align-items: center; justify-content: center; gap: .6rem; color: #fff; font-weight: 700; padding: 0 0 .5rem; }
.meter { width: min(300px, 46vw); height: 16px; background: rgba(0,0,0,.3); border-radius: 99px; overflow: hidden; border: 2px solid #fff; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, #ff9a9a, #ffd36b, #8ee07f, #6ec6ff, #b38bff); }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.node { position: absolute; transform: translate(-50%, -50%); border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; }
.node .nm { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(#fffbe9 55%, #f0d58e); border: 4px solid var(--wood); box-shadow: 0 4px 0 var(--wood-d); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.node.boss .nm { width: 102px; height: 102px; border-color: #8e2b2b; box-shadow: 0 4px 0 #5a1414, 0 0 18px rgba(255,80,80,.6); }
.node .nm svg, .node .nm img { width: 82%; height: 82%; object-fit: contain; }
.node.cleared .nm { background: radial-gradient(#fff 55%, #bde6a8); }
.node.locked { filter: grayscale(1) brightness(.9); }
.node.locked .nm::after { content: '🔒'; position: absolute; font-size: 1.8rem; }
.node.now .nm { border-color: #e2574c; animation: bob 1.6s ease-in-out infinite; }
.node .nn { margin-top: .25rem; background: var(--paper); border: 2px solid var(--wood); border-radius: 8px; padding: .12em .6em; font-weight: 700; font-size: .95rem; white-space: nowrap; box-shadow: 0 2px 0 var(--wood-d); }
.node .nk { font-family: var(--kanji); font-size: 1.05rem; color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; letter-spacing: .08em; }
.node .nw { font-size: .85rem; letter-spacing: .05em; }

/* バトル */
.battle-screen { background: #1d2a44; }
.scene { position: relative; height: clamp(180px, 34vh, 330px); flex: none; overflow: hidden; background-size: cover; background-position: center; transition: height .3s; }
.battle-screen.qmode .scene { height: clamp(150px, 25vh, 280px); }
.enemy-info { position: absolute; left: 50%; top: .5rem; transform: translateX(-50%); display: flex; align-items: center; gap: .6rem; background: rgba(20,30,55,.78); color: #fff; padding: .25rem .8rem; border-radius: 12px; border: 2px solid var(--gold-d); z-index: 3; }
.en-name { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.hpbar { width: min(200px, 26vw); height: 14px; background: #422; border-radius: 99px; overflow: hidden; border: 2px solid #fff; }
.hpbar i { display: block; height: 100%; background: linear-gradient(#8ef08a, #2ea84a); transition: width .6s; }
.wave { position: absolute; right: .8rem; top: .55rem; color: #fff; font-weight: 700; font-size: 1.1rem; text-shadow: 0 2px 0 #000; z-index: 3; }
.monster { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); height: 64%; aspect-ratio: 1; z-index: 2; animation: idle 2.4s ease-in-out infinite; }
.monster svg, .monster img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 4px rgba(0,0,0,.35)); }
@keyframes idle { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-6px); } }
.monster.appear { animation: appear .5s; }
@keyframes appear { 0% { transform: translateX(-50%) scale(.1); opacity: 0; } 70% { transform: translateX(-50%) scale(1.1); opacity: 1; } 100% { transform: translateX(-50%) scale(1); } }
.monster.hurt { animation: hurt .6s; }
@keyframes hurt { 0% { transform: translateX(-50%); filter: brightness(3); } 20% { transform: translateX(-56%); } 40% { transform: translateX(-44%); filter: brightness(1); } 60% { transform: translateX(-53%); } 100% { transform: translateX(-50%); } }
.monster.dodge { animation: dodge .7s; }
@keyframes dodge { 0% { transform: translateX(-50%); } 40% { transform: translateX(-10%) rotate(10deg); } 100% { transform: translateX(-50%); } }
.monster.defeat { animation: defeat 1.2s forwards; }
@keyframes defeat { 0% { transform: translateX(-50%); } 30% { filter: brightness(4); } 100% { transform: translateX(-50%) scale(.2) translateY(-60%); opacity: 0; filter: brightness(4); } }
.party { position: absolute; left: 2%; bottom: 3%; height: 50%; display: flex; align-items: flex-end; gap: 4%; z-index: 3; width: 34%; }
.party .hero { height: 100%; font-size: clamp(12px, 2.2vh, 18px); }
.party .fude { height: 62%; animation: bob 1.6s ease-in-out infinite; border: 0; background: none; padding: 0; }
.party .fude img, .party .fude svg { height: 100%; width: auto; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); }
.msg { position: absolute; left: 36%; right: 1rem; bottom: .5rem; z-index: 4; background: rgba(15,22,40,.86); color: #fff; border: 2px solid #fff; border-radius: 10px; padding: .3em .9em; font-size: 1.15rem; font-weight: 700; min-height: 1.9em; display: flex; align-items: center; gap: .4rem; }
.msg:empty { display: none; }
.flee { position: absolute; left: .6rem; top: .5rem; z-index: 5; }
.dmg { position: absolute; left: 50%; top: 28%; transform: translateX(-50%); z-index: 6; font-size: 2.4rem; font-weight: 700; color: #fff; -webkit-text-stroke: 2px #b8001f; paint-order: stroke fill; animation: dmg 1s forwards; pointer-events: none; white-space: nowrap; }
.dmg.crit { color: #ffe066; -webkit-text-stroke: 2px #c74400; font-size: 2.8rem; }
@keyframes dmg { 0% { transform: translate(-50%, 20px) scale(.5); opacity: 0; } 25% { transform: translate(-50%, 0) scale(1.15); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -30px); opacity: 0; } }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.fx.on::before, .fx.on::after { content: ''; position: absolute; left: 50%; top: 50%; }
.fx.yomiSelect.on::before { width: 140%; height: 14px; background: linear-gradient(90deg, transparent, #fff, #ffe9a0, #fff, transparent); box-shadow: 0 0 20px #ffd34d; transform: translate(-50%, -50%) rotate(-30deg) scaleX(0); animation: slash .45s forwards; }
.fx.yomiSelect.on::after { --r: 25deg; width: 140%; height: 10px; background: linear-gradient(90deg, transparent, #fff, transparent); transform: translate(-50%, -50%) rotate(25deg) scaleX(0); animation: slash .45s .15s forwards; }
@keyframes slash { 0% { transform: translate(-50%, -50%) rotate(var(--r, -30deg)) scaleX(0); opacity: 1; } 60% { transform: translate(-50%, -50%) rotate(var(--r, -30deg)) scaleX(1); opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r, -30deg)) scaleX(1); } }
.fx.yomiWrite.on::before { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(#fff6b0, #ff9a2e 45%, #e2361c 70%, transparent 72%); transform: translate(-50%, -50%); animation: boom .7s forwards; }
.fx.kanjiSelect.on::before { width: 40px; height: 40px; border-radius: 50%; border: 10px solid #8fd3ff; box-shadow: 0 0 30px #4ea4ea, inset 0 0 20px #4ea4ea; transform: translate(-50%, -50%); animation: boom .7s forwards; }
.fx.kanjiWrite.on::before { width: 40px; height: 40px; background: radial-gradient(#fff, #e3c4ff 30%, #9b59d0 55%, transparent 70%); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); transform: translate(-50%, -50%); animation: star .8s forwards; }
@keyframes boom { 0% { transform: translate(-50%, -50%) scale(.2); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(7); opacity: 0; } }
@keyframes star { 0% { transform: translate(-50%, -50%) scale(.2) rotate(0); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(6) rotate(180deg); opacity: 0; } }

.qpanel { flex: 1; min-height: 0; overflow: auto; background: linear-gradient(#2a3a62, #1d2a44); border-top: 4px solid var(--gold-d); padding: .6rem 1rem 1rem; display: flex; flex-direction: column; gap: .55rem; }
.cmd-title { color: #fff; font-size: 1.3rem; font-weight: 700; text-align: center; margin-top: .2rem; }
.cmd-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; flex: 1; max-height: 250px; }
.cmd { position: relative; border: 3px solid var(--gold); border-radius: 16px; padding: .6rem .3rem; color: #fff; background: linear-gradient(160deg, var(--c2), var(--c)); box-shadow: 0 5px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.4); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; }
.cmd:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
.cmd.lock { background: #555c6e; border-color: #8b93a6; color: #c9ced8; box-shadow: 0 5px 0 rgba(0,0,0,.45); }
.cmd .ci { font-size: 2.3rem; }
.cmd .cn { font-size: 1.2rem; font-weight: 700; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.cmd .cs { font-size: .85rem; background: rgba(0,0,0,.25); border-radius: 99px; padding: .1em .7em; }
.cmd .new { position: absolute; top: -10px; right: -6px; background: var(--red); color: #fff; font-size: .8rem; font-weight: 700; border-radius: 99px; padding: .15em .6em; animation: bob 1s infinite; }
.q-card { background: var(--paper); border: 4px solid var(--wood); border-radius: 16px; padding: .5rem 1rem; box-shadow: 0 4px 0 var(--wood-d); }
.q-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.q-tag { background: var(--c); color: #fff; font-weight: 700; border-radius: 99px; padding: .15em .8em; font-size: .95rem; }
.q-inst { font-weight: 700; font-size: 1.1rem; flex: 1; }
.speak { border: 2px solid var(--wood); background: #fff; border-radius: 99px; padding: .2em .7em; font-size: 1rem; font-weight: 700; box-shadow: 0 2px 0 var(--wood-d); flex: none; }
.sentence { font-family: var(--kanji); font-size: 2.2rem; line-height: 2.4; text-align: center; padding: .9rem 0 0; font-weight: 600; word-break: keep-all; }
.sentence .emo { font-family: var(--ui); margin-right: .3em; }
.sentence .target { color: #c62828; background: #ffe7c2; border-bottom: 4px solid #e8833a; border-radius: 8px; padding: 0 .1em; font-size: 1.15em; }
.sentence rt { font-size: .5em; color: #6b5a44; font-weight: 700; letter-spacing: .05em; }
.sentence .tr rt { color: #c62828; font-size: .58em; }
.blank-box { display: inline-block; min-width: 1.3em; height: 1.3em; line-height: 1.3em; vertical-align: middle; border: 3px dashed #e8833a; background: #fff; border-radius: 8px; font-size: 1.15em; color: var(--ok); }
.blank-box.filled { border-style: solid; border-color: var(--ok); background: #e6f7e9; }
.q-body { display: flex; flex-direction: column; align-items: center; gap: .6rem; }
.hint-box { display: flex; align-items: center; gap: .8rem; background: #fff8d6; border: 3px solid #f2c14e; border-radius: 14px; padding: .3rem 1rem; font-weight: 700; font-size: 1.2rem; }
.hint-box .he { font-size: 2.2rem; }
.opt-row { display: flex; gap: .8rem; align-items: stretch; width: min(860px, 100%); }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; flex: 1; }
.opt { font-size: 2rem; font-weight: 700; padding: .45em .2em; border-radius: 16px; background: #fff; border: 4px solid var(--wood); box-shadow: 0 5px 0 var(--wood-d); min-height: 2.5em; }
.opt.kf { font-size: 3rem; padding: .1em; }
.opt:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--wood-d); }
.opt.off { opacity: .25; filter: grayscale(1); box-shadow: none; transform: translateY(4px); }
.opt.glow { border-color: var(--gold); }
.opt.right { background: #d8f5dc; border-color: var(--ok); }
.kana-top { display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap; }
.kana-boxes { display: flex; gap: .4rem; }
.kbox { width: 3.1rem; height: 3.1rem; border: 3px solid var(--wood); background: #fff; border-radius: 10px; font-size: 2rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.kbox.cur { border-color: #e8833a; box-shadow: 0 0 0 4px rgba(232,131,58,.3); }
.kbox .h { color: #cbbb9f; }
.tiles { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; max-width: 660px; }
.tile { width: 3.5rem; height: 3.5rem; font-size: 1.9rem; font-weight: 700; border-radius: 12px; background: #fff; border: 3px solid var(--wood); box-shadow: 0 4px 0 var(--wood-d); }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-d); }
.tile.used { visibility: hidden; }
.tile.glow { border-color: var(--gold); }
.gojuon { display: grid; grid-template-rows: repeat(5, auto); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; width: min(800px, 100%); }

<div id="app"><div style="padding:60px;text-align:center;font-size:28px;color:#fff;font-weight:bold;">じゅんび ちゅう…</div></div>
<div id="modal" class="modal hidden"></div>

<!-- 漢字・例文・書き順は kanji1 から、ぼうけんの データと 絵は この フォルダから（GitHub Pages）読みこみます -->
<script>
(function () {
  var h = location.hostname;
  var local = location.protocol === 'file:' || /github\.io$/.test(h) || h === 'localhost' || h === '127.0.0.1';
  window.KQ_BASE = local ? '' : 'https://zku0395-ops.github.io/hori/kanjiquest/';
  window.K1_BASE = local ? '../kanji1/' : 'https://zku0395-ops.github.io/hori/kanji1/';
  var V = '1';
  var files = [window.K1_BASE + 'data/mondai.js', window.K1_BASE + 'data/strokes.js', window.KQ_BASE + 'data/quest.js'];
  window.KQ_READY = Promise.all(files.map(function (src) {
    return new Promise(function (ok, ng) {
      var s = document.createElement('script');
      s.src = src + '?v=' + V;
      s.onload = ok; s.onerror = function () { ng(new Error(src)); };
      document.head.appendChild(s);
    });
  }));
})();
</script>

<script>
(function () {
  'use strict';
  const APP_VERSION = '1.0.1';
  const app = document.getElementById('app');
  const modal = document.getElementById('modal');
  const $ = (s) => document.querySelector(s);
  const rnd = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rnd(a.length)];
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const safeStore = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できない */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* noop */ } },
  };

  let KANJI, STAGES, STROKES, Q;

  /* =====================================================================
     1. わざ（問題の しゅるい）… この じゅんばんで つかえるように なります
     ===================================================================== */
  const TYPES = {
    yomiSelect:  { name: 'よみの つるぎ',       sub: 'よみかたを えらぶ', icon: '⚔️', c: '#c97a12', c2: '#f0b04a', label: 'よみ・えらぶ' },
    kanjiSelect: { name: 'かんじの たて',       sub: 'かんじを えらぶ',   icon: '🛡️', c: '#1f6fbf', c2: '#5fa8ee', label: 'かんじ・えらぶ' },
    yomiWrite:   { name: 'よみの まほう',       sub: 'よみかたを かく',   icon: '🔥', c: '#c23a30', c2: '#ef7a6e', label: 'よみ・かく' },
    kanjiWrite:  { name: 'かんじの しょうかん', sub: 'かんじを かく',     icon: '✨', c: '#7a3bb3', c2: '#b585e0', label: 'かんじ・かく' },
  };
  const ORDER = ['yomiSelect', 'kanjiSelect', 'yomiWrite', 'kanjiWrite'];

  /* =====================================================================
     2. データの ほぞん（スプレッドシート／おためしモード）
     ===================================================================== */
  const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  const gas = (fn, ...args) => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
  const LOG_HEADER = ['日時', 'なまえ', 'ステージ', 'かんじ', 'もんだい', 'わざ', 'みほん', 'けっか', 'まちがい', 'ヒント', 'まちがえた こたえ', 'びょう', 'ID'];
  const DEFAULT_SETTINGS = { rate: 0.8, font: 1, count: 5, kana: 'もじカード', mihon: 'なし', judge: 'やさしい', sound: true };
  let SET = { ...DEFAULT_SETTINGS };

  // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
  function aggregate(rows) {
    const students = {}, classKanji = {};
    const addK = (m, k, ok, miss, hint) => { const a = m[k] || (m[k] = [0, 0, 0, 0]); a[0]++; a[1] += ok; a[2] += miss; a[3] += hint ? 1 : 0; };
    rows.forEach((r) => {
      const name = String(r[1] || '').trim(); if (!name) return;
      const s = students[name] || (students[name] = { count: 0, ok: 0, secs: 0, last: '', stages: {}, kanji: {}, missProb: {} });
      const day = String(r[0]).slice(0, 10).replace(/-/g, '/');
      if (day > s.last) s.last = day;
      const st = String(r[2]), ok = r[7] === '○' ? 1 : 0;
      s.count++; s.ok += ok; s.secs += Number(r[11]) || 0;
      const g = s.stages[st] || (s.stages[st] = [0, 0]); g[0]++; g[1] += ok;
      const k = String(r[3] || ''), w = String(r[5] || '');
      if (k && w) { addK(s.kanji, k + '|' + w, ok, Number(r[8]) || 0, Number(r[9]) || 0); addK(classKanji, k + '|' + w, ok, Number(r[8]) || 0, Number(r[9]) || 0); }
      if (!ok && Number(r[8]) > 0) { const key = k + '（' + w + '）'; s.missProb[key] = (s.missProb[key] || 0) + 1; }
    });
    return { students, classKanji };
  }

  const Local = {
    key: 'kanjiquest_local_v1', mem: null,
    data() {
      if (this.mem) return this.mem;
      let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) { /* noop */ }
      this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: { ...DEFAULT_SETTINGS } };
      return this.mem;
    },
    save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
  };
  const PENDING_KEY = 'kanjiquest_pending_v1';
  const COPY_KEY = (name) => 'kanjiquest_copy_' + name;
  const fmtTime = (t) => { const d = new Date(t); return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const api = {
    async init() {
      if (HAS_GAS) return gas('getInitData');
      const d = Local.data();
      return { students: d.roster, settings: { ...DEFAULT_SETTINGS, ...d.settings }, demo: true };
    },
    async student(name) {
      if (HAS_GAS) return gas('getStudent', name);
      return Local.data().progress[name] || '';
    },
    async sendOne(p) {
      if (HAS_GAS) return gas('saveResult', p);
      const d = Local.data();
      const old = parseProgress(d.progress[p.name]);
      const neu = parseProgress(p.progress);
      if (!old.t || neu.t >= old.t) {
        if (old.flagT && old.flagT > neu.t) { neu.unlockAll = old.unlockAll; neu.flagT = old.flagT; }
        if (old.goldT && old.goldT > neu.t) { neu.gold = old.gold; neu.goldT = old.goldT; }
        d.progress[p.name] = JSON.stringify(neu);
      }
      const ids = new Set(d.log.map((r) => r[12]));
      (p.records || []).forEach((r) => { if (!ids.has(r.id)) d.log.push([fmtTime(r.time), p.name, r.stage, r.k, r.problem, r.waza, r.mihon || '', r.result, r.miss, r.hint, r.wrong || '', r.secs, r.id]); });
      Local.save();
      return { ok: true };
    },
    readQueue() { try { return JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) { return []; } },
    async save(payload) {
      const queue = api.readQueue().filter((q) => !(q.name === payload.name && !q.records.length));
      queue.push({ ...payload, qid: uid() });
      safeStore.set(PENDING_KEY, JSON.stringify(queue));
      return api.flush();
    },
    pending() { return api.readQueue().length; },
    flushing: false,
    async flush() {
      if (api.flushing) return;
      api.flushing = true;
      try {
        for (let q = api.readQueue()[0]; q; q = api.readQueue()[0]) {
          await api.sendOne(q);
          safeStore.set(PENDING_KEY, JSON.stringify(api.readQueue().filter((x) => x.qid !== q.qid)));
        }
      } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
      finally { api.flushing = false; }
    },
    async teacher(pin) {
      if (HAS_GAS) return gas('getTeacherData', pin);
      const d = Local.data();
      if (String(pin) !== String(d.pin)) return { ok: false };
      const agg = aggregate(d.log);
      return {
        ok: true, demo: true, isDefaultPin: d.pin === '1234', settings: { ...DEFAULT_SETTINGS, ...d.settings }, classKanji: agg.classKanji,
        students: d.roster.map((n) => ({ ...(agg.students[n] || { count: 0, ok: 0, secs: 0, last: '', stages: {}, kanji: {}, missProb: {} }), name: n, progress: d.progress[n] || '' })),
      };
    },
    async setFlag(pin, name, key, value) {
      if (HAS_GAS) return gas('setFlag', pin, name, key, value);
      const d = Local.data(); const p = parseProgress(d.progress[name]);
      p[key] = !!value; p.flagT = Date.now(); p.t = Date.now(); d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true };
    },
    async addGold(pin, name, delta) {
      if (HAS_GAS) return gas('addGold', pin, name, delta);
      const d = Local.data(); const p = parseProgress(d.progress[name]);
      p.gold = Math.max(0, (p.gold || 0) + delta); p.goldT = Date.now(); p.t = Date.now(); d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true };
    },
    async saveSettings(pin, s) {
      if (HAS_GAS) return gas('saveSettings', pin, s);
      const d = Local.data(); const { newPin, ...rest } = s;
      d.settings = { ...d.settings, ...rest }; if (newPin && /^\d{4}$/.test(newPin)) d.pin = newPin; Local.save(); return { ok: true };
    },
    async logRows(pin) {
      if (HAS_GAS) return gas('getLogRows', pin);
      return { ok: true, rows: [LOG_HEADER, ...Local.data().log] };
    },
    async backup(pin) {
      if (HAS_GAS) return gas('getBackup', pin);
      const d = Local.data();
      return { ok: true, data: { app: 'kanjiquest', time: new Date().toISOString(), roster: d.roster.map((n) => [n, d.progress[n] || '']), settings: d.settings } };
    },
    async restore(pin, data) {
      if (HAS_GAS) return gas('restoreBackup', pin, data);
      if (!data || data.app !== 'kanjiquest') return { ok: false };
      const d = Local.data();
      data.roster.forEach(([n, pr]) => { if (!d.roster.includes(n)) d.roster.push(n); d.progress[n] = pr; });
      Local.save(); return { ok: true };
    },
    async clear(pin, name) {
      if (HAS_GAS) return gas('clearRecords', pin, name);
      const d = Local.data();
      d.log = name ? d.log.filter((r) => r[1] !== name) : [];
      d.roster.forEach((n) => { if (!name || n === name) d.progress[n] = ''; });
      Local.save(); return { ok: true };
    },
  };
  window.addEventListener('online', () => api.flush());

  /* =====================================================================
     3. しんちょく（すすみぐあい）
     ===================================================================== */

  let AC = null;
  function tone(notes, type = 'square', vol = 0.05) {
    if (!SET.sound) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      let t = AC.currentTime;
      notes.forEach(([f, d]) => {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);

      });
    } catch (e) { /* noop */ }
  }

  function parseSentence(s) {
    const out = [], re = /\[(.+?)\]|\{(.+?)\|(.+?)\}/g;
    let last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) out.push({ t: 'text', v: s.slice(last, m.index) });
      if (m[1]) out.push({ t: 'target', v: m[1] }); else out.push({ t: 'ruby', k: m[2], r: m[3] });
      last = re.lastIndex;
    }
    if (last < s.length) out.push({ t: 'text', v: s.slice(last) });
    return out;
  }
  const plainText = (s) => s.replace(/[\[\]]/g, '').replace(/\{(.+?)\|.+?\}/g, '$1');
  const speakText = (s, y, skip) => parseSentence(s).map((p) => p.t === 'text' ? p.v : p.t === 'ruby' ? p.r : (skip ? '、、' : y)).join('');
  // mode: hide（よみの もんだい）／ blank（かんじの もんだい）／ answer（こたえ つき）
  function sentenceHTML(ex, mode) {
    return parseSentence(ex.s).map((p) => {
      if (p.t === 'text') return esc(p.v);
      if (p.t === 'ruby') return `<ruby>${esc(p.k)}<rt>${esc(p.r)}</rt></ruby>`;
      if (mode === 'hide') return `<span class="target">${esc(p.v)}</span>`;
      if (mode === 'blank') return `<ruby class="tr"><span class="blank-box">　</span><rt>${esc(ex.y)}</rt></ruby>`;

  /* =====================================================================
     7. 問題を つくる（kanji1 と おなじ かんがえかた。選択肢は 3つ）
     ===================================================================== */
  const otherReadings = (k, y) => (KANJI[k] ? KANJI[k].yomi.filter((r) => r !== y) : []);
  const lookOf = (k) => (KANJI[k] ? KANJI[k].look : []);
  function makeQ(k, type, sid) {
    const d = KANJI[k];
    // よく まちがえる 例文を すこし 多めに
    const ex = pick(d.ex);
    const q = { type, k, ex, tries: 0, hint: 0, off: [], wrong: [], solved: false, t0: Date.now() };
    const pool = stageKanji(sid);
    if (type === 'yomiSelect') {
      const same = shuffle(otherReadings(k, ex.y));
      const looks = lookOf(k).filter((l) => KANJI[l]).map((l) => ({ r: KANJI[l].ex[0].y, from: l }));
      const others = shuffle(pool.filter((x) => x !== k)).map((l) => ({ r: pick(KANJI[l].ex).y, from: l }));
      const picked = [];
      const add = (r) => { if (r && r !== ex.y && !picked.includes(r) && picked.length < 2) picked.push(r); };
      if (same[0]) add(same[0]);
      if (looks[0]) add(looks[0].r);
      others.forEach((o) => add(o.r));
      Object.values(KANJI).forEach((x) => add(x.ex[0].y));
      q.why = {};
      same.forEach((r) => { q.why[r] = { type: 'same' }; });
      looks.concat(others).forEach((o) => { if (!q.why[o.r]) q.why[o.r] = { type: lookOf(k).includes(o.from) ? 'look' : 'other', from: o.from }; });
      q.answer = ex.y; q.options = shuffle([ex.y].concat(picked));
    }
    if (type === 'kanjiSelect') {
      const picked = [];
      const add = (c) => { if (c && c !== k && KANJI[c] && !picked.includes(c) && picked.length < 2) picked.push(c); };
      lookOf(k).slice(0, 2).forEach(add);
      shuffle(pool).forEach(add);
      shuffle(Object.keys(KANJI)).forEach(add);
      q.answer = k; q.options = shuffle([k].concat(picked));
    }
    if (type === 'yomiWrite') {
      q.answer = ex.y; q.input = [];
      const chars = [...ex.y];
      const POOL = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわんがぎぐげござじずぜぞだでどばびぶべぼゃゅょっ'.split('');
      const extra = shuffle(POOL.filter((c) => !chars.includes(c))).slice(0, Math.max(3, 7 - chars.length));
      q.tiles = shuffle(chars.concat(extra)).map((c) => ({ c, used: false }));
    }
    if (type === 'kanjiWrite') {
      q.answer = k;
      const n = (P.cards[k] && P.cards[k].t && P.cards[k].t.kanjiWrite) || 0;
      q.mihon = SET.mihon === 'なぞる' ? 'trace' : SET.mihon === 'うすい' ? 'ghost' : SET.mihon === 'なし' ? 'none' : (n === 0 ? 'trace' : n === 1 ? 'ghost' : 'none');
    }
    return q;
  }

  /* =====================================================================
     8. がめんの きりかえ
     ===================================================================== */
  const ACT = {};
  const onClick = (e) => {
    const b = e.target.closest('[data-act]');

  /* ---- しゅじんこう えらび ---- */
  let heroPick = '';
  function scHero(first) {
    heroPick = P.hero || '';
    app.innerHTML = `<div class="screen hero-screen"><div class="panel">
      <h2 style="margin:0">${first ? 'どの しゅじんこうで ぼうけん する？' : 'しょくぎょうを かえる'}</h2>
      <div class="hero-grid">${Q.HEROES.map((h) => `<button class="hero-card ${heroPick === h.id ? 'on' : ''}" data-act="heroPick" data-arg="${h.id}">

  ACT.heroOK = (first) => {

    P.hero = heroPick; persist();

    if (first) return scStory(0);

  };

  /* ---- ストーリー ---- */
  const STORY = [
    { t: 'ここは ことばの しま「コトノハ」。かんじの ちからで かがやく、いろ あざやかな しまでした。', art: () => `<div style="width:min(520px,80vw);border-radius:18px;overflow:hidden">${IMG.world_map ? `<img src="${IMG.world_map}" style="width:100%;display:block">` : worldSVG()}</div>` },
    { t: 'ところが ある ひ、かんじを たべる まものたちが あらわれて、しまの かんじを もって いって しまいました。', art: () => ['s1', 'r1', 'r4'].map((id) => `<div class="fit" style="width:min(200px,26vw);aspect-ratio:1">${monsterHTML(id)}</div>`).join('') },
    { t: 'きみは あいぼうの ドラゴン「フデリュウ」と いっしょに、まものを たおして かんじを とりもどすんだ！', art: () => `<div style="height:min(300px,40vh);font-size:18px">${heroHTML()}</div><div class="fit" style="height:min(180px,26vh);aspect-ratio:1">${fudeHTML()}</div>` },

  function scStory(i) {

      </div></div>`;

  }
  ACT.storyNext = (i) => { SE.tap(); i = +i; if (i >= STORY.length) ACT.storySkip(); else scStory(i); };
  ACT.storySkip = () => { P.story = true; persist(); hush(); scWorld(); };

  /* ---- ワールドマップ ---- */
  function scWorld() {
    document.documentElement.style.setProperty('--fs', SET.font || 1);
    const total = Object.keys(KANJI).length;
    const prog = cardCount() / total;
    const now = currentStageId(), nowArea = now && areaOf(now);
    const pins = Q.AREAS.map((a) => {
      const open = areaOpen(a);
      const all = a.stages.flatMap((s) => stageDef(s).kanji);
      const got = all.filter((k) => P.cards[k]).length;
      return `<button class="pin ${open ? '' : 'locked'} ${nowArea === a ? 'now' : ''}" style="left:${a.pos.x}%;top:${a.pos.y}%" data-act="toArea" data-arg="${a.id}">
        <span class="pi">${open ? a.icon : '🔒'}</span><span class="pl">${a.name}</span><span class="ps">${open ? `かんじ ${got}/${all.length}${stageDone(a.boss) ? ' 👑' : ''}` : 'まだ とじて いるよ'}</span></button>`;
    }).join('') + Q.COMING.map((c) => `<button class="pin locked" style="left:${c.pos.x}%;top:${c.pos.y}%" data-act="coming"><span class="pi">🔒</span><span class="pl">${c.name}</span><span class="ps">じゅんびちゅう</span></button>`).join('');
    app.innerHTML = `<div class="screen" style="background:#2a7fc0">
      ${topBar('ワールドマップ', 'toNames')}
      <div class="map-area"><div class="map-wrap">
        <div class="map" style="filter:saturate(${(0.25 + 0.75 * prog).toFixed(2)})">${IMG.world_map ? `<img src="${IMG.world_map}" alt="">` : worldSVG()}</div>${pins}
      </div></div>
      <div class="meter-row">🌈 しまの いろ <div class="meter"><i style="width:${Math.round(prog * 100)}%"></i></div> ${Math.round(prog * 100)}%</div>
    </div>`;
  }
  ACT.toWorld = () => { SE.tap(); scWorld(); };
  ACT.coming = () => toast('この しまは まだ じゅんびちゅう だよ');

  /* ---- エリア ---- */
  let curArea = null;
  function scArea(id) {
    const a = Q.AREAS.find((x) => x.id === id);
    if (!areaOpen(a)) { toast('まえの エリアの ボスを たおすと ひらくよ'); speak('まえの エリアの ボスを たおすと ひらくよ。'); return; }
    curArea = a;
    const now = currentStageId();
    const ids = a.stages.concat([a.boss]);
    const nodes = ids.map((sid, i) => {
      const st = stageDef(sid), boss = isBoss(sid), open = stageOpen(sid), done = stageDone(sid);
      const n = a.nodes[i];
      const waza = boss ? '' : wazaOf(sid).map((t) => TYPES[t].icon).join('');
      return `<button class="node ${boss ? 'boss' : ''} ${done ? 'cleared' : ''} ${open ? '' : 'locked'} ${sid === now ? 'now' : ''}" style="left:${n.x}%;top:${n.y}%" data-act="enter" data-arg="${sid}">
        <span class="nm">${monsterHTML(sid)}</span>
        <span class="nn">${boss ? '👑 ボス' : esc(st.name)}${done ? ' 🚩' : ''}</span>
        <span class="nk">${boss ? 'まとめ ふくしゅう' : st.kanji.join(' ')}</span>
        ${open && !boss ? `<span class="nw">${waza}</span>` : ''}</button>`;
    }).join('');
    app.innerHTML = `<div class="screen" style="background:#4f9a3f">
      ${topBar(a.name, 'toWorld')}
      <div class="map-area"><div class="map-wrap">
        <div class="map">${IMG['field_' + a.id] ? `<img src="${IMG['field_' + a.id]}" alt="">${roadSVG(a)}` : fieldSVG(a)}</div>${nodes}
      </div></div></div>`;
  }
  ACT.toArea = (id) => { SE.tap(); scArea(id); };

  /* =====================================================================
     9. バトル
     ===================================================================== */
  let B = null;
  function chooseQueue(sid) {
    const n = SET.count || 5;
    const ks = stageKanji(sid);
    const weight = (k) => (P.miss[k] || 0) * 2 + (P.cards[k] ? 0 : 1) + Math.random() * 1.5;
    if (isBoss(sid)) return ks.slice().sort((x, y) => weight(y) - weight(x)).slice(0, n);
    if (n >= 10) return shuffle(ks).concat(shuffle(ks)).slice(0, 10);
    return shuffle(ks).slice(0, Math.min(n, ks.length));
  }
  ACT.enter = (sid) => {
    SE.tap();
    if (!stageOpen(sid)) {
      const t = isBoss(sid) ? 'この エリアの ステージを ぜんぶ クリアすると ボスが でて くるよ。' : 'まえの ステージを クリアすると ひらくよ。';
      toast(t); speak(t); return;
    }
    if (P.battle && P.battle.sid === sid && P.battle.idx > 0) {
      openModal(`<h2>つづきから する？</h2><p>まえに とちゅうで やめた たたかいが あるよ。</p>
        <div class="modal-btns"><button class="btn" data-act="startFresh" data-arg="${sid}">はじめから</button><button class="btn gold" data-act="resume">つづきから</button></div>`);
      speak('つづきから する？');
      return;
    }
    startBattle(sid);
  };
  ACT.startFresh = (sid) => { closeModal(); startBattle(sid); };
  ACT.resume = () => {
    closeModal();
    const b = P.battle;
    B = { sid: b.sid, area: areaOf(b.sid), queue: b.queue, idx: b.idx, hp: b.hp, max: b.max, usedNew: !!b.usedNew, busy: false, q: null, got: b.got || [], newCards: [], gold: b.gold || 0 };
    renderBattle(false);
    say('つづきから たたかおう！');
  };
  function startBattle(sid) {
    const queue = chooseQueue(sid);
    B = { sid, area: areaOf(sid), queue, idx: 0, hp: queue.length, max: queue.length, usedNew: false, busy: false, q: null, got: [], newCards: [], gold: 0 };
    saveBattle();
    renderBattle(true);
    const m = Q.MON[sid];
    say(`${m.name}が あらわれた！`, `${m.name}が、あらわれた！`);
  }
  function saveBattle() { P.battle = { sid: B.sid, queue: B.queue, idx: B.idx, hp: B.hp, max: B.max, usedNew: B.usedNew, got: B.got, gold: B.gold }; }
  function renderBattle(appear) {
    const sid = B.sid, a = B.area;
    app.innerHTML = `<div class="screen battle-screen">
      <div class="scene" id="scene" style="${bgStyle('bg_' + a.id)}">
        ${IMG['bg_' + a.id] ? '' : battleBgSVG(a)}
        <button class="btn small flee" data-act="flee">にげる</button>
        <div class="enemy-info"><span class="en-name">${Q.MON[sid].name}</span><div class="hpbar"><i id="hpfill" style="width:${(B.hp / B.max) * 100}%"></i></div></div>
        <div class="wave" id="wave"></div>
        <div class="monster ${appear ? 'appear' : ''}" id="monster">${monsterHTML(sid)}</div>
        <div class="party">${heroHTML()}<button class="fude" data-act="speakAgain" aria-label="もういちど きく">${fudeHTML()}</button></div>
        <div class="fx" id="fx"></div>
        <div class="msg" id="msg"></div>
      </div>
      <div class="qpanel" id="qpanel"></div></div>`;
    updateWave();
    renderCommand();
  }
  const updateWave = () => { const w = $('#wave'); if (w) w.textContent = `もんだい ${Math.min(B.idx + 1, B.max)} / ${B.max}`; };
  ACT.flee = () => {
    openModal(`<h2>やめますか？</h2><p>つぎは「つづきから」 はじめられるよ。</p>
      <div class="modal-btns"><button class="btn" data-act="closeModal">たたかう</button><button class="btn red" data-act="doFlee">やめる</button></div>`);
  };
  ACT.doFlee = () => { closeModal(); hush(); saveBattle(); persist(); scArea(B.area.id); };

  function renderCommand() {
    const sc = app.querySelector('.battle-screen'); if (sc) sc.classList.remove('qmode');
    const can = wazaOf(B.sid);
    const newest = !isBoss(B.sid) && !P.unlockAll && !stInfo(B.sid).done ? can[can.length - 1] : null;
    $('#qpanel').innerHTML = `<div class="cmd-title">どの わざで たたかう？</div>
      <div class="cmd-row">${ORDER.map((t) => {
        const T = TYPES[t], ok = can.includes(t);
        return `<button class="cmd ${ok ? '' : 'lock'}" style="--c:${T.c};--c2:${T.c2}" data-act="${ok ? 'chooseType' : 'lockedWaza'}" data-arg="${t}">
          ${ok && t === newest && can.length > 1 && !B.usedNew ? '<span class="new">あたらしい わざ！</span>' : ''}
          <span class="ci">${ok ? T.icon : '🔒'}</span><span class="cn">${T.name}</span><span class="cs">${T.sub}</span></button>`;
      }).join('')}</div>`;
  }
  ACT.lockedWaza = () => { const t = 'この わざは まだ つかえないよ。たたかうと つかえるように なるよ。'; toast(t); speak(t); };
  ACT.chooseType = (type) => {
    if (B.busy) return;
    SE.tap();
    B.q = makeQ(B.queue[B.idx], type, B.sid);
    renderQ();
    const q = B.q;
    const inst = { yomiSelect: 'あかい かんじの よみかたを えらぼう。', kanjiSelect: 'しかくに はいる かんじを えらぼう。', yomiWrite: 'あかい かんじの よみかたを かこう。', kanjiWrite: 'しかくに はいる かんじを かこう。わからない ときは ヒントを おしてね。' }[type];
    const isYomi = type === 'yomiSelect' || type === 'yomiWrite';
    say(inst.replace(/。$/, ''), inst + ' ' + speakText(q.ex.s, q.ex.y, isYomi));
  };

  const INST = { yomiSelect: 'あかい かんじの よみかたを えらぼう', kanjiSelect: '□に はいる かんじを えらぼう', yomiWrite: 'あかい かんじの よみかたを かこう', kanjiWrite: '□に はいる かんじを かこう' };
  function renderQ() {
    const q = B.q, T = TYPES[q.type];
    const sc = app.querySelector('.battle-screen'); if (sc) sc.classList.add('qmode');
    $('#qpanel').innerHTML = `<div class="q-card">
        <div class="q-head" style="--c:${T.c}"><span class="q-tag">${T.icon} ${T.name}</span><span class="q-inst">${INST[q.type]}</span>
          <button class="speak" data-act="speakQ">🔊 もういちど</button></div>
        <div class="sentence" id="sentence"></div>
      </div>
      <div class="q-body" id="qbody"></div>`;
    refreshSentence();
    if (q.type === 'kanjiWrite') renderWrite();
    else refreshBody();
  }
  function refreshSentence() {
    const q = B.q, isYomi = q.type === 'yomiSelect' || q.type === 'yomiWrite';
    $('#sentence').innerHTML = `<span class="emo">${q.ex.e || ''}</span>` + sentenceHTML(q.ex, q.solved ? 'answer' : isYomi ? 'hide' : 'blank');
  }
  function refreshBody() {
    const q = B.q;
    if (q.type === 'yomiWrite') $('#qbody').innerHTML = kanaHTML(q);
    else $('#qbody').innerHTML = optsHTML(q);
  }
  ACT.speakQ = () => {
    const q = B && B.q; if (!q) return;
    const isYomi = q.type === 'yomiSelect' || q.type === 'yomiWrite';
    speak(speakText(q.ex.s, q.ex.y, isYomi && !q.solved));
  };

  // ヒント（3だんかい）
  function hintBox(q) {
    if (!q.hint || q.solved) return '';
    const d = KANJI[q.k];
    if (q.type === 'yomiSelect') return `<div class="hint-box"><span class="he">${q.ex.e || '💡'}</span><span>${q.hint >= 2 ? `さいしょの もじは「<span style="color:#c62828">${q.ex.y[0]}</span>」だよ` : esc(d.story)}</span></div>`;
    if (q.type === 'kanjiSelect') return `<div class="hint-box"><span class="he">${q.ex.e || '💡'}</span><span>${esc(d.story)}</span></div>`;
    if (q.type === 'yomiWrite') return `<div class="hint-box"><span class="he">💡</span><span>${q.hint >= 2 ? 'うすい もじを みて えらんでね' : `さいしょの もじは「<span style="color:#c62828">${q.ex.y[0]}</span>」だよ`}</span></div>`;
    return '';
  }
  function useHint(lv) {
    const q = B.q; if (!q || q.solved) return;
    q.hint = Math.max(q.hint, lv);
    const d = KANJI[q.k];
    if (q.type === 'yomiSelect' || q.type === 'kanjiSelect') {
      if (lv >= 2) { const wrong = q.options.filter((o) => o !== q.answer && !q.off.includes(o)); if (wrong.length > 1) q.off.push(pick(wrong)); }
      if (lv === 1) say(esc(d.story)); else if (lv === 2) say('まちがいを 1つ けしたよ。'); else say('ひかって いる ものを えらんでね。');
    } else if (q.type === 'yomiWrite') {
      if (lv === 1) say(`さいしょの もじは「${q.ex.y[0]}」だよ。`);
      else if (lv === 2) say('うすい もじを みて えらんでね。');
      else say(`こたえは「${q.ex.y}」。ひかって いる もじを じゅんばんに えらんでね。`);
    }
    refreshBody();
  }
  ACT.hint = () => { const q = B.q; if (!q || q.solved || B.busy) return; SE.tap(); useHint(Math.min(3, q.hint + 1)); };
  const hintBtn = (q) => `<button class="btn hint ${q.tries >= 1 && q.hint < 3 ? 'glow' : ''}" data-act="hint">💡<br>ヒント</button>`;

  /* --- えらぶ --- */
  function optsHTML(q) {
    const kf = q.type === 'kanjiSelect' ? 'kf' : '';
    return `${hintBox(q)}<div class="opt-row"><div class="opts">${q.options.map((o, i) => {

  function weakOf(kanji) {

    }).join('')}</tr>`).join('')).join('');

  ACT.tKid = (n) => { tKid = n; scTeacher(); };
  ACT.tExit = async () => { const r = await api.init().catch(() => null); if (r) { STUDENTS = r.students; SET = { ...DEFAULT_SETTINGS, ...r.settings }; } document.documentElement.style.setProperty('--fs', SET.font || 1); scNames(); };
  ACT.tUnlock = async () => { const s = TD.students.find((x) => x.name === tKid); const p = parseProgress(s.progress); await api.setFlag(PIN, tKid, 'unlockAll', !p.unlockAll); toast('かえました'); reloadTeacher(); };
  ACT.tGold = async (d) => { await api.addGold(PIN, tKid, Number(d)); toast('かえました'); reloadTeacher(); };
  ACT.tSave = async () => {
    const f = $('#tform'), s = {};
    f.querySelectorAll('input[type=radio]:checked').forEach((r) => { s[r.name] = r.value; });
    s.rate = Number(s.rate); s.font = Number(s.font); s.count = Number(s.count); s.sound = s.sound === 'true';
    const np = $('#newPin').value.trim();
    if (np) { if (!/^\d{4}$/.test(np)) return toast('暗証番号は 4けたの 数字に してください'); s.newPin = np; }
    const r = await api.saveSettings(PIN, s);
    if (r && r.ok) { if (s.newPin) PIN = s.newPin; SET = { ...SET, ...s }; delete SET.newPin; toast('保存しました'); reloadTeacher(); }
  };
  ACT.tFlush = async () => { await api.flush(); toast('送りました'); scTeacher(); };
  ACT.tCsv = async () => {
    const r = await api.logRows(PIN); if (!r || !r.ok) return;
    const csv = '﻿' + r.rows.map((row) => row.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    download(csv, 'text/csv', `かんじの ぼうけん 記録_${fmtTime(Date.now()).slice(0, 10).replace(/\//g, '')}.csv`);
  };
  ACT.tBackup = async () => { const r = await api.backup(PIN); if (r && r.ok) download(JSON.stringify(r.data), 'application/json', `かんじの ぼうけん バックアップ_${fmtTime(Date.now()).slice(0, 10).replace(/\//g, '')}.json`); };
  ACT.tClearOne = () => confirmBox(`「${esc(tKid)}」さんの記録を消しますか？`, '集めたカード・ゴールド・すすみぐあいも消えます。元には もどせません。', 'tClearOneOK');
  ACT.tClearAll = () => confirmBox('全員の記録を消しますか？', '名簿の名前は残りますが、全員の記録と すすみぐあいが消えます。元には もどせません。', 'tClearAllOK');
  ACT.tClearOneOK = async () => { closeModal(); await api.clear(PIN, tKid); safeStore.del(COPY_KEY(tKid)); toast('消しました'); reloadTeacher(); };
  ACT.tClearAllOK = async () => { closeModal(); await api.clear(PIN, ''); TD.students.forEach((s) => safeStore.del(COPY_KEY(s.name))); toast('消しました'); reloadTeacher(); };
  function confirmBox(title, text, act) {
    openModal(`<h2>${title}</h2><p>${text}</p><div class="modal-btns"><button class="btn" data-act="closeModal">やめる</button><button class="btn red" data-act="${act}">消す</button></div>`);
  }
  function download(text, type, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }

  /* =====================================================================
     13. はじめ
     ===================================================================== */
  async function boot() {
    try { await window.KQ_READY; } catch (e) {
      app.innerHTML = '<div style="padding:40px;text-align:center;font-size:24px;color:#fff">データが よみこめませんでした。インターネットに つながって いるか たしかめて、ひらきなおして ください。</div>';
      return;
    }
    KANJI = window.KANJI_DATA.KANJI; STAGES = window.KANJI_DATA.STAGES; STROKES = window.KANJI_STROKES; Q = window.QUEST;
    try { if ('speechSynthesis' in window) speechSynthesis.getVoices(); } catch (e) { /* noop */ }
    const [init] = await Promise.all([api.init().catch(() => ({ students: [], settings: {} })), preload()]);
    STUDENTS = init.students || []; DEMO = !!init.demo; SET = { ...DEFAULT_SETTINGS, ...(init.settings || {}) };
    document.documentElement.style.setProperty('--fs', SET.font || 1);
    api.flush();
    scTitle();
  }
  // テスト用（ブラウザで たしかめる ときに つかいます）
  window.__KQ = { get P() { return P; }, get B() { return B; }, get W() { return W; }, ACT };
  boot();
})();
</script>
</body>
