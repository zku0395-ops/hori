<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チョークんの マイこくばん</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html { font-size: 16px; }
    * { box-sizing: border-box; }
    body { font-family: 'BIZ UDPGothic', 'BIZ UDGothic', sans-serif; background: #f4efe2; margin: 0; color: #1f2937; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    button { font-family: inherit; color: inherit; cursor: pointer; }
    ruby rt { font-size: .45em; font-weight: 700; }
    .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .page { flex: 1; overflow: auto; padding: 1.2rem; }

    /* ボタン（押すと しずむ） */
    .btn { color: #1f2937; border: 2px solid #94a3b8; border-bottom-width: 6px; border-radius: 14px; background: #fff; font-weight: 700; font-size: 1.1rem; padding: .5rem .9rem; min-height: 3rem; display: inline-flex; align-items: center; justify-content: center; gap: .35rem; transition: transform .08s, border-bottom-width .08s; white-space: nowrap; }
    .btn:active { transform: translateY(4px); border-bottom-width: 2px; }
    .btn:disabled { opacity: .4; }
    .btn.big { font-size: 1.5rem; padding: .8rem 1.6rem; border-radius: 18px; }
    .btn.sm { font-size: .95rem; min-height: 2.5rem; padding: .3rem .6rem; border-bottom-width: 5px; }
    .btn.on { background: #fde68a; border-color: #d97706; }
    .btn.green { background: #4ade80; border-color: #15803d; }
    .btn.orange { background: #fdba74; border-color: #c2410c; }
    .btn.blue { background: #93c5fd; border-color: #1d4ed8; }
    .btn.red { background: #fca5a5; border-color: #b91c1c; }
    .btn.dark { background: #334155; border-color: #0f172a; color: #fff; }
    .btn.ghost { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.5); color: #fff; }
    .row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }

    /* 上の おび */
    .top { display: flex; align-items: center; gap: .6rem; padding: .4rem .7rem; background: #7c5a35; color: #fff; }
    .qbox { flex: 1; min-width: 0; display: flex; align-items: center; gap: .5rem; background: #fffdf4; color: #1f2937; border-radius: 16px; padding: .25rem .7rem .25rem .3rem; border: 3px solid #e7c98f; cursor: pointer; }
    .qtext { flex: 1; min-width: 0; font-size: 1.15rem; font-weight: 700; line-height: 1.9; }
    .qnav { border: 0; background: #fde68a; border-radius: 10px; width: 2.4rem; height: 2.4rem; font-size: 1.1rem; font-weight: 700; }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid #e7c98f; }
    .seg button { border: 0; background: #a37c4e; color: #fff; font-weight: 700; font-size: 1rem; padding: .45rem .6rem; min-height: 2.6rem; }
    .seg button.on { background: #fde68a; color: #7c2d12; }
    .seg.light { border-color: #94a3b8; }
    .seg.light button { background: #fff; color: #334155; }
    .seg.light button.on { background: #fde68a; color: #7c2d12; }

    /* しごとの 画面 */
    .work { flex: 1; display: flex; min-height: 0; }
    .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
    .pane-text { background: #fffdf4; border-right: 6px solid #7c5a35; }
    .pane-board { background: #3f2f1c; }
    .tbar { display: flex; align-items: center; gap: .3rem; padding: .4rem .4rem; background: #f1e7cf; flex-wrap: wrap; }
    .tbar .seg button { padding: .45rem .42rem; } /* 「もじ」を 足しても 1だんに 入るように */
    .pen { width: 2.7rem; height: 2.7rem; padding: 0; flex: none; border-radius: 50%; border: 3px solid #64748b; border-bottom-width: 6px; font-size: 1.3rem; display: inline-flex; align-items: center; justify-content: center; }
    .pen:active { transform: translateY(3px); border-bottom-width: 3px; }
    .pen.on { outline: 4px solid #f59e0b; outline-offset: 2px; }

    .tscroll { flex: 1; min-height: 0; overflow: auto; padding: 1.2rem 1.4rem; }
    .tscroll.v { writing-mode: vertical-rl; overflow-x: auto; overflow-y: hidden; }
    .tscroll.paint { touch-action: none; }
    .tscroll.v.over { padding-bottom: 4.4rem; }
    .tbody { font-family: 'BIZ UDGothic', 'BIZ UDPGothic', sans-serif; font-size: 1.7rem; line-height: 2.5; letter-spacing: .04em; }
    .tpic { display: block; inline-size: auto; max-inline-size: 100%; block-size: 13rem; border-radius: 16px; border: 4px solid #e7c98f; margin-block-end: 1rem; background: #fff; }
    .tscroll.v .tpic { block-size: 15rem; inline-size: auto; max-block-size: none; }
    /* 子どもの 画面：文章の ぜんぶが 1つの 画面に 入るように、文字の 大きさを 自動で 合わせる（絵と だいめいも いっしょに 小さく なる） */
    .tbody.fit .ttitle { font-size: 1.18em; }
    .tbody.fit .tpic { block-size: 7.65em; margin-block-end: .6em; }
    .tscroll.v .tbody.fit .tpic { block-size: 8.8em; }
    .tbody.fit[data-nopic] .tpic { display: none; }
    .cardpic { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; border: 3px solid #e7c98f; }
    .ttitle { font-size: 2rem; font-weight: 700; margin: 0; padding-block-end: .6em; padding-inline-start: 1.5em; }
    .ln { margin: 0; }
    .ln.blank { block-size: .9em; }
    .u { cursor: pointer; border-radius: 8px; padding-block: .12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .u.gap { margin-inline-start: .5em; }
    .u.m-r { background: #ffb3b3; } .u.m-b { background: #a5d2ff; } .u.m-g { background: #a8eeaa; } .u.m-y { background: #ffee70; }
    .u.sel { outline: 4px solid #f59e0b; outline-offset: -1px; background: #fff3c4; }
    .u.sel.m-r { background: #ffb3b3; } .u.sel.m-b { background: #a5d2ff; } .u.sel.m-g { background: #a8eeaa; } .u.sel.m-y { background: #ffee70; }
    .u.ans { box-shadow: 0 0 0 3px #7c3aed inset; }
    .u.maybe { outline: 3px dotted #ea580c; outline-offset: -1px; }
    .u.glow { animation: glowu 1.1s ease-in-out infinite; }
    @keyframes glowu { 0%,100% { background-color: #fff7c2; box-shadow: 0 0 0 3px #facc15 inset; } 50% { background-color: #fde047; box-shadow: 0 0 0 5px #f59e0b inset; } }
    .u .ok { color: #dc2626; font-weight: 700; font-size: .8em; }
    .ln.hl { background: #fff3b0; border-radius: 10px; }
    .qtools { display: flex; align-items: center; gap: .4rem; padding: .3rem .5rem; background: #fff7d6; border-bottom: 3px solid #f1e7cf; min-height: 3.2rem; }
    .qmsg { flex: 1; min-width: 0; font-weight: 700; font-size: 1.05rem; line-height: 1.5; }
    .btn.glowb { animation: hintb 1.1s ease-in-out infinite; }
    @keyframes hintb { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 10px rgba(250,204,21,0); } }
    .chip { border: 2px solid #94a3b8; border-radius: 999px; background: #fff; padding: .25rem .8rem; font-size: 1rem; font-weight: 700; margin: .15rem; }
    .chip.on { background: #fbcfe8; border-color: #db2777; }
    .ln.pstart { margin-block-start: 1.1em; }
    .pnum { color: #c2410c; font-weight: 700; font-size: 1.2em; margin-inline-end: .25em; }
    .ftag { position: absolute; left: 0; top: 100%; margin-top: 4px; writing-mode: horizontal-tb; white-space: nowrap; background: #ffc9d6; border: 2px solid #db2777; border-radius: 999px; padding: 0 12px; font-size: 20px; line-height: 1.7; box-shadow: 2px 3px 0 rgba(0,0,0,.25); }
    .head { color: #fff; font-weight: 700; font-size: 26px; line-height: 1.3; padding: 6px 16px; border: 4px dashed rgba(255,255,255,.75); border-radius: 14px; white-space: nowrap; background: rgba(255,255,255,.08); }
    .head.v { writing-mode: vertical-rl; padding: 14px 6px; line-height: 1.25; }
    .stag { position: absolute; left: 0; bottom: 100%; margin-bottom: 5px; white-space: nowrap; background: #fff7d6; border: 3px solid #b45309; border-radius: 10px; padding: 2px 10px; font-size: 24px; line-height: 1.6; box-shadow: 2px 3px 0 rgba(0,0,0,.25); writing-mode: horizontal-tb; }
    .stag.v { left: auto; right: 0; writing-mode: vertical-rl; padding: 8px 4px; height: max-content; max-height: 76px; box-sizing: border-box; white-space: pre-wrap; line-height: 1.4; }
    .stag .ok { color: #dc2626; }
    .fusen.pickme { animation: pickme 1s ease-in-out infinite; cursor: pointer; z-index: 6; }
    @keyframes pickme { 0%,100% { outline: 6px solid #fde047; outline-offset: 2px; } 50% { outline: 10px solid #f59e0b; outline-offset: 5px; } }
    .fusen.fmaybe { outline: 5px dotted #ea580c; outline-offset: 3px; }
    .u .csel { background: #ffd84d; box-shadow: 0 0 0 2px #f59e0b; border-radius: 4px; }
    .u.reading { outline: 3px dashed #0ea5e9; outline-offset: -1px; }
    .u .cnt { font-size: .5em; font-weight: 700; color: #7c2d12; writing-mode: horizontal-tb; }
    .preview .u { outline: 2px dashed #94a3b8; outline-offset: -3px; }
    .scrollbtn { position: absolute; bottom: .5rem; width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 3px solid #a37c4e; border-bottom-width: 6px; background: #fff; font-size: 1.3rem; z-index: 3; opacity: .92; }
    .scrollbtn:active { transform: translateY(3px); border-bottom-width: 3px; }
    .selbar { display: flex; align-items: center; gap: .45rem; padding: .45rem .6rem; background: #fde68a; border-top: 4px solid #f59e0b; flex-wrap: wrap; }
    .selword { flex: 1 1 8rem; min-width: 0; font-weight: 700; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* マイこくばん */
    .boardwrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: .5rem; overflow: hidden; }
    .board { position: relative; flex: none; }
    .boardin { position: absolute; left: 0; top: 0; width: 1000px; height: 700px; transform-origin: 0 0; background: #1f5a3d; background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 9px 9px; border: 10px solid #b98a52; border-radius: 12px; overflow: hidden; touch-action: none; }
    .it { position: absolute; touch-action: none; cursor: grab; }
    .fusen { padding: 12px 14px; border-radius: 6px; box-shadow: 3px 4px 0 rgba(0,0,0,.28); font-family: 'BIZ UDGothic', sans-serif; font-weight: 700; line-height: 2.1; color: #1f2937; min-width: 60px; min-height: 60px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .fusen.c-w { background: #fff; } .fusen.c-y { background: #fff3a6; } .fusen.c-p { background: #ffc9d6; } .fusen.c-b { background: #bfe3ff; } .fusen.c-g { background: #c6f3c0; }
    .fusen .tab { position: absolute; left: -6px; top: -14px; font-size: 20px; writing-mode: horizontal-tb; line-height: 1; }
    .it.on { outline: 5px solid #fbbf24; outline-offset: 3px; z-index: 5; }
    .frame { border: 7px solid #fff; border-radius: 18px; }
    .stamp { line-height: 1; padding: 4px; border-radius: 12px; }
    .handle { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: #fbbf24; border: 4px solid #fff; touch-action: none; cursor: pointer; z-index: 6; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
    .bbar { display: flex; flex-direction: column; gap: .35rem; padding: .4rem .5rem; background: #5b452b; }
    .brow { display: flex; align-items: center; gap: .4rem; height: 2.9rem; white-space: nowrap; overflow: hidden; font-size: .95rem; }
    .dot { width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #334155; }
    .dot:active { transform: scale(.9); }
    .dot.on { box-shadow: 0 0 0 4px #f59e0b; }
    .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.55); font-size: 30px; font-weight: 700; text-align: center; line-height: 2; pointer-events: none; }

    /* まどの 上に かさねる もの */
    .ov { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
    /* かくにん もんだい：こくばんの 場所に 重ねて 出す（左の 文章は 見えた まま） */
    .ov.side { position: absolute; z-index: 20; padding: 10px; background: #3f2f1c; }
    .ov.side > .card { max-width: none; max-height: none; overflow: visible; flex: none; }
    .tbar.off, .qtools.off { pointer-events: none; opacity: .35; }
    .card { background: #fffdf4; border-radius: 22px; padding: 1.2rem; max-width: 100%; max-height: 100%; overflow: auto; box-shadow: 0 10px 30px rgba(0,0,0,.35); border: 4px solid #e7c98f; }
    .toast { position: fixed; top: .5rem; left: 50%; transform: translateX(-50%); background: #fff; border: 4px solid #f59e0b; border-radius: 999px; padding: .5rem 1.4rem; font-weight: 700; font-size: 1.25rem; z-index: 60; display: flex; align-items: center; gap: .6rem; box-shadow: 0 6px 14px rgba(0,0,0,.25); animation: pop .45s cubic-bezier(.2,1.5,.4,1); pointer-events: none; white-space: nowrap; }
    @keyframes pop { 0% { transform: translateX(-50%) scale(.4); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
    .bubble { background: #fff; border: 3px solid #e7c98f; border-radius: 20px; padding: .7rem 1.1rem; font-size: 1.3rem; font-weight: 700; line-height: 1.9; }
    .kkey { width: 3rem; height: 3rem; font-size: 1.5rem; font-weight: 700; border-radius: 12px; border: 2px solid #94a3b8; background: #fff; border-bottom-width: 5px; padding: 0; }
    .kkey:active { transform: translateY(3px); border-bottom-width: 2px; }
    .kkey.fn { background: #e2e8f0; font-size: 1rem; width: auto; padding: 0 .6rem; }
    .kkey.none { visibility: hidden; }
    .winput { width: 100%; font-family: 'BIZ UDGothic', sans-serif; font-size: 1.6rem; font-weight: 700; padding: .5rem .7rem; border: 3px solid #f59e0b; border-radius: 14px; background: #fff; resize: none; line-height: 1.6; -webkit-user-select: text; user-select: text; }
    .float { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .confetti { position: fixed; top: -3rem; font-size: 2.2rem; animation: fall linear forwards; z-index: 55; pointer-events: none; }
    @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }

    /* ホーム・アルバム */
    .tcard { background: #fff; border: 3px solid #d6c29a; border-bottom-width: 8px; border-radius: 20px; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; align-items: flex-start; text-align: left; font-size: 1.1rem; }
    .tcard:active { transform: translateY(4px); border-bottom-width: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; }
    .tag { display: inline-block; border-radius: 999px; padding: .1rem .7rem; font-size: .95rem; font-weight: 700; }
    .slot { width: 4.2rem; height: 4.2rem; border-radius: 16px; background: #fff; border: 3px dashed #d6c29a; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; }
    .slot.got { border-style: solid; border-color: #f59e0b; background: #fffbeb; }

    /* 先生用 */
    .tch { -webkit-user-select: text; user-select: text; }
    .tch table { border-collapse: collapse; background: #fff; }
    .tch th, .tch td { border: 1px solid #cbd5e1; padding: .4rem .6rem; text-align: center; font-size: .95rem; }
    .tch th { background: #e0f2fe; }
    .tch input[type=text], .tch textarea, .tch select { font-family: inherit; font-size: 1rem; padding: .4rem .5rem; border: 2px solid #94a3b8; border-radius: 8px; width: 100%; background: #fff; }
    .tch textarea { font-family: 'BIZ UDGothic', monospace; line-height: 1.7; }
    .tch h2 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
    .note { background: #fef9c3; border-left: 6px solid #eab308; padding: .5rem .8rem; border-radius: 8px; font-size: .95rem; line-height: 1.8; }
    .cellbtn { border: 2px solid #94a3b8; border-radius: 10px; background: #fff; padding: .3rem .5rem; font-size: .9rem; line-height: 1.5; min-width: 6.5rem; }
    .viewer { display: flex; gap: 1rem; align-items: stretch; }
    .viewer > .vt { flex: 1; min-width: 0; height: 30rem; background: #fffdf4; border: 3px solid #d6c29a; border-radius: 12px; display: flex; flex-direction: column; position: relative; }
    .viewer > .vb { flex: 1.2; min-width: 0; height: 30rem; background: #3f2f1c; border-radius: 12px; display: flex; }
    @media print {
      body { background: #fff; }
      .noprint { display: none !important; }
      .app { height: auto; overflow: visible; display: block; }
      .page { overflow: visible; padding: 0; }
      .viewer { display: block; }
      /* 印刷では、文章を よこ書きに して ぜんぶ 出す */
      .viewer > .vt { height: auto; margin-bottom: 4mm; border-width: 1px; display: block; }
      .viewer .tscroll, .viewer .tscroll.v { writing-mode: horizontal-tb; overflow: visible; padding: 3mm 5mm; }
      .viewer .tbody { font-size: 12pt; line-height: 2.2; }
      .viewer .ttitle { font-size: 14pt; padding: 0 0 .3em; }
      .tch table { break-inside: avoid; }
      .viewer > .vb { height: 92mm; background: #fff; }
      .boardin { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .u, .fusen { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      @page { size: A4 landscape; margin: 8mm; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#7c5a35;font-weight:bold;">じゅんび ちゅう…</div>
  </div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const APP_VERSION = '1.9.0';

    // =====================================================================
    //  1. 小さな道具
    // =====================================================================
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const pad = (n) => String(n).padStart(2, '0');
    const nowStr = (d = new Date()) => `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const store = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
      json(k, d) { try { const v = JSON.parse(this.get(k)); return v == null ? d : v; } catch (e) { return d; } },
    };
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    // ---- こえ（少し ゆっくりめ）----
    let SPEAK_RATE = 0.8, SOUND_ON = true, speakToken = 0;
    function jaVoice() {
      try { const vs = window.speechSynthesis.getVoices(); return vs.find(v => v.lang === 'ja-JP') || vs.find(v => (v.lang || '').startsWith('ja')) || null; } catch (e) { return null; }
    }
    function stopSpeak() { speakToken++; try { window.speechSynthesis.cancel(); } catch (e) {} }
    // list を じゅんばんに 読む。onIndex(i) で いま 読んでいる ところを 知らせる
    function speakSeq(list, onIndex, onDone) {
      stopSpeak();
      const token = speakToken;
      const next = (i) => {
        if (token !== speakToken) return;
        if (i >= list.length) { onIndex && onIndex(-1); onDone && onDone(); return; }
        onIndex && onIndex(i);
        try {
          const u = new SpeechSynthesisUtterance(list[i]);
          u.lang = 'ja-JP'; u.rate = SPEAK_RATE; u.pitch = 1.15;
          const v = jaVoice(); if (v) u.voice = v;
          u.onend = () => next(i + 1); u.onerror = () => next(i + 1);
          window.speechSynthesis.speak(u);
        } catch (e) { onIndex && onIndex(-1); onDone && onDone(); }
      };
      next(0);
    }
    const speak = (text, onDone) => speakSeq([text], null, onDone);

    // ---- おと（小さな 音）----
    let actx = null;
    function tone(freqs, len = 0.12, vol = 0.07) {
      if (!SOUND_ON) return;
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        freqs.forEach((f, i) => {
          const o = actx.createOscillator(), g = actx.createGain();
          o.type = 'sine'; o.frequency.value = f;
          const t = actx.currentTime + i * len;
          g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + len * 1.6);

    function TextEditor({ pin, initial, settings, onSaved, onCancel }) {
      const [t, setT] = useState(() => Object.assign({ title: '', kind: 'ものがたり', use: true, body: '', qs: [] }, initial, { qs: (initial && initial.qs || []).concat(['', '', '', '', '']).slice(0, 5) }));

      const [step, setStep] = useState(1);
      const doc = useMemo(() => parseDoc(t.body.replace(/\r\n?/g, '\n').trim()), [t.body]);
      const [ans, setAns] = useState(() => {
        const d0 = parseDoc(String(initial && initial.body || '').replace(/\r\n?/g, '\n').trim()), a = parseAns(initial && initial.ans, d0);
        return { q: [0, 1, 2, 3, 4].map(i => a.q[i] || emptyQ()), cats: a.cats, fm: a.fm, custom: a.custom, heads: a.heads, para: a.para, paraShow: a.paraShow, words: a.words, flow: a.flow, n: d0.units.length, stale: a.stale };
      });
      // ものがたりの 型
      const isE = t.kind === 'せつめいぶん', fl = ans.flow, flowOn = fl.on;
      const setFlow = (p) => setAns(a => Object.assign({}, a, { flow: Object.assign({}, a.flow, p) }));
      const setQuizQ = (i, p) => setFlow({ quiz: fl.quiz.map((q, j) => j === i ? Object.assign({}, q, p) : q) });
      const [target, setTarget] = useState(0); // 0〜4 = とい、'c:なまえ' = しゅるい、'para' = 意味段落
      const [gran, setGran] = useState('u');
      const [word, setWord] = useState(''), [newCat, setNewCat] = useState('');
      const set = (k, v) => setT(o => Object.assign({}, o, { [k]: v }));
      const cl = catList(t.kind, ans);
      const catOf = (key) => cl.find(c => c.key === key);
      const marked = ans.q.some(q => q.raw.length) || Object.keys(ans.cats).some(k => ans.cats[k].length) || ans.para.length > 0;
      const goStep = (n) => {
        let cats = ans.cats, wiped = false;
        if (n === 2 && ans.n !== doc.units.length && marked) { wiped = true; cats = {}; } // 本文を 直して ことばの 数が 変わった
        if (n === 2 && !cats.hatsugen) cats = Object.assign({}, cats, { hatsugen: t.kind === 'せつめいぶん' ? [] : quoteUnits(doc) }); // 「 」には はじめから 印を 付ける
        if (n === 2) setAns(a => Object.assign({}, a, wiped ? { q: a.q.map(q => Object.assign({}, q, { raw: [] })), para: [], fm: {}, stale: true } : {}, { cats, n: doc.units.length }));
        if (n === 2 && typeof target === 'number' && !t.qs[target].trim()) { const f = t.qs.findIndex(q => q.trim()); setTarget(f < 0 ? 'c:' + cl[0].key : f); }
        setStep(n); setMsg('');
      };
      // いま 印を 付けて いる ところ
      const tq = typeof target === 'number' ? ans.q[target] : null;
      const tkey = tq ? tq.k : target !== 'para' ? target.slice(2) : '';   // しゅるいの 名前（といが しゅるいを 使う ときも）
      const curList = target === 'para' ? ans.para : tkey ? (ans.cats[tkey] || []) : tq.raw;
      // 印の まとまりが のびたり ちぢんだり しても、結びつけた 気持ちが はなれないように する
      const moveFm = (fm, key, before, after) => {
        const out = {}; Object.keys(fm).forEach(k => { if (!k.startsWith(key + ':')) out[k] = fm[k]; });
        const olds = runsOf(before).filter(r => fm[key + ':' + r[0]]);
        runsOf(after).forEach(r => { const got = [...new Set(olds.filter(o => o[0] <= r[1] && o[1] >= r[0]).flatMap(o => fm[key + ':' + o[0]]))]; if (got.length) out[key + ':' + r[0]] = got.slice(0, 8); });

              </div>
              <div style={FEEL_CATS.includes(tkey) ? Object.assign({}, box, { height: '19rem' }) : box}><TextPane title={t.title} doc={doc} vertical={settings.vertical} preview marks={target === 'para' ? {} : Object.fromEntries(curList.map(i => [i, 'y']))} ansSet={target === 'para' ? null : new Set(curList)} para={ans.para.length ? ans.para : null} onTap={tap} /></div>
              {FEEL_CATS.includes(tkey) ? (
                <div style={{ background: '#fff', border: '2px solid #db2777', borderRadius: 10, padding: '.5rem .7rem', marginTop: '.5rem', maxHeight: '16rem', overflow: 'auto' }}>
                  <b>💗 どんな 気持ちか を 決める</b>　<small>合って いると 思う 気持ちは、ぜんぶ 選んで ください</small>
                  {!curList.length ? <div><small>上の 文章で 印を 付けると、ここに 出ます。</small></div> : null}
                  {runsOf(curList).map(r => {
                    const key = tkey + ':' + r[0], list = ans.fm[key] || [];
                    return (
                      <div key={key} style={{ borderTop: '1px solid #e2e8f0', padding: '.35rem 0' }}>
                        <b>「{joinUnits(doc, r[0], r[1], 'plain')}」</b> →
                        {list.map(w => <button key={w} className="chip on" onClick={() => setFm(key, list.filter(x => x !== w))}>{w} ✖</button>)}
                        <select style={{ width: 'auto', marginLeft: '.3rem' }} value="" onChange={e => {
                          let w = e.target.value; if (w === '__new') w = (window.prompt('気持ちの ことばを 書いて ください（例：むねが いっぱい）') || '').trim().slice(0, 20);
                          if (w && !list.includes(w)) setFm(key, list.concat([w]));
                        }}>
                          <option value="">＋ 気持ちを 足す</option>
                          {allFeel.filter(w => !list.includes(w)).map(w => <option key={w} value={w}>{w}</option>)}
                          <option value="__new">じぶんで 書く…</option>
                        </select>
                      </div>
                    );
                  })}
                  <small>気持ちを 決めた 表現を 子どもが こくばんに はると、「どんな きもちかな？」と 聞きます。決めない 表現は、聞きません。</small>
                </div>
              ) : null}
            </div>
          </div>
          </>}
          <div className="row" style={{ marginTop: '1rem' }}>
            <button className="btn green" onClick={save}>💾 ほぞんする</button>
            <button className="btn" onClick={onCancel}>やめる</button>
            {step === 1 ? <button className="btn blue" onClick={() => goStep(2)}>つぎへ：② こたえを きめる ▶</button> : null}
            <b style={{ color: '#b91c1c' }}>{msg}</b>
          </div>
        </div>
      );
    }

    function Teacher({ pin, first, onSettings, onTexts, onBack }) {
      const [d, setD] = useState(first);
      const [tab, setTab] = useState('works');
      const [view, setView] = useState(null);   // { text, name }
      const [edit, setEdit] = useState(null);   // 文章
      const [s, setS] = useState(Object.assign({ newPin: '' }, first.settings));
      const [msg, setMsg] = useState('');
      const [who, setWho] = useState('');
      const reload = async () => { const r = await api.teacher(pin); if (r && r.ok) setD(r); };
      const setTexts = (texts) => { setD(o => Object.assign({}, o, { texts })); onTexts(texts.filter(t => t.use !== false)); };
      const textOf = (id) => d.texts.find(t => t.id === id);
      const cell = (name, t) => {
        const w = d.works.find(x => x.name === name && x.id === t.id);
        if (!w) return <span style={{ color: '#94a3b8' }}>—</span>;
        return <button className="cellbtn" style={{ background: w.done ? '#bbf7d0' : '#fef9c3' }} onClick={() => setView({ text: t, name })}>{w.done ? '✅ できた' : '✏️ とちゅう'}<br /><small>{String(w.updated).slice(5)}</small></button>;
      };
      const usedTexts = d.texts.filter(t => t.use !== false || d.works.some(w => w.id === t.id));
      const saveSet = async () => {
        if (s.newPin && !/^\d{4}$/.test(s.newPin)) { setMsg('暗証番号は 数字4けたで 入れて ください'); return; }
        setMsg('ほぞん ちゅう…');
        try { const r = await api.saveSettings(pin, s); if (r && r.ok) { onSettings(r.settings); setMsg(s.newPin ? 'ほぞん しました。暗証番号が 変わったので、次から 新しい 番号で 入って ください' : 'ほぞん しました'); } else setMsg('ほぞん できませんでした'); } catch (e) { setMsg('ほぞん できませんでした'); }
      };
      const act = async (f, okMsg) => { setMsg('…'); try { const r = await f(); setMsg(r && r.ok !== false ? okMsg : 'できませんでした'); await reload(); } catch (e) { setMsg('できませんでした（つながりを 確かめて ください）'); } };
      const restore = (file) => {
        const fr = new FileReader();
        fr.onload = () => { let data = null; try { data = JSON.parse(fr.result); } catch (e) {} if (!data || data.app !== 'kokuban') { setMsg('この アプリの バックアップでは ありません'); return; } act(() => api.restore(pin, data), 'バックアップから もどしました'); };
        fr.readAsText(file);
      };
      const tabs = [['works', '📋 こくばんを 見る'], ['texts', '📖 文章'], ['set', '⚙️ 設定'], ['data', '💾 データ']];
      return (
        <div className="app tch">
          <div className="top noprint">
            <button className="btn sm" onClick={onBack}>◀ おわる</button>
            <b style={{ fontSize: '1.2rem' }}>先生用画面</b>
            <div className="seg">{tabs.map(t => <button key={t[0]} className={tab === t[0] ? 'on' : ''} onClick={() => { setTab(t[0]); setView(null); setEdit(null); setMsg(''); }}>{t[1]}</button>)}</div>
            <span className="grow" /><small>v{APP_VERSION}{HAS_GAS ? '' : '・おためしモード'}</small>
          </div>
          <div className="page">
            {d.isDefaultPin ? <div className="note noprint" style={{ marginBottom: '.8rem' }}>⚠ 暗証番号が はじめの「1234」の ままです。「⚙️ 設定」で 変えて ください。</div> : null}

            {tab === 'works' && view ? <Viewer key={view.text.id + (view.name || '')} pin={pin} text={view.text} name={view.name} settings={first.settings} onBack={() => setView(null)} /> : null}
            {tab === 'works' && !view ? (
              <div>
                <h2>子どもの マイこくばん</h2>
                <p>ボタンを 押すと、その子の マイこくばんと、せんを ひいた 文章が 出ます。</p>
                <div style={{ overflowX: 'auto' }}>
                  <table>
                    <thead><tr><th>なまえ</th><th>シール</th>{usedTexts.map(t => <th key={t.id}>{plainOf(t.title)}<br /><button className="cellbtn" style={{ marginTop: '.2rem' }} onClick={() => setView({ text: t, name: '' })}>👥 みんなの せん</button></th>)}</tr></thead>
                    <tbody>
                      {d.students.map(st => { const n = parseProgress(st.progress).stickers.length; return <tr key={st.name}><th>{st.name}</th><td>{n}まい<br /><small>{titleOf(n)}</small></td>{usedTexts.map(t => <td key={t.id}>{cell(st.name, t)}</td>)}</tr>; })}
                    </tbody>
                  </table>
                </div>
                {!d.students.length ? <div className="note">「名簿」シートの A列（2行目から）に、子どもの 名前を ひらがなで 入れて ください。</div> : null}
                <button className="btn sm" style={{ marginTop: '.8rem' }} onClick={reload}>🔄 新しく する</button>
              </div>
            ) : null}

            {tab === 'texts' && edit ? <TextEditor pin={pin} initial={edit} settings={first.settings} onSaved={(texts) => { setTexts(texts); setEdit(null); }} onCancel={() => setEdit(null)} /> : null}
            {tab === 'texts' && !edit ? (
              <div>
                <h2>文章</h2>
                <button className="btn green" onClick={() => setEdit({})}>＋ 新しい 文章を 入れる</button>
                <table style={{ marginTop: '.8rem', width: '100%' }}>
                  <thead><tr><th>だいめい</th><th>しゅるい</th><th>子どもに 見せる</th><th>とい</th><th>文字数</th><th></th></tr></thead>
                  <tbody>{d.texts.map(t => (
                    <tr key={t.id}><td style={{ textAlign: 'left' }}>{plainOf(t.title)}</td><td>{t.kind}</td><td>{t.use !== false ? '○' : '×'}</td><td>{String(t.ans || '').includes('"flow":{"on":true') ? '📘 型' : (t.qs || []).length}</td><td>{plainOf(t.body).length}</td>
                      <td><button className="btn sm" onClick={() => setEdit(t)}>✏️ 直す</button> <button className="btn sm red" onClick={() => { if (window.confirm(`「${plainOf(t.title)}」を 消します。よろしいですか？\n（子どもの マイこくばんの 記録は 残ります）`)) api.deleteText(pin, t.id).then(r => r && r.ok && setTexts(r.texts)); }}>🗑 消す</button></td></tr>
                  ))}</tbody>
                </table>
                <div className="note" style={{ marginTop: '.8rem' }}>教科書の 文章は 著作権が あります。ここに 入れた 文章は、先生の スプレッドシート（「ぶんしょう」シート）にだけ 保存されます。授業の 中で 使い、ほかの 人に 配らないで ください。</div>
              </div>
            ) : null}

            {tab === 'set' ? (
              <div style={{ maxWidth: '36rem' }}>
                <h2>設定</h2>
                <p><b>読み上げの 速さ</b><br /><select value={s.rate} onChange={e => setS(Object.assign({}, s, { rate: Number(e.target.value) }))}>{[[0.6, 'とても ゆっくり'], [0.7, 'ゆっくり'], [0.8, '少し ゆっくり（はじめの 設定）'], [0.9, 'やや ゆっくり'], [1, 'ふつう']].map(o => <option key={o[0]} value={o[0]}>{o[1]}（{o[0]}倍）</option>)}</select>
                  <button className="btn sm" style={{ marginTop: '.3rem' }} onClick={() => { SPEAK_RATE = s.rate; speak('この はやさで よみます。'); }}>🔊 ためす</button></p>
                <p><b>文字の 大きさ</b><br /><select value={s.font} onChange={e => setS(Object.assign({}, s, { font: Number(e.target.value) }))}>{[[0.85, '小さめ'], [1, 'ふつう'], [1.2, '大きめ'], [1.4, 'とても 大きい']].map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}</select></p>
                <p><b>文章の 向き</b><br /><select value={s.vertical ? 'v' : 'h'} onChange={e => setS(Object.assign({}, s, { vertical: e.target.value === 'v' }))}><option value="v">たて書き</option><option value="h">よこ書き</option></select></p>
                <p><b>効果音</b><br /><select value={s.sound ? '1' : '0'} onChange={e => setS(Object.assign({}, s, { sound: e.target.value === '1' }))}><option value="1">鳴らす</option><option value="0">鳴らさない</option></select></p>
                <p><b>暗証番号を 変える</b>（数字4けた。変えない ときは 空の まま）<br /><input type="text" inputMode="numeric" maxLength={4} value={s.newPin} onChange={e => setS(Object.assign({}, s, { newPin: e.target.value.replace(/\D/g, '') }))} /></p>
                <button className="btn green" onClick={saveSet}>💾 ほぞんする</button> <b>{msg}</b>
              </div>
            ) : null}

            {tab === 'data' ? (
              <div style={{ maxWidth: '44rem' }}>
                <h2>データ</h2>
                <p>{HAS_GAS ? '記録は、先生の スプレッドシートに 入っています（「きろく」「まとめ」シート）。' : 'おためしモードです。記録は この 端末の 中だけに あります。'}</p>
                <div className="row">
                  <button className="btn sm" onClick={() => api.logRows(pin).then(r => r && r.ok && download(`マイこくばん_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, toCSV(r.rows), 'text/csv'))}>⬇ きろくを CSVで 書き出す</button>
                  <button className="btn sm" onClick={() => download(`マイこくばん_まとめ_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, toCSV([['なまえ', 'ぶんしょう', 'こうしん', 'じょうたい', 'せんを ひいた ことば', 'こくばんに はった ことば', 'じぶんで かいた ことば', 'スタンプ・やじるし・わく']].concat(d.works.map(w => [w.name, w.title, w.updated, w.done ? 'できた' : 'とちゅう', w.lines, w.pasted, w.own, w.etc]))), 'text/csv')}>⬇ まとめを CSVで 書き出す</button>
                </div>
                <h2>バックアップ</h2>
                <div className="row">
                  <button className="btn sm" onClick={() => api.backup(pin).then(r => r && r.ok && download(`マイこくばん_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json'))}>⬇ バックアップを 保存する</button>
                  <label className="btn sm">⬆ バックアップから もどす<input type="file" accept=".json" style={{ display: 'none' }} onChange={e => { if (e.target.files[0]) restore(e.target.files[0]); e.target.value = ''; }} /></label>
                </div>
                <h2>記録を 消す</h2>
                <div className="row">
                  <select style={{ width: 'auto' }} value={who} onChange={e => setWho(e.target.value)}><option value="">全員</option>{d.students.map(st => <option key={st.name}>{st.name}</option>)}</select>
                  <button className="btn sm red" onClick={() => { if (window.confirm(`${who || '全員'}の マイこくばん・シール・きろくを 消します。元には もどせません。よろしいですか？`)) act(() => { d.students.forEach(st => { if (!who || st.name === who) try { Object.keys(window.localStorage).filter(k => k.startsWith(`kokuban_w_${st.name}_`) || k === `kokuban_q_${st.name}`).forEach(k => store.del(k)); } catch (e) {} }); return api.clear(pin, who); }, '消しました'); }}>🗑 消す</button>
                </div>
                <p><b>{msg}</b></p>
                <div className="note">文章は 消えません。文章を 消す ときは「📖 文章」から 消します。</div>
              </div>
            ) : null}
          </div>
        </div>
      );
    }

    // =====================================================================
    //  10. ぜんたい
    // =====================================================================
    function App() {
      const [init, setInit] = useState(null), [err, setErr] = useState('');
      const [screen, setScreen] = useState('names');
      const [name, setName] = useState(''), [progress, setProgress] = useState({ stickers: [] }), [works, setWorks] = useState({});
      const [text, setText] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [teacher, setTeacher] = useState(null);
      const [busy, setBusy] = useState(false);
      const useSettings = (s) => {
        const n = Object.assign({}, DEFAULT_SETTINGS, s); setSettings(n);
        SPEAK_RATE = n.rate; SOUND_ON = n.sound; document.documentElement.style.fontSize = (16 * n.font) + 'px';
      };
      useEffect(() => {
        api.init().then(d => { setInit(d); useSettings(d.settings); }).catch(e => setErr(String(e && e.message || e)));
        try { window.speechSynthesis.getVoices(); } catch (e) {}
      }, []);
      const pick = async (n) => {
        setBusy(true);
        try { const s = await api.student(n); setName(n); setProgress(parseProgress(s.progress)); setWorks(s.works || {}); setScreen('home'); }
        catch (e) { setErr('よみこめませんでした。もう一度 ためして ください。'); }
        setBusy(false);
      };
      if (err) return <div className="app"><div className="page" style={{ textAlign: 'center' }}><div className="note" style={{ display: 'inline-block', marginTop: '3rem', fontSize: '1.2rem' }}>{err}</div><br /><button className="btn big" style={{ marginTop: '1rem' }} onClick={() => location.reload()}>🔄 もう いちど</button></div></div>;
      if (!init || busy) return <div className="app"><div className="page" style={{ textAlign: 'center', fontSize: '1.6rem', fontWeight: 700, paddingTop: '4rem', color: '#7c5a35' }}>じゅんび ちゅう…</div></div>;
      if (screen === 'pin') return <PinGate onOK={(pin, d) => { setTeacher({ pin, d }); setScreen('teacher'); }} onBack={() => setScreen('names')} />;
      if (screen === 'teacher') return <Teacher pin={teacher.pin} first={teacher.d} onSettings={useSettings} onTexts={(texts) => setInit(o => Object.assign({}, o, { texts }))} onBack={() => { setTeacher(null); setScreen('names'); }} />;
      if (screen === 'home') return <Home name={name} texts={init.texts} works={works} progress={progress} onOpen={(t) => { setText(t); setScreen('work'); }} onAlbum={() => setScreen('album')} onBack={() => { stopSpeak(); setScreen('names'); }} />;
      if (screen === 'album') return <Album progress={progress} onBack={() => setScreen('home')} />;
      if (screen === 'work') return <Work key={name + text.id} name={name} text={text} settings={settings} progress={progress} onProgress={setProgress} onExit={(w) => { if (w) setWorks(o => Object.assign({}, o, { [w.id]: { done: w.done, updated: w.updated } })); setScreen('home'); }} />;
      return <Names students={init.students} onPick={pick} onTeacher={() => setScreen('pin')} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
