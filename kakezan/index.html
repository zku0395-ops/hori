    // =====================================================================
    // 17. しゅぎょうの ば
    // =====================================================================
    function rangeSpecs(p) {
      const ms = mainPlaces();
      const max = p.range != null && p.range !== '' ? Number(p.range) : ms.reduce((mx, pl, i) => placeCleared(p, pl) ? i : mx, -1);
      const specs = new Set();
      ms.slice(0, max + 1).forEach(pl => pl.battles.forEach(s => { if (!/^m/.test(s)) specs.add(s); }));
      if (!specs.size) specs.add('k');
      return [...specs];
    }
    function ShugyoMenu({ p, onStart }) {
      const talk = useTalk();
      useEffect(() => { talk.say('しゅぎょうの ばへ ようこそ。なんども しゅぎょうすると、わざを おぼえるぞ。', { who: 'kakeru' }); }, []);
      return (
        <div className="flex-1 p-4 flex flex-col items-center gap-3" style={{ background: 'linear-gradient(#fef3c7, #a16207)' }}>
          <div className="rpgwin px-6 py-2 text-3xl font-bold">🥋 しゅぎょうの ば</div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-4xl">
            {SHUGYO.map(s => { const n = p.shu[s.id] || 0; return (
              <button key={s.id} onClick={() => { Sound.tap(); onStart(s); }} className="btn3d rounded-3xl border-4 border-amber-700 bg-amber-50 p-3 flex items-center gap-3 text-left">
                <span style={{ fontSize: 64 }}>{s.icon}</span>
                <span className="flex-1"><span className="block text-2xl font-bold">{s.name}</span><span className="block text-lg">{s.sub}</span>
                  <span className="block text-amber-600">{n ? '★'.repeat(Math.min(n, 10)) : 'まだ'}{n > 10 ? `＋${n - 10}` : ''}</span>
                  <span className="block text-sm">{p.waza.includes(s.waza) ? `✨わざ「${s.waza}」を おぼえた` : `あと ${Math.max(0, D.WAZA_AT - n)}かいで わざ「${s.waza}」`}</span></span>
              </button>); })}
          </div>
          <MessageWindow className="w-full max-w-4xl" small />
        </div>
      );
    }

    // くくの まと・くりあがりの いし（4つから えらぶ）
    function ChoiceDrill({ mode, count = 10, onProblem, onFinish, onQuit }) {
      const talk = useTalk();
      const S = SHUGYO.find(s => s.id === mode);
      const [k, setK] = useState(0);
      const [q, setQ] = useState(() => mode === 'mato' ? makeMato() : makeIshi());
      const [bad, setBad] = useState([]);
      const [hit, setHit] = useState(null);
      const st = useRef({ miss: 0, kinds: [], inputs: [], t0: Date.now() });
      useEffect(() => { talk.say(q.q + (mode === 'mato' ? ' の こたえの まとを ねらおう' : ' の こたえの いしを わろう'), { who: 'kakeru' }); }, [q]);
      const pick = (c) => {
        if (hit !== null || bad.includes(c)) return;
        if (c === q.ans) {
          Sound.hit(); setHit(c);
          const s = st.current;
          onProblem({ prob: q.q.replace(/ /g, ''), ans: q.ans, result: s.miss ? '△' : '○', miss: s.miss, hint: s.miss >= 2 ? 3 : 0, kinds: [...new Set(s.kinds)].join('・'), inputs: s.inputs.join('・'),
            secs: Math.round((Date.now() - s.t0) / 1000), place: 'しゅぎょう', battle: S.name });
          setTimeout(() => {
            if (k + 1 >= count) { onFinish(); return; }
            st.current = { miss: 0, kinds: [], inputs: [], t0: Date.now() };
            setK(k + 1); setBad([]); setHit(null); setQ(mode === 'mato' ? makeMato() : makeIshi());
          }, 1000);
          return;
        }
        Sound.retry();
        const kind = mode === 'mato' ? 'くくの まちがい' : c === q.x ? 'くりあがりの たしわすれ' : Math.abs(c - q.ans) === 10 ? 'くらいの まちがい' : 'たし算の まちがい';
        st.current.miss++; st.current.kinds.push(kind); st.current.inputs.push(`${c}→${q.ans}`);
        setBad([...bad, c]);
        talk.say(mode === 'mato' ? `${q.a}の だんを となえて みよう。${q.a} × ${q.b} は？` : kind === 'くりあがりの たしわすれ' ? `${q.c} を たすのを わすれて いるよ。` : `${q.x} から ${q.c} かぞえて みよう。`, { who: 'kakeru', mood: 'think' });
      };
      const glow = bad.length >= 2 ? q.ans : null;
      return (
        <div className="flex-1 p-3 flex flex-col items-center gap-3" style={{ background: mode === 'mato' ? 'linear-gradient(#bbf7d0, #15803d)' : 'linear-gradient(#e7e5e4, #57534e)' }}>
          <div className="w-full max-w-4xl flex items-center justify-between">
            <div className="rpgwin px-4 py-1 text-2xl font-bold">{S.icon} {S.name}　{k + 1} / {count}</div>
            <button onClick={onQuit} className="rounded-xl border-2 border-slate-400 bg-white px-3 py-1 text-lg font-bold">やめる</button>
          </div>
          <div className="bg-white rounded-3xl border-4 border-slate-700 px-10 py-3 text-6xl font-bold">{q.q} ＝ ？</div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            {q.choices.map(c => {
              const off = bad.includes(c), isHit = hit === c;
              return (
                <button key={c} disabled={off} onClick={() => pick(c)} className={`relative flex items-center justify-center ${glow === c ? 'glow' : ''} ${isHit ? 'hit' : ''}`}
                  style={{ width: 150, height: 150, borderRadius: mode === 'mato' ? '50%' : '42% 58% 50% 50% / 50% 45% 55% 50%', opacity: off ? 0.25 : 1,
                    background: mode === 'mato' ? 'radial-gradient(circle, #fff 0 18%, #ef4444 18% 36%, #fff 36% 54%, #ef4444 54% 72%, #fff 72%)' : 'radial-gradient(circle at 35% 30%, #d6d3d1, #78716c)',
                    border: '5px solid #1f2937' }}>
                  <span className="bg-white rounded-xl px-2 text-5xl font-bold border-2 border-slate-700">{c}</span>
                  {isHit && <span className="absolute text-7xl pop">{mode === 'mato' ? '🏹' : '💥'}</span>}
                </button>
              );
            })}
          </div>
          <MessageWindow className="w-full max-w-4xl" small />
        </div>
      );
    }

    // かかし れんぞく・にがての どうじょう（ひっ算）
    function ShuBoard({ mode, probs, settings, p, onProblem, onFinish, onQuit }) {
      const talk = useTalk();
      const S = SHUGYO.find(s => s.id === mode);
      const [k, setK] = useState(0);
      const [hitKey, setHitKey] = useState(0);
      useEffect(() => { talk.say(mode === 'dojo' ? 'まえに まちがえた かたちの もんだいだよ。ゆっくり やろう。' : 'かかしに むかって、ひっ算を つづけて とこう！', { who: 'kakeru' }); }, []);
      const solved = (rec) => {
        onProblem({ ...rec, place: 'しゅぎょう', battle: S.name });
        Sound.hit(); setHitKey(x => x + 1);
        setTimeout(() => { if (k + 1 >= probs.length) onFinish(); else setK(k + 1); }, 900);
      };
      const scene = (
        <div className="h-full flex flex-col items-center justify-between p-3 gap-2" style={{ minHeight: 300, background: 'linear-gradient(#fef3c7, #d6b98c)' }}>
          <div className="rpgwin px-4 py-1 text-xl font-bold">{S.icon} {S.name}　{k + 1} / {probs.length}</div>
          <div key={hitKey} className={hitKey ? 'hit' : ''} style={{ fontSize: 130 }}>{mode === 'dojo' ? '🥋' : '🌾'}</div>
          <div className="w-64 h-4 bg-white rounded-full overflow-hidden border-2 border-slate-600"><div className="h-full bg-emerald-500" style={{ width: `${(k / probs.length) * 100}%` }} /></div>
          <PartyRow p={p} size={56} />
          <MessageWindow className="w-full" small />
        </div>
      );
      return (
        <FightLayout scene={scene}>
          <div className="w-full flex justify-end"><button onClick={onQuit} className="rounded-xl border-2 border-slate-400 bg-white px-3 py-1 text-lg font-bold">やめる</button></div>
          <Solver key={k} a={probs[k][0]} b={probs[k][1]} settings={settings} party={partyOf(p)} onSolved={solved} />
        </FightLayout>
      );
    }

    // =====================================================================
    // 18. けっか・おしらせ
    // =====================================================================
    function ResultScreen({ r, onNext, onPlace, onTown }) {
      const talk = useTalk();
      useEffect(() => { talk.say(`${r.m.name}を たおした！ ${r.gold}ゴールドと、けいけんち ${r.exp}を てに いれた。`, { who: 'kakeru', mood: 'happy' }); }, []);
      return (
        <PlaceBg pl={r.pl} className="flex-1" dim={0.35} style={{ minHeight: 'calc(100vh - 64px)' }}>
          <div className="flex flex-col items-center gap-4 p-4">
            <div className="rpgwin px-8 py-3 text-4xl font-bold text-amber-300 pop">🎉 しょうり！</div>
            <div className="rpgwin p-5 flex items-center gap-6">
              <MonsterPic m={r.m} size={130} />
              <div className="text-2xl flex flex-col gap-2">
                <div>{r.m.name}を たおした！</div>
                <div>💰 ゴールド ＋{r.gold}</div>
                <div>✨ けいけんち ＋{r.exp}</div>
                {r.perfect && <div className="text-amber-300">🌟 ノーミス！</div>}
                {r.newZukan && <div className="text-sky-300">📕 ずかんに のった！</div>}
              </div>
            </div>
            <div className="flex gap-3 flex-wrap justify-center">
              {onNext && <button onClick={onNext} className="btn3d glow rounded-2xl border-4 border-rose-700 bg-rose-400 text-white px-6 py-3 text-2xl font-bold">⚔️ つぎの たたかいへ</button>}
              <button onClick={onPlace} className="btn3d rounded-2xl border-4 border-amber-600 bg-amber-200 px-6 py-3 text-2xl font-bold">{r.pl.icon} {r.pl.name}へ</button>
              <button onClick={onTown} className="btn3d rounded-2xl border-4 border-emerald-700 bg-emerald-100 px-6 py-3 text-2xl font-bold">🏘️ まちへ かえる</button>
            </div>
            <MessageWindow className="w-full max-w-3xl" small />
          </div>
        </PlaceBg>
      );
    }
    function ShuResult({ s, gain, onAgain, onBack }) {
      const talk = useTalk();

                <div className="text-sm text-slate-500">時間制限はありません。まちがえても、主人公はやられません。</div>
                <label>暗証番号を変える（4けた）：<input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} className="border-2 rounded px-2 py-1 w-24 ml-2" inputMode="numeric" placeholder="----" /></label>
                <div><button onClick={saveSettings} className="btn3d rounded-xl px-6 py-2 border-2 border-emerald-500 bg-emerald-100 font-bold text-xl">保存する</button>
                  <span className="text-sm text-slate-500 ml-2">（全員の画面に反映されます。子どもの画面は開き直すと変わります）</span></div>
              </div>
            )}

            {tab === 'data' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-2xl">
                <div>この端末に たまっている、まだ送れていない記録：<b>{pending}</b> 件
                  <button onClick={async () => { await api.flush(); setPending(api.pending()); flash(api.pending() ? 'まだ送れていません。ネットのつながりを確かめてください' : '送りました'); onChanged(); }} className="ml-2 rounded-xl px-3 py-1 border-2 bg-white font-bold">📤 スプレッドシートへ送る</button></div>
                <div><button onClick={csv} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">📄 記録をCSVで書き出す</button>
                  <div className="text-sm text-slate-500">ダウンロードできないときは、スプレッドシートの「きろく」シートを開き、ファイル → ダウンロード → CSV を選んでください。</div></div>
                <div className="flex gap-2 flex-wrap items-center">
                  <button onClick={backup} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">💾 バックアップを保存</button>
                  <label className="rounded-xl px-3 py-2 border-2 bg-white font-bold cursor-pointer">📂 バックアップから元にもどす<input type="file" accept=".json" className="hidden" onChange={restore} /></label>
                </div>
                <div><button onClick={() => { if (confirm('全員の記録・進み具合・ゴールド・集めたものを、すべて消します。元にはもどせません。よろしいですか？') && confirm('ほんとうに全員の記録を消しますか？')) act(() => api.clear(pin, ''), '全員の記録を消しました'); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 全員の記録を消す</button></div>
              </div>
            )}

            {tab === 'img' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3">
                <div className="text-base leading-relaxed">
                  ChatGPT で作った絵は、Google ドライブの「<b>ひっさんクエスト え</b>」フォルダに、下の名前で入れてください（例：<code>monster_kusadango.png</code>）。<br />
                  アプリを開くと自動で読みこみ、この端末にも保存します。絵のないところは、自作の絵と絵文字で出ます。
                </div>
                <div className="flex items-center gap-3 flex-wrap">
                  <div>ドライブ：{HAS_GAS ? (Img.status.checked ? `${Img.status.count}まい みつかりました${Img.status.loading > 0 ? `（よみこみ中 のこり ${Img.status.loading}）` : ''}` : 'たしかめ中…') : 'おためしモードでは使えません'}</div>
                  {Img.status.error && <div className="text-rose-600">エラー：{Img.status.error}</div>}
                  {HAS_GAS && <button onClick={() => { Img.syncDrive(); flash('ドライブの絵を たしかめています'); }} className="rounded-xl px-3 py-1 border-2 bg-white font-bold">🔄 ドライブの絵を よみこみなおす</button>}
                </div>
                {NEED_IMAGES().map(([title, names]) => (
                  <div key={title}>
                    <div className="font-bold">{title}：{names.filter(n => Img.has(n)).length} / {names.length}</div>
                    <div className="flex flex-wrap gap-1 mt-1">{names.map(n => <span key={n} className={`text-sm rounded px-2 py-0.5 border ${Img.drive[n] ? 'bg-emerald-100 border-emerald-400' : Img.gh[n] ? 'bg-sky-100 border-sky-400' : 'bg-slate-50 border-slate-300 text-slate-500'}`}>{Img.has(n) ? '✓ ' : ''}{n}</span>)}</div>
                  </div>
                ))}
                <div className="text-sm text-slate-500">緑：ドライブの絵　青：GitHub の絵　灰色：まだ ない（自作の絵で出ます）。ファイルの形は PNG・JPEG・WebP のどれでもかまいません。</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 20. アプリ ぜんたい
    // =====================================================================
    function App() {
      useImgVer();
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [talk, setTalk] = useState({ text: '', who: 'kakeru' });
      const [bump, setBump] = useState(0);
      const [soundOn, setSoundOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const [modals, setModals] = useState([]);
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const gain = useRef({ gold: 0, exp: 0, miss: 0 });
      const lvAtStart = useRef(1);
      const progRef = useRef(progress);
      progRef.current = progress;
      const R = D.REWARD;

      const talkApi = useMemo(() => {
        const pitchOf = (who) => who === 'maou' ? 0.6 : who && who.job ? 1.3 : who && who.emoji ? 1.1 : 0.9;
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setTalk({ text, who: opts.who || 'kakeru', mood: opts.mood });
          Speech.say(text, () => { if (sayId.current === id) resolve(); else resolve(); }, pitchOf(opts.who));
        });
        const show = (text, opts = {}) => { ++sayId.current; Speech.stop(); lastSay.current = { text, opts }; setTalk({ text, who: opts.who || 'kakeru', mood: opts.mood }); };
        return { say: run, show, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const talkCtx = { ...talkApi, ...talk };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        ['sound', 'hint', 'yomi'].forEach(k => { v[k] = v[k] !== false && v[k] !== 'false'; });
        ['count', 'count2', 'kakashi'].forEach(k => { v[k] = Number(v[k]); if (isNaN(v[k]) || !v[k]) v[k] = DEFAULT_SETTINGS[k]; });
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8;
        Sound.on = v.sound; setSoundOn(Sound.on);
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        Img.loadCache().then(() => Img.syncDrive());
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        const recs = records.current; records.current = [];
        api.save({ name, progress: json, records: recs, stamp: nowStr(), time: Date.now() });
        return p;
      };
      const go = (v) => { talkApi.stop(); setView(v); };

      const login = async (n) => {
        Sound.get();
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた ところ（全部開く・はってん・はんい）は スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) p = { ...p, unlockAll: !!a.unlockAll, hatten: !!a.hatten, range: a.range, hero: a.hero, flagT: a.flagT };
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false);
        if (!p.story.op) setView({ v: 'story', kind: 'opening' });
        else if (!p.hero) setView({ v: 'create' });
        else setView({ v: 'town' });
      };
      const logout = () => { talkApi.stop(); setName(null); setView({ v: 'login' }); setTalk({ text: '' }); };

      const addDay = (p, g, e) => {
        const d = p.day && p.day.d === today() ? p.day : { d: today(), n: 0, exp: 0, gold: 0 };
        return { ...d, n: d.n + 1, exp: d.exp + e, gold: d.gold + g };
      };
      // 1もん とけた
      const onProblem = (rec, part) => {
        records.current.push({ ...rec, id: uid() });
        const shu = rec.place === 'しゅぎょう';
        const g = shu ? R.shuGold : R.gold, e = shu ? R.shuExp : R.exp;
        gain.current.gold += g; gain.current.exp += e; gain.current.miss += rec.miss;
        let p = progRef.current;
        let nigate = p.nigate || [];
        if (rec.a) {
          nigate = nigate.filter(x => !(x[0] === rec.a && x[1] === rec.b));
          if (rec.miss > 0) nigate = [...nigate, [rec.a, rec.b]].slice(-20);
        }
        p = { ...p, gold: p.gold + g, earned: p.earned + g, exp: p.exp + e, total: (p.total || 0) + 1, day: addDay(p, g, e), nigate, part: part || p.part };
        setBump(x => x + 1); Sound.coin();
        persist(p);
      };
      const levelModal = (p, list) => { const lv = levelOf(p.exp).lv; if (lv > lvAtStart.current) list.push({ t: 'level', lv }); };

      const startBattle = (pl, bi, resume) => {
        records.current = []; gain.current = { gold: 0, exp: 0, miss: 0 };
        lvAtStart.current = levelOf(progRef.current.exp).lv;
        go({ v: 'battle', pl, bi, resume, key: uid() });
      };
      const winBattle = (pl, bi) => {
        let p = { ...progRef.current, part: null };
        const m = MONSTERS.filter(x => x.place === pl.id)[bi];
        const first = bi === 2 && !placeCleared(p, pl);
        const bonus = bi === 2 ? R.bossBonus : R.zakoBonus;
        p.gold += bonus; p.earned += bonus;
        p.beaten = { ...p.beaten, [pl.id + ':' + bi]: beatenN(p, pl, bi) + 1 };
        const newZukan = !p.zukan[m.id];
        p.zukan = { ...p.zukan, [m.id]: (p.zukan[m.id] || 0) + 1 };
        const list = [];
        if (first) {
          list.push({ t: 'gem', pl, shop: SHOPS.find(s => s.open === pl.id) });
          const next = compOrder(p.hero).find(c => !p.comps.includes(c.id));
          if (next && !pl.hatten) { p.comps = [...p.comps, next.id]; list.push({ t: 'comp', c: next }); }
        }
        levelModal(p, list);
        if (first && pl.id === 'p8' && !p.story.end) { p.story = { ...p.story, end: true }; list.push({ t: 'ending' }); }
        p = persist(p);
        setModals(list);
        go({ v: 'result', r: { pl, m, bi, gold: gain.current.gold + bonus, exp: gain.current.exp, perfect: gain.current.miss === 0, newZukan } });
      };

      const startShu = (s) => {
        records.current = []; gain.current = { gold: 0, exp: 0, miss: 0 };
        lvAtStart.current = levelOf(progRef.current.exp).lv;
        if (s.id === 'mato' || s.id === 'ishi') { go({ v: 'drill', s, key: uid() }); return; }
        const specs = rangeSpecs(progRef.current);
        const used = new Set();
        let probs;
        if (s.id === 'kakashi') probs = Array.from({ length: settings.kakashi }, () => makeProblem(pickOne(specs), used));
        else {
          const ng = [...(progRef.current.nigate || [])].reverse().slice(0, 5);
          probs = ng.map(x => { used.add(x[0] + 'x' + x[1]); return x; });
          const like = ng.length ? ng.map(x => classify(x[0], x[1])) : specs;
          while (probs.length < 5) probs.push(makeProblem(pickOne(like), used));
          if (!ng.length) talkApi.say('まだ にがては ないようじゃ。いろいろな もんだいで しゅぎょうしよう。', { who: 'kakeru' });
        }
        go({ v: 'shuboard', s, probs, key: uid() });
      };
      const finishShu = (s) => {
        let p = { ...progRef.current };
        p.shu = { ...p.shu, [s.id]: (p.shu[s.id] || 0) + 1 };
        p.gold += R.shuBonus; p.earned += R.shuBonus; p.exp += R.shuBonus;
        gain.current.gold += R.shuBonus; gain.current.exp += R.shuBonus;
        const list = [];
        if (p.shu[s.id] >= D.WAZA_AT && !p.waza.includes(s.waza)) { p.waza = [...p.waza, s.waza]; list.push({ t: 'waza', s }); }
        levelModal(p, list);
        persist(p);
        setModals(list);
        go({ v: 'shuresult', s, gain: { ...gain.current } });
      };
      const quitTo = (v) => { persist({ ...progRef.current }); go(v); };

      const buy = (shop, it) => {
        const p = progRef.current;
        if (p.gold < it.p || p.items.includes(it.id)) return;
        persist({ ...p, gold: p.gold - it.p, items: [...p.items, it.id], equip: { ...p.equip, [shop.id]: it.id } });
      };
      const equip = (slot, id) => persist({ ...progRef.current, equip: { ...progRef.current.equip, [slot]: id } });

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const q = me.progress ? parseProgress(me.progress) : { ...newProgress(), t: Date.now() };
              if (!me.progress || q.t >= (progRef.current.t || 0)) { progRef.current = q; setProgress(q); safeStore.set(COPY_KEY(name), JSON.stringify(q)); }
            }
          }
        }
      };
      const closeModal = () => setModals(ms => ms.slice(1));
      useEffect(() => {
        if (modals[0] && modals[0].t === 'ending') { setModals(ms => ms.slice(1)); go({ v: 'story', kind: 'ending' }); }
      }, [modals]);

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-amber-100">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl text-white">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-slate-300 mt-2">{boot.error}</div></div>;

      const p = progress;
      const bar = (town = true) => (
        <TopBar name={name} p={p} bump={bump} onTown={town ? () => go({ v: 'town' }) : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }} />
      );
      const wrap = (inner, town = true) => <div className="min-h-screen flex flex-col">{bar(town)}{inner}</div>;
      const v = view.v;

      let body = null;
      if (!name || v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (v === 'story') {
        body = <StoryScreen key={view.kind} pages={D.STORY[view.kind]} doneLabel={view.kind === 'opening' && !p.hero ? 'ぼうけんの じゅんびを する ▶' : 'まちへ もどる'}
          onDone={() => { if (view.kind === 'opening' && !p.story.op) persist({ ...progRef.current, story: { ...progRef.current.story, op: true } }); go(progRef.current.hero ? { v: 'town' } : { v: 'create' }); }} />;
      } else if (v === 'create' || !p.hero) {
        body = <CreateHero name={name} onDone={(hero) => { persist({ ...progRef.current, hero }); go({ v: 'town' }); }} />;
      } else if (v === 'town') {
        body = wrap(<Town p={p} onGo={(w) => {
          if (w.startsWith('shop:')) go({ v: 'shop', shop: SHOPS.find(s => s.id === w.slice(5)) });
          else go({ v: w });
        }} onContinue={() => startBattle(PLACE[p.part.place], p.part.bi, true)} />, false);
      } else if (v === 'map') {
        body = wrap(<WorldMap p={p} onEnter={(pl) => go({ v: 'place', pl })} onTown={() => go({ v: 'town' })} onMoved={(id) => persist({ ...progRef.current, mapAt: id })} />);
      } else if (v === 'place') {
        body = wrap(<PlaceScreen p={p} pl={view.pl} onBattle={startBattle} onMap={() => go({ v: 'map' })} onDemo={(pl) => go({ v: 'demo', pl, back: { v: 'place', pl } })} />);
      } else if (v === 'battle') {
        body = wrap(<Battle key={view.key} p={p} pl={view.pl} bi={view.bi} resume={view.resume} settings={settings} name={name}
          onProblem={onProblem} onWin={winBattle} onQuit={() => quitTo({ v: 'place', pl: view.pl })} />);
      } else if (v === 'result') {
        const r = view.r;
        const nextOk = r.bi < 2 && battleOpen(p, r.pl, r.bi + 1);
        body = wrap(<ResultScreen r={r} onNext={nextOk ? () => startBattle(r.pl, r.bi + 1, false) : null} onPlace={() => go({ v: 'place', pl: r.pl })} onTown={() => go({ v: 'town' })} />);
      } else if (v === 'demo') {
        body = wrap(<DemoScreen pl={view.pl} onBack={() => go(view.back)} />);
      } else if (v === 'shop') {
        body = wrap(<ShopScreen p={p} shop={view.shop} onBuy={buy} onEquip={equip} />);
      } else if (v === 'house') {
        body = wrap(<HouseScreen p={p} name={name} onEquip={equip} onForm={(f) => persist({ ...progRef.current, hero: { ...progRef.current.hero, form: f } })} />);
      } else if (v === 'inn') {
        body = wrap(<InnScreen p={p} onRest={logout} />);
      } else if (v === 'castle') {
        body = wrap(<CastleScreen p={p} onStory={(kind) => go({ v: 'story', kind })} />);
      } else if (v === 'guild') {
        body = wrap(<GuildScreen p={p} onDemo={(pl) => go({ v: 'demo', pl, back: { v: 'guild' } })} />);
      } else if (v === 'shugyo') {
        body = wrap(<ShugyoMenu p={p} onStart={startShu} />);
      } else if (v === 'drill') {
        body = wrap(<ChoiceDrill key={view.key} mode={view.s.id} count={10} onProblem={(rec) => onProblem(rec, null)} onFinish={() => finishShu(view.s)} onQuit={() => quitTo({ v: 'shugyo' })} />);
      } else if (v === 'shuboard') {
        body = wrap(<ShuBoard key={view.key} mode={view.s.id} probs={view.probs} settings={settings} p={p} onProblem={(rec) => onProblem(rec, null)} onFinish={() => finishShu(view.s)} onQuit={() => quitTo({ v: 'shugyo' })} />);
      } else if (v === 'shuresult') {
        body = wrap(<ShuResult s={view.s} gain={view.gain} onAgain={() => startShu(view.s)} onBack={() => go({ v: 'shugyo' })} />);
      }

      return (
        <TalkCtx.Provider value={talkCtx}>
          {body}
          {modals[0] && modals[0].t !== 'ending' && <Modal key={modals.length} m={modals[0]} p={p} onClose={closeModal} />}
          {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
          {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
        </TalkCtx.Provider>
      );
    }

    window.KAKE_READY.then(() => {
      D = window.KAKE_DATA;
      PLACES = D.PLACES; MONSTERS = D.MONSTERS; JOBS = D.JOBS; FORMS = D.FORMS; SHOPS = D.SHOPS; SHUGYO = D.SHUGYO;
      ALL_ITEMS = SHOPS.flatMap(s => s.items.map(it => ({ ...it, slot: s.id })));
      ALL_ITEMS.forEach(it => { ITEM[it.id] = it; });
      MONSTERS.forEach(m => { MON[m.id] = m; });
      PLACES.forEach(pl => { PLACE[pl.id] = pl; });
      JOBS.forEach(j => { JOB[j.id] = j; });
      Img.setGitHub(D.IMAGES);
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:24px;line-height:1.8;color:#fff">データを よみこめませんでした。<br>ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<div style="font-size:14px;color:#aaa">' + e.message + '</div></div>';
    });
  </script>
</body>
</html>
