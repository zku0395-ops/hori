<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ケンジャの カケルさまの ひっさん クエスト</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'BIZ UDPGothic', sans-serif; background: #14213d; margin: 0; color: #1e293b;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    .btn3d { border-bottom-width: 6px; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; }
    .rpgwin { background: rgba(15,23,42,.92); border: 4px solid #fff; border-radius: 14px; box-shadow: 0 0 0 3px #1e293b, 0 6px 16px rgba(0,0,0,.4); color: #fff; }
    .pop { animation: pop .45s cubic-bezier(.17,.89,.32,1.28) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floaty { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .bob { animation: bob 1.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .shake { animation: shake .4s 2; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25%,75% { transform: translateX(-7px); } 50% { transform: translateX(7px); } }
    .hit { animation: hit .5s; }
    @keyframes hit { 0%,100% { transform: translateX(0); filter: none; } 20% { transform: translateX(14px); filter: brightness(2.2); } 40% { transform: translateX(-10px); } 60% { transform: translateX(6px); filter: brightness(1.8); } }
    .defeat { animation: defeat 1s ease-in forwards; }
    @keyframes defeat { 0% { opacity: 1; transform: scale(1); filter: brightness(1); } 40% { filter: brightness(3); } 100% { opacity: 0; transform: scale(.6) translateY(30px); filter: brightness(3); } }
    .fxfly { animation: fxfly .8s ease-out forwards; }
    @keyframes fxfly { 0% { transform: translate(-160px, 80px) scale(.5) rotate(-30deg); opacity: 0; } 30% { opacity: 1; } 70% { transform: translate(0, 0) scale(1.6) rotate(10deg); opacity: 1; } 100% { transform: translate(0, 0) scale(2.2); opacity: 0; } }
    .glow { animation: glow 1.1s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 10px rgba(250,204,21,0); } }
    .cellglow { animation: cellglow 1s ease-in-out infinite; }
    @keyframes cellglow { 0%,100% { box-shadow: inset 0 0 0 4px #f59e0b, 0 0 0 0 rgba(245,158,11,.8); } 50% { box-shadow: inset 0 0 0 4px #f59e0b, 0 0 0 8px rgba(245,158,11,0); } }
    .opglow { box-shadow: inset 0 0 0 4px #ec4899 !important; }
    .ghost { color: rgba(37,99,235,.35); }
    .bump { animation: bump .5s; }
    @keyframes bump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.3); } }
    .goldfly { animation: goldfly 1.1s ease-out forwards; }
    @keyframes goldfly { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }
    .banner { animation: banner 2s ease-in-out forwards; }
    @keyframes banner { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 0; } 15% { transform: translate(-50%,-50%) scale(1.1); opacity: 1; } 25%,80% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(.9); opacity: 0; } }
    .twinkle { animation: twinkle 1.6s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
    svg .twinkle, svg .bob { transform-box: fill-box; transform-origin: center; }
    .tshadow { text-shadow: 0 2px 4px rgba(0,0,0,.6); }
    .title { text-shadow: 3px 3px 0 #7c2d12, -2px 2px 0 #7c2d12, 2px -2px 0 #7c2d12, -2px -2px 0 #7c2d12, 0 5px 12px rgba(0,0,0,.6); }
    .cross { background-image: linear-gradient(to top right, transparent calc(50% - 1.5px), #64748b 50%, transparent calc(50% + 1.5px)), linear-gradient(to top left, transparent calc(50% - 1.5px), #64748b 50%, transparent calc(50% + 1.5px)); }
    .pixel { image-rendering: pixelated; }
    .bldg { cursor: pointer; transition: filter .15s; }
    .bldg:hover, .bldg:active { filter: brightness(1.15) drop-shadow(0 0 6px #fde047); }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#fde68a;font-weight:bold;">じゅんび ちゅう…</div>
  </div>

  <!-- データと絵は GitHub Pages から読みこみます（このファイルを短くするため） -->
  <script>
    (function () {
      var h = location.hostname;
      var local = location.protocol === 'file:' || /github\.io$/.test(h) || h === 'localhost' || h === '127.0.0.1';
      window.KAKE_BASE = local ? '' : 'https://zku0395-ops.github.io/hori/kakezan/';
      var V = '1';
      window.KAKE_READY = new Promise(function (ok, ng) {
        var s = document.createElement('script');
        s.src = window.KAKE_BASE + 'data/data.js?v=' + V;
        s.onload = ok; s.onerror = function () { ng(new Error('data/data.js')); };
        document.head.appendChild(s);
      });
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;
    const APP_VERSION = '1.4.0';
    const BASE = window.KAKE_BASE;
    const IMG = BASE + 'img/';
    let D = {}, PLACES = [], MONSTERS = [], JOBS = [], FORMS = [], SHOPS = [], SHUGYO = [], ALL_ITEMS = [];
    const ITEM = {}, MON = {}, PLACE = {}, JOB = {};

    // =====================================================================
    //  1. 小さな道具
    // =====================================================================
    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const pickOne = (a) => a[Math.floor(Math.random() * a.length)];
    const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const pad = (n) => String(n).padStart(2, '0');
    const nowStr = () => { const d = new Date(); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const today = () => nowStr().slice(0, 10);
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const safeStore = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
    };
    const downloadText = (name, text, type) => {
      const blob = new Blob([text], { type: type || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    };

    // =====================================================================
    //  2. こえ と おと
    // =====================================================================
    // よみあげ用：記号を ことばに する
    const speakText = (t) => String(t).replace(/×/g, ' かける ').replace(/＋|\+/g, ' たす ').replace(/＝/g, ' は ').replace(/✕/g, 'ばつ');
    const Speech = {
      rate: 0.8, pitch: 1.0, voice: null,
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd, pitch) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const t = speakText(text);
          const u = new SpeechSynthesisUtterance(t);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = pitch || this.pitch;
          let done = false;
          const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
          u.onend = end; u.onerror = end;
          // 声が出ない端末でも先へ進めるように、長さに合わせて待つ
          setTimeout(end, 1500 + t.length * 260 / this.rate);
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() { try { this.ok && window.speechSynthesis.cancel(); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }

    const Sound = {
      on: true, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      tone(freq, at, dur, type = 'triangle', vol = 0.16) {
        const c = this.get(); if (!c || !this.on) return;
        const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      // このアプリのための オリジナルの おと
      tap() { this.tone(700, 0, .06, 'square', .05); },
      ok() { this.tone(880, 0, .08, 'square', .06); this.tone(1175, .07, .12, 'square', .06); },
      retry() { this.tone(330, 0, .14, 'sine', .06); this.tone(294, .12, .2, 'sine', .06); }, // まちがえたとき（小さな音）
      hit() { this.tone(180, 0, .12, 'sawtooth', .08); this.tone(120, .06, .2, 'square', .07); [1200, 1500].forEach((f, i) => this.tone(f, .1 + i * .05, .1, 'square', .04)); },
      appear() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, i * .08, .14, 'square', .06)); },
      win() { [[523, 0], [659, .12], [784, .24], [1046, .36]].forEach(([f, t]) => this.tone(f, t, .2, 'square', .07)); [523, 659, 784].forEach(f => this.tone(f, .6, .8, 'triangle', .1)); },
      big() { // レベルアップ・ほうせき
        [[523, 0], [523, .15], [523, .3], [659, .45], [784, .75], [659, 1.0], [784, 1.15]].forEach(([f, t]) => this.tone(f, t, .2, 'square', .07));
        [523, 659, 784, 1046].forEach(f => this.tone(f, 1.35, 1.1, 'triangle', .12));
      },
      coin() { this.tone(988, 0, .08, 'square', .05); this.tone(1319, .08, .22, 'square', .05); },
      buy() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, i * .07, .18, 'square', .05)); },
      walk() { this.tone(220, 0, .05, 'square', .03); },
    };

    // =====================================================================
    //  3. 絵（GitHub の img/ ＋ ドライブの「ひっさんクエスト え」。ないときは 自作の SVG と 絵文字）
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    const baseName = (f) => String(f).replace(/\.[a-z0-9]+$/i, '');
    const ImgDB = {
      db: null,
      open() {
        if (this.db) return Promise.resolve(this.db);
        return new Promise((ok) => {
          try {
            const r = indexedDB.open('kakezan_img', 1);
            r.onupgradeneeded = () => { r.result.createObjectStore('img', { keyPath: 'name' }); };
            r.onsuccess = () => { this.db = r.result; ok(this.db); };
            r.onerror = () => ok(null);
          } catch (e) { ok(null); }
        });
      },
      async all() {
        const db = await this.open(); if (!db) return [];
        return new Promise(ok => { try { const q = db.transaction('img').objectStore('img').getAll(); q.onsuccess = () => ok(q.result || []); q.onerror = () => ok([]); } catch (e) { ok([]); } });
      },
      async put(rec) {
        const db = await this.open(); if (!db) return;
        return new Promise(ok => { try { const tx = db.transaction('img', 'readwrite'); tx.objectStore('img').put(rec); tx.oncomplete = ok; tx.onerror = ok; } catch (e) { ok(); } });
      },
      async del(name) {
        const db = await this.open(); if (!db) return;
        return new Promise(ok => { try { const tx = db.transaction('img', 'readwrite'); tx.objectStore('img').delete(name); tx.oncomplete = ok; tx.onerror = ok; } catch (e) { ok(); } });
      },
    };
    const Img = {
      gh: {}, drive: {}, meta: {}, subs: new Set(), ver: 0,
      status: { checked: false, count: 0, loading: 0, error: '', names: [] },
      url(base) { return this.drive[base] || this.gh[base] || null; },
      has(base) { return !!this.url(base); },
      notify() { this.ver++; this.subs.forEach(f => f(this.ver)); },
      setGitHub(list) { (list || []).forEach(f => { this.gh[baseName(f)] = IMG + f; }); },
      // 端末に 保存して ある ドライブの 絵を すぐ つかう
      async loadCache() {
        const recs = await ImgDB.all();
        recs.forEach(r => { if (r.blob) { this.drive[r.name] = URL.createObjectURL(r.blob); this.meta[r.name] = r.t; } });
        if (recs.length) this.notify();
      },
      // ドライブの フォルダを 見て、あたらしい 絵・かわった 絵だけ よみこむ
      async syncDrive() {
        if (!HAS_GAS) return;
        let list;
        try { list = await gas('getImageList'); } catch (e) { this.status = { ...this.status, error: String(e && e.message || e) }; this.notify(); return; }
        if (!list || !list.ok) { this.status = { ...this.status, checked: true, error: (list && list.reason) || '' }; this.notify(); return; }
        const want = {};
        list.files.forEach(f => { want[baseName(f.name)] = f; });
        // ドライブから けされた 絵は 端末からも けす
        for (const n of Object.keys(this.meta)) if (!want[n]) { await ImgDB.del(n); delete this.meta[n]; delete this.drive[n]; }
        const todo = Object.keys(want).filter(n => this.meta[n] !== want[n].t);
        this.status = { checked: true, count: Object.keys(want).length, loading: todo.length, error: '', names: Object.keys(want).sort(), folder: list.folder };
        this.notify();
        for (const n of todo) {
          try {
            const r = await gas('getImage', want[n].id);
            if (r && r.ok) {
              const bin = atob(r.b64); const u8 = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
              const blob = new Blob([u8], { type: r.mime || 'image/png' });
              await ImgDB.put({ name: n, t: want[n].t, blob });
              if (this.drive[n]) URL.revokeObjectURL(this.drive[n]);
              this.drive[n] = URL.createObjectURL(blob); this.meta[n] = want[n].t;
            }
          } catch (e) { this.status.error = String(e && e.message || e); }
          this.status = { ...this.status, loading: this.status.loading - 1 };
          this.notify();
        }
      },
    };

    // =====================================================================
    //  4. ひっ算の しくみ（もんだいを つくる・1マスずつの てじゅん・まちがいの しゅるい）
    // =====================================================================
    const digits = (n) => String(n).split('').reverse().map(Number); // 1の位が [0]
    const PLACE_NAME = ['1の位', '10の位', '100の位', '1000の位', '10000の位'];
    const TWO_DIGIT_SPECS = ['t10', 'tn', 't1x', 'x22a', 'x22', 'm2', 'h32'];

    // a × b の もんだいの しゅるいを しらべる
    function classify(a, b) {
      const A = digits(a), B = digits(b);
      if (A.length === 1 && B.length === 1) return 'k';
      if (B.length === 1) {
        if (A.length === 3) return 'h31';
        const p0 = A[0] * b, c = Math.floor(p0 / 10), p1 = A[1] * b + c;
        if (c > 0 && p1 % 10 === 0) return 'z0';
        if (p1 >= 10) return 'd3';
        return c > 0 ? 'c1' : 'n0';
      }
      if (A.length === 3) return 'h32';
      if (b === 10) return 't10';
      if (b % 10 === 0) return 'tn';
      if (b > 10 && b < 20) return 't1x';
      const noCarry = B.every(d => A.every(x => x * d < 10));
      return noCarry ? 'x22a' : 'x22';
    }
    function randFor(spec) {
      for (let i = 0; i < 400; i++) {
        let a, b;
        if (spec === 'k') { a = rnd(2, 9); b = rnd(2, 9); }
        else if (['n0', 'c1', 'd3', 'z0'].includes(spec)) { a = rnd(11, 99); b = rnd(2, 9); if (a % 10 === 0) continue; }
        else if (spec === 't10') { a = rnd(12, 98); b = 10; if (a % 10 === 0) continue; }
        else if (spec === 'tn') { a = rnd(12, 49); b = rnd(2, 9) * 10; if (a % 10 === 0) continue; }
        else if (spec === 't1x') { a = rnd(12, 69); b = rnd(11, 19); if (a % 10 === 0) continue; }
        else if (spec === 'x22a') { a = rnd(11, 44); b = rnd(12, 44); if (a % 10 === 0 || b % 10 === 0) continue; }
        else if (spec === 'x22') { a = rnd(12, 98); b = rnd(21, 98); if (a % 10 === 0 || b % 10 === 0) continue; }
        else if (spec === 'h31') { a = rnd(101, 499); b = rnd(2, 6); if (a % 10 === 0) continue; }
        else if (spec === 'h32') { a = rnd(101, 399); b = rnd(12, 39); if (a % 10 === 0 || b % 10 === 0) continue; }
        else return null;
        if (classify(a, b) === spec) return [a, b];
      }
      return [23, 3];
    }
    // しゅるいに あう もんだいを 1つ つくる（先生の プリントの もんだいを ときどき まぜる）
    function makeProblem(spec, used) {
      if (spec === 'm1') spec = pickOne(['c1', 'd3', 'z0']);
      if (spec === 'm2') spec = pickOne(['tn', 't1x', 'x22', 'x22']);
      const key = (p) => p[0] + 'x' + p[1];
      const pool = ((D.POOL || {})[spec] || []).filter(p => !used.has(key(p)));
      let p = null;
      if (pool.length && Math.random() < 0.5) p = pickOne(pool);
      for (let i = 0; !p && i < 20; i++) { const q = randFor(spec); if (!used.has(key(q)) || i === 19) p = q; }
      used.add(key(p));
      return p;
    }
    const problemCount = (spec, s) => TWO_DIGIT_SPECS.includes(spec) ? (Number(s.count2) || 3) : (Number(s.count) || 5);
    function makeSet(spec, n) { const used = new Set(); return Array.from({ length: n }, () => makeProblem(spec, used)); }

    // a × b の ひっ算を 1マスずつの てじゅんに する
    // rows：'ans'（かける かずが 1けた）または 'p1'・'p2'・'sum'
    function buildHissan(a, b) {
      const A = digits(a), B = digits(b);
      const steps = [];
      const vals = {}; // `${row}:${place}` → 正しい かず（メモは `${row}m:${place}`）
      const add = (s) => { steps.push(s); vals[(s.memo ? s.row + 'm' : s.row) + ':' + s.place] = s.val; };
      const mulRow = (row, d, bPlace, shift) => {
        let carry = 0; const out = [];
        for (let i = 0; i < A.length; i++) {
          const prod = A[i] * d, tot = prod + carry, place = i + shift, last = i === A.length - 1;
          add({ kind: 'mul', row, place, val: tot % 10, aPlace: i, bPlace, x: A[i], y: d, prod, carry, tot });
          out[place] = tot % 10;
          carry = Math.floor(tot / 10);
          if (carry > 0 && !last) add({ kind: 'memo', row, memo: true, place: place + 1, val: carry, tot, from: place });
          if (carry > 0 && last) { add({ kind: 'mulhi', row, place: place + 1, val: carry, tot, from: place }); out[place + 1] = carry; }
        }
        return out;
      };
      const two = B.length === 2;
      if (!two) {
        mulRow('ans', B[0], 0, 0);
      } else {
        const p1 = mulRow('p1', B[0], 0, 0);
        add({ kind: 'zero', row: 'p2', place: 0, val: 0 });
        const p2 = mulRow('p2', B[1], 1, 1);
        const top = Math.max(p1.length, p2.length);
        let carry = 0;
        for (let pl = 0; pl < top; pl++) {
          const x = p1[pl] || 0, y = pl === 0 ? 0 : (p2[pl] || 0), s = x + y + carry, last = pl === top - 1;
          add({ kind: 'add', row: 'sum', place: pl, val: s % 10, x, y, carry, tot: s, has1: p1[pl] !== undefined, has2: p2[pl] !== undefined || pl === 0 });
          carry = Math.floor(s / 10);
          if (carry > 0 && !last) add({ kind: 'addmemo', row: 'sum', memo: true, place: pl + 1, val: carry, tot: s, from: pl });
          if (carry > 0 && last) add({ kind: 'addhi', row: 'sum', place: pl + 1, val: carry, tot: s, from: pl });
        }
      }
      const width = Math.max(...steps.map(s => s.place)) + 1;
      return { a, b, A, B, two, steps, vals, width: Math.max(width, A.length, B.length), answer: a * b, spec: classify(a, b) };
    }

    // まちがいの しゅるい
    const KINDS = ['くくの まちがい', 'くりあがりの たしわすれ', 'くらいの まちがい', 'くりあがりの メモ', '0の かきわすれ', 'たし算の まちがい', 'たし算の くりあがり わすれ'];
    function mistakeKind(st, v) {
      if (st.kind === 'mul') {
        if (st.carry > 0 && v === st.prod % 10) return 'くりあがりの たしわすれ';
        if (st.tot >= 10 && v === Math.floor(st.tot / 10)) return 'くらいの まちがい';
        return 'くくの まちがい';
      }
      if (st.kind === 'memo' || st.kind === 'mulhi') return 'くりあがりの メモ';
      if (st.kind === 'zero') return '0の かきわすれ';
      if (st.kind === 'add') return st.carry > 0 && v === (st.x + st.y) % 10 ? 'たし算の くりあがり わすれ' : 'たし算の まちがい';
      return 'たし算の くりあがり わすれ'; // addmemo・addhi
    }
    // その マスで いう こと（よみあげ）
    function stepPrompt(st) {
      const pn = PLACE_NAME[st.place];
      switch (st.kind) {
        case 'mul': return `${st.x} × ${st.y}${st.carry ? `、メモの ${st.carry} を たす` : ''}。${pn}に かこう`;
        case 'memo': return 'くりあがりを となりの うえに メモしよう';
        case 'mulhi': return `のこりの かずを ${pn}に かこう`;
        case 'zero': return '✕の マスには なにを かくかな';
        case 'add': return `${st.x} ＋ ${st.y}${st.carry ? `、メモの ${st.carry} も たす` : ''}。${pn}に かこう`;
        case 'addmemo': return 'たし算の くりあがりを メモしよう';
        case 'addhi': return `のこりの かずを ${pn}に かこう`;
        default: return '';
      }
    }
    // ヒント①（ことば）
    function hintText(st) {
      const pn = PLACE_NAME[st.place];
      switch (st.kind) {
        case 'mul': return `${st.x} × ${st.y} を けいさんしよう。${st.carry ? `そのあと メモの ${st.carry} を たすよ。` : ''}${st.tot >= 10 ? 'こたえの 1の位の かずだけ かくよ。' : ''}`;
        case 'memo': return 'さっきの こたえの 10の位の かずを、となりの マスの うえに ちいさく メモするよ。';
        case 'mulhi': return `さっきの こたえの 10の位の かずを、ひだりの ${pn}に かくよ。`;
        case 'zero': return '2だんめは 10の位の かけ算だよ。1の位の ✕の マスには 0 を かくよ。';
        case 'add': return `${st.x} ＋ ${st.y} を けいさんしよう。${st.carry ? `メモの ${st.carry} も たすよ。` : ''}`;
        case 'addmemo': return 'たし算の こたえの 10の位の かずを、となりの うえに メモするよ。';
        case 'addhi': return `たし算の こたえの 10の位の かずを、ひだりの ${pn}に かくよ。`;
        default: return '';
      }
    }
    // ヒント②（しき）
    function hintCalc(st) {
      switch (st.kind) {
        case 'mul': return [`${st.x} × ${st.y} ＝ ${st.prod}`].concat(st.carry ? [`${st.prod} ＋ ${st.carry} ＝ ${st.tot}`] : []);
        case 'memo': case 'mulhi': case 'addmemo': case 'addhi': return [`${st.tot} の 10の位は ${Math.floor(st.tot / 10)}`];
        case 'zero': return ['✕の マスは 0'];
        case 'add': return [`${st.x} ＋ ${st.y} ＝ ${st.x + st.y}`].concat(st.carry ? [`${st.x + st.y} ＋ ${st.carry} ＝ ${st.tot}`] : []);
        default: return [];
      }
    }
    // まちがえた ときの こえかけ
    function missText(kind, st) {
      switch (kind) {
        case 'くりあがりの たしわすれ': return `おしい！ メモの ${st.carry} を たすのを わすれて いるよ。`;
        case 'くらいの まちがい': return 'ここには こたえの 1の位の かずだけ かくよ。10の位は メモに しよう。';
        case 'くくの まちがい': return `${st.x} × ${st.y} を もういちど となえて みよう。`;
        case 'くりあがりの メモ': return 'うえの こたえの 10の位の かずを かくよ。';
        case '0の かきわすれ': return '2だんめは 10の位の かけ算。1の位には 0 を かこう。';
        case 'たし算の くりあがり わすれ': return st.kind === 'add' ? `メモの ${st.carry} も たそう。` : 'たし算の こたえの 10の位の かずを かくよ。';
        default: return `${st.x} ＋ ${st.y} を もういちど かぞえて みよう。`;
      }
    }
    // ヒント②で ひからせる マス
    function operandCells(st) {
      if (st.kind === 'mul') return [`a:${st.aPlace}`, `b:${st.bPlace}`].concat(st.carry ? [`${st.row}m:${st.place}`] : []);
      if (st.kind === 'add') return [`p1:${st.place}`, `p2:${st.place}`].concat(st.carry ? [`summ:${st.place}`] : []);
      if (st.kind === 'zero') return ['b:1'];
      return [`${st.row}:${st.from}`];
    }

    // しゅぎょう：くくの まと・くりあがりの いし の えらぶ こたえ
    function choicesFor(ans, cands) {
      const set = new Set([ans]);
      shuffle(cands).forEach(c => { if (set.size < 4 && c > 0 && c !== ans && c < 200) set.add(c); });
      for (let d = 1; set.size < 4; d++) { if (ans + d > 0) set.add(ans + d); if (set.size < 4 && ans - d > 0) set.add(ans - d); }
      return shuffle([...set]);
    }
    function makeMato() {
      const a = rnd(2, 9), b = rnd(2, 9), ans = a * b;
      const rev = ans >= 10 ? Number(String(ans).split('').reverse().join('')) : 0;
      return { a, b, ans, q: `${a} × ${b}`, choices: choicesFor(ans, [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, rev, ans + 1, ans - 1]) };
    }
    function makeIshi() {
      const x = rnd(2, 9) * rnd(2, 9), c = rnd(1, 8), ans = x + c;
      return { x, c, ans, q: `${x} ＋ ${c}`, choices: choicesFor(ans, [x, ans - 10, ans + 10, ans + 1, ans - 1, x + c - 1]) };
    }

    // =====================================================================
    //  5. すすみぐあい（レベル・なかま・ばしょ）
    // =====================================================================
    const newProgress = () => ({
      t: 0, hero: null, exp: 0, gold: 0, earned: 0, total: 0, beaten: {}, comps: [], items: [], equip: { buki: null, bougu: null, dougu: null },
      zukan: {}, shu: {}, waza: [], nigate: [], part: null, story: {}, mapAt: 'town', day: { d: '', n: 0, exp: 0, gold: 0 },
    });
    const parseProgress = (s) => {
      let o = {}; try { o = typeof s === 'string' ? JSON.parse(s || '{}') || {} : (s || {}); } catch (e) { o = {}; }
      const p = { ...newProgress(), ...o };
      p.equip = { ...newProgress().equip, ...(o.equip || {}) };
      p.story = { ...(o.story || {}) }; p.beaten = { ...(o.beaten || {}) }; p.zukan = { ...(o.zukan || {}) }; p.shu = { ...(o.shu || {}) };
      return p;
    };
    const mainPlaces = () => PLACES.filter(x => !x.hatten);
    const beatenN = (p, pl, bi) => p.beaten[pl.id + ':' + bi] || 0;
    const placeCleared = (p, pl) => beatenN(p, pl, 2) > 0;
    const placeOpen = (p, pl) => {
      if (pl.hatten) return !!p.hatten;
      const ms = mainPlaces(), i = ms.indexOf(pl);
      return i <= 0 || !!p.unlockAll || placeCleared(p, ms[i - 1]);
    };
    const battleOpen = (p, pl, bi) => placeOpen(p, pl) && (bi === 0 || !!p.unlockAll || beatenN(p, pl, bi - 1) > 0 || beatenN(p, pl, bi) > 0);
    const gemsOf = (p) => mainPlaces().filter(pl => placeCleared(p, pl)).length;
    const needExp = (lv) => 20 + 10 * lv;
    function levelOf(exp) {
      let lv = 1, e = exp || 0;
      while (e >= needExp(lv) && lv < 99) { e -= needExp(lv); lv++; }
      return { lv, cur: e, need: needExp(lv) };
    }
    function rankOf(lv, job) {
      const r = [...D.RANKS].reverse().find(x => lv >= x.lv) || D.RANKS[0];
      return r.full ? r.n : `${r.n} ${(JOB[job] || JOBS[0]).name}`;
    }
    // なかま：じぶんで えらばなかった しょくぎょうの 3にん × すがた3 ＝ 9にん。ばしょを クリアする たびに 1にん
    const COMP_NAMES = { yusha: ['ソウタ', 'ヒカリ', 'ジン'], mahou: ['ルナ', 'ミルク', 'セイ'], shonin: ['マルコ', 'チャチャ', 'ギン'], soryo: ['ノエル', 'ハル', 'リン'] };
    function compOrder(hero) {
      const jobs = JOBS.map(j => j.id).filter(j => !hero || j !== hero.job);
      const out = [];
      [1, 2, 3].forEach((f, k) => jobs.forEach((j, i) => out.push({ job: j, form: ((f + i + k) % 3) + 1 })));
      return out.map(c => ({ ...c, id: c.job + '_' + c.form, name: COMP_NAMES[c.job][c.form - 1] }));
    }
    const compById = (hero, id) => compOrder(hero).find(c => c.id === id);
    const partyOf = (p) => p.comps.slice(-3).map(id => compById(p.hero, id)).filter(Boolean);
    const COMP_LINES = {
      memo: 'くりあがりを メモ しよう！ わすれないでね。',
      mulhi: 'のこりの かずを ひだりに かこう！',
      zero: '2だんめの ✕の マス、なにを かくか おぼえてる？',
      add: 'さいごは たし算だよ。1だんめと 2だんめを たそう！',
    };
    const placeLabel = (pl) => `${pl.lv} ${pl.name}`;
    const BATTLE_NAMES = ['ざこ ①', 'ざこ ②', 'ぬし'];

    // =====================================================================
    //  6. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const LOG_HEADER = ['日時', 'なまえ', 'ばしょ', 'たたかい', 'もんだい', 'こたえ', 'けっか', 'まちがい', 'ヒント', 'まちがいの しゅるい', 'まちがえて いれた かず', 'びょう', 'ID'];
    const DEFAULT_SETTINGS = { rate: 0.8, font: 1, count: 5, count2: 3, kakashi: 10, hint: true, yomi: true, sound: true };

    // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
    const emptyStu = () => ({ count: 0, ok: 0, miss: 0, hint: 0, last: '', places: {}, kinds: {}, wrongs: [] });
    function aggregate(rows) {
      const students = {}, classKinds = {}, classPlaces = {};
      rows.forEach(r => {
        const name = String(r[1] || '').trim(); if (!name) return;
        const pl = String(r[2]), ok = r[6] === '○' ? 1 : 0, miss = Number(r[7]) || 0, hint = Number(r[8]) || 0;
        const s = students[name] || (students[name] = emptyStu());
        const day = String(r[0]).slice(0, 10);
        if (day > s.last) s.last = day;
        s.count++; s.ok += ok; s.miss += miss; s.hint += hint ? 1 : 0;
        const g = s.places[pl] || (s.places[pl] = [0, 0, 0]); g[0]++; g[1] += ok; g[2] += miss;
        const c = classPlaces[pl] || (classPlaces[pl] = [0, 0, 0]); c[0]++; c[1] += ok; c[2] += miss;
        String(r[9] || '').split('・').forEach(k => { if (k) { s.kinds[k] = (s.kinds[k] || 0) + 1; classKinds[k] = (classKinds[k] || 0) + 1; } });
        if (miss > 0) { s.wrongs.push([String(r[0]).slice(0, 16), pl, String(r[3]), String(r[4]), String(r[10] || ''), String(r[9] || '')]); if (s.wrongs.length > 15) s.wrongs.shift(); }
      });
      return { students, classKinds, classPlaces };
    }

    const Local = {
      key: 'kakezan_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}
        this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: { ...DEFAULT_SETTINGS } };
        return this.mem;
      },
      save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
    };

    const PENDING_KEY = 'kakezan_pending_v1';
    const COPY_KEY = (name) => 'kakezan_copy_' + name;
    const recRow = (stamp, name, r) => [stamp, name, r.place, r.battle, r.prob, r.ans, r.result, r.miss, r.hint, r.kinds, r.inputs, r.secs, r.id];
    const api = {
      async init() {
        if (HAS_GAS) return gas('getInitData');
        const d = Local.data();
        return { students: d.roster, settings: { ...DEFAULT_SETTINGS, ...d.settings }, demo: true };
      },
      async student(name) {
        if (HAS_GAS) return gas('getStudent', name);
        return Local.data().progress[name] || '';
      },
      async sendOne(p) {
        if (HAS_GAS) return gas('saveResult', p);
        const d = Local.data();
        const old = parseProgress(d.progress[p.name]);
        const neu = parseProgress(p.progress);
        if (neu.t >= old.t) {
          if ((old.flagT || 0) > (neu.t || 0)) { neu.unlockAll = !!old.unlockAll; neu.hatten = !!old.hatten; neu.range = old.range; neu.hero = old.hero; neu.flagT = old.flagT; }
          d.progress[p.name] = JSON.stringify(neu);
        }
        const ids = new Set(d.log.map(r => r[12]));
        p.records.forEach(r => { if (!ids.has(r.id)) d.log.push(recRow(p.stamp, p.name, r)); });
        Local.save();
        return { ok: true };
      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす
      readQueue() { try { return JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) { return []; } },
      async save(payload) {
        const queue = api.readQueue().filter(q => !(q.name === payload.name && !q.records.length));
        queue.push({ ...payload, qid: uid() });
        safeStore.set(PENDING_KEY, JSON.stringify(queue));
        return api.flush();
      },
      pending() { return api.readQueue().length; },
      flushing: false,
      async flush() {
        if (api.flushing) return;
        api.flushing = true;
        try {
          for (let q = api.readQueue()[0]; q; q = api.readQueue()[0]) {
            await api.sendOne(q);
            safeStore.set(PENDING_KEY, JSON.stringify(api.readQueue().filter(x => x.qid !== q.qid)));
          }
        } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
        finally { api.flushing = false; }
      },
      async teacher(pin) {
        if (HAS_GAS) return gas('getTeacherData', pin);
        const d = Local.data();
        if (String(pin) !== String(d.pin)) return { ok: false };
        const agg = aggregate(d.log);
        return {
          ok: true, isDefaultPin: d.pin === '1234', demo: true, settings: { ...DEFAULT_SETTINGS, ...d.settings },
          students: d.roster.map(n => ({ ...emptyStu(), ...(agg.students[n] || {}), name: n, progress: d.progress[n] || '' })),
          classKinds: agg.classKinds, classPlaces: agg.classPlaces,
        };
      },
      async setFlag(pin, name, key, val) {
        if (HAS_GAS) return gas('setFlag', pin, name, key, val);
        const d = Local.data(); const p = parseProgress(d.progress[name]);
        if (key === 'range') p.range = val === '' || val == null ? null : Number(val);
        else if (key === 'remake') p.hero = null;
        else p[key] = !!val;
        p.t = Date.now(); p.flagT = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async addGold(pin, name, delta) {
        if (HAS_GAS) return gas('addGold', pin, name, delta);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p.gold = Math.max(0, (p.gold || 0) + delta); p.t = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async saveSettings(pin, s) {
        if (HAS_GAS) return gas('saveSettings', pin, s);
        const d = Local.data(); const { newPin, ...rest } = s;
        d.settings = { ...d.settings, ...rest }; if (newPin) d.pin = newPin; Local.save(); return { ok: true };
      },
      async logRows(pin) {
        if (HAS_GAS) return gas('getLogRows', pin);
        return { ok: true, rows: [LOG_HEADER, ...Local.data().log] };
      },
      async backup(pin) {
        if (HAS_GAS) return gas('getBackup', pin);
        const d = Local.data(); return { ok: true, data: { app: 'kakezan', roster: d.roster.map(n => [n, d.progress[n] || '']), settings: d.settings } };
      },
      async restore(pin, data) {
        if (HAS_GAS) return gas('restoreBackup', pin, data);
        const d = Local.data(); (data.roster || []).forEach(([n, p]) => { if (!d.roster.includes(n)) d.roster.push(n); d.progress[n] = p; }); Local.save(); return { ok: true };
      },
      async clear(pin, name) {
        if (HAS_GAS) return gas('clearRecords', pin, name);
        const d = Local.data();
        d.log = d.log.filter(r => name && r[1] !== name);
        (name ? [name] : d.roster).forEach(n => { delete d.progress[n]; safeStore.del(COPY_KEY(n)); });
        Local.save(); return { ok: true };
      },
    };

    // =====================================================================
    //  7. 人物・モンスター・ばしょの 絵（ChatGPT の 絵が ある ときは その 絵を つかう）
    // =====================================================================
    function useImgVer() {
      const [v, setV] = useState(Img.ver);
      useEffect(() => { Img.subs.add(setV); return () => Img.subs.delete(setV); }, []);
      return v;
    }
    // 絵が あれば <img>、なければ fallback
    function Pic({ name, fallback, className = '', style = {}, alt = '' }) {
      const u = Img.url(name);
      if (u) return <img src={u} alt={alt} draggable="false" className={className} style={{ objectFit: 'contain', ...style }} />;
      return fallback || null;
    }

    // しゅじんこう・なかま（自作の SVG）
    function HeroSVG({ job, form, size = 100 }) {

          {job === 'shonin' && <g><rect x="32" y="60" width="36" height="34" rx="8" fill="#fde68a" /><path d="M32 66 q0 -6 8 -6 h4 v34 h-12 z M68 66 q0 -6 -8 -6 h-4 v34 h12 z" fill={c} /><rect x="32" y="84" width="36" height="5" fill="#7c2d12" /><circle cx="76" cy="88" r="10" fill="#a16207" /><path d="M70 80 q6 -6 12 0" stroke="#713f12" strokeWidth="3" fill="none" /></g>}
          {job === 'soryo' && <g><path d="M35 60 h30 l7 46 h-44 z" fill="#f8fafc" stroke="#d97706" strokeWidth="2" /><rect x="47" y="60" width="6" height="46" fill={c} /><circle cx="50" cy="72" r="4" fill="#fde047" stroke={c} /></g>}

          {job === 'yusha' && <g><rect x="72" y="40" width="5" height="34" rx="2" fill="#cbd5e1" transform="rotate(20 74 72)" /><rect x="66" y="68" width="16" height="4" rx="2" fill="#a16207" transform="rotate(20 74 70)" /></g>}
          {job === 'mahou' && <g><rect x="21" y="40" width="4" height="60" rx="2" fill="#92400e" /><path d="M23 30 l3 7 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 z" fill="#facc15" /></g>}
          {job === 'shonin' && <g><rect x="16" y="66" width="16" height="12" rx="2" fill="#78350f" /><circle cx="20" cy="70" r="1.6" fill="#fde68a" /><circle cx="24" cy="74" r="1.6" fill="#fde68a" /><circle cx="28" cy="70" r="1.6" fill="#fde68a" /></g>}
          {job === 'soryo' && <g><rect x="21" y="44" width="4" height="56" rx="2" fill="#b45309" /><circle cx="23" cy="40" r="7" fill="none" stroke="#facc15" strokeWidth="3" /><circle cx="23" cy="40" r="2.5" fill="#fde047" /></g>}
          {F.hair === 'long' && <path d="M25 40 q0 -26 25 -26 q25 0 25 26 v32 h-10 v-22 h-30 v22 h-10 z" fill={hc} />}

    function LoginScreen({ students, onSelect, onTeacher, demo }) {

    // おはなし（はじまり・おわり）
    function StoryScreen({ pages, onDone, doneLabel = 'つぎへ' }) {

    // キャラクターづくり（しょくぎょう → すがた → なまえ）
    function CreateHero({ name, onDone }) {
      const talk = useTalk();
      const [step, setStep] = useState(0);
      const [ji, setJi] = useState(0);
      const [form, setForm] = useState(1);
      const J = JOBS[ji];
      useEffect(() => {

                className="btn3d rounded-2xl border-4 border-amber-600 bg-amber-300 px-8 py-3 text-2xl font-bold">{step < 2 ? 'これに する ▶' : 'はい！ ぼうけんに でる'}</button>

    // =====================================================================

    function TopBar({ name, p, bump, onTown, onLogout, onTeacher, soundOn, onSound }) {

    // =====================================================================
    // 11. はじまりの まち（うえから みた まち）

    function Bldg({ x, y, w, h, roof, label, emoji, onClick, lit, locked, wall = '#efe4c8', sign = true }) {
      const rh = h * 0.62;
      const sw = 56 + label.replace(/ /g, '').length * 18; // かんばんの はば
      return (
        <g className="bldg" onClick={onClick}>
          <rect x={x + 4} y={y + 6} width={w} height={h} fill="rgba(0,0,0,.18)" rx="4" />

          <line x1={x + 6} y1={y + rh / 2} x2={x + w - 6} y2={y + rh / 2} stroke="rgba(0,0,0,.28)" strokeWidth="4" />
          {Array.from({ length: Math.floor(w / 16) }).map((_, i) => <line key={i} x1={x + 8 + i * 16} y1={y + 4} x2={x + 8 + i * 16} y2={y + rh - 4} stroke="rgba(255,255,255,.12)" strokeWidth="2" />)}
          <rect x={x} y={y + rh} width={w} height={h - rh} fill={wall} stroke="rgba(0,0,0,.25)" strokeWidth="2" />
          <rect x={x + w / 2 - 9} y={y + h - 22} width="18" height="22" fill="#7c4a1e" rx="2" />

          <rect x={x + w - 24} y={y + rh + 6} width="14" height="12" fill={lit ? '#fde047' : '#94a3b8'} />
          {sign && <g>
            <rect x={x + w / 2 - sw / 2} y={y - 34} width={sw} height="30" rx="10" fill={locked ? '#cbd5e1' : '#fffbeb'} stroke="#78350f" strokeWidth="3" />
            <text x={x + w / 2} y={y - 13} textAnchor="middle" fontSize="18" fontWeight="bold" fill="#3f2a14">{locked ? '🔒 ' : emoji + ' '}{label}</text>
          </g>}

    }
    function Tree({ x, y, r = 22 }) {
      return <g><circle cx={x + 3} cy={y + 4} r={r} fill="rgba(0,0,0,.18)" /><circle cx={x} cy={y} r={r} fill="#2f7d32" /><circle cx={x - r * .25} cy={y - r * .25} r={r * .6} fill="#43a047" /></g>;
    }
    const TOWN_TREES = (() => {
      const t = [];
      for (let x = 20; x <= 940; x += 44) { t.push([x, 22]); if (x < 410 || x > 550) t.push([x, 582]); }
      for (let y = 66; y <= 540; y += 44) { t.push([20, y]); t.push([940, y]); }
      [[300, 250], [640, 250], [760, 330]].forEach(p => t.push(p));
      return t;
    })();
    // まちの 絵の うえで 押す ところ：[TOWN_SPOTS の なまえ, いく ところ, かんばん, 絵文字]
    const TOWN_PLACES = [['castle', 'castle', 'おしろ', '🏰'], ['guild', 'guild', 'ギルド', '📜'], ['buki', 'shop:buki', 'ぶきや', '⚔️'], ['bougu', 'shop:bougu', 'ぼうぐや', '🛡️'],
      ['dougu', 'shop:dougu', 'どうぐや', '🧪'], ['inn', 'inn', 'やどや', '🛏️'], ['house', 'house', 'じぶんの いえ', '🏠'], ['shugyo', 'shugyo', 'しゅぎょうの ば', '🥋'], ['gate', 'map', 'もん（そとへ）', '🚪']];
    const shopOpen = (p, s) => !s.open || !!p.unlockAll || placeCleared(p, PLACE[s.open]);

    function Town({ p, onGo, onContinue }) {
      const talk = useTalk();
      const g = gemsOf(p);
      const party = partyOf(p);
      useEffect(() => {
        if (!p.day || p.day.d !== today()) talk.say(`よく きたな。きょうも ひっ算の ぼうけんに でかけよう。そとへ でるには、したの もんを とおるのじゃ。`, { who: 'kakeru' });
        else talk.say('まちの たてものを おすと、なかに はいれるよ。', { who: 'kakeru' });
      }, []);
      const go = (where) => { Sound.tap(); onGo(where); };
      const sat = 0.35 + 0.65 * g / 9;
      const S = Object.fromEntries(SHOPS.map(s => [s.id, s]));
      const part = p.part && PLACE[p.part.place] ? p.part : null;
      const light = { filter: `saturate(${sat}) brightness(${0.86 + 0.14 * g / 9})` };
      const townImg = Img.url('town');

              const [fx, fy, fr] = T.fountain, a = (i / 9) * Math.PI * 2 - Math.PI / 2, x = fx + Math.cos(a) * fr, y = fy + Math.sin(a) * fr, on = placeCleared(p, pl);
              return <path key={pl.id} d={`M${x} ${y - 9} l7 9 l-7 9 l-7 -9 z`} fill={on ? pl.gemColor : '#9ca3af'} stroke="#fff" strokeWidth="2" className={on ? 'twinkle' : ''} />;

      const heroAt = townImg ? [T.hero[0] / TW * 100, T.hero[1] / TH * 100] : [446 / 9.6, 392 / 6.4];

      return (

              <defs><pattern id="grass" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#79c05a" /><rect x="4" y="6" width="3" height="3" fill="#6aae4c" /><rect x="15" y="16" width="3" height="3" fill="#8bd06a" /></pattern></defs>
              <rect y="-20" width="960" height="640" fill="url(#grass)" />
              {/* みち */}
              <rect x="450" y="190" width="60" height="410" fill="#cdbb8b" />
              <rect x="110" y="305" width="740" height="50" fill="#cdbb8b" />
              <circle cx="480" cy="330" r="78" fill="#d8c79a" stroke="#b8a473" strokeWidth="4" />
              {TOWN_TREES.map(([x, y], i) => <Tree key={i} x={x} y={y} />)}
              {/* おしろ */}
              <g className="bldg" onClick={() => go('castle')}>
                <rect x="300" y="38" width="360" height="160" fill="#4fa3e0" rx="10" />
                <rect x="322" y="52" width="316" height="128" fill="#d9cba3" stroke="#9c8a5f" strokeWidth="4" />
                <rect x="380" y="64" width="200" height="100" fill="#8ea8c8" stroke="#5b7392" strokeWidth="4" />
                <line x1="388" y1="114" x2="572" y2="114" stroke="#5b7392" strokeWidth="5" />
                {[[340, 70], [620, 70], [340, 162], [620, 162]].map(([cx, cy], i) => <g key={i}><circle cx={cx} cy={cy} r="20" fill="#bcae86" stroke="#8b7b52" strokeWidth="3" /><circle cx={cx} cy={cy} r="10" fill="#5b7392" /></g>)}
                <rect x="458" y="180" width="44" height="22" fill="#8b5a2b" />
                <rect x="410" y="12" width="140" height="30" rx="10" fill="#fffbeb" stroke="#78350f" strokeWidth="3" />
                <text x="480" y="33" textAnchor="middle" fontSize="18" fontWeight="bold" fill="#3f2a14">🏰 おしろ</text>
              </g>
              {/* ふんすいと ほうせき */}
              <circle cx="480" cy="330" r="40" fill="#a8a29e" stroke="#78716c" strokeWidth="4" />
              <circle cx="480" cy="330" r="30" fill="#60a5fa" />
              <circle cx="480" cy="330" r="8" fill="#e0f2fe" className="twinkle" />
              {mainPlaces().map((pl, i) => {
                const a = (i / 9) * Math.PI * 2 - Math.PI / 2, x = 480 + Math.cos(a) * 58, y = 330 + Math.sin(a) * 58, on = placeCleared(p, pl);
                return <path key={pl.id} d={`M${x} ${y - 9} l7 9 l-7 9 l-7 -9 z`} fill={on ? pl.gemColor : '#9ca3af'} stroke="#fff" strokeWidth="2" className={on ? 'twinkle' : ''} />;
              })}
              {/* たてもの */}
              <Bldg x={120} y={130} w={150} h={100} roof="#b45309" label="ギルド" emoji="📜" lit={g > 0} onClick={() => go('guild')} />
              <Bldg x={660} y={110} w={130} h={90} roof="#64748b" label="ぶきや" emoji="⚔️" lit={g > 1} onClick={() => go('shop:buki')} />
              <Bldg x={806} y={200} w={120} h={86} roof="#0f766e" label="ぼうぐや" emoji="🛡️" lit={g > 2} locked={!shopOpen(p, S.bougu)} onClick={() => go('shop:bougu')} />
              <Bldg x={680} y={400} w={130} h={86} roof="#7e22ce" label="どうぐや" emoji="🧪" lit={g > 3} locked={!shopOpen(p, S.dougu)} onClick={() => go('shop:dougu')} />
              <Bldg x={790} y={500} w={130} h={78} roof="#be123c" label="やどや" emoji="🛏️" lit={g > 4} onClick={() => go('inn')} />
              {/* しゅぎょうの ば */}
              <g className="bldg" onClick={() => go('shugyo')}>
                <rect x="96" y="384" width="220" height="110" fill="#d6b98c" stroke="#8b6b3e" strokeWidth="4" strokeDasharray="10 6" rx="6" />
                <text x="140" y="450" fontSize="40">🎯</text><text x="196" y="460" fontSize="40">🪨</text><text x="250" y="448" fontSize="40">🌾</text>
                <rect x="117" y="350" width="180" height="30" rx="10" fill="#fffbeb" stroke="#78350f" strokeWidth="3" />
                <text x="207" y="371" textAnchor="middle" fontSize="17" fontWeight="bold" fill="#3f2a14">🥋 しゅぎょうの ば</text>
              </g>
              {/* じぶんの いえ */}
              <ellipse cx="410" cy="500" rx="86" ry="62" fill="none" stroke="#fff" strokeWidth="5" />
              <Bldg x={350} y={470} w={120} h={70} roof="#dc2626" label="じぶんの いえ" emoji="🏠" lit onClick={() => go('house')} />
              {/* もん */}
              <g className="bldg" onClick={() => go('map')}>
                <rect x="428" y="560" width="22" height="40" fill="#8b7b52" /><rect x="510" y="560" width="22" height="40" fill="#8b7b52" />
                <rect x="420" y="552" width="120" height="14" fill="#a16207" />
                <rect x="545" y="548" width="150" height="30" rx="10" fill="#fef3c7" stroke="#b45309" strokeWidth="3" />
                <text x="620" y="569" textAnchor="middle" fontSize="17" fontWeight="bold" fill="#7c2d12">🚪 もん（そとへ）</text>
              </g>
              {/* まちの ひと */}
              <text x="560" y="300" fontSize="30">{g >= 3 ? '🧑‍🌾' : '😟'}</text>
              <text x="380" y="300" fontSize="30">{g >= 6 ? '👵' : '😟'}</text>
              <text x="600" y="380" fontSize="26">{g >= 1 ? '🐕' : ''}</text>
              {g >= 9 && <text x="455" y="270" fontSize="34" className="twinkle">🎉</text>}
            </svg>}
            <div className="absolute flex items-end pointer-events-none" style={{ left: `${heroAt[0]}%`, top: `${heroAt[1]}%`, transform: 'translate(-50%,-50%)' }}>
              {p.hero && <div className="bob"><HeroPic job={p.hero.job} form={p.hero.form} size={44} /></div>}

              ['house', '🏠 いえ', 'bg-rose-100 border-rose-500'], ['shop:buki', '⚔️ ぶきや', 'bg-slate-100 border-slate-500'], ['shop:bougu', '🛡️ ぼうぐや', 'bg-teal-100 border-teal-600'],
              ['shop:dougu', '🧪 どうぐや', 'bg-purple-100 border-purple-500'], ['inn', '🛏️ やどや', 'bg-pink-100 border-pink-500'], ['castle', '🏰 おしろ', 'bg-sky-100 border-sky-500']].map(([k, t, c]) =>

    }

    // =====================================================================
    // 12. ワールドマップ
    // =====================================================================
    const MAP_POS = { p9: [120, 130], town: [150, 470], p0: [300, 530], p1: [420, 420], p2: [580, 500], p3: [650, 360], p4: [830, 470], p5: [890, 290], p6: [740, 170], p7: [560, 220], p8: [380, 120] };
    const CHAIN = ['p9', 'town', 'p0', 'p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8'];
    // ちずの ざひょう：ChatGPT の 絵が ある ときは data.js の MAP_SPOTS（MAP_SIZE の わく）、ない ときは 自作の ちず（よこ 1000・たて -23〜644）
    const mapImgOn = () => Img.has('worldmap');
    const mapPos = (id) => mapImgOn() ? D.MAP_SPOTS[id] : MAP_POS[id];
    // id から id へ あるく ときの とちゅうの まがりかど
    function mapVia(a, b) {
      if (!mapImgOn()) return [];
      const v = D.MAP_VIA || {};
      if (v[a + '>' + b]) return v[a + '>' + b];
      if (v[b + '>' + a]) return [...v[b + '>' + a]].reverse();
      return [];
    }
    function WorldMap({ p, onEnter, onTown, onMoved }) {
      const talk = useTalk();
      const imgMap = Img.url('worldmap');
      const yOff = imgMap ? 0 : 23;
      const [MW, MH] = imgMap ? (D.MAP_SIZE || [1000, 667]) : [1000, 667];
      const aspect = MW / MH;
      const [pos, setPos] = useState(mapPos(p.mapAt in MAP_POS ? p.mapAt : 'town'));
      const [moving, setMoving] = useState(false);
      const party = partyOf(p);
      useEffect(() => { talk.say('いきたい ばしょを おしてね。なかまと いっしょに あるいて いくよ。', { who: 'kakeru' }); }, []);
      // ちずの 絵が あとから とどいたら、なかまの いちを 絵に あわせる
      useEffect(() => { if (!moving) setPos(mapPos(p.mapAt in MAP_POS ? p.mapAt : 'town')); }, [!!imgMap]);
      const walkTo = (target) => {
        if (moving) return;
        const from = CHAIN.indexOf(p.mapAt in MAP_POS ? p.mapAt : 'town'), to = CHAIN.indexOf(target);
        const route = [];
        if (from === to) route.push(mapPos(target));
        else for (let i = from; ; i += Math.sign(to - from)) {
          if (i !== from) route.push(...mapVia(CHAIN[i - Math.sign(to - from)], CHAIN[i]));
          route.push(mapPos(CHAIN[i])); if (i === to) break;
        }
        const done = () => { setMoving(false); onMoved(target); if (target === 'town') onTown(); else onEnter(PLACE[target]); };
        if (route.length < 2) { done(); return; }
        setMoving(true);
        const segs = route.slice(1).map((q, i) => ({ a: route[i], b: q, len: Math.hypot(q[0] - route[i][0], q[1] - route[i][1]) }));
        const total = segs.reduce((s, x) => s + x.len, 0), dur = Math.min(4200, Math.max(700, total * 3.2));
        const t0 = performance.now(); let lastStep = 0;
        const tick = (now) => {
          const k = Math.min(1, (now - t0) / dur); let d = k * total;
          for (const s of segs) { if (d <= s.len || s === segs[segs.length - 1]) { const r = s.len ? Math.min(1, d / s.len) : 1; setPos([s.a[0] + (s.b[0] - s.a[0]) * r, s.a[1] + (s.b[1] - s.a[1]) * r]); break; } d -= s.len; }
          if (now - lastStep > 260) { Sound.walk(); lastStep = now; }
          if (k < 1) requestAnimationFrame(tick); else setTimeout(done, 250);
        };
        requestAnimationFrame(tick);
      };
      const tap = (id) => {
        if (id !== 'town' && !placeOpen(p, PLACE[id])) {
          Sound.retry();
          talk.say(PLACE[id].hatten ? 'そらの しまは、せんせいが ひらいて くれると いけるよ。' : 'まえの ばしょの ぬしを たおすと いけるよ。', { who: 'kakeru' });
          return;
        }
        Sound.tap(); walkTo(id);
      };
      const road = CHAIN.slice(1).map(id => MAP_POS[id].join(',')).join(' ');
      const R = (id, el) => { const [x, y] = MAP_POS[id]; return <g transform={`translate(${x} ${y})`}>{el}</g>; };
      return (
        <div className="flex-1 flex flex-col items-center gap-2 p-2" style={{ background: '#1d4f91' }}>
          <div className="w-full relative" style={{ aspectRatio: `${aspect}`, maxWidth: `min(64rem, calc((100vh - 190px) * ${aspect}))` }}>
            {imgMap ? <>
              <img src={imgMap} alt="" draggable="false" className="absolute inset-0 w-full h-full rounded-2xl" style={{ objectFit: 'cover' }} />
              <svg viewBox={`0 0 ${MW} ${MH}`} className="absolute inset-0 w-full h-full">
                {CHAIN.map(id => {
                  const [x, y] = D.MAP_SPOTS[id];
                  const pl = PLACE[id], open = id === 'town' || placeOpen(p, pl), done = pl && placeCleared(p, pl);
                  return (
                    <g key={id} transform={`translate(${x} ${y}) scale(${MW / 1000})`} className="bldg" onClick={() => tap(id)}>
                      <circle r="34" fill={open ? '#fff' : '#334155'} fillOpacity={open ? 0.12 : 0.45} stroke={done ? '#f59e0b' : open ? '#fff' : '#94a3b8'} strokeWidth={done ? 6 : 4} strokeDasharray={open ? 'none' : '8 6'} />
                      {!open && <text y="11" textAnchor="middle" fontSize="28">🔒</text>}
                      {done && <path d="M24 -38 l8 10 l-8 10 l-8 -10 z" fill={pl.gemColor} stroke="#fff" strokeWidth="2" />}
                      <rect x="-76" y="36" width="152" height={pl ? 40 : 26} rx="9" fill={open ? '#fffbeb' : '#e2e8f0'} fillOpacity=".93" stroke="#78350f" strokeWidth="2.5" />
                      {pl ? <><text y="52" textAnchor="middle" fontSize="12" fontWeight="bold" fill="#92400e">{pl.lv}</text>
                        <text y="70" textAnchor="middle" fontSize="15" fontWeight="bold" fill="#3f2a14">{pl.name}</text></>
                        : <text y="54" textAnchor="middle" fontSize="15" fontWeight="bold" fill="#3f2a14">はじまりの まち</text>}
                    </g>
                  );
                })}
              </svg>
            </> :
            <svg viewBox="0 -23 1000 667" className="absolute inset-0 w-full h-full rounded-2xl" style={{ background: '#3b82c4' }}>
              <path d="M60 300 q-20 -180 160 -220 q200 -40 420 -10 q300 20 330 180 q30 160 -20 280 q-60 90 -400 70 q-300 20 -420 -40 q-90 -60 -70 -260 z" fill="#7cc36a" stroke="#e7d9a8" strokeWidth="10" />
              {R('p0', <g><ellipse rx="90" ry="50" fill="#a3e635" opacity=".6" /><text x="-70" y="-18" fontSize="22">🌼</text><text x="50" y="30" fontSize="22">🌿</text></g>)}
              {R('p1', <g>{[[-70, -30], [-40, 30], [60, -30], [70, 20], [-80, 20], [20, -55]].map(([x, y], i) => <Tree key={i} x={x} y={y} r={20} />)}</g>)}
              {R('p2', <ellipse cx="10" cy="10" rx="90" ry="50" fill="#38bdf8" stroke="#bae6fd" strokeWidth="5" />)}
              {R('p3', <g><path d="M-90 40 l50 -90 l40 60 l40 -80 l60 110 z" fill="#a8a29e" stroke="#78716c" strokeWidth="4" /></g>)}
              {R('p4', <ellipse rx="95" ry="58" fill="#fcd34d" opacity=".85" />)}
              {R('p5', <g><ellipse rx="85" ry="60" fill="#e0f2fe" /><text x="-60" y="-20" fontSize="24">❄️</text><text x="40" y="40" fontSize="24">❄️</text></g>)}
              {R('p6', <g><path d="M-80 50 l80 -120 l80 120 z" fill="#b91c1c" /><path d="M-18 -42 l18 -28 l18 28 z" fill="#f97316" /></g>)}
              {R('p7', <ellipse rx="95" ry="55" fill="#6d28d9" opacity=".7" />)}
              {R('p8', <g><ellipse rx="100" ry="58" fill="#334155" /><text x="-60" y="-10" fontSize="22">⚡</text></g>)}
              <polyline points={road} fill="none" stroke="#e7d9a8" strokeWidth="16" strokeLinejoin="round" strokeLinecap="round" />
              <polyline points={road} fill="none" stroke="#b08d57" strokeWidth="4" strokeDasharray="10 10" />
              <line x1={MAP_POS.town[0]} y1={MAP_POS.town[1]} x2={MAP_POS.p9[0]} y2={MAP_POS.p9[1]} stroke="#fff" strokeWidth="5" strokeDasharray="6 12" opacity={p.hatten ? .9 : .3} />
              {R('p9', <g opacity={p.hatten ? 1 : .45}><ellipse rx="80" ry="34" fill="#f8fafc" /><ellipse cx="-40" cy="-14" rx="40" ry="24" fill="#fff" /><ellipse cx="40" cy="-10" rx="44" ry="26" fill="#fff" /></g>)}
              {CHAIN.map(id => {
                const [x, y] = MAP_POS[id];
                if (id === 'town') return <g key={id} transform={`translate(${x} ${y})`} className="bldg" onClick={() => tap('town')}>
                  <circle r="40" fill="#fef3c7" stroke="#b45309" strokeWidth="5" /><text y="14" textAnchor="middle" fontSize="38">🏘️</text>
                  <rect x="-58" y="44" width="116" height="28" rx="10" fill="#fffbeb" stroke="#78350f" strokeWidth="3" /><text y="64" textAnchor="middle" fontSize="17" fontWeight="bold" fill="#3f2a14">はじまりの まち</text></g>;
                const pl = PLACE[id], open = placeOpen(p, pl), done = placeCleared(p, pl);
                return (
                  <g key={id} transform={`translate(${x} ${y})`} className="bldg" onClick={() => tap(id)}>
                    <circle r="36" fill={open ? '#fff' : '#cbd5e1'} stroke={done ? '#f59e0b' : open ? '#1e3a8a' : '#64748b'} strokeWidth={done ? 8 : 5} />
                    <text y="13" textAnchor="middle" fontSize="36" opacity={open ? 1 : .5}>{pl.icon}</text>
                    {!open && <text x="20" y="-14" fontSize="24">🔒</text>}
                    {done && <path d="M24 -40 l8 10 l-8 10 l-8 -10 z" fill={pl.gemColor} stroke="#fff" strokeWidth="2" />}
                    <rect x="-80" y="40" width="160" height="44" rx="10" fill={open ? '#fffbeb' : '#e2e8f0'} stroke="#78350f" strokeWidth="3" />
                    <text y="58" textAnchor="middle" fontSize="14" fontWeight="bold" fill="#92400e">{pl.lv}</text>
                    <text y="77" textAnchor="middle" fontSize="16" fontWeight="bold" fill="#3f2a14">{pl.name}</text>
                  </g>
                );
              })}
            </svg>}
            <div className="absolute flex items-end pointer-events-none" style={{ left: `${pos[0] / MW * 100}%`, top: `${(pos[1] + yOff) / MH * 100}%`, transform: 'translate(-50%, -95%)' }}>
              {p.hero && <div className={moving ? 'bob' : ''}><HeroPic job={p.hero.job} form={p.hero.form} size={46} /></div>}
              {party.map(c => <div key={c.id} className={`-ml-4 ${moving ? 'bob' : ''}`}><HeroPic job={c.job} form={c.form} size={38} /></div>)}
            </div>
          </div>
          <MessageWindow className="w-full max-w-5xl" small />
        </div>
      );
    }

    // =====================================================================
    // 13. ばしょ（たたかいを えらぶ）
    // =====================================================================
    function PlaceScreen({ p, pl, onBattle, onMap, onDemo }) {
      const talk = useTalk();
      useEffect(() => { talk.say(`${pl.name}。${pl.intro}`, { who: 'kakeru' }); }, [pl.id]);
      const mons = MONSTERS.filter(m => m.place === pl.id);
      const part = p.part && p.part.place === pl.id ? p.part : null;
      return (
        <PlaceBg pl={pl} className="flex-1" style={{ minHeight: 'calc(100vh - 64px)' }}>
          <div className="flex flex-col items-center gap-3 p-3">
            <div className="rpgwin px-6 py-2 text-center"><div className="text-amber-300 font-bold">{pl.lv}　{pl.sub}</div><div className="text-3xl font-bold">{pl.icon} {pl.name}</div></div>
            <div className="flex flex-wrap justify-center gap-3">
              {mons.map((m, bi) => {
                const open = battleOpen(p, pl, bi), n = beatenN(p, pl, bi), resume = part && part.bi === bi;

    // =====================================================================
    // 15. ひっ算の ばん（マス・すうじボタン・ヒント）
    // =====================================================================
    const keyOf = (s) => (s.memo ? s.row + 'm' : s.row) + ':' + s.place;
    const ROW_NAME = { ans: '', p1: '1だんめ ', p2: '2だんめ ', sum: 'たし算 ' };

    function Board({ h, vals, cur, ops = [], ghost, S = 62 }) {
      const W = h.width;
      const cols = W + 1;
      const targets = new Set(h.steps.map(keyOf));
      const rows = [{ t: 'a' }, { t: 'b' }, { t: 'line' }];
      if (!h.two) rows.push({ t: 'memo', r: 'ans' }, { t: 'res', r: 'ans' });
      else rows.push({ t: 'memo', r: 'p1' }, { t: 'res', r: 'p1' }, { t: 'memo', r: 'p2' }, { t: 'res', r: 'p2' }, { t: 'line' }, { t: 'memo', r: 'sum' }, { t: 'res', r: 'sum' });
      const curKey = cur ? keyOf(cur) : null;
      const RES_BG = { ans: '#fef9c3', p1: '#fef9c3', p2: '#dcfce7', sum: '#ffffff' };
      const cell = (content, style, cls = '') => <div className={`flex items-center justify-center font-bold ${cls}`} style={{ width: S, ...style }}>{content}</div>;
      return (
        <div className="inline-flex flex-col bg-white rounded-2xl p-3 shadow-inner border-4 border-slate-300">
          {rows.map((row, ri) => {
            if (row.t === 'line') return <div key={ri} style={{ height: 5, background: '#1e293b', margin: '4px 0', width: S * cols }} />;
            const out = [];
            for (let c = 0; c < cols; c++) {
              const pl = W - c; // c=0 は きごうの れつ
              if (row.t === 'a' || row.t === 'b') {
                const D2 = row.t === 'a' ? h.A : h.B;
                if (c === 0) { out.push(cell(row.t === 'b' ? '×' : '', { height: S, fontSize: S * 0.6 }, 'text-slate-700')); continue; }
                const d = D2[pl];
                const k = `${row.t}:${pl}`;
                const bg = row.t === 'b' && d !== undefined ? (pl === 0 ? '#fde047' : '#4ade80') : 'transparent';
                out.push(cell(d !== undefined ? d : '', { height: S, fontSize: S * 0.62, background: bg, borderRadius: 8 }, `text-slate-800 ${ops.includes(k) ? 'opglow' : ''}`));
                continue;
              }
              if (c === 0) { out.push(<div key={c} style={{ width: S }} />); continue; }
              if (row.t === 'memo') {
                const k = `${row.r}m:${pl}`;
                if (!targets.has(k)) { out.push(<div key={c} style={{ width: S, height: S * 0.46 }} />); continue; }
                const v = vals[k], isCur = curKey === k;
                // メモの わくは、メモを かく ときに はじめて だす（くりあがりが あるか を さきに みせない）
                if (v === undefined && !isCur) { out.push(<div key={c} style={{ width: S, height: S * 0.46 }} />); continue; }
                out.push(<div key={c} style={{ width: S, height: S * 0.46 }} className="flex items-center justify-center">
                  <div className={`flex items-center justify-center rounded-md font-bold ${isCur ? 'cellglow bg-amber-50' : ''} ${ops.includes(k) ? 'opglow' : ''}`}
                    style={{ width: S * 0.52, height: S * 0.42, border: '2px dashed #fda4af', color: '#e11d48', fontSize: S * 0.34 }}>
                    {v !== undefined ? v : isCur && ghost ? <span className="ghost">{ghost}</span> : ''}</div></div>);
                continue;
              }
              const k = `${row.r}:${pl}`;
              if (!targets.has(k)) { out.push(<div key={c} style={{ width: S, height: S }} />); continue; }
              const v = vals[k], isCur = curKey === k, isCross = row.r === 'p2' && pl === 0;
              out.push(<div key={c} style={{ width: S, height: S, padding: 2 }}>
                <div className={`w-full h-full flex items-center justify-center rounded-lg font-bold ${isCross ? 'cross' : ''} ${isCur ? 'cellglow' : ''} ${ops.includes(k) ? 'opglow' : ''}`}
                  style={{ background: isCross ? undefined : RES_BG[row.r], border: '2px solid #94a3b8', fontSize: S * 0.62, color: isCross ? '#e11d48' : '#1e3a8a', backgroundColor: isCross ? '#f8fafc' : undefined }}>
                  {v !== undefined ? v : isCur && ghost !== undefined && ghost !== null ? <span className="ghost">{ghost}</span> : ''}</div></div>);
            }
            return <div key={ri} className="flex">{out.map((x, i) => <React.Fragment key={i}>{x}</React.Fragment>)}</div>;
          })}
        </div>
      );
    }

    function NumPad({ onPress, bad = [], glow = null, disabled, extra = null }) {
      return (
        <div className="numpad grid grid-cols-3 gap-2">
          {[1, 2, 3, 4, 5, 6, 7, 8, 9, 'h', 0].map(d => {

              style={{ width: 74, height: 62, fontSize: 36 }}>{off ? '✕' : d}</button>;

    function StepExpr({ st, hint }) {
      if (!st) return null;
      const big = 'text-3xl font-bold';
      const y = <span className="px-1 rounded" style={{ background: st.row === 'p2' ? '#4ade80' : '#fde047' }}>{st.y}</span>;
      let main;
      if (st.kind === 'mul') main = <span className={big}>{st.x} × {y}{st.carry ? <> ＋ <span className="text-rose-600">{st.carry}</span></> : null} ＝ ？</span>;
      else if (st.kind === 'add') main = <span className={big}>{st.x} ＋ {st.y}{st.carry ? <> ＋ <span className="text-rose-600">{st.carry}</span></> : null} ＝ ？</span>;
      else if (st.kind === 'memo' || st.kind === 'addmemo') main = <span className="text-3xl font-bold text-rose-600">✏️ くりあがりを メモ</span>;
      else if (st.kind === 'zero') main = <span className="text-3xl font-bold">✕の マスは なに？</span>;
      else main = <span className="text-3xl font-bold">⬅️ のこりを {PLACE_NAME[st.place]}に</span>;
      return (
        <div className="bg-sky-50 border-4 border-sky-300 rounded-2xl px-3 py-2 text-center w-full">
          <div className="text-sm text-sky-700 font-bold">{ROW_NAME[st.row]}{st.memo ? 'メモ' : PLACE_NAME[st.place]}</div>
          <div>{main}</div>
          {hint >= 1 && <div className="text-lg text-slate-700 mt-1">💡 {hintText(st)}</div>}
          {hint >= 2 && <div className="text-2xl font-bold text-indigo-700">{hintCalc(st).map((l, i) => <div key={i}>{l}</div>)}</div>}
        </div>
      );
    }

    // 1もんを とく（たたかい・しゅぎょう・おてほん で つかう）
    function Solver({ a, b, settings, onSolved, demo, party = [], S }) {
      const talk = useTalk();
      const h = useMemo(() => buildHissan(a, b), [a, b]);
      const [i, setI] = useState(0);
      const [vals, setVals] = useState({});
      const [miss, setMiss] = useState(0);
      const [bad, setBad] = useState([]);
      const [hint, setHint] = useState(0);
      const [shake, setShake] = useState(0);
      const stats = useRef({ miss: 0, hint: 0, kinds: [], inputs: [], t0: Date.now() });
      const usedLines = useRef(new Set());
      const st = h.steps[i];
      const hintOn = settings.hint !== false;
      const sayStep = (s) => {
        const ck = s.kind === 'addmemo' ? 'memo' : s.kind === 'addhi' ? 'mulhi' : s.kind;
        if (party.length && COMP_LINES[ck] && !usedLines.current.has(ck) && Math.random() < 0.8) {
          usedLines.current.add(ck);
          talk.say(COMP_LINES[ck], { who: pickOne(party) }); return;
        }
        if (settings.yomi === false) talk.show(stepPrompt(s), { who: 'kakeru' }); else talk.say(stepPrompt(s), { who: 'kakeru' });
      };
      useEffect(() => { if (!demo && st) sayStep(st); }, [i]);
      // おてほん：カケルさまが 1マスずつ といて みせる
      useEffect(() => {
        if (!demo) return;
        let alive = true;
        (async () => {
          await sleep(500);
          for (let k = 0; k < h.steps.length && alive; k++) {
            const s = h.steps[k];
            setI(k); setHint(2);
            const where = s.memo ? 'メモに' : `${PLACE_NAME[s.place]}に`;
            await talk.say(`${hintText(s)} ${hintCalc(s).join('。')}。${where} ${s.val} を かくよ。`, { who: 'kakeru' });
            if (!alive) return;
            Sound.tap(); setVals(v => ({ ...v, [keyOf(s)]: s.val }));
            await sleep(600);
          }
          if (!alive) return;
          setI(h.steps.length); setHint(0); Sound.ok();
          await talk.say(`できあがり！ こたえは ${a * b} じゃ。`, { who: 'kakeru', mood: 'happy' });
        })();
        return () => { alive = false; };
      }, [demo, a, b]);
      const press = (v) => {
        if (demo || !st || bad.includes(v)) return;
        if (v === st.val) {
          Sound.tap();
          setVals(x => ({ ...x, [keyOf(st)]: v }));
          setMiss(0); setBad([]); setHint(0);
          if (i + 1 >= h.steps.length) {
            setI(i + 1); Sound.ok();
            const s = stats.current;
            const rec = { prob: `${a}×${b}`, ans: a * b, result: s.miss ? '△' : '○', miss: s.miss, hint: s.hint, kinds: [...new Set(s.kinds)].join('・'),
              inputs: s.inputs.join('・'), secs: Math.round((Date.now() - s.t0) / 1000), a, b };
            setTimeout(() => onSolved && onSolved(rec), 900);
          } else setI(i + 1);
          return;
        }
        Sound.retry();
        const kind = mistakeKind(st, v);
        const s = stats.current;
        s.miss++; s.kinds.push(kind); s.inputs.push(`${ROW_NAME[st.row]}${st.memo ? 'メモ' : PLACE_NAME[st.place]}:${v}→${st.val}`);
        const m = miss + 1;
        setMiss(m); setBad([...bad, v]); setShake(x => x + 1);
        if (m >= 3) { setHint(3); s.hint = Math.max(s.hint, 3); talk.say(`${missText(kind, st)} ひかって いる かずを おしてね。`, { who: 'kakeru', mood: 'think' }); }
        else talk.say(missText(kind, st), { who: 'kakeru', mood: 'think' });
      };
      const moreHint = () => {
        const n = Math.min(3, hint + 1);
        setHint(n); stats.current.hint = Math.max(stats.current.hint, n);
        if (n === 1) talk.say(hintText(st), { who: 'kakeru', mood: 'think' });
        else if (n === 2) talk.say(hintCalc(st).join('。'), { who: 'kakeru', mood: 'think' });
        else talk.say('ひかって いる かずを おしてね。', { who: 'kakeru', mood: 'think' });
      };
      const done = i >= h.steps.length;
      return (
        <div className="flex flex-wrap items-start justify-center gap-3">
          <div key={shake} className={shake ? 'shake' : ''}>
            <Board h={h} vals={vals} cur={done ? null : st} ops={hint >= 2 && st ? operandCells(st) : []} ghost={hint >= 3 && st ? st.val : null} S={S || (h.two ? 52 : 64)} />
          </div>
          <div className="flex flex-col items-center gap-2" style={{ width: 330 }}>
            {done ? <div className="pop text-3xl font-bold text-emerald-600 bg-emerald-50 border-4 border-emerald-400 rounded-2xl px-4 py-3 text-center">⭐ できた！<br />{a} × {b} ＝ {a * b}</div>
              : <StepExpr st={st} hint={hint} />}
            {!demo && !done && (
              <NumPad onPress={press} bad={bad} glow={hint >= 3 ? st.val : null}
                extra={hintOn ? <button onClick={moreHint} disabled={hint >= 3} className={`btn3d rounded-2xl border-4 border-amber-500 bg-amber-100 font-bold text-lg leading-tight ${miss >= 2 && hint < 3 ? 'glow' : ''}`} style={{ width: 74, height: 62 }}>💡ヒント<div className="text-xs">{hint}/3</div></button> : null} />
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 16. たたかい
    // =====================================================================
    function PartyRow({ p, size = 70, attack }) {
      const party = partyOf(p);
      const pet = ITEM[p.equip.dougu];
      return (
        <div className="flex items-end gap-1">
          {p.hero && <div className={attack ? 'pop' : 'bob'}><HeroPic job={p.hero.job} form={p.hero.form} size={size} /></div>}
          {party.map(c => <div key={c.id} className="bob"><HeroPic job={c.job} form={c.form} size={size * 0.82} /></div>)}
          {pet && <div className="bob"><ItemPic it={pet} size={size * 0.5} /></div>}
        </div>
      );
    }
    function Hearts({ n, left }) {
      return <div className="flex gap-1 justify-center">{Array.from({ length: n }).map((_, i) => <span key={i} style={{ fontSize: 26, filter: i < left ? 'none' : 'grayscale(1) opacity(.35)' }}>❤️</span>)}</div>;
    }

    // ばめん（ひだり）と ひっ算（みぎ）
    function FightLayout({ scene, children }) {
      return (
        <div className="flex-1 flex flex-col lg:flex-row" style={{ minHeight: 'calc(100vh - 64px)' }}>
          <div className="lg:w-[40%] shrink-0" style={{ minHeight: 300 }}>{scene}</div>
          <div className="flex-1 bg-slate-100 p-2 flex flex-col items-center gap-2 overflow-auto">{children}</div>
        </div>
      );
    }

    function Battle({ p, pl, bi, resume, settings, name, onProblem, onWin, onQuit }) {
      const talk = useTalk();
      const m = MONSTERS.filter(x => x.place === pl.id)[bi];
      const spec = pl.battles[bi];
      const [probs] = useState(() => {
        const part = resume && p.part && p.part.place === pl.id && p.part.bi === bi ? p.part : null;
        const n = part ? part.n : problemCount(spec, settings);
        return { list: makeSet(spec, n), start: part ? part.solved : 0, n };
      });
      const [k, setK] = useState(probs.start);
      const [phase, setPhase] = useState('appear');
      const [fx, setFx] = useState(null);
      const job = JOB[p.hero.job];
      const party = partyOf(p);
      useEffect(() => {
        Sound.appear();
        talk.say(`${m.name}が あらわれた！`, { who: m });
        const t = setTimeout(() => setPhase('solve'), 1800);
        return () => clearTimeout(t);
      }, []);
      const solved = (rec) => {
        onProblem({ ...rec, place: placeLabel(pl), battle: BATTLE_NAMES[bi] }, { place: pl.id, bi, solved: k + 1, n: probs.n });
        const weapon = ITEM[p.equip.buki];
        const waza = p.waza.length && Math.random() < 0.4 ? SHUGYO.find(s => s.waza === pickOne(p.waza)) : null;
        setFx({ e: waza ? waza.wazaFx : weapon ? weapon.e : job.fx, it: !waza && weapon ? weapon : null, waza: waza ? waza.waza : null, key: uid() });
        setPhase('attack'); Sound.hit();
        talk.say(waza ? `${name}の わざ「${waza.waza}」！` : `${name}の こうげき！ ${job.attack}`, { who: { name, job: p.hero.job, form: p.hero.form } });
        setTimeout(() => {
          setFx(null);
          if (k + 1 >= probs.n) {
            setPhase('win'); Sound.win();
            talk.say(`${m.name}を たおした！`, { who: 'kakeru', mood: 'happy' });
            setTimeout(() => onWin(pl, bi), 2200);
          } else { setK(k + 1); setPhase('solve'); }
        }, 1400);
      };
      const left = probs.n - k - (phase === 'attack' || phase === 'win' ? 1 : 0);
      const scene = (
        <PlaceBg pl={pl} className="h-full" style={{ minHeight: 300 }}>
          <div className="h-full flex flex-col items-center justify-between p-3 gap-2" style={{ minHeight: 300 }}>
            <div className="rpgwin px-4 py-1 text-center"><div className="text-lg font-bold">{m.name}{m.boss ? ' 👑' : ''}</div><Hearts n={probs.n} left={left} /></div>
            <div className="relative">
              <div key={phase === 'attack' && fx ? 'm' + fx.key : 'm'} className={phase === 'attack' ? 'hit' : phase === 'win' ? 'defeat' : phase === 'appear' ? 'pop' : 'floaty'}>
                <MonsterPic m={m} size={m.boss ? 200 : 170} />
              </div>
              {fx && <div key={fx.key} className="absolute inset-0 flex items-center justify-center pointer-events-none"><div className="fxfly" style={{ fontSize: 90 }}>{fx.it ? <ItemPic it={fx.it} size={96} /> : fx.e}</div></div>}
              {fx && fx.waza && <div className="absolute left-1/2 top-0 -translate-x-1/2 rpgwin px-3 py-1 text-xl font-bold text-amber-300 whitespace-nowrap pop">✨{fx.waza}✨</div>}
            </div>
            <PartyRow p={p} size={64} attack={phase === 'attack'} />
            <MessageWindow className="w-full" small />
          </div>
        </PlaceBg>
      );
      return (
        <FightLayout scene={scene}>
          <div className="w-full flex items-center justify-between">
            <div className="text-xl font-bold">{pl.icon} {pl.name}　{BATTLE_NAMES[bi]}　<span className="text-sky-700">もんだい {Math.min(k + 1, probs.n)} / {probs.n}</span></div>
            <button onClick={() => { talk.stop(); onQuit(); }} className="rounded-xl border-2 border-slate-400 bg-white px-3 py-1 text-lg font-bold">🏃 にげる（あとで つづき）</button>
          </div>
          {phase === 'appear' ? <div className="text-3xl font-bold mt-20 pop">⚔️ {m.name}が あらわれた！</div>
            : phase === 'win' ? <div className="text-4xl font-bold mt-20 pop text-amber-600">🎉 {m.name}を たおした！</div>
            : <Solver key={k} a={probs.list[k][0]} b={probs.list[k][1]} settings={settings} party={party} onSolved={phase === 'solve' ? solved : null} />}
        </FightLayout>
      );
    }

    // おてほん（カケルさまが といて みせる）
    function DemoScreen({ pl, onBack }) {
      const [n, setN] = useState(0);
      const pr = useMemo(() => {
        const spec = pl.battles[pl.battles.length - 1] === 'm2' ? 'x22' : pl.battles[0] === 'm1' ? 'c1' : pl.battles[n % 3 === 2 ? 2 : 0];
        const pool = (D.POOL[spec] || []);
        return pool.length ? pool[n % pool.length] : randFor(spec);
      }, [pl.id, n]);
      const scene = (
        <PlaceBg pl={pl} className="h-full" dim={0.2}>
          <div className="h-full flex flex-col items-center justify-end p-3 gap-2" style={{ minHeight: 300 }}>
            <Kakeru size={170} mood="normal" className="floaty" />
            <MessageWindow className="w-full" small />
          </div>
        </PlaceBg>
      );
      return (
        <FightLayout scene={scene}>
          <div className="w-full flex items-center justify-between">
            <div className="text-xl font-bold">📖 おてほん：{pl.lv} {pl.sub}</div>
            <div className="flex gap-2">
              <button onClick={() => setN(n + 1)} className="btn3d rounded-xl border-4 border-sky-500 bg-sky-100 px-3 py-1 text-lg font-bold">🔁 ほかの もんだい</button>
              <button onClick={onBack} className="btn3d rounded-xl border-4 border-slate-400 bg-white px-3 py-1 text-lg font-bold">もどる</button>
            </div>
          </div>
          <Solver key={n} a={pr[0]} b={pr[1]} settings={{}} demo />
        </FightLayout>
      );
