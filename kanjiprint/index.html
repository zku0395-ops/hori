<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポンタせんせいの かんじ プリント</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 landscape; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e7e5e4; font-family: 'BIZ UDPGothic', sans-serif; color: #1c1917; }
    .kyo { font-family: 'Klee One', 'BIZ UDPGothic', serif; font-weight: 600; }

    /* 先生が プリントを えらぶ ところ（印刷には 出ない） */
    .panel { max-width: 1100px; margin: 16px auto; background: #fff; border-radius: 16px; padding: 16px 20px; box-shadow: 0 2px 8px #0002; }
    .panel h1 { margin: 0 0 6px; font-size: 26px; display: flex; align-items: center; gap: 10px; }
    .panel h1 img { width: 56px; height: 56px; mix-blend-mode: multiply; }
    .panel .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .panel select, .panel button { font: inherit; font-size: 18px; padding: 8px 12px; border-radius: 12px; border: 2px solid #b45309; background: #fff; }
    .panel button.big { background: #f59e0b; color: #fff; font-weight: 700; box-shadow: 0 4px 0 #b45309; }
    .panel .note { font-size: 14px; color: #57534e; }
    .panel .dl a { display: inline-block; margin: 4px 8px 4px 0; font-size: 15px; }

    /* プリント */
    .sheet:last-child { break-after: auto; page-break-after: auto; }
    .sheet { width: 297mm; height: 210mm; margin: 10px auto; background: #fff; position: relative; overflow: hidden; box-shadow: 0 2px 8px #0003; page-break-after: always; break-after: page; }
    .head { position: absolute; left: 9mm; right: 9mm; top: 6mm; height: 14mm; display: flex; align-items: center; gap: 4mm; border-bottom: .5mm solid #d6d3d1; }
    .head img { width: 13mm; height: 13mm; mix-blend-mode: multiply; }
    .head .ttl { font-size: 5.6mm; font-weight: 700; white-space: nowrap; }
    .head .tag { font-size: 3.8mm; font-weight: 700; color: #fff; border-radius: 3mm; padding: .7mm 2.5mm; white-space: nowrap; }
    .head .sp { flex: 1; }
    .head .nm { font-size: 4.2mm; white-space: nowrap; display: flex; align-items: flex-end; gap: 1.5mm; }
    .head .nm .ln { display: inline-block; border-bottom: .35mm solid #44403c; height: 7mm; }
    .head .score { border: .6mm solid #e11d48; border-radius: 2.5mm; padding: 1mm 3mm; font-size: 4.2mm; white-space: nowrap; color: #9f1239; }
    .foot { position: absolute; right: 9mm; bottom: 4mm; font-size: 2.6mm; color: #a8a29e; }
    .half { position: absolute; top: 23mm; bottom: 9mm; width: 137mm; }
    .half.r { right: 9mm; }
    .half.l { left: 9mm; }
    .divider { position: absolute; left: 148.5mm; top: 24mm; bottom: 10mm; border-left: .5mm dashed #a8a29e; }

    /* 見本の カード */
    .card { position: absolute; right: 0; top: 0; width: 50mm; border: .9mm solid #d6d3d1; border-radius: 4mm; background: #fafaf9; padding: 1.5mm; }
    .big { width: 46mm; height: 46mm; background: #fff; border: .7mm solid #e11d48; position: relative; }
    .big svg { width: 100%; height: 100%; display: block; }
    .info { display: flex; gap: 1.5mm; margin-top: 2mm; min-height: 62mm; }
    .info .col { background: #fff; border-radius: 2mm; flex: 1; padding: 1.5mm 1mm; display: flex; flex-direction: column; align-items: center; }
    .info .lab { font-size: 3mm; font-weight: 700; margin-bottom: 1mm; white-space: nowrap; }
    .info .kaku { font-size: 3.4mm; background: #bae6fd; border-radius: 2mm; padding: .3mm 2mm; font-weight: 700; margin-bottom: 1.5mm; white-space: nowrap; }
    .steps { display: grid; grid-template-columns: repeat(2, 10mm); gap: .8mm; justify-content: center; }
    .steps svg { width: 10mm; height: 10mm; display: block; }
    .yomi { display: flex; flex-direction: row-reverse; gap: 2mm; justify-content: center; }
    .yomi .one { display: flex; flex-direction: column; align-items: center; gap: 1mm; }
    .yomi .chip { font-size: 2.8mm; font-weight: 700; border-radius: 1.5mm; padding: .6mm .5mm; writing-mode: vertical-rl; }
    .yomi .on { background: #d9f99d; }
    .yomi .kun { background: #fde68a; }
    .yomi .txt { writing-mode: vertical-rl; font-size: 3.8mm; line-height: 1.25; max-height: 86mm; }
    .yomi .ok { color: #e11d48; }

    /* なぞりがき */
    .trace { position: absolute; right: 52mm; top: 0; width: 22mm; display: flex; flex-direction: column; align-items: center; gap: 1.6mm; }
    .trace .lab { font-size: 3mm; font-weight: 700; writing-mode: horizontal-tb; white-space: nowrap; }
    .cell { width: 21mm; height: 21mm; border: .45mm solid #0ea5e9; position: relative; background: #fff; }
    .cell svg { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* もんだい */
    .qs { position: absolute; left: 0; top: 0; bottom: 0; display: flex; flex-direction: row-reverse; gap: 1mm; }
    .qhead { writing-mode: vertical-rl; font-size: 3.2mm; font-weight: 700; color: #fff; border-radius: 2mm; padding: 2mm .6mm; align-self: flex-start; }
    .q { writing-mode: vertical-rl; position: relative; padding-top: 7mm; }
    .q .no { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 3.6mm; font-weight: 700; writing-mode: horizontal-tb; }
    .q .s { line-height: 1.5; white-space: nowrap; }
    .q ruby rt { font-family: 'BIZ UDPGothic', sans-serif; font-weight: 400; }
    .tg { border-left: .8mm solid #e11d48; position: relative; display: inline-block; }
    .tg .ansbox { position: absolute; top: 0; }
    .kb { position: relative; display: inline-block; }
    .kb .yo { position: absolute; top: 0; font-family: 'BIZ UDPGothic', sans-serif; font-weight: 400; writing-mode: vertical-rl; white-space: nowrap; }
    .ansbox { display: inline-block; border: .35mm solid #78716c; border-radius: 1mm; background: #fff; }
    .kbox { display: inline-block; border: .45mm solid #0ea5e9; background: #fff; position: relative; vertical-align: middle; }
    .kbox:before, .kbox:after { content: ''; position: absolute; border: 0 dashed #7dd3fc; }
    .kbox:before { left: 50%; top: 0; bottom: 0; border-left-width: .25mm; }
    .kbox:after { top: 50%; left: 0; right: 0; border-top-width: .25mm; }
    .ans-red { color: #e11d48; }

    /* こたえ */
    .anspage { position: absolute; left: 9mm; right: 9mm; top: 23mm; bottom: 9mm; columns: 2; column-gap: 8mm; font-size: 3.5mm; line-height: 1.75; }
    .anspage h3 { font-size: 4mm; margin: 1.5mm 0 .5mm; break-after: avoid; }
    .anspage .ln { break-inside: avoid; }
    .anspage .a { color: #e11d48; font-weight: 700; }

    @media print {
      body { background: #fff; }
      .panel { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <h1><img src="../kanji1/img/ponta.webp" alt="">ポンタせんせいの かんじ プリント</h1>
    <div class="note">1年生の漢字80字の、学習プリント（1まいに2字）・まとめテスト・こたえです。A4よこで印刷します。</div>
    <div class="row">
      <label>ステージ：<select id="stage"></select></label>
      <button class="big" onclick="window.print()">🖨 いんさつ</button>
    </div>
    <div class="note">印刷の画面では「用紙サイズ：A4」「レイアウト：横」「余白：なし」「倍率：100%」にしてください。</div>
    <div class="row dl" id="dl"></div>
  </div>
  <div id="sheets"></div>

  <script src="../kanji1/data/mondai.js"></script>
  <script src="../kanji1/data/strokes.js"></script>
  <script src="data/print.js"></script>
  <script>
    const { KANJI, STAGES } = window.KANJI_DATA;
    const STROKES = window.KANJI_STROKES;
    const { YOMI, MARK } = window.KANJI_PRINT;
    const KSTAGES = STAGES.filter(s => s.type === 'kanji');
    const PONTA = '../kanji1/img/ponta.webp';
    const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩';
    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const plainName = (st) => st.name;
    const stageNo = (st) => KSTAGES.indexOf(st) + 1;

    // ---------------------------------------------------------------
    // 書き順の 絵（KanjiVG）
    // ---------------------------------------------------------------
    const NS = 'http://www.w3.org/2000/svg';
    const measure = (() => {
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('width', '0'); svg.setAttribute('height', '0'); svg.style.position = 'absolute';
      document.body.appendChild(svg);
      const p = document.createElementNS(NS, 'path'); svg.appendChild(p);
      const cache = {};
      return (d) => {
        if (cache[d]) return cache[d];
        p.setAttribute('d', d);
        const L = p.getTotalLength(), pts = [];
        for (let i = 0; i <= 20; i++) { const q = p.getPointAtLength(L * i / 20); pts.push({ x: q.x, y: q.y }); }
        return (cache[d] = { L, pts });
      };
    })();
    const pathEl = (d, color, w, extra = '') => `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
    const guides = (c = '#d6d3d1') => `<line x1="54.5" y1="2" x2="54.5" y2="107" stroke="${c}" stroke-width=".6" stroke-dasharray="2.5 2.5"/><line x1="2" y1="54.5" x2="107" y2="54.5" stroke="${c}" stroke-width=".6" stroke-dasharray="2.5 2.5"/>`;

    // 大きな 見本：画の番号・書きはじめの矢印・とめはねはらい
    function bigKanji(k) {
      const ps = STROKES[k] || [];
      let s = `<svg viewBox="0 0 109 109">${guides('#fda4af')}`;
      ps.forEach(d => { s += pathEl(d, '#292524', 5); });
      // とめ・はね・はらい
      (MARK[k] || []).forEach(([n, type]) => {
        const g = measure(ps[n - 1]);
        const mid = ['ながく', 'みじかく'].includes(type);
        const p = mid ? g.pts[10] : g.pts[20];
        let dx = p.x - 54.5, dy = p.y - 54.5; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
        if (!mid) s += `<circle cx="${p.x}" cy="${p.y}" r="5.2" fill="none" stroke="#e11d48" stroke-width="1.1"/>`;
        // 画の むきに 直角に、字の 外がわへ ずらす
        const a2 = mid ? g.pts[8] : g.pts[17], b2 = mid ? g.pts[12] : g.pts[20];
        let tx = b2.x - a2.x, ty = b2.y - a2.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        let nx = -ty, ny = tx;
        if (nx * dx + ny * dy < 0) { nx = -nx; ny = -ny; }
        const off = mid ? 9 : 11;
        let lx = p.x + nx * off + (mid ? 0 : tx * 3), ly = p.y + ny * off + 2;
        lx = Math.max(10, Math.min(99, lx)); ly = Math.max(7, Math.min(106, ly));
        s += `<text x="${lx}" y="${ly}" font-size="6.2" font-weight="700" fill="#e11d48" text-anchor="middle" font-family="BIZ UDPGothic" paint-order="stroke" stroke="#fff" stroke-width="2">${type}</text>`;
      });
      // 画の番号と矢印
      ps.forEach((d, i) => {
        const g = measure(d), a = g.pts[0], b = g.pts[2];
        let ux = b.x - a.x, uy = b.y - a.y; const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
        const nx = a.x - ux * 5.5 - uy * 0.5, ny = a.y - uy * 5.5 + ux * 0.5;
        s += `<circle cx="${nx}" cy="${ny}" r="3.4" fill="#fff" stroke="#f97316" stroke-width=".7"/>`;
        s += `<text x="${nx}" y="${ny + 2.1}" font-size="5.4" font-weight="700" fill="#ea580c" text-anchor="middle" font-family="BIZ UDPGothic">${i + 1}</text>`;
      });
      return s + '</svg>';
    }
    // 1画ずつ ふえる 字（あたらしい 画は 赤）
    function stepKanji(k, n) {
      const ps = STROKES[k] || [];
      let s = `<svg viewBox="0 0 109 109"><rect x="1" y="1" width="107" height="107" fill="#fff" stroke="#e7e5e4" stroke-width="2"/>`;
      ps.forEach((d, i) => { if (i < n) s += pathEl(d, i === n - 1 ? '#e11d48' : '#57534e', 8); });
      return s + '</svg>';
    }
    // なぞりがきの マス
    function traceCell(k, color, nums) {
      const ps = STROKES[k] || [];
      let s = `<svg viewBox="0 0 109 109">${guides('#bae6fd')}`;
      ps.forEach(d => { s += pathEl(d, color, 6); });
      if (nums) ps.forEach((d, i) => { const a = measure(d).pts[0]; s += `<text x="${a.x - 4}" y="${a.y + 1}" font-size="7" font-weight="700" fill="#fb923c" text-anchor="middle" font-family="BIZ UDPGothic">${i + 1}</text>`; });
      return `<div class="cell">${s}</svg></div>`;
    }

    // ---------------------------------------------------------------
    // 例文（たて書き）
    // ---------------------------------------------------------------
    // mode：'yomi'（読みを 書く）／'kaku'（漢字を 書く）／'answer'（こたえ）
    function sentence(ex, mode, fs) {
      const out = [];
      const re = /\[(.+?)\]|\{(.+?)\|(.+?)\}/g;
      let last = 0, m;
      const rt = (t) => `<rt style="font-size:${(fs * 0.42).toFixed(2)}mm">${esc(t)}</rt>`;
      while ((m = re.exec(ex.s))) {
        out.push(esc(ex.s.slice(last, m.index)));
        if (m[2]) out.push(`<ruby>${esc(m[2])}${rt(m[3])}</ruby>`);
        else if (mode === 'yomi') {
          // 字の みぎに、よみを 書く わく
          const n = Math.max(2, [...ex.y].length) * [...m[1]].length;
          const bw = fs * .82, h = n * fs * 0.82 + fs * 0.25;
          out.push(`<span class="tg">${esc(m[1])}<span class="ansbox" style="left:calc(100% + .9mm);width:${bw.toFixed(2)}mm;height:${h.toFixed(2)}mm"></span></span>`);
        } else if (mode === 'kaku') {
          // 漢字を 書く ます（よみは みぎに 小さく）
          const b = fs * 1.4, n = [...m[1]].length;
          out.push(`<span class="kb" style="margin:${(fs * .15).toFixed(2)}mm 0"><span class="kbox" style="width:${b.toFixed(2)}mm;height:${(b * n).toFixed(2)}mm"></span><span class="yo" style="left:calc(100% + .5mm);font-size:${(fs * .42).toFixed(2)}mm;line-height:1">${esc(ex.y)}</span></span>`);
        } else out.push(`<ruby class="ans-red">${esc(m[1])}${rt(ex.y)}</ruby>`);
        last = re.lastIndex;
      }
      out.push(esc(ex.s.slice(last)));
      return out.join('');
    }
    const question = (no, ex, mode, fs, width) => {
      // 字の みぎに わく（よみ）や よみがな（かく）が 出るので、その ぶん あける
      const pad = mode === 'yomi' ? fs * .82 + 1.2 : fs * .45 + .8;
      return `<div class="q kyo" style="font-size:${fs}mm;width:${width}mm"><span class="no">${no}</span><div class="s" style="margin-right:${pad.toFixed(2)}mm">${sentence(ex, mode, fs)}</div></div>`;
    };
    const plainEx = (s) => s.replace(/\[(.+?)\]/g, '$1').replace(/\{(.+?)\|(.+?)\}/g, '$1');
    const ansText = (ex, kind) => {
      const t = esc(ex.s).replace(/\[(.+?)\]/, (_, k) => `<span class="a">${kind === 'yomi' ? `${k}（${esc(ex.y)}）` : `${k}`}</span>`).replace(/\{(.+?)\|(.+?)\}/g, '$1');
      return kind === 'yomi' ? t : t;
    };

    // ---------------------------------------------------------------
    // 1まいの プリント
    // ---------------------------------------------------------------
    function header(st, title, opts = {}) {
      return `<div class="head">
        <img src="${PONTA}" alt="">
        <span class="ttl">${title}</span>
        <span class="tag" style="background:${st.color}">ステージ${stageNo(st)}　${esc(st.name)}</span>
        <span class="sp"></span>
        <span class="nm"><span class="ln" style="width:9mm"></span>がつ<span class="ln" style="width:9mm"></span>にち　なまえ<span class="ln" style="width:44mm"></span></span>
        ${opts.score ? `<span class="score">　　　　てん</span>` : ''}
      </div>`;
    }

    // 1字ぶん（半分）
    function kanjiHalf(k, side, color) {
      const d = KANJI[k], ps = STROKES[k] || [];
      const [on, kun] = YOMI[k] || ['', ''];
      const red = (t) => esc(t).replace(/\((.+?)\)/g, '<span class="ok">$1</span>');
      const steps = ps.map((_, i) => stepKanji(k, i + 1)).join('');
      const yomiCol = (cls, lab, t) => t ? `<div class="one"><span class="chip ${cls}">${lab}</span><span class="txt">${red(t)}</span></div>` : '';
      const fs = 6.0, w = 12.1;
      const qs = [
        question('①', d.ex[0], 'yomi', fs, w), question('②', d.ex[1], 'yomi', fs, w),
        question('③', d.ex[2], 'kaku', fs, w), question('④', d.ex[0], 'kaku', fs, w),
      ];
      return `<div class="half ${side}">
        <div class="card">
          <div class="big">${bigKanji(k)}</div>
          <div class="info">
            <div class="col"><span class="lab">かきじゅん</span><span class="kaku">${ps.length} かく</span><div class="steps">${steps}</div></div>
            <div class="col"><span class="lab">よみかた</span><div class="yomi">${yomiCol('on', 'おん', on)}${yomiCol('kun', 'くん', kun)}</div></div>
          </div>
        </div>
        <div class="trace">
          <span class="lab">なぞろう</span>
          ${traceCell(k, '#a8a29e', true)}${traceCell(k, '#d6d3d1')}${traceCell(k, '#ece9e6')}
          <span class="lab" style="margin-top:1mm">かいて みよう</span>
          <div class="cell"><svg viewBox="0 0 109 109">${guides('#bae6fd')}</svg></div>
        </div>
        <div class="qs" style="right:74mm">
          <span class="qhead" style="background:${color}">よみを かこう</span>
          ${qs[0]}${qs[1]}
          <span class="qhead" style="background:#0ea5e9;margin-right:1mm">かんじを かこう</span>
          ${qs[2]}${qs[3]}
        </div>
      </div>`;
    }

    // ふくしゅう（半分）：ステージの 5字
    function reviewHalf(st) {
      const fs = 5.2, w = 11.5;
      const ys = st.kanji.map((k, i) => question(CIRCLED[i], KANJI[k].ex[2], 'yomi', fs, w)).join('');
      const ks = st.kanji.map((k, i) => question(CIRCLED[i + 5], KANJI[k].ex[1], 'kaku', fs, w)).join('');
      return `<div class="half l">
        <div style="position:absolute;right:0;top:0;font-size:4.4mm;font-weight:700;background:#fef3c7;border:.6mm solid #f59e0b;border-radius:3mm;padding:1mm 4mm">ふくしゅう　<span class="kyo">${st.kanji.join('・')}</span></div>
        <div class="qs" style="right:0;left:auto;top:10mm">
          <span class="qhead" style="background:${st.color}">よみを かこう</span>${ys}
          <span class="qhead" style="background:#0ea5e9;margin-right:1mm">かんじを かこう</span>${ks}
        </div>
      </div>`;
    }

    function learnSheets(st) {
      const ks = st.kanji, n = stageNo(st);
      const pages = [[ks[0], ks[1]], [ks[2], ks[3]], [ks[4]]];
      return pages.map((pair, i) => `<div class="sheet">
        ${header(st, `かんじ プリント ${i + 1}`)}
        ${kanjiHalf(pair[0], 'r', st.color)}
        <div class="divider"></div>
        ${pair[1] ? kanjiHalf(pair[1], 'l', st.color) : reviewHalf(st)}
        <div class="foot">ポンタせんせいの かんじ プリント　ステージ${n}－${i + 1}</div>
      </div>`).join('');
    }

    function testSheet(st) {
      const fs = 8.4, w = 24;
      const ys = st.kanji.map((k, i) => question(CIRCLED[i], KANJI[k].ex[1], 'yomi', fs, w)).join('');
      const ks = st.kanji.map((k, i) => question(CIRCLED[i + 5], KANJI[k].ex[2], 'kaku', fs, w)).join('');
      return `<div class="sheet">
        ${header(st, 'まとめテスト', { score: true })}
        <div class="half r"><div class="qs" style="right:0;left:auto"><span class="qhead" style="background:${st.color}">よみを かこう（1もん 10てん）</span>${ys}</div></div>
        <div class="divider"></div>
        <div class="half l"><div class="qs" style="right:0;left:auto"><span class="qhead" style="background:#0ea5e9">かんじを かこう（1もん 10てん）</span>${ks}</div></div>
        <div class="foot">ポンタせんせいの かんじ プリント　ステージ${stageNo(st)}　まとめテスト</div>
      </div>`;
    }

    function answerSheet(st) {
      const ks = st.kanji;
      const block = (title, items) => `<h3>${title}</h3>` + items.map(([no, ex, kind]) => `<div class="ln kyo">${no} ${ansText(ex, kind)}</div>`).join('');
      const half = (k) => [['①', KANJI[k].ex[0], 'yomi'], ['②', KANJI[k].ex[1], 'yomi'], ['③', KANJI[k].ex[2], 'kaku'], ['④', KANJI[k].ex[0], 'kaku']];
      let h = '';
      h += block(`プリント1（${ks[0]}）`, half(ks[0])) + block(`プリント1（${ks[1]}）`, half(ks[1]));
      h += block(`プリント2（${ks[2]}）`, half(ks[2])) + block(`プリント2（${ks[3]}）`, half(ks[3]));
      h += block(`プリント3（${ks[4]}）`, half(ks[4]));
      h += block('プリント3（ふくしゅう）', [...ks.map((k, i) => [CIRCLED[i], KANJI[k].ex[2], 'yomi']), ...ks.map((k, i) => [CIRCLED[i + 5], KANJI[k].ex[1], 'kaku'])]);
      h += block('まとめテスト', [...ks.map((k, i) => [CIRCLED[i], KANJI[k].ex[1], 'yomi']), ...ks.map((k, i) => [CIRCLED[i + 5], KANJI[k].ex[2], 'kaku'])]);
      return `<div class="sheet">
        ${header(st, 'こたえ')}
        <div class="anspage">${h}</div>
        <div class="foot">ポンタせんせいの かんじ プリント　ステージ${stageNo(st)}　こたえ</div>
      </div>`;
    }

    const stageSheets = (st) => learnSheets(st) + testSheet(st) + answerSheet(st);

    // ---------------------------------------------------------------
    // ひょうじ
    // ---------------------------------------------------------------
    const params = new URLSearchParams(location.search);
    const sel = document.getElementById('stage');
    sel.innerHTML = KSTAGES.map(st => `<option value="${st.id}">ステージ${stageNo(st)}　${esc(st.name)}（${st.kanji.join('')}）</option>`).join('') + '<option value="all">ぜんぶ</option>';
    const fileName = (st) => `かんじプリント_ステージ${String(stageNo(st)).padStart(2, '0')}_${st.name.replace(/[①②・ 　]/g, (c) => ({ '①': '1', '②': '2' }[c] || ''))}.pdf`;
    window.KANJIPRINT_FILES = KSTAGES.map(st => ({ id: st.id, file: fileName(st) }));
    document.getElementById('dl').innerHTML = '<span>できあがった PDF：</span><a href="pdf/かんじプリント_ぜんぶ.pdf" download>ぜんぶ</a>' +
      KSTAGES.map(st => `<a href="pdf/${encodeURIComponent(fileName(st))}" download>ステージ${stageNo(st)}</a>`).join('');
    function render(id) {
      const list = id === 'all' ? KSTAGES : KSTAGES.filter(s => s.id === id);
      document.getElementById('sheets').innerHTML = list.map(stageSheets).join('');
    }
    sel.value = params.get('stage') || 's1';
    sel.onchange = () => render(sel.value);
    render(sel.value);
    if (params.get('print')) document.getElementById('panel').style.display = 'none';
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { document.body.dataset.ready = '1'; });
  </script>
</body>
</html>
