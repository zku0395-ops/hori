      useEffect(() => {
        if (first) kibo.say(`${name}さん、うちゅうせんへ ようこそ！ わたしは せんちょうの キャプテン・キーボ。きみの ロボットと いっしょに、キーボードの ほしを めぐろう。まずは ロボットの いろを えらんでね。`, { mood: 'happy' });
        else kibo.say(`${name}さん、キャプテン・キーボだ！ きょうは どの ほしへ いく？`);
      }, [first]);
      const list = STAGES.filter(st => !st.hatten || stageOpen(progress, st));
      const rows = [];
      for (let i = 0; i < list.length; i += 5) rows.push(list.slice(i, i + 5));
      return (
        <div className="relative isolate w-full flex-1 flex flex-col items-center gap-3 p-3 space">
          <SpaceBg />
          {first && (
            <div className="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 flex flex-col items-center gap-3 pop max-w-2xl text-center">
                <div className="flex items-end gap-4"><Kibo size={150} /><Robot color={color} size={140} happy /></div>
                <div className="text-3xl font-bold">きみの ロボットだよ！</div>
                <div className="text-xl">いろを えらんでね（あとで ガレージで かえられるよ）</div>
                <div className="flex flex-wrap gap-2 justify-center">
                  {ROBO_COLORS.map(c => <button key={c.id} onClick={() => { Sound.tap(); setColor(c.id); }} className={`w-14 h-14 rounded-full border-4 ${color === c.id ? 'border-slate-800 scale-110' : 'border-white'}`} style={{ background: c.c }} aria-label={c.n} />)}
                </div>
                <Btn onClick={() => onWelcome(color)} color="#16a34a" light="#dcfce7" className="text-3xl px-10">🚀 しゅっぱつ！</Btn>
              </div>
            </div>
          )}
          <div className="bg-white/90 rounded-3xl p-2 w-full max-w-5xl"><KiboBar size={90} compact /></div>
          <div className="flex gap-3 flex-wrap justify-center">
            <Btn onClick={onContinue} color="#16a34a" light="#dcfce7" className="text-3xl px-8 glow">▶ つづきから（{cur.planet}）</Btn>
            <Btn onClick={onShop} color="#e11d48" light="#ffe4e6">🛒 おみせ</Btn>
            <Btn onClick={onZukan} color="#ca8a04" light="#fef9c3">📖 ずかん</Btn>
            <Btn onClick={onGarage} color="#2563eb" light="#dbeafe">🔧 ガレージ</Btn>
          </div>
          <div className="w-full max-w-5xl flex flex-col gap-1">
            {rows.map((row, ri) => (
              <div key={ri} className={`flex justify-around ${ri % 2 ? 'flex-row-reverse' : ''}`}>
                {row.map(st => {
                  const open = stageOpen(progress, st), cleared = !!progress.cleared[st.id];
                  const here = st.id === cur.id;
                  return (
                    <button key={st.id} onClick={() => { Sound.tap(); onPlanet(st); }} className="relative flex flex-col items-center w-40 active:scale-95 transition">
                      {here && <div className="absolute -left-3 top-2 floaty z-10"><Robot {...robot} size={50} /></div>}
                      <Planet st={st} size={98} locked={!open} cleared={cleared} />
                      <div className={`text-base font-bold rounded-full px-3 -mt-1 ${here ? 'bg-yellow-300' : 'bg-white/90'}`} style={{ wordBreak: 'keep-all' }}>{st.planet}</div>
                      {cleared && settings.game && <div className="text-sm text-yellow-200 font-bold">☄️ ゲーム OK</div>}
                    </button>
                  );
                })}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PlanetModal({ st, progress, settings, onPractice, onResume, onGame, onClose }) {
      const kibo = useKibo();
      const open = stageOpen(progress, st), cleared = !!progress.cleared[st.id];
      const part = progress.part && progress.part.st === st.id ? progress.part : null;
      const best = progress.best[st.id];
      useEffect(() => {
        if (!open) kibo.say(st.hatten ? 'この ほしは、せんせいが ひらいて くれると いけるよ。' : 'まえの ほしを クリアすると いけるよ。', { mood: 'think' });
        else kibo.say(`${st.planet}。${st.sub.replace(/[A-Z;]/g, c => keyName(c.toLowerCase()) + ' ')}を れんしゅうするよ。`);
      }, []);
      return (
        <div className="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-3xl p-6 flex flex-col items-center gap-3 pop min-w-[420px]" onClick={e => e.stopPropagation()}>
            <Planet st={st} size={140} locked={!open} cleared={cleared} />
            <div className="text-4xl font-bold">{st.planet}</div>
            <div className="text-2xl text-slate-600">{st.sub}</div>
            {best && <div className="text-lg bg-sky-50 rounded-xl px-4 py-1">さいこう：せいかくさ {best.acc}%・はやさ {best.cpm}</div>}
            {open ? (
              <div className="flex flex-col gap-3 w-full">
                {part && <Btn onClick={onResume} color="#16a34a" light="#dcfce7" className="text-3xl glow">▶ つづきから（のこり {part.left}もん）</Btn>}
                <Btn onClick={onPractice} color="#0284c7" light="#e0f2fe" className="text-3xl">⌨️ れんしゅう</Btn>
                {cleared && settings.game && <Btn onClick={onGame} color="#7c3aed" light="#ede9fe" className="text-2xl">☄️ いんせきを うちおとせ！</Btn>}
                {!cleared && settings.game && <div className="text-center text-slate-500">クリアすると ☄️ いんせきの ゲームが あそべるよ</div>}
              </div>
            ) : <div className="text-2xl">🔒 まだ いけないよ</div>}
            <button onClick={onClose} className="text-xl underline mt-1">とじる</button>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 15. おみせ・ずかん・ガレージ
    // =====================================================================
    const titlesOf = (items) => ITEM_CATS.filter(c => c.items.every(it => items.includes(it.id))).map(c => c.title);
    const ItemPic = ({ it, size = 56, dark = false }) => it.slot
      ? <span className="relative inline-block" style={dark ? { filter: 'grayscale(1) brightness(0.3)', opacity: .25 } : {}}><Robot equip={{ [it.slot]: it.v }} size={size} withBg={it.slot === 'bg'} className="block" />
          <span className="absolute -right-3 -bottom-1" style={{ fontSize: size * 0.4 }}>{it.e}</span></span>
      : <span style={{ fontSize: size, lineHeight: 1, ...(dark ? { filter: 'grayscale(1) brightness(0.3)', opacity: .25 } : {}) }}>{it.e}</span>;

    // ねだんの だんかい（ふつう・ごうか・ちょうごうか・でんせつ）
    function TierChip({ it, small = false }) {
      const t = TIERS[it.tier] || TIERS[0];
      return <span className={`rounded-full font-bold border-2 whitespace-nowrap ${small ? 'text-[10px] px-1' : 'text-xs px-2'} ${it.tier === 3 ? 'glow' : ''}`} style={{ color: t.color, borderColor: t.color, background: t.bg }}>{it.tier === 3 ? '👑 ' : ''}{t.n}</span>;
    }
    const tierBorder = (it) => (TIERS[it.tier] || TIERS[0]).color;

    function ShopScreen({ progress, onBuy }) {
      const kibo = useKibo();
      const [cat, setCat] = useState(null);
      const [confirm, setConfirm] = useState(null);
      const [award, setAward] = useState(null);
      const own = new Set(progress.items);
      const c = cat && ITEM_CATS.find(x => x.id === cat);
      useEffect(() => { kibo.say('うちゅうステーションの おみせだよ。どの たなを みる？'); }, []);
      const enter = (id) => { Sound.tap(); setCat(id); kibo.say(`${ITEM_CATS.find(x => x.id === id).name}の たなだよ。`); };
      const tap = (it) => {
        Sound.tap();
        if (own.has(it.id)) { kibo.say(`${it.n}は もう ずかんに あるよ。`); return; }
        if (progress.coins < it.p) { kibo.say(`${it.n}は コイン ${it.p}まい。あと ${it.p - progress.coins}まい あつめよう！`, { mood: 'think' }); return; }
        kibo.say(`${it.n}を かいますか？`);
        setConfirm(it);
      };
      const buy = () => {
        const it = confirm; setConfirm(null);
        const before = titlesOf(progress.items), after = titlesOf([...progress.items, it.id]);
        onBuy(it); Sound.buy();
        const nt = after.find(t => !before.includes(t));
        if (nt) { setAward(nt); Sound.big(); kibo.say(`おめでとう！「${nt}」の しょうごうだ！`, { mood: 'happy' }); }
        else kibo.say(it.slot ? `${it.n}を かったよ。ガレージで ロボットに つけられるよ。` : `${it.n}を ずかんに いれたよ。`, { mood: 'happy' });
        if (!nt && it.tier === 3) Sound.big();
      };
      return (
        <div className="relative isolate w-full flex-1 flex flex-col items-center gap-3 p-3 space">
          <SpaceBg />
          <div className="bg-white/90 rounded-3xl p-2 w-full max-w-5xl"><KiboBar size={90} compact /></div>
          {!c && (
            <div className="grid grid-cols-4 gap-3 w-full max-w-5xl">
              {ITEM_CATS.map(x => {
                const n = x.items.filter(it => own.has(it.id)).length;
                return (
                  <button key={x.id} onClick={() => enter(x.id)} className="btn3d rounded-2xl border-4 bg-white flex flex-col items-center py-2" style={{ borderColor: x.color }}>
                    <span className="text-6xl">{x.icon}</span>
                    <span className="text-lg font-bold leading-tight mt-1 text-center" style={{ wordBreak: 'keep-all' }}>{x.name}</span>
                    <span className="text-sm font-bold rounded-full px-2 mt-1 bg-slate-100">{n === x.items.length ? '🏆 ' : ''}{n} / {x.items.length}</span>
                  </button>
                );
              })}
            </div>
          )}
          {c && (
            <div className="w-full max-w-5xl flex flex-col gap-3">
              <div className="flex items-center gap-3">
                <button onClick={() => { Sound.tap(); setCat(null); }} className="btn3d shrink-0 bg-white border-2 border-slate-300 rounded-2xl px-4 py-2 text-xl font-bold">◀ もどる</button>
                <div className="flex-1 text-center text-3xl font-bold py-2 rounded-2xl bg-white border-4" style={{ borderColor: c.color }}>{c.icon} {c.name}</div>
              </div>
              <div className="grid grid-cols-3 sm:grid-cols-5 gap-3 bg-white/90 rounded-3xl p-3">
                {c.items.map(it => {
                  const have = own.has(it.id), can = progress.coins >= it.p;
                  return (
                    <button key={it.id} onClick={() => tap(it)} className={`btn3d rounded-2xl border-4 p-1 flex flex-col items-center ${it.tier === 3 ? 'bg-amber-50' : 'bg-white'} ${have ? 'border-emerald-400' : ''}`} style={have ? {} : { borderColor: tierBorder(it) }}>
                      <TierChip it={it} />
                      <span className={have || can ? '' : 'opacity-60'}><ItemPic it={it} size={60} /></span>
                      <span className="text-base font-bold mt-1 leading-tight h-10 flex items-center text-center">{it.n}</span>
                      <span className={`text-xl font-bold rounded-full px-2 ${have ? 'bg-emerald-100 text-emerald-700' : can ? 'bg-amber-100' : 'bg-slate-100 text-slate-400'}`}>{have ? '✓' : `🪙 ${it.p}`}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
          {confirm && (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 flex flex-col items-center gap-3 pop">
                <ItemPic it={confirm} size={100} />
                <TierChip it={confirm} />
                <div className="text-3xl font-bold">{confirm.n}を かいますか？</div>
                <div className="text-2xl">🪙 {confirm.p}まい（のこり {progress.coins - confirm.p}まい）</div>
                <div className="flex gap-4 mt-2">
                  <Btn onClick={buy} color="#16a34a" light="#dcfce7" className="text-3xl px-10">かう</Btn>
                  <Btn onClick={() => setConfirm(null)} color="#64748b" light="#f1f5f9">やめる</Btn>
                </div>
              </div>
            </div>
          )}
          {award && (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={() => setAward(null)}>
              <div className="bg-white rounded-3xl p-8 flex flex-col items-center gap-3 pop">
                <div className="text-7xl">🏆</div>
                <div className="text-4xl font-bold text-amber-600">「{award}」</div>
                <div className="text-2xl">の しょうごうを もらったよ！</div>
                <Btn onClick={() => setAward(null)} color="#16a34a" light="#dcfce7">やったね！</Btn>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ZukanScreen({ progress }) {
      const kibo = useKibo();
      const own = new Set(progress.items);
      const titles = titlesOf(progress.items);
      useEffect(() => { kibo.say(`ずかんだよ。ぜんぶで ${ALL_ITEMS.length}こ。いま ${progress.items.length}こ あつまったよ。`); }, []);
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">
          <KiboBar size={90} compact />
          <div className="text-2xl font-bold">あつめた もの：{progress.items.length} / {ALL_ITEMS.length}</div>
          {titles.length > 0 && <div className="flex flex-wrap gap-2 justify-center">{titles.map(t => <span key={t} className="bg-amber-100 border-2 border-amber-400 rounded-full px-4 py-1 text-xl font-bold">🏆 {t}</span>)}</div>}
          {ITEM_CATS.map(c => {
            const n = c.items.filter(it => own.has(it.id)).length;
            return (
              <div key={c.id} className="w-full bg-white rounded-3xl shadow-sm p-3">
                <div className="text-2xl font-bold mb-2">{c.icon} {c.name} <span className="text-lg text-slate-500">{n} / {c.items.length}</span> {n === c.items.length && <span className="text-amber-600">🏆 {c.title}</span>}</div>
                <div className="grid grid-cols-5 sm:grid-cols-10 gap-2">
                  {c.items.map(it => (
                    <button key={it.id} onClick={() => own.has(it.id) ? kibo.say(it.n) : kibo.say('まだ もって いないよ。おみせで かえるよ。')}
                      className={`rounded-2xl border-2 aspect-square flex flex-col items-center justify-center ${own.has(it.id) ? 'bg-amber-50' : 'bg-slate-100 border-slate-200'}`} style={own.has(it.id) ? { borderColor: tierBorder(it), borderWidth: it.tier ? 3 : 2 } : {}}>
                      <ItemPic it={it} size={44} dark={!own.has(it.id)} />
                      <span className="text-xs font-bold leading-tight text-center">{own.has(it.id) ? it.n : '？'}</span>
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function GarageScreen({ progress, onChange }) {
      const kibo = useKibo();
      const own = new Set(progress.items);
      const parts = ALL_ITEMS.filter(it => it.slot);
      const eq = progress.equip || {};
      useEffect(() => { kibo.say('ガレージだよ。ロボットの いろを かえたり、おみせで かった ものを つけたり できるよ。'); }, []);
      const set = (slot, v) => { Sound.tap(); onChange({ equip: { ...eq, [slot]: v } }); };
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">
          <KiboBar size={90} compact />
          <div className="flex gap-4 w-full items-start flex-wrap justify-center">
            <div className="bg-white rounded-3xl p-4 flex flex-col items-center sticky top-16"><Robot color={progress.color} equip={eq} size={240} happy withBg />
              {eq.hat && <div className="text-sm text-slate-500 mt-1">ぼうしを かぶると アンテナは かくれるよ</div>}</div>
            <div className="flex-1 min-w-[320px] flex flex-col gap-3">
              <div className="bg-white rounded-3xl p-3">
                <div className="text-2xl font-bold mb-2">🎨 いろ <span className="text-base text-slate-500">（「からだ」の もようを つけて いる ときは、もようが さきに でるよ）</span></div>
                <div className="flex flex-wrap gap-2">
                  {ROBO_COLORS.map(c => <button key={c.id} onClick={() => { Sound.tap(); onChange({ color: c.id }); }}
                    className={`w-14 h-14 rounded-full border-4 ${progress.color === c.id ? 'border-slate-800 scale-110' : 'border-white shadow'}`} style={{ background: c.c }} aria-label={c.n} />)}
                </div>
              </div>
              {SLOTS.map(([slot, label]) => {
                const mine = parts.filter(it => it.slot === slot && own.has(it.id));
                return (
                  <div key={slot} className="bg-white rounded-3xl p-3">
                    <div className="text-2xl font-bold mb-2">{label}</div>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={() => set(slot, null)} className={`btn3d rounded-2xl border-4 px-3 py-2 text-lg font-bold ${!eq[slot] ? 'border-sky-500 bg-sky-100' : 'border-slate-200 bg-white'}`}>{slot === 'bg' || slot === 'acc' || slot === 'hat' ? 'なし' : 'ふつう'}</button>
                      {mine.map(it => <button key={it.id} onClick={() => set(slot, it.v)} className={`btn3d rounded-2xl border-4 px-3 py-1 text-lg font-bold flex items-center gap-1 ${eq[slot] === it.v ? 'border-sky-500 bg-sky-100' : 'border-slate-200 bg-white'}`}><span className="text-2xl">{it.e}</span>{it.n}</button>)}
                      {!mine.length && <span className="text-slate-400 self-center">おみせの「{ITEM_CATS.filter(c => c.robo && c.items.some(x => x.slot === slot)).pop().name}」で かえるよ</span>}
                    </div>
                  </div>
                );
              })}

    // =====================================================================
    // 17. アプリ ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [planet, setPlanet] = useState(null);
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [kibo, setKibo] = useState({ text: '', mood: 'normal', talking: false });
      const [coinFx, setCoinFx] = useState(0);
      const [soundOn, setSoundOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const [box, setBox] = useState(0);         // プレゼントボックス（0：とじて いる）
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const progRef = useRef(progress);
      progRef.current = progress;

      const kiboApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setKibo({ text, mood: opts.mood || 'normal', talking: true });
          Speech.say(opts.speech || text, () => { if (sayId.current === id) setKibo(p => ({ ...p, talking: false })); resolve(); });
        });
        return { say: run, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const kiboCtx = { ...kiboApi, ...kibo };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        ['glow', 'finger', 'romaji', 'game', 'sound'].forEach(k => { v[k] = v[k] !== false && v[k] !== 'false'; });
        v.count = Number(v.count) || 30;
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8; Speech.pitch = Number(v.pitch) || 1.1;
        Sound.on = v.sound; setSoundOn(Sound.on);
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        const recs = records.current; records.current = [];
        api.save({ name, progress: json, records: recs, stamp: nowStr(), time: Date.now() });
        return p;
      };
      const updateProg = (fn) => { progRef.current = fn(progRef.current); setProgress(progRef.current); return progRef.current; };

      const login = async (n) => {
        Sound.get(); Speech.say('');
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグ（全部開く・はってん）は スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) p = { ...p, unlockAll: !!a.unlockAll, hatten: !!a.hatten, flagT: a.flagT };
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false);
        setView({ v: 'map' });
      };
      const logout = () => { kiboApi.stop(); setName(null); setView({ v: 'login' }); };

      const startPractice = (st, left) => {
        setPlanet(null);
        records.current = [];
        const n = left || countOf(st, settings);
        if (st.id === '0' && !left) setView({ v: 'tutorial', st, n, key: uid() });
        else setView({ v: 'practice', st, n, intro: left ? 'つづきから はじめよう。' : st.intro, key: uid() });
      };
      const startGame = (st) => { setPlanet(null); records.current = []; setView({ v: 'speed', st }); };

      const onRecord = (r) => { records.current.push({ ...r, id: uid() }); };
      const onCoin = () => {
        setCoinFx(x => x + 1); Sound.coin();
        updateProg(p => {
          let boxN = (p.boxN || 0) + 1, boxes = p.boxes || 0;
          if (boxN >= 30) { boxN -= 30; boxes++; }
          return { ...p, coins: p.coins + 1, earned: p.earned + 1, boxN, boxes };
        });
      };
      const onSave = (part) => persist({ ...progRef.current, part });

      const finish = (st, result) => {
        let p = { ...progRef.current };
        let bonus = 0, stageClear = false, gameOpen = false;
        if (!result.game) {
          p.part = null;
          const acc = result.keys + result.miss ? Math.round((result.keys / (result.keys + result.miss)) * 100) : 100;
          const cpm = result.secs > 0 ? Math.round((result.keys / result.secs) * 60) : 0;
          const b = p.best[st.id] || { acc: 0, cpm: 0 };
          p.best = { ...p.best, [st.id]: { acc: Math.max(b.acc, acc), cpm: Math.max(b.cpm, cpm) } };
          if (!p.cleared[st.id]) {
            p.cleared = { ...p.cleared, [st.id]: 1 };
            bonus = 5; stageClear = true; gameOpen = settings.game;
            p.coins += bonus; p.earned += bonus;
          }
        }
        p = persist(p);
        let next = null;
        const ms = mainStages(), i = ms.findIndex(s => s.id === st.id);
        if (!st.hatten && i >= 0 && ms[i + 1] && stageOpen(p, ms[i + 1])) next = () => setPlanet(ms[i + 1]) || setView({ v: 'map' });
        setView({ v: 'result', st, result: { ...result, bonus, stageClear, gameOpen }, next });
        if (p.boxes > 0) setTimeout(() => setBox(1), 2600);
      };
      const quit = () => {
        kiboApi.stop();
        persist(progRef.current);
        setView({ v: 'map' });
      };
      const openBox = (it) => {
        const p = progRef.current;
        persist({ ...p, boxes: Math.max(0, p.boxes - 1), items: it ? [...p.items, it.id] : p.items, coins: it ? p.coins : p.coins + 10 });
      };
      const buy = (it) => {
        const p = progRef.current;
        if (p.coins < it.p || p.items.includes(it.id)) return;
        persist({ ...p, coins: p.coins - it.p, items: [...p.items, it.id] });
      };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const p = { ...progRef.current, unlockAll: !!sp.unlockAll, hatten: !!sp.hatten, flagT: sp.flagT, coins: sp.coins || 0, t: sp.t || Date.now() };
              if (!me.progress) Object.assign(p, newProgress());
              progRef.current = p; setProgress(p); safeStore.set(COPY_KEY(name), JSON.stringify(p));
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-indigo-800">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-slate-500 mt-2">{boot.error}</div></div>;

      const robot = { color: progress.color, equip: progress.equip || {} };
      const bar = (home = true) => (
        <TopBar name={name} coins={progress.coins} bump={coinFx} onHome={home ? () => { kiboApi.stop(); if (view.v === 'practice' || view.v === 'game') quit(); else setView({ v: 'map' }); } : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }} />
      );

      let body = null;
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (view.v === 'map') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <SpaceMap name={name} progress={progress} settings={settings} onPlanet={setPlanet}
            onContinue={() => { const st = currentStage(progress); const part = progress.part && progress.part.st === st.id ? progress.part : null; startPractice(st, part ? part.left : 0); }}
            onShop={() => setView({ v: 'shop' })} onZukan={() => setView({ v: 'zukan' })} onGarage={() => setView({ v: 'garage' })}
            onWelcome={(c) => { Sound.buy(); persist({ ...progRef.current, welcome: 1, color: c }); }} />
          {planet && <PlanetModal st={planet} progress={progress} settings={settings} onClose={() => setPlanet(null)}
            onPractice={() => startPractice(planet)} onResume={() => startPractice(planet, progress.part.left)} onGame={() => startGame(planet)} />}</div>;
      } else if (view.v === 'tutorial') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<div className="w-full flex justify-center p-3">
          <Tutorial settings={settings} onDone={() => setView({ ...view, v: 'practice', intro: 'f と j を おして みよう。', key: uid() })} /></div></div>;
      } else if (view.v === 'practice') {
        body = <div className="min-h-screen flex flex-col items-center relative">{bar()}<CoinFly show={coinFx} />
          <div className="w-full flex justify-center p-2"><Practice key={view.key} st={view.st} n={view.n} intro={view.intro} settings={settings}
            onRecord={onRecord} onCoin={onCoin} onSave={onSave} onFinish={(r) => finish(view.st, r)} onQuit={quit} /></div></div>;
      } else if (view.v === 'speed') {
        body = <div className="min-h-screen flex flex-col items-center space">{bar()}<div className="w-full flex justify-center p-3">
          <SpeedSelect st={view.st} speed={progress.speed} onBack={() => setView({ v: 'map' })}
            onStart={(s) => { updateProg(p => ({ ...p, speed: s })); setView({ v: 'game', st: view.st, speed: s, key: uid() }); }} /></div></div>;
      } else if (view.v === 'game') {
        body = <div className="min-h-screen flex flex-col items-center space relative">{bar()}<CoinFly show={coinFx} />
          <div className="w-full flex justify-center p-2"><Game key={view.key} st={view.st} n={countOf(view.st, settings)} speed={view.speed} settings={settings} robot={robot}
            onRecord={onRecord} onCoin={onCoin} onFinish={(r) => finish(view.st, r)} onQuit={quit} /></div></div>;
      } else if (view.v === 'result') {
        const st = view.st;
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<ResultScreen view={view} coins={progress.coins} robot={robot}
          onAgain={() => view.result.game ? startGame(st) : startPractice(st)}
          onGame={settings.game && progress.cleared[st.id] && !view.result.game ? () => startGame(st) : null}
          onMap={() => setView({ v: 'map' })} onNext={view.next} /></div>;
      } else if (view.v === 'shop') {
        body = <div className="min-h-screen flex flex-col">{bar()}<ShopScreen progress={progress} onBuy={buy} /></div>;
      } else if (view.v === 'zukan') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<ZukanScreen progress={progress} /></div>;
      } else if (view.v === 'garage') {
        body = <div className="min-h-screen flex flex-col items-center">{bar()}<GarageScreen progress={progress} onChange={(ch) => persist({ ...progRef.current, ...ch })} /></div>;
      }

      return (
        <KiboCtx.Provider value={kiboCtx}>
          {body}
          {box > 0 && name && <BoxModal key={box} progress={progress} onOpen={openBox} onClose={() => setBox(progRef.current.boxes > 0 ? box + 1 : 0)} />}
          {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
          {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
        </KiboCtx.Provider>
      );
    }

    window.TYPING_READY.then(() => {
      R = window.TYPING_ROMAJI;
      STAGES = window.TYPING_DATA.STAGES; ITEM_CATS = window.TYPING_DATA.ITEM_CATS; TIERS = window.TYPING_DATA.TIERS;
      ALL_ITEMS = ITEM_CATS.flatMap(c => c.items);
      ALL_ITEMS.forEach(it => { ITEM[it.id] = it; });
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:24px;line-height:1.8">もんだいの データを よみこめませんでした。<br>ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<div style="font-size:14px;color:#888">' + e.message + '</div></div>';
    });
  </script>
</body>
</html>
