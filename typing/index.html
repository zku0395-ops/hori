<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キャプテン・キーボの タイピング うちゅうりょこう</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'BIZ UDPGothic', sans-serif; background: #eef4ff; margin: 0; color: #1e293b;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    .btn3d { border-bottom-width: 6px; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; }
    .pop { animation: pop .45s cubic-bezier(.17,.89,.32,1.28) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .floaty { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .shake { animation: shake .4s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25%,75% { transform: translateX(-7px); } 50% { transform: translateX(7px); } }
    .glow { animation: glow 1.1s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 14px rgba(250,204,21,0); } }
    .keyglow { animation: keyglow 1s ease-in-out infinite; }
    @keyframes keyglow { 0%,100% { box-shadow: 0 0 0 3px #f59e0b, 0 0 10px 4px rgba(250,204,21,.9); } 50% { box-shadow: 0 0 0 3px #f59e0b, 0 0 22px 10px rgba(250,204,21,.5); } }
    .coinfly { animation: coinfly 1.1s ease-out forwards; }
    @keyframes coinfly { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }
    .bump { animation: bump .5s; }
    @keyframes bump { 0%,100% { transform: scale(1); } 40% { transform: scale(1.35); } }
    .spin { animation: spin 0.6s linear infinite; transform-origin: 100px 14px; }
    @keyframes spin { from { transform: scaleX(1); } 50% { transform: scaleX(-1); } to { transform: scaleX(1); } }
    .flame { animation: flame .25s ease-in-out infinite alternate; transform-origin: center top; }
    @keyframes flame { from { transform: scaleY(.85); } to { transform: scaleY(1.15); } }
    .wiggle { animation: wiggle 1s ease-in-out infinite; }
    @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
    .boom { animation: boom .6s ease-out forwards; }
    @keyframes boom { from { transform: translate(-50%,-50%) scale(.3); opacity: 1; } to { transform: translate(-50%,-50%) scale(1.8); opacity: 0; } }
    .space { background-color: #0b1640;
      background-image: radial-gradient(2px 2px at 20px 30px, #fff, transparent), radial-gradient(1.5px 1.5px at 120px 80px, #fde68a, transparent),
        radial-gradient(1px 1px at 200px 150px, #fff, transparent), radial-gradient(2px 2px at 300px 60px, #bfdbfe, transparent),
        radial-gradient(1px 1px at 380px 200px, #fff, transparent), radial-gradient(1.5px 1.5px at 90px 220px, #fff, transparent);
      background-size: 420px 260px; }
    .bubble:after { content: ''; position: absolute; left: -14px; top: 22px; border: 8px solid transparent; border-right: 8px solid #fff; }
    .kibo-img { filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#1e3a8a;font-weight:bold;">じゅんび ちゅう…</div>
  </div>

  <!-- 問題のデータ・ローマ字の しくみ・絵は GitHub Pages から読みこみます（このファイルを短くするため） -->
  <script>
    (function () {
      var h = location.hostname;
      var local = location.protocol === 'file:' || /github\.io$/.test(h) || h === 'localhost' || h === '127.0.0.1';
      window.TYPING_BASE = local ? '' : 'https://zku0395-ops.github.io/hori/typing/';
      var V = '1';
      window.TYPING_READY = Promise.all(['data/romaji.js', 'data/mondai.js'].map(function (p) {
        return new Promise(function (ok, ng) {
          var s = document.createElement('script');
          s.src = window.TYPING_BASE + p + '?v=' + V;
          s.onload = ok; s.onerror = function () { ng(new Error(p)); };
          document.head.appendChild(s);
        });
      }));
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;
    const APP_VERSION = '1.0.0';
    const BASE = window.TYPING_BASE;
    const IMG = BASE + 'img/';

    // =====================================================================
    //  1. 小さな道具
    // =====================================================================
    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const pickOne = (a) => a[Math.floor(Math.random() * a.length)];
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const nowStr = () => {
      const d = new Date(), p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const safeStore = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { window.localStorage.removeItem(k); } catch (e) {} },
    };
    const downloadText = (name, text, type) => {
      const blob = new Blob([text], { type: type || 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    };
    function useWidth() {
      const [w, setW] = useState(window.innerWidth);
      useEffect(() => { const f = () => setW(window.innerWidth); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f); }, []);
      return w;
    }

    // =====================================================================
    //  2. こえ と おと
    // =====================================================================
    const Speech = {
      rate: 0.8, pitch: 1.1, voice: null,
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = this.pitch;
          let done = false;
          const end = () => { if (!done) { done = true; onEnd && onEnd(); } };
          u.onend = end; u.onerror = end;
          // 声が出ない端末でも先へ進めるように、長さに合わせて待つ
          setTimeout(end, 1500 + text.length * 260 / this.rate);
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() { try { this.ok && window.speechSynthesis.cancel(); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }

    const Sound = {
      on: true, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      tone(freq, at, dur, type = 'triangle', vol = 0.16) {
        const c = this.get(); if (!c || !this.on) return;
        const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      // このアプリのための オリジナルの おと
      fanfare() {
        [[523, 0], [659, .12], [784, .24]].forEach(([f, t]) => this.tone(f, t, .16, 'triangle', .18));
        [523, 659, 784, 1046].forEach(f => this.tone(f, .4, .7, 'triangle', .12));
        this.tone(1318, .4, .7, 'sine', .08);
      },
      big() { // ほし クリア
        [[523, 0], [523, .15], [523, .3], [659, .45], [784, .75], [659, 1.0], [784, 1.15]].forEach(([f, t]) => this.tone(f, t, .2, 'triangle', .18));
        [523, 659, 784, 1046].forEach(f => this.tone(f, 1.35, 1.1, 'triangle', .12));
      },
      retry() { this.tone(330, 0, .14, 'sine', .06); this.tone(294, .12, .2, 'sine', .06); }, // まちがえたとき（小さな音）
      key() { this.tone(1200, 0, .04, 'sine', .035); },
      ok() { this.tone(880, 0, .08, 'triangle', .1); this.tone(1320, .07, .14, 'triangle', .1); },
      tap() { this.tone(660, 0, .06, 'sine', .07); },
      coin() { this.tone(988, 0, .08, 'square', .05); this.tone(1319, .08, .22, 'square', .05); },
      buy() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, i * .07, .18, 'square', .05)); },
      beam() { const c = this.get(); if (!c || !this.on) return; [1400, 1100, 800].forEach((f, i) => this.tone(f, i * .04, .08, 'sawtooth', .04)); this.tone(120, .1, .3, 'triangle', .14); },
    };

    // =====================================================================
    //  3. キーボードと ゆび
    // =====================================================================
    // 学校の Chromebook（JIS の キーボード）の ならび
    const KB_ROWS = [
      { off: 0, keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '^', '¥'] },
      { off: 0.5, keys: ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', '@', '['] },
      { off: 0.75, keys: ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';', ':', ']'] },
      { off: 1.25, keys: ['z', 'x', 'c', 'v', 'b', 'n', 'm', ',', '.', '/', '\\'] },
    ];
    const FINGER_OF = {};
    [['lp', '1qaz'], ['lr', '2wsx'], ['lm', '3edc'], ['li', '45rtfgvb'], ['ri', '67yuhjnm'], ['rm', '8ik,'], ['rr', '9ol.'], ['rp', '0-^¥p@[;:]/\\']]
      .forEach(([f, ks]) => [...ks].forEach(k => { FINGER_OF[k] = f; }));
    const FINGER_NAME = { lp: 'ひだりての こゆび', lr: 'ひだりての くすりゆび', lm: 'ひだりての なかゆび', li: 'ひだりての ひとさしゆび',
      ri: 'みぎての ひとさしゆび', rm: 'みぎての なかゆび', rr: 'みぎての くすりゆび', rp: 'みぎての こゆび' };
    // ゆびの いろ（こゆび＝ピンク、くすりゆび＝きいろ、なかゆび＝みどり、ひとさしゆび＝あお）
    const FC = { p: '#f472b6', r: '#facc15', m: '#4ade80', i: '#60a5fa', t: '#cbd5e1' };
    const FC_LIGHT = { p: '#fce7f3', r: '#fef9c3', m: '#dcfce7', i: '#dbeafe' };
    const HOME = 'asdfjkl;';
    const KEY_LABEL = (k) => k;  // Chromebook の キーと おなじ 小文字で 出す
    const KEY_NAME = { a: 'エー', b: 'ビー', c: 'シー', d: 'ディー', e: 'イー', f: 'エフ', g: 'ジー', h: 'エイチ', i: 'アイ', j: 'ジェー', k: 'ケー', l: 'エル', m: 'エム',
      n: 'エヌ', o: 'オー', p: 'ピー', q: 'キュー', r: 'アール', s: 'エス', t: 'ティー', u: 'ユー', v: 'ブイ', w: 'ダブリュー', x: 'エックス', y: 'ワイ', z: 'ゼット',
      ';': 'セミコロン', '-': 'のばす ぼう', ',': 'コンマ', '.': 'ピリオド',
      1: 'いち', 2: 'に', 3: 'さん', 4: 'よん', 5: 'ご', 6: 'ろく', 7: 'なな', 8: 'はち', 9: 'きゅう', 0: 'ゼロ' };
    const keyName = (k) => KEY_NAME[k] || k;
    // キーの ばしょを ことばで（ヒント1）
    function whereKey(k) {
      const r = KB_ROWS.findIndex(x => x.keys.includes(k));
      const c = r >= 0 ? KB_ROWS[r].keys.indexOf(k) : 0;
      const row = ['すうじの だん', 'うえの だん', 'まんなかの だん（ホームポジションの だん）', 'したの だん'][r] || '';
      const side = c < 5 ? 'ひだりがわ' : 'みぎがわ';
      if (k === 'f' || k === 'j') return `${KEY_LABEL(k)} は でっぱりの ある キー。${side}だよ。`;
      return `${KEY_LABEL(k)} は ${row}の ${side}に あるよ。`;
    }

    // 学校の Chromebook の キーボードと おなじ ならび（つかわない キーは うすい はいいろ）
    // x は u（ふつうの キーの はば）で ならべる。f は のこりの はばを ぜんぶ つかう キー
    const KB_FULL = [
      { h: 0.62, keys: [{ l: 'esc', w: 1.3 }, ...['←', '→', '↻', '⛶', '▭▯', '☀−', '☀＋', '🔇', '🔉', '🔊'].map(l => ({ l, w: 'eq' })), { l: '🔒', w: 'eq' }] },
      { h: 0.88, keys: [{ l: 'かな\n英数', w: 1, s: 0.24 }, ...'1234567890-^¥'.split(''), { l: '⌫', w: 'f' }] },
      { h: 0.88, keys: [{ l: '⇥', w: 1.5 }, ...'qwertyuiop@['.split(''), { l: '', w: 'f', enter: 'top' }] },
      { h: 0.88, keys: [{ l: '🔍', w: 1.75, s: 0.34 }, ...'asdfghjkl;:]'.split(''), { l: '↵', w: 'f', enter: 'bottom' }] },
      { h: 0.88, keys: [{ l: '⇧', w: 2.25 }, ...'zxcvbnm,./\\'.split(''), { l: '⇧', w: 'f' }] },
      { h: 0.88, keys: [{ l: 'ctrl', w: 1.5, s: 0.3 }, { l: 'alt', w: 1.5, s: 0.3 }, { l: '英数', w: 1, s: 0.26 }, { l: 'スペース', w: 'f', space: true },
        { l: 'かな', w: 1, s: 0.26 }, { l: 'alt', w: 1, s: 0.3 }, { l: 'ctrl', w: 1, s: 0.3 }, { l: 'arrows', w: 3 }] },
    ];
    const KB_W = 15.5;    // いちばん ながい だん（1〜0 の だん）の はば（u。すきまは べつ）
    const KB_GAP = 0.08;
    // キーボード ぜんたいの おおきさ（u から）
    const kbSize = (u) => {
      const g = Math.round(u * KB_GAP);
      return { w: Math.round(KB_W * u + 14 * g + g * 4), h: Math.round(KB_FULL.reduce((s, r) => s + r.h * u, 0) + g * 5 + g * 4) };
    };
    const kbUnit = (w, small) => Math.max(30, Math.min(small ? 46 : 54, Math.floor((w - (small ? 300 : 40)) / 16.8)));

    function Keyboard({ next, wrong, glow = true, finger = true, heat = null, u: uIn, home = false, bumps = false, small = false }) {
      const w = useWidth();
      const u = uIn || kbUnit(w, small);
      const g = Math.round(u * KB_GAP);
      const rowW = KB_W * u + 14 * g;
      const maxHeat = heat ? Math.max(1, ...Object.values(heat)) : 1;
      const keyBg = (k) => {
        const f = FINGER_OF[k];
        if (heat) { const v = (heat[k] || 0) / maxHeat; return !heat[k] ? '#ffffff' : `rgba(239,68,68,${0.15 + v * 0.75})`; }
        if (home && HOME.includes(k)) return FC[f[1]];
        return finger && f ? FC_LIGHT[f[1]] : '#ffffff';
      };
      // だんごとに キーの ばしょ（x・はば）を きめる
      let y = g * 2;
      const items = [];
      KB_FULL.forEach((row, ri) => {
        const hh = row.h * u;
        const ks = row.keys.map(k => typeof k === 'string' ? { k, w: 1 } : k);
        const n = ks.length;
        const fixed = ks.reduce((s, k) => s + (typeof k.w === 'number' ? k.w * u : 0), 0);
        const eqN = ks.filter(k => k.w === 'eq').length;
        const eqW = eqN ? (rowW - fixed - (n - 1) * g) / eqN : 0;
        const fW = rowW - fixed - (n - 1) * g;
        let x = g * 2;
        ks.forEach((k, ci) => {
          const kw = k.w === 'eq' ? eqW : k.w === 'f' ? fW : k.w * u;
          items.push({ ...k, key: `${ri}-${ci}`, x, y, kw, hh, ri });
          x += kw + g;
        });
        y += hh + g;
      });
      const { w: W, h: H } = kbSize(u);
      const dimSty = { background: '#e2e8f0', color: '#94a3b8', borderColor: '#cbd5e1' };
      return (
        <div className="relative bg-slate-300 rounded-2xl shrink-0" style={{ width: W, height: H }}>
          {items.map(it => {
            const base = { position: 'absolute', left: it.x, top: it.y, width: it.kw, height: it.hh };
            if (it.l === 'arrows') {
              const aw = (it.kw - 2 * g) / 3, ah = (it.hh - g) / 2;
              return [['←', 0, 1], ['↑', 1, 0], ['↓', 1, 1], ['→', 2, 1]].map(([l, cx, cy]) => (
                <div key={it.key + l} className="flex items-center justify-center font-bold"
                  style={{ ...dimSty, borderRadius: 6, borderBottom: '2px solid #cbd5e1', position: 'absolute', left: it.x + cx * (aw + g), top: it.y + cy * (ah + g), width: aw, height: ah, fontSize: u * 0.26 }}>{l}</div>
              ));
            }
            if (it.enter === 'top') {
              // ↵ キーは 2だんに またがる（うえの ぶぶんは したまで のばす）
              return <div key={it.key} style={{ ...base, ...dimSty, height: it.hh + g + 2, borderRadius: '8px 8px 0 0' }} />;
            }
            if (it.k == null) {
              const sty = it.space ? { background: next === ' ' && glow ? '#fde047' : '#ffffff', color: '#94a3b8', borderColor: '#94a3b8' } : dimSty;
              return (
                <div key={it.key} className="flex items-center justify-center font-bold border-b-4 text-center"
                  style={{ ...base, ...sty, borderRadius: it.enter === 'bottom' ? '8px 0 8px 8px' : 8, whiteSpace: 'pre', lineHeight: 1.05, fontSize: u * (it.s || (it.ri === 0 ? 0.3 : 0.4)) }}>{it.l}</div>
              );
            }
            const k = it.k;
            const isNext = next === k && glow;
            const isWrong = wrong === k;
            return (
              <div key={it.key} className={`rounded-lg flex items-center justify-center font-bold border-b-4 ${isNext ? 'keyglow' : ''} ${isWrong ? 'shake' : ''}`}
                style={{ ...base, fontSize: u * 0.46, borderColor: isWrong ? '#dc2626' : '#94a3b8', background: isWrong ? '#fecaca' : isNext ? '#fde047' : keyBg(k), zIndex: isNext ? 2 : 1 }}>
                {KEY_LABEL(k)}
                {(k === 'f' || k === 'j') && <span className="absolute rounded-full bg-slate-500" style={{ width: u * 0.3, height: 3, bottom: u * 0.12, ...(bumps ? { background: '#dc2626', height: 5 } : {}) }} />}
                {isWrong && <span className="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full w-6 h-6 text-sm flex items-center justify-center">✕</span>}
                {heat && heat[k] ? <span className="absolute bottom-0 right-1 text-xs text-rose-900">{heat[k]}</span> : null}
              </div>
            );
          })}
        </div>
      );
    }

    // 手の 絵（おす ゆびを 光らせる）
    function Hands({ finger: fingerKey, color = true, size = 260, home = false }) {
      const fing = (side, f, x, h, rot = 0) => {
        const id = side + f;
        const on = fingerKey === id;
        const dim = fingerKey && !on;
        const fill = color ? FC[f] : '#fcd9b6';
        return (
          <g key={id} transform={`rotate(${rot} ${x + 9} 92)`} opacity={dim ? 0.35 : 1}>
            <rect x={x} y={92 - h} width="18" height={h + 10} rx="9" fill={fill} stroke={on ? '#b45309' : '#94a3b8'} strokeWidth={on ? 4 : 1.5} />
            {on && <text x={x + 9} y={92 - h - 8} textAnchor="middle" fontSize="18">⬇</text>}
          </g>
        );
      };
      return (
        <svg viewBox="0 0 300 150" width={size} height={size * 0.5}>
          {/* ひだりて */}
          <rect x="22" y="88" width="92" height="56" rx="24" fill={color ? '#fde7d0' : '#fcd9b6'} stroke="#94a3b8" strokeWidth="1.5" />
          {fing('l', 'p', 26, 34)}{fing('l', 'r', 47, 48)}{fing('l', 'm', 68, 54)}{fing('l', 'i', 89, 46)}
          <g transform="rotate(50 112 118)"><rect x="104" y="96" width="18" height="40" rx="9" fill={color ? FC.t : '#fcd9b6'} stroke="#94a3b8" strokeWidth="1.5" /></g>
          {/* みぎて */}
          <rect x="186" y="88" width="92" height="56" rx="24" fill={color ? '#fde7d0' : '#fcd9b6'} stroke="#94a3b8" strokeWidth="1.5" />
          {fing('r', 'i', 193, 46)}{fing('r', 'm', 214, 54)}{fing('r', 'r', 235, 48)}{fing('r', 'p', 256, 34)}
          <g transform="rotate(-50 188 118)"><rect x="178" y="96" width="18" height="40" rx="9" fill={color ? FC.t : '#fcd9b6'} stroke="#94a3b8" strokeWidth="1.5" /></g>
          <text x="68" y="138" textAnchor="middle" fontSize="15" fontWeight="bold" fill="#475569">ひだり</text>
          <text x="232" y="138" textAnchor="middle" fontSize="15" fontWeight="bold" fill="#475569">みぎ</text>
          {home && <text x="150" y="30" textAnchor="middle" fontSize="15" fill="#475569">f と j に ひとさしゆび</text>}
        </svg>
      );
    }

    // =====================================================================
    //  4. データ（ほし・ごほうび）と もんだいづくり
    // =====================================================================
    let STAGES = [], ITEM_CATS = [], ALL_ITEMS = [], TIERS = [], R = null;
    const ITEM = {};
    const isHatten = (st) => !!st.hatten;
    const stageNo = (st) => st.hatten ? `はってん${st.id}` : st.id;

    // キー 1つの もんだい（ローマ字の しくみと おなじ つかいかた）
    function keyTyper(key) {
      const t = Object.create(R.Typer.prototype);
      t.text = key; t.u = [{ k: key, show: KEY_LABEL(key), opts: [key], isKey: true }]; t.i = 0; t.buf = ''; t.chosen = [];
      return t;
    }
    const makeTyper = (p) => p.kind === 'key' ? keyTyper(p.t) : new R.Typer(p.t);

    // 1かいぶんの もんだいを つくる
    function buildProblems(st, n) {
      const out = [];
      if (st.kind === 'key') {
        const keys = [...st.keys], rev = [...(st.review || '')];
        for (let i = 0; i < n; i++) {
          let k, tries = 0;
          do {
            // はじめの 3もんは、あたらしい キーを じゅんばんに
            if (i < Math.min(keys.length, 3) && st.id !== '0') k = keys[i];
            else k = pickOne(rev.length && Math.random() < 0.25 ? rev : keys);
            tries++;
          } while (tries < 10 && out.length >= 2 && out[out.length - 1].t === k && out[out.length - 2].t === k);
          out.push({ kind: 'key', t: k });
        }
        return out;
      }
      if (st.kind === 'kana') {
        const nw = Math.round(n / 3), nk = n - nw;
        const kana = st.kanaList, rev = st.reviewList || [];
        let bag = [];
        for (let i = 0; i < nk; i++) {
          if (rev.length && Math.random() < 0.2) { out.push({ kind: 'kana', t: pickOne(rev) }); continue; }
          if (!bag.length) bag = shuffle(kana);
          out.push({ kind: 'kana', t: bag.pop() });
        }
        let wb = [];
        for (let i = 0; i < nw; i++) { if (!wb.length) wb = shuffle(st.words); const w = wb.pop(); out.push({ kind: 'word', t: w.w, e: w.e }); }
        return out;
      }
      let wb = [];
      for (let i = 0; i < n; i++) { if (!wb.length) wb = shuffle(st.words); const w = wb.pop(); out.push({ kind: st.kind, t: w.w, e: w.e }); }
      return out;
    }
    const sayOf = (p) => p.kind === 'key' ? keyName(p.t) : p.t;

    // =====================================================================
    //  5. しんちょく（進み具合）
    // =====================================================================
    const newProgress = () => ({ v: 1, t: 0, coins: 0, earned: 0, items: [], cleared: {}, best: {}, part: null, boxN: 0, boxes: 0,
      color: 'sky', equip: {}, speed: 0, unlockAll: false, hatten: false });
    function parseProgress(s) {
      let p = null;
      try { p = typeof s === 'string' ? (s ? JSON.parse(s) : null) : s; } catch (e) { p = null; }
      return { ...newProgress(), ...(p || {}) };
    }
    const stageIdx = (st) => STAGES.findIndex(s => s.id === st.id);
    const mainStages = () => STAGES.filter(s => !s.hatten);
    const stageOpen = (p, st) => {
      if (isHatten(st)) return !!(p.unlockAll || p.hatten);
      if (p.unlockAll) return true;
      const ms = mainStages(), i = ms.findIndex(s => s.id === st.id);
      return i <= 0 || !!p.cleared[ms[i - 1].id];
    };
    const currentStage = (p) => mainStages().find(st => stageOpen(p, st) && !p.cleared[st.id]) || mainStages()[mainStages().length - 1];
    const countOf = (st, settings) => st.count ? Math.min(st.count, Number(settings.count) || 30) : (Number(settings.count) || 30);

    // =====================================================================
    //  6. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    const LOG_HEADER = ['日時', 'なまえ', 'ほし', 'しゅるい', 'もんだい', 'けっか', 'まちがい', 'ヒント', 'まちがえた キー', 'まちがえた おと', 'うった キー', 'びょう', 'ID'];
    const DEFAULT_SETTINGS = { rate: 0.8, pitch: 1.1, font: 1, sound: true, count: 30, glow: true, finger: true, romaji: true, game: true };

    // まとめ（先生用）— コード.gs の aggregate_ と おなじ しくみ
    const emptyStu = () => ({ count: 0, ok: 0, keys: 0, miss: 0, pkeys: 0, psecs: 0, last: '', stages: {}, keyMiss: {}, soundMiss: {}, days: {} });
    function aggregate(rows) {
      const students = {}, classKey = {}, classSound = {};
      rows.forEach(r => {
        const name = String(r[1] || '').trim(); if (!name) return;
        const st = String(r[2]), kind = String(r[3]), ok = r[5] === '○' ? 1 : 0, miss = Number(r[6]) || 0;
        const keys = Number(r[10]) || 0, secs = Number(r[11]) || 0;
        const s = students[name] || (students[name] = emptyStu());
        const day = String(r[0] instanceof Date ? r[0].toISOString() : r[0]).slice(0, 10).replace(/-/g, '/');
        if (day > s.last) s.last = day;
        s.count++; s.ok += ok; s.keys += keys; s.miss += miss;
        const g = s.stages[st] || (s.stages[st] = [0, 0, 0, 0, 0, 0]);
        g[0]++; g[1] += ok; g[2] += keys; g[3] += miss;
        if (kind === 'れんしゅう' && secs > 0) {
          s.pkeys += keys; s.psecs += secs; g[4] += keys; g[5] += secs;
          const d = s.days[day] || (s.days[day] = [0, 0]); d[0] += keys; d[1] += secs;
        }
        String(r[8] || '').split('・').forEach(x => { const k = x.split('>')[0]; if (k) { s.keyMiss[k] = (s.keyMiss[k] || 0) + 1; classKey[k] = (classKey[k] || 0) + 1; } });
        String(r[9] || '').split('・').forEach(k => { if (k) { s.soundMiss[k] = (s.soundMiss[k] || 0) + 1; classSound[k] = (classSound[k] || 0) + 1; } });
      });
      return { students, classKey, classSound };
    }

    const Local = {
      key: 'kibo_typing_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}
        this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: { ...DEFAULT_SETTINGS } };
        return this.mem;
      },
      save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
    };

    const PENDING_KEY = 'kibo_typing_pending_v1';
    const COPY_KEY = (name) => 'kibo_typing_copy_' + name;
    const recRow = (stamp, name, r) => [stamp, name, r.stage, r.kind, r.problem, r.result, r.miss, r.hint, r.wrongKeys, r.wrongSounds, r.keys, r.secs, r.id];
    const api = {
      async init() {
        if (HAS_GAS) return gas('getInitData');
        const d = Local.data();
        return { students: d.roster, settings: { ...DEFAULT_SETTINGS, ...d.settings }, demo: true };
      },
      async student(name) {
        if (HAS_GAS) return gas('getStudent', name);
        return Local.data().progress[name] || '';
      },
      async sendOne(p) {
        if (HAS_GAS) return gas('saveResult', p);
        const d = Local.data();
        const old = parseProgress(d.progress[p.name]);
        const neu = parseProgress(p.progress);
        if (neu.t >= old.t) d.progress[p.name] = p.progress;
        const ids = new Set(d.log.map(r => r[12]));
        p.records.forEach(r => { if (!ids.has(r.id)) d.log.push(recRow(p.stamp, p.name, r)); });
        Local.save();
        return { ok: true };
      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす
      readQueue() { try { return JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) { return []; } },
      async save(payload) {
        const queue = api.readQueue().filter(q => !(q.name === payload.name && !q.records.length));
        queue.push({ ...payload, qid: uid() });
        safeStore.set(PENDING_KEY, JSON.stringify(queue));
        return api.flush();
      },
      pending() { return api.readQueue().length; },
      flushing: false,
      async flush() {
        if (api.flushing) return;
        api.flushing = true;
        try {
          for (let q = api.readQueue()[0]; q; q = api.readQueue()[0]) {
            await api.sendOne(q);
            safeStore.set(PENDING_KEY, JSON.stringify(api.readQueue().filter(x => x.qid !== q.qid)));
          }
        } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
        finally { api.flushing = false; }
      },
      async teacher(pin) {
        if (HAS_GAS) return gas('getTeacherData', pin);
        const d = Local.data();
        if (String(pin) !== String(d.pin)) return { ok: false };
        const agg = aggregate(d.log);
        return {
          ok: true, isDefaultPin: d.pin === '1234', demo: true, settings: { ...DEFAULT_SETTINGS, ...d.settings },
          students: d.roster.map(n => ({ name: n, progress: d.progress[n] || '', ...(agg.students[n] || emptyStu()) })),
          classKey: agg.classKey, classSound: agg.classSound,
        };
      },
      async setFlag(pin, name, key, val) {
        if (HAS_GAS) return gas('setFlag', pin, name, key, val);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p[key] = !!val; p.t = Date.now(); p.flagT = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async addCoins(pin, name, delta) {
        if (HAS_GAS) return gas('addCoins', pin, name, delta);
        const d = Local.data(); const p = parseProgress(d.progress[name]); p.coins = Math.max(0, p.coins + delta); p.t = Date.now();
        d.progress[name] = JSON.stringify(p); Local.save(); return { ok: true, progress: d.progress[name] };
      },
      async saveSettings(pin, s) {
        if (HAS_GAS) return gas('saveSettings', pin, s);
        const d = Local.data(); const { newPin, ...rest } = s;
        d.settings = { ...d.settings, ...rest }; if (newPin) d.pin = newPin; Local.save(); return { ok: true };
      },
      async logRows(pin) {
        if (HAS_GAS) return gas('getLogRows', pin);
        return { ok: true, rows: [LOG_HEADER, ...Local.data().log] };
      },
      async backup(pin) {
        if (HAS_GAS) return gas('getBackup', pin);
        const d = Local.data(); return { ok: true, data: { app: 'typing', roster: d.roster.map(n => [n, d.progress[n] || '']), settings: d.settings } };
      },
      async restore(pin, data) {
        if (HAS_GAS) return gas('restoreBackup', pin, data);
        const d = Local.data(); (data.roster || []).forEach(([n, p]) => { if (!d.roster.includes(n)) d.roster.push(n); d.progress[n] = p; }); Local.save(); return { ok: true };
      },
      async clear(pin, name) {
        if (HAS_GAS) return gas('clearRecords', pin, name);
        const d = Local.data();
        d.log = d.log.filter(r => name && r[1] !== name);
        (name ? [name] : d.roster).forEach(n => { delete d.progress[n]; safeStore.del(COPY_KEY(n)); });
        Local.save(); return { ok: true };
      },
    };

    // =====================================================================
    //  7. キャプテン・キーボ と ふきだし
    // =====================================================================
    const KiboCtx = createContext(null);
    const useKibo = () => useContext(KiboCtx);

    // 絵が よみこめない ときの キーボ（自作の 絵）
    function KiboSvg({ size }) {
      return (
        <svg viewBox="0 0 200 220" width={size} height={size}>
          <rect x="88" y="150" width="24" height="16" fill="#94a3b8" />
          <rect x="45" y="160" width="110" height="56" rx="20" fill="#1e3a8a" stroke="#0f172a" strokeWidth="3" />
          <path d="M100 166 L92 200 L100 210 L108 200 Z" fill="#facc15" />
          <rect x="40" y="62" width="120" height="92" rx="28" fill="#f8fafc" stroke="#334155" strokeWidth="3" />
          <rect x="54" y="82" width="92" height="56" rx="16" fill="#0f172a" />
          <circle cx="80" cy="106" r="9" fill="#67e8f9" /><circle cx="120" cy="106" r="9" fill="#67e8f9" />
          <path d="M84 124 Q100 134 116 124" stroke="#67e8f9" strokeWidth="4" fill="none" strokeLinecap="round" />
          <path d="M34 70 Q100 8 166 70 Z" fill="#1e3a8a" stroke="#0f172a" strokeWidth="3" />
          <rect x="30" y="62" width="140" height="14" rx="7" fill="#0f172a" />
          <path d="M100 30 l6 12 13 2 -9 9 2 13 -12 -6 -12 6 2 -13 -9 -9 13 -2 z" fill="#facc15" />
        </svg>
      );
    }
    // よみこめなかった 絵（かおの 絵が ない ときは ふつうの 絵、それも ない ときは 自作の 絵）
    const KIBO_MISSING = new Set();
    function Kibo({ mood = 'normal', size = 150, className = '' }) {
      const [, setErr] = useState(0);
      const want = mood === 'happy' ? 'kibo_happy.webp' : mood === 'think' ? 'kibo_think.webp' : 'kibo.webp';
      const file = !KIBO_MISSING.has(want) ? want : !KIBO_MISSING.has('kibo.webp') ? 'kibo.webp' : null;
      if (!file) return <div className={className} style={{ width: size, height: size }}><KiboSvg size={size} /></div>;
      return <img key={file} src={IMG + file} alt="キャプテン・キーボ" onError={() => { KIBO_MISSING.add(file); setErr(e => e + 1); }} className={`kibo-img select-none ${className}`} style={{ width: size, height: size, objectFit: 'contain' }} draggable={false} />;
    }
    function KiboBar({ size = 100, compact = false }) {
      const kibo = useKibo();
      return (
        <div className="flex items-center gap-2 w-full max-w-5xl">
          <button onClick={() => kibo.repeat()} className="shrink-0 active:scale-95 transition" aria-label="もういちど きく">
            <Kibo mood={kibo.mood} size={size} className={kibo.talking ? 'floaty' : ''} />
          </button>
          <div className={`relative bubble bg-white rounded-3xl shadow px-5 ${compact ? 'py-2 text-xl min-h-[52px]' : 'py-3 text-2xl min-h-[64px]'} font-bold leading-relaxed flex-1 border-2 border-sky-200`}>
            {kibo.text || '　'}
          </div>
          <button onClick={() => kibo.repeat()} className={`btn3d shrink-0 bg-sky-100 border-2 border-sky-500 text-sky-700 rounded-2xl px-3 ${compact ? 'py-1 text-base' : 'py-2 text-lg'} font-bold`}>🔊<br />もういちど</button>
        </div>
      );
    }

    // =====================================================================
    //  8. こどもの ロボット（自作の 絵。ぶひんを つけかえる）
    // =====================================================================
    const ROBO_COLORS = [
      { id: 'sky', c: '#7dd3fc', n: 'みずいろ' }, { id: 'blue', c: '#60a5fa', n: 'あお' }, { id: 'green', c: '#86efac', n: 'みどり' },
      { id: 'yellow', c: '#fde047', n: 'きいろ' }, { id: 'orange', c: '#fdba74', n: 'オレンジ' }, { id: 'pink', c: '#f9a8d4', n: 'ピンク' },
      { id: 'purple', c: '#c4b5fd', n: 'むらさき' }, { id: 'white', c: '#e5e7eb', n: 'しろ' },
    ];
    // ガレージで つけかえる ところ
    const SLOTS = [['body', 'からだ'], ['hat', 'ぼうし'], ['top', 'アンテナ'], ['eyes', 'め'], ['chest', 'むね'], ['arms', 'うで'], ['feet', 'あし'], ['acc', 'アクセサリ'], ['bg', 'はいけい']];
    // からだの もよう（おみせの「ロボットの からだ」）。g は もようの 中身
    function bodyPaint(body, c, id) {
      const P = (inner, w = 20, h = 20) => <pattern id={id} width={w} height={h} patternUnits="userSpaceOnUse">{inner}</pattern>;
      const L = (stops, x2 = 1, y2 = 1) => <linearGradient id={id} x1="0" y1="0" x2={x2} y2={y2}>{stops.map((s, i) => <stop key={i} offset={`${(i / (stops.length - 1)) * 100}%`} stopColor={s} />)}</linearGradient>;
      switch (body) {
        case 'stripe': return { def: P(<><rect width="20" height="20" fill={c} /><rect width="20" height="7" fill="#fff" opacity=".7" /></>), fill: `url(#${id})` };
        case 'dots': return { def: P(<><rect width="20" height="20" fill={c} /><circle cx="6" cy="6" r="4" fill="#fff" opacity=".8" /><circle cx="16" cy="16" r="4" fill="#fff" opacity=".8" /></>), fill: `url(#${id})` };
        case 'check': return { def: P(<><rect width="20" height="20" fill={c} /><rect width="10" height="10" fill="#fff" opacity=".55" /><rect x="10" y="10" width="10" height="10" fill="#fff" opacity=".55" /></>), fill: `url(#${id})` };
        case 'hearts': return { def: P(<><rect width="24" height="24" fill={c} /><path d="M12 19 C4 13 4 7 8 6 C10 6 12 8 12 9 C12 8 14 6 16 6 C20 7 20 13 12 19 Z" fill="#f472b6" /></>, 24, 24), fill: `url(#${id})` };
        case 'stars': return { def: P(<><rect width="26" height="26" fill="#1e3a8a" /><path d="M13 4 l2.6 5.4 6 .8 -4.4 4.1 1.1 5.9 -5.3 -2.9 -5.3 2.9 1.1 -5.9 -4.4 -4.1 6 -.8 z" fill="#facc15" /></>, 26, 26), fill: `url(#${id})`, line: '#0f172a' };
        case 'silver': return { def: L(['#f8fafc', '#94a3b8', '#e2e8f0', '#64748b']), fill: `url(#${id})`, line: '#334155' };
        case 'crystal': return { def: L(['#e0f2fe', '#7dd3fc', '#f0f9ff', '#38bdf8']), fill: `url(#${id})`, line: '#0369a1', op: 0.85 };
        case 'rainbow': return { def: L(['#f87171', '#fb923c', '#facc15', '#4ade80', '#60a5fa', '#a78bfa'], 1, 0), fill: `url(#${id})` };
        case 'galaxy': return { def: P(<><rect width="30" height="30" fill="#312e81" /><circle cx="5" cy="6" r="1.5" fill="#fff" /><circle cx="20" cy="12" r="1" fill="#fde68a" /><circle cx="12" cy="24" r="1.6" fill="#fff" /><circle cx="26" cy="26" r="1" fill="#c4b5fd" /><circle cx="24" cy="3" r="3" fill="#a855f7" opacity=".5" /></>, 30, 30), fill: `url(#${id})`, line: '#1e1b4b' };
        case 'diamond': return { def: L(['#ffffff', '#a5f3fc', '#f5d0fe', '#ffffff', '#bae6fd']), fill: `url(#${id})`, line: '#0e7490', sparkle: true };
        case 'gold': return { def: L(['#fef3c7', '#fbbf24', '#f59e0b', '#fde68a']), fill: `url(#${id})`, line: '#b45309' };
        default: return { def: null, fill: c };
      }
    }
    // はいけい（おみせの「ロボットの はいけい」）
    function RobotBg({ bg }) {
      const box = (fill, kids) => <g><rect x="-4" y="-6" width="208" height="242" rx="26" fill={fill} />{kids}</g>;
      const T = (x, y, s, e) => <text x={x} y={y} fontSize={s} textAnchor="middle">{e}</text>;
      const grad = (id, a, b) => <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={a} /><stop offset="100%" stopColor={b} /></linearGradient></defs>;
      switch (bg) {
        case 'sky': return <g>{grad('bgsky', '#7dd3fc', '#e0f2fe')}{box('url(#bgsky)', <>{T(30, 40, 30, '☁️')}{T(170, 70, 26, '☁️')}{T(160, 20, 22, '☀️')}</>)}</g>;
        case 'grass': return <g>{grad('bggr', '#bae6fd', '#f0fdf4')}{box('url(#bggr)', <><path d="M-4 180 Q100 150 204 180 L204 230 Q204 236 196 236 L4 236 Q-4 236 -4 228 Z" fill="#86efac" />{T(20, 214, 20, '🌼')}{T(182, 206, 20, '🌷')}{T(30, 30, 20, '🦋')}</>)}</g>;
        case 'sea': return <g>{grad('bgsea', '#7dd3fc', '#0369a1')}{box('url(#bgsea)', <>{T(24, 200, 24, '🐠')}{T(176, 120, 24, '🐟')}{T(170, 216, 22, '🐚')}{T(30, 60, 18, '🫧')}</>)}</g>;
        case 'sunset': return <g>{grad('bgsun', '#fb923c', '#fde68a')}{box('url(#bgsun)', <><circle cx="100" cy="150" r="60" fill="#f97316" opacity=".5" />{T(30, 40, 20, '🐦')}{T(176, 30, 18, '✨')}</>)}</g>;
        case 'forest': return <g>{grad('bgfo', '#bbf7d0', '#4ade80')}{box('url(#bgfo)', <>{T(20, 120, 40, '🌲')}{T(184, 150, 40, '🌳')}{T(180, 40, 30, '🌲')}{T(24, 224, 20, '🍄')}</>)}</g>;

    function Btn({ children, onClick, color = '#0284c7', light = '#e0f2fe', className = '', disabled, style }) {

    function CoinFly({ show }) {
      if (!show) return null;
      return <div key={show} className="coinfly fixed right-24 top-14 z-40 text-4xl pointer-events-none">🪙＋1</div>;
    }
    // キーボードで うつ まえに、がめんを タッチしてもらう
    function useFocusCheck() {
      const [lost, setLost] = useState(false);
      useEffect(() => {
        const t = setInterval(() => setLost(!document.hasFocus()), 600);
        return () => clearInterval(t);
      }, []);
      return lost;
    }
    function FocusBanner({ lost }) {
      if (!lost) return null;
      return <div className="fixed inset-x-0 top-24 z-40 flex justify-center pointer-events-none"><div className="bg-amber-100 border-4 border-amber-400 rounded-2xl px-6 py-3 text-2xl font-bold shadow-lg glow">👆 がめんを 1かい タッチしてから うってね</div></div>;
    }

    // もんだいの ひょうじ（かなと ローマ字）
    function ProblemView({ p, typer, romaji, hint, wrongAt, small = false }) {
      if (p.kind === 'key') {
        const k = p.t;
        return (
          <div className="flex flex-col items-center">
            <div className={`rounded-2xl bg-white border-4 border-b-8 border-slate-400 flex items-center justify-center font-bold ${wrongAt != null ? 'shake' : ''}`} style={{ width: small ? 90 : 130, height: small ? 90 : 120, fontSize: small ? 56 : 84 }}>{KEY_LABEL(k)}</div>
            <div className="text-xl mt-1 text-slate-500 font-bold">{keyName(k)}</div>
          </div>
        );
      }
      const big = p.kind === 'kana' ? (small ? 64 : 96) : p.kind === 'sent' ? (small ? 34 : 46) : (small ? 48 : 68);
      // ことばの とちゅうで 行が かわらないように、すきまで くぎった まとまりごとに ならべる
      const groups = [[]];
      typer.u.forEach((u, i) => { if (u.sp) groups.push([]); else groups[groups.length - 1].push(i); });
      return (
        <div className="flex flex-wrap items-end justify-center" style={{ rowGap: 8, columnGap: big * 0.45 }}>
          {groups.filter(g => g.length).map((g, gi) => <div key={gi} className="flex flex-nowrap items-end">{g.map(i => {
            const u = typer.u[i];
            const done = i < typer.i, cur = i === typer.i;
            const shown = typer.shown(i);
            const typed = cur ? typer.buf.length : done ? shown.length : 0;
            const showRomaji = romaji || (cur && hint >= 1) || done;
            return (
              <div key={i} className={`flex flex-col items-center px-0.5 ${cur && wrongAt === i ? 'shake' : ''}`}>
                <div className={`font-bold leading-none rounded-xl px-1 ${cur ? 'bg-yellow-100 ring-4 ring-yellow-300' : ''}`}
                  style={{ fontSize: big, color: done ? '#94a3b8' : '#0f172a' }}>{u.show}</div>
                <div className="font-bold tracking-wider mt-1" style={{ fontSize: Math.max(20, big * 0.42), minHeight: Math.max(20, big * 0.42) * 1.2, visibility: showRomaji ? 'visible' : 'hidden' }}>
                  {[...shown].map((ch, j) => (
                    <span key={j} style={{ color: j < typed ? (done ? '#94a3b8' : '#2563eb') : (cur && j === typed ? '#dc2626' : '#475569'),
                      textDecoration: cur && j === typed ? 'underline' : 'none', fontSize: cur && hint >= 3 ? '1.25em' : '1em' }}>{ch}</span>
                  ))}
                </div>
              </div>
            );
          })}</div>)}
        </div>
      );
    }

    // =====================================================================
    // 10. なかよし星の せつめい（はじめて キーボードを つかう）
    // =====================================================================
    function Tutorial({ onDone, settings }) {
      const kibo = useKibo();
      const [i, setI] = useState(0);
      const pages = [
        { t: 'これが キーボードだよ。もじや すうじの キーが たくさん ならんで いるね。', kb: {} },
        { t: 'f と j の キーを みて。ちいさな でっぱりが あるよ。ゆびで さわって みよう。', kb: { bumps: true } },
        { t: 'ひだりての ひとさしゆびを f に、みぎての ひとさしゆびを j に のせよう。ほかの ゆびも となりの キーに ならべるよ。', kb: { home: true }, hands: true },
        { t: 'これが ホームポジション。キーを おしたら、ゆびは ここに もどって くるよ。キーは やさしく ポンと おそう。', kb: { home: true }, hands: true },
      ];
      const pg = pages[i];
      useEffect(() => { kibo.say(pg.t); }, [i]);
      return (
        <div className="w-full max-w-5xl flex flex-col items-center gap-3">
          <KiboBar size={96} compact />
          <div className="bg-white rounded-3xl p-4 flex flex-col items-center gap-3 w-full">
            {pg.hands && <Hands color={settings.finger} size={300} home />}
            <Keyboard glow={false} finger={settings.finger && i >= 2} {...pg.kb} u={Math.max(28, Math.min(kbUnit(window.innerWidth, false), Math.floor((window.innerHeight - (pg.hands ? 450 : 300)) / 5.8)))} />
          </div>
          <div className="flex gap-4">
            {i > 0 && <Btn onClick={() => setI(i - 1)} color="#64748b" light="#f1f5f9">◀ もどる</Btn>}
            {i < pages.length - 1 ? <Btn onClick={() => setI(i + 1)} color="#16a34a" light="#dcfce7" className="text-3xl px-10">つぎへ ▶</Btn>
              : <Btn onClick={onDone} color="#16a34a" light="#dcfce7" className="text-3xl px-10">やって みる ▶</Btn>}
            <button onClick={onDone} className="text-lg underline text-slate-500">とばす</button>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 11. れんしゅう
    // =====================================================================
    // ヒント1：ことばで
    function hintWords(typer) {
      const u = typer.cur(); if (!u) return '';
      const nk = typer.next();
      if (u.isKey) return whereKey(u.k);
      const rom = typer.shown(typer.i);
      if (u.k === 'っ') return `ちいさい「っ」は、つぎの もじの はじめの キー（${KEY_LABEL(nk)}）を 2かい おすよ。`;
      if (u.k === 'ん') return '「ん」は n を 2かい おすよ。';
      if (u.k === 'ー') return 'のばす ぼう「ー」は、0 の みぎの キーだよ。';
      if (u.k === '。') return '「。」は ピリオド。m の 2つ みぎの キーだよ。';
      if (u.k === '、') return '「、」は コンマ。m の すぐ みぎの キーだよ。';
      if (u.k.length === 2) return `「${u.show}」は、${KEY_LABEL(rom[0])} の あとに y などが はいるよ。ローマ字を よく みてね。`;
      if (rom.length === 1) return `「${u.show}」は ${KEY_LABEL(rom)} の キー 1つだよ。`;
      return `「${u.show}」は、はじめに ${KEY_LABEL(rom[0])}、つぎに あいうえおの ${KEY_LABEL(rom[rom.length - 1])} だよ。`;
    }
    // ヒント3：つづりを 1もじずつ よむ
    function hintSpell(typer) {
      const u = typer.cur(); if (!u) return '';
      if (u.isKey) return `ひかって いる ${KEY_LABEL(u.k)} の キーを おそう。`;
      const rom = typer.shown(typer.i).slice(typer.buf.length) || typer.shown(typer.i);
      return `「${u.show}」は ${[...typer.shown(typer.i)].map(c => KEY_LABEL(c)).join('、')}。つぎは ${KEY_LABEL(rom[0])} だよ。`;
    }
    const hintSpeech = (text) => text.replace(/(^|[^A-Za-z])([A-Z])(?![A-Za-z])/g, (m, a, c) => a + keyName(c.toLowerCase()));

    function Practice({ st, n, intro, settings, onRecord, onCoin, onSave, onFinish, onQuit }) {
      const kibo = useKibo();
      const [problems] = useState(() => buildProblems(st, n));
      const [idx, setIdx] = useState(0);
      const [, force] = useState(0);
      const [wrong, setWrong] = useState(null);       // まちがえて おした キー
      const [wrongAt, setWrongAt] = useState(null);
      const [hint, setHint] = useState(0);            // いまの おとの ヒント
      const [unitMiss, setUnitMiss] = useState(0);
      const [busy, setBusy] = useState(false);
      const [imeWarn, setImeWarn] = useState(false);
      const lost = useFocusCheck();
      const typerRef = useRef(null);
      const stat = useRef(null);
      const total = useRef({ ok: 0, keys: 0, miss: 0, secs: 0 });
      const p = problems[idx];
      if (!typerRef.current || typerRef.current.pidx !== idx) {
        typerRef.current = makeTyper(p); typerRef.current.pidx = idx;
        // はやさ：キーと キーの あいだの じかんを たす（1かい 5びょうまで。かんがえて いる あいだは ふくめすぎない）
        stat.current = { miss: 0, hint: 0, wk: [], ws: [], last: Date.now(), ms: 0 };
      }
      const typer = typerRef.current;
      const nextKey = typer.next();

      useEffect(() => {
        // はじめは ほしの せつめい。あとは もんだいを よむ
        if (idx === 0 && intro) kibo.say(`${intro} さあ、はじめよう！`);
        else kibo.say(sayOf(p));
        setHint(0); setUnitMiss(0);
      }, [idx]);

      const giveHint = (lv) => {
        const level = Math.min(3, lv);
        setHint(level);
        stat.current.hint = Math.max(stat.current.hint, level);
        const u = typer.cur(); const nk = typer.next();
        if (level === 1) kibo.say(hintWords(typer), { mood: 'think', speech: hintSpeech(hintWords(typer)) });
        if (level === 2) kibo.say(`${FINGER_NAME[FINGER_OF[nk]] || ''}で ${KEY_LABEL(nk)} を おそう。`, { mood: 'think', speech: `${FINGER_NAME[FINGER_OF[nk]] || ''}で ${keyName(nk)} を おそう。` });
        if (level === 3) { const t = hintSpell(typer); kibo.say(t, { mood: 'think', speech: hintSpeech(t) }); }
        void u;
      };

      const finishProblem = () => {
        const s = stat.current;
        const secs = Math.round(s.ms / 100) / 10;
        const keys = typer.total();
        const ok = s.miss === 0 && s.hint === 0;
        onRecord({ stage: stageNo(st), kind: 'れんしゅう', problem: p.t, result: ok ? '○' : '△', miss: s.miss, hint: s.hint,
          wrongKeys: s.wk.join('・'), wrongSounds: s.ws.join('・'), keys, secs });
        total.current.ok += ok ? 1 : 0; total.current.keys += keys; total.current.miss += s.miss; total.current.secs += secs;
        onCoin();
        Sound.ok();
        setBusy(true);
        setTimeout(() => {
          setBusy(false);
          if (idx + 1 >= problems.length) onFinish({ ...total.current, n: problems.length });
          else {
            setIdx(idx + 1);
            if ((idx + 1) % 5 === 0) onSave({ st: st.id, left: problems.length - idx - 1 });
          }
        }, p.kind === 'sent' ? 700 : 450);
      };

      useEffect(() => {
        const onKey = (e) => {
          if (e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
          if (e.key === 'Process' || e.isComposing) { setImeWarn(true); return; }
          if (e.key.length !== 1 || e.key === ' ') return;
          e.preventDefault();
          if (busy || typer.done()) return;
          setImeWarn(false);
          const key = e.key.toLowerCase();
          const before = typer.i;
          const expect = typer.next();
          const now = Date.now();
          stat.current.ms += Math.min(5000, now - stat.current.last); stat.current.last = now;
          const r = typer.press(key);
          if (r.ok) {
            Sound.key();
            setWrong(null); setWrongAt(null);
            if (typer.i !== before) { setHint(0); setUnitMiss(0); }
            force(x => x + 1);
            if (typer.done()) finishProblem();
            return;
          }
          // まちがえた
          Sound.retry();
          const s = stat.current;
          s.miss++;
          s.wk.push(`${expect}>${key}`);
          const u = typer.cur();
          if (u && !u.isKey) s.ws.push(u.k);
          setWrong(key); setWrongAt(typer.i);
          setTimeout(() => setWrong(w => (w === key ? null : w)), 900);
          const m = unitMiss + 1;
          setUnitMiss(m);
          if (m === 1) kibo.say(`おしいね。いまの キーは ${KEY_LABEL(key)}。${KEY_LABEL(expect)} を さがそう。`, { mood: 'think', speech: `おしいね。${keyName(expect)} を さがそう。` });
          else if (m === 2) kibo.say('ヒントを おしても いいよ。', { mood: 'think' });
          else if (hint < 3) giveHint(3);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      const fingerKey = FINGER_OF[nextKey];
      const showGlow = settings.glow || hint >= 2 || wrong != null;
      return (
        <div className="w-full max-w-5xl flex flex-col items-center gap-2">
          <FocusBanner lost={lost} />
          <KiboBar size={84} compact />
          <div className="w-full flex items-center gap-2 text-lg font-bold">
            <span className="bg-white rounded-full px-3 py-1 border-2 border-sky-300">{st.planet}</span>
            <div className="flex-1 h-4 bg-white rounded-full overflow-hidden border-2 border-sky-200"><div className="h-full bg-sky-400 transition-all" style={{ width: `${(idx / problems.length) * 100}%` }} /></div>
            <span>{idx + 1} / {problems.length}</span>
          </div>
          <div className="w-full bg-white rounded-3xl shadow-sm p-3 flex items-center gap-3" style={{ minHeight: 190 }}>
            <div className="w-24 text-7xl text-center shrink-0">{p.e || ''}</div>
            <div className="flex-1 flex justify-center">
              <ProblemView p={p} typer={typer} romaji={settings.romaji} hint={hint} wrongAt={wrongAt} />
            </div>
            <div className="flex flex-col items-center gap-2 shrink-0">
              {(settings.finger || hint >= 2) && <Hands finger={fingerKey} color={settings.finger || hint >= 2} size={200} />}
              <div className="flex gap-2">
                <button onClick={() => giveHint(hint + 1)} className={`btn3d rounded-2xl border-2 border-amber-500 bg-amber-100 px-4 py-2 text-xl font-bold ${unitMiss >= 2 && hint < 2 ? 'glow' : ''}`}>💡 ヒント</button>
                <button onClick={onQuit} className="btn3d rounded-2xl border-2 border-slate-400 bg-slate-100 px-3 py-2 text-lg font-bold">やめる</button>
              </div>
            </div>
          </div>
          {imeWarn && <div className="bg-rose-100 border-2 border-rose-400 rounded-xl px-4 py-2 text-xl font-bold">にほんごの モードに なって いるよ。キーボードの「英数」キーを おしてね。</div>}
          <Keyboard next={showGlow ? nextKey : null} wrong={wrong} glow finger={settings.finger} u={Math.max(30, Math.min(kbUnit(window.innerWidth, false), Math.floor((window.innerHeight - 420) / 5.8)))} />
        </div>
      );
    }

    // =====================================================================
    // 12. いんせきを うちおとせ！（ゲーム）
    // =====================================================================
    const SPEEDS = [
      { n: 'とても ゆっくり', i: '🐢🐢', m: 0.5 }, { n: 'ゆっくり', i: '🐢', m: 0.75 }, { n: 'ふつう', i: '🙂', m: 1 },
      { n: 'はやい', i: '🐇', m: 1.35 }, { n: 'とても はやい', i: '🐇🐇', m: 1.8 },
    ];
    function SpeedSelect({ st, speed, onStart, onBack }) {
      const kibo = useKibo();
      const [s, setS] = useState(speed || 0);
      useEffect(() => { kibo.say(`${st.planet}の ちかくに いんせきが きたぞ！ もじを うって ビームで うちおとそう。はやさを えらんでね。`); }, []);
      return (
        <div className="w-full max-w-4xl flex flex-col items-center gap-4">
          <KiboBar size={100} />
          <div className="text-4xl font-bold text-white drop-shadow">☄️ いんせきを うちおとせ！</div>
          <div className="text-xl text-sky-100">したまで おちても だいじょうぶ。また うえから でて くるよ。</div>
          <div className="grid grid-cols-5 gap-3 w-full">
            {SPEEDS.map((x, i) => (
              <button key={i} onClick={() => { Sound.tap(); setS(i); }} className={`btn3d rounded-2xl border-4 py-4 flex flex-col items-center font-bold ${s === i ? 'bg-yellow-200 border-yellow-500' : 'bg-white border-slate-300'}`}>
                <span className="text-4xl">{x.i}</span><span className="text-lg mt-1">{x.n}</span>
              </button>
            ))}
          </div>
          <div className="flex gap-4">
            <Btn onClick={() => onStart(s)} color="#16a34a" light="#dcfce7" className="text-3xl px-12">▶ スタート</Btn>
            <Btn onClick={onBack} color="#64748b" light="#f1f5f9">もどる</Btn>
          </div>
        </div>
      );
    }

    function Game({ st, n, speed, settings, robot, onRecord, onCoin, onFinish, onQuit }) {
      const kibo = useKibo();
      const [, setTick] = useState(0);
      const [paused, setPaused] = useState(false);
      const [wrong, setWrong] = useState(null);
      const lost = useFocusCheck();
      const G = useRef(null);
      if (!G.current) {
        G.current = { list: buildProblems(st, n), meteors: [], spawned: 0, destroyed: 0, last: 0, fx: [], ok: 0, keys: 0, miss: 0, end: false, pauseAt: 0 };
      }
      const sp = SPEEDS[speed] || SPEEDS[0];
      const kindKey = st.kind === 'key' || st.kind === 'kana';
      const maxAt = kindKey ? [1, 1, 2, 2, 3][speed] : [1, 1, 1, 2, 2][speed];
      const durOf = (ty, p) => (p.kind === 'key' || p.kind === 'kana' ? 9000 : 5000 + ty.total() * 1100) / sp.m;
      useEffect(() => { kibo.say('いんせきを うちおとせ！'); }, []);
      const isPaused = paused || lost;

      useEffect(() => {
        let raf;
        const loop = () => {
          const g = G.current, now = performance.now();
          if (isPaused) { if (!g.pauseAt) g.pauseAt = now; raf = requestAnimationFrame(loop); return; }
          if (g.pauseAt) { const d = now - g.pauseAt; g.meteors.forEach(m => { m.t0 += d; }); g.last += d; g.pauseAt = 0; }
          g.meteors.forEach(m => {
            m.y = (now - m.t0) / m.dur;
            if (m.y >= 1) { m.t0 = now; m.y = 0; m.x = 12 + Math.random() * 76; m.fell++; }
          });
          const gap = kindKey ? 2600 / sp.m : 3500 / sp.m;
          if (g.meteors.length < maxAt && g.spawned < g.list.length && (now - g.last > gap || !g.meteors.length)) {
            const p = g.list[g.spawned++];
            const ty = makeTyper(p);
            g.meteors.push({ id: uid(), p, ty, x: 12 + Math.random() * 76, y: 0, t0: now, dur: durOf(ty, p), fell: 0, miss: 0, wk: [], ws: [], k0: 0 });
            g.last = now;
          }
          g.fx = g.fx.filter(f => now - f.t < 700);
          if (!g.end && g.destroyed >= g.list.length) {
            g.end = true;
            setTimeout(() => onFinish({ ok: g.ok, keys: g.keys, miss: g.miss, n: g.list.length, game: true }), 900);
          }
          setTick(t => t + 1);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, [isPaused]);

      // ねらう いんせき：うちかけの もの → いちばん したの もの
      const target = () => {
        const ms = G.current.meteors;
        return ms.find(m => m.ty.i > 0 || m.ty.buf) || ms.slice().sort((a, b) => b.y - a.y)[0] || null;
      };

      useEffect(() => {
        const onKey = (e) => {
          if (e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
          if (e.key.length !== 1 || e.key === ' ' || isPaused) return;
          e.preventDefault();
          const m = target(); if (!m) return;
          const g = G.current;
          const key = e.key.toLowerCase();
          const expect = m.ty.next();
          if (!m.k0) m.k0 = Date.now();
          const r = m.ty.press(key);
          if (r.ok) {
            Sound.key();
            if (m.ty.done()) {
              g.meteors = g.meteors.filter(x => x !== m);
              g.destroyed++;
              g.fx.push({ x: m.x, y: m.y, t: performance.now() });
              const ok = m.miss === 0;
              g.ok += ok ? 1 : 0; g.keys += m.ty.total();
              onRecord({ stage: stageNo(st), kind: 'ゲーム', problem: m.p.t, result: ok ? '○' : '△', miss: m.miss, hint: 0,
                wrongKeys: m.wk.join('・'), wrongSounds: m.ws.join('・'), keys: m.ty.total(), secs: Math.round((Date.now() - m.k0) / 100) / 10 });
              onCoin();
              Sound.beam();
            }
            return;
          }
          Sound.retry();
          m.miss++; g.miss++;
          m.wk.push(`${expect}>${key}`);
          const u = m.ty.cur(); if (u && !u.isKey) m.ws.push(u.k);
          setWrong(key); setTimeout(() => setWrong(w => (w === key ? null : w)), 700);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      const g = G.current;
      const tg = target();
      const nk = tg ? tg.ty.next() : null;
      // キーボードは Chromebook と おなじ 6だん。よこはばと たかさの りょうほうに おさまる 大きさに する
      const ku = Math.max(28, Math.min(kbUnit(window.innerWidth, true), Math.floor((window.innerHeight - 170 - 260) / 5.8)));
      const H = Math.max(260, Math.min(420, window.innerHeight - kbSize(ku).h - 170));
      return (
        <div className="w-full max-w-5xl flex flex-col items-center gap-2">
          <FocusBanner lost={lost} />
          <div className="w-full flex items-center gap-3 text-white font-bold text-xl">
            <span>☄️ {st.planet}</span><span className="flex-1" />
            <span>うちおとした：{g.destroyed} / {g.list.length}</span>
            <button onClick={() => setPaused(!paused)} className="btn3d rounded-xl border-2 border-sky-300 bg-sky-800 px-3 py-1">{paused ? '▶ つづける' : '⏸ ひとやすみ'}</button>
            <button onClick={onQuit} className="btn3d rounded-xl border-2 border-slate-300 bg-slate-700 px-3 py-1">やめる</button>
          </div>
          <div className="relative w-full rounded-3xl overflow-hidden border-4 border-indigo-300 space" style={{ height: H }}>
            {g.meteors.map(m => {
              const isT = m === tg;
              const showR = settings.romaji || m.miss >= 3;
              return (
                <div key={m.id} className="absolute flex flex-col items-center" style={{ left: `${m.x}%`, top: m.y * (H - 150) + 4, transform: 'translateX(-50%)' }}>
                  <div className="text-6xl leading-none" style={{ filter: isT ? 'drop-shadow(0 0 10px #fde047)' : 'none' }}>☄️</div>
                  <div className={`rounded-2xl px-3 py-1 ${isT ? 'bg-yellow-50 ring-4 ring-yellow-300' : 'bg-white/90'}`}>
                    <ProblemView p={m.p} typer={m.ty} romaji={showR} hint={0} small />
                  </div>
                </div>
              );
            })}
            {g.fx.map((f, i) => (
              <div key={i}>
                <svg className="absolute inset-0 pointer-events-none" width="100%" height="100%"><line x1="50%" y1={H - 70} x2={`${f.x}%`} y2={f.y * (H - 150) + 40} stroke="#fde047" strokeWidth="8" strokeLinecap="round" opacity=".85" /></svg>
                <div className="absolute boom text-7xl" style={{ left: `${f.x}%`, top: f.y * (H - 150) + 40 }}>💥</div>
              </div>
            ))}
            <div className="absolute left-1/2 -translate-x-1/2 bottom-0"><Robot {...robot} size={80} happy={g.fx.length > 0} /></div>
            {isPaused && !g.end && <div className="absolute inset-0 bg-black/50 flex items-center justify-center text-4xl font-bold text-white">{lost ? '👆 がめんを タッチしてね' : '⏸ ひとやすみ ちゅう'}</div>}
          </div>
          <Keyboard next={settings.glow || (tg && tg.miss >= 2) ? nk : null} wrong={wrong} glow finger={settings.finger} small u={ku} />
        </div>
      );
    }

    // =====================================================================
    // 13. けっか と プレゼントボックス
    // =====================================================================
    function ResultScreen({ view, coins, onAgain, onGame, onMap, onNext, robot }) {
      const kibo = useKibo();
      const r = view.result;
      const acc = r.keys + r.miss ? Math.round((r.keys / (r.keys + r.miss)) * 100) : 100;
      const cpm = r.secs > 0 ? Math.round((r.keys / r.secs) * 60) : 0;
      useEffect(() => {
        if (r.stageClear) { Sound.big(); kibo.say(`${view.st.planet}を クリア！ ボーナスで コイン 5まい！${r.gameOpen ? ' いんせきの ゲームも あそべるように なったよ。' : ''}`, { mood: 'happy' }); }
        else { Sound.fanfare(); kibo.say(r.game ? `いんせきを ${r.n}こ うちおとした！ すごいぞ！` : `${r.n}もん できたね！ よく がんばった！`, { mood: 'happy' }); }
      }, []);
      return (
        <div className="flex flex-col items-center gap-4 pt-3 w-full max-w-4xl">
          <div className="text-5xl font-bold text-amber-500 pop drop-shadow">{r.stageClear ? '🎉 ほし クリア！ 🎉' : r.game ? '☄️ ミッション せいこう！' : '⭐ よく できました！ ⭐'}</div>
          <div className="flex items-end gap-4"><Kibo mood="happy" size={170} className="floaty" /><Robot {...robot} size={120} happy withBg /></div>
          <div className="bg-white rounded-3xl shadow px-8 py-4 text-center text-2xl font-bold grid grid-cols-2 gap-x-8 gap-y-2">
            <div>{r.game ? 'うちおとした' : 'できた もんだい'}</div><div className="text-sky-600">{r.n}</div>
            <div>まちがえずに できた</div><div className="text-sky-600">{r.ok}</div>
            <div>せいかくさ</div><div className="text-sky-600">{acc}%</div>
            {!r.game && <><div>はやさ（1ぷんに おした キー）</div><div className="text-sky-600">{cpm}</div></>}
            <div>もらった コイン</div><div className="text-amber-500">🪙 {r.n + (r.bonus || 0)}</div>
            <div className="col-span-2 text-xl text-slate-500">いま もって いる コイン：🪙 {coins}</div>
          </div>
          <div className="flex gap-3 flex-wrap justify-center">
            {onNext && <Btn onClick={onNext} color="#16a34a" light="#dcfce7" className="text-3xl px-8">つぎの ほしへ ▶</Btn>}
            <Btn onClick={onAgain} color="#0284c7" light="#e0f2fe">🔁 もういちど</Btn>
            {onGame && <Btn onClick={onGame} color="#7c3aed" light="#ede9fe">☄️ いんせき ゲーム</Btn>}
            <Btn onClick={onMap} color="#64748b" light="#f1f5f9">🌌 ちずへ</Btn>
          </div>
        </div>
      );
    }

    function BoxModal({ progress, onOpen, onClose }) {
      const kibo = useKibo();
      const [item, setItem] = useState(null);
      useEffect(() => { kibo.say('30もん がんばったね。プレゼントボックスだよ！ おして あけてね。', { mood: 'happy' }); }, []);
      const open = () => {
        const own = new Set(progress.items);
        const rest = ALL_ITEMS.filter(it => !own.has(it.id));
        // ふつうが でやすく、でんせつは めったに でない
        let it = null;
        if (rest.length) {
          let r = Math.random() * rest.reduce((n, x) => n + TIERS[x.tier].w, 0);
          it = rest.find(x => (r -= TIERS[x.tier].w) < 0) || rest[rest.length - 1];
        }
        Sound.big();
        if (it && it.tier >= 2) setTimeout(() => Sound.fanfare(), 1500);
        setItem(it || { e: '🪙', n: 'コイン 10まい', coin: true });
        onOpen(it);
        kibo.say(it ? `${it.tier === 3 ? 'すごい！ でんせつの ' : it.tier === 2 ? 'やったね！ ちょうごうかな ' : ''}${it.n}が でて きた！ ずかんに いれたよ。` : 'ぜんぶ そろって いるから、コインを 10まい プレゼント！', { mood: 'happy' });
      };
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">

              <div className="text-2xl">はこを おしてね</div>
            </> : <>
              {!item.coin && <div className="scale-150 pop"><TierChip it={item} /></div>}
              <div className={`text-[120px] leading-none pop ${item.tier === 3 ? 'glow rounded-3xl' : ''}`}>{item.slot ? <Robot equip={{ [item.slot]: item.v }} size={130} withBg={item.slot === 'bg'} /> : item.e}</div>
              <div className="text-4xl font-bold text-amber-600">{item.n}</div>
              <div className="text-xl">{item.coin ? '' : 'ずかんに いれたよ！'}</div>
              <Btn onClick={onClose} color="#16a34a" light="#dcfce7" className="text-3xl px-10">やったね！</Btn>
            </>}
          </div>
        </div>
      );
    }

    // =====================================================================

    function LoginScreen({ students, onSelect, onTeacher, demo }) {
      return (
        <div className="min-h-screen flex flex-col items-center gap-5 p-6 space relative isolate">
          <SpaceBg />
          <div className="relative flex flex-col items-center gap-5 w-full">

            <Kibo size={170} className="floaty" />
            <div className="text-white">
              <div className="text-2xl font-bold text-sky-200">キャプテン・キーボの</div>
              <div className="text-5xl font-bold">タイピング うちゅうりょこう</div>

            </div>
          </div>
          {demo && <div className="bg-yellow-100 border-2 border-yellow-400 rounded-xl px-4 py-2 text-lg">おためしモード（スプレッドシートに つながって いません。きろくは この たんまつだけに のこります）</div>}
          <div className="text-3xl font-bold text-white drop-shadow">じぶんの なまえを おしてね</div>

    function TopBar({ name, coins, bump, onHome, onLogout, onTeacher, soundOn, onSound }) {

          <div className="flex-1" />
          <div key={bump} className={`flex items-center gap-1 bg-amber-100 border-2 border-amber-400 rounded-full px-4 py-1 text-2xl font-bold ${bump ? 'bump' : ''}`}>🪙 {coins}</div>
          <button onClick={onSound} className="text-3xl px-2" aria-label="おと">{soundOn ? '🔊' : '🔇'}</button>
          <button onClick={onTeacher} className="text-lg px-2 border-2 border-slate-300 rounded-xl bg-white">🔒</button>
          <button onClick={onLogout} className="text-lg px-3 py-1 border-2 border-slate-300 rounded-xl bg-white font-bold">おわる</button>
        </div>

    }

    function SpaceMap({ name, progress, settings, onPlanet, onContinue, onShop, onZukan, onGarage, onWelcome }) {
      const kibo = useKibo();
