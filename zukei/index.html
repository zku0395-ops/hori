<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トンガリはかせの ロボット けんきゅうじょ</title>

  <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'BIZ UDPGothic', sans-serif; background-color: #f0f9ff; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    rt { font-size: 0.5em; font-weight: 700; }
    svg { touch-action: none; }
    .animate-popup { animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes popup { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .animate-float { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .animate-shake { animation: shake 0.45s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
    .animate-hint { animation: hint 1.1s ease-in-out infinite; }
    @keyframes hint { 0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,.95); } 50% { box-shadow: 0 0 0 14px rgba(250,204,21,0); } }
    .animate-glowcard { animation: glowcard 1.1s ease-in-out infinite; }
    @keyframes glowcard { 0%,100% { box-shadow: 0 0 0 3px rgba(250,204,21,1); } 50% { box-shadow: 0 0 0 10px rgba(250,204,21,.35); } }
    .blink { animation: blink 0.9s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .talk { animation: talk 0.25s ease-in-out infinite alternate; transform-origin: 60px 84px; transform-box: view-box; }
    @keyframes talk { from { transform: scaleY(0.4); } to { transform: scaleY(1.3); } }
    .twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
    .bubble-up { animation: bubbleUp 5s linear infinite; }
    @keyframes bubbleUp { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-380px); opacity: 0; } }
    .levelup { animation: levelup 1.2s ease-in-out infinite alternate; }
    @keyframes levelup { from { transform: scale(1); filter: drop-shadow(0 0 0 #facc15); } to { transform: scale(1.06); filter: drop-shadow(0 0 18px #facc15); } }
    .confetti { position: absolute; top: -20px; width: 14px; height: 14px; animation: fall 2.2s linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
    .btn3d { border-bottom-width: 6px !important; transition: transform .08s, border-bottom-width .08s; }
    .btn3d:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px !important; }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding:60px;text-align:center;font-size:28px;color:#0369a1;font-weight:bold;">じゅんび ちゅう…</div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useContext, createContext } = React;

    const APP_VERSION = '1.0.0';

    // =====================================================================
    //  1. こまかい どうぐ
    // =====================================================================
    const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const uniq = (a) => [...new Set(a)];
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    // ふりがな：「{三角形|さんかくけい}」と 書くと ルビに なり、読み上げは「さんかくけい」に なる
    const RUBY_RE = /\{([^|}]+)\|([^}]+)\}/g;
    const speechOf = (s) => String(s || '').replace(RUBY_RE, '$2');
    const plainOf = (s) => String(s || '').replace(RUBY_RE, '$1');
    function Txt({ s }) {
      const str = String(s || ''), out = [];
      const re = new RegExp(RUBY_RE.source, 'g');
      let last = 0, m, k = 0;
      while ((m = re.exec(str))) {
        if (m.index > last) out.push(str.slice(last, m.index));
        out.push(<ruby key={k++}>{m[1]}<rt>{m[2]}</rt></ruby>);
        last = m.index + m[0].length;
      }
      if (last < str.length) out.push(str.slice(last));
      return <>{out}</>;
    }
    const SAN = '{三角形|さんかくけい}', SHI = '{四角形|しかくけい}', CHOKU = '{直線|ちょくせん}', TEN = 'ちょう{点|てん}';
    const HON = (n) => n + (n === 1 ? '{本|ぽん}' : n === 3 ? '{本|ぼん}' : '{本|ほん}');
    const KAZU = ['ぜろ', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな'];

    // =====================================================================
    //  2. 声と 音
    // =====================================================================
    const Speech = {
      ok: typeof window !== 'undefined' && 'speechSynthesis' in window,
      voice: null, rate: 0.85, pitch: 1.0,
      pickVoice() {
        if (!this.ok) return;
        const vs = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('ja'));
        this.voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
      },
      say(text, onEnd) {
        if (!this.ok || !text) { if (onEnd) setTimeout(onEnd, 200); return; }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'ja-JP'; if (this.voice) u.voice = this.voice;
          u.rate = this.rate; u.pitch = this.pitch;
          u.onend = () => onEnd && onEnd(); u.onerror = () => onEnd && onEnd();
          // Chrome は cancel の すぐ あとの speak を おとすことが あるので すこし まつ
          setTimeout(() => window.speechSynthesis.speak(u), 60);
        } catch (e) { if (onEnd) setTimeout(onEnd, 200); }
      },
      stop() { try { this.ok && window.speechSynthesis.cancel(); } catch (e) {} },
    };
    if (Speech.ok) { Speech.pickVoice(); window.speechSynthesis.onvoiceschanged = () => Speech.pickVoice(); }

    const Sound = {
      vol: 1, ctx: null,
      get() {
        if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      tone(freq, at, dur, type = 'sine', vol = 0.18) {
        const c = this.get(); if (!c || !this.vol) return;
        const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * this.vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
      },
      tap() { this.tone(660, 0, 0.06, 'sine', 0.08); },
      tick() { this.tone(880, 0, 0.09, 'triangle', 0.12); },
      snap() { this.tone(784, 0, 0.08, 'triangle', 0.14); this.tone(1175, 0.06, 0.14, 'triangle', 0.14); },
      // まちがえた ときは ブザーではなく ちいさな 音
      retry() { this.tone(392, 0, 0.16, 'sine', 0.1); this.tone(349, 0.13, 0.22, 'sine', 0.1); },
      hum() { this.tone(523, 0, 0.3, 'sine', 0.1); this.tone(494, 0.22, 0.35, 'sine', 0.1); },
      fanfare() {
        [[523, 0, 0.14], [659, 0.14, 0.14], [784, 0.28, 0.14], [1046, 0.42, 0.42], [784, 0.7, 0.12], [1046, 0.84, 0.7]].forEach(([f, t, d]) => this.tone(f, t, d, 'triangle', 0.2));
        [262, 330, 392].forEach(f => this.tone(f, 0.42, 1.0, 'sine', 0.07));
      },
      levelup() { [523, 587, 659, 698, 784, 880, 988, 1046, 1318].forEach((f, i) => this.tone(f, i * 0.08, 0.25, 'square', 0.06)); this.tone(1568, 0.8, 0.8, 'triangle', 0.16); },
      gift() { [1318, 1568, 2093, 1568, 2093].forEach((f, i) => this.tone(f, i * 0.1, 0.18, 'sine', 0.12)); },
    };

    // =====================================================================
    //  3. 図形の 計算
    // =====================================================================
    const ptOf = (n, i) => ({ x: i % n, y: Math.floor(i / n) });
    const idxOf = (n, x, y) => y * n + x;
    const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
    const area2 = (pts) => { let s = 0; pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length]; s += p.x * q.y - q.x * p.y; }); return s; };
    const areaOf = (pts) => Math.abs(area2(pts)) / 2;
    const onSeg = (p, q, r) => Math.min(p.x, q.x) <= r.x && r.x <= Math.max(p.x, q.x) && Math.min(p.y, q.y) <= r.y && r.y <= Math.max(p.y, q.y);
    function segHit(a, b, c, d) {
      const d1 = cross(c, d, a), d2 = cross(c, d, b), d3 = cross(a, b, c), d4 = cross(a, b, d);
      if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return true;
      return (d1 === 0 && onSeg(c, d, a)) || (d2 === 0 && onSeg(c, d, b)) || (d3 === 0 && onSeg(a, b, c)) || (d4 === 0 && onSeg(a, b, d));
    }
    // 形に なっているか：null（だいじょうぶ）／flat（ぺちゃんこ）／straight（へんが へる）／overlap（せんが かさなる）／cross（せんが まじわる）
    function polyProblem(pts) {
      const n = pts.length;
      for (let i = 0; i < n; i++) {
        const a = pts[(i + n - 1) % n], b = pts[i], c = pts[(i + 1) % n];
        if (cross(a, b, c) === 0) {
          const dot = (a.x - b.x) * (c.x - b.x) + (a.y - b.y) * (c.y - b.y);
          return n === 3 ? 'flat' : dot < 0 ? 'straight' : 'overlap';
        }
      }
      if (n === 4 && (segHit(pts[0], pts[1], pts[2], pts[3]) || segHit(pts[1], pts[2], pts[3], pts[0]))) return 'cross';
      if (area2(pts) === 0) return 'flat';
      return null;
    }
    const PROBLEM_NOTE = {
      flat: ['ぺちゃんこ', `ぺちゃんこだね。まっすぐな せんが 1{本|ぽん}に なって、かこめて いないよ。てんを 1つ えらびなおそう。`],
      straight: ['へんが3本', `てんが まっすぐ ならんで、へんが 3{本|ぼん}に なったよ。それだと ${SAN}だね。てんを えらびなおそう。`],
      overlap: ['せんが かさなった', 'せんが かさなって いるよ。てんを えらびなおそう。'],
      cross: ['せんが まじわった', 'せんが ぶつかって いるよ。てんを えらぶ じゅんばんを かえて みよう。'],
    };
    const shapeKey = (idxs) => [...idxs].sort((a, b) => a - b).join('-');
    // 点を 中心の まわりの 角度で ならべる（へこまない 形に なる）
    const sortAround = (n, idxs) => {
      const ps = idxs.map(i => ptOf(n, i)), cx = ps.reduce((s, p) => s + p.x, 0) / ps.length, cy = ps.reduce((s, p) => s + p.y, 0) / ps.length;
      return idxs.map((i, k) => [i, Math.atan2(ps[k].y - cy, ps[k].x - cx)]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
    };

    // 作る問題の 条件
    const COND = {
      any: { ok: () => true },
      big: { ok: (pts, sides) => areaOf(pts) >= (sides === 3 ? 6 : 9), prompt: (w) => `おおきな ${w}を つくろう。`, miss: ['ちいさすぎた', 'もう すこし おおきく しよう。はなれた てんを えらぶと おおきく なるよ。'] },
      small: { ok: (pts) => areaOf(pts) <= 1, prompt: (w) => `ちいさな ${w}を つくろう。`, miss: ['おおきすぎた', 'もっと ちいさく しよう。となりの てんを えらぶと ちいさく なるよ。'] },
      down: {
        ok: (pts) => { const minY = Math.min(...pts.map(p => p.y)); return pts.filter(p => p.y === minY).length === 2; },
        prompt: (w) => `さかさまの ${w}を つくろう。とがった ところが したに なるよ。`,
        miss: ['さかさまに ならなかった', 'うえの へんを よこに まっすぐ ひいて、とがった ところを したに しよう。'],
      },
      tilt: {
        ok: (pts) => pts.every((p, i) => { const q = pts[(i + 1) % pts.length]; return p.x !== q.x && p.y !== q.y; }),
        prompt: (w) => `へんが ぜんぶ ななめの ${w}を つくろう。`,
        miss: ['たて・よこの へんが あった', 'たてや よこに まっすぐな へんが あるね。ぜんぶの へんを ななめに しよう。'],
      },
    };

    function findPoly(n, sides, cond, made, tries = 6000) {
      const all = [...Array(n * n).keys()];
      for (let t = 0; t < tries; t++) {
        let idxs = shuffle(all).slice(0, sides);
        if (sides === 4) idxs = sortAround(n, idxs);
        const pts = idxs.map(i => ptOf(n, i));
        if (polyProblem(pts)) continue;
        if (!COND[cond].ok(pts, sides)) continue;
        if (made.includes(shapeKey(idxs))) continue;
        return idxs;
      }
      return null;
    }
    // 1本の 直線（a-b）に へんを 書き足す 答えを さがす
    function findAdd(n, sides, a, b, made, tries = 6000) {
      const all = [...Array(n * n).keys()].filter(i => i !== a && i !== b);
      for (let t = 0; t < tries; t++) {
        const mid = shuffle(all).slice(0, sides - 2);
        const idxs = [a, ...mid, b];
        if (polyProblem(idxs.map(i => ptOf(n, i)))) continue;
        if (made.includes(shapeKey(idxs))) continue;
        return idxs;
      }
      return null;
    }

    // =====================================================================
    //  4. 見せる 形（へんと ちょう点・みつける・どっちかな）
    // =====================================================================
    // cat：tri（三角形）・quad（四角形）・none（どちらでもない）
    // reason：r3・r4・curve・open・round・five（どっちかな の りゆう）
    const SHAPES = {
      'tri-up': { label: 'ふつうの三角形', cat: 'tri', pts: [[50, 10], [92, 86], [8, 86]] },
      'tri-down': { label: 'さかさまの三角形', cat: 'tri', pts: [[8, 14], [92, 14], [50, 90]] },
      'tri-thin': { label: 'ほそながい三角形', cat: 'tri', pts: [[50, 4], [66, 96], [34, 96]] },
      'tri-tilt': { label: 'かたむいた三角形', cat: 'tri', pts: [[12, 34], [88, 10], [62, 92]] },
      'tri-right': { label: '直角三角形', cat: 'tri', pts: [[14, 12], [14, 88], [88, 88]] },
      'tri-flat': { label: 'ひくい三角形', cat: 'tri', pts: [[4, 72], [96, 78], [36, 38]] },
      'sq': { label: '正方形', cat: 'quad', pts: [[16, 16], [84, 16], [84, 84], [16, 84]] },
      'rect': { label: '長方形', cat: 'quad', pts: [[4, 28], [96, 28], [96, 72], [4, 72]] },
      'diamond': { label: 'かたむいた四角形', cat: 'quad', pts: [[50, 4], [94, 50], [50, 96], [6, 50]] },
      'trap': { label: '台形', cat: 'quad', pts: [[30, 22], [70, 22], [94, 80], [6, 80]] },
      'irr': { label: 'いびつな四角形', cat: 'quad', pts: [[12, 18], [74, 8], [92, 82], [24, 70]] },
      'concave': { label: 'へこんだ四角形', cat: 'quad', pts: [[8, 92], [50, 6], [92, 92], [50, 62]] },
      'round-tri': { label: 'かどが丸い形（三角）', cat: 'none', reason: 'round', base: 'tri-up', mod: 'round' },
      'round-sq': { label: 'かどが丸い形（四角）', cat: 'none', reason: 'round', base: 'sq', mod: 'round' },
      'open-tri': { label: 'すきまがある形（三角）', cat: 'none', reason: 'open', base: 'tri-up', mod: 'open', side: 2 },
      'open-sq': { label: 'すきまがある形（四角）', cat: 'none', reason: 'open', base: 'sq', mod: 'open', side: 1 },
      'curve-tri': { label: '曲線がある形（三角）', cat: 'none', reason: 'curve', base: 'tri-up', mod: 'curve', side: 1 },
      'curve-sq': { label: '曲線がある形（四角）', cat: 'none', reason: 'curve', base: 'sq', mod: 'curve', side: 2 },
      'circle': { label: '円', cat: 'none', reason: 'curve', mod: 'circle' },
      'penta': { label: '五角形', cat: 'none', reason: 'five', pts: [[50, 6], [94, 38], [77, 92], [23, 92], [6, 38]] },
    };
    Object.entries(SHAPES).forEach(([k, s]) => {
      s.key = k;
      if (s.base) s.pts = SHAPES[s.base].pts;
      if (!s.reason) s.reason = s.cat === 'tri' ? 'r3' : s.cat === 'quad' ? 'r4' : s.reason;
    });
    const TRI_KEYS = ['tri-up', 'tri-down', 'tri-thin', 'tri-tilt', 'tri-right', 'tri-flat'];
    const QUAD_KEYS = ['sq', 'rect', 'diamond', 'trap', 'irr', 'concave'];

    // 少しだけ 大きさと 位置を かえて 同じ形に 見えすぎないように する
    function makeShape(key) {
      const s = SHAPES[key];
      const k = 0.88 + Math.random() * 0.12, dx = (Math.random() - 0.5) * 6, dy = (Math.random() - 0.5) * 6;
      const pts = s.pts ? s.pts.map(([x, y]) => [50 + (x - 50) * k + dx, 50 + (y - 50) * k + dy]) : null;
      return { ...s, pts };
    }
    const sidesOf = (sh) => sh.cat === 'tri' ? 3 : sh.cat === 'quad' ? 4 : sh.pts ? sh.pts.length : 0;

    const SIDE_COLORS = ['#ef4444', '#2563eb', '#16a34a', '#f59e0b', '#9333ea'];
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const centroid = (pts) => [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
    // 中心から 外へ むかって ずらした 位置（数字を 置く場所）
    const outward = (p, c, d) => { const vx = p[0] - c[0], vy = p[1] - c[1], l = Math.hypot(vx, vy) || 1; return [p[0] + vx / l * d, p[1] + vy / l * d]; };

    // 形の 線（path の d）
    function shapeD(sh) {
      const P = sh.pts;
      if (sh.mod === 'circle') return 'M 50 8 A 42 42 0 1 1 49.9 8 Z';
      if (sh.mod === 'round') {
        const n = P.length, R = 15;
        let d = '';
        for (let i = 0; i < n; i++) {
          const a = P[(i + n - 1) % n], b = P[i], c = P[(i + 1) % n];
          const la = Math.hypot(a[0] - b[0], a[1] - b[1]), lc = Math.hypot(c[0] - b[0], c[1] - b[1]);
          const p1 = [b[0] + (a[0] - b[0]) / la * R, b[1] + (a[1] - b[1]) / la * R], p2 = [b[0] + (c[0] - b[0]) / lc * R, b[1] + (c[1] - b[1]) / lc * R];
          d += `${i === 0 ? 'M' : 'L'} ${p1[0]} ${p1[1]} Q ${b[0]} ${b[1]} ${p2[0]} ${p2[1]} `;
        }
        return d + 'Z';
      }
      if (sh.mod === 'open') {
        const n = P.length, g = sh.side, a = P[g], b = P[(g + 1) % n];
        const s1 = [a[0] + (b[0] - a[0]) * 0.36, a[1] + (b[1] - a[1]) * 0.36], s2 = [a[0] + (b[0] - a[0]) * 0.64, a[1] + (b[1] - a[1]) * 0.64];
        let d = `M ${s2[0]} ${s2[1]} `;
        for (let k = 1; k <= n; k++) { const p = P[(g + k) % n]; d += `L ${p[0]} ${p[1]} `; }
        return d + `L ${s1[0]} ${s1[1]}`;
      }
      if (sh.mod === 'curve') {
        const n = P.length, g = sh.side, a = P[g], b = P[(g + 1) % n], c = centroid(P), m = mid(a, b);
        const ctl = outward(m, c, 26);
        let d = `M ${P[0][0]} ${P[0][1]} `;
        for (let i = 0; i < n; i++) {
          const q = P[(i + 1) % n];
          d += i === g ? `Q ${ctl[0]} ${ctl[1]} ${q[0]} ${q[1]} ` : `L ${q[0]} ${q[1]} `;
        }
        return d + 'Z';
      }
      return 'M ' + P.map(p => p.join(' ')).join(' L ') + ' Z';
    }
    // とくちょうの ある ところ（ヒントで 光らせる）
    function featureMarks(sh) {
      const P = sh.pts;

        }

        case 's5b': P.push(...makeClassify(['tri', 'quad', 'none'], [pick(TRI_KEYS), pick(QUAD_KEYS.slice(0, 5)), pick(QUAD_KEYS), 'round-sq', pick(['open-sq', 'curve-sq'])])); break;
        case 's5c': P.push(...makeClassify(['tri', 'quad', 'none'], [pick(['tri-down', 'tri-thin', 'tri-flat']), 'concave', 'circle', pick(['round-tri', 'round-sq']), pick(['open-tri', 'open-sq']), pick(['curve-tri', 'curve-sq'])])); break;
        case 's5x': P.push(...makeClassify(['tri', 'quad', 'none'], ['penta', 'penta', pick(TRI_KEYS), pick(QUAD_KEYS), pick(['round-sq', 'open-tri', 'curve-sq'])], true)); break;
        case 's6a': {
          const list = [...shuffle(ADD_GLOW.filter(g => g.sides === 3)).slice(0, 3), ...shuffle(ADD_GLOW.filter(g => g.sides === 4)).slice(0, 2)];
          list.forEach((g, i) => P.push({ type: 'add', n: 5, sides: g.sides, base: [P5(...g.a), P5(...g.b)], glow: g.mid.map(p => P5(...p)), pid: `かきたす（ひかる点）:${g.sides === 3 ? '三角形' : '四角形'}`, shape: `${g.sides === 3 ? '三角形' : '四角形'}をかきたす（ひかる点）`,
            prompt: i === 0 || i === 3 ? `あおい せんの はしの てんから はじめて、ひかって いる てんを とおり、もう いっぽうの はしまで せんを ひこう。${W(g.sides)}が できるよ。` : `ひかって いる てんを つかって ${W(g.sides)}を つくろう。` }));
          break;
        }
        case 's6b': case 's6c': {
          const sides = stepId === 's6b' ? 3 : 4;
          shuffle(ADD_BASES).slice(0, 4).forEach((b, i) => P.push({ type: 'add', n: 5, sides, base: [P5(...b[0]), P5(...b[1])], pid: `かきたす:${sides === 3 ? '三角形' : '四角形'}`, shape: `${sides === 3 ? '三角形' : '四角形'}をかきたす`,
            prompt: `あおい せんに へんを ${sides - 1}{本|ほん} かきたして、${W(sides)}を つくろう。はしの てんから はじめよう。` }));
          break;
        }
        case 's6x': {
          shuffle(ADD_BASES).slice(0, 3).forEach(b => P.push({ type: 'add', n: 5, sides: 3, twice: true, base: [P5(...b[0]), P5(...b[1])], pid: 'かきたす:ちがう三角形2つ', shape: '三角形を2つかきたす',
            prompt: `おなじ あおい せんを つかって、ちがう ${SAN}を 2つ つくろう。` }));
          break;
        }
        case 's7a': PUZZLES.s7a.forEach(z => P.push(tangramProb(z))); break;
        case 's7b': shuffle(PUZZLES.s7b).forEach(z => P.push(tangramProb(z))); break;
        case 's7c': P.push(tangramProb(PUZZLES.s7c[(plays || 0) % PUZZLES.s7c.length])); break;
        default: break;
      }
      return P;
    }
    const tangramProb = (z) => ({ type: 'tangram', z, pid: `タングラム:${z.id}`, shape: `タングラム（${z.id}）` });

    function makeFind(cat, mixed) {
      const tri = cat === 'tri';
      const hard = tri ? ['tri-down', 'tri-thin', 'tri-tilt', 'tri-flat'] : ['diamond', 'irr', 'concave', 'trap'];
      const pool = tri ? TRI_KEYS : QUAD_KEYS;
      const nT = 2 + Math.floor(Math.random() * 2);
      const targets = uniq([pick(hard), ...shuffle(pool)]).slice(0, nT);
      const other = tri ? shuffle(QUAD_KEYS).slice(0, mixed ? 2 : 1) : shuffle(TRI_KEYS).slice(0, mixed ? 2 : 1);
      const non = shuffle(tri ? ['round-tri', 'open-tri', 'curve-tri', 'circle'] : ['round-sq', 'open-sq', 'curve-sq', 'circle']).slice(0, 6 - nT - other.length);
      const cards = shuffle([...targets, ...other, ...non]).map((k, i) => ({ id: i, sh: makeShape(k), target: SHAPES[k].cat === cat }));
      return { type: 'find', cat, cards, pid: `みつける:${tri ? '三角形' : '四角形'}`, shape: `みつける（${tri ? '三角形' : '四角形'}）` };
    }

    const REASONS = {
      r3: `3{本|ぼん}の ${CHOKU}で かこまれて いるので ${SAN}`,
      r4: `4{本|ほん}の ${CHOKU}で かこまれて いるので ${SHI}`,
      curve: 'まがった せんが あるので どちらでもない',
      open: 'せんが つながって いないので どちらでもない',
      round: 'かどが まるく なって いるので どちらでもない',
      five: `5{本|ほん}の ${CHOKU}で かこまれて いるので どちらでもない`,
    };
    const REASON_LABEL = { r3: '3本の直線', r4: '4本の直線', curve: 'まがった線', open: 'つながっていない', round: 'かどが丸い', five: '5本の直線' };
    function reasonChoices(sh, adv) {
      const r = sh.reason;
      let others;
      if (r === 'r3') others = ['r4', pick(['curve', 'open'])];
      else if (r === 'r4') others = ['r3', pick(['open', 'round'])];
      else if (r === 'five') others = ['r4', 'curve'];
      else if (r === 'round') others = [pick(['open']), sh.base && SHAPES[sh.base].cat === 'tri' ? 'r3' : 'r4'];
      else if (r === 'curve') others = ['open', sh.base ? (SHAPES[sh.base].cat === 'tri' ? 'r3' : 'r4') : 'r3'];
      else others = [pick(['curve', 'round']), sh.base && SHAPES[sh.base].cat === 'tri' ? 'r3' : 'r4'];
      if (adv && r !== 'five' && Math.random() < 0.5) others[1] = 'five';
      return shuffle([r, ...others]);
    }
    function makeClassify(cats, keys, adv) {
      return shuffle(keys).map(k => { const sh = makeShape(k); return { type: 'classify', cats, sh, reasons: reasonChoices(sh, adv), pid: `どっち:${sh.label}`, shape: sh.label }; });
    }

    // =====================================================================
    //  8. すすみぐあい
    // =====================================================================
    const newProgress = () => ({ v: 1, done: {}, plays: {}, power: 0, items: [], equip: {}, stars: 0, unlockAll: false });
    function parseProgress(s) {
      if (!s) return newProgress();
      try { const p = { ...newProgress(), ...(typeof s === 'string' ? JSON.parse(s) : s) }; p.equip = p.equip || {}; return p; } catch (e) { return newProgress(); }
    }
    const normalSteps = (st) => st.steps.filter(s => !s.adv);
    const stageCleared = (p, st) => normalSteps(st).every(s => p.done[s.id]);
    const clearedStages = (p) => STAGES.filter(st => stageCleared(p, st)).length;
    const levelOf = (p) => 1 + clearedStages(p);
    const stageOpen = (p, st) => p.unlockAll || st.no === 0 || stageCleared(p, STAGES[st.no - 1]);
    function stepOpen(p, s, adv) {
      const st = s.stage;
      if (s.adv) return !!adv && stageOpen(p, st);
      if (p.unlockAll || p.done[s.id]) return true;
      if (!stageOpen(p, st)) return false;
      const i = st.steps.indexOf(s);
      return st.steps.slice(0, i).filter(x => !x.adv).every(x => p.done[x.id]);
    }
    const nextStep = (p) => ALL_STEPS.find(s => !s.adv && !p.done[s.id] && stepOpen(p, s, false)) || null;
    const bodyColor = (p) => (p.equip.color && ITEM[p.equip.color] && ITEM[p.equip.color].color) || '#e2e8f0';

    // =====================================================================
    //  9. データの ほぞん（スプレッドシート／おためしモード）
    // =====================================================================
    const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
    const gas = (fn, ...args) => new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
    const safeStore = {
      get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
    };

    const DEFAULT_SETTINGS = { rate: 0.85, pitch: 1.0, size: 'ふつう', vol: 'ふつう', adv: false };
    const SIZE_SCALE = { 'ふつう': 1, 'おおきい': 1.12, 'とても おおきい': 1.25 };
    const VOLUME = { 'ふつう': 1, 'ちいさい': 0.45, 'なし': 0 };
    function applySettings(s) {
      Speech.rate = Number(s.rate) || 0.85;
      Speech.pitch = Number(s.pitch) || 1.0;
      Sound.vol = VOLUME[s.vol] != null ? VOLUME[s.vol] : 1;
      document.documentElement.style.fontSize = (16 * (SIZE_SCALE[s.size] || 1)) + 'px';
    }

    // 先生用画面の まとめ（コード.gs の aggregate_ と おなじ しくみ）
    const LOG_COLS = ['日時', 'なまえ', 'ステージ', 'ステップ', 'もんだい', 'かたち', 'けっか', 'かいすう', 'ヒント', 'まちがい'];
    function aggregate(log) {
      const students = {}, classMiss = {}, classShapes = {};
      log.forEach(r => {
        const [t, name, , step, , shape, result, , , miss] = r;
        if (!name) return;
        const s = students[name] || (students[name] = { count: 0, ok: 0, last: '', steps: {}, shapes: {}, miss: {} });
        const ok = result === '○' ? 1 : 0;
        s.count++; s.ok += ok;
        const day = String(t).slice(0, 10);
        if (day > s.last) s.last = day;
        const st = s.steps[step] || (s.steps[step] = [0, 0]); st[0]++; st[1] += ok;
        if (shape) {
          const sh = s.shapes[shape] || (s.shapes[shape] = [0, 0]); sh[0]++; sh[1] += ok;
          const cs = classShapes[shape] || (classShapes[shape] = [0, 0]); cs[0]++; cs[1] += ok;
        }
        String(miss || '').split('、').map(x => x.trim()).filter(Boolean).forEach(m => {
          s.miss[m] = (s.miss[m] || 0) + 1; classMiss[m] = (classMiss[m] || 0) + 1;
        });
      });
      return { students, classMiss, classShapes };
    }

    // スプレッドシートに つながって いない ときの おためしモード
    const Local = {
      key: 'zukei_robot_local_v1', mem: null,
      data() {
        if (this.mem) return this.mem;
        let d = null; try { d = JSON.parse(safeStore.get(this.key)); } catch (e) {}
        this.mem = d || { roster: ['たろう', 'はなこ', 'ゆうき'], progress: {}, log: [], pin: '1234', settings: { ...DEFAULT_SETTINGS } };
        if (!this.mem.settings) this.mem.settings = { ...DEFAULT_SETTINGS };
        return this.mem;
      },
      save() { safeStore.set(this.key, JSON.stringify(this.mem)); },
    };

    const today = () => {
      const d = new Date(), p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

    const PENDING_KEY = 'zukei_robot_pending_v1';
    const api = {
      async init() {
        if (HAS_GAS) return gas('getInitData');
        const d = Local.data();
        return { students: d.roster, settings: d.settings, demo: true };
      },
      async student(name) {
        if (HAS_GAS) return gas('getStudent', name);
        return Local.data().progress[name] || '';
      },
      async sendOne(p) {
        if (HAS_GAS) return gas('saveResult', p);
        const d = Local.data();
        d.progress[p.name] = p.progress;
        p.records.forEach(r => d.log.push([p.stamp, p.name, r.stage, r.step, r.problem, r.shape, r.result, r.tries, r.hint, r.miss]));
        Local.save();
        return { ok: true };
      },
      // とどかなかった きろくは たまっておき、つぎの ときに おくりなおす
      async save(payload) {
        let queue = [];
        try { queue = JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) {}
        queue.push({ id: newId(), ...payload });
        safeStore.set(PENDING_KEY, JSON.stringify(queue));
        return api.flush();
      },
      flushing: false,
      async flush() {
        if (api.flushing) return;
        api.flushing = true;
        try {
          let queue = [];
          try { queue = JSON.parse(safeStore.get(PENDING_KEY)) || []; } catch (e) {}
          while (queue.length) {
            await api.sendOne(queue[0]);
            queue.shift();
            safeStore.set(PENDING_KEY, JSON.stringify(queue));
          }
        } catch (e) { console.warn('きろくを おくれませんでした。あとで おくりなおします。', e); }
        finally { api.flushing = false; }
      },
      async teacher(pin) {
        if (HAS_GAS) return gas('getTeacherData', pin);
        const d = Local.data();
        if (String(pin) !== d.pin) return { ok: false };
        return { ok: true, isDefaultPin: pin === '1234', demo: true, settings: d.settings,
          students: d.roster.map(n => ({ name: n, progress: d.progress[n] || '' })), log: d.log };
      },
      async setUnlock(pin, name, flag) {
        if (HAS_GAS) return gas('setUnlockAll', pin, name, flag);
        const d = Local.data();
        if (String(pin) !== d.pin) return { ok: false };
        const p = parseProgress(d.progress[name]); p.unlockAll = flag;
        d.progress[name] = JSON.stringify(p); Local.save();
        return { ok: true, progress: d.progress[name] };
      },
      async saveSettings(pin, s) {
        if (HAS_GAS) return gas('saveSettings', pin, s);
        const d = Local.data();
        if (String(pin) !== d.pin) return { ok: false };
        d.settings = { ...d.settings, ...s }; Local.save();
        return { ok: true, settings: d.settings };
      },
      async clearStudent(pin, name) {
        if (HAS_GAS) return gas('clearStudent', pin, name);
        const d = Local.data();
        if (String(pin) !== d.pin) return { ok: false };
        d.log = d.log.filter(r => r[1] !== name); d.progress[name] = ''; Local.save();
        return { ok: true };
      },
    };

      const body = p ? bodyColor(p) : '#e2e8f0';

    // =====================================================================
    // 12. 学習の 画面（1つの 問題）
    //   ctl.prompt(文)：はかせが 話す（🔊で もういちど 聞ける）
    //   ctl.say(文)：はかせが 話す
    //   ctl.mistake(記録, 文)：まちがい（ヒントの 回数に 入る）
    //   ctl.note(記録, 文)：まちがいに しない 気づき（ぺちゃんこ・せんが まじわる）
    //   ctl.correct()：せいかい
    // =====================================================================
    const ring = (x, y, r = 28, color = '#facc15') => (
      <circle cx={x} cy={y} r={r} fill="none" stroke={color} strokeWidth="7">
        <animate attributeName="r" values={`${r - 5};${r + 5};${r - 5}`} dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.45;1" dur="1.2s" repeatCount="indefinite" />
      </circle>
    );
    function findLine(n, dir, long) {
      for (let t = 0; t < 3000; t++) {
        const a = Math.floor(Math.random() * n * n), b = Math.floor(Math.random() * n * n);
        if (a === b) continue;
        const p = ptOf(n, a), q = ptOf(n, b), dx = q.x - p.x, dy = q.y - p.y;
        const kind = dy === 0 ? 'yoko' : dx === 0 ? 'tate' : 'naname';
        if (kind !== dir) continue;
        if (long && Math.max(Math.abs(dx), Math.abs(dy)) < n - 1) continue;
        return [a, b];
      }
      return null;
    }
    const DIR_HINT = {
      yoko: 'よこの せんは、ひだりと みぎに まっすぐ だよ。おなじ だんの てんを 2つ えらぼう。',
      tate: 'たての せんは、うえと したに まっすぐ だよ。おなじ れつの てんを 2つ えらぼう。',
      naname: 'ななめの せんは、かたむいて いるよ。だんも れつも ちがう てんを えらぼう。',
    };

    // ---- ドットを むすぶ（せん・三角形・四角形・かきたす） ----
    function DotBoard({ prob, hintLv, ctl, mem }) {
      const n = prob.n, S = 100, M = 60, size = (n - 1) * S + 2 * M;
      const XY = (i) => [M + (i % n) * S, M + Math.floor(i / n) * S];
      const isLine = prob.type === 'line', isAdd = prob.type === 'add', sides = prob.sides;
      const [path, setPath] = useState([]);
      const [bad, setBad] = useState(null);
      const [done, setDone] = useState(null);
      const [first, setFirst] = useState(null);
      const pathRef = useRef(path); pathRef.current = path;
      const lock = useRef(false), told = useRef(false);
      const W = sides === 3 ? SAN : SHI;
      const sol = useMemo(() => {
        if (isLine) return prob.glow || findLine(n, prob.dir, prob.long);
        if (!isAdd) return prob.glow || findPoly(n, sides, prob.cond, prob.diff ? mem.made : []);
        const [a, b] = prob.base;
        if (prob.glow) return [a, ...prob.glow, b];
        return findAdd(n, sides, a, b, first ? [first.key] : []);
      }, [first]);

      useEffect(() => { ctl.prompt(prob.prompt); }, []);
      useEffect(() => {
        if (!hintLv) return;
        let t;
        if (isLine) t = [prob.glow ? 'ひかって いる てんを 1つ おして、つぎに もう 1つの ひかって いる てんを おそう。' : DIR_HINT[prob.dir] + (prob.long ? 'はしから はしまで ひこう。' : ''),
          'てんせんの ように ひくと いいよ。', 'ぴかぴか して いる てんを おしてね。'][hintLv - 1];
        else if (isAdd) t = [`あおい せんの はしの てんから はじめて、てんを ${sides - 2}つ えらび、もう いっぽうの はしで とじよう。`,
          `てんせんの ように かきたすと ${W}に なるよ。`, 'ばんごうの じゅんばんに てんを おしてね。'][hintLv - 1];
        else t = [`てんを ${sides}つ えらんで、さいごに さいしょの てんを おすと ${W}が できるよ。`,
          'てんせんの かたちを みて、まねして みよう。', 'ばんごうの じゅんばんに てんを おして、さいごに 1ばんを おそう。'][hintLv - 1];
        ctl.say(t);
      }, [hintLv]);

      const finish = (idxs) => { setDone(idxs); mem.made.push(shapeKey(idxs)); ctl.correct(); };
      const fail = (idxs, back, ms = 1500) => { lock.current = true; setBad(idxs); setTimeout(() => { setBad(null); setPath(back); lock.current = false; }, ms); };

      const closePoly = (idxs, back) => {
        const pts = idxs.map(k => ptOf(n, k));
        const pr = polyProblem(pts);
        if (pr) { ctl.note(...PROBLEM_NOTE[pr]); fail(idxs, back, 2400); return; }
        if (!isAdd && !COND[prob.cond].ok(pts, sides)) { ctl.mistake(...COND[prob.cond].miss); fail(idxs, prob.cond === 'down' || prob.cond === 'tilt' ? [] : back); return; }
        const key = shapeKey(idxs);
        if ((prob.diff && mem.made.includes(key)) || (first && first.key === key)) { ctl.mistake('おなじ かたち', 'さっきと おなじ かたちだね。ちがう てんを えらんで みよう。'); fail(idxs, isAdd ? [] : []); return; }
        if (prob.twice && !first) {
          Sound.snap(); setFirst({ idxs, key }); setPath([]);
          ctl.prompt(`1つ できた！ こんどは おなじ あおい せんで、ちがう ${SAN}を つくろう。`);
          return;
        }
        finish(idxs);
      };

      const tap = (i) => {
        if (lock.current || done || ctl.frozen()) return;
        const cur = pathRef.current;
        if (isLine) {
          if (cur.length === 0) {
            if (prob.glow && !prob.glow.includes(i)) { ctl.say('ひかって いる てんを おしてね。'); return; }
            Sound.tap(); setPath([i]); return;
          }
          if (i === cur[0]) { Sound.tap(); setPath([]); return; }
          if (prob.glow && !prob.glow.includes(i)) { ctl.say('ひかって いる てんを おしてね。'); return; }
          Sound.tap();
          const a = ptOf(n, cur[0]), b = ptOf(n, i), dx = b.x - a.x, dy = b.y - a.y;
          setPath([cur[0], i]);
          if (!prob.glow) {
            const kind = dy === 0 ? 'yoko' : dx === 0 ? 'tate' : 'naname';
            if (kind !== prob.dir) { ctl.mistake(`${DIR_NAME[kind]}の線をひいた`, `それは ${DIR_NAME[kind]}の せんだね。${DIR_NAME[prob.dir]}の せんを ひこう。`); fail([cur[0], i], []); return; }
            if (prob.long && Math.max(Math.abs(dx), Math.abs(dy)) < n - 1) { ctl.mistake('みじかい線', 'もっと ながく、はしから はしまで ひこう。'); fail([cur[0], i], []); return; }
          }
          finish([cur[0], i]);
          return;
        }
        if (isAdd) {
          const [a, b] = prob.base;
          if (cur.length === 0) {
            if (i !== a && i !== b) { ctl.say('あおい せんの はしの てんから はじめよう。'); return; }
            Sound.tap(); setPath([i]); return;
          }
          const end = cur[0] === a ? b : a;
          if (i === cur[0] && cur.length === 1) { Sound.tap(); setPath([]); return; }
          if (i === end) {
            if (cur.length < sides - 1) { ctl.say(`まだ へんが たりないよ。てんを あと ${sides - 1 - cur.length}つ えらぼう。`); return; }
            Sound.tap(); closePoly([...cur, end], cur.slice(0, -1)); return;
          }
          if (cur.includes(i)) { ctl.say('その てんは もう えらんだよ。'); return; }
          if (cur.length === sides - 1) { ctl.say('さいごに、あおい せんの もう いっぽうの はしを おそう。'); return; }
          if (prob.glow && !prob.glow.includes(i)) { ctl.say('ひかって いる てんを おしてね。'); return; }
          Sound.tap(); setPath([...cur, i]);
          if (cur.length + 1 === sides - 1 && !told.current) { told.current = true; ctl.say('さいごに、あおい せんの もう いっぽうの はしを おそう。'); }
          return;
        }
        if (cur.length > 0 && i === cur[0]) {
          if (cur.length < sides) { if (cur.length >= 2) ctl.say(`まだ ${TEN}が たりないよ。てんを あと ${sides - cur.length}つ えらぼう。`); return; }
          Sound.tap(); closePoly(cur, cur.slice(0, -1)); return;
        }
        if (cur.includes(i)) { ctl.say('その てんは もう えらんだよ。'); return; }
        if (cur.length === sides) { ctl.say('さいしょの てんを おして、かたちを とじよう。'); return; }
        if (prob.glow && !prob.glow.includes(i)) { ctl.say('ひかって いる てんを おしてね。'); return; }
        Sound.tap(); setPath([...cur, i]);
        if (cur.length + 1 === sides && !told.current) { told.current = true; ctl.say('さいごに、さいしょの てんを おして とじよう。'); }
      };

      const ptsStr = (idxs) => idxs.map(i => XY(i).join(',')).join(' ');
      const expectClose = !isLine && !isAdd && path.length === sides;
      const addEnd = isAdd && path.length > 0 ? (path[0] === prob.base[0] ? prob.base[1] : prob.base[0]) : null;
      return (
        <div className="flex flex-col h-full items-center">
          <div className="flex-1 min-h-0 w-full flex justify-center">
            <svg viewBox={`0 0 ${size} ${size}`} className="h-full max-w-full" style={{ aspectRatio: '1 / 1' }}>
              <rect x="6" y="6" width={size - 12} height={size - 12} rx="24" fill="#f8fafc" stroke="#e2e8f0" strokeWidth="3" />
              {first && <polygon points={ptsStr(first.idxs)} fill="#fde68a" fillOpacity="0.7" stroke="#f59e0b" strokeWidth="9" strokeLinejoin="round" />}
              {isAdd && <line x1={XY(prob.base[0])[0]} y1={XY(prob.base[0])[1]} x2={XY(prob.base[1])[0]} y2={XY(prob.base[1])[1]} stroke="#0ea5e9" strokeWidth="16" strokeLinecap="round" />}
              {hintLv >= 2 && sol && !done && (isLine
                ? <line x1={XY(sol[0])[0]} y1={XY(sol[0])[1]} x2={XY(sol[1])[0]} y2={XY(sol[1])[1]} stroke="#fb923c" strokeWidth="8" strokeDasharray="16 14" strokeLinecap="round" />
                : <polygon points={ptsStr(sol)} fill="#fed7aa" fillOpacity="0.35" stroke="#fb923c" strokeWidth="8" strokeDasharray="16 14" strokeLinejoin="round" />)}
              {done && (isLine
                ? <line x1={XY(done[0])[0]} y1={XY(done[0])[1]} x2={XY(done[1])[0]} y2={XY(done[1])[1]} stroke="#16a34a" strokeWidth="12" strokeLinecap="round" />
                : <polygon points={ptsStr(done)} fill="#bbf7d0" stroke="#16a34a" strokeWidth="11" strokeLinejoin="round" />)}
              {!done && !bad && path.length > 1 && <polyline points={ptsStr(path)} fill="none" stroke="#2563eb" strokeWidth="11" strokeLinecap="round" strokeLinejoin="round" />}
              {bad && (isLine
                ? <line x1={XY(bad[0])[0]} y1={XY(bad[0])[1]} x2={XY(bad[1])[0]} y2={XY(bad[1])[1]} stroke="#f97316" strokeWidth="11" strokeDasharray="18 12" strokeLinecap="round" />
                : <polygon points={ptsStr(bad)} fill="#fed7aa" fillOpacity="0.5" stroke="#f97316" strokeWidth="11" strokeDasharray="18 12" strokeLinejoin="round" />)}
              {[...Array(n * n).keys()].map(i => {
                const [x, y] = XY(i), on = path.includes(i) || (done && done.includes(i));
                return <circle key={i} cx={x} cy={y} r={on ? 17 : 13} fill={on ? '#1d4ed8' : '#64748b'} />;
              })}
              {!done && prob.glow && prob.glow.filter(i => !path.includes(i)).map(i => <g key={'g' + i}>{ring(...XY(i))}</g>)}
              {!done && isAdd && path.length === 0 && prob.base.map(i => <g key={'b' + i}>{ring(...XY(i), 28, '#0ea5e9')}</g>)}
              {!done && !bad && expectClose && ring(...XY(path[0]), 30, '#22c55e')}
              {!done && !bad && isAdd && addEnd != null && path.length === sides - 1 && ring(...XY(addEnd), 30, '#22c55e')}
              {hintLv >= 3 && sol && !done && sol.map((i, k) => {
                const [x, y] = XY(i);
                return <g key={'h' + i}>{!path.includes(i) && ring(x, y, 30, '#fb923c')}<circle cx={x + 30} cy={y - 30} r="17" fill="#fb923c" /><text x={x + 30} y={y - 23} textAnchor="middle" fontSize="22" fontWeight="bold" fill="#fff">{k + 1}</text></g>;
              })}
              {[...Array(n * n).keys()].map(i => { const [x, y] = XY(i); return <circle key={'t' + i} data-dot={i} cx={x} cy={y} r="46" fill="transparent" onPointerDown={() => tap(i)} style={{ cursor: 'pointer' }} />; })}
            </svg>
          </div>
          {!isLine && !done && (
            <div className="flex gap-3 py-2">
              <Btn color="#475569" disabled={path.length === 0} onClick={() => { if (lock.current) return; Sound.tap(); setPath(p => p.slice(0, -1)); }}>↩ 1つ もどす</Btn>
              <Btn color="#475569" disabled={path.length === 0} onClick={() => { if (lock.current) return; Sound.tap(); setPath([]); }}>🗑 さいしょから</Btn>
            </div>
          )}
        </div>
      );
    }

    // ---- へんと ちょう点を かぞえる ----
    function CountTask({ prob, hintLv, ctl }) {
      const sh = prob.sh, P = sh.pts, N = P.length, c = centroid(P);
      const [phase, setPhase] = useState(prob.intro ? 'intro' : 'sides');
      const [sides, setSides] = useState([]);
      const [verts, setVerts] = useState([]);
      const [hl, setHl] = useState(null);
      const [shakeV, setShakeV] = useState(null);
      useEffect(() => {
        let alive = true;
        (async () => {
          if (prob.intro) {
            if (prob.first) {
              await ctl.say(`${SAN}を よく みてね。`);
              for (let i = 0; i < N && alive; i++) { setHl({ side: i }); await sleep(600); }
              if (!alive) return;
              setHl({ sides: true }); await ctl.say('まっすぐな せんの ところを「へん」と いうよ。');
              if (!alive) return;
              setHl({ verts: true }); await ctl.say(`かどの てんを「${TEN}」と いうよ。`);
            } else {
              setHl({ sides: true }); await ctl.say(`${SHI}でも、へんと ${TEN}を かぞえて みよう。`);
            }
            if (!alive) return;
            setHl(null);
          }
          setPhase('sides'); ctl.prompt('へんを ぜんぶ タップしよう。タップすると かずを かぞえるよ。');
        })();
        return () => { alive = false; };
      }, []);
      useEffect(() => {
        if (!hintLv) return;
        const v = phase === 'verts';
        ctl.say([v ? 'かどの とがった てんを タップしよう。' : 'まっすぐな せんを 1{本|ぽん}ずつ タップしよう。',
          v ? `まだ かぞえて いない ${TEN}に いろを つけたよ。` : 'まだ かぞえて いない へんに いろを つけたよ。',
          v ? `ぴかぴか して いる ${TEN}を タップしよう。` : 'ぴかぴか して いる へんを タップしよう。'][hintLv - 1]);
      }, [hintLv]);

      const tapSide = (i) => {
        if (ctl.frozen()) return;
        if (phase === 'verts') { ctl.mistake('へんを ちょう点と まちがえた', `そこは へんの とちゅうだよ。かどの てんが ${TEN}だよ。`); return; }
        if (phase !== 'sides') return;
        if (sides.includes(i)) { ctl.say('その へんは もう かぞえたよ。'); return; }
        Sound.tick();
        const nx = [...sides, i]; setSides(nx); ctl.say(KAZU[nx.length]);
        if (nx.length === N) {
          setPhase('wait');
          setTimeout(async () => { await ctl.say(`へんは ${HON(N)}！`); setPhase('verts'); ctl.prompt(`こんどは ${TEN}を ぜんぶ タップしよう。`); }, 700);
        }
      };
      const tapVert = (i) => {
        if (ctl.frozen()) return;
        if (phase === 'sides') { setShakeV(i); setTimeout(() => setShakeV(null), 500); ctl.mistake('ちょう点を へんと まちがえた', `そこは かどの ${TEN}だよ。まっすぐな せんの ところを タップしよう。`); return; }
        if (phase !== 'verts') return;
        if (verts.includes(i)) { ctl.say(`その ${TEN}は もう かぞえたよ。`); return; }
        Sound.tick();
        const nx = [...verts, i]; setVerts(nx); ctl.say(KAZU[nx.length]);
        if (nx.length === N) {
          setPhase('done');
          setTimeout(async () => { await ctl.say(`${TEN}は ${N}つ！`); ctl.correct(); }, 700);
        }
      };
      const nextSide = [...Array(N).keys()].find(i => !sides.includes(i));
      const nextVert = [...Array(N).keys()].find(i => !verts.includes(i));
      return (
        <div className="h-full flex items-center justify-center">
          <svg viewBox="-24 -24 148 148" className="h-full max-w-full" style={{ aspectRatio: '1 / 1' }}>
            <path d={shapeD(sh)} fill="#f1f5f9" stroke="#1e293b" strokeWidth="2.5" strokeLinejoin="round" />
            {P.map((p, i) => {
              const q = P[(i + 1) % N], m = mid(p, q), on = sides.includes(i);
              const glowAll = hl && (hl.sides || hl.side === i);
              const hint2 = hintLv >= 2 && phase === 'sides' && !on, hint3 = hintLv >= 3 && phase === 'sides' && i === nextSide;
              const lp = outward(m, c, 11);
              return (
                <g key={'s' + i}>
                  {(on || glowAll) && <line x1={p[0]} y1={p[1]} x2={q[0]} y2={q[1]} stroke="#2563eb" strokeWidth="4" strokeLinecap="round" className={glowAll && !on ? 'blink' : ''} />}
                  {hint2 && <line x1={p[0]} y1={p[1]} x2={q[0]} y2={q[1]} stroke={SIDE_COLORS[i]} strokeWidth="3.5" strokeDasharray="5 4" />}
                  {hint3 && <line x1={p[0]} y1={p[1]} x2={q[0]} y2={q[1]} stroke="#facc15" strokeWidth="7" strokeLinecap="round" className="blink" />}
                  {on && <g><circle cx={lp[0]} cy={lp[1]} r="7" fill="#2563eb" /><text x={lp[0]} y={lp[1] + 3.5} textAnchor="middle" fontSize="10" fontWeight="bold" fill="#fff">{sides.indexOf(i) + 1}</text></g>}
                  {hl && hl.sides && i === 0 && <text x={lp[0]} y={lp[1] + 4} textAnchor="middle" fontSize="11" fontWeight="bold" fill="#1d4ed8">へん</text>}
                </g>
              );
            })}
            {P.map((p, i) => {
              const on = verts.includes(i), lp = outward(p, c, 12);
              const hint2 = hintLv >= 2 && phase === 'verts' && !on, hint3 = hintLv >= 3 && phase === 'verts' && i === nextVert;
              const glowAll = hl && hl.verts;
              return (
                <g key={'v' + i} className={shakeV === i ? 'animate-shake' : ''}>
                  <circle cx={p[0]} cy={p[1]} r={on || glowAll ? 4.5 : 2.5} fill={on || glowAll ? '#dc2626' : '#1e293b'} className={glowAll && !on ? 'blink' : ''} />
                  {hint2 && <circle cx={p[0]} cy={p[1]} r="6" fill="none" stroke={SIDE_COLORS[i]} strokeWidth="2.5" />}
                  {hint3 && <circle cx={p[0]} cy={p[1]} r="8" fill="none" stroke="#facc15" strokeWidth="3.5" className="blink" />}
                  {on && <g><circle cx={lp[0]} cy={lp[1]} r="7" fill="#dc2626" /><text x={lp[0]} y={lp[1] + 3.5} textAnchor="middle" fontSize="10" fontWeight="bold" fill="#fff">{verts.indexOf(i) + 1}</text></g>}
                  {glowAll && i === 0 && <text x={lp[0]} y={lp[1] - 4} textAnchor="middle" fontSize="10" fontWeight="bold" fill="#b91c1c">ちょう点</text>}
                </g>
              );
            })}
            {P.map((p, i) => {
              const q = P[(i + 1) % N], a = [p[0] + (q[0] - p[0]) * 0.2, p[1] + (q[1] - p[1]) * 0.2], b = [p[0] + (q[0] - p[0]) * 0.8, p[1] + (q[1] - p[1]) * 0.8];
              return <line key={'ts' + i} data-side={i} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} stroke="transparent" strokeWidth="18" onPointerDown={() => tapSide(i)} style={{ cursor: 'pointer' }} />;
            })}
            {P.map((p, i) => <circle key={'tv' + i} data-vert={i} cx={p[0]} cy={p[1]} r="11" fill="transparent" onPointerDown={() => tapVert(i)} style={{ cursor: 'pointer' }} />)}
          </svg>
        </div>
      );
    }

    // ---- いくつ かな？ ----
    function QuizTask({ prob, hintLv, ctl }) {
      const sh = prob.sh, P = sh.pts, N = P.length, c = centroid(P), side = prob.ask === 'side';
      const [gone, setGone] = useState([]);
      const [count, setCount] = useState(0);
      const [glow, setGlow] = useState(false);
      const unit = (v) => side ? HON(v) : `${v}つ`;
      useEffect(() => { ctl.prompt(side ? 'この かたちの へんは なん{本|ぼん}かな？' : `この かたちの ${TEN}は いくつ かな？`); }, []);
      useEffect(() => {
        if (!hintLv) return;
        if (hintLv === 1) ctl.say('ゆびで さしながら、1つずつ かぞえよう。');
        if (hintLv === 2) ctl.say('いろを つけたよ。いろの かずを かぞえよう。');
        if (hintLv === 3) {
          let alive = true;
          (async () => {
            await ctl.say('いっしょに かぞえよう。');
            for (let k = 1; k <= N && alive; k++) { setCount(k); Sound.tick(); await ctl.say(KAZU[k]); }
            if (alive) { setGlow(true); ctl.say(`${unit(N)}だね。ひかって いる こたえを おそう。`); }
          })();
          return () => { alive = false; };
        }
      }, [hintLv]);
      const choose = (v) => {
        if (ctl.frozen() || gone.includes(v)) return;
        if (v === prob.ans) { ctl.correct(); return; }
        setGone(g => [...g, v]);
        ctl.mistake(`${v}${side ? '本' : 'つ'}とこたえた`, v > prob.ans ? 'おなじ ところを 2かい かぞえて いないかな？ もういちど かぞえて みよう。' : 'かぞえわすれた ところは ないかな？ もういちど かぞえて みよう。');
      };
      return (
        <div className="h-full flex flex-col lg:flex-row items-center justify-center gap-6">
          <svg viewBox="-24 -24 148 148" className="h-full max-h-[60vh] lg:max-h-full max-w-full" style={{ aspectRatio: '1 / 1' }}>
            <path d={shapeD(sh)} fill="#f1f5f9" stroke="#1e293b" strokeWidth="2.5" strokeLinejoin="round" />
            {P.map((p, i) => {
              const q = P[(i + 1) % N];
              if (side && hintLv >= 2) return <line key={i} x1={p[0]} y1={p[1]} x2={q[0]} y2={q[1]} stroke={SIDE_COLORS[i]} strokeWidth="4" strokeLinecap="round" />;
              if (!side && hintLv >= 2) return <circle key={i} cx={p[0]} cy={p[1]} r="5" fill={SIDE_COLORS[i]} />;
              return null;
            })}
            {!side && P.map((p, i) => <circle key={'d' + i} cx={p[0]} cy={p[1]} r="2.5" fill="#1e293b" />)}
            {[...Array(count).keys()].map(i => {
              const pos = side ? outward(mid(P[i], P[(i + 1) % N]), c, 11) : outward(P[i], c, 12);
              return <g key={'n' + i} className="animate-popup"><circle cx={pos[0]} cy={pos[1]} r="7" fill="#7c3aed" /><text x={pos[0]} y={pos[1] + 3.5} textAnchor="middle" fontSize="10" fontWeight="bold" fill="#fff">{i + 1}</text></g>;
            })}
          </svg>
          <div className="flex lg:flex-col gap-4">
            {prob.choices.map(v => (
              <Btn key={v} data-v={v} big color="#7c3aed" light="#f5f3ff" disabled={gone.includes(v)} glow={glow && v === prob.ans} onClick={() => choose(v)} className="min-w-[9rem]">
                <Txt s={unit(v)} />
              </Btn>
            ))}
          </div>
        </div>
      );
    }

    // ---- みつけよう ----
    function featureMsg(sh, cat) {
      const w = cat === 'tri' ? SAN : SHI;
      if (sh.mod === 'round') return `かどが まるく なって いるね。${w}は かどが とがって いるよ。`;
      if (sh.mod === 'open') return 'せんが つながって いないね。すきまが あるよ。';
      if (sh.mod === 'curve') return `まがった せんが あるね。${w}は まっすぐな せん だけで できて いるよ。`;
      if (sh.mod === 'circle') return 'まるには まっすぐな せんが ないね。';
      if (sh.key === 'penta') return 'へんを かぞえて みよう。へんが 5{本|ほん} あるね。';
      if (sh.cat === 'tri') return `へんを かぞえて みよう。へんは 3{本|ぼん}。それは ${SAN}だね。`;
      return `へんを かぞえて みよう。へんは 4{本|ほん}。それは ${SHI}だね。`;
    }
    function missMsg(keys) {
      if (keys.includes('tri-down')) return `さかさまに なって いる ${SAN}も あるよ。`;
      if (keys.includes('tri-thin')) return `ほそながい ${SAN}も あるよ。`;
      if (keys.includes('tri-tilt') || keys.includes('tri-flat') || keys.includes('tri-right')) return `かたむいて いる ${SAN}も あるよ。へんを かぞえて みよう。`;
      if (keys.includes('concave')) return `へこんで いても、4{本|ほん}の ${CHOKU}で かこまれて いれば ${SHI}だよ。`;
      if (keys.includes('diamond')) return `かたむいて いる ${SHI}も あるよ。`;
      if (keys.includes('irr') || keys.includes('trap')) return `へんの ながさが ちがっても、4{本|ほん}の ${CHOKU}で かこまれて いれば ${SHI}だよ。`;
      return 'まだ あるよ。へんを かぞえて さがそう。';
    }
    function FindTask({ prob, hintLv, ctl }) {
      const [found, setFound] = useState([]);
      const [shake, setShake] = useState(null);
      const [wrong, setWrong] = useState([]);
      const w = prob.cat === 'tri' ? SAN : SHI;
      const targets = prob.cards.filter(c => c.target);
      useEffect(() => { ctl.prompt(`${w}を ぜんぶ タップしよう。ぜんぶ みつけたら「ぜんぶ みつけた」を おしてね。`); }, []);
      useEffect(() => {
        if (!hintLv) return;
        ctl.say([`${HON(prob.cat === 'tri' ? 3 : 4)}の ${CHOKU}で かこまれて いるかな？ へんを かぞえて みよう。`,
          'へんに いろを つけたよ。まがった せんや すきまにも きを つけよう。', `ひかって いる かたちが ${w}だよ。`][hintLv - 1]);
      }, [hintLv]);
      const tap = (card) => {
        if (ctl.frozen() || found.includes(card.id)) return;
        if (card.target) {
          Sound.tick();
          const nx = [...found, card.id]; setFound(nx);
          if (nx.length === targets.length) { ctl.say('ぜんぶ みつけたね！'); setTimeout(() => ctl.correct(), 600); }
          else ctl.say(`${nx.length}つ みつけた！`);
          return;
        }
        setShake(card.id); setTimeout(() => setShake(null), 500);
        if (!wrong.includes(card.id)) setWrong(x => [...x, card.id]);
        ctl.mistake(`えらんだ:${card.sh.label}`, featureMsg(card.sh, prob.cat));
      };
      const finish = () => {
        if (ctl.frozen()) return;
        const rest = targets.filter(c => !found.includes(c.id));
        if (!rest.length) { ctl.correct(); return; }
        ctl.mistake(`見のがし:${rest.map(c => c.sh.label).join('・')}`, missMsg(rest.map(c => c.sh.key)));
      };
      return (
        <div className="h-full flex flex-col items-center justify-center gap-3">
          <div className="grid grid-cols-3 gap-3">
            {prob.cards.map(card => {
              const ok = found.includes(card.id);
              return (
                <button key={card.id} data-card={card.id} onClick={() => tap(card)}
                  className={`relative rounded-3xl bg-white border-4 p-1 ${ok ? 'border-green-500 bg-green-50' : 'border-slate-200'} ${shake === card.id ? 'animate-shake' : ''} ${hintLv >= 3 && card.target && !ok ? 'animate-glowcard' : ''}`}>
                  <ShapeSvg sh={card.sh} size={Math.min(150, window.innerHeight * 0.2)} colorSides={hintLv >= 2} mark={hintLv >= 2} fill={ok ? '#bbf7d0' : '#e0f2fe'} />
                  {ok && <div className="absolute top-1 right-2 text-3xl">✔️</div>}
                </button>
              );
            })}
          </div>
          <Btn big color="#059669" light="#ecfdf5" onClick={finish}>ぜんぶ みつけた！</Btn>
        </div>
      );
    }

    // ---- どっちかな？ ----
    const CAT_LABEL = { tri: SAN, quad: SHI, none: 'どちらでもない' };
    const CAT_ICON = {
      tri: <svg viewBox="0 0 40 40" width="40" height="40"><polygon points="20,4 37,35 3,35" fill="#fecaca" stroke="#b91c1c" strokeWidth="3" strokeLinejoin="round" /></svg>,
      quad: <svg viewBox="0 0 40 40" width="40" height="40"><rect x="5" y="5" width="30" height="30" fill="#bfdbfe" stroke="#1d4ed8" strokeWidth="3" /></svg>,
      none: <span className="text-3xl">🙅</span>,
    };
    function catMsg(sh, c) {
      if (sh.cat === 'none') return featureMsg(sh, c);
      if (sh.cat === 'tri') return c === 'quad' ? 'へんを かぞえて みよう。へんは 3{本|ぼん}だよ。' : `まっすぐな せん 3{本|ぼん}で、すきまなく かこまれて いるよ。`;
      if (c === 'tri') return 'へんを かぞえて みよう。へんは 4{本|ほん} あるよ。';
      return sh.key === 'concave' ? `へこんで いても、4{本|ほん}の ${CHOKU}で かこまれて いれば ${SHI}だよ。` : 'まっすぐな せん 4{本|ほん}で、すきまなく かこまれて いるよ。';
    }
    function ClassifyTask({ prob, hintLv, ctl }) {
      const sh = prob.sh;
      const [phase, setPhase] = useState('cat');
      const [gone, setGone] = useState([]);
      const phaseRef = useRef('cat');
      useEffect(() => { ctl.prompt(prob.cats.length === 2 ? `この かたちは ${SAN}かな？ どちらでもないかな？` : `この かたちは ${SAN}？ ${SHI}？ それとも どちらでもない？`); }, []);
      useEffect(() => {
        if (!hintLv) return;
        ctl.say([phaseRef.current === 'cat' ? 'へんを かぞえて みよう。まっすぐな せんかな？ ぜんぶ つながって いるかな？' : 'かたちの とくちょうを よく みて、りゆうを えらぼう。',
          'いろを つけたよ。かたちを よく みてね。', 'ひかって いる こたえを えらぼう。'][hintLv - 1]);
      }, [hintLv]);
      const chooseCat = (c) => {
        if (ctl.frozen() || gone.includes(c)) return;
        if (c === sh.cat) {
          Sound.tick(); setGone([]); setPhase('reason'); phaseRef.current = 'reason'; ctl.resetHint();
          ctl.prompt(`そうだね！ ${CAT_LABEL[c]}${c === 'none' ? '' : 'だね'}。では、どうして そう いえるかな？ りゆうを えらぼう。`);
          return;
        }
        setGone(g => [...g, c]);
        ctl.mistake(`こたえ:${plainOf(CAT_LABEL[c])}`, catMsg(sh, c));
      };
      const chooseReason = (r) => {
        if (ctl.frozen() || gone.includes(r)) return;
        if (r === sh.reason) { ctl.correct(); return; }
        setGone(g => [...g, r]);
        ctl.mistake(`りゆう:${REASON_LABEL[r]}`, ['r3', 'r4', 'five'].includes(r) ? 'へんの かずと、まっすぐな せんか どうかを たしかめよう。' : sh.cat === 'none' ? 'その りゆうでは ないよ。かたちを よく みてね。' : 'まがった せんや すきまは あるかな？ よく みてね。');
      };
      return (
        <div className="h-full flex flex-col lg:flex-row items-center justify-center gap-6">
          <div className="bg-white rounded-3xl border-4 border-slate-200 p-2 shrink-0">
            <ShapeSvg sh={sh} size={Math.min(320, window.innerHeight * 0.45)} colorSides={hintLv >= 2} mark={hintLv >= 2} />
          </div>
          {phase === 'cat' ? (
            <div className="flex flex-col gap-4">
              {prob.cats.map(c => (
                <Btn key={c} data-v={c} big color="#b45309" light="#fffbeb" disabled={gone.includes(c)} glow={hintLv >= 3 && c === sh.cat} onClick={() => chooseCat(c)} className="flex items-center gap-3 min-w-[16rem]">
                  {CAT_ICON[c]}<span style={{ lineHeight: 2 }}><Txt s={CAT_LABEL[c]} /></span>
                </Btn>
              ))}
            </div>
          ) : (
            <div className="flex flex-col gap-3 max-w-xl">
              <div className="text-xl font-bold text-amber-700 mb-1">りゆうを えらぼう</div>
              {prob.reasons.map(r => (
                <Btn key={r} data-v={r} color="#b45309" light="#fffbeb" disabled={gone.includes(r)} glow={hintLv >= 3 && r === sh.reason} onClick={() => chooseReason(r)} className="text-left" style={{ lineHeight: 2.1 }}>
                  <Txt s={REASONS[r]} />
                </Btn>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ---- タングラム ----
    const TRAY = [[700, 120], [885, 120], [700, 290], [885, 290], [700, 440], [885, 440], [792, 565]];
    const PIECE_COLORS = ['#f472b6', '#facc15', '#60a5fa', '#34d399', '#a78bfa', '#fb923c', '#f87171'];
    const SIZE_ORDER = { L: 0, M: 1, Q: 2, P: 3, S: 4 };
    function hull(pts) {
      const p = [...pts].sort((a, b) => a[0] - b[0] || a[1] - b[1]), cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
      const lo = [], up = [];
      p.forEach(q => { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 1e-9) lo.pop(); lo.push(q); });
      [...p].reverse().forEach(q => { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 1e-9) up.pop(); up.push(q); });
      return lo.slice(0, -1).concat(up.slice(0, -1));
    }
    function TangramTask({ prob, hintLv, ctl }) {
      const z = prob.z, TU = z.tu || 72;
      const slots = useMemo(() => {
        const all = z.slots.flatMap(s => s[1]);
        const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
        const ox = 295 - (Math.min(...xs) + Math.max(...xs)) / 2 * TU, oy = 315 - (Math.min(...ys) + Math.max(...ys)) / 2 * TU;
        return z.slots.map(([k, pts], i) => ({ i, k, pts: pts.map(([x, y]) => [ox + x * TU, oy + y * TU]) }));
      }, []);
      const [pieces, setPieces] = useState(() => {
        const order = z.slots.map((s, i) => i).sort((a, b) => SIZE_ORDER[z.slots[a][0]] - SIZE_ORDER[z.slots[b][0]]);
        return z.slots.map(([k, pts], i) => {
          const f = fitTransform(k, pts) || { rot: 0, flip: false }, cell = TRAY[order.indexOf(i)];
          let rot = z.fixed ? f.rot : (f.rot + pick([2, 4, 6])) % 8;
          if (k === 'L' && rot % 2) rot = (rot + 1) % 8;
          return { id: i, k, rot, flip: z.fixed ? f.flip : false, x: cell[0], y: cell[1], snap: null, color: PIECE_COLORS[i % PIECE_COLORS.length] };
        });
      });
      const [sel, setSel] = useState(null);
      const [phase, setPhase] = useState('build');
      const [gone, setGone] = useState([]);
      const [count, setCount] = useState(0);
      const [glowAns, setGlowAns] = useState(false);
      const piecesRef = useRef(pieces); piecesRef.current = pieces;
      const svgRef = useRef(null), drag = useRef(null);
      const askCat = z.ask === 'quad' ? 'quad' : 'tri';
      const askN = z.slots.filter(s => PIECE_CAT[s[0]] === askCat).length;
      const ans = z.ask === 'shape' ? z.ans : askN;
      const choices = z.ask === 'shape' ? ['tri', 'quad'] : [askN - 1, askN, askN + 1].filter(v => v >= 1);
      const ansText = (v) => z.ask === 'shape' ? CAT_LABEL[v] : `${v}まい`;

      const target = useMemo(() => {
        const free = slots.filter(s => !pieces.some(p => p.snap === s.i)).sort((a, b) => SIZE_ORDER[a.k] - SIZE_ORDER[b.k]);
        if (!free.length) return null;
        const s = free[0], pc = pieces.find(p => p.snap == null && p.k === s.k);
        return pc ? { slot: s, piece: pc.id } : null;
      }, [pieces]);

      useEffect(() => {
        ctl.prompt(z.fixed ? `ピースを うごかして、くろい かげに ぴったり かさねよう。` : `ピースを うごかして、くろい かげの かたちを つくろう。むきが ちがう ときは「まわす」ボタンで まわそう。`);
      }, []);
      useEffect(() => {
        if (!hintLv) return;
        if (phase === 'build') {
          ctl.say([`おおきな ピースから おいて みよう。かどを あわせると ぴたっと はまるよ。${z.slots.some(s => s[0] === 'P') ? 'ななめの しかくは「うらがえす」も つかえるよ。' : ''}`,
            'くぎりの せんを だしたよ。おなじ かたちの ばしょに おこう。',
            'ひかって いる ピースを、ひかって いる ばしょに うごかそう。むきは「まわす」ボタンで あわせてね。'][hintLv - 1]);
          if (hintLv >= 3 && target) setSel(target.piece);
        } else {
          if (hintLv === 1) ctl.say(z.ask === 'shape' ? 'できた かたちの まわりの せんを ゆびで なぞって、へんを かぞえよう。' : `ピースを 1まいずつ ゆびで さして かぞえよう。`);
          if (hintLv === 2) ctl.say(z.ask === 'shape' ? 'まわりの せんに いろを つけたよ。いくつ あるかな？' : `${CAT_LABEL[askCat]}の ピースを ひからせたよ。`);
          if (hintLv === 3) {
            let alive = true;
            (async () => {
              if (z.ask !== 'shape') { for (let k = 1; k <= askN && alive; k++) { setCount(k); Sound.tick(); await ctl.say(KAZU[k]); } }
              if (alive) { setGlowAns(true); ctl.say('ひかって いる こたえを えらぼう。'); }
            })();
            return () => { alive = false; };
          }
        }
      }, [hintLv]);

      const piecePts = (pc) => pc.snap != null ? slots[pc.snap].pts : pieceLocal(pc.k, pc.rot, pc.flip).map(([x, y]) => [pc.x + x * TU, pc.y + y * TU]);
      const update = (id, f, check = true) => {
        let pcs = piecesRef.current.map(p => p.id === id ? { ...p, ...f(p) } : p);
        if (check) {
          const pc = pcs.find(p => p.id === id), vs = piecePts(pc);
          const hit = slots.find(s => s.k === pc.k && !pcs.some(p => p.snap === s.i) && vs.every(v => s.pts.some(q => Math.hypot(v[0] - q[0], v[1] - q[1]) < TU * 0.32)));
          if (hit) {
            pcs = pcs.map(p => p.id === id ? { ...p, snap: hit.i } : p);
            Sound.snap(); setSel(null);
            if (pcs.every(p => p.snap != null)) complete();
            else ctl.say(pick(['ぴたっ！', 'いいね！', 'はまったね！']));
          }
        }
        piecesRef.current = pcs; setPieces(pcs);
      };
      const complete = () => {
        setPhase('ask'); ctl.resetHint();
        setTimeout(async () => {
          Sound.gift(); await ctl.say(`できた！ <名>が できたね。`.replace('<名>', z.name));
          ctl.prompt(z.ask === 'shape' ? `できた かたちの まわりを みてね。${SAN}かな？ ${SHI}かな？` : `この なかに ${CAT_LABEL[askCat]}の ピースは なんまい あるかな？`);
        }, 300);
      };
      const toSvg = (e) => {
        const svg = svgRef.current, pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
        const p = pt.matrixTransform(svg.getScreenCTM().inverse()); return [p.x, p.y];
      };
      const down = (e, pc) => {
        e.stopPropagation();
        if (pc.snap != null || phase !== 'build' || ctl.frozen()) return;
        Sound.tap(); setSel(pc.id);
        const [x, y] = toSvg(e);
        drag.current = { id: pc.id, dx: x - pc.x, dy: y - pc.y, moved: false };
        try { svgRef.current.setPointerCapture(e.pointerId); } catch (er) {}
      };
      const move = (e) => {
        const d = drag.current; if (!d) return;
        const [x, y] = toSvg(e);
        d.moved = true;
        update(d.id, () => ({ x: Math.max(20, Math.min(980, x - d.dx)), y: Math.max(20, Math.min(620, y - d.dy)) }), false);
      };
      const up = () => { const d = drag.current; drag.current = null; if (d && d.moved) update(d.id, () => ({})); };
      const nudge = (f) => { if (sel == null || phase !== 'build') return; Sound.tap(); update(sel, f); };
      const step = TU / 4;
      const selPc = pieces.find(p => p.id === sel);

      const choose = (v) => {
        if (ctl.frozen() || gone.includes(v)) return;
        if (v === ans) { ctl.correct(); return; }
        setGone(g => [...g, v]);
        if (z.ask === 'shape') ctl.mistake(`こたえ:${plainOf(CAT_LABEL[v])}`, v === 'tri' ? `まわりの へんを かぞえて みよう。4{本|ほん} あるね。` : `まわりの へんを かぞえて みよう。3{本|ぼん} だね。`);
        else ctl.mistake(`${v}まいとこたえた`, v > ans ? `おなじ ピースを 2かい かぞえて いないかな？ ${askCat === 'tri' ? 'しかく' : 'さんかく'}の ピースは かぞえないよ。` : 'かぞえわすれた ピースは ないかな？ もういちど かぞえよう。');
      };

      const outline = useMemo(() => z.ask === 'shape' ? hull(slots.flatMap(s => s.pts)) : null, []);
      const counted = slots.filter(s => PIECE_CAT[s.k] === askCat);
      const order = [...pieces].sort((a, b) => (a.id === sel) - (b.id === sel));
      return (
        <div className="h-full flex flex-col items-center">
          <div className="flex-1 min-h-0 w-full flex justify-center">
            <svg ref={svgRef} data-tu={TU} viewBox="0 0 1000 640" className="h-full max-w-full" style={{ aspectRatio: '1000 / 640' }} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>
              <rect x="4" y="4" width="582" height="632" rx="24" fill="#f8fafc" stroke="#e2e8f0" strokeWidth="3" />
              {phase === 'build' && <><rect x="600" y="4" width="396" height="632" rx="24" fill="#f1f5f9" stroke="#cbd5e1" strokeWidth="3" strokeDasharray="12 10" />
                <text x="798" y="34" textAnchor="middle" fontSize="22" fontWeight="bold" fill="#94a3b8">ピース おきば</text></>}
              {slots.map(s => <polygon key={'s' + s.i} data-slot={s.i} data-k={s.k} points={s.pts.map(p => p.join(',')).join(' ')} fill="#475569" stroke={hintLv >= 2 && phase === 'build' ? '#f8fafc' : '#475569'} strokeWidth={hintLv >= 2 && phase === 'build' ? 4 : 1.5} strokeLinejoin="round" />)}
              {hintLv >= 3 && phase === 'build' && target && <polygon points={target.slot.pts.map(p => p.join(',')).join(' ')} fill={pieces[target.piece].color} fillOpacity="0.85" stroke="#facc15" strokeWidth="6" className="blink" />}
              {order.map(pc => {
                const pts = piecePts(pc), isSel = pc.id === sel, isT = hintLv >= 3 && phase === 'build' && target && target.piece === pc.id;
                const dim = phase === 'ask' && hintLv >= 2 && z.ask !== 'shape' && PIECE_CAT[pc.k] !== askCat;
                return <polygon key={pc.id} data-piece={pc.id} data-k={pc.k} data-snap={pc.snap == null ? '' : pc.snap} points={pts.map(p => p.join(',')).join(' ')} fill={pc.color} fillOpacity={dim ? 0.25 : 1}
                  stroke={isSel || isT ? '#facc15' : '#fff'} strokeWidth={isSel || isT ? 7 : 3} strokeLinejoin="round"
                  className={isT && !isSel ? 'blink' : ''} onPointerDown={(e) => down(e, pc)} style={{ cursor: pc.snap == null ? 'grab' : 'default' }} />;
              })}
              {phase === 'ask' && outline && hintLv >= 2 && outline.map((p, i) => { const q = outline[(i + 1) % outline.length]; return <line key={'o' + i} x1={p[0]} y1={p[1]} x2={q[0]} y2={q[1]} stroke={SIDE_COLORS[i % 5]} strokeWidth="10" strokeLinecap="round" />; })}
              {phase === 'ask' && counted.slice(0, count).map((s, i) => { const c = cenOf(s.pts); return <g key={'c' + i} className="animate-popup"><circle cx={c[0]} cy={c[1]} r="22" fill="#7c3aed" /><text x={c[0]} y={c[1] + 9} textAnchor="middle" fontSize="26" fontWeight="bold" fill="#fff">{i + 1}</text></g>; })}
            </svg>
          </div>
          {phase === 'build' ? (
            <div className="flex gap-2 py-2 flex-wrap justify-center items-center">
              {selPc ? <>
                <Btn color="#0d9488" onClick={() => nudge(p => ({ x: p.x - step }))}>◀</Btn>
                <Btn color="#0d9488" onClick={() => nudge(p => ({ y: p.y - step }))}>▲</Btn>
                <Btn color="#0d9488" onClick={() => nudge(p => ({ y: p.y + step }))}>▼</Btn>
                <Btn color="#0d9488" onClick={() => nudge(p => ({ x: p.x + step }))}>▶</Btn>
                <Btn color="#7c3aed" light="#f5f3ff" onClick={() => nudge(p => ({ rot: (p.rot + 1) % 8 }))}>↻ まわす</Btn>
                {selPc.k === 'P' && <Btn color="#db2777" light="#fdf2f8" onClick={() => nudge(p => ({ flip: !p.flip }))}>⇋ うらがえす</Btn>}
              </> : <div className="text-xl font-bold text-slate-500 py-3">ピースを タップすると、ボタンでも うごかせるよ</div>}
            </div>
          ) : (
            <div className="flex gap-4 py-2">
              {choices.map(v => <Btn key={v} data-v={v} big color="#0d9488" light="#f0fdfa" disabled={gone.includes(v)} glow={glowAns && v === ans} onClick={() => choose(v)} className="min-w-[9rem]" style={{ lineHeight: 2 }}><Txt s={ansText(v)} /></Btn>)}
            </div>
          )}
        </div>
      );
    }

    // =====================================================================
    // 13. 1回分（5問ほど）を すすめる
    // =====================================================================
    const TASKS = { line: DotBoard, poly: DotBoard, add: DotBoard, count: CountTask, quiz: QuizTask, find: FindTask, classify: ClassifyTask, tangram: TangramTask };
    const PRAISE = ['せいかい！ すごいね！', 'せいかい！ よく できたね！', 'せいかい！ その ちょうし！', 'せいかい！ かんぺきだね！', 'せいかい！ さすがだね！'];

    function Activity({ step, progress, name, onQuit, onFinish }) {
      const hk = useHakase();
      const [probs] = useState(() => makeRound(step.id, progress.plays[step.id] || 0));
      const [idx, setIdx] = useState(0);
      const [hintLv, setHintLv] = useState(0);
      const [miss, setMiss] = useState(0);
      const [ok, setOk] = useState(false);
      const recs = useRef([]), cur = useRef({ labels: [], maxHint: 0, miss: 0, hint: 0, ok: false });
      const mem = useRef({ made: [] }).current;
      const corrects = useRef(0);
      const prob = probs[idx];
      const raise = (lv) => { const v = Math.min(3, lv); cur.current.hint = v; cur.current.maxHint = Math.max(cur.current.maxHint, v); setHintLv(v); };
      const ctl = useMemo(() => ({
        say: (t) => hk.say(t),
        prompt: (t) => hk.prompt(t),
        frozen: () => cur.current.ok,
        resetHint: () => { cur.current.hint = 0; cur.current.miss = 0; setHintLv(0); setMiss(0); },
        mistake: (label, msg) => {
          if (cur.current.ok) return;
          cur.current.miss++; cur.current.labels.push(label); setMiss(cur.current.miss);
          cur.current.total = (cur.current.total || 0) + 1;
          Sound.retry();
          hk.say(msg).then(() => { if (cur.current.miss >= 3 && cur.current.hint < 3 && !cur.current.ok) raise(3); });
        },
        note: (label, msg) => { cur.current.labels.push(label + '（気づき）'); Sound.hum(); return hk.say(msg); },
        correct: () => {
          if (cur.current.ok) return;
          cur.current.ok = true; setOk(true); corrects.current++;
          const total = cur.current.total || 0;
          recs.current.push({ stage: step.stage.id, step: step.id, problem: prob.pid, shape: prob.shape, result: total === 0 ? '○' : '△',
            tries: total + 1, hint: cur.current.maxHint, miss: cur.current.labels.join('、') });
          Sound.fanfare();
          hk.say(pick(PRAISE));
        },
      }), [idx]);
      const next = () => {
        Sound.tap();
        if (idx + 1 < probs.length) {
          cur.current = { labels: [], maxHint: 0, miss: 0, hint: 0, ok: false };
          setHintLv(0); setMiss(0); setOk(false); setIdx(idx + 1);
        } else onFinish(recs.current, corrects.current);
      };
      const Task = TASKS[prob.type];
      window.__zukeiProb = prob; // 動作確認（自動テスト）用
      const power = (progress.power || 0) + corrects.current;
      return (
        <div className="h-screen flex flex-col bg-white" style={{ backgroundImage: 'radial-gradient(#e2e8f0 1.5px, transparent 1.5px)', backgroundSize: '28px 28px' }}>
          <div className="flex items-center gap-3 px-4 py-2 border-b-2 border-slate-100 bg-white/90">
            <Btn color="#64748b" className="whitespace-nowrap shrink-0" onClick={() => { hk.stop(); onQuit(recs.current, corrects.current); }}>✕ やめる</Btn>
            <div className="text-xl font-bold min-w-0 truncate" style={{ color: step.stage.color, lineHeight: 2 }}><Txt s={step.stage.title} /> ・ <Txt s={step.name} /></div>
            <div className="flex gap-2 ml-2 shrink-0">
              {probs.map((_, i) => <div key={i} className="w-5 h-5 rounded-full border-2" style={{ background: i < idx || (i === idx && ok) ? '#facc15' : i === idx ? '#bfdbfe' : '#f1f5f9', borderColor: i === idx ? '#2563eb' : '#cbd5e1' }} />)}
            </div>
            <div className="ml-auto flex gap-3 items-center shrink-0 whitespace-nowrap">
              <div className="text-xl font-bold text-amber-600 bg-amber-50 border-2 border-amber-200 rounded-full px-4 py-2">⚡ {power}</div>
              <Btn color="#ca8a04" light="#fefce8" glow={miss >= 2 && hintLv < 3 && !ok} disabled={hintLv >= 3 || ok} onClick={() => { Sound.tap(); raise(cur.current.hint + 1); }}>💡 ヒント{hintLv ? ` ${hintLv}` : ''}</Btn>
              <Btn color="#7c3aed" light="#f5f3ff" onClick={() => hk.repeat()}>🔊 もういちど</Btn>
            </div>
          </div>
          <div className="flex-1 min-h-0 flex flex-col lg:flex-row gap-3 p-3">
            <div className="lg:w-72 shrink-0"><HakaseBubble size={lgUp() ? 120 : 80} vertical={lgUp()} /></div>
            <div className="flex-1 min-h-0" key={idx}>
              <Task prob={prob} hintLv={hintLv} ctl={ctl} mem={mem} />
            </div>
          </div>
          {ok && (
            <div className="fixed inset-0 z-40 flex items-center justify-center bg-white/50">
              <Confetti />
              <div className="animate-popup bg-white rounded-[2rem] border-8 border-amber-300 shadow-2xl px-10 py-6 flex flex-col items-center gap-2">
                <div className="text-6xl font-bold text-rose-500">せいかい！</div>
                <div className="flex items-center gap-4">
                  <Robot p={progress} size={120} mood="happy" level={levelOf(progress)} />
                  <div className="text-4xl font-bold text-amber-500 animate-popup">⚡ パワー +1</div>
                </div>
                <Btn big color="#e11d48" light="#fff1f2" onClick={next}>{idx + 1 < probs.length ? 'つぎへ ▶' : 'ごほうびを もらう 🎁'}</Btn>
              </div>
            </div>
          )}
        </div>
      );
    }
    const lgUp = () => window.innerWidth >= 1024;

    // =====================================================================
    // 14. ホーム・ステージ・ごほうび・きがえ
    // =====================================================================
    const NAME_COLORS = [['#dc2626', '#fee2e2'], ['#2563eb', '#dbeafe'], ['#059669', '#d1fae5'], ['#d97706', '#fef3c7'], ['#7c3aed', '#ede9fe'], ['#db2777', '#fce7f3'], ['#0d9488', '#ccfbf1']];

    function LoginScreen({ students, onSelect, onTeacher, demo }) {
      return (
        <div className="min-h-screen flex flex-col items-center justify-center gap-6 p-6 relative">
          <LabBg />
          <div className="flex items-end gap-4 bg-white/90 rounded-[2rem] px-8 py-5 border-4 border-sky-200">
            <Hakase size={120} />
            <div className="pb-3">
              <h1 className="text-4xl md:text-5xl font-bold text-sky-800">トンガリはかせの</h1>
              <h1 className="text-4xl md:text-5xl font-bold text-violet-700 mt-2">ロボット けんきゅうじょ</h1>
              <p className="text-2xl font-bold text-slate-500 mt-4">じぶんの なまえを おしてね</p>
            </div>
            <div className="animate-float"><Robot size={120} mood="happy" /></div>
          </div>
          {students.length === 0 ? (
            <div className="bg-white rounded-3xl p-8 text-xl font-bold text-slate-600 border-4 border-slate-200 max-w-xl text-center" style={{ lineHeight: 1.8 }}>
              せんせいへ：スプレッドシートの「名簿」シートに、子どもの なまえ（ひらがな）を いれてください。
            </div>
          ) : (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-5 max-w-5xl">
              {students.map((n, i) => {
                const [c, l] = NAME_COLORS[i % NAME_COLORS.length];
                return <Btn key={n} big onClick={() => onSelect(n)} color={c} light={l} className="min-w-[12rem]">{n}</Btn>;
              })}
            </div>
          )}
          <button onClick={onTeacher} className="fixed bottom-4 right-4 text-base text-slate-500 bg-white/80 border-2 border-slate-200 rounded-full px-4 py-2">🔒 せんせい</button>
          {demo && <div className="fixed bottom-4 left-4 text-sm text-slate-500 bg-white/70 rounded px-2">おためしモード（スプレッドシートと つながっていません）</div>}
        </div>
      );
    }

    function RoboCard({ name, progress, size = 190 }) {
      const lv = levelOf(progress);
      return (
        <div className="bg-white/95 rounded-[2rem] border-4 border-sky-200 p-4 flex flex-col items-center">
          <div className="text-2xl font-bold text-sky-800">{name}ロボ</div>
          <div className="text-lg font-bold text-violet-600">Lv.{lv} {LEVEL_NAMES[lv]}</div>
          <div className="animate-float"><Robot p={progress} size={size} level={lv} /></div>
          <div className="flex gap-3 text-lg font-bold">
            <span className="text-amber-600">⚡ {progress.power || 0}</span>
            <span className="text-sky-700">🎁 {progress.items.length}/{ITEMS.length}</span>
            {progress.stars > 0 && <span className="text-yellow-500">⭐ {progress.stars}</span>}
          </div>
        </div>
      );
    }

    function HomeScreen({ name, progress, settings, bar, onStage, onStep, onDress }) {
      const hk = useHakase();
      const nx = nextStep(progress);
      useEffect(() => {
        hk.prompt(nx ? `${name}さん、ようこそ。きょうも ${name}ロボを パワーアップ しよう！` : `${name}さん、ぜんぶの ステージを クリアしたね。すきな ところで れんしゅう しよう！`);
      }, []);
      return (
        <div className="min-h-screen relative">
          <LabBg />
          {bar}
          <div className="flex flex-col lg:flex-row gap-5 px-5 pb-5 items-center lg:items-start">
            <div className="flex flex-col items-center gap-3">
              <RoboCard name={name} progress={progress} />
              <Btn color="#db2777" light="#fdf2f8" onClick={onDress}>👕 きがえ ・ ずかん</Btn>
            </div>
            <div className="flex-1 flex flex-col gap-4 w-full">
              <HakaseBubble size={90} />
              {nx && <Btn big color="#16a34a" light="#f0fdf4" glow onClick={() => onStep(nx)} className="self-start" style={{ lineHeight: 2 }}>▶ つづきから　<span className="text-2xl"><Txt s={nx.stage.title} /> ・ <Txt s={nx.name} /></span></Btn>}
              <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">
                {STAGES.map(st => {
                  const open = stageOpen(progress, st), clear = stageCleared(progress, st);
