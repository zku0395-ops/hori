                  const ns = normalSteps(st), d = ns.filter(s => progress.done[s.id]).length;
                  return (
                    <button key={st.id} onClick={() => { Sound.tap(); open ? onStage(st) : hk.say('まえの ステージを クリアすると ひらくよ。'); }}
                      className={`btn3d rounded-3xl p-4 text-left relative ${open ? '' : 'grayscale opacity-60'}`}
                      style={{ background: st.light, borderColor: st.color, borderWidth: 4, borderStyle: 'solid' }}>
                      <div className="text-base font-bold" style={{ color: st.color }}>ステージ {st.no}</div>
                      <div className="text-xl font-bold text-slate-700 flex items-center gap-2" style={{ lineHeight: 2 }}><span className="text-3xl">{open ? st.icon : '🔒'}</span><span><Txt s={st.title} /></span></div>
                      <div className="flex gap-1 mt-1">{ns.map(s => <span key={s.id} className="text-xl">{progress.done[s.id] ? '⭐' : '☆'}</span>)}</div>
                      {clear && <div className="absolute top-2 right-3 text-sm font-bold text-white bg-amber-400 rounded-full px-2 py-1">クリア</div>}
                      {!clear && open && d > 0 && <div className="absolute top-2 right-3 text-sm font-bold text-slate-500">{d}/{ns.length}</div>}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function StageScreen({ stage, progress, settings, bar, onBack, onStep }) {
      const hk = useHakase();
      const nx = stage.steps.find(s => !s.adv && !progress.done[s.id] && stepOpen(progress, s, settings.adv));
      useEffect(() => { hk.prompt(`ステージ ${stage.no}「${stage.title}」だよ。${nx ? 'ひかって いる ところから はじめよう。' : 'すきな ところを えらんでね。'}`); }, []);
      return (
        <div className="min-h-screen relative">
          <LabBg />
          {bar}
          <div className="px-5 pb-5 flex flex-col gap-4 max-w-5xl mx-auto">
            <div className="flex items-center gap-4">
              <Btn color="#64748b" onClick={onBack}>◀ もどる</Btn>
              <div className="text-3xl font-bold bg-white/85 rounded-2xl px-5 py-2" style={{ color: stage.color, lineHeight: 2 }}>{stage.icon} ステージ {stage.no}　<Txt s={stage.title} /></div>
            </div>
            <HakaseBubble size={90} />
            <div className="flex flex-col gap-3">
              {stage.steps.map((s, i) => {
                const open = stepOpen(progress, s, settings.adv), done = progress.done[s.id];
                return (
                  <button key={s.id} onClick={() => { Sound.tap(); open ? onStep(s) : hk.say(s.adv ? 'ここは はってんの もんだいだよ。せんせいが ひらいて くれるよ。' : 'まえの もんだいが おわると ひらくよ。'); }}
                    className={`btn3d rounded-3xl px-6 py-4 flex items-center gap-4 text-left ${open ? '' : 'opacity-50 grayscale'} ${s === nx ? 'animate-hint' : ''}`}
                    style={{ background: s.adv ? '#fefce8' : '#fff', borderColor: s.adv ? '#ca8a04' : stage.color, borderWidth: 4, borderStyle: 'solid' }}>
                    <span className="text-4xl w-12 text-center">{!open ? '🔒' : done ? '⭐' : s === nx ? '▶' : '○'}</span>
                    <span className="text-2xl font-bold text-slate-700" style={{ lineHeight: 2 }}>{s.adv ? 'はってん' : `${i + 1}`}　<Txt s={s.name} /></span>
                    {done && <span className="ml-auto text-lg font-bold text-amber-600">{progress.plays[s.id] || 1}かい できた</span>}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function ResultScreen({ name, progress, result, onNext, onHome }) {
      const hk = useHakase();
      const [open, setOpen] = useState(false);
      const lv = levelOf(progress);
      useEffect(() => {
        (async () => {
          await hk.say('ぜんぶ できたね！ ごほうびの プレゼントだよ。はこを おしてね。');
        })();
      }, []);
      const openBox = async () => {
        if (open) return;
        setOpen(true); Sound.gift();
        if (result.gift) await hk.say(`${name}ロボに「${ITEM[result.gift].name}」を つけたよ！`);
        else await hk.say(`ぴかぴか スターを もらったよ！`);
        if (result.levelUp) { Sound.levelup(); await sleep(400); hk.say(`レベルアップ！ ${name}ロボは「${LEVEL_NAMES[lv]}」に なったよ！`); }
      };
      return (
        <div className="min-h-screen relative flex flex-col items-center justify-center gap-3 p-4">
          <LabBg />
          {open && <Confetti />}
          <HakaseBubble size={70} />
          {!open ? (
            <button onClick={openBox} className="animate-float text-[9rem] leading-none mt-4">🎁</button>
          ) : (
            <div className="flex flex-col items-center gap-1 bg-white/90 rounded-[2rem] border-4 border-amber-300 px-10 py-3 animate-popup">
              {result.levelUp && <div className="text-4xl font-bold text-amber-500 levelup">レベルアップ！ Lv.{lv}</div>}
              <div className={result.levelUp ? 'levelup' : ''}><Robot p={progress} size={Math.min(190, window.innerHeight * 0.24)} mood="happy" level={lv} /></div>
              {result.gift
                ? <div className="flex items-center gap-3 text-3xl font-bold text-pink-600"><ItemIcon id={result.gift} size={70} />「{ITEM[result.gift].name}」を ゲット！</div>
                : <div className="text-3xl font-bold text-yellow-500">⭐ ぴかぴか スター ゲット！</div>}
              <div className="text-xl font-bold text-amber-600">⚡ パワー +{result.corrects}</div>
            </div>
          )}
          {open && (
            <div className="flex gap-4">
              {result.next && <Btn big color="#16a34a" light="#f0fdf4" onClick={onNext} style={{ lineHeight: 2 }}>▶ つぎへ すすむ</Btn>}
              <Btn big color="#0284c7" light="#f0f9ff" onClick={onHome}>🏠 ホームへ</Btn>
            </div>
          )}
        </div>
      );
    }

    function DressScreen({ name, progress, bar, onBack, onEquip }) {
      const hk = useHakase();
      const [slot, setSlot] = useState('head');
      useEffect(() => { hk.prompt(`${name}ロボを きがえよう。アイテムを おすと つけたり はずしたり できるよ。`); }, []);
      const lv = levelOf(progress);
      return (
        <div className="min-h-screen relative">
          <LabBg />
          {bar}
          <div className="px-5 pb-5 flex flex-col lg:flex-row gap-5 items-center lg:items-start">
            <div className="flex flex-col items-center gap-3">
              <Btn color="#64748b" onClick={onBack} className="self-start">◀ もどる</Btn>
              <RoboCard name={name} progress={progress} size={220} />
            </div>
            <div className="flex-1 bg-white/90 rounded-[2rem] border-4 border-pink-200 p-4 w-full">
              <div className="text-2xl font-bold text-pink-600 mb-3">ずかん　あつめた アイテム {progress.items.length} / {ITEMS.length}</div>
              <div className="flex gap-2 flex-wrap mb-4">
                {SLOTS.map(s => (
                  <button key={s.id} onClick={() => { Sound.tap(); setSlot(s.id); }} className={`rounded-full px-5 py-3 text-xl font-bold border-4 ${slot === s.id ? 'bg-pink-500 text-white border-pink-500' : 'bg-white text-pink-600 border-pink-200'}`}>{s.icon} {s.name}</button>
                ))}
              </div>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                {ITEMS.filter(it => it.slot === slot).map(it => {
                  const has = progress.items.includes(it.id), on = progress.equip[slot] === it.id;
                  return (
                    <button key={it.id} disabled={!has} onClick={() => { Sound.tap(); onEquip(slot, on ? null : it.id); }}
                      className={`rounded-3xl border-4 p-3 flex flex-col items-center ${!has ? 'bg-slate-100 border-slate-200' : on ? 'bg-pink-50 border-pink-500' : 'bg-white border-slate-200'}`}>
                      {has ? <ItemIcon id={it.id} size={80} /> : <div className="w-20 h-20 flex items-center justify-center text-5xl text-slate-300">？</div>}
                      <div className={`text-lg font-bold ${has ? 'text-slate-700' : 'text-slate-300'}`}>{has ? it.name : '？？？'}</div>
                      {on && <div className="text-sm font-bold text-pink-600">つけている</div>}
                    </button>
                  );
                })}
              </div>
              <div className="mt-4 text-lg font-bold text-violet-700">レベル：{LEVEL_NAMES.slice(1).map((n, i) => <span key={i} className={`inline-block mr-2 mb-1 px-2 rounded ${i + 1 <= lv ? 'bg-violet-100' : 'text-slate-300'}`}>Lv.{i + 1} {i + 1 <= lv ? n : '？？？'}</span>)}</div>
            </div>
          </div>
        </div>
      );
    }

    function PinPad({ onSubmit, onClose, error }) {
      const [pin, setPin] = useState('');
      useEffect(() => { if (error) setPin(''); }, [error]);
      const push = (d) => { const v = (pin + d).slice(0, 4); setPin(v); if (v.length === 4) onSubmit(v); };
      return (
        <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center">
          <div className="bg-white rounded-3xl p-6 w-80">
            <div className="text-xl font-bold text-slate-700 mb-2 text-center">先生用の 暗証番号</div>
            <div className="text-4xl tracking-[0.5em] text-center font-bold h-12 mb-2">{'●'.repeat(pin.length)}</div>
            {error > 0 && <div className="text-center text-rose-600 font-bold mb-2">番号が ちがいます</div>}
            <div className="grid grid-cols-3 gap-2">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '←'].map((d, i) => d === '' ? <div key={i} /> :
                <button key={i} onClick={() => d === '←' ? setPin(pin.slice(0, -1)) : push(d)} className="rounded-xl bg-slate-100 py-4 text-2xl font-bold active:bg-slate-300">{d}</button>)}
            </div>
            <button onClick={onClose} className="mt-4 w-full rounded-xl border-2 border-slate-300 py-2 font-bold text-slate-500">とじる</button>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 15. 先生用画面
    // =====================================================================
    const pct = (n, o) => n ? Math.round(o / n * 100) + '%' : '－';
    const rateColor = (n, o) => !n ? '#f1f5f9' : o / n < 0.6 ? '#fecaca' : o / n < 0.8 ? '#fef08a' : '#bbf7d0';
    const topMiss = (m, k = 5) => Object.entries(m || {}).sort((a, b) => b[1] - a[1]).slice(0, k);
    const stepLabel = (id) => { const s = STEP[id]; return s ? `${s.stage.no}-${plainOf(s.name)}` : id; };

    function Legend() {
      return (
        <div className="flex gap-3 text-xs text-slate-600 mt-3 flex-wrap">
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#fecaca' }} />60%未満</span>
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#fef08a' }} />60〜79%</span>
          <span><span className="inline-block w-3 h-3 rounded mr-1" style={{ background: '#bbf7d0' }} />80%以上</span>
        </div>
      );
    }

    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('rec');
      const [sel, setSel] = useState(null);
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState('');
      const [form, setForm] = useState({ ...DEFAULT_SETTINGS, ...(data.settings || {}) });
      const [csvOpen, setCsvOpen] = useState(false);
      const [clearName, setClearName] = useState('');
      const [confirm, setConfirm] = useState(false);
      const [log, setLog] = useState(data.log || []);
      const agg = useMemo(() => aggregate(log), [log]);
      const students = data.students;
      const s = students.find(x => x.name === sel);
      const empty = { count: 0, ok: 0, last: '', steps: {}, shapes: {}, miss: {} };

      const nowText = (p) => { const n = nextStep(p); return n ? `${n.stage.no} ${plainOf(n.stage.title)}・${plainOf(n.name)}` : 'ぜんぶクリア'; };
      const toggleUnlock = async () => {
        setBusy(true);
        const p = parseProgress(s.progress);
        const res = await api.setUnlock(pin, s.name, !p.unlockAll).catch(() => null);
        setBusy(false);
        if (res && res.ok) onChanged(s.name, res.progress);
      };
      const saveSettings = async () => {
        setBusy(true); setMsg('');
        const res = await api.saveSettings(pin, form).catch(() => null);
        setBusy(false);
        if (res && res.ok) { onSettings(form); setMsg('保存しました。子どもの画面にも反映されます。'); }
        else setMsg('保存できませんでした。もう一度押してください。');
      };
      const csvText = useMemo(() => [LOG_COLS, ...log].map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n'), [log]);
      const download = () => {
        try {
          const blob = new Blob(['﻿' + csvText], { type: 'text/csv' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob); a.download = `ずけい_きろく_${today().slice(0, 10).replace(/\//g, '')}.csv`;
          document.body.appendChild(a); a.click(); a.remove();
        } catch (e) { setCsvOpen(true); }
      };
      const clearStudent = async () => {
        setBusy(true);
        const res = await api.clearStudent(pin, clearName).catch(() => null);
        setBusy(false); setConfirm(false);
        if (res && res.ok) { setLog(l => l.filter(r => r[1] !== clearName)); onChanged(clearName, ''); setMsg(`${clearName} さんの記録を消しました。`); }
        else setMsg('消せませんでした。');
      };
      const TabBtn = ({ id, children }) => <button onClick={() => { setTab(id); setMsg(''); }} className={`px-5 py-2 rounded-full font-bold border-2 ${tab === id ? 'bg-slate-700 text-white border-slate-700' : 'bg-white text-slate-600 border-slate-300'}`}>{children}</button>;

      return (
        <div className="fixed inset-0 bg-slate-50 z-40 overflow-auto" style={{ userSelect: 'text', fontSize: 16 }}>
          <div className="max-w-6xl mx-auto p-4 md:p-6">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-2xl font-bold text-slate-700">先生用画面</h2>
              <button onClick={onClose} className="bg-white border-2 border-slate-300 rounded-full px-5 py-2 font-bold text-slate-600">閉じる ✕</button>
            </div>
            {data.isDefaultPin && <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 mb-4 text-amber-800 text-sm font-bold">暗証番号が最初の番号（1234）のままです。スプレッドシートの「せってい」シートで変えてください。</div>}
            {data.demo && <div className="bg-sky-50 border-2 border-sky-200 rounded-xl p-3 mb-4 text-sky-800 text-sm">おためしモードです。記録はこの端末のブラウザにだけ保存されます。</div>}
            <div className="flex gap-2 mb-4"><TabBtn id="rec">📊 記録</TabBtn><TabBtn id="set">⚙️ 設定</TabBtn><TabBtn id="data">💾 データ</TabBtn></div>
            {msg && <div className="bg-green-50 border-2 border-green-300 rounded-xl p-3 mb-4 text-green-800 font-bold">{msg}</div>}

            {tab === 'rec' && <>
              <div className="flex gap-2 flex-wrap mb-4">
                <button onClick={() => setSel(null)} className={`px-4 py-2 rounded-full font-bold border-2 ${!sel ? 'bg-sky-600 text-white border-sky-600' : 'bg-white text-slate-600 border-slate-300'}`}>クラス全体</button>
                {students.map(st => <button key={st.name} onClick={() => setSel(st.name)} className={`px-4 py-2 rounded-full font-bold border-2 ${sel === st.name ? 'bg-sky-600 text-white border-sky-600' : 'bg-white text-slate-600 border-slate-300'}`}>{st.name}</button>)}
              </div>
              {!s && <div className="flex flex-col gap-4">
                <div className="bg-white rounded-2xl border-2 border-slate-200 overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-100 text-slate-600"><tr>
                      <th className="p-3">なまえ</th><th className="p-3">いま学習中</th><th className="p-3">クリアしたステージ</th><th className="p-3">回答数</th><th className="p-3">1回目正答率</th><th className="p-3">最終学習日</th><th className="p-3">多いまちがい</th>
                    </tr></thead>
                    <tbody>{students.map(st => {
                      const p = parseProgress(st.progress), a = agg.students[st.name] || empty;
                      return (
                        <tr key={st.name} className="border-t border-slate-100 hover:bg-sky-50 cursor-pointer" onClick={() => setSel(st.name)}>
                          <td className="p-3 font-bold">{st.name}</td>
                          <td className="p-3">{nowText(p)}{p.unlockAll ? '（全開放）' : ''}</td>
                          <td className="p-3">{clearedStages(p)} / {STAGES.length}</td>
                          <td className="p-3">{a.count}</td>
                          <td className="p-3"><span className="px-2 py-1 rounded" style={{ background: rateColor(a.count, a.ok) }}>{pct(a.count, a.ok)}</span></td>
                          <td className="p-3">{a.last || '－'}</td>
                          <td className="p-3 text-xs">{topMiss(a.miss, 2).map(([m, c]) => <div key={m}>{m}（{c}）</div>)}</td>
                        </tr>
                      );
                    })}</tbody>
                  </table>
                </div>
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                    <div className="font-bold text-slate-700 mb-2">クラス全体で 多いまちがい</div>
                    {topMiss(agg.classMiss, 12).length === 0 ? <div className="text-slate-400">まだ ありません</div> :
                      <table className="w-full text-sm">{topMiss(agg.classMiss, 12).map(([m, c]) => <tr key={m} className="border-t border-slate-100"><td className="p-1">{m}</td><td className="p-1 text-right font-bold">{c}回</td></tr>)}</table>}
                  </div>
                  <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                    <div className="font-bold text-slate-700 mb-2">形ごとの 1回目正答率（低い順）</div>
                    {Object.keys(agg.classShapes).length === 0 ? <div className="text-slate-400">まだ ありません</div> :
                      <div className="flex flex-wrap gap-2">{Object.entries(agg.classShapes).sort((a, b) => a[1][1] / a[1][0] - b[1][1] / b[1][0]).slice(0, 16).map(([k, [n, o]]) =>
                        <span key={k} className="px-2 py-1 rounded text-sm" style={{ background: rateColor(n, o) }}>{k} {pct(n, o)}（{n}）</span>)}</div>}
                    <Legend />
                  </div>
                </div>
              </div>}
              {s && (() => {
                const p = parseProgress(s.progress), a = agg.students[s.name] || empty;
                return (
                  <div className="flex flex-col gap-4">
                    <div className="bg-white rounded-2xl border-2 border-slate-200 p-4 flex flex-wrap gap-6 items-center">
                      <div className="text-2xl font-bold">{s.name}</div>
                      <div>いま：<b>{nowText(p)}</b></div>
                      <div>回答数：<b>{a.count}</b></div>
                      <div>1回目正答率：<b>{pct(a.count, a.ok)}</b></div>
                      <div>レベル：<b>{levelOf(p)}</b>　アイテム：<b>{p.items.length}</b></div>
                      <button disabled={busy} onClick={toggleUnlock} className="ml-auto px-4 py-2 rounded-full border-2 font-bold border-violet-400 text-violet-700 bg-violet-50">
                        {p.unlockAll ? '🔓 全部開いています（元に戻す）' : '🔒 全部のステージを開く'}
                      </button>
                    </div>
                    <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                      <div className="font-bold text-slate-700 mb-2">ステップごとの進み具合と 1回目正答率</div>
                      {STAGES.map(st => (
                        <div key={st.id} className="flex items-center gap-2 mb-2 flex-wrap">
                          <div className="w-44 text-sm font-bold" style={{ color: st.color }}>{st.no} {plainOf(st.title)}</div>
                          {st.steps.map(x => { const r = a.steps[x.id] || [0, 0]; return (
                            <div key={x.id} className="text-xs px-2 py-1 rounded-lg border" style={{ background: r[0] ? rateColor(r[0], r[1]) : '#f8fafc' }}>
                              {x.adv ? '発展 ' : ''}{plainOf(x.name)} {p.done[x.id] ? `✔${p.plays[x.id] || 1}回` : '－'} {r[0] ? pct(r[0], r[1]) : ''}
                            </div>); })}
                        </div>
                      ))}
                      <Legend />
                    </div>
                    <div className="grid md:grid-cols-2 gap-4">
                      <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                        <div className="font-bold text-slate-700 mb-2">つまずいている形・問題（1回目正答率の低い順）</div>
                        {Object.keys(a.shapes).length === 0 ? <div className="text-slate-400">まだ ありません</div> :
                          <table className="w-full text-sm">{Object.entries(a.shapes).sort((x, y) => x[1][1] / x[1][0] - y[1][1] / y[1][0]).slice(0, 20).map(([k, [n, o]]) =>
                            <tr key={k} className="border-t border-slate-100"><td className="p-1">{k}</td><td className="p-1 text-right"><span className="px-2 rounded" style={{ background: rateColor(n, o) }}>{pct(n, o)}</span></td><td className="p-1 text-right text-slate-500">{n}回</td></tr>)}</table>}
                      </div>
                      <div className="bg-white rounded-2xl border-2 border-slate-200 p-4">
                        <div className="font-bold text-slate-700 mb-2">まちがい方（多い順）</div>
                        {topMiss(a.miss, 20).length === 0 ? <div className="text-slate-400">まだ ありません</div> :
                          <table className="w-full text-sm">{topMiss(a.miss, 20).map(([m, c]) => <tr key={m} className="border-t border-slate-100"><td className="p-1">{m}</td><td className="p-1 text-right font-bold">{c}回</td></tr>)}</table>}
                        <div className="text-xs text-slate-500 mt-2">「えらんだ：」は まちがえて選んだ形、「見のがし：」は 見つけられなかった形、「（気づき）」は まちがいにしていない場面です。</div>
                      </div>
                    </div>
                  </div>
                );
              })()}
            </>}

            {tab === 'set' && (
              <div className="bg-white rounded-2xl border-2 border-slate-200 p-5 flex flex-col gap-5 max-w-2xl">
                <label className="flex flex-col gap-1"><span className="font-bold">読み上げの速さ：{form.rate}</span>
                  <input type="range" min="0.5" max="1.2" step="0.05" value={form.rate} onChange={e => setForm({ ...form, rate: Number(e.target.value) })} />
                  <span className="text-sm text-slate-500">1がふつう。小さいほどゆっくりです（最初は 0.85）。</span></label>
                <label className="flex flex-col gap-1"><span className="font-bold">声の高さ：{form.pitch}</span>
                  <input type="range" min="0.5" max="1.8" step="0.1" value={form.pitch} onChange={e => setForm({ ...form, pitch: Number(e.target.value) })} /></label>
                <div><div className="font-bold mb-1">文字の大きさ</div>
                  <div className="flex gap-2">{Object.keys(SIZE_SCALE).map(k => <button key={k} onClick={() => setForm({ ...form, size: k })} className={`px-4 py-2 rounded-full border-2 font-bold ${form.size === k ? 'bg-sky-600 text-white border-sky-600' : 'bg-white border-slate-300'}`}>{k}</button>)}</div></div>
                <div><div className="font-bold mb-1">効果音の大きさ</div>
                  <div className="flex gap-2">{Object.keys(VOLUME).map(k => <button key={k} onClick={() => setForm({ ...form, vol: k })} className={`px-4 py-2 rounded-full border-2 font-bold ${form.vol === k ? 'bg-sky-600 text-white border-sky-600' : 'bg-white border-slate-300'}`}>{k}</button>)}</div></div>
                <label className="flex items-center gap-3 font-bold"><input type="checkbox" className="w-6 h-6" checked={!!form.adv} onChange={e => setForm({ ...form, adv: e.target.checked })} />発展の問題を開く（五角形の問題、ちがう三角形を2つ作る問題）</label>
                <div className="flex gap-3 items-center">
                  <button disabled={busy} onClick={saveSettings} className="px-6 py-3 rounded-full bg-sky-600 text-white font-bold">保存する</button>
                  <button onClick={() => { applySettings(form); Speech.say('この はやさで よみあげます。'); }} className="px-4 py-3 rounded-full border-2 border-slate-300 font-bold">🔊 ためしに聞く</button>
                </div>
                <div className="text-sm text-slate-500">「全部のステージを開く」は、記録タブで子どもを選ぶと出ます。暗証番号はスプレッドシートの「せってい」シートで変えます。</div>
                <div className="text-xs text-slate-400">画面の版：{APP_VERSION}</div>
              </div>
            )}

            {tab === 'data' && (
              <div className="flex flex-col gap-4 max-w-3xl">
                <div className="bg-white rounded-2xl border-2 border-slate-200 p-5">
                  <div className="font-bold text-slate-700 mb-2">記録の書き出し（CSV）</div>
                  <p className="text-sm text-slate-600 mb-3">記録は、問題が終わるたびに スプレッドシートの「きろく」シートへ 自動で届いています。CSVファイルでも 取り出せます（全 {log.length} 件）。</p>
                  <div className="flex gap-3">
                    <button onClick={download} className="px-5 py-2 rounded-full bg-sky-600 text-white font-bold">⬇ CSVを保存</button>
                    <button onClick={() => setCsvOpen(!csvOpen)} className="px-5 py-2 rounded-full border-2 border-slate-300 font-bold">中身を表示してコピー</button>
                  </div>
                  {csvOpen && <textarea readOnly value={csvText} className="w-full h-48 mt-3 border-2 border-slate-200 rounded-xl p-2 text-xs font-mono" onFocus={e => e.target.select()} />}
                </div>
                <div className="bg-white rounded-2xl border-2 border-rose-200 p-5">
                  <div className="font-bold text-rose-700 mb-2">記録の消去</div>
                  <p className="text-sm text-slate-600 mb-3">選んだ子どもの 記録と 進み具合（もらったアイテムも）を すべて消します。元には戻せません。</p>
                  <div className="flex gap-3 items-center flex-wrap">
                    <select value={clearName} onChange={e => { setClearName(e.target.value); setConfirm(false); }} className="border-2 border-slate-300 rounded-lg px-3 py-2">
                      <option value="">子どもを選ぶ</option>
                      {students.map(st => <option key={st.name} value={st.name}>{st.name}</option>)}
                    </select>
                    {clearName && !confirm && <button onClick={() => setConfirm(true)} className="px-4 py-2 rounded-full border-2 border-rose-400 text-rose-700 font-bold">記録を消す</button>}
                    {clearName && confirm && <button disabled={busy} onClick={clearStudent} className="px-4 py-2 rounded-full bg-rose-600 text-white font-bold">本当に {clearName} さんの記録を消す</button>}
                  </div>
                </div>
              </div>
            )}
            <p className="text-xs text-slate-400 mt-6">※「1回目正答率」は、1回目で正解した割合です（まちがえたあとに やり直して正解したものは含みません）。</p>
          </div>
        </div>
      );
    }

    // =====================================================================
    // 16. アプリ ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [bootError, setBootError] = useState('');
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [hk, setHk] = useState({ text: '', talking: false });
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [loading, setLoading] = useState(false);
      const sayId = useRef(0), lastPrompt = useRef('');
      const progRef = useRef(progress); progRef.current = progress;

      // はかせが 話す（ふきだしと 読み上げを いっしょに うごかす）
      const hkApi = useMemo(() => {
        const run = (text) => new Promise(resolve => {
          const id = ++sayId.current;
          setHk({ text, talking: true });
          const speech = speechOf(text);
          let finished = false;
          const end = () => { if (finished) return; finished = true; if (sayId.current === id) setHk(h => ({ ...h, talking: false })); resolve(); };
          const guard = setTimeout(end, 1500 + (speech.length * 330) / Speech.rate);
          Speech.say(speech, () => { clearTimeout(guard); end(); });
        });
        return {
          say: run,
          prompt: (t) => { lastPrompt.current = t; return run(t); },
          repeat: () => run(lastPrompt.current),
          stop: () => { sayId.current++; Speech.stop(); setHk(h => ({ ...h, talking: false })); },
        };
      }, []);
      const ctx = useMemo(() => ({ ...hkApi, state: hk }), [hkApi, hk]);

      useEffect(() => {
        api.init().then(d => {
          const s = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };
          setSettings(s); applySettings(s);
          setBoot(d);
          api.flush();
        }).catch(e => setBootError(String(e && e.message || e)));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);

      const selectStudent = async (n) => {
        Sound.get(); Sound.tap();
        setLoading(true);
        try {
          const p = await api.student(n);
          setProgress(parseProgress(p)); setName(n);
          setView({ v: 'home' });
        } catch (e) { alert('よみこみに しっぱい しました。もういちど おしてください。'); }
        setLoading(false);
      };
      const persist = (p, records) => { api.save({ name, progress: JSON.stringify(p), records, stamp: today(), time: Date.now() }); };

      const finishRound = (step, recs, corrects) => {
        const p0 = progRef.current, lvBefore = levelOf(p0);
        const p = { ...p0, done: { ...p0.done, [step.id]: true }, plays: { ...p0.plays, [step.id]: (p0.plays[step.id] || 0) + 1 },
          power: (p0.power || 0) + corrects, items: [...p0.items], equip: { ...p0.equip } };
        const gift = GIFT_ORDER.find(id => !p.items.includes(id)) || null;
        if (gift) { p.items.push(gift); p.equip[ITEM[gift].slot] = gift; } else p.stars = (p.stars || 0) + 1;
        const levelUp = levelOf(p) > lvBefore;
        setProgress(p); persist(p, recs);
        setView({ v: 'result', step, result: { gift, levelUp, corrects, next: nextStep(p) } });
      };
      const quitRound = (step, recs, corrects) => {
        if (recs.length) { const p = { ...progRef.current, power: (progRef.current.power || 0) + corrects }; setProgress(p); persist(p, recs); }
        setView({ v: 'stage', stage: step.stage });
      };
      const equip = (slot, id) => {
        const e = { ...progress.equip }; if (id) e[slot] = id; else delete e[slot];
        const p = { ...progress, equip: e }; setProgress(p); persist(p, []);
      };
      const startStep = (s) => { Sound.tap(); hkApi.stop(); setView({ v: 'act', step: s, key: Date.now() }); };
      const logout = () => { hkApi.stop(); setName(null); setView({ v: 'login' }); };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (pin) => {
        const d = await api.teacher(pin).catch(() => null);
        if (!d || !d.ok) { setPinError(e => e + 1); return; }
        hkApi.stop(); setPinOpen(false); setTeacher({ data: d, pin });
      };
      const teacherChanged = (n, prog) => {
        setTeacher(t => ({ ...t, data: { ...t.data, students: t.data.students.map(s => s.name === n ? { ...s, progress: prog } : s) } }));
        if (n === name) setProgress(parseProgress(prog));
      };

      if (bootError) return <div className="p-10 text-xl text-rose-600 font-bold">よみこみに しっぱい しました：{bootError}</div>;
      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-sky-700">じゅんび ちゅう…</div>;

      const bar = <TopBar name={name} onLogout={logout} onTeacher={openTeacher} />;
      let screen;
      if (!name || view.v === 'login') screen = <LoginScreen students={boot.students} onSelect={selectStudent} onTeacher={openTeacher} demo={boot.demo} />;
      else if (view.v === 'home') screen = <HomeScreen key="home" name={name} progress={progress} settings={settings} bar={bar} onStage={(st) => setView({ v: 'stage', stage: st })} onStep={startStep} onDress={() => setView({ v: 'dress' })} />;
      else if (view.v === 'stage') screen = <StageScreen key={view.stage.id} stage={view.stage} progress={progress} settings={settings} bar={bar} onBack={() => setView({ v: 'home' })} onStep={startStep} />;
      else if (view.v === 'act') screen = <Activity key={view.key} step={view.step} progress={progress} name={name}
        onQuit={(recs, c) => quitRound(view.step, recs, c)} onFinish={(recs, c) => finishRound(view.step, recs, c)} />;
      else if (view.v === 'result') screen = <ResultScreen name={name} progress={progress} result={view.result}
        onNext={() => startStep(view.result.next)} onHome={() => setView({ v: 'home' })} />;
      else if (view.v === 'dress') screen = <DressScreen name={name} progress={progress} bar={bar} onBack={() => setView({ v: 'home' })} onEquip={equip} />;

      return (
        <HakaseCtx.Provider value={ctx}>
          {screen}
          {loading && <div className="fixed inset-0 bg-white/60 flex items-center justify-center text-3xl font-bold text-sky-700 z-50">よみこみ ちゅう…</div>}
          {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
          {teacher && <TeacherView data={teacher.data} pin={teacher.pin} onChanged={teacherChanged}
            onSettings={(s) => { const v = { ...settings, ...s }; setSettings(v); applySettings(v); }}
            onClose={async () => {
              setTeacher(null);
              if (name) { try { setProgress(parseProgress(await api.student(name))); } catch (e) {} }
            }} />}
        </HakaseCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
