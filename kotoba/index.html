          <div className="flex gap-2 flex-wrap justify-center">
            {[['word', '📖 ことば ずかん'], ['mon', '👾 モンスター ずかん'], ['title', '🎖️ しょうごう']].map(([id, t]) => <button key={id} onClick={() => { Sound.tap(); setTab(id); }} className={`btn3d rounded-2xl border-2 px-4 py-2 text-xl font-bold ${tab === id ? 'bg-blue-950 text-white border-blue-950' : 'bg-white border-slate-300'}`}>{t}</button>)}
          </div>
          {tab === 'word' && (
            <>
              <div className="win px-4 py-1 text-2xl font-bold">📖 {progress.words.length} / {D.WORDS.length}</div>
              <div className="flex gap-2 flex-wrap justify-center">{D.PLACES.map(pl => <button key={pl.id} onClick={() => setPid(pl.id)} className={`rounded-xl border-2 px-2 py-1 font-bold ${pid === pl.id ? 'bg-blue-100 border-blue-700' : 'bg-white border-slate-300'}`}>{pl.icon} {pl.name}</button>)}</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
                {placeWords(pid).map(w => {
                  const got = progress.words.includes(w.id);
                  return (
                    <button key={w.id} onClick={() => got && talk.say(`「${w.w}」。${w.mean} たとえば、${w.ex}`, { speech: `${bw(w)}。${w.mean}。たとえば、${w.ex}` })} className={`rounded-3xl border-4 p-3 flex items-center gap-3 text-left ${got ? 'bg-white border-amber-300' : 'bg-slate-100 border-slate-300'}`}>
                      <div className="text-5xl">{got ? w.e : '❔'}</div>
                      <div className="flex-1">{got ? <><WordText w={w} size="text-3xl" center={false} /><div className="text-lg leading-snug">{w.mean}</div></> : <div className="text-2xl font-bold text-slate-400">？？？</div>}</div>
                    </button>
                  );
                })}
              </div>
            </>
          )}
          {tab === 'mon' && (
            <>
              <div className="win px-4 py-1 text-2xl font-bold">👾 {progress.monsters.length} / {D.MONSTERS.length}　つれて いく：{progress.party.length} / 2</div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full">
                {D.MONSTERS.map(m => {
                  const got = progress.monsters.includes(m.id), on = progress.party.includes(m.id);
                  return (
                    <div key={m.id} className={`rounded-3xl border-4 p-2 flex flex-col items-center ${got ? 'bg-white border-emerald-400' : 'bg-slate-100 border-slate-300'}`}>
                      <button onClick={() => got && talk.say(`${m.name}だよ。「${m.hello}」`)}><Monster m={m} size={100} got={got} /></button>
                      <div className="text-lg font-bold">{got ? m.name : '？？？'}{m.boss ? ' 👑' : ''}</div>
                      <div className="text-xs text-slate-500">{PLACE[m.p].name}</div>
                      {got && <button onClick={() => toggle(m.id)} className={`mt-1 rounded-xl border-2 px-3 py-1 font-bold ${on ? 'bg-emerald-100 border-emerald-500' : 'bg-white border-slate-300'}`}>{on ? '🤝 いっしょ' : 'つれて いく'}</button>}
                    </div>
                  );
                })}
              </div>
            </>
          )}
          {tab === 'title' && (
            <div className="flex flex-col gap-2 items-center">
              <div className="win px-4 py-2 text-2xl font-bold">レベル {levelOf(progress)}（ことば {progress.words.length}こ）</div>
              {D.TITLES.map(t => { const on = titlesOf(progress).includes(t.n); return <span key={t.n} className={`rounded-full px-4 py-2 border-2 text-xl font-bold ${on ? 'bg-amber-100 border-amber-400' : 'bg-white border-slate-200 text-slate-400'}`}>{on ? '🎖️' : '🔒'} {t.n}{t.all ? '（はってん ぜんぶ）' : t.c ? `（ばしょ ${t.c}こ）` : ''}</span>; })}
            </div>
          )}
        </div>
      );
    }

    // おみせ
    const TIER = { 20: ['ふつう', '#e5e7eb', '#64748b'], 60: ['ごうか', '#dbeafe', '#2563eb'], 120: ['ちょうごうか', '#fae8ff', '#a21caf'], 240: ['でんせつ', '#fef3c7', '#d97706'] };
    function ShopScreen({ progress, onBuy }) {
      const talk = useTalk();
      const [cat, setCat] = useState(D.ITEM_CATS[0].id);
      useEffect(() => { talk.say('いらっしゃい！ ゴールドで ぼうしや ふく、ぶき、たてが かえるよ。'); }, []);
      const c = D.ITEM_CATS.find(x => x.id === cat);
      return (
        <div className="w-full max-w-5xl p-3 flex flex-col items-center gap-3">
          <MsgWin size={90} compact />
          <div className="flex gap-2 flex-wrap justify-center">
            {D.ITEM_CATS.map(x => <button key={x.id} onClick={() => { Sound.tap(); setCat(x.id); }} className={`btn3d rounded-2xl border-2 px-4 py-2 text-xl font-bold ${cat === x.id ? 'bg-amber-100 border-amber-500' : 'bg-white border-slate-300'}`}>{x.icon} {x.name}</button>)}
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 w-full">
            {c.items.map(it => {
              const have = progress.items.includes(it.id), can = progress.gold >= it.p;
              const [tn, bg, col] = TIER[it.p];
              return (
                <div key={it.id} className="bg-white rounded-3xl border-4 p-2 flex flex-col items-center gap-1" style={{ borderColor: col }}>
                  <div className="text-xs font-bold rounded-full px-2" style={{ background: bg, color: col }}>{tn}</div>
                  <div className="h-16 flex items-center justify-center my-1">{it.color ? <span className={`inline-block w-14 h-14 rounded-full border-2 border-slate-700 ${it.color.niji ? 'niji' : ''}`} style={{ background: it.color.css }} /> : <span className="text-5xl">{it.e}</span>}</div>
                  <div className="text-lg font-bold text-center leading-tight">{it.n}</div>
                  {have ? <div className="text-lg font-bold text-emerald-700">✔ かった</div>
                    : <button onClick={() => { if (!can) { talk.say(`あと ${it.p - progress.gold} ゴールド あつめよう。`); return; } Sound.buy(); onBuy(it); talk.say(`${it.n}を かったよ。「そうび」で みに つけられるよ。`, { mood: 'happy' }); }}
                      className={`btn3d rounded-2xl border-2 px-3 py-1 text-xl font-bold flex items-center gap-1 ${can ? 'bg-amber-50 border-amber-400' : 'bg-slate-100 border-slate-300 opacity-60'}`}><Gold s={22} /> {it.p}</button>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 13. 先生用画面
    // =====================================================================
    function PinPad({ onSubmit, onClose, error }) {
      const [v, setV] = useState('');
      const press = (d) => { const n = (v + d).slice(0, 4); setV(n); if (n.length === 4) { onSubmit(n); setTimeout(() => setV(''), 300); } };
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
          <div className="bg-white rounded-3xl p-6 w-80 flex flex-col items-center gap-3">
            <div className="text-2xl font-bold">🔒 せんせい用</div>
            <div className="text-base">暗証番号（4けた）を入れてください</div>
            <div className="flex gap-2">{[0, 1, 2, 3].map(i => <div key={i} className="w-10 h-12 border-2 rounded-lg flex items-center justify-center text-2xl">{v[i] ? '●' : ''}</div>)}</div>
            {error > 0 && <div className="text-rose-600 font-bold">番号がちがいます</div>}
            <div className="grid grid-cols-3 gap-2">
              {['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((d, i) => d === '' ? <div key={i} /> :
                <button key={i} onClick={() => d === '⌫' ? setV(v.slice(0, -1)) : press(d)} className="btn3d w-16 h-14 rounded-xl bg-slate-100 border-2 border-slate-300 text-2xl font-bold">{d}</button>)}
            </div>
            <button onClick={onClose} className="text-lg underline mt-1">とじる</button>
          </div>
        </div>
      );
    }

    const pct = (a, b) => b ? `${Math.round((a / b) * 100)}%` : '－';
    const topOf = (m, n = 5) => Object.entries(m || {}).sort((a, b) => b[1] - a[1]).slice(0, n);
    const rateColor = (a, b) => !b ? '#fff' : a / b < 0.6 ? '#fecaca' : a / b < 0.8 ? '#fef08a' : '#bbf7d0';
    // にがてな ことば（2回いじょう といて、まちがえずに できた わりあいが 60%未満）
    const weakWords = (kotoba, n = 6) => {
      const per = {};
      Object.entries(kotoba || {}).forEach(([k, g]) => { const w = k.split('|')[0]; const a = per[w] || (per[w] = [0, 0]); a[0] += g[0]; a[1] += g[1]; });
      return Object.entries(per).filter(([, g]) => g[0] >= 2 && g[1] / g[0] < 0.6).sort((x, y) => x[1][1] / x[1][0] - y[1][1] / y[1][0]).slice(0, n).map(([w]) => w);
    };
    const TYPE_NOTE = {
      [MT.h]: 'はんたいの意味のことばを選んだ（例：ながい → みじかい）。意味の向きを取りちがえている',
      [MT.o]: '音がにていることばを選んだ（例：しらべる → くらべる）。音だけで選んでいる',
      [MT.n]: '同じなかまの、にていることばを選んだ（例：くだもの → やさい）。意味のちがいがあいまい',
      [MT.k]: 'ほかのことばを選んだ',
      [MT.u]: 'はってん：使い方がおかしい文を選んだ',
    };

    // ことばごとの ひょう（いみ・ことば・ぶん・つかいかた）
    function WordGrid({ kotoba, pid }) {
      return (
        <table className="text-center text-sm border-collapse w-full">
          <thead><tr><th className="p-1 text-left">ことば</th>{['①いみ', '②ことば', '③ぶん', 'はってん'].map(f => <th key={f} className="px-1">{f}</th>)}</tr></thead>
          <tbody>
            {placeWords(pid).map(w => (
              <tr key={w.id}>
                <td className="p-1 font-bold text-left">{w.e} {w.w}</td>
                {FORMS.map(f => {
                  const g = (kotoba || {})[`${w.w}|${f}`];
                  return (
                    <td key={f} className="border border-slate-200 leading-tight" style={{ background: g ? rateColor(g[1], g[0]) : '#fff' }} title={g ? `${g[0]}問、まちがえずに ${g[1]}、まちがい ${g[2]}回、ヒント ${g[3]}回` : ''}>
                      {g ? <><div className="font-bold">{g[1]}/{g[0]}</div><div className="text-[10px] text-slate-600">{g[2] ? `✖${g[2]}` : ''}{g[3] ? ` 💡${g[3]}` : ''}</div></> : <span className="text-slate-300">・</span>}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      );
    }
    function PlaceTabs({ pid, setPid }) {
      return <div className="flex gap-1 flex-wrap mb-2">{D.PLACES.map(pl => <button key={pl.id} onClick={() => setPid(pl.id)} className={`rounded-lg border px-2 py-0.5 text-sm font-bold ${pid === pl.id ? 'bg-blue-200 border-blue-600' : 'bg-white'}`}>{pl.icon} {pl.name}</button>)}</div>;
    }

    function TeacherView({ data, pin, onClose, onChanged, onSettings }) {
      const [tab, setTab] = useState('class');
      const [sel, setSel] = useState(data.students[0] ? data.students[0].name : null);
      const [pid, setPid] = useState(D.PLACES[0].id);
      const [s, setS] = useState({ ...DEFAULT_SETTINGS, ...data.settings });
      const [newPin, setNewPin] = useState('');
      const [msg, setMsg] = useState('');
      const [pending, setPending] = useState(api.pending());
      const student = data.students.find(x => x.name === sel);
      const prog = student ? parseProgress(student.progress) : null;
      const flash = (t) => { setMsg(t); setTimeout(() => setMsg(''), 3500); };
      const act = async (fn, okText) => {
        try { const r = await fn(); if (r && r.ok === false) flash('うまく いきませんでした'); else { flash(okText); onChanged(); } }
        catch (e) { flash('うまく いきませんでした：' + e.message); }
      };
      const saveSettings = async () => {
        if (newPin && !/^\d{4}$/.test(newPin)) { flash('暗証番号は4けたの数字にしてください'); return; }
        await act(() => api.saveSettings(pin, { ...s, newPin: newPin || '' }), '設定を保存しました');
        onSettings(s); setNewPin('');
      };
      const csv = async () => {
        const r = await api.logRows(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        const text = '﻿' + r.rows.map(row => row.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        downloadText(`ことばのぼうけん_きろく_${nowStr().slice(0, 10).replace(/\//g, '')}.csv`, text, 'text/csv');
        flash('CSVを書き出しました（ダウンロードフォルダ）');
      };
      const backup = async () => {
        const r = await api.backup(pin);
        if (!r || !r.ok) { flash('うまく いきませんでした'); return; }
        downloadText(`ことばのぼうけん_バックアップ_${nowStr().slice(0, 10).replace(/\//g, '')}.json`, JSON.stringify(r.data), 'application/json');
        flash('バックアップを保存しました（ダウンロードフォルダ）');
      };
      const restore = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          let d = null; try { d = JSON.parse(rd.result); } catch (err) {}
          if (!d || d.app !== 'kotoba') { flash('このアプリのバックアップではありません'); return; }
          if (!confirm('バックアップから、子どもの進み具合・ゴールド・ことば・なかまを元にもどします。よろしいですか？')) return;
          await act(() => api.restore(pin, d), 'バックアップから元にもどしました');
        };
        rd.readAsText(f);
      };
      const opt = (key, list) => list.map(([v, t]) =>
        <button key={String(v)} onClick={() => setS({ ...s, [key]: v })} className={`ml-2 mt-1 rounded-lg px-3 py-1 border-2 ${s[key] === v ? 'bg-blue-200 border-blue-600' : 'bg-white'}`}>{t}</button>);
      const flagBtn = (key, on, off, onMsg, offMsg) => <button key={key} onClick={() => act(() => api.setFlag(pin, student.name, key, !prog[key]), prog[key] ? offMsg : onMsg)} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">{prog[key] ? on : off}</button>;
      const curText = (p) => { const c = defaultChihou(p); const st = currentStage(p, c); return `${PLACE[st.p].name} ${stageLabel(st)} ${st.title}`; };

      return (
        <div className="fixed inset-0 bg-slate-50 z-50 overflow-auto">
          <div className="max-w-6xl mx-auto p-4 text-base">
            <div className="flex items-center gap-3 mb-3">
              <div className="text-2xl font-bold flex-1">🔒 先生用画面 <span className="text-sm text-slate-500">ver {APP_VERSION}{data.demo ? '（おためしモード）' : ''}</span></div>
              <button onClick={onClose} className="btn3d bg-white border-2 border-slate-400 rounded-xl px-4 py-2 font-bold">とじる</button>
            </div>
            {data.isDefaultPin && <div className="bg-rose-100 border-2 border-rose-400 rounded-xl p-2 mb-2">暗証番号が はじめの「1234」のままです。「せってい」で変えてください。</div>}
            {msg && <div className="fixed top-3 left-1/2 -translate-x-1/2 bg-blue-900 text-white rounded-xl px-4 py-2 z-50">{msg}</div>}
            <div className="flex gap-2 mb-3">
              {[['class', 'クラス全体'], ['child', '子どもごと'], ['settings', 'せってい'], ['data', 'データ']].map(([id, t]) => (
                <button key={id} onClick={() => setTab(id)} className={`rounded-xl px-4 py-2 font-bold border-2 ${tab === id ? 'bg-blue-200 border-blue-600' : 'bg-white border-slate-300'}`}>{t}</button>
              ))}
            </div>

            {tab === 'class' && (
              <div className="flex flex-col gap-4">
                <table className="w-full bg-white rounded-xl overflow-hidden text-left">
                  <thead className="bg-blue-100"><tr><th className="p-2">なまえ</th><th>いま</th><th>ばしょ</th><th>ことば</th><th>ゴールド</th><th>問題</th><th>まちがえずに</th><th>多い まちがい</th><th>にがてな ことば</th><th>さいご</th></tr></thead>
                  <tbody>
                    {data.students.map(st => {
                      const p = parseProgress(st.progress);
                      return (
                        <tr key={st.name} className="border-t cursor-pointer hover:bg-blue-50" onClick={() => { setSel(st.name); setTab('child'); }}>
                          <td className="p-2 font-bold">{st.name}<div className="text-xs text-slate-500">レベル {levelOf(p)}</div></td>
                          <td className="text-sm">{curText(p)}</td>
                          <td>{placesCleared(p)} / {D.PLACES.length}</td>
                          <td>{p.words.length} / {D.WORDS.length}</td>
                          <td>{p.gold}</td>
                          <td>{st.count}</td>
                          <td>{pct(st.ok, st.count)}</td>
                          <td className="text-sm">{topOf(st.types, 2).map(([k, n]) => `${k}（${n}）`).join('、') || '－'}</td>
                          <td className="font-bold text-rose-700 text-sm">{weakWords(st.kotoba, 4).join(' ') || '－'}</td>
                          <td>{st.last || '－'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <div className="text-sm text-slate-500">まちがえずに：まちがえず、ヒントも使わずに できた問題の割合。にがてな ことば：2回以上といて、まちがえずに できた割合が 60%未満のことば。</div>
                <div className="grid md:grid-cols-2 gap-3">
                  <div className="bg-white rounded-xl p-3 overflow-auto">
                    <div className="font-bold mb-2">クラス全体の ことばの表（まちがえずに／問題）</div>
                    <PlaceTabs pid={pid} setPid={setPid} />
                    <WordGrid kotoba={data.classKotoba} pid={pid} />
                    <div className="text-xs text-slate-500 mt-1">赤：60%未満　黄：60〜79%　緑：80%以上。✖：まちがえた回数　💡：ヒントを使った問題の数</div>
                  </div>
                  <div className="bg-white rounded-xl p-3">
                    <div className="font-bold mb-2">クラス全体の まちがいの しゅるい</div>
                    {topOf(data.classTypes, 10).map(([k, n]) => <div key={k} className="rounded-lg px-2 py-1 border bg-rose-50 mb-1"><b className="text-lg">{k}</b>　{n}回<div className="text-xs text-slate-600">{TYPE_NOTE[k] || ''}</div></div>)}
                    {!Object.keys(data.classTypes || {}).length && <span className="text-slate-500">まだ ありません</span>}
                  </div>
                </div>
              </div>
            )}

            {tab === 'child' && (
              <div className="flex flex-col gap-3">
                <div className="flex gap-2 flex-wrap">
                  {data.students.map(st => <button key={st.name} onClick={() => setSel(st.name)} className={`rounded-xl px-4 py-2 font-bold border-2 ${sel === st.name ? 'bg-blue-200 border-blue-600' : 'bg-white border-slate-300'}`}>{st.name}</button>)}
                </div>
                {student && prog && (
                  <div className="grid md:grid-cols-2 gap-3">
                    <div className="bg-white rounded-xl p-3">
                      <div className="font-bold text-xl mb-1">{student.name}　<span className="text-base">レベル {levelOf(prog)}　🎖️ {titleOf(prog)}</span></div>
                      <div>とりもどした ばしょ：{placesCleared(prog)} / {D.PLACES.length}　ことば：{prog.words.length} / {D.WORDS.length}　なかま：{prog.monsters.length} / {D.MONSTERS.length}</div>
                      <div>ゴールド：{prog.gold}（これまでに {prog.earned}）　かった もの：{prog.items.length}</div>
                      <div>問題：{student.count}　まちがえずに：{pct(student.ok, student.count)}　さいご：{student.last || '－'}</div>
                      <div className="text-sm text-slate-600">いま：{curText(prog)}</div>
                      <div className="mt-2 font-bold">ステージごとの結果</div>
                      <div className="max-h-72 overflow-auto">
                        <table className="w-full text-left text-sm">
                          <thead className="bg-slate-100 sticky top-0"><tr><th className="p-1">ステージ</th><th>クリア</th><th>問題</th><th>まちがえずに</th></tr></thead>
                          <tbody>
                            {STAGES.map(st => {
                              const g = student.stages[st.id] || [0, 0];
                              if (!g[0] && !prog.cleared[st.id]) return null;
                              return <tr key={st.id} className="border-t"><td className="p-1">{st.p ? PLACE[st.p].name + ' ' : ''}{stageLabel(st)} {st.title}</td><td>{prog.cleared[st.id] ? '⭐' : ''}</td><td>{g[0]}</td><td style={{ background: rateColor(g[1], g[0]) }}>{pct(g[1], g[0])}</td></tr>;
                            })}
                          </tbody>
                        </table>
                      </div>
                      <div className="mt-3 flex flex-wrap gap-2">
                        {flagBtn('unlockAll', '🔓 全部開く：オン', '🔒 全部開く：オフ', 'すべてのステージを開きました', 'ステージの開放をやめました')}
                        {flagBtn('hatten', '✨ はってん：開いている', '✨ はってん：閉じている', 'はってんを開きました（ボスに勝った場所で出ます）', 'はってんを閉じました')}
                        {D.CHIHOU.slice(1).map(c => flagBtn('open_' + c.id, `🗺️ ${c.g}年生の ちほう：開いている`, `🗺️ ${c.g}年生の ちほう：閉じている`, `${c.g}年生の「${c.name}」から始められるようにしました`, `${c.g}年生の ちほうを閉じました`))}
                      </div>
                      <div className="mt-2 flex flex-wrap gap-2 items-center">
                        <span className="font-bold">ゴールド：</span>
                        {[-10, -5, 5, 10, 50].map(dv => <button key={dv} onClick={() => act(() => api.addGold(pin, student.name, dv), `ゴールドを ${dv > 0 ? '+' : ''}${dv} しました`)} className="rounded-lg px-3 py-1 border-2 bg-white font-bold">{dv > 0 ? '+' : ''}{dv}</button>)}
                      </div>
                      <div className="mt-3">
                        <button onClick={() => { if (confirm(`${student.name} さんの記録・進み具合・ゴールド・ことば・なかまを、すべて消します。元にはもどせません。よろしいですか？`)) act(() => api.clear(pin, student.name), `${student.name} さんの記録を消しました`); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 この子の記録を消す</button>
                      </div>
                    </div>
                    <div className="bg-white rounded-xl p-3 flex flex-col gap-3">
                      <div className="overflow-auto">
                        <div className="font-bold mb-1">ことばの表（まちがえずに／問題）</div>
                        <PlaceTabs pid={pid} setPid={setPid} />
                        <WordGrid kotoba={student.kotoba} pid={pid} />
                        <div className="text-xs text-slate-500">赤：60%未満　黄：60〜79%　緑：80%以上。✖：まちがえた回数　💡：ヒントを使った問題の数</div>
                      </div>
                      <div><div className="font-bold mb-1">にがてな ことば</div>{weakWords(student.kotoba, 10).join('　') || <span className="text-slate-500">まだ ありません</span>}</div>
                      <div>
                        <div className="font-bold mb-1">まちがいの しゅるい</div>
                        {topOf(student.types, 10).map(([k, n]) => <div key={k} className="rounded-lg px-2 py-1 border bg-rose-50 mb-1"><b>{k}</b>　{n}回<div className="text-xs text-slate-600">{TYPE_NOTE[k] || ''}</div></div>)}
                        {!Object.keys(student.types || {}).length && <span className="text-slate-500">まだ ありません</span>}
                      </div>
                      <div>
                        <div className="font-bold mb-1">まちがえた問題（多い順）</div>
                        {topOf(student.missProb, 10).map(([k, n]) => <div key={k} className="text-sm border-b py-0.5">{k}　<b>{n}回</b></div>)}
                        {!Object.keys(student.missProb || {}).length && <span className="text-slate-500">まだ ありません</span>}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab === 'settings' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-3xl">
                <label className="flex items-center gap-3">よみあげの はやさ：<input type="range" min="0.5" max="1.2" step="0.05" value={s.rate} onChange={e => setS({ ...s, rate: Number(e.target.value) })} /> {s.rate}倍
                  <button className="border rounded px-2" onClick={() => { Speech.rate = s.rate; Speech.say('くだもの。りんごや みかん、ぶどうなど。'); }}>ためす</button></label>
                <div>もじの おおきさ：{opt('font', [[0.9, 'ちいさめ'], [1, 'ふつう'], [1.15, 'おおきめ'], [1.3, 'とても おおきい']])}</div>
                <div>1回の 問題の数：{opt('count', [[3, '3問'], [5, '5問'], [10, '10問']])}<div className="text-sm text-slate-500 ml-2">①②③は、1くみ（5語）の中から出します（10問のときも5問）。ボス・やどや・はってんは、この数だけ出します。</div></div>
                <div>かんじの ひょうじ：{opt('kanji', [[true, 'だす'], [false, 'かくす']])}<div className="text-sm text-slate-500 ml-2">漢字で書くことばの横に、ふりがな付きの漢字を出します。</div></div>
                <div>こうかおん：{opt('sound', [[true, 'ならす'], [false, 'ならさない']])}</div>
                <div>おんがく（BGM）：{opt('bgm', [[true, 'つかう'], [false, 'つかわない']])}<div className="text-sm text-slate-500 ml-2">つかう にすると、子どもの画面の上に 🎵 ボタンが出て、オン・オフできます（はじめは オン）。</div></div>
                <label>暗証番号を変える（4けた）：<input value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 4))} className="border-2 rounded px-2 py-1 w-24 ml-2" inputMode="numeric" placeholder="----" /></label>
                <div><button onClick={saveSettings} className="btn3d rounded-xl px-6 py-2 border-2 border-emerald-500 bg-emerald-100 font-bold text-xl">保存する</button>
                  <span className="text-sm text-slate-500 ml-2">（全員の画面に反映されます。子どもの画面は開き直すと変わります）</span></div>
              </div>
            )}

            {tab === 'data' && (
              <div className="bg-white rounded-xl p-4 flex flex-col gap-3 max-w-2xl">
                <div>この端末に たまっている、まだ送れていない記録：<b>{pending}</b> 件
                  <button onClick={async () => { await api.flush(); setPending(api.pending()); flash(api.pending() ? 'まだ送れていません。ネットのつながりを確かめてください' : '送りました'); onChanged(); }} className="ml-2 rounded-xl px-3 py-1 border-2 bg-white font-bold">📤 スプレッドシートへ送る</button></div>
                <div><button onClick={csv} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">📄 記録をCSVで書き出す</button>
                  <div className="text-sm text-slate-500">ダウンロードできないときは、スプレッドシートの「きろく」シートを開き、ファイル → ダウンロード → CSV を選んでください。</div></div>
                <div className="flex gap-2 flex-wrap items-center">
                  <button onClick={backup} className="rounded-xl px-3 py-2 border-2 bg-white font-bold">💾 バックアップを保存</button>
                  <label className="rounded-xl px-3 py-2 border-2 bg-white font-bold cursor-pointer">📂 バックアップから元にもどす<input type="file" accept=".json" className="hidden" onChange={restore} /></label>
                </div>
                <div><button onClick={() => { if (confirm('全員の記録・進み具合・ゴールド・ことば・なかまを、すべて消します。元にはもどせません。よろしいですか？') && confirm('ほんとうに全員の記録を消しますか？')) act(() => api.clear(pin, ''), '全員の記録を消しました'); }} className="rounded-xl px-3 py-2 border-2 border-rose-400 bg-rose-50 font-bold">🗑 全員の記録を消す</button></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // 14. アプリ ぜんたい
    // =====================================================================
    function App() {
      const [boot, setBoot] = useState(null);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [name, setName] = useState(null);
      const [progress, setProgress] = useState(newProgress());
      const [view, setView] = useState({ v: 'login' });
      const [chihou, setChihou] = useState(null);
      const [stageSel, setStageSel] = useState(null);
      const [pin, setPin] = useState(null);
      const [pinOpen, setPinOpen] = useState(false);
      const [pinError, setPinError] = useState(0);
      const [teacher, setTeacher] = useState(null);
      const [talk, setTalk] = useState({ text: '', mood: 'normal', talking: false, k: 0 });
      const [coinFx, setCoinFx] = useState(0);
      const [soundOn, setSoundOn] = useState(true);
      const [bgmOn, setBgmOn] = useState(true);
      const [busy, setBusy] = useState(false);
      const lastSay = useRef(null);
      const sayId = useRef(0);
      const records = useRef([]);
      const progRef = useRef(progress);
      progRef.current = progress;

      const talkApi = useMemo(() => {
        const run = (text, opts = {}) => new Promise(resolve => {
          const id = ++sayId.current;
          lastSay.current = { text, opts };
          setTalk({ text, mood: opts.mood || 'normal', talking: true, k: id });
          Speech.say(fmtSpeech(opts.speech || text), () => { if (sayId.current === id) setTalk(p => ({ ...p, talking: false })); resolve(); });
        });
        return { say: run, repeat: () => lastSay.current && run(lastSay.current.text, lastSay.current.opts), stop: () => Speech.stop() };
      }, []);
      const talkCtx = { ...talkApi, ...talk };

      const applySettings = (s) => {
        const v = { ...DEFAULT_SETTINGS, ...s };
        ['sound', 'kanji'].forEach(k => { v[k] = v[k] !== false && v[k] !== 'false'; });
        v.bgm = v.bgm === true || v.bgm === 'true';
        v.count = [3, 5, 10].includes(Number(v.count)) ? Number(v.count) : 5;
        setSettings(v);
        Speech.rate = Number(v.rate) || 0.8; Speech.pitch = Number(v.pitch) || 1.05;
        Sound.on = v.sound; setSoundOn(Sound.on);
        if (!v.bgm) Bgm.stop();
        document.documentElement.style.fontSize = `${16 * (Number(v.font) || 1)}px`;
      };

      useEffect(() => {
        api.init().then(d => { applySettings(d.settings || {}); setBoot(d); api.flush(); })
          .catch(e => setBoot({ error: String(e && e.message || e) }));
        const on = () => api.flush();
        window.addEventListener('online', on);
        return () => window.removeEventListener('online', on);
      }, []);
      useEffect(() => { if (name && settings.bgm && bgmOn) Bgm.start(); else Bgm.stop(); }, [name, settings.bgm, bgmOn]);

      // しんちょくを ほぞんする（この たんまつ ＋ スプレッドシート）
      const persist = (p) => {
        p = { ...p, t: Date.now() };
        progRef.current = p;
        setProgress(p);
        const json = JSON.stringify(p);
        safeStore.set(COPY_KEY(name), json);
        const recs = records.current; records.current = [];
        api.save({ name, progress: json, records: recs, stamp: nowStr(), time: Date.now() });
        return p;
      };
      const updateProg = (fn) => { progRef.current = fn(progRef.current); setProgress(progRef.current); return progRef.current; };
      // にがてな ことばの かず（まちがえると ふえ、まちがえずに できると へる）
      const mergeWeak = (weak, delta) => {
        const w = { ...(weak || {}) };
        Object.entries(delta || {}).forEach(([k, d]) => { const v = Math.max(0, Math.min(9, (w[k] || 0) + d)); if (v) w[k] = v; else delete w[k]; });
        return w;
      };
      const before = useRef(null);

      const login = async (n) => {
        Sound.get(); Speech.say('');
        setBusy(true);
        let server = '';
        try { server = await api.student(n); } catch (e) {}
        const a = parseProgress(server), b = parseProgress(safeStore.get(COPY_KEY(n)));
        // あたらしい ほうを つかう。先生が変えた フラグは スプレッドシートの ほうを つかう
        let p = b.t > a.t ? b : a;
        if ((a.flagT || 0) > (p.flagT || 0)) { p = { ...p, flagT: a.flagT }; FLAGS.forEach(k => { p[k] = !!a[k]; }); }
        progRef.current = p;
        setProgress(p); setName(n); setBusy(false); setChihou(defaultChihou(p));
        setView({ v: p.look ? 'map' : 'first' });
      };
      const logout = () => { talkApi.stop(); Bgm.stop(); setName(null); setView({ v: 'login' }); };

      const startStage = (st, part) => {
        setStageSel(null);
        records.current = [];
        const p = progRef.current;
        before.current = { titles: titlesOf(p), level: levelOf(p), chihou: D.CHIHOU.filter(c => chihouOpen(p, c)).map(c => c.id) };
        const n = part ? part.left : Number(settings.count) || 5;
        setView({ v: 'practice', st, n, start: part && part.start ? part.start : 0, intro: part ? 'つづきから はじめよう。' : null, key: uid() });
      };
      const onRecord = (r) => { records.current.push({ ...r, id: uid() }); };
      const onCoin = () => { setCoinFx(x => x + 1); Sound.coin(); updateProg(p => ({ ...p, gold: p.gold + 1, earned: p.earned + 1 })); };
      const pendingWeak = useRef({});
      const onSave = (part, weak) => { pendingWeak.current = weak; persist({ ...progRef.current, part }); };

      const finish = (st, result) => {
        let p = { ...progRef.current, part: null, weak: mergeWeak(progRef.current.weak, result.weak) };
        pendingWeak.current = {};
        let bonus = 0, newWords = [], newMonster = null, placeClear = false;
        if (!p.cleared[st.id]) {
          p.cleared = { ...p.cleared, [st.id]: 1 };
          if (!st.review) bonus += 5;
          if (st.kind === 'bun' && st.g) { newWords = groupWords(st.p, st.g).map(w => w.id).filter(id => !p.words.includes(id)); p.words = [...p.words, ...newWords]; }
          if (st.boss) placeClear = true;
        }
        if (result.monster && !p.monsters.includes(result.monster)) {
          newMonster = result.monster; p.monsters = [...p.monsters, newMonster];
          bonus += MON[newMonster].boss ? 20 : 10;
          if (p.party.length < 2) p.party = [...p.party, newMonster];
        }
        p.gold += bonus; p.earned += bonus;
        p = persist(p);
        const b = before.current || { titles: [], level: 1, chihou: [] };
        const newTitle = titlesOf(p).filter(t => !b.titles.includes(t)).pop() || null;
        const level = levelOf(p), levelUp = level > b.level;
        const nc = D.CHIHOU.find(c => chihouOpen(p, c) && !b.chihou.includes(c.id));
        let next = null;
        if (st.p && !st.hatten) {
          const ch = chainOf(chihouOf(st.p)), i = ch.findIndex(s => s.id === st.id);
          if (ch[i + 1] && stageOpen(p, ch[i + 1])) next = () => startStage(ch[i + 1]);
          else if (nc) next = () => { setChihou(nc); setView({ v: 'map' }); };
        }
        setView({ v: 'result', st, result: { ...result, bonus, newWords, newMonster, placeClear, level, levelUp, newTitle, newChihou: nc ? nc.name : null }, next });
      };
      const quit = () => { talkApi.stop(); persist({ ...progRef.current, weak: mergeWeak(progRef.current.weak, pendingWeak.current) }); pendingWeak.current = {}; setView({ v: 'map' }); };
      const buy = (it) => {
        const p = progRef.current;
        if (p.gold < it.p || p.items.includes(it.id)) return;
        persist({ ...p, gold: p.gold - it.p, items: [...p.items, it.id] });
      };
      const cont = () => {
        const p = progRef.current;
        const part = p.part && STAGE[p.part.st];
        if (part && stageOpen(p, part)) { startStage(part, p.part); return; }
        startStage(currentStage(p, chihou || defaultChihou(p)));
      };

      const openTeacher = () => { setPinError(0); setPinOpen(true); };
      const submitPin = async (v) => {
        try {
          await api.flush();
          const d = await api.teacher(v);
          if (!d || !d.ok) { setPinError(e => e + 1); return; }
          setPin(v); setTeacher(d); setPinOpen(false);
        } catch (e) { setPinError(e => e + 1); }
      };
      const reloadTeacher = async () => {
        await api.flush();
        const d = await api.teacher(pin);
        if (d && d.ok) {
          setTeacher(d);
          if (name) {
            const me = d.students.find(x => x.name === name);
            if (me) {
              const sp = parseProgress(me.progress);
              const p = { ...progRef.current, flagT: sp.flagT, gold: sp.gold || 0, t: sp.t || Date.now() };
              FLAGS.forEach(k => { p[k] = !!sp[k]; });
              const fresh = !me.progress ? { ...newProgress(), welcome: 1, look: progRef.current.look } : p;
              progRef.current = fresh; setProgress(fresh); safeStore.set(COPY_KEY(name), JSON.stringify(fresh));
            }
          }
        }
      };

      if (!boot) return <div className="p-16 text-center text-3xl font-bold text-blue-900">じゅんび ちゅう…</div>;
      if (boot.error) return <div className="p-10 text-2xl">ひらけませんでした。ページを よみこみなおして ください。<div className="text-base text-slate-500 mt-2">{boot.error}</div></div>;

      const bar = (home = true) => (
        <TopBar name={name} progress={progress} bump={coinFx} onHome={home ? () => { talkApi.stop(); if (view.v === 'practice') quit(); else setView({ v: 'map' }); } : null}
          onLogout={logout} onTeacher={openTeacher} soundOn={soundOn} onSound={() => { Sound.on = !Sound.on; setSoundOn(Sound.on); }}
          bgmAllowed={settings.bgm} bgmOn={bgmOn} onBgm={() => setBgmOn(x => !x)} />
      );
      const page = (inner, cls = 'field') => <div className={`min-h-screen flex flex-col items-center ${cls}`}>{bar()}{inner}</div>;

      let body = null;
      const c = chihou || defaultChihou(progress);
      if (!name || view.v === 'login') {
        body = <LoginScreen students={boot.students || []} onSelect={login} onTeacher={openTeacher} demo={boot.demo} />;
      } else if (view.v === 'first') {
        body = <div className="min-h-screen flex flex-col items-center sky">{bar(false)}<EquipScreen progress={progress} first onSave={(lk) => { persist({ ...progRef.current, look: lk }); setView({ v: 'map' }); }} /></div>;
      } else if (view.v === 'map') {
        body = <div className="min-h-screen flex flex-col">{bar(false)}
          <MapScreen name={name} progress={progress} chihou={c} setChihou={(x) => { Sound.tap(); setChihou(x); }} onPlace={(pl) => { Sound.tap(); setView({ v: 'place', pl }); }} onContinue={cont}
            onShop={() => setView({ v: 'shop' })} onEquip={() => setView({ v: 'equip' })} onInn={() => { Sound.tap(); setStageSel(STAGE.R); }} onChurch={() => setView({ v: 'church' })}
            onWelcome={() => persist({ ...progRef.current, welcome: 1 })} />
          {stageSel && <StageModal key={stageSel.id} st={stageSel} progress={progress} onClose={() => setStageSel(null)} onStart={() => startStage(stageSel)} onResume={() => startStage(stageSel, progress.part)} />}</div>;
      } else if (view.v === 'place') {
        body = page(<><PlaceScreen key={view.pl.id} pl={view.pl} progress={progress} onStage={(st) => { Sound.tap(); setStageSel(st); }} />
          {stageSel && <StageModal key={stageSel.id} st={stageSel} progress={progress} onClose={() => setStageSel(null)} onStart={() => startStage(stageSel)} onResume={() => startStage(stageSel, progress.part)} />}</>);
      } else if (view.v === 'practice') {
        body = <div className="min-h-screen flex flex-col items-center relative bg-sky-50">{bar()}<CoinFly show={coinFx} />
          <div className="w-full flex justify-center p-2"><Practice key={view.key} st={view.st} n={view.n} start={view.start} intro={view.intro} settings={settings} progress={progress}
            onRecord={onRecord} onCoin={onCoin} onSave={onSave} onFinish={(r) => finish(view.st, r)} onQuit={quit} /></div></div>;
      } else if (view.v === 'result') {
        body = page(<ResultScreen view={view} progress={progress} onAgain={() => startStage(view.st)} onNext={view.next} onHome={() => setView({ v: 'map' })} />, 'sky');
      } else if (view.v === 'shop') {
        body = page(<ShopScreen progress={progress} onBuy={buy} />);
      } else if (view.v === 'equip') {
        body = page(<EquipScreen progress={progress} onSave={(lk) => persist({ ...progRef.current, look: lk })} />);
      } else if (view.v === 'church') {
        body = page(<ChurchScreen progress={progress} onParty={(party) => persist({ ...progRef.current, party })} />);
      }

      return (
        <SetCtx.Provider value={settings}>
          <TalkCtx.Provider value={talkCtx}>
            {body}
            {busy && <div className="fixed inset-0 bg-white/60 z-40 flex items-center justify-center text-3xl font-bold">よみこみ ちゅう…</div>}
            {pinOpen && <PinPad onSubmit={submitPin} onClose={() => setPinOpen(false)} error={pinError} />}
            {teacher && <TeacherView data={teacher} pin={pin} onClose={() => setTeacher(null)} onChanged={reloadTeacher} onSettings={applySettings} />}
          </TalkCtx.Provider>
        </SetCtx.Provider>
      );
    }

    window.KOTOBA_READY.then(() => {
      D = window.KOTOBA_DATA;
      STAGES = buildStages();
      STAGES.forEach(s => { STAGE[s.id] = s; });
      D.PLACES.forEach(p => { PLACE[p.id] = p; });
      D.WORDS.forEach(w => { WORD[w.id] = w; WORD_BY[w.w] = w; });
      D.MONSTERS.forEach(m => { MON[m.id] = m; });
      D.ITEM_CATS.forEach(c => c.items.forEach(it => { it.cat = c.id; }));
      ALL_ITEMS = D.ITEM_CATS.flatMap(c => c.items);
      ALL_ITEMS.forEach(it => { ITEM[it.id] = it; });
      [...D.COLORS, ...ALL_ITEMS.filter(it => it.color).map(it => it.color)].forEach(c => { COLOR[c.id] = c; });
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }).catch(e => {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-size:24px;line-height:1.8">ことばの データを よみこめませんでした。<br>ネットに つながって いるか たしかめて、ページを よみこみなおして ください。<div style="font-size:14px;color:#888">' + e.message + '</div></div>';
    });
  </script>
</body>
</html>
